# Oracle-fixture closure ledger.
#
# Oracle generation is an external operation. Temporary harnesses are deleted
# after generation; this repository retains only frozen artifacts, provenance,
# conformance tests, and gate wiring.

schema_version = 1
target_rows = 60

[case_profiles.numeric]
required = [
  "closed_form",
  "ordinary_grid",
  "boundary_or_error",
  "permutation_or_rescaling",
  "ill_conditioned_when_relevant",
]

[case_profiles.graph]
required = [
  "positive_motif",
  "negative_motif",
  "node_permutations",
  "bounded_exhaustive_pack",
  "invalid_or_unsupported",
]

[case_profiles.statistical]
required = [
  "fixed_seed_parity",
  "null_calibration",
  "power_bias_or_coverage",
  "boundary_sample_size",
  "monte_carlo_error",
]

[case_profiles.mcmc]
required = [
  "exact_small_target",
  "multiple_seeds",
  "support_and_relabeling",
  "convergence",
  "failed_convergence",
]

[case_profiles.semantic]
required = [
  "canonical_positive",
  "canonical_negative",
  "defining_invariants",
  "boundary_contract",
  "permutation_or_symmetry",
]

