# Estimate / identify / refute capability inventory.
# Status values: pending | in_progress | done
# Baseline pin: parity/baselines/dowhy.toml (oracle reference only)

[[capabilities]]
id = "estimate.model.construction"
group = "model_and_graph_workflow"
description = "Causal model construction from data and graph"
status = "done"
evidence_kind = "implementation_exists"
owner = "estimate"
evidence_test = "crates/antecedent/tests/prepared_analysis.rs"
evidence_assertion = "prepared_reestimate_matches_fresh_analyze"
notes = "CausalAnalysis builder + data/graph/query; Python analyze_ate / analyze"

[[capabilities]]
id = "estimate.model.treatment_outcome"
group = "model_and_graph_workflow"
description = "Explicit treatment/outcome/effect modifiers"
status = "done"
evidence_kind = "implementation_exists"
owner = "estimate"
evidence_test = "crates/antecedent/tests/facade_gaps.rs"
evidence_assertion = "conditional_effect_via_causal_analysis"
limitations = "Effect-modifier declaration is evidenced through a conditional-effect query with a known average conditional effect; plain treatment/outcome roles are exercised by the estimate conformance tests."
notes = "AverageEffectQuery + RoleHint + effect_modifiers in antecedent-core"

[[capabilities]]
id = "estimate.model.parsing"
group = "model_and_graph_workflow"
description = "Graph parsing and validation"
status = "done"
evidence_kind = "internal_known_truth"
known_truth_fixture = "conformance/interchange/graph_dot_json"
owner = "release"
evidence_test = "crates/antecedent/tests/graph_interchange.rs"
evidence_assertion = "conformance_dot_json_round_trip"
notes = "DOT+JSON+GML+NetworkX via antecedent-io; programmatic DAG + CBOR"

[[capabilities]]
id = "estimate.model.assumptions"
group = "model_and_graph_workflow"
description = "Inspectable assumptions"
status = "done"
evidence_kind = "implementation_exists"
owner = "estimate"
evidence_test = "crates/antecedent/tests/estimate_linear_gaussian_ate.rs"
evidence_assertion = "estimate_linear_gaussian_ate_stable_float"
limitations = "The evidence test asserts the assumption list and trace are non-empty; it does not pin the content of individual assumptions."
notes = "typed Assumption* on identify + wire/provenance; Python exposes counts"

[[capabilities]]
id = "estimate.model.workflow"
group = "model_and_graph_workflow"
description = "Model, identify, estimate, refute workflow"
status = "done"
evidence_kind = "implementation_exists"
owner = "estimate"
evidence_test = "crates/antecedent/tests/v110_contract.rs"
evidence_assertion = "dag_average_effect_vertical_path_is_independently_accepted"
notes = "1.10 composition: inspect_does_not_identify and dag_average_effect_vertical_path_* in crates/antecedent/tests/v110_contract.rs. Compiler inspect/capability rows live in parity/compiler.toml and do not inherit estimator known-truth."

[[capabilities]]
id = "estimate.identify.adjustment_sets"
group = "identification"
description = "Adjustment sets"
status = "done"
evidence_kind = "internal_known_truth"
known_truth_fixture = "conformance/identify/efficient_adjustment"
owner = "estimate"
evidence_test = "crates/antecedent-identify/src/efficient.rs"
evidence_assertion = "o_set_selects_confounder"
notes = "backdoor + efficient adjustment search; same as identify.backdoor / efficient_backdoor"

[[capabilities]]
id = "estimate.identify.automatic"
group = "identification"
description = "Automatic identification"
status = "done"
evidence_kind = "internal_known_truth"
known_truth_fixture = "conformance/identify/auto_envelopes"
owner = "estimate"
evidence_test = "crates/antecedent-identify/src/auto.rs"
evidence_assertion = "auto_finds_backdoor_on_chain"

[[capabilities]]
id = "estimate.identify.backdoor"
group = "identification"
description = "Backdoor"
status = "done"
evidence_kind = "frozen_external_oracle"
oracle_components = ["identifier:backdoor.adjustment", "identifier:general.id"]
external_oracle = "dowhy 0.14"
known_truth_fixture = "conformance/identify/general_id_backdoor_chain"
limitations = "BackdoorIdentifier consumes the frozen Z -> T, Z -> Y, T -> Y oracle: identified status, backdoor estimand family, and the fixture graph_dot. Symbolic-expression formatting is not compared."
owner = "estimate"
evidence_test = "crates/antecedent-identify/src/backdoor.rs"
evidence_assertion = "confounding_requires_z"
python_facade = "full"
notes = "Python antecedent.identify + analyze(AverageEffect, identifier=Identifier.BACKDOOR_ADJUSTMENT)"

[[capabilities]]
id = "estimate.identify.efficient_backdoor"
group = "identification"
description = "Efficient backdoor"
status = "done"
evidence_kind = "internal_known_truth"
known_truth_fixture = "conformance/estimate/efficient_backdoor"
limitations = "The consuming test asserts against the fixture's synthetic true_effect; the recorded DoWhy reference value is loaded but never compared."
owner = "estimate"
evidence_test = "crates/antecedent/tests/estimate_conformance.rs"
evidence_assertion = "estimate_efficient_backdoor_ipw_recovers_ate"

[[capabilities]]
id = "estimate.identify.general_id"
group = "identification"
description = "General ID"
status = "done"
evidence_kind = "frozen_external_oracle"
oracle_components = ["identifier:general.id"]
external_oracle = "dowhy 0.14"
known_truth_fixture = "conformance/identify/general_id_frontdoor"
limitations = "Frozen external status/estimand-family/graph_dot comparisons cover backdoor, front-door, and bow-arc hedge graphs; clean-room conformance/identify/id_hedge separately pins the hedge certificate. Completeness of ID (identified-and-numerically-correct, or a definition-checked hedge, never an error) is evidenced by conformance/identify/id_completeness and the exhaustive <=4-node / sampled 5-6 node enumeration in crates/antecedent-identify/tests/id_completeness.rs, for binary variables; it is not proved for the implementation. Napkin-type functionals keep a free variable outside the query; functional.effect and functional.distribution average the functional over that variable's empirical law on the values where every required cell is observed (never summing over it) and say so in the estimate.functional.free_variables_averaged diagnostic, pinned on the exact napkin table in crates/antecedent/tests/pag_admg_numeric_pins.rs. Symbolic-expression prose is not compared byte-for-byte. The named test covers the front-door case; the backdoor and bow-arc hedge cases are asserted by backdoor_chain_identified and hedge_not_identified in the same module."
owner = "identify"
evidence_test = "crates/antecedent-identify/src/id.rs"
evidence_assertion = "frontdoor_admg_identified"
notes = "Shpitser ID/IDC + hedges + AutoIdentifier; Distribution via ID/IDC + functional.distribution; PathSpecific via path_specific.natural + functional.effect; python_facade=full for PathSpecific/Interventional with discovery= (MAP for graph posteriors; incomplete CPDAG/PAG fail closed); the front-door FunctionalEffect number on the frozen ADMG law is pinned by conformance/estimate/admg_frontdoor_functional (1.1)"

[[capabilities]]
id = "estimate.identify.estimand"
group = "identification"
description = "Identified-estimand representation"
status = "done"
evidence_kind = "implementation_exists"
owner = "estimate"
evidence_test = "crates/antecedent/tests/v110_contract.rs"
evidence_assertion = "admg_frontdoor_contract_records_functional_identification"
limitations = "The evidence test asserts the identification status, identified mass and identification product of a front-door estimand; backdoor estimand fields are asserted in the identify tests."
python_facade = "full"
notes = "Rust IdentifiedEstimand + CausalAnalysis::identify_only; Python antecedent.identify → Identification (.to_identify_result() for the legacy IdentifyResult shape; antecedent.estimation.identify still returns IdentifyResult directly)"

