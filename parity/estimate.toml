[[capabilities]]
id = "estimate.propensity"
group = "estimation"
description = "Propensity base, matching, stratification, weighting"
status = "done"
evidence_kind = "internal_known_truth"
known_truth_fixture = "conformance/estimate/propensity_ipw"
limitations = "assert_recovers checks the synthetic true_effect. The recorded DoWhy reference SE is not compared: at 0.273 (n=800) it is about five times the Monte Carlo sampling SD of any IPW estimator on the stated SCM, so it cannot calibrate this estimator; see SE_NOT_COMPARABLE in crates/antecedent/tests/estimate_conformance.rs. Propensity matching reports a simplified matched-effect variance and donor-reuse SE, not the Abadie-Imbens conditional-residual variance estimator, and enables an ordinary row bootstrap by default although that bootstrap is inconsistent for fixed-match nearest-neighbour estimators (provenance/estimate.propensity_matching.toml). The only matching coverage record is ATT on a constant-effect law, so the ATE path and its SE are unmeasured. The evidence test covers propensity weighting; matching and stratification are covered by estimate_propensity_matching_recovers_att and estimate_propensity_stratification_recovers_ate in the same file."
owner = "estimate"
evidence_test = "crates/antecedent/tests/estimate_conformance.rs"
evidence_assertion = "estimate_propensity_ipw_recovers_ate"
calibration = ["cov.average_effect.dag.frequentist.analytic_se.l95.ipw_hajek_analytic_ci_coverage", "cov.average_effect.dag.frequentist.analytic_se.l95.ipw_hajek_analytic_conformance_scm_ci_coverage", "cov.average_effect.dag.frequentist.analytic_se.l95.ipw_hajek_weak_overlap_adversarial_ci_coverage", "cov.average_effect.dag.frequentist.analytic_se.l95.matching_heterogeneous_atc_ci_coverage", "cov.average_effect.dag.frequentist.analytic_se.l95.matching_heterogeneous_ate_ci_coverage", "cov.average_effect.dag.frequentist.analytic_se.l95.matching_heterogeneous_att_ci_coverage", "cov.average_effect.dag.frequentist.analytic_se.l95.matching_heteroskedastic_adversarial_ci_coverage", "cov.average_effect.dag.frequentist.analytic_se.l95.matching_homoskedastic_ci_coverage", "cov.average_effect.dag.frequentist.bootstrap_se.l95.ipw_hajek_bootstrap_ci_coverage"]

