# End-to-end control definitions for the 3.0 workload suite.
# Predecessor tag: v2.4.1. Timings are not recorded in this file.
# status = "defined" means the command exists and has not been measured.
# status = "missing_entry_point" means no command times that family with its uncertainty.

schema = 1
predecessor_tag = "v2.4.1"
measured = false

[[control]]
id = "adjustment"
family = "adjustment"
status = "defined"
command = "python examples/python/propensity_weighting.py"
timed_work = "analyze() requests 30 bootstrap replicates for the propensity-weighted average effect and returns overlap diagnostics (ESS and minimum propensity). The script prints calibration status and those overlap fields. Row synthesis sits outside that call."
data = "examples/python/propensity_weighting.py"
seed = "data=7 execution=11"
uncertainty = "30 bootstrap replicates for the propensity-weighted effect"
diagnostics = "overlap ESS and minimum propensity"
resource_scope = "section: the process peak resident set (getrusage, which counts native allocations) is read immediately before and after the timed section, and the operating system reports the process peak, CPU time and faults for the whole run"
predecessor = "v2.4.1"
source = "examples/python/propensity_weighting.py"

[[control]]
id = "glm"
family = "GLM"
status = "defined"
command = "cargo bench -p antecedent-prob --bench laplace_glm"
timed_work = "The Criterion loop calls fit_laplace_glm on a Gaussian-identity design. That fit is MAP optimization plus 256 Laplace posterior draws. The workspace-reuse assertion runs after the loop."
data = "crates/antecedent-prob/benches/laplace_glm.rs"
seed = "1"
uncertainty = "256 Laplace posterior draws"
diagnostics = "MAP convergence and workspace-reuse assertion"
resource_scope = "process: the operating system reports the peak resident set, CPU time and faults of the bench process, and Criterion reports the mean of each timed leg"
predecessor = "v2.4.1"
source = "benches/baselines/laplace_glm.md"

[[control]]
id = "aipw"
family = "AIPW"
status = "defined"
command = "python examples/python/ihdp_propensity_e2e.py"
timed_work = "The AIPW analyze() call requests 40 bootstrap replicates and returns a bootstrap or analytic standard error; the script turns that error into a Wald interval. The same process also runs IPW with the cheap refutation suite and overlap diagnostics. AIPW refutation is off."
data = "examples/python/ihdp_propensity_e2e.py"
seed = "data=42 execution=11"
uncertainty = "40 bootstrap replicates and the Wald interval"
diagnostics = "IPW cheap refutation suite and overlap diagnostics"
resource_scope = "section: the process peak resident set (getrusage, which counts native allocations) is read immediately before and after the timed section, and the operating system reports the process peak, CPU time and faults for the whole run"
predecessor = "v2.4.1"
source = "examples/python/ihdp_propensity_e2e.py"

[[control]]
id = "prepared_query_families"
family = "prepared query families"
status = "defined"
command = "python parity/performance_lanes/entry_points/prepared_query_families.py --role control"
candidate_command = "python parity/performance_lanes/entry_points/prepared_query_families.py --role candidate"
timed_work = "PreparedBatch.prepare over three average-effect queries, one estimate with analytic standard errors, then eight retargets of a three-claim family with a contrast. Each retarget returns the joint score covariance, the contrast standard error and the max-t simultaneous interval (20000 draws). Row synthesis sits outside the call."
data = "parity/performance_lanes/entry_points/prepared_query_families.py"
seed = "data=11 execution=11 retarget=3"
uncertainty = "analytic standard errors, contrast standard error and the 20000-draw max-t simultaneous interval of eight retargeted families"
diagnostics = "snapshot check, family completeness and per-claim status"
resource_scope = "section: the process peak resident set (getrusage, which counts native allocations) is read immediately before and after the timed section, and the operating system reports the process peak, CPU time and faults for the whole run"
predecessor = "v2.4.1"
source = "parity/performance_lanes/entry_points/prepared_query_families.py"

[[control]]
id = "bootstrap"
family = "bootstrap"
status = "defined"
command = "cargo bench -p antecedent-estimate --bench propensity_bootstrap"
timed_work = "The Criterion loop calls PropensityWeighting::fit with 50 replicates. Each iteration refits the logistic propensity, exposes the bootstrap standard error, and asserts propensity-workspace reuse."
data = "crates/antecedent-estimate/benches/propensity_bootstrap.rs"
seed = "11"
uncertainty = "50 bootstrap replicates"
diagnostics = "propensity-workspace reuse assertion"
resource_scope = "process: the operating system reports the peak resident set, CPU time and faults of the bench process, and Criterion reports the mean of each timed leg"
predecessor = "v2.4.1"
source = "benches/baselines/propensity.md"

[[control]]
id = "gaussian_bayes"
family = "Gaussian Bayes"
status = "defined"
command = "USER_PATH_N=10000 cargo bench -p antecedent --bench user_path -- user_path_dag_ate_bayesian_laplace"
timed_work = "The Criterion loop runs the Laplace average-effect study. At this row count the run includes 400 certified Laplace posterior draws. Bootstrap and refutation are off. Copy counts and identify-cache hits are printed by a separate untimed run after the loop."
data = "crates/antecedent/benches/user_path.rs"
seed = "11"
uncertainty = "400 certified Laplace posterior draws"
diagnostics = "identify-cache and copy counts from the untimed run"
resource_scope = "process: the operating system reports the peak resident set, CPU time and faults of the bench process, and Criterion reports the mean of each timed leg"
predecessor = "v2.4.1"
source = "benches/baselines/user_path.md"

[[control]]
id = "nonlinear_bayes"
family = "nonlinear Bayes"
status = "defined"
command = "python parity/performance_lanes/entry_points/nonlinear_bayes.py --role control"
candidate_command = "python parity/performance_lanes/entry_points/nonlinear_bayes.py --role candidate"
timed_work = "analyze() fits a Bernoulli-logit outcome by HMC with 4000 posterior draws and the measured draw control, and returns the risk-difference effect with its posterior interval. The sampler's ESS, split-R-hat and chain-movement publication gates and the Monte Carlo error check run inside that call. Row synthesis sits outside it. A Rust leg times fit_hmc_glm on the same model family with the same gates."
data = "parity/performance_lanes/entry_points/nonlinear_bayes.py"
seed = "data=3 execution=2"
uncertainty = "4000 HMC posterior draws and the posterior interval"
diagnostics = "effective-sample-size, split-R-hat, divergence and chain-movement publication gates, and the measured draw control"
resource_scope = "section: the process peak resident set (getrusage, which counts native allocations) is read immediately before and after the timed section, and the operating system reports the process peak, CPU time and faults for the whole run"
predecessor = "v2.4.1"
source = "parity/performance_lanes/entry_points/nonlinear_bayes.py"

[[control]]
id = "pc"
family = "PC"
status = "defined"
command = "cargo bench -p antecedent-discovery --bench ci_search"
timed_work = "The PC leg times Pc::run, which executes the conditional-independence tests and stores the CI-test count on the discovery result. The same binary also times PCMCI+ and LPCMCI. Link digests are printed after each timed leg."
data = "crates/antecedent-discovery/benches/ci_search.rs"
seed = "7"
uncertainty = "conditional-independence tests with stored test count"
diagnostics = "link digests"
resource_scope = "process: the operating system reports the peak resident set, CPU time and faults of the bench process, and Criterion reports the mean of each timed leg"
predecessor = "v2.4.1"
source = "crates/antecedent-discovery/benches/ci_search.rs"

[[control]]
id = "fci"
family = "FCI"
status = "defined"
command = "python parity/performance_lanes/entry_points/fci.py --role control"
candidate_command = "python parity/performance_lanes/entry_points/fci.py --role candidate"
timed_work = "FCI.run executes the partial-correlation conditional-independence tests (alpha 0.05, conditioning size up to 3), the Possible-D-Sep phase and the orientation rules on a linear-Gaussian system with one omitted common cause, and returns the test count, scored links and oriented graph. Row synthesis sits outside the call. A Rust leg times Fci::run on the same design."
data = "parity/performance_lanes/entry_points/fci.py"
seed = "data=7 execution=7"
uncertainty = "conditional-independence tests with stored test count and scored links"
diagnostics = "Possible-D-Sep phase, orientation to a fixed point and the oriented graph"
resource_scope = "section: the process peak resident set (getrusage, which counts native allocations) is read immediately before and after the timed section, and the operating system reports the process peak, CPU time and faults for the whole run"
predecessor = "v2.4.1"
source = "parity/performance_lanes/entry_points/fci.py"

[[control]]
id = "pcmci"
family = "PCMCI"
status = "defined"
command = "cargo +1.85 bench -p antecedent-discovery --bench pcmci"
timed_work = "The Criterion loop calls Pcmci::run. Parent search and momentary conditional independence (alpha 0.05, FDR off) execute inside that call. The bench discards the result value."
data = "crates/antecedent-discovery/benches/pcmci.rs"
seed = "1"
uncertainty = "momentary conditional independence at alpha 0.05"
diagnostics = "parent search and test count"
resource_scope = "process: the operating system reports the peak resident set, CPU time and faults of the bench process, and Criterion reports the mean of each timed leg"
predecessor = "v2.4.1"
source = "benches/baselines/pcmci.md"

[[control]]
id = "panel"
family = "panel"
status = "defined"
command = "python examples/python/quasi_difference_in_differences.py"
timed_work = "analyze() for the balanced-panel difference-in-differences returns the subject-clustered standard error and the cluster count. The same script prints the repeated-cross-section uncertainty field."
data = "examples/python/quasi_difference_in_differences.py"
seed = "none: the data are literal in the script and the analysis draws nothing at random"
uncertainty = "subject-clustered standard error"
diagnostics = "cluster count and repeated-cross-section uncertainty field"
resource_scope = "section: the process peak resident set (getrusage, which counts native allocations) is read immediately before and after the timed section, and the operating system reports the process peak, CPU time and faults for the whole run"
predecessor = "v2.4.1"
source = "examples/python/quasi_difference_in_differences.py"

[[control]]
id = "survival"
family = "survival"
status = "defined"
command = "python parity/performance_lanes/entry_points/survival.py --role control"
