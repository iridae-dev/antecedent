tests = ["joint_transport_predictive_treated_outcome_l95"]
ignored = true
grid = true
whole = true
reason = "A source and target sharing a Gaussian baseline and known target noise. Every replicate refits source trial units, redraws paired predictive target outcomes through the compiled route and scores its 95% treated-outcome interval against an independent future target unit. The 60/120/240 source-and-target grid is prospective; neither outcome coverage nor decision reliability is earned."

[[group]]
