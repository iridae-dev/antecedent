# Prospective additions to the frozen calibration roster. These are source
# declarations only: this file is not read by the measurement gate. Move each
# reviewed group to the end of calibration_groups.toml and refresh the frozen
# family manifest and label audit when builds and calibration runs resume.
# Existing measured groups must retain their order and hypotheses.

[[group]]
label = "fitted_dependent_measurement_calibration: fitted_dependent_measurement_joint_error_l95"
package = "antecedent"
target = "fitted_dependent_measurement_calibration"
tests = ["fitted_dependent_measurement_joint_error_l95"]
ignored = true
grid = true
whole = true
reason = "One fixed binary construct, a complete two-indicator joint error table, labelled validation samples at 150/300/600 observations per construct level, a fixed symmetric Dirichlet prior and a 95% equal-tail interval for P(Y=1 | assay_a=1, assay_b=1). The truth is analytic and the runtime calibration basis is checked in every replicate. This group is not measured or earned."

[[group]]
label = "graph_narrow_policy_calibration: graph_narrow_held_out_policy_l95"
package = "antecedent"
target = "graph_narrow_policy_calibration"
tests = ["graph_narrow_held_out_policy_l95"]
ignored = true
grid = true
whole = true
reason = "A graph-checked held-out learned policy uses only binary x while outcome nuisance models use x and w and known row-level assignment probabilities. The 500/1000/2000-row grid has an analytic truth conditional on each learned two-stratum rule. The route's exact 95% Wald candidate, calibration basis and slot are checked before scoring. No record is measured or earned."

[[group]]
label = "graph_imputation_transport_calibration: graph_imputation_transport_target_frame_l95"
package = "antecedent"
target = "graph_imputation_transport_calibration"
tests = ["graph_imputation_transport_target_frame_l95"]
ignored = true
grid = true
whole = true
reason = "One source-fixed root-treatment binary effect-modifier design with MAR outcomes, graph selection repeated over two imputations, a separately sampled binary target frame and graph-specific target standardization. The 60/120/240-source-row grid scores the route's own nearest-rank 95% interval against analytic truth conditional on each target frame. This prospective group has no measured or earned record."

[[group]]
label = "joint_transport_predictive_calibration: joint_transport_predictive_treated_outcome_l95"
package = "antecedent"
target = "joint_transport_predictive_calibration"
tests = ["joint_transport_predictive_treated_outcome_l95"]
ignored = true
grid = true
whole = true
reason = "A source and target sharing a Gaussian baseline and known target noise. Every replicate refits source trial units, redraws paired predictive target outcomes through the compiled route and scores its 95% treated-outcome interval against an independent future target unit. The 60/120/240 source-and-target grid is prospective; neither outcome coverage nor decision reliability is earned."

[[group]]
label = "iid_sampling_assumption_union_calibration: iid_sampling_assumption_union_joint_endpoints_l95"
package = "antecedent"
target = "iid_sampling_assumption_union_calibration"
tests = ["iid_sampling_assumption_union_joint_endpoints_l95"]
ignored = true
grid = true
whole = true
reason = "Raw IID Gaussian unit rows feed a complete assumption-envelope chain with fixed bias range [0,1]. Every outer replicate has an independent unit sample and the compiler generates 200 paired whole-chain bootstrap resamples. Joint coverage of the true set [1,2] is scored on the 60/120/240-row grid under the route's exact basis. No record is measured or earned."

[[group]]
label = "graph_narrow_cross_fitted_policy_calibration: graph_narrow_cross_fitted_policy_l95"
package = "antecedent"
target = "graph_narrow_cross_fitted_policy_calibration"
tests = ["graph_narrow_cross_fitted_policy_l95"]
ignored = true
grid = true
whole = true
reason = "A graph-checked three-fold learner sees binary x while nuisance models use x,w and known row assignment. The 500/1000/2000-row grid reruns all folds and scores a separately keyed 95% interval against the exact conditional mean of the realized fold actions on the empirical scored-row frame. Unstable fold policies remain in the experiment. No record is measured or earned."

[[group]]
label = "cyclic_posterior_predictive_calibration: cyclic_posterior_population_outcome_l95"
package = "antecedent"
target = "cyclic_posterior_predictive_calibration"
tests = ["cyclic_posterior_population_outcome_l95"]
ignored = true
grid = true
whole = true
reason = "A known two-equation Gaussian feedback system generates new intervention-labelled training rows and an independent future outcome each replicate. The 120/240/480-row grid reruns joint parameter MCMC, correlated-disturbance predictive equilibria, paired decision and the route's 95% ordinary-world outcome candidate. Diagnostics and exact runtime basis are checked; neither coverage nor decision reliability is earned."

[[group]]
label = "bridge_transport_premise_calibration: bridge_target_mapping_discrepancy_grid_l95"
package = "antecedent"
target = "bridge_transport_premise_calibration"
tests = ["bridge_target_mapping_discrepancy_grid_l95"]
ignored = true
grid = true
whole = true
reason = "Independent Gaussian source and target trial lines share a fixed surrogate design and differ by a known intercept. Every replicate refits both lines through the compiler and checks simultaneous 95% discrepancy bands on five prespecified overlap points against the true target-minus-source difference. The 60/120/240-trial-per-scope grid binds the exact runtime design basis. No coverage, equivalence error control or final decision reliability is measured or earned."

[[group]]
label = "cluster_sampling_assumption_union_calibration: cluster_sampling_assumption_union_joint_endpoints_l95"
package = "antecedent"
target = "cluster_sampling_assumption_union_calibration"
tests = ["cluster_sampling_assumption_union_joint_endpoints_l95"]
ignored = true
grid = true
whole = true
reason = "Independent Gaussian clusters each contribute two correlated raw unit rows to an assumption-envelope chain with fixed bias [0,1]. Every outer replicate regenerates clusters, then the compiler draws 200 complete-cluster bootstrap resamples and recompiles the whole chain. The 60/120/240-row grid scores joint containment of true set [1,2] under the exact cluster-design basis. No coverage or decision record is measured or earned."
