target = "graph_imputation_transport_calibration"
tests = ["graph_imputation_transport_target_frame_l95"]
ignored = true
grid = true
whole = true
reason = "One source-fixed root-treatment binary effect-modifier design with MAR outcomes, graph selection repeated over two imputations, a separately sampled binary target frame and graph-specific target standardization. The 60/120/240-source-row grid scores the route's own nearest-rank 95% interval against analytic truth conditional on each target frame. This prospective group has no measured or earned record."

[[group]]
