limitations = "Each DAG atom is identified and estimated independently. Posterior graph weights, atom values, identified/unidentified/unevaluable mass, the pointwise identified set, and the conditional-on-identified mean are retained. Multi-atom sampling uncertainty is unavailable. Known-truth pin (conformance/bayesian/known_truth_mixtures static_response): atom curves 1 + 2.75t and 1 + 2t at weights 0.5 / 0.3 with 0.2 unidentified give conditional_on_identified = 1 + 2.46875t; this is a numeric pin, not a coverage claim."

[[cell]]
