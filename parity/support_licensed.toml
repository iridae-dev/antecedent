[[cell]]
query = "PulseEffect"
graph_class = "TemporalCpdag"
structure = "explicit"
inference = "Bayesian"
validation = "none"
staged = true
evidence_kind = "internal_known_truth"
known_truth_fixture = "conformance/bayesian/temporal_class_envelope"
evidence_test = "crates/antecedent/tests/temporal_class_bayesian_envelope.rs"
evidence_assertion = "temporal_class_bayesian_pulse_with_class_prior_mixes"
limitations = "Per identified TemporalDag/MAG completion: bayesian_temporal_gcomp. Without ClassPrior the result is an identified set plus atom posteriors; enumeration is not mixed. With ClassPrior, aggregate_effect_envelope mixes draws and retains unidentified mass; the blended mean is identified-mass-only under default EnvelopeOptions. A capped completion search cannot confer class-wide identification (full_mass_scope, truncated_atoms) and cannot publish a full-class mixture. Runtime class stays incomplete. cheap/full run envelope refuters/PPC on the mixed contrast. Same-design and mapped prior transfer may ride via conformance/bayesian/temporal_class_prior_transfer; mechanism priors are not a class prior. Pins consume conformance/bayesian/temporal_class_envelope. Credible intervals are a generalized (power) posterior with a serial-dependence correction: each Gaussian likelihood on time-ordered rows is tempered by 1/kappa, kappa = the AR(1)-prewhitened Newey-West long-run-variance ratio of the effect's score (floored at 1), reported by the estimate.bayesian.temporal.dependence_correction diagnostic and a bayes.temporal.long_run_tempering assumption; heteroskedasticity and mean misspecification are not corrected. 400-replicate coverage under iid and AR(1) residuals: crates/antecedent/tests/v19_bayesian_temporal.rs. Every completion or graph atom is fitted under this correction before mixing. Transfer binds lag-aware coefficient names (coef_<var>@lag<k>): identical-subspace or effect-functional transfer across a different lag, window, or covariate layout, or from an artifact without lag-aware names, fails closed unless an explicit NamedParameters mapping is declared."

