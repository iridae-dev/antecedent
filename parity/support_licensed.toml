limitations = "One mediator, lag-one treatment, linear additive mechanisms without treatment-mediator interaction; graph-derived baseline parent adjustment is shared by both mechanisms and refuters. Treatment-induced intermediate covariates require a larger path model. Natural effects use the explicit no-interaction alias. Frequentist uncertainty: iid analytic SEs are NaN for Total, Direct and Mediated (TemporalMediationEstimator::allow_iid_sobel_se opts back in); requested replicates run one circular-block bootstrap over consecutive lag-aligned rows (block = max(deepest design lag + 1, ⌈n^{1/3}⌉) rows, capped at n) that refits all three mechanism regressions, so the three SEs share replicates; they are scaled by the Kiefer–Vogelsang fixed-b factor and published per contrast in mediation_grid (FrequentistBlockBootstrap), with the requested contrast as se_bootstrap. With zero replicates no SE is published. Below 100 effective score rows the result warns estimate.temporal.circular_block_se.short_series. Coverage: crates/antecedent/tests/v19_temporal_frequentist.rs. No general mediation or calibrated refuter claim. cheap/full are licensed separately with placebo-mediator, RCC, and contiguous-window diagnostics."

