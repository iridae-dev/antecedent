[[cell]]
query = "TemporalMediationEffect"
graph_class = "TemporalDag"
structure = "explicit"
inference = "Frequentist"
validation = "cheap"
staged = true
evidence_kind = "internal_known_truth"
known_truth_fixture = "conformance/estimate/temporal_mediation_grid"
evidence_test = "crates/antecedent/tests/prepared_analysis.rs"
evidence_assertion = "prepared_temporal_mediation_reuses_identification"
limitations = "One mediator, lag-one treatment, linear additive mechanisms without treatment-mediator interaction; graph-derived baseline parent adjustment is shared by both mechanisms and refuters. Treatment-induced intermediate covariates require a larger path model. Natural effects use the explicit no-interaction alias. Cheap runs placebo-mediator and RCC contrast refits plus empirical binary mediator-range overlap when applicable. Frequentist uncertainty: iid analytic SEs are NaN for Total, Direct and Mediated (TemporalMediationEstimator::allow_iid_sobel_se opts back in); requested replicates run one circular-block bootstrap over consecutive lag-aligned rows (block = max(deepest design lag + 1, ⌈n^{1/3}⌉) rows, capped at n) that refits all three mechanism regressions, so the three SEs share replicates; they are scaled by the Kiefer–Vogelsang fixed-b factor and published per contrast in mediation_grid (FrequentistBlockBootstrap), with the requested contrast as se_bootstrap. With zero replicates no SE is published. Below 100 effective score rows the result warns estimate.temporal.circular_block_se.short_series. Coverage: crates/antecedent/tests/v19_temporal_frequentist.rs. No general mediation or calibrated refuter claim."

