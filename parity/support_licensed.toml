limitations = "Frozen structural mixture pins the lag-one Pulse effect at 0.9; a valid autoregressive atom reaches the finite-history certification boundary, so its 0.3 weight remains unidentified and priors do not upgrade ID. The staged prepared result equals fresh and consumes cached per-atom identification. cheap/full are licensed separately: effect refuters run on every contributing atom against that atom's own posterior mean and mix by posterior mass, plus PPC on cheap; full adds prior-sensitivity aggregating contributing atoms. Credible intervals are a generalized (power) posterior with a serial-dependence correction: each Gaussian likelihood on time-ordered rows is tempered by 1/kappa, kappa = the AR(1)-prewhitened Newey-West long-run-variance ratio of the effect's score (floored at 1), reported by the estimate.bayesian.temporal.dependence_correction diagnostic and a bayes.temporal.long_run_tempering assumption; heteroskedasticity and mean misspecification are not corrected. 400-replicate coverage under iid and AR(1) residuals: crates/antecedent/tests/v19_bayesian_temporal.rs. Every completion or graph atom is fitted under this correction before mixing."

