limitations = "conformance/estimate/pag_ate_envelope_identified: seven MAG completions of the supplied PAG, six identified by generalized adjustment with visible edges out of the treatment at two different effects (adjust {z}: direct; adjust {}: total through z -> m -> y) and one unidentified (no arrowhead into the treatment; mass 1/7, reported, never mixed in; status GraphDependent). Each identified completion keeps its own conjugate posterior; the published draws are the posterior of the frozen-weight mixture functional, with completions rank-coupled by their influence-function correlation on the shared rows (estimate.envelope.bayesian_mixture_functional). They are not a distribution over completion-specific effects: the earlier identified-atom BMA covered the mixture functional 99.8-100% of the time at nominal 90% and was replaced in 1.9. Seeded conjugate pins (64 draws, prior scale 10): mean 0.3755322225001672, SD 0.02183085569669244; unidentified mass 1/7 is reported on the posterior. 400-replicate 90% coverage 0.868 (v19_static_envelope_calibration::static_pag_ate_envelope_bayesian_nominal_90_coverage). A PAG whose treatment edges are invisible in every completion is refused (conformance/estimate/pag_ate_envelope is kept as that negative evidence). Prepared handles freeze and reuse the envelope; estimate clicks and same-schema refresh emit exec.identify.cached; a new graph or query requires a new prepare. Full adds mixture-weighted PPC, prior-sensitivity, and effect refuters run on each completion against its own posterior mean; those validation numbers are not pinned. Prior sensitivity perturbs the prior in force (variance-multiplier grid around a staged or transferred prior, alpha grid for a prior-bank compose, isotropic scale grid only when no prior was supplied; the summary records the family) and the prior PPC simulates from that prior."

