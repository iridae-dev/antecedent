[[cell]]
query = "AverageDerivative"
graph_class = "Dag"
structure = "explicit"
inference = "Bayesian"
validation = "none"
staged = true
evidence_kind = "internal_known_truth"
known_truth_fixture = "conformance/response/staged_derivatives"
evidence_test = "crates/antecedent/tests/v18_bayesian_remainder.rs"
evidence_assertion = "derivative_bayesian_pins"
limitations = "Rubin Dirichlet(1,...,1)/Exp(1) row-weight posterior: each draw refits the additive-GAM outcome mu and the Gaussian treatment law alpha on the full weighted sample, then evaluates the weighted Riesz ADE (not a frozen-score reweight); quantile credible interval. Coverage on a Gaussian treatment law with a nonlinear outcome: 0.880 at nominal 0.90 (crates/antecedent/tests/v19_derivative_calibration.rs::ade_bayesian_gaussian_treatment_nominal_90_coverage). The representer assumes the treatment is homoskedastic Gaussian given the adjustment set with an additive mean (assumption response.riesz_ade.gaussian_score). That assumption is load-bearing: with a skewed, heteroskedastic treatment law and a nonlinear outcome the measured coverage was 0.145 (Frequentist) / 0.135 (Bayesian) at nominal 0.90 (crates/antecedent/tests/v19_derivative_calibration.rs::ade_skewed_heteroskedastic_treatment_probe, recorded, not gated). Estimator ids stay Riesz/point/GAM; inference is not rewritten to bayesian.gcomp or response.bayesian. Coefficient priors and transfer fail closed (no mapping to the Riesz/local-polynomial/GAM parameterization). Graph-posterior derivative mixtures stay refused. Pins the point value and that the credible interval brackets the truth on conformance/response/staged_derivatives for explicit and accepted structure (crates/antecedent/tests/v18_bayesian_remainder.rs::derivative_bayesian_pins)."

