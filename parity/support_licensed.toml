graph_class = "TemporalDag"
structure = "graph_posterior"
inference = "Bayesian"
validation = "cheap"
staged = true
evidence_kind = "internal_known_truth"
known_truth_fixture = "conformance/bayesian/known_truth_mixtures"
limitations = "Known-truth DBN graph-mixture effect with identified weights and unidentified mass retained. Applicable temporal refuters run on every contributing atom against that atom's own posterior mean (not the pooled mean) and mix by posterior mass; they do not rediscover graphs. PPC aggregates contributing atoms. Pulse is a single intervention time; multi-step Sustained validation is documented in its own cells. Credible intervals are a generalized (power) posterior with a serial-dependence correction: each Gaussian likelihood on time-ordered rows is tempered by 1/kappa, kappa = the AR(1)-prewhitened Newey-West long-run-variance ratio of the effect's score (floored at 1), reported by the estimate.bayesian.temporal.dependence_correction diagnostic and a bayes.temporal.long_run_tempering assumption; heteroskedasticity and mean misspecification are not corrected. 400-replicate coverage under iid and AR(1) residuals: crates/antecedent/tests/v19_bayesian_temporal.rs. Every completion or graph atom is fitted under this correction before mixing. The prior PPC simulates from the prior in force."

