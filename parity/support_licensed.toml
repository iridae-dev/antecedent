limitations = "Single-step sustained uses the existing identified temporal adjustment design and its known-truth fixture. Multi-step cheap/full refit the actual sequential model; single-regression sensitivity formulas are explicitly inapplicable, with sequential unobserved-confounder perturbations available. Cheap suite runs only sensitivity.evalue (plus PPC: execute_bayesian runs PPC under any non-None refute suite); OverlapRefuter is NotApplicable on a temporal-unfolded design (per-run skip surfaced as a refute.validator.not_applicable diagnostic, not the support matrix's not_applicable). The fixture pins the Bayesian sustained mean, not those numbers. Additional multi-step evidence: crates/antecedent/tests/dbn_sustained_validation.rs pins full-window effects against single-step collapse. Bayesian PPC checks each stationary mechanism separately; full prior sensitivity refits the composed effect. Credible intervals are a generalized (power) posterior with a serial-dependence correction: each Gaussian likelihood on time-ordered rows is tempered by 1/kappa, kappa = the AR(1)-prewhitened Newey-West long-run-variance ratio of the effect's score (floored at 1; multi-step windows use each stationary mechanism's contrast-gradient score), reported by the estimate.bayesian.temporal.dependence_correction diagnostic and a bayes.temporal.long_run_tempering assumption; heteroskedasticity and mean misspecification are not corrected. 400-replicate coverage under iid and AR(1) residuals: crates/antecedent/tests/v19_bayesian_temporal.rs. The prior PPC simulates from the prior in force."

