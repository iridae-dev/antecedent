[[cell]]
query = "ResponseCurve"
graph_class = "TemporalCpdag"
structure = "explicit"
inference = "Frequentist"
validation = "none"
staged = true
evidence_kind = "internal_cross_check"
evidence_test = "crates/antecedent/tests/temporal_class_envelope_numeric_pins.rs"
evidence_assertion = "temporal_class_response_returns_completion_identified_set"
limitations = "Per horizon x completion: TemporalResponseEstimator (curves, Set/Shift/Soft) or unfolded sequential g-comp (multi-step / joint Sequence, Soft multiplicative and truncated_shift) on each identified completion. The published object is a completion-enumeration identified set: pointwise min/max over completion point surfaces, with no weighted mean and no class-level sampling band. Requested replicates ride each completion atom as that atom's own joint circular-block pointwise band plus simultaneous band (response.simultaneous_band.*); their coverage is calibrated against each atom's own probability limit, not a class truth (crates/antecedent/tests/v19_temporal_response_calibration.rs). Numeric pins: identified-set lower/upper and every atom equal an independent lag-aligned OLS g-computation under that atom's adjustment set (temporal_class_response_returns_completion_identified_set, ResponseCurve and Set/Shift InterventionResponse). Licensed 1.3/1.6 observation pairs ride per completion: curve atoms use the tuple-level outer circular-block bootstrap; a multi-completion identified set withholds the class band; observation-adjusted Sequence bands are withheld. Nested Sequence stays refused; bidirected MAG completions stay unevaluable for sequential g-comp (mass retained). Delayed entry, interval, and truncation stay refused. Evidence also: temporal_class_observation.rs, temporal_class_sequence_policies.rs."

