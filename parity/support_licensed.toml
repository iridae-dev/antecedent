limitations = "Per horizon x completion: TemporalResponseEstimator::estimate_bayesian, or sequential mechanism posteriors for Sequence / Soft multiplicative / truncated_shift. Default is an identified set with CompletionEnumeration and estimate.envelope.response_posterior_not_mixed; each atom keeps its own pointwise and simultaneous credible band (conditional on the observed covariate average), calibrated against that atom's own conditional functional (crates/antecedent/tests/v19_temporal_response_calibration.rs). A ClassPrior publishes conditional_on_identified only when every identified atom is aligned and unidentified mass is zero. Numeric pins: identified-set lower/upper equal the atom posterior means, which match an independent lag-aligned OLS g-computation under each atom's adjustment set (temporal_class_bayesian_response_is_identified_set, ResponseCurve and Set InterventionResponse); this is a cross-check, not a known-truth fixture. cheap/full stay n/a. Same-design and mapped prior transfer may ride via conformance/bayesian/temporal_class_prior_transfer; mechanism priors are not a class prior."

