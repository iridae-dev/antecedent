[[cell]]
query = "ConditionalEffect"
graph_class = "Dag"
structure = "graph_posterior"
inference = "Frequentist"
validation = "none"
staged = true
evidence_kind = "internal_known_truth"
known_truth_fixture = "conformance/bayesian/known_truth_mixtures"
limitations = "Per-atom conditional identification on DAG graph-posterior atoms. Published moments are E[τ | identified] (identified-atom BMA); unidentified mass is a separate non-renormalized axis (assumption envelope.conditional_on_identification). Frequentist uses conditional.linear.adjustment; Bayesian uses conditional.bayesian and is not a silent Frequentist reuse. Cheap/full run the refuters on each contributing atom against that atom's own CATE and mix the reports by graph mass; the mixed check passes only if every atom passes. Evidence: crates/antecedent/tests/v18_bayesian_remainder.rs and conformance/bayesian/known_truth_mixtures. With more than one contributing atom the Frequentist SE is the joint influence-function covariance of the atoms' CATE IFs on shared rows with frozen graph weights (estimate.graph_posterior.joint_if_se); the atom IFs hold the sample modifier mean fixed. A single contributing atom keeps its own SE; unalignable atoms give NaN plus estimate.envelope.se_omits_between_atom_variance. 400-replicate coverage with atoms whose CATEs differ: crates/antecedent/tests/v19_static_mixture_calibration.rs."

