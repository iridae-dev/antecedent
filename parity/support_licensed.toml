[[cell]]
query = "PointDerivative"
graph_class = "Dag"
structure = "explicit"
inference = "Frequentist"
validation = "none"
staged = true
evidence_kind = "internal_known_truth"
known_truth_fixture = "conformance/response/staged_derivatives"
evidence_test = "crates/antecedent/tests/staged_derivatives.rs"
evidence_assertion = "staged_derivatives_known_truth"
limitations = "Complete observations only. Kennedy-DR pseudo-outcome (cross-fitted additive-GAM outcome and homoskedastic Gaussian treatment-density nuisances) smoothed by a Gaussian local quadratic at an explicit caller bandwidth; Silverman's rule is refused. The estimand is the true slope m'(a), not a bandwidth-smoothed surrogate. The point value is the local-quadratic slope. Published intervals are robust bias-corrected (Calonico-Cattaneo-Titiunik, pilot bandwidth = caller bandwidth, numerically the local-cubic slope with its own Eicker-White SE): centered at the bias-corrected slope, not at the local-quadratic point value, with standard_error the bias-corrected SE (runtime diagnostic response.derivative_interval_bias_corrected). The interval treats the cross-fitted pseudo-outcome as data and conditions on the caller bandwidth. Under genuine curvature (m'''(a) != 0) at an MSE-sized bandwidth the pre-1.9 conventional local-quadratic interval covered 0.820 of nominal 0.90; that interval is replaced, not footnoted. Order-1 identity coverage under curvature: 0.897 at nominal 0.90 (crates/antecedent/tests/v19_derivative_calibration.rs::point_derivative_frequentist_curvature_nominal_90_coverage). Known truth: linear SCM (tolerance 0.15) and a confounded SCM whose unadjusted Y~A slope is not the structural slope (`conformance/response/staged_derivatives/confounded.json`). No partial-graph, graph-posterior, observation-adjusted, or derivative-native validation license."

