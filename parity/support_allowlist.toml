inferences = ["Bayesian"]
reason = "execute_dbn_posterior_bayesian mixes a DBN graph posterior into a Bayesian temporal effect envelope; crates/antecedent/tests/manufacturing_temporal.rs's manufacturing_dbn_posterior_bayesian_envelope test runs this exact cell end-to-end. Not licensed because a DBN posterior has no single known-truth fixture -- the atoms it mixes vary per discovery run."
parent = "PulseEffect TemporalDag explicit/accepted Frequentist/Bayesian (allowed, above)"

[[allowed]]
queries = ["PulseEffect"]
graph_classes = ["TemporalCpdag", "TemporalPag"]
structures = ["accepted"]
reason = "A discovery-accepted TemporalCpdag/TemporalPag with no undirected/circle marks left pending does not always complete to a TemporalDag (try_into_temporal_dag can still fail -- e.g. a resolved-but-bidirected mark a CPDAG/PAG completion review does not reduce to a lagged direction); compile.rs's TemporalCpdag/TemporalPag arms run that same completion attempt and, on success, execute the temporal backdoor exactly like the TemporalDag family. On failure they surface CausalError::Compile (Python's CausalCompileError), never a silent or mislabeled number. J-PCMCI+/LPCMCI discovery in python/src/temporal_api.rs (accept_temporal_cpdag_review / accept_temporal_pag_review) reaches this cell directly and today; python/tests/test_analyze_discovery.py::test_analyze_discovery_jpcmci_plus_two_env and test_panel_discover_ci_callback.py::test_panel_discover_jpcmci_plus_ci_callback_invoked already tolerate the CausalCompileError outcome as legitimate, alongside a clean estimate. Not licensed because completion success is per-discovered-graph and not staged."
parent = "PulseEffect TemporalDag explicit/accepted Frequentist/Bayesian (allowed, above) -- same temporal backdoor, reached via a graph that does not always finish collapsing"

