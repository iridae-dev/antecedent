reason = "Temporal backdoor (compile_logical_temporal_effect_classified / execute_temporal) is fully wired for both Frequentist and Bayesian inference and every validation suite; confirmed end-to-end for Frequentist and Bayesian under none/cheap validation (full needs a longer complete series than the probe fixture supplied, same mechanism otherwise). Not licensed because there is no staged handle for the temporal path and no cell-shaped known-truth fixture pinning it the way the static AverageEffect family is pinned."
