# Named allowlist: cells that are neither licensed nor closed but do genuinely
# run end-to-end today. Each row is proof-carrying — `reason` states why it runs
# and why it is not licensed instead (no staged handle / re-identifies per click /
# no cell-shaped evidence fixture), and `parent` names the licensed or
# keep-running family it rides. An allowed rule must not match any licensed, n/a,
# or closed cell (parity/gate_support_matrix.sh enforces the partition).
#
# Every row here was probed end-to-end (Study::build().run()) against a real
# fixture before being added. See adr/0020, 2026-08-19 amendment.

[[allowed]]
queries = ["AverageEffect"]
graph_classes = ["Dag"]
structures = ["explicit", "accepted"]
inferences = ["Bayesian"]
validations = ["cheap", "full"]
reason = "Same BayesianGComputationAte path as the licensed Dag/Bayesian/none cell; cheap and full only add refuter suites on top of the same estimate. Not licensed because the matrix pins the estimate, not the refuter suite, on this axis; validation = cheap/full ride the licensed cell's own fixture rather than a separate known-truth pin."
parent = "AverageEffect Dag explicit/accepted Bayesian none (licensed)"

[[allowed]]
queries = ["AverageEffect"]
graph_classes = ["Dag"]
structures = ["graph_posterior"]
inferences = ["Bayesian"]
reason = "execute_graph_posterior_bayesian identifies and fits every posterior atom into a Bayesian effect envelope; genuinely runs (crates/antecedent/tests/manufacturing_temporal.rs exercises the sibling TemporalEffect case end-to-end, and analysis/execute/mod.rs's own tests build a graph-posterior study under Bayesian inference). Not licensed because a graph posterior has no single known-truth fixture to pin -- the atoms it mixes vary per discovery run."
parent = "AverageEffect Dag explicit/accepted Bayesian none (licensed)"

[[allowed]]
queries = ["AverageEffect"]
graph_classes = ["Admg"]
structures = ["explicit", "accepted"]
inferences = ["Frequentist"]
reason = "execute_admg runs general ID + FunctionalEffect whenever the ADMG carries a bidirected edge (compile.rs's Admg arm, dispatch.rs's execute() Admg arm); confirmed end-to-end on an identifiable front-door-shaped ADMG fixture. NotIdentified on a non-identifiable ADMG is a normal per-graph identification outcome, not a wiring failure. Not licensed because there is no known-truth fixture pinning general-ID ADMG estimates the way the Dag/Pag families are pinned."
parent = "AverageEffect Dag explicit/accepted Frequentist none (licensed); mirrors the AverageEffect Pag family below"

