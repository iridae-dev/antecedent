[[allowed]]
queries = ["TemporalMediationEffect"]
graph_classes = ["TemporalDag"]
structures = ["explicit", "accepted"]
inferences = ["Frequentist"]
reason = "execute_temporal_mediation runs TemporalMediationIdentifier + TemporalMediationEstimator end-to-end for every validation suite under Frequentist inference; confirmed end-to-end. Bayesian inference on this cell is deliberately excluded (closed instead, parity/support_closed.toml): execute_temporal_mediation hardcodes EstimatorId::TemporalMediation and never consults inference mode, so a Bayesian-labeled run would silently return the identical Frequentist number. Not licensed because there is no staged handle or known-truth fixture pinning temporal mediation the way the static AverageEffect family is pinned."
parent = "TemporalMediationEffect TemporalDag explicit/accepted Frequentist (this row is the running family; Bayesian is closed, not allowed)"
