[[allowed]]
queries = ["PulseEffect"]
graph_classes = ["TemporalCpdag", "TemporalPag"]
structures = ["accepted"]
reason = "A discovery-accepted TemporalCpdag/TemporalPag with no undirected/circle marks left pending does not always complete to a TemporalDag (try_into_temporal_dag can still fail -- a TemporalPag bidirected mark passes the circle-only accept gate but has no parent_child() reduction, and a TemporalCpdag conflict mark reaches AcceptedGraph::accept because TemporalCpdagReview::from_cpdag lists it as neither pending-directed nor pending-undirected; both are exercised in crates/antecedent/tests/temporal_incomplete_structure_parity.rs); compile.rs's TemporalCpdag/TemporalPag arms run that same completion attempt and, on success, execute the temporal backdoor exactly like the TemporalDag family. On failure they surface CausalError::Compile (Python's CausalCompileError), never a silent or mislabeled number. J-PCMCI+/LPCMCI discovery in python/src/temporal_api.rs (accept_temporal_cpdag_review / accept_temporal_pag_review) reaches this cell directly and today; python/tests/test_analyze_discovery.py::test_analyze_discovery_jpcmci_plus_two_env and test_panel_discover_ci_callback.py::test_panel_discover_jpcmci_plus_ci_callback_invoked already tolerate the CausalCompileError outcome as legitimate, alongside a clean estimate. Not licensed because completion success is per-discovered-graph and not staged."
parent = "PulseEffect TemporalDag explicit/accepted Frequentist/Bayesian (allowed, above) -- same temporal backdoor, reached via a graph that does not always finish collapsing"

[[allowed]]
queries = ["SustainedEffect"]
graph_classes = ["TemporalCpdag", "TemporalPag"]
structures = ["accepted"]
inferences = ["Frequentist"]
reason = "The `(AnalysisRoute::TemporalEffect, GraphClass::TemporalCpdag/TemporalPag)` arms in compile.rs are generic over TemporalPolicy -- they match `CausalQuery::TemporalEffect(q)` and hand `q` straight to compile_logical_temporal_effect_classified -- so single-step Sustained rides the exact arm the PulseEffect row above rides, and this cell existed only as an accident of the Pulse row having been written first. effective_graph_class collapses an accepted temporal CPDAG/PAG to TemporalDag whenever try_into_temporal_dag succeeds, so this coordinate is reached exactly when completion fails, and the row's job is to route that to the specific CausalError::Compile (Python's CausalCompileError) naming the failure instead of the generic unlicensed-and-not-allowed support refusal; either way no number is produced. Probed end-to-end in crates/antecedent/tests/temporal_incomplete_structure_parity.rs across every validation suite, on both reachable constructions: a TemporalPag carrying a bidirected mark (the circle-only accept gate admits it, parent_child() cannot reduce it) and a TemporalCpdag carrying a conflict mark reached through AcceptedGraph::accept(TemporalCpdagReview) (from_cpdag lists neither pending-directed nor pending-undirected for a conflict, so the review reports complete while try_into_temporal_dag still refuses). Frequentist-only, matching the parent family: Bayesian Sustained has no licensed or allowlisted cell on any graph class, and the same probe pins that it stays refused here. Multi-step Sustained remains estimator-refused inside the cell, exactly as on the licensed TemporalDag rows. Not licensed because completion success is per-discovered-graph and not staged."
parent = "SustainedEffect TemporalDag explicit/accepted Frequentist (licensed none; cheap/full allowed above) -- same single-step Sustained path, reached via a graph that does not always finish collapsing; mirrors the PulseEffect TemporalCpdag/TemporalPag row above"

