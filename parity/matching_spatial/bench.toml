# Exact multivariate nearest-neighbour index: split-plane tree against bounding-box tree.
# Measured by `cargo bench -p antecedent-stats --bench matching_spatial` (median of 10 samples,
# milliseconds) on Darwin 25.5.0 arm64; answers are checked against a linear scan before timing.
# Retained bytes are quoted by each index before allocation (see the bench's retained-bytes lines).
# The production matching path uses the bounding-box index from eight dimensions and keeps the
# split-plane index and its size guard below that. The bounding-box
# index wins on clustered data at every size and on uniform data from 8 dimensions, loses on
# low-dimensional uniform data, and costs about twice the build time.

[[case]]
shape = "spatial/clustered/n_100000/d_16"
split_plane_build_ms = 24.0180
bounding_box_build_ms = 33.6620
split_plane_query_ms = 3843.0000
bounding_box_query_ms = 317.9800

[[case]]
shape = "spatial/clustered/n_100000/d_2"
split_plane_build_ms = 14.8160
bounding_box_build_ms = 28.0590
