# Classification of every result the facade and the Python package reach, read by
# scripts/gate_compiled_path.py.
#
# [[row]]     a re-exported kernel function, an executing method of a re-exported kernel type
#             or module, a facade function returning a result type, or a deprecated facade entry.
# [[python]]  a public Python function whose native binding reaches a direct forwarder.
#
# disposition:
#   owner      publishes the result. unit is the PlanRoute or the capability that carries
#              the check. route, when set, is that PlanRoute.
#   forwarder  returns an owner's result and adds no claim. unit names the owner or the
#              route. Without direct, a kernel-crate item the unit runs. direct = true is a
#              #[deprecated] facade entry; its Python wrapper calls
#              _deprecation.direct_path_deprecated.
#   consumer   reads an artifact or result a unit already sealed; takes no data value. of
#              names the bound form when the consumer admits bytes.
#   not_scientific  computes no result (construction, serialization, identity, gating, data
#              access). reason says what it does.
# A candidate with no row owes a claim.

[result_types]
seed = ["NativeCohortFit", "EffectEstimate", "InterferenceEstimate", "TransportEffectEstimate", "MeasuredInference", "ZTransportResult", "StaticCpdagDiscoveryResult", "StaticDagDiscoveryResult", "StaticPagDiscoveryResult", "PagDiscoveryResult", "CpdagDiscoveryResult", "NotearsDiscoveryResult", "RpcmciDiscoveryResult", "CyclicFciResult", "GraphPosterior", "ExactDagMarginals", "TemporalIntervalArtifactWire", "PooledIntervalCandidate", "GraphFalsificationReport", "EventLaw", "ExcitationOffspring", "MarkedOffspring", "MarkedFit", "ExcitationReading", "ExcitationSubject", "ReleaseComparison", "AcceptedExcitation", "LagCountQuery", "ReleaseQuestionOutcome", "MemberReleaseStudy", "PreferenceEvaluation", "StructuralPreferenceEvaluation", "SampledStructuralEvaluation", "PreferenceDecisionResult", "CertifiedPreferenceResult", "SetLearningResult", "ChoiceModelResult", "CompiledPreferenceEvaluation"]

