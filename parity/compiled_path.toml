# Classification of every scientific computation the facade and the Python package reach, read by
# scripts/gate_compiled_path.py. The facade reaches a computation through the causal compiler; a
# kernel crate's own API is not deprecated, and the facade may re-export a kernel run entry only
# as a #[deprecated] wrapper that names its compiled replacement.
#
# [[row]]      a kernel function the facade re-exports, an executing function or method of a
#              re-exported kernel type or module, or a facade function returning a result type.
#              Keyed by the canonical path in parity/public_api.
# [[python]]   a public Python function whose native binding reaches a pending or deprecated row.
# [[verdict]]  a support-verdict literal that belongs in the generated support table.
#
# disposition: compiled (route = a PlanRoute in the lowering registry), deprecated (the snapshot
# shows #[deprecated], or a Python wrapper calls direct_path_deprecated first, directly or under
# an `if` that scopes the deprecation to the cases the route serves; replacement = a compiled row,
# or `route:<name>`, a PlanRoute or program family of the lowering registry), kernel (a kernel
# crate's run method reached through a facade-re-exported type that also configures a compiled
# estimator; kernel crates are kernel API and not deprecated; reason), internal (#[doc(hidden)]),
# consume (artifact or result consumer), not_scientific (reason), pending (owner = the follow-up
# area).
# An unclassified candidate and a row no candidate matches both fail.

[result_types]
seed = ["EffectEstimate", "InterferenceEstimate", "TransportEffectEstimate", "MeasuredInference", "ZTransportResult", "StaticCpdagDiscoveryResult", "StaticDagDiscoveryResult", "StaticPagDiscoveryResult", "PagDiscoveryResult", "CpdagDiscoveryResult", "NotearsDiscoveryResult", "RpcmciDiscoveryResult", "CyclicFciResult", "GraphPosterior", "ExactDagMarginals", "TemporalIntervalArtifactWire", "PooledIntervalCandidate", "GraphFalsificationReport"]

