A Polars thread pool is fixed for the process when a crate is linked. This
repository links no Polars crate, so the fixed configuration is a refusal. A
study thread count is not applied. Direct Arrow remains the preparation path.
Latency, RSS, spill, build, MSRV, and wheel were not measured.
"""

[measurements]
