why = "crates.io polars 0.55.2 (tag rs-0.55.2, published 2026-08-06) is the current stable Rust crate. Its crate Cargo.toml and workspace Cargo.toml declare no rust-version, and crates.io publishes no rust_version for any polars release. The tag rust-toolchain.toml channel is nightly-2026-04-01. On 2026-10-20, cargo build of polars =0.55.2 with rustc 1.85.1 refused before compiling the crate: ar_archive_writer 0.5.3, home 0.5.12, and psm 0.1.32 require Rust 1.88, uuid 1.28.0 requires Rust 1.89, and sysinfo 0.39.6 requires Rust 1.95. The crate was not linked. Latency, RSS, spill, a finished build, MSRV of a successful compile, and the host wheel were not measured."

