[[capability]]
id = "nonlinear_sde"
workflow = "StochasticDifferentialEquation.simulate / fit -> validated drift and diagonal diffusion in the portable expression language with scheduled inputs, bounds and interval Lipschitz certificate -> Euler-Maruyama / diagonal Milstein ensembles under named interventions with paired contrasts, Monte Carlo and step-halving error -> Euler quasi-likelihood or extended-Kalman fit with separate fitting, identification and discretization evidence -> parameter-draw spread -> evidence/artifact"
rust = ["crates/antecedent-model/src/nonlinear_sde.rs", "crates/antecedent-estimate/src/nonlinear_sde_fit.rs", "crates/antecedent-io/src/cyclic_family_artifact.rs"]
fixtures = ["conformance/gcm/nonlinear_sde_ensemble/expected.json"]
tests = ["crates/antecedent-model/src/nonlinear_sde/tests.rs", "crates/antecedent-estimate/src/nonlinear_sde_fit/tests.rs", "python/tests/test_nonlinear_sde.py"]
independent_truth = "NumPy re-implementation of the counter-based generator and the Euler-Maruyama ensembles of the documented SIR system (seasonal input, square-root state-dependent noise, reflecting bounds, a replaced-input world and a held-component world) replayed to 1e-8; exact moment ODEs of a square-root diffusion with a piecewise-constant input against Monte Carlo ensembles within standard-error tolerances; Euler recursions of the scheme's own mean and variance with the observed effect of step halving; strong error of Milstein against the exact geometric-Brownian solution under shared increments; the dense Euler quasi log likelihood of trajectories drawn with numpy.random.default_rng; typed refusals for unbounded growth, non-commutative Milstein, off-grid actions, out-of-envelope inputs, coarse observation intervals, vanishing transition variance, absent transitions and unread parameters"

[[capability]]
id = "integrated_families"
workflow = "Study::prepare_cyclic_family / prepare_experimental_recovery / prepare_cyclic -> lowered program and contract -> estimate/interventions/cyclic_evidence -> version-two family record -> independent CPU consumer of committed bytes; Python PreparedCyclicFamily/PreparedCyclicSystem.contract, inspect before any fit, interface_contract.check_composition_with_cyclic"
rust = ["crates/antecedent/src/analysis/cyclic.rs", "crates/antecedent/src/analysis/cyclic_evidence.rs", "crates/antecedent-io/src/cyclic_family_artifact.rs", "crates/antecedent-io/src/cyclic_family_contract.rs", "crates/antecedent-io/src/cyclic_family_program.rs", "crates/antecedent-io/src/cyclic_family_worlds.rs", "python/src/cyclic_system_api.rs", "crates/antecedent-identify/src/experiment_moments_noisy.rs", "crates/antecedent-estimate/src/experimental_fit.rs"]
fixtures = ["parity/cyclic/specified-feedback-pair", "parity/cyclic/overlapping-loops", "parity/cyclic/recovered-asymptotic-normal", "parity/cyclic/recovered-bootstrap", "parity/cyclic/recovered-unresolved-direction", "parity/cyclic/dynamic-inference-ou", "parity/cyclic/previous-record-format"]
tests = ["crates/antecedent/tests/cyclic_family_fixtures.rs", "crates/antecedent/tests/cyclic_independent_consumer.rs", "crates/antecedent/tests/cyclic_dag_regression.rs", "crates/antecedent-io/tests/cyclic_family_typed.rs", "crates/antecedent-estimate/tests/recovery_held_out_regimes.rs", "python/tests/test_cyclic.py"]
independent_truth = "Analytic feedback pair (association 1.40625/1.8125, hard-clamp derivative 0.5, mean-shift response 0.625) and the overlapping-loop clamp kept as failed mass; recovered laws from seeded simulated clamp experiments (asymptotic normal, bootstrap, an unresolved direction known before the fit); a seeded dynamic-inference bootstrap; committed bytes replayed bit for bit by a CPU consumer that never calls the producer, refusing a wrong identity, a tampered report or contract and an unknown record version, with the version-one record still replaying; acyclic support on the DAG schedule to 1e-12 against an independent forward substitution; whole-procedure recovery on entire held-out intervention regimes: noisy cyclic truths fit from single-unit or overlapping clamps, the asymptotic-normal and whole-procedure bootstrap laws compiled under joint clamps no training regime ran and scored against the independently solved equilibrium, against a fresh sample of the unseen regime, and for uncertainty that shrinks with the row count; uncovered and rank-deficient designs and failed bootstrap replicates kept as withheld mass with no interval or action; ignored repeated-sampling designs for the held-out interventional mean (asymptotic normal, bootstrap, a feedback-cycle member) left for the calibration measurement"
