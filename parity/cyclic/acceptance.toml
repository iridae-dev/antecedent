[[capability]]
id = "Y19.2"
workflow = "EquilibriumModel.isolate / PolynomialSystem.prepare -> roots and unresolved boxes -> explicit selection law / robust set decision"
rust = ["crates/antecedent-model/src/equation_system.rs", "crates/antecedent-model/src/equilibrium_polynomial.rs"]
independent_truth = "Cubic root sets, finite domains, exact expression coefficients, explicit incomplete work and equation-specific replacement"

[[capability]]
id = "Y19.3"
workflow = "fit_gradient / fit_adam / posterior_responses / bootstrap_responses / learn_structure -> held-out regimes -> artifacts"
rust = ["crates/antecedent-estimate/src/cyclic_likelihood.rs", "crates/antecedent-estimate/src/cyclic_gradient.rs", "crates/antecedent-estimate/src/cyclic_adam.rs", "crates/antecedent-model/src/linear_moments.rs"]
independent_truth = "Jacobian/mixed scores against central differences; exact linear moments; independent nonlinear data; explicit sampling designs and selection uncertainty"

[[capability]]
id = "Y19.4"
workflow = "Fully observed abduction / partial_counterfactual / joint_counterfactual / PolynomialCausalModel -> coupled worlds -> evidence/artifact"
