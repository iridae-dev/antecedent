# Production implementation inventory; calibration and attestation are separate.
version = 1
implementation = "complete"
acceptance_command = "python3 scripts/gate_cyclic_systems.py --python /path/to/current-wheel/python"
parents = ["Y18", "Y19"]
excluded_processes = ["statistical_calibration", "release_attestation"]
implementation_guide = "docs/development/cyclic-systems.md"
research_provenance = "provenance/cyclic.general_systems.toml"
python_acceptance = "python/tests/test_cyclic.py"
test_registry = "parity/v3_test_registry.toml"

[[capability]]
id = "Y18.1"
workflow = "CyclicGraph.identify/calculus/adjust -> identified_functional -> finite-law or continuous Gaussian density fitting/evaluation -> evidence/artifact"
rust = ["crates/antecedent-identify/src/cyclic_id.rs", "crates/antecedent-identify/src/cyclic_calculus.rs", "crates/antecedent-io/src/cyclic_functional.rs", "crates/antecedent-io/src/cyclic_gaussian_functional.rs"]
independent_truth = "All three-node mixed-graph Gaussian calculus checks; latent binary frontdoor and SCC joint tables; positivity and bounded-search failures"

[[capability]]
id = "Y18.2"
workflow = "CyclicGraph.discover / discover_cyclic -> inducing-path PAG and theorem-scoped conclusions -> artifact"
rust = ["crates/antecedent-discovery/src/cyclic_fci.rs"]
independent_truth = "All 512 three-node mixed-graph exact CI cases; sampled CI; sigma walk oracle and exhaustive four-node directed graphs"

[[capability]]
id = "Y19.1"
workflow = "EquilibriumModel / LocalCyclicModel -> SCC execution/inspection -> explicit certified or numerical outcomes"
rust = ["crates/antecedent-model/src/nonlinear_equilibrium.rs", "crates/antecedent-model/src/mechanism_expr.rs", "crates/antecedent-model/src/local_cyclic.rs", "crates/antecedent-model/src/system_compile.rs"]
