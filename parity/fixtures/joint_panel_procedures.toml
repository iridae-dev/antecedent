# What each joint-panel procedure claims about its uncertainty and where that is measured.
schema = 1
id = "response.joint_panel_procedures"
capability_ids = []
fixture_dir = "conformance/response/joint_panel"
reference = "conformance/response/joint_panel/expected.json"
public_workflow = "crates/antecedent/tests/joint_panel_workflow.rs"
status = "stated_per_procedure"
measurement_owner = "Q09"
decision_measurement_owner = "E14"
implementation_evidence = "docs/guides/joint-intervention-responses.md"

[[procedure]]
id = "joint_panel.frequentist.whole_contrast"
claim = "Conditional fitted-mean whole contrast under the declared Gaussian group/AR1 law; no nominal interval support."
execution = "Study::prepare_joint_panel -> retained estimate -> aligned whole-functional evaluation -> explicit scoped consumer"
uncertainty = "Local group-cluster sandwich parameter realizations and conditional group-intercept uncertainty; rank deficiency and failed slots preserved."
required_grid = "Independent groups 4/8/32; row counts 24/96; channels 2/3/6; additive/pairwise/higher-order expressions; weak/strong saturation, serial dependence and support; exact prehistory and target/reference laws."
score = "Bias, whole-functional covariance/quantile behavior, failed-fit/slot mass and empirical coverage only for an explicitly declared future interval construction."
status = "no_interval_claim"
standing = "The fitted panel publishes a point contrast and a model-conditional parameter law. No interval is published or supported and no coverage harness measures the fitted panel; the required grid above is the measurement a future interval construction would need."

[[procedure]]
id = "joint_panel.bayesian.whole_contrast"
claim = "Posterior functional under the explicit likelihood/prior; no frequentist coverage or empirical posterior calibration support."
execution = "Actual multi-chain fit -> diagnostic admission -> one shared parameter/group realization per complete world row"
uncertainty = "Proper priors and transformed-coordinate Jacobians; Rhat/ESS/movement; posterior convergence required for complete law consumption."
required_grid = "Same multichannel target grid; prior-predictive SBC, weak likelihood, scale/rho/lag boundaries and realistic group counts."
score = "SBC ranks, whole-functional posterior intervals under matched prior-predictive law, chain failure rate and unsupported design refusal."
status = "no_interval_claim"
standing = "The fitted panel publishes posterior draws under the declared likelihood and prior. No interval is supported and no coverage or simulation-based calibration harness measures them."

[[procedure]]
id = "joint_panel.temporal.selection"
claim = "Model-conditional no-change/piecewise/smooth response change; no unique causal decomposition."
execution = "Full prespecified candidate attempts, selection/smoothing and response evaluation repeated inside each whole-procedure realization"
uncertainty = "Frequentist full-selection parametric bootstrap; Bayesian complete fixed-prior model/path law."
required_grid = "No change, weak/strong change, misspecified smooth change, changing exposures, history and composition; explicit reference windows."
score = "False change declarations, location/path uncertainty, failed/unresolved mass and coarse-response error; unique attribution refusals scored separately."
status = "no_interval_claim"
standing = "Change-point and smooth selections publish a model-conditional response change with their full-selection bootstrap or model/path law. No interval is supported and neither false-change rates nor coverage are measured."

[[procedure]]
id = "joint_panel.program_search"
claim = "Finite-set optimum, compiler-derived continuous global bound where supported, or actual bounded best-found result; numerical optimality and selected-value statistical uncertainty retain distinct assumptions."
execution = "Original data split -> training-only generation/fitting -> actual compiled response -> hard feasibility -> certified or best-found search -> selection -> independent original-observation held-out evaluation; whole-unit resampling repeats every stage"
required_grid = "Candidate count, controls/time axes, nonlinear interactions, binding budgets/restrictions, weak utility separation and uncertainty quality; resource/cancellation failures."
score = "Selected-value coverage, training optimism, held-out bias, operational/risk violations, failures and instability; numerical certificate checks use independent analytic optima and planted nonconcave traps."
calibration_groups = ["joint_response_calibration: joint_response_randomized_selection_exact_ties_l95", "joint_response_calibration: joint_response_randomized_selection_near_ties_l95", "joint_response_calibration: joint_response_randomized_selection_separated_l95", "joint_response_calibration: joint_response_structural_selection_weak_separation_l95"]
status = "selected_value_interval_coverage_measured_by_calibration_groups"
standing = "The held-out value of the selected program has a 95% normal interval with coverage records in the named groups; scope in joint_panel_search.toml. Certificates and best-found search are numerical statements with no statistical claim."

[[procedure]]
id = "joint_panel.experiment_update_decision"
claim = "Conditional FrozenJointImportance update with a supported affine bridge and same-estimand next-sample ranking; no joint refit or new regime identification."
execution = "Full model fit -> experiment/map realizations -> importance update -> changed response/decision -> future-data update/terminal action/net cost"
required_grid = "Bridge uncertainty/dependence, evidence overlap, likelihood concentration, posterior effective weights, unequal future costs and weak terminal utility separation."
score = "Updated-functional calibration under the declared modular law, selected-decision reliability, net-value error, stale/duplicate evidence refusal and failure mass."
status = "updated_interval_coverage_measured_by_calibration_groups"
calibration_groups = ["joint_response_calibration: joint_response_experiment_update_contrast_l95"]
standing = "The updated contrast has a 95% posterior interval with a coverage record in the named group; scope in joint_panel_experiment_acceptance.toml. Decision reliability, net-value error and the next-study ranking are not measured."

[[procedure]]
id = "joint_panel.reference_decomposition"
claim = "Explicitly bound exposure/saturation/population/mechanism reference contributions; identified scope requires every source hybrid and the actual transport theorem. Unique causal attribution remains separate."
execution = "Actual native data -> identification -> F/B fit -> checked root-stratum population transport -> all16hybrids -> all24orders -> full joint covariance/law -> independent contribution truth -> artifact/current replay"
uncertainty = "Native complete-unit covariance or actual aligned posterior law, including supplied weights; fitted panel models retain their original full-procedure initialization/selection/smoothing and failed slots. Order sensitivity is separate."
required_grid = "Static and complete temporal programs; all4parameter/population components, isolated changes and nonlinear interaction/order dependence; unsupported hybrid, response-mechanism selection and baseline latent-confounding counterexamples."
score = "All4component joint coverage/width, complete-slot count, order sensitivity and artifact/current-question matching. The full procedure is measured through the calibration groups below."
calibration_groups = ["joint_response_calibration: joint_response_reference_decomposition_static_l95", "joint_response_calibration: joint_response_reference_decomposition_temporal_l95"]
status = "simultaneous_region_coverage_measured_by_calibration_groups"
standing = "The four Shapley contributions of a population reference decomposition of a randomized source design have a simultaneous 95% region with coverage records in the named groups; scope in joint_panel_decomposition.toml."
