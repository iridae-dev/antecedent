# The calibration gate's groups, in gate order: a group's 1-based position is its
# identity (record logs, the frozen family roster and probes name groups by label and
# position), so a new group is appended and none is ever reordered or removed.
#
# label     `<head>: <filter>`; the log of a group is its label with ` /:` as `_`
# package   the Cargo package of the test binary
# target    "lib", or the integration test target
# features  Cargo features the target is built with
# tests     exact libtest names to run; absent: every ignored test the binary lists
# ignored   whether the tests are #[ignore]d (run with --include-ignored)
# grid      measured at each sample-size grid point (0, 1, 2) rather than once

