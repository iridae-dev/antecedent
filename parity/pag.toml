notes = "GeneralizedAdjustmentIdentifier + IdentificationEnvelope; the mass-weighted PAG ATE / ConditionalEffect, their joint-IF SEs and the Bayesian envelope moments over identified multi-completion MAGs are pinned by conformance/estimate/pag_ate_envelope_identified (1.9); conformance/estimate/pag_ate_envelope is negative evidence (invisible treatment edges, refused)"

[[capabilities]]
id = "pag.identify.response_visibility_id"
status = "done"
evidence_kind = "internal_known_truth"
known_truth_fixture = "conformance/identify/mag_visibility_id"
limitations = "Single-treatment E[Y | do(T)] responses only. Sound, not complete: a completion refused with identify.response.mag_id_refused is not proven non-identifiable, and the complete PAG algorithm (IDP; Jaber, Zhang & Bareinboim 2019) is not implemented. On graphs with at most four observed nodes the step beyond adjustment identifies only null effects (Y not a descendant of T); non-null gains need larger MAGs (pinned five-node case). PAGs are handled per enumerated MAG completion (at most 16 circle endpoints); completions with different functionals give PartiallyIdentified."
notes = "identify_pag_response_general: generalized adjustment per valid MAG completion, then Shpitser-Pearl ID on the completion with every invisible directed edge (Zhang 2008) also read as bidirected. Brute force (crates/antecedent-identify/src/mag_id_bruteforce.rs): for every DAG with <=4 observed and <=2 latent binary nodes (61450 DAGs) plus 3000 sampled 5-observed DAGs (2202 distinct MAGs in all), the latent projection is an edge-subgraph of that ADMG, and every identified mean equals the exact truncated-factorisation truth on a random SCM (71712 checks in the default test, worst error 8e-16; the ignored exhaustive 4-observed/2-latent sweep checks 482285, worst error 7e-16); the same oracle finds the unconfounded MAG-as-ADMG reading numerically wrong on 5815 of the default checks. Circle-free inputs are validated as maximal ancestral graphs"

