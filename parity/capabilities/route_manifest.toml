notes = "Executes through the compiled gcm.simulate route (SimulationTarget PolicyValue, Counterfactual, TemporalRollout, TemporalCounterfactual); the gcm.rs functions policy_value, counterfactual_policy, counterfactual_temporal_policy, sample_temporal_policy and PreparedPolicy::value are hidden engines, and PreparedPolicy keeps program compilation, licence and rebinding. policy_support licenses simulation and counterfactual execution when the overlay compiles. Observational identification is licensed only for a hard Set or an Assign that folds to a constant; a transform or a non-constant assignment is refused with policy_route_not_licensed while remaining simulable. PolicyProgramValue reports the fitted model's value, not an identified estimand; a hard level's identified estimand is AverageEffect or ResponseCurve. No mechanism is fit on this route. Nested counterfactuals and closed-form temporal response paths refuse programs. Not the graphless policy_value license. Inventory: parity/gcm.toml gcm.model.intervention_programs, gcm.model.policy_validation, gcm.model.policy_workflows, gcm.model.prepared_policy."

