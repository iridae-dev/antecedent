notes = "Compiled path: StudyBuilder::mechanisms(MechanismProgram) on an Attribute or Simulate study fits the program inside the GcmAttributeDag / GcmSimulateDag route; the candidate set and selection rule are bound into the lowered statistical program (slot label gcm.registry.standard.best_score or gcm.registry.declared.<digest>), and every result publishes the per-node selection record (AttributionPayload.mechanisms, SimulationPayload.mechanisms). Python FittedGcm keeps its MechanismProgram and reuses its fit by row digest. The selection is part of the compiled program identity (caller-wrapped mechanisms are named as gcm.registry.wrapped.<digest> and never refitted). Why the gap stays: selection uncertainty is target-specific, so it can only be measured on a causal target by refitting the selection inside a whole-procedure resampling of that target; that now exists for intrinsic influence (gcm.attribution.intrinsic_influence whole_procedure) but not as a generic interval for every attribution or simulation target, and none has a coverage record. Next attempt: the same whole-procedure bootstrap on the change-attribution and policy-value targets, with known-truth coverage. Facade crates/antecedent/src/gcm.rs fit_gcm_with and registry_from_candidates; Python FittedGcm.mechanism_selection. Held-out family selection, constraints, and tree-ensemble families exist (parity/gcm.toml evidence_kind=implementation_exists). A selected fit is not a causal identification claim and does not publish mechanism-fit uncertainty as a licensed interval on a response or effect. Additive tree noise is homoscedastic Gaussian. gcm.attribution.intrinsic_influence reports mechanism-fit uncertainty as an uncalibrated, separately unquantified component."

