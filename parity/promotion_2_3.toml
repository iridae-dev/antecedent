[[record]]
id = "2.3B.B4.latent_class_effects"
workstream = "B4"
milestone = "B"
work_package = "B4"
status = "promoted"
consumer_question = "Can per-class treatment effects of a K-class finite mixture of linear outcome models be consumed under a checked semantic contract?"
theorem = "A K-class Gaussian mixture of linear outcome models y = alpha_k + tau_k a + x'beta_k + e_k, e_k ~ N(0, s_k^2), fitted by seeded multi-restart EM with a non-decreasing likelihood. Classes are put in canonical order by (tau, alpha, weight); the mixture-average effect is sum_k pi_k tau_k. Hand-derived anchor: class P (24 rows, y = a + 0.5x + e) and class Q (16 rows, y = 20 - 2a - 0.5x + e) with noise points {+0.5,-0.5,+0.25,-0.25} are so far apart that every responsibility is exactly 0 or 1, so EM returns the within-class regressions: canonical order Q then P, tau = (-2, 1), weights (0.4, 0.6), mixture-average effect -0.2, residual variance 0.15625. Treatment must be declared as-if randomized within class given the covariates; a class below the minimum weight, a degenerate or single-class fit, a constant treatment or outcome, or a non-monotone likelihood refuses. A per-class effect is a mixture-model quantity, not an individual treatment effect. This record grants no interval license."
reference = "TODO.md B4; Dempster, Laird and Rubin (1977), McLachlan and Peel (2000); provenance/b4_latent_class_effects.toml"
guarantee = "latent_class_effects_point_only_local_em_maximum_standard_errors_unmeasured_diagnostics"
graph_class = "Treatment is as-if randomized within each latent class given the measured covariates; this is a declared premise, recorded as declared and never verified. No graph is identified."
population_semantics = "One row snapshot of a single population; class membership is latent and estimated and the number of classes K is declared (at most four), never selected. Effects are per class and for the weighted mixture."
evidence_family = "A deterministic, exactly balanced two-class design with classes far enough apart that every responsibility is 0 or 1, whose within-class OLS recovers the generating coefficients exactly."
provider = "Native implementation; no external provider value is consumed and none is trusted."
estimand = "per-latent-class treatment effects and their mixture-weighted average"
inference_claim = "point_only"
inference_notes = "Claim policy (calibration is measured once at the release cut): the licensed claim is the POINT per-class effects, weights and mixture-average effect. Class and mixture-average standard errors and any bootstrap SE are reported diagnostics labelled calibration 'unmeasured'; no interval is produced and no coverage record is allocated (the registry accepts coverage_records only for a calibrated claim). EM finds a local maximum from seeded restarts, not a certified global one."
owners = ["antecedent-estimate", "antecedent-io", "antecedent", "python/antecedent"]
prerequisite_records = ["2.3A.F18.temporal_effect_constancy"]
prerequisite_reason = "Reuses the F18 calibration-status vocabulary; registration of F18 is not execution of this route."
identity_inputs = ["treatment, outcome and covariate data", "class count and configuration", "restarts, seed and tolerance", "declared randomization premise", "bootstrap seed and replicates", "result values"]
wire_changes = ["Allocate latent_class_effects_v1 as additive v1 metadata in the bounded sectioned artifact container: the data rows (capped), configuration, premises with declared status, the canonical classes, weights, effects, likelihood trace, responsibilities summary, the bootstrap record with calibration 'unmeasured', and one BLAKE3 identity. Unknown major versions refuse; 2.2 wires are never reinterpreted."]
compatibility = "Additive: no 2.2 route or wire changes. This record was created at implementation, so there is no frozen text to depart from. Replay limits: the artifact embeds the data rows and bootstrap replicate count up to caps and a consumer refits from the embedded data and seed, which must reproduce the stored result bit for bit (so replay depends on floating-point determinism of the refit); a changed data, configuration or stored result is refused even when resealed. A consumer refuses a changed identity only against an expected identity it retained itself."
search = false
bounds = { cancellation = true, max_classes = 4, max_coordinates = 1024 }
surface = ["python/antecedent/latent_class.py", "crates/antecedent/src/analysis/latent_class_effects.rs"]
surface_pyo3 = ["python/src/latent_class_api.rs"]
surface_values = ["LatentClassConfig", "LatentClassResult", "PremiseStatus", "LatentClassArtifact", "LatentClassArtifactError", "LatentClassBootstrapWire", "LatentClassConfigWire", "LatentClassDataWire", "LatentClassIdentity", "LatentClassLikelihoodWire", "LatentClassMeta", "LatentClassPremiseRecord", "LatentClassReportWire", "LatentClassRequestWire", "LatentClassWire", "ResponsibilitiesSummaryWire", "LatentClassEffects", "LatentClass", "LatentClassBootstrap", "LatentClassPremise", "LatentClassRefusal", "ResponsibilitiesSummary"]
refusals = [
  { code = "population_not_estimable", detail = "latent_class.degenerate_class", when = "A single class is requested, or the fit collapses to a degenerate class." },
  { code = "population_not_estimable", detail = "latent_class.constant_outcome", when = "The outcome is constant." },
  { code = "population_not_estimable", detail = "latent_class.weak_class", when = "A class falls below the minimum weight or its effect is not separated from another's by the declared gap." },
  { code = "required_option_missing", detail = "latent_class.randomization_not_declared", when = "The caller does not declare that treatment is as-if randomized within class given the covariates." },
  { code = "effect_not_identified", detail = "latent_class.treatment_constant", when = "The treatment is constant, so no class effect is identified." },
  { code = "design_rank_deficient", detail = "latent_class.design_support_too_small", when = "A class has too little design support to estimate its regression." },
  { code = "mechanism_fit_not_converged", detail = "latent_class.likelihood_not_monotone", when = "The EM log-likelihood decreases beyond rounding." },
  { code = "mechanism_fit_not_converged", detail = "latent_class.not_converged", when = "No restart converges within the iteration limit." },
  { code = "invalid_argument", detail = "latent_class.too_many_classes", when = "More than four classes are requested." },
