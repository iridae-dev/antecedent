  { code = "invalid_argument", detail = "sampled_recovery.invalid_input", when = "A malformed row set, snapshot, derivation or configuration." },
  { code = "invalid_argument", detail = "sampled_recovery.receipt_mismatch", when = "A stored receipt does not match its recomputed digest or replay." },
  { code = "transport_budget_cancel", detail = "sampled_recovery.cancelled", when = "Cancellation stopped the bootstrap; no partial interval is reported." },
