  { id = "f7.distinct_fields.artifact", role = "artifact", intent = "The artifact keeps the feasibility fields distinct.", evidence_test = "crates/antecedent-design/tests/inverse_query_artifact.rs", evidence_assertion = "f7_artifact_keeps_the_feasibility_fields_distinct" },
  { id = "f7.python_fresh_replay.artifact", role = "artifact", intent = "Python exports and replays the result and refuses a resealed mutation.", evidence_test = "python/tests/test_inverse_query.py", evidence_assertion = "test_f7_result_is_exported_replayed_and_refuses_a_resealed_mutation" },
