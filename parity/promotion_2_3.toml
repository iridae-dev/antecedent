[[record]]
id = "2.3A.X8.transported_additive_counterfactual"
workstream = "X8"
milestone = "A"
work_package = "A5"
status = "promoted"
consumer_question = "Can a static path-specific counterfactual contrast (a natural direct or indirect effect, or any edge assignment) be transported to a named target population under a stated affine additive-noise structural class?"
theorem = "Derived in-repo (module documentation of crates/antecedent-counterfactual/src/transported_path_specific.rs), not inherited. Class: a Markovian static DAG with pre-treatment covariates Z whose finite-support law may differ between source and target, a treatment A that is only set, and mechanism nodes V_i = alpha_i(Z) + sum_p beta_ip(Z) V_p + U_i with alpha and beta affine in Z and mutually independent noises independent of Z. Checked from the supplied objects: no selection node points to a mediator or the outcome (only to a covariate or the treatment), the target support lies inside the source support (exact-point matching on finite support), and the model is well formed and acyclic. Declared by the caller and never checked: additive noise, noise laws shared between the populations and independent of the covariates, the unit-level cross-world coupling (one exogenous draw per unit fed to both worlds), and that the supplied source fit equals the structural equations. Conclusion: the target path-specific contrast is the sum over z of P_T(z) G(z), with G(z) = Y_{g+}(z,u) - Y_{g-}(z,u) the same for every u (the noise cancels because the equations are affine in the endogenous parents) and computed from the source equations alone; it composes the fixed-population edge-intervention contrast with the covariate-selected transport formula. A selection on a mediator or outcome mechanism is outside the class: two models that agree on the whole source population can differ on the target contrast, and when the contrast is sensitive to the selected coefficient the refusal carries an explicit two-model witness (transport_proven_non_transportable), otherwise cell_not_licensed without a witness. Departure from the frozen wording: only this narrow class is proved; the general class (nonparametric mechanisms, recanting witnesses, nonlinear additive noise) remains the carried_forward record 2.3A.X8.transported_path_specific_counterfactual. Path-specific effects follow Pearl (2001) and Avin, Shpitser and Pearl (2005); the covariate-selected transport formula follows Bareinboim and Pearl; no theorem number is claimed."
reference = "TODO.md A5; prerequisites 2.2A.X8.path_specific_edge_intervention and 2.2A.X2.finite_scenario_envelope; provenance/x8_transported_additive_counterfactual.toml"
guarantee = "affine_additive_markovian_class_target_contrast_sum_over_target_covariate_law_declared_noise_premises_point_only"
graph_class = "Static fully observed Markovian DAG with affine additive-noise mechanisms and selection only on covariates or the treatment; no latent confounding, no selection on a mediator or outcome mechanism, no temporal structure."
population_semantics = "Named source and target populations over the same variables, with finite-support covariate laws; the structural equations of every mediator and outcome node and the noise laws are shared between them, and each unit carries one exogenous draw into both worlds of the contrast."
evidence_family = "A supplied source structural fit (affine coefficients), finite-support source and target covariate laws, a selection diagram, the source and target observational regime evidence tokens, and the caller's declared premises."
provider = "antecedent_counterfactual::transported_path_specific::evaluate_transported_path_specific, sealed by antecedent_io::transported_counterfactual_artifact and exposed through antecedent::analysis::transported_counterfactual, python/src/transported_counterfactual_api.rs and python/antecedent/transported_counterfactual.py."
estimand = "The target-population path-specific edge-intervention mean contrast for two named edge assignments (natural direct, natural indirect or any assignment), with the source contrast, the per-unit contrast at every target support point and the derivation that separates checked from declared premises."
inference_claim = "point_only"
inference_notes = "A point under a fully specified structural fit: no interval, no sampling uncertainty in the supplied fit, and calibration unmeasured. Source-fit identification is declared, not verified, and nonparametric identification from data is not claimed. Overlap is exact-point matching on finite support."
owners = ["antecedent-counterfactual", "antecedent-io", "antecedent", "python/antecedent"]
prerequisite_records = ["2.2A.X8.path_specific_edge_intervention", "2.2A.X2.finite_scenario_envelope"]
identity_inputs = ["structural model (covariates, treatment, affine mechanisms)", "source and target covariate laws", "selection diagram", "edge assignments", "declared premises", "regime evidence tokens"]
wire_changes = ["Additive transported_counterfactual artifact (format version 1, bounded container of at most 64 MiB) carrying the request (model, laws, selection, assignments, premises, evidence), the result (target and source contrasts, per-unit contrasts, derivation) and an identity; a consumer recomputes the contrast and accepts only an equal result, and refuses a resealed change against an identity it retained independently. No 2.2 wire is reinterpreted."]
compatibility = "Additive: no 2.2 route or wire changes. This record covers only the narrow affine additive-noise class. The older record 2.3A.X8.transported_path_specific_counterfactual stays carried_forward for the GENERAL class and its closed gate is unchanged. Both records use the transported_counterfactual refusal namespace; the older record is not implemented, so this record, the only implemented record in the namespace, declares every detail the non-test source emits, including route_frozen, factor_missing and invalid_factor that the gate shares with the closed route. Synchronous finite computation without a cancellation hook; bounds.cancellation is recorded because the registry gate requires it."
search = false
bounds = { cancellation = true, max_covariates = 64, max_mechanisms = 256, max_support_points = 65536, max_declarations = 256, max_artifact_bytes = 67108864 }
