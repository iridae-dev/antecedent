[[record]]
id = "2.3A.X4.joint_bayesian_transport"
workstream = "X4"
milestone = "A"
work_package = "A2"
status = "carried_forward"
consumer_question = "What target effect posterior follows from a declared joint source and target model and the supplied transport evidence?"
theorem = "Exact conjugate Gaussian joint source-target linear model with declared known noise variance (antecedent_estimate::joint_bayesian_transport): per source s, Y | A, X ~ Normal(w'theta + v'gamma_s, sigma_s^2), an invariant block theta shared by every source and the target, a population-varying block gamma_s that never interacts with treatment, independent dense Gaussian priors. The joint posterior of (theta, gamma_1..gamma_B) is Gaussian with precision P0 + sum_s Z_s'Z_s / sigma_s^2 and mean Sigma (P0 m0 + sum_s Z_s'y_s / sigma_s^2); the engine reports these exact moments and draws aligned joint samples (one draw is one realization of every parameter and effect, so source-target coupling through theta is preserved; draws are iid, effective sample size equals the draw count). The target effect is the posterior of psi = c_t'theta, the average intervention effect over the target covariate sample. Departures from the frozen wording: the likelihood is Gaussian with KNOWN variance (the unknown-variance case is not modeled, so an interval would not account for estimating sigma^2), there is no MCMC or numerical approximation, and the oracle is a Gaussian closed form (an independently coded dense inversion in the test file), not the Beta-binomial example once allocated in the evidence ledger. Prior mass never changes structural identification: identification is the supplied 2.2 certificate (direct or standardization), read once. The conjugate posterior is textbook Bayesian linear regression (the Normal linear model with a Gaussian prior, as in Lindley and Smith 1972 and Gelman et al., Bayesian Data Analysis 3rd ed., chapter 14); no theorem number is claimed. Calibration (frequentist coverage of the credible interval) is UNMEASURED: no coverage is claimed and the public route stays closed."
reference = "TODO.md A2; prerequisite 2.2A.X4.learned_continuous_trial_transport; provenance/x4_joint_bayesian_transport.toml"
guarantee = "exact_conjugate_gaussian_joint_posterior_known_variance_calibration_unmeasured_route_closed"
graph_class = "The fixed DAG and selection assumptions of a separately licensed 2.2 transport derivation; no ADMG or graph-class posterior in this cell."
