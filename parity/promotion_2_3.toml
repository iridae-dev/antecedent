[[record]]
id = "2.3B.B3.mechanism_discrepancy_diagnostic"
workstream = "X3"
milestone = "B"
work_package = "B3"
status = "promoted"
consumer_question = "Do an independent source sample and an independent target sample, measured on comparable scales, show a detectable difference between the linear conditional mechanism of one node given its parents, and which coefficient differences could this comparison have detected?"
theorem = "Acceptance boundary (hand-derived numbers; Type I error and power are NOT measured here). For a node V with parents pa (names, units and one measurement protocol id declared per sample) each of two INDEPENDENT samples is summarized by n, X'X, X'y and y'y (p = 1 + |pa| design columns, residual degrees of freedom n - p of at least 2) and fitted by OLS, b = (X'X)^-1 X'y, s2 = RSS/(n - p), Vhat = s2 (X'X)^-1. The null is that ONE linear coefficient vector E[V | pa] is shared by the source and the target; the intercept is always fitted and whether it enters the comparison is declared. With d = b_target - b_source over the compared coefficients the Wald statistic is W = d' (Vhat_s + Vhat_t)^-1 d, referred to chi-square with df equal to the number of compared coefficients; the per-coefficient breakdown reports d_j, se_j = sqrt(Vhat_s,jj + Vhat_t,jj), the two-sided normal p-value and its Holm adjustment. The minimal detectable difference of coefficient j is (z_{1-alpha/2} + z_{power}) se_j at the declared alpha and power (normal quantiles by bisection on erfc; 1.959964 and 0.841621 at 0.05 and 0.8). Anchors: x = [0,1,2,3] and y_s = [1,3,2,4] give b = [1.3, 0.8], s2 = 0.9 and Vhat = [[0.63,-0.27],[-0.27,0.18]]; a target y_s + 0.5x compared on the slope alone has W = 0.25/0.36 on df 1 with p = erfc(sqrt(W/2)); a target y_s + 0.5 + 0.5x compared on both coefficients has W = 25/6 on df 2 with p = exp(-25/12), slope se 0.6 and minimal detectable slope difference 2.801585 x 0.6; identical samples give W = 0 and p = 1 exactly; the two-parent frozen data of the vector-treatment cell give the slope-block statistic (9 + 3 + 2.25)/(72 x 3.25/18). Non-rejection NEVER certifies invariance: non_rejection_certifies_invariance is false on every result and the caveat and the minimal detectable differences travel with it. The test informs only a selection node on the node itself and is a linear-Gaussian-mean diagnostic. Incomparable measurements (a different node, parent set, unit or protocol id, or a blank declaration) refuse, and shared units or an unknown dependence refuse because the summed covariance is valid only for independent samples. Every statistic, standard error, p-value and minimal detectable difference is a diagnostic labelled calibration unmeasured; no interval, coverage or invariance license is granted."
reference = "TODO.md B3; Wald (1943) quadratic-form test; two-sample Wald comparison of regression coefficients; Holm (1979); provenance/b3_mechanism_discrepancy.toml"
guarantee = "asymptotic_wald_discrepancy_diagnostic_non_rejection_never_certifies_invariance_point_only_error_rates_unmeasured"
graph_class = "No graph is identified: the diagnostic compares the linear conditional mechanism of one declared node given its declared parents between two samples; it informs only a selection node on that node and does not identify, orient or test a graph."
population_semantics = "Source and target are separate named samples measured on the same units, coordinates and protocol id; the node, parents, units and protocol id are part of the identity. Independence of the two samples is declared and refuses when units are shared or dependence is unknown."
evidence_family = "Hand-derived one-parent and two-parent OLS fits with df 1 and df 2 closed-form statistics and tails, exact-zero statistic for identical fits, normal-quantile minimal detectable differences, parent-order invariance, summary-statistics replay of the raw-data result, comparability and dependence refusals, degenerate designs, and resealed, tampered, unknown-version and corrupt variants of the artifact."
provider = "Native implementation; no external provider value is consumed and none is trusted. The artifact retains the expected identity out of band."
estimand = "Wald test of equal linear conditional-mechanism coefficients between independent source and target samples, with per-coefficient minimal detectable differences"
inference_claim = "point_only"
inference_notes = "Claim policy (calibration is measured once at the release cut): the statistic, degrees of freedom, p-values, Holm-adjusted p-values, standard errors and minimal detectable differences are diagnostics labelled calibration 'unmeasured' (inference claim asymptotic_wald_calibration_unmeasured). No interval is produced, no coverage record is allocated and no claim that the mechanism is invariant is made: failing to reject is attached to the minimal detectable differences, never to invariance."
owners = ["antecedent-estimate", "antecedent-io", "antecedent", "antecedent-py", "python/antecedent"]
prerequisite_records = ["2.2B.X3.joint_mechanism_sensitivity"]
prerequisite_reason = "Both records reason about how far a conditional mechanism may differ between a source and a target; the 2.2 record bounds a stated deviation, this one tests for a detectable one. No computation is shared and registration is not execution."
identity_inputs = ["measurement contract (node, node unit, parents and units, protocol id)", "source and target evidence (label, n, X'X, X'y, y'y)", "null statement", "design (compared coefficients, alpha, power, declared dependence)", "alignment, dependence assumption and caveat texts", "result digest"]
wire_changes = ["Allocate mechanism_discrepancy_v1 as an additive artifact kind in the bounded sectioned container with a metadata section and a numerical section: feature marker, null text, inference claim, calibration status 'unmeasured', alpha, power, dependence declaration, alignment and dependence texts, the per-population measurement and summary statistics, the result (statistic, df, p-value, conclusion, non_rejection_certifies_invariance, detectability factor, power statement, per-coefficient breakdown), caveats and a BLAKE3 identity over the measurement, both evidence sets, the null and the design. A consumer recomputes the result from the stored summary statistics and refuses a stored result that does not replay even when the container is resealed; the expected identity is retained by the consumer out of band. Unknown major versions and feature markers refuse; 2.2 wires are never reinterpreted."]
compatibility = "Additive: no 2.2 route or wire changes. This record was created at implementation, so there is no frozen text to depart from. Scope is a diagnostic with unmeasured error rates, not a test with a licensed size or power and not an invariance certificate. The artifact is bounded by container bytes (16 MiB) and a parent-count bound of 64 and is refused before decoding when oversized; a consumer holding no retained expected identity checks only internal consistency and replay. The Python bridge reports malformed requests, artifacts and identities under the mechanism_discrepancy namespace. Synchronous finite computation without a cancellation hook; bounds.cancellation is recorded because the registry gate requires it."
search = false
bounds = { cancellation = true, max_coordinates = 1024, max_bytes = 16777216 }
