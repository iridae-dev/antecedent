  { id = "x10.chain_head_witness.negative", role = "negative", intent = "Head self-censoring and an independent tail are also witnessed.", evidence_test = "crates/antecedent-identify/tests/b2_recovery_chain.rs", evidence_assertion = "b2_head_self_censoring_and_independent_tail_are_also_witnessed" },
