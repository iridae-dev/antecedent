[[record]]
id = "2.3B.F6.robust_verdicts_and_result_artifact"
workstream = "F6"
milestone = "B"
work_package = "B0 prerequisite"
status = "promoted"
consumer_question = "Can the robustness verdict of a decision under structural uncertainty, and its replayable result with retained external-callback receipts, be consumed under a checked semantic contract?"
theorem = "Acceptance boundary: with structures s1 (A=5, B=3) and s2 (A=6, B=2) A is StructurallyRobust with ranges A in [5,6] and B in [2,3]; with s2 (A=1, B=4) there is a GraphDependentChoice listing each structure's leader and no selected action. A structure that fails a support rule for every action is set aside: if A still wins with and without it the verdict is SupportRobust, if ignoring support changes the choice it is SupportDependent, and when no structure supports an action it is UnsupportedExtrapolation. An unidentified or unevaluated structure gives InsufficientClaims, exclusions or hard constraints that remove every action give NoAdmissibleAction, and WorstCaseChoice, BayesChoice (0.5*5+0.5*1 = 3.0 against 0.5*3+0.5*4 = 3.5, with unresolved and unsupported mass reported and never normalized away) and ReportOnly (never chooses) follow the declared policy. An external-callback value keeps its receipt (provider, snapshot, request fingerprint, attested value, trust limit) through export and replay and is never labelled native: ExternalTrustLimit has no native variant. This record grants no causal, interval or probability license."
reference = "TODO.md B0 prerequisite; prerequisite feature records F4, F6"
guarantee = "robustness_verdicts_over_supplied_structures_with_replayable_result_and_retained_external_receipts_point_only"
graph_class = "Only an independently identified fixed-graph or declared structural-scenario contract; this composition cell does not identify a graph."
population_semantics = "Population, regime, horizon, conditioning, coordinate support and source/target snapshot identities remain separately bound."
evidence_family = "Two structures with hand-set payoffs for actions A and B, with per-structure and per-input support statuses and an optional external-callback receipt."
provider = "Native evaluation of supplied laws; an external-callback value is retained with its receipt and trust limit and is never upgraded to native."
estimand = "robustness verdict under structural uncertainty"
inference_claim = "point_only"
