  { id = "f18.invalid_covariance.negative", role = "negative", intent = "A malformed cross-partition covariance refuses with effect_constancy.invalid_covariance rather than falling back to independence.", evidence_test = "crates/antecedent-estimate/tests/effect_constancy.rs", evidence_assertion = "f18_incompatible_partition_invalid_covariance_refuses" },
  { id = "f18.resealed_identity.negative", role = "negative", intent = "A consistently resealed artifact with a changed partition identity is refused against the identity the consumer retained.", evidence_test = "crates/antecedent-io/tests/effect_constancy_artifact.rs", evidence_assertion = "f18_artifact_resealed_partition_identity_is_refused" },
