[[record]]
id = "2.3A.X2.scenario_invariance_report"
workstream = "X2"
milestone = "A"
work_package = "A1"
status = "promoted"
consumer_question = "For each scenario of a finite transport scenario set, which selection differences does it assume, which invariances does its identified formula rely on, and what stands behind each extreme of the range over scenarios?"
theorem = "A report read off the verified 2.2 classical catalog derivation of each scenario, not a new decision. Per scenario it lists the selection differences (the selection targets, the shared mechanisms, every other variable, and the directed and bidirected edges the scenario assumes). For an identified scenario it lists the invariances the formula relies on: the distribution leaves under the root expression of the checked derivation are partitioned by population, each source leaf is attributed to the reachable leaf-producing proof step (sid.line10, transport.direct or transport.pretreatment_standardize) whose output contains it, and the leaf is reported with its variables, conditioning variables, do set, catalog regime and rule, together with the mechanisms of its variables that the formula takes as shared between source and target; target factors are listed apart because they are target laws, not invariances. The S-admissibility of those factors was already established by the checker, so nothing is re-decided here. A source leaf that no proof step produced contradicts the derivation and its formula and is refused. A scenario that is not identified reports its structural obstruction instead (the s-hedge or witness variables), and one whose evidence is missing reports its undecided status and obligations, never an invariance list. The range over scenarios lists, for each envelope extreme, the scenario behind it with its edges, selections and invariances. Each report has a canonical text and an identity inv.v1.<blake3> that ignores edge, selection and scenario order. Selection-diagram transportability and S-admissibility follow Bareinboim and Pearl (2013, 2014); the extraction is original engineering on the 2.2 derivation and claims no theorem beyond reading the verified proof."
reference = "TODO.md A1; prerequisite 2.2A.X2.finite_scenario_envelope; provenance/x2_scenario_invariance_report.toml"
guarantee = "report_read_from_the_verified_derivation_selection_differences_invariances_obstruction_structural_no_new_decision"
graph_class = "The static selection diagrams the 2.2 classical catalog transport route decides (fully observed static nodes with directed and bidirected edges and selection targets); a non-static node refuses. Scope is inherited unchanged from that route."
population_semantics = "One source and one target population per scenario set; the report names the population of every factor, the regime it is read from and which mechanisms are assumed shared. It adds no evidence and no population."
evidence_family = "A prepared and estimated 2.2 transport scenario stage; the report is derived from the stage's scenarios and decisions and needs no data."
provider = "antecedent_identify::sid::scenario_invariance::invariance_report (per scenario) and antecedent_estimate::scenario_invariance_report::scenario_set_invariance_report (per set and envelope extreme), exposed through python/src/scenario_invariance_api.rs and python/antecedent/scenario_invariance.py."
estimand = "None: a structural report of assumptions and invariances per scenario and per envelope extreme. It states what an answer rests on, not whether the assumptions hold."
inference_claim = "structural_envelope"
inference_notes = "Structural only: the report lists assumptions and carries no value, interval or inference. The envelope it explains is the unweighted 2.2 structural range."
owners = ["antecedent-identify", "antecedent-estimate", "antecedent", "python/antecedent"]
prerequisite_records = ["2.2A.X2.finite_scenario_envelope"]
identity_inputs = ["scenario graph and selection targets", "verified derivation and its formula", "catalog regime ids", "scenario evaluation status", "envelope extremes"]
wire_changes = ["None: the report is derived and has no artifact of its own. It is recomputable from the scenario stage (and from the 2.2 scenario artifact that stage exports), which is left unchanged and does not embed the report. The canonical identity inv.v1.<blake3> is a recomputation check, not a seal."]
compatibility = "Additive: no 2.2 route, wire or field changes. The artifact fixture role is a recomputation-identity test: because the report is derived, the artifact evidence is that recomputing it from the same decision (in any supply order, with any edge or scenario naming) reproduces the same identity and canonical text, and that reporting leaves the stage export unchanged. Synchronous finite computation without a cancellation hook; bounds.cancellation is recorded because the registry gate requires it."
search = false
bounds = { cancellation = true, max_scenarios = 64 }
refusals = [
  { code = "invalid_argument", detail = "scenario_invariance.derivation_inconsistent", when = "A source distribution leaf of the verified formula is attributed to no proof step of its own derivation, so the formula and the proof disagree." },
  { code = "invalid_argument", detail = "scenario_invariance.non_static_node", when = "A scenario graph node is not a static variable." },
  { code = "not_executed", detail = "scenario_invariance.not_estimated", when = "The scenario stage has not been estimated yet, so there is no evaluated result to report on." },
  { code = "invalid_argument", detail = "scenario_invariance.wrong_result_type", when = "The object supplied is not a prepared transport scenario stage." },
  { code = "invalid_argument", detail = "scenario_invariance.refused", when = "Fallback detail of the Python bridge when an underlying refusal message carries no detail prefix of its own." },
]
routes = [
  { name = "antecedent.invariance.scenario_invariance_report", stage = "evaluate", status = "licensed", claim = "structural_envelope", covers = ["invariance_report", "scenario_set_invariance_report"] },
]
surface = ["python/antecedent/scenario_invariance.py"]
surface_rust = ["crates/antecedent-identify/src/sid/scenario_invariance.rs", "crates/antecedent-estimate/src/scenario_invariance_report.rs"]
surface_pyo3 = ["python/src/scenario_invariance_api.rs"]
surface_values = ["InvarianceReportError", "SelectionDifferences", "SourceInvariance", "TargetFactor", "ConditionalReduction", "ObstructionWitness", "InvarianceBody", "InvarianceReport", "EnvelopeSide", "ScenarioInvariance", "EnvelopeExtremeInvariance", "ScenarioSetInvarianceReport", "ScenarioInvarianceRefusal"]
fixtures = [
