[[record]]
id = "2.3B.X6.proposal_receipt"
workstream = "X6"
milestone = "B"
work_package = "B0"
status = "promoted"
consumer_question = "Can the evidence a failed identification contract owes be linked, per proposed study, to the design ranking that values that study, with a verifiable bundle and a re-identification on arrived evidence that never treats a hypothetical derivation as available evidence?"
theorem = "Acceptance boundary: a ProposalReceipt binds, by identity and digest and never by copy, the frozen base failure a proposal repairs (repair family, failed contract, unresolved obligation ids, premises and data digests), the hypothetical delta and the derivation the repair family verified on it, the candidate's declared cost and size, the evidence lineage and provider snapshots, the ranking entry (signal request, signal identity, EVSI, net value, rank) and the decision it is a value of. Hand anchors: in the back-door contract Z1 and Z2 each confound T -> Y so the only admissible adjustment set is {Z1, Z2} and only one observational joint law over (T, Y, Z1, Z2) repairs it, while a study of (T, Y, Z1) alone stays insufficient; in the transport contract X -> Y with a selection mechanism on X the source experiment do(X) measuring Y repairs it and a source observation does not. For a binary state guessed for utility 1 with prior 1/2, a signal of accuracy a has EVSI = a - 1/2 (3/4 gives 1/4, 5/8 gives 1/8), and with cost 0.01 utility per USD the 20 USD study has net value 1/4 - 1/5 = 1/20 and the 5 USD study has 1/8 - 1/20 = 3/40, so the cheaper study ranks first. A receipt is always hypothetical and never available evidence. The bundle identity covers both artifact digests, the decision contract and every receipt in canonical candidate order, so it does not depend on the order proposals were supplied in. Verification recomputes each receipt from the two retained sealed artifacts and refuses a candidate present in only one, a changed delta, a swapped signal, a changed cost, lineage, value or decision identity, an unsealed artifact, and a bundle that does not cover exactly the ranked candidates. On arrival the repair family's own checker is re-run on the arrived evidence alone: the exact proposed law is verified, a delivery without the needed joint law is still insufficient, and a different population or regime invalidates the derivation. This record grants no causal, interval or probability license."
reference = "TODO.md B0 X6; prerequisite records 2.2B.X6.study_planning, 2.3B.F13.identification_repair, 2.3B.F14.design_ranking_artifact and 2.3B.F12.evsi"
guarantee = "per_proposal_receipt_binds_repair_and_ranking_by_identity_hypothetical_never_evidence_family_checker_on_arrival_point_only"
graph_class = "Only an independently identified fixed-graph or declared structural-scenario contract (the failed back-door or transport contract of the repair); this receipt does not identify a graph and does not execute a study."
population_semantics = "Population, regime, horizon, conditioning, coordinate support and source and target snapshot identities remain separately bound; an arrival in a population or regime other than the premises the derivation was verified under invalidates it."
evidence_family = "A back-door contract with confounders Z1 and Z2, a transport contract X -> Y with selection on X, and a binary-state decision with EVSI a - 1/2 and costed candidates of 20 USD and 5 USD."
provider = "Native receipt over the existing repair and ranking artifacts; an exact-request external signal provider keeps its own trust label and the receipt never upgrades it."
estimand = "per-proposal receipt linking identification repair and design ranking"
inference_claim = "point_only"
inference_notes = "Claim policy (calibration is measured once at the release cut): the licensed claim is the binding of identities and the re-run of the repair family's checker, with the EVSI and net-value numbers retained exactly as their own routes computed them. No interval, coverage or probability claim is made; any standard error or diagnostic reported by those routes stays labelled calibration 'unmeasured', and no coverage record is allocated (the registry accepts coverage_records only for a calibrated claim)."
owners = ["antecedent-design", "antecedent-py", "python/antecedent"]
prerequisite_records = ["2.2B.X6.study_planning", "2.3B.F13.identification_repair", "2.3B.F13.repair_search_receipt", "2.3B.F14.design_ranking_artifact", "2.3B.F12.evsi"]
prerequisite_reason = "Extends the executing 2.2 study-planning cost ranking and links the 2.3 identification-repair and design-ranking artifacts; requires the listed feature contracts, and registration is not execution."
identity_inputs = ["repair artifact digest", "ranking artifact digest", "base failure: family, contract, obligation ids, premises digest and data digest", "hypothetical delta and verified derivation", "candidate cost, lineage, signal request and identity, EVSI and net value", "decision contract"]
wire_changes = ["None: no new artifact kind. The receipt and bundle are values with their own BLAKE3 identities (a receipt schema and a bundle schema label are hashed into every identity); the PyO3 bridge carries them, and the verifier reads the existing repair report artifact and design_ranking_v1 artifact by seal and digest. Unknown major versions refuse; 2.2 wires are never reinterpreted."]
compatibility = "Additive: no 2.2 route or wire changes. A hypothetical derivation is never available evidence; on_arrival re-runs the family checker and never reuses the recorded derivation as a verdict. Re-identification covers the back-door and transport repair families only. The record makes no claim that a proposed study will deliver the hypothetical evidence or about the EVSI and net values it binds. A consumer holding no retained expected identity checks only internal consistency. Synchronous finite computation; re-identification observes cancellation and reports it as arrival_cancelled, and bounds.cancellation is recorded because the registry gate requires it."
search = false
bounds = { cancellation = true, max_coordinates = 1024 }
surface_rust = ["crates/antecedent-design/src/proposal_receipt.rs"]
surface_values = ["ProposalReceiptError", "EvidenceState", "BaseFailureBinding", "HypotheticalBinding", "CostBinding", "LineageBinding", "ValuationBinding", "DecisionReceipt", "ProposalReceipt", "ProposalBundle", "ObservedLaw", "ArrivedEvidence", "Arrival", "ChangedPremise", "ArrivalVerdict"]
