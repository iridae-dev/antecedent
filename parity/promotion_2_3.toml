[[record]]
id = "2.3C.C2.selective_recalculation"
workstream = "C2"
milestone = "C"
work_package = "C2"
status = "promoted"
consumer_question = "Can a causal workflow be recalculated selectively, reusing the stage artifacts whose declared inputs and upstream identities are unchanged, recomputing only what changed, refusing what a fresh process cannot supply, and proving the reuse by counted cross-fitted fold fits rather than by the plan alone?"
theorem = "Acceptance boundary (all counts are exact integers). The executor drives the cross-fitted AIPW average effect with 5 folds and 2 nuisance sets, so a first run does 1 identification, 10 fold fits, 1 score build, 1 reweight and 1 decision and reuses nothing. A utility-only change recomputes only the utility input and the decision: 0 identifications, 0 fold fits, 0 score builds, 0 reweights, 1 decision, with the law bit-identical. A compatible target-weight change under a licensed retarget recomputes the target population, the law and the decision with 0 fold fits and 0 score builds, 1 reweight and 1 decision, equal to an independent rerun; without a declared retarget licence the same change recomputes the score artifact (a refit), and an incompatible target is refused at the law with the decision blocked. Changed folds or RNG, new outcomes, or a changed graph, query or regime recompute exactly the stages downstream of the changed input, and for every stage the plan names the dependency that determined its status. A change to one external study invalidates only that study's provider request, prior and the decision. In a fresh process no derived stage is reused unless portable scores are supplied and then never the law or the decision; a missing fit, data snapshot or provider is refused naming which; an off-grid or unsupported request is refused (naming a separately licensed route when one exists). The per-call batch cache is not a persistent fit cache: a second session fits again. This record grants no interval, coverage or probability license."
reference = "TODO.md C2 selective recalculation; provenance/c2_selective_recalculation.toml (papers = [] by explicit judgment)"
guarantee = "selective_recalculation_stage_plan_and_counted_fold_fit_reuse_point_only_no_interval_no_persistent_cache"
graph_class = "No new graph is identified: the planner compares declared stage identities, and the executor runs the existing identify-and-estimate route for a binary treatment under the caller's accepted graph and adjustment set. The retarget licence and the declared inputs are caller declarations, recorded and never verified here."
population_semantics = "The source population, target population and its row weights, the row design and the treatment grid are separate declared stages; a target change is a reweight of frozen scores only when the retarget route is declared licensed and the weights are a licensed function of the adjustment set."
evidence_family = "Full stage tables written out per mutated input (utility, target population, external study, data snapshot, folds or RNG, graph, query, regime), fresh-process boundary cases, and a deterministic binary-treatment dataset whose cross-fit cache reports the fold fits actually run (10 on a first run, 0 on a utility-only change and on a compatible retarget)."
provider = "Native implementation. The external-study, provider-request and prior stages are plan-level only: they are planned and refused or blocked but no external provider is called or trusted by the executor, and a supplied provider is never upgraded to native."
estimand = "stage reuse plan and cross-fitted AIPW average effect with a net-benefit decision under selective recalculation"
inference_claim = "point_only"
inference_notes = "Claim policy (calibration is measured once at the release cut): the licensed claim is the plan table and the counted work, plus the point law and net benefit of the existing AIPW route. The law standard error is a reported diagnostic labelled calibration 'unmeasured'; no interval is produced and no coverage record is allocated (the registry accepts coverage_records only for a calibrated claim)."
owners = ["antecedent-core", "antecedent", "antecedent-py", "python/antecedent"]
prerequisite_records = []
prerequisite_reason = "A new planning and instrumentation cell with no executing 2.2 predecessor: it reuses the existing prepared-study architecture (prepare, refresh, retarget) without changing it, and registration is not execution."
identity_inputs = ["graph, query, regime and evidence", "source and target populations and row weights", "data snapshot and row design", "treatment grid", "learner, folds and RNG", "utility declaration", "external studies and their branch indices", "retarget and request support declarations", "process boundary and resume context"]
wire_changes = ["None: no new artifact kind in this record. The stage model, plan, counts and receipt are in-process values; the portable receipt artifact (recalc_receipt_v1) is owned by 2.3C.C2.recalc_receipt_artifact. The PyO3 bridge exchanges plans, counts and refusals as bounded JSON. 2.2 wires are never reinterpreted."]
compatibility = "Additive: no 2.2 route or wire changes, and the existing prepared-study route is driven unchanged. This record was created at implementation, so there is no frozen text to depart from. Point-only: the executor reports the point law and a net benefit and no interval. Reuse is limited to what the caller still holds in process or names in the resume context; reuse is never claimed across a process boundary for the law or the decision, and the planner trusts declared capabilities and own-input digests without verifying them. The Prior and ProviderRequest stages and external-study mutations are exercised through the plan only. Refusals use plain recalc.<snake_case> literals; the artifact record owns the recalc_receipt.* details. Synchronous finite computation without a cancellation hook; bounds.cancellation is recorded because the registry gate requires it."
search = false
bounds = { cancellation = true, max_coordinates = 1024, max_external_branches = 8 }
surface = ["crates/antecedent/src/analysis/recalc_receipt.rs"]
surface_rust = ["crates/antecedent-core/src/recalc.rs"]
