]
fixtures = [
  { id = "f12.known_truth.positive", role = "positive", intent = "Against the enumerated finite law, current value 1/2, post-signal value 3/4, EVSI 1/4 and EVPI 1/2; a utility-unit study cost 1/10 gives net 3/20, and net value appears only with a cost-to-utility map (a usd cost scaled by 2 gives 1/4 - 1/5).", evidence_test = "crates/antecedent-design/tests/evsi.rs", evidence_assertion = "f12_frozen_record_values_and_net_value_only_with_a_cost_mapping" },
  { id = "f12.gaussian_closed_form.positive", role = "positive", intent = "The Gaussian-mean signal under a normal belief matches the closed form: EVSI 0.04165773529384315 and EVPI 0.19779655740130607, integration exact, Bayes action treat, trust native_licensed.", evidence_test = "crates/antecedent-design/tests/evsi.rs", evidence_assertion = "f12_gaussian_mean_matches_the_closed_form_normal_linear_loss_value" },
  { id = "f12.binomial_enumeration.positive", role = "positive", intent = "A binomial bet decision gives EVSI 1/16 and EVPI 1/8 identically for the native signal and for an external likelihood, an external posterior and external decision values.", evidence_test = "crates/antecedent-design/tests/evsi.rs", evidence_assertion = "f12_binomial_enumeration_matches_native_and_every_external_update_mode" },
  { id = "f12.bounds_invariance.positive", role = "positive", intent = "EVSI is non-negative, no greater than EVPI, and scales under a positive affine utility change U' = aU + b.", evidence_test = "crates/antecedent-design/tests/evsi.rs", evidence_assertion = "f12_evsi_is_nonnegative_bounded_by_evpi_and_positive_affine_invariant" },
  { id = "f12.net_rank.positive", role = "positive", intent = "Candidates rank by net value under a valid cost map, and a larger sample is worth more.", evidence_test = "crates/antecedent-design/tests/evsi.rs", evidence_assertion = "f12_candidates_rank_by_net_value_and_larger_samples_are_worth_more" },
  { id = "f12.ties_truncation.positive", role = "positive", intent = "Ties within the tolerance, a truncated catalog (with its unevaluated ids) and cancellation are reported rather than hidden.", evidence_test = "crates/antecedent-design/tests/evsi.rs", evidence_assertion = "f12_ties_truncation_and_cancellation_are_reported" },
  { id = "f12.monte_carlo_diagnostic.positive", role = "positive", intent = "The Monte Carlo route reports replicates, standard error, ESS equal to the replicate count, a convergence flag and a seed-reproducible estimate with EVPI 1/12. These are diagnostics labelled unmeasured, not a licensed coverage or rank guarantee.", evidence_test = "crates/antecedent-design/tests/evsi.rs", evidence_assertion = "f12_monte_carlo_is_labelled_with_error_replicates_ess_and_convergence" },
  { id = "f12.python_known_truth.positive", role = "positive", intent = "Python reproduces EVSI 1/4, EVPI 1/2, current value 1/2, no net value without a map, and net 3/20 with a utility-unit map.", evidence_test = "python/tests/test_design_ranking.py", evidence_assertion = "test_f12_frozen_values_and_net_value_only_with_a_cost_mapping" },
  { id = "f12.python_gaussian.positive", role = "positive", intent = "Python reproduces the Gaussian closed-form EVSI as an exact point value with claim point_only and native exact replay.", evidence_test = "python/tests/test_design_ranking.py", evidence_assertion = "test_f12_gaussian_mean_matches_the_closed_form_and_is_a_point_value" },
  { id = "f12.python_monte_carlo.positive", role = "positive", intent = "Python reports the Monte Carlo error and ESS, labels the value monte_carlo_estimate, marks it not natively replayed and calibration unmeasured, and makes no coverage claim.", evidence_test = "python/tests/test_design_ranking.py", evidence_assertion = "test_f12_monte_carlo_value_reports_error_and_makes_no_coverage_claim" },
  { id = "f12.wrong_contract.negative", role = "negative", intent = "Cost in a currency without a matching cost-to-utility map, a map whose utility unit is not the decision's and a required net value without a map each refuse net-value comparison.", evidence_test = "crates/antecedent-design/tests/evsi.rs", evidence_assertion = "f12_incompatible_cost_units_and_missing_maps_refuse" },
  { id = "f12.action_set.negative", role = "negative", intent = "A changed terminal action set and decision values that do not average back to the prior value refuse.", evidence_test = "crates/antecedent-design/tests/evsi.rs", evidence_assertion = "f12_changed_terminal_action_set_and_incoherent_values_refuse" },
  { id = "f12.prior_states.negative", role = "negative", intent = "An external law defined on other prior draws, or for another sample size, refuses.", evidence_test = "crates/antecedent-design/tests/evsi.rs", evidence_assertion = "f12_external_law_for_other_prior_draws_or_sample_size_refuses" },
