[[record]]
id = "2.3A.X4.learned_joint_transport"
workstream = "X4"
milestone = "A"
work_package = "A2"
status = "carried_forward"
consumer_question = "What target effect posterior follows from a declared joint source and target model whose outcome mechanism is fitted through the antecedent-learn polynomial basis provider?"
theorem = "The learned counterpart of 2.3A.X4.joint_bayesian_transport (antecedent_estimate::learned_joint_transport), the A2/B1 model-provider row. Per source s, Y | A, X ~ Normal(w'theta + v'gamma_s, sigma_s^2) with w = [A, A phi(x)] (plus phi(x) when the basis main effects are invariant) over a polynomial basis phi of declared degree 1 to 6 in the certified covariates, an invariant block theta shared by every source and the target, a population-varying block gamma_s that never interacts with treatment, a dense Gaussian prior and a declared known noise variance per source. The fit is the antecedent-learn KnownVarianceBasisRegression over a PolynomialBasis: an EXACT conjugate Gaussian posterior with closed-form precision and mean and iid Gaussian draws, NOT a non-conjugate sampler. There is no MCMC, so the effective sample size equals the draw count and no R-hat exists; unknown variance, non-Gaussian likelihoods and MCMC are not provided. The target effect is psi = mean over the target covariate sample of E(Y | A=1, x) - E(Y | A=0, x). With degree 1 the model is exactly that of the joint engine, which the tests use as a labelled regression cross-check between two Antecedent paths. Identification is read once from the supplied 2.2 certificate (direct or standardization) and prior mass never changes it. Calibration (frequentist coverage of the credible interval) is UNMEASURED: no coverage is claimed and every route is closed."
reference = "TODO.md A2 and B1 model-provider row learned_joint_transport; prerequisite 2.2A.X4.learned_continuous_trial_transport; provenance/x4_learned_joint_transport.toml"
guarantee = "exact_conjugate_gaussian_polynomial_basis_posterior_through_the_learn_provider_known_variance_calibration_unmeasured_route_closed"
graph_class = "The fixed DAG and selection assumptions of a separately licensed 2.2 transport derivation (direct or baseline standardization); an ADMG or a graph posterior refuses."
