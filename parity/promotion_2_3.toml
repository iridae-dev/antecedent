[[record]]
id = "2.3B.B3.msm_sensitivity"
workstream = "X3"
milestone = "B"
work_package = "B3"
status = "promoted"
consumer_question = "How far can the stratified average treatment effect move if unmeasured confounding shifts the odds of treatment by a factor within [1/Lambda, Lambda], at which Lambda does it cross a decision threshold, and which action does the F17 decision composition choose over the declared Lambda range, with the sampling interval kept withheld?"
theorem = "Derived in-repo (provenance/b3_msm_sensitivity.toml), in the family of Tan (2006) and Zhao, Small and Bhattacharya (2019). Binary treatment T, finite strata x with exact masses P(x) summing to one, propensities e(x) strictly inside (0,1) and exact finite outcome laws f1(.|x) and f0(.|x); nothing is estimated. Under the marginal sensitivity model with scale Lambda >= 1 the odds of treatment given (x, Y(t)) differ from the odds given x by a factor in [1/Lambda, Lambda]. Per stratum and arm the feasible set is {rho : 1/Lambda <= rho <= Lambda, E_f[rho] = 1} with the EXACT population normalization (not the Hajek renormalization, which drops the constraint and gives weakly wider, non-sharp population bounds), and E[Y(1)|x] = e m1 + (1 - e) E_{rho f1}[y]. The optimum of this linear program is a fractional knapsack solved greedily: rho = Lambda on the top (bottom) probability mass tau = 1/(Lambda + 1) of the outcome law and 1/Lambda elsewhere, giving U = m + h (Lambda - 1/Lambda)(T_top - tau m) with h = 1 - e for the treated arm and e for the control arm; the ATE bounds are sum_x P(x)(L1 - U0) and sum_x P(x)(U1 - L0), sharp for the declared set because the arm and stratum parameters are free independently, and nested in Lambda, so the bounds widen monotonically and Lambda = 1 reproduces the identified stratified ATE. Anchors (hand-derived): strata (mass 0.5, e 0.5, r1 0.8, r0 0.4) and (mass 0.5, e 0.25, r1 0.5, r0 0.3) give identified ATE 0.3 and bounds [0.04375, 0.4875] at Lambda 2; one stratum with e 1/2 and both laws on {0,1,2} with probabilities {1/4,1/2,1/4} gives [-0.375, 0.375] at Lambda 2 and [-2/3, 2/3] at Lambda 3; the tipping Lambda of the lower bound against threshold 0 is (2 + sqrt(193))/7 = 2.27035, found by bisection with a certified bracket (not reached at its lower end, reached at its upper end) and a status (bracketed, reached at origin, not reached in the box). The grid range is an ASSUMPTION RANGE, never a confidence interval. The SAMPLING interval is WITHHELD (sampling interval: not reported; cell_not_licensed / msm_sensitivity.interval_withheld) and a requested composition of a sampling interval with the range refuses (cell_not_licensed / msm_sensitivity.composition_not_licensed). The adapter turns a result into the F17 SensitivityArtifact over the Lambda coordinate (scale odds_ratio_bound, range [1, lambda_max]) so that the F17 composition classifies the actions as an invariant action, an assumption-dependent switch or no robust action. Calibration is unmeasured and no coverage is claimed."
reference = "TODO.md B3; Tan (2006) JASA marginal sensitivity model; Zhao, Small and Bhattacharya (2019) JRSSB; Dorn and Guo (2022) JASA quantile balancing; provenance/b3_msm_sensitivity.toml"
guarantee = "msm_sharp_assumption_range_exact_population_inputs_lambda_one_identified_sampling_interval_withheld_point_only"
graph_class = "No graph is identified: the caller supplies an adjustment set as finite strata with exact masses, propensities and outcome laws, and the sensitivity model perturbs the treatment odds given the strata and the potential outcome."
population_semantics = "The strata are exact population quantities of one target population; the ATE is averaged over the supplied strata. One Lambda is shared by every stratum and both arms, and the unobserved laws of the two arms are separate free parameters. The effect and any point quantities carry declared scientific coordinates (units, population, regime, horizon)."
evidence_family = "Two-stratum binary-outcome example with hand-derived identified value, sharp bounds at Lambda 2 and a closed-form tipping Lambda, a three-atom fractional split, monotone widening and stratum-order invariance, refusals for Lambda below one, boundary propensities, malformed inputs and a requested sampling composition, and the F17 artifact reaching an invariant action, an assumption-dependent switch and no robust action, with round trip and decision replay."
provider = "Native implementation; no external provider value is consumed and none is trusted."
estimand = "sharp assumption range of the stratified average treatment effect under the marginal sensitivity model over a Lambda grid, with a bisection tipping Lambda against a declared threshold"
inference_claim = "point_only"
inference_notes = "Claim policy (calibration is measured once at the release cut): the licensed claim is the exact population-level assumption range and the identified value at Lambda = 1; nothing is estimated, so no standard error, p-value or power is produced. The range is never a confidence interval, the sampling interval is withheld, and any sampling uncertainty carried by a caller's strata estimates is outside this record. No coverage record is allocated (the registry accepts coverage_records only for a calibrated claim)."
owners = ["antecedent-validate", "antecedent-io", "antecedent", "antecedent-py", "python/antecedent"]
prerequisite_records = ["2.2B.X3.joint_mechanism_sensitivity", "2.3B.F17.sensitivity_decision_composition"]
prerequisite_reason = "The 2.2 record is the executing assumption-range base whose tipping-bracket machinery this record reuses; the F17 record owns the SensitivityArtifact this record adapts into. Registration is not execution."
identity_inputs = ["strata (mass, propensity, treated and control outcome laws)", "Lambda grid, lambda_max, threshold and tolerance", "family, perturbation scale, normalization and target statements", "effect and point-quantity scientific coordinates", "action utilities", "causal contract id"]
wire_changes = ["None: no new artifact kind in this record. The adapter produces the F17 sensitivity artifact (sensitivity_decision_composition) with coordinate msm_lambda (scale odds_ratio_bound), the lower and upper ATE bounds per grid Lambda, the withheld sampling descriptor and the source tipping point; the artifact wire is owned by 2.3B.F17.sensitivity_decision_composition. The PyO3 bridge exchanges strata, results and refusals as bounded JSON. 2.2 wires are never reinterpreted."]
compatibility = "Additive: no 2.2 route or wire changes. This record was created at implementation, so there is no frozen text to depart from. Scope is a binary treatment, finite strata and exact population inputs, with bounds of 4096 strata, 256 outcome atoms per law, 1024 grid points and Lambda at most 1000. The artifact refusals (invalid_surface, wrong_contract, composition_not_licensed, unsupported_coordinate) belong to the namespace of 2.3B.F17.sensitivity_decision_composition and are not redeclared here. Synchronous finite computation without a cancellation hook; bounds.cancellation is recorded because the registry gate requires it."
search = false
bounds = { cancellation = true, max_coordinates = 1024, max_strata = 4096, max_grid_points = 1024 }
