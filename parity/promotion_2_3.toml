  { id = "x10.adjacent_mgraph.negative", role = "negative", intent = "An adjacent or non-recoverable m-graph refuses.", evidence_test = "crates/antecedent-estimate/tests/recovery_sampled.rs", evidence_assertion = "x10_unrecoverable_pattern_adjacent_and_nonrecoverable_mgraphs_refuse" },
  { id = "x10.failed_replicates.negative", role = "negative", intent = "Failed replicates above the allowed fraction refuse.", evidence_test = "crates/antecedent-estimate/tests/recovery_sampled.rs", evidence_assertion = "x10_unrecoverable_pattern_failed_replicates_above_the_fraction_refuse" },
