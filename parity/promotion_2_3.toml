[[record]]
id = "2.3C.C1.native_response_claims"
workstream = "C1"
milestone = "C"
work_package = "C1"
status = "promoted"
consumer_question = "Can a native mean-curve response be consumed by decision and inverse flows as a typed claim whose scientific coordinates, support, trust and calibration travel with it, without a mean ever becoming an outcome law?"
theorem = "Acceptance boundary: a point-identified static mean response over the grid {1, 2} mg for outcome y (mmHg) in the target population is a claim with one coordinate per dose (variable y, units mmHg, population target, regimes do(dose=1) and do(dose=2), horizon 0, functional mean, transform identity), a support label per coordinate, native provider trust, an unmeasured calibration and the program identity. With native means E[y|do(1)] = 3 and E[y|do(2)] = 5, action A reading the dose-1 mean (utility m1) has expected utility 3.0 and action B reading the dose-2 mean (utility m2 - 1.5) has 3.5, so B is uniquely optimal. A response that retained two aligned draws per coordinate, dose 1 [2, 4] and dose 2 [4, 6] with the same means 3 and 5, also supplies an aligned joint law: B's per-draw utility is [2.5, 4.5] so P(utility_B <= 3) = 1/2, which a mean source cannot answer and refuses (source not supplied) instead. The joint law is a posterior over the causal mean curve, not an interventional outcome law. A coordinate outside empirical support or lacking evidence is withheld and reported, never used; a source with no supported coordinate refuses. A response for another outcome, treatment, grid or population than the program, an envelope or unidentified response, an unlabeled point support, a unit that contradicts the program, and a caller-asserted calibration refuse. This record grants no causal, interval or probability license."
reference = "TODO.md C1 (native response consumable by decision and inverse flows); prerequisite records 2.3C.C1.program_binding and F4/F5"
guarantee = "native_mean_response_as_typed_claim_with_coordinates_support_trust_never_an_outcome_law_point_only"
graph_class = "Only an independently identified fixed-graph or declared structural-scenario contract; this adapter does not identify a graph and does not estimate the response."
population_semantics = "A native response carries no population or outcome functional of its own: the target population, regime kind, horizon, functional and transform of its coordinates are taken from the program binding the caller supplies and checked against it; the response supplies its outcome, treatment, grid and (when declared) units."
evidence_family = "A mean response over the grid {1, 2} with means 3 and 5, a joint-draw variant with draws [2, 4] and [4, 6], an unsupported-coordinate variant, and variants for another request, an envelope response and an unlabeled support."
provider = "Native: the claim's trust is always native and is carried from the response itself; no external provider value is consumed and none is trusted."
estimand = "typed native response claim and its decision source"
inference_claim = "point_only"
inference_notes = "Claim policy (calibration is measured once at the release cut): the licensed claim is the POINT mean at each coordinate. Every standard error, interval or diagnostic a response carries is labelled calibration 'unmeasured' (or 'point_only'); a calibrated status cannot be asserted by the caller. No coverage record is allocated (the registry accepts coverage_records only for a calibrated claim)."
owners = ["antecedent", "antecedent-design", "antecedent-py", "python/antecedent"]
prerequisite_records = ["2.3C.C1.program_binding", "2.3B.F4.decision_contract"]
prerequisite_reason = "Requires the program binding and the decision contract; the native response itself is a 2.2 result this adapter only labels, and registration is not execution."
identity_inputs = ["response estimand, outcome, treatment and grid", "program binding identity", "snapshot and rng identities", "support label per coordinate", "calibration status"]
wire_changes = ["None: no new artifact kind. A joint-law source is an existing distribution artifact (aligned joint draws with native trust and the response's calibration), and the PyO3 bridge returns JSON descriptions of the claim and its refusals as additive metadata. Unknown major versions refuse; 2.2 wires are never reinterpreted."]
compatibility = "Additive: no 2.2 route or wire changes, and the 2.2 response objects are unchanged. Limits: a native response carries no population or outcome functional of its own, so those are taken from the program binding and only checked against the response's own outcome, treatment, grid and units; a Python native claim is mean-only because the Python response view keeps no draws, while the Rust claim can supply an aligned joint law when the response retained credible draws of every coordinate; the joint law is a posterior over the mean curve, so outcome-threshold inputs on it still refuse. The Python MeanSource in the decision module is additive and answers only the expectation of an affine utility. Refusals of the program check keep their program_binding.* details. Synchronous finite computation without a cancellation hook; bounds.cancellation is recorded because the registry gate requires it."
search = false
bounds = { cancellation = true, max_coordinates = 1024 }
surface_rust = ["crates/antecedent/src/analysis/native_claims.rs"]
surface_values = ["NativeResponseContext", "WithheldCoordinate", "NativeDecisionSource", "NativeDecisionInput", "NativeResponseClaim"]
refusals = [
  { code = "invalid_argument", detail = "native_claims.invalid_context", when = "The program binding is invalid or the data snapshot or rng identity of the response is blank." },
  { code = "route_not_supported", detail = "native_claims.unsupported_estimand", when = "The response is not a static mean response curve with one coordinate per dose." },
  { code = "quantity_semantics_mismatch", detail = "native_claims.grid_mismatch", when = "The response's dose grid is invalid or is not the estimand's grid, or its means are non-finite or do not number the grid." },
  { code = "effect_not_identified", detail = "native_claims.response_not_point_identified", when = "The response is an envelope, graph-dependent or unidentified result and supplies no point mean." },
  { code = "unknown_variable", detail = "native_claims.unknown_variable", when = "The response names a treatment or outcome variable the schema does not know." },
  { code = "quantity_semantics_mismatch", detail = "native_claims.units_conflict", when = "The schema's outcome unit contradicts the program's outcome units; no unit is converted." },
  { code = "quantity_semantics_mismatch", detail = "native_claims.point_support_missing", when = "The response carries no point support label for its coordinates, or too few of them." },
  { code = "decision_contract_unsatisfied", detail = "native_claims.source_not_supplied", when = "No representation the claim can supply (a mean, or aligned joint draws when retained) satisfies the source the decision requires, for example a probability or quantile asked of a mean." },
  { code = "quantity_semantics_mismatch", detail = "native_claims.no_supported_coordinate", when = "Every coordinate is outside empirical support or lacks evidence, so no source can be handed to a decision." },
  { code = "invalid_argument", detail = "native_claims.joint_law_invalid", when = "The retained draws cannot form a valid aligned joint law of the coordinates." },
  { code = "invalid_argument", detail = "native_claims.unknown_support_label", when = "The PyO3 bridge receives a support label that is not a registered support status." },
  { code = "invalid_argument", detail = "native_claims.invalid_variables", when = "The PyO3 bridge receives treatment or outcome names that do not form a valid schema." },
  { code = "invalid_argument", detail = "native_claims.unknown_identification", when = "The PyO3 bridge receives an identification status name that is not registered." },
  { code = "invalid_argument", detail = "native_claims.calibration_not_licensed", when = "The caller asserts a calibration status other than unmeasured or point_only; a status comes from a measured record, not from the caller." },
  { code = "invalid_argument", detail = "native_claims.no_source_requirement", when = "The decision contract declares no criterion that names the source it reads." },
]
routes = [
  { name = "antecedent.claims.native_response_claim", stage = "representation", status = "licensed", claim = "point_only", covers = ["native_response_coordinates"] },
  { name = "antecedent.claims.native_decision_source", stage = "consume", status = "licensed", claim = "point_only" },
]
fixtures = [
  { id = "c1.native_coordinates.positive", role = "positive", intent = "The claim exposes the hand-written coordinates y in mmHg under do(dose=1) and do(dose=2) in the target population, the means 3 and 5, a support label per coordinate, native trust and the program identity.", evidence_test = "crates/antecedent/tests/native_claims.rs", evidence_assertion = "c1_native_response_exposes_coordinates_support_and_native_trust" },
  { id = "c1.native_affine_decision.positive", role = "positive", intent = "A mean response feeds an affine decision on hand values: A = 3.0 and B = 3.5, so B is uniquely optimal.", evidence_test = "crates/antecedent/tests/native_claims.rs", evidence_assertion = "c1_native_mean_response_feeds_an_affine_decision_on_hand_values" },
  { id = "c1.native_python_coordinates.positive", role = "positive", intent = "Through Python the native claim exposes its coordinates, support and native trust.", evidence_test = "python/tests/test_program_claims.py", evidence_assertion = "test_c1_native_claim_exposes_coordinates_support_and_native_trust" },
  { id = "c1.native_mean_only.negative", role = "negative", intent = "A mean-only result is refused for probability and quantile sources with native_claims.source_not_supplied and is never turned into an outcome law.", evidence_test = "crates/antecedent/tests/native_claims.rs", evidence_assertion = "c1_native_mean_only_result_is_refused_for_probability_and_quantile_sources" },
  { id = "c1.native_another_request.negative", role = "negative", intent = "A response for another outcome, treatment, grid, population or unit is refused against the program, never relabeled.", evidence_test = "crates/antecedent/tests/native_claims.rs", evidence_assertion = "c1_native_response_for_another_request_is_refused_against_the_program" },
  { id = "c1.native_unlicensed.negative", role = "negative", intent = "An envelope or unidentified response, an unlabeled point support and a blank snapshot refuse with their own details and registered codes.", evidence_test = "crates/antecedent/tests/native_claims.rs", evidence_assertion = "c1_native_non_point_or_unlabeled_responses_are_refused" },
  { id = "c1.native_withheld.negative", role = "negative", intent = "Coordinates outside empirical support or lacking evidence are withheld from the decision source with their label and are not silently used.", evidence_test = "crates/antecedent/tests/native_claims.rs", evidence_assertion = "c1_native_unsupported_coordinates_are_withheld_not_silently_used" },
  { id = "c1.native_python_another_request.negative", role = "negative", intent = "Through Python a response for another request is refused.", evidence_test = "python/tests/test_program_claims.py", evidence_assertion = "test_c1_native_claim_refuses_a_response_for_another_request" },
  { id = "c1.native_python_unlicensed.negative", role = "negative", intent = "Through Python unlicensed or unlabeled responses and a caller-asserted calibration are refused.", evidence_test = "python/tests/test_program_claims.py", evidence_assertion = "test_c1_native_claim_refuses_unlicensed_or_unlabeled_responses" },
  { id = "c1.native_python_mean_only.negative", role = "negative", intent = "Through Python a mean-only result is refused for probability and quantile sources.", evidence_test = "python/tests/test_program_claims.py", evidence_assertion = "test_c1_native_mean_only_result_is_refused_for_probability_and_quantile_sources" },
  { id = "c1.native_python_withheld.negative", role = "negative", intent = "Through Python unsupported coordinates are withheld and not silently used.", evidence_test = "python/tests/test_program_claims.py", evidence_assertion = "test_c1_unsupported_coordinates_are_withheld_not_silently_used" },
  { id = "c1.native_joint_artifact.artifact", role = "artifact", intent = "A response that retained draws [2, 4] and [4, 6] supplies an aligned joint-law artifact with native trust and the response's calibration, on which P(utility_B <= 3) = 1/2.", evidence_test = "crates/antecedent/tests/native_claims.rs", evidence_assertion = "c1_native_joint_response_supplies_an_aligned_law_for_nonlinear_functionals" },
  { id = "c1.native_python_decision_source.artifact", role = "artifact", intent = "Through Python the claim's mean decision source feeds the decision contract and the inverse query on hand values, with its provenance carried.", evidence_test = "python/tests/test_program_claims.py", evidence_assertion = "test_c1_native_mean_response_feeds_decision_and_inverse_query_on_hand_values" },
