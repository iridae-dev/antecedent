[[record]]
id = "2.3B.B4.compact_runtime_export"
workstream = "B4"
milestone = "B"
work_package = "B4"
status = "promoted"
consumer_question = "Can a fitted linear-in-coefficients effect model be exported as a compact, identity-bound runtime object that evaluates a point prediction only inside its declared support and outside its refusal mask?"
theorem = "A compact export stores a finite basis phi (intercept, linear, polynomial and one-hot terms of named quantities), a coefficient vector b, a covariance V, the declared support of every input and a refusal mask. Evaluation returns the point prediction f(x) = b'phi(x) and the model-based standard error sqrt(phi'V phi), refuses a query outside the support or inside a mask region, and nothing else. Hand-derived anchor: y = 1 + 2x - 0.5 x^2 on [0,10] with V = [[0.04,0,-0.002],[0,0.01,0],[-0.002,0,0.0004]] gives f(2) = 3 with se = 0.08 sqrt(11), f(0) = 1 with se 0.2 and f(10) = -29 with se sqrt(4.64). A consumer verifies one BLAKE3 identity over every semantic field even when the container is resealed. This record grants no causal or interval license."
reference = "TODO.md B4; textbook variance of a linear combination; provenance/b4_compact_export.toml (papers = [] by explicit judgment)"
guarantee = "compact_export_point_prediction_inside_declared_support_point_only_model_based_se_unmeasured_diagnostic"
graph_class = "No graph is identified: the export carries whatever coefficients and covariance it is given and only checks their shape, finiteness and positive semidefiniteness."
population_semantics = "The response and every input are scientific quantities with units, population, regime and horizon; support and mask are declared per input and are part of the identity. A query outside them is never extrapolated."
evidence_family = "Quadratic and one-hot hand-computed point and standard-error values, a closed support bound, a mask region inside the support, tamper and reseal variants of every semantic field, and a bounded decode."
provider = "Native implementation; no external provider value is consumed and none is trusted. The export does not check that its coefficients came from a valid estimator."
estimand = "point prediction b'phi(x) of a declared linear-in-coefficients basis with its model-based standard error"
inference_claim = "point_only"
inference_notes = "Claim policy (calibration is measured once at the release cut): the licensed claim is the POINT prediction. The model-based standard error sqrt(phi'V phi) is a reported diagnostic labelled calibration 'unmeasured'; it is not an interval, not a coverage claim, and carries no extrapolation or misspecification uncertainty. No coverage record is allocated (the registry accepts coverage_records only for a calibrated claim)."
owners = ["antecedent-io", "antecedent", "python/antecedent"]
prerequisite_records = ["2.3B.B4.vector_treatment_coefficients"]
prerequisite_reason = "A natural producer of the exported coefficients and covariance; the export itself does not require it and does not verify provenance of its inputs."
identity_inputs = ["response quantity", "input quantities and supports", "basis terms", "coefficients", "covariance", "refusal mask regions", "scope statements", "premises digest", "data digest"]
wire_changes = ["Allocate compact_runtime_export_v1 as an additive artifact kind in the bounded sectioned container with one body section: response and input quantities, supports, terms in canonical order, coefficients, covariance, mask regions, the stored point and uncertainty scope statements, calibration status 'unmeasured', a premises digest, a data digest and a BLAKE3 identity. Unknown major versions refuse; 2.2 wires are never reinterpreted."]
compatibility = "Additive: no 2.2 route or wire changes. This record was created at implementation, so there is no frozen text to depart from. Scope is a point prediction plus a model-based standard error, no interval; decode is bounded by byte size and term, input, mask-region and level counts and an oversized declared size is refused before decoding. A consumer holding no retained expected identity checks only internal consistency, and a resealed forgery passes only under the forger's own identity."
search = false
bounds = { cancellation = true, max_coordinates = 1024 }
surface = ["python/antecedent/compact_export.py", "crates/antecedent/src/analysis/compact_export.rs"]
surface_pyo3 = ["python/src/compact_export_api.rs"]
surface_values = ["ExportInput", "ExportLimits", "ExportQuery", "ExportRefusal", "ExportScope", "ExportSpec", "InputSupport", "MaskCondition", "MaskRegion", "PointWithSe", "QueryValue", "TermSpec", "Categorical", "CompactExportRefusal", "Intercept", "Linear", "Numeric", "OneHot", "PointEstimate", "Power", "Quantity"]
