[[record]]
id = "2.3B.F17.sensitivity_decision_composition"
workstream = "F17"
milestone = "B"
work_package = "B3"
status = "promoted"
consumer_question = "Can sensitivity result in durable decisions be consumed under a checked semantic contract?"
theorem = "Acceptance boundary: over the declared grid gamma in {0,1,2}, action A has utility 2-gamma and B has 1, so A leads at 0, they tie exactly at 1 and B leads at 2; there is no invariant unique action over the full range and the exact tie coordinate is 1. On a grid {0,0.5,1.5,2} the sign change of 1-gamma lies between 0.5 and 1.5 and the linear crossing 1 is reported as a labelled interpolation, never as an evaluated point. A declared assumption range is not a sampling interval and never a probability: a reported sampling interval is carried beside the decision, composition of the two is refused (composition_not_licensed; the licensed list is empty), and unsupported coordinates, mixed estimands and foreign inputs refuse. This record grants no causal, coverage or probability license."
reference = "TODO.md B3; prerequisite feature records F4, F6, F24"
guarantee = "assumption_dependent_decision_over_declared_grid_points_only_range_never_probability_point_only"
graph_class = "Only an independently identified fixed-graph or declared structural-scenario contract; this composition cell does not identify a graph."
population_semantics = "Population, regime, horizon, conditioning, coordinate support and source/target snapshot identities remain separately bound."
evidence_family = "Sensitivity parameter gamma in {0,1,2}; action A utility is 2-gamma and B utility is 1."
provider = "Native implementation or separately scoped exact-request external provider; provider trust is never upgraded by representation alone."
estimand = "sensitivity result in durable decisions"
inference_claim = "point_only"
owners = ["antecedent-core", "antecedent-io", "antecedent", "python/antecedent"]
prerequisite_records = ["2.3B.F4.decision_contract", "2.3B.F6.structural_decision_policy", "2.3A.F24.composition_provenance"]
prerequisite_reason = "Requires the listed feature contracts and a separately licensed scientific producer; registration is not execution."
identity_inputs = ["scientific quantity coordinates", "population, regime and horizon", "snapshot and causal contract", "provider and exact request", "feature-specific action, signal or evidence identities"]
wire_changes = ["Allocate sensitivity_decision_v1 as additive v1 metadata in the bounded sectioned artifact container (CBOR sensitivity_decision.meta plus a separate little-endian numerical sensitivity_decision.numbers section), implemented in antecedent-io because antecedent-design has no antecedent-validate dependency: assumption coordinate and grid; per-quantity lower/upper surface; per-point support; action utilities; tipping brackets; uncertainty relationship (assumption range, optional identified bound, sampling interval withheld or reported separately); provenance including the adapted 2.2 JointMechanismSensitivityResult source kind. Unknown major versions refuse; 2.2 wires are never reinterpreted."]
compatibility = "Existing 2.2 routes keep their exact scope. Point-only: the surface is exact only at its grid points, nothing between them is evaluated, and a switch bracketed by two grid points carries a linear interpolation explicitly labelled as such. Assumption ranges are declared inputs and never probabilities (weights must be declared for point surfaces and are never inferred from a range); a sampling interval is retained beside the decision and never composed with the range. A 2.2 JointMechanismSensitivityResult is adapted exactly or refused (unsupported_adaptation). Departure from the frozen text: the frozen route_frozen detail is removed (the executed route no longer needs it) and invalid_artifact and sampling_not_reported are added for the Python bridge and facade, which emit them. The sensitivity_decision.meta and sensitivity_decision.numbers section labels live in a different namespace and are not refusal details. The computation is a synchronous finite evaluation without a cancellation hook; bounds.cancellation is recorded because the registry gate requires it."
search = false
bounds = { cancellation = true, max_coordinates = 1024 }
refusals = [
  { code = "decision_contract_unsatisfied", detail = "sensitivity_decision_composition.wrong_contract", when = "A stored or recomputed identity, surface, utility or result field differs from the consumer's retained one, estimands are mixed, a foreign input is supplied, or weights are inferred from a range." },
  { code = "quantity_semantics_mismatch", detail = "sensitivity_decision_composition.unsupported_coordinate", when = "A grid coordinate inside the evaluated range is unsupported; a sub-range that avoids it is the only licensed way forward." },
  { code = "cell_not_licensed", detail = "sensitivity_decision_composition.composition_not_licensed", when = "A composition of the assumption range with a sampling interval is requested or claimed; the licensed list is empty." },
  { code = "invalid_argument", detail = "sensitivity_decision_composition.invalid_surface", when = "A surface, grid, coordinate or action declaration is malformed, non-finite, unordered or blank." },
  { code = "route_not_supported", detail = "sensitivity_decision_composition.bounds_exceeded", when = "An artifact exceeds the bounded size, grid or quantity count of the consumer." },
  { code = "route_not_supported", detail = "sensitivity_decision_composition.unsupported_adaptation", when = "A 2.2 joint-sensitivity result cannot be filled exactly into a surface or is not an assumption range." },
  { code = "invalid_argument", detail = "sensitivity_decision_composition.invalid_artifact", when = "The Python bridge receives bytes that are not a sensitivity-decision artifact." },
  { code = "cell_not_licensed", detail = "sensitivity_decision_composition.sampling_not_reported", when = "A Python caller declares a surface without a sampling interval: the artifact records the interval as withheld (a stored statement, not a call refusal) with this code and detail rather than implying a sampling interval exists." },
]
routes = [
  { name = "antecedent.decision.sensitivity_surface", stage = "evaluate", status = "licensed", claim = "point_only" },
]
fixtures = [
  { id = "f17.known_truth.positive", role = "positive", intent = "Frozen surface gamma in {0,1,2}, A = 2-gamma, B = 1: A leads at 0, they tie exactly at gamma = 1 (exact switch A to B) and B leads at 2; no invariant unique action over the range.", evidence_test = "crates/antecedent-design/tests/sensitivity_decision.rs", evidence_assertion = "f17_frozen_surface_switches_with_an_exact_tie_at_gamma_one" },
  { id = "f17.invariant.positive", role = "positive", intent = "A = 5-gamma against B = 1 leads at every grid point, so A is the invariant action and the artifact recomputes the same decision from its stored surface.", evidence_test = "crates/antecedent-design/tests/sensitivity_decision.rs", evidence_assertion = "f17_invariant_action_across_the_whole_assumption_range" },
  { id = "f17.tipping.positive", role = "positive", intent = "On grid {0,0.5,1.5,2} the difference 1-gamma changes sign inside the bracket (0.5, 1.5); the crossing 1 is reported as a labelled, non-exact interpolation.", evidence_test = "crates/antecedent-design/tests/sensitivity_decision.rs", evidence_assertion = "f17_tipping_coordinate_is_the_closed_form_crossing" },
  { id = "f17.no_robust.positive", role = "positive", intent = "An effect range [-1,2] against a status quo of 0 at every gamma, and three actions each leading at one point, give no robust action rather than a forced choice.", evidence_test = "crates/antecedent-design/tests/sensitivity_decision.rs", evidence_assertion = "f17_no_robust_action_when_the_range_straddles_at_every_point" },
  { id = "f17.joint_adaptation.positive", role = "positive", intent = "A 2.2 joint-mechanism sensitivity result is adapted exactly into a surface that feeds a decision contract.", evidence_test = "crates/antecedent-design/tests/sensitivity_decision.rs", evidence_assertion = "f17_a_2_2_joint_sensitivity_result_feeds_a_decision_contract" },
  { id = "f17.python_known_truth.positive", role = "positive", intent = "The same frozen surface decided through Python reports an assumption-dependent switch with its tipping coordinate and the same exactness flag.", evidence_test = "python/tests/test_sensitivity_decision.py", evidence_assertion = "test_f17_frozen_surface_is_an_assumption_dependent_switch_with_its_tipping_coordinate" },
  { id = "f17.wrong_contract.negative", role = "negative", intent = "Mixed estimands and foreign inputs refuse with sensitivity_decision_composition.wrong_contract.", evidence_test = "crates/antecedent-design/tests/sensitivity_decision.rs", evidence_assertion = "f17_mixed_estimands_and_foreign_inputs_refuse" },
  { id = "f17.sampling_interval.negative", role = "negative", intent = "An assumption range [0.5,1.5], [0.4,1.4], [0.3,1.3] decides A everywhere; a far wider sampling interval [-2,3] changes neither the decision nor the atoms, is kept separate and not composed, and asking to compose it refuses composition_not_licensed.", evidence_test = "crates/antecedent-design/tests/sensitivity_decision.rs", evidence_assertion = "f17_assumption_range_is_not_a_sampling_interval" },
  { id = "f17.unsupported_coordinate.negative", role = "negative", intent = "An unsupported gamma inside the evaluated range refuses; a sub-range that avoids it decides.", evidence_test = "crates/antecedent-design/tests/sensitivity_decision.rs", evidence_assertion = "f17_unsupported_coordinate_refuses_and_a_subrange_avoids_it" },
  { id = "f17.python_wrong_contract.negative", role = "negative", intent = "Python keeps the range distinct from a sampling interval and refuses to compose them.", evidence_test = "python/tests/test_sensitivity_decision.py", evidence_assertion = "test_f17_range_is_distinct_from_a_sampling_interval_and_never_composed" },
  { id = "f17.resealed_surface.negative", role = "negative", intent = "A consistently resealed surface mutation is refused against the identity the consumer retained.", evidence_test = "crates/antecedent-io/tests/sensitivity_artifact.rs", evidence_assertion = "f17_resealed_surface_mutation_is_refused" },
  { id = "f17.unfillable_adaptation.negative", role = "negative", intent = "A 2.2 result that cannot be filled exactly, or is not an assumption range, is refused as unsupported_adaptation.", evidence_test = "crates/antecedent-io/tests/sensitivity_artifact.rs", evidence_assertion = "f17_a_2_2_result_that_cannot_be_filled_exactly_or_is_not_a_range_is_refused" },
  { id = "f17.fresh_replay.artifact", role = "artifact", intent = "A fresh consumer round-trips the artifact and replays the decision from the stored coordinates, surface, support and tipping bracket.", evidence_test = "crates/antecedent-io/tests/sensitivity_artifact.rs", evidence_assertion = "f17_artifact_round_trips_and_its_consumer_replays_the_decision" },
  { id = "f17.range_and_sampling.artifact", role = "artifact", intent = "Range and sampling interval stay separate fields through the wire.", evidence_test = "crates/antecedent-io/tests/sensitivity_artifact.rs", evidence_assertion = "f17_range_and_sampling_interval_stay_separate_fields" },
  { id = "f17.joint_wire.artifact", role = "artifact", intent = "An adapted 2.2 result travels through the wire exactly.", evidence_test = "crates/antecedent-io/tests/sensitivity_artifact.rs", evidence_assertion = "f17_a_2_2_result_is_adapted_exactly_and_travels_through_the_wire" },
  { id = "f17.python_fresh_replay.artifact", role = "artifact", intent = "Python exports, consumes and replays the artifact and refuses a resealed mutation.", evidence_test = "python/tests/test_sensitivity_decision.py", evidence_assertion = "test_f17_artifact_is_exported_consumed_and_refuses_a_resealed_mutation" },
]

[[record]]
id = "2.3B.F7.functional_inverse_query"
workstream = "F7"
milestone = "B"
work_package = "B4"
status = "promoted"
consumer_question = "Can generalized finite inverse decision query be consumed under a checked semantic contract?"
theorem = "Acceptance boundary: over the ordered action grid a0,a1,a2 with outcome laws Bernoulli(1/4, 1/2, 3/4) (four equiprobable aligned rows), the least action with P(Y>=1) >= 1/2 is a1; E[Y] >= 1/2 is likewise satisfied first by a1; under the engine's left-inverse quantile the median inf{x: F(x) >= 1/2} is 0 for a0 and a1 and 1 for a2, so the median target is checked separately from the mean. The forward value of a1 (E[Y] = 1/2) inverts to exactly a1. Point, interval-region, identified-set, all-scenario and posterior-probability feasibility are separate fields and none is derived from another; one found grid point is never a global feasibility claim over a continuous domain. A mean-only source cannot satisfy a probability or quantile target, and independent marginals refuse a nonlinear utility inversion. This record grants no causal, coverage or probability license."
reference = "TODO.md B4; prerequisite feature records F4, F5, F6, F8"
guarantee = "finite_declared_grid_inverse_query_with_distinct_feasibility_fields_point_only_no_global_feasibility"
graph_class = "Only an independently identified fixed-graph or declared structural-scenario contract; this composition cell does not identify a graph."
population_semantics = "Population, regime, horizon, conditioning, coordinate support and source/target snapshot identities remain separately bound."
evidence_family = "Ordered actions 0,1,2 have outcome laws Bernoulli(p=1/4,1/2,3/4); seek least action with P(Y=1)>=1/2."
provider = "Native implementation or separately scoped exact-request external provider; provider trust is never upgraded by representation alone."
estimand = "generalized finite inverse decision query"
inference_claim = "point_only"
owners = ["antecedent-core", "antecedent-io", "antecedent", "python/antecedent"]
prerequisite_records = ["2.3B.F4.decision_contract", "2.3B.F5.decision_functionals", "2.3B.F6.structural_decision_policy", "2.3A.F8.coordinate_support"]
prerequisite_reason = "Requires the listed feature contracts and a separately licensed scientific producer; registration is not execution."
identity_inputs = ["scientific quantity coordinates", "population, regime and horizon", "snapshot and causal contract", "provider and exact request", "feature-specific action, signal or evidence identities"]
wire_changes = ["Allocate inverse_functional_query_v1 (feature marker inverse_functional_query_v1) as additive v1 metadata in the bounded sectioned artifact container: CBOR inverse_query.meta (ordered action grid, grid scope, constraints and selection rule, claim and contract identities, per-action feasibility table), a nested decision_contract_v1 inverse_query.contract section, and a little-endian f64 inverse_query.data section holding the draws of every embedded law; separate premises and data digests; at most 4096 grid actions, 256 embedded claims and 16 MiB. Unknown major versions refuse; 2.2 wires are never reinterpreted."]
compatibility = "Existing 2.2 routes keep their exact scope. Point-only: no coverage or calibration claim, and feasibility is relative to the declared finite grid and supplied forward claims (an action outside the grid is unresolved, not excluded). Departures from the frozen text, stated plainly: (1) the frozen record declared search = true under antecedent_core::SearchBudget; the executed query enumerates a caller-declared finite grid (at most 4096 actions) in declaration order under a plain evaluation counter (max_evaluations; exhaustion leaves the remaining candidates Unevaluated and sets budget_exhausted), not under SearchBudget, so search is declared false and no budget role is claimed. A finite_enumeration_baseline cross-checks the engine. (2) The frozen route_frozen detail is removed, global_feasibility_claim, bounds_exceeded and invalid_artifact are added because the artifact consumer and Python bridge emit them. (3) Core query refusals use the inverse_query.* namespace (invalid_grid, no_constraints, invalid_parameter, no_forward_evidence, invalid_scenarios, invalid_probabilities, budget_exhausted as an unevaluated reason, invalid_declaration at the bridge) and engine refusals pass through with their own decision_evaluation.* details (joint_law_required, mean_source_insufficient, quantity_not_found, unsupported_coordinate); those namespaces are not declared here because inverse_query.meta, inverse_query.contract and inverse_query.data are artifact section labels in the same namespace and the engine details are owned by the F5 record; the tests assert them directly. (4) Evaluation is synchronous and finite with no cancellation hook; bounds.cancellation is recorded because the registry gate requires it."
search = false
bounds = { cancellation = true, max_coordinates = 1024 }
refusals = [
  { code = "inverse_functional_unsupported", detail = "functional_inverse_query.wrong_contract", when = "A stored or recomputed identity, result table, contract, feature marker or inference claim differs from the consumer's retained one, a data section is malformed, or a scenario or set member is supplied as a mean grid instead of a law." },
  { code = "inverse_functional_unsupported", detail = "functional_inverse_query.global_feasibility_claim", when = "An artifact claims global feasibility over a continuous domain from a finite set of found grid points." },
  { code = "inverse_functional_unsupported", detail = "functional_inverse_query.bounds_exceeded", when = "An artifact embeds more forward claims than the bounded consumer accepts." },
  { code = "invalid_argument", detail = "functional_inverse_query.invalid_artifact", when = "The Python bridge receives bytes that are not an inverse-query artifact." },
]
routes = [
  { name = "antecedent.decision.inverse_functional", stage = "evaluate", status = "licensed", claim = "point_only" },
]
fixtures = [
  { id = "f7.known_truth.positive", role = "positive", intent = "Over actions a0,a1,a2 with laws Bernoulli(1/4,1/2,3/4), the least action with P(Y>=1) >= 1/2 is a1 and the statuses are (Infeasible, Feasible, Feasible).", evidence_test = "crates/antecedent-design/tests/inverse_query.rs", evidence_assertion = "f7_probability_threshold_constraint_on_a_finite_law" },
  { id = "f7.target_mean.positive", role = "positive", intent = "A mean target of 1/2 is met first by a1 on the finite law.", evidence_test = "crates/antecedent-design/tests/inverse_query.rs", evidence_assertion = "f7_target_mean_constraint_on_a_finite_law" },
  { id = "f7.target_median.positive", role = "positive", intent = "The median target uses the engine's left-inverse quantile (medians 0, 0, 1), separate from the mean.", evidence_test = "crates/antecedent-design/tests/inverse_query.rs", evidence_assertion = "f7_target_quantile_uses_the_engines_left_inverse" },
  { id = "f7.forward_round_trip.positive", role = "positive", intent = "The forward value E[Y] = 1/2 of a1 inverts to exactly a1 with a certified unique selection.", evidence_test = "crates/antecedent-design/tests/inverse_query.rs", evidence_assertion = "f7_forward_inverse_round_trip" },
  { id = "f7.distinct_fields.positive", role = "positive", intent = "Identified-set and interval-region feasibility are separate fields; neither is derived from the other.", evidence_test = "crates/antecedent-design/tests/inverse_query.rs", evidence_assertion = "f7_identified_set_and_interval_region_are_separate_fields" },
  { id = "f7.enumeration_baseline.positive", role = "positive", intent = "The independent finite-enumeration baseline agrees with the engine's statuses.", evidence_test = "crates/antecedent-design/tests/inverse_query.rs", evidence_assertion = "f7_finite_enumeration_baseline_agrees_with_the_engine" },
  { id = "f7.python_known_truth.positive", role = "positive", intent = "Through Python the mean, quantile and probability-threshold targets share one engine and give the same statuses.", evidence_test = "python/tests/test_inverse_query.py", evidence_assertion = "test_f7_target_mean_target_quantile_and_probability_threshold_share_one_engine" },
  { id = "f7.wrong_contract.negative", role = "negative", intent = "A mean-only source never satisfies a probability or quantile target.", evidence_test = "crates/antecedent-design/tests/inverse_query.rs", evidence_assertion = "f7_a_mean_never_answers_a_probability_or_quantile" },
