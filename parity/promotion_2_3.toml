  { code = "route_not_supported", detail = "temporal_refresh.premises_changed", when = "The selection targets, regimes, graph or proof changed." },
  { code = "route_not_supported", detail = "temporal_refresh.stale_snapshot", when = "The replacement is not a new snapshot of a new observation period." },
  { code = "route_not_supported", detail = "temporal_refresh.receipt_digest_mismatch", when = "A refresh receipt field was changed without resealing." },
  { code = "route_not_supported", detail = "temporal_refresh.receipt_mismatch", when = "The receipt is not the one the held and refreshed identities imply (old or new identity, period, snapshot, proof or interval flag differs)." },
  { code = "route_not_supported", detail = "temporal_refresh.stale_interval", when = "A refreshed result still carries an interval of the old window." },
  { code = "invalid_argument", detail = "temporal_refresh.invalid_replacement", when = "The replacement window has an empty or reversed period, no unit ids, or no snapshot id, proof id or horizon." },
  { code = "invalid_argument", detail = "temporal_refresh.window_missing", when = "A held result declared no observation window, so it has nothing to refresh." },
  { code = "invalid_argument", detail = "temporal_refresh.no_refresh", when = "A refresh artifact is requested from a result that was not produced by a refresh." },
]
