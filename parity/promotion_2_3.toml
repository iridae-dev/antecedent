  { id = "f12.gaussian_replay.artifact", role = "artifact", intent = "A fresh consumer recomputes the Gaussian closed form from the embedded belief and rejects a changed noise variance, an edited EVSI and a changed prior even when resealed.", evidence_test = "crates/antecedent-design/tests/design_ranking_artifact.rs", evidence_assertion = "f12_native_gaussian_matches_the_closed_form_and_alterations_are_refused" },
