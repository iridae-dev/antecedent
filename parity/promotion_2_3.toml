  { code = "invalid_argument", detail = "effect_constancy.limits_exceeded", when = "A request or artifact exceeds the bounded size or partition count of the Python bridge or consumer." },
  { code = "invalid_argument", detail = "effect_constancy.invalid_identity", when = "The expected identity a consumer retained does not parse as an effect-constancy identity." },
