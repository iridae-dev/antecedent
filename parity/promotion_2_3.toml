[[record]]
id = "2.3B.X6.prior_signal_decision_planning"
workstream = "X6"
milestone = "B"
work_package = "B0"
status = "promoted"
consumer_question = "Can a prior bank and a candidate signal be combined into a checked decision-planning input under a declared semantic contract?"
theorem = "Acceptance boundary: two compatible, equally weighted sources with draws {0.2, 0.4} and {0.6, 0.8} pool into the enumerated four equally weighted draws 0.2, 0.4, 0.6, 0.8 with pooled mean 1/2 and are paired with a real future-signal provider; weight times prior strength sets the allocation, conflict shrinkage pulls a source toward the pooled mean, and a source-to-target map is applied before pooling. A coefficient prior or a structural unlock list alone is not a signal; an incompatible or unknown artifact, a changed population without a declared transport policy, and any observation shared between a prior source and the candidate or between two sources refuse. A noisy candidate's EVSI order differs from its structural unlock order, and the 2.2 structural order is sufficiency, then cost units, then sample budget, then semantic id. This record alone grants no causal or interval license."
reference = "TODO.md B0 X6; prerequisite feature records F11, F12"
guarantee = "checked_prior_to_candidate_signal_adaptation_with_declared_pooling_and_observation_reuse_refusal_point_only"
graph_class = "Only an independently identified fixed-graph or declared structural-scenario contract; this composition cell does not identify a graph."
population_semantics = "Population, regime, horizon, conditioning, coordinate support and source/target snapshot identities remain separately bound; a source population that differs from the target needs a declared transport policy identity, which the adapter does not itself validate scientifically."
evidence_family = "Two sources A and B with equal weight and strength and distinct observation sets pool into four equally weighted draws; the candidate follows a native binomial or Gaussian-mean signal or an exact-request provider."
provider = "Native adapter; an exact-request external provider may supply the candidate signal and its trust label is never upgraded by representation alone."
estimand = "prior-to-candidate-signal adaptation for decision planning"
inference_claim = "point_only"
owners = ["antecedent-design", "antecedent-io"]
prerequisite_records = ["2.2B.X6.study_planning", "2.3B.F11.external_signal", "2.3B.F12.evsi"]
prerequisite_reason = "Extends the 2.2 structural study-planning cost ranking with a prior-to-signal adapter; requires the listed feature contracts and a separately licensed scientific producer; registration is not execution."
identity_inputs = ["scientific quantity coordinates", "population, regime and horizon", "snapshot and causal contract", "provider and exact request", "feature-specific action, signal or evidence identities"]
wire_changes = ["None: the adapter allocates no wire of its own. Its diagnostics source_digest (BLAKE3 over the pooled draws and the combination inputs) is a value a caller may pass into the design_ranking_v1 source_digests; no existing wire is reinterpreted."]
compatibility = "Existing 2.2 routes keep their exact scope, and the 2.2 verified structural sufficiency and cost ranking is retained when no probabilistic model is licensed. Point-only: pooling is a deterministic quota allocation of shrunk, source-mapped posterior draws, not a Bayesian combination with a proven estimand, and prior strength scales the pooling weight rather than being a power-prior exponent. Observation reuse is excluded only through declared observation identities. A truncated candidate catalog is bounded by a count (max_candidates) and recorded in the search receipt; it is not a SearchBudget search. The execution of the candidate studies, re-identification and re-estimation on actual new data are outside this record."
search = false
bounds = { cancellation = true, max_coordinates = 1024 }
refusals = [
  { code = "design_signal_invalid", detail = "prior_signal.coefficient_prior_not_signal", when = "Only a coefficient prior was supplied for the candidate; it is not a distribution of what a future study will observe." },
  { code = "design_signal_invalid", detail = "prior_signal.unlock_list_not_signal", when = "Only a structural unlock list was supplied for the candidate; it is not a signal distribution." },
  { code = "design_signal_invalid", detail = "prior_signal.no_sources", when = "No prior source was supplied." },
  { code = "design_signal_invalid", detail = "prior_signal.duplicate_source", when = "The same artifact identity appears twice among the sources." },
  { code = "design_signal_invalid", detail = "prior_signal.artifact_not_in_catalog", when = "A source's artifact identity is absent from the prior catalog." },
  { code = "design_signal_invalid", detail = "prior_signal.incompatible_artifact", when = "The catalog marks a source partial (beyond an unnamed coefficient list) or rejected for the target design." },
  { code = "invalid_argument", detail = "prior_signal.invalid_parameter", when = "A weight, prior strength, conflict shrinkage, draw set, source-to-target map, population, identity or signal noise variance is not valid." },
  { code = "design_signal_invalid", detail = "prior_signal.lineage_missing", when = "A source declares no lineage identity." },
  { code = "design_signal_invalid", detail = "prior_signal.observation_lineage_missing", when = "A source declares no observation identities, so observation reuse cannot be excluded." },
  { code = "transport_policy_required", detail = "prior_signal.transport_policy_required", when = "A source population differs from the target and no transport policy was declared." },
  { code = "design_signal_invalid", detail = "prior_signal.observation_reuse", when = "A prior source and the candidate study share observations." },
  { code = "design_signal_invalid", detail = "prior_signal.prior_sources_overlap", when = "Two prior sources share observations, so the same evidence would be counted twice." },
  { code = "invalid_argument", detail = "prior_signal.resolution_invalid", when = "The requested number of pooled draws is zero or above the bound of 1,000,000." },
]
routes = [
  { name = "antecedent.design.prior_signal", stage = "prepare", status = "licensed", claim = "point_only" },
]
fixtures = [
  { id = "x6.known_truth.positive", role = "positive", intent = "Against the enumerated pooling, two equal sources {0.2, 0.4} and {0.6, 0.8} give draws 0.2, 0.4, 0.6, 0.8, weights 1/2 each, pooled mean 1/2, union lineage, three observations checked, no overlap, and a provider that answers an exact signal request.", evidence_test = "crates/antecedent-design/tests/prior_signal.rs", evidence_assertion = "x6_equal_weight_sources_pool_into_the_enumerated_draws_and_a_signal" },
  { id = "x6.weights_strength.positive", role = "positive", intent = "Weight times prior strength sets the normalized weights and the draw allocation.", evidence_test = "crates/antecedent-design/tests/prior_signal.rs", evidence_assertion = "x6_weights_and_prior_strength_set_the_allocation" },
  { id = "x6.conflict_shrinkage.positive", role = "positive", intent = "Conflict shrinkage pulls a source's draws toward the pooled mean.", evidence_test = "crates/antecedent-design/tests/prior_signal.rs", evidence_assertion = "x6_conflict_shrinkage_pulls_a_source_to_the_pooled_mean" },
  { id = "x6.source_map.positive", role = "positive", intent = "A source-to-target map is applied to the source draws before pooling.", evidence_test = "crates/antecedent-design/tests/prior_signal.rs", evidence_assertion = "x6_source_to_target_map_is_applied_before_pooling" },
  { id = "x6.source_order.positive", role = "positive", intent = "Reordering the supplied sources changes neither the prior nor its digest.", evidence_test = "crates/antecedent-design/tests/prior_signal.rs", evidence_assertion = "x6_source_order_does_not_change_the_prior_or_its_digest" },
  { id = "x6.provider_signal.positive", role = "positive", intent = "An exact-request provider can supply the future signal, while an invalid native noise variance refuses.", evidence_test = "crates/antecedent-design/tests/prior_signal.rs", evidence_assertion = "x6_a_provider_can_supply_the_future_signal" },
  { id = "x6.noisy_regret_order.positive", role = "positive", intent = "A nearly uninformative candidate that is structurally first (verified sufficient and cheapest) is last by decision regret: EVSI 0.01 against 1/4 for the accuracy-3/4 signal.", evidence_test = "crates/antecedent-design/tests/design_ranking.rs", evidence_assertion = "x6_noisy_candidate_regret_differs_from_its_structural_unlock_rank" },
  { id = "x6.structural_order.positive", role = "positive", intent = "With no probabilistic model the 2.2 order is verified sufficiency, then fewer cost units, then smaller sample budget, then semantic id, invariant to input order, and empty or duplicate catalogs refuse.", evidence_test = "crates/antecedent-design/tests/design_ranking.rs", evidence_assertion = "x6_structural_order_is_sufficiency_then_cost_then_budget_then_id" },
  { id = "x6.wrong_contract.negative", role = "negative", intent = "A coefficient prior alone or a structural unlock list alone is refused as not a signal distribution.", evidence_test = "crates/antecedent-design/tests/prior_signal.rs", evidence_assertion = "x6_a_coefficient_prior_or_unlock_list_alone_is_not_a_signal" },
  { id = "x6.incompatible.negative", role = "negative", intent = "An artifact the catalog marks incompatible, and one absent from the catalog, refuse.", evidence_test = "crates/antecedent-design/tests/prior_signal.rs", evidence_assertion = "x6_incompatible_or_unknown_artifacts_refuse" },
  { id = "x6.overlap.negative", role = "negative", intent = "Observations shared between a prior source and the candidate, or between two prior sources, refuse.", evidence_test = "crates/antecedent-design/tests/prior_signal.rs", evidence_assertion = "x6_prior_data_overlap_refuses" },
  { id = "x6.transport_policy.negative", role = "negative", intent = "A source population that differs from the target refuses without a declared transport policy.", evidence_test = "crates/antecedent-design/tests/prior_signal.rs", evidence_assertion = "x6_population_change_needs_a_declared_transport_policy" },
  { id = "x6.invalid_parameters.negative", role = "negative", intent = "Invalid weights, strengths, shrinkage, draws, maps and resolution refuse.", evidence_test = "crates/antecedent-design/tests/prior_signal.rs", evidence_assertion = "x6_invalid_parameters_and_resolution_refuse" },
  { id = "x6.fresh_replay.artifact", role = "artifact", intent = "A bounded candidate catalog records its truncation and the unevaluated candidate ids in the ranking value's search receipt, and a truncated ranking has a different identity from the full one. The adapter has no wire of its own; this is the retained ranking identity that design_ranking_v1 seals.", evidence_test = "crates/antecedent-design/tests/design_ranking.rs", evidence_assertion = "x6_truncated_search_is_recorded_and_changes_the_identity" },
]

[[record]]
id = "2.3B.B4.vector_treatment_coefficients"
workstream = "B4"
milestone = "B"
work_package = "B4"
status = "promoted"
consumer_question = "Can the joint coefficients of several treatments estimated together on one adjustment set and one row snapshot be consumed with their full covariance under a checked semantic contract?"
theorem = "One ordinary-least-squares regression y = b0 + A g + T b + e over k >= 2 treatment columns T with ONE shared adjustment block A and ONE row snapshot. The reported vector is b in the declared order, with the full k x k covariance V taken from the (X'X)^-1 block (model-based sigma^2 (X'X)^-1 with sigma^2 = RSS/(n-p), or the HC0 to HC3 sandwiches), a declared contrast w has variance w'Vw using the off-diagonals, the joint Wald statistic tests that every treatment coefficient is zero, and raw contrast p-values get a Holm step-down adjustment across the declared family. Hand-derived anchor: n = 6, t1 = [1,0,1,0,0,1], t2 = [1,1,1,0,0,0], y = [3,2,5,1,0,4] give b = (2.75, 0.75), RSS = 3.25 and a treatment covariance (3.25/36) [[9,-3],[-3,9]]; the contrast b1 - b2 = 2 has variance 24 s against the naive independent 18 s (s = 3.25/36). A treatment that declares a different adjustment set, row snapshot or row count, a constant or collinear treatment, or a rank-deficient adjustment block refuses. This record grants no causal or interval license: it is a regression-coefficient estimate, not an identification statement."
reference = "TODO.md B4; White (1980) and MacKinnon and White (1985) for the sandwich covariances, Wald (1943), Holm (1979); provenance/b4_vector_treatment.toml"
guarantee = "joint_ols_treatment_coefficients_with_full_covariance_point_only_standard_errors_and_p_values_unmeasured_diagnostics"
graph_class = "No graph is identified or checked: the caller owns that the shared adjustment set is valid for every treatment. The route reports regression coefficients of the declared design."
population_semantics = "One row snapshot and one shared adjustment set bind every treatment; a treatment declaring a different snapshot, adjustment set or row count refuses. Population, regime and horizon remain the caller's declared estimand context."
evidence_family = "Six-row hand-solved OLS (t1, t2 and y above), a Frisch-Waugh closed form with an adjustment column, row-by-row HC sandwiches, and a closed-form Wald quadratic."
provider = "Native implementation; no external provider value is consumed and none is trusted."
estimand = "joint treatment coefficients b of one shared-adjustment regression and declared linear contrasts of them"
inference_claim = "point_only"
inference_notes = "Claim policy (calibration is measured once at the release cut): the licensed claim is the POINT coefficients and contrast estimates. Every standard error, covariance entry, Wald statistic, raw and Holm p-value is a reported diagnostic labelled calibration 'unmeasured'; its coverage, Type I error and power are not collected in 2.3 and no coverage record is allocated (the registry accepts coverage_records only for a calibrated claim)."
owners = ["antecedent-estimate", "antecedent-io", "antecedent", "python/antecedent"]
prerequisite_records = ["2.3A.F18.temporal_effect_constancy"]
prerequisite_reason = "Reuses the F18 calibration-status vocabulary and Holm step-down; registration of F18 is not execution of this route."
identity_inputs = ["treatment names and order", "shared adjustment set", "row snapshot", "covariance kind", "declared contrasts", "frozen null", "design summary or rows", "result values"]
wire_changes = ["Allocate vector_treatment_v1 as additive v1 metadata in the bounded sectioned artifact container: treatment and adjustment names in order, covariance kind, contrasts, null, calibration coordinate 'unmeasured', coefficients, full covariance, Wald and Holm values, plus either the embedded compact design (X'X, X'y, residual sum of squares) for a model-based fit or the rows for an HC fit, capped at 4096 rows. One BLAKE3 identity binds the semantic fields. Unknown major versions refuse; 2.2 wires are never reinterpreted."]
compatibility = "Additive: no 2.2 route or wire changes. This record was created at implementation, so there is no frozen text to depart from. Replay limits: a model-based fit replays bit for bit from the embedded design summary; an HC covariance needs the rows and is refused above 4096 rows when sealing (vector_treatment.hc_replay_row_cap_exceeded) and cannot be replayed from a summary (vector_treatment.summary_model_based_only). A consumer refuses a changed identity only against an expected identity it retained itself; a resealed artifact checked without one is only checked for internal consistency. The refusal namespace is vector_treatment; the categorical record reuses its engine and may surface vector_treatment details."
search = false
bounds = { cancellation = true, max_treatments = 64, hc_replay_row_cap = 4096 }
surface = ["python/antecedent/vector_treatment.py", "crates/antecedent/src/analysis/vector_treatment.rs"]
surface_pyo3 = ["python/src/vector_treatment_api.rs"]
surface_values = ["CalibrationStatus", "VectorCovariance", "VectorTreatmentFit", "AdjustmentColumnRequest", "CoefficientWire", "ContrastResultWire", "ContrastWire", "TreatmentRequest", "VectorResultWire", "VectorTreatmentArtifact", "VectorTreatmentArtifactError", "VectorTreatmentIdentity", "VectorTreatmentReportWire", "VectorTreatmentRequest", "WaldWire", "VectorTreatment", "Coefficient", "Contrast", "ContrastEffect", "JointEffects", "JointWald", "Treatment", "VectorTreatmentRefusal"]
refusals = [
  { code = "invalid_argument", detail = "vector_treatment.empty_contrast", when = "A declared contrast or a Wald test names no coefficient." },
  { code = "invalid_argument", detail = "vector_treatment.too_few_rows", when = "The outcome has no rows, or the joint fit has no more rows than coefficients." },
  { code = "invalid_argument", detail = "vector_treatment.too_few_treatments", when = "Fewer than two treatments are declared." },
  { code = "invalid_argument", detail = "vector_treatment.too_many_treatments", when = "More than 64 treatments are declared." },
  { code = "invalid_argument", detail = "vector_treatment.duplicate_name", when = "Two treatments, adjustment columns or contrasts share a name, or a column uses the reserved intercept name." },
  { code = "invalid_argument", detail = "vector_treatment.non_finite_value", when = "An outcome, adjustment, treatment or contrast value is not finite, or the fit overflows finite precision." },
  { code = "invalid_argument", detail = "vector_treatment.leverage_one", when = "HC2 or HC3 is requested and an observation has leverage one." },
  { code = "invalid_argument", detail = "vector_treatment.degenerate_covariance", when = "The covariance of a declared contrast set is degenerate, so the Wald statistic is undefined." },
  { code = "invalid_argument", detail = "vector_treatment.unknown_contrast_coefficient", when = "A contrast weights a coefficient that is not a declared treatment." },
  { code = "invalid_argument", detail = "vector_treatment.duplicate_contrast_coefficient", when = "A contrast weights the same coefficient twice." },
  { code = "invalid_argument", detail = "vector_treatment.summary_inconsistent", when = "A stored design summary is malformed or does not match its declared dimensions." },
  { code = "invalid_argument", detail = "vector_treatment.invalid_request", when = "The artifact producer or the Python bridge receives a request that does not parse as a well-formed vector-treatment request." },
  { code = "invalid_argument", detail = "vector_treatment.limits_exceeded", when = "A request or artifact exceeds the bounded size of the Python bridge or consumer." },
  { code = "invalid_argument", detail = "vector_treatment.invalid_identity", when = "The expected identity a consumer retained does not parse as a vector-treatment identity." },
  { code = "route_not_supported", detail = "vector_treatment.adjustment_set_mismatch", when = "A treatment is declared against an adjustment set different from the shared one." },
