[[record]]
id = "2.3A.X4.binary_nested_markov_pilot"
workstream = "X4"
milestone = "A"
work_package = "A3"
status = "carried_forward"
consumer_question = "Can one bounded binary ADMG transport functional be evaluated through a correctly normalized nested-Markov likelihood?"
theorem = "Derived in-repo (crates/antecedent-estimate/src/nested_markov_binary.rs), not inherited. The selected graph is the Verma ADMG X1 -> X2 -> X3 -> X4 with X2 <-> X4 over four binary variables, districts {X1}, {X3}, {X2, X4}. Its nested-Markov likelihood is P(x1,x2,x3,x4) = Pa(x1) C(x3 | x2) Q(x2, x4 | x1, x3) through the district c-factor Mobius parameterization: 11 free parameters (a, c[x2], and the head/tail parameters q2[x1], q4[x3], g[x1][x3] of the {X2, X4} c-factor) against 15 for the saturated model, hence 4 equality constraints (X3 independent of X1 given X2, and the Verma constraint) that hold on every law of the model and are reported as residuals. Normalization of the 16 cells is checked numerically, never assumed. A law satisfying the constraints is its own maximum-likelihood fit; otherwise a and c are closed form and the c-factor block is maximized by profiling g inside block coordinate ascent over q2 and q4, bounded by max_iterations. The estimand is E[X4 | do(X2 = 1)] - E[X4 | do(X2 = 0)] from the observational regime alone, P(x4 | do(x2)) = sum_{x3} P(x3 | x2) sum_{x1, x2'} P(x1, x2') P(x4 | x1, x2', x3), evaluated from the model and as the empirical plug-in of the same formula (they agree exactly on a law satisfying the constraints). An ordinary DAG factorization P(x1) P(x2|x1) P(x3|x2) P(x4|x3) is not this likelihood. Departures from the frozen wording: (1) the existing 2.2B conditional ADMG functional of 2.2B.X2.admg_conditional_transport is NOT bound here, because that route needs conditioned variables and this graph has none; the pilot instead derives and cites its own unconditional front-door-like identifying formula above (so the prerequisite is a lineage reference, not a functional the pilot calls); (2) there is one regime (observational), no experimental or source/target regime counts; (3) the engine is a constrained maximum-likelihood fit with a model-versus-plug-in contrast, produces no posterior draws and no prior, so no posterior interval exists to calibrate; the calibrated claim is kept only for the allocated coverage record. The Mobius/head-tail parameterization follows Evans and Richardson 2019 (Bernoulli 25(2), arXiv:1511.06813) and the nested Markov property and Verma constraint follow Richardson, Evans, Robins and Shpitser 2023 (Annals of Statistics 51(1), arXiv:1701.06686); only the titles and abstract pages were read, no theorem or section numbers are verified, and every identity used is derived directly and checked against an enumerated latent-variable SCM. Calibration is UNMEASURED and the public route stays closed."
reference = "TODO.md A3; prerequisite 2.2B.X2.admg_conditional_transport (lineage only); provenance/x4_binary_nested_markov.toml"
guarantee = "derived_binary_verma_admg_nested_markov_mle_point_contrast_calibration_unmeasured_route_closed"
graph_class = "Exactly the Verma ADMG X1 -> X2 -> X3 -> X4, X2 <-> X4 over four binary observed variables (at most 6 observed variables admitted by the scope check, only this graph fits); every other ADMG, regime or non-binary domain is outside the pilot and refuses."
population_semantics = "One population and one observational regime; the 16-cell count table is one snapshot. No source/target or experimental regimes in this pilot."
evidence_family = "The 2x2x2x2 observational cell-count table with every count finite and strictly positive; the artifact embeds the counts."
provider = "antecedent_estimate::nested_markov_binary (bounded binary nested-Markov likelihood fit), sealed by antecedent_io::nested_markov_artifact and exposed through the closed facade antecedent::analysis::closed_pilots and python/src/closed_pilot_api.rs; internal and non-routed. No generic Bayesian ADMG provider."
estimand = "The selected observational-regime contrast E[X4 | do(X2 = 1)] - E[X4 | do(X2 = 0)], as the model value and the empirical plug-in, with separate nonparametric-identification, likelihood-fit and inferential-standing statuses. No posterior interval is produced."
inference_claim = "calibrated"
inference_notes = "Carried forward, every route closed. The frozen claim is a calibrated posterior interval; the engine produces a maximum-likelihood fit and a point contrast only, and no interval of any kind, so the claim stays allocated but unexercised. Failed gate: calibration unmeasured (coverage record id allocated but not collected; measured only at the 2.3 release cut, project decision: interval and posterior routes stay closed with cell_not_licensed until measured). Every artifact carries calibration = unmeasured and inferential standing unmeasured. The engine, artifact and closed Python route execute and their tests pass in Rust."
coverage_records = ["cov.bayesian_transport.binary_admg.posterior.l95.nested_markov_pilot"]
