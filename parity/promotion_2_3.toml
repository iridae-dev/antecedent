consumer_question = "Can an external claim be bound to the actual identified program and request it answers, so that a graph-only identity, an incompatible quantities override, a treatment or outcome substitution, a population mismatch or a dose-grid change is refused?"
theorem = "Acceptance boundary: a program names graph, checked contract, treatment, outcome, target population, intervention kind, horizon, a strictly increasing finite dose grid with units, outcome units, functional and transform, and one BLAKE3 identity covers every one of them (strings length-prefixed, doses by exact bits). Hand anchor: the grid {0.5, 1, 2} mg in the target population gives the three coordinates do(schema:dose=0.5), do(schema:dose=1) and do(schema:dose=2) on outcome schema:y in mmHg and a 64-hex identity; a faithful claim passes with 3 coordinates and that identity, and changing any one of the 13 fields (graph, contract, treatment, outcome, population, intervention kind, horizon, a dose, the grid length, dose units, outcome units, functional, transform) changes the identity. A different outcome, treatment or variable inside a coordinate is a treatment_outcome_substitution; a population other than the target is a population_mismatch; a dose 1.5 for 1, other dose units, a missing coordinate or a regime at another dose is a dose_grid_changed; a coordinate whose units, horizon, functional or transform differ is a quantities_override_mismatch; a changed graph or contract or a declared identity of another program is a contract_identity_mismatch; the graph id, a graph:-prefixed id or the graph-only derived key as the declared identity is a graph_only_identity, which two different questions on one graph share. A blank identity or a grid that is not strictly increasing and finite is an invalid_binding refused before any comparison. Binding a result additionally requires the contract itself to carry the program's graph and exact coordinates, and the bound claim stays external. This record grants no causal, interval or probability license."
reference = "TODO.md C1 (bind external.response to the identified program/request); prerequisite feature record F3"
guarantee = "external_claim_bound_to_full_identified_program_and_request_identity_point_only_no_native_upgrade"
graph_class = "Only an independently identified fixed-graph or declared structural-scenario contract; this binding cell does not identify a graph and does not execute or estimate anything."
population_semantics = "The target population, intervention kind, horizon, dose grid and units, functional and transform are bound as declared strings and exact dose bits; none is converted or reinterpreted."
evidence_family = "A program with outcome schema:y (mmHg), treatment schema:dose (mg), grid {0.5, 1, 2}, target population, do-interventions and the mean functional, with one mutated claim per refusal."
provider = "Native check over declared identities; the external result it binds keeps its own trust label and is never upgraded to native by this binding."
estimand = "binding of an external claim to the identified program and request"
