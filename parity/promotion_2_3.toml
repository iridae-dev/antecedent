[[record]]
id = "2.3C.C2.cell_recalc_and_frozen_scores"
workstream = "C2"
milestone = "C"
work_package = "C2"
status = "promoted"
consumer_question = "Can the cell-saturated AIPW route be recalculated selectively with the fits counted by the estimator's own instrument, and can a fresh session resume from a frozen-score artifact alone and retarget it with zero fits while refusing everything that needs data or a fit?"
theorem = "Acceptance boundary (all counts are exact integers read from antecedent_estimate::cell_aipw::count_cell_model_fits, the estimator's own thread-local instrument, which counts each multinomial propensity and per-cell outcome regression that actually completed, and cross-checked by measuring the call from outside). The cell route drives the cell-saturated AIPW interaction contrast over two binary treatments. A first run does 5 folds x (1 propensity + 4 cell regressions) = 25 fits, 1 identification (the declared-adjustment descendant screen), 1 score build, 1 reweight and 1 decision, equals an independent fit-and-summarize, and reuses nothing. A utility-only change recomputes only the decision: 0 fits and an unchanged law. A compatible target-weight change under a licensed retarget reweights the frozen cell scores: 0 fits, 1 reweight and 1 decision, equal to an independent rerun; without a retarget licence it refits. Changed outcomes, fold seed, graph or adjustment set refit a whole number of 25-fit sets and a changed graph or query re-identifies. Portable resume: a ScoreResumeSession is built only from a frozen-score artifact (cell scores or cross-fit AIPW scores frozen by freeze_crossfit_scores) and holds no data and no fitted model. Its one licensed operation is retarget over the SAME row ids, with zero fits, equal to the live retarget; an unchanged request reproduces the first run's law; every request that needs data or a fit (a changed outcome, folds, graph, adjustment, row design, data snapshot or new rows) is refused with Unavailable { missing: Data } (recalc.unavailable_data) before any work and leaves the session unchanged; a different row id list or weight count is refused (recalc.row_ids_mismatch, recalc.row_count_mismatch). A requested data snapshot that differs from the frozen one makes the score artifact Unavailable rather than reused. Resealed or foreign artifact bytes are refused at resume (recalc.frozen_scores_rejected, frozen_scores.identity_mismatch). This record grants no interval, coverage or probability license."
reference = "TODO.md C2 remainder; provenance/c2_cell_recalc_frozen_scores.toml (papers = [] by explicit judgment)"
guarantee = "cell_recalculation_and_portable_score_resume_counted_fits_zero_fit_retarget_point_only_no_interval"
graph_class = "No new graph is identified: the planner compares declared stage identities and the executor runs the existing cell-saturated AIPW estimator for jointly intervened binary treatments under the caller's graph and declared adjustment set, screened against descendants of the treatments. The retarget licence and the declared inputs are caller declarations, recorded and never verified here."
population_semantics = "The source population, the target population and its row weights, the row design and the treatment grid remain separate declared stages; a target change is a reweight of frozen scores only when the retarget route is declared licensed, and a resumed retarget is valid only over the frozen row ids."
evidence_family = "A deterministic 1200-row dataset with two binary treatments and an outcome whose first run reports 25 fits, utility-only, compatible-retarget, folds, outcome, graph and query mutations with whole status tables and fit counts, an undeclared retarget, refused plans that leave the session usable, fresh-session and fresh-interpreter resume with zero fits and unchanged-request reproduction, resume refusals for every request needing data or a fit, resealed and foreign artifact bytes, and cross-fit AIPW scores resumed the same way."
provider = "Native implementation; no external provider value is consumed and none is trusted. The fit count is read from the estimator's own instrument, not asserted by the wrapper."
estimand = "cell-saturated AIPW interaction or cell contrast and cross-fitted AIPW average effect under selective recalculation and frozen-score retargeting"
inference_claim = "point_only"
inference_notes = "Claim policy (calibration is measured once at the release cut): the licensed claim is the counted work and the point law and net benefit of the existing AIPW routes. The law standard error is a reported diagnostic labelled calibration 'unmeasured'; no interval is produced and no coverage record is allocated (the registry accepts coverage_records only for a calibrated claim). Limits to state: a resumed receipt is a verified in-process record, not a sealed artifact, because the recalc_receipt_v1 format refuses a derived stage reused in a fresh process; and ResumeContext cannot express 'scores bound, data absent', so the resume path plans under supplied_data = true as a flag standing for the artifact-bound snapshot identity and every other request is refused with the plan made under supplied_data = false."
owners = ["antecedent-core", "antecedent-estimate", "antecedent-io", "antecedent", "antecedent-py", "python/antecedent"]
prerequisite_records = ["2.3C.C2.selective_recalculation", "2.3C.C2.frozen_scores_artifact"]
prerequisite_reason = "Extends the selective recalculation cell to the cell-AIPW route and resumes from the frozen-score artifact; there is no executing 2.2 base for either, and registration is not execution."
identity_inputs = ["graph, query, regime and evidence", "source and target populations and row weights", "data snapshot and row design", "treatment grid", "learner, folds and RNG", "utility declaration", "frozen-score artifact identity and fit identity", "process boundary and resume context"]
wire_changes = ["None: no new artifact kind in this record. The frozen_scores_v1 artifact is owned by 2.3C.C2.frozen_scores_artifact; the plan, receipt and counts are in-process values. The PyO3 bridge exchanges plans, counts, scores and refusals as bounded JSON and bytes. A tiny additive thread-local fit counter in the cell-AIPW estimator and a recalc planner fix (a requested snapshot that differs from the frozen one makes the score artifact Unavailable rather than reused) change no wire. 2.2 wires are never reinterpreted."]
compatibility = "Additive: no 2.2 route or wire changes and the existing selective recalculation executor is driven unchanged. This record was created at implementation, so there is no frozen text to depart from. Point-only: no interval. Resume is limited to retargeting the frozen scores over the same row ids; nothing that needs the data or a fit is served from an artifact. The details recalc.row_ids_mismatch, row_count_mismatch, invalid_changed_input, invalid_adjustment_set, weighted_overlap_failed, retarget_not_licensed, frozen_scores_rejected, contrast_unavailable and score_stage_undeclared are declared here and share the recalc namespace with 2.3C.C2.selective_recalculation, which declares the plan, bridge and request details. Synchronous finite computation without a cancellation hook; bounds.cancellation is recorded because the registry gate requires it."
search = false
bounds = { cancellation = true, max_coordinates = 1024 }
surface = ["crates/antecedent/src/analysis/recalc_cell.rs"]
surface_pyo3 = ["python/src/recalc_cell_api.rs"]
surface_exports = ["python/antecedent/recalc_cell.py"]
owned_exports = ["ARTIFACT_KIND", "CellRequest", "CellSession", "CrossfitSession", "FrozenScores", "Quantity", "ResumeReceipt", "ScoreResumeRefusal", "ScoreResumeSession", "ScoreResumeUnavailable", "resume_from_scores"]
surface_values = ["ScoreQuantity", "CellSpec", "CellRequest", "CellSession", "ScoreResumeRequest", "ScoreResumeSession", "CrossfitSession", "FrozenScores", "ResumeReceipt", "ScoreResumeRefusal", "ScoreResumeUnavailable", "CellSessionHandle", "CrossfitSessionHandle", "ScoreResumeHandle"]
refusals = [
  { code = "invalid_argument", detail = "recalc.row_ids_mismatch", when = "A resumed retarget names row ids that differ from the frozen row ids." },
  { code = "invalid_argument", detail = "recalc.row_count_mismatch", when = "A resumed retarget supplies a weight count that differs from the frozen row count." },
  { code = "invalid_argument", detail = "recalc.invalid_changed_input", when = "A changed input names an unknown stage or an identity that is not 64 lowercase hex digits." },
  { code = "invalid_argument", detail = "recalc.invalid_adjustment_set", when = "The treatments are empty or more than the joint-treatment bound, a treatment, outcome or adjustment variable is out of range, the outcome is a treatment, or an adjustment variable is a treatment, the outcome or a descendant of a treatment." },
  { code = "invalid_argument", detail = "recalc.weighted_overlap_failed", when = "The retargeted weights fail the weighted overlap check, so the law cannot be reweighted." },
  { code = "invalid_argument", detail = "recalc.retarget_not_licensed", when = "Frozen scores are exported from a session whose retarget was not declared licensed." },
  { code = "invalid_argument", detail = "recalc.frozen_scores_rejected", when = "The frozen-score artifact format rejects the scores being exported." },
  { code = "invalid_argument", detail = "recalc.contrast_unavailable", when = "An average-effect quantity is requested but the retargeted result carries no contrast." },
  { code = "invalid_argument", detail = "recalc.score_stage_undeclared", when = "The declared stage identities do not include the score-artifact stage, so the frozen scores cannot be bound." },
]
routes = [
  { name = "antecedent.recalc.execute_cell_with_receipt", stage = "evaluate", status = "licensed", claim = "point_only", covers = ["freeze_crossfit_scores", "execute", "export_frozen_scores", "ARTIFACT_KIND", "Quantity", "cell_request_reason_code"] },
  { name = "antecedent.recalc.resume_retarget_from_scores", stage = "evaluate", status = "licensed", claim = "point_only", covers = ["execute_resumed_retarget", "execute_retarget", "resume_from_scores"] },
]
fixtures = [
  { id = "c2.cell_first_run_25_fits.positive", role = "positive", intent = "A first run does 25 cell-model fits (5 folds x (1 propensity + 4 cell regressions)), reuses nothing and equals an independent fit.", evidence_test = "crates/antecedent/tests/recalc_cell.rs", evidence_assertion = "c2_cell_first_run_counts_the_cell_fits_and_matches_an_independent_fit" },
  { id = "c2.cell_utility_zero_fits.positive", role = "positive", intent = "A utility-only change recomputes only the decision with 0 fits and an unchanged law.", evidence_test = "crates/antecedent/tests/recalc_cell.rs", evidence_assertion = "c2_cell_utility_only_change_recomputes_the_decision_with_zero_fits" },
  { id = "c2.cell_compatible_retarget.positive", role = "positive", intent = "A compatible target-weight change reuses the frozen cell scores with 0 fits and equals an independent rerun.", evidence_test = "crates/antecedent/tests/recalc_cell.rs", evidence_assertion = "c2_cell_compatible_target_weight_change_reuses_the_frozen_cell_scores" },
