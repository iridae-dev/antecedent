milestone = "A"
work_package = "A5"
status = "promoted"
consumer_question = "What would the same observed unit's final outcome have been under a different two-step action history?"
theorem = "For a fixed, fully observed, Markovian two-slice DAG L0 -> A0 -> L1 -> A1 -> Y with additive-noise linear mechanisms V = intercept + sum_p coef_p * parent_p + U_V (supplied as a fitted mechanism identity), each unit's exogenous history (U_L0, U_L1, U_Y) is recovered exactly from its factual trajectory (abduction), both named action histories are replayed against that same history (action), and each world's final outcome is computed from it (prediction); abduction, action and prediction are one function. The estimand is the per-unit outcome under each history and the sample mean of their difference. Fresh noise per world would answer an interventional, not a counterfactual, question. The 2.2 static edge-intervention proof does not identify a temporal or transported counterfactual. Departures from the frozen wording: the mechanism class is linear additive noise with closed-form abduction (the Gaussian family is never used numerically; an optional per-node noise halfwidth declares a bounded noise support so an out-of-support factual history is a refusing witness), not a finite SCM; the node set, horizon 2 and two worlds are fixed. Abduction-action-prediction follows the structural-counterfactual procedure of Pearl (2000, Causality, chapter 7); no new theorem is derived beyond its exact application to an invertible additive-noise model. Digests are non-cryptographic 128-bit FNV-1a fingerprints and the artifact spec_id is a blake3 hash; neither is a security seal, and a coherently resealed artifact replays unless the consumer retains an independent expected identity."
reference = "TODO.md A5; prerequisite 2.2A.X8.path_specific_edge_intervention"
guarantee = "shared_exogenous_history_counterfactual_linear_additive_noise_point_only"
