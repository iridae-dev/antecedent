  { id = "b4.latent_mixture_average.positive", role = "positive", intent = "The mixture-average effect is the weighted sum of the class effects.", evidence_test = "crates/antecedent-estimate/tests/latent_class_effects.rs", evidence_assertion = "b4_latent_mixture_average_is_the_weighted_sum_of_class_effects" },
