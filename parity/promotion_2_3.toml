  { code = "invalid_argument", detail = "latent_class.invalid_request", when = "The artifact producer or the Python bridge receives a request that does not parse as a well-formed latent-class request." },
  { code = "invalid_argument", detail = "latent_class.limits_exceeded", when = "A request or artifact exceeds the bounded rows, replicates or size of the Python bridge or consumer." },
  { code = "route_not_supported", detail = "latent_class.wrong_contract", when = "A consumer holds an expected identity and a stored or recomputed identity field (data, configuration, premises or result) differs." },
]
