[[record]]
id = "2.3A.F15.joint_distribution_semantics"
workstream = "F15"
milestone = "A"
work_package = "A0.1"
status = "promoted"
consumer_question = "Can a consumer tell whether supplied draws represent one aligned joint realization, and which causal quantity each axis means?"
theorem = "Semantic contract: covariance and nonlinear functionals require aligned draws from one joint law; independently sampled marginals cannot supply their dependence. This record makes no identification or coverage claim."
reference = "TODO.md A0.1 and A0.2"
guarantee = "checked_joint_alignment_and_axis_identity_semantics_only_no_identification_or_coverage"
graph_class = "A previously identified, finite coordinate causal claim; graph identification belongs to its prerequisite record."
population_semantics = "Each quantity names its population, intervention or regime, conditioning, and time; these coordinates remain distinct across export and refresh."
evidence_family = "An externally supplied or native finite array of aligned joint draws with explicit axes and source identity."
provider = "Declared joint-draw provider with bounded shape and draw count; independent marginals are an unsupported provider for joint functionals."
estimand = "A typed joint distribution over named causal quantities, with derived covariance and nonlinear expectations when their required joint law exists."
inference_claim = "point_only"
owners = ["antecedent-core", "antecedent-io", "antecedent", "python/antecedent"]
prerequisite_records = []
prerequisite_reason = "New cross-cutting representation; it consumes only a separately licensed scientific claim and cannot itself identify or estimate one."
identity_inputs = ["quantity semantic IDs", "axis names and order", "population, regime, conditioning and time", "draw alignment", "provider and snapshot", "distribution meaning"]
wire_changes = ["Planned additive versioned joint-distribution artifact; no 2.2 posterior or bootstrap wire reinterpretation."]
compatibility = "Existing 2.2 posterior artifacts retain their meaning; this record licenses only the point-only consumption of aligned joint draws and grants no identification or coverage claim."
search = false
bounds = { cancellation = true, max_draws = 100000, max_coordinates = 1024 }
refusals = [
  { code = "joint_law_required", detail = "aligned_joint_draws.marginals_not_joint", when = "A covariance or nonlinear joint functional is requested from independent marginal draws." },
]
routes = [
  { name = "antecedent_io.JointDistributionArtifact.consume", stage = "consume", status = "licensed", claim = "point_only" },
]
fixtures = [
  { id = "f15.joint_moments.positive", role = "positive", intent = "Compare exported joint means, covariance and a nonlinear functional with an independently enumerated finite joint law.", evidence_test = "crates/antecedent-io/tests/distribution_artifact.rs", evidence_assertion = "f15_joint_moments_match_the_enumerated_law" },
  { id = "f15.marginal_pairing.negative", role = "negative", intent = "Reject a nonlinear or covariance request backed only by independent marginal artifacts.", evidence_test = "crates/antecedent-io/tests/distribution_artifact.rs", evidence_assertion = "f15_independent_marginals_cannot_supply_covariance" },
  { id = "f15.semantic_mutation.artifact", role = "artifact", intent = "A fresh consumer reproduces values and refuses resealed changes to axes, quantity meaning, draw alignment or snapshot.", evidence_test = "crates/antecedent-io/tests/distribution_artifact.rs", evidence_assertion = "f15_resealed_axes_alignment_and_meaning_changes_are_refused" },
]

