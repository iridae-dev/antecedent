  { id = "x2.adjustment_pair.positive", role = "positive", intent = "A nonlinear adjusted-contrast pair with jointly dropped failing replicates matches walking all n^n row-index tuples.", evidence_test = "crates/antecedent-estimate/tests/scenario_covariance.rs", evidence_assertion = "x2_shared_rows_covariance_adjustment_pair_with_joint_dropping_matches_tuple_enumeration" },
