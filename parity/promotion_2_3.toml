[[record]]
id = "2.3A.X5.new_period_refresh"
workstream = "X5"
milestone = "A"
work_package = "A4"
status = "promoted"
consumer_question = "Can a prepared two-step result accept a new observation period without reusing stale time or selection premises?"
theorem = "Semantic refresh contract: a prepared result is valid for one declared window (graph, horizon, lag alignment, intervention history, selection targets, regimes, proof, observation period, unit ids and snapshot). A replacement is reusable only when all premises are unchanged and both the period and the snapshot are new; the result is then re-evaluated on the new period (never copied) under a receipt binding old and new identities. Any other change is a typed invalidation (horizon_changed, lag_alignment_changed, intervention_history_changed, premises_changed, stale_snapshot), and a refreshed result never carries an interval of the old window. No new identification theorem is claimed. Departures from the frozen wording: the decision and receipt are an identity-comparison contract only; the core refresh tests use a deterministic stand-in evaluator (mean of the snapshot's unit outcomes) to isolate the contract, and the real marginalized re-evaluation is exercised through the artifact and the exact-law prepared adapter. Artifact limit: the artifact re-evaluates from a tally summary of each panel (not the full panel), so a coherently resealed forgery of summaries, law, receipt and values replays. Digests are non-cryptographic FNV-style fingerprints that detect unresealed change, not an adversary."
reference = "TODO.md A4; prerequisite 2.2A.X5.two_step_temporal_transport"
guarantee = "semantic_refresh_identity_decision_and_receipt_point_only"
graph_class = "The 2.2 fixed two-slice graph when the window advances without extending horizon; a third slice requires a separate cell."
population_semantics = "Source, target, period boundaries, observation window and unit lineage are distinct identity inputs."
evidence_family = "A replacement complete-history snapshot with explicit period and unit IDs."
provider = "antecedent_estimate::temporal_refresh: window identity comparison (decide_refresh), receipt (RefreshReceipt) and acceptance (accept_refresh) with the prepared-temporal adapter re-evaluating on the replacement; antecedent_io::temporal_refresh_artifact replays the decision, receipt and both points."
estimand = "The existing horizon-two response re-evaluated on a new declared period, or a typed invalidation."
inference_claim = "point_only"
owners = ["antecedent-estimate", "antecedent-io", "antecedent", "python/antecedent/transport"]
prerequisite_records = ["2.2A.X5.two_step_temporal_transport"]
identity_inputs = ["time window", "observation period", "unit lineage", "selection targets", "regimes", "snapshot and proof"]
wire_changes = ["Additive temporal_new_period_refresh_v1 artifact (kind temporal_new_period_refresh, version 1): old and new window identities, a tally summary of each panel, the target initial-state law and action sequence, the refresh decision (reusable, or invalidated with its typed reason), the refresh receipt with its digest, the interval-invalidated flag and the old and re-evaluated points. Unknown major versions refuse; 2.2 wires are never reinterpreted."]
