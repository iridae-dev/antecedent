[[record]]
id = "2.3B.F4.admissibility_and_support_requirements"
workstream = "F4"
milestone = "B"
work_package = "B0 prerequisite"
status = "promoted"
consumer_question = "Can declared admissibility rules, per-input support rules and an uncertainty requirement be consumed as part of a durable decision contract?"
theorem = "Acceptance boundary: a declared exclusion or hard constraint only removes an action from the admissible set and never adds a penalty (A in {5,6} and B in {2,3} over two structures: excluding A for a stated reason selects B while A keeps its raw range). Support statuses order by severity Supported, WeakOverlap, Extrapolative, OutsideEmpiricalSupport, MissingEvidence; a per-input rule or the default is met only by a status at least as strong, and an input with no rule is unchecked. An uncertainty requirement (none, point_only, structural_envelope, credible) is met only by the supplied claim of exactly its own kind, with none accepting any. Unknown action, unknown input, duplicate and blank-reason rules refuse before any evaluation, and a contract without rules keeps the A0 decision_contract_v1 bytes. This record grants no causal, interval or probability license."
reference = "TODO.md B0 prerequisite; prerequisite feature records F4, F6"
guarantee = "declared_admissibility_support_and_uncertainty_requirements_remove_actions_never_penalize_point_only"
graph_class = "Only an independently identified fixed-graph or declared structural-scenario contract; this composition cell does not identify a graph."
population_semantics = "Population, regime, horizon, conditioning, coordinate support and source/target snapshot identities remain separately bound."
evidence_family = "Two structures with payoffs A=(5,6) and B=(3,2) over equally likely rows; rules declare exclusions, support floors and an uncertainty kind."
provider = "Native implementation; supplied support statuses and claim kinds are unverified inputs and provider trust is never upgraded by representation alone."
estimand = "admissibility and support requirements of a durable decision contract"
inference_claim = "point_only"
owners = ["antecedent-design", "antecedent", "antecedent-py", "python/antecedent"]
prerequisite_records = ["2.3B.F4.decision_contract", "2.3B.F6.structural_decision_policy"]
prerequisite_reason = "Requires the A0 decision contract and the structural policy; registration is not execution."
identity_inputs = ["scientific quantity coordinates", "population, regime and horizon", "snapshot and causal contract", "provider and exact request", "feature-specific action, signal or evidence identities"]
wire_changes = ["Allocate admissible_decision_contract_v1 (kind admissible_decision_contract_v1) as additive v1 metadata: the A0 decision contract plus canonical admissibility rules (declared exclusions with reasons, per-input and default support floors, uncertainty requirement), with an identity that ignores declaration order but not semantics. A contract with no rules keeps the A0 decision_contract_v1 bytes and the two kinds never cross. Decoding is bounded before allocation. Unknown major versions refuse; 2.2 wires are never reinterpreted."]
compatibility = "Existing 2.2 routes and the A0 decision contract keep their exact scope. Point-only: rules remove actions and never penalize them; support statuses and claim kinds are caller-supplied and unverified. Contract-level refusals pass through with their own decision_contract.* details (declared by the F4 contract record). Artifact-level refusals use the decision_artifact.<slot> labels, which are built per slot and are not declared here. The check is a synchronous finite computation without a cancellation hook; bounds.cancellation is recorded because the registry gate requires it."
search = false
bounds = { cancellation = true, max_coordinates = 1024 }
refusals = [
  { code = "invalid_argument", detail = "decision_admissibility.unknown_action", when = "A support rule or declared exclusion names an action the contract does not declare." },
  { code = "invalid_argument", detail = "decision_admissibility.unknown_input", when = "A support rule names an input position the action does not declare." },
  { code = "invalid_argument", detail = "decision_admissibility.duplicate_rule", when = "Two support rules share an action and input, or two exclusions name one action." },
  { code = "invalid_argument", detail = "decision_admissibility.invalid_rule", when = "A rule is malformed, for example an exclusion with a blank reason." },
]
routes = [
  { name = "antecedent.decision.admissibility_rules", stage = "evaluate", status = "licensed", claim = "point_only" },
]
fixtures = [
  { id = "f4.admissibility_exclusion.positive", role = "positive", intent = "A declared exclusion removes A (payoffs 5, 6) so B is the structurally robust choice while A keeps its raw range (5, 6); a hard constraint on A alone leaves B's range (2, 3) untouched and gives A no range.", evidence_test = "crates/antecedent-design/tests/decision_robustness.rs", evidence_assertion = "f4_admissibility_declared_exclusion_and_hard_constraint_only_remove_actions" },
  { id = "f4.uncertainty_kind.positive", role = "positive", intent = "Each uncertainty requirement accepts exactly its own supplied kind (none accepts any); every mismatched pair yields InsufficientClaims.", evidence_test = "crates/antecedent-design/tests/decision_robustness.rs", evidence_assertion = "f4_admissibility_uncertainty_requirement_is_enforced_by_kind" },
  { id = "f4.support_severity.positive", role = "positive", intent = "Support statuses order by severity: a default WeakOverlap floor accepts Supported and WeakOverlap and rejects Extrapolative, a per-input Extrapolative floor accepts Extrapolative and rejects OutsideEmpiricalSupport and MissingEvidence, and an input with no rule is unchecked.", evidence_test = "crates/antecedent-design/tests/decision_robustness.rs", evidence_assertion = "f4_admissibility_support_status_orders_by_severity" },
  { id = "f4.canonical_identity.positive", role = "positive", intent = "The contract identity ignores the order of rules and exclusions but changes with any semantic edit.", evidence_test = "crates/antecedent-design/tests/decision_robustness.rs", evidence_assertion = "f4_admissibility_identity_ignores_order_but_not_semantics" },
  { id = "f4.python_identity.positive", role = "positive", intent = "Through Python the admissible-contract identity ignores order and changes with the rules.", evidence_test = "python/tests/test_decision_robust.py", evidence_assertion = "test_f6_admissible_identity_ignores_order_and_changes_with_rules" },
  { id = "f4.python_exclusions.positive", role = "positive", intent = "Through Python declared exclusions only remove actions and a contract with every action excluded reports no admissible action.", evidence_test = "python/tests/test_decision_robust.py", evidence_assertion = "test_f6_declared_exclusions_and_no_admissible_action_only_remove_actions" },
  { id = "f4.malformed_rules.negative", role = "negative", intent = "An unknown action, unknown input, duplicate rule and blank-reason exclusion refuse with the four registered decision_admissibility details and code invalid_argument.", evidence_test = "crates/antecedent-design/tests/decision_robustness.rs", evidence_assertion = "f4_admissibility_malformed_rules_refuse_with_registered_details" },
  { id = "f4.invalid_rules_wire.negative", role = "negative", intent = "Invalid rules refuse with a structured detail when exported or loaded.", evidence_test = "crates/antecedent-design/tests/decision_robust_artifact.rs", evidence_assertion = "f4_invalid_rules_refuse_with_structured_detail" },
  { id = "f4.resealed_rules.negative", role = "negative", intent = "A consistently resealed rule edit is refused against the identity the consumer retained.", evidence_test = "crates/antecedent-design/tests/decision_robust_artifact.rs", evidence_assertion = "f4_resealed_rule_edit_is_refused_under_the_retained_identity" },
  { id = "f4.bounded_decode.negative", role = "negative", intent = "Decoding is bounded before any allocation, so an oversized declaration is refused.", evidence_test = "crates/antecedent-design/tests/decision_robust_artifact.rs", evidence_assertion = "f4_decode_is_bounded_before_any_allocation" },
  { id = "f4.python_malformed_rules.negative", role = "negative", intent = "Python refuses invalid rules with the registered code and detail.", evidence_test = "python/tests/test_decision_robust.py", evidence_assertion = "test_f6_invalid_rules_refuse_with_registered_code_and_detail" },
  { id = "f4.admissible_replay.artifact", role = "artifact", intent = "An admissible contract round-trips through admissible_decision_contract_v1 with its canonical identity.", evidence_test = "crates/antecedent-design/tests/decision_robust_artifact.rs", evidence_assertion = "f4_admissible_contract_round_trips_with_canonical_identity" },
  { id = "f4.a0_bytes.artifact", role = "artifact", intent = "A contract without rules keeps the A0 decision_contract_v1 bytes, and the two kinds do not cross.", evidence_test = "crates/antecedent-design/tests/decision_robust_artifact.rs", evidence_assertion = "f4_contract_without_rules_keeps_a0_bytes_and_kinds_do_not_cross" },
  { id = "f4.declaration_order.artifact", role = "artifact", intent = "The stored identity ignores declaration order but not semantics.", evidence_test = "crates/antecedent-design/tests/decision_robust_artifact.rs", evidence_assertion = "f4_admissible_identity_ignores_declaration_order_but_not_semantics" },
  { id = "f4.python_fresh_replay.artifact", role = "artifact", intent = "Python exports and loads an admissible contract and refuses a resealed identity.", evidence_test = "python/tests/test_decision_robust.py", evidence_assertion = "test_f6_admissible_contract_exports_loads_and_refuses_a_resealed_identity" },
]

[[record]]
id = "2.3B.F6.structural_robustness_and_adapters"
workstream = "F6"
milestone = "B"
work_package = "B0 prerequisite"
status = "promoted"
consumer_question = "Can structural claims (point, graph-dependent, weighted graph atoms, finite scenarios) and identified-set partial identification be adapted into a decision under a declared policy?"
theorem = "Acceptance boundary: an identified set gives one utility interval per action. With A in [2,8] and B in [4,6] the lower-bound leader is B, the upper-bound leader is A, no action is necessarily best and both stay possibly optimal; maximin selects B (worst cases 2 and 4); maximum regrets are 4 and 4 so minimax regret ties, while widening B to [3,6] gives regrets 4 (A) and 5 (B) and selects A. A in [5,8] against B in [1,4] is necessarily best (5 > 4) but touching intervals [4,8] and [1,4] are not. Losses are minimized at their worst case. An identified set has no probability law, so Bayes over it refuses, and criteria other than expected utility, loss, worst case and minimax regret are not licensed for a set. Completion counts are never probabilities, graph-dependent claims carry none, and unidentified or unevaluated mass is never renormalized away. This record grants no causal, coverage or probability license; the intervals are supplied identified sets, not estimated ones."
reference = "TODO.md B0 prerequisite; prerequisite feature records F4, F6"
guarantee = "claim_adapters_and_identified_set_decisions_over_supplied_sets_no_probability_no_coverage_point_only"
graph_class = "Only an independently identified fixed-graph or declared structural-scenario contract; this composition cell does not identify a graph."
population_semantics = "Population, regime, horizon, conditioning, coordinate support and source/target snapshot identities remain separately bound."
evidence_family = "Two actions with supplied utility intervals A in [2,8], B in [4,6]; and hand-set structural claims whose leaders conflict."
provider = "Native implementation; supplied claims, support statuses and intervals are unverified inputs and provider trust is never upgraded by representation alone."
estimand = "adapted structural claims and identified-set decision"
inference_claim = "point_only"
owners = ["antecedent-design", "antecedent", "antecedent-py", "python/antecedent"]
prerequisite_records = ["2.3B.F4.decision_contract", "2.3B.F6.structural_decision_policy", "2.3B.F4.admissibility_and_support_requirements"]
prerequisite_reason = "Requires the listed feature contracts and a separately licensed scientific producer; registration is not execution."
identity_inputs = ["scientific quantity coordinates", "population, regime and horizon", "snapshot and causal contract", "provider and exact request", "feature-specific action, signal or evidence identities"]
wire_changes = ["No new artifact kind: adapted claims become structural atoms consumed by the robust-result artifact (robust_decision_result_v1, owned by 2.3B.F6.robust_verdicts_and_result_artifact); an identified-set decision is a report of per-action intervals, leaders, dominance, regret and the verdict, with no wire format of its own. Unknown major versions refuse; 2.2 wires are never reinterpreted."]
compatibility = "Existing 2.2 routes keep their exact scope. Point-only and set-valued by construction: intervals are caller-supplied identified sets that the route reports, never estimates, and no coverage, probability or calibration claim is made. The Python bridge adds decision_adapters.* details for malformed claim JSON, which are declared below. The decision_robust.* bridge labels (invalid_receipts, external_trust_never_native, json) belong to the robust-result artifact record and are not declared here, and artifact-slot labels decision_artifact.<slot> are built per slot and are not declared. Synchronous finite computation without a cancellation hook; bounds.cancellation is recorded because the registry gate requires it."
search = false
bounds = { cancellation = true, max_coordinates = 1024 }
refusals = [
  { code = "invalid_argument", detail = "decision_adapters.invalid_claims", when = "A claim set is empty, repeats an atom, carries a malformed value, or at the Python bridge its JSON does not parse as claims." },
  { code = "decision_contract_unsatisfied", detail = "decision_adapters.completion_count_not_probability", when = "Completion counts are supplied where structure probabilities are required; a count is never a probability." },
  { code = "decision_contract_unsatisfied", detail = "decision_adapters.probabilities_required", when = "Bayes over structures is requested from claims that carry no genuine structure probabilities." },
  { code = "invalid_argument", detail = "decision_adapters.graph_claims_carry_no_probability", when = "A graph-dependent claim carries a probability; probability-weighted graphs are adapted as weighted atoms." },
  { code = "decision_contract_unsatisfied", detail = "decision_adapters.policy_mismatch", when = "Claims are adapted under a structural policy other than the contract's declared one." },
  { code = "invalid_argument", detail = "decision_adapters.invalid_interval", when = "An identified-set interval has a non-finite or inverted endpoint." },
  { code = "invalid_argument", detail = "decision_adapters.unknown_action", when = "An identified-set utility names an action the contract does not declare." },
  { code = "invalid_argument", detail = "decision_adapters.duplicate_action", when = "Two identified-set utilities name one action." },
  { code = "invalid_argument", detail = "decision_adapters.missing_action", when = "A declared action has no identified-set utility." },
  { code = "decision_contract_unsatisfied", detail = "decision_adapters.bayes_over_identified_set", when = "Bayes over structures is requested from an identified set, which has no probability law." },
  { code = "decision_contract_unsatisfied", detail = "decision_adapters.criterion_not_licensed_for_set", when = "A criterion other than expected utility, loss, worst case or minimax regret is requested of an identified set." },
  { code = "invalid_argument", detail = "decision_adapters.invalid_utilities", when = "The Python bridge receives identified-set utilities JSON that does not parse." },
  { code = "invalid_argument", detail = "decision_adapters.claims_sources_mismatch", when = "The Python bridge receives a different number of claims and supplied draw sources." },
  { code = "invalid_argument", detail = "decision_adapters.unknown_claim_kind", when = "The Python bridge receives a claim kind other than point, graph_dependent, weighted_graph_posterior or finite_scenarios." },
  { code = "invalid_argument", detail = "decision_adapters.point_claim_is_single", when = "A point claim is supplied with other than exactly one claim." },
  { code = "invalid_argument", detail = "decision_adapters.unknown_claim_status", when = "A claim status is not evaluated, unidentified or unevaluated." },
  { code = "invalid_argument", detail = "decision_adapters.unevaluated_needs_reason", when = "An unevaluated claim carries no reason." },
  { code = "invalid_argument", detail = "decision_adapters.evaluated_needs_draws", when = "An evaluated claim is supplied without its draws." },
  { code = "invalid_argument", detail = "decision_adapters.invalid_probability", when = "A claim probability is not unspecified, genuine with a value, or a completion count." },
  { code = "invalid_argument", detail = "decision_adapters.unknown_support_status", when = "A support status name is not a registered support status." },
]
routes = [
  { name = "antecedent.decision.claim_adapters", stage = "evaluate", status = "licensed", claim = "point_only" },
  { name = "antecedent.decision.identified_set", stage = "evaluate", status = "licensed", claim = "point_only" },
]
fixtures = [
  { id = "f6.adapter_invariant.positive", role = "positive", intent = "An invariant best action is found across graph-dependent claims by hand-set payoffs.", evidence_test = "crates/antecedent-design/tests/decision_adapters.rs", evidence_assertion = "f6_adapter_invariant_best_action_across_graph_dependent_claims" },
  { id = "f6.adapter_graph_leaders.positive", role = "positive", intent = "Graph-dependent claims name each graph's leader and no probability-weighted winner.", evidence_test = "crates/antecedent-design/tests/decision_adapters.rs", evidence_assertion = "f6_adapter_graph_dependent_claims_name_each_graphs_leader" },
  { id = "f6.adapter_unrenormalized.positive", role = "positive", intent = "Weighted graph atoms keep unidentified mass and never renormalize it away.", evidence_test = "crates/antecedent-design/tests/decision_adapters.rs", evidence_assertion = "f6_adapter_weighted_graph_atoms_never_renormalize_unidentified_mass" },
  { id = "f6.adapter_finite_scenarios.positive", role = "positive", intent = "Finite scenarios with declared weights adapt to weighted atoms.", evidence_test = "crates/antecedent-design/tests/decision_adapters.rs", evidence_assertion = "f6_adapter_finite_scenarios_with_declared_weights" },
  { id = "f6.adapter_point_claim.positive", role = "positive", intent = "A point claim is a point, not an envelope.", evidence_test = "crates/antecedent-design/tests/decision_adapters.rs", evidence_assertion = "f6_adapter_point_claim_is_a_point_not_an_envelope" },
  { id = "f6.adapter_partial_identification.positive", role = "positive", intent = "A in [2,8], B in [4,6]: lower leader B, upper leader A, conflicting, both possibly optimal and neither necessarily best; maximin selects B; maximum regrets are 4 and 4 and tie; widening B to [3,6] gives regrets 4 and 5 and selects A.", evidence_test = "crates/antecedent-design/tests/decision_adapters.rs", evidence_assertion = "f6_adapter_partial_identification_gives_an_interval_per_action_with_conflicting_leaders" },
  { id = "f6.adapter_dominance.positive", role = "positive", intent = "A in [5,8] against B in [1,4] is necessarily best with maximum regrets 0 and 7; touching intervals [4,8] and [1,4] are not.", evidence_test = "crates/antecedent-design/tests/decision_adapters.rs", evidence_assertion = "f6_adapter_identified_sets_with_a_dominating_action_have_a_necessarily_best" },
  { id = "f6.adapter_losses.positive", role = "positive", intent = "Losses A in [2,8] and B in [4,6] are minimized at their worst case (8 against 6), choosing B.", evidence_test = "crates/antecedent-design/tests/decision_adapters.rs", evidence_assertion = "f6_adapter_identified_losses_are_minimized_at_their_worst_case" },
  { id = "f6.adapter_constraints.positive", role = "positive", intent = "Identified sets respect hard constraints, declared exclusions and support rules.", evidence_test = "crates/antecedent-design/tests/decision_adapters.rs", evidence_assertion = "f6_adapter_identified_sets_respect_constraints_declarations_and_support" },
  { id = "f6.adapter_utility_interval.positive", role = "positive", intent = "A utility interval encloses a nonlinear utility of the supplied input intervals.", evidence_test = "crates/antecedent-design/tests/decision_adapters.rs", evidence_assertion = "f6_adapter_utility_interval_encloses_the_nonlinear_utility" },
  { id = "f6.python_identified_sets.positive", role = "positive", intent = "Through Python an identified set reports an interval per action, necessarily-best and worst-case verdicts, and refuses Bayes and inverted intervals.", evidence_test = "python/tests/test_decision_robust.py", evidence_assertion = "test_f6_identified_sets_partial_identification_reports_an_interval_per_action" },
  { id = "f6.python_identified_support.positive", role = "positive", intent = "Through Python identified sets apply support, hard exclusions and interval arithmetic.", evidence_test = "python/tests/test_decision_robust.py", evidence_assertion = "test_f6_identified_sets_apply_support_hard_exclusions_and_interval_arithmetic" },
  { id = "f6.adapter_set_refusals.negative", role = "negative", intent = "Identified-set refusals (inverted interval, unknown, duplicate and missing actions, Bayes over a set, an unlicensed criterion) carry the registered details.", evidence_test = "crates/antecedent-design/tests/decision_adapters.rs", evidence_assertion = "f6_adapter_identified_set_refusals" },
  { id = "f6.adapter_graph_probabilities.negative", role = "negative", intent = "Graph-dependent claims that carry probabilities refuse.", evidence_test = "crates/antecedent-design/tests/decision_adapters.rs", evidence_assertion = "f6_adapter_graph_dependent_claims_refuse_probabilities" },
  { id = "f6.adapter_bayes.negative", role = "negative", intent = "Bayes over weighted atoms refuses without genuine probabilities and completion counts are not probabilities.", evidence_test = "crates/antecedent-design/tests/decision_adapters.rs", evidence_assertion = "f6_adapter_weighted_atoms_bayes_refusal_without_genuine_probabilities" },
  { id = "f6.adapter_policy_mismatch.negative", role = "negative", intent = "A policy or claim-shape mismatch refuses.", evidence_test = "crates/antecedent-design/tests/decision_adapters.rs", evidence_assertion = "f6_adapter_policy_and_claim_shape_mismatches_refuse" },
  { id = "f6.python_completion_counts.negative", role = "negative", intent = "Through Python unresolved mass is kept and completion counts are refused as weights.", evidence_test = "python/tests/test_decision_robust.py", evidence_assertion = "test_f6_weighted_atoms_keep_unresolved_mass_and_completion_counts_are_not_weights" },
