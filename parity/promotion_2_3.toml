[[record]]
id = "2.3C.C1.composition_boundary"
workstream = "C1"
milestone = "C"
work_package = "C1"
status = "promoted"
consumer_question = "Can a decision input carry its support, trust, calibration and capabilities from evidence only, can each action be judged on its own coordinates, and can sources be combined only under a declared operation that refuses shared or unknown dependence?"
theorem = "Acceptance boundary: a DecisionInput wraps a mean grid, an aligned joint law or a scalar claim with its provenance and a per-coordinate support map, and its trust comes only from evidence: an artifact labelled native or exact is stored as unverified unless a matching native execution record or an exact-request verification receipt is supplied, and a contract that requires native or verified inputs refuses the label. Hand anchors: four equally weighted joint draws x0 = [1, 2, 3, 2] (mean 2) and x1 = [4, 0, 2, 6] (mean 3) with identity utilities give E[U(wait)] = 2, E[U(treat)] = 3, E[max] = (4 + 2 + 3 + 6)/4 = 3.75 and EVPI = 0.75; a mean source with E[Y|do(a=0)] = 1 and E[Y|do(a=1)] = 3 under the affine utility 2x - 1 gives wait = 1 and treat = 5, and cannot answer a probability, a quantile or a nonlinear utility. An action that reads a missing or too weakly supported coordinate is marked unsupported or unevaluated with a reason while the supported actions are still compared (one missing coordinate beside a supported action; all actions unsupported is a state, not an error). Independent pooling and paired draws are refused when two inputs share data, a prior or a fitted model, when dependence is unknown or undeclared (a pair with no declared relation is unknown), or when two inputs declared independent carry one snapshot identity, unless a covariance or joint-law route names one of the pair as an aligned joint law. Pooling, borrowing, transport and evidence reuse are separate declared operations and an undeclared operation refuses. Conflicting structural atoms are averaged only when every atom carries a declared probability (finite, non-negative, summing to at most one, missing mass retained). This record grants no causal, interval or probability license."
reference = "TODO.md C1 (carry support and trust into every decision input; per-action support; source overlap and dependence); prerequisite feature records F5, F22, F23, F24"
guarantee = "decision_input_trust_from_evidence_only_per_action_support_and_declared_dependence_boundary_point_only"
graph_class = "Only an independently identified fixed-graph or declared structural-scenario contract; this composition cell does not identify a graph."
