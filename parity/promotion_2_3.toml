[[record]]
id = "2.3B.F13.repair_search_receipt"
workstream = "F13"
milestone = "B"
work_package = "B0.1"
status = "promoted"
consumer_question = "Can a stored repair search receipt be replayed by a fresh consumer under its own bounds?"
theorem = "A repair_search_receipt_v1 artifact stores the contract family, the candidates with their semantic ids, the obligations, per-subset hypothetical evidence deltas, the checker derivation, the classification and the SearchReceipt. A consumer trusts nothing stored: it rebuilds the family, re-runs the family's own checker on each stored delta and accepts only an identical classification, derivation, obligation set and receipt. A truncated search is stored as unevaluated and a beyond-depth region as not examined, never as impossible. This record alone grants no causal or interval license."
reference = "TODO.md B0.1; prerequisite record 2.3B.F13.identification_repair"
guarantee = "replayable_repair_search_receipt_recomputed_by_the_family_checker_from_the_stored_delta_no_claim"
graph_class = "A back-door or classical transport contract over a graph on dense static variables 0..n; other graphs are not exportable."
population_semantics = "Populations, regimes and candidate identities are stored and replayed unchanged."
evidence_family = "The stored report of a repair search over proposed study candidates; no observed data is carried."
provider = "Native replay by the family's own checker; no external provider."
estimand = "repair search receipt replay"
inference_claim = "none"
owners = ["antecedent-design"]
prerequisite_records = ["2.3B.F13.identification_repair"]
prerequisite_reason = "Replays the report of the repair facade; it executes only through that record's checkers."
identity_inputs = ["contract family and graph", "candidate semantic ids", "obligation ids", "hypothetical deltas", "stored limits"]
wire_changes = ["repair_search_receipt_v1 (kind repair_search_receipt_v1) is the F13 artifact; this record declares its refusal contract. Unknown versions and kinds refuse; a producer refuses a report of another contract or family."]
compatibility = "Additive to 2.3B.F13.identification_repair, whose refusal details live in the identification_repair namespace; this record carries the repair_artifact namespace so each record keeps one namespace. The consumer replays under its own limits, so the replay itself is budgeted; no 2.2 wire changes."
search = false
bounds = { cancellation = true, max_coordinates = 1024 }
refusals = [
  { code = "transport_not_certified", detail = "repair_artifact.invalid_artifact", when = "An artifact fails its digest, a stored obligation id does not match its content, or a report for another contract is exported under a family." },
  { code = "transport_not_certified", detail = "repair_artifact.unsupported_version", when = "An artifact carries an unknown version or kind." },
  { code = "route_not_supported", detail = "repair_artifact.bounds_exceeded", when = "Stored limits or sizes exceed the consumer's own maxima." },
  { code = "transport_budget_cancel", detail = "repair_artifact.budget", when = "The consumer's budget or cancellation stops the replay." },
  { code = "transport_not_certified", detail = "repair_artifact.replay_mismatch", when = "A recomputed classification, derivation, obligation set, candidate outcome or receipt differs from the stored one." },
]
routes = [
  { name = "antecedent.repair.search_receipt", stage = "consume", status = "licensed", claim = "none" },
]
fixtures = [
  { id = "f13.receipt_transport.positive", role = "positive", intent = "A transport report round-trips through the container, replays identically and stores the hypothetical delta of the verified-sufficient subset with its checker derivation.", evidence_test = "crates/antecedent-design/tests/repair_artifact.rs", evidence_assertion = "f13_transport_artifact_round_trips_and_stores_the_hypothetical_delta" },
  { id = "f13.receipt_assumptions.positive", role = "positive", intent = "Assumption obligations survive the artifact and keep blocking certification.", evidence_test = "crates/antecedent-design/tests/repair_artifact.rs", evidence_assertion = "f13_assumption_obligations_survive_the_artifact_and_block_certification" },
  { id = "f13.receipt_version.negative", role = "negative", intent = "An unknown version is refused as unsupported_version, stored limits above the consumer's maxima as bounds_exceeded and a corrupt container by the bounded reader.", evidence_test = "crates/antecedent-design/tests/repair_artifact.rs", evidence_assertion = "f13_unknown_version_and_kind_are_refused_and_stored_limits_are_bounded" },
  { id = "f13.receipt_foreign_contract.negative", role = "negative", intent = "A report for another contract cannot be exported under this family.", evidence_test = "crates/antecedent-design/tests/repair_artifact.rs", evidence_assertion = "f13_a_report_for_another_contract_cannot_be_exported_under_this_family" },
  { id = "f13.receipt_truncated.artifact", role = "artifact", intent = "A budget-truncated search is stored as unevaluated with exact totals and replays, never as impossible.", evidence_test = "crates/antecedent-design/tests/repair_artifact.rs", evidence_assertion = "f13_truncated_search_is_retained_as_unevaluated_never_as_impossible" },
  { id = "f13.receipt_beyond_depth.artifact", role = "artifact", intent = "A subset region beyond the declared depth is stored as not examined and replays.", evidence_test = "crates/antecedent-design/tests/repair_artifact.rs", evidence_assertion = "f13_beyond_depth_is_stored_as_not_examined" },
]

[[record]]
id = "2.3B.X4.dose_grid_functional"
workstream = "X4"
milestone = "B"
work_package = "B1"
status = "promoted"
consumer_question = "What are the level, derivative or contrast of a randomized-dose response curve at named doses, and where is the data too thin to say?"
theorem = "For a randomized continuous dose D (the empty adjustment set is valid, so E[Y(d)] = E[Y | D = d]), the Gaussian-kernel local quadratic smoother at a caller-declared fixed bandwidth h reproduces a quadratic response exactly on noise-free rows, so its level, first derivative and contrast equal the closed form (m(d) = 1 + d/2 + d^2/4, m'(d) = 1/2 + d/2, m(3) - m(1) = 3). Exactly one named functional (Level, Derivative or Contrast between two named doses) is evaluated per call, each with its own typed claim; the simultaneous band is a different claim and is closed. The smoothing bias m_h - m is neither estimated nor included in any interval. This is the smoother's value, not an inherited asymptotic theorem."
reference = "TODO.md B1; provenance/b1_dose_grid_functional.toml"
guarantee = "randomized_dose_gaussian_local_quadratic_named_functional_point_values_with_per_dose_support_pointwise_calibration_unmeasured_band_closed"
graph_class = "A randomized dose, attested by the caller: the dose is independent of the potential-outcome process, so no adjustment is needed. An observational dose is refused (dose_grid.graph_not_certified); this row does not adjust and re-derives no graph."
population_semantics = "One population and one row snapshot of independent (dose, outcome) rows; clustered, serial or linked rows are outside the row. Support is judged per requested dose."
evidence_family = "Aligned finite (dose, outcome) rows, at least three, no external model or law; no nuisance fit beyond the fixed-bandwidth local quadratic."
provider = "antecedent_estimate::dose_grid_functional (Gaussian-kernel local quadratic with a heteroskedasticity-robust sandwich standard error from the linearized influences), sealed by antecedent_io::dose_grid_functional_artifact (format version 1) and exposed through antecedent::analysis::dose_grid_functional and python/antecedent/dose_grid.py. The composed sampled provider and its intervals are not licensed."
estimand = "The smoother's dose-response level m_h(d), derivative m_h'(d) or contrast m_h(to) - m_h(from), at named doses, with a per-dose support label (Supported, WeakOverlap, OutsideEmpiricalSupport)."
inference_claim = "point_only"
inference_notes = "The point values are the claim. Pointwise normal intervals and standard errors are reported with calibration unmeasured, the nominal level 0.95 is not a coverage claim, and the smoothing bias is not included. The coverage debt is allocated and not collected, to be measured only at the 2.3 release cut: cov.dose_response.randomized_dose.frequentist.l95.pointwise_local_quadratic_level, cov.dose_response.randomized_dose.frequentist.l95.pointwise_local_quadratic_derivative and cov.dose_response.randomized_dose.frequentist.l95.pointwise_local_quadratic_contrast. The simultaneous band is closed (dose_grid.simultaneous_band_closed) until its own calibration exists."
owners = ["antecedent-estimate", "antecedent-io", "antecedent", "python/antecedent"]
prerequisite_records = ["2.2B.X4.smoothed_dose_response_transport"]
prerequisite_reason = "A standalone row beside the 2.2 smoothed dose-response transport row: it consumes a caller-attested randomized design and re-derives no graph; it reuses that row's local-quadratic and per-dose support vocabulary without changing it."
identity_inputs = ["design attestation", "named functional and its claim flags", "grid or the two contrast doses", "bandwidth and its declared range", "minimum local effective sample size", "the (dose, outcome) table bit for bit"]
wire_changes = ["Additive dose_grid_functional_row_v1 artifact (format version 1) carrying the design, the one functional, the grid, the bandwidth and range, the minimum effective sample size, the claims, the compact (dose, outcome) table and the full result with per-dose support, standard errors, intervals marked unmeasured, the numerical residual and the closed band marker. Two digests: premises and data. A consumer recomputes the fit from the table and accepts only a bit-identical result; unknown versions, feature markers or a band marker other than closed refuse."]
compatibility = "Existing 2.2 routes and response grids keep their exact scope; the Gaussian local quadratic kernel is reused unchanged. The composed sampled provider and every interval route stay closed with calibration unmeasured."
search = false
bounds = { cancellation = true, max_coordinates = 1024 }
refusals = [
  { code = "effect_not_identified", detail = "dose_grid.graph_not_certified", when = "The dose is observational: this row requires a randomized dose and does not adjust." },
  { code = "route_not_supported", detail = "dose_grid.simultaneous_band_closed", when = "A simultaneous band is requested; it is a separate claim whose calibration is unmeasured." },
  { code = "option_not_applicable", detail = "dose_grid.derivative_without_claim", when = "A derivative is requested without declaring a derivative claim." },
  { code = "option_not_applicable", detail = "dose_grid.level_without_claim", when = "A level or contrast is requested without declaring a pointwise level claim." },
  { code = "cell_not_licensed", detail = "dose_grid.unsupported_dose", when = "A requested dose lies outside the observed dose support; it is labelled and refused, never extrapolated." },
  { code = "cell_not_licensed", detail = "dose_grid.insufficient_local_weight", when = "A requested dose has Kish effective sample size below the declared minimum, or the local quadratic cannot be fitted there." },
  { code = "invalid_argument", detail = "dose_grid.invalid_request", when = "Rows are misaligned, non-finite or fewer than three, the requested doses are empty or non-finite, the minimum effective sample size is below 3, or the bandwidth range is malformed." },
  { code = "invalid_argument", detail = "dose_grid.bandwidth_outside_range", when = "The fixed bandwidth is not inside the declared bandwidth range." },
  { code = "transport_numerical_failure", detail = "dose_grid.non_finite_result", when = "The local fit produced a non-finite value." },
  { code = "invalid_argument", detail = "dose_grid.refused", when = "An estimation refusal reaches the artifact boundary without a namespaced detail." },
  { code = "route_not_supported", detail = "dose_grid.unsupported_semantics", when = "An artifact carries an unknown version, feature marker, field spelling or band marker." },
  { code = "invalid_argument", detail = "dose_grid.consumer_limit_exceeded", when = "A stored table or grid exceeds the consumer's own limits." },
  { code = "invalid_argument", detail = "dose_grid.premises_mismatch", when = "A resealed artifact changes its design, functional, grid, bandwidth, range, minimum effective sample size or claims." },
  { code = "invalid_argument", detail = "dose_grid.data_identity_mismatch", when = "A resealed artifact changes its (dose, outcome) table." },
  { code = "invalid_argument", detail = "dose_grid.result_replay_mismatch", when = "The stored result differs from the independent recomputation." },
  { code = "invalid_argument", detail = "dose_grid.undecodable", when = "An artifact does not decode." },
]
routes = [
  { name = "antecedent.dose.dose_grid_functional", stage = "evaluate", status = "licensed", claim = "point_only" },
]
