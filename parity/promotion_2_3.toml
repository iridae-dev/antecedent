  { id = "c3.verifiers_external_mean.positive", role = "positive", intent = "An external mean decision is point-only attested, with verification only when the receipt is retained.", evidence_test = "crates/antecedent-design/tests/composition_verifiers.rs", evidence_assertion = "c3_verifiers_external_mean_decision_is_point_only_attested_with_verification_only_when_retained" },
  { id = "c3.verifiers_mean_helper.positive", role = "positive", intent = "The mean-decision helper matches direct evaluation and refuses what a mean cannot answer.", evidence_test = "crates/antecedent-design/tests/composition_verifiers.rs", evidence_assertion = "c3_verifiers_mean_decision_helper_matches_direct_evaluation_and_refuses_what_a_mean_cannot_answer" },
  { id = "c3.verifiers_changed_mean.negative", role = "negative", intent = "A changed mean value fails the point-only result.", evidence_test = "crates/antecedent-design/tests/composition_verifiers.rs", evidence_assertion = "c3_verifiers_changed_mean_value_fails_the_point_only_result" },
  { id = "c3.verifiers_joint_over_mean.negative", role = "negative", intent = "A joint requirement over a mean-only claim fails unsupported_law.", evidence_test = "crates/antecedent-design/tests/composition_verifiers.rs", evidence_assertion = "c3_verifiers_joint_requirement_over_a_mean_only_claim_fails_unsupported_law" },
  { id = "c3.verifiers_swapped_quantity.negative", role = "negative", intent = "A swapped quantity fails the dependent result even after the inner artifact is resealed.", evidence_test = "crates/antecedent-design/tests/composition_verifiers.rs", evidence_assertion = "c3_verifiers_swapped_quantity_fails_the_dependent_result_after_resealing_the_inner_artifact" },
  { id = "c3.verifiers_other_contract.negative", role = "negative", intent = "A decision over another contract or an unrelated source is refused.", evidence_test = "crates/antecedent-design/tests/composition_verifiers.rs", evidence_assertion = "c3_verifiers_a_decision_over_other_contract_or_unrelated_source_is_refused" },
  { id = "c3.verifiers_swapped_snapshot.negative", role = "negative", intent = "A swapped snapshot fails the bound sensitivity node.", evidence_test = "crates/antecedent-design/tests/composition_verifiers.rs", evidence_assertion = "c3_verifiers_swapped_snapshot_fails_the_bound_sensitivity_node" },
  { id = "c3.verifiers_swapped_evidence.negative", role = "negative", intent = "Swapped evidence fails the relationship node.", evidence_test = "crates/antecedent-design/tests/composition_verifiers.rs", evidence_assertion = "c3_verifiers_swapped_evidence_fails_the_relationship_node" },
  { id = "c3.verifiers_changed_provider.negative", role = "negative", intent = "A changed provider request fails the robust result.", evidence_test = "crates/antecedent-design/tests/composition_verifiers.rs", evidence_assertion = "c3_verifiers_changed_provider_request_fails_the_robust_result" },
  { id = "c3.verifiers_registry_coverage.artifact", role = "artifact", intent = "The registry covers every verifiable artifact kind and refuses the rest.", evidence_test = "crates/antecedent-design/tests/composition_verifiers.rs", evidence_assertion = "c3_verifiers_registry_covers_every_artifact_kind_and_refuses_the_rest" },
  { id = "c3.verifiers_ranking_replay.artifact", role = "artifact", intent = "A study ranking is replayed and bound to its source digests.", evidence_test = "crates/antecedent-design/tests/composition_verifiers.rs", evidence_assertion = "c3_verifiers_ranking_is_replayed_and_bound_to_its_source_digests" },
]

[[record]]
id = "2.3B.F6.scenario_claims_adapters"
workstream = "F6"
milestone = "B"
work_package = "B0 prerequisite"
status = "promoted"
consumer_question = "Can the real 2.2 scenario, weighted-scenario and CPDAG-completion reports be adapted into decision atoms and per-action identified-set intervals without renormalizing unresolved mass or reading completion counts as probabilities?"
theorem = "Acceptance boundary: each scenario of a ScenarioSetReport becomes one structural atom keeping its status, declared weight and support; a structurally unidentified scenario is an unidentified atom and every other scenario that produced no law is an unevaluated atom, and their mass is retained, never renormalized over the identified scenarios. Declared weights are used only for a WeightedScenarioReport. Hand anchors: scenario a_direct gives P(y=1) = 0.08 + 0.48 = 0.56 and b_standardize gives 0.75 * 0.2 + 0.25 * 0.8 = 0.35, with actions treat (utility y - cost) and hold (utility 0.5 y). At cost 0.05 treat beats hold in both scenarios (0.51 > 0.28 and 0.30 > 0.175), so the invariant best action is treat; at cost 0.2 treat leads under a_direct (0.36 > 0.28) and hold under b_standardize (0.175 > 0.15) so no action is invariant, and maximin picks hold because treat's worst case 0.15 is below hold's 0.175. With an unresolved scenario present (c_shift selects on y; d_late is left unevaluated) invariance and worst case are left unchecked. A CPDAG report is graph dependent: one unweighted atom per completion, a truncated enumeration becomes one unevaluated atom carrying the unread count, and completion counts are never probabilities, so Bayes over them refuses. An identified set (an envelope, a weighted report's range or an interval source) becomes one interval per action by interval arithmetic and covers identified scenarios only. A source that differs from the identity the caller retained, an action input bound to no scenario outcome and a policy other than the contract's refuse. This record grants no causal, interval-coverage or probability license."
reference = "TODO.md B0 prerequisite (F6 adapters from structural claims) and 2.3B remainder; prerequisite records 2.2A.X2.finite_scenario_envelope and 2.3A.X2.cpdag_completion_scenarios"
guarantee = "scenario_and_completion_reports_adapted_to_atoms_and_intervals_unrenormalized_counts_never_probabilities_point_only"
graph_class = "Only an independently identified fixed-graph or declared structural-scenario contract; each scenario or completion keeps the status the 2.2 report gave it and this adapter does not identify a graph."
population_semantics = "Population, regime, horizon, conditioning, coordinate support and source and target snapshot identities remain separately bound; each atom keeps the scenario's own status, declared weight and caller-bound support."
evidence_family = "Two to four transport scenarios over z -> x, z -> y, x -> y, x <-> y with hand-derived P(y=1) of 0.56 and 0.35, an unidentified selection scenario and a budget-unevaluated scenario, and a CPDAG completion report."
provider = "Native adapter over the real 2.2 estimate-crate reports; the reports' own evaluators produce the laws and this record changes none of them."
estimand = "scenario and completion claims as decision atoms and identified-set intervals"
inference_claim = "point_only"
inference_notes = "Claim policy (calibration is measured once at the release cut): the licensed claim is the point decision values and leaders over the supplied scenarios and the set-valued intervals reported as given. No interval produced here is a coverage claim, and every standard error or diagnostic a scenario law carries stays labelled calibration 'unmeasured'. No coverage record is allocated (the registry accepts coverage_records only for a calibrated claim)."
owners = ["antecedent", "antecedent-design", "antecedent-py", "python/antecedent"]
prerequisite_records = ["2.2A.X2.finite_scenario_envelope", "2.3A.X2.cpdag_completion_scenarios", "2.3B.F6.structural_robustness_and_adapters"]
prerequisite_reason = "Adapts the executing 2.2 finite-scenario report and the 2.3 CPDAG completion report into the F6 structural adapters; registration is not execution."
identity_inputs = ["scenario ids and content digests of status, weight and law", "premises and data digests retained by the caller", "action input to scenario outcome bindings", "declared weights and per-scenario support", "decision contract and structural policy"]
wire_changes = ["None: no new artifact kind. The conversion records a ClaimSource identity (scenario ids, a content digest of each scenario's status, weight and law, and the premises and data digests) that a caller may retain and pass back, and the atoms feed the existing robust-result artifact (robust_decision_result_v1, owned by 2.3B.F6.robust_verdicts_and_result_artifact). Unknown major versions refuse; 2.2 wires are never reinterpreted."]
compatibility = "Additive: no 2.2 route or wire changes, and the 2.2 reports are read, not altered. Point-only: unidentified and unevaluated mass and a truncated completion count are retained, never renormalized; an identified set covers identified scenarios only and refuses otherwise; support is caller-bound per scenario. Adapter-level refusals pass through with their own decision_adapters.* details (declared by 2.3B.F6.structural_robustness_and_adapters). The conversion does not verify the 2.2 report itself. Synchronous finite computation without a cancellation hook; bounds.cancellation is recorded because the registry gate requires it."
search = false
bounds = { cancellation = true, max_coordinates = 1024 }
surface_rust = ["crates/antecedent/src/analysis/decision_claims.rs"]
surface_values = ["DecisionStructuralPolicy", "ClaimError", "OutcomeBinding", "ScenarioClaimBinding", "ScenarioDigest", "ClaimSource", "ScenarioAtomRecord", "ScenarioClaims", "ScenarioDecision", "IntervalReading"]
refusals = [
  { code = "invalid_argument", detail = "decision_claims.unsupported_claim_shape", when = "The report supplies a claim shape the adapter cannot convert, for example a set with no scenarios." },
  { code = "decision_contract_unsatisfied", detail = "decision_claims.missing_scenario_utility", when = "An action input is bound to no outcome the scenarios evaluate, so its utility cannot be read in a scenario." },
  { code = "decision_contract_unsatisfied", detail = "decision_claims.probabilities_not_declared", when = "Bayes over structures is requested from a report with no declared scenario weights, or from completion counts, which are never probabilities." },
  { code = "invalid_argument", detail = "decision_claims.identity_mismatch", when = "The converted report differs from the identity the caller retained (scenario ids, a scenario digest, or the premises or data digest)." },
  { code = "decision_contract_unsatisfied", detail = "decision_claims.range_unavailable", when = "A weighted report has no range: its outcome domain is unbounded with unaccounted mass, or no scenario is identified." },
  { code = "decision_contract_unsatisfied", detail = "decision_claims.unresolved_scenarios", when = "An identified set is requested while unidentified or unevaluated scenarios, or a truncated completion enumeration, are not covered by it." },
]
routes = [
  { name = "antecedent.claims.scenario_atoms", stage = "representation", status = "licensed", claim = "point_only", covers = ["scenario_claims", "evaluate_scenario_decision", "atom_leaders"] },
  { name = "antecedent.claims.cpdag_completion_atoms", stage = "representation", status = "licensed", claim = "point_only", covers = ["cpdag_claims", "evaluate_cpdag_decision"] },
  { name = "antecedent.claims.scenario_identified_sets", stage = "evaluate", status = "licensed", claim = "point_only", covers = ["envelope_identified_utilities", "weighted_identified_utilities", "report_identified_utilities", "interval_identified_utilities"] },
]
fixtures = [
  { id = "f6.scenario_atoms.positive", role = "positive", intent = "Scenario atoms keep status, declared weight and support, and unidentified and unevaluated mass is retained and never renormalized.", evidence_test = "crates/antecedent/tests/decision_claims.rs", evidence_assertion = "b_claims_scenario_atoms_keep_status_weight_support_and_unrenormalized_mass" },
  { id = "f6.scenario_unweighted.positive", role = "positive", intent = "An unweighted report yields unweighted atoms.", evidence_test = "crates/antecedent/tests/decision_claims.rs", evidence_assertion = "b_claims_unweighted_report_gives_unweighted_atoms" },
  { id = "f6.scenario_policies.positive", role = "positive", intent = "At cost 0.05 treat is the invariant best action (0.51 and 0.30 against 0.28 and 0.175); at cost 0.2 the leaders differ (treat then hold) and maximin selects hold (0.15 below 0.175).", evidence_test = "crates/antecedent/tests/decision_claims.rs", evidence_assertion = "b_claims_policies_reach_the_hand_derived_choices" },
