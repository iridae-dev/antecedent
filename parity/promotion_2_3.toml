[[record]]
id = "2.3A.X2.shared_scenario_covariance"
workstream = "X2"
milestone = "A"
work_package = "A1"
status = "promoted"
consumer_question = "How correlated are effect estimates from identified DAG completions that reuse the same observed units?"
theorem = "Whole-row resampling that preserves one replicate identity across scenarios: every replicate resamples the rows once and feeds the same per-row multiplicities to every scenario's plug-in estimator, so the joint covariance matrix of the estimates is estimated, not assumed; independent per-scenario resamples cannot estimate shared-data covariance and always report a zero off-diagonal. Two methods share one output: a seeded whole-row nonparametric bootstrap (Efron 1979) with the R/(R-1) covariance correction, and exact enumeration of the multinomial resampling distribution for at most 24 rows, which has no Monte Carlo error. A replicate or count vector on which any estimator fails is dropped for every scenario jointly, its mass is reported and the surviving mass is renormalized. This record makes no interval claim. Departures from the frozen wording: the estimators are plug-in functionals (not influence-function calculations) and the family is not restricted to CPDAG completions, any scenarios declared over the same row snapshot qualify."
reference = "TODO.md A1; prerequisite 2.3A.X2.cpdag_completion_scenarios"
guarantee = "shared_row_resampling_covariance_point_only_no_interval"
graph_class = "No graph claim of its own: the scenario estimates are supplied plug-in functionals of one complete-row table (a linear score of per-row terms, or a stratified adjusted contrast), typically those of the identified completions of the bounded CPDAG cell. Identification of each scenario's estimand belongs to its own record."
population_semantics = "One target population and one row snapshot with stable unit identities; a replicate selects the same units for every scenario. Scenarios on a different snapshot, a different or reordered unit list, duplicate unit identities, a declared independent sample or an undeclared dependence are refused, never reported as a zero off-diagonal."
evidence_family = "A single iid complete-row sample (a row table of at most 10000 rows and 64 columns) with stable row identities."
provider = "One joint covariance estimator over the scenario-specific plug-in estimators: families linear_score and adjusted_contrast, with methods shared_row_bootstrap (at most 2000 replicates) and exact_enumeration (at most 24 rows and 4000000 count vectors)."
estimand = "Joint sampling covariance matrix of the scenario-specific effect estimates under multinomial row resampling, with the per-scenario means and the replicate accounting (used, failed and failed mass)."
inference_claim = "point_only"
inference_notes = "A covariance matrix of plug-in estimates is a point-only claim: no standard error, interval or coverage is derived from it and its meaning is fixed by the interpretation string joint_sampling_covariance_of_scenario_estimates_point_only_not_an_interval. The bootstrap covariance is a Monte Carlo estimate of the resampling covariance and carries no calibration claim."
owners = ["antecedent-estimate", "antecedent-io", "antecedent", "python/antecedent/transport"]
prerequisite_records = ["2.2A.X2.finite_scenario_envelope", "2.3A.X2.cpdag_completion_scenarios"]
identity_inputs = ["ordered scenario identities", "common row snapshot", "unit IDs", "estimand coordinates", "replicate or influence method"]
wire_changes = ["Additive covariance artifact v1 (feature scenario_shared_covariance_v1) carrying the row table, every scenario's declared functional, snapshot and dependence, the method and its options, the covariance result, a premises digest and a separate data digest. A fresh consumer recomputes the matrix from the declarations under its own limits and refuses a resealed change to the row snapshot, scenario order, functional or result."]
compatibility = "The 2.2 structural envelope remains a structural range without a sampling covariance or interval; this cell adds a separate artifact and changes no 2.2 wire field."
search = false
bounds = { cancellation = true, max_completions = 64, max_replicates = 2000, max_exact_rows = 24, max_exact_compositions = 4000000, max_table_rows = 10000, max_table_columns = 64 }
surface_rust = ["crates/antecedent-estimate/src/scenario_covariance.rs", "crates/antecedent-io/src/scenario_covariance_artifact.rs"]
surface_exports = ["python/antecedent/transport/advanced.py"]
owned_exports = ["AdjustedContrast", "LinearScore", "RowTable", "ScenarioCovarianceRefusal", "ScenarioCovarianceResult", "ScenarioEstimator", "ScoreTerm", "consume_scenario_covariance_artifact", "scenario_shared_covariance"]
surface_values = ["RowDependence", "CovarianceMethod", "ScenarioRowEstimator", "SharedRowBootstrapOptions", "ExactEnumerationOptions", "ScenarioCovariance", "ScenarioCovarianceArtifactError", "ScenarioCovarianceConsumeLimits", "RowTableWire", "ScoreTermWire", "FunctionalWire", "CovarianceScenarioWire", "CovarianceMethodWire", "CovarianceSpec", "CovarianceResultWire", "ScenarioCovarianceArtifactWire", "AdjustedContrast", "LinearScore", "RowTable", "ScenarioCovarianceRefusal", "ScenarioCovarianceResult", "ScenarioEstimator", "ScoreTerm"]
refusals = [
  { code = "cell_not_licensed", detail = "scenario_covariance.table_too_large", when = "The shared table exceeds the declared row or column limit." },
  { code = "route_not_supported", detail = "scenario_covariance.unknown_dependence", when = "Scenario estimates use a different snapshot, a different or reordered unit list, duplicate unit identities, a declared independent sample or an undeclared dependence." },
  { code = "cancelled_no_claim", detail = "scenario_covariance.cancelled", when = "Cancellation is observed; no covariance is claimed." },
