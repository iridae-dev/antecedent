[[record]]
id = "2.3C.C3.composition_verifiers"
workstream = "C3"
milestone = "C"
work_package = "C3"
status = "promoted"
consumer_question = "Can each embedded artifact of a composition bundle be verified through that artifact's own consumer, publishing the binding facts from the decoded fields, with external mean decisions kept point-only attested and joint-draw decisions kept to the aligned-law requirement?"
theorem = "Acceptance boundary: one verifier per portable artifact kind (distribution, external claim, decision contract, decision result, sensitivity, study ranking, inverse query, repair report, evidence relationship) decodes the artifact through its own consumer, recomputes its identity and publishes quantity coordinates, snapshot, law and trust from the decoded fields, never from text a producer wrote beside it. Hand-enumerated anchor shared with the bundle record: four equally likely joint draws give risky = (4 + 0 + 4 + 0) / 4 = 2 and safe = max(3, 0) = 3. Only an aligned joint distribution publishes the joint law; an external claim publishes law mean_only and trust externally_attested, upgraded to verified_extension only when it retains its exact-request verification receipt, and a mean decision is evaluated from the claim's finite response grid and refuses what a mean cannot answer. A decision whose functional needs an aligned joint law over a mean-only claim fails unsupported_law. A changed mean value, a swapped quantity (after resealing the inner artifact), snapshot or evidence, a decision over another contract or an unrelated source, and a changed provider request each fail the dependent node at their named stage. A ranking is replayed candidate by candidate and bound to its source digests. Embedded kinds with no verifier (causal contract, attestation, quantity coordinates, transformation) fail unknown_node_kind and must travel as references. Recalculation receipts are not covered. This record grants no causal, interval or coverage license."
reference = "TODO.md C3 composition verifiers; provenance/c3_composition_verifiers.toml (papers = [] by explicit judgment)"
guarantee = "per_kind_node_verifiers_through_own_consumers_facts_from_decoded_fields_external_mean_point_only_attested"
graph_class = "No graph is identified: a verifier checks one artifact against its declared neighbours; the graph, snapshot or contract an artifact states is compared, not discovered."
population_semantics = "Quantity coordinates, snapshots, evidence digests and provider requests are compared as published facts per node; nothing is converted, and a coordinate carried by a consumer that its sources do not carry is refused."
evidence_family = "A hand-enumerated four-row joint law with a decision contract and result (risky 2, safe 3), an external mean claim, sensitivity, ranking and relationship artifacts, and one mutation per published binding fact."
provider = "Native implementation. An external claim's value is attested by its supplier and stays externally_attested unless the artifact retains its exact-request verification receipt; no external value is upgraded to native."
estimand = "per-node verification and published binding facts of a composition bundle"
inference_claim = "point_only"
inference_notes = "Claim policy (calibration is measured once at the release cut): external mean decisions are point-only attested, and joint-draw decisions retain the aligned-law requirement. A verifier establishes decoding, identity recomputation and binding agreement only; no interval, coverage or calibration claim is made and any diagnostic inside an artifact keeps its own 'unmeasured' status. No coverage record is allocated (the registry accepts coverage_records only for a calibrated claim)."
owners = ["antecedent-design"]
prerequisite_records = ["2.3C.C3.composition_bundle"]
prerequisite_reason = "Registers verifiers against the bundle's NodeVerifier contract; there is no executing 2.2 base, and registration is not execution."
identity_inputs = ["artifact bytes and the identity its own consumer recomputes", "published quantity, snapshot, evidence, request, law and trust facts", "upstream node digests and facts", "node kind"]
wire_changes = ["None: no new artifact kind. The verifiers read the existing portable artifacts and publish facts as additive metadata of the composition_bundle_v1 consumption report (owned by 2.3C.C3.composition_bundle). Unknown major versions refuse; 2.2 wires are never reinterpreted."]
compatibility = "Additive: no 2.2 route or wire changes. This record was created at implementation, so there is no frozen text to depart from. This record shares the composition_bundle.* refusal namespace with 2.3C.C3.composition_bundle, which owns the full list of twelve details; the nine declared here are the stages a verifier fails a node at. External mean decisions are point-only attested, joint-draw decisions retain the aligned-law requirement, and a reference node is verified by the bundle only as matched a supplied source and never replayed by a verifier. Synchronous finite computation without a cancellation hook; bounds.cancellation is recorded because the registry gate requires it."
search = false
bounds = { cancellation = true, max_coordinates = 1024 }
surface_rust = ["crates/antecedent-design/src/composition_verifiers.rs"]
surface_values = ["ArtifactDescription"]
refusals = [
  { code = "quantity_semantics_mismatch", detail = "composition_bundle.tampered_quantity", when = "A decoded artifact's quantity coordinates differ from the coordinates its neighbours publish, or a mean decision, structure record or ranking fails its own recomputation." },
  { code = "external_binding_mismatch", detail = "composition_bundle.swapped_evidence", when = "A decoded artifact's evidence digest or relationship record differs from the nodes it names, or an embedded artifact is rejected by its own consumer." },
  { code = "external_binding_mismatch", detail = "composition_bundle.graph_or_snapshot_mismatch", when = "A decoded artifact's graph or data snapshot differs from the snapshot its neighbour publishes." },
  { code = "external_binding_mismatch", detail = "composition_bundle.provider_request_changed", when = "A decoded external claim or robust result carries a provider request fingerprint that differs from the one the node declares." },
  { code = "joint_law_required", detail = "composition_bundle.unsupported_law", when = "A decision's functional needs an aligned joint law over a mean-only or marginal-draw upstream, or a mean source is insufficient for the contract." },
  { code = "external_capability_missing", detail = "composition_bundle.callback_unavailable", when = "A repair report's replay needs a search budget the consumer cannot meet." },
  { code = "schema_mismatch", detail = "composition_bundle.incompatible_version", when = "An embedded artifact carries a version or format its own consumer does not support." },
  { code = "invalid_argument", detail = "composition_bundle.oversized", when = "An embedded sensitivity, ranking, inverse-query or relationship artifact, or a container, exceeds its own bound." },
  { code = "invalid_argument", detail = "composition_bundle.unknown_node_kind", when = "An embedded node's kind has no verifier (causal contract, attestation, quantity coordinates, transformation) or its artifact's kind cannot be detected." },
]
routes = [
  { name = "antecedent.bundle.standard_consumer", stage = "consume", status = "licensed", claim = "point_only", covers = ["mean_source_of", "evidence_relationship_bytes", "describe_artifact", "detect_node_kind", "verifier_for"] },
  { name = "antecedent.bundle.mean_decision_bytes", stage = "evaluate", status = "licensed", claim = "point_only" },
]
