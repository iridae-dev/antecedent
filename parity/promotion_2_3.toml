[[record]]
id = "2.3C.C2.frozen_scores_artifact"
workstream = "C2"
milestone = "C"
work_package = "C2"
status = "promoted"
consumer_question = "Can the frozen cross-fitted or cell AIPW score table of one run be exported as a portable, identity-bound artifact that a fresh consumer verifies by recomputing its fit identity and artifact identity and that carries scores but no data and no model?"
theorem = "A frozen_scores_v1 artifact stores the score columns, held-out propensities, observed cells and outcomes, row ids and fold ids as bit-exact plain data, the estimator identity (the nuisance provenance label), the fit identity (the effective identity of the score-artifact stage that produced the scores), the data snapshot digest, the producing workflow's own-input stage digests, the input row count and one BLAKE3 identity over all of it that is independent of the order the stage declarations were supplied in. A consumer trusts none of the stored table: it checks the format bounds (bytes, rows, columns, values and stages) and the table shape, recomputes the fit identity from the stored stage digests, requires the stored snapshot digest to be the declared one and recomputes the artifact identity; an edit of any of them is refused (frozen_scores.identity_mismatch) even when the container is resealed, and a consumer that retained the identity independently also refuses a consistently resealed artifact of another run. The artifact decides nothing and computes nothing: it carries scores, and no estimate, interval or coverage claim."
reference = "TODO.md C2 frozen scores; provenance/c2_cell_recalc_frozen_scores.toml (papers = [] by explicit judgment)"
guarantee = "frozen_score_artifact_recomputed_fit_and_artifact_identity_bit_exact_scores_no_data_no_model_point_only_no_interval"
graph_class = "No graph is identified: the artifact carries scores and stage identities for one workflow and checks their consistency only."
population_semantics = "Populations, data and the treatment grid appear only as opaque per-stage own-input digests and the bound snapshot digest; the artifact neither resolves nor interprets them. Row ids are the frozen complete-case row index."
evidence_family = "A deterministic score table with bit-exact round trip, declaration-order independence, a resealed mutation refused by a retained identity, stage and snapshot binding checks, malformed tables refused even when resealed, and bounded, versioned and corrupt-byte decoding."
provider = "Native implementation; no external provider value is consumed and none is trusted. The scores are the producer's and are checked for shape and binding, not recomputed from data."
estimand = "portable record of frozen cross-fitted or cell AIPW scores"
inference_claim = "point_only"
inference_notes = "Claim policy (calibration is measured once at the release cut): the artifact makes no estimate and no interval claim; its content is scores, stage digests and identities. No coverage record is allocated (the registry accepts coverage_records only for a calibrated claim)."
owners = ["antecedent-io", "antecedent-py", "python/antecedent"]
prerequisite_records = ["2.3C.C2.recalc_receipt_artifact"]
prerequisite_reason = "Reuses the stage-declaration wire helpers of the receipt artifact and serializes the scores of a recalculation; there is no executing 2.2 base, and registration is not execution."
identity_inputs = ["score columns, held-out propensities, cells, outcomes, row ids and fold ids", "estimator identity", "fit identity", "data snapshot digest", "producing workflow's own-input stage digests", "input row count"]
wire_changes = ["Allocate frozen_scores_v1 as an additive artifact kind in the bounded sectioned container with one metadata section: the version and feature marker, the estimator, fit and snapshot identities, the stage declarations, the input row count, the score table (columns, propensities, cells, outcomes, row ids, fold ids) and the BLAKE3 artifact identity. Decode is bounded by 128 MiB, 2^21 rows, 64 columns, 2^22 values and 64 stages. Unknown major versions and feature markers refuse before the payload is interpreted; 2.2 wires are never reinterpreted."]
compatibility = "Additive: no 2.2 route or wire changes. This record was created at implementation, so there is no frozen text to depart from. A consumer holding no retained identity checks only internal consistency, and a consistently resealed artifact of another run passes only under its own identity. Corruption, unsupported versions, limits and malformed values carry no frozen_scores detail; only a changed identity does. Synchronous finite computation without a cancellation hook; bounds.cancellation is recorded because the registry gate requires it."
search = false
bounds = { cancellation = true, max_coordinates = 1024, max_bytes = 134217728, max_rows = 2097152, max_columns = 64 }
surface_rust = ["crates/antecedent-io/src/frozen_scores_artifact.rs"]
surface_values = ["FrozenScoresArtifactError", "ScoreColumnPlain", "ScoreTablePlain", "FrozenScoresMeta", "FrozenScoreParts", "FrozenScoreTable"]
surface_internal = [
  { name = "encode_parts", why = "Test seam that seals a container from raw parts so the resealed-edit tests can forge a consistent container; hidden from the documented API." },
  { name = "decode_parts", why = "Test seam that exposes the decoded metadata of a container so the resealed-edit tests can mutate it; hidden from the documented API." },
]
refusals = [
  { code = "route_not_supported", detail = "frozen_scores.identity_mismatch", when = "A stored or retained identity (fit identity, snapshot digest or artifact identity) differs from the recomputed one, even when the container is resealed." },
]
routes = [
  { name = "antecedent.recalc.frozen_scores_artifact", stage = "consume", status = "licensed", claim = "point_only", covers = ["FrozenScoreTable.seal", "FrozenScoreTable.from_bytes", "FrozenScoreTable.to_bytes", "FrozenScoreTable.fit_identity"] },
]
fixtures = [
  { id = "c2.scores_round_trip.positive", role = "positive", intent = "The score table round-trips bit-exactly and carries the estimator, fit, snapshot and artifact identities.", evidence_test = "crates/antecedent-io/tests/frozen_scores_artifact.rs", evidence_assertion = "c2_scores_round_trip_is_bit_exact_and_carries_every_identity" },
  { id = "c2.scores_resealed_mutation.negative", role = "negative", intent = "A resealed mutation is refused by a retained identity with frozen_scores.identity_mismatch.", evidence_test = "crates/antecedent-io/tests/frozen_scores_artifact.rs", evidence_assertion = "c2_scores_resealed_mutation_is_refused_by_a_retained_identity" },
  { id = "c2.scores_bindings.negative", role = "negative", intent = "A score-artifact stage or snapshot binding that does not match the declarations is refused.", evidence_test = "crates/antecedent-io/tests/frozen_scores_artifact.rs", evidence_assertion = "c2_scores_stage_and_snapshot_bindings_are_checked" },
  { id = "c2.scores_malformed.negative", role = "negative", intent = "Malformed score tables are refused even when the container is resealed with a recomputed identity.", evidence_test = "crates/antecedent-io/tests/frozen_scores_artifact.rs", evidence_assertion = "c2_scores_malformed_tables_are_refused_even_when_resealed" },
  { id = "c2.scores_corrupt_bytes.negative", role = "negative", intent = "Corrupt or truncated bytes are refused.", evidence_test = "crates/antecedent-io/tests/frozen_scores_artifact.rs", evidence_assertion = "c2_scores_corrupt_or_truncated_bytes_are_refused" },
  { id = "c2.scores_identity_order.artifact", role = "artifact", intent = "The artifact bytes and identity are independent of the order of the stage declarations.", evidence_test = "crates/antecedent-io/tests/frozen_scores_artifact.rs", evidence_assertion = "c2_scores_identity_is_independent_of_declaration_order" },
  { id = "c2.scores_bounded_versioned.artifact", role = "artifact", intent = "Decode is bounded and versioned: oversized containers and unsupported versions refuse before the payload is interpreted.", evidence_test = "crates/antecedent-io/tests/frozen_scores_artifact.rs", evidence_assertion = "c2_scores_decode_is_bounded_and_versioned" },
]
