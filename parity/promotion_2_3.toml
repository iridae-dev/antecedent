[[record]]
id = "2.3B.F12.evsi"
workstream = "F12"
milestone = "B"
work_package = "B0.2"
status = "promoted"
consumer_question = "Can preposterior EVSI and cost mapping be consumed under a checked semantic contract?"
theorem = "Frozen acceptance boundary: Current value 1/2, post-signal value 3/4, EVSI 1/4, EVPI 1/2; utility-unit study cost 1/10 gives net 3/20. Cost in currency without a cost-to-utility map and changed terminal action set refuse net-value comparison. Executed oracles: a Gaussian sample mean under a conjugate normal belief (prior N(1/2, 1), noise variance 12, n = 4, actions 0 and theta) gives the closed-form EVSI 0.04165773529384315 and EVPI 0.19779655740130607; a binomial bet decision gives EVSI 1/16 and EVPI 1/8 for the native signal and for each equivalent external update mode. This record alone grants no causal or interval license."
reference = "TODO.md B0.2; prerequisite feature records F5, F11"
guarantee = "exact_integration_evsi_evpi_and_net_value_under_declared_cost_map_point_only_monte_carlo_error_and_rank_uncertainty_unlicensed_diagnostics"
graph_class = "Only an independently identified fixed-graph or declared structural-scenario contract; this composition cell does not identify a graph."
population_semantics = "Population, regime, horizon, conditioning, coordinate support and source/target snapshot identities remain separately bound."
evidence_family = "Binary-state decision: choose state guess for utility 1 if correct, 0 otherwise; prior is 1/2 and signal accuracy is 3/4."
provider = "Native implementation or separately scoped exact-request external provider; provider trust is never upgraded by representation alone."
estimand = "preposterior EVSI and cost mapping"
inference_claim = "point_only"
owners = ["antecedent-core", "antecedent-io", "antecedent", "python/antecedent"]
prerequisite_records = ["2.3B.F5.decision_functionals", "2.3B.F11.external_signal"]
prerequisite_reason = "Requires the listed feature contracts and a separately licensed scientific producer; registration is not execution."
