[[record]]
id = "2.3B.X10.chain_observation_recovery"
workstream = "X10"
milestone = "B"
work_package = "B2"
status = "promoted"
consumer_question = "Is the full law P(X1, X2) of two binary variables recoverable from the observed pattern law when one response indicator causes the other, and if self-censoring forbids it, is there an exact witness?"
theorem = "In an m-graph over binary X1, X2, response indicators R1, R2 and deterministic proxies with exactly one response edge R_h -> R_t (optionally X_h -> R_t), the factorization p(x) p(r_h) p(r_t | r_h, [x_h]) gives P(R_h=1, R_t=1, X*_h=x_h, X*_t=x_t) = p(x_h, x_t) P(R_h=1) q(x_h), with q a ratio of observed pattern margins, so p(x) is the complete-case cell divided by P(R_h=1) q(x_h); positivity of those cells is required. A self-censoring edge X_i -> R_i is refused with a two-model witness (every mechanism a fair coin except X_i ~ Bern(1/2), P(R_i=1|X_i) = (2/5, 3/5) against X_i ~ Bern(2/5), (1/3, 3/4)) that agree on all nine observed cells and differ on P(X_i), verified by exact integer enumeration over 60^4. Graphs outside the class are route_not_supported, never nonrecoverable. This is an exact-law evaluation; it is not complete-case analysis."
reference = "TODO.md B2; prerequisite 2.2B.X10.binary_observation_recovery; provenance/b2_chain_observation_recovery.toml"
guarantee = "exact_ordered_response_recovery_of_a_two_variable_binary_mgraph_with_a_verified_nonrecoverability_witness_point_values_only"
graph_class = "A two-variable binary m-graph: optional X1-X2 edge, proxy wiring X_i -> X*_i <- R_i, exactly one response edge R_h -> R_t and optionally X_h -> R_t; no bidirected edge and no other edge. A self-censoring edge is nonrecoverable with a witness; every other graph is route_not_supported. The 2.2 row, which refuses every R -> R edge, is unchanged."
population_semantics = "One population and one exact observed pattern law over the nine proxy cells; a fabricated observed law supplied consistently is not detected, and the m-graph's untestable premises are declared, not verified."
evidence_family = "An exact nine-cell observed pattern law, or none for a decision only; the tests enumerate a binary SCM (P(X1=1)=0.37, P(X2=1|X1)=(0.2,0.7), P(R_h=1)=0.65, dependent or independent tail response) written out independently of the library."
provider = "antecedent_identify::recovery_chain (decide_chain_recovery, verify_chain_witness), antecedent_estimate::recovery_chain (evaluate_chain_recovery), sealed by antecedent_io::recovery_chain_artifact (format version 1) and exposed through antecedent::analysis::recovery_chain and python/antecedent/recovery_chain.py. The composed sampled provider and its intervals are not licensed."
estimand = "The recovered law P(X1, X2) on the four cells, or a verified witness that it is not recoverable."
inference_claim = "point_only"
inference_notes = "The recovered cells are exact-law point values and carry no interval. A sampled provider composed on this row and its intervals stay closed with calibration unmeasured; the coverage debt is allocated and not collected, to be measured only at the 2.3 release cut: cov.recovery.chain_mgraph.frequentist.l95.sampled_whole_method."
owners = ["antecedent-identify", "antecedent-estimate", "antecedent-io", "antecedent", "python/antecedent"]
prerequisite_records = ["2.2B.X10.binary_observation_recovery"]
prerequisite_reason = "A second, separate observation-recovery row beside 2.2B.X10.binary_observation_recovery, which refuses every response-to-response edge; it neither reuses nor changes that row."
identity_inputs = ["m-graph and query roles", "head and tail axes", "rule version and checked premises", "observed nine-cell pattern law", "recovered law or witness models"]
wire_changes = ["Additive ordered_response_recovery_v1 artifact (format version 1) carrying the graph, query roles, names, the decision (the checked plan or the witness with its integer verification), the observed pattern law and the recovered law, with a premises digest and a separate data digest. A consumer re-decides under its own budget, re-verifies the witness, re-evaluates the formula and accepts only a bit-identical result; unknown versions or features refuse."]
compatibility = "The 2.2 binary observation-recovery row and its artifact are unchanged; this row adds one response chain and no 2.2 wire field. The decision meters a SearchBudget with fixed limits (2000 operations, depth 8): one operation per edge inspected and per witness configuration enumerated."
search = false
bounds = { cancellation = true, max_coordinates = 1024 }
refusals = [
  { code = "transport_proven_non_transportable", detail = "recovery_chain.nonrecoverable_witness", when = "A self-censoring edge makes the law nonrecoverable; the refusal carries the exact two-model witness." },
  { code = "route_not_supported", detail = "recovery_chain.unsupported_mechanism", when = "An edge or graph shape outside the row (X_t -> R_h, no response chain, bidirected or cross-wired edges); neither recoverability nor its absence is claimed." },
  { code = "invalid_argument", detail = "recovery_chain.invalid_query", when = "Roles are malformed, a variable is declared in two roles, a node is unknown or a witness is malformed." },
  { code = "invalid_argument", detail = "recovery_chain.invalid_observed_law", when = "The observed pattern law has a negative or non-finite cell or does not sum to one." },
  { code = "transport_support_failure", detail = "recovery_chain.positivity", when = "The head response, a complete-case cell or the head-variable margin used by a dependent tail has no mass." },
  { code = "transport_not_certified", detail = "recovery_chain.invalid_derivation", when = "A plan or witness does not verify." },
  { code = "transport_budget_cancel", detail = "recovery_chain.budget", when = "The decision budget or cancellation stopped it; the receipt is retained." },
  { code = "route_not_supported", detail = "recovery_chain.unsupported_semantics", when = "An artifact carries an unknown version or a feature this consumer does not support." },
  { code = "invalid_argument", detail = "recovery_chain.premises_mismatch", when = "A resealed artifact changes its graph, query, names, plan or witness." },
  { code = "invalid_argument", detail = "recovery_chain.data_identity_mismatch", when = "A resealed artifact changes its observed or recovered law." },
  { code = "invalid_argument", detail = "recovery_chain.decision_replay_mismatch", when = "The stored decision differs from the consumer's re-decision." },
  { code = "invalid_argument", detail = "recovery_chain.recovered_replay_mismatch", when = "The stored recovered law differs from the re-evaluation." },
  { code = "invalid_argument", detail = "recovery_chain.names_mismatch", when = "The stored names disagree with the graph." },
  { code = "invalid_argument", detail = "recovery_chain.undecodable", when = "An artifact does not decode." },
  { code = "invalid_argument", detail = "recovery_chain.not_evaluated", when = "A Python decision that has not been evaluated on an observed law is exported." },
]
routes = [
  { name = "antecedent.recovery.chain_observation_recovery", stage = "identify", status = "licensed", claim = "point_only" },
]
