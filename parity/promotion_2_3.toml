  { id = "x2.independent_rows.negative", role = "negative", intent = "A declared-independent sample or an undeclared dependence refuses unknown_dependence instead of presenting off-diagonal zeros.", evidence_test = "crates/antecedent-estimate/tests/scenario_covariance.rs", evidence_assertion = "x2_independent_rows_declared_independent_or_unknown_dependence_refuses" },
