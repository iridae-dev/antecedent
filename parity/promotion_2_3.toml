[[record]]
id = "2.3B.B4.categorical_treatment_contrasts"
workstream = "B4"
milestone = "B"
work_package = "B4"
status = "promoted"
consumer_question = "Can level-versus-reference and pairwise contrasts of a categorical (ordered or unordered) treatment, with an omnibus test and a declared monotonicity test, be consumed under a checked semantic contract?"
theorem = "Dummy-coded regression of the outcome on a declared categorical treatment (optionally with a shared adjustment block) built on the joint vector-treatment fit. With reference level a the level coefficients are group-mean differences and their covariance is the dummy block of sigma^2 (X'X)^-1; contrasts take variances w'Vw from the full covariance and Holm adjustment is applied across the declared family. Hand-derived anchor: a = [1,3], b = [4,6,5], c = [9,7,11,9] give b_b = 3, b_c = 7, sigma^2 = 2 and V = [[5/3, 1],[1, 3/2]]. For ordered levels the declared monotonicity test has null that the effect is non-decreasing (or non-increasing) in the declared order, rejected conservatively only when every adjacent step is in the opposite direction beyond its one-sided test (a union-intersection / intersection-union construction); a constant effect is never rejected (p = 1). A declared level with no rows or fewer than the declared minimum rows refuses by name; nothing is dropped or merged. Unordered levels give identical contrasts under level permutation. This record grants no causal or interval license."
reference = "TODO.md B4; Holm (1979), Berger (1982), Wald (1943); prerequisite 2.3B.B4.vector_treatment_coefficients; provenance/b4_categorical_treatment.toml"
guarantee = "categorical_treatment_level_and_pairwise_contrasts_point_only_tests_and_standard_errors_unmeasured_diagnostics"
graph_class = "No graph is identified or checked: the caller owns that the declared adjustment set is valid for the categorical treatment."
population_semantics = "One row snapshot, one declared level set (ordered or unordered, with a declared reference) and one shared adjustment block. The level scale (ordered versus unordered) and the reference are part of the estimand and of the identity."
evidence_family = "Three-group hand-solved dummy regression (a, b, c above), a non-alphabetical reference, a Holm family written out, and three-level monotonicity datasets with sigma^2 = 1 and adjacent-step variance 2/3."
provider = "Native implementation; no external provider value is consumed and none is trusted."
estimand = "level-versus-reference and pairwise contrasts of a categorical treatment, an omnibus Wald test and an ordered monotonicity test"
inference_claim = "point_only"
inference_notes = "Claim policy (calibration is measured once at the release cut): the licensed claim is the POINT level coefficients and contrast estimates. Every standard error, Wald, raw and Holm p-value and the monotonicity statistic and p-value is a reported diagnostic labelled calibration 'unmeasured'; Type I error and power are not collected in 2.3 and no coverage record is allocated (the registry accepts coverage_records only for a calibrated claim). The monotonicity p-value is a conservative bound, stated as such."
owners = ["antecedent-estimate", "antecedent-io", "antecedent", "python/antecedent"]
prerequisite_records = ["2.3B.B4.vector_treatment_coefficients", "2.3A.F18.temporal_effect_constancy"]
prerequisite_reason = "Reuses the joint vector-treatment regression engine and the F18 calibration vocabulary and Holm step-down; registration is not execution."
identity_inputs = ["declared levels and their order", "level scale", "reference level", "pairwise family", "monotonicity direction", "minimum level rows", "adjustment columns", "covariance kind", "level counts", "result values"]
wire_changes = ["Allocate categorical_treatment_v1 as additive v1 metadata in the bounded sectioned artifact container: declared levels and scale, reference, level counts, coefficients and full covariance, level and pairwise contrasts, omnibus test and Holm values, the monotonicity result with its stored null, calibration coordinate 'unmeasured', plus the compact design summary (model-based) or the rows (HC, capped at 4096). One BLAKE3 identity binds the semantic fields. Unknown major versions refuse; 2.2 wires are never reinterpreted."]
compatibility = "Additive: no 2.2 route or wire changes. This record was created at implementation, so there is no frozen text to depart from. Replay limits: a model-based fit replays bit for bit from the stored compact design summary; an HC covariance embeds the rows and is refused above 4096 rows (categorical_treatment.hc_replay_row_cap_exceeded). The monotonicity test is a conservative bound, not an exact size. A consumer refuses a changed identity only against an expected identity it retained itself. The regression engine is the vector-treatment fit, so a refusal may carry a vector_treatment detail from that record."
search = false
bounds = { cancellation = true, hc_replay_row_cap = 4096 }
surface = ["python/antecedent/categorical_treatment.py", "crates/antecedent/src/analysis/categorical_treatment.rs"]
surface_pyo3 = ["python/src/categorical_treatment_api.rs"]
surface_values = ["LevelScale", "MonotonicityDirection", "CalibrationStatus", "AdjacentStepWire", "CategoricalResultWire", "CategoricalSpecWire", "CategoricalTreatmentArtifact", "CategoricalTreatmentArtifactError", "CategoricalTreatmentIdentity", "CategoricalTreatmentReportWire", "CategoricalTreatmentRequest", "LevelContrastWire", "LevelCountWire", "MonotonicityWire", "PairContrastWire", "CategoricalTreatment", "CategoricalEffects", "CategoricalTreatmentRefusal", "Direction", "LevelEffect", "MonotonicityStep", "MonotonicityTest", "OmnibusTest", "PairEffect"]
refusals = [
  { code = "invalid_argument", detail = "categorical_treatment.invalid_level", when = "Declared levels are empty strings or repeated." },
  { code = "invalid_argument", detail = "categorical_treatment.too_few_levels", when = "Fewer than two levels are declared." },
  { code = "invalid_argument", detail = "categorical_treatment.unknown_reference", when = "The reference level is not a declared level." },
  { code = "invalid_argument", detail = "categorical_treatment.invalid_min_level_rows", when = "The declared minimum rows per level is zero." },
