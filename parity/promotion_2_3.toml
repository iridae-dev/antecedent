  { code = "design_signal_invalid", detail = "evsi.bound_violation", when = "An EVSI violates 0 <= EVSI <= EVPI beyond its reported error." },
  { code = "cancelled_no_claim", detail = "evsi.cancelled", when = "Cancellation was requested before the evaluation finished; no ranking is returned." },
  { code = "design_signal_invalid", detail = "evsi.unscored_candidate", when = "The ranker produced no score for an evaluated candidate." },
]
