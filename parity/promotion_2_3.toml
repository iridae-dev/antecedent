  { code = "invalid_argument", detail = "effect_constancy.limits_exceeded", when = "A request or artifact exceeds the bounded size or partition count of the Python bridge or consumer." },
  { code = "invalid_argument", detail = "effect_constancy.invalid_identity", when = "The expected identity a consumer retained does not parse as an effect-constancy identity." },
  { code = "route_not_supported", detail = "effect_constancy.incompatible_partitions", when = "Partitions disagree on the effect, units, regime or population, or repeat a label; the global test of different quantities has no meaning." },
  { code = "route_not_supported", detail = "effect_constancy.unsupported_partition", when = "A partition's coordinate support is Unsupported (Partial support is reported, not refused)." },
  { code = "route_not_supported", detail = "effect_constancy.wrong_contract", when = "A consumer holds an expected identity and a stored or recomputed identity field (partition identity, estimand, covariance, null, multiplicity family or evidence) differs." },
]
