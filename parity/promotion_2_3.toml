[[record]]
id = "2.3C.C4.multi_source_acceptance"
workstream = "C4"
milestone = "C"
work_package = "C4"
status = "promoted"
consumer_question = "Can one decision over a three-action program be answered from a native response claim and two external studies, with each action's support reported, shared data and overlapping evidence refused as independent, a design ranked, the whole composed into one portable bundle, and every mutation of a binding fact either refused or recalculated only where it matters?"
theorem = "Acceptance composition, not a new algorithm. Story: graph x -> a, x -> y, a -> y; program y under do(a) for a in {0, 1, 2}; native claim N (response means 2, 4, 9; dose 2 unsupported), external E1 attested means (1, 3, 5.5), external E2 bound means (2, 3.5, 5) and a joint law of two weighted rows, (2, 6, 3) with weight 0.25 and (2, 1, 7) with weight 0.75; actions wait (m0), treat (m1 - 1), extend (m2 - 3). E1 and E2 are declared independent; N and E2 share data (registry 7). Hand-derived values: N alone gives wait 2, treat 3 and extend unsupported; N then E1 gives 2, 3, 2.5 (treat optimal); the E2 means give (2, 2.5, 2); the law utilities (2, 5, 0) and (2, 0, 4) give E[U] = (2, 2.5, 2), EVPI 2 (1 with extend masked), expected regrets (2.5, 2, 2.5) and P(U_treat >= 5) = 0.5; the design ranking gives EVPI 1/8, EVSI 1/16 and net values 0.0425 and 0.0125. A probability or quantile is answered only by the aligned joint law and refused over a mean; shared data refuses independent pooling unless a licensed dependence route is named; unknown dependence is never independence; conflicting atoms are not averaged. The composed bundle labels the law decision joint_draw and the mean-only decision point_only_attested. Mutation table over quantity, law, structure, support, snapshot, provider operation, evidence overlap and utility: each is refused at its named boundary or recalculates exactly the stages that depend on it (a utility change recomputes only the decision with zero fit work; a snapshot change refits once and equals an independent rerun; unrelated external-study branches stay valid). Limits found: a Python native claim cannot state a native execution record and enters composition unverified; a native response retains no draws; the recalculation stage model has no graph or query edge into external-study branches, so only the bind refusals protect them; the ranking is bound to the law only by source digest. This record grants no causal, interval, coverage or probability license."
reference = "TODO.md C4 multi-source acceptance; provenance/c4_multi_source_acceptance.toml (papers = [] by explicit judgment); composes the licensed routes of 2.3C.C1, 2.3B.F14, 2.3C.C2 and 2.3C.C3"
guarantee = "multi_source_acceptance_composed_only_from_licensed_routes_hand_derived_values_refusals_and_selective_recalculation_point_only"
graph_class = "Graph x -> a, x -> y, a -> y with program y under do(a) over a three-dose grid. The acceptance identifies nothing itself: the program binding, the native claim and the external bindings each carry their own graph facts, and a changed graph or premise is refused at the program binding."
population_semantics = "One target population and one dose grid {0, 1, 2}; each source keeps its own quantity coordinates, snapshot and provider facts, and a mismatch is refused, never converted. A dose a source does not support is reported as unsupported with its reason and is not extrapolated."
evidence_family = "A hand-derived three-action story over a native claim, two external studies and a two-row joint law, with a design ranking and a composed bundle, and one mutation per binding fact (quantity, law, structure, support, snapshot, provider operation, evidence overlap, utility)."
provider = "Native implementation for the native claim, the decision and the ranking. External E1 and E2 values are attested by their suppliers and never upgraded to native; a Python native claim enters composition unverified because Python cannot state a native execution record."
estimand = "composed multi-source decision over a dose-indexed program with hand-derived expected utilities, value of information and bundle labels"
inference_claim = "point_only"
inference_notes = "Claim policy (calibration is measured once at the release cut): every value is a point value or an enumerated finite-law quantity. Standard errors, p-values, intervals and Monte Carlo errors that appear inside the composed artifacts are diagnostics with calibration unmeasured. No interval or coverage claim is made and no coverage record is allocated (the registry accepts coverage_records only for a calibrated claim)."
owners = ["antecedent", "antecedent-design", "antecedent-py", "python/antecedent"]
prerequisite_records = ["2.3C.C1.program_binding", "2.3C.C1.native_response_claims", "2.3C.C1.composition_boundary", "2.3B.F14.design_ranking_artifact", "2.3C.C2.selective_recalculation", "2.3C.C3.composition_bundle"]
prerequisite_reason = "Composes only already-licensed routes (program binding, native claims, composition boundary, design ranking, recalculation plan, composition bundle); there is no executing 2.2 base for the composition, and registration is not execution."
identity_inputs = ["program and graph digests", "native response claim and its coordinates", "external study claims, bindings and declared dependence", "joint law rows and weights", "decision contract and utilities", "ranking source digests", "bundle node identities and edges"]
wire_changes = ["None: no new artifact kind, no new route implementation and no new source. The acceptance consumes the existing composition_bundle_v1, study ranking, distribution and external-claim artifacts unchanged; 2.2 wires are never reinterpreted."]
compatibility = "Additive and test-only: no 2.2 route or wire changes and no source change, so there is no frozen text to depart from. Refusal namespace: this record adds no refusal literal of its own, and the registry rejects an empty refusal list, so it declares two details of the composition_bundle namespace that the story exercises and that already exist in non-test source, sharing the namespace with 2.3C.C3.composition_bundle (which owns the full list) by the same union rule 2.3C.C3.composition_verifiers uses. The other refusals the story observes keep their owning records: program_binding.*, external_response_binding.*, composition_boundary.*, coordinate_support.*, decision_evaluation.*, signal_provider.*, evsi.*, and recalc.*. Synchronous finite computation without a cancellation hook; bounds.cancellation is recorded because the registry gate requires it."
