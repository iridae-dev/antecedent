[[record]]
id = "2.3C.C2.recalc_receipt_artifact"
workstream = "C2"
milestone = "C"
work_package = "C2"
status = "promoted"
consumer_question = "Can the receipt of a selective recalculation be exported as a portable, identity-bound artifact that a fresh consumer verifies by recomputing the plan, and that never certifies cache reuse across a process boundary?"
theorem = "A recalc_receipt_v1 artifact stores the previous and requested per-stage own-input digests, the capability and boundary declarations, and per stage the status, effective identity and counted work, with the canonical plan identity, the canonical receipt identity and the work totals. A consumer recomputes the plan from the stored declarations with the core planner and requires the stored per-stage status, determining dependency and identity, each stage's counts (a reused or refused stage did no work, a recomputed computation did its work), the totals and both identities to match; an edit of any of them is refused even when the container is resealed. A consumer that retained the receipt identity independently also refuses a consistently resealed receipt of another run. A loaded receipt never claims reuse: ANY derived stage stored as reused under a fresh-process boundary is refused, even in a configuration where the planner would allow portable scores to be reused, because a loaded result recreates no prepared study, score table or fit. The artifact records and decides; it computes nothing and carries no estimate, interval or coverage claim."
reference = "TODO.md C2 receipt artifact; provenance/c2_recalc_receipt_artifact.toml (papers = [] by explicit judgment)"
guarantee = "recalc_receipt_artifact_recomputed_plan_and_counts_no_fresh_process_reuse_point_only_no_interval"
graph_class = "No graph is identified: the artifact carries stage identities and counts for a workflow and checks their consistency with the planner only."
population_semantics = "Populations, data and the treatment grid appear only as opaque per-stage own-input digests; the artifact neither resolves nor interprets them."
evidence_family = "A receipt of a utility-only change and of a compatible retarget, a fresh-process receipt, an off-grid receipt, and resealed variants of every stored field, a consistently resealed receipt of another run, and oversized and unsupported-version containers."
provider = "Native implementation; no external provider value is consumed and none is trusted. Counts are the producer's and cannot be re-observed by the consumer."
estimand = "portable record of a selective-recalculation plan and its counted work"
inference_claim = "point_only"
inference_notes = "Claim policy (calibration is measured once at the release cut): the artifact makes no estimate and no interval claim; its content is a decided plan, counts and identities. It is a record, not a certificate that a cache exists. No coverage record is allocated (the registry accepts coverage_records only for a calibrated claim)."
owners = ["antecedent-io", "antecedent-py", "python/antecedent"]
prerequisite_records = ["2.3C.C2.selective_recalculation"]
prerequisite_reason = "Serializes the plan and counts of the selective recalculation cell and recomputes the plan with its planner; there is no executing 2.2 base, and registration is not execution."
identity_inputs = ["previous and requested per-stage own-input digests", "retarget, request and boundary declarations including the resume context", "per-stage status and determining dependency", "per-stage effective identity", "per-stage counted work and totals", "plan and receipt identities"]
wire_changes = ["Allocate recalc_receipt_v1 as an additive artifact kind in the bounded sectioned container with one metadata section: the version and feature marker, the capability and boundary declarations, the previous and requested stage declarations, the canonical plan and receipt identities, the per-stage entries (stage label, status, dependency, effective identity, counts) in topological order and the totals. Identities are BLAKE3. Unknown major versions and feature markers refuse before the payload is interpreted; 2.2 wires are never reinterpreted."]
compatibility = "Additive: no 2.2 route or wire changes. This record was created at implementation, so there is no frozen text to depart from. Decode is bounded by container bytes, stage count and route-label bytes. A consumer holding no retained receipt identity checks only internal consistency, and a consistently resealed receipt of another run passes only under its own identity. The Python bridge reports malformed declarations and oversized input under the recalc.* details of the selective recalculation record. The container version, corruption and encode failures carry no recalc_receipt detail. Synchronous finite computation without a cancellation hook; bounds.cancellation is recorded because the registry gate requires it."
search = false
bounds = { cancellation = true, max_coordinates = 1024, max_bytes = 262144, max_stages = 64 }
surface_rust = ["crates/antecedent-io/src/recalc_receipt_artifact.rs"]
surface_exports = ["python/antecedent/recalc.py"]
owned_exports = ["ARTIFACT_KIND", "RecalcReceipt", "RecalcReceiptRefusal", "consume"]
surface_values = ["RecalcReceiptArtifactError", "CountsWire", "DeclaredStageWire", "ResumeWire", "CapabilitiesWire", "PlanEntryWire", "PlanWire", "ReceiptEntryWire", "RecalcReceiptMeta", "RecalcReceiptArtifact", "RecalcReceipt", "RecalcReceiptRefusal"]
surface_internal = [
  { name = "encode_parts", why = "Test seam that seals a container from raw parts so the resealed-edit tests can forge a consistent container; hidden from the documented API." },
  { name = "decode_parts", why = "Test seam that exposes the decoded metadata of a container so the resealed-edit tests can mutate it; hidden from the documented API." },
]
refusals = [
  { code = "score_table_unavailable", detail = "recalc_receipt.fresh_process_reuse", when = "A derived stage is stored as reused under a fresh-process boundary; a loaded receipt recreates no prepared study, score table or fit, so it cannot claim reuse." },
  { code = "route_not_supported", detail = "recalc_receipt.plan_mismatch", when = "The stored per-stage status, determining dependency, identity or stage set differs from the plan recomputed from the stored declarations." },
  { code = "route_not_supported", detail = "recalc_receipt.counts_inconsistent", when = "A stage's counted work contradicts its status: a reused or refused stage did work, or a recomputed computation did none." },
  { code = "route_not_supported", detail = "recalc_receipt.totals_mismatch", when = "The stored totals differ from the sum of the per-stage counts." },
  { code = "route_not_supported", detail = "recalc_receipt.identity_mismatch", when = "A stored or retained plan or receipt identity differs from the recomputed one, even when the container is resealed." },
]
routes = [
  { name = "antecedent.recalc.recalc_receipt_artifact", stage = "consume", status = "licensed", claim = "point_only", covers = ["consume", "ARTIFACT_KIND", "stage_from_label", "identities_to_wire", "identities_from_wire", "plan_to_wire", "plan_from_wire"] },
]
fixtures = [
  { id = "c2.artifact_round_trip.positive", role = "positive", intent = "A receipt round-trips with its table, counts, totals and both identities preserved and recomputed by the consumer.", evidence_test = "crates/antecedent-io/tests/recalc_receipt_artifact.rs", evidence_assertion = "c2_artifact_round_trip_preserves_table_counts_and_identities" },
  { id = "c2.artifact_capabilities_round_trip.positive", role = "positive", intent = "An off-grid route and a changed boundary round-trip in the stored capabilities.", evidence_test = "crates/antecedent-io/tests/recalc_receipt_artifact.rs", evidence_assertion = "c2_artifact_off_grid_route_and_a_changed_boundary_round_trip_in_the_capabilities" },
  { id = "c2.artifact_resealed_edit.negative", role = "negative", intent = "A resealed edit of the stored table, counts, totals or identities is refused with its own detail.", evidence_test = "crates/antecedent-io/tests/recalc_receipt_artifact.rs", evidence_assertion = "c2_artifact_resealed_mutation_is_refused" },
  { id = "c2.artifact_other_run.negative", role = "negative", intent = "A consistently resealed receipt of another run is refused against the retained identity.", evidence_test = "crates/antecedent-io/tests/recalc_receipt_artifact.rs", evidence_assertion = "c2_artifact_a_consistently_resealed_other_run_is_refused_against_a_retained_identity" },
  { id = "c2.artifact_fresh_process_reuse.negative", role = "negative", intent = "A loaded receipt never claims reuse in a fresh process: a derived stage stored as reused is refused with recalc_receipt.fresh_process_reuse.", evidence_test = "crates/antecedent-io/tests/recalc_receipt_artifact.rs", evidence_assertion = "c2_artifact_a_loaded_receipt_never_claims_reuse_in_a_fresh_process" },
  { id = "c2.python_fresh_process_reuse.negative", role = "negative", intent = "Through Python a loaded result cannot claim cache reuse in a fresh process.", evidence_test = "python/tests/test_recalc.py", evidence_assertion = "test_c2_a_loaded_result_cannot_claim_cache_reuse_in_a_fresh_process" },
  { id = "c2.artifact_identity_order.artifact", role = "artifact", intent = "The receipt bytes and identity are independent of declaration order.", evidence_test = "crates/antecedent-io/tests/recalc_receipt_artifact.rs", evidence_assertion = "c2_artifact_identity_is_order_independent" },
  { id = "c2.artifact_bounded_versioned.artifact", role = "artifact", intent = "The receipt is bounded and versioned: oversized containers and unsupported versions refuse before decoding.", evidence_test = "crates/antecedent-io/tests/recalc_receipt_artifact.rs", evidence_assertion = "c2_artifact_is_bounded_and_versioned" },
  { id = "c2.python_portable_canonical.artifact", role = "artifact", intent = "Through Python the receipt is portable and canonical, is consumed by recomputation and refuses edits.", evidence_test = "python/tests/test_recalc.py", evidence_assertion = "test_c2_the_receipt_is_portable_canonical_and_refuses_edits" },
]

[[record]]
id = "2.3C.C3.composition_bundle"
workstream = "C3"
milestone = "C"
work_package = "C3"
status = "promoted"
consumer_question = "Can a composed decision be exported as one portable bundle of typed nodes and Merkle-bound edges that an independent consumer verifies node by node, labels point-only or joint-draw from ancestor facts, and never claims to have replayed a referenced provider or study?"
theorem = "Acceptance boundary: a bundle is a typed directed acyclic graph of nodes (fifteen kinds) and dependency edges; each edge carries the Merkle digest of its upstream node, so a changed upstream identity changes the digest of every dependent node and of the bundle, while declaration order of nodes and edges does not change the identity. Hand-enumerated decision over four equally likely joint draws: risky = E[p * q] = (4 + 0 + 4 + 0) / 4 = 2 and safe = max(3, 0) = 3, so the consumer reports expected utilities 2 and 3 read from verified artifacts and labels the result joint_draw. An external mean claim (declared mean 4.25) supports only a point-only attested decision: the result is labelled point_only_attested, its declared mean is shown for inspection but is not a verified value, and a decision that needs an aligned joint law over a mean-only claim fails unsupported_law. An embedded node is verified by its registered per-kind verifier through the artifact's own consumer; a node with no verifier fails unknown_node_kind. A reference node needs a supplied provider or data source: without one it is reference_unresolved, with a matching one it is verified only as 'matched a supplied source' and is never replayed, and a provider that answered another request fails provider_request_changed. A tampered quantity, swapped evidence or a graph or snapshot mismatch fails the dependent node at its named stage even after resealing the inner artifact, resealed container edits are refused at their stage, and a consumer that retained the bundle identity refuses any other. This record grants no causal, interval, coverage or probability license."
reference = "TODO.md C3 composition bundle; provenance/c3_composition_bundle.toml (papers = [] by explicit judgment); prerequisite feature records F23, F24"
guarantee = "portable_composed_result_merkle_bound_nodes_verified_by_per_kind_verifiers_references_never_replayed_point_only"
graph_class = "No graph is identified. The bundle's own graph is the dependency graph of its nodes; the causal contract or program a node carries is verified only to the extent its own artifact consumer verifies it, and a bundle never claims that a serialized result recreates an executable study."
population_semantics = "Quantity coordinates, populations, regimes, horizons, snapshots and exact provider requests stay separately bound per node as published facts; a mismatch across an edge fails the dependent node and nothing is converted or reinterpreted."
evidence_family = "A hand-enumerated four-row joint law with a decision contract and result (risky 2, safe 3), an external mean claim with declared mean 4.25, reference nodes with and without supplied sources, and one mutation per binding fact (quantity, evidence, snapshot, provider request, law) and per container stage."
provider = "Native implementation for embedded nodes. A reference node's provider or data source is supplied by the consumer and compared by declaration only; external values keep their own trust label (point-only attested unless the exact-request receipt is retained) and are never upgraded to native."
estimand = "verification and labelled consumption of a composed decision bundle"
inference_claim = "point_only"
inference_notes = "Claim policy (calibration is measured once at the release cut): the bundle certifies decoding, identities and bindings only. Every point value or diagnostic read from an embedded artifact keeps that artifact's own status, with calibration 'unmeasured' where it declares so; the bundle adds no interval and no coverage claim. No coverage record is allocated (the registry accepts coverage_records only for a calibrated claim)."
owners = ["antecedent-design", "antecedent", "antecedent-py", "python/antecedent"]
prerequisite_records = ["2.3A.F24.composition_provenance", "2.3A.F23.external_trust_receipt", "2.3B.F4.decision_contract"]
prerequisite_reason = "Builds on the composition provenance chain, the external trust receipt and the decision contract; there is no executing 2.2 base for a composed bundle, and registration is not execution."
identity_inputs = ["node ids, kinds and declared identities", "embedded artifact bytes by BLAKE3 digest", "reference requirements, facts and inspected values", "dependency edges and upstream digests", "published binding facts"]
wire_changes = ["Allocate composition_bundle_v1 as an additive artifact kind in the bounded sectioned container with one body section and one embedded section per embedded node: node ids, kinds, declared identities, sources (embedded bytes or a reference requirement), declared facts and inspected values of reference nodes, edges with their upstream Merkle digests and the BLAKE3 bundle identity. Unknown major versions refuse before the payload is interpreted; 2.2 wires are never reinterpreted."]
compatibility = "Additive: no 2.2 route or wire changes. This record was created at implementation, so there is no frozen text to depart from. The bundle lives in antecedent-design and registers per-kind verifiers (owned by 2.3C.C3.composition_verifiers) through a NodeVerifier trait rather than depending on each artifact. Verification order: version, size and container, then node kinds, then recomputation of every node and edge digest, then the consumer's retained identity, then the nodes; a node-level failure is reported on that node and the rest keeps its inspected result. A reference node is verified only as matched a supplied source and never replayed. A consumer holding no retained identity checks only internal consistency. Decode is bounded by bundle bytes, node and edge counts and embedded bytes before any allocation. Synchronous finite computation without a cancellation hook; bounds.cancellation is recorded because the registry gate requires it."
search = false
bounds = { cancellation = true, max_coordinates = 1024, max_nodes = 1024, max_edges = 8192 }
surface = ["crates/antecedent/src/analysis/composition.rs", "python/antecedent/composition_bundle.py"]
surface_rust = ["crates/antecedent-design/src/composition_bundle.rs"]
surface_pyo3 = ["python/src/composition_bundle_api.rs"]
surface_values = ["BundleConsumer", "BundleEdge", "BundleError", "BundleLimits", "BundleNode", "BundleStage", "ClaimLabel", "CompositionBundle", "ConsumedBundle", "ConsumedNode", "EvidenceRelationship", "NodeFailure", "NodeKind", "NodeSource", "NodeStatus", "ProviderOrData", "SuppliedData", "SuppliedProvider", "SuppliedSources", "ArtifactDescription", "BundleBuilder", "UpstreamNode", "VerifiedNode", "CompositionBundleRefusal", "TamperedQuantityRefusal", "SwappedEvidenceRefusal", "GraphOrSnapshotMismatchRefusal", "UnsupportedLawRefusal", "ProviderRequestChangedRefusal", "CallbackUnavailableRefusal", "IncompatibleVersionRefusal", "OversizedRefusal", "UnknownNodeKindRefusal", "EdgeDigestMismatchRefusal", "ExpectedIdentityMismatchRefusal", "ProviderRequirement", "DataRequirement", "NodeSummary", "Edge", "Bundle", "Verified", "ReferenceUnresolved", "Failed", "CompositionBundleBuilder"]
refusals = [
