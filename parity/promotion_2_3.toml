[[record]]
id = "2.3A.X5.uncertain_initial_state"
workstream = "X5"
milestone = "A"
work_package = "A4"
status = "promoted"
consumer_question = "How does uncertainty in the pre-action state change the two-step target response?"
theorem = "The 2.2 sequence functional conditions on a specified initial-state law. This extension integrates over a supplied finite target initial-state distribution: sum over s0 of P_target(s0) times R(s0), where R(s0) = sum over l of P(l | s0, a1) E[y | s0, a1, l, a2] is the history-conditioned response read from the complete histories (exact finite sum, no new identification theorem). Plugging in a single initial state is a different estimand with its own result type and label (fixed_initial_state vs marginalized_initial_state); neither converts into the other. A source-labelled law or a point state refuses as target evidence. Departure from the frozen wording: the law is supplied with its own snapshot id and the histories supply R(s0) from the panel; the 2.2 source/target regime catalog is not re-derived here. Artifact limit: the artifact re-evaluates both sums from the embedded law and a tally summary of the panel (counts and outcome sums per initial state and step-2 covariate cell), not from the full panel, so a coherently resealed forgery of summary, law and stored values replays; only the dependent-interval artifact embeds the full panel. Digests are non-cryptographic fingerprints."
reference = "TODO.md A4; prerequisite 2.2A.X5.two_step_temporal_transport"
guarantee = "point_marginalization_over_supplied_target_initial_state_law_exact_finite_sum"
graph_class = "The 2.2 fixed two-slice selection ADMG, with one finite observed pre-action state."
population_semantics = "Target initial state precedes both actions and has its own snapshot; source and target initial-state laws cannot be interchanged."
evidence_family = "A finite target initial-state joint, plus the 2.2 source/target regime catalog and complete histories."
provider = "antecedent_estimate::temporal_initial_state: exact finite-law integration over the declared target initial-state support (at most 64 states, masses summing to one within 1e-9), reading R(s0) from the panel's complete histories."
estimand = "Target two-step intervention mean marginalized over the uncertain initial state."
inference_claim = "point_only"
owners = ["antecedent-estimate", "antecedent-io", "antecedent", "python/antecedent/transport"]
prerequisite_records = ["2.2A.X5.two_step_temporal_transport"]
