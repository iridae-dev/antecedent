compatibility = "Existing 2.2 routes keep their exact scope. Point-only and licensed for the exact-integration EVSI (finite enumeration, conjugate Gaussian closed form, or externally computed decision values combined as stated) only. The Monte Carlo route is NOT a licensed guarantee: its standard error, replicate count, effective sample size, convergence flag and rank-uncertainty flag are reported diagnostics labelled monte_carlo_estimate with calibration coordinate 'unmeasured'; a Monte Carlo coverage or rank guarantee needs its own measured calibration, which is not collected here, so no coverage record is allocated (a point_only record cannot carry one) and the claim stays point_only. Net value is reported only with a cost-to-utility map whose units match; the terminal action set is identical before and after information. Refusal details use the emitted evsi namespace (signal refusals keep signal_provider); the frozen text named evsi.route_frozen and evsi.wrong_contract, which the executed route no longer needs. The preposterior receipt is carried by design_ranking_v1 rather than a separate preposterior_evsi_v1 wire."
search = false
bounds = { cancellation = true, max_coordinates = 1024 }
