  { code = "design_signal_invalid", detail = "evsi.decision_values_need_draws", when = "Externally computed decision values are supplied for a prior that is not a set of draws." },
  { code = "design_signal_invalid", detail = "evsi.decision_values_incoherent", when = "Externally computed decision values do not average back to the prior expected utility for some action." },
  { code = "design_cost_units_mismatch", detail = "evsi.cost_map_required", when = "Net value is required without a cost-to-utility map." },
  { code = "design_cost_units_mismatch", detail = "evsi.cost_units_mismatch", when = "A candidate's cost unit differs from the cost map's, or the map's utility unit differs from the decision's; currency is never assumed to equal outcome utility." },
