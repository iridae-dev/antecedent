  { code = "external_binding_mismatch", detail = "composition_bundle.expected_identity_mismatch", when = "The bundle identity differs from the identity the consumer retained independently of the bytes." },
  { code = "invalid_argument", detail = "composition_bundle.invalid_container", when = "The Python bridge receives bytes that are not a decodable bundle container." },
]
routes = [
  { name = "antecedent.bundle.export_bundle", stage = "representation", status = "licensed", claim = "point_only", covers = ["describe_artifact", "composition_describe_artifact", "detect_kind", "composition_detect_kind", "detect_node_kind", "mean_decision", "composition_mean_decision", "mean_decision_bytes", "mean_source_of", "evidence_relationship_bytes", "mean_result_to_bytes", "standard_consumer", "NodeVerifier", "CompositionBundle.export", "EMBEDDABLE_KINDS", "NODE_KINDS", "RELATIONSHIPS", "STAGES", "Relationship", "Requirement"] },
  { name = "antecedent.bundle.consume_bundle", stage = "consume", status = "licensed", claim = "point_only", covers = ["consume", "consume_with_limits", "consume_composition_bundle", "BundleConsumer.consume"] },
]
