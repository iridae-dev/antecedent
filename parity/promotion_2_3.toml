[[record]]
id = "2.3A.X2.cpdag_completion_scenarios"
workstream = "X2"
milestone = "A"
work_package = "A1"
status = "promoted"
consumer_question = "Does a target effect remain identified and invariant across every DAG completion of a supplied CPDAG when each completion receives evidence bound to its own assumptions?"
theorem = "Finite enumeration of the DAG completions of a supplied CPDAG (every DAG with the CPDAG's skeleton and exactly its v-structures that keeps each directed CPDAG edge and is acyclic), each completion then decided by the already licensed 2.2 classical catalog transport route as one scenario of the 2.2 finite scenario set and evaluated against supplied exact laws. Two DAGs are Markov equivalent exactly when they share skeleton and v-structures (Verma and Pearl 1990), and a CPDAG is the essential graph of such a class (Andersson, Madigan and Perlman 1997); the enumeration relies on that characterization for a valid CPDAG and the invalid-input check refuses an input that is not one. Enumeration does not identify a mixture, assign graph probabilities or transfer evidence by variable name alone: a catalog bound to one completion identity never satisfies another. Completeness holds exactly within the declared bounds (at most 6 nodes and 64 completions) and is never inherited beyond them."
reference = "TODO.md A1; prerequisite 2.2A.X2.finite_scenario_envelope"
guarantee = "bounded_completion_enumeration_per_completion_2_2_decision_structural_envelope_no_graph_probability"
graph_class = "Supplied CPDAG of at most six fully observed static nodes whose completions number at most 64, each consistent DAG completion retained separately under a canonical BLAKE3 identity over its sorted parent-child edges; selection edges and latent (bidirected) pairs are refused, never projected away. A completion is decided by the 2.2 classical catalog route with that row's scope inherited unchanged."
population_semantics = "One target population and one snapshot; evidence is bound per completion identity (or declared shared by the caller) and the evidence identity of every completion is retained in the receipt. Departure from the frozen wording: only exact supplied laws are evaluated, counted laws are refused at the Python bridge (cpdag_scenarios.exact_laws_only)."
evidence_family = "A target observational joint or row snapshot, as a catalog shared by every completion or one catalog per completion identity with its own graph certificate; a completion with no bound evidence is missing_evidence and its mass is never redistributed."
provider = "The exact finite-law evaluator of each licensed DAG completion (the 2.2 per-scenario compiled plan); sampled covariance is the separate 2.3A.X2.shared_scenario_covariance cell."
estimand = "Per-completion target intervention distribution and the unweighted structural envelope over the identified completions, with identified, unidentified, unevaluated and never-enumerated completion counts kept apart and never renormalized."
inference_claim = "structural_envelope"
inference_notes = "Point-only per completion and unweighted: no graph probability, no weighted report, no interval and no inferential statement across completions. The spread of the envelope is a structural range, not a confidence interval."
owners = ["antecedent-identify", "antecedent-estimate", "antecedent-io", "antecedent", "python/antecedent/transport"]
prerequisite_records = ["2.2A.X2.finite_scenario_envelope"]
identity_inputs = ["CPDAG identity", "canonical completion identity", "target population and intervention", "completion-specific evidence binding", "snapshot", "enumeration limits"]
wire_changes = ["Additive completion artifact v1 (feature cpdag_completion_scenarios_v1) retaining the CPDAG, every completion with its identity, edges, status and evidence identity, the per-completion evidence bindings, the report, a premises digest and a separate data digest. A report stopped by an operation, depth or memory limit exports and replays its identical prefix with a conservative upper bound on the never-enumerated count; one stopped by cancellation is never exported (cancelled_not_exportable). A fresh consumer replays the receipt under its own limits and refuses a changed completion, snapshot, evidence binding, provider or report."]
compatibility = "The 2.2 supplied-scenario route and its artifact are unchanged; the completion route reuses the 2.2 per-scenario decision and adds no 2.2 wire field."
search = true
search_impl = ["crates/antecedent-identify/src/sid/cpdag_completion.rs"]
surface_rust = ["crates/antecedent-identify/src/sid/cpdag_completion.rs", "crates/antecedent-estimate/src/cpdag_scenarios.rs", "crates/antecedent-io/src/cpdag_completion_artifact.rs", "crates/antecedent/src/analysis/cpdag_scenarios.rs"]
surface_pyo3 = ["python/src/cpdag_scenario_api.rs"]
surface_exports = ["python/antecedent/transport/advanced.py"]
owned_exports = ["CompletionCounts", "CompletionEvidence", "CompletionPoint", "CompletionReceipt", "CpdagCompletion", "CpdagScenarioRefusal", "CpdagScenarioResult", "MeanEnvelope", "StructuralEnvelope", "TransportScenarioRefusal", "consume_cpdag_scenarios_artifact", "cpdag_completion_scenarios"]
surface_values = ["CpdagScenarioError", "CpdagCompletionInput", "CompletionDag", "CpdagEnumeration", "CompletionEvidenceBinding", "CpdagEvidence", "CompletionRecord", "CpdagCompletionDecision", "CompletionReceiptEntry", "CpdagScenarioReport", "PreparedCpdagScenarios", "CpdagArtifactError", "CpdagConsumeLimits", "CpdagWire", "CompletionEvidenceWire", "SharedEvidenceWire", "CpdagEvidenceWire", "CompletionResultWire", "CpdagReportWire", "CpdagScenarioPremises", "CpdagCompletionArtifactWire", "PreparedCpdagCompletionScenarios", "CpdagScenarioRun", "ScenarioCovarianceRun", "CompletionCounts", "CompletionEvidence", "CompletionPoint", "CompletionReceipt", "CpdagCompletion", "CpdagScenarioRefusal", "CpdagScenarioResult", "MeanEnvelope", "StructuralEnvelope", "TransportScenarioRefusal"]
bounds = { max_nodes = 6, max_completions = 64, cancellation = true, contract = "antecedent_core::SearchBudget", operation_limit = "SearchLimits.operations: one per orientation attempt, one per stored completion, and one per completion entered by the decision", depth_limit = "SearchLimits.depth: the number of undirected edges oriented so far, so it must reach the undirected edge count", memory_limit = "ExecutionContext.memory.hard_limit_bytes against the live bytes of the completions kept" }
