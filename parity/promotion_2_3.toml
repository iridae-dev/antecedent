[[record]]
id = "2.3A.X10.sampled_observation_recovery"
workstream = "X10"
milestone = "A"
work_package = "A6"
status = "carried_forward"
consumer_question = "What sampling uncertainty surrounds an effect computed from the exact binary observation-recovery formula?"
theorem = "Only the exact recovery functional of the licensed 2.2 binary m-graph (record 2.2B.X10.binary_observation_recovery, called through evaluate_exact_recovery and evaluate_recovered_effect, nothing re-derived) is inherited. The sampled estimator (antecedent_estimate::recovery_sampled) is one composed procedure: counted observation-pattern rows are tabulated into the empirical observed pattern law, the whole recovered law is evaluated through the exact formula, and the percentile interval comes from a whole-ROW bootstrap that resamples rows with replacement, so every margin of a replicate is computed from the same drawn rows and the covariance of margins from overlapping rows is preserved; each replicate reruns recovery and the downstream effect, and the interval is formed from the replicate effects, never from per-margin variances (an interval from per-margin variances alone is refused as component_variance_only). The empirical recovered law is never renormalized: its mass defect is reported and bounded by an explicit tolerance. A zero complete-case cell makes the formula's denominator zero and is refused with the offending patterns retained. Departures: the percentile interval is Efron's nonparametric bootstrap applied to the recovery functional of Mohan, Pearl and Tian (2013, m-graph recovery); no consistency or coverage theorem for the composed recovery-bootstrap is cited or proved (the percentile bootstrap is not exact in small samples, and the recovery functional is a ratio of margins that is not smooth at zero cells), and the digests are FNV-based fingerprints, not cryptographic. Calibration (whole-method coverage across the sample-size grid and the weak-pattern boundary) is UNMEASURED: the interval carries calibration = unmeasured and the public route stays closed."
reference = "TODO.md A6; prerequisite 2.2B.X10.binary_observation_recovery; provenance/x10_sampled_observation_recovery.toml"
guarantee = "whole_row_bootstrap_of_exact_binary_recovery_calibration_unmeasured_route_closed"
graph_class = "The binary m-graph class and exact recoverable effect query of the licensed 2.2 X10 row, with at most 6 binary substantive variables; the recovery derivation is re-checked by the identification engine, and adjacent or non-recoverable m-graphs refuse. Other missingness graphs need separate formulas."
population_semantics = "One population, one observation-pattern sampling design (iid rows with stable row ids) and a snapshot shared by recovery and effect estimation."
evidence_family = "Finite counted observation-pattern rows (id and pattern, in order) with explicit response indicators and a catalog binding the observed snapshot; recovered cells must be positive and the rows are embedded in the artifact."
provider = "antecedent_estimate::recovery_sampled (whole-row empirical recovery and outer resampling through the exact 2.2 formula), sealed by antecedent_io::sampled_recovery_artifact (format version 2) and exposed through the closed facade antecedent::analysis::closed_pilots and python/src/closed_pilot_api.rs; internal and non-routed."
estimand = "Recovered target interventional effect (contrast do(1) - do(0)) and a pointwise 95% whole-method percentile sampling interval, retained with the bootstrap covariance of the recovered cells; the interval is withheld from every public route."
inference_claim = "calibrated"
inference_notes = "Carried forward, every route closed. Failed gate: calibration unmeasured (the coverage record id is allocated but not collected; measured only at the 2.3 release cut, project decision: interval and posterior routes stay closed with cell_not_licensed until measured, as for 2.2 X1 and X4). Every stored interval carries calibration = unmeasured. The estimator, artifact and closed Python route execute and their tests pass in Rust."
coverage_records = ["cov.recovery.binary_mgraph.frequentist.l95.sampled_whole_method"]
owners = ["antecedent-estimate", "antecedent-io", "antecedent", "python/antecedent/transport"]
prerequisite_records = ["2.2B.X10.binary_observation_recovery"]
identity_inputs = ["m-graph and exact X10 derivation (roles, effect query, both expression arenas)", "observation indicators and patterns", "row ids and snapshot (catalog bindings)", "population/regime", "resampling design (replicates, level, tolerances) and seed"]
wire_changes = ["Additive: sampled_observation_recovery_v2 artifact (format version 2) carrying the derivation identity, the observation rows, the pattern-count summary, the request configuration with its seed, the recovered law and point, the percentile interval (calibration = unmeasured), diagnostics, the bootstrap covariance of the recovered cells and the replicate receipt (every replicate's selection digest and effect, failed ones included); a consumer reruns the whole method and accepts only a bit-identical result. The v1 reader refuses it by version and this reader refuses v1 bytes."]
compatibility = "The 2.2 exact-law recovery point and its version 1 artifact stay unchanged; counted-law intervals remain closed on every public route."
search = false
bounds = { cancellation = true, min_replicates = 20, max_replicates = 2000, max_rows = 1000000, max_binary_variables = 6 }
refusals = [
  { code = "cell_not_licensed", detail = "sampled_recovery.route_frozen", when = "The public sampled provider or interval route is requested; closed because calibration is unmeasured." },
  { code = "cell_not_licensed", detail = "sampled_recovery.component_variance_only", when = "An interval is requested from per-margin variances alone." },
  { code = "route_not_supported", detail = "sampled_recovery.unrecoverable_pattern", when = "An observation pattern, zero complete-case cell, zero denominator, adjacent or non-recoverable m-graph violates the selected exact recovery formula; the offending patterns are retained." },
  { code = "route_not_supported", detail = "sampled_recovery.too_many_failed_replicates", when = "More than the configured fraction of bootstrap replicates hit a zero cell or failed recovery." },
  { code = "route_not_supported", detail = "sampled_recovery.bounds_exceeded", when = "Replicates, rows or binary variables are outside the declared bounds, or stored sizes exceed the consumer's limits." },
  { code = "invalid_argument", detail = "sampled_recovery.invalid_input", when = "A malformed row set, snapshot, derivation or configuration." },
  { code = "invalid_argument", detail = "sampled_recovery.receipt_mismatch", when = "A stored receipt does not match its recomputed digest or replay." },
  { code = "transport_budget_cancel", detail = "sampled_recovery.cancelled", when = "Cancellation stopped the bootstrap; no partial interval is reported." },
