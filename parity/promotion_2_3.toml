[[record]]
id = "2.3A.X5.dependent_temporal_interval"
workstream = "X5"
milestone = "A"
work_package = "A4"
status = "carried_forward"
consumer_question = "What sampling interval surrounds a target two-step sequence effect when observations share a repeated unit?"
theorem = "The two-step identified functional is inherited from its 2.2 proof, not its point-only uncertainty. A whole-sequence estimator must retain unit dependence through fitting, resampling and interval construction; iid row resampling cannot certify it. Implemented as an in-repo cluster (whole-unit) bootstrap of the entire history-conditioned estimator (percentile or basic interval over a seeded set of unit-resampled replicates, each re-running the whole estimator). No consistency theorem for this bootstrap on this functional is derived or inherited here: the interval is dependence-preserving and its coverage is unmeasured. Gate that did not pass: whole-method coverage on the declared sample-size grid and dependence boundary (the calibration fixture below has no executing evidence); that coordinate is measured only at the release cut, so the route is carried forward closed."
