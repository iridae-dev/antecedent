wire_changes = ["Additive: binary_nested_markov_pilot_v1 artifact (format version 1) carrying the declared ADMG, graph and parameterization ids, the regime counts, the fit options and the fit receipt (parameters, 16 fitted cells, log-likelihood, diagnostics with the four constraint residuals, model-versus-plug-in contrast, three separate status fields, calibration = unmeasured); a consumer re-runs the pilot and accepts only a bit-identical receipt. No existing wire is reinterpreted."]
