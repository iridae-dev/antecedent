[[record]]
id = "2.3B.F11.external_signal"
workstream = "F11"
milestone = "B"
work_package = "B0.2"
status = "promoted"
consumer_question = "Can external candidate signal and update be consumed under a checked semantic contract?"
theorem = "Frozen acceptance boundary: P(signal=1)=1/2; posterior P(theta=1|signal=1)=3/4 and P(theta=1|signal=0)=1/4. A predictive law without coherent posterior update or wrong candidate/sample ID refuses. This record alone grants no causal or interval license."
reference = "TODO.md B0.2; prerequisite feature records F2, F4, F20"
