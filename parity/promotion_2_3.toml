]
fixtures = [
  { id = "b4.categorical_group_mean.positive", role = "positive", intent = "On the interleaved three-group dataset the level coefficients are 3 and 7 and the covariance is [[5/3, 1],[1, 3/2]] with the unmeasured calibration status reported.", evidence_test = "crates/antecedent-estimate/tests/categorical_treatment.rs", evidence_assertion = "b4_categorical_dummy_regression_covariance_matches_group_mean_algebra" },
  { id = "b4.categorical_omnibus.positive", role = "positive", intent = "The omnibus Wald statistic equals the closed-form quadratic of the level coefficients in their covariance.", evidence_test = "crates/antecedent-estimate/tests/categorical_treatment.rs", evidence_assertion = "b4_categorical_omnibus_wald_matches_closed_form" },
  { id = "b4.categorical_monotonicity.positive", role = "positive", intent = "An increasing effect over three ordered levels gives hand-derived adjacent steps with variance 2/3 and the conservative one-sided monotonicity statistic.", evidence_test = "crates/antecedent-estimate/tests/categorical_treatment.rs", evidence_assertion = "b4_categorical_monotonicity_increasing_effect" },
  { id = "b4.categorical_python_group_mean.positive", role = "positive", intent = "The Python surface reproduces the group-mean algebra.", evidence_test = "python/tests/test_categorical_treatment.py", evidence_assertion = "test_b4_categorical_dummy_regression_matches_group_mean_algebra" },
  { id = "b4.categorical_sparse_level.negative", role = "negative", intent = "A level below the declared minimum rows is refused by name with categorical_treatment.sparse_level and never dropped.", evidence_test = "crates/antecedent-estimate/tests/categorical_treatment.rs", evidence_assertion = "b4_categorical_sparse_level_is_refused_by_name_never_dropped" },
  { id = "b4.categorical_absent_level.negative", role = "negative", intent = "A declared level with no rows is refused by name with categorical_treatment.absent_level.", evidence_test = "crates/antecedent-estimate/tests/categorical_treatment.rs", evidence_assertion = "b4_categorical_absent_level_is_refused_by_name" },
