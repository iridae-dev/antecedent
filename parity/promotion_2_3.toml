compatibility = "Existing 2.2 routes keep their exact scope. Two distinct theorem-specific families ship, each reusing an existing checker unchanged: TransportRepairFamily (catalog-aware classical transport identifier plus derivation verification) and BackdoorRepairFamily (back-door identifier on the one joint observational law a study would deliver, re-verified by d-separation). A subset is verified_sufficient only when its family's checker identifies the hypothetical evidence, the derivation re-verifies and no unresolved assumption obligation remains; classifications are verified_sufficient, insufficient, not_certified, invalid and unevaluated. Limits stated: there is no z-transport repair family (the z-transport proof has an obligation adapter only); the repair artifact needs graphs over dense static variables 0..n; a sample increase has no transport checker and is not_certified. The frozen text's route_frozen detail is dropped because the executed route no longer needs it. The stored-artifact refusals (repair_artifact.invalid_artifact, unsupported_version, bounds_exceeded, budget, replay_mismatch) are declared by the sibling record 2.3B.F13.repair_search_receipt because one record's refusal details share one namespace. No causal or interval claim."
search = true
