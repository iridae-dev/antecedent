[[record]]
id = "2.3B.F14.design_ranking_artifact"
workstream = "F14"
milestone = "B"
work_package = "B0.2"
status = "promoted"
consumer_question = "Can portable design ranking artifact be consumed under a checked semantic contract?"
theorem = "Frozen acceptance boundary: Net values are 3/20 and 1/40, in that order, invariant to input candidate ordering. Altered signal/update fingerprint, overlapping source data or incompatible cost unit refuses replay. This record alone grants no causal or interval license."
reference = "TODO.md B0.2; prerequisite feature records F12, F24"
guarantee = "sealed_design_ranking_with_graded_replay_native_exact_recomputed_external_values_retained_as_attested_point_only"
graph_class = "Only an independently identified fixed-graph or declared structural-scenario contract; this composition cell does not identify a graph."
population_semantics = "Population, regime, horizon, conditioning, coordinate support and source/target snapshot identities remain separately bound."
evidence_family = "Two candidates have EVSI 1/4 and 1/8 under identical utility and cost unit; costs are 1/10 each."
provider = "Native implementation or separately scoped exact-request external provider; provider trust is never upgraded by representation alone."
estimand = "portable design ranking artifact"
inference_claim = "point_only"
owners = ["antecedent-core", "antecedent-io", "antecedent", "python/antecedent"]
prerequisite_records = ["2.3B.F12.evsi", "2.3A.F24.composition_provenance"]
prerequisite_reason = "Requires the listed feature contracts and a separately licensed scientific producer; registration is not execution."
identity_inputs = ["scientific quantity coordinates", "population, regime and horizon", "snapshot and causal contract", "provider and exact request", "feature-specific action, signal or evidence identities"]
wire_changes = ["Allocate design_ranking_v1 as additive v1 metadata in the bounded sectioned artifact container (CBOR metadata, separate numerical section when needed): decision contract; semantic candidate IDs; EVSI/net values and error; signal/update fingerprints; costs/units; support/trust/RNG. Unknown major versions refuse; 2.2 wires are never reinterpreted."]
compatibility = "Existing 2.2 routes keep their exact scope; the 2.2 structural ordering (verified sufficiency, then cost units, then sample budget, then semantic id) is preserved when no probabilistic model is licensed. Point-only: calibration coordinate 'unmeasured' (Monte Carlo error coverage and rank guarantees are not measured; an exact-integration EVSI is a point value). Replay is graded: only a native signal with exact integration is recomputed and reported as natively replayed; an external likelihood or posterior has only its arithmetic recomputed from the retained attested table; external decision values are checked for coherence and combined; a Monte Carlo value is bound but not re-simulated (MonteCarloNotReplayed). External values are retained as attested and never marked native. Limits: a consistently resealed artifact that honestly states a different prior or decision table is accepted as the correct ranking of those stated inputs, because ConsumeExpectation binds only the contract, signal identities, source digests and cost mapping the consumer retained independently; the Gaussian closed-form replay reuses the evaluator's expected-maximum-of-affine routine, so that path is a consistency check, not an independent derivation. Refusal details use the emitted design_ranking namespace; the frozen text named design_ranking_artifact.* and the route_frozen detail, which the executed route no longer needs."
search = false
bounds = { cancellation = true, max_coordinates = 1024 }
refusals = [
  { code = "route_not_supported", detail = "design_ranking.unsupported_version", when = "The artifact has an unknown major version." },
  { code = "route_not_supported", detail = "design_ranking.bounds_exceeded", when = "A stored bound (candidates, states or table cells) exceeds the consumer's own maximum; checked before any recomputation." },
  { code = "invalid_argument", detail = "design_ranking.invalid_artifact", when = "The artifact body is structurally invalid." },
  { code = "design_signal_invalid", detail = "design_ranking.digest_mismatch", when = "The artifact digest does not match its body." },
