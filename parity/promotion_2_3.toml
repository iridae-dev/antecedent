[[record]]
id = "2.3B.B4.nonlinear_mediation"
workstream = "B4"
milestone = "B"
work_package = "B4"
status = "promoted"
consumer_question = "Can natural direct and indirect effects of a binary treatment through a continuous mediator with a nonlinear outcome be consumed under a checked semantic contract, with the interventional estimand refused?"
theorem = "Under sequential ignorability, no treatment-induced mediator-outcome confounder and cross-world independence (Pearl 2001; Imai, Keele and Tingley 2010), with theta(a, a') the outcome mean when treatment is a and the mediator law is that under a', the natural direct effect is theta(1,0) - theta(0,0), the natural indirect effect is theta(1,1) - theta(1,0) and the total effect is theta(1,1) - theta(0,0) = NDE + NIE. The mediator is a Gaussian linear model M = alpha A + gamma X + e_M and the outcome a polynomial in M with treatment interaction; theta is integrated over e_M by Gauss-Hermite quadrature, with an n versus 2n node error check. Hand-derived anchor: SCM alpha = gamma = 0.5, sigma2 = 0.64, b0 = 1, b1 = 0.8, c1 = 0.6, c2 = 0.4, delta = 0.3, bx = 0.7 with E[X] = 1 gives NDE = b1 + delta gamma E[X] = 0.95, NIE = (c1 + delta) alpha + c2 (alpha^2 + 2 alpha gamma E[X]) = 0.75 and TE = 1.70. An unmeasured confounder, a treatment-induced mediator-outcome confounder, an undeclared cross-world independence, weak overlap or a quadrature disagreement above the tolerance refuses; the interventional (randomized-intervention) estimand is CLOSED. This record grants no interval license."
reference = "TODO.md B4; Pearl (2001) natural effects, Imai, Keele and Tingley (2010), Abramowitz and Stegun section 25.4; provenance/b4_nonlinear_mediation.toml"
guarantee = "nonlinear_mediation_natural_effects_point_only_bootstrap_se_unmeasured_diagnostic_interval_closed"
graph_class = "Binary treatment, one continuous mediator and measured covariates under declared sequential ignorability, cross-world independence and no treatment-induced mediator-outcome confounding; these are declared premises recorded as declared, never verified."
population_semantics = "One row snapshot of a single population; the effects average over the observed covariate distribution and over the fitted Gaussian residual law of the mediator. Overlap requires the cross-world mediator law to lie within the treated arm's observed mediator range."
evidence_family = "A deterministic crossed grid (A in {0,1}) x (X in {-1,0,1,2,3}) x four symmetric mediator residuals whose OLS fit is exact, so the closed-form effects are recovered; a cubic variant exercises the quadrature node count."
provider = "Native implementation; no external provider value is consumed and none is trusted."
estimand = "natural direct, natural indirect and total effects of a binary treatment through a continuous mediator"
inference_claim = "point_only"
inference_notes = "Claim policy (calibration is measured once at the release cut): the licensed claim is the POINT natural direct, indirect and total effects. The bootstrap standard error is a reported diagnostic labelled calibration 'unmeasured' with interval status 'closed_calibration_unmeasured'; no interval is produced and no coverage record is allocated (the registry accepts coverage_records only for a calibrated claim)."
owners = ["antecedent-estimate", "antecedent-io", "antecedent", "python/antecedent"]
prerequisite_records = []
