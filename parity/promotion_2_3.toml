compatibility = "Existing 2.2 routes keep their exact scope. Point-only: the test's Type I error and power are unmeasured (calibration coordinate 'unmeasured') and non-rejection never proves constancy. Refusal details use the emitted effect_constancy namespace; the frozen text named temporal_effect_constancy.* and the route_frozen detail, which the executed route no longer needs. A consumer refuses a changed identity only against an expected identity the consumer itself retained; a resealed artifact checked without one is only checked for internal consistency."
