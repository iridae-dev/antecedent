  { id = "f18.dependent_covariance.positive", role = "positive", intent = "A supplied covariance of 1/8 between estimates 1 and 2 (variance 1/4 each) gives the Wald statistic 4 against Q = 2 under independence, with p = erfc(sqrt 2).", evidence_test = "crates/antecedent-estimate/tests/effect_constancy.rs", evidence_assertion = "f18_constancy_oracle_dependent_covariance_differs_by_analytic_amount" },
  { id = "f18.wrong_contract.negative", role = "negative", intent = "A changed estimand, unit or regime across partitions refuses the global test with effect_constancy.incompatible_partitions.", evidence_test = "crates/antecedent-estimate/tests/effect_constancy.rs", evidence_assertion = "f18_incompatible_partition_estimand_units_and_regime_refuse" },
  { id = "f18.invalid_covariance.negative", role = "negative", intent = "A malformed cross-partition covariance refuses with effect_constancy.invalid_covariance rather than falling back to independence.", evidence_test = "crates/antecedent-estimate/tests/effect_constancy.rs", evidence_assertion = "f18_incompatible_partition_invalid_covariance_refuses" },
  { id = "f18.resealed_identity.negative", role = "negative", intent = "A consistently resealed artifact with a changed partition identity is refused against the identity the consumer retained.", evidence_test = "crates/antecedent-io/tests/effect_constancy_artifact.rs", evidence_assertion = "f18_artifact_resealed_partition_identity_is_refused" },
  { id = "f18.fresh_replay.artifact", role = "artifact", intent = "A fresh reader recomputes and replays the stored test bit-identically, keeping canonical partition order, per-contrast Holm values, covariance, multiplicity family and the unmeasured calibration coordinate.", evidence_test = "crates/antecedent-io/tests/effect_constancy_artifact.rs", evidence_assertion = "f18_artifact_three_partitions_keep_holm_values_and_canonical_order" },
