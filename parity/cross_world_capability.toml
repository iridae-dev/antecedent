[[row]]
id = "counterfactual.finite_shared_exogenous_scm.marginal"
quantity = "counterfactual_marginal"
model = "finite_shared_exogenous_scm"
conditioning = ["no_evidence", "factual_evidence"]
history = ["no_history"]
evidence = ["declared_mechanisms"]
population = "single"
coupling = "not_required"
status = "executed"
route = "antecedent_counterfactual::selective::FiniteScmExecutor"
theorem = "Fully declared SCM over finite variables in which an exogenous term may feed several mechanisms, with every mechanism and every finite exogenous law declared: the unit-level counterfactual joint law over worlds is the push-forward of the joint exogenous posterior given the factual evidence (abduction-action-prediction; Pearl 2009 ch. 7; Balke and Pearl 1994), enumerated exactly over the joint exogenous states. A shared term takes one value that every mechanism reading it sees in every world, so latent confounding raises no identification question when the model is declared. Model adequacy is a premise, not a check."
remedy = ""

