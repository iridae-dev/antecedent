population = "single"
coupling = "shared_abduced_exogenous"
status = "executed"
route = "antecedent_counterfactual::selective::FiniteScmExecutor"
theorem = "As the finite Markovian row; a world reads a parent from another world (nested counterfactual; Pearl 2001 natural effects) and every world reads one exogenous posterior state."
remedy = ""

