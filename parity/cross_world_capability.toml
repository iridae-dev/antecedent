# Theorem-scoped capability matrix of cross-world execution.
# Checked against antecedent_counterfactual::selective::matrix::ROWS by
# crates/antecedent-counterfactual/tests/capability_matrix_registry.rs.
version = 1

[[row]]
id = "counterfactual.finite_markovian_scm.marginal"
quantity = "counterfactual_marginal"
model = "finite_markovian_scm"
conditioning = ["no_evidence", "factual_evidence"]
history = ["no_history"]
evidence = ["declared_mechanisms"]
population = "single"
coupling = "not_required"
status = "executed"
route = "antecedent_counterfactual::selective::FiniteScmExecutor"
theorem = "Markovian SCM over finite variables with independent finite exogenous terms and declared mechanisms: a counterfactual marginal is the push-forward of the exogenous posterior given the factual evidence through the intervened equations (abduction-action-prediction; Pearl 2009 ch. 7; Balke and Pearl 1994), enumerated exactly. Model adequacy is a premise, not a check."
remedy = ""

[[row]]
id = "counterfactual.finite_markovian_scm.joint"
quantity = "counterfactual_joint"
model = "finite_markovian_scm"
conditioning = ["no_evidence", "factual_evidence"]
history = ["no_history"]
evidence = ["declared_mechanisms"]
population = "single"
coupling = "shared_abduced_exogenous"
status = "executed"
route = "antecedent_counterfactual::selective::FiniteScmExecutor"
theorem = "As the finite Markovian marginal row; an event over several worlds is the probability under the one exogenous posterior every world reads, so it is computed from coupled worlds only."
remedy = ""

[[row]]
id = "natural_path_specific.finite_markovian_scm"
quantity = "natural_path_specific"
model = "finite_markovian_scm"
conditioning = ["no_evidence", "factual_evidence"]
