evidence = ["supplied_fitted_identity"]
population = "transported"
coupling = "shared_abduced_exogenous"
status = "existing_theorem_route"
route = "antecedent_counterfactual::transported_path_specific::evaluate_transported_path_specific"
theorem = "Selection nodes only into covariates or the treatment, additive noise, invariant noise law, support inclusion (transported_path_specific theorem). Keeps its own boundary; it does not abduce a target-population factual unit."
remedy = ""

[[row]]
id = "transported.cross_world_execution"
quantity = "transported_cross_world"
model = "finite_markovian_scm"
conditioning = []
history = []
evidence = []
population = "transported"
coupling = "shared_abduced_exogenous"
status = "closed"
route = "none"
theorem = "No joint theorem composes a transport license with factual abduction in a target population; a transport identification supplies no abduction, shared-noise or per-world receipts."
refusal_code = "cell_not_licensed"
refusal_detail = "cross_world_execution.transported_row_closed"
remedy = "supply a transport license for the quantity, a fixed-population cross-world license, and the cross-population invariance of the exogenous law with target-population factual evidence; the static additive linear case has its own theorem-scoped route"

[[row]]
id = "model.semi_markovian"
quantity = "counterfactual_joint"
model = "semi_markovian"
conditioning = []
history = []
evidence = []
population = "single"
coupling = "shared_abduced_exogenous"
status = "closed"
route = "none"
theorem = "Latent confounding whose mechanisms and exogenous law are not declared, or are to be fitted from observational data, does not identify a cross-world joint law; the same shared exogenous term is executed when every mechanism and law is declared."
refusal_code = "cross_world_not_identified"
refusal_detail = "cross_world_execution.latent_confounding_not_identified"
remedy = "declare every mechanism and the finite law of every exogenous term (a fully declared finite SCM may share an exogenous term between mechanisms), or use an identification route that accepts the latent structure"

