# Operation records: one description, with the same fields, for every verified operation.
#
# Read, checked and partly generated by scripts/operation_records.py (see its docstring and
# adr/0029-operation-records.md). A record is keyed by the operation's defining Rust path and
# attached to its code by `file` and `item`. `generated` names the fields the script writes;
# edit the others by hand, then run `python3 scripts/operation_records.py --write`.
#
# A verified operation is one an assurance record lists in `operations`
# (parity/assurance_records.toml). The record never raises a result's standing and makes no
# calibration claim: `justification` says which checks of which kind stand behind the
# operation, and an obligation is discharged only by a checked rule or valid evidence.

schema = 1

