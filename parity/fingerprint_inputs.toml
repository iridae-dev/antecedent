# What a dynamic read site can read, for the dependency fingerprint (scripts/evidence_fingerprint.py).
#
# The fingerprint hashes every file a hashed source reaches by a literal path or an include
# macro. A site that builds a path or an environment name at run time cannot be followed
# statically, so fingerprinting a row whose hashed files contain such a site raises until
# the site's source file has a row here. Each row names exactly what the site can read; the
# files and directories listed (globs allowed) are hashed into every fingerprint that
# reaches the source, and `env` names follow the fingerprint's environment rule
# (ANTECEDENT_* values hashed, other names by name only).
#
# source   repo-relative file that contains the dynamic site(s)
# inputs   repo paths, directories or globs the sites can read
# env      environment variable names the sites can read
# why      what the site does

