# Frozen acceptance manifest. Every case names the public route a practitioner uses, the
# concrete supported configuration, the required outputs, the frozen targets and the simulated
# representative dataset. Later work may bind evidence (status "bound") but may not loosen a
# target without a recorded reason. See docs/acceptance-manifest.md.
#
# Reference workstation: 8 performance cores, 16 GiB memory, local SSD.

[manifest]
schema_version = 1
reference_workstation = { cores = 8, memory_bytes = 17179869184 }
dataset_provenance = "Every dataset is a simulated representative of the described study; the authors' original datasets are not available."

