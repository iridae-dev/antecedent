python_facade = "full"
evidence_test = "crates/antecedent/tests/bayesian.rs"
evidence_assertion = "prior_bank_ess_accounting"
notes = "ExternalPriorSource.ess (caller-declared prior-strength N) + ComposedPrior.effective_ess / .composed_ess / .kish_ess; composed_ess is path-dependent (Some only when every contributing power-path source declares ess; always None on the mixture path — moment-matching folds in between-component spread, so summing source ESS would overstate composed strength); kish_ess is a Kish (1965) concentration diagnostic over applied alphas (power) or mixture weights (mixture), shared via antecedent_prob::kish_ess (also used by TransportAdjustment::kish_ess); explicitly distinct from MCMC/autocorrelation ESS on posterior diagnostics; python_facade=full (ExternalPriorSourceSpec.ess / ComposedPrior.effective_ess/.composed_ess/.kish_ess on compose_external_priors); conformance/bayesian/prior_bank_ess"

[[capabilities]]
id = "bayes.prior_bank.conjugate_moment_match"
status = "done"
evidence_kind = "internal_known_truth"
known_truth_fixture = "conformance/bayesian/prior_conjugate_moment_match"
python_facade = "full"
evidence_test = "crates/antecedent/tests/bayesian.rs"
evidence_assertion = "prior_conjugate_moment_match"
notes = "BetaHyperparameters / GammaHyperparameters (crates/antecedent-prob/src/conjugate_moment_match.rs) expose two constructors per family, not one: from_moments(mean, variance) matches both moments exactly, with prior-strength ESS (alpha+beta-2 for Beta, shape-1 for Gamma) read back as a derived consequence and allowed to be negative (a proper prior weaker than the flat/reference prior is truthfully reported, not an error); from_mean_and_ess(mean, ess) matches the mean and a caller-declared ESS exactly with no variance parameter, since mean+ess alone determine every other moment (ess=0 degrades to Beta(1,1)/Gamma(shape=1) reference strength, never vanishing or improper; negative ess input is rejected). Replaces an earlier single from_moments(mean, variance, target_ess) whose variance argument never affected the output (checked for the Beta support bound, then discarded by the rescale to target_ess) and which rejected satisfiable Beta requests as a result — that signature no longer exists. Out-of-support (mean, variance) on from_moments is rejected via ProbError, never silently clamped (Beta requires var < mean*(1-mean), no epsilon slack; Gamma only requires mean>0, var>0). This is a standalone hyperparameter converter, NOT a new PriorSpec variant and NOT a new supported inference path — no backend in this crate (conjugate.rs, laplace.rs, hmc.rs, gaussian_target.rs) accepts anything but a GaussianCoefficientPrior design-matrix prior plus a residual-variance model, so a Beta/Gamma prior has nothing to plug into; python_facade=full (antecedent.priors.beta_from_moments / beta_from_mean_and_ess / gamma_from_moments / gamma_from_mean_and_ess); conformance/bayesian/prior_conjugate_moment_match"

