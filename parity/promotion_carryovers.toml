corrective_action = "Complete the dependency-ordered 2.4 general finite counterfactual transport package in ROADMAP.md: antecedent-identify leads typed query/evidence prerequisites, bounded CTFTR and district identification, exact provider and antecedent-io independent replay with Python public routes. Execute independent finite-SCM positive and two-model obstruction witnesses plus installed producer/fresh-process consumer gates; retain this route closed until its exact scope passes."

