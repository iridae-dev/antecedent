# Assurance records: machine-checked properties of Antecedent operations.
#
# Read and checked by scripts/assurance.py. Each record states one proposition, its
# scope, what its checks trust, the operations it is about (`operations`: their defining
# Rust paths, each described by its record in parity/operation_records.toml), and its
# checks, each of one kind:
#
#   machine_checked_proof    a Lean theorem about a specification
#   verified_implementation  a Lean theorem about the production Rust as Charon and Aeneas
#                            translate it
#   bounded_model_check      a Kani proof harness run on the production Rust
#
# A record is no support decision, calibration result or scientific record. It never
# raises a result's standing; it says what was established, about which code, under
# which trust.
#
# `result` is written by `python3 scripts/assurance.py run`: the digest of every input
# (Lean and harness files, the covered Rust items by token, the pinned toolchain) when the
# checks last passed, and the commit they ran at. A changed input makes the record stale.

[[records]]
id = "claim_standing.never_raised"
proposition = "An accepted claim relay keeps or lowers its parent's identification and domain standing, so no finite chain of relays raises the original claim's standing or creates a positive domain status, and a checked derivation claims no stronger identification than any parent. The production relay domain rule and identification rule compute exactly the specification's rules."
scope = "The Retarget relay of compose_claims and the identification-status rule of identification_strengthened. The relay's requirement that every other field is unchanged is modeled, not translated; masses, the other departure checks and the compositions compose_claims refuses are outside this record."
trusted = [
    "the Lean 4 kernel",
    "Charon and Aeneas translate the Rust items faithfully",
    "the Aeneas model of the standard-library operations the items use: enum discriminant reads and u8 comparison",
    "the relay's whole-field equality checks in compose_claims correspond to `content` being unchanged in the model",
]
limitations = [
    "The order on domain statuses puts unknown below every other status and leaves distinct non-unknown statuses incomparable; it says nothing about which of two different findings is better.",
]

