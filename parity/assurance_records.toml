[[records]]
id = "acceptance.retained_expected_identity"
proposition = "bind returns Bound only when the presented slot matches the required one, the consumer passed a retained expected identity, and every facet (payload, coordinates, prior, alignment, cyclic-solution tag) equals it. Without a retained expectation nothing is bound; a self-description can only cause a refusal; a matching presentation without a false self-description is bound. In the claim slot that accept_claim_expecting uses, a replayed claim binds exactly when its claim id equals the claim id the consumer retained."
scope = "antecedent_io_core::bound_identity::bind for every input, with the facet digest replaced by an arbitrary function, and its claim slot as accept_claim_expecting and bind_retained_claim use it (io-core, and the IPW-replaying wrapper in antecedent-io). The deprecated accept_claim, which accepts any claim that replays, and loaders that take an optional expected identity and are called without one (FittedEffectModel::load, artifact from_bytes(bytes, None)) do not bind and are outside this record."
trusted = [
    "the Lean 4 kernel",
    "Kani 0.68.0 and CBMC 6.11.0 model the Rust semantics of bind",
    "the Kani stub of facet_digest is an arbitrary value, so no property of BLAKE3 is used",
]
limitations = [
    "accept_claim without a retained identity stays available, deprecated, for 3.0 callers until 4.0; it accepts any claim that replays.",
    "That bind_retained_claim and accept_claim_expecting route every replayed claim through bind is reviewed and tested (identity_contract, bayesian_randomized_routes), not machine-checked.",
]

[records.operation]
inputs = ["the required slot", "the presented identity", "the consumer's retained expected identity, if any"]
output = "Bound, NotRequired, or a typed refusal naming the first mismatch"
premises = ["the expected identity is retained by the consumer, not read from the presented artifact"]
transformation = "slot check, self-description check against the recomputed facet digest, then facet-by-facet comparison with the retained expectation"
justification = [
    "Antecedent.Acceptance.bind_bound_sound",
    "Antecedent.Acceptance.bind_none_not_bound",
    "Antecedent.Acceptance.bind_mismatch_never_bound",
    "bound_only_against_the_retained_expectation",
