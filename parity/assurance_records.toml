# Assurance records: machine-checked properties of Antecedent operations.
#
# Read and checked by scripts/assurance.py. Each record states one proposition, its
# scope, what its checks trust, the operation it is about (the operation-record fields),
# and its checks, each of one kind:
#
#   machine_checked_proof    a Lean theorem about a specification
#   verified_implementation  a Lean theorem about the production Rust as Charon and Aeneas
#                            translate it
#   bounded_model_check      a Kani proof harness run on the production Rust
#
# A record is no support decision, calibration result or scientific record. It never
# raises a result's standing; it says what was established, about which code, under
# which trust.
#
# `result` is written by `python3 scripts/assurance.py run`: the digest of every input
# (Lean and harness files, the covered Rust items by token, the pinned toolchain) when the
# checks last passed, and the commit they ran at. A changed input makes the record stale.

[[records]]
id = "claim_standing.never_raised"
proposition = "An accepted claim relay keeps or lowers its parent's identification and domain standing, so no finite chain of relays raises the original claim's standing or creates a positive domain status, and a checked derivation claims no stronger identification than any parent. The production relay domain rule and identification rule compute exactly the specification's rules."
scope = "The Retarget relay of compose_claims and the identification-status rule of identification_strengthened. The relay's requirement that every other field is unchanged is modeled, not translated; masses, the other departure checks and the compositions compose_claims refuses are outside this record."
trusted = [
    "the Lean 4 kernel",
    "Charon and Aeneas translate the Rust items faithfully",
    "the Aeneas model of the standard-library operations the items use: enum discriminant reads and u8 comparison",
    "the relay's whole-field equality checks in compose_claims correspond to `content` being unchanged in the model",
]
limitations = [
    "The order on domain statuses puts unknown below every other status and leaves distinct non-unknown statuses incomparable; it says nothing about which of two different findings is better.",
]

[records.operation]
inputs = ["one parent claim (relay) or parent claims (checked derivation)", "the derived claim"]
output = "acceptance of the derived claim, or a typed refusal"
premises = ["the relay names exactly one parent", "every relayed field other than the domains is unchanged"]
transformation = "relay: each domain axis is unchanged or a positive status becomes unknown; derivation: the derived identification status's strength rank is at most each parent's"
justification = [
    "Antecedent.Standing.relayChain_le",
    "Antecedent.Standing.relayChain_no_new_assertion",
    "Antecedent.Standing.derivation_identification_le",
    "AntecedentRust.Standing.domain_change_allowed_spec",
    "AntecedentRust.Standing.identification_status_kept_or_lowered_spec",
]
implementation = [
    "antecedent_contract::claim::compose_claims",
    "antecedent_contract::claim::domain_change_allowed",
    "antecedent_contract::claim::identification_status_kept_or_lowered",
    "antecedent_core::identification::IdentificationStatus::strength_rank",
]
obligations = []
limitations = ["Identified-mass monotonicity is checked in floating point in the same function and is not covered."]

[[records.checks]]
kind = "machine_checked_proof"
tool = "lean"
files = ["formal/Antecedent/Standing.lean"]
theorems = [
    "Antecedent.Standing.domainChangeAllowed_le",
    "Antecedent.Standing.domainChangeAllowed_asserts",
    "Antecedent.Standing.relay_le",
    "Antecedent.Standing.relayChain_le",
    "Antecedent.Standing.relayChain_no_new_assertion",
    "Antecedent.Standing.derivation_identification_le",
]

[[records.checks]]
kind = "verified_implementation"
tool = "lean+aeneas"
files = [
    "formal/rust/AntecedentRust/Standing.lean",
    "formal/rust/AntecedentRust/Extracted/Standing/Types.lean",
    "formal/rust/AntecedentRust/Extracted/Standing/Funs.lean",
]
theorems = [
    "AntecedentRust.Standing.strength_rank_spec",
    "AntecedentRust.Standing.domain_change_allowed_spec",
    "AntecedentRust.Standing.identification_status_kept_or_lowered_spec",
    "AntecedentRust.Standing.rust_domain_change_never_raises",
    "AntecedentRust.Standing.rust_identification_never_raised",
]
rust_items = [
    { file = "crates/antecedent-contract/src/claim.rs", items = [
        "enum:DomainStatus#0",
        "impl:DomainStatus#0/fn:is_positive#0",
        "fn:domain_change_allowed#0",
        "fn:identification_status_kept_or_lowered#0",
        "fn:compose_claims#0",
        "fn:identification_strengthened#0",
    ] },
    { file = "crates/antecedent-core/src/identification.rs", items = [
        "enum:IdentificationStatus#0",
        "impl:IdentificationStatus#0/fn:strength_rank#0",
    ] },
]

