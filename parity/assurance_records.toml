[[records]]
id = "acceptance.retained_expected_identity"
proposition = "bind returns Bound only when the presented slot matches the required one, the consumer passed a retained expected identity, and every facet (payload, coordinates, prior, alignment, cyclic-solution tag) equals it. Without a retained expectation nothing is bound; a self-description can only cause a refusal; a matching presentation without a false self-description is bound."
scope = "antecedent_io_core::bound_identity::bind for every input, with the facet digest replaced by an arbitrary function. Artifact loaders that accept on self-consistency and replay without a caller-retained identity (accept_claim, accept_contract, from_bytes with no expected identity) do not route through bind and are outside this record."
trusted = [
    "the Lean 4 kernel",
    "Kani 0.68.0 and CBMC 6.11.0 model the Rust semantics of bind",
    "the Kani stub of facet_digest is an arbitrary value, so no property of BLAKE3 is used",
]
limitations = [
    "The main artifact acceptance path does not take a caller-retained expected identity; it re-derives the digests the artifact advertises from the artifact's own payloads.",
]

[records.operation]
inputs = ["the required slot", "the presented identity", "the consumer's retained expected identity, if any"]
output = "Bound, NotRequired, or a typed refusal naming the first mismatch"
premises = ["the expected identity is retained by the consumer, not read from the presented artifact"]
transformation = "slot check, self-description check against the recomputed facet digest, then facet-by-facet comparison with the retained expectation"
justification = [
    "Antecedent.Acceptance.bind_bound_sound",
    "Antecedent.Acceptance.bind_none_not_bound",
    "Antecedent.Acceptance.bind_mismatch_never_bound",
    "bound_only_against_the_retained_expectation",
]
implementation = ["antecedent_io_core::bound_identity::bind"]
obligations = []
limitations = []

[[records.checks]]
kind = "machine_checked_proof"
tool = "lean"
files = ["formal/Antecedent/Acceptance.lean"]
theorems = [
    "Antecedent.Acceptance.bind_eq_bound_iff",
    "Antecedent.Acceptance.bind_none_not_bound",
    "Antecedent.Acceptance.bind_bound_sound",
    "Antecedent.Acceptance.bind_complete",
    "Antecedent.Acceptance.bind_self_description_only_refuses",
    "Antecedent.Acceptance.bind_mismatch_never_bound",
]

[[records.checks]]
