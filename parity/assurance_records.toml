[[records]]
id = "acceptance.retained_artifact"
proposition = "Every artifact loader offers a form that admits bytes only as the artifact its consumer retained. The artifact slot binds exactly when the digest the consumer recomputes from the bytes it was handed equals the digest it retained, through bind; load_expecting runs the loader only after that binding, and every refusal it returns before the loader runs is external_binding_mismatch. Each loader's bound form is load_expecting around the loader, or calls bind_retained_artifact before it reads the bytes."
scope = "antecedent_io_core::retained_artifact::{bind_artifact_identity, load_expecting} for every input, with the artifact digest and facet digest replaced by arbitrary functions, and the 255 bound loader forms (*_expecting, *_retained) of antecedent-io-core, antecedent-io, antecedent-design and the facade io surface that the static loader check lists. The unbound loaders stay available: not deprecated in the kernel crates, deprecated on the facade (removed in 4.0) and warned about in Python; a caller that does not pass a retained identity is not bound. Loaders under crates/antecedent/src/analysis (compiled-family surfaces) are outside this record."
trusted = [
    "Kani 0.68.0 and CBMC 6.11.0 model the Rust semantics of bind_artifact_identity and load_expecting",
    "the Kani stubs of artifact_identity and facet_digest are arbitrary values, so no property of BLAKE3 is used",
    "BLAKE3-256 equality of the recomputed artifact digest is artifact equality (collision resistance), as for every other identity",
]
limitations = [
    "That every listed bound form is load_expecting around its loader, or binds before it reads, is checked structurally by scripts/check_retained_artifact_loaders.py, not machine-checked; six io-core loaders are also exercised against the real digest by the adversarial campaign (production_loaders_bind_the_retained_bytes) and every loader file carries a unit test of its bound forms.",
    "Loaders whose error type has no From<IoError> carry the binding refusal in their own refusal type (CohortRefusal, ExportRefusal, the cyclic and release-migration errors, String for provider envelopes); the refusal text names the retained artifact identity, the registered code differs by type.",
]

