proposition = "Combining revalidation classes is associative, commutative and idempotent, with still valid as identity and withdrawn absorbing. A recalculation stage is still valid only when reused; a change of an input never leaves its dependents still valid, and withdraws them exactly when the input is gone. In a composition graph a claim is still valid only when nothing stands against it: a provider trust standing that moved never leaves it still valid (restored trust asks for recomputation), and a withdrawn or undeclared trust withdraws it. A provider's trust holds exactly at a verified level. An evidence-ledger result keeps its class only when no source was lost, and a reclassification never returns a result to valid. The production rules compute exactly the specification's rules."
scope = "TrustStanding::of_provider, trust_move_is_numerical, trust_withdraws, revalidation_class, loss_class and status_step (antecedent-contract), translated by Charon and Aeneas. Revalidation::worst and ChangeKind::revalidation (antecedent-core) are checked by Kani over their whole finite domain: a second Aeneas translation of Revalidation beside the contract one would clash. StageStatus::revalidation is stated in the model (StageStatus.revalidation) and checked on generated workflows: its refusal payload holds an Arc, which Aeneas leaves opaque. How RecalcPlan::plan and revalidate choose the inputs of these rules (identities, dependency propagation) is not translated: their maps and graphs are outside the Aeneas subset and a Kani bound over BLAKE3 identities is not affordable, so the adversarial campaign exercises them on generated workflows and graphs (recalc.* and revalidation.* cases)."
trusted = [
    "the Lean 4 kernel",
    "Charon and Aeneas translate the Rust items faithfully",
    "the Aeneas model of the standard-library operations the items use: enum discriminant reads, usize comparison and boolean operations",
    "Kani 0.68.0 and CBMC 6.11.0 model the Rust semantics of Revalidation::worst and ChangeKind::revalidation",
    "revalidate passes trust_move_is_numerical, trust_withdraws and every other numerical reason and withdrawal to revalidation_class as claimClass states (reviewed, not machine-checked)",
]
limitations = [
    "That a still-valid stage's effective identity is unchanged, and that a recomputed one changed, is checked on generated workflows (recalc.reuse_only_without_a_change), not proved.",
]

operations = [
