# Identity dictionary. One row per IdentityDomain plus target_weights.
# docs/api_naming.md renders `naming_row`, `doc_rust`, and `doc_python`
# between the identity-dictionary markers (scripts/generate_dictionary_tables.py).
# `covers` restates the layer table of adr/0022-causal-compiler-contract.md
# in one line; keep them in step.

[[identity]]
domain = "target"
rust = "ContractIdentities.target"
contract_key = "identities.target"
python = "inspect().target_id"
availability = "prepared|loaded"
naming_row = "Target identity"
covers = "query, population, interventions, outcome functional, temporal policy, schema-name bindings"
doc_rust = "target digest on the inspect/contract"
doc_python = "`inspect().target_id`"

[[identity]]
domain = "identification"
rust = "ContractIdentities.identification"
contract_key = "identities.identification"
python = "inspect().identification_id"
availability = "prepared|loaded"
naming_row = "Identification premises identity"
covers = "population-free question, accepted structure (posterior atoms and weights, class prior, transport selection and full optional evidence catalog including regimes, measurements, assignments, projections, snapshot bindings and target sampling), observation contract, RD premises"
doc_rust = "identification digest over the population-free question, accepted structure (posterior atoms and weights), class prior, transport selection and the full optional evidence catalog (`source_experiments` only for legacy queries), and observation contract"
doc_python = "`inspect().identification_id`"

