limitations = "Evidence is four reject/accept decisions at alpha 0.05 (conditional and unconditional nonlinear dependence, conditional null, two-conditioner dependence) plus statistic ordering. The fixture records Tigramite 5.2.1.30 reference statistics, but the statistic band (atol 0.35 + rtol 1.0) covers the whole distance-correlation range for every dependent case, so the reference values do not constrain the statistic; this row is not external-oracle parity."
