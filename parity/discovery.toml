owner = "pag"
python_facade = "full"
notes = """
DiscoveredLink.conditioning_set: Vec<(String, u32)> in python/src/discovery_api.rs,
looked up from DiscoveryResult.sepsets (antecedent-discovery result::PcSepsets) by the
link's own (source, source_lag, target, target_lag) key. Field docstring documents the
algorithm-specific honesty split: PC/GES/FCI/RFCI/PCMCI+/J-PCMCI+ retention and
separating-set recording are mutually exclusive (a retained link's set is always
empty); plain PCMCI's PC1 phase decouples conditioning-set pruning from the final MCI
retention test, so a retained plain-PCMCI link can carry a non-empty set. Harness:
python/tests/test_discovery_provenance.py (gate_pag.sh runs it).
"""

