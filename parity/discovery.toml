description = "Conditioning-set size cap (max_cond_size) on the PCMCI family"
status = "done"
evidence_kind = "implementation_exists"
owner = "ci"
python_facade = "full"
notes = """
PCMCI/PCMCIPlus/LPCMCI/JPCMCIPlus/RPCMCI dataclasses (python/antecedent/discovery.py)
gained max_cond_size: int = 2, matching PC/GES/FCI/RFCI/LiNGAM/NOTEARS. Threaded through
DiscoverParams (crates/antecedent/src/discovery.rs) into the existing
DiscoveryConstraints::max_cond_size cap already enforced by PC1 / skeleton phases
(engine.rs::select_parents, pcmci_plus.rs::contemp_mci_phase, lpcmci_phases.rs) — pure
plumbing, no new algorithmic cap. discover_pcmci/discover_pcmci_plus/discover_lpcmci/
discover_jpcmci_plus/discover_rpcmci PyO3 signatures and the discovery_algorithm()
serialization helper carry it too. Harness: python/tests/test_discovery_provenance.py
(test_max_cond_size_honored_by_native_functions asserts the cap changes ci_tests, not
merely accepted; gate_estimate_ci.sh runs it).
"""

