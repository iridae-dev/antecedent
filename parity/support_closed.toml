[[closed]]
queries = ["Counterfactual"]
graph_classes = ["Admg", "TemporalAdmg", "Cpdag", "Pag"]
structures = ["explicit", "accepted"]
validations = ["none"]
executes_unlicensed = true
reason = "Latent confounding breaks unit-level noise abduction, so a Counterfactual on an Admg, a TemporalAdmg (read as its contemporaneous projection) or a Pag is stated as the population-level cross-world quantity E[Y_x | X = x'] - E[Y | X = x'] (x the active level, x' the control level: the mean effect, among the units observed at the control level, of moving them to the active level) and decided by ID* (Shpitser and Pearl) from the observational joint over at most six finite-discrete variables with at most four levels each. A query that is one hard intervention against a hard control of the same variable on one outcome is expressible; the result is the identified functional evaluated on the empirical cell table, or the typed ID* refusal carrying its hedge or conflicting-subscript witness (a refusal is not a proof of non-identifiability). A Pag is read through every maximal-ancestral-graph completion and every ADMG each completion stands for; candidates with distinct functionals leave the effect an identified set, and a refused candidate leaves the completion unidentified. Frequentist uncertainty is a row bootstrap (circular blocks on a TemporalAdmg) of the identified functional and Bayesian uncertainty a Dirichlet-weighted Bayesian-bootstrap posterior of it, both re-evaluated without re-identifying. A Counterfactual on a Cpdag assumes causal sufficiency, so the per-unit counterfactual route runs on every DAG completion of the equivalence class: completions that agree publish that value with its own uncertainty, completions that disagree publish the enumeration-weighted mean with the identified set. The result keeps support status refused: no evidence row or coverage record names the cell, and the estimand is not a per-unit counterfactual on the latent-confounded classes."

