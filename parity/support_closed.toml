reason = "An InterferenceQuery on an Admg, a TemporalAdmg read as its contemporaneous projection, a Cpdag or a Pag states the exposure contrast under that structure class. The contrast is identified by the known assignment mechanism and the exposure mapping on the fixed network (the assignment is independent of the potential outcomes by design, or by the supplied exposure probabilities and the declared network exchangeability), so no edge of the structure enters the identification: a latent confounder or an unresolved orientation in the structure cannot move it, and the structure binds only the unit schema (its width must equal the unit table's). The same procedures run as on a Dag: Young-bound Horvitz-Thompson/Hajek, cluster Neyman, exact two-stage saturation or supplied-propensity observational weighting with the sampling interval frequentist, and the conjugate Gaussian or cluster Dirichlet posterior Bayesian. The result keeps support status refused; no evidence row or coverage record names the cell."

