executes_unlicensed = true
reason = "A MediationEffect over a graph posterior decomposes the effect into its total, natural direct and natural indirect components on every atom with the executor the query has on a supplied structure of the atom's kind (the Dag cell's own estimator on a DAG, the path-specific identifier and finite-discrete plug-in on an ADMG or a TemporalAdmg atom's contemporaneous projection, the completion envelope on a CPDAG or a PAG), and mixes each component by posterior probability over the atoms that identify it. A component the identifier refuses on an atom (a recanting district for the pure natural indirect effect) is that component's unidentified mass only and is never imputed as total minus direct; a component no atom identifies is reported absent; the requested contrast must be identified by at least one atom. An atom the identifier refuses for the requested contrast is unidentified posterior mass and an atom whose plug-in cannot be evaluated is unevaluable mass, neither redistributed, and the status resolves to graph-dependent when either exceeds the tolerance. The uncertainty of a mixture: one contributing atom carries its own interval and posterior; several atoms are re-run on shared resampled tables and the standard error is the spread of the draw-wise posterior-weighted mixture (Frequentist), or their draws are pooled draw by draw because every atom runs in one context (Bayesian); an interval that cannot be formed is withheld with the reason stated (estimate.graph_posterior.cross_world_uncertainty). Cheap and full run each atom's own refuter suite against that atom's own estimate and mix the reports of each refuter by the posterior weight of the atoms that produced them; a mixed verdict passes only if every contributing atom passes, and a refuter that ran on only part of the contributing mass says so (refute.envelope.partial_coverage). The result keeps support status refused; no evidence row or coverage record names the cell."

[[closed]]
queries = ["ChangeAttribution"]
graph_classes = ["Admg", "TemporalAdmg", "Cpdag", "Pag", "TemporalCpdag", "TemporalPag"]
structures = ["explicit", "accepted"]
validations = ["cheap", "full"]
reason = "Cheap and full validation of a change attribution on a supplied or accepted Cpdag, Pag, Admg, TemporalAdmg, TemporalCpdag or TemporalPag is refused. The validation would refit the vector of total change and component contributions on random row subsets and on bootstrap resamples drawn within each of the two populations, and report one joint chi-square statistic against the original. The total change is a difference of two population means and the allocation a Shapley function of mechanism swaps, so a within-population subset or resample leaves the replicate mean at the original whatever heterogeneity is planted: the same derivation holds for every member of a class and every atom of a posterior, which are each attributed by the DAG or noise-block route whose replicates are such subsets and resamples. A verdict that cannot tell a sound attribution from an unsound one is not evidence, so the cell refuses instead of reporting one. Next attempt: a planted-violation design for the allocation (a mechanism that differs between the halves of one population), checked against an exact reference."

