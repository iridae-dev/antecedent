reason = "TransportQuery cheap and full run the transport-native suite and stay unlicensed: no evidence row or coverage record names the state. The supplied selection probabilities are tested against the observed trial count and the supplied treatment probabilities against the observed arm counts of the trial rows (Poisson-binomial z tests, with batch-means variance on one dependent series); the effective sample size of the selection-odds and arm weights is reported as a share of the trial rows; full adds a whole-procedure bootstrap of the transported contrast (rows, or circular blocks on one series) whose 95% percentile range must contain the published value. ATE-shaped contrast refuters do not apply. Requested explicitly, the state executes; the default suite still downgrades to the licensed validation none."

