graph_classes = ["Admg", "TemporalAdmg", "Cpdag", "Pag"]
structures = ["explicit", "accepted"]
validations = ["none"]
executes_unlicensed = true
reason = "A MediationEffect on a supplied Admg (or the contemporaneous projection of a TemporalAdmg), Cpdag or Pag is the decomposition into the total, natural direct and natural indirect effects, each identified by the path-specific identifier over the structure (the surgical total effect, the edge g-formula, or Shpitser's district formula; over a Cpdag in every DAG completion, over a Pag through every ADMG that shares the m-separation model of a MAG completion) and evaluated by the finite-discrete functional plug-in. The components are estimated on the same rows, so a frequentist bootstrap replicate or a Bayesian-bootstrap draw evaluates all of them at one resampled table: the result discloses estimate.mediation.joint with the means, standard deviations and correlations of the paired draws. The requested contrast must be identified; a component the identifier refuses (a recanting district for the pure natural indirect effect) is reported absent, never imputed as total minus direct. The natural indirect effect is the pure one, E[Y(a0, M(a1))] - E[Y(a0)]. The result keeps support status refused: no evidence row or coverage record names the cell, and cheap/full validation stays Dag-only."

