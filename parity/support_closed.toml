reason = "Anomaly and change attribution on a supplied Cpdag, Pag, Admg, TemporalAdmg, TemporalCpdag or TemporalPag execute through the compiler and stay unlicensed: no evidence row or coverage record names them. A structure that stands for several is attributed member by member: a Cpdag in every DAG of its Markov class and a TemporalCpdag in every temporal DAG of its class, each by the Dag route; a Pag in every MAG completion and a TemporalPag in every temporal MAG completion, each read as its most-confounded mixed graph (an invisible directed edge may also carry a latent common cause), by the Dag route when no latent confounding reaches the ancestors of the target and by the noise-block route otherwise. An Admg is attributed to the c-components (districts) of its ancestral sub-graph, which is the latent projection onto the ancestors; a TemporalAdmg is read as its contemporaneous projection on tabular data and, on a series, as the template unrolled over the window the longest lag spans, with the causes that precede the window latent common causes of their in-window effects. The noise-block route fits every mechanism by regression on its parents, which identifies it exactly when no other member of its district reaches it through directed edges that stay inside the district (Tian and Pearl 2002; Shpitser and Pearl 2006), takes the residual vector of each unit as its noise, and makes each district one player: the anomaly Shapley game sets the noise of a whole district to the reference or restores it together, and the change game swaps the mechanisms of a whole district and resamples its residual rows jointly from the source population, so the dependence a latent common cause puts between the noise terms of a district is kept. A mechanism that a hedge leaves unidentified is refused as not identified, citing the hedge and the two-SCM witness: two additive-noise SCMs on the graph that agree on the observed law and give the target different values at the reference noise, hence different attributions. Members that identify the same attribution keep it; members that disagree publish the enumeration-weighted mean of the contributions, their standard deviation across members as the graph sensitivity and their per-component range as an identified set, a refused member is unidentified mass and a member whose fit failed is unevaluable mass, and member weights are enumeration weights, not posterior probabilities. Frequentist intervals and the Bayesian Dirichlet (block, on a series) row-weight posterior are those of the Dag route, per member; the class publishes a posterior only when every member published the same draws (a quantity that does not depend on the structure, such as the mean anomaly score), keeps each member's posterior on its atom otherwise and states the envelope of their credible intervals as the interval of the identified set, never a mixture, because enumeration weights are not posterior mass. The result keeps support status refused."

