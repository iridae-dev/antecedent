reason = "Bayesian joint InterventionResponse on a CoDetermined tier closure runs response.bayesian over the closure's generalized adjustment set (the same tier identification the Frequentist cell.aipw cell uses) and stays unlicensed: no evidence row or coverage record names it. The outcome regression is additive in the treatments, so the published level is that model's joint level, not the saturated cell mean cell.aipw estimates."

