reason = "A TransportQuery on a Dag reads the Dag as the selection diagram of a model with no latent confounding: its ADMG embedding (every edge directed, no bidirected edge) with the declared selection nodes, identified by the same implemented sID subset (Direct, or an S-admissible standardization) and estimated by the same trial-to-target weighting of the supplied selection and treatment probabilities, with the delta-method (or Newey-West on one series) interval frequentist and the Dirichlet trial-row posterior Bayesian. Cheap and full run the transport-native suite (calibration of the supplied probabilities against the rows they describe, effective sample size of the weights, and under full a whole-procedure bootstrap range). The result keeps support status refused; no evidence row or coverage record names the cell. Recursive sID outside the implemented subset is NotCertified."

[[closed]]
