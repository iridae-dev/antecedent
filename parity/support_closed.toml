[[closed]]
queries = ["PulseEffect", "SustainedEffect", "TemporalConditionalPulse", "TemporalConditionalSustained"]
graph_classes = ["TemporalAdmg"]
structures = ["explicit", "accepted"]
validations = ["none"]
executes_unlicensed = true
reason = "A pulse, sustained or conditional contrast on one series under a TemporalAdmg is identified on the unrolled window of its template: the template is unrolled over the periods the policy needs (a cause that precedes the window is a latent common cause of its in-window effects), the complete ID algorithm identifies both sides of the contrast (IDC with the modifiers read at the first treated period for a conditional contrast), and the identified functional is evaluated by the discrete plug-in on the lag-aligned window table. Frequentist uncertainty resamples circular blocks of consecutive windows and Bayesian uncertainty shares one Dirichlet weight per block, never shorter than the window, because overlapping windows invalidate a row-level draw; the series is read as stationary over the template. The result keeps support status refused and discloses estimate.temporal_admg.window; no evidence row or coverage record names the cell. A window that holds a hedge is refused with the variables and periods that carry it, and a modifier a treated period can reach is refused. Discrete data only."

[[closed]]
queries = ["PulseEffect", "SustainedEffect", "TemporalConditionalPulse", "TemporalConditionalSustained"]
graph_classes = ["TemporalAdmg"]
reason = "The window contrast on a TemporalAdmg (the rule above) runs at validation none over one supplied or accepted graph. No native refuter suite exists for it, so cheap and full are refused, and a graph posterior over TemporalAdmg atoms has no window route. Next attempts: validation none, a supplied TemporalAdmg, or a TemporalDag when the lag structure has no latent confounding."

[[closed]]
queries = ["TemporalMediationEffect"]
