reason = "A path-restricted natural effect on a supplied Pag is read through the ADMGs that share the m-separation model of each of its MAG completions, because a MAG fixes the latent projection only up to that model and a path-specific effect is not a function of it (T -> M -> Y, T -> Y has the same MAG with and without M <-> Y, yet the effect along T -> M -> Y is identified in one and has a recanting district in the other). The path-specific identifier decides every such ADMG on its own graph; the effect is reported only when every one is identified, as one estimate when they yield the same functional or as the identified set over the distinct functionals, and a single refused candidate refuses the effect: no functional is then correct for every model the Pag represents. A path-restricted natural effect on a supplied Cpdag is identified by the path-specific identifier in every DAG completion of the equivalence class and estimated by the same functional plug-in per identified completion: completions that identify the same effect keep that estimate and its uncertainty, completions that disagree publish the enumeration-weighted mean with the identified set over them, and a completion with a recanting witness is unidentified mass. A path-restricted natural effect on a supplied Admg (or the contemporaneous projection of a TemporalAdmg) is identified by the path-specific identifier over the mixed graph: the surgical total effect when every directed path is selected, the edge g-formula when the outcome's ancestors carry no latent confounding, and Shpitser's district formula (each district of the outcome's ancestors read at the treatment level of the edges that enter it, kernels from the complete ID algorithm) otherwise. A recanting district or a district kernel with a hedge is refused as not identified. The identified functional is evaluated by the finite-discrete functional plug-in (bootstrap interval) or its Bayesian-bootstrap posterior. The result keeps support status refused: no evidence row or coverage record names the cell, and cheap/full validation stays Dag-only."

