# Reason table for refused cells. Refusal is the default: any cell that is
# not licensed and not n/a is `SupportRefusal::Refused` whether or not a
# rule here matches. This file does not cause refusal; it names it.
# A cell matching every listed constraint reports that rule's `reason`.
# Must not overlap licensed cells or n/a predicates (the gate fails on overlap).

[[closed]]
queries = ["Counterfactual"]
graph_classes = ["Dag", "Admg", "Cpdag", "Pag"]
reason = "Counterfactual is not on the staged handle."

[[closed]]
queries = [
  "AverageDerivative",
  "DirectionalDerivative",
  "Elasticity",
  "PointDerivative",
  "ResponseJacobian",
  "SemiElasticity",
]
graph_classes = ["Dag", "Admg", "Cpdag", "Pag"]
reason = "Derivative cells are not licensed; only ResponseCurve (static Dag or temporal TemporalDag) is staged."

[[closed]]
queries = ["ResponseCurve"]
graph_classes = ["Pag", "Cpdag", "Admg"]
reason = "ResponseCurve is licensed only on a static Dag or a temporal TemporalDag attachment."

[[closed]]
queries = ["PathSpecificEffect", "InterventionalDistribution"]
graph_classes = ["Dag", "Admg", "Cpdag", "Pag"]
structures = ["graph_posterior", "accepted"]
reason = "Path and distribution queries are licensed only as explicit Dag cells; accepted and graph-posterior structures are not staged."

[[closed]]
queries = ["MediationEffect"]
graph_classes = ["Dag", "Admg", "Cpdag", "Pag"]
reason = "MediationEffect is not on the staged handle."

[[closed]]
queries = ["TransportQuery", "InterferenceQuery"]
graph_classes = ["Dag", "Admg", "Cpdag", "Pag"]
reason = "Stage transport and interference APIs are not licensed analyze cells; sID outside the implemented subset is NotCertified."

[[closed]]
queries = ["ConditionalEffect"]
graph_classes = ["Cpdag", "Admg", "Pag"]
reason = "ConditionalEffect compiles only against a supplied static Dag; Cpdag/Admg/Pag have no ConditionalEffect compile arm."

[[closed]]
queries = ["PathSpecificEffect"]
graph_classes = ["Admg", "Pag"]
structures = ["explicit"]
reason = "Path and distribution queries execute only on a supplied static Dag; a directly supplied Admg/Pag hits the same static-Dag requirement (accepted/graph-posterior Admg and Pag are already refused above)."

[[closed]]
queries = ["InterventionalDistribution"]
graph_classes = ["Admg", "Pag"]
structures = ["explicit"]
reason = "Path and distribution queries execute only on a supplied static Dag; a directly supplied Admg/Pag hits the same static-Dag requirement (accepted/graph-posterior Admg and Pag are already refused above)."

[[closed]]
queries = ["InterventionResponse"]
graph_classes = ["Cpdag", "Admg", "Pag"]
reason = "InterventionResponse executes only on a supplied static Dag, the same requirement that refuses ResponseCurve above; Cpdag/Admg/Pag have no Response compile arm."

[[closed]]
queries = ["TemporalMediationEffect"]
graph_classes = ["TemporalCpdag", "TemporalPag"]
reason = "TemporalMediationEffect compiles only against a supplied TemporalDag; compile.rs has no Mediation arm for TemporalCpdag/TemporalPag."

[[closed]]
queries = [
  "AverageDerivative",
  "AverageEffect",
  "ConditionalEffect",
  "Counterfactual",
  "DirectionalDerivative",
  "Elasticity",
  "InterventionalDistribution",
  "InterventionResponse",
  "MediationEffect",
  "PathSpecificEffect",
  "PointDerivative",
  "ResponseCurve",
  "ResponseJacobian",
  "SemiElasticity",
  "TransportQuery",
  "InterferenceQuery",
]
graph_classes = ["Dag", "Admg", "Cpdag", "Pag"]
structures = ["graph_posterior"]
inferences = ["Frequentist"]
reason = "Graph-posterior compilation requires Bayesian inference: the combiner this library ships (`execute_graph_posterior_bayesian` / `execute_dbn_posterior_bayesian`) mixes per-atom posterior draws into an envelope. Frequentist model-averaging exists in the literature; this library does not implement a Frequentist combiner."

[[closed]]
queries = [
  "PulseEffect",
  "SustainedEffect",
  "TemporalMediationEffect",
  "ResponseCurve",
  "InterventionResponse",
]
graph_classes = ["TemporalDag", "TemporalCpdag", "TemporalPag"]
structures = ["graph_posterior"]
inferences = ["Frequentist"]
reason = "Graph-posterior compilation requires Bayesian inference: the combiner this library ships (`execute_graph_posterior_bayesian` / `execute_dbn_posterior_bayesian`) mixes per-atom posterior draws into an envelope. Frequentist model-averaging exists in the literature; this library does not implement a Frequentist combiner."

# -- 2026-08-19 audit. The following reasons cover cells probed end-to-end
# (Study::build/run) and confirmed either to refuse at compile (an
# identifier/estimator pair the strategy table rejects) or to silently ignore
# the claimed inference mode. Former running exceptions were fully disposed in
# 0.9; parity/support_allowlist.toml is now required to remain empty.

[[closed]]
queries = ["AverageEffect"]
graph_classes = ["Admg"]
structures = ["explicit", "accepted"]
inferences = ["Bayesian"]
reason = "General ID (identifier general.id, the only identifier compile.rs wires for a bidirected ADMG) is not compatible with estimator bayesian.gcomp; forcing Bayesian inference on a bidirected ADMG refuses at compile before any estimate is produced, confirmed on an identifiable front-door-shaped ADMG fixture (Study::build/run)."

[[closed]]
queries = ["ConditionalEffect"]
graph_classes = ["Dag"]
structures = ["explicit", "accepted"]
inferences = ["Bayesian"]
reason = "execute_conditional (analysis/execute/static_path.rs) hardcodes EstimatorId::ConditionalLinearAdjustment regardless of inference mode; a Bayesian-labeled study silently returns the identical Frequentist estimate (confirmed: Frequentist and Bayesian runs on the same fixture produce a bit-identical ate and estimand.method), so this cell cannot return an honest Bayesian number."

[[closed]]
queries = ["ConditionalEffect"]
graph_classes = ["Dag"]
structures = ["graph_posterior"]
inferences = ["Bayesian"]
reason = "compile_graph_posterior (analysis/execute/bayesian_path.rs) wires only AverageEffect and TemporalEffect queries against a graph posterior; ConditionalEffect hits its wildcard Unsupported arm, confirmed via Study::build/run."

[[closed]]
queries = ["InterventionalDistribution"]
graph_classes = ["Dag"]
structures = ["explicit"]
inferences = ["Bayesian"]
reason = "Distribution requires identifier general.id (or auto) paired with estimator functional.distribution; forcing Bayesian inference selects estimator bayesian.gcomp, an incompatible pair refused at compile before any estimate, confirmed via Study::build/run."

[[closed]]
queries = ["InterventionResponse"]
graph_classes = ["Dag"]
structures = ["explicit", "accepted"]
inferences = ["Bayesian"]
reason = "Response requires identifier response.backdoor paired with a response.* estimator; forcing Bayesian inference selects estimator bayesian.gcomp, an incompatible pair refused at compile before any estimate, confirmed via Study::build/run."

[[closed]]
queries = ["PathSpecificEffect"]
graph_classes = ["Dag"]
structures = ["explicit"]
inferences = ["Bayesian"]
reason = "PathSpecific requires identifier path_specific.natural (or auto) paired with estimator functional.effect; forcing Bayesian inference selects estimator bayesian.gcomp, an incompatible pair refused at compile before any estimate, confirmed via Study::build/run."

[[closed]]
queries = ["ResponseCurve"]
graph_classes = ["Dag"]
structures = ["explicit", "accepted"]
inferences = ["Bayesian"]
reason = "Response requires identifier response.backdoor paired with a response.* estimator; forcing Bayesian inference selects estimator bayesian.gcomp, an incompatible pair refused at compile before any estimate, confirmed via Study::build/run."

[[closed]]
queries = ["ResponseCurve", "InterventionResponse"]
graph_classes = ["TemporalDag"]
structures = ["explicit", "accepted"]
inferences = ["Bayesian"]
reason = "Bayesian temporal response is not licensed; execute_temporal_response refuses Bayesian inference before estimation."

[[closed]]
queries = ["TemporalMediationEffect"]
graph_classes = ["TemporalDag"]
structures = ["explicit", "accepted"]
inferences = ["Bayesian"]
reason = "execute_temporal_mediation (analysis/execute/temporal_path.rs) hardcodes EstimatorId::TemporalMediation regardless of inference mode; a Bayesian-labeled study silently returns the identical Frequentist estimate (confirmed: Frequentist and Bayesian runs on the same fixture produce a bit-identical mediation estimate and estimand.method), so this cell cannot return an honest Bayesian number."

[[closed]]
queries = ["TemporalMediationEffect"]
graph_classes = ["TemporalDag"]
structures = ["graph_posterior"]
inferences = ["Bayesian"]
reason = "compile_graph_posterior wires only AverageEffect and TemporalEffect queries against a graph posterior; TemporalMediationEffect (query axis Mediation on a TemporalDag) hits its wildcard Unsupported arm, confirmed via Study::build/run."

# -- 0.9.0: n/a re-file (contract / identifier gap, not typed impossibility).

[[closed]]
queries = ["ResponseCurve", "InterventionResponse"]
structures = ["graph_posterior"]
reason = "Graph-posterior response is a contract choice, not typed impossibility: the ATE envelope (retained unidentified mass) is the same object a curve arm would use. This cut does not license a response mixture."

[[closed]]
queries = ["ResponseCurve", "InterventionResponse"]
graph_classes = ["TemporalCpdag", "TemporalPag"]
reason = "ResponseCurve/InterventionResponse have no class-aware identifier on TemporalCpdag/TemporalPag; the same gap on static Cpdag/Admg/Pag is already refused."

# -- 0.9.0: named reasons for refused families that previously had no reason row.

[[closed]]
queries = ["PathSpecificEffect", "InterventionalDistribution"]
graph_classes = ["Cpdag"]
structures = ["explicit"]
reason = "Path and distribution queries execute only on a supplied static Dag; a directly supplied Cpdag hits the same static-Dag requirement (Admg/Pag explicit already named above)."

[[closed]]
queries = ["AverageEffect"]
graph_classes = ["Cpdag"]
structures = ["explicit", "accepted"]
reason = "AverageEffect has no compile arm on a Cpdag; Pag/Admg Frequentist ATE is a different identifier family."

[[closed]]
queries = ["AverageEffect"]
graph_classes = ["Admg", "Cpdag", "Pag"]
structures = ["graph_posterior"]
inferences = ["Bayesian"]
reason = "execute_graph_posterior_bayesian is Dag-shaped; Admg/Cpdag/Pag posterior atoms are not mixed into an ATE envelope."

[[closed]]
queries = ["PulseEffect", "SustainedEffect"]
graph_classes = ["TemporalCpdag", "TemporalPag"]
structures = ["explicit", "accepted"]
reason = "TemporalCpdag/TemporalPag reach a Pulse/Sustained estimate only after try_into_temporal_dag succeeds (then the cell collapses to TemporalDag). Explicit incomplete graphs and accepted graphs that fail completion are not a licensed temporal contrast; failure is completion, not a TemporalDag estimate."

[[closed]]
queries = ["PulseEffect", "SustainedEffect"]
graph_classes = ["TemporalCpdag", "TemporalPag"]
structures = ["graph_posterior"]
inferences = ["Bayesian"]
reason = "execute_dbn_posterior_bayesian is TemporalDag-shaped; TemporalCpdag/TemporalPag posterior atoms are not mixed into a temporal envelope."

[[closed]]
queries = ["PathSpecificEffect", "InterventionalDistribution"]
graph_classes = ["Dag", "Cpdag", "Admg", "Pag"]
validations = ["cheap", "full"]
reason = "execute_path_specific and execute_distribution return empty refutations; cheap and full do not run a path-specific or distribution refuter suite."

[[closed]]
queries = ["TemporalMediationEffect"]
graph_classes = ["TemporalDag"]
structures = ["explicit", "accepted"]
inferences = ["Frequentist"]
validations = ["cheap", "full"]
reason = "execute_temporal_mediation hardcodes empty refutations; cheap and full do not run a mediation refuter suite."

[[closed]]
queries = ["PulseEffect", "SustainedEffect"]
graph_classes = ["TemporalDag"]
structures = ["graph_posterior"]
inferences = ["Bayesian"]
validations = ["cheap", "full"]
reason = "execute_dbn_posterior_bayesian always returns empty refutations; cheap and full do not run the ATE refuter suite on the DBN envelope."
