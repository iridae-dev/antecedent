reason = "A natural direct effect over a graph posterior of Dag atoms is refused under full validation. The full suite runs the Dag-native refuters on every atom, which need linear-Gaussian mechanism families a discrete atom table does not have, so every atom fails and the failure would read as non-identification. Next attempt: answer the full suite of a Dag atom through the functional refuter state, as the ADMG atoms are, then earn it with the atom-mixture fixture."
