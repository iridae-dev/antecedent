# Reason table for refused cells. Refusal is the default: any cell that is
# not licensed and not n/a is `SupportRefusal::Refused` whether or not a
# rule here matches. This file does not cause refusal; it names it.
# A cell matching every listed constraint reports that rule's `reason`.
# Must not overlap licensed cells or n/a predicates (the gate fails on overlap).

[[closed]]
queries = ["Counterfactual"]
graph_classes = ["Admg", "Cpdag", "Pag"]
reason = "Counterfactual requires a supplied static Dag."

[[closed]]
queries = [
  "AverageDerivative",
  "DirectionalDerivative",
  "Elasticity",
  "PointDerivative",
  "ResponseJacobian",
  "SemiElasticity",
]
graph_classes = ["Admg", "Cpdag", "Pag"]
reason = "Derivatives require a supplied static Dag."


[[closed]]
queries = ["ResponseCurve", "InterventionResponse"]
graph_classes = ["Admg"]
reason = "Admg response has no functional plug-in; licensed general-ID ATE does not estimate a curve."

[[closed]]
queries = ["PathSpecificEffect", "InterventionalDistribution"]
graph_classes = ["Dag", "Admg", "Cpdag", "Pag"]
structures = ["graph_posterior"]
reason = "Graph-posterior path and distribution mixtures are not staged."

[[closed]]
queries = ["PathSpecificEffect", "InterventionalDistribution"]
graph_classes = ["Admg", "Cpdag", "Pag"]
structures = ["accepted"]
reason = "Accepted path and distribution queries require a Dag."

[[closed]]
queries = ["MediationEffect"]
graph_classes = ["Admg", "Cpdag", "Pag"]
reason = "MediationEffect requires a supplied static Dag."

[[closed]]
queries = ["TransportQuery", "InterferenceQuery"]
graph_classes = ["Dag", "Admg", "Cpdag", "Pag"]
reason = "Stage transport and interference APIs are not licensed analyze cells; sID outside the implemented subset is NotCertified."

[[closed]]
queries = ["ConditionalEffect"]
graph_classes = ["Admg"]
reason = "ConditionalEffect on Admg has no compile arm; Dag, Cpdag, and Pag are licensed."

[[closed]]
queries = ["PathSpecificEffect"]
graph_classes = ["Admg", "Pag"]
structures = ["explicit"]
reason = "Path and distribution queries execute only on a supplied static Dag; a directly supplied Admg/Pag hits the same static-Dag requirement (accepted/graph-posterior Admg and Pag are already refused above)."

[[closed]]
queries = ["InterventionalDistribution"]
graph_classes = ["Admg", "Pag"]
structures = ["explicit"]
reason = "Path and distribution queries execute only on a supplied static Dag; a directly supplied Admg/Pag hits the same static-Dag requirement (accepted/graph-posterior Admg and Pag are already refused above)."

[[closed]]
queries = ["TemporalMediationEffect"]
graph_classes = ["TemporalPag"]
reason = "Latent-confounded TemporalPag natural mediation is outside the existing cross-world identification theory; DAG-completion engineering cannot license it."

[[closed]]
queries = ["TemporalMediationEffect"]
graph_classes = ["TemporalCpdag"]
inferences = ["Bayesian"]
reason = "TemporalCpdag mediation currently exposes a completion identified set; a Bayesian result needs prior probabilities over class members rather than completion-enumeration weights."

[[closed]]
queries = [
  "AverageDerivative",
  "ConditionalEffect",
  "Counterfactual",
  "DirectionalDerivative",
  "Elasticity",
  "InterventionalDistribution",
  "MediationEffect",
  "PathSpecificEffect",
  "PointDerivative",
  "ResponseJacobian",
  "SemiElasticity",
  "TransportQuery",
  "InterferenceQuery",
]
graph_classes = ["Dag", "Admg", "Cpdag", "Pag"]
structures = ["graph_posterior"]
inferences = ["Frequentist"]
reason = "Frequentist graph-posterior mixing on DAG atoms is licensed for AverageEffect and static ResponseCurve/one-coordinate InterventionResponse. The listed static families remain unsupported."

[[closed]]
queries = ["AverageEffect"]
graph_classes = ["Admg", "Cpdag", "Pag"]
structures = ["graph_posterior"]
inferences = ["Frequentist"]
reason = "Frequentist graph-posterior mixing is licensed only for DAG atoms. ADMG/CPDAG/PAG posterior atoms remain refused."

[[closed]]
queries = [
  "TemporalMediationEffect",
  "ResponseCurve",
  "InterventionResponse",
]
graph_classes = ["TemporalDag", "TemporalCpdag", "TemporalPag"]
structures = ["graph_posterior"]
inferences = ["Frequentist"]
reason = "Frequentist DBN-posterior Pulse/Sustained effects are licensed with shared outer block replicates. Temporal mediation and response mixtures require their query-specific composite result evaluators."

# -- 2026-08-19 audit. The following reasons cover cells probed end-to-end
# (Study::build/run) and confirmed either to refuse at compile (an
# identifier/estimator pair the strategy table rejects) or to silently ignore
# the claimed inference mode. Former running exceptions were fully disposed in
# 0.9; parity/support_allowlist.toml is now required to remain empty.

[[closed]]
queries = ["AverageEffect"]
graph_classes = ["Admg"]
structures = ["explicit", "accepted"]
inferences = ["Bayesian"]
reason = "General ID (identifier general.id, the only identifier compile.rs wires for a bidirected ADMG) is not compatible with estimator bayesian.gcomp; forcing Bayesian inference on a bidirected ADMG refuses at compile before any estimate is produced, confirmed on an identifiable front-door-shaped ADMG fixture (Study::build/run)."

[[closed]]
queries = ["ConditionalEffect"]
graph_classes = ["Dag", "Cpdag", "Pag"]
structures = ["graph_posterior"]
inferences = ["Bayesian"]
reason = "compile_graph_posterior (analysis/execute/bayesian_path.rs) wires only AverageEffect and TemporalEffect queries against a graph posterior; ConditionalEffect hits its wildcard Unsupported arm, confirmed via Study::build/run."

[[closed]]
queries = ["InterventionalDistribution"]
graph_classes = ["Dag"]
structures = ["explicit"]
inferences = ["Bayesian"]
reason = "Distribution requires identifier general.id (or auto) paired with estimator functional.distribution; forcing Bayesian inference selects estimator bayesian.gcomp, an incompatible pair refused at compile before any estimate, confirmed via Study::build/run."

[[closed]]
queries = ["PathSpecificEffect"]
graph_classes = ["Dag"]
structures = ["explicit"]
inferences = ["Bayesian"]
reason = "PathSpecific requires identifier path_specific.natural (or auto) paired with estimator functional.effect; forcing Bayesian inference selects estimator bayesian.gcomp, an incompatible pair refused at compile before any estimate, confirmed via Study::build/run."

# -- 0.9.0: n/a re-file (contract / identifier gap, not typed impossibility).

