reason = "A TransportQuery reads a selection diagram, which is an ADMG (a Dag is its confounder-free case). A Cpdag or Pag stands for several diagrams that can disagree on the transport formula, so it names no single diagram; the supplied-structure facade reports the per-member structural envelope. Next attempt: the Dag, Admg or TemporalAdmg the structure resolves to, or discovered_transport for the envelope. Recursive sID outside the implemented subset is NotCertified."

