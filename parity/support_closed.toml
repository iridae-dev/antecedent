# Reason table for refused cells. Refusal is the default: any cell that is
# not licensed and not n/a is `SupportRefusal::Refused` whether or not a
# rule here matches. This file does not cause refusal; it names it.
# A cell matching every listed constraint reports that rule's `reason`.
# Must not overlap licensed cells or n/a predicates (the gate fails on overlap).

[[closed]]
queries = ["Counterfactual"]
graph_classes = ["Admg", "Cpdag", "Pag"]
reason = "Counterfactual requires a supplied static Dag."

[[closed]]
queries = [
  "AverageDerivative",
  "DirectionalDerivative",
  "Elasticity",
  "PointDerivative",
  "ResponseJacobian",
  "SemiElasticity",
]
graph_classes = ["Admg", "Cpdag", "Pag"]
reason = "Derivatives require a supplied static Dag."


[[closed]]
queries = ["ResponseCurve", "InterventionResponse"]
graph_classes = ["Admg"]
reason = "Admg response has no functional plug-in; licensed general-ID ATE does not estimate a curve."

[[closed]]
queries = ["PathSpecificEffect", "InterventionalDistribution"]
graph_classes = ["Dag", "Admg", "Cpdag", "Pag"]
structures = ["graph_posterior"]
reason = "Graph-posterior path and distribution mixtures are not staged."

[[closed]]
queries = ["PathSpecificEffect"]
graph_classes = ["Admg", "Cpdag", "Pag"]
structures = ["accepted"]
reason = "Accepted path queries require a Dag."

[[closed]]
queries = ["InterventionalDistribution"]
graph_classes = ["Cpdag", "Pag"]
structures = ["accepted"]
reason = "Accepted InterventionalDistribution is licensed on Dag and Admg; Cpdag/Pag remain refused."

[[closed]]
queries = ["MediationEffect"]
graph_classes = ["Admg", "Cpdag", "Pag"]
reason = "MediationEffect requires a supplied static Dag."

[[closed]]
queries = ["TransportQuery", "InterferenceQuery"]
graph_classes = ["Dag", "Admg", "Cpdag", "Pag"]
reason = "Stage transport and interference APIs are not licensed analyze cells; sID outside the implemented subset is NotCertified."

[[closed]]
queries = ["ConditionalEffect"]
graph_classes = ["Admg"]
reason = "ConditionalEffect on Admg has no compile arm; Dag, Cpdag, and Pag are licensed."

[[closed]]
queries = ["PathSpecificEffect"]
graph_classes = ["Admg", "Pag"]
structures = ["explicit"]
reason = "Path-specific queries execute only on a supplied static Dag; a directly supplied Admg/Pag hits the same static-Dag requirement (accepted/graph-posterior Admg and Pag are already refused above)."

[[closed]]
queries = ["InterventionalDistribution"]
graph_classes = ["Pag"]
structures = ["explicit"]
reason = "Path and distribution queries execute only on a supplied static Dag or Admg; a directly supplied Pag hits the static-Dag/Admg requirement."

[[closed]]
queries = ["InterventionalDistribution"]
graph_classes = ["Admg"]
structures = ["explicit"]
validations = ["cheap", "full"]
reason = "ADMG InterventionalDistribution is licensed at validation none; cheap/full remain Dag-only."

[[closed]]
queries = ["TemporalMediationEffect"]
graph_classes = ["TemporalPag"]
reason = "Latent-confounded TemporalPag natural mediation is outside the existing cross-world identification theory; DAG-completion engineering cannot license it."

[[closed]]
queries = ["TemporalMediationEffect"]
graph_classes = ["TemporalCpdag"]
structures = ["graph_posterior"]
inferences = ["Bayesian"]
reason = "execute_dbn_posterior_bayesian is TemporalDag-shaped; TemporalCpdag posterior atoms are not mixed into a mediation envelope."

[[closed]]
queries = [
  "AverageDerivative",
  "Counterfactual",
  "DirectionalDerivative",
  "Elasticity",
  "InterventionalDistribution",
  "MediationEffect",
  "PathSpecificEffect",
  "PointDerivative",
  "ResponseJacobian",
  "SemiElasticity",
  "TransportQuery",
  "InterferenceQuery",
]
graph_classes = ["Dag", "Admg", "Cpdag", "Pag"]
structures = ["graph_posterior"]
inferences = ["Frequentist"]
reason = "Frequentist graph-posterior mixing on DAG atoms is licensed for AverageEffect, ConditionalEffect, and static ResponseCurve/one-coordinate InterventionResponse. The listed static families remain unsupported."

[[closed]]
queries = ["AverageEffect"]
graph_classes = ["Admg", "Cpdag", "Pag"]
structures = ["graph_posterior"]
inferences = ["Frequentist"]
reason = "Frequentist graph-posterior mixing is licensed only for DAG atoms. ADMG/CPDAG/PAG posterior atoms remain refused."

[[closed]]
queries = ["ResponseCurve", "InterventionResponse"]
graph_classes = ["TemporalDag", "TemporalCpdag", "TemporalPag"]
structures = ["graph_posterior"]
inferences = ["Frequentist"]
reason = "Frequentist DBN-posterior Pulse/Sustained effects and single-horizon TemporalMediationEffect are licensed. Temporal response mixtures still require their query-specific composite evaluators."

[[closed]]
queries = ["TemporalMediationEffect"]
graph_classes = ["TemporalCpdag", "TemporalPag"]
structures = ["graph_posterior"]
inferences = ["Frequentist"]
reason = "Frequentist DBN-posterior mediation is licensed for TemporalDag atoms. TemporalCpdag/TemporalPag posterior atoms need a class-aware combiner that retains unidentified class mass."

[[closed]]
queries = ["TemporalMediationEffect"]
graph_classes = ["TemporalDag"]
structures = ["graph_posterior"]
inferences = ["Frequentist"]
validations = ["cheap", "full"]
reason = "Frequentist DBN-posterior TemporalMediationEffect is licensed at validation none. Mediation refuters are not run per atom against that atom's own contrast and mixed by graph weight on this path (the Bayesian DBN mediation cells do this), so cheap/full stay refused."

# -- 2026-08-19 audit. The following reasons cover cells probed end-to-end
# (Study::build/run) and confirmed either to refuse at compile (an
# identifier/estimator pair the strategy table rejects) or to silently ignore
# the claimed inference mode. Former running exceptions were fully disposed in
# 0.9; parity/support_allowlist.toml is now required to remain empty.

[[closed]]
queries = ["ConditionalEffect"]
graph_classes = ["Cpdag", "Pag"]
structures = ["graph_posterior"]
inferences = ["Bayesian"]
reason = "ConditionalEffect graph-posterior mixing is licensed only for DAG atoms. Cpdag/Pag posterior atoms remain refused."

# -- 0.9.0: n/a re-file (contract / identifier gap, not typed impossibility).

[[closed]]
queries = ["ResponseCurve", "InterventionResponse"]
graph_classes = ["Admg", "Cpdag", "Pag", "TemporalDag", "TemporalCpdag", "TemporalPag"]
structures = ["graph_posterior"]
reason = "Graph-posterior response currently executes only static DAG atoms; ADMG/CPDAG/PAG and temporal posterior atoms require their class-specific evaluators."

