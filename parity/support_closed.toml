reason = "An interventional distribution on a supplied Cpdag is decided by the complete ID algorithm (IDC when the query conditions) in every DAG completion of the equivalence class, and on a supplied Pag in every ADMG that shares the m-separation model of a MAG completion, because a MAG fixes the latent projection only up to that model. Every identified member is estimated by the finite-discrete plug-in (bootstrap) or its Dirichlet row posterior. Members that identify the same distribution keep that estimate and its uncertainty; members that disagree leave it partially identified, and the result publishes the enumeration-weighted mean atoms with the lowest and highest probability of each atom over the members (estimate.distribution.class_envelope), never a probability over members. A Cpdag member the algorithm refuses is unidentified mass; one refused ADMG candidate refuses the distribution over a Pag, since no functional is then correct for every model the Pag represents. The result keeps support status refused: no evidence row or coverage record names the cell, and cheap/full validation stays Dag-only."

[[closed]]
queries = ["MediationEffect"]
graph_classes = ["Admg", "TemporalAdmg", "Cpdag", "Pag"]
structures = ["explicit", "accepted"]
executes_unlicensed = true
reason = "A MediationEffect on a supplied Admg (or the contemporaneous projection of a TemporalAdmg), Cpdag or Pag is the decomposition into the total, natural direct and natural indirect effects, each identified by the path-specific identifier over the structure (the surgical total effect, the edge g-formula, or Shpitser's district formula; over a Cpdag in every DAG completion, over a Pag through every ADMG that shares the m-separation model of a MAG completion) and evaluated by the finite-discrete functional plug-in. The components are estimated on the same rows, so a frequentist bootstrap replicate or a Bayesian-bootstrap draw evaluates all of them at one resampled table: the result discloses estimate.mediation.joint with the means, standard deviations and correlations of the paired draws. The requested contrast must be identified; a component the identifier refuses (a recanting district for the pure natural indirect effect) is reported absent, never imputed as total minus direct. The natural indirect effect is the pure one, E[Y(a0, M(a1))] - E[Y(a0)]. Cheap and full run the mediation-native suite on the decomposition and stay unlicensed: the sensitivity of the indirect effect to a violation of sequential ignorability (the mediator-outcome error correlation at which it vanishes, read from the linear working model of the treatment, the mediator index and the outcome with the variables the total-effect functional adjusts for), a mediator placebo (the mediator columns permuted together keep their support and lose every link to the treatment and the outcome: the indirect effect must vanish and the direct and total effects must equal the total effect of the unpermuted table), and the stability of the total, direct and indirect effects jointly on the same random subsets of the rows (contiguous stretches of windows on a window table); full adds 50% subsets and a joint bootstrap range under the study's own resampling. Over a Cpdag or a Pag the suite runs on every distinct identified member (distinct by the value of the requested contrast), each on its own proofs of the three components. The result keeps support status refused: no evidence row or coverage record names the cell, and the verdicts are checks, not a calibration claim."

[[closed]]
queries = ["MediationEffect"]
graph_classes = ["Dag", "Admg", "TemporalAdmg", "Cpdag", "Pag"]
structures = ["graph_posterior"]
executes_unlicensed = true
reason = "A MediationEffect over a graph posterior decomposes the effect into its total, natural direct and natural indirect components on every atom with the executor the query has on a supplied structure of the atom's kind (the Dag cell's own estimator on a DAG, the path-specific identifier and finite-discrete plug-in on an ADMG or a TemporalAdmg atom's contemporaneous projection, the completion envelope on a CPDAG or a PAG), and mixes each component by posterior probability over the atoms that identify it. A component the identifier refuses on an atom (a recanting district for the pure natural indirect effect) is that component's unidentified mass only and is never imputed as total minus direct; a component no atom identifies is reported absent; the requested contrast must be identified by at least one atom. An atom the identifier refuses for the requested contrast is unidentified posterior mass and an atom whose plug-in cannot be evaluated is unevaluable mass, neither redistributed, and the status resolves to graph-dependent when either exceeds the tolerance. The uncertainty of a mixture: one contributing atom carries its own interval and posterior; several atoms are re-run on shared resampled tables and the standard error is the spread of the draw-wise posterior-weighted mixture (Frequentist), or their draws are pooled draw by draw because every atom runs in one context (Bayesian); an interval that cannot be formed is withheld with the reason stated (estimate.graph_posterior.cross_world_uncertainty). Cheap and full run each atom's own refuter suite against that atom's own estimate and mix the reports of each refuter by the posterior weight of the atoms that produced them; a mixed verdict passes only if every contributing atom passes, and a refuter that ran on only part of the contributing mass says so (refute.envelope.partial_coverage). The result keeps support status refused; no evidence row or coverage record names the cell."

