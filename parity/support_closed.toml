reason = "A temporal mediation contrast on TemporalAdmg is a cross-world contrast: the window-unrolled identification covers interventional contrasts only, and the recanting-district criterion for path-specific effects has not been derived on the unrolled window. Next attempts: TemporalMediationEffect on a TemporalDag or TemporalCpdag, or the pulse or sustained contrast on the TemporalAdmg, which executes unlicensed."

