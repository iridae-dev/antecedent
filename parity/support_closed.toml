reason = "A TransportQuery reads a selection diagram, which is an ADMG. A Cpdag or Pag stands for several diagrams that can disagree on the transport formula, so sID decides every member on its own selection diagram with the declared selection targets: each DAG completion of a Cpdag (read as the ADMG with no bidirected edge), and every ADMG that shares the m-separation model of each MAG completion of a Pag. Members that certify the same formula identify the transported quantity by it; members that certify different formulas leave it partially identified, one case per distinct formula; a member sID does not certify, and a Pag completion any of whose ADMG candidates sID does not certify, is unidentified mass, never read as an identified formula. Every certified case is estimated by the trial-to-target weighting of the supplied selection and treatment probabilities, which reads a formula only through its certificate, so the identified set over the evaluated cases is the one transported contrast; a certified recursive factorization the weighting cannot evaluate is unevaluable mass. Completion weights are enumeration weights, not posterior probabilities. The result keeps support status refused; no evidence row or coverage record names the cell. Recursive sID outside the implemented subset is NotCertified."

