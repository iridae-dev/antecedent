reason = "Derivatives, elasticities, directional derivatives and Jacobians on a supplied Cpdag, Pag, Admg or TemporalAdmg (read as its contemporaneous ADMG projection) execute through the compiler and stay unlicensed: no evidence row or coverage record names them. Each identified completion of a Cpdag or Pag (every DAG of the Markov class, every MAG completion of a PAG read as its most-confounded ADMG) is identified by one adjustment set valid for every treatment/outcome pair the functional names, and the continuous response estimator the functional selects (local-polynomial point derivative, Riesz average derivative, additive-GAM Jacobian and directional derivative, or the Bayesian response) is fitted on that set; completions that share an adjustment set share one fit, and completions that disagree publish the identified set of their values with the Imbens-Manski sampling band of the set formed from the completions' joint row influence. An Admg with bidirected edges is identified by the adjustment criterion on its proper back-door graph, so a latent common cause stays in the graph; an Admg without them runs the Dag route. Where no adjustment set exists the front-door criterion is searched (mediator sets of at most three nodes; latent common causes stay bidirected edges) and the derivative is estimated with the outcome additive in the treatment, the mediators and the covariates, the mediator terms forming the pseudo-outcome whose regression on the treatment is the intervention mean, and an interval that refits both stages on each replicate; a completion or ADMG identified by the general ID algorithm through a functional that is neither an adjustment nor a front door is accounted as unevaluable mass (or refused), and a pair with a hedge is refused with its certificate (Shpitser and Pearl 2006). A TemporalAdmg over a series runs the same identification on the unrolled window of its template, per horizon, and may be prepared as a handle. Frequentist intervals are the estimator's own sampling intervals and Bayesian intervals are credible intervals of the response posterior. Cheap and full validation runs the derivative refuter states of the rule below; graph-posterior structures are refused."

