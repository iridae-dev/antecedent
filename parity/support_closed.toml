validations = ["cheap", "full"]
executes_unlicensed = true
reason = "Temporal derivative, elasticity and Jacobian cheap and full run the temporal derivative refuter state and stay unlicensed: no evidence row or coverage record names it. The derivative is the slope of the linear unfolded fit at one horizon; the state checks support at the evaluation point, compares an identity-scale first derivative with the unit-step difference of the identified levels (the completion-weighted Pulse witness effect), and runs the TemporalDag Pulse-native suite on each identified completion's Pulse witness at that horizon (overlap, temporal placebo and pre-period checks; full adds circular-block stability). Bayesian studies add each witness's predictive checks and, under full, prior sensitivity. Completions are not mixed."

