[[closed]]
queries = ["Counterfactual"]
graph_classes = ["Pag"]
structures = ["graph_posterior"]
validations = ["cheap", "full"]
reason = "A counterfactual over a graph posterior of PAG atoms under cheap or full validation is refused, as on a supplied PAG. The effect on the treated is identified only through a visible treatment edge, so the treatment has an observed parent whose association with the outcome runs through the treatment; the placebo treatment permutes the treatment and leaves that association on the outcome with no mechanism to carry it, so its statistic is nonzero on a correctly specified design and the refuter state would flag valid data. Next attempt: a placebo that permutes the treatment within the strata of its parents and re-derives the outcome part the treatment carries, then earn it with a planted-violation and a clean-case test."

