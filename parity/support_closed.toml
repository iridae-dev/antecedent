# Reason table for refused cells. Refusal is the default: any cell that is
# not licensed and not n/a is `SupportRefusal::Refused` whether or not a
# rule here matches. This file does not cause refusal; it names it.
# A cell matching every listed constraint reports that rule's `reason`.
# Must not overlap licensed cells or n/a predicates (the gate fails on overlap).
# `executes_unlicensed = true` marks a refused cell that still builds and runs on
# an explicit request; its result reports the support status `refused`, so no
# evidence row or coverage record is implied. The first matching rule decides.

[[closed]]
queries = ["PathSpecificEffect", "InterventionalDistribution"]
graph_classes = ["Dag", "Admg", "TemporalAdmg", "Cpdag", "Pag"]
structures = ["graph_posterior"]
executes_unlicensed = true
reason = "A path-restricted natural effect or an interventional distribution over a graph posterior is answered on every atom by the executor the query has on a supplied structure of the atom's kind: the path-specific identifier and finite-discrete functional plug-in on a DAG or an ADMG (the contemporaneous projection for a TemporalAdmg atom), and the completion envelope on a CPDAG (every DAG completion) or a PAG (every ADMG sharing the m-separation model of a MAG completion). The atoms mix by posterior probability: the effect is the posterior-weighted mean over the atoms that identify and evaluate it, an interventional distribution is the posterior-weighted mean probability of each outcome level (an atom lacking a level has probability zero there) with the mean beside it, and an atom whose class publishes an identified set contributes its range to the mixture's identified set. An atom the identifier refuses (a recanting district, a hedge, a class every member of which refuses) is unidentified posterior mass and an atom whose plug-in cannot be evaluated is unevaluable mass; neither is redistributed, the result states both and resolves its status to graph-dependent when either exceeds the tolerance. The uncertainty of a mixture: one contributing atom carries its own interval and posterior; several atoms are re-run on shared resampled tables and the standard error is the spread of the draw-wise posterior-weighted mixture (Frequentist), or their draws are pooled draw by draw because every atom runs in one context (Bayesian); an interval that cannot be formed is withheld with the reason stated (estimate.graph_posterior.cross_world_uncertainty). A mixed graph or a class reads an unconditional finite-discrete table. Cheap and full run each atom's own refuter suite against that atom's own estimate and mix the reports of each refuter by the posterior weight of the atoms that produced them; a mixed verdict passes only if every contributing atom passes, and a refuter that ran on only part of the contributing mass says so (refute.envelope.partial_coverage). The result keeps support status refused; no evidence row or coverage record names the cell."

[[closed]]
queries = ["MediationEffect"]
graph_classes = ["Admg", "TemporalAdmg", "Cpdag", "Pag"]
structures = ["explicit", "accepted"]
validations = ["cheap", "full"]
executes_unlicensed = true
reason = "Cheap and full validation of a MediationEffect on a supplied Admg (or the contemporaneous projection of a TemporalAdmg), Cpdag or Pag run the mediation-native suite on the decomposition and stay unlicensed. The suite: the sensitivity of the indirect effect to a violation of sequential ignorability (the mediator-outcome error correlation at which it vanishes, read from the linear working model of the treatment, the mediator index and the outcome with the variables the total-effect functional adjusts for), a mediator placebo (the mediator columns permuted together keep their support and lose every link to the treatment and the outcome: the indirect effect must vanish and the direct and total effects must equal the total effect of the unpermuted table), and the stability of the total, direct and indirect effects jointly on the same random subsets of the rows (contiguous stretches of windows on a window table); full adds 50% subsets and a joint bootstrap range under the study's own resampling. Over a Cpdag or a Pag the suite runs on every distinct identified member (distinct by the value of the requested contrast), each on its own proofs of the three components. The result keeps support status refused: no evidence row or coverage record names the cell, and the verdicts are checks, not a calibration claim."

