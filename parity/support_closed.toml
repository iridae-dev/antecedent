[[closed]]
queries = ["TemporalMediationEffect"]
graph_classes = ["TemporalPag"]
structures = ["explicit", "accepted"]
executes_unlicensed = true
reason = "Natural mediation on one series under a TemporalPag is identified on the finite window of its template, as a pulse contrast is: the treatment is the pulse period's coordinate, the outcome the horizon period's coordinate, and the mediators are the declared mediator variables at every period from the pulse to the outcome. Each stationary MAG completion of the template is unfolded over the window one template lag further back and marginalized onto it by the inducing-path rule, so a cause that precedes the window stays a bidirected edge between its in-window effects, and is then read through every ADMG that shares the marginal MAG, because a MAG fixes a latent projection only up to its m-separation model and a path-specific effect is not a function of that model. The path-specific identifier decides the total, natural direct and natural indirect effects on each candidate (the edge g-formula, or Shpitser's district formula with the recanting-district criterion); the requested contrast is reported only when every candidate of every completion identifies it, as one estimate when they yield the same functional and as the identified set over the distinct functionals otherwise, and a refused candidate refuses the effect. A component other than the requested one that the identifier refuses is reported absent. The decomposition is estimated by the discrete plug-in on the lag-aligned window table with circular blocks of consecutive windows (frequentist) or one Dirichlet weight per block (Bayesian), the components on the same resampled tables when each is identified by one functional, and the result discloses estimate.mediation.joint and estimate.temporal_pag.window. The series is read as stationary over the template, and history deeper than one further template lag is the initial state. One outcome horizon per study; discrete data only. Cheap and full run the mediation-native suite on the window table (sequential-ignorability sensitivity of the indirect effect, a mediator placebo that rotates the mediator columns by whole windows, and the joint stability of the three components on contiguous stretches of windows and, under full, 50% stretches and a joint block bootstrap range); when the completions identify different functionals the suite runs on every distinct member. The result keeps support status refused: no evidence row or coverage record names the cell."

