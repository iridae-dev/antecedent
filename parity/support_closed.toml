graph_classes = ["Admg", "TemporalAdmg", "Cpdag", "Pag"]
structures = ["explicit", "accepted"]
validations = ["none"]
executes_unlicensed = true
reason = "Derivatives, elasticities, directional derivatives and Jacobians on a supplied Cpdag, Pag, Admg or TemporalAdmg (read as its contemporaneous ADMG projection) execute through the compiler and stay unlicensed: no evidence row or coverage record names them. Each identified completion of a Cpdag or Pag (every DAG of the Markov class, every MAG completion of a PAG read as its most-confounded ADMG) is identified by one adjustment set valid for every treatment/outcome pair the functional names, and the continuous response estimator the functional selects (local-polynomial point derivative, Riesz average derivative, additive-GAM Jacobian and directional derivative, or the Bayesian response) is fitted on that set; completions that share an adjustment set share one fit, and completions that disagree publish the identified set of their values with no mixed band. An Admg with bidirected edges is identified by the adjustment criterion on its proper back-door graph, so a latent common cause stays in the graph; an Admg without them runs the Dag route. A completion that ID identifies only through a non-adjustment functional (front-door) is accounted as unevaluable mass because no continuous-treatment estimator evaluates such a functional, and a pair with a hedge is refused with its certificate (Shpitser and Pearl 2006). Frequentist intervals are the estimator's own sampling intervals and Bayesian intervals are credible intervals of the response posterior. Cheap and full validation and graph-posterior structures are refused."

