# Reason table for refused cells. Refusal is the default: any cell that is
# not licensed and not n/a is `SupportRefusal::Refused` whether or not a
# rule here matches. This file does not cause refusal; it names it.
# A cell matching every listed constraint reports that rule's `reason`.
# Must not overlap licensed cells or n/a predicates (the gate fails on overlap).
# `executes_unlicensed = true` marks a refused cell that still builds and runs on
# an explicit request; its result reports the support status `refused`, so no
# evidence row or coverage record is implied. The first matching rule decides.

[[closed]]
queries = ["AverageEffect"]
graph_classes = ["TemporalDag", "TemporalCpdag", "TemporalPag"]
structures = ["explicit", "accepted", "graph_posterior"]
executes_unlicensed = true
reason = "An AverageEffect on one series (or event series) under a temporal graph denotes the lag-0 contrast E[Y_t | do(X_t = active)] - E[Y_t | do(X_t = control)]. The build compiles it as the pulse at offset 0 read at horizon 1: on a TemporalCpdag every completion adjusts for the parents of X_t (temporal backdoor), on a TemporalPag every MAG completion uses visibility-aware adjustment, and the Bayesian reading is the per-completion conjugate posterior with draw-wise identified-set bounds. Over a graph posterior the same pulse is compiled and the per-atom proofs mix as for any temporal pulse. The result keeps support status refused and discloses estimate.temporal_class.lag_zero_average_effect; no evidence row or coverage record names the cell. Effect modifiers, a non-mean functional and a population other than AllObserved are refused (next attempt: TemporalConditionalPulse or a temporal ResponseCurve)."

[[closed]]
queries = ["InterventionResponse"]
graph_classes = ["Dag"]
structures = ["explicit", "accepted", "graph_posterior"]
inferences = ["Bayesian"]
validations = ["cheap", "full"]
executes_unlicensed = true
reason = "Bayesian InterventionResponse cheap and full run the Bayesian refuter state on the intervention level and stay unlicensed: no evidence row or coverage record names the state. Cheap runs plugin-level overlap on the posterior-mean level and the prior and posterior predictive checks of the outcome regression; full adds plugin-level sampling stability, level-native prior sensitivity (the response is refitted at each prior-grid point and its posterior-mean level read back) and MCMC diagnostics. A graph posterior runs the plugin-level suite on the pooled level and the posterior checks on its primary identified atom. Requested explicitly, the state executes; the default suite still downgrades to the licensed validation none."

[[closed]]
queries = ["PointDerivative", "Elasticity", "SemiElasticity", "AverageDerivative", "DirectionalDerivative", "ResponseJacobian"]
graph_classes = ["Dag"]
structures = ["explicit", "accepted"]
validations = ["cheap", "full"]
executes_unlicensed = true
reason = "Derivative, elasticity and Jacobian cheap and full run the derivative refuter state and stay unlicensed: no evidence row or coverage record names it. Cheap checks support at the evaluation point and the central finite difference of the identified intervention levels against the published derivative on its reported scale (point derivatives of order one, order two on the identity scale, and observed-law average derivatives through ± shift interventions); full adds a whole-procedure row bootstrap of the derivative under independent subjects (the published value must lie in the replicates' 95% range; failed replicates are kept). Bayesian studies add the prior and posterior predictive checks of the outcome regression and, under full, prior sensitivity refitting the whole derivative at each grid point and MCMC diagnostics. ATE-shaped contrast refuters do not apply."

[[closed]]
queries = ["PointDerivative", "Elasticity", "SemiElasticity", "AverageDerivative", "DirectionalDerivative", "ResponseJacobian"]
graph_classes = ["TemporalDag", "TemporalCpdag", "TemporalPag"]
