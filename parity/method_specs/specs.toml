failure_policy = "Adjusted claim: a two-decision complete-case observational cross-fit contrast. Unearned: a general observational temporal AIPW/DML route, censoring, horizons beyond two decisions, high-dimensional orthogonal learning, a calibrated interval, a licensed route, and any Bayesian posterior. Known-randomization sequential scores stay on P03.policy."
references = [
  "Static and temporal parity",
  "Frequentist and Bayesian parity",
]

