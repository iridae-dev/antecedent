diagnostics = "This module states what each target family is refuted by and runs those refuters on the whole target vector: RefutationTarget names the target a check speaks to: its family, its quadrant (static or temporal, frequentist or Bayesian), its dimension and the identity of the compiled program or query that defines it. Every report is a diagnostic."
