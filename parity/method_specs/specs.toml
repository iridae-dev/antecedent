provenance = [
  "adaptive_inference.procedure_repeated_measures",
]
api_review = "parity/public_api/antecedent-stats.txt: 53 of 53 public items reviewed"
identifying_result = "Exact closed forms are the oracle: the variance of a unit's mean measurement is variance * (1 + (m - 1) * rho) / m under compound symmetry (the design effect is 1 + (m - 1) * rho), and for a fixed-allocation design the contrast law is an exactly known mixture of normals (exact_fixed_contrast_law)."
assumptions = "This module declares the dependence and derives the uncertainty of the *whole procedure* under it: The within-unit dependence is declared, never defaulted (OutcomeStructure): a compound-symmetric or first-order autoregressive correlation of repeated measures with a stated variance, or a unit-level random effect with a stated between-unit and within-unit variance. The final analysis is declared (FinalAnalysis): the contrast of arm means of unit-level summaries with a cluster-robust (unit-level) variance, the same with generalized-least-squares unit summaries, a pooled analysis that treats the measurements as independent (admitted only when independence is declared), or the adaptively weighted augmented score of super::weighting over unit summaries (the weighting route)."
sampling_units = "Derived uncertainty of an adaptive procedure whose units contribute several correlated measurements: repeated measures within a unit, or members within a cluster with a unit-level random effect."
estimator = "repeated-measures procedure uncertainty: Derived uncertainty of an adaptive procedure whose units contribute several correlated measurements: repeated measures within a unit, or members within a cluster with a unit-level random effect."
diagnostics = "A missing element is refused with its own detail. Other monitoring and stopping combinations are separate cells and are refused here."
failure_policy = "The adaptive procedure's law has no closed form, so it is simulated end to end under a declared seed (simulate_repeated_measures) and the Monte Carlo error is reported separately from the exact quantities. Premise gates are per paradigm: a fixed-sample analysis after response-adaptive assignment is refused, an independence assumption for dependent measurements is refused, and a guarantee derived for one cell is never carried to another (CellLabel::transfer_to)."
references = [
  "Static and temporal parity",
  "Frequentist and Bayesian parity",
]

