# Rust facade entry points and the Python entry that carries each.
# One row per public free function (kind = "fn") and per public prepared / session type
# (kind = "type") of parity/public_api/antecedent.txt. scripts/check_python_surface.py reads
# this file: every snapshot entry must have exactly one row, a bound row must resolve to a
# definition in python/, and an internal or missing row must say why.
#
# status = "bound"      the entry is reachable from Python at `python` (a dotted path under
#                       python/, `antecedent._native.<name>`, or `native:<file>` for a PyO3
#                       function that the wrappers call without a stub of its own)
# status = "internal"   orchestration or plumbing with no separate Python call; `reason` names
#                       the entries through which Python reaches the capability
# status = "missing"    a public entry with no Python entry yet; `reason` says why
# status = "unverified" no Python counterpart was found by name and none was confirmed by
#                       reading the wrappers; not a claim that none exists

