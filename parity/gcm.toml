[[capabilities]]
id = "gcm.model.policy_workflows"
status = "done"
evidence_kind = "internal_known_truth"
evidence_test = "crates/antecedent/tests/policy_python_parity.rs"
evidence_assertion = "a_policy_value_is_the_paired_difference_against_the_same_noise_with_its_licence"
known_truth_reference = { kind = "closed_form", source = "crates/antecedent/tests/policy_python_parity.rs::a_policy_value_is_the_paired_difference_against_the_same_noise_with_its_licence", proposition = "Clamping price to 20 gives constant policy price; paired mean difference is 20 minus baseline mean, with error sd(baseline)/sqrt(n); generating demand slope is -0.8.", tolerance = "price mean and spread 1e-12, paired difference/error 1e-9, demand slope within 0.02", limitations = "Specified fitted-model simulation and support semantics; fitted-model uncertainty is unquantified and no interval calibration is claimed." }
python_facade = "full"
limitations = "Model-based values of a fitted structural model: only the Monte Carlo error of the draws is quantified, the model's own uncertainty is reported unquantified, and no interval or calibration claim is made. A transform or computed assignment has no observational identification (its identification route is refused with policy_route_not_licensed), so it is answered by simulation on the fitted model; the retained handles are the fitted model (FittedGcm, PreparedPolicy) and the practitioner handle antecedent.prepare with a PolicyProgramValue question, which runs the same retained program. A recoverable callback leaves the process as its recovery record and replays only against an implementation the consumer supplies and that verifies."
notes = "Policy value (policy mean, unintervened mean on the same noise, paired difference and simulation errors) with per-route support decisions and reason codes; counterfactual rollout of a factual panel through the temporal executor; sample with retained noise and noise replay; versioned portable encoding of programs with recoverable callback records, re-verified on decode; Python intervention_programs.policy_value / policy_support / prepare_policy / counterfactual_temporal_policy and FittedGcm.sample_noise / replay_noise; PreparedPolicy compiles the overlay and resolves the licence once and rebinds to a refitted model without compiling the program again"

[[capabilities]]
id = "gcm.model.prepared_policy"
status = "done"
evidence_kind = "internal_cross_check"
evidence_test = "crates/antecedent/tests/policy_python_parity.rs"
evidence_assertion = "a_prepared_policy_reruns_the_one_shot_value_without_compiling_the_program_again"
python_facade = "full"
limitations = "The prepared value is the model-based policy value: only its Monte Carlo error is quantified, the fitted model's uncertainty is reported unquantified and no interval or calibration claim is made. Observational identification of a hard level is reported in the support decision but the value is the model's, not an identified estimand; a refresh refits the model and resolves the overlay and licence against it (the program is not compiled again). The handle has no refutation, retargeting or portable claim."
notes = "PreparedPolicy retains the program, its compiled overlay and the licence of each route, and runs the policy-value executor on them: equal to policy_value bit for bit at the same context, with program_compilations and model_bindings as the receipt that a rerun compiled nothing; Python antecedent.prepare(data, query=PolicyProgramValue(...), graph=...) returns a PreparedAnalysis whose estimate / refresh rerun it and whose result reports support, contract, provenance and the receipt"

[[capabilities]]
id = "gcm.attribution.intrinsic_influence"
status = "done"
evidence_kind = "internal_known_truth"
evidence_test = "crates/antecedent-attribution/tests/intrinsic_influence.rs"
evidence_assertion = "a_linear_chain_recovers_squared_path_coefficients_times_noise_variance"
known_truth_reference = { kind = "closed_form", source = "crates/antecedent-attribution/tests/intrinsic_influence.rs::a_linear_chain_recovers_squared_path_coefficients_times_noise_variance", proposition = "For the stated independent-noise linear chain, variance contributions are squared total path coefficients times each source noise variance.", tolerance = "The executing assert_matches_truth/tolerance helpers use the stated 400 outer draws and four batches and report simulation error.", limitations = "Fixed linear chain only; component error estimates and intervals are uncalibrated diagnostics, not licensed coverage evidence." }
python_facade = "full"
limitations = "Independent-noise structural models only: independence is a caller declaration, and bidirected edges, latent common causes, unfitted mechanisms and serially dependent noise are refused. Contributions match closed forms for linear, product and quadratic mechanisms within the estimator's own standard errors; the standard errors and Student-t intervals of the permutation, simulation and mechanism-fit components are uncalibrated diagnostics, and no combined interval is offered."
notes = "Shapley split of a target's variance among the noise terms of its ancestors and itself, v(S) = Var(E[Y | U_S]) by nested Monte Carlo with the analysis-of-variance correction over batch noise replay; exact up to ten sources, permutation sampling above; per-source contributions, total variance, allocation residual, method and budget; permutation, simulation and mechanism-fit uncertainty reported as separate components, the last unquantified without data; with fit_bootstrap a whole-procedure interval (full refits with mechanism re-selection and fresh simulation, permutation variance added; uncalibrated); Python gcm.intrinsic_influence"
