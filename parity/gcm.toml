[[capabilities]]
id = "gcm.model.intervention_programs"
status = "done"
evidence_kind = "implementation_exists"
evidence_test = "crates/antecedent-model/tests/intervention_programs.rs"
evidence_assertion = "a_price_floor_holds_for_every_realized_price_and_flows_downstream_on_the_same_noise"
python_facade = "full"
limitations = "Programs run in forward sampling, conditional sampling, the do-samplers, counterfactual world evaluation and the temporal rollout (lagged reads of earlier realised steps within a declared window) through one shared executor; nested counterfactuals and the closed-form temporal response paths refuse them, and a program with a runtime-bound callback has no portable encoding. The tests compare the executor with hand arithmetic and hand recursions on identical noise across the sampling, counterfactual and temporal routes, a scalar interpreter and Gaussian closed forms; no interval or calibration claim is made."
notes = "Intervention::Transform (expression of the generated value, noise and incoming edges kept) and Intervention::Assign (expression of other variables, mechanism replaced) over typed value expressions with arithmetic, min/max/clip, comparisons, boolean connectives, conditionals and explicit variable references, compiled to postfix column programs on the intervention overlay"

[[capabilities]]
id = "gcm.model.policy_validation"
status = "done"
evidence_kind = "implementation_exists"
evidence_test = "crates/antecedent-model/tests/intervention_programs.rs"
evidence_assertion = "each_route_is_licensed_separately"
python_facade = "none"
limitations = "Validation is structural: declared reads equal referenced variables, the combined read and parent graph is acyclic, the output type fits the node, directives do not conflict. Observational identification is licensed only for programs reducing to a hard level; history reads are refused on static models, beyond a rollout's declared window and before the first available step."
notes = "Coded refusals (policy_dependency_circular, policy_dependency_unavailable, policy_directive_conflict, policy_output_type_invalid, policy_history_unavailable, policy_route_not_licensed) and policy_support, a separate licensing decision for simulation, counterfactual execution and observational identification"

[[capabilities]]
id = "gcm.attribution.intrinsic_influence"
status = "done"
evidence_kind = "internal_known_truth"
evidence_test = "crates/antecedent-attribution/tests/intrinsic_influence.rs"
evidence_assertion = "a_linear_chain_recovers_squared_path_coefficients_times_noise_variance"
python_facade = "full"
limitations = "Independent-noise structural models only: independence is a caller declaration, and bidirected edges, latent common causes, unfitted mechanisms and serially dependent noise are refused. Contributions match closed forms for linear, product and quadratic mechanisms within the estimator's own standard errors; the standard errors and Student-t intervals of the permutation, simulation and mechanism-fit components are uncalibrated diagnostics, and no combined interval is offered."
notes = "Shapley split of a target's variance among the noise terms of its ancestors and itself, v(S) = Var(E[Y | U_S]) by nested Monte Carlo with the analysis-of-variance correction over batch noise replay; exact up to ten sources, permutation sampling above; per-source contributions, total variance, allocation residual, method and budget; permutation, simulation and mechanism-fit uncertainty reported as separate components, the last unquantified without data; Python gcm.intrinsic_influence"
