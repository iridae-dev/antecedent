# The adaptive-procedure matrix: assignment policy x outcome structure x
# monitoring strategy x stopping rule. Every combination is listed once and
# is exactly one of licensed (an estimator and uncertainty method exist per
# listed paradigm; every interval and guarantee route is closed pending
# whole-procedure measurement), closed_incoherent, closed_pairing (each
# component delivered, the pairing not) or carried_forward with an owner.
#
# The executable source of truth is
# antecedent_contract::adaptive_design::procedure_status; the contract test
# adaptive_design.rs fails when this file and that function disagree, and when
# a cell is missing, duplicated or unlisted. Regenerate rather than edit.

