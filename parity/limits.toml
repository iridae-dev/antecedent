implementation = [{ path = "crates/antecedent-stats/src/measurement_error.rs", constant = "MAX_MEASUREMENT_COVARIATES" }]
documentation = [{ path = "crates/antecedent-stats/src/measurement_error.rs", constant = "MAX_MEASUREMENT_COVARIATES" }]
guard = { path = "crates/antecedent-stats/src/measurement_error.rs", pattern = 'p > MAX_MEASUREMENT_COVARIATES' }
refusal = { path = "crates/antecedent-stats/src/measurement_error.rs", pattern = 'p > MAX_MEASUREMENT_COVARIATES \|\| n > MAX_MEASUREMENT_ROWS \{[\s\S]{0,200}return Err\(MeasurementErrorError::Shape' }

[[bound]]
record = "measurement.probabilistic_categorical"
key = "max_categories"
implementation = [{ path = "crates/antecedent-stats/src/measurement_error.rs", constant = "MAX_MEASUREMENT_CATEGORIES" }]
documentation = [{ path = "crates/antecedent-stats/src/measurement_error.rs", constant = "MAX_MEASUREMENT_CATEGORIES" }]
guard = { path = "crates/antecedent-stats/src/measurement_error.rs", pattern = '!\(2\.\.=MAX_MEASUREMENT_CATEGORIES\)\.contains\(&levels\)' }
refusal = { path = "crates/antecedent-stats/src/measurement_error.rs", pattern = '!\(2\.\.=MAX_MEASUREMENT_CATEGORIES\)\.contains\(&levels\)[\s\S]{0,200}return Err\(MeasurementErrorError::Shape' }

