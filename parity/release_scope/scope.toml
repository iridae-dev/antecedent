# B05 release scope.
# Checking this file records the mandatory list and the research list.
# Later attempts write their outcomes back into the matching rows.
# An unresolved mandatory row blocks release.
# A public claim changes only after the named attempts are exhausted.
# The failed Gaussian-panel attempt stays recorded in parity/method_specs/specs.toml.

schema = 1
recorded_by = "B05"
unresolved_mandatory_blocks_release = true
public_claim_changes_only_after_named_attempts_are_exhausted = true
delta_ab_identified_claim = "pending"
model_conditional_rule = "A world becomes model-conditional only after both the supported-world design and the joint-assignment design leave it unsupported."
gaussian_panel_record = "parity/method_specs/specs.toml"

