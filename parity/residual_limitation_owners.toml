# Owners of residual limitations. Hand-maintained; read by scripts/residual_limitations.py.
#
# The first rule whose patterns all match a scanned limitation owns it. A rule carries
#   name        a short label written into the ledger row
#   limitation  exact ledger id                      (optional)
#   kind        regular expression on the row kind   (optional)
#   path        regular expression on the source     (optional)
#   locator     regular expression on the locator    (optional)
#   text        regular expression on the text       (optional)
#   item        the tracker item whose completion claims the limitation's subject (optional;
#               a counterpart row takes it from its id)
# and exactly one of
#   owner       an open tracker item id (TODO.md) that carries the work that removes the limitation
#   decision    "scope" with a written rationale: the limitation is a recorded boundary of the
#               release, not pending work
# scripts/check_residual_limitations.py rejects an unmapped limitation, an owner that is the
# limitation's own item, an owner that is closed or absent from the tracker, and a scope decision
# without a rationale.

# ---- theory boundaries: the target does not exist in the closed design cell -------------------

[[owner]]
name = "estimand_has_no_static_design"
kind = "^theory_reason$"
locator = "static\\.(frequentist|bayesian)$|#static\\."
decision = "scope"
rationale = "The estimand is indexed by time, a lag, a horizon, an adoption cohort or a panel path, so a static design cell has no such target. The row closes the cell with its typed refusal and theory reason, which is the intended behaviour; a static route would answer a different question."

[[owner]]
name = "estimand_has_no_sampling_distribution"
kind = "^theory_reason$"
decision = "scope"
rationale = "The target does not exist for a sampling distribution: updating a prior by an experiment is a posterior-side statement only. The frequentist cell stays closed with its theory reason because no frequentist estimator can define the quantity."

