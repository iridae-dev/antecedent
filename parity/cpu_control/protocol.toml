# G01 CPU control for the 3.0 neural-crossfit candidate.
# This file is the measurement of command on the host below. It is not a GPU result.
# The historical 2.1 timing in benches/baselines/neural_crossfit.md is not this control.

schema = 1
id = "G01"
status = "measured"
measured = true

[workload]
id = "neural_crossfit"
stages = [
    "fold_planning",
    "propensity_fit",
    "outcome_fit",
    "prediction",
    "restore_to_physical_row_order",
]
entry_point = "crates/antecedent-learn/examples/neural_crossfit_benchmark.rs"
command = "cargo run --release -q -p antecedent-learn --features ml-neural --example neural_crossfit_benchmark"
printed_timers = [
    "fold_plan_ms",
    "propensity_fit_predict_ms",
    "outcome_fit_predict_ms",
    "total_ms",
]
notes = "Prediction and restoration to physical row order run inside cross_fit_with_folds, so they are inside propensity_fit_predict_ms and outcome_fit_predict_ms. The example does not print them as separate timers. Workload is 4000 rows, 8 columns, 3 folds, hidden 16, epochs 20, learning rate 0.02."

[host]
machine = "Apple M1 Max"
arch = "arm64"
os = "macOS 26.5.2 (25F84)"
threads = 10

[measurement]
commit = "420bab39471f7881abf2696c80540b9ccb576c07"
backend = "burn_ndarray_cpu"
dtype = "f64 column-major design and f64 predictions; training and inference on NdArray<f32>"
cold_warm = "cold is the first execution after the release build; warm is a later execution of that same binary"

[stage_times.cold]
fold_plan_ms = 0.061
propensity_fit_predict_ms = 72.613
outcome_fit_predict_ms = 67.373
total_ms = 140.046
prediction_and_restore = "inside the two fit-and-predict timers"

[stage_times.warm]
fold_plan_ms = 0.019
propensity_fit_predict_ms = 75.390
outcome_fit_predict_ms = 67.293
total_ms = 142.703
prediction_and_restore = "inside the two fit-and-predict timers"
notes = "A middle execution of the same binary printed fold_plan_ms=0.019, propensity_fit_predict_ms=79.500, outcome_fit_predict_ms=67.347, total_ms=146.865. Warm is the last of the two direct executions."

[historical]
source = "benches/baselines/neural_crossfit.md"
role = "not the control"
notes = "The 2.1 timing note is historical context. It does not supply this host, this commit, this dtype, or these stage times."

[comparison]
rule = "Repeat this control on the exact host and revision used for the comparison."
same_command = true
measured_commit = "420bab39471f7881abf2696c80540b9ccb576c07"
measured_host = "Apple M1 Max, arm64, macOS 26.5.2"

[g03]
id = "G03"
material_gain_threshold = "2×"
threshold_status = "frozen"
frozen = true
freeze_when = "Frozen from the CPU record in this file, before any GPU result."
gpu_result = "No GPU result has been examined. A GPU result cannot move this threshold."
notes = "2× remains the complete-workload material-gain threshold. This control does not supply a GPU comparison, and it does not change the threshold."
