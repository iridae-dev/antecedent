# 2.2A X8 path-specific edge-intervention cell (parity/promotion_2_2.toml, 2.2A.X8.path_specific_edge_intervention).
# A counterfactual stage API, not a transport route: it uses this registry because it has no Study query and so no support-matrix coordinate.
[[routes]]
route = "antecedent_identify.check_cross_world"
stage = "identify"
status = "licensed"
graph = "explicit_markovian_dag_at_most_8_observed_variables"
evidence = "worlds_edge_routes_and_shared_exogenous_coupling"
functional = "witnessed_two_world_edge_contrast_or_typed_refusal"
observation = "fully_observed_markovian_dag"
guarantee = "sound_incomplete"
limits = "Sound and incomplete: a witness names the assumptions, rerouted edges and counterfactual nodes and is recomputed by the consumer; queries outside the contract are refused, not decided. Two worlds over one fixed DAG of at most 8 variables; a recanting witness (Avin, Shpitser and Pearl 2005) is the one nonidentification finding (cross_world_not_identified), other world shapes are route_not_supported, and latent-confounded, accepted or uncertain structure refuses. Not counterfactual identification on ADMGs (2.2B B5)."
evidence_test = "crates/antecedent/tests/cross_world_edge_contrast.rs"
evidence_assertion = "the_check_returns_a_witness_naming_assumptions_and_counterfactual_nodes"

[[routes]]
route = "antecedent_counterfactual.evaluate_cross_world"
stage = "evaluate"
status = "licensed"
graph = "explicit_markovian_dag_at_most_8_observed_variables"
evidence = "fitted_structural_model_and_factual_table"
functional = "mean_per_unit_contrast_under_shared_abduced_exogenous_terms"
observation = "complete_float64_table"
guarantee = "abduction_action_prediction_as_one_operation_over_shared_exogenous_terms"
limits = "Invertible additive-noise mechanisms; no separate abduction entry point; point only. Enforces well-posed abduction (exact inversion) and polls the cancellation token per node; consistency and correct specification are named premises, not checks. The outcome's exogenous term is shared per unit like every other."
evidence_test = "crates/antecedent/tests/cross_world_edge_contrast.rs"
evidence_assertion = "per_unit_shared_abduction_is_observable_under_a_non_separable_mechanism"

[[routes]]
route = "antecedent.cross_world.evaluate_cross_world_effect"
stage = "evaluate"
status = "licensed"
graph = "explicit_markovian_dag_at_most_8_observed_variables"
evidence = "fitted_linear_gaussian_or_non_separable_basis_mechanisms"
functional = "path_specific_edge_contrast_point"
observation = "complete_float64_table"
guarantee = "exact_under_specified_scm_point_only"
limits = "Explicit DAG only; no interval or Bayesian inference; natural direct and indirect effects are edge sets. The fit polls the cancellation token before every node, candidate family and cross-validation fold, so a cancelled context stops it with the typed cancellation and no partial store; a single fit (one design solve) is not interrupted."
evidence_test = "crates/antecedent/tests/cross_world_edge_contrast.rs"
evidence_assertion = "exact_linear_scm_truth_for_every_edge_set"

[[routes]]
route = "antecedent.cross_world.consume_cross_world_artifact"
stage = "consume"
status = "licensed"
graph = "embedded_graph_query_witness_and_table"
evidence = "stored_premises_digest_data_digest_witness_and_point"
functional = "replayed_point_and_witness"
observation = "embedded_float64_table"
guarantee = "consumer_refits_and_replays_with_the_same_evaluator_and_accepts_only_an_identical_point_and_witness_with_a_separate_closed_form_recomputation_for_both_mechanism_families"
limits = "At most 8 variables and 100000 rows, enforced at export and at consumption. The premises digest binds variable names, graph, query, estimand, mechanism family and the data digest; the data digest binds the names and the table. Replay detects corruption and re-sealed edits that change the derivation or the point; it does not detect a producer that seals a wrong table or query on purpose. Both mechanism families are also recomputed from the stored table by a separate implementation (ordinary least squares, or a Givens-QR ridge-stabilized basis regression) and refused with IndependentCheckMismatch on disagreement beyond 1e-6 relative; a singular, ill-conditioned or fitter-refused design is replay-verified only (independently_verified = false)."
evidence_test = "crates/antecedent/tests/cross_world_edge_contrast.rs"
evidence_assertion = "artifact_round_trip_is_replayed_by_the_consumer"

