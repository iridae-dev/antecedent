graph = "registered_four_node_surrogate_z_transport_graph_without_selection_targets"
evidence = "checked_frozen_proof_and_bound_joint_law_snapshot"
functional = "target_interventional_outcome_distribution"
observation = "exact_or_empirical_plugin_point_distribution"
guarantee = "point_distribution_with_nominal_percentile_interval_only_for_cited_empirical_tables"
limits = "Exact laws stay point-only and report no_interval_reported. Empirical cited tables publish a nominal percentile bootstrap with reason estimator_grid_not_measured and no coverage record. Portable artifacts carry the point result only. Refresh rebinds fresh laws under the retained proof and catalog; a changed snapshot identity is a new binding and is prepared again."
evidence_test = "python/tests/test_transport_z.py"
evidence_assertion = "test_z_transport_estimate_refresh_executes_retained_program_after_builder_disposal"

[[routes]]
route = "antecedent.transport.advanced.PreparedZTransportStage.estimate_bayesian_posterior"
stage = "uncertainty"
status = "licensed"
graph = "registered_four_node_surrogate_z_transport_graph_without_selection_targets"
evidence = "checked_frozen_proof_and_cited_empirical_tables_with_counts"
functional = "target_interventional_outcome_distribution"
observation = "empirical_plugin_point_with_posterior_law_draws"
guarantee = "posterior_equal_tail_interval_around_the_plugin_point_coverage_not_measured"
reference = "https://ftp.cs.ucla.edu/pub/stat_ser/r408.pdf"
limits = "estimator='empirical_support_bayesian_bootstrap' or 'state_space_dirichlet' with posterior_draws. The point stays the empirical plug-in; the interval is an equal-tail posterior interval whose reason is estimator_grid_not_measured and no coverage record exists. Fewer than the percentile floor of successful draws withholds the interval as insufficient_bootstrap_replicates. Exact laws without counts refuse the posterior. Nothing here is calibrated."
evidence_test = "python/tests/test_transport_z.py"
evidence_assertion = "test_bayesian_z_transport_posterior_executes_retained_plan_after_builder_disposal"

[[routes]]
route = "antecedent_identify.decide_two_source_z_transport"
stage = "identify"
status = "licensed"
graph = "shared_causal_graph_with_two_source_selection_diagrams"
evidence = "one_catalog_per_source_cited_joints_only"
functional = "target_interventional_outcome_distribution"
observation = "per_source_single_source_trz"
guarantee = "sound_incomplete"
reference = "https://ftp.cs.ucla.edu/pub/stat_ser/r408.pdf"
limits = "At most two sources, searched separately on each source's selection diagram. One identifying source is named and its cited factors must bind; the other source is not required. Complementary factors combine only under the two registered factorizations (disconnected graph components and intervention-separated groups). A single connected c-factor that would need one joint law over both sources' interventions is never fabricated: that outcome is refused with reason code transport_not_certified naming z_transport.multi_source_combination_not_searched. Classical meta-transport is not called."
evidence_test = "crates/antecedent-identify/tests/z_transport_two_source.rs"
evidence_assertion = "a_factor_from_each_source_is_not_combined"

[[routes]]
route = "antecedent_identify.decide_two_source_z_transport.disconnected_components"
stage = "identify"
status = "licensed"
graph = "two_disconnected_static_components_of_the_shared_graph"
evidence = "one_catalog_per_source_cited_joints_only"
functional = "product_of_two_disconnected_component_interventional_laws"
observation = "per_component_single_source_trz"
guarantee = "sound_incomplete"
reference = "https://ftp.cs.ucla.edu/pub/stat_ser/r408.pdf"
limits = "The queried outcomes and treatments partition into exactly two disconnected static graph components. Each component is transported from one distinct source, and the target law is the product of the two component laws. Each factor binds only to its own source's regimes; a component that would need evidence from both sources is not combined. Separate marginals do not bind a joint component law."
evidence_test = "crates/antecedent-identify/tests/z_transport_two_source.rs"
evidence_assertion = "complementary_joint_regimes_identify_disconnected_outcome_components"

[[routes]]
route = "antecedent_identify.decide_two_source_z_transport.connected_complementary"
stage = "identify"
status = "licensed"
graph = "one_connected_shared_graph_with_intervention_separated_outcome_groups"
evidence = "one_catalog_per_source_cited_joints_only"
functional = "product_of_two_intervention_separated_group_interventional_laws"
observation = "per_group_single_source_trz"
guarantee = "sound_incomplete"
reference = "https://ftp.cs.ucla.edu/pub/stat_ser/r408.pdf"
limits = "One connected graph whose intervened outcomes m-separate into exactly two groups given the treatments, so P*_x(y) factorizes into one marginal interventional effect per group. Each group's effect P*_{x_g}(y_g) is transported from one distinct source under the joint-regime rule, and the target law is the product of the two group laws. When the outcomes stay m-connected given the treatments (one connected c-factor) or split into more than two groups, the case is refused as z_transport.multi_source_combination_not_searched; a joint over both sources' interventions is never fabricated. The enumerated-SCM point check is antecedent's analysis::z_transport::tests::connected_complementary_sources_execute_the_enumerated_joint_target_effect."
evidence_test = "crates/antecedent-identify/tests/z_transport_two_source.rs"
evidence_assertion = "connected_complementary_factors_identify_across_two_sources"

