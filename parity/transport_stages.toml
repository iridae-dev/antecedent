# T10 fixture families. Each family needs an executing positive and an executing
# counterexample, so a blanket refusal cannot make the family green.
# `evidence_class` keeps external parity, exact SCM truth, internal cross-checks,
# theoretical witnesses, statistical calibration, inferential plumbing (one seeded
# run that checks wiring, not coverage) and resampling properties (a width fact
# shown on a test-built resampler, not a library refusal) apart; `limits` states what
# the pair does not establish. scripts/gate_transport.sh executes every row.

[[fixture_evidence]]
id = "transport_direct_regression.positive"
family = "transport_direct_regression"
role = "positive"
evidence_class = "external_parity"
evidence_test = "crates/antecedent-identify/tests/causaleffect_transport_subset.rs"
evidence_assertion = "matches_frozen_causaleffect_supported_sid_subset"
limits = "Frozen causaleffect 1.3.15 direct/standardize structure; numeric law compare is the enumerated SCM companion, not recursive completeness."

[[fixture_evidence]]
id = "transport_direct_regression.counterexample"
family = "transport_direct_regression"
role = "counterexample"
evidence_class = "external_parity"
evidence_test = "crates/antecedent-identify/src/transport.rs"
evidence_assertion = "outcome_as_selection_target_is_never_standardized_over"
limits = "Frozen causaleffect 1.3.15 direct/standardize structure; numeric law compare is the enumerated SCM companion, not recursive completeness."

[[fixture_evidence]]
id = "transport_standardize_regression.positive"
family = "transport_standardize_regression"
role = "positive"
evidence_class = "internal_cross_check"
evidence_test = "python/tests/test_transport_exact.py"
evidence_assertion = "test_catalog_standardization_uses_only_supplied_target_covariate_marginal"
limits = "One hand-computed standardized law; the counterexample is structural, not numeric."

[[fixture_evidence]]
