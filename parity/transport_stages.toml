# Stage contracts supplement the analyze matrix; no statistical calibration is
# implied by an identification or exact-expression contract.
version = 1
default = "closed"

[[routes]]
route = "antecedent.transport.identify"
stage = "identify"
status = "licensed"
graph = "selection_admg"
evidence = "legacy_single_variable_experiments_or_supplied_catalog"
functional = "target_interventional_response"
observation = "complete_measured_laws"
guarantee = "sound_incomplete"
reference = "https://arxiv.org/abs/1312.7485v1"
limits = "Direct, pretreatment S-admissible standardization, and singleton districts; target-only DAG g-formula; at most 20 standardizer candidates; no complete finite-catalog search or multi-node recursion."
evidence_test = "python/tests/test_transport_catalog.py"
evidence_assertion = "test_identifier_preserves_measured_regime_and_sampling_constraints"

[[routes]]
route = "antecedent.transport.reload_lowered_expression"
stage = "representation"
status = "licensed"
graph = "already_identified"
evidence = "population_and_regime_tagged_expression"
functional = "nested_sums_products_ratios_and_kernels"
guarantee = "identity_and_dependencies_preserved"
evidence_test = "python/tests/test_transport_t2_functionals.py"
evidence_assertion = "test_nested_kernel_round_trips_through_artifact"

[[routes]]
route = "transport.finite_catalog_search"
stage = "identify"
status = "closed"
reason_code = "transport_not_certified"
notes = "Arbitrary finite-catalog completeness is not claimed; bounded alternatives are licensed separately."

[[routes]]
route = "transport.general_uncertainty"
stage = "uncertainty"
status = "closed"
reason_code = "transport_unsupported_evaluator"
notes = "General multi-regime uncertainty is T6. The existing trial-IPW cell remains separately licensed in support_licensed.toml."

[[routes]]
route = "antecedent.transport.identify_classical"
stage = "identify"
status = "licensed"
graph = "selection_admg"
evidence = "classical_complete_source_experimental_family"
functional = "target_interventional_distribution"
observation = "complete_measured_laws"
guarantee = "complete_in_classical_evidence_scope"
reference = "https://arxiv.org/abs/1312.7485v1"
conformance_test = "crates/antecedent-identify/tests/transport_exact_scm.rs"
conformance_assertion = "four_node_branch_conformance_has_no_unchecked_obstructions"
limits = "Complete classical single-source experimental family only; budget exhaustion is inconclusive. No arbitrary finite-catalog or combined-source completeness."
evidence_test = "python/tests/test_transport_exact.py"
evidence_assertion = "test_classical_negative_is_scoped_to_selected_source"

[[routes]]
route = "antecedent.transport.evaluate_exact"
stage = "evaluate"
status = "licensed"
graph = "native_checked_classical_derivation"
evidence = "available_joint_catalog_laws_and_validated_finite_discrete_tables"
functional = "full_target_distribution_numeric_means_and_contrasts"
observation = "exact_laws_with_required_denominator_support"
guarantee = "exact_law_evaluation_without_sampling_uncertainty"
limits = "Three bounded catalog strategies; checked irrelevant-zero rule; explicit support and resource failures. No sampling uncertainty or arbitrary finite-catalog completeness."
evidence_test = "python/tests/test_transport_exact.py"
evidence_assertion = "test_recursive_frontdoor_exact_distribution_matches_latent_enumeration"

[[routes]]
route = "antecedent.transport.inspect_catalog"
stage = "identify"
status = "licensed"
graph = "native_checked_classical_derivation"
evidence = "validated_exact_laws_and_supplied_finite_catalog"
functional = "target_interventional_distribution"
guarantee = "sound_incomplete"
limits = "Exact-law contract only; no sampling uncertainty or arbitrary finite-catalog completeness."
evidence_test = "python/tests/test_transport_exact.py"
evidence_assertion = "test_catalog_diagnostics_distinguish_missing_evidence_and_future_experiments"

[[routes]]
route = "antecedent.transport.prepare_exact"
stage = "prepare"
status = "licensed"
graph = "native_checked_classical_derivation"
evidence = "validated_exact_laws_and_supplied_finite_catalog"
functional = "target_interventional_distribution"
guarantee = "immutable_authority_atomic_refresh_and_identity_invalidation"
limits = "Exact-law contract only; no sampling uncertainty or arbitrary finite-catalog completeness."
evidence_test = "python/tests/test_transport_exact.py"
evidence_assertion = "test_common_prepared_lifecycle_export_consume_atomic_refresh"

[[routes]]
route = "antecedent.transport.consume_exact"
stage = "consume"
status = "licensed"
graph = "native_checked_classical_derivation"
evidence = "validated_exact_laws_and_supplied_finite_catalog"
functional = "target_interventional_distribution"
guarantee = "independently_checked_embedded_exact_law_claim"
limits = "Exact-law contract only; no sampling uncertainty or arbitrary finite-catalog completeness."
evidence_test = "python/tests/test_transport_exact.py"
evidence_assertion = "test_result_reasoning_and_export_retain_native_authority_after_display_edits"

[[routes]]
route = "transport.exact_table_evaluate"
stage = "evaluate"
status = "licensed"
graph = "native_checked_classical_derivation"
evidence = "validated_complete_finite_discrete_laws"
functional = "full_target_distribution_numeric_means_and_contrasts"
guarantee = "exact_law_evaluation_without_sampling_uncertainty"
limits = "Checked support and resource obligations; no empirical-table or statistical coverage claim."
evidence_test = "python/tests/test_transport_exact.py"
evidence_assertion = "test_checked_irrelevant_zero_in_standardization_and_relevant_zero_failure"
