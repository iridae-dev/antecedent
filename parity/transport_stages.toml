# Stage contracts supplement the analyze matrix; no statistical calibration is
# implied by an identification or exact-expression contract.
version = 1
default = "closed"

[[routes]]
route = "antecedent.transport.identify"
stage = "identify"
status = "licensed"
graph = "selection_admg"
evidence = "legacy_single_variable_experiments_or_supplied_catalog"
functional = "target_interventional_response"
observation = "complete_measured_laws"
guarantee = "sound_incomplete"
reference = "https://arxiv.org/abs/1312.7485v1"
limits = "Direct, pretreatment S-admissible standardization, and singleton districts; target-only DAG g-formula; at most 20 standardizer candidates; no complete finite-catalog search or multi-node recursion."
evidence_test = "python/tests/test_transport_catalog.py"
evidence_assertion = "test_identify_proof_executes_through_retained_checked_plan_after_builder_disposal"

[[routes]]
route = "antecedent.transport.reload_lowered_expression"
stage = "representation"
status = "licensed"
graph = "already_identified"
evidence = "population_and_regime_tagged_expression"
functional = "nested_sums_products_ratios_and_kernels"
guarantee = "checked_program_replays_identification_and_requires_matching_exact_provider_laws"
evidence_test = "python/tests/test_transport_t2_functionals.py"
evidence_assertion = "test_reloaded_functional_program_executes_and_replays_checked_wire"

[[routes]]
route = "transport.finite_catalog_search"
stage = "identify"
status = "closed"
reason_code = "transport_not_certified"
notes = "Arbitrary finite-catalog completeness is not claimed; bounded alternatives are licensed separately."

[[routes]]
route = "transport.general_uncertainty"
stage = "uncertainty"
status = "closed"
reason_code = "transport_unsupported_evaluator"
notes = "Unbounded multi-regime uncertainty stays closed. Licensed T6 cells are the empirical-table plug-in and its IID outer bootstrap only. Trial-IPW remains separately licensed in support_licensed.toml."

[[routes]]
route = "antecedent.transport.prepare_statistical"
stage = "prepare"
status = "licensed"
graph = "native_checked_classical_derivation"
evidence = "mixed_supplied_exact_laws_and_finite_categorical_samples"
functional = "target_interventional_distribution"
observation = "catalog_domains_and_complete_observation_empirical_joints"
guarantee = "immutable_authority_atomic_refresh_and_identity_invalidation"
limits = "Finite binary/categorical catalog domains; one joint per regime/world; convenience samples cannot stand in for the target law. No learner-backed factors or silent smoothing."
evidence_test = "python/tests/test_transport_statistical.py"
evidence_assertion = "test_prepare_statistical_retains_checked_plan_after_builder_disposal"

[[routes]]
route = "antecedent.transport.evaluate_empirical_table"
stage = "evaluate"
status = "licensed"
graph = "native_checked_classical_derivation"
evidence = "catalog_declared_finite_domains_and_complete_observation_counts"
functional = "full_target_distribution_numeric_means_and_contrasts"
observation = "empirical_plugin_joints_with_sampling_zero_support"
guarantee = "frequency_plugin_without_hidden_smoothing"
limits = "Complete-observation frequencies only; missingness requires a separate contract; empty conditioners are sampling_zero; high-cardinality products refuse. Dirichlet/smoothing remain unlicensed."
evidence_test = "python/tests/test_transport_statistical.py"
evidence_assertion = "test_empirical_table_execution_survives_identification_builder_disposal"

[[routes]]
route = "antecedent.transport.uncertainty_empirical_iid_bootstrap"
stage = "uncertainty"
status = "licensed"
graph = "native_checked_classical_derivation"
evidence = "independent_studies_and_independent_sampling_on_every_estimated_binding"
functional = "pointwise_percentile_intervals_of_the_plugin_functional"
observation = "shared_dataset_replicates_with_failure_accounting"
guarantee = "joint_outer_bootstrap_or_explicitly_unavailable"
limits = "IID independent studies only. Unknown, linked-unit, and clustered dependence keep identification and withhold the interval. Failed replicates are counted; fail_frac>0.5 or <2 successes withhold the interval. Intervals are nominal and pointwise, not simultaneous. Recorded calibration is limited to named 95% mean-interval designs; unbound executions make no execution-specific coverage claim."
coverage = [
  "cov.classical_transport.admg.frequentist.percentile_bootstrap.l95.recursive_frontdoor_nominal_coverage",
  "cov.classical_transport.admg.frequentist.percentile_bootstrap.l95.shared_factor_target_observational_nominal_coverage",
  "cov.classical_transport.admg.frequentist.percentile_bootstrap.l95.source_target_imbalance_standardize_nominal_coverage",
  "cov.classical_transport.admg.frequentist.percentile_bootstrap.l95.weak_overlap_near_empty_conditioner_boundary",
]
evidence_test = "python/tests/test_transport_statistical.py"
evidence_assertion = "test_iid_bootstrap_interval_executes_from_retained_plan_after_builder_disposal"

[[routes]]
route = "antecedent.transport.consume_statistical"
stage = "consume"
status = "licensed"
graph = "native_checked_classical_derivation"
evidence = "embedded_fitted_joints_origin_flags_and_uncertainty_metadata"
functional = "target_interventional_distribution"
guarantee = "independently_checked_embedded_plugin_point"
limits = "Version 2 checks all identities, sample summaries, replicate accounting, pointwise atom/mean intervals and reasoning; recomputes the point without fitting/fetching. Raw samples are required for re-estimation. Earlier statistical artifacts must be regenerated."
evidence_test = "python/tests/test_transport_statistical.py"
evidence_assertion = "test_consume_statistical_rechecks_the_point_and_refreshes_after_builder_disposal"

[[routes]]
route = "antecedent.transport.advanced.identify_classical"
stage = "identify"
status = "licensed"
graph = "selection_admg"
evidence = "classical_complete_source_experimental_family"
functional = "target_interventional_distribution"
observation = "complete_measured_laws"
guarantee = "complete_in_classical_evidence_scope"
reference = "https://arxiv.org/abs/1312.7485v1"
conformance_test = "crates/antecedent-identify/tests/transport_exact_scm.rs"
conformance_assertion = "four_node_branch_conformance_has_no_unchecked_obstructions"
limits = "Complete classical single-source experimental family only; budget exhaustion is inconclusive. No arbitrary finite-catalog or combined-source completeness. The implementation is enumerated on ordered four-node ADMGs with the treatment a root and a single treatment and outcome: negatives are verified as s-hedges, and every identified formula matches an independent latent-SCM oracle in four_node_branch_positives_match_latent_scm_truth under the three Bernoulli parameterizations of the three-node suite wherever a node's conditional probability stays inside [0, 1]. The same oracle covers every three-node selection graph with the treatment at v(0) or v(1) and chosen four- and six-node families. Multiple outcomes and larger general graphs are not enumerated."
evidence_test = "python/tests/test_transport_exact.py"
evidence_assertion = "test_classical_checked_program_and_catalog_proof_survive_graph_builder_disposal"

[[routes]]
route = "antecedent.transport.evaluate_exact"
stage = "evaluate"
status = "licensed"
graph = "native_checked_classical_derivation"
evidence = "available_joint_catalog_laws_and_validated_finite_discrete_tables"
functional = "full_target_distribution_numeric_means_and_contrasts"
observation = "exact_laws_with_required_denominator_support"
guarantee = "exact_law_evaluation_without_sampling_uncertainty"
limits = "Three bounded catalog strategies; checked irrelevant-zero rule; explicit support and resource failures. No sampling uncertainty or arbitrary finite-catalog completeness."
evidence_test = "python/tests/test_transport_exact.py"
evidence_assertion = "test_evaluate_exact_executes_the_retained_program_after_builder_disposal"

[[routes]]
route = "antecedent_estimate.evaluate_exact_z_transport"
stage = "evaluate"
status = "licensed"
graph = "four_node_surrogate_and_five_node_two_control_recursive_admgs_without_selection_targets"
evidence = "complete_joint_source_do_z_family_and_selected_joint_do_z_law"
functional = "target_interventional_outcome_distribution"
observation = "exact_law_or_empirical_plugin_joint_table"
guarantee = "point_distribution_only_without_sampling_uncertainty"
reference = "https://ftp.cs.ucla.edu/pub/stat_ser/r408.pdf"
limits = "Sound and incomplete single-source TRz within 12 observed and 4 controllable finite discrete variables. A positive formula executes from the joints it cites. A line-11 obstruction is structural in the declared controllable set. Specimens include the four-node surrogate, a five-node two-exchange graph, a non-outcome selection diagram, and a seven-node three-control exchange. Exact laws stay point-only. Two-source complementary combination is licensed separately on antecedent_identify.decide_two_source_z_transport and its factorization routes."
evidence_test = "crates/antecedent-estimate/tests/z_transport_sequential_exchange.rs"
evidence_assertion = "recursive_formula_uses_two_source_exchange_factors_and_matches_exact_scm_truth"

[[routes]]
route = "antecedent_estimate.evaluate_exact_z_transport.empirical_plugin_point"
stage = "evaluate"
status = "licensed"
graph = "registered_four_node_surrogate_z_transport_graph_without_selection_targets"
evidence = "cited_joint_source_do_z_margin_with_empirical_counts"
functional = "target_interventional_outcome_distribution"
observation = "empirical_plugin_joint_table"
guarantee = "nominal_percentile_bootstrap_without_coverage_record"
reference = "https://ftp.cs.ucla.edu/pub/stat_ser/r408.pdf"
limits = "When every cited law carries empirical counts, resample each cited law's counts as its own multinomial table (one draw per law and replicate, not the classical joint outer bootstrap over shared datasets) and publish an equal-tail percentile interval. The interval reason is estimator_grid_not_measured. Exact laws stay point-only. Dependence the classical empirical path refuses stays refused. The fixture checks that the exact point lies inside the nominal interval; that is not a coverage measurement."
evidence_test = "crates/antecedent-estimate/tests/z_transport_cited_evidence.rs"
evidence_assertion = "empirical_cited_margin_publishes_a_nominal_interval_around_the_exact_point"

[[routes]]
route = "antecedent.transport.advanced.identify_z_transport"
stage = "identify"
status = "licensed"
graph = "registered_four_node_surrogate_z_transport_graph_without_selection_targets"
evidence = "complete_joint_source_do_z_family_and_bound_provider_snapshot"
functional = "target_interventional_outcome_distribution"
observation = "exact_law_or_empirical_plugin_joint_table"
guarantee = "sound_incomplete"
reference = "https://ftp.cs.ucla.edu/pub/stat_ser/r408.pdf"
limits = "Single-source TRz identification within 12 observed and 4 controllable variables, sound and incomplete. The registered surrogate factorization is retained. Other in-bound graphs, including an admissible selection diagram, publish the recursive derivation. A catalog decision identifies from cited joints. A line-11 obstruction is structural in the declared controllable set. Every decision outcome exposes structured inspection, not only a reason string: an identified proof carries its factor obligations, missing evidence names the unbound cited factor, a not-certified outcome carries a typed reason and the recursive rules the search explored (no proof graph is fabricated when the search built no expression), a line-11 obstruction carries its terminal record, and a budget or cancellation is a limits receipt naming the limits in force, which budget tripped, and what the search consumed rather than an opaque exhausted status."
evidence_test = "python/tests/test_transport_z.py"
evidence_assertion = "test_z_transport_identification_proof_and_binding_survive_query_disposal"

[[routes]]
route = "antecedent.transport.advanced.ZTransportStage.prepare_exact"
stage = "prepare"
status = "licensed"
graph = "registered_four_node_surrogate_z_transport_graph_without_selection_targets"
evidence = "complete_joint_source_do_z_family_and_bound_provider_snapshot"
functional = "target_interventional_outcome_distribution"
observation = "exact_law_or_empirical_plugin_joint_table"
guarantee = "checked_graph_specific_prepared_point_route"
limits = "Preparation compiles exact or empirical plugin tables against the checked zTR proof. A nominal percentile interval is attached later, at estimate, only when every cited law has counts."
evidence_test = "python/tests/test_transport_z.py"
evidence_assertion = "test_z_transport_prepare_exact_compiles_a_checked_plan_after_builder_disposal"

[[routes]]
