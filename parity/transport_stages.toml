functional = "target_interventional_outcome_distribution"
observation = "exact_law_or_empirical_plugin_joint_table"
guarantee = "point_distribution_only_without_sampling_uncertainty"
reference = "https://arxiv.org/abs/1309.6842"
limits = "Sound and incomplete single-source TRz within 12 observed and 4 controllable finite discrete variables. A positive formula executes from the joints it cites. A line-11 obstruction is structural in the declared controllable set. Specimens include the four-node surrogate, a five-node two-exchange graph, a non-outcome selection diagram, and a seven-node three-control exchange. Exact laws stay point-only. Cross-source combination is a separate closed claim."
evidence_test = "crates/antecedent-estimate/tests/z_transport_sequential_exchange.rs"
evidence_assertion = "recursive_formula_uses_two_source_exchange_factors_and_matches_exact_scm_truth"

