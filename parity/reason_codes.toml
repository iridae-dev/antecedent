# Closed exemption vocabulary. Adding a code or raising max_uses is a
# reviewed change to this file. Lowering max_uses is free.
# max_uses is the reviewed live count; the schema gate's --print-counts
# reprints the uses so this file can be tightened, never guessed up.

[[code]]
id = "no_interval_reported"
applies_to = ["calibration"]
meaning = "The cell reports no interval; nothing to calibrate."
max_uses = 6
# Eligibility: a licensed cell may cite this code only for these queries,
# which report a point quantity without a sampling interval.
queries = ["Counterfactual", "NestedCounterfactualEffect", "AnomalyAttribution", "ChangeAttribution", "AverageEffect", "InterventionResponse", "InterventionalDistribution", "PathSpecificEffect", "ResponseCurve", "TransportQuery", "TemporalConditionalPulse", "TemporalConditionalSustained", "AverageDerivative", "PointDerivative", "Elasticity", "SemiElasticity", "DirectionalDerivative", "ResponseJacobian"]

[[code]]
id = "boundary_record"
applies_to = ["calibration"]
meaning = "The cell lists the coverage records that measured it, but every record at the reported level is a named boundary or missed its nominal band at one of its sample-size grid points; none is a nominal pass anywhere in its measured range. Stated beside the calibration list, and only then."
max_uses = 36

[[code]]
id = "estimator_grid_not_measured"
applies_to = ["calibration"]
meaning = "No coverage record measured this construction (query, graph class, structure, inference, estimator, interval method, SE kind, dependence, posterior, functional)."
# Raised when the temporal point routes (cross-world, derivative, conditional, attribution,
# contemporaneous-projection ADMG) began reporting an interval with no coverage record.
max_uses = 257

[[code]]
id = "interval_level_not_measured"
applies_to = ["calibration"]
meaning = "Records measured this construction, but not at the level the execution reported its interval at."
max_uses = 0

[[code]]
id = "identification_not_measured"
applies_to = ["calibration"]
meaning = "Records measured this construction under the other identification label; a partially identified answer is not covered by a point-identified measurement."
max_uses = 0

[[code]]
id = "sample_size_outside_measured_range"
applies_to = ["calibration"]
meaning = "The execution's row count lies outside every measured row-count range (the span of a record's sample-size grid points) for this construction; a range is never extrapolated."
max_uses = 0

[[code]]
id = "resampling_replicates_below_measured"
applies_to = ["calibration"]
meaning = "Fewer resampling replicates succeeded than the record measured."
max_uses = 0

[[code]]
id = "posterior_draws_below_measured"
applies_to = ["calibration"]
meaning = "Fewer posterior draws than the record measured."
max_uses = 0

[[code]]
id = "unidentified_mass_above_measured"
applies_to = ["calibration"]
meaning = "More structural mass is not identified than the record measured."
max_uses = 0

[[code]]
id = "calibration_basis_missing"
applies_to = ["calibration"]
meaning = "The claim carries no calibration match basis to re-derive its slot from."
max_uses = 0

[[code]]
id = "data_modality_not_licensed"
applies_to = ["python_product", "runtime_refusal"]
meaning = "The query is not licensed on this data modality (tabular, series, event, panel, multi-environment)."
max_uses = 7

[[code]]
id = "option_not_applicable"
applies_to = ["python_product", "runtime_refusal"]
meaning = "The option has no meaning for the selected route, so it is refused rather than ignored."
max_uses = 1

[[code]]
id = "construction_not_licensed"
applies_to = ["python_product", "runtime_refusal"]
meaning = "The coordinate is licensed for one named construction (TransportQuery: a mean ResponseCurve transported by Direct or S-admissible trial-to-target IPW; InterferenceQuery: NeighborCount exposure under Bernoulli assignment). Other constructions refuse on the licensed estimator; a separately identified off-axis estimator may execute without inheriting its license or calibration."
max_uses = 0

[[code]]
id = "validators_not_applicable"
applies_to = ["runtime_refusal"]
meaning = "Custom validators refute one scalar average effect; this estimand has no such refutation problem."

[[code]]
id = "population_not_estimable"
applies_to = ["runtime_refusal"]
meaning = "The query has no target population to redeclare, or this route estimates the all-observed population only."

[[code]]
id = "prior_transfer_not_hydrated"
applies_to = ["runtime_refusal"]
meaning = "This route fits under the isotropic prior scale and does not hydrate a transferred prior."

[[code]]
id = "prior_dimension_mismatch"
applies_to = ["runtime_refusal"]
meaning = "A banked posterior's coefficient count does not match the target design's, so its coefficients cannot be mapped one-to-one onto a prior."

[[code]]
id = "likelihood_not_supported"
applies_to = ["runtime_refusal"]
meaning = "The Bayesian route fits a Gaussian identity-link model only, or cannot carry a transferred prior onto a non-Gaussian link; a Bernoulli or Poisson likelihood is refused rather than fitted as Gaussian."

[[code]]
id = "posterior_draws_below_supported"
applies_to = ["runtime_refusal"]
meaning = "A posterior draw count below the supported minimum of the backend was requested under draw controls. The refusal names the minimum; the count is never rewritten."

[[code]]
id = "posterior_draws_not_converged"
applies_to = ["runtime_refusal"]
meaning = "Under draw controls the Monte Carlo standard error of an interval endpoint exceeds the accepted fraction of the interval width, because the draws (too few, or autocorrelated by a sampler that mixes poorly) rather than the posterior set the endpoints. The refusal names the endpoint errors, the effective draws and the tolerance."

[[code]]
id = "stage_stream_unavailable"
applies_to = ["runtime_refusal"]
meaning = "The route fits its point and uncertainty together, or mixes identifications, so it has no progressive stages."

[[code]]
id = "cancelled_no_claim"
applies_to = ["runtime_refusal"]
meaning = "Estimation was cancelled before a claim existed; export is refused."

[[code]]
id = "not_executed"
applies_to = ["runtime_refusal", "calibration"]
meaning = "The study has not been executed; there is no claim or calibration slot."
max_uses = 0

[[code]]
id = "row_weights_bound_to_snapshot"
applies_to = ["runtime_refusal"]
meaning = "A RowWeights population may re-execute only on its own data snapshot."

[[code]]
id = "mechanism_fit_not_converged"
applies_to = ["runtime_refusal"]
meaning = "A parent-conditional categorical mechanism did not converge even on standardized parent columns; the remaining causes are near-separation or collinear parents, which the caller resolves by dropping or coarsening them."

[[code]]
id = "attested_not_reverifiable"
applies_to = ["runtime_refusal", "claim"]
meaning = "Caller-attested evidence (custom validators or an external estimate) is not re-verified on load."
max_uses = 0

[[code]]
id = "treatment_support_too_discrete"
applies_to = ["runtime_refusal"]
meaning = "A local-polynomial response in the treatment needs more distinct treatment values carrying kernel weight at an evaluation point than the treatment has there; a binary or few-level treatment is answered by AverageEffect or InterventionResponse instead."

[[code]]
id = "rd_assignment_not_sharp"
applies_to = ["runtime_refusal"]
meaning = "A sharp regression-discontinuity design declares treatment = 1{running variable >= cutoff}; the treatment column breaks that rule (or is not 0/1), so the outcome jump is not the effect of the treatment and is not reported as one."

[[code]]
id = "estimator_inference_mismatch"
applies_to = ["runtime_refusal"]
meaning = "The selected estimator does not implement the requested inference mode on this query, so it is refused rather than run under the other mode."

[[code]]
id = "effect_not_identified"
applies_to = ["runtime_refusal"]
meaning = "The question has no identified estimand under the declared structure; the refusal carries the identification status and whether the search was complete or capped."

[[code]]
id = "cross_world_not_identified"
applies_to = ["runtime_refusal"]
meaning = "A nested counterfactual query requires cross-world assumptions or graph semantics outside the explicitly licensed shared-exogenous contract."

[[code]]
id = "score_table_unavailable"
applies_to = ["runtime_refusal"]
meaning = "Retargeting reweights a prepared score table, and this study prepared none."

[[code]]
id = "refutation_not_applicable"
applies_to = ["runtime_refusal"]
meaning = "The requested refutation suite has no state to refute for this estimand."

[[code]]
id = "cell_not_licensed"
applies_to = ["runtime_refusal"]
meaning = "The support-matrix cell is refused: it is neither licensed nor not-applicable."

[[code]]
id = "cell_not_applicable"
applies_to = ["runtime_refusal"]
meaning = "The support-matrix cell does not denote for this query, structure, inference and validation."

[[code]]
id = "route_not_supported"
applies_to = ["runtime_refusal"]
meaning = "No execution route implements this combination of query, structure, data and options."

[[code]]
id = "quantity_semantics_mismatch"
applies_to = ["runtime_refusal"]
meaning = "A supplied scientific quantity differs from the expected stable variable, units, population, regime, horizon, functional, conditioning or transform. No implicit conversion or causal equivalence is inferred."

[[code]]
id = "distribution_meaning_mismatch"
applies_to = ["runtime_refusal"]
meaning = "The randomness in supplied draws does not match the operation's required distribution meaning, such as a posterior over a mean offered as an interventional outcome law."

[[code]]
id = "external_capability_missing"
applies_to = ["runtime_refusal"]
meaning = "An external scientific object lacks the exact operation required by the request; approximation requires a separately licensed error and replicate receipt."

[[code]]
id = "external_verification_failed"
applies_to = ["runtime_refusal"]
meaning = "An external object failed normalization, support, moment, seed, update or exact-request fingerprint verification."

[[code]]
id = "external_binding_mismatch"
applies_to = ["runtime_refusal"]
meaning = "An external result or receipt does not match the identified causal contract, scientific quantity, snapshot or provider request being bound."

[[code]]
id = "decision_contract_unsatisfied"
applies_to = ["runtime_refusal"]
meaning = "A decision action or requested functional cannot satisfy its hard constraint, admissibility, structural policy, support or scientific input contract."

[[code]]
id = "inverse_functional_unsupported"
applies_to = ["runtime_refusal"]
meaning = "An inverse decision request needs a forward law, functional, finite action support or joint alignment that the supplied claim cannot provide."

[[code]]
id = "design_signal_invalid"
applies_to = ["runtime_refusal"]
meaning = "A candidate signal or update is incoherent with the prior, candidate, observation regime, action set or source lineage."

[[code]]
id = "design_cost_units_mismatch"
applies_to = ["runtime_refusal"]
meaning = "Study cost has no declared compatible conversion to the decision's utility units, so net value and cost-aware ranking refuse."

[[code]]
id = "joint_law_required"
applies_to = ["runtime_refusal"]
meaning = "Covariance or nonlinear joint integration requires aligned realizations from one joint law; separate marginal draws cannot be paired by array index."

[[code]]
id = "unknown_strategy"
applies_to = ["runtime_refusal"]
meaning = "The estimator or identifier id is not in the closed strategy table."

[[code]]
id = "strategy_incompatible"
applies_to = ["runtime_refusal"]
meaning = "The identifier and estimator (or query and estimator) do not form a compatible pair."

[[code]]
id = "required_option_missing"
applies_to = ["runtime_refusal"]
meaning = "The selected route needs a companion option the call did not supply."

[[code]]
id = "unknown_variable"
applies_to = ["runtime_refusal"]
meaning = "A named variable is not in the data schema."

[[code]]
id = "graph_invalid"
applies_to = ["runtime_refusal"]
meaning = "The supplied structure is not a valid graph of its class (for example a directed cycle)."

[[code]]
id = "schema_mismatch"
applies_to = ["runtime_refusal"]
meaning = "The data do not have the schema the structure or prepared study was built on."

[[code]]
id = "invalid_argument"
applies_to = ["runtime_refusal"]
meaning = "An argument has the wrong type, shape or value for this entry point."

[[code]]
id = "transport_missing_evidence"
applies_to = ["runtime_refusal"]
meaning = "A required available transport regime or provider input is absent. Distinct from not_certified and from a verified impossibility witness."

[[code]]
id = "transport_not_certified"
applies_to = ["runtime_refusal"]
meaning = "No implemented sound transport rule applies. Historical NotCertified meaning; not a proof of non-transportability. The outcome kind of the same state is spelled `not_certified` (TransportOutcomeKind::NotCertified, the one owner of that literal); this code is the refusal-reason spelling and the two vocabularies never mix."
max_uses = 2

[[code]]
id = "transport_proven_non_transportable"
applies_to = ["runtime_refusal"]
meaning = "A checked impossibility witness for the named transport theorem family."

[[code]]
id = "transport_missing_provider"
applies_to = ["runtime_refusal"]
meaning = "A statistical provider required by a certified transport factor is absent."

[[code]]
id = "transport_unsupported_evaluator"
applies_to = ["runtime_refusal"]
meaning = "The transport formula is identified but this evaluator does not run it."
max_uses = 6

[[code]]
id = "transport_support_failure"
applies_to = ["runtime_refusal"]
meaning = "A stage-specific transport support coordinate failed."

[[code]]
id = "transport_numerical_failure"
applies_to = ["runtime_refusal"]
meaning = "Transport evaluation failed numerically after a certified formula."

[[code]]
id = "transport_budget_cancel"
applies_to = ["runtime_refusal"]
meaning = "A transport identify or evaluate budget was exhausted; this is not an impossibility claim."

[[code]]
id = "transport_policy_required"
applies_to = ["runtime_refusal"]
meaning = "A prior transport was requested for differing source and target populations without a TransportPolicy; the library will not assume the populations are exchangeable."

[[code]]
id = "transport_source_count_mismatch"
applies_to = ["runtime_refusal"]
meaning = "The number of transported source priors does not match the number of source populations supplied."

[[code]]
id = "transport_invalid_weights"
applies_to = ["runtime_refusal"]
meaning = "Transport weights are not finite, non-negative and normalisable."

[[code]]
id = "transport_unknown_policy"
applies_to = ["runtime_refusal"]
meaning = "A TransportPolicy wire name is not one the library defines."

[[code]]
id = "transport_coef_index_out_of_range"
applies_to = ["runtime_refusal"]
meaning = "A coefficient index passed to a transport reweighting is outside the prior's dimension."

# Reason codes of the promotion records (parity/promotion.toml). Registered before any route returns them.
[[code]]
id = "sampling_dependence_unknown"
applies_to = ["runtime_refusal"]
meaning = "The point is retained but its interval is withheld: sampling dependence between the studies or units it combines is undeclared, and independence is never assumed."

[[code]]
id = "sampling_weights_invalid"
applies_to = ["runtime_refusal"]
meaning = "Declared sampling weights are not a valid weighted population: a weight is negative, NaN or infinite, every weight is zero, no analysed row has a positive weight, or the declaration does not cover the table's rows. The refusal names the first offending weight."

[[code]]
id = "scenario_aggregate_not_licensed"
applies_to = ["runtime_refusal"]
meaning = "An inferential statement across structural scenarios that share data was requested; only per-scenario results and structural envelopes are licensed."

# Preflight (parity/promotion.toml carries no record: diagnostics add no inferential claim).
[[code]]
id = "design_rank_deficient"
applies_to = ["runtime_refusal"]
meaning = "The adjustment design is numerically rank deficient (an exact duplicate or linear dependency among its columns), so regression-based nuisance fits would refuse it; the refusal names the dependent columns and the rank."

[[code]]
id = "rank_drop_not_licensed"
applies_to = ["runtime_refusal"]
meaning = "An opt-in rank-deficiency drop would remove a column the query needs (a treatment, outcome or effect modifier) or the declared column priority does not cover the design; nothing is dropped."

[[code]]
id = "arm_not_populated"
applies_to = ["runtime_refusal"]
meaning = "A treatment arm or joint cell has no complete-case rows, so no contrast against it is estimable; the refusal names the arm and its counts."

# Penalized AIPW (promotion record: aipw.penalized_propensity in parity/promotion.toml).
[[code]]
id = "penalized_interval_not_licensed"
applies_to = ["runtime_refusal"]
meaning = "A factorized joint-cell propensity with penalized conditional models publishes cell points and a score table only; its nuisance remainder and interval coverage have not been licensed, so a requested interval is refused. The separately calibrated ridge/lasso AIPW route has its own interval contract."

[[code]]
id = "selection_inference_not_licensed"
applies_to = ["runtime_refusal"]
meaning = "The nuisance learner selects variables from the data (lasso), which changes the inference contract; an ordinary influence-function interval is not valid after selection, so the option is closed."

[[code]]
id = "nuisance_fallback_not_licensed"
applies_to = ["runtime_refusal"]
meaning = "A declared fallback from a failed GLM nuisance fit to a flexible learner has no support or uncertainty license on this route; the failed fit is reported and no fallback result is produced."

# Factorized joint cells and derived treatments (promotion record: estimate.factorized_joint_cells).
[[code]]
id = "joint_cell_unsupported"
applies_to = ["runtime_refusal"]
meaning = "One discrete joint treatment cell cannot be evaluated (a conditional factor or outcome model is unsupported, or the cell's weights have too small an effective sample); the cell is refused individually with its reason and the rest of the family is kept."

[[code]]
id = "derived_treatment_invalid"
applies_to = ["runtime_refusal"]
meaning = "A derived-treatment declaration is inconsistent, a constituent column or forbidden descendant sits in the adjustment set without a declared causal exclusion rule, or an observed value is outside the declared legal values; nothing is dropped to repair it."

[[code]]
id = "ml_nuisance_not_licensed"
applies_to = ["runtime_refusal"]
meaning = "A machine-learning nuisance was declared for joint cells in a way no record licenses: an interval or joint covariance over learner-supplied nuisances (which need their own remainder and coverage license), or a machine-learning name that is not a declared joint-cell learner; refused rather than silently replaced by the ridge-logistic factors."

# Clustered DML (promotion record: estimate.clustered_dml_aipw).
[[code]]
id = "cluster_interval_not_licensed"
applies_to = ["runtime_refusal"]
meaning = "Cluster-DML AIPW refuses a requested row bootstrap or alternative analytic SE kind: the row bootstrap would split clusters, and neither requested construction has a coverage license. The default one-way cluster t interval has its own measured coordinate."

[[code]]
id = "too_few_clusters"
applies_to = ["runtime_refusal"]
meaning = "The number of independent clusters is below the declared minimum, so a sandwich over cluster sums and a whole-cluster cross-fit are not formed; the refusal states the count found and the minimum declared."

[[code]]
id = "dyadic_dependence_not_licensed"
applies_to = ["runtime_refusal"]
meaning = "Rows share endpoints (dyads) in a structure the two-way cluster-DML construction does not cover: an entity used as both a first and a second endpoint, or one connected component of the endpoint graph holding more than a fold's share of the rows, so whole-component folds and the two-way variance are not licensed."

# Tier diagnostics (promotion record: tier_diagnostics in parity/promotion.toml).
[[code]]
id = "diagnostic_not_available"
applies_to = ["runtime_refusal"]
meaning = "A diagnostic is requested that the executed route's own design does not carry (no propensity score, an E-value that embeds an interval endpoint, a result with no single effect); it is reported absent with this code and a detail, never fabricated and never refit from a different design."

# Mechanism composition (promotion record: mechanism_composition in parity/promotion.toml).
[[code]]
id = "mechanism_composition_incoherent"
applies_to = ["runtime_refusal"]
meaning = "Independently fitted mechanisms do not establish one coherent joint law: a support gap between a producer and its consumer, a conditioning set that is not the parent set, a dropped or unloaded shared latent cause, misaligned or contradicted parameter uncertainty, missing mechanism provenance, mixed families, or a mechanism outside the bounded composition family. The detail names the defect and the refusal states the declaration that would license the composition."

# Mechanism selection (candidate sets, per-node constraints, validation splits).
[[code]]
id = "mechanism_candidates_invalid"
applies_to = ["runtime_refusal"]
meaning = "A mechanism candidate list, per-node family constraint or validation-split declaration cannot be honoured: an unknown family or alias, an empty list, a variable outside the model, two constraints on one variable, a family both required and excluded or outside the allowed list, a required family of the wrong outcome type, or time-ordered or clustered splits the rows cannot support. Raised before any family is fit; the message names the node and the defect."

[[code]]
id = "mechanism_family_unavailable"
applies_to = ["runtime_refusal"]
meaning = "A family a node requires could not be scored or fit on that node (a tree ensemble on a root or on fewer rows than it needs, a provider that is not compiled in, a fit that failed on every fold). The message names the node, the family and its failure; the other candidates' scores are not used to substitute another family."

# Evidence ledger (promotion records: evidence_ledger.* in parity/promotion.toml).
[[code]]
id = "evidence_double_counted"
applies_to = ["runtime_refusal"]
meaning = "A combination of evidence would count the same observations more than once: a duplicate, a transform, a prior built from the likelihood's data, an external claim built from data already used, shared rows declared independent, a source listed twice, or one source counted both as native target data and as transported evidence. The refusal names the sources and the covariance, assumption range or dropped source that would license the request."

[[code]]
id = "evidence_overlap_unknown"
applies_to = ["runtime_refusal"]
meaning = "The observations behind two pieces of evidence are not declared, so their overlap is unknown; independence is never assumed. The refusal states the row-level declaration, covariance with cross terms or assumption range that would license the request."

[[code]]
id = "evidence_source_withdrawn"
applies_to = ["runtime_refusal"]
meaning = "A request rests on an evidence source, or on a result, that was withdrawn, superseded, replaced or updated after it was registered. The original is preserved; the refusal names the retired source and its successor where one exists."

# Measurement models (promotion records: measurement.* in parity/promotion.toml).
[[code]]
id = "measurement_model_invalid"
applies_to = ["runtime_refusal"]
meaning = "A measurement model is not well formed: a blank identity, an observed column given an error model, parameters of another route, or a parameter outside its range. The refusal names the field and the declaration that would make the model well formed."

[[code]]
id = "proxy_offered_as_construct"
applies_to = ["runtime_refusal"]
meaning = "A noisy or misclassified indicator, a probabilistic feature assignment, a learned vector representation or a derived column was offered as the latent scientific construct, or the measured column was named as the construct without a measurement model. The refusal states the measurement model that would relate the proxy to the construct."

[[code]]
id = "measurement_binding_mismatch"
applies_to = ["runtime_refusal"]
meaning = "A measurement model, or an artifact built from one, is applied outside the population, regime or arm it was established for, names a different construct, or differs from the model identity the consumer retained. Nothing is carried across: the refusal names the expected and supplied binding and the invariance premise or re-established model that would license the request."

[[code]]
id = "representation_mapping_required"
applies_to = ["runtime_refusal"]
meaning = "A representation changed coordinate system or version without an explicit mapping, a mapping does not run between the two versions, or causal or intervention meaning was requested through a mapping that carries values only (or for the coordinates of a learned vector representation). The refusal names the mapping or intervention-preservation evidence that would license it."

[[code]]
id = "differential_error_not_pooled"
applies_to = ["runtime_refusal"]
meaning = "Measurement error declared to differ by arm, population or time was sent through the non-differential route, a non-differential model was analysed as differential, a declared structure disagrees with its parameter layout, or the declared axis has no bounded route. The two cases are never pooled; the refusal states the structure declaration and per-arm parameters that would license the request."

[[code]]
id = "measurement_not_identified"
applies_to = ["runtime_refusal"]
meaning = "The measurement correction is not identified at the declared bound: Youden's index at or below its minimum, implied reliability at or below its floor, a confusion matrix singular or worse conditioned than declared, too few replicated units or posterior draws, or a corrected variance that is not positive. The refusal states the bound and the evidence (a more accurate indicator, replicates, a larger validation sample) that would identify it."

[[code]]
id = "measurement_posterior_not_trusted"
applies_to = ["runtime_refusal"]
meaning = "A latent-variable posterior supplied by an external provider cannot be consumed: its object or request identity differs from the model's reference, it is not a parameter posterior over the construct in the model's population and regime, it declares no sampling operation, or it claims native trust. Trust is never inferred from metadata; the refusal states the verification or attestation that would license consumption."

# Scientific bridges (promotion records: scientific_bridge.* in parity/promotion.toml).
[[code]]
id = "scientific_bridge_invalid"
applies_to = ["runtime_refusal"]
meaning = "A bridge between scientific quantities is not well formed: a blank or oversized identity or statement, a quantity with an incomplete coordinate, a class pair the bridge kind does not connect, a mapping the kind does not allow, a duplicated assumption identity, a non-finite or malformed mapping number, a transportability premise declared where nothing is transported. The refusal names the field and the declaration that would make the bridge well formed."

[[code]]
id = "bridge_assumption_missing"
applies_to = ["runtime_refusal"]
meaning = "A bridge rests on an assumption that is not declared, or that names no evidence: the kind's principal assumption (measurement model, behavioral linkage, surrogate validation, identification, parameter interpretation, utility mapping), or the transportability premise when the bridge's evidence was established for another population or regime than the claim's. The refusal names the assumption kind and the identity or evidence that would license the bridge."

[[code]]
id = "bridge_substitution_refused"
applies_to = ["runtime_refusal"]
meaning = "One scientific quantity was offered as another that it is not: an association as an intervention, a stated preference as realized behavior, a predictive importance as a causal effect, a model score as a probability, a scientific endpoint as a utility, or a mean, predictive law, posterior, identified set or joint outcome law where another of those objects is required. These are not interchangeable and no bridge relaxes that; the refusal names both and the declaration or route that would license the request."

[[code]]
id = "bridge_binding_mismatch"
applies_to = ["runtime_refusal"]
meaning = "The parts of a bridge disagree: the claim is about another quantity, units, population, regime, horizon or conditioning than the contract's source; the source and target differ in population, or in regime where a regime change is not part of the bridge kind; the measurement model names other variables, another identity or another population and regime than the bridge's evidence scope; or the transportability premise is for another transport. The refusal names the expected and supplied coordinates."

[[code]]
id = "bridge_mapping_not_licensed"
applies_to = ["runtime_refusal"]
meaning = "A bridge's mapping cannot carry this value: fewer validation trials than declared, a trial-level coefficient of determination below the declared minimum, validation effects that do not vary, a surrogate effect outside the range the validation trials covered (no extrapolation), a recorded prevalence outside the attainable range of the declared misclassification rates, or a functional or scale the correction does not invert. The refusal states the declared bound and the evidence that would license the value."

[[code]]
id = "candidate_search_record_required"
applies_to = ["runtime_refusal"]
meaning = "A ranking, optimality or selection-aware statement was requested over candidates that an adaptive search produced, and no search record names the generator, its budget, the number of candidates evaluated and the selection rule. Retained candidates alone would silently condition the claim on a search it does not describe; the refusal states the record that would license the request."

[[code]]
id = "validation_stream_not_independent"
applies_to = ["runtime_refusal"]
meaning = "A held-out or split re-evaluation of a selected decision uses draws that overlap, or are not separated from, the draws that selected it (the same stream coordinates, or an overlapping or too-close range of one stream), so it cannot correct selection bias. The refusal names both segments and the independent stream or gap that would license the request."

[[code]]
id = "uncertainty_components_not_combined"
applies_to = ["runtime_refusal"]
meaning = "One combined uncertainty number was requested for a sampled or selected decision. Source-distribution spread, Monte Carlo error and selection-induced uncertainty are reported separately and never summed; a combined statement is a whole-procedure claim that needs a calibration at the coordinate (candidate-set size, Monte Carlo budget, selection rule)."

# Observation-conditioned queries (promotion records: observation_query.* in parity/promotion.toml).
[[code]]
id = "evidence_cannot_reach_level"
applies_to = ["runtime_refusal"]
meaning = "A posterior or decision probability cannot be moved to the declared level by any admissible evidence: the declared signal does not move the probability in that direction, no observed level of the signal crosses it, or reaching it needs more observations than the declared bound. The refusal states the level asked for and the most extreme value that is reachable (a supremum when raising, an infimum when lowering), and what would license a different answer."

# Sequential decision evaluation (promotion records: sequential_evaluation.* in parity/promotion.toml).
[[code]]
id = "history_support_violated"
applies_to = ["runtime_refusal"]
meaning = "A supplied policy takes an action, with positive probability, in a reachable history where the action has no support (a positivity violation): the model declares no support for it there, or the logging policy that generated the logged data has probability zero or no declared decision there, or no logged trajectory is consistent with the target policy so every importance weight is zero. The value of the policy is not identified by extrapolating across the gap; the refusal names the history, the action and the support declaration or logged coverage that would license the evaluation."

# Adaptive-experiment inference (promotion records: adaptive_inference.* in parity/promotion.toml).
[[code]]
id = "adaptive_contract_incomplete"
applies_to = ["runtime_refusal"]
meaning = "Inference from an adaptive experiment is requested but an element of its retained analysis contract is missing: the assignment-policy history, the realized assignment probabilities, the exposure history, outcome availability and delay, the interim analyses or the stopping rule. One detail names each missing element; nothing is defaulted and the final sample is never analysed as if the design were fixed."

[[code]]
id = "adaptive_design_ignored"
applies_to = ["runtime_refusal"]
meaning = "An analysis that presumes a design fixed in advance (fixed sample size, fixed assignment, no stopping rule) is requested for data collected under an adaptive assignment policy, interim monitoring or a stopping rule. The refusal names the adaptive-design routes that account for the design."

[[code]]
id = "adaptive_assumption_violated"
applies_to = ["runtime_refusal"]
meaning = "An assumption an adaptive-experiment route rests on fails in the retained history: units received an arm other than the one assigned, outcome availability depends on the outcome, or an estimand arm had assignment probability below the declared floor. Nothing is clipped, dropped or imputed; the refusal names the declaration or model that would license the request."

# Scientific interface contracts (promotion records: interface_contract.* in parity/promotion.toml).
[[code]]
id = "interface_contract_invalid"
applies_to = ["runtime_refusal"]
meaning = "An interface contract, or a composition of components, is not well formed: a blank or oversized identity, a quantity with an incomplete coordinate, a support domain with unordered bounds or unsorted levels, a port with no operation, an uncertainty meaning missing where an interval, law, draws, covariance or posterior is declared (or stated where none is), a point-only label beside an uncertainty statement, a measured calibration label with no record, a calibration declared inherited from an input the component does not consume, a measurement-model or evidence-source identity that is not a 64-character hex digest, an unknown provenance stage, a duplicated port or component, a connection naming an unknown component or port, a consumed port fed twice, or a composition over the declared bound. The refusal names the field and the declaration that would make the contract well formed."

[[code]]
id = "interface_contract_quantity_mismatch"
applies_to = ["runtime_refusal"]
meaning = "A produced quantity is not the quantity the consumer declares, although a name, shape or dtype may agree: the variable or role, units, population, intervention regime, causal horizon, functional, conditioning events, transform, semantic identity or support domain differs. Nothing is converted or reinterpreted; the refusal names the dimension, what the consumer expects and what the producer declares, and the declaration (a checked conversion, a transport of evidence, a bridge) that would license the connection."

[[code]]
id = "interface_contract_assumption_mismatch"
applies_to = ["runtime_refusal"]
meaning = "A connection's declared assumptions disagree: the producer's measurement models are not the ones the consumer requires, the dependence of the producer's evidence is undeclared where the consumer needs it declared, two inputs the consumer requires to be disjoint share an evidence source, or a provenance stage the consumer requires is not supplied. The refusal names the identities involved and the declaration that would license the connection."

[[code]]
id = "interface_contract_operation_unavailable"
applies_to = ["runtime_refusal"]
meaning = "A consumer requires an operation the producer does not offer: a mean where a law is required, a law where draws are required, marginal draws where aligned joint draws are required, an interval where a posterior is required. No operation is derived from another. The refusal names the operation, what the producer offers and what would supply it."

[[code]]
id = "interface_contract_uncertainty_mismatch"
applies_to = ["runtime_refusal"]
meaning = "The producer's interval, posterior, law or draws does not mean what the consumer requires: no uncertainty meaning is declared, the paradigm differs (a posterior is not a sampling distribution, and neither is a bootstrap or an empirical distribution), or the object differs within a paradigm (a posterior over parameters is not a posterior over a causal functional or an outcome). The refusal names the required and declared meanings."

[[code]]
id = "interface_contract_calibration_not_held"
applies_to = ["runtime_refusal"]
meaning = "A consumer relies on measured calibration of its input, or a producer declares its output's calibration inherited from an input, and the calibration is not held: the producer's label is none, point-only or unmeasured, an inherited calibration cannot be resolved from the pair alone, the input it is inherited from is not connected, or the upstream producer does not hold a measured record. Calibration of a component is not calibration of a composition; the refusal names what holds and what would license the reliance."

[[code]]
id = "interface_contract_cyclic_composition"
applies_to = ["runtime_refusal"]
meaning = "The connections of a composition form a cycle: feedback between one component's output and another's input. Cyclic scientific composition is not supported; the loop is refused before any component runs and the refusal names the cycle path. Compose the components feed-forward, or model the loop inside one component's own declared contract."

# Composition verification (promotion record: composition_verification.claim_revalidation in parity/promotion.toml).
[[code]]
id = "claim_revalidation_required"
applies_to = ["runtime_refusal"]
meaning = "A claim rests on an upstream object (data, evidence, a model or representation version, or a structural derivation) that changed after the claim was produced, so its numbers, fit and uncertainty carry no authority until it is recomputed. The refusal names the changed origin; the license for the claim is not withdrawn."

[[code]]
id = "claim_license_withdrawn"
applies_to = ["runtime_refusal"]
meaning = "A claim rests on an upstream object whose license no longer holds: an input that was retired, replaced or removed, coordinates outside the support, a provider whose trust was withdrawn, or a stage that cannot be executed. This is distinct from stale numbers: recomputation alone does not restore the license. The refusal names the origin and the declaration that would restore it."

# Arbitrary law, posterior and nested callbacks (promotion record: provider_callback.protocol in parity/promotion.toml).

[[code]]
id = "callback_protocol_invalid"
applies_to = ["runtime_refusal"]
meaning = "A callback declaration is not well formed: a blank provider, object, version, snapshot or request identity, an operation the callback kind does not answer, a meaning that does not belong to the kind, a posterior update without its candidate, prior and observation or without the observation law, a seeded callback without a semantic stream identity, an idempotent retry without an attempt bound, a nested callback with no callback input, or a trust level metadata cannot confer (native licence). The refusal names the declaration that would make the callback well formed."

[[code]]
id = "callback_reuse_ineligible"
applies_to = ["runtime_refusal"]
meaning = "A stored callback result is not eligible for reuse, or a request cannot be answered without running the callback: a dependency (data, model, file, remote service, environment, closure state) is opaque or undeclared, a stateful callback exposes no state identity through the protocol, or a side-effecting callback has no idempotent retry contract. Without a stable identity the callback is recomputed or the request is refused, never silently reused. The refusal names the declaration that would make reuse sound."

[[code]]
id = "callback_side_effect_forbidden"
applies_to = ["runtime_refusal"]
meaning = "A callback with effects outside the process would be invoked where the protocol forbids it: during planning or verification, without an explicit opt-in in the execution policy, or as a retry outside its declared idempotent contract. The callback is not run. The refusal names the policy or contract that would allow the execution."

[[code]]
id = "callback_output_invalid"
applies_to = ["runtime_refusal"]
meaning = "A callback returned a value the protocol does not accept as an answer of the declared quantity: the wrong shape for the query, a non-finite value, a value outside the declared support, a distribution function outside [0, 1] or decreasing in the threshold, a quantile function decreasing in the level, or a query that is itself malformed. Nothing is repaired, clipped or sorted; the whole answer is refused."

[[code]]
id = "callback_provider_unavailable"
applies_to = ["runtime_refusal"]
meaning = "No compatible provider can answer a callback request in this process: none was supplied for a fresh-process resume, or the provider failed. The historical result stays inspectable and the stage is recorded as unavailable; no claim is issued. The refusal names the provider object, version, snapshot and request, or the declared portable runtime with resolved dependencies, that would license execution."

[[code]]
id = "callback_limit_exceeded"
applies_to = ["runtime_refusal"]
meaning = "A callback request exceeds a declared resource bound: the invocation count, the output size, or the wall-clock bound. The in-process executor enforces the wall-clock bound only after the call returns and discards the late result; a hard preemptible limit needs a declared isolated runtime. The refusal names the bound and the policy field to change."

# Selective discovery (promotion record: discovery.selective_reuse in parity/promotion.toml).
[[code]]
id = "discovered_structure_unresolved"
applies_to = ["runtime_refusal"]
meaning = "A request needs one declared causal graph (a selection diagram, an identification, a transport binding) but was given a discovered structure: an equivalence class with undirected edges or circle endpoints, orientation conflicts, or a search that exhausted a bound. The refusal names every unresolved edge and exhausted bound; the remedy is to resolve or declare the graph, never to pick a representative member of the class."

[[code]]
id = "discovery_statistics_invalid"
applies_to = ["runtime_refusal"]
meaning = "Retained discovery statistics cannot be used: the raw data they were computed from are absent or differ, the contract differs, a receipt is not a usable statistic or does not cover a requested test, or replaying them does not reproduce the recorded result. Statistics are bound to the content they were computed from; the remedy is to rerun discovery on the raw data."

# Design preflight review findings.
[[code]]
id = "near_collinear_column"
applies_to = ["runtime_refusal"]
meaning = "An adjustment column is not an exact linear function of higher-priority columns but leaves almost no residual after projecting them out (uncentered); fits are ill conditioned and nothing is dropped. Review finding from design preflight."

[[code]]
id = "column_separates_arms"
applies_to = ["runtime_refusal"]
meaning = "A single adjustment column separates the treatment arms completely or quasi-completely, so a propensity model saturates; a positivity review finding for human review, not an identification verdict."

[[code]]
id = "adjustment_duplicates_query_variable"
applies_to = ["runtime_refusal"]
meaning = "An adjustment column is an exact copy of a treatment or the outcome; review for a post-treatment or label-leaking column."

[[code]]
id = "duplicate_adjustment_columns"
applies_to = ["runtime_refusal"]
meaning = "Adjustment columns are exact copies of one another, so the design is rank deficient by exactly this duplication."

[[code]]
id = "duplicate_query_columns"
applies_to = ["runtime_refusal"]
meaning = "The treatment and outcome columns are exact copies."

[[code]]
id = "treatment_near_determined_by_adjustment"
applies_to = ["runtime_refusal"]
meaning = "A treatment column is near-deterministically predicted by the adjustment columns (linear R^2 above threshold); review finding."

[[code]]
id = "outcome_near_determined_by_adjustment"
applies_to = ["runtime_refusal"]
meaning = "The outcome column is near-deterministically predicted by the adjustment columns; review finding."

[[code]]
id = "adjustment_column_tracks_treatment"
applies_to = ["runtime_refusal"]
meaning = "A single adjustment column near-deterministically predicts a treatment column; review finding."

[[code]]
id = "adjustment_column_tracks_outcome"
applies_to = ["runtime_refusal"]
meaning = "A single adjustment column near-deterministically predicts the outcome; review finding."

[[code]]
id = "treatment_level_undeclared"
applies_to = ["runtime_refusal"]
meaning = "The treatment column has rows at a level that is none of the levels the estimate declares (the active and control levels of a pairwise contrast, or the declared level set of a full-population generalized-propensity estimate). Dropping those rows would restrict the target population, so the estimate refuses unless the restriction to the rows at the declared levels is declared."

[[code]]
id = "positivity_violated"
applies_to = ["runtime_refusal"]
meaning = "A probability the estimand divides by is not supported by the data or the declaration: a treatment action's propensity, or the probability of remaining uncensored through the declared horizon, is zero or below the declared floor, a policy takes an action outside the declared treatment support, or no unit is followed to the horizon. The refusal names the action, arm or horizon and the smallest probability found."

[[code]]
id = "policy_learned_on_evaluation_rows"
applies_to = ["runtime_refusal"]
meaning = "A treatment policy declared as learned on the rows that would score it. Its value on those rows is estimated too high because the policy was chosen to fit them; the refusal names the two honest evaluations, independent held-out rows and cross-fitted learning."

[[code]]
id = "missing_policy_required"
applies_to = ["runtime_refusal"]
meaning = "A route that has no default for missing values found one and no missing-data policy was declared. Randomized, panel, temporal and NOTEARS routes never delete, weight or restrict rows on their own. The refusal names the first missing cell (column and row) and the policies the route can execute."

[[code]]
id = "missing_policy_not_applicable"
applies_to = ["runtime_refusal"]
meaning = "A declared missing-data policy cannot be executed validly on this route or design: deleting rows would unbalance a panel or compress a time axis, the design (cluster, stratified, factorial, multi-arm, switchback, receipt-adjusted) has no responder-weighted estimator, or the covariates of the observation model are themselves incomplete. The refusal names the policies the route supports."

[[code]]
id = "policy_dependency_circular"
applies_to = ["runtime_refusal"]
meaning = "A value program reads a variable that depends on the node it assigns, directly, through the graph's edges or through other programs' reads, so no evaluation order computes the inputs before the node. The refusal names the cycle and the policies in it."

[[code]]
id = "policy_dependency_unavailable"
applies_to = ["runtime_refusal"]
meaning = "A value program reads a variable it cannot see: a variable absent from the compiled model, a read it did not declare exactly, or the generated value of a node whose mechanism the program replaces (an assignment). The refusal names the policy and the missing or undeclared read."

[[code]]
id = "policy_directive_conflict"
applies_to = ["runtime_refusal"]
meaning = "Two directives on one node have no well-defined composition: two different value programs, a program with a hard set or an additive shift, or an assignment with a stochastic policy or soft mechanism. The refusal names the node and both directives."

[[code]]
id = "policy_output_type_invalid"
applies_to = ["runtime_refusal"]
meaning = "A value program produces a type its node cannot hold: a boolean written to a numeric node without an explicit indicator, or a number that is not a level of a categorical node's support. The refusal names the node and the expression's type."

[[code]]
id = "policy_history_unavailable"
applies_to = ["runtime_refusal"]
meaning = "A value program reads temporal history that the route cannot supply: a lagged read on a static model with no declared history window, a look-back deeper than the route's declared window, a look-back that reaches before the first available step of a temporal rollout, or a look-back of zero steps (a future value does not exist when the policy applies). The refusal names the offending reference and, for a rollout, the step."

[[code]]
id = "policy_route_not_licensed"
applies_to = ["runtime_refusal"]
meaning = "A policy is licensed for some execution routes but not the one requested. Simulation and counterfactual execution accept any valid program; observational identification accepts only programs that reduce to a hard level (a set, or an assignment that folds to a constant). The refusal names the route and the routes the policy is licensed for."

[[code]]
id = "policy_callback_failed"
applies_to = ["runtime_refusal"]
meaning = "A caller-supplied batch callback in a value program raised while it ran (a Python exception, for instance). The refusal carries the callback's own error message and the callback's name; a failure is never turned into a missing value or a default."

[[code]]
id = "policy_callback_output_invalid"
applies_to = ["runtime_refusal"]
meaning = "A batch callback returned an output that violates its declaration: the wrong number of values, a dtype that is not real-valued, a non-finite value, or a value outside the declared support or levels. The refusal names the callback, the first offending row and the declaration."

[[code]]
id = "policy_callback_not_portable"
applies_to = ["runtime_refusal"]
meaning = "A value program contains a callback that is a runtime binding (an in-process function with no verifiable recoverable implementation), so no artifact, identity or wire encoding can carry it. A callback is exportable only when declared with a content digest of its self-contained source and pinned dependency versions that the consumer re-verifies; a dependency declared without a pinned version leaves nothing to verify and is refused the same way. The refusal names the callback."

[[code]]
id = "policy_callback_unrecoverable"
applies_to = ["runtime_refusal"]
meaning = "A recovery record for a callback does not verify against the implementation supplied for replay: the source digest, entry point, input labels, output declaration or a pinned dependency version differs, a pinned dependency is not installed, or no implementation was supplied for a record the artifact carries. The refusal names the callback and the first mismatching field."

[[code]]
id = "route_not_lowered"
applies_to = ["runtime_refusal"]
meaning = "Execution was handed a physical plan that carries no lowered program for its route, or whose lowered program was compiled for a different route. Only `Study::compile` lowers a route; a plan built from a logical record alone cannot be dispatched."

[[code]]
id = "plan_view_unavailable"
applies_to = ["runtime_refusal"]
meaning = "The handle executes no lowered study program (a transport stage or a policy-program handle), so it has no plan view of compiler layers to read."

[[code]]
id = "public_builder_reentry"
applies_to = ["runtime_refusal"]
meaning = "Compile, prepare or one-shot run was called with a context that is already inside the dispatch of a lowered program. A dispatched route executes its retained program and does not build and run another public study."
