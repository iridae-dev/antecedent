The facade modules route their design-crate and model-crate re-exports through two export modules so the calibration surface can name the facet that owns them. Every public path resolves to the same item, and no function body, constant or numeric expression in these files changes. Each certificate binds the exact before and after blobs, and a measured record that runs through the facade is replayed bit for bit.\
"""
