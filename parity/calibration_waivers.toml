# Replay waivers for coverage records (scripts/calibration_facets.py).
#
# A waiver lets a reviewed change that cannot move a measured number stand in
# for a re-measurement, with evidence. It applies to a record only when the
# record was measured at `from`, every attested path in the record's facets
# that changed since is listed in `paths`, and none of them changed after
# `to`. Its evidence is a replay: the `replay` records, measured at `from`,
# re-run at `to` through scripts/gate_calibration.sh and compared bit for bit
# with the stored records. Each `exercises` list names the waived paths that
# record's test runs; together they must cover every path.
#
# Write `id`, `from`, `to`, `reviewed_by`, `justification`, `paths` and the
# `replay` tables by hand, then fill `outcome` by running
#   python3 scripts/calibration_facets.py replay --waiver <id>
# on a clean checkout of `to`. That command rewrites this file; comments other
# than this header are not kept (the justification is the prose).
# `scripts/gate_calibration_attestation.sh` validates every waiver and reports
# the records it covers as `attested_by_replay (waiver <id>)`.

[[waiver]]
id = "response-gradient-hc2-20261005"
from = "b5f585b633b2e021d978f7cb8b433a643085178c"
to = "553aeeb08cce3a1ef0784651c1dfe11ed1a1a45e"
reviewed_by = "Codex call-site review"
justification = """
The change in response/mod.rs computes row leverage and HC2 residuals only in
plugin_gradient_influence, which plugin_gradient_run calls with with_influence
only from plugin_gradient_interval_internal. That interval is compiled behind
calibration-internal and used by the frequentist GAM Jacobian and directional
derivative calibration tests. The directional records are remeasured at the
changed commit, and the Jacobian test has no prior passing records. Other
response estimator paths do not request the changed influence or sandwich SE.
This replay exercises an unchanged public GAM derivative path through the
edited module and checks its stored coverage output bit for bit.\
"""
paths = [
  "crates/antecedent-estimate/src/response/mod.rs",
]

[[waiver.replay]]
record = "cov.average_derivative.dag.frequentist.analytic_se.l90.ade_frequentist_gaussian_treatment_nominal_90_coverage"
exercises = [
  "crates/antecedent-estimate/src/response/mod.rs",
]

[waiver.outcome]
replayed_at = "553aeeb08cce3a1ef0784651c1dfe11ed1a1a45e"
identical = true
records = [
  "cov.average_derivative.dag.frequentist.analytic_se.l90.ade_frequentist_gaussian_treatment_nominal_90_coverage",
]
differences = [
]

[waiver.outcome.fingerprints]
"cov.average_derivative.dag.frequentist.analytic_se.l90.ade_frequentist_gaussian_treatment_nominal_90_coverage" = "cb06f139bf27b22a9d6748b8a034f89410cb1757eba4b82655f86c5d630a05ee"

