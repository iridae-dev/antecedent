justification = """
The gate script gained a case label so two whole-file groups run once per grid point; no group that already ran per grid point is relabelled, and the script changes neither the cargo invocations nor the environment of any measured group. The bayesian_temporal and temporal_frequentist edits add named-boundary values to assertion arrays and persist an info-only tally's raw state; they neither draw replicates nor change a tally. Each replay below re-runs a measured record through the changed script or file and compares every emitted field bit for bit.\
"""
