# Replay waivers for coverage records (scripts/calibration_facets.py).
#
# A waiver lets a reviewed change that cannot move a measured number stand in
# for a re-measurement, with evidence. It applies to a record only when the
# record was measured at `from`, every attested path in the record's facets
# that changed since is listed in `paths`, and none of them changed after
# `to`. Its evidence is a replay: the `replay` records, measured at `from`,
# re-run at `to` through scripts/gate_calibration.sh and compared bit for bit
# with the stored records. Each `exercises` list names the waived paths that
# record's test runs; together they must cover every path.
#
# Write `id`, `from`, `to`, `reviewed_by`, `justification`, `paths` and the
# `replay` tables by hand, then fill `outcome` by running
#   python3 scripts/calibration_facets.py replay --waiver <id>
# on a clean checkout of `to`. That command rewrites this file; comments other
# than this header are not kept (the justification is the prose).
# `scripts/gate_calibration_attestation.sh` validates every waiver and reports
# the records it covers as `attested_by_replay (waiver <id>)`.

[[waiver]]
id = "temporal-and-suite-facets-e2c7b386"
from = "f32ab0c937a67b1e98982a31d5e4b103cecc828e"
to = "7986d77e3d1764e39d052639cae01cfc0d16318a"
reviewed_by = "Charles Hinshaw"
justification = """
Twelve paths drifted the facet hashes of the 703 coverage records measured at
016781a9 without moving any measured number; they fixed other designs or
changed control flow. temporal_response.rs additively retains posterior draws
on the single-coordinate intervention band; temporal_posterior_response.rs
collapses a single-atom DBN-posterior intervention band to scalar (a distinct
path); temporal_path.rs drops those draws before the class pooling (restoring
prior behavior); calibration.rs reorders CoverageTally::assert so a
sub-precision near-miss emits its recheck before the band assert (a control-flow
change to WHEN a recheck fires, not to any coverage value); the eight edited
test suites each changed only specific designs' fixtures or boundary-asserts,
leaving every other design in the file numerically untouched. None touch a seed,
a replicate count, or the interval computation for the covered records. Same
seed, same interval. This cannot move a measured number.\
"""
paths = [
  "crates/antecedent/src/analysis/execute/temporal_path.rs",
  "crates/antecedent/src/analysis/execute/temporal_posterior_response.rs",
  "crates/antecedent/tests/common/calibration.rs",
