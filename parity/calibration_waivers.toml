reviewed_by = "authorized release engineering review"
recordless_gates = false
gate_ledger_commit = ""
justification = """
Changes since the measurement that add routes beside the measured ones without moving a measured number: new modules and their dispatch lines, facade re-export paths, refusal and remedy strings, package manifests that declare the new test targets and the consolidated integration-test layout, and the gate script's added groups and run functions. No existing group's cargo invocation, environment, seed domain or tally changes. The replay re-runs a measured record through the changed script and compares every emitted field bit for bit; each certificate binds the exact before and after blobs.\
"""
paths = [
