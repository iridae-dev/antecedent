# Batch execution preserves the repository's performance requirements. Each benchmark asserts
# its own regression bound (`MAX_REGRESSION`, relative to a baseline measured in the same
# process, so the bound holds on any machine) and its workspace or context reuse, in the
# Criterion `--test` smoke as well as in a full run.
[[performance]]
id = "program_sampling_against_plain_sampling"
package = "antecedent-model"
bench = "policy_sampling"
file = "crates/antecedent-model/benches/policy_sampling.rs"
function = "bench_policy_sampling"

[[performance]]
id = "coalition_replay_against_model_cloning"
package = "antecedent-model"
bench = "noise_replay"
file = "crates/antecedent-model/benches/noise_replay.rs"
function = "bench_noise_replay"

[[performance]]
