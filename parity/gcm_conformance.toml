# Conformance registry for programmable interventions, mechanism selection, graph
# falsification, batch noise replay and intrinsic causal influence.
#
# Every row names one test that must pass in `scripts/gate_gcm_conformance.sh`; the rows are
# executed by `scripts/run_evidence_rows.py` (exactly one test per Rust row, at least one
# per Python row). `scripts/check_gcm_conformance.py` requires every clause below to have
# evidence, every cited test to exist, and every benchmark to be registered and to assert its
# regression bound.

[clauses]
policy_floor_downstream = "price := max(10, 0.85 * price) floors every realized price and its effect reaches every descendant"
policy_route_agreement = "one policy means the same on sampling, counterfactual and temporal routes"
callback_validation = "callback inputs, outputs and failures are validated and reported"
dependency_failures = "circular, unavailable, conflicting and unsupported-history dependencies are refused before any draw"
portability_restrictions = "a policy is licensed route by route and only a recoverable callback has a durable form"
mechanism_selection_known_truth = "nonlinear mechanism selection recovers the family that suits known truths"
unsupported_mechanism_operation = "an operation a mechanism family lacks is refused naming both, with the others kept"
falsification_correct = "a correct graph is not rejected"
falsification_misspecified = "a misspecified graph is rejected"
falsification_uninformative = "a graph with no testable or too few distinguishing implications is uninformative"
falsification_budget_limited = "a budget that cannot cover the tests yields an incomplete result"
intrinsic_influence_linear_variance = "intrinsic influence equals the analytic variance contribution of each noise term"
shapley_allocation_identities = "the Shapley allocation is efficient, symmetric and agrees between exact and sampled"
exact_enumeration_zero_permutation_error = "exact enumeration reports exactly zero permutation error and keeps simulation error"
artifact_round_trip = "portable policy and execution artifacts replay with the same identity and draws"
replay_reproducible = "noise replay is bit-reproducible across calls, encodings and fresh processes"
shared_exogenous_execution = "one exogenous realization is shared by every mechanism that names it, in every world"
recalculation_bridge = "the recalculation bridge accepts wide tables under budgets and refuses before copying"
conformance_registry = "the registry covers every capability and the gate is wired into the release gates"

