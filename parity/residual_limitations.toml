[[limitation]]
id = "counterpart.P13.refuter.static.frequentist"
kind = "narrowed_promise"
source = "parity/counterparts.toml"
locator = "P13.refuter.static.frequentist"
text = "executing and unlicensed: target-native refuters run on the whole target vector for scalar, conditional, derivative, mediation, world-valued, joint and attribution targets, with error rates and pass thresholds unmeasured. The finite-difference and local-linearity checks cover a point derivative, an average derivative under the observed law (seven quantile nodes; the Gaussian-score Riesz estimator admits no other weighting, and uniform-interval nodes are placed wherever an estimator admits that law), and a directional derivative or Jacobian through the study's own interventional means along each direction (at most six coordinates). A random common cause is declared in every atom of a DAG or lagged-template graph posterior, and of a class posterior under the declared assumption WithinClassDistribution::UniformOverMembers (each class's DAG members enumerated up to 512, an even share each, the common cause added to each, the shares collapsed to the classes of the augmented graphs; the assumption is written into the posterior's diagnostics and without it the class posterior is refused). Typed refusals that name their next attempt: the closed-form sequential-ignorability range needs independent rows and a declared mediator; caller-weighted average derivatives and non-identity scales refuse (next attempt: check chosen points); a row bootstrap refuses a masked, weighted, non-float or incomplete table (subset stability runs; next attempt: resolve missing values first); a class with more than 512 members, a PAG posterior and a lagged class posterior refuse the common cause (next attempt: sample members of a larger class, or refute one accepted structure); the graph negative controls need a variable the graph separates, else one is declared Next attempt: measure the whole-procedure coverage of this interval and record its boundary"
item = "P13"
owner = "Q08"
decision = ""
rationale = ""
rule = "whole_procedure_calibration_of_narrowed_routes"

