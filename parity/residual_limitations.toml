text = "executing and unlicensed: prior sensitivity refits the temporal study under alternative prior scales, and the posterior-predictive check replicates a series or the pooled units of a panel under a reference outcome model that carries the graph's lags (the outcome on the treatment, the adjustment set and its own lagged values, simulated recursively); pass thresholds are unmeasured. Typed refusals that name their next attempt: an explicit coefficient prior has no single scale to vary (next attempt: pass the draws of each alternative prior to prior_sensitivity_target_check); the lagged reference is a linear autoregression, so a route whose outcome model is not linear in its own lags is checked against that reference, not its own Next attempt: measure the whole-procedure coverage of this interval and record its boundary"
