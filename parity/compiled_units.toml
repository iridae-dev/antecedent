# One row per compiled route whose support is the status of a unit outside the support matrix.
#
# `lowering` is `PlanRoute::as_str` of the route; `unit_kind` is `capability` (a record in
# parity/capability_records.toml, status in antecedent-io-core/data/unit_support_status.json) or
# `graphless` (a row of parity/support_graphless.toml); `unit` is the unit id (for a graphless
# row, `family:design:method:inference_claim`); `entry` names the
# Rust source and the Python module that expose the route.
# crates/antecedent/src/support/units_generated.rs is generated from this file by
# scripts/generate_compiled_units.py.

schema = 1

[[route]]
lowering = "PolicySubsampling"
unit_kind = "capability"
unit = "estimate.observational_policy_value"
entry = { rust = "crates/antecedent/src/analysis/observational_policy.rs", python = "python/antecedent/observational_policy.py" }

