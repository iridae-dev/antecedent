# One row per compiled route whose support is the status of a unit outside the support matrix.
#
# `lowering` is `PlanRoute::as_str` of the route; `unit_kind` is `capability` (a record in
# parity/capability_records.toml, status in antecedent-io-core/data/unit_support_status.json) or
# `graphless` (a row of parity/support_graphless.toml); `unit` is the unit id (for a graphless
# row, `family:design:method:inference_claim`); `entry` names the
# Rust source and the Python module that expose the route.
# crates/antecedent/src/support/units_generated.rs is generated from this file by
# scripts/generate_compiled_units.py.
#
# unbound: every program family and every string-carrying route (CyclicFamily,
# ExperimentPlanning, PropagationChain) is bound by a [[route]] row or listed in an [[unbound]]
# row. An [[unbound]] row names a route no capability record owns: `reason` states what was
# found. scripts/gate_support.py fails on a route that is neither bound nor listed, and on a
# listed route that is bound.

schema = 1

# direct_status: the support verdict a direct (uncompiled) Python result reports. A direct result
# runs no support decision, so its verdict is a fixed label; this table owns every such label and
# generates python/antecedent/_direct_status.py, so no Python module carries a verdict literal.
# `status` is the reported string (unchanged for existing results), `meaning` what it states,
# `results` the result classes that report it.

[[direct_status]]
status = "not_assessed"
meaning = "A member of a batch retarget whose support was not decided: the default, and the verdict of a member that failed for a reason other than a support refusal (an ok member reports `supported`, a refused one `not_supported`)."
results = ["python/antecedent/_batch.py::RetargetMember"]

[[direct_status]]
status = "unsupported_direct_estimator_utility"
meaning = "A randomized-design estimate computed by a direct estimator outside the compiler; no support row licenses it and no interval or calibration claim is made."
results = [
  "python/antecedent/experiment.py::SwitchbackEstimate",
  "python/antecedent/experiment.py::ComplierEffectEstimate",
  "python/antecedent/experiment.py::CUPEDEstimate",
  "python/antecedent/experiment.py::ANCOVAEstimate",
]

[[direct_status]]
status = "unsupported_direct_inference_utility"
meaning = "An exact randomization test computed directly outside the compiler; the p-value is exact under the declared design, but no support row licenses the direct call."
results = ["python/antecedent/experiment.py::RandomizationTest"]

[[direct_status]]
status = "unsupported_point_utility"
meaning = "A point estimate (with any reported standard error or variance bound) computed directly outside the compiler; no support row licenses it and no interval or calibration claim is made."
results = [
  "python/antecedent/interference.py::SaturationEffects",
  "python/antecedent/interference.py::ObservationalNetworkExposureEstimate",
  "python/antecedent/interference.py::InterferenceEstimate",
  "python/antecedent/policy.py::DoublyRobustPolicyEvaluation",
  "python/antecedent/policy.py::ConditionalDoseResponseEstimate",
  "python/antecedent/quasi.py::DifferenceInDifferencesEstimate",
  "python/antecedent/quasi.py::PanelDifferenceInDifferencesEstimate",
  "python/antecedent/quasi.py::StaggeredAdoptionEstimate",
  "python/antecedent/quasi.py::StaggeredEventStudyEstimate",
  "python/antecedent/quasi.py::SyntheticControlEstimate",
  "python/antecedent/quasi.py::SyntheticDifferenceInDifferencesEstimate",
  "python/antecedent/quasi.py::AugmentedPanelDiDEstimate",
  "python/antecedent/quasi.py::CategoricalDidEstimate",
  "python/antecedent/regimes.py::LongitudinalRegimeEstimate",
  "python/antecedent/regimes.py::MarginalStructuralModelResult",
  "python/antecedent/survival.py::SurvivalEstimate",
  "python/antecedent/survival.py::IPCWSurvivalEstimate",
  "python/antecedent/survival.py::IPCWCumulativeIncidenceEstimate",
  "python/antecedent/survival.py::CumulativeIncidenceEstimate",
]

[[direct_status]]
status = "unsupported_uncalibrated"
meaning = "A direct result whose interval is reported but whose coverage is not measured; `supported` and `calibration_measured` are false."
results = [
  "python/antecedent/quasi.py::PeriodHistoryMatchEstimate",
  "python/antecedent/regimes.py::SequentialContrastEstimate",
]

[[direct_status]]
status = "off_axis_interval_evidence"
meaning = "A local polynomial ratio (fuzzy discontinuity or kink) interval reported off the support matrix: no support row licenses the direct call, so the interval is evidence, not a supported claim."
results = ["python/antecedent/quasi.py::LocalPolynomialRatioEstimate"]

[[direct_status]]
status = "unsupported_simultaneous_band"
meaning = "A simultaneous survival-difference band whose arm counts match no band row of the graphless support matrix; a matching band reports `supported` instead."
results = ["python/antecedent/survival.py::SurvivalDifferenceBand"]

[[direct_status]]
status = "caller_supplied_sequential_probabilities"
meaning = "A longitudinal regime value weighted by caller-supplied sequential treatment and censoring probabilities; the library fits no nuisance and makes no uncertainty claim."
results = ["python/antecedent/regimes.py::RegimeValue"]

[[direct_status]]
status = "caller_supplied_conditional_outcome_predictions"
meaning = "A plug-in g-formula regime value from caller-supplied sequential conditional outcome predictions; the library fits no nuisance and makes no uncertainty claim."
results = ["python/antecedent/regimes.py::GFormulaValue"]

[[direct_status]]
status = "caller_supplied_sequential_Q_and_probabilities"
meaning = "A sequentially augmented regime value from caller-supplied Q scores and sequential probabilities; the library fits no nuisance, does not verify the cross-fitting, and makes no uncertainty claim."
results = ["python/antecedent/regimes.py::DoublyRobustRegimeValue"]

