# D13 audit of the Arrow version, the C Data Interface, and the optional Polars
# feature boundary. Pins are the workspace declarations. This file is an audit
# record. It is not a timing record.

id = "D13"
kind = "audit"
adr = "0004"
rust = "1.85"

[pins]
source = "Cargo.toml workspace.dependencies"
arrow_array = "54"
arrow_schema = "54"
arrow_buffer = "54"
pyo3 = "0.29"
pyo3_build_config = "0.29"
polars = "absent"

[features]
crate = "antecedent-data"
manifest = "crates/antecedent-data/Cargo.toml"
arrow = "optional"
arrow_default = true
arrow_enables = [
    "arrow-array",
    "arrow-schema",
    "arrow-buffer",
    "arrow-array/ffi",
    "arrow-schema/ffi",
]
polars_feature = "absent"
polars_dependency = false

[types]
policy = "Arrow types stay inside arrow_adapter.rs (ADR 0004)."
arrow_adapter = "crates/antecedent-data/src/arrow_adapter.rs"
ffi_module = "crates/antecedent-data/src/arrow_ffi.rs"
ffi_gate = "arrow"
backend_specific_types = "internal"
public_causal_api = "library-owned views"
boundary_module = "crates/antecedent-data/src/backend_boundary.rs"
polars_internal_contract_backend = false
default_backend = "none"

[install]
rust_feature_builds = "lib tests passed with default features and with --no-default-features"
wheel = "maturin build --release --locked --out dist produced antecedent-2.4.1-cp313-cp313-macosx_11_0_arm64.whl on this host"
clean_cpu = "installed that wheel in a fresh CPython 3.13 venv outside the checkout; import resolved to that venv; the extension links only itself plus CoreFoundation, libiconv, libc++, and libSystem; pytest of python/tests passed 6180 and skipped 56 after mypy was installed with the wheel"
host = "Apple M1 Max, aarch64-apple-darwin, CPython 3.13.0"
note = "This is the host CPU wheel. The CPython 3.11–3.14 matrix remains Q19. No backend was made the default."
