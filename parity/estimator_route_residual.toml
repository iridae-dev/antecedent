# Estimators the family-wide sealer admits: those no specialised sealer serves.
# One row per EstimatorId, with the reason. The Rust table `FAMILY_ESTIMATORS` in
# crates/antecedent/src/analysis/prepared/sealers/estimator.rs must equal this list,
# and `scripts/gate_retained_routes.py` checks that every other estimator id is
# served by a specialised sealer, by name or through the route cell its family lowers as.
# A row that a specialised sealer also names carries
# `served_by_specialised_sealer_for_other_shapes = true`: the sealer admits some shapes of
# the estimator and declines the ones its reason lists, which fall to the family sealer.

