# Totals, machine-seconds on one task at a time: first pass 19621, rechecks 15601,
# reserve 8805, all 44027 (12.2 hours). Three rows carry 57 percent of the first pass:
# the winner's-curse expectation (6012 s), the sample-split joint coverage (2904 s) and the
# class-envelope recovery (2178 s). The recheck figure is the dominant uncertainty: it
# assumes 30 percent of cells drift more than two points from nominal at 400 replicates.
