# Written by scripts/bench_cost_model.py; regenerate rather than edit.
# estimate_cost reports seconds from this file only because it declares its machine.
benchmark = "scripts/bench_cost_model.py"
model = "seconds per counted fit = a + b * rows * columns^2"

[machine]
platform = "macOS-26.5.2-arm64-arm-64bit-Mach-O"
cpu_count = 10
python = "3.13.0"

[grid]
rows = [400, 800, 1600]
columns = [4, 8, 16]
bootstrap_replicates = 10
repeats = 3

[coefficients."linear.adjustment.ate"]
a = 0.0012515636882651365
b = 1.106959278488744e-07
samples = 18

[coefficients."aipw"]
a = 0.00014579413282041394
b = 8.239859423858286e-09
samples = 18

# ---- calibration capacity: the coordinates the uncertainty, transport and decision routes add
# Hand-maintained planning rows; scripts/bench_cost_model.py does not write them and
# estimate_cost never reads them (the parser ignores sections that are not
# `coefficients.<estimator>`), so regenerating the file above must carry this block over.
#
#   seconds per grid-point task = a + b * replicates
#
# a is process startup plus fixed set-up, b the seconds one replicate of the coordinate's
# work unit costs on the machine above (10 cores, one task at a time). The first pass runs
# 400 replicates at three sample-size grid points (one point for deterministic cells); a
# recheck re-runs a cell at 2000 replicates, extending the first run, and is costed for
# 30 percent of the cells. `samples` counts the timed rows of target/calibration-timings.tsv
# the basis cites; 0 means no timed comparable row exists and the figure is an analytic
# upper bound that a pilot (ANTECEDENT_CALIBRATION_SMOKE) replaces. Nothing here is a
# measurement and none of it licenses a claim.

[calibration_capacity."adaptive_procedure_exact_gates"]
a = 30.0
b = 0.0
samples = 0
cells = 8
grid_points = 1
work_unit = "one exact enumeration of the declared law per cell"
basis = "no timed comparable row: deterministic dynamic programme bounded by MAX_LAW_WORK; upper bound 30 s per cell until a pilot exists; closed-form rows of quadratic_dose_calibration (0.4 to 1.0 s) are the floor"
first_pass_seconds = 240.0
recheck_seconds = 0.0

