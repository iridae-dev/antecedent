[[record]]
id = "transport.finite_scenario_envelope"
status = "promoted"
consumer_question = "Which transport conclusions survive each of a finite, explicitly supplied set of graph/selection scenarios?"
graph_class = "Finite list (1-64) of fixed selection diagrams (directed and bidirected edges over static observed variables, any number of outcomes and treatments) over at most 12 shared observed variables, each decided by the already licensed classical catalog sID row with that row's scope inherited unchanged: the only gate the scenario code adds is the 12-variable bound. Every scenario result is a checked derivation or an independently verified s-hedge, so the row's own limit (multi-outcome and larger general graphs are not enumerated against a latent-SCM oracle) narrows its conformance coverage, not what the path admits; no random ADMG in the scenario tests reached not_certified, which is a defensive status for this route. A set may instead ask the conditional question P*(y | do(x), w) of the ADMG conditional transport row (transport.admg_conditional), promoted into the envelope after that standalone row passed: every scenario is then decided by the bounded ADMG conditional route with that route's scope inherited unchanged (at most 6 observed variables, 0-3 treatments, 1-3 conditioned variables, refused for the whole set as route_not_supported / admg_transport.bounds_exceeded otherwise), and that route does reach not_certified (a reduced-joint s-hedge without a verified witness, reported with its inspection-only candidate); such a scenario is structurally_unidentified only when the route's exactly verified two-model witness proves it. No CPDAG/PAG-native transport ID."
guarantee = "per_scenario_contract_guarantee"
inference_claim = "structural_envelope"
coverage_records = []
bounds = { max_scenarios = 64, max_observed = 12 }
routes = [{ name = "antecedent.PreparedTransportScenarios.aggregate_interval", stage = "uncertainty", status = "closed", reason_code = "scenario_aggregate_not_licensed" }, { name = "antecedent.transport.advanced.PreparedTransportScenariosStage.aggregate_interval", stage = "uncertainty", status = "closed", reason_code = "scenario_aggregate_not_licensed" }, { name = "transport.scenarios.aggregate_inference", stage = "uncertainty", status = "closed", reason_code = "scenario_aggregate_not_licensed" }]

