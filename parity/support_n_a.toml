# Typed impossibilities. A cell matching every listed constraint on a rule
# is n/a (not refused). Omitted keys mean "any value on that axis."

[[n_a]]
queries = ["PulseEffect", "SustainedEffect", "TemporalMediationEffect"]
graph_classes = ["Dag", "Admg", "Cpdag", "Pag"]
reason = "Temporal contrast queries require a temporal graph class."

[[n_a]]
queries = [
  "AverageDerivative",
  "AverageEffect",
  "ConditionalEffect",
  "Counterfactual",
  "DirectionalDerivative",
  "Elasticity",
  "InterventionalDistribution",
  "PathSpecificEffect",
  "PointDerivative",
  "ResponseJacobian",
  "SemiElasticity",
]
graph_classes = ["TemporalDag", "TemporalCpdag", "TemporalPag"]
reason = "Static queries are not a temporal-graph cell; use PulseEffect, SustainedEffect, or a temporal ResponseCurve/InterventionResponse attachment."

[[n_a]]
queries = [
  "AverageDerivative",
  "DirectionalDerivative",
  "Elasticity",
  "InterventionResponse",
  "PointDerivative",
  "ResponseCurve",
  "ResponseJacobian",
  "SemiElasticity",
]
structures = ["graph_posterior"]
reason = "Structural uncertainty around curves is contrast-only; graph-posterior mixtures do not license a response cell."

[[n_a]]
queries = ["ResponseCurve", "InterventionResponse"]
graph_classes = ["TemporalCpdag", "TemporalPag"]
reason = "Temporal response is licensed only on TemporalDag; CPDAG/PAG temporal response has no class-aware identifier."

[[n_a]]
queries = ["TransportQuery", "InterferenceQuery"]
graph_classes = ["TemporalDag", "TemporalCpdag", "TemporalPag"]
reason = "Stage transport and interference queries are not a temporal-graph cell."
