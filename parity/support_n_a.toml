# Typed impossibilities. A cell matching every listed constraint on a rule
# is n/a (not refused). Omitted keys mean "any value on that axis."
#
# Only a cell whose estimand does not denote, or whose structure axis does not
# exist for the graph class, belongs here. A route that is merely not built is a
# refusal: it goes to support_closed.toml with a reason that names the next
# attempt, or, once built, with `executes_unlicensed = true` (the derivative and
# the TemporalDag / Cpdag / Pag InterventionResponse refuter states, the Bayesian
# Dag InterventionResponse refuter state, the Bayesian joint InterventionResponse
# on a CoDetermined tier closure).
# Theory-blocked contrasts that do denote but are not identified (temporal
# contrasts on TemporalAdmg, TemporalMediationEffect on TemporalPag) are also
# recorded there, with the identification reason.

[[n_a]]
queries = ["PulseEffect", "SustainedEffect", "TemporalConditionalPulse", "TemporalConditionalSustained", "TemporalMediationEffect"]
graph_classes = ["Dag", "Admg", "Cpdag", "Pag", "CoDetermined", "Unknown"]
reason = "Temporal contrast queries require a temporal graph class: a pulse, sustained, temporal-conditional or temporal-mediation contrast is indexed by a lag and a horizon, and a static graph class has no time index for either."

[[n_a]]
queries = [
  "AverageEffect",
  "ConditionalEffect",
  "MediationEffect",
]
graph_classes = ["TemporalDag", "TemporalCpdag", "TemporalPag"]
reason = "Static queries do not denote on TemporalDag, TemporalCpdag, or TemporalPag. TemporalPag stays the equivalence class only for the temporal queries licensed on it. Latent confounding over time denotes on TemporalAdmg."

[[n_a]]
queries = ["TransportQuery", "InterferenceQuery"]
graph_classes = ["TemporalDag", "TemporalCpdag", "TemporalPag"]
reason = "TransportQuery and InterferenceQuery are typed against static graphs; they do not denote on a temporal graph class."

[[n_a]]
queries = ["ResponseCurve"]
graph_classes = ["Dag", "Admg", "TemporalAdmg", "TemporalDag", "Cpdag", "Pag", "TemporalCpdag", "TemporalPag"]
structures = ["explicit", "accepted"]
validations = ["cheap", "full"]
reason = "cheap and full denote the ATE-shaped scalar refuter suite; a function-valued curve has no such state."

[[n_a]]
queries = ["ResponseCurve"]
graph_classes = ["Dag", "TemporalDag", "TemporalCpdag", "TemporalPag"]
structures = ["graph_posterior"]
validations = ["cheap", "full"]
reason = "cheap and full denote the ATE-shaped scalar refuter suite; a graph-posterior response remains function-valued or atom-mixed with no licensed scalar-refuter state."

[[n_a]]
queries = [
  "AnomalyAttribution",
  "AverageDerivative",
  "ChangeAttribution",
  "ConditionalEffect",
  "Counterfactual",
  "DirectionalDerivative",
  "Elasticity",
  "InterventionalDistribution",
  "InterventionResponse",
  "MediationEffect",
  "NestedCounterfactualEffect",
  "PathSpecificEffect",
  "PointDerivative",
  "ResponseCurve",
  "ResponseJacobian",
  "SemiElasticity",
  "TransportQuery",
  "InterferenceQuery",
]
graph_classes = ["Unknown"]
reason = "Unknown-tier cells license the two-scenario AverageEffect envelope only."

[[n_a]]
queries = [
  "AnomalyAttribution",
  "AverageDerivative",
  "ChangeAttribution",
  "ConditionalEffect",
  "Counterfactual",
  "DirectionalDerivative",
  "Elasticity",
  "InterventionalDistribution",
  "NestedCounterfactualEffect",
  "MediationEffect",
  "PathSpecificEffect",
  "PointDerivative",
  "ResponseCurve",
  "ResponseJacobian",
  "SemiElasticity",
  "TransportQuery",
  "InterferenceQuery",
]
graph_classes = ["CoDetermined"]
reason = "CoDetermined cells license AverageEffect and joint InterventionResponse only."

[[n_a]]
graph_classes = ["CoDetermined", "Unknown"]
structures = ["accepted", "graph_posterior"]
reason = "Tier-rule backgrounds are an explicit structure source."

[[n_a]]
queries = ["AverageEffect", "InterventionResponse"]
graph_classes = ["CoDetermined", "Unknown"]
validations = ["cheap", "full"]
reason = "cheap and full name the ATE-shaped scalar refuter suite; CoDetermined joint IR and the Unknown envelope have no licensed scalar-refuter state."
