# Typed impossibilities. A cell matching every listed constraint on a rule
# is n/a (not refused). Omitted keys mean "any value on that axis."

[[n_a]]
queries = ["PulseEffect", "SustainedEffect", "TemporalMediationEffect"]
graph_classes = ["Dag", "Admg", "Cpdag", "Pag"]
reason = "Temporal contrast queries require a temporal graph class."

[[n_a]]
queries = [
  "AverageDerivative",
  "AverageEffect",
  "ConditionalEffect",
  "Counterfactual",
  "DirectionalDerivative",
  "Elasticity",
  "InterventionalDistribution",
  "InterventionResponse",
  "MediationEffect",
  "PathSpecificEffect",
  "PointDerivative",
  "ResponseCurve",
  "ResponseJacobian",
  "SemiElasticity",
]
graph_classes = ["TemporalDag", "TemporalCpdag", "TemporalPag"]
reason = "Static queries are not a temporal-graph cell; use PulseEffect or SustainedEffect."
