# Scientific assertions that no evidence claim cites.
#
# Each row is a slow known-truth, reference, posterior, simulation or route-sweep test. It is a
# scientific row exactly like a cited one: excluded from the engineering lane
# (.config/nextest.toml default-filter, regenerated by
# `python3 scripts/evidence_audit.py rust-engineering-filter --write`) and run only when its
# fingerprint is stale, through `scripts/scientific_records.py run`. `fixtures` are the
# conformance directories and oracle files the test reads; they are part of the fingerprint.
# evidence_audit fails when a row's test or assertion does not exist.

