# accelerator stage timings
[host]
os = "macos"
arch = "aarch64"
logical_cpus = 10
repeats = 5
gain_threshold = 2
adapter_unavailable = "the device library is not linked in this build"

[[measurement]]
backend = "ndarray_accelerate"
workload = "small"
rows = 256
cols = 4
folds = 2
hidden = 8
epochs = 8
flops = 1277952
[measurement.cold]
prepare_ns = 14707
upload_ns = 271417
fit_ns = 4415584
