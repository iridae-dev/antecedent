# accelerator stage timings
[host]
os = "macos"
arch = "aarch64"
logical_cpus = 10
repeats = 5
gain_threshold = 2
adapter_unavailable = "the device library is not linked in this build"

[[measurement]]
backend = "ndarray_accelerate"
workload = "small"
rows = 256
cols = 4
folds = 2
hidden = 8
epochs = 8
flops = 1277952
[measurement.cold]
prepare_ns = 53291
upload_ns = 260792
fit_ns = 4696584
synchronize_ns = 23208
download_ns = 8625
predict_ns = 47250
output_ns = 3166
stage_total_ns = 5092916
wall_ns = 5111750
[measurement.warm]
prepare_ns = 14416
upload_ns = 1999
fit_ns = 3224081
synchronize_ns = 4583
download_ns = 7833
predict_ns = 46834
output_ns = 292
stage_total_ns = 3300038
wall_ns = 3317333

[[measurement]]
