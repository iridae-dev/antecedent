# Producer/consumer matrix. docs/producer-consumer-matrix.md renders these
# tables between the producer-consumer markers
# (scripts/generate_dictionary_tables.py). python/tests/test_producer_consumer_matrix.py
# executes each cell; it reads this file and does not parse the markdown.

[[producer]]
key = "native_response"
object = "a native response claim"
built_from = "`program_claims.native_claim(view, program)` (`NativeClaim`)"

[[producer]]
key = "fitted_effect_model"
object = "a fitted effect model"
built_from = "`compact_export.CompactExport.build(...)` (coefficients, covariance, support, mask)"

[[producer]]
key = "retargeted_batch"
object = "a retargeted batch result"
built_from = "`PreparedBatch.retarget(...)` (`BatchRetarget`); `recalc.RecalcSession.execute(...)` with `TargetWeights`"

[[producer]]
key = "external_claim"
object = "an external bound claim"
built_from = "`external.response(...).bind(response)` (`BoundExternalClaim`)"

[[producer]]
key = "joint_draws"
object = "aligned joint draws"
built_from = "`joint_distribution.JointDistributionArtifact`"

[[producer]]
key = "bayesian_prior"
object = "Bayesian prior inputs"
built_from = "`inference.PosteriorArtifact` (learned posterior), `priors.PriorCatalog`, `priors.ComposedPrior`"

[[producer]]
key = "identified_scenarios"
object = "identified sets and scenarios"
built_from = "a prepared transport scenario stage, CPDAG completions, `inverse_query.IdentifiedSet`, `decision_robust.IdentifiedUtility`"

[[producer]]
key = "sensitivity_artifact"
object = "a sensitivity artifact"
built_from = "`sensitivity_decision.SensitivityArtifact`"

[[producer]]
key = "decision"
object = "a decision result"
built_from = "`decision.Decision` (`Contract.evaluate(...)`)"

[[producer]]
key = "study_ranking"
object = "a study ranking"
built_from = "`design.DesignRankingResult` (`design.rank_designs`, basis `net_value`)"

[[producer]]
key = "failed_contract"
object = "a failed identification contract (added: the only producer `repair` takes)"
built_from = "`repair.BackdoorContract` or `TransportContract`"

[[producer]]
key = "measurement_result"
object = "a measurement-model result (point-only, uncalibrated standard error)"
built_from = "`measurement_models.prepare_measurement_model(...).estimate()` (`MeasurementEstimate`) and its `PreparedMeasurementModel`"

[[producer]]
key = "composed_model"
object = "a composed mechanism model"
built_from = "`mechanism_composition.compose_mechanisms(...)` (`PreparedMechanismComposition`) and its `export` artifact"

[[producer]]
key = "evidence_ledger"
object = "an evidence ledger and its pooled results (point-only or assumption range)"
built_from = "`evidence_ledger.EvidenceLedger` (`pool_summaries`, `random_effects`, `hierarchical_borrowing`, `dependence_range`) and its `export`"

[[producer]]
key = "counterfactual_transport_result"
object = "a counterfactual transport result (exact or sampled plug-in point)"
built_from = "`transport.advanced.CounterfactualTransportDerivation.evaluate(...)` (`CounterfactualTransportResult`); `estimate_sampled(...)` (`SampledCounterfactualTransportEstimate`)"

[[producer]]
key = "cohort_decision_source"
object = "a fitted effect cohort decision source (point-only weighted cohort-mean contrast; native from a verified analysis result, declared from a compact export)"
built_from = "`prediction.FittedEffectModel.decision_source(cohort=, outcome_units=)` and `cohort_decision.decision_source_from_compact_export(...)` (`CohortDecisionSource`) and its `export`"

[[producer]]
key = "decision_reliability_report"
object = "a decision-reliability report (three separate uncertainty components, point diagnostics, uncalibrated)"
built_from = "`decision_reliability.assess(...)` (`DecisionReliability`, `ReliabilityReport`) and its `decision_reliability_v1` export"

[[cell]]
producer = "decision_reliability_report"
consumer = "decision"
status = "ADAPTER"
detail = "the caller declares one `MeanSource` coordinate for the decided candidate's expected utility, carrying the report's Monte Carlo value, with the artifact's draws digest as snapshot and the candidate-set digest as provider; `Contract.evaluate` and `evaluate_with_support` then answer an affine utility only (expected utility 5/2: act 9, hold 5), mean-only with no standard error, ranking probability or selection correction and no export; a quantile contract REFUSED `decision_evaluation.mean_source_insufficient`; the assessment and its report themselves raise `CausalTypeError`"

[[cell]]
producer = "decision_reliability_report"
consumer = "inverse_query"
status = "ADAPTER"
detail = "the same declared mean as a `MeanClaim` into `InverseQuery.evaluate` (target mean 6 keeps `act`); a quantile or probability constraint REFUSED `decision_evaluation.mean_source_insufficient`; the assessment itself raises `CausalTypeError`"

[[cell]]
producer = "decision_reliability_report"
consumer = "design_ranking"
status = "REFUSED"
detail = "`CausalTypeError` (not a `design.StatePrior`); a reliability report is neither a prior nor a signal"

[[cell]]
producer = "decision_reliability_report"
consumer = "sensitivity_decision"
status = "REFUSED"
detail = "`CausalTypeError`, artifact must be a `SensitivityArtifact`"

[[cell]]
producer = "decision_reliability_report"
consumer = "scenario_decision"
status = "REFUSED"
detail = "`CausalTypeError`; CPDAG `scenario_decision.no_native_run`"

[[cell]]
producer = "decision_reliability_report"
consumer = "repair"
status = "REFUSED"
detail = "`CausalTypeError` from `obligations` and `repair`"

[[cell]]
producer = "decision_reliability_report"
consumer = "bundle_node"
status = "REFUSED"
detail = "no node kind: the `decision_reliability_v1` container is not a bundle kind (`detect_kind` is `None`) and the bytes are refused `CompositionBundleRefusal`; the assessment raises `CausalTypeError` or `CompositionBundleRefusal`"

[[cell]]
producer = "decision_reliability_report"
consumer = "recalc_plan"
status = "ADAPTER"
detail = "`stage_identity(Stage.EVIDENCE, draws digest plus candidate-set digest)` declared by the caller"

[[cell]]
producer = "interface_contract_artifact"
consumer = "decision"
status = "REFUSED"
detail = "`CausalTypeError`; a contract declares scientific compatibility and carries no estimand value, so there is nothing to declare as a source (recorded exception in `parity/carryover_disposition.md`)"

[[cell]]
