[[cell]]
producer = "composition_verification_result"
consumer = "bundle_node"
status = "REFUSED"
detail = "no node kind: the `composition_verification_v1` container is not a bundle kind (`detect_kind` is `None`) and the bytes are refused `CompositionBundleRefusal`; the verification raises `CausalTypeError`"

[[cell]]
producer = "composition_verification_result"
consumer = "recalc_plan"
status = "ADAPTER"
detail = "`stage_identity(Stage.EVIDENCE, verification identity digest)` declared by the caller; the plan reads the digest only"

[[refusal]]
code = "`cell_not_licensed`"
detail = "`decision_reliability.cell_not_licensed`"
where = "`DecisionReliability.publish` and `decision_reliability.publish` for a ranking probability, confidence set or interval"

[[refusal]]
code = "`uncertainty_components_not_combined`"
detail = "`decision_reliability.combined_uncertainty`"
where = "`DecisionReliability.combined_uncertainty` and a `reporting=\"combined\"` request"

[[refusal]]
code = "`candidate_search_record_required`"
detail = "`decision_reliability.search_record_required`"
where = "`decision_reliability.assess` and `decision_reliability.rank` over adaptively generated candidates without a `CandidateSearchRecord`"

[[refusal]]
code = "`cell_not_licensed`"
detail = "`cohort_decision.interval_not_licensed`"
where = "`CohortDecisionSource.interval` (an interval, band or posterior for the cohort mean)"

[[refusal]]
code = "`cell_not_licensed`"
detail = "`cohort_decision.support_contract_absent`"
where = "`FittedEffectModel.decision_source` for a model that retains no fitted-row support contract"

[[refusal]]
code = "`cell_not_licensed`"
detail = "`cohort_decision.outside_support`"
where = "`FittedEffectModel.decision_source` for a cohort row outside the retained support contract"

[[refusal]]
code = "`transport_missing_evidence`"
detail = "`cohort_decision.shift_declaration_required`"
where = "`FittedEffectModel.decision_source` for a cohort of another population without a `CovariateShift`"

[[refusal]]
code = "`decision_contract_unsatisfied`"
detail = "`cohort_decision.law_not_supplied`"
where = "`CohortDecisionSource.refuse` for a probability, quantile or nonlinear utility"

[[producer]]
key = "adaptive_monitoring_contract"
object = "an adaptive monitoring contract (the retained assignment, exposure, availability, interim-analysis and stopping-rule record of one experiment, with its paradigm; no value)"
built_from = "`adaptive_inference.AdaptiveInferenceSession.export_contract(...)` and `consume_adaptive_monitoring_contract_artifact` (`ConsumedMonitoringContract`)"

[[producer]]
key = "adaptive_inference_result"
object = "an adaptive-experiment inference result (point-only; one paradigm, its procedure and stopping rule named)"
built_from = "`adaptive_inference.AdaptiveInferenceSession.analyse(...)` (`AdaptiveResult`), its `export_result` and `consume_adaptive_inference_result_artifact`"

[[producer]]
key = "interface_contract_artifact"
object = "an interface contract (what a component produces and consumes: quantity, support, operations, uncertainty meaning, calibration label, measurement and evidence assumptions; no value)"
built_from = "`interface_contract.export_interface_contract(...)` (bytes) or `InterfaceContract.artifact(...)` (`ExportedArtifact[ConsumedInterfaceContract]`) and `consume_interface_contract_artifact` (`ConsumedInterfaceContract`)"

[[producer]]
key = "composition_verification_result"
object = "a composition verification (the still-valid, recompute or withdrawn classification of every downstream claim of a composed analysis, with each claim's lineage and calibration standing; no value)"
built_from = "`composition_verification.verify_composition(...)` (`CompositionVerification`), its `export` and `consume_composition_verification_artifact`"

[[consumer]]
key = "decision"
python = "`Contract.evaluate`, `Contract.evaluate_transported`, `composition.evaluate_with_support`, `decision_robust.finite_scenarios`, `decision_robust.identified_sets`"
rust = "`decision_eval::evaluate_contract`, `evaluate_contract_on_means`, `composition_boundary`, `decision_robustness::evaluate_robust`, `decision_adapters::evaluate_identified_sets`"

[[consumer]]
key = "inverse_query"
python = "`InverseQuery.evaluate(point=, interval_region=, identified_set=, scenarios=)`, `inverse_sources.ForwardSource.evaluate`"
rust = "`inverse_query::evaluate_inverse_query`"

[[consumer]]
key = "design_ranking"
python = "`design.rank_designs`, `design.evsi`, `design.consume`"
rust = "`evsi::evaluate_evsi`, `design_ranking_artifact`, `prior_signal::adapt_prior_to_signal`"

[[consumer]]
key = "sensitivity_decision"
python = "`sensitivity_decision.decide`, `transport.sensitivity.transport_sensitivity`"
rust = "`sensitivity_decision::evaluate_sensitivity_decision`"

[[consumer]]
key = "scenario_decision"
python = "`decide_from_scenarios`, `decide_from_cpdag_completions`"
rust = "`analysis/decision_claims.rs`, `decision_adapters`"

[[consumer]]
key = "repair"
python = "`repair.obligations`, `repair.repair`"
rust = "`repair::repair`, `obligation_adapters`"

[[consumer]]
key = "bundle_node"
python = "`composition_bundle.Bundle.builder().add_artifact`"
rust = "`composition_bundle::CompositionBundle`, `composition_verifiers::standard_consumer`"

[[consumer]]
key = "recalc_plan"
python = "`recalc.plan_recalculation`, `RecalcSession.execute`"
rust = "`analysis/recalc_cell.rs`, `analysis/recalc_receipt.rs`"

