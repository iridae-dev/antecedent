[[cell]]
producer = "composition_verification_result"
consumer = "inverse_query"
status = "REFUSED"
detail = "`CausalTypeError`; no value to declare as a mean claim (recorded exception in `parity/carryover_disposition.md`)"

[[cell]]
producer = "composition_verification_result"
consumer = "design_ranking"
status = "REFUSED"
detail = "`CausalTypeError` (not a `design.StatePrior`); a classification is neither a prior nor a signal"

[[cell]]
producer = "composition_verification_result"
consumer = "sensitivity_decision"
status = "REFUSED"
detail = "`CausalTypeError`, artifact must be a `SensitivityArtifact`"

[[cell]]
producer = "composition_verification_result"
consumer = "scenario_decision"
status = "REFUSED"
detail = "`CausalTypeError`; CPDAG `scenario_decision.no_native_run`"

[[cell]]
producer = "composition_verification_result"
consumer = "repair"
status = "REFUSED"
