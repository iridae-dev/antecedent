[[cell]]
producer = "interface_contract_artifact"
consumer = "scenario_decision"
status = "REFUSED"
detail = "`CausalTypeError`; CPDAG `scenario_decision.no_native_run`"

[[cell]]
producer = "interface_contract_artifact"
consumer = "repair"
status = "REFUSED"
detail = "`CausalTypeError` from `obligations` and `repair`"

[[cell]]
producer = "interface_contract_artifact"
consumer = "bundle_node"
status = "REFUSED"
detail = "no node kind: the `interface_contract_v1` container is not a bundle kind (`detect_kind` is `None`) and the bytes are refused `CompositionBundleRefusal`; the contract object raises `CausalTypeError`"

[[cell]]
