# Producer/consumer matrix. docs/producer-consumer-matrix.md renders these
# tables between the producer-consumer markers
# (scripts/generate_dictionary_tables.py). python/tests/test_producer_consumer_matrix.py
# executes each cell; it reads this file and does not parse the markdown.

[[producer]]
key = "native_response"
object = "a native response claim"
built_from = "`program_claims.native_claim(view, program)` (`NativeClaim`)"

[[producer]]
key = "fitted_effect_model"
object = "a fitted effect model"
built_from = "`compact_export.CompactExport.build(...)` (coefficients, covariance, support, mask)"

[[producer]]
key = "retargeted_batch"
object = "a retargeted batch result"
built_from = "`PreparedBatch.retarget(...)` (`BatchRetarget`); `recalc.RecalcSession.execute(...)` with `TargetWeights`"

[[producer]]
key = "external_claim"
object = "an external bound claim"
built_from = "`external.response(...).bind(response)` (`BoundExternalClaim`)"

[[producer]]
key = "joint_draws"
object = "aligned joint draws"
built_from = "`joint_distribution.JointDistributionArtifact`"

[[producer]]
key = "bayesian_prior"
object = "Bayesian prior inputs"
built_from = "`inference.PosteriorArtifact` (learned posterior), `priors.PriorCatalog`, `priors.ComposedPrior`"

[[producer]]
key = "identified_scenarios"
object = "identified sets and scenarios"
built_from = "a prepared transport scenario stage, CPDAG completions, `inverse_query.IdentifiedSet`, `decision_robust.IdentifiedUtility`"

[[producer]]
key = "sensitivity_artifact"
object = "a sensitivity artifact"
built_from = "`sensitivity_decision.SensitivityArtifact`"

[[producer]]
key = "decision"
object = "a decision result"
built_from = "`decision.Decision` (`Contract.evaluate(...)`)"

[[producer]]
key = "study_ranking"
object = "a study ranking"
built_from = "`design.DesignRankingResult` (`design.rank_designs`, basis `net_value`)"

[[producer]]
key = "failed_contract"
object = "a failed identification contract (added: the only producer `repair` takes)"
built_from = "`repair.BackdoorContract` or `TransportContract`"

[[producer]]
key = "measurement_result"
object = "a measurement-model result (point-only, uncalibrated standard error)"
built_from = "`measurement_models.prepare_measurement_model(...).estimate()` (`MeasurementEstimate`) and its `PreparedMeasurementModel`"

[[producer]]
key = "composed_model"
object = "a composed mechanism model"
built_from = "`mechanism_composition.compose_mechanisms(...)` (`PreparedMechanismComposition`) and its `export` artifact"

[[producer]]
key = "evidence_ledger"
object = "an evidence ledger and its pooled results (point-only or assumption range)"
built_from = "`evidence_ledger.EvidenceLedger` (`pool_summaries`, `random_effects`, `hierarchical_borrowing`, `dependence_range`) and its `export`"

[[producer]]
key = "counterfactual_transport_result"
object = "a counterfactual transport result (exact or sampled plug-in point)"
built_from = "`transport.advanced.CounterfactualTransportDerivation.evaluate(...)` (`CounterfactualTransportResult`); `estimate_sampled(...)` (`SampledCounterfactualTransportEstimate`)"

[[consumer]]
key = "decision"
python = "`Contract.evaluate`, `composition.evaluate_with_support`, `decision_robust.finite_scenarios`, `decision_robust.identified_sets`"
rust = "`decision_eval::evaluate_contract`, `evaluate_contract_on_means`, `composition_boundary`, `decision_robustness::evaluate_robust`, `decision_adapters::evaluate_identified_sets`"

[[consumer]]
key = "inverse_query"
python = "`InverseQuery.evaluate(point=, interval_region=, identified_set=, scenarios=)`"
rust = "`inverse_query::evaluate_inverse_query`"

[[consumer]]
key = "design_ranking"
python = "`design.rank_designs`, `design.evsi`, `design.consume`"
rust = "`evsi::evaluate_evsi`, `design_ranking_artifact`, `prior_signal::adapt_prior_to_signal`"

[[consumer]]
key = "sensitivity_decision"
python = "`sensitivity_decision.decide`"
rust = "`sensitivity_decision::evaluate_sensitivity_decision`"

[[consumer]]
key = "scenario_decision"
python = "`decide_from_scenarios`, `decide_from_cpdag_completions`"
rust = "`analysis/decision_claims.rs`, `decision_adapters`"

[[consumer]]
key = "repair"
python = "`repair.obligations`, `repair.repair`"
rust = "`repair::repair`, `obligation_adapters`"

[[consumer]]
key = "bundle_node"
python = "`composition_bundle.Bundle.builder().add_artifact`"
rust = "`composition_bundle::CompositionBundle`, `composition_verifiers::standard_consumer`"

[[consumer]]
key = "recalc_plan"
python = "`recalc.plan_recalculation`, `RecalcSession.execute`"
rust = "`analysis/recalc_cell.rs`, `analysis/recalc_receipt.rs`"

