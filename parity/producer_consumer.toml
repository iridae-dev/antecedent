# Rust facade sources and consumers (library level; the Python producer rows above list the Python entries).
# The python matrix test reads only [[producer]], [[consumer]] and [[cell]]; these tables are read by
# docs/producer-consumer-matrix.md (hand-written section) and are not rendered by generate_dictionary_tables.py.

[[rust_producer]]
key = "transported_response"
object = "a transported response: a point (or a law) with a receipt of route, populations, transport identities, assumptions and an extrapolative support label"
built_from = "`decision_transported_source::TransportedResponse` (`declared_point`, `declared_law`, `from_shifted_cohort`, `from_transported_policy`, `from_transported_synthesis`)"

[[rust_producer]]
key = "observational_law"
object = "an aligned observational joint law of covariates and an outcome (meaning empirical or posterior predictive)"
built_from = "`DistributionArtifact` with an observational meaning"

[[rust_producer]]
key = "discretized_composition"
object = "a discretized linear-Gaussian composition (point mean contrast with a computed error bound)"
built_from = "`PreparedMechanismComposition::discretize` (`PreparedDiscretizedComposition`)"

[[rust_producer]]
key = "whole_path_account"
object = "a whole-path uncertainty account of a finite Markovian cross-world execution (uncalibrated spread)"
built_from = "`CrossWorldExecution::whole_path_uncertainty` (`WholePathAccount`)"

[[rust_consumer]]
key = "decision"
entry = "`BoundDecisionContract::evaluate_transported`"
note = "the Python decision consumer is unchanged"

[[rust_consumer]]
key = "inverse_query"
entry = "`analysis::inverse_sources::{composed_source, cohort_source, transported_source, evaluate, seal}` and `PreparedMechanismComposition::inverse_forward_source`"
note = "inverse queries over a forward source"

[[rust_consumer]]
key = "sensitivity_decision"
entry = "`transport_sensitivity::{transport_range, transport_sensitivity_artifact}`"
note = "assumption range of a transported value"

[[rust_consumer]]
key = "transport_revalidation"
entry = "`transport_revalidation::{TransportSceneBuilder, revalidate}`"
note = "classification of transported claims"

[[rust_consumer]]
key = "observational_scenarios"
entry = "`inverse_sources::{evaluate_observational, verify_observational}`"
note = "associational scenario inversion"

[[rust_cell]]
producer = "transported_response"
consumer = "decision"
status = "DIRECT"
detail = "a transported point decides by the affine expected utility of its mean and carries its receipt and identity into the bound decision (treat 6.5, wait 0 at a transported mean of 2.0)"
evidence_test = "crates/antecedent/tests/transported_decision_facade.rs"
evidence_assertion = "a_transported_point_decides_by_the_utility_of_the_mean_and_names_its_transport"

[[rust_cell]]
producer = "transported_response"
consumer = "decision"
status = "REFUSED"
detail = "a law-valued criterion, a probability, quantile or hard constraint of a point is `decision_contract_unsatisfied` `transported_decision.law_not_supplied`; an interval is `cell_not_licensed`; the default policy refuses the label `transported_decision.transported_not_accepted`"
evidence_test = "crates/antecedent/tests/transported_decision_facade.rs"
evidence_assertion = "a_point_refuses_laws_and_intervals_and_the_default_policy_refuses_the_label"

[[rust_cell]]
producer = "transported_response"
consumer = "inverse_query"
status = "DIRECT"
detail = "under an input policy that accepts a transported input (target mean 2 keeps `xb`); a native-only policy is REFUSED `cell_not_licensed` `inverse_forward_source.transported_not_accepted`; a quantile is REFUSED `inverse_forward_source.point_only_law_requested`"
evidence_test = "crates/antecedent/tests/inverse_forward_sources_facade.rs"
evidence_assertion = "a_transported_response_is_read_only_when_accepted_and_carries_its_receipt"

[[rust_cell]]
producer = "transported_response"
consumer = "sensitivity_decision"
status = "DIRECT"
detail = "a point gives an assumption range at declared grid points through the sensitivity artifact (additive range [2,2], [1.75,2.25], [1.5,2.5]); sampling is withheld `transport_sensitivity.interval_not_composed`"
evidence_test = "crates/antecedent/tests/transport_sensitivity_facade.rs"
evidence_assertion = "the_sealed_artifact_exports_and_a_consumer_recomputes_it"

[[rust_cell]]
producer = "transported_response"
consumer = "sensitivity_decision"
status = "REFUSED"
detail = "a transported law has no single point to shift: `route_not_supported` `transport_sensitivity.law_response_not_scalar`"
evidence_test = "crates/antecedent/tests/transport_sensitivity_facade.rs"
evidence_assertion = "a_transported_law_has_no_single_point_to_shift"

[[rust_cell]]
producer = "transported_response"
consumer = "transport_revalidation"
status = "DIRECT"
detail = "a changed source recomputes only the claims counting it; a calibration record from another target is withdrawn"
evidence_test = "crates/antecedent/tests/transport_revalidation_facade.rs"
evidence_assertion = "a_changed_source_recomputes_only_the_claims_that_count_it"

[[rust_cell]]
producer = "composed_model"
consumer = "inverse_query"
status = "DIRECT"
detail = "Rust only: a linear-Gaussian composition supplies a replayed mean per action (0.5, 7.0, 13.5; target 5 keeps `x1` and `x2`); the Python row stays ADAPTER"
evidence_test = "crates/antecedent/tests/inverse_forward_sources_facade.rs"
evidence_assertion = "a_linear_gaussian_composition_supplies_a_replayed_point_per_action"

[[rust_cell]]
producer = "composed_model"
consumer = "inverse_query"
status = "REFUSED"
detail = "a quantile or probability of a Gaussian composition is `decision_contract_unsatisfied` `inverse_forward_source.composed_law_not_materialized`; an interval is `cell_not_licensed` `inverse_forward_source.interval_not_licensed`"
evidence_test = "crates/antecedent/tests/inverse_forward_sources_facade.rs"
evidence_assertion = "a_point_composition_refuses_laws_intervals_and_the_wrong_family"

[[rust_cell]]
producer = "composed_model"
consumer = "inverse_query"
status = "DIRECT"
detail = "Rust only: a finite-table composition supplies the exact law of each action under the caller's coding of outcome levels (P(Y = 1 given do) = 0.18 and 0.72)"
evidence_test = "crates/antecedent/tests/inverse_forward_sources_facade.rs"
evidence_assertion = "a_finite_composition_supplies_the_exact_law_of_each_action"

[[rust_cell]]
producer = "composed_model"
consumer = "inverse_query"
status = "ADAPTER"
detail = "a composition with admitted mechanisms is a transported claim: it needs the carrying receipt and an accepting input policy and is labelled extrapolative; without a receipt `inverse_forward_source.composed_response_invalid`, under a native-only policy `inverse_forward_source.transported_not_accepted`"
evidence_test = "crates/antecedent/tests/inverse_forward_sources_facade.rs"
evidence_assertion = "a_composition_with_admitted_mechanisms_is_a_transported_claim"

[[rust_cell]]
producer = "cohort_decision_source"
consumer = "inverse_query"
status = "ADAPTER"
detail = "Rust: `cohort_forward_source` (the cohort mean as a point forward source, 3.45 and 7.4 against a target of 5; a quantile is `inverse_forward_source.point_only_law_requested`); the facade wrapper has no executing test yet, so the cell stays ADAPTER"
evidence_test = "crates/antecedent-design/tests/inverse_forward_source.rs"
evidence_assertion = "a_cohort_contrast_is_a_point_source_with_its_own_law_refusal"

[[rust_cell]]
