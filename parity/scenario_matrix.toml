# KEPT REFUSED (scientific reasons), tests already in cells_07_scenarios.rs:
#  - Interference contrast, DependentTimeSeries: one outcome per unit of a fixed network has no time index and no lag; there is nothing for a serial kernel to read.
#    a_declared_serial_or_unclustered_design_is_refused_by_the_interference_contrast
#  - Interference contrast, ClusteredPanel without a clustered assignment: the interval is design-based on the realized assignment of the network, conditional on the sampled units;
#    a sampling cluster that does not enter the assignment mechanism changes nothing the estimator conditions on, and the labels are not read; refused rather than ignored.
#    a_declared_serial_or_unclustered_design_is_refused_by_the_interference_contrast
#  - Interference contrast, missing outcomes: Horvitz-Thompson over a fixed network needs every unit's outcome under the realized assignment; dropping units changes both the
#    estimand and the exposure-probability denominators, and an observation model would add randomness the design-based variance does not carry.
#    a_missing_outcome_or_declared_missing_policy_is_refused_by_the_interference_contrast
# BLOCKED (not built here): joint-cell missing-data inverse probability and multiple imputation; joint-cell quantile under weights/dependence; joint-cell refuters under weights/dependence;
#  batch of cells under weights. Each is refused with a typed reason.

