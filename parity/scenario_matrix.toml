# design_inference temporal.bayesian and uncertainty temporal.bayesian are quadrant axes derived from
# parity/counterparts.toml and cannot be settled by a curated cell. Row P11.augmented_panel_did.temporal.bayesian
# cites the file crates/antecedent/tests/bayesian_design_routes.rs (a copy of the staggered row, and a test file
# that does not exercise AugmentedPanelAtt). Proposed edit (counterparts.toml row, and the matching
# compiler_execution of the same id in parity/acceptance_inventory.toml, which scripts/generate_acceptance_inventory.py derives):
#
#   execution = "crates/antecedent/tests/augmented_panel_did_bayesian.rs::the_bayesian_augmented_panel_posterior_matches_the_arm_regression_reference_and_the_truth"
#   sampling_design = "Supplied-nuisance augmented two-period panel ATT with arm-specific normal-inverse-gamma regressions of the change score (bayesian.panel_did)."
#
# That test passes: the posterior mean equals the arm-regression least-squares reference to 0.02, recovers the
# simulated effect 1.5 within 0.15, has a positive posterior sd below 0.2 and a 95% interval containing the truth,
# and reports no licence (support_status None); the sibling test in the same file refuses a thin arm and declared
# weights with their next attempts.
