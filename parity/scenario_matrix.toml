# Method-family scenario matrix: the cells that cannot be derived from the other registries.
#
# scripts/scenario_matrix.py joins this file with parity/counterparts.toml (design x inference
# quadrants, uncertainty, graph class), parity/missing_policy_support.toml and
# parity/method_specs/specs.toml, enumerates every method family x axis value, and reports each
# cell as delivered, unavailable or gap. A cell this file does not record and no registry derives
# is a gap. `scripts/evidence_audit.py report` prints the gaps.
#
# Cell fields:
#   family   a `method` of parity/counterparts.toml
#   axis     one of the curated axes below
#   value    one of that axis's values
#   status   delivered | unavailable | gap
#   test     `path::name` of a compiled, non-ignored test (delivered; also the assertion that
#            shows a typed refusal for an unavailable cell), or
#   fixture  a conformance/ directory with an expected.json
#   what     one line saying what the evidence asserts
#   reason   required for unavailable and gap; the next attempt for a gap goes in `next_attempt`
#
# A test whose name carries "smoke" or "limit", a measurement-only (#[ignore]d) test, a test that
# is not compiled, or a source file named without a test does not make a cell delivered. A typed
# refusal makes a cell delivered only for the axis value "typed_refusal"; for any other value it
# is the evidence of an unavailable cell.

schema = 1

[[axis]]
id = "weights_missingness"
title = "Weights and missingness"
values = ["sampling_weights", "missing_data"]

[[axis]]
id = "categorical_treatment"
title = "Categorical treatments"
values = ["categorical"]

[[axis]]
id = "dependence"
title = "Dependence"
values = ["clustered", "serial"]

[[axis]]
id = "degeneracy"
title = "Degeneracy"
values = ["collinear_or_constant"]

[[axis]]
id = "unsupported_input"
title = "Unsupported inputs"
values = ["typed_refusal"]

[[axis]]
id = "held_out_regime"
title = "Held-out intervention regimes"
values = ["held_out_intervention"]

