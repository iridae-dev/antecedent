# Cells owed to a later calibration measurement.
#
# A method-family scenario cell (design x inference, uncertainty) whose only open element is the
# measured calibration of a procedure that already executes is `pending_measurement`, not a gap:
# the route runs unlicensed, its point and interval are tested against known truth, and no coverage
# or error-rate record exists yet. Each entry names the counterpart row, the calibration facet of
# scripts/calibration_surface.list whose records will close it, and what is owed. Nothing here is
# an attestation, waiver or licence: calibration stays pending until a frozen candidate is
# measured, and a record that carries the facet then closes the entry (the entry is removed and the
# cell is delivered). scripts/scenario_matrix.py rejects an entry with no facet, a facet the
# surface does not define, an unknown `owed` kind, or a row with no open cell on its axes.

schema = 1

[[pending]]
row = "P07.derivative.temporal.bayesian"
facet = "suite.derivative_calibration"
owed = "posterior_calibration"
axes = ["design_inference", "uncertainty"]

