# Cells owed to a later calibration measurement.
#
# A method-family scenario cell (design x inference, uncertainty) whose only open element is the
# measured calibration of a procedure that already executes is `pending_measurement`, not a gap:
# the route runs unsupported, its point and interval are tested against known truth, and no coverage
# or error-rate record exists yet. Each entry names the counterpart row, a label for the records that
# will close it, and what is owed. Nothing here is
# an attestation, waiver or support: calibration stays pending until a frozen candidate is
# measured, and a record that carries the facet then closes the entry (the entry is removed and the
# cell is delivered). scripts/scenario_matrix.py rejects an entry with no facet, a facet the
# surface does not define, an unknown `owed` kind, or a row with no open cell on its axes.
#
# `groups` lists the gate groups (`<test file>: <test filter>`, as parity/calibration_groups.toml
# labels them) whose coverage records close the entry. While any of them has produced no record the
# entry is an owed item of `scripts/calibration_status.py status --owed`, so the owed calibration run
# executes exactly those groups; an entry that names none is owed and unwired.

schema = 1

