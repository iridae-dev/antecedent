# Public claim sentences. Typed once; each listed file contains the sentence verbatim once.

[[claim]]
id = "reusable_headline"
sentence = "Every Antecedent analysis retains a reusable study and exports a contracted execution; custom validator results travel as caller-attested, not re-verifiable, evidence, and a row-weight retarget re-executes only on its own data snapshot."
licensed_by = "parity/python_products.toml"
files = ["README.md", "CHANGELOG.md", "docs/release-notes/v1.10.0.md", "docs/release-notes/v1.10.1.md", "docs/python-workflow.md", "python/README.md"]

[[claim]]
id = "calibration_headline"
sentence = "Every reported interval states its calibration: calibrated when a coverage record matches the execution and the execution is inside that record's scope; scope_not_assessed when a record matches but the execution is outside its scope or the record is a boundary; unavailable with a reason code when no record exists."
licensed_by = "parity/coverage_records.toml"
files = ["README.md", "CHANGELOG.md", "docs/release-notes/v1.10.0.md", "docs/release-notes/v1.10.1.md", "docs/python-workflow.md", "python/README.md"]

