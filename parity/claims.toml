# Historical CHANGELOG sections are frozen history; only the current version's
# section is scanned (`changelog_section = "current"`). The pattern names
# deferral to a later version, never limitation itself: stating what 1.x does
# not do ("known limitations", "is refused", "is not calibrated") is required.
[[forbidden]]
id = "deferral_prose"
pattern = '(?i)not yet|cannot yet|follow[- ]on|follow[- ]up work|later release|future release|subsequent release|next release|(?:lands?|ships?|arrives?|comes?) later|in a later|separately gated|workstream|deferred|1\.10\.2|(?<![<>=,~])1\.11(?![0-9])'
changelog_section = "current"
