# Selected from those medians. Sixteen workers do not win a small problem.
# On the large problems, sixteen workers beat four even though the host has ten threads.

[[selection]]
layout = "dense"
shape = "small"
product = "faer"
workers = 4
reason = "Faer beats the column-major reference. Four workers beat one worker, and sixteen workers do not beat four."

[[selection]]
layout = "dense"
shape = "large"
product = "faer"
workers = 16
reason = "Faer beats the column-major reference. Sixteen workers beat four, and four beat one."

[[selection]]
layout = "sparse"
shape = "small"
product = "reference"
workers = 1
reason = "The column-wise reference beats faer on one worker. Four and sixteen workers are slower by more than an order of magnitude."

[[selection]]
layout = "sparse"
shape = "large"
product = "faer"
workers = 16
reason = "Faer beats the column-wise reference. Sixteen workers beat four, and four beat one."
