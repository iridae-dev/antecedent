# Faer, BLAS-style and reference products, factorizations and layouts across shapes,
# storage layouts and worker counts.
#
# Cases come from `cargo bench -p antecedent-stats --bench blas_layout`: the harness checks
# every product against an independent reference before it samples, then records the median
# and the first and third quartile of timed repetitions in nanoseconds. Sixteen workers
# oversubscribe a host with fewer hardware threads. Column-pivoted QR cases that predate the
# harness are merged from solver_scope/crossover.toml as means with equal interval ends.
#
# Selections are derived from the cases by derive_selections.py. The crate's budget-aware
# rule table (`antecedent_stats::layout_rules`) is checked against the selections below.

schema = 1
host = "Apple M1 Max, arm64, 10 hardware threads, 64 GB"
profile = "release"
accuracy = "passed before sampling; absolute gap at most 1e-8 * (1 + max abs)"

[[case]]
op = "gram"
layout = "dense"
rows = 64
cols = 8
product = "reference"
workers = 1
median_ns = 869
low_ns = 867
high_ns = 870

