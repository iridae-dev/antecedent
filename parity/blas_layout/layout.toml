# Faer Gram layouts versus the column-major or column-wise reference.
# Criterion medians from a release build, sample size 10, 0.5 s warmup,
# 1 s measurement. This is not the QR serial-versus-parallel record.

schema = 1
item = "N19"
host = "Apple M1 Max, arm64, 10 hardware threads, 64 GB"
profile = "release"
criterion_sample_size = 10
warmup_s = 0.5
measurement_s = 1
accuracy = "passed before sampling; absolute gap at most 1e-8 * (1 + max abs)"

# Times are criterion medians in nanoseconds. low_ns and high_ns are the
# reported interval ends. Sixteen workers oversubscribe this 10-thread host.

[[case]]
layout = "dense"
rows = 64
cols = 8
product = "reference"
workers = 1
median_ns = 869
low_ns = 867
high_ns = 870

