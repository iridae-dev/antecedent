  { id = "x5.search_incomplete.negative", role = "negative", intent = "A decision the sound-and-incomplete rules could not certify refuses as temporal_transport.search_incomplete (transport_not_certified), never as a checked obstruction; the verified s-hedge case refuses as temporal_transport.checked_obstruction in the obstruction fixture (Rust and Python), and both details are asserted (a structured sweep of selection sets over four diagram families and three catalogs and 3000 random unrolled diagrams found no uncertified one, so the search-incomplete refusal is asserted at the Rust refusal surface only).", evidence_test = "crates/antecedent-estimate/tests/temporal_transport_execution.rs", evidence_assertion = "a_decision_the_rules_could_not_certify_refuses_as_search_incomplete_never_as_an_obstruction" },
