  { id = "x1.interval_closed_all_routes.negative", role = "negative", intent = "No public route yields an interval and every public consumer refuses an interval-bearing artifact with cell_not_licensed.", evidence_test = "crates/antecedent/tests/mz_transport_lifecycle.rs", evidence_assertion = "the_unmeasured_interval_route_refuses_with_cell_not_licensed" },
