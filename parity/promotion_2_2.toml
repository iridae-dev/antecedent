[[record]]
id = "2.2A.X2.finite_scenario_envelope"
workstream = "X2"
milestone = "A"
work_package = "A2"
status = "promoted"
consumer_question = "Which transport conclusions survive each of a finite, explicitly supplied set of graph/selection scenarios?"
theorem = "No new theorem: each scenario is decided independently by the already licensed classical catalog transport contract (sID with checked s-hedge obstructions). The envelope is a report over those results, not an identification claim about an equivalence class."
reference = "https://arxiv.org/abs/1312.7485v1"
guarantee = "per_scenario_contract_guarantee"
graph_class = "Finite list (1-64) of fixed selection diagrams (directed and bidirected edges over static observed variables, any number of outcomes and treatments) over at most 12 shared observed variables, each decided by the already licensed classical catalog sID row with that row's scope inherited unchanged: the only gate the scenario code adds is the 12-variable bound. Every scenario result is a checked derivation or an independently verified s-hedge, so the row's own limit (multi-outcome and larger general graphs are not enumerated against a latent-SCM oracle) narrows its conformance coverage, not what the path admits; no random ADMG in the scenario tests reached not_certified, which is a defensive status for this route. A set may instead ask the conditional question P*(y | do(x), w) of the 2.2B B1 row (2.2B.X2.admg_conditional_transport), promoted into the envelope after that standalone row passed: every scenario is then decided by the bounded ADMG conditional route with B1's scope inherited unchanged (at most 6 observed variables, 0-3 treatments, 1-3 conditioned variables, refused for the whole set as route_not_supported / admg_transport.bounds_exceeded otherwise), and that route does reach not_certified (a reduced-joint s-hedge without a verified witness, reported with its inspection-only candidate); such a scenario is structurally_unidentified only when the route's exactly verified two-model witness proves it. No CPDAG/PAG-native transport ID."
population_semantics = "One declared coordinate schema (names, domains, cardinalities, units) shared by every scenario and validated against each graph, the catalog, laws, sample rows and the request; the same target question; edges and selection targets vary per scenario. A value must be a finite number inside its declared domain (a non-finite or non-numeric value belongs to no domain, unspecified included). Units are compared only between scenario schema declarations and catalog environments (and only when both declare one); an unspecified catalog or schema domain makes no claim and so cannot disagree; laws, samples and the request carry no units, so a value's unit is never checked."
evidence_family = "One supplied catalog; each scenario binds its own selection targets and its own derivation's evidence obligations, so evidence certified for one scenario never satisfies another. Shared-catalog environments may not declare selections (they belong to each scenario)."
provider = "Exact finite laws, or empirical tables fitted once and plugged into the same compiled per-scenario plan (points only)."
estimand = "Per-scenario target response; unweighted structural envelope (min/max over identified scenarios with the unidentified/unevaluated set named); optional declared-weight mixture report with residual mass preserved."
inference_claim = "structural_envelope"
inference_notes = "Point-only per scenario: the classical row's within-scenario bootstrap is not carried into the envelope in 2.2A (the empirical plug-in's bootstrap is fixed at zero replicates). Weighted ranges use the declared outcome domain limits and are withheld when unaccounted mass meets an unbounded domain. Cross-scenario aggregate inference with shared data is 2.3A and refuses (scenario_aggregate_not_licensed). Spread is never labelled a confidence interval or sharp bound."
owners = ["antecedent-core", "antecedent-identify", "antecedent-io", "antecedent", "python/antecedent/transport"]
identity_inputs = ["canonical scenario set (sorted by unique scenario name; permutation invariant)", "declared weights (f64 bits) when supplied", "shared coordinate schema including variable names", "target question and request", "shared scenario budget (operations, depth, memory) and evaluation budget", "separate data-identity digest over the evidence catalog (regimes, environments, snapshot bindings), every stored law, the provider identity and the fitted-sample summaries (not part of the scientific premises digest, so refreshed data replaces it)"]
wire_changes = ["Additive: scenario-set wire and scenario-envelope artifact v1 retaining every scenario with status identified | structurally_unidentified | missing_evidence | unsupported_provider | support_failure | not_certified | unevaluated (detail scenarios.unevaluated_budget: search.<stop>), a premises_digest and a separate data_digest. A report truncated by an operation, depth or memory bound exports and replays its identical prefix; one truncated by cancellation is never exported (typed CancelledNotReplayable).", "Additive (2.2B B1 promotion): scenario-envelope artifact v2 (required features transport_scenario_envelope_v1 + transport_scenario_admg_conditional_v2) for a conditional question: the query carries conditioned_on, an identified scenario carries its checked ConditionalTransportRecord (conditional_proof, in place of proof), a not-certified one its inspection-only ConditionalObstructionRecord (candidate) and a structurally unidentified one its ConditionalNonTransportabilityRecord (non_transportability: the verified two-model witness). The four fields are optional and not encoded when absent, so a classical set still writes v1 byte for byte with unchanged digests. ScenarioQuestion (Classical | Conditional) and ScenarioSetDecision.question are added; ScenarioOutcome gains ConditionalIdentified, ConditionalNotCertified and ConditionalProvenNonTransportable (status identified / not_certified / structurally_unidentified, identification_status identified / not_certified / proven_non_transportable)."]
compatibility = "Fixed-graph transport artifacts are unchanged; a one-scenario set is a separate artifact, not a relabelled fixed-graph result. Conditional promotion (2.2B B1): ScenarioOutcome, ScenarioSetDecision and TransportScenarioArtifactWire::checked are part of this unreleased 2.2 line (absent from v2.1.1), so the three new ScenarioOutcome variants, the new ScenarioSetDecision.question field and checked() taking the question from the decision (no separate query argument) break no released API. The artifact change is additive: the writer emits v1 for a classical question exactly as before (no new key encoded, same premises and data digests), this reader accepts v1 and v2, refuses a v1 artifact carrying any conditional field and a v2 artifact without a conditioned set (unsupported semantics), and a v1-only reader refuses every conditional artifact by its version (unsupported_version 2) before decoding it. Classical decisions, statuses, envelopes and replays are unchanged. A conditional set's own refusals are the B1 record's, with their admg_transport.* details unchanged: route_not_supported / admg_transport.bounds_exceeded for the whole set, invalid_argument / admg_transport.invalid_request, cell_not_licensed / admg_transport.interval_withheld for counted laws or samples, transport_support_failure / admg_transport.support_failure as a scenario's support_failure status. Still no cross-scenario shared-data covariance (2.3A)."
coverage_records = []
search = true
search_impl = ["crates/antecedent-identify/src/sid/scenarios.rs", "crates/antecedent-identify/src/sid.rs", "crates/antecedent-identify/src/sid/conditional.rs"]
