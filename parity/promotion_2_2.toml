[[record]]
id = "2.2E.E3.batch_retarget_covariance_contrasts"
workstream = "E3"
milestone = "E"
work_package = "E3"
status = "promoted"
consumer_question = "For a family of retargeted claims over one data snapshot (the same plan reweighted to several declared populations, or several plans), what are the points, their joint covariance, and named contrasts such as route A minus route B, and what may be said about the family as a whole?"
theorem = "Derived in-repo (docs/guides/batch-retarget.md). Claim k reweights a cross-fitted score table phi_k under fixed declared row weights w_k: theta_k = sum_r w_kr phi_kr / sum_r w_kr. With a_kr = w_kr / sum_s w_ks, the weighted influence value is xi_kr = sqrt(n/(n-1)) a_kr (phi_kr - theta_k) and the family covariance is the Gram matrix Sigma_kl = sum_r xi_kr xi_lr. Its diagonal is exactly the plug-in variance of a single-claim retarget; the cross-claim terms exist only because every claim's scores are indexed by the same rows, so the claims must share one row snapshot. The iid Sigma is symmetric and positive semidefinite (a Gram matrix); the cluster-summed and two-way covariance is computed by its own sandwich rule and must pass the correlation check before a band. A contrast sum_k c_k theta_k has value c'theta and plug-in variance c'Sigma c. Validity as a sampling covariance needs iid rows or the declared independent cluster units, fixed weights that are functions of certified covariates, positivity and nuisance convergence (the single-claim retarget contract); selection and weight-estimation uncertainty are excluded. A family-level simultaneous (max-t) band point_j +- c se_j, with c = q_level(max_j |Z_j|) for Z ~ N(0, R) and R the correlation of Sigma, is implemented as a public evaluator (antecedent::max_t_critical_value, a Monte-Carlo quantile on the library's one max-t sampler, deterministic in the seed, draws bounded to [1000, 2000000], cancellation polled every 1024 draws). Its critical value is checked against oracles that need no simulation to state: one claim is the two-sided normal quantile, k independent claims solve (2 Phi(c) - 1)^k = level, perfectly correlated claims reduce to one claim, c is monotone in k and level. For cluster-DML claims the Gaussian vector has one shared Student-t scale with the declared cluster reference degrees of freedom, giving the two-sided Student-t critical for one claim. The max-t coverage record has been measured; the complete-family 95% interval route is licensed at its measured iid coordinate for 2.2."
reference = "docs/guides/batch-retarget.md"
guarantee = "plug_in_score_covariance_with_measured_max_t_band"
graph_class = "The back-door adjustment DAG of each plan's cross-fitted AIPW or cell-AIPW score table; the cell adds no graph class and takes each plan's identification as prepared."
population_semantics = "The caller-declared target populations of the claims, each a fixed row weighting of one common complete-case row snapshot; claims on different complete-case rows are refused as a mixed snapshot. AllObserved iid or declared cluster-DML score tables only."
evidence_family = "The score tables of the batch's plans (prepare-time, or the tables of a later estimate retained with it) and one weight vector per claim aligned with the snapshot's row index."
provider = "antecedent_estimate::retarget per claim (weighted overlap gate and depends_on check), ScoreTable::combine_scores for the claim's score column, and the row-aligned Gram matrix of weighted influence values for iid rows or cluster-summed covariance for cluster-DML; no second estimator."
estimand = "theta_k = E_Q[mu_a(X)] contrasts of retargeted claims and their linear combinations, with the joint plug-in covariance of the claims."
inference_claim = "calibrated"
inference_notes = "Points and a plug-in score covariance alone are not an interval. For a complete family BatchRetargetReport::simultaneous_interval (Python BatchRetarget.simultaneous_interval) returns the asymptotic max-t band point +- c * se on that covariance (Monte-Carlo critical value, deterministic in seed and draws); a partial or point-only family refuses cell_not_licensed. Its 95% coverage record was measured through crates/antecedent/tests/batch_retarget_calibration.rs (batch_retarget_max_t_simultaneous_band), registered in scripts/gate_calibration.sh (run_br) and the suite facets of scripts/calibration_surface.list; a fixed-seed repeated-sampling known-truth TEST (crates/antecedent/tests/batch_retarget_known_truth.rs) asserts family-wise coverage within a stated Monte-Carlo tolerance of nominal and a band strictly wider than each marginal band; it is a test, not a coverage record. The public band is licensed for complete families at the measured coordinate; other coordinates remain scope_not_assessed. A penalized-propensity table retains the plug-in score covariance and can join a complete family. A partial family (any failed or point-only member) lists every member and is never a complete-family claim."
owners = ["antecedent", "python/antecedent/estimation"]
identity_inputs = ["the batch's canonical estimator-configuration fingerprint (the structured estimator-spec identity)", "the common row snapshot (digest of the shared complete-case row index) and whether the scores were prepared or estimated", "every claim: name, query index, weights as IEEE bits and declared parents, in name order", "every contrast: name and coefficients as IEEE bits, in name order"]
wire_changes = ["Additive: the batch.shared_design diagnostic carries an estimator_config field (the canonical estimator-configuration fingerprint); no existing artifact changes."]
compatibility = "analyze_many and PreparedBatch.prepare/prepare_cells keep their string estimator argument and gain the typed configuration single-query analyze takes; PreparedBatch.estimate keeps returning the same results and additionally retains the scores of that estimate for a later retarget. Nothing in the single-query retarget changes."
coverage_records = ["cov.average_effect.dag.frequentist.simultaneous_band.l95.batch_retarget_max_t_simultaneous_band"]
search = false
bounds = { cancellation = true, max_t_draws = "1000 to 2000000 Monte-Carlo draws of the max-t evaluator", max_t_poll = "cancellation polled every 1024 draws" }
refusals = [
  { code = "invalid_argument", detail = "batch_retarget.empty_family", when = "A family declares no claim." },
  { code = "invalid_argument", detail = "batch_retarget.duplicate_name", when = "A claim or contrast name is empty or repeated (claim and contrast names share one namespace)." },
