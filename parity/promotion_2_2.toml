  { id = "e4.cluster_covariance_hand.truth", role = "truth", intent = "Hand calculation on a fixed ten-cluster table: the cluster-summed joint covariance of two columns is 1/9, 1/9 and 1/45 (G/(G-1) times cluster sums), not the iid Gram.", evidence_test = "crates/antecedent-estimate/tests/cluster_dml_aipw.rs", evidence_assertion = "the_cluster_summed_covariance_matches_a_hand_calculation_on_a_fixed_table" },
  { id = "e4.cluster_covariance_receipt.truth", role = "truth", intent = "On a real cluster-DML table the cluster covariance diagonal equals the one-way and two-way receipt variances and its cross term equals bilinear cluster sums written in the test.", evidence_test = "crates/antecedent-estimate/tests/cluster_dml_aipw.rs", evidence_assertion = "the_cluster_covariance_diagonal_is_the_receipt_variance" },
  { id = "e4.cluster_interval_t.truth", role = "truth", intent = "The published interval of a cluster-DML result is estimate +- t_(G-1) se (normal for an ordinary AIPW fit).", evidence_test = "crates/antecedent/tests/cluster_dml_retarget.rs", evidence_assertion = "the_published_interval_uses_the_few_cluster_t_reference" },
  { id = "e4.cluster_retarget.positive", role = "positive", intent = "A single retarget of the cluster-DML table reports the cluster-summed standard error with its t_(G-1) reference, equal to the fit's own at uniform weights and to an independent cluster-sum oracle under tilted weights.", evidence_test = "crates/antecedent/tests/cluster_dml_retarget.rs", evidence_assertion = "a_single_retarget_reports_the_cluster_summed_se_with_its_reference" },
  { id = "e4.cluster_batch.positive", role = "positive", intent = "A batch family over a cluster-DML plan reports the cluster-summed joint covariance (variances and cross term) and each claim's reference degrees of freedom.", evidence_test = "crates/antecedent/tests/cluster_dml_retarget.rs", evidence_assertion = "a_batch_family_reports_the_cluster_summed_joint_covariance" },
  { id = "e4.known_truth_coverage.truth", role = "truth", intent = "Over fixed-seed repeated sampling with a cluster random effect, the t_(G-1) Wald band from the receipt standard error is within a stated Monte-Carlo tolerance of 0.95 and the iid standard error undercovers; a test, not a coverage record.", evidence_test = "crates/antecedent-estimate/tests/cluster_dml_known_truth.rs", evidence_assertion = "the_cluster_sandwich_receipt_covers_the_known_effect_and_the_iid_se_does_not" },
  { id = "e4.plain_aipw_fold_cancel.budget", role = "budget", intent = "Plain cross-fitted AIPW polls once per fold: every earlier budget stops with cancelled_no_claim and no estimate, and polling leaves the estimate bit-identical.", evidence_test = "crates/antecedent-estimate/tests/cancellation_expansion_cells.rs", evidence_assertion = "plain_aipw_stops_at_a_fold_and_polling_changes_no_number" },
  { id = "e4.interval_wired.calibration", role = "calibration", intent = "The published one-way cluster t Wald interval is measured at three sample-size points by cluster_dml_calibration.rs, registered as run_cd; its exact one-way 95% coordinate is licensed, while dyadic inference has no matching coverage record.", evidence_test = "crates/antecedent/tests/cluster_dml_calibration.rs", evidence_assertion = "the_scored_interval_is_the_published_t_interval" },
]


[[record]]
id = "2.2E.E7.descriptive_comparison"
workstream = "E7"
milestone = "E"
work_package = "E7"
status = "promoted"
consumer_question = "How far is the unadjusted treated-versus-control contrast from an adjusted estimate of the same estimand coding, and what are a mean-outcome pair's risk difference, log risk ratio and log odds ratio with their first-order covariance when the source carries the pair's joint covariance?"
theorem = "Descriptive arithmetic plus the delta method, derived in-repo (docs/guides/descriptive-comparison.md). The raw contrast is mean(Y | T=1) - mean(Y | T=0) with Welch variance s1^2/n1 + s0^2/n0 for disjoint arms of one sample. The gap raw - adjusted is a difference of two numbers computed on the same rows: it mixes confounding, the adjustment model's form, estimator differences and sampling noise, and has no causal reading. For theta = g(mu) with mu the pair of arm means, Sigma its covariance and J the k x 2 Jacobian of a family g_1..g_k, the first-order covariance is J Sigma J'; the gradients are (1, -1) for the mean and risk difference, (1/mu1, -1/mu0) for ln(mu1/mu0) and (1/(mu1(1-mu1)), -1/(mu0(1-mu0))) for the log odds ratio. The adjusted estimate is not an additive function of the adjustment columns, so a leave-one-out difference depends on order and form and is refused."
reference = "docs/guides/descriptive-comparison.md"
guarantee = "descriptive_arithmetic_and_first_order_delta_method_point_only"
graph_class = "None: the cell takes no causal graph and adds no identification claim. It reports on estimates the caller already holds."
population_semantics = "The raw contrast averages over all complete observed rows; the adjusted estimate must target the all-observed population with a 1-versus-0 difference-of-means coding, else the comparison is refused. A transform is of the mean pair as supplied."
evidence_family = "Outcome and 0/1 treatment rows plus an adjusted estimate and its declared coding; or a pair of arm means with the joint covariance the source estimate published."
provider = "antecedent_estimate::descriptive_comparison: two-pass arm summaries, Welch variance, closed-form gradients and J Sigma J'; no estimator, optimiser or second ML stack."
estimand = "Descriptive: raw minus adjusted difference of means; and the declared transforms (mean_difference, risk_difference, log_risk_ratio, log_odds_ratio) of a mean-outcome pair. Not a causal decomposition."
inference_claim = "point_only"
inference_notes = "Point only. The delta-method covariance is exact algebra of a first-order approximation and is published only when the source carries Sigma; a Wald interval on a transformed scale rests on asymptotic normality and a linearization near the boundary of the scale that no coverage record measures, so the interval route is closed with cell_not_licensed. The raw-minus-adjusted gap carries no interval: the covariance of the raw and the adjusted estimate is not carried and not assumed zero. No calibration is run."
owners = ["antecedent-estimate", "python/antecedent/descriptive"]
identity_inputs = ["arm sufficient statistics (count, mean, sum of squared deviations) of the raw contrast", "the adjusted estimate, its standard error and its declared coding", "the mean pair and its declared joint covariance"]
wire_changes = ["Additive: descriptive_comparison_v1 JSON artifact (DescriptiveComparison.export) with the arm sufficient statistics, stored results and a SHA-256 digest; no change to existing artifacts."]
compatibility = "A new descriptive view over existing estimates: no existing route, result type, artifact or reason code changes."
coverage_records = []
search = false
bounds = { cancellation = true, cancellation_check = "polled at the first row, every 4096 rows and once after the pass; a cancelled pass reports descriptive_comparison.cancelled and no contrast", work = "one linear pass over the supplied rows plus a closed-form 2 x 2 delta method; no iteration and no search, so no loop outlives the input", max_scales = 4 }
surface = ["python/antecedent/descriptive.py"]
surface_rust = ["crates/antecedent-estimate/src/descriptive_comparison.rs"]
surface_pyo3 = ["python/src/descriptive_api.rs"]
surface_values = ["Unavailable", "Availability", "ArmSummary", "ReportingScale", "MeanPair", "ReportingContrast", "ReportingTransform", "RawContrast", "AdjustedEstimate", "DescriptiveComparison"]
refusals = [
  { code = "route_not_supported", detail = "descriptive_comparison.scale_not_supported", when = "A reporting scale other than mean_difference, risk_difference, log_risk_ratio or log_odds_ratio." },
  { code = "route_not_supported", detail = "descriptive_comparison.estimand_coding_mismatch", when = "The adjusted estimate is not a difference of means at active 1 versus control 0, so it shares no estimand coding with the raw contrast." },
  { code = "population_not_estimable", detail = "descriptive_comparison.population_not_all_observed", when = "The adjusted estimate targets a subpopulation, a treated-only effect or a reweighted population." },
  { code = "invalid_argument", detail = "descriptive_comparison.invalid_data", when = "Empty, unequal-length, non-finite or non-0/1 rows, a non-finite adjusted estimate or standard error, a non-finite mean, or no scale declared." },
  { code = "cancelled_no_claim", detail = "descriptive_comparison.cancelled", when = "The context was cancelled during the pass over the rows; no contrast is reported and the stop is not a verdict on the data." },
  { code = "arm_not_populated", detail = "descriptive_comparison.arm_not_populated", when = "A treatment arm has no rows, so there is no raw contrast." },
  { code = "invalid_argument", detail = "descriptive_comparison.arm_too_small", when = "An arm with fewer than two rows has no sample variance: the raw standard error and the independent-groups covariance are typed unavailable." },
  { code = "invalid_argument", detail = "descriptive_comparison.transform_domain", when = "A mean outside a scale's domain: risk_difference needs [0, 1], log_risk_ratio positive means, log_odds_ratio means inside (0, 1)." },
  { code = "invalid_argument", detail = "descriptive_comparison.invalid_covariance", when = "A covariance that is not finite, has a negative variance, is not positive semidefinite or not symmetric, or arm indices that are equal or out of range." },
  { code = "required_option_missing", detail = "descriptive_comparison.joint_covariance_unavailable", when = "The source carries no joint covariance of the mean pair: the transformed points are reported and the covariance is typed unavailable (never zero, never independence)." },
  { code = "effect_not_identified", detail = "descriptive_comparison.column_attribution_not_identified", when = "An attribution of the raw-minus-adjusted gap to individual adjustment columns (leave-one-out or other) is requested." },
  { code = "cell_not_licensed", detail = "descriptive_comparison.interval_withheld", when = "An interval on a transformed scale is requested; no coverage record measures the delta-method Wald interval." },
  { code = "cell_not_licensed", detail = "descriptive_comparison.gap_interval_unavailable", when = "The gap between the raw and the adjusted estimate has no standard error or interval: their covariance is not carried and not assumed zero." },
]
routes = [
