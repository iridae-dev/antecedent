  { id = "x4.smoothed_dose_quadrature.negative", role = "negative", intent = "A linear fit on a hinge basis with its kink inside the window is integrated exactly after the split (two pieces, closed-form hinge moment, never gated); a step-shaped tree fit is gated on the largest target-row Q-vs-2Q difference and refuses with quadrature_tolerance at a tolerance between the grid-averaged and the largest row difference, and passes at the largest.", evidence_test = "crates/antecedent/tests/smoothed_dose_lifecycle.rs", evidence_assertion = "a_kinked_fitted_curve_surfaces_its_quadrature_error_and_refuses_at_a_tight_tolerance" },
  { id = "x4.smoothed_dose_cancellation.negative", role = "negative", intent = "Cancellation raised by the predictor on the third of four quadrature chunks stops the bounded loop at the next poll with transport_budget_cancel (the fourth chunk is never predicted). The mandatory workspace cap (hard limit equal to the estimate runs, one byte below refuses before any fit) is asserted by the estimator-layer route test, and the consumer's memory limit and cancellation by the io-wire consume test.", evidence_test = "crates/antecedent-estimate/src/smoothed_dose.rs", evidence_assertion = "cancellation_mid_quadrature_stops_at_the_next_chunk" },
