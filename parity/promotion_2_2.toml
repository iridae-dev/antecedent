  { id = "x8.cancellation_mid_fit.negative", role = "negative", intent = "A cancellation raised at any chosen poll in the middle of the fit (first, early, middle, last) stops it at that poll with the typed Cancelled error and no effect, for both mechanism families; the uncancelled fit polls many times and answers.", evidence_test = "crates/antecedent/src/cross_world.rs", evidence_assertion = "a_context_cancelled_mid_fit_stops_the_fit_without_a_result" },
  { id = "x8.data_binding.artifact", role = "artifact", intent = "The artifact carries a data digest separate from the premises digest; a caller's own digest accepts the artifact computed on that table and refuses another with DataIdentityMismatch.", evidence_test = "crates/antecedent/tests/cross_world_edge_contrast.rs", evidence_assertion = "the_artifact_is_bound_to_the_data_it_was_computed_on" },
