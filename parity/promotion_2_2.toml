[[record]]
id = "2.2A.X8.path_specific_edge_intervention"
workstream = "X8"
milestone = "A"
work_package = "A5"
status = "promoted"
scope_decision = "Strategically stronger scope chosen by the user (TODO A5, second option): one fixed-DAG path-specific edge-intervention cell, built as groundwork for B5 (ADMG counterfactual identification). The natural direct effect (the existing licensed cell, reproduced exactly) and the natural indirect effect are special cases of an edge set, not separate routes."
existing_surface = "NestedCounterfactualEffect already licenses the natural direct effect through the Study route (mediation.linear); it and its artifacts are unchanged. MediationEffect NaturalIndirect is a product-of-coefficients plug-in with no cross-world engine and is neither promoted nor retired here. This cell is a separate stage API (antecedent::cross_world, antecedent.cross_world) over the same fitted-SCM machinery."
consumer_question = "On a fixed fully observed DAG, how much of the treatment effect flows along a chosen set of edges while every other edge sees the baseline value?"
theorem = "Path-specific effects in a fully specified structural causal model (Pearl 2001 natural effects; Avin, Shpitser & Pearl 2005 recanting-witness criterion; Shpitser 2013 edge interventions), evaluated by coupled abduction-action-prediction: one exogenous term per unit and variable (the outcome's included), shared by every world, each edge reading its parent from the world its route names. Consistency (a unit's observed values are its values under the treatment received) is a named premise that holds by construction of abduction and is not tested from data; the code enforces well-posed abduction (exact inversion of an invertible mechanism)."
reference = "https://arxiv.org/abs/1301.2300"
guarantee = "exact_under_specified_scm"
graph_class = "Explicit Markovian DAG of at most 8 observed variables with a single treatment and outcome: no latent confounding, no accepted or uncertain structure, no equivalence class, no temporal graph. B5 replaces the check with counterfactual identification on ADMGs."
population_semantics = "Fixed single population; the shared exogenous term is per unit; no transport."
evidence_family = "Structural model fitted to one tabular sample (separable linear-Gaussian mechanisms, or a non-separable outcome basis that makes each unit's abduced disturbance observable); exact SCM truth fixtures."
provider = "antecedent_counterfactual::cross_world::evaluate_cross_world over the nested route's mechanism fits (antecedent::gcm::fit_nested_mechanisms)."
estimand = "E[Y_1] - E[Y_0]: world 0 is do(X = control) with every edge reading its own world; world 1 is do(X = active) with each edge reading either world 1 (sees the intervened value) or world 0 (sees the baseline value); one shared abduced exogenous term per unit and variable, for the outcome as for every other variable. NDE = edge set {X->Y}; NIE = {X->M, M->Y}. Named premises: consistency by construction, Markovian no latent confounding, invariant mechanisms, correct mechanism specification (none of the last three or consistency is tested from data)."
inference_claim = "point_only"
inference_notes = "No sampling interval and no Bayesian posterior; a request for either is refused. No sampling theory is added or calibrated. The artifact consumer gives deterministic replay plus an independent closed-form cross-check for both mechanism families. Still open, by design: model adequacy, consistency and Markovianity are named premises no check verifies; replay cannot detect a producer that seals a wrong table or query on purpose; the independent check restates the fitter's specification (it detects implementation drift, not a shared specification error) and declines singular or ill-conditioned designs; cancellation is polled per node, candidate family and cross-validation fold, not inside one design solve."
owners = ["antecedent-core", "antecedent-identify", "antecedent-counterfactual", "antecedent-io", "antecedent", "python"]
identity_inputs = ["variable names", "directed graph edges", "canonical cross-world query (worlds, hard interventions as IEEE bits, per-edge routes, exogenous coupling, observed contrast)", "estimand label", "mechanism family", "data digest of the factual table (variable names and value bits, DataSnapshot domain)"]
wire_changes = ["Additive: cross-world edge contrast artifact v1 (separate format, feature cross_world_edge_contrast_v1) carrying the query, witness, table, data digest and point; every wire struct rejects unknown fields, so a later format (bidirected edges, B5) is a new version. No 2.1 wire or artifact changes."]
compatibility = "The NDE cell, its Study route and its artifacts are unchanged and their result is reproduced by the edge-set {X->Y} to 1e-12 on the exact linear SCM and 1e-9 on noisy and non-separable fixtures. The new route is additive through its own artifact version."
coverage_records = []
search = false
bounds = { cancellation = true, max_variables = 8, max_worlds = 8, max_rows = 100000 }
surface = ["python/antecedent/cross_world.py"]
surface_rust = ["crates/antecedent-core/src/query/cross_world.rs", "crates/antecedent-identify/src/cross_world.rs", "crates/antecedent-counterfactual/src/cross_world.rs", "crates/antecedent-io/src/cross_world_artifact.rs", "crates/antecedent/src/cross_world.rs"]
surface_pyo3 = ["python/src/cross_world_api.rs"]
surface_values = ["CrossWorldEffect", "EdgeIntervention", "CrossWorldRefusal", "CounterfactualNode", "CrossWorldWitness", "CrossWorldOptions", "CrossWorldEvaluation", "CrossWorldArtifactError", "CrossWorldWorldWire", "CrossWorldQueryWire", "CrossWorldArtifactWire", "WorldId", "EdgeRoute", "WorldSpec", "ExogenousCoupling", "WorldObservation", "CrossWorldQuery"]
surface_internal = [
  { name = "check_cross_world_edges", why = "The explicit node-count and sorted-edge-list form of the identify route's check_cross_world; the artifact consumer replays a stored witness through it without rebuilding a Dag. Same contract and refusals, hidden so the graph-taking check is the one public entry." },
  { name = "cross_world_data_digest", why = "Digest helper the facade seals and consumes artifacts with (the data identity the for_data consumer compares); no execution, hidden so the consume route is the public entry." },
  { name = "cross_world_identity", why = "Premises-digest helper shared by the artifact sealer and the facade consumer; no execution, hidden so the consume route is the public entry." },
]
refusals = [
  { code = "route_not_supported", detail = "cross_world.query_outside_contract", when = "A well-formed query shape the two-world contract does not implement: another number of worlds, a coupling other than one shared exogenous term, a baseline that reads another world, another treatment per world, or a contrast that is not the one outcome in world 1 minus world 0. Not a nonidentification claim." },
  { code = "cross_world_not_identified", detail = "cross_world.recanting_witness", when = "A non-treatment variable is needed in both worlds by one contrast term while taking a different value in each (Avin, Shpitser & Pearl 2005); its cross-world joint law is not identified." },
  { code = "cell_not_licensed", detail = "cross_world.graph_outside_contract", when = "Accepted, uncertain, latent-confounded (Admg), equivalence-class (Cpdag/Pag) or temporal structure, or a DAG of more than 8 variables or that is not acyclic." },
  { code = "estimator_inference_mismatch", detail = "cross_world.interval_requested", when = "A sampling interval or Bayesian inference is requested." },
  { code = "invalid_argument", detail = "cross_world.invalid_query", when = "Unknown variables (in Python too), equal treatment and outcome, routed edges that are not graph edges, a table whose width disagrees with the graph, non-float64 or non-finite data, or ill-posed abduction (a mechanism that cannot be inverted on the data, or exogenous terms that are posterior or prior draws rather than exact inversions). Not a consistency test: consistency holds by construction of abduction." },
]
