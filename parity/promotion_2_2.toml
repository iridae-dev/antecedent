[[record]]
id = "2.2E.E2.penalized_propensity_aipw"
workstream = "E2"
milestone = "E"
work_package = "E2"
status = "promoted"
consumer_question = "With adjustment covariates and a propensity the plain logistic cannot fit (separation, collinearity) or fits badly, what cross-fitted AIPW estimate and standard error does an explicit ridge- or lasso-logistic propensity give, with the score table kept for retargeting, and what does a failed GLM propensity fit fall back to?"
theorem = "Derived in-repo (docs/guides/penalized-aipw.md). With nuisances eta_k fit without fold k (the penalty, and for a lasso the support, chosen on that complement), theta_hat - theta0 = n^-1 sum psi(W; eta0) - theta0 plus a remainder; conditional on the complement the held-out rows are independent of eta_k, which training-only tuning and selection protect. The conditional-mean part of the remainder equals E[(e_hat - e0) ((mu1_hat - mu1)/e_hat + (mu0_hat - mu0)/(1 - e_hat))], so under the remainder condition ||e_k - e0|| ||mu_k - mu|| = o_p(n^-1/2) (assumed, not checked: ridge with a fixed grid when p = o(n^1/2); lasso when s p log p = o(n) under compatibility) the influence-function variance applies and its plug-in, the sample variance of the stored scores, is the published SE; the refit bootstrap repeats the fold plan, penalty and support selection and every nuisance fit on each resample and rests on the same condition. Neither recovers a penalty bias that violates the condition. The point is the mean of the stored out-of-fold scores exactly."
reference = "docs/guides/penalized-aipw.md"
guarantee = "cross_fitted_aipw_scores_with_conditional_influence_and_refit_bootstrap_intervals"
graph_class = "Back-door adjustment DAG: the adjustment set of one identified AllObserved mean ATE with binary treatment; the route takes the identification the AIPW route already holds and adds no graph class."
population_semantics = "All observed complete-case rows; the untrimmed AllObserved population only. Trimmed fits, ATT/ATC, predicate and custom-weight populations, and non-mean functionals are refused (a lasso there with selection_inference_not_licensed)."
evidence_family = "Complete-case rows of a binary treatment, an outcome and the declared adjustment covariates; the fold plan is the seeded, arm-stratified, unit-level plan keyed by the analysis seed."
provider = "antecedent_learn::RidgeLogisticLearner (via fit_glm_ridge), antecedent_learn::LassoLogisticLearner (proximal Newton with coordinate descent, KKT-checked) and antecedent_learn::cross_fit_with_folds for the inner penalty selection; arm-wise OLS outcomes through the existing cross-fitted AIPW builder. No second ML stack."
estimand = "theta = E[mu1(X) - mu0(X)], the average treatment effect over the observed population, estimated by the cross-fitted AIPW score mean."
inference_claim = "calibrated"
inference_notes = "Two interval constructions on the cross-fitted scores, both conditional on the stated remainder condition: the cross-fitted influence-function SE (se_analytic, iid joint covariance, influence values and the retarget covariance as for the unpenalized route) and, with bootstrap > 0, a refit bootstrap whose every replicate repeats the fold plan, penalty (and lasso support) selection and nuisance fits, recorded per replicate. The four ridge/lasso analytic/bootstrap 95% coverage records are measured and bind to the facade key's exact nuisance label, grid, interval method, sample-size range and bootstrap count; other coordinates are scope_not_assessed. A declared GLM-to-ridge/lasso fallback re-runs the whole route with the destination and records the failed fit, but its distinct calibration key has no coverage record, so its interval remains scope_not_assessed."
owners = ["antecedent-estimate", "antecedent", "python/antecedent/estimators"]
identity_inputs = ["the canonical propensity nuisance (PropensityNuisance::canonical_key: penalty kind, sorted penalty grid bit patterns, inner folds, and the fallback destination with its tuning) in the estimator-spec identity", "the score table's nuisance provenance (canonical configuration, the penalty selected per fold, a lasso's selected support per fold, and a fallback's failed fit and declared configuration) in the score-reuse identity", "the calibration key's functional label (+propensity=...), so an interval binds only to records measured under the same nuisance", "fold seed and fold plan", "complete-case row identities"]
wire_changes = ["Additive: a non-default propensity nuisance appears in the Aipw estimator-spec identity (treatment_config) and in the score table's nuisance_provenance and the calibration functional label; the default configuration writes none of them, so existing digests are unchanged. EffectEstimate gains a penalized report (fallback record, lasso support, refit-bootstrap record) that is not part of the result wire."]
compatibility = "The default Aipw (unpenalized logistic, no fallback) is bit-identical to before; only a declared penalty or fallback changes anything. A penalized table is no longer interval-withheld: it retargets with its covariance like an unpenalized one (cluster-DML and joint-cell tables stay withheld). The checked AIPW procedure names are unchanged and the nuisance configuration is carried beside them."
coverage_records = ["cov.average_effect.dag.frequentist.analytic_se.l95.aipw_ridge_influence_ci_coverage", "cov.average_effect.dag.frequentist.bootstrap_se.l95.aipw_ridge_refit_bootstrap_ci_coverage", "cov.average_effect.dag.frequentist.analytic_se.l95.aipw_lasso_influence_ci_coverage", "cov.average_effect.dag.frequentist.bootstrap_se.l95.aipw_lasso_refit_bootstrap_ci_coverage"]
search = false
bounds = { cancellation = true, max_grid = 64, max_inner_folds = 20 }
refusals = [
  { code = "invalid_argument", detail = "penalized_propensity.invalid_penalty", when = "A penalty grid that is empty or larger than 64, a penalty that is not finite and positive, or inner folds outside 2 to 20." },
  { code = "invalid_argument", detail = "penalized_propensity.fallback_with_penalty", when = "A nuisance fallback is declared beside a penalized propensity: the fallback replaces a failed GLM fit, so it could never run." },
  { code = "route_not_supported", detail = "penalized_propensity.scope", when = "A ridge penalty with a non-mean functional, a target population other than AllObserved, or a trimming overlap policy." },
  { code = "selection_inference_not_licensed", detail = "penalized_propensity.selection_closed", when = "A lasso propensity outside the cross-fitted untrimmed AllObserved mean ATE (a full-sample lasso would select on the rows it scores), or a lasso declared as a joint-cell conditional." },
  { code = "nuisance_fallback_not_licensed", detail = "penalized_propensity.fallback_closed", when = "A GLM nuisance fit fails under a declared ML fallback, or under any fallback on a full-sample route; the failed fit is recorded in the refusal and no fallback result is produced." },
  { code = "cancelled_no_claim", detail = "penalized_propensity.cancelled", when = "Penalty selection was cancelled; no estimate is reported and the stop is not a verdict on the data." },
]
routes = [
