# 2.2 promotion records (ROADMAP.md 2.2 A/B; work package A0).
#
# One record per 2.2 cell freezes its scientific surface before implementation:
# consumer question, theorem, graph class, population semantics, evidence family,
# provider, estimand, inference claim, computation bound and refusal boundary.
# scripts/check_promotion_records.py (run by scripts/gate_promotion.sh) enforces:
#
#   - every frozen field is present and every refusal code is registered;
#   - a bounded search declares cancellation, operation, depth and memory limits,
#     and once in_progress names `search_impl` files that run under SearchBudget
#     and together call `.charge(` on it (metered, not only pre-flighted);
#   - a route is `licensed` only when its record carries the evidence: always once
#     `promoted`; while `in_progress` only for a non-uncertainty route declaring
#     `claim = "point_only"` or `"none"` whose record already cites executed
#     positive, negative, artifact (and, for a search, budget) fixtures. An
#     uncertainty route is never licensed before promotion;
#   - every route has a row in its owning registry that agrees with it
#     (parity/transport_stages.toml [[routes]], or support_licensed.toml cells /
#     support_closed.toml [[closed_contrast]] rows), same status and reason_code;
#   - once `in_progress` or `promoted`: every closed route cites an executed
#     runtime-refusal test (`refusal_test` + `refusal_assertion`) that observes its
#     reason_code; the record's refusal details equal the `"<ns>.<detail>"` literals
#     in non-test source (crates/*/src, python/src, python/antecedent); every public
#     symbol of the record's `surface*` files is a route-name component, an entry in
#     a route's `covers = ["symbol", "Type.method", ...]` (extra public symbols that
#     route accounts for, so route names stay meaningful identifiers; every entry must
#     be a real public symbol of a scanned surface file, and a warning is printed when
#     it appears in no cited evidence test closure nor the route's own entry-point
#     file), a value type listed in `surface_values` (which also covers that type's
#     non-executing methods: Rust inherent methods and the #[pymethods] getters of a
#     #[pyclass]; methods named run/execute/evaluate/decide/identify/prepare/estimate/
#     consume/fit, plus refresh/export on pyclasses, are never covered this way and
#     need a route or `surface_internal`), or a `surface_internal` item;
#   - a `promoted` record cites executed positive, negative, artifact (and, for a
#     search, budget) fixtures, plus coverage records for any calibrated interval;
#   - no 2.2 record publishes a nominal-only interval: `estimator_grid_not_measured`
#     is not a 2.2 inference claim and may not appear on a licensed route or owning
#     row of in_progress/promoted work.
#
# Record status: frozen -> in_progress -> promoted, or carried_forward (the cell
# failed its gate; its refusal stays visible and the rest of 2.2 still ships).
# Closed routes are refused at runtime; on licensing, the owning registry row
# flips to licensed together with the record route.
#
# Inference-claim vocabulary (release notes must use the same words):
#   point_only            exact or plug-in point, no interval
#   calibrated            interval with a coverage record at its own coordinate
#   structural_envelope   range over supplied structural scenarios; not a CI
#   assumption_range      range over a declared sensitivity set; not a CI
#   none                  no numerical claim (identification/inspection only)
