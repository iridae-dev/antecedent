fixtures = [
  { id = "x8.exact_scm_edge_sets.positive", role = "positive", intent = "All eight edge sets of the mediation DAG match the exact closed-form SCM effect.", evidence_test = "crates/antecedent/tests/cross_world_edge_contrast.rs", evidence_assertion = "exact_linear_scm_truth_for_every_edge_set" },
  { id = "x8.non_separable_shared_abduction.truth", role = "truth", intent = "A non-separable outcome makes the per-unit shared abduced disturbance observable: the answer matches the per-unit structural truth and differs from the conditional-mean plug-in.", evidence_test = "crates/antecedent/tests/cross_world_edge_contrast.rs", evidence_assertion = "per_unit_shared_abduction_is_observable_under_a_non_separable_mechanism" },
  { id = "x8.per_unit_sharing.truth", role = "truth", intent = "Per-unit contrasts under the natural indirect edge set equal the structural contrast built from each unit's own abduced disturbance in both worlds and differ from a mismatched-unit (unshared) pairing; the point alone cannot see this because a mean is permutation invariant.", evidence_test = "crates/antecedent/tests/cross_world_edge_contrast.rs", evidence_assertion = "per_unit_effects_use_one_shared_exogenous_term_across_worlds" },
  { id = "x8.outcome_noise_sharing.truth", role = "truth", intent = "With a noisy outcome (linear-Gaussian, exact to 1e-8 per unit) each world's counterfactual outcome for a unit contains that unit's own outcome disturbance, so an outcome disturbance not shared per unit fails.", evidence_test = "crates/antecedent/tests/cross_world_edge_contrast.rs", evidence_assertion = "the_outcome_noise_is_shared_per_unit_across_worlds" },
  { id = "x8.outcome_noise_non_separable.truth", role = "truth", intent = "With a noisy outcome under the non-separable basis the per-unit contrasts follow each unit's own mediator disturbance and the outcome disturbance cancels; a rotated outcome disturbance leaves a residual more than four times the fit error.", evidence_test = "crates/antecedent/tests/cross_world_edge_contrast.rs", evidence_assertion = "the_outcome_noise_is_shared_per_unit_under_the_non_separable_mechanism" },
  { id = "x8.edge_vs_node_level.truth", role = "truth", intent = "The all-edges answer equals the node-level counterfactual total from counterfactual_ite (1e-6); an edge set that omits a path differs from it by exactly the omitted path's effect (9.6 and 5.1 on the linear SCM); under interaction the natural effects are neither the structural total nor additive.", evidence_test = "crates/antecedent/tests/cross_world_edge_contrast.rs", evidence_assertion = "edge_answer_differs_from_the_node_level_intervention" },
  { id = "x8.nde_regression.regression", role = "regression", intent = "The edge set {X->Y} reproduces the existing licensed natural direct effect through the Study route on the exact linear SCM.", evidence_test = "crates/antecedent/tests/cross_world_edge_contrast.rs", evidence_assertion = "natural_direct_effect_regression_against_the_existing_cell" },
  { id = "x8.nde_noisy_regression.regression", role = "regression", intent = "The edge set {X->Y} reproduces the Study natural direct effect to 1e-9 on a noisy-mediator noisy-outcome linear SCM and on a non-separable SCM with a noisy outcome (same linear-Gaussian fit and abduction engine, so only summation order differs).", evidence_test = "crates/antecedent/tests/cross_world_edge_contrast.rs", evidence_assertion = "natural_direct_effect_regression_on_noisy_and_non_separable_fixtures" },
  { id = "x8.nde_engine_regression.regression", role = "regression", intent = "The edge set {X->Y} reproduces the existing nested operation on both the separable and the non-separable mechanism, on a noisy-outcome non-separable SCM.", evidence_test = "crates/antecedent/src/cross_world.rs", evidence_assertion = "natural_direct_edge_contrast_reproduces_the_existing_nested_operation" },
  { id = "x8.nonidentification.negative", role = "negative", intent = "A recanting witness refuses with cross_world_not_identified; three worlds, a mixed-outcome contrast and a baseline that reads another world refuse with route_not_supported (query_outside_contract), never as unidentified.", evidence_test = "crates/antecedent/tests/cross_world_edge_contrast.rs", evidence_assertion = "nonidentified_cross_world_queries_refuse_with_cross_world_not_identified" },
  { id = "x8.abduction_invertible.positive", role = "positive", intent = "Abduction is exact inversion (NoiseInferenceKind::Invertible) on the separable and the non-separable mechanism with a noisy outcome. This is what the operation enforces; consistency is a premise that holds by construction, not a tested property.", evidence_test = "crates/antecedent/tests/cross_world_edge_contrast.rs", evidence_assertion = "abduction_is_exact_inversion_on_both_mechanism_families" },
