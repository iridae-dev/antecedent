  { id = "x4.smoothed_dose_exact_integration.positive", role = "positive", intent = "The closed-form psi_h agrees with independent numerical integration of the SCM; with every window split at the knots inside it, the estimator's quadrature of every stored polynomial or hinge fold model (knots inside every window) equals its exact closed-form kernel integral, with no tolerance gated; the oracle score with true nuisances is centred on psi_h.", evidence_test = "crates/antecedent/tests/smoothed_dose_lifecycle.rs", evidence_assertion = "quadrature_matches_exact_integration_and_the_oracle_score_is_centred" },
  { id = "x4.smoothed_dose_smoothing_bias.positive", role = "positive", intent = "Curvature fixture: the estimate targets psi_h, not psi_0 (the h^2/5 gap is detected); the plug-in psi_h - psi_{h/2} diagnostic matches its closed form 3 h^2/20 and is never added to the estimate.", evidence_test = "crates/antecedent/tests/smoothed_dose_lifecycle.rs", evidence_assertion = "smoothing_bias_is_reported_apart_and_the_estimate_targets_psi_h" },
  { id = "x4.smoothed_dose_misspecified_nuisance.positive", role = "positive", intent = "One nuisance family wrong at a time, at off-centre grid doses 0.75, 1.5, 2.5 and 3.25, tolerance four influence-function standard errors, both designs. Outcome wrong (truth Y = A^2 + X(1 + A/2) + X A^2, fit linear in the dose, so the fit error varies with X), membership right: the estimator is within tolerance, the plug-in misses by more than 2.5 tolerances at three or more doses, and the smoothing-bias diagnostic is exactly zero; on the same fitted nuisances the point with a constant odds weight leaves the tolerance at three or more doses and the point with a constant dose density at one or more (both asserted). Membership wrong (linear logistic against a variance-shifted target), outcome right: the estimator is within tolerance while the weighting-only estimator with the same fitted odds is more than two tolerances off at every dose. Both wrong is not claimed.", evidence_test = "crates/antecedent/tests/smoothed_dose_lifecycle.rs", evidence_assertion = "misspecified_nuisance_cases_match_only_the_claimed_robustness" },
