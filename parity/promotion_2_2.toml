  { name = "antecedent_estimate.refuse_column_attribution", stage = "evaluate", status = "closed", permanent_in_release = true, reason_code = "effect_not_identified", refusal_test = "crates/antecedent-estimate/tests/descriptive_comparison.rs", refusal_assertion = "an_interval_and_a_column_attribution_are_closed_routes" },
  { name = "antecedent.descriptive.raw_vs_adjusted", stage = "evaluate", status = "licensed", claim = "point_only" },
