[[record]]
id = "2.2B.X10.binary_observation_recovery"
workstream = "X10"
milestone = "B"
work_package = "B6"
status = "promoted"
consumer_question = "When some binary variables are item-missing (explicit response indicators and proxies), can the full law of the complete data P(X(1), O) be recovered from one named observed pattern law, and then feed an ordinary identifier for a causal effect?"
theorem = "Full-law identification in missing-data DAGs (Nabi, Bhattacharya and Shpitser, ICML 2020): no self-censoring edge X_i -> R_i and no colluder X_j -> R_i <- R_j is necessary and sufficient under positivity. PAPER-INHERITED: only the abstract was read; theorem numbers, the colluder definition and the odds-ratio formula are unverified. This cell does not rely on the paper for its own claims: within its bounded class (binary DAG m-graph, response indicators with parents among the substantive variables only, no R -> R edges, deterministic proxies) the recovery formula P(x, o) = P(R = 1, X* = x, O = o) / prod_i p(R_i = 1 | pa(R_i)), each propensity a ratio of observed pattern margins P(R_i = 1, R_S = 1, X*_S = x_S, O_pa) / P(R_S = 1, X*_S = x_S, O_pa) with S the partially observed parents of R_i, is derived in-repo from the m-graph factorization and local Markov property and checked against enumerated SCM truth (soundness), and every self-censoring graph gets an exact-arithmetic self-certifying witness (two positive models Markov to the graph that agree on the observed law and differ on the target), so the in-class decision is complete by in-repo proof over every model Markov to the m-graph. The witness models are degenerate (every other mechanism an independent fair coin, not faithful to the graph), so a nonrecoverable verdict means not recoverable for every model Markov to the m-graph; it claims nothing under faithful or generic parameters, where some self-censoring graphs (for example a shadow-variable graph Z -> X -> R_X with Z not a parent of R_X) are generically identified, an assumption this cell does not make. The colluder obstruction concerns the full law including the response mechanism; for the target P(X(1), O) the colluder archetype is not an obstruction (the target is recoverable there), so R -> R edges are refused as an unsupported mechanism, never as nonrecoverable."
reference = "https://arxiv.org/abs/2004.04872"
guarantee = "sound_incomplete"
graph_class = "Binary DAG m-graph over fully observed O (at most 2), partially observed X(1) (at most 3), one response indicator R_i and one proxy X*_i (domain {0, 1, ?}) per partially observed variable. R_i parents are substantive variables (X, O) only; X*_i has exactly the parents X_i and R_i and no children; substantive variables have substantive parents only. Selection nodes, bidirected edges, non-binary variables and R -> R edges are refused as unsupported mechanisms."
population_semantics = "One population. The observed pattern law is the population's law of (R, X*, O) under item non-response (no unit is absent); selected-sample laws are refused. The recovered law is a derived law of the same population: its catalog descriptor carries LawOrigin::Recovered provenance and its exact table's snapshot identity is recovered:<derivation identity> (never the observed snapshot, so it is refused if offered back as the observed law); the table keeps the observed regime id it was derived from and the SuppliedExact provider tag, which antecedent_expr has no derived-law alternative for."
evidence_family = "One named observed pattern law: a joint CatalogDistribution (A6.1) of an available, measured, whole-population observational regime over exactly R, X* and O, plus its exact table. Separate marginals, a missing coordinate or an unavailable regime refuse as a missing margin; there is no complete-case fallback and no MAR/IPCW substitution."
provider = "Existing exact finite-law evaluator (CompiledEvaluator over ExactTransportData) for the lowered recovery formula; the downstream effect through ExactEvaluationPlan over the recovered law."
estimand = "The recovered full law P(X(1), O), and optionally a downstream interventional distribution P(y | do(t)) identified by the ordinary target ID stage of sID on the causal restriction of the m-graph."
inference_claim = "point_only"
inference_notes = "Exact laws only; no interval. A sampled or empirical provider is refused as cell_not_licensed (2.3A)."
owners = ["antecedent-core", "antecedent-identify", "antecedent-expr", "antecedent-estimate", "antecedent-io", "antecedent", "python/antecedent/transport"]
identity_inputs = ["m-graph digest (nodes, directed edges)", "variable roles (partially observed, response, proxy, fully observed)", "population and observed regime", "canonical catalog-distribution identity of the observed pattern law and of every bound margin", "rule version x10.recovery.v1", "search limits and memory cap", "downstream effect query and graph", "evaluation limits and requests", "variable names", "observed law snapshot (data digest)"]
wire_changes = ["Additive: LawOrigin::Recovered { derivation } catalog origin (canonical identity origin=recovered:<derivation identity>; existing Measured and ModelArtifact spellings unchanged). Additive catalog wire field recovered_derivation on EvidenceRegimeWire, omitted for every other origin so no 2.1 regime's bytes or digest change; it round-trips the origin kind and derivation exactly, a 2.1 reader (deny_unknown_fields) refuses it rather than reading a measured law, and a regime with both model_artifact and recovered_derivation is refused. Additive: observation-recovery artifact v1 (checked_observation_recovery_point_v1)."]
compatibility = "No existing route, artifact or digest changes (default regimes serialize no new key: transport_catalog_wire descriptor_fields_round_trip_and_defaults_leave_the_wire_unchanged and legacy_catalog_without_descriptor_fields_loads_with_todays_semantics). A recovered law never supplies a population law (by origin == Measured in supplies_population_law), so it satisfies no identification factor and is no available experiment; an empty derivation identity is refused and its identity spelling is its own (a_recovered_law_never_supplies_a_factor_and_keeps_its_own_identity). It round-trips the catalog wire exactly and is never decoded as measured (a_recovered_law_round_trips_exactly_and_never_decodes_as_measured). The X9 mixed-source search excludes it as recovered_law in either kind, with no new refusal detail (a_recovered_regime_is_excluded_from_the_mixed_source_search_as_a_recovered_law)."
