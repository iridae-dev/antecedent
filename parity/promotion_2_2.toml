  { name = "antecedent.inverse.InverseOutcomeReport.verify", stage = "consume", status = "licensed", claim = "point_only" },
  { name = "antecedent.inverse.probability_target", stage = "evaluate", status = "closed", permanent_in_release = true, reason_code = "cell_not_licensed", refusal_test = "python/tests/test_inverse_outcome.py", refusal_assertion = "test_a_probability_target_is_refused_because_a_mean_is_not_a_chance_constraint" },
  { name = "antecedent.inverse.quantile_target", stage = "evaluate", status = "closed", permanent_in_release = true, reason_code = "cell_not_licensed", refusal_test = "python/tests/test_inverse_outcome.py", refusal_assertion = "test_a_quantile_target_is_refused_until_the_interventional_distribution_cell" },
  { name = "antecedent.inverse.observational_scenarios", stage = "evaluate", status = "closed", permanent_in_release = true, reason_code = "cell_not_licensed", refusal_test = "python/tests/test_inverse_outcome.py", refusal_assertion = "test_observational_scenarios_are_refused_not_turned_into_an_action" },
  { name = "antecedent.inverse.allowed_unlicensed_forward", stage = "evaluate", status = "closed", permanent_in_release = true, reason_code = "cell_not_licensed", refusal_test = "python/tests/test_inverse_outcome.py", refusal_assertion = "test_forward_claim_and_snapshot_identity_are_bound_and_unlicensed_input_refuses" },
]
fixtures = [
  { id = "e6.round_trip.truth", role = "truth", intent = "On the known structural law E[Y | do(a)] = 1 + 2a, a >= 3 holds exactly when a >= (3 - 1) / 2 = 1: the classifier's feasible set equals the analytic inverse on every grid action, the boundary action is feasible within tolerance, and the at-most goal inverts the set.", evidence_test = "crates/antecedent/src/analysis/inverse_outcome.rs", evidence_assertion = "forward_inverse_round_trip_matches_the_analytic_inverse" },
  { id = "e6.python_round_trip.positive", role = "positive", intent = "Python surface: a real Kennedy-DR response route on a confounded linear SCM (truth 1 + 0.8 mean(z) + 2a) is inverted over a dose grid; the feasible set equals the structural truth computed from the generating law and every margin is within finite-sample tolerance of it.", evidence_test = "python/tests/test_inverse_outcome.py", evidence_assertion = "test_forward_inverse_round_trip_on_a_known_structural_law_through_a_real_route" },
  { id = "e6.boundary_and_direction.positive", role = "positive", intent = "Python surface: the action exactly on the threshold meets it within tolerance with margin 0, and the at-most goal selects the lower doses.", evidence_test = "python/tests/test_inverse_outcome.py", evidence_assertion = "test_the_boundary_action_and_the_opposite_goal_follow_the_analytic_inverse" },
  { id = "e6.multiple_feasible.positive", role = "positive", intent = "Every feasible action is reported, the cheapest set keeps every cost tie, and infeasible actions are listed separately.", evidence_test = "crates/antecedent/src/analysis/inverse_outcome.rs", evidence_assertion = "several_feasible_actions_report_every_one_and_every_cost_tie" },
