[[record]]
id = "2.2E.E6.finite_action_inverse_outcome"
workstream = "E6"
milestone = "E"
work_package = "E6"
status = "promoted"
consumer_question = "Of a caller-enumerated finite set of interventions on one treatment, each with a declared cost and constraints, which reach a target mean E[Y^do(a)] >= threshold (or <=) under a licensed forward response, which are infeasible, which cannot be assessed (unsupported or off the evaluated grid), and what evidence would be missing?"
theorem = "No new identification or estimation theorem. The cell is exact enumeration: for each enumerated action a it compares the forward response's published point m(a) = E[Y^do(a)] with the threshold t, calling a feasible iff m(a) - t >= -tol (at-least; the mirror image for at-most) after declared constraints and budget and a support check. A finite-input margin that overflows finite precision is unevaluated, never classified. The truth of m(a) is exactly the licensed forward route's (a ResponseCurve mean-curve response route, identification and support inherited unchanged); this cell never refits, interpolates or extrapolates it. 'Feasible', 'infeasible', 'necessary' and 'sufficient' are relative to the enumerated action set and the forward assumptions; an action absent from the forward evaluation is unevaluated, never excluded. A threshold on a mean cannot establish a chance constraint P(Y^do(a) >= y) >= q (two laws with equal means differ in tail probabilities), a target-quantile query needs the interventional distribution (2.3B), and an observational P(X | Y) is not an intervention."
reference = "docs/guides/inverse-outcome.md"
guarantee = "exact_enumeration_point_only"
graph_class = "Whatever the forward route accepts: the cell takes no graph and adds no identification claim. It requires a scalar-outcome mean curve (ResponseCurve, static dose or temporal dose-by-horizon surface) that is point identified; identified sets, class mixtures and non-mean functionals are refused."
population_semantics = "The forward response's declared target population and the one selected outcome horizon, echoed on the report; the cell adds no population or horizon. Actions are points of the forward evaluation's own coordinates (dose, or dose and one declared horizon). An inverse report never compares actions across outcome horizons."
evidence_family = "The CausalResponseView of an existing response route evaluated on a grid containing the actions, plus the caller's action list (label, point, cost, named boolean constraints) and an optional budget and numerical tolerance. The study planner's plan and a sensitivity result may be attached as separate views; neither enters the classification or the identity."
provider = "None: no estimator is added. The forward means, support labels and any interval are read as the licensed forward route published them."
estimand = "Membership of each enumerated action in {a : E[Y^do(a)] >= threshold} (or <=), relative to the enumerated set; no density, quantile or probability target."
inference_claim = "point_only"
inference_notes = "Point-based classification. When the forward route published a pointwise or simultaneous interval, an action is flagged robustly_feasible when that interval, as published and at the forward route's own level, lies on the feasible side of the threshold; the flag adds no coverage claim (a pointwise band is not joint over the grid and selection of an action by its estimate is not adjusted for). When a temporal result publishes a pointwise interval and a separate simultaneous band, the latter is used. On a static curve the forward route's one worst-case support label is copied to every point and labelled surface_worst_case. Study-planner options are hypothetical catalog deltas, not observed evidence, and sensitivity ranges are assumption ranges, not confidence intervals."
owners = ["antecedent", "python/antecedent"]
identity_inputs = ["target (threshold, direction), numerical tolerance and budget", "the forward response as published: outcome, population, optional claim/program/data-snapshot identities, mean-response and point-identified flags, every evaluated point with its mean and support label, support basis, any interval with its scope, interpretation and level, and the declared assumptions", "every action's label, point, cost and named constraints"]
wire_changes = ["Additive: an inverse_outcome report dictionary with an order-invariant BLAKE3 identity digest over every input (rows and actions canonically sorted); no change to existing artifacts."]
compatibility = "A new cell over existing forward routes: no existing route, result type, artifact or reason code changes. The probability, quantile and observational queries reuse the existing cell_not_licensed code."
coverage_records = []
inherited_interval_fields = ["interval", "is_confidence_interval"] # forward interval metadata and the attached sensitivity view; neither is an inverse uncertainty route
search = false
surface = ["python/antecedent/_inverse.py"]
surface_rust = ["crates/antecedent/src/analysis/inverse_outcome.rs"]
surface_pyo3 = ["python/src/inverse_outcome_api.rs"]
surface_values = ["TargetDirection", "InverseQuery", "SupportBasis", "IntervalScope", "ForwardInterval", "ForwardEvaluation", "ActionConstraint", "ActionSpec", "ActionStatus", "ActionOutcome", "EnumeratedStatus", "IntervalMeta", "InverseOutcomeReport", "InverseOutcomeError", "Action", "ActionResult", "ChanceConstraint", "MissingEvidenceView", "ObservationalScenarios", "SensitivityView", "TargetMean", "TargetQuantile"]
surface_internal = [
  { name = "classify_inverse_outcome_stage", why = "Native pyfunction backing the routed Python inverse_outcome (antecedent.inverse), reached only through that wrapper; the Python route owns its evidence." },
]
bounds = { max_actions = 4096, max_forward_points = 65536, cancellation = true, cancellation_check = "once per enumerated action; a cancelled enumeration reports inverse.cancelled and no classification" }
refusals = [
  { code = "cell_not_licensed", detail = "inverse.probability_target", when = "A chance-constraint target P(Y^do(a) >= y) >= q: a mean response cannot establish it; it needs a separately identified and calibrated interventional-distribution cell." },
  { code = "cell_not_licensed", detail = "inverse.quantile_target", when = "A target-quantile inverse query: scheduled for 2.3B." },
  { code = "cell_not_licensed", detail = "inverse.observational_scenarios", when = "Observational scenarios compatible with an outcome (P(X | Y)): not an action, closed in 2.2." },
  { code = "route_not_supported", detail = "inverse.forward_not_mean_response", when = "The forward estimand is not a scalar-outcome mean curve (a derivative, contrast, Jacobian or multi-outcome response)." },
  { code = "route_not_supported", detail = "inverse.forward_not_point_identified", when = "The forward response is an identified set, a class mixture or unidentified." },
  { code = "cell_not_licensed", detail = "inverse.forward_not_licensed", when = "The forward response is marked allowed_unlicensed for compatibility and cannot license an inverse causal claim." },
  { code = "route_not_supported", detail = "inverse.bounds_exceeded", when = "More than 4096 enumerated actions or 65536 forward points." },
  { code = "invalid_argument", detail = "inverse.invalid_target", when = "A non-finite threshold, a negative or non-finite tolerance or budget, an unknown direction or query kind." },
  { code = "invalid_argument", detail = "inverse.invalid_action", when = "An empty grid, an empty or duplicate label, a point of the wrong dimension or non-finite, a non-finite or negative cost, or an empty or duplicate constraint name." },
  { code = "invalid_argument", detail = "inverse.invalid_forward", when = "A forward evaluation with no points, mismatched lengths, non-finite or repeated points, an unknown support or interval label, or an interval with unordered endpoints or a level outside (0, 1)." },
  { code = "transport_budget_cancel", detail = "inverse.cancelled", when = "Cancellation stopped the enumeration; no classification is reported and the stop is never a verdict." },
]
routes = [
