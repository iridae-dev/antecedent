  { code = "invalid_argument", detail = "study_plan.invalid_candidate", when = "A duplicate or malformed candidate id, zero or oversized cost, empty margin, a population that is neither the target nor a declared source, a source experiment outside its controllables, a target experiment on route Mz, a value-restricted study on route Mixed, an invalid level, an unknown requires/conflicts id, a level label id#k that a base regime already uses, or a regime label two candidates share (checked before any work, so no subset preview can fail mid-plan)." },
