  { id = "x5.mutated_artifact.negative", role = "negative", intent = "Typed mutation tests: sequence, horizon, names, graph, selections, slots, question, limits, report parts, provider and laws fail independent consumption.", evidence_test = "crates/antecedent/tests/temporal_transport.rs", evidence_assertion = "a_mutated_artifact_fails_independent_consumption_with_typed_errors" },
