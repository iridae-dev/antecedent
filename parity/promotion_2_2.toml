[[record]]
id = "2.2B.X6.study_planning"
workstream = "X6"
milestone = "B"
work_package = "B4"
status = "promoted"
consumer_question = "Given a failed X1 (mz) or X9 (mixed-source) decision and a declared universe of candidate studies with integer costs, which cheapest subset of at most three studies would, if it delivered exactly the declared regimes, make the same route identify the query, and which factor or proof step does it repair?"
theorem = "No new identification theorem. Sufficiency is the soundness of the X1 route (TR^mz, R-443 Theorems 3-5 and Corollary 1, paper-inherited as in 2.2A.X1) or the X9 route (sound, incomplete bounded rule search, x9.rules.v1) re-run on the preview catalog: a candidate subset is sufficient only when the re-run decision returns Identified and the derivation re-checks (binds, and for X9 replays through the independent checker) against the preview catalog. Minimum-cost intervention design is NP-complete in general (Akbari, Etesami and Kiyavash, ICML 2022; graph class and intervention model not verified: paper-inherited), so the planner is an exhaustive, bounded enumeration of a declared universe in cost order, not an optimizer. Positivity of every proposed regime is an explicit premise (Revisiting the General Identifiability Problem, arXiv 2206.01081). 'No sufficient candidate' is none_certified within the universe, never impossible; the only theorem-limited shortcut is a replayed X1 ProvenNonTransportable base decision (paper-inherited through the X1 record), whose obstruction concerns the declared controllable sets, so no in-controllable study repairs it; a new population or a wider controllable set is outside this universe."
reference = "https://proceedings.mlr.press/v162/akbari22a.html"
guarantee = "sound_incomplete"
graph_class = "Exactly the X1 class on route Mz (2-4 sources, at most 12 observed variables, 1-4 controllables per source) and exactly the X9 class on route Mixed (at most 10 observed variables, at most 16 usable distributions); the planner adds no graph of its own."
population_semantics = "The base catalog's populations only: a candidate study is collected in the target or in a declared source; new populations or environments are deferred (the catalog delta carries regimes only). Source experiments stay inside the source's declared controllable set; the target never experiments on route Mz; value-restricted studies are refused on route Mixed (X9 states identification for every level)."
evidence_family = "Declared hypothetical regimes compiled to a typed EvidenceCatalogDelta: a joint-law do(Z) study (one regime per declared feasible level combination, or one unrestricted family) with its jointly measured margin, or an observational margin. Separate marginals never count as a joint. A preview is never available evidence: arrival rebuilds the real catalog and re-identifies through the public X1/X9 route."
provider = "None: the plan has no numeric output. Arrival hands the re-identified decision to the existing X1/X9 providers."
estimand = "Identification of the frozen X1/X9 query only; no numeric claim, no probability of success."
inference_claim = "none"
inference_notes = "Structural plus declared integer cost (u64 cost units); ranking key (cost units, sample budget, subset size, sorted candidate ids), versioned x6.ranking.v1. Minimality is claimed only when every strictly cheaper feasible subset of at most three candidates was decided without a stop or an over-cap decision, and means cost-minimal among the verified-derivable subsets of at most three candidates of this declared universe under this search and rule set, never minimal sufficient evidence: a cheaper subset of four or more candidates is never examined, and a cheaper subset the route refuses (for example over the X9 usable-distribution bound) or leaves underivable keeps the claim, since it is only not sufficient under this search. Supersets of a sufficient subset are skipped for ranking only and listed dominated; no monotonicity is claimed."
owners = ["antecedent-core", "antecedent-identify", "antecedent-design", "antecedent", "python/antecedent/transport"]
identity_inputs = ["route (Mz or Mixed) and its frozen rule-set version (x9.rules.v1 for Mixed)", "graph digest", "canonical query", "the whole base catalog (environments, regimes, bindings and snapshots)", "every candidate declaration (population, interventions, levels, margin, recruitment, cost units, sample budget, requires/conflicts, feasibility notes)", "compiled regime ids", "plan limits and memory cap", "ranking version", "frozen base failure (reason code, detail, stages)"]
wire_changes = ["Additive: study-plan artifact v1 (study_plan_v1) with the route, graph, query, base catalog, candidate declarations, plan limits, frozen base failure, every subset outcome, proposals with repaired factors and proof-derived required margins, the stop receipt and the minimality flag; a premises digest and a separate data digest; no change to existing artifacts."]
compatibility = "The 2.1 classical and z planners and every X1/X9 surface are unchanged; the planner re-runs the named decide_* on the shared-budget paths (a double charge on a named X9 route) rather than extending MixedSourceDecision::NamedRoute."
coverage_records = []
