  { code = "row_weights_bound_to_snapshot", detail = "batch_retarget.mixed_snapshot", when = "The plans' score tables were built on different complete-case rows, or the family was declared on a different snapshot than the scores hold." },
  { code = "score_table_unavailable", detail = "batch_retarget.scores_unavailable", when = "A plan prepared no score table (not an AllObserved iid AIPW or cell-AIPW plan); its members fail." },
  { code = "score_table_unavailable", detail = "batch_retarget.scores_unavailable_after_estimate", when = "A plan's estimate kept no score table; the prepare-time rows are never substituted and its members fail." },
  { code = "route_not_supported", detail = "batch_retarget.functional_not_licensed", when = "A claim on a quantile or exceedance grid, or a plan whose scores carry no arm contrast or requested cell; the single-claim retarget keeps those." },
  { code = "route_not_supported", detail = "batch_retarget.covariance_unavailable", when = "The joint covariance is not finite, a contrast variance is negative beyond rounding, or no covariance-bearing member exists; or the max-t evaluator is given a matrix that is not a finite symmetric positive semidefinite correlation with a unit diagonal." },
  { code = "cell_not_licensed", detail = "batch_retarget.weighted_overlap_failed", when = "A claim's declared target fails the weighted overlap gate (effective sample size per arm or extreme propensity share); the member fails." },
  { code = "cell_not_licensed", detail = "batch_retarget.contrast_member_failed", when = "A contrast reads a claim that failed; the contrast fails with it." },
  { code = "cell_not_licensed", detail = "batch_retarget.partial_family", when = "A complete-family claim is requested while any claim or contrast failed; the failed members are named." },
  { code = "cell_not_licensed", detail = "batch_retarget.point_only_member", when = "A complete-family covariance is requested while a member retargets to a point only (penalized propensity)." },
  { code = "invalid_argument", detail = "batch_retarget.max_t_invalid_level", when = "The unpublished max-t evaluator is given a level outside (0, 1)." },
  { code = "invalid_argument", detail = "batch_retarget.max_t_draws_out_of_range", when = "The unpublished max-t evaluator is given fewer than 1000 or more than 2000000 draws, or too few for the level's empirical quantile to exist." },
  { code = "cancelled_no_claim", detail = "batch_retarget.cancelled", when = "The context was cancelled before every claim was retargeted, or before every max-t draw was made; no family or critical value is reported and the stop is not a verdict." },
]
