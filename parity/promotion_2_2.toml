  { id = "x8.roundtrip.artifact", role = "artifact", intent = "The artifact preserves the cross-world query semantics; the consumer replays (same evaluator) the premises digest, data digest, witness and point, and a separate closed-form recomputation agrees for the linear-Gaussian family (ordinary least squares; noiseless and noisy) and for the non-separable family (Givens-QR basis regression) on every tested edge set, so both report independently_verified.", evidence_test = "crates/antecedent/tests/cross_world_edge_contrast.rs", evidence_assertion = "artifact_round_trip_is_replayed_by_the_consumer" },
