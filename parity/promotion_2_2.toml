  { name = "antecedent.descriptive.interval", stage = "uncertainty", status = "closed", permanent_in_release = true, reason_code = "cell_not_licensed", refusal_test = "python/tests/test_descriptive_comparison.py", refusal_assertion = "test_an_interval_on_a_transformed_scale_is_a_typed_refusal" },
