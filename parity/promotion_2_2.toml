[[record]]
id = "2.2A.X5.two_step_temporal_transport"
workstream = "X5"
milestone = "A"
work_package = "A4"
status = "promoted"
consumer_question = "Does a fixed two-step intervention sequence [a1, a2] transfer from the source to the target population, and what is its target response?"
theorem = "Classical sID on the explicit two-slice unrolled selection diagram, identifying do(A1=a1, A2=a2) as one joint intervention; executed by the exact finite evaluator over the identified history-aware functional."
reference = "https://arxiv.org/abs/1312.7485v1"
guarantee = "sound_incomplete"
graph_class = "Explicit acyclic two-slice unrolling (ADR 0021 temporal coordinates, TemporalDag unfolding or supplied directly) as a selection ADMG: baseline covariates, time-varying covariates observed before each action, one action per step over one discrete alphabet, one outcome after the last action, latent confounding as bidirected edges, and time-indexed selection targets. Horizon 2; at most 8 actions, 12 coordinates and 4096 complete covariate histories."
population_semantics = "Fixed initial-state law per population (baseline and step-1 covariates; a point, never uncertain). It is supplied as the target's observational law rather than declared separately, and what is enforced is that a same-window refresh may not move the target's initial-state masses (beyond 1e-9): a moved initial state is initial-state uncertainty or a new period (2.3A) and refuses as a changed window. Hard sequence semantics (one fixed action per step, never a policy that reads the history); source evidence availability declared per time slice through the evidence catalog; each mechanism difference is a selection target at its own slice and every other coordinate is assumed invariant at its slice."
evidence_family = "Finite discrete exact laws over the unrolled coordinates: the target's observational joint and the source regimes the identified derivation cites. What is required is read from the derivation's own bound leaves (population, regime, intervention coordinates, factor and conditioning variables), never assumed: for the fixture diagram the proof cites the source's outcome law under each complete history over the coordinates that reach the outcome, do(baseline, covariates, actions); a selection only at the baseline with an action experiment cites the outcome law under do(actions) conditioned on the baseline. The report marks each catalog regime cited_by_derivation or not, and the support report requires every cited leaf to be served at every complete history, per declared measurement window."
provider = "Exact finite discrete law evaluator on supplied exact laws; empirical plug-in tables are not part of this cell."
estimand = "Target distribution and mean of the outcome under do(A_1=a1, A_2=a2), with the history/horizon-local support, every invariance used per time slice and the time-varying confounders reported beside it."
inference_claim = "point_only"
inference_notes = "Exact and point-only. Temporal sampling intervals, initial-state uncertainty and new-period refresh are 2.3A; an interval request refuses (temporal_transport.interval_requested)."
owners = ["antecedent-core", "antecedent-identify", "antecedent-estimate", "antecedent-io", "antecedent", "python/antecedent/transport"]
identity_inputs = ["unrolled graph (edges, selection targets, slots)", "horizon (=2)", "ordered action sequence", "action alphabet (coordinate domains)", "variable names, domains and units", "question (source and target population)", "search budget (operations, depth, memory) and evaluation limits", "evidence catalog and law snapshot ids (data identity: bound by a separate data digest, refresh-replaceable, outside the premises digest)"]
wire_changes = ["Additive: temporal transport sequence artifact v1 (feature temporal_transport_sequence_v1) recording horizon, ordered sequence, slots, the checked derivation, history/horizon-local support, per-slice invariances used, per-slice evidence with a cited_by_derivation flag, time-varying confounders, the search limits and a data digest binding catalog and law snapshot identities."]
compatibility = "No change to temporal response artifacts (ADR 0021) or static transport artifacts; 2.1 behavior is unchanged."
coverage_records = []
search = true
search_impl = ["crates/antecedent-identify/src/sid/temporal_sequence.rs", "crates/antecedent-identify/src/sid.rs"]
surface = ["python/antecedent/transport/_temporal.py"]
surface_rust = ["crates/antecedent-identify/src/sid/temporal_sequence.rs", "crates/antecedent-estimate/src/temporal_transport.rs", "crates/antecedent-io/src/temporal_transport_artifact.rs", "crates/antecedent/src/analysis/temporal_transport.rs"]
surface_pyo3 = ["python/src/temporal_transport_api.rs"]
surface_exports = ["python/antecedent/transport/advanced.py"]
owned_exports = ["TemporalSequenceSpec", "consume_temporal_transport_artifact", "prepare_temporal_transport_sequence"]
surface_values = ["TemporalSequenceSpec", "TemporalRefusal", "TemporalSequenceError", "TemporalSlots", "TemplateRoles", "UnrolledSequence", "MechanismAssumption", "SliceInvariance", "SliceEvidence", "HistoryLattice", "TemporalOutcome", "TemporalDecisionLimits", "TemporalSequenceDecision", "HistorySupportRow", "HistorySupportReport", "TemporalSequenceReport", "PreparedTemporalSequence", "PreparedTemporalTransport", "TemporalTransportArtifactError", "TemporalTransportConsumeLimits", "TemporalSlotsWire", "HistoryRowWire", "InvarianceWire", "SliceEvidenceWire", "TemporalReportWire", "TemporalSequenceArtifactWire"]
surface_internal = [
  { name = "history_support", why = "The per-history support report is computed inside prepare_temporal_sequence and published on the report; the free function is public only so integration tests can probe a decision against arbitrary laws." },
  { name = "temporal_refusal", why = "Error adapter (TemporalRefusal to IoError) shared by the facade and the Python layer; it decides and executes nothing." },
  { name = "temporal_decision_error", why = "Error adapter (TemporalSequenceError to IoError) shared by the facade; it decides and executes nothing." },
  { name = "temporal_sequence_identity", why = "Premises-digest helper used by the consumer and by tamper tests; the public consume route recomputes and checks it." },
]
bounds = { horizon = 2, max_actions = 8, max_observed = 12, max_history_states = 4096, cancellation = true, contract = "antecedent_core::SearchBudget", shared_budget = "one SearchBudget over the identification search, the s-hedge check, every verification replay and the growth of the history lattice, charged per state with the live bytes retained", operation_limit = "SearchLimits.operations", depth_limit = "SearchLimits.depth", memory_limit = "ExecutionContext.memory.hard_limit_bytes" }
refusals = [
  { code = "transport_support_failure", detail = "temporal_transport.history_outside_support", when = "A complete history has no certified support: the supplied laws do not serve every leaf the identified proof cites at that history and the requested sequence (population, regime, the leaf's intervention coordinates at the history's values, its axes, and positive conditioning mass), whether or not the target reaches the history because the exact evaluator enumerates the whole lattice; or the target never takes the first action at a reached initial state." },
  { code = "route_not_supported", detail = "temporal_transport.horizon", when = "Horizon other than 2, a sequence asking for a third period, laws over coordinates outside the window, or a refresh that changes the measurement window or moves the target's fixed initial-state law: a new preparation is required." },
  { code = "transport_not_certified", detail = "temporal_transport.search_incomplete", when = "The licensed rules certified nothing for the sequence; not a non-identification claim." },
  { code = "transport_budget_cancel", detail = "temporal_transport.history_budget", when = "Operations, memory or cancellation stopped the one shared budget during identification or history growth (the receipt lists the finished stages as explored), or depth stopped it during identification (history growth is charged at depth 1 and 2, below the identification search's own depth, so a depth stop is never inside a history step); the decision carries a receipt and is never a non-identification verdict." },
  { code = "estimator_inference_mismatch", detail = "temporal_transport.interval_requested", when = "Any interval requested (2.3A)." },
  { code = "route_not_supported", detail = "temporal_transport.bounds_exceeded", when = "More than 8 actions, more than 12 coordinates, or more than 4096 complete covariate histories." },
  { code = "invalid_argument", detail = "temporal_transport.invalid_spec", when = "A malformed unrolling: coordinates not declared once with finite domains, slots that do not partition them, an edge running backward in time, unequal action alphabets, an action as a selection target, or a catalog outside the window." },
  { code = "invalid_argument", detail = "temporal_transport.invalid_sequence", when = "A sequence with fewer actions than the horizon or an action outside the alphabet." },
  { code = "transport_missing_evidence", detail = "temporal_transport.missing_evidence", when = "A derivation exists but the catalog lacks a factor it needs." },
  { code = "transport_proven_non_transportable", detail = "temporal_transport.checked_obstruction", when = "An independently verified s-hedge on the unrolled diagram." },
]
