[[record]]
id = "2.2A.X2.finite_scenario_envelope"
workstream = "X2"
milestone = "A"
work_package = "A2"
status = "promoted"
consumer_question = "Which transport conclusions survive each of a finite, explicitly supplied set of graph/selection scenarios?"
theorem = "No new theorem: each scenario is decided independently by the already licensed classical catalog transport contract (sID with checked s-hedge obstructions). The envelope is a report over those results, not an identification claim about an equivalence class."
reference = "https://arxiv.org/abs/1312.7485v1"
guarantee = "per_scenario_contract_guarantee"
graph_class = "Finite list (1-64) of fixed selection diagrams over at most 12 shared observed variables, each decided by the already licensed classical catalog sID row (selection ADMGs as that row admits them). The new bounded ADMG transport class of 2.2B B1 enters only after B1 passes. No CPDAG/PAG-native transport ID."
population_semantics = "One declared coordinate schema (names, domains, cardinalities, units) shared by every scenario and validated against each graph, the catalog, laws, samples and the request; the same target question; edges and selection targets vary per scenario."
evidence_family = "One supplied catalog; each scenario binds its own selection targets and its own derivation's evidence obligations, so evidence certified for one scenario never satisfies another. Shared-catalog environments may not declare selections (they belong to each scenario)."
provider = "Exact finite laws, or empirical tables fitted once and plugged into the same compiled per-scenario plan (points only)."
estimand = "Per-scenario target response; unweighted structural envelope (min/max over identified scenarios with the unidentified/unevaluated set named); optional declared-weight mixture report with residual mass preserved."
inference_claim = "structural_envelope"
inference_notes = "Point-only per scenario: the classical row's within-scenario bootstrap is not carried into the envelope in 2.2A. Weighted ranges use the declared outcome domain limits and are withheld when unaccounted mass meets an unbounded domain. Cross-scenario aggregate inference with shared data is 2.3A and refuses (scenario_aggregate_not_licensed). Spread is never labelled a confidence interval or sharp bound."
owners = ["antecedent-core", "antecedent-identify", "antecedent-io", "antecedent", "python/antecedent/transport"]
identity_inputs = ["canonical scenario set (sorted by unique scenario name; permutation invariant)", "declared weights (f64 bits) when supplied", "shared coordinate schema including variable names", "target question and request", "shared scenario budget (operations, depth, memory) and evaluation budget", "provider and fitted-sample summaries"]
wire_changes = ["Additive: scenario-set wire and scenario-envelope artifact v1 retaining every scenario with status identified | structurally_unidentified | missing_evidence | unsupported_provider | support_failure | not_certified | unevaluated (detail scenarios.unevaluated_budget: search.<stop>)."]
compatibility = "Fixed-graph transport artifacts are unchanged; a one-scenario set is a separate artifact, not a relabelled fixed-graph result."
