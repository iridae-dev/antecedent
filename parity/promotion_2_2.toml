[[record]]
id = "2.2B.X2.admg_conditional_transport"
workstream = "X2"
milestone = "B"
work_package = "B1"
status = "promoted"
consumer_question = "Is the target population's conditional interventional distribution P*(y | do(x), w) transportable from a source that can run every experiment, over a latent-confounded selection ADMG, and what is its value?"
theorem = "Conditional transport by reduction to the licensed classical sID row; no new completeness is claimed. Step 1 (IDC line 1 of Shpitser and Pearl 2006, as crates/antecedent-identify/src/idc.rs implements it, re-implemented under the shared budget): while some w in W has Y independent of w given X and W minus w in G with edges into X and out of w removed, w moves into the intervention set. Do-calculus rule 2 applied in the target population, whose SCM has the causal graph G (a selection node is a parentless cause that is conditioned in the target, so it opens no path), gives P*(y | do(x), w) = P*(y | do(x, w'), w''). Step 2: the joint P*(y, w'' | do(x, w')) is decided by the classical sID engine (Bareinboim and Pearl 2013, Fig. 5) over the complete source experimental family and the target observational law, and the conditional is that joint normalized over y at the requested w''. Soundness: every decision re-checks its own reduction before returning any outcome (each move's rule-2 premise and the maximality of the moved set, by an independent augmented-graph separation test distinct from the search's path test, each test charged to the one budget), the joint is built only through the sID engine's verified-derivation path, a stored record re-runs both checks at preparation and at artifact consumption, and the conditional truth is enumerated from latent SCMs. The moved set is selection-independent (selection nodes are parentless and conditioned on in the target, so they neither open nor keep open a path). Obstruction (no completeness theorem used): when sID does not certify the reduced joint, a bounded deterministic search looks for two finite latent models compatible with the selection diagram (binary observed variables, one discrete latent per bidirected edge, source and target sharing every latent law and every mechanism except those of the selection targets, every parameter an exact rational strictly inside (0, 1)) that agree on EVERY source experimental law P(v \\ z | do(z)) and on the target observational law P*(v) but give different values of P*(y | do(x), w) at a level whose conditioning event has positive mass; verify_conditional_witness checks all of this by exact enumeration. Such a pair refutes every formula over those laws, i.e. the query is not transportable by definition (Lee, Correa and Bareinboim, General Transportability, AAAI 2020, Definition 3 and Lemma 2, text read in causalai.net r53), so a verified pair is proven_non_transportable. The search perturbs one mechanism block of a seeded positive base model inside the null space of that block's (linear) law map, found modulo a prime and lifted by rational reconstruction; only the exact verifier certifies. It is incomplete: no verified pair, or a diagram above its work bound, stays not_certified with the inspection-only candidate (the reduced joint's verified s-hedge). The paper's Theorem 1 (under conditional minimality, P*_x(y | w) is g-transportable iff P*_x(y, w) is; proof via Theorem 2 and appendix Proposition 4, an XOR construction, read but not verified here) is the completeness statement for this class; it is NOT used, so the row stays sound_incomplete. Measured: on every three-node selection ADMG and query every reduced-joint s-hedge (984 of 12288 decisions) carries a verified witness."
reference = "https://arxiv.org/abs/1312.7485v1"
guarantee = "sound_incomplete"
graph_class = "Finite discrete selection ADMG (directed and bidirected edges over static observed variables) with at most 6 observed variables; one parentless selection node per selection target (population-difference semantics of MutilatedSelection); 1-3 conditioned variables, 0-3 treatments, outcomes, treatments and conditioned variables pairwise disjoint. Selection-bias (S = 1 sampling) semantics, soft interventions and gID/g-transportability with surrogate or heterogeneous experiments are excluded; gID is deferred to 2.3A."
population_semantics = "One source population that holds the complete experimental family (its law under do(Z) for every subset Z of the observed variables) and one target population that holds its observational law; both share the causal graph and differ only in the mechanisms of the selection targets. The query is about the target population."
evidence_family = "Classical complete-source family: per-source joint experimental laws do(Z) with their jointly measured margins, plus the target observational joint. A supplied catalog binds the chosen derivation's leaves; a leaf the catalog lacks is missing evidence, never a non-transportability claim."
provider = "Existing exact finite-law evaluator of the checked joint P*(y, w'' | do(x, w')); the conditioning on w'' is an explicit normalization of that joint, refused as a support failure when the conditioning event has zero mass."
estimand = "Target conditional interventional distribution P*(y | do(x), w) of the outcomes at requested treatment and conditioning levels, and its outcome means."
inference_claim = "point_only"
inference_notes = "Exact laws only: a point, no interval. Counted laws (an empirical plug-in and any interval around it) are refused as cell_not_licensed; no coverage record exists or is allocated."
owners = ["antecedent-identify", "antecedent-estimate", "antecedent-io", "antecedent", "python/antecedent/transport"]
