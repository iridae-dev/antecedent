[[record]]
id = "2.2A.X9.mixed_source_proof_search"
workstream = "X9"
milestone = "A"
work_package = "A6"
status = "promoted"
consumer_question = "Can complementary distributions from different studies of one population identify a query that no named theorem route covers, and which leaf is missing when they cannot?"
theorem = "Bounded do-calculus (rules 1-3) and probability-rule (marginalize, condition, product) forward chaining over an explicit set of input distributions (do-search style), theorem-scoped sID, z, mz and (for unrestricted declared sources) meta routes first, each candidate replayed by an independent proof checker. The frozen rule set x9.rules.v1 contains the two deletion rules and the checker accepts them, but the search does not attempt them: they cannot add a quantity within this rule set (measured over 1479 random closures, none did). Sound; incomplete under the frozen rule set and the bound: identifies 100% of ID-identifiable single-study queries on 3-node ADMGs (612/612, every ADMG), 99.9993% on 4-node (142,826/142,827, every ADMG) and 97.4% on 5-node (16,238/16,676, seeded sample), never identifying a query complete ID refutes (230,468 queries); known gaps: the napkin family, the three-intervention bound (every four-treatment query), and the operation budget beyond five nodes."
reference = "https://www.jstatsoft.org/article/view/v099i05"
guarantee = "sound_incomplete"
graph_class = "Finite discrete ADMG over at most 10 observed variables; inputs are the target population's whole-population, available, measured, unconditioned joint laws of catalog regimes (observational, or experimental families that supply every level of their intervention set). A regime restricted to named levels is excluded as restricted_levels: the search states identification for every level of the treatments."
population_semantics = "Every catalog entry names its study, population, selection/sampling context and snapshot. The generic search uses only target-population, whole-population studies; regimes of other populations, selected samples, model artifacts, conditioned projections, unavailable evidence and value-restricted (per-level) experiments are excluded and listed with their reason. Other populations are the business of the theorem-scoped z/mz routes that run first."
evidence_family = "Upgraded EvidenceCatalog entries: jointly measured variables, intervention variables, snapshot, evidence kind, and joint law versus separate marginals. Separate marginals are never a leaf; a relaxed second pass names the exact joint that would be needed. The catalog descriptor (CatalogDistribution) is the one owner of the input classification: origin, selection, kind, measured set, interventions and levels, availability, identity, study and snapshot are read from it; the pairwise shared_data relation is not consulted (exact laws claim a point; only the mz statistical path uses it)."
provider = "Existing exact finite-law evaluator of the checked expression; each leaf reads only the law of the regime it cites."
estimand = "Target interventional distribution P(outcomes | do(treatments)) of the target population."
inference_claim = "point_only"
inference_notes = "Exact laws only; no interval, no counted-law plug-in (prepare_empirical is closed as cell_not_licensed). The estimator_grid_not_measured status is never used. Completeness is measured only on the single-study reference (complete ID on one observational study of the whole joint, generic rule search alone): sound, and identifies 97.4% or more of ID-identifiable queries on at most 5-node ADMGs (see theorem); no multi-study completeness figure exists because no complete oracle for several studies (generalized ID) is implemented."
owners = ["antecedent-core", "antecedent-identify", "antecedent-expr", "antecedent-estimate", "antecedent-io", "antecedent", "python/antecedent/transport"]
identity_inputs = ["graph digest", "canonical catalog distribution identities of every cited leaf", "frozen rule-set version (x9.rules.v1)", "search limits", "query (outcomes, treatments, target, declared sources)", "variable names", "evaluation limits and requests"]
wire_changes = ["Additive: mixed-source proof artifact v1 (checked_mixed_source_point_v1) with the frozen rule-set version, every step's premises and source distribution, source-named bindings and the search receipt; no change to existing artifacts."]
compatibility = "Existing catalog wire and the sID/z/mz artifacts are unchanged; the new route is a superset only through its own artifact version."
coverage_records = []
search = true
search_impl = ["crates/antecedent-identify/src/sid/mixed_source.rs"]
surface = ["python/antecedent/transport/_mixed_source.py"]
surface_rust = ["crates/antecedent-identify/src/sid/mixed_source.rs", "crates/antecedent-estimate/src/mixed_source.rs", "crates/antecedent-io/src/mixed_source_artifact.rs", "crates/antecedent/src/analysis/mixed_source.rs"]
surface_pyo3 = ["python/src/transport_mixed_api.rs"]
surface_exports = ["python/antecedent/transport/advanced.py"]
owned_exports = ["MixedSourceQuery", "consume_mixed_source_artifact", "identify_mixed_source_transport"]
surface_values = ["MixedSourceResult", "MixedSourceQuery", "PreparedMixedSource", "BoundMixedSourceFunctional", "MixedExclusion", "MixedInput", "MixedMissingEvidence", "MixedMissingLeaf", "MixedQuantity", "MixedRule", "MixedSearchInspection", "MixedSearchSummary", "MixedSourceDecision", "MixedSourceDerivation", "MixedSourceDerivationRecord", "MixedSourceLeaf", "MixedStageRecord", "MixedStep", "MixedStepRecord", "ValidatedMixedSourceQuery", "MixedSourceArtifactError", "MixedSourceConsumeLimits", "MixedSourceQueryWire", "MixedSourcePointWire", "MixedSourceArtifactWire", "ConsumedMixedSource", "MixedSourceArtifactInput", "MixedSourceStage", "PreparedMixedSourceStage"]
surface_internal = [
  { name = "mixed_source_rule_names", why = "Frozen-rule-set introspection consumed only by the x9.rule_set.invariance test; re-exported by sid.rs so it cannot be narrowed to pub(crate) from this cell." },
  { name = "render_quantity", why = "Pure display helper (quantity to text) used by the pyo3 proof JSON and the search's own frontier text; not an execution entry point. Re-exported by sid.rs, so it stays pub but hidden." },
  { name = "render_frontier", why = "Pure display helper for a stopped search's frontier text, used only inside antecedent-identify; re-exported by sid.rs, so it stays pub but hidden." },
  { name = "consume", why = "Default-limits convenience over MixedSourceArtifactWire::consume_with_limits (the routed consumer); no caller outside the io crate." },
  { name = "identify_mixed_source_transport_stage", why = "Native entry wrapped by the public Python function identify_mixed_source_transport (routed); the wrapper owns the documented surface." },
]
bounds = { max_observed = 10, max_distributions = 16, max_search_states = 20000, max_depth = 16, max_move = 2, max_intervention_set = 3, max_sources = 4, cancellation = true, contract = "antecedent_core::SearchBudget", operation_limit = "SearchLimits.operations", depth_limit = "SearchLimits.depth", memory_limit = "ExecutionContext.memory.hard_limit_bytes" }
refusals = [
  { code = "transport_not_certified", detail = "mixed_search.not_certified", when = "The frozen rule set reached its fixpoint within budget without the target; never a non-identification theorem." },
  { code = "transport_budget_cancel", detail = "mixed_search.budget", when = "Operations, depth, memory or cancellation stopped the one budget shared by the named routes and the rule search; a receipt lists explored stages/generations and unevaluated regions." },
  { code = "transport_missing_evidence", detail = "mixed_search.missing_joint", when = "The derivation needs a joint that the catalog holds only as separate marginals; the exact leaf is named." },
  { code = "route_not_supported", detail = "mixed_search.posterior_as_law", when = "A posterior or model artifact is offered as an experimental law." },
  { code = "route_not_supported", detail = "mixed_search.bounds_exceeded", when = "More than 10 observed variables, 16 usable distributions, 4 declared sources or 4 controllables per source, or search limits above 20000 operations / depth 16." },
  { code = "route_not_supported", detail = "mixed_search.named_route", when = "A theorem-scoped route (target-first sID, then z or mz, then meta when two or more declared sources are unrestricted) identifies the query: use that route, no generic proof is produced." },
  { code = "invalid_argument", detail = "mixed_search.invalid_query", when = "Overlapping or unknown outcomes/treatments, duplicate or target-equal source populations, a catalog that names variables outside the graph, or an invalid catalog." },
  { code = "transport_not_certified", detail = "mixed_search.invalid_derivation", when = "A stored derivation or artifact is not reproduced, a step fails the independent checker, or a functional is bound to another graph." },
]
