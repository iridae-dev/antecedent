[[record]]
id = "2.2E.E7.matched_case_control_odds_ratio"
workstream = "E7"
milestone = "E"
work_package = "E7"
status = "promoted"
consumer_question = "From matched case-control sets sampled on the outcome, what is the conditional odds ratio of a binary exposure, and which sets informed it?"
theorem = "Derived in-repo (docs/guides/matched-case-control.md). Under logit P(case | set i, x) = alpha_i + beta x with unrestricted alpha_i, conditioning each set on (size n, cases k, exposed total t) removes alpha_i: the exposed-case count A is noncentral hypergeometric, P(A = a) proportional to C(k, a) C(n-k, t-a) e^(beta a). The conditional log likelihood is strictly concave with score sum(a_i - E_i) and information sum V_i; sets with no case, no control or one exposure value have a single possible A and contribute zero. The MLE exists iff the exposed-case total lies strictly inside the sets bounds. With 1:1 matching it is the discordant-pair ratio b/c (Breslow and Day, Statistical Methods in Cancer Research Vol. 1, 1980: paper-inherited, not read here; the closed form is re-derived and tested in-repo). Outcome-dependent sampling changes only alpha_i, so beta is invariant to it."
reference = "docs/guides/matched-case-control.md"
guarantee = "exact_conditional_likelihood_point_only"
graph_class = "None: the cell takes no causal graph. It states a conditional association parameter among declared matched sets; no confounding beyond the declared matching is identified and none is claimed."
population_semantics = "The population the matched sets were drawn from, under outcome-dependent sampling; the odds ratio is common across sets and invariant to the sampling. Absolute risks, risk differences and risk ratios are not defined here: the case fraction is fixed by design and no prevalence or selection information is taken."
evidence_family = "Rows of (stratum, case, exposed) with case and exposed exactly 0 or 1; the stratum is the caller-declared matching set and the sampling design is declared as matched_case_control."
provider = "antecedent_estimate::conditional_odds_ratio: exact hypergeometric-weight sums with a bracketed safeguarded Newton solve of the monotone score; no second optimiser and no ML stack."
estimand = "theta = exp(beta), the conditional odds ratio of exposure between cases and controls within matched sets, by conditional maximum likelihood."
inference_claim = "point_only"
inference_notes = "Point only. No interval: a Wald interval needs asymptotic conditions (number of informative sets growing with bounded set size, a fixed beta, independent sets given the matching) that no coverage record measures, so the interval route is closed with cell_not_licensed. No calibration is run. The information is used inside the solver and is not reported as a standard error."
owners = ["antecedent-estimate", "python/antecedent/matched"]
identity_inputs = ["sampling design (matched_case_control)", "estimand (conditional_odds_ratio)", "the set-shape sufficient statistic: (members, cases, exposed, exposed cases, number of sets) per distinct set shape"]
wire_changes = ["Additive: matched_case_control_v1 JSON artifact (MatchedCaseControlResult.export) with the set-shape sufficient statistic, counts, estimate and a SHA-256 digest; no change to existing artifacts."]
compatibility = "A new design row: no existing route, artifact or reason code changes, and the AIPW average-effect result is untouched."
coverage_records = []
search = false
surface = ["python/antecedent/matched.py"]
surface_rust = ["crates/antecedent-estimate/src/matched_case_control.rs"]
surface_pyo3 = ["python/src/matched_case_control_api.rs"]
surface_values = ["ConditionalOddsRatio", "MatchedSetCounts", "MatchedCaseControlResult"]
bounds = { cancellation = true, max_iterations = 500, replay_max_rows = 10000000 }
refusals = [
  { code = "effect_not_identified", detail = "matched_case_control.absolute_risk_not_identified", when = "A population risk, absolute risk, risk difference or risk ratio is requested: outcome-dependent sampling fixes the case fraction and the cell takes no prevalence or selection information." },
  { code = "route_not_supported", detail = "matched_case_control.estimand_not_supported", when = "Any estimand other than conditional_odds_ratio." },
  { code = "invalid_argument", detail = "matched_case_control.sampling_design", when = "A sampling design other than matched_case_control (matched sets sampled on the outcome)." },
  { code = "cell_not_licensed", detail = "matched_case_control.interval_withheld", when = "An interval is requested at any layer; the Wald asymptotics (many informative sets, bounded set size, fixed odds ratio) are not measured by a coverage record." },
  { code = "effect_not_identified", detail = "matched_case_control.no_informative_sets", when = "Every set is exposure-concordant or outcome-degenerate: no set informs the odds ratio (the counts are reported)." },
  { code = "route_not_supported", detail = "matched_case_control.estimate_not_finite", when = "The conditional likelihood is monotone over the informative sets (exposed-case total at its minimum or maximum), or the estimate lies beyond e^60 or below e^-60." },
  { code = "invalid_argument", detail = "matched_case_control.invalid_data", when = "Empty or unequal-length rows, a case or exposure value other than exactly 0 or 1, or a missing value." },
  { code = "transport_budget_cancel", detail = "matched_case_control.budget", when = "The solve was cancelled; no estimate is reported and the stop is not a verdict on the data." },
]
routes = [
