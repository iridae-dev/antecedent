  { id = "x2.python_roundtrip.artifact", role = "artifact", intent = "Python surface: prepare, estimate, export and independent consume keep every scenario.", evidence_test = "python/tests/test_transport_scenarios.py", evidence_assertion = "test_artifact_round_trip_keeps_failed_scenarios_and_refuses_tampering" },
  { id = "x2.conditional_envelope.positive", role = "positive", intent = "B1 promotion: a conditional question over latent-confounded selection ADMGs mixes a scenario rule 2 reduces to the classical P*(y | do(x, w)), scenarios normalized at w and a reduced-joint s-hedge scenario; the true scenario's point is the enumerated latent-SCM truth and lies inside the envelope over the identified ones; the s-hedge scenario is counted under its own status (not_certified, or structurally_unidentified only with a verified witness), outside the envelope.", evidence_test = "crates/antecedent/tests/transport_scenarios_conditional.rs", evidence_assertion = "conditional_scenarios_enter_the_envelope_and_the_truth_lies_inside_it" },
  { id = "x2.conditional_truth.truth", role = "truth", intent = "B1 promotion: with laws enumerated from each identified scenario's own latent SCM (two parameterizations, every x and w level), that scenario's point equals its conditional truth.", evidence_test = "crates/antecedent/tests/transport_scenarios_conditional.rs", evidence_assertion = "each_identified_scenario_matches_its_own_enumerated_truth" },
  { id = "x2.conditional_not_certified.negative", role = "negative", intent = "B1 promotion: a reduced-joint s-hedge scenario is never identified; it is not_certified carrying its re-checked inspection-only candidate, or structurally_unidentified carrying the re-checked two-model witness, which alone proves.", evidence_test = "crates/antecedent/tests/transport_scenarios_conditional.rs", evidence_assertion = "an_s_hedge_scenario_carries_its_checked_record_and_only_a_witness_proves" },
  { id = "x2.conditional_missing_evidence.negative", role = "negative", intent = "B1 promotion: without source experiments on x, the scenarios that need one are missing_evidence naming the leaf while the target-only scenario identifies; their declared mass stays unaccounted.", evidence_test = "crates/antecedent/tests/transport_scenarios_conditional.rs", evidence_assertion = "each_scenario_binds_its_own_evidence_and_missing_evidence_is_scenario_local" },
  { id = "x2.conditional_budget.budget", role = "budget", intent = "B1 promotion: the shared budget stops conditional scenarios with one receipt, including inside the conditional route (unevaluated, transport_budget_cancel, never a verdict); the truncated report replays.", evidence_test = "crates/antecedent/tests/transport_scenarios_conditional.rs", evidence_assertion = "the_shared_budget_stops_conditional_scenarios_with_one_receipt" },
  { id = "x2.conditional_support_failure.negative", role = "negative", intent = "B1 promotion: a zero-mass conditioning event is the normalized scenario's support_failure; the moved-w scenario still identifies.", evidence_test = "crates/antecedent/tests/transport_scenarios_conditional.rs", evidence_assertion = "a_zero_mass_conditioning_event_is_a_scenario_local_support_failure" },
  { id = "x2.conditional_refusals.negative", role = "negative", intent = "B1 promotion: a request not binding the conditioned variables, a conditioned variable outside the schema, counted laws and a graph beyond the B1 class refuse with their frozen codes.", evidence_test = "crates/antecedent/tests/transport_scenarios_conditional.rs", evidence_assertion = "route_bounds_requests_and_counted_laws_refuse_with_their_frozen_codes" },
  { id = "x2.conditional_bounds.negative", role = "negative", intent = "B1 promotion: seven observed variables (inside A2's 12, outside B1's 6) refuse the whole conditional set as route_not_supported / admg_transport.bounds_exceeded.", evidence_test = "crates/antecedent/tests/transport_scenarios_conditional.rs", evidence_assertion = "a_graph_beyond_the_conditional_class_refuses_the_whole_set" },
  { id = "x2.conditional_roundtrip.artifact", role = "artifact", intent = "B1 promotion: a conditional set exports artifact v2, replays, and refuses a dropped or forged conditional proof, a dropped candidate or witness, a relabelled status, a moved envelope, an edited conditioned set or request, and version/feature/content disagreement.", evidence_test = "crates/antecedent/tests/transport_scenarios_conditional.rs", evidence_assertion = "a_conditional_artifact_is_version_two_replays_and_fails_on_mutation" },
  { id = "x2.conditional_old_version.artifact", role = "artifact", intent = "B1 promotion: a classical question still writes and reads v1 with no conditional key encoded; a conditional artifact's version is what a v1-only reader refuses.", evidence_test = "crates/antecedent/tests/transport_scenarios_conditional.rs", evidence_assertion = "a_classical_question_still_writes_and_reads_the_version_one_artifact" },
  { id = "x2.conditional_python.positive", role = "positive", intent = "Python surface: conditioned_on routes every scenario through the conditional route; statuses, identification_status, the truth inside the envelope and the artifact round trip.", evidence_test = "python/tests/test_transport_admg_conditional.py", evidence_assertion = "test_conditional_questions_enter_the_scenario_envelope" },
  { id = "x2.conditional_python_request.negative", role = "negative", intent = "Python surface: a conditional scenario request must bind the conditioned variables (invalid_argument / admg_transport.invalid_request).", evidence_test = "python/tests/test_transport_admg_conditional.py", evidence_assertion = "test_conditional_scenario_requests_bind_the_conditioned_variables" },
