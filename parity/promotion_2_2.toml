[[record]]
id = "2.2B.X4.smoothed_dose_response_transport"
workstream = "X4"
milestone = "B"
work_package = "B2"
status = "promoted"
consumer_question = "What is the kernel-smoothed mean response of a randomized continuous dose, at each of a few declared doses and one declared bandwidth, in an overlap-supported target population?"
theorem = "Trial-to-target transport of the fixed-bandwidth kernel-smoothed dose-response functional psi_h(a) = E_target[ integral K_h(a - t) E(Y | X, A=t, S=1) dt ] under mean exchangeability over the certified standardizers, positivity of trial participation and a randomized source dose with a known conditional density pi(t | x) positive on the declared dose support; the composed augmented inverse-odds, inverse-density score is model doubly robust (outcome regression or participation model correct, pi known). Derived in-repo (docs/architecture/smoothed-dose-response-transport.md) and verified numerically against closed-form SCM truth and exact integration; the transport composition and the score are paper-inherited from no single source (the kernel-smoothed doubly robust form is related to Kennedy et al. and Colangelo and Lee, whose theorem text was not read; their unsmoothed-curve pseudo-outcome needs the marginal dose density m(A), which the known-pi smoothed target does not). No efficiency, rate, asymptotic-normality or bandwidth-selection claim."
reference = "https://arxiv.org/abs/1507.00747"
guarantee = "model_double_robustness_of_point_only"
graph_class = "Certified direct or baseline-standardization transport derivation (the existing prepare_trial graph contract) with one continuous dose variable as the single source experiment."
population_semantics = "Target is the overlap-supported target population; nested-cohort (trial participants plus nonparticipants from one IID cohort, target = nonparticipants) and independent-samples (separate IID trial and representative target samples) are distinct declared designs."
evidence_family = "Randomized continuous source dose on a declared bounded support with a known conditional dose density pi(A | X) supplied at every source row (density provenance known; an estimated density is refused); complete baseline covariates equal to the certified standardizers; continuous source outcome; IID sampling only."
provider = "antecedent-learn LearnerSpec: Regression for mu(t, x) over a deterministic row-wise dose-by-covariate basis [1, t..t^p, (t - k)_+, x, t^j x] and BinaryProbability for source membership over [1, x]; both cross-fitted on one shared stratified fold assignment (each fold's models fitted on the other folds; the basis is a row-wise transform with no fitted statistic, so preprocessing inside folds holds trivially). Every fold model is exported as a provider-independent portable predictor and all predictions are made through it; a learner without a portable map is refused. Kernel (Epanechnikov) and bandwidth are estimand inputs, never tuned."
estimand = "psi_h(a) = E_target[ integral K_h(a - t) mu(t, X) dt ], mu(t, x) = E(Y | X=x, A=t, S=1), K_h(u) = K(u/h)/h, K(u) = 0.75 (1 - u^2) on [-1, 1], for each declared grid dose a with [a - h, a + h] inside the declared dose support. psi_h is a distinct estimand for each h; smoothing bias psi_h - psi_0 is a separate diagnostic (plug-in psi_h - psi_{h/2}), never added to the estimate or an interval."
inference_claim = "calibrated"
inference_notes = "Exactly one interval method: the pointwise joint outer refit percentile bootstrap of the whole cross-fitted composed estimator (antecedent_estimate::smoothed_dose_interval_internal, calibration-internal feature only), grouped per design, replicate floor 199, cap 2000; pointwise for psi_h at each grid dose; no simultaneous band. Smoothing bias is excluded from the claim; the smoothing-bias diagnostic is a plug-in from the fitted curve only (zero for a fit linear in the dose whatever the true curvature). Quadrature (numerical) error is kept apart from sampling error: windows are split at the basis knots so a linear-family fit is integrated exactly, and for any other fit the largest target-row Q-vs-2Q difference is recorded and gated as an estimate, not a bound. The analytic influence-function standard error is a diagnostic only, never a licensed claim. The public interval route is closed: estimates report the interval withheld (cell_not_licensed, or estimator_inference_mismatch below the floor) and never attach one; the artifact has no interval field. Both design-specific coverage records have been measured; public availability requires promotion of this exact route."
owners = ["antecedent-core", "antecedent-stats", "antecedent-learn", "antecedent-estimate", "antecedent-io", "antecedent", "python/antecedent/transport"]
identity_inputs = ["graph, selections and transport query (premises digest)", "smoothed-dose query: dose and outcome coordinates, grid (in declared order), bandwidth, kernel, dose support and density provenance", "certificate record (rule, formula kind, standardizers, selection targets, premises)", "sampling design", "LearnerSpec for outcome and membership and the dose basis (degree, knots, interactions)", "fold count and fold scheme (assignment deterministic in the rows)", "quadrature node count and tolerance (windows split at the basis knots)", "overlap, dose-density, local-ESS and distinct-dose thresholds", "bootstrap replicate request and coverage level", "master seed", "frozen bounds", "variable names", "sample rows including doses and known densities (data digest; refresh-replaceable)"]
wire_changes = ["Additive: smoothed dose transport artifact v1 (checked_smoothed_dose_transport_v1) records the certificate, the smoothed-dose query, every fold's portable outcome and membership predictor with provider provenance, the fold assignment, the per-grid point, quadrature error, smoothing-bias diagnostic, local support and the interval status; it has no interval field.", "Additive: smoothed-dose estimator-menu payload (EstimatorMenu entries for this query) and one refused smoothed_dose_transport_aipw entry on the binary-contrast menu."]
compatibility = "learned_continuous v1 and learned_trial v1 artifacts, the prepare_trial route and the conditional continuous-dose response (ContinuousDoseResponseQuery) are unchanged; this cell adds its own query type and artifact version. The stored frozen bounds are bound into the premises digest and compared field by field on consume: a stored bound looser than the consuming build's is refused (LimitsExceeded naming it), an equal or tighter one is accepted, so v1 artifacts stay readable after a later build raises a cap. A future interval opens as a new artifact version."
coverage_records = ["cov.classical_transport.admg.frequentist.percentile_bootstrap.l95.smoothed_dose_transport_nested_cohort_psi_h", "cov.classical_transport.admg.frequentist.percentile_bootstrap.l95.smoothed_dose_transport_independent_samples_psi_h"]
