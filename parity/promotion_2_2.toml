  { id = "e3.independent_covariance.truth", role = "truth", intent = "Points, standard errors, every covariance entry, and two contrasts (route A minus route B and a mixed combination) equal plain sums over the raw score tables written in the test; the covariance is symmetric to the last bit and positive semidefinite (Cauchy-Schwarz and quadratic forms); a one-claim family equals the single-query retarget.", evidence_test = "crates/antecedent/tests/batch_retarget.rs", evidence_assertion = "the_joint_score_covariance_matches_an_independent_calculation" },
  { id = "e3.hand_covariance.truth", role = "truth", intent = "Hand calculation on n = 4: unweighted claim covariances 14/12, 4/12 and -2/12, equal to the library's joint influence covariance.", evidence_test = "crates/antecedent/src/analysis/batch_retarget.rs", evidence_assertion = "the_covariance_of_two_claims_matches_a_hand_calculation" },
  { id = "e3.hand_weighted.truth", role = "truth", intent = "Hand calculation with weights (1, 1, 2, 0): theta = 9/4 and variance 31/96, equal to the library's weighted joint influence covariance.", evidence_test = "crates/antecedent/src/analysis/batch_retarget.rs", evidence_assertion = "a_weighted_variance_matches_a_hand_calculation_and_the_library" },
  { id = "e3.order.invariance", role = "invariance", intent = "Reversing the declared claims, contrasts and contrast terms leaves the family identity, every claim value and standard error, and every covariance entry bit-identical (contrasts to rounding); changing one weight bit changes the identity.", evidence_test = "crates/antecedent/tests/batch_retarget.rs", evidence_assertion = "claim_order_does_not_change_the_family_or_any_value" },
  { id = "e3.family_id.invariance", role = "invariance", intent = "The family identity ignores claim, contrast and term order and parent order and binds snapshot, scores source, estimator fingerprint, every weight bit, query index, name and coefficient.", evidence_test = "crates/antecedent/src/analysis/batch_retarget.rs", evidence_assertion = "the_family_id_is_order_invariant_and_binds_every_input" },
  { id = "e3.retarget_after_estimate.positive", role = "positive", intent = "estimate_scored returns the estimate's own tables; a retarget over them equals the independent calculation on those rows; on fresh rows of another size the snapshot differs, a family declared on the old snapshot is refused and old-length weights fail their member.", evidence_test = "crates/antecedent/tests/batch_retarget.rs", evidence_assertion = "retarget_after_estimate_reweights_that_estimates_rows" },
  { id = "e3.python_batch.positive", role = "positive", intent = "Python surface: a family reports points, the joint covariance, the route A minus route B contrast with c'Sigma c variance, and a simultaneous max-t band.", evidence_test = "python/tests/test_batch_retarget.py", evidence_assertion = "test_a_batch_retarget_reports_points_covariance_contrasts_and_a_simultaneous_interval" },
  { id = "e3.python_estimate.positive", role = "positive", intent = "Python surface: after PreparedBatch.estimate the retarget reads that estimate's rows and snapshot; old-length weights fail their member.", evidence_test = "python/tests/test_batch_retarget.py", evidence_assertion = "test_a_retarget_after_estimate_reads_that_estimates_rows" },
  { id = "e3.failed_member.negative", role = "negative", intent = "A spiked target (weighted overlap) and a short weight vector fail their members, a contrast reading a failed claim fails, a contrast of survivors survives, the surviving covariance is limited to the survivors, and complete_family refuses partial_family naming the failed members.", evidence_test = "crates/antecedent/tests/batch_retarget.rs", evidence_assertion = "a_failed_member_is_reported_and_the_family_is_never_complete" },
  { id = "e3.malformed_family.negative", role = "negative", intent = "An empty family, duplicate or clashing names, an unknown query or claim, invalid contrast terms and an undeclared snapshot each refuse with their registered code and detail; undeclared nonconstant weights fail their member.", evidence_test = "crates/antecedent/tests/batch_retarget.rs", evidence_assertion = "a_malformed_family_is_refused_with_a_typed_reason" },
  { id = "e3.mixed_snapshot.negative", role = "negative", intent = "Score tables built on different complete-case rows (different members or different row sets) are a mixed snapshot with no shared identity.", evidence_test = "crates/antecedent/src/analysis/batch_retarget.rs", evidence_assertion = "tables_on_different_rows_are_a_mixed_snapshot" },
  { id = "e3.no_scores.negative", role = "negative", intent = "A plan with no score table fails its members with score_table_unavailable before an estimate, and again after an estimate with the scores_unavailable_after_estimate detail; prepare-time rows are never substituted.", evidence_test = "crates/antecedent/tests/batch_retarget.rs", evidence_assertion = "a_plan_without_scores_refuses_instead_of_losing_the_retarget_silently" },
  { id = "e3.penalized.positive", role = "positive", intent = "A ridge-penalized-propensity family retargets exactly like an unpenalized one: points, the plug-in score covariance, contrast standard errors and a complete family (the penalized tables carry the interval of 2.2E.E2.penalized_propensity_aipw).", evidence_test = "crates/antecedent/tests/batch_retarget.rs", evidence_assertion = "a_penalized_family_retargets_with_its_plug_in_score_covariance" },
  { id = "e3.interval.positive", role = "positive", intent = "A complete covariance-bearing family returns the max-t band: half-widths are c times the plug-in standard errors the report carries, wider than the marginal 95% Wald band, deterministic in (seed, draws), and every export row reads max_t; a partial family refuses cell_not_licensed with partial_family.", evidence_test = "crates/antecedent/tests/batch_retarget.rs", evidence_assertion = "the_simultaneous_interval_is_the_max_t_band_of_a_complete_family" },
  { id = "e3.cluster_reference.truth", role = "truth", intent = "For one cluster-DML claim the shared-scale max-t sampler agrees with the two-sided Student-t quantile at the declared df, exceeds the iid normal critical, and refuses a family mixing cluster and iid reference degrees of freedom.", evidence_test = "crates/antecedent/src/analysis/batch_retarget.rs", evidence_assertion = "a_cluster_family_uses_the_declared_student_t_reference" },
  { id = "e3.known_truth_family_coverage.truth", role = "truth", intent = "Over 300 fixed-seed replications of a known SCM the family-wise coverage of the three-claim max-t band (uniform weights and two exponentially tilted claims with analytic truths 2, 2.2, 1.8) is at least nominal minus three binomial standard errors, and the band is strictly wider than each marginal band; a test, not a coverage record.", evidence_test = "crates/antecedent/tests/batch_retarget_known_truth.rs", evidence_assertion = "the_max_t_band_covers_the_known_retargeted_truths_family_wise" },
  { id = "e3.python_interval.positive", role = "positive", intent = "Python surface: simultaneous_interval() returns the max-t band at the requested level, seed and draws with half-widths c times the standard errors, wider than the marginal band; a partial family raises cell_not_licensed with a registered reason code.", evidence_test = "python/tests/test_batch_retarget.py", evidence_assertion = "test_the_simultaneous_interval_is_a_max_t_band_with_a_typed_partial_refusal" },
  { id = "e3.python_partial.negative", role = "negative", intent = "Python surface: a partial family lists spiked, short and the dependent contrast as failed with their refusal codes, and complete_family refuses.", evidence_test = "python/tests/test_batch_retarget.py", evidence_assertion = "test_a_partial_family_lists_the_failed_members_and_is_never_complete" },
  { id = "e3.python_malformed.negative", role = "negative", intent = "Python surface: malformed families and an undeclared snapshot refuse with registered reason codes.", evidence_test = "python/tests/test_batch_retarget.py", evidence_assertion = "test_a_malformed_family_is_refused_with_a_registered_reason" },
  { id = "e3.python_penalized.positive", role = "positive", intent = "Python surface: a penalized family reports its plug-in covariance, standard errors, contrast standard error and a complete family.", evidence_test = "python/tests/test_batch_retarget.py", evidence_assertion = "test_a_penalized_family_retargets_with_its_plug_in_score_covariance" },
  { id = "e3.max_t_one_claim.truth", role = "truth", intent = "The unpublished max-t critical value of one claim equals the two-sided normal quantile z_{1-(1-level)/2} (inverse normal computed in the test by bisection on an erf series) within Monte-Carlo tolerance at four levels.", evidence_test = "crates/antecedent/src/analysis/batch_retarget.rs", evidence_assertion = "one_claim_is_the_two_sided_normal_quantile" },
  { id = "e3.max_t_independent.truth", role = "truth", intent = "For k = 1..5 independent claims the critical value solves P(max |Z_j| <= c) = (2 Phi(c) - 1)^k = level at two levels, equal to the independently computed quantile; perfectly correlated claims reduce to the single-claim value; the value is monotone in family size and level and shrinks under positive correlation.", evidence_test = "crates/antecedent/src/analysis/batch_retarget.rs", evidence_assertion = "independent_claims_solve_the_product_equation" },
  { id = "e3.max_t_band.truth", role = "truth", intent = "From a hand-computed covariance (variances 4 and 9, covariance 1.2, so standard errors 2 and 3 and correlation 0.2) the band half-widths are exactly c times each standard error, with c the evaluator's value on the hand correlation; a partial or point-only family is refused.", evidence_test = "crates/antecedent/src/analysis/batch_retarget.rs", evidence_assertion = "the_band_half_widths_are_the_critical_value_times_each_standard_error" },
  { id = "e3.max_t_seed.invariance", role = "invariance", intent = "The critical value is a deterministic function of the declared seed (bit-identical on repeat, different across seeds, independent of the context's master seed).", evidence_test = "crates/antecedent/src/analysis/batch_retarget.rs", evidence_assertion = "the_critical_value_is_deterministic_in_the_seed" },
  { id = "e3.max_t_refusals.negative", role = "negative", intent = "The evaluator refuses invalid levels, out-of-range or too-few draws and a matrix that is not a unit-diagonal positive semidefinite correlation, each with its registered detail.", evidence_test = "crates/antecedent/src/analysis/batch_retarget.rs", evidence_assertion = "the_evaluator_refuses_bad_levels_draws_and_matrices" },
  { id = "e3.max_t_cancelled.budget", role = "budget", intent = "A context cancelled before or in the middle of the draws stops the evaluator with cancelled_no_claim and no value, and the same call then completes.", evidence_test = "crates/antecedent/src/analysis/batch_retarget.rs", evidence_assertion = "a_cancelled_context_stops_the_draws_without_a_value" },
  { id = "e3.cancelled_retarget.budget", role = "budget", intent = "A cancelled context stops the batch retarget with cancelled_no_claim, never a verdict, and the same family then completes.", evidence_test = "crates/antecedent/tests/batch_retarget.rs", evidence_assertion = "a_cancelled_retarget_is_a_stop_never_a_verdict" },
  { id = "e3.tidy_export.artifact", role = "artifact", intent = "The tidy export lists a row per claim and contrast with family identity, completeness and failure count, support and uncertainty kind, the failed member with its refusal, and a point-only member with no standard error.", evidence_test = "crates/antecedent/src/analysis/batch_retarget.rs", evidence_assertion = "a_complete_family_needs_every_member_with_covariance" },
  { id = "e3.python_tidy_export.artifact", role = "artifact", intent = "Python surface: to_rows carries every column (identity, provenance, support, refusal, diagnostics) for every claim and contrast including the failed one, and returns copies.", evidence_test = "python/tests/test_batch_retarget.py", evidence_assertion = "test_the_tidy_export_carries_identity_provenance_and_failed_members" },
  { id = "e3.cancel_every_poll.budget", role = "budget", intent = "A token tripped after k polls stops the family retarget (one poll per claim), the max-t evaluator (a poll every 1024 draws) and batch preflight with their typed stop for every k until the call completes, and the exact budget completes the whole family.", evidence_test = "crates/antecedent/tests/cancellation_expansion_cells.rs", evidence_assertion = "batch_retarget_max_t_and_batch_preflight_stop_typed_at_every_poll" },
  { id = "e3.retarget_cost.truth", role = "truth", intent = "A retarget request counts zero nuisance fits, its claims and contrasts, claims x rows weighted score reads and claims (claims + 1) / 2 x rows covariance products.", evidence_test = "crates/antecedent/tests/cost_expansion_cells.rs", evidence_assertion = "batch_retarget_cost_is_zero_fits_and_counts_claims_contrasts_and_rows" },
  { id = "e3.max_t_wired.calibration", role = "calibration", intent = "The complete-family max-t band is measured at three sample-size points by batch_retarget_calibration.rs, registered as run_br; the measured 95% iid route is licensed for complete families.", evidence_test = "crates/antecedent/tests/batch_retarget_calibration.rs", evidence_assertion = "the_unpublished_band_has_the_declared_members_and_a_max_t_critical_value" },
]

[[record]]
id = "2.2E.E3.dml_score_covariance"
workstream = "E3"
milestone = "E"
work_package = "E3"
status = "promoted"
consumer_question = "For a DML, DR-Learner or CausalForest average effect, what are the row-identified cross-fitted scores behind the reported ATE, and what point and plug-in score covariance do declared retargeted populations of that estimate have?"
theorem = "Derived in-repo (docs/guides/dml-scores.md). With out-of-fold mu_a(x) and e(x) the per-arm scores phi1_i = mu1_i + T_i (Y_i - mu1_i)/e_i and phi0_i = mu0_i + (1 - T_i)(Y_i - mu0_i)/(1 - e_i) are the formulas of the licensed AIPW table, so phi1 - phi0 is the DML AIPW score mu1 - mu0 + T(Y - mu1)/e - (1 - T)(Y - mu0)/(1 - e) row by row and the mean of the contrast is the fitted untrimmed ATE. A retargeted claim is the weighted mean of the contrast under fixed declared weights; its plug-in covariance is the E3 Gram matrix of weighted influence values. The covariance is a sampling covariance only under iid rows, positivity, cross-fitting with each row scored by nuisances fit on other folds, an outcome-propensity error product o_p(n^-1/2) and fixed weights; flexible learners are not shown to meet the rate, so the claim is point only. The partially linear (Robinson) score has no per-arm score and trimming redefines the population, so those fits keep no table. No score is derived from a CATE prediction."
reference = "docs/guides/dml-scores.md"
guarantee = "cross_fitted_aipw_scores_point_only_no_interval"
graph_class = "Back-door adjustment DAG of the identified AllObserved mean ATE with binary treatment; the route takes the identification the estimator already holds."
population_semantics = "All observed complete-case rows of the untrimmed AllObserved mean ATE; claims retarget that table to caller-declared fixed row weightings over one row snapshot."
evidence_family = "Complete-case rows of a binary treatment, an outcome and the declared adjustment covariates; out-of-fold nuisance predictions of the estimator's own seeded fold plan."
provider = "antecedent-learn cross-fitted nuisances through cached_aipw_nuisances (the bundle the fit already uses) and dml::aipw_score_table, one builder for DML, DR-Learner and CausalForest; the existing E3 retarget and Gram covariance. No second estimator and no second score implementation."
estimand = "theta_k = weighted mean of mu1 - mu0 under declared row weights, with the joint plug-in covariance of the retargeted claims; uniform weights return the estimator's own ATE."
inference_claim = "point_only"
inference_notes = "Point only: values and a plug-in score covariance (a standard error is not an interval). No interval is published and no coverage record exists or was run. A DML fit with the partially linear score or with trimming keeps no table and refuses retarget with score_table_unavailable; DR-Learner CATE profiles and CausalForest CATE intervals are separate cells and are not extended."
owners = ["antecedent-estimate", "antecedent"]
identity_inputs = ["the estimator configuration (outcome and treatment learner identities, folds, overlap) in the estimator-spec identity", "the table's nuisance provenance dml.crossfit.v1;route=<dml|dr_learner>;outcome=<spec>;treatment=<spec>", "fold seed and the seeded arm-stratified fold plan", "complete-case row identities"]
wire_changes = ["Additive: a DML, DR-Learner or CausalForest estimate carries the existing ScoreTable (same wire form) with a dml.crossfit.v1 provenance tag; no existing artifact changes."]
compatibility = "The DML, DR-Learner and CausalForest point, standard error and diagnostics are unchanged; the estimate additionally carries its score table, and a prepared plan of those estimators prepares one for retarget."
coverage_records = []
search = false
bounds = { cancellation = true, work = "one cross-fitted nuisance bundle (cancellation polled by the existing fit) and O(n) score arithmetic" }
refusals = [
  { code = "arm_not_populated", detail = "dml.arm_not_populated", when = "Complete-case selection leaves a binary treatment arm empty; the original nuisance engine refuses before fitting." },
  { code = "cancelled_no_claim", detail = "dml.cancelled", when = "The context was cancelled before a cross-fitted nuisance fold was fit (the AIPW score, DR-Learner and CausalForest nuisance bundle, and each partially linear nuisance); no estimate or score table is reported and the stop is not a verdict on the data." },
]
routes = [
  { name = "antecedent_estimate.DmlAte.score_table", stage = "evaluate", status = "licensed", claim = "point_only" },
  { name = "antecedent_estimate.DrLearner.score_table", stage = "evaluate", status = "licensed", claim = "point_only" },
  { name = "antecedent_estimate.CausalForest.score_table", stage = "evaluate", status = "licensed", claim = "point_only" },
  { name = "antecedent_estimate.DmlAte.partially_linear_scores", stage = "evaluate", status = "closed", permanent_in_release = true, reason_code = "score_table_unavailable", refusal_test = "crates/antecedent/tests/dml_scores_retarget.rs", refusal_assertion = "a_dml_fit_without_scores_refuses_the_retarget" },
  { name = "antecedent_estimate.DmlAte.trimmed_scores", stage = "evaluate", status = "closed", permanent_in_release = true, reason_code = "score_table_unavailable", refusal_test = "crates/antecedent/tests/dml_scores_retarget.rs", refusal_assertion = "a_dml_fit_without_scores_refuses_the_retarget" },
]
fixtures = [
  { id = "e3.dml_populated_arms.negative", role = "negative", intent = "The original nuisance engine refuses empty treatment arms after row selection and preserves the successful retained state.", evidence_test = "crates/antecedent/tests/recalc_dr.rs", evidence_assertion = "dr_plr_target_cancellation_and_invalid_refits_cannot_reuse_an_aipw_law" },
  { id = "e3.dml_score_mean.truth", role = "truth", intent = "The DML score table's contrast mean equals the fitted ATE, its iid contrast standard error equals sums written in the test and the published se_analytic, propensity columns are complementary and the table is the route's own cached nuisance bundle.", evidence_test = "crates/antecedent-estimate/src/dml.rs", evidence_assertion = "the_dml_score_table_averages_to_the_fitted_ate_with_the_iid_score_covariance" },
  { id = "e3.dml_hand_bundle.truth", role = "truth", intent = "On a fixed nuisance bundle (mu0 = 1, mu1 = 3, e = 0.5) the per-arm scores, the contrast mean and its covariance equal a hand calculation.", evidence_test = "crates/antecedent-estimate/src/dml.rs", evidence_assertion = "the_score_table_formulas_match_a_hand_calculation_on_a_fixed_bundle" },
  { id = "e3.dml_retarget.positive", role = "positive", intent = "A DML batch retargets its own estimate's scores: uniform weights return the DML ate and se, tilted weights, claim covariances and the cross-plan covariance equal independent sums over the raw score columns, and the prepare-time table equals the estimate's.", evidence_test = "crates/antecedent/tests/dml_scores_retarget.rs", evidence_assertion = "a_dml_batch_retargets_its_own_scores_with_the_joint_covariance" },
  { id = "e3.dml_learners.positive", role = "positive", intent = "DR-Learner keeps the marginal AIPW score table of the ATE it reports; a uniform retarget returns that ATE and its iid standard error.", evidence_test = "crates/antecedent/tests/dml_scores_retarget.rs", evidence_assertion = "dr_learner_retargets_its_marginal_scores" },
  { id = "e3.causal_forest.positive", role = "positive", intent = "CausalForest keeps the DML AIPW score table of its marginal ATE; a uniform retarget returns that ATE and its iid standard error.", evidence_test = "crates/antecedent/tests/dml_scores_retarget.rs", evidence_assertion = "causal_forest_retargets_its_marginal_scores" },
  { id = "e3.dml_no_scores.negative", role = "negative", intent = "A partially linear or trimmed DML fit keeps no table and every retarget member fails score_table_unavailable before and after an estimate.", evidence_test = "crates/antecedent/tests/dml_scores_retarget.rs", evidence_assertion = "a_dml_fit_without_scores_refuses_the_retarget" },
  { id = "e3.dml_fit_without_table.negative", role = "negative", intent = "At the estimator, a partially linear fit and a trimmed fit report no score table.", evidence_test = "crates/antecedent-estimate/src/dml.rs", evidence_assertion = "fits_without_a_per_arm_score_keep_no_table" },
  { id = "e3.dml_wire.artifact", role = "artifact", intent = "The DML score table round-trips its wire form unchanged.", evidence_test = "crates/antecedent-estimate/src/dml.rs", evidence_assertion = "the_dml_score_table_round_trips_its_wire_form" },
  { id = "e3.dml_replay.invariance", role = "invariance", intent = "The same seed and rows replay the same table to the bit; another seed deals another fold plan.", evidence_test = "crates/antecedent-estimate/src/dml.rs", evidence_assertion = "the_dml_score_table_replays_under_its_seed_and_follows_it" },
  { id = "e3.dml_learner_tables.truth", role = "truth", intent = "The DR-Learner table mean equals its reported ATE and the CausalForest table equals the DML table of the same nuisances.", evidence_test = "crates/antecedent-estimate/src/dml.rs", evidence_assertion = "dr_learner_and_causal_forest_tables_are_the_marginal_aipw_scores" },
  { id = "e3.dml_cancel.budget", role = "budget", intent = "A context cancelled before the call or after k clean polls stops the DML AIPW and partially linear fits with cancelled_no_claim (dml.cancelled) and no estimate for every k until the fit completes.", evidence_test = "crates/antecedent-estimate/tests/cancellation_expansion_cells.rs", evidence_assertion = "dml_stops_at_a_fold_and_every_stop_is_the_typed_cancellation" },
]

[[record]]
id = "2.2E.E1.preflight_rank_drop_estimation"
workstream = "E1"
milestone = "E"
work_package = "E1"
status = "promoted"
consumer_question = "When a declared adjustment set contains an exact linear dependency, what does the configured estimator give on the set with the dependent columns removed, and what exactly was dropped?"
theorem = "Derived in-repo (docs/guides/preflight-diagnostics.md; module docs of crates/antecedent/src/analysis/rank_drop_estimate.rs). A dropped column is an exact linear combination of the intercept and the retained columns on the complete-case rows, so [1 | Z_kept] and [1 | Z] have the same column space V. Ordinary least squares depends on the design only through V (fitted values are the projection of y onto V, and the coefficient on the treatment is the same linear functional of those fitted values), and an unpenalized logistic maximum likelihood depends on the design only through the set {X b} = V, so its fitted probabilities coincide as well. Penalized and separation-ridge fits are parametrization dependent: only the linear adjustment (exact) and the cross-fitted AIPW with its unpenalized logistic propensity (conditional on a non-separating, converged propensity fit on the reduced design) are licensed, every other estimator is refused, and a fold-level separation that a ridge would regularize is not detected, so the AIPW invariance is stated as conditional. The original rank-deficient design cannot be fit, so no original-design estimate exists to compare with; the estimate is the one the original set's projections define."
reference = "docs/guides/preflight-diagnostics.md"
guarantee = "span_preserving_point_only"
graph_class = "Declared binary-contrast adjustment design (one treatment, one outcome, a declared adjustment set); the route builds no graph of its own beyond a confounder star over the retained columns that only carries the set into the estimator, and makes no identification claim."
population_semantics = "All complete-case rows of the declared table; the estimator's own all-observed ATE."
evidence_family = "A table with binary-coded treatment, outcome and the declared adjustment columns, plus a declared deterministic column priority."
provider = "The existing study path (linear adjustment or cross-fitted AIPW) run on the projected table; the existing rank scan (plan_rank_drop) and propensity diagnostic fit. No second estimator."
estimand = "The estimator's average treatment effect on the reduced adjustment set, equal by the span argument to what the original set's projections define."
inference_claim = "point_only"
inference_notes = "Point only. The bootstrap is forced to zero and no standard error, interval, band or covariance is returned or requestable; no coverage record exists or was run. No calibration is claimed."
owners = ["antecedent", "python/antecedent/preflight"]
identity_inputs = ["the plan's canonical design identity (kept adjustment, dropped columns, declared priority)", "the estimator id", "fold seed (AIPW)", "complete-case row identities"]
wire_changes = ["Additive: a new JSON result (plan, span check, estimator, invariance label, point, note); no existing artifact or wire format changes."]
compatibility = "Additive entry point; plan_rank_drop still records without executing and a study prepared with the original adjustment set keeps it."
coverage_records = []
search = false
bounds = { cancellation = true, work = "one rank scan, one diagnostic propensity fit (AIPW) and one study run over at most the declared table; the preflight cell limit applies" }
surface_rust = ["crates/antecedent/src/analysis/rank_drop_estimate.rs"]
surface_values = ["RankDropEstimate"]
refusals = [
  { code = "route_not_supported", detail = "rank_drop_estimate.estimator_not_licensed", when = "An estimator other than linear adjustment or cross-fitted AIPW: its nuisance fits are not shown invariant to a span-preserving column removal." },
  { code = "route_not_supported", detail = "rank_drop_estimate.shape_not_supported", when = "A design that is not a binary contrast of one treatment (a joint cell or several treatments)." },
  { code = "rank_drop_not_licensed", detail = "rank_drop_estimate.span_not_preserved", when = "The independent check finds the retained columns do not span the original design (rank differs, retained set still dependent, or a dropped column outside the retained span)." },
  { code = "rank_drop_not_licensed", detail = "rank_drop_estimate.propensity_separates", when = "The cross-fitted route's diagnostic propensity fit on the reduced design separates, saturates, fails or does not converge." },
]
routes = [
