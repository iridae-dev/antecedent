id = "2.2B.X3.joint_mechanism_sensitivity"
workstream = "X3"
milestone = "B"
work_package = "B3"
status = "promoted"
consumer_question = "How far can the registered surrogate z-transport contrast move when the outcome kernel and the shared parent marginal it cites deviate together from their source values, and which joint deviations cross a decision threshold? The answer is an exact assumption range; sampling uncertainty is not offered by this record (record 2.2B.X3.joint_sensitivity_uncertainty, has measured coverage, but its interval route remains closed for 2.2)."
theorem = "Derived in-repo (docs/guides/joint-mechanism-sensitivity.md), not taken from a source. For the registered surrogate formula psi = sum_w P_W(w) [m(w,1) - m(w,0)], m(w,x) = sum_y y P_Y(y | w, x, do(z)), each perturbed factor is box-independently epsilon-contaminated, Q_i = (1 - eps_i) P_i + eps_i R_i with R_i free in its simplex (R_Y free per (w, x) stratum, as in the 2.1 one-factor route). The outcome range y_max - y_min is read from the numeric values of the law's Y axis (the observed outcome levels), not from a declared outcome domain: a replacement kernel can only move mass among those levels. (1) Containment: {Q_i : eps_i <= e_i} equals the set at eps_i = e_i, so the box range is attained at its corner and no continuous eps optimization exists. (2) psi is linear in each R_i given the others, so its extrema over the product of simplices are attained at product-polytope vertices; for fixed Q_W >= 0 the kernel optimum is per stratum, giving the closed form U = (1 - e_W) sum_w P_W(w) D+(w) + e_W max_w D+(w) with D+(w) = (1 - e_Y) Delta(w) + e_Y (y_max - y_min), and L symmetric with D-(w) = (1 - e_Y) Delta(w) - e_Y (y_max - y_min). The range is exact (complete within the declared class) and verified against brute-force vertex enumeration and random interior points; it is an assumption range, not a sharp identification claim beyond the declared contamination class. (3) Nested boxes give nested ranges and U (L) is non-decreasing (non-increasing) in each eps, so for a threshold the tipping set is monotone. The frontier is a family of axis-parallel lines: each holds the parent fraction at a grid value and searches the kernel fraction, along which U (L) is convex (concave) and piecewise linear (a max (min) over w of functions linear in e_Y); each line's first crossing is bracketed by bisection, and each axis reduces to the 2.1 one-factor tipping point. A bracket [lo, hi] is certified against the floating-point evaluation of U (L) by the same closed form (hi reaches the threshold, lo does not), not in exact arithmetic. Conditional on the 2.1 checked z derivation and binding (the formula and its catalog binding are verified by the existing route). Sampling uncertainty is not part of this record (its conservative composition and one-sided target are record 2.2B.X3.joint_sensitivity_uncertainty, measured but still closed for 2.2, paper-inherited). The range is never a confidence interval."
reference = "docs/guides/joint-mechanism-sensitivity.md"
guarantee = "exact_range_complete_within_declared_contamination_class (range only; sampling uncertainty is not offered by this record, and its conservative method is paper-inherited: record 2.2B.X3.joint_sensitivity_uncertainty has measured coverage but remains closed for 2.2)"
graph_class = "Single-source selection ADMG whose bounded z-transport derivation is the registered surrogate formula sum_w P(Y | w, X, do(Z)) P(w | do(Z)): one outcome, one binary treatment, one shared parent W, one cited source regime (the class 2.1 z_transport_mechanism_sensitivity accepts)."
population_semantics = "Source population supplies the cited do(Z) joint; the target differs from it only through the declared contamination of the outcome kernel and of the shared parent marginal, each within its own fraction bound (box-independent, no budget coupling). The treatment is set by intervention and is never a perturbed factor."
