[[record]]
id = "2.2B.X3.joint_sensitivity_uncertainty"
workstream = "X3"
milestone = "B"
work_package = "B3"
status = "carried_forward"
consumer_question = "What sampling uncertainty surrounds the joint deviation range of the registered surrogate z contrast, composed by one method whose coverage is measured at its own coordinate? Both coverage records were measured; every public route still refuses (`cell_not_licensed`) for 2.2."
theorem = "Derived in-repo (docs/guides/joint-mechanism-sensitivity.md). One conservative composition over record 2.2B.X3.joint_mechanism_sensitivity: [q_{a/2}(L*_b), q_{1-a/2}(U*_b)] over iid row-bootstrap replicates of the cited count table, each evaluated by the exact joint range. For any fixed true deviation delta0 in the box L*_b <= psi*_b(delta0) <= U*_b, so the interval contains the pointwise percentile interval at delta0, and its asymptotic coverage of psi(delta0) is at least nominal whenever the pointwise percentile bootstrap is consistent (one-sided, conservative target; exactly the percentile bootstrap at the zero box). paper-inherited: that pointwise consistency, and the framing of percentile-bootstrap sensitivity intervals with at-least-nominal coverage (Zhao, Small and Bhattacharya, arXiv 1711.11286, abstract only read) and the failure of bootstrap consistency for non-differentiable maps such as a tied max over w (Fang and Santos, arXiv 1404.3763, abstract only read); neither theorem statement was verified. The interval would never be a confidence interval for the sensitivity set. The one-sided target is measured by the coverage harness's one_sided role (CoverageTally::assert_one_sided: a floor at the level with no upper band or ceiling, the record stating its side and target)."
reference = "docs/guides/joint-mechanism-sensitivity.md"
guarantee = "conservative_one_sided_coverage_target_paper_inherited_route_closed"
graph_class = "As record 2.2B.X3.joint_mechanism_sensitivity: single-source selection ADMG whose bounded z-transport derivation is the registered surrogate formula (one outcome, one binary treatment, one shared parent W, one cited source regime)."
population_semantics = "As the range record, plus iid row sampling of the cited source do(z) count table; the true deviation delta0 is fixed inside the declared box."
evidence_family = "IID count table of the cited single-source do(z) joint (an exact law has no sampling uncertainty and withholds)."
provider = "antecedent_estimate::z_transport_bootstrap_law_draws (iid row bootstrap on the 2.1 nominal z interval stream) with the exact joint range per replicate; compiled only under the calibration-internal feature."
estimand = "psi(delta0), the target active-minus-control mean outcome contrast at any fixed true deviation delta0 inside the declared box; the interval [q_{a/2}(L*), q_{1-a/2}(U*)] with a one-sided (at least nominal) coverage target."
inference_claim = "calibrated"
inference_notes = "Measured, with every public route still closed (cell_not_licensed / joint_sensitivity.interval_withheld) and the estimator (antecedent_validate::joint_sensitivity_bootstrap_interval_internal) is compiled only under calibration-internal. Both coverage tests of crates/antecedent/tests/joint_sensitivity_calibration.rs are registered in scripts/gate_calibration.sh (run_js, over the sample-size grid) and were measured at the cut. The zero box is a two-sided gated record (the composition is exactly the percentile bootstrap there). The positive box is a one_sided record (side upper): coverage of the true upper extremal bound U, psi(delta0) at the maximizing vertex of the true law (the_calibration_truths_are_the_extremal_vertex_of_the_true_law), at least nominal, scored as containment in [q(L*), q(U*)], whose upper endpoint binds; its acceptance is level - 3 MCSE and, from 1000 replicates, the precision floor, with no upper band or ceiling (crates/antecedent/tests/common/calibration.rs, checked by scripts/gate_parity_schema.sh and collected by scripts/collect_coverage_records.py). The public route is carried forward beyond 2.2 despite the measured coordinate."
owners = ["antecedent-validate", "antecedent-estimate", "antecedent", "python/antecedent/transport"]
identity_inputs = ["none published: no interval is produced in 2.2; an opened cell would bind the range record's premises and data identity plus replicates, level, the bootstrap seed stream and the coverage target"]
wire_changes = ["None: no interval is published. The version 3 joint artifact of record 2.2B.X3.joint_mechanism_sensitivity carries a withheld sampling descriptor with no interval value, and its consumer refuses one."]
compatibility = "No public behaviour changes: the interval routes refused with cell_not_licensed before the split and still do."
coverage_records = ["cov.classical_transport.admg.frequentist.percentile_bootstrap.l95.z_joint_sensitivity_zero_box", "cov.classical_transport.admg.frequentist.percentile_bootstrap.l95.z_joint_sensitivity_positive_box"]
search = false
surface = ["python/antecedent/transport/_joint_sensitivity_uncertainty.py"]
surface_rust = ["crates/antecedent/src/analysis/joint_sensitivity_uncertainty.rs"]
surface_values = ["JointSamplingWire"]
surface_exports = ["python/antecedent/transport/advanced.py"]
owned_exports = ["joint_mechanism_sensitivity_interval"]
bounds = { max_bootstrap_internal = 2000, cancellation = true }
refusals = [
  { code = "cell_not_licensed", detail = "joint_sensitivity.interval_withheld", when = "The sampling-uncertainty interval route is requested at any public layer; closed for 2.2 of both measured coverage records." },
  { code = "route_not_supported", detail = "joint_sensitivity.bounds_exceeded", when = "The internal estimator is asked for fewer than 2 or more than 2000 bootstrap replicates, or a level outside (0, 1)." },
]
routes = [
  { name = "antecedent.PreparedZTransport.joint_mechanism_sensitivity_interval", stage = "uncertainty", status = "closed", reason_code = "cell_not_licensed", refusal_test = "crates/antecedent/tests/joint_sensitivity_lifecycle.rs", refusal_assertion = "the_unmeasured_interval_route_refuses_with_cell_not_licensed" },
  { name = "antecedent.transport.advanced.joint_mechanism_sensitivity_interval", stage = "uncertainty", status = "closed", reason_code = "cell_not_licensed", refusal_test = "python/tests/test_transport_joint_sensitivity.py", refusal_assertion = "test_the_unmeasured_interval_route_refuses_with_cell_not_licensed" },
  { name = "antecedent.transport.joint_sensitivity.uncertainty_conservative_endpoint_bootstrap", stage = "uncertainty", status = "closed", reason_code = "cell_not_licensed", refusal_test = "crates/antecedent/tests/joint_sensitivity_lifecycle.rs", refusal_assertion = "the_unmeasured_interval_route_refuses_with_cell_not_licensed" },
]
fixtures = [
  { id = "x3.endpoint_bootstrap.calibration", role = "calibration", intent = "Wiring only: the conservative endpoint bootstrap runs behind calibration-internal, reduces bit for bit to the percentile interval at the zero box, strictly contains it for a positive box, is seeded-deterministic, admits 2 and 2000 replicates and refuses 1 and 2001, and withholds for exact laws. Coverage was measured: the two ignored tests of crates/antecedent/tests/joint_sensitivity_calibration.rs are registered in gate_calibration.sh (run_js) and measured.", evidence_test = "crates/antecedent-validate/tests/joint_mechanism_sensitivity.rs", evidence_assertion = "the_endpoint_bootstrap_runs_behind_calibration_internal_and_dominates_the_pointwise_interval" },
  { id = "x3.extremal_vertex_truth.truth", role = "truth", intent = "The coverage truths are psi(delta0) at the extremal (maximizing) vertex of the box, built as an explicit contaminated target from the generating model, and equal the exact upper end U on the true law (the baseline at the zero box).", evidence_test = "crates/antecedent/tests/joint_sensitivity_calibration.rs", evidence_assertion = "the_calibration_truths_are_the_extremal_vertex_of_the_true_law" },
  { id = "x3.interval_closed.negative", role = "negative", intent = "The interval route refuses with cell_not_licensed at every public layer, every evaluation reports the interval withheld, and a consumer refuses an artifact carrying one.", evidence_test = "crates/antecedent/tests/joint_sensitivity_lifecycle.rs", evidence_assertion = "the_unmeasured_interval_route_refuses_with_cell_not_licensed" },
  { id = "x3.one_sided_coverage.positive", role = "positive", intent = "Wired, not measured: one-sided (one_sided, side upper) coverage of psi(delta0) at the extremal vertex at least nominal, and two-sided gated nominal coverage at the zero box, measured at the 2.2 cut by the registered harness." },
  { id = "x3.interval_artifact.artifact", role = "artifact", intent = "Required for any future release that opens the interval: an artifact binding replicates, level, seed stream and coverage target to the range record's premises, replayed by an independent consumer." },
]

[[record]]
id = "2.2B.X8.admg_counterfactual_id"
workstream = "X8"
milestone = "B"
work_package = "B5"
status = "promoted"
scope_decision = "B5 scoping report, accepted: one query shape, the effect of treatment on the treated P(Y_x = y | X = x') with x != x' and its mean contrast against E[Y | X = x'], on a finite-discrete ADMG from the observational joint only. Path-specific and recanting-district effects on ADMGs are deferred to 2.3 and refused with a typed detail; A5's fixed-DAG edge-contrast cell is unchanged. A conjunction that contradicts itself within one world is answered as an exact zero (accepted replacement of the untestable violated-consistency fixture)."
existing_surface = "2.2A.X8 (antecedent::cross_world) keeps its Markovian-DAG edge contrast, its CrossWorldWitness, its v1 artifact and its refusal of latent-confounded graphs unchanged. This cell is a sibling stage API (antecedent::counterfactual_id, antecedent.counterfactual_id) with its own query type (CounterfactualEventQuery over A5's WorldSpec/WorldId), a new ExogenousCoupling variant (shared latent exogenous terms, marginalized rather than abducted), its own derivation and obstruction types and a separate artifact format counterfactual_id_admg_v1. The only change to existing code is additive: the ExogenousCoupling variant and a crate-private budget hook threaded through ID in crates/antecedent-identify/src/id.rs (every existing entry point passes an unmetered hook and behaves as before)."
consumer_question = "On a finite-discrete causal diagram with latent confounding, what is the probability that the outcome would have been y had the treatment been x, among units that actually received x', and how does that compare with what was observed among them?"
theorem = "ID* (Shpitser and Pearl, UAI 2007; JMLR 9:1941-1979, 2008) applied to the two-event conjunction {Y_x = y, X = x'}: make-cg (one world per subscript; copies of a variable merged in topological order when every parent pair is one merged node or two fixed parents at one level, Lemma 24; ancestors of the event kept; effective subscripts are the fixed parents of a node and its ancestors), district factorization summing the nodes the event leaves free, conflicting-subscript failure, and each district term P_{sub(S)}(ev(S)) identified from P(V) by the existing complete ID; division by P(X = x') outside the algorithm. Transcribed from first principles and checked against y0 0.2.11's id_star source (BSD-3, read in the deleted oracle environment, not copied). When ID* stops (conflict or hedge) and X has exactly two levels, one more route: by consistency P(Y_x = y, X = x) = P(y, X = x) and X = x' is the complement of X = x, so P(Y_x = y, X = x') = P_x(y) - P(y, X = x), used when complete ID identifies P_x(Y) (proved here from consistency alone; checked by enumeration). A refusal is NOT a proof of non-identifiability: it says ID* (with the binary complement where it applies) does not identify the conjunction. ID*'s completeness is from experimental distributions (JMLR abstract read; theorem text paper-inherited), and ID* composed with ID is not complete from P(V): the audit's counterexample (directed 0->1, 1->2, 1->4, 2->3, 2->4, 3->4; bidirected 0<->2, 0<->3; X = 2, Y = 3) is refused by ID* alone while P(y | do(x)) is identified; with a binary X the complement now answers it, with a three-level X it stays a pinned refusal (a known completeness gap, not a verdict). The UAI 2009 characterization of singleton-treatment ETT identification from P(V) (Shpitser and Pearl, arXiv 1205.2615; abstract read, theorem text paper-inherited) is not implemented. Soundness of ID* is paper-inherited and checked (not proven) in-repo: every identified functional equals exact enumerated latent-SCM truth (fixed fixtures, a 160-graph random sweep and a 390-graph shuffled-label sweep with up to 6 nodes and up to 4 treatment levels); both fixture negatives carry self-certifying two-SCM witnesses on a positive P(V) (each a non-identifiability proof for that graph, separate from the refusal, which proves nothing); the recorded y0 differential agrees on the verdict on 237 of 257 graphs (every disagreement is a y0 Zero() on an event of positive probability), and on the 171 both identify, y0's recorded expression parsed and evaluated on a latent model's joint equals our numerator and the enumerated truth. The conflict check treats a node the event leaves free as taking an unknown level, which can only refuse more, never answer wrongly; no ID hedge was reached on the effect-on-the-treated shape in the sweeps. Guards the ETT shape cannot reach (two copies of one variable, fixed parents at two levels, a free node in a subscript, unmerged copies read at two levels) are exercised by synthetic conjunctions on the engine; restricting line-5 subscripts to ancestors is an exact simplification (its removal is an equivalent mutant)."
reference = "https://arxiv.org/abs/1205.2615"
guarantee = "sound_incomplete"
graph_class = "Explicit ADMG (directed and bidirected edges; a DAG is accepted as an ADMG without bidirected edges) of at most 6 observed finite-discrete variables, each with 1 to 4 levels; one treatment X and one outcome Y. No selection, temporal, accepted, uncertain or equivalence-class structure."
population_semantics = "One population; the observational joint describes it; the conditioning event X = x' selects the treated sub-population whose counterfactual outcome is asked. No transport."
evidence_family = "Observational joint P(V) over all graph variables: a supplied exact law, or an IID count table (the empirical plug-in) through the same functional. Posterior or learned laws are refused."
provider = "Existing exact finite-law evaluator (antecedent-expr compiled evaluator over factor tables built from the joint) for each ID term, composed by the counterfactual functional's sums and products and, for the binary complement, P_x(y) minus the joint mass P(y, X = x). A conditional on a zero-mass event is extended uniformly and by all mass on each level k of its conditioned variables (every level up to the largest cardinality), and the term is accepted only when every extension agrees: a dependence on one undefined conditional of one variable is caught at any cardinality, but agreement is a check, not a proof (one extension is applied to every zero-mass cell at once, and a joint conditional of several variables gets only the diagonal point masses). Each evaluation checks that the numerators over every level of Y sum to P(X = x') (relative 1e-9) and refuses otherwise; a consistency complement below -1e-12 refuses the law as incompatible with the graph. The artifact consumer recomputes with a separate direct-sum evaluator (same extensions and complement check, its own arithmetic)."
estimand = "P(Y_x = y | X = x') = P(Y_x = y, X = x') / P(X = x'), the outcome distribution over every level of Y, E[Y_x | X = x'] and the contrast E[Y_x | X = x'] - E[Y | X = x']. Named premises: consistency, mechanism invariance across worlds, the semi-Markovian model of the ADMG (exogenous terms shared across worlds and marginalized, not abducted), positivity of P(X = x') and of every conditional the functional evaluates with positive weight."
inference_claim = "point_only"
inference_notes = "Exact laws give the exact point; count tables give the empirical plug-in point. No sampling interval or posterior; a request refuses with estimator_inference_mismatch. No coverage records. Replay does not detect a producer that seals a wrong graph, query or law on purpose; and a bug shared by the identification engine and the consumer replays identically, because the consumer re-derives with the same engine and the direct-sum evaluator evaluates that same re-derived functional (it re-checks the arithmetic, not the derivation)."
owners = ["antecedent-core", "antecedent-identify", "antecedent-io", "antecedent", "python"]
identity_inputs = ["variable names", "directed and bidirected edges (canonical)", "variable levels", "canonical counterfactual event query (worlds, coupling, event and conditioning atoms as IEEE bits)", "search limits and memory cap", "estimand label", "contract tag", "data digest of the joint law (axes, probabilities, counts, origin, population and snapshot identity)"]
wire_changes = ["Additive: counterfactual_id_admg_v1 artifact (separate format and feature) carrying names, levels, graph, query, estimand, contract, search limits and accounting, canonical derivation, counterfactual graph, law and point; every wire struct rejects unknown fields; the A5 v1 reader refuses it and it refuses A5 bytes. Additive ExogenousCoupling::SharedLatentExogenous variant (the enum is non_exhaustive; A5 refuses it as outside its contract)."]
compatibility = "A5's cell, witness, artifact and tests are unchanged. On a Markovian DAG the ETT contrast and E[Y_x | X = x'] equal A5's per-unit edge contrast (every edge intervened) restricted to rows with X = x' (1e-9, exact enumeration table)."
coverage_records = []
search = true
search_impl = ["crates/antecedent-identify/src/counterfactual_id.rs"]
surface = ["python/antecedent/counterfactual_id.py"]
surface_rust = ["crates/antecedent-core/src/query/counterfactual_event.rs", "crates/antecedent-identify/src/counterfactual_id.rs", "crates/antecedent-io/src/counterfactual_id_artifact.rs", "crates/antecedent/src/counterfactual_id.rs"]
surface_pyo3 = ["python/src/counterfactual_id_api.rs"]
surface_values = ["CounterfactualEvent", "CounterfactualEventQuery", "CounterfactualIdRefusal", "CounterfactualIdProblem", "CfValue", "CfSymbol", "CfTerm", "CounterfactualFunctional", "CounterfactualNodeRecord", "CounterfactualGraphRecord", "CounterfactualObstruction", "CounterfactualIdSearchRecord", "CounterfactualIdShape", "CounterfactualIdDerivation", "CounterfactualIdPoint", "CounterfactualIdArtifactError", "CounterfactualIdWorldWire", "CounterfactualIdQueryWire", "CounterfactualIdAxisWire", "CounterfactualIdLawWire", "CounterfactualIdPointWire", "CounterfactualIdArtifactWire", "CounterfactualIdOptions", "PreparedCounterfactualId", "CounterfactualIdEffect", "CounterfactualIdConsumeLimits", "NativePreparedCounterfactualId", "EffectOnTreated"]
surface_internal = [
  { name = "evaluate_counterfactual_functional", why = "The exact evaluation of a derivation on a law, called by the routed PreparedCounterfactualId.evaluate (facade) and by the identification tests; hidden so the facade route is the public entry." },
  { name = "dense_joint", why = "Lays a law out in a problem's variable and level order for the hidden evaluator; no decision or evaluation of its own." },
  { name = "DenseJoint", why = "Data carrier of dense_joint (a law in problem order) with its marginal and mass helpers; hidden with it." },
  { name = "NullExtension", why = "The extensions of a conditional on a zero-mass event (uniform, all mass on level k) that the hidden evaluator compares; an internal policy, hidden." },
  { name = "counterfactual_id_data_digest", why = "Digest helper the facade seals and consumes artifacts with (the data identity a caller compares); no execution, hidden so the consume route is the public entry." },
  { name = "counterfactual_id_identity", why = "Premises-digest helper shared by the sealer and the consumer's digest check; no execution, hidden so the consume route is the public entry." },
]
bounds = { max_variables = 6, max_levels = 4, max_search_operations = 100000, max_search_depth = 64, cancellation = true, contract = "antecedent_core::SearchBudget", operation_limit = "SearchLimits.operations", depth_limit = "SearchLimits.depth", memory_limit = "SearchBudget memory cap, never absent: min(ExecutionContext.memory.hard_limit_bytes, 64 MiB default), live-state bytes cumulative across every ID* call and ID sub-call of one decision" }
refusals = [
  { code = "route_not_supported", detail = "counterfactual_id.conflicting_subscripts", when = "A district of the counterfactual graph sets a variable in a subscript to one level and reads it at another, or at a free level (ID* FAIL), and the binary consistency complement does not apply (X has more than two levels) or does not answer (ID does not identify P_x(Y)); the obstruction carries the counterfactual graph of the failing call and the conflicting pair and re-checks itself. Not identified by ID*: NOT a proof of non-identifiability." },
  { code = "route_not_supported", detail = "counterfactual_id.counterfactual_hedge", when = "A district term P_{sub(S)}(ev(S)) is not identified from P(V) by ID and the binary complement does not answer; the obstruction carries the hedge with its graph and re-verifies from the hedge definition. The hedge proves the district term, not the conjunction, unidentified: NOT a proof of non-identifiability. Never reached on the effect-on-the-treated shape in the sweeps; exercised on the engine (Rust only)." },
  { code = "route_not_supported", detail = "counterfactual_id.query_outside_contract", when = "A well-formed conjunction that is not the effect-on-the-treated shape (other worlds, events, conditioning or the abduction coupling) and is not a within-one-world contradiction. Not a nonidentification claim." },
  { code = "route_not_supported", detail = "counterfactual_id.path_specific_deferred", when = "A world routes edges (a path-specific or recanting-district query on an ADMG): deferred to 2.3." },
  { code = "route_not_supported", detail = "counterfactual_id.bounds_exceeded", when = "More than 6 variables, more than 4 levels of a variable, search limits above 100000 operations or depth 64, or an artifact whose stored limits exceed the consumer's (refused before any work)." },
  { code = "cell_not_licensed", detail = "counterfactual_id.graph_outside_contract", when = "Accepted, uncertain, equivalence-class, temporal or cyclic structure." },
  { code = "estimator_inference_mismatch", detail = "counterfactual_id.interval_requested", when = "A sampling interval or Bayesian inference is requested." },
  { code = "invalid_argument", detail = "counterfactual_id.invalid_query", when = "Unknown variables or levels, treatment equal to outcome, x = x', names that do not match the graph, a law whose axes do not match the prepared variables and levels or whose origin is not exact or counted, a zero-probability or self-contradictory conditioning event, a derivation whose numerators do not sum to P(X = x') on the law (a failed internal check), or a law on which a binary consistency complement is negative (incompatible with the graph)." },
  { code = "invalid_argument", detail = "counterfactual_id.positivity_violation", when = "The functional's value on the supplied law depends on how a conditional on a zero-mass event is extended (a conditional with positive weight is undefined)." },
  { code = "transport_budget_cancel", detail = "counterfactual_id.budget", when = "Operations, depth, memory or cancellation stopped the one budget shared by every ID* call, make-cg step and ID sub-call of the decision (every outcome level); a receipt lists explored and unevaluated levels. Never a nonidentification verdict. The code is the registry's budget-stop code, reused rather than registering a new one." },
  { code = "invalid_argument", detail = "counterfactual_id.invalid_artifact", when = "A consumed artifact does not decode, is another format, its digests or derivation or point do not replay, the direct-sum recomputation disagrees, or it was computed on other data." },
]
