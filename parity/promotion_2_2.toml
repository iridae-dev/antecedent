  { id = "x3.parent_witness.positive", role = "positive", intent = "No parent factor or a zero parent bound reports no parent vertex and the kernel-only range; a positive parent bound names the argmax of D+ and argmin of D-.", evidence_test = "crates/antecedent-validate/tests/joint_mechanism_sensitivity.rs", evidence_assertion = "the_parent_witness_is_absent_unless_the_parent_is_perturbed" },
