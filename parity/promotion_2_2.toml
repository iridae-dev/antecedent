  { id = "x2.classical_scope.negative", role = "negative", intent = "Random ADMGs of five to nine variables never make the classical route return not_certified; every scenario is identified or a verified s-hedge (the identify-crate sweep the_classical_route_is_never_not_certified_on_random_admgs covers 4 to 11 variables).", evidence_test = "crates/antecedent/tests/transport_scenarios.rs", evidence_assertion = "no_random_admg_makes_the_classical_route_return_not_certified" },
