  { id = "e7.one_to_two_closed_form.truth", role = "truth", intent = "One type of 1:2 set (n=3, k=1, t=1) has theta = 2a/(m-a); the solver reproduces it for three (a, m).", evidence_test = "crates/antecedent-estimate/tests/matched_case_control.rs", evidence_assertion = "one_to_two_sets_of_one_type_have_a_closed_form" },
  { id = "e7.brute_force_profile.truth", role = "truth", intent = "Mixed 1:2, 1:3 and 2:2 sets: the estimate equals the argmax of an independently written subset-enumeration profile likelihood.", evidence_test = "crates/antecedent-estimate/tests/matched_case_control.rs", evidence_assertion = "mixed_one_to_m_and_k_to_m_sets_match_the_brute_force_profile_likelihood" },
  { id = "e7.score_information.truth", role = "truth", intent = "The information equals minus the derivative of the score (central difference) and both match the closed form of the n=3, k=1, t=1 set.", evidence_test = "crates/antecedent-estimate/src/matched_case_control.rs", evidence_assertion = "information_is_minus_the_score_derivative" },
  { id = "e7.uninformative_sets.invariance", role = "invariance", intent = "Adding concordant, outcome-degenerate and singleton sets leaves the estimate bit-identical and changes only the reported counts.", evidence_test = "crates/antecedent-estimate/tests/matched_case_control.rs", evidence_assertion = "concordant_and_degenerate_sets_leave_the_estimate_unchanged" },
  { id = "e7.set_order.invariance", role = "invariance", intent = "Reordering rows and relabelling strata leaves the estimate bit-identical.", evidence_test = "crates/antecedent-estimate/tests/matched_case_control.rs", evidence_assertion = "a_set_order_or_label_change_does_not_move_the_estimate" },
  { id = "e7.python_one_to_one.positive", role = "positive", intent = "Python surface: the discordant-pair ratio 7/3 with the full set counts and the point_only claim.", evidence_test = "python/tests/test_matched_case_control.py", evidence_assertion = "test_one_to_one_matching_is_the_discordant_pair_ratio" },
