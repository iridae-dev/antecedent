  { id = "x1.paper_fig_2_obstruction.negative", role = "negative", intent = "R-443 Fig. 2(a,b) exactly (X-experiment in source a with S_a into Z, Z-experiment in source b with S_b into Y): a forced line-11 terminal no source can exchange at, with C0 = {Z, Y} (the paper's F'), replayed by the independent checker, invariant to source order.", evidence_test = "crates/antecedent-identify/tests/mz_transport_search.rs", evidence_assertion = "fig_2_with_an_x_experiment_and_a_z_experiment_is_a_replayed_obstruction" },
  { id = "x1.fig_2_two_model_counterexample.truth", role = "truth", intent = "The paper's own models M1, M2 (R-443 Eqs. 3-4) agree on the target observational law and every supplied experiment of Fig. 2 yet give P*(y | do(x)) = 1/2 and 1/4: the certified obstruction is real.", evidence_test = "crates/antecedent-estimate/tests/mz_transport_execution.rs", evidence_assertion = "fig_2_obstruction_is_real_the_papers_two_models_agree_on_every_experiment" },
  { id = "x1.fig_2_analogue_obstruction.negative", role = "negative", intent = "Three-node analogue of Fig. 2 (Z -> X -> Y, X <-> Y, S_a into Y, S_b into X): a second forced line-11 terminal replayed by the checker, with its own two-model witness in mz_transport_execution.", evidence_test = "crates/antecedent-identify/tests/mz_transport_search.rs", evidence_assertion = "fig_2_analogue_with_an_x_experiment_and_a_z_experiment_is_a_replayed_obstruction" },
  { id = "x1.single_exchange_reference.negative", role = "negative", intent = "Differential test against a literal one-exchange (I empty only) TR^mz reference over Fig. 1 variants and 6000 seeded two-source ADMGs: never identified where the paper fails, verdicts agree, and a repeated exchange is never eligible.", evidence_test = "crates/antecedent-identify/tests/mz_transport_paper_reference.rs", evidence_assertion = "the_search_never_identifies_where_the_one_exchange_reference_fails" },
  { id = "x1.cumulative_joint_regime.positive", role = "positive", intent = "One exchange of two controllables of a source cites the single joint regime do(Z1, Z2), never the separate do(Z1) and do(Z2) also supplied.", evidence_test = "crates/antecedent-identify/tests/mz_transport_paper_reference.rs", evidence_assertion = "an_exchange_of_two_controllables_cites_the_one_cumulative_joint_regime" },
  { id = "x1.nested_fail.negative", role = "negative", intent = "A paper FAIL after an exchange with every candidate line-10 branch failing is not_certified with mz_transport.search_incomplete, never an obstruction; the same graph with sources that cannot exchange is a checked obstruction.", evidence_test = "crates/antecedent-identify/tests/mz_transport_paper_reference.rs", evidence_assertion = "a_paper_fail_after_exchanges_is_search_incomplete_never_an_obstruction" },
  { id = "x1.twin_source_first_canonical.invariance", role = "invariance", intent = "Two sources certifying one factor: the first canonical source is cited, the result is invariant to declaration order, and the other source is not retained (missing evidence names the first).", evidence_test = "crates/antecedent-identify/tests/mz_transport_search.rs", evidence_assertion = "two_sources_certifying_one_factor_yield_the_first_canonical_source_in_any_order" },
  { id = "x1.twin_source.truth", role = "truth", intent = "Two sources certifying one factor give the same exact number in either source order, equal to the enumerated target truth, as does any weighted combination of them.", evidence_test = "crates/antecedent-estimate/tests/mz_transport_execution.rs", evidence_assertion = "two_sources_certifying_one_factor_give_the_same_truth_either_way" },
  { id = "x1.line10_separation.negative", role = "negative", intent = "Line-10 separation is tested with edges into X removed and needs Z_i to meet X: separated only after the mutilation, into a non-ancestor of Y, not separated, and separated without a treatment to exchange.", evidence_test = "crates/antecedent-identify/tests/mz_transport_paper_reference.rs", evidence_assertion = "the_line_10_separation_is_tested_in_the_graph_with_edges_into_x_removed" },
