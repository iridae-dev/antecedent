  { id = "x8.non_separable_closed_form.truth", role = "truth", intent = "The independent non-separable recomputation (restated basis, knots, unit scaling and ridge, solved by streaming Givens QR) equals the fitter's point on all eight edge sets of a noisy interacting SCM (relative difference about 2e-13, tolerance 1e-6) and is far from the linear closed form on the natural indirect edge set, so the check is not vacuous.", evidence_test = "crates/antecedent/src/cross_world.rs", evidence_assertion = "the_non_separable_closed_form_matches_the_fit_for_every_edge_set" },
  { id = "x8.independent_check_mutation.negative", role = "negative", intent = "An edited fitted mechanism (one basis coefficient, one moved knot) yields a point that the same evaluator replays bit for bit, so replay alone accepts it, while the independent recomputation from the table disagrees beyond the tolerance.", evidence_test = "crates/antecedent/src/cross_world.rs", evidence_assertion = "an_edited_mechanism_is_caught_by_the_independent_check_but_not_by_replay" },
