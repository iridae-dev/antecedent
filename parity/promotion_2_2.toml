  { id = "x5.refresh.lifecycle", role = "lifecycle", intent = "Same-window evidence refresh re-estimates under the same proof and identity.", evidence_test = "crates/antecedent/tests/temporal_transport.rs", evidence_assertion = "same_window_refresh_re_estimates_under_the_same_proof" },
