  { name = "antecedent.estimators.Aipw.nuisance_fallback", stage = "evaluate", status = "licensed", claim = "point_only" },
  { name = "antecedent_estimate.AipwAte.penalized_interval", stage = "uncertainty", status = "licensed", claim = "calibrated" },
  { name = "antecedent.estimators.Aipw.penalized_interval", stage = "uncertainty", status = "licensed", claim = "calibrated" },
  { name = "antecedent_estimate.PropensityNuisance.lasso_full_sample", stage = "evaluate", status = "closed", permanent_in_release = true, reason_code = "selection_inference_not_licensed", refusal_test = "crates/antecedent-estimate/tests/penalized_aipw.rs", refusal_assertion = "a_scope_outside_the_license_is_refused" },
  { name = "antecedent.estimators.PropensityPenalty.lasso_full_sample", stage = "evaluate", status = "closed", permanent_in_release = true, reason_code = "selection_inference_not_licensed", refusal_test = "python/tests/test_penalized_aipw.py", refusal_assertion = "test_a_lasso_outside_the_cross_fit_is_refused_with_a_typed_refusal" },
  { name = "antecedent_estimate.PropensityNuisance.ml_fallback", stage = "evaluate", status = "closed", permanent_in_release = true, reason_code = "nuisance_fallback_not_licensed", refusal_test = "crates/antecedent-estimate/tests/penalized_aipw.rs", refusal_assertion = "a_machine_learning_fallback_is_refused_with_the_failed_fit_recorded" },
]
fixtures = [
  { id = "e2.high_dim_separation.positive", role = "positive", intent = "Complete separation (T = 1{z0 > 0}) refuses the plain logistic with a typed stats error; the ridge propensity fits and its AIPW recovers the simulated effect 2.", evidence_test = "crates/antecedent-estimate/tests/penalized_aipw.rs", evidence_assertion = "ridge_propensity_recovers_the_effect_where_the_unpenalized_fit_is_refused" },
  { id = "e2.independent_scores.truth", role = "truth", intent = "The stored scores, the point (the score-mean identity), the retargeted point and the retargeted covariance equal a ridge-logistic Newton solve and arm OLS written in the test from the raw data, the table's fold ids and the penalties it selected.", evidence_test = "crates/antecedent-estimate/tests/penalized_aipw.rs", evidence_assertion = "scores_match_an_independent_calculation_and_retarget_exactly" },
