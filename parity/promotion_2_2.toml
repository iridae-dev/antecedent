inference_notes = "Exact laws are point_only; counted laws give the empirical plug-in point. The joint outer bootstrap (independent studies resampled independently under one replicate id; regimes of one forwarded dataset resampled as one table, margins projected from it within each replicate) is wired for calibration but its public route is closed at every layer: estimates report uncertainty withheld/cell_not_licensed with the declared-sampling dependence_reason; no public constructor (io, facade or Python) yields an interval, and every public consumer (io consume, facade, Python) refuses an artifact that carries one with cell_not_licensed / mz_transport.interval_withheld. Interval-bearing construction and its bit-for-bit recompute exist only under the antecedent-io calibration-internal feature (dev-dependencies alone), which also alone compiles the estimator antecedent_estimate::mz_transport_bootstrap_interval (its draw machinery and interval types are cfg-gated on antecedent-estimate's calibration-internal; only the dependence classification mz_sampling_dependence / mz_interval_withheld_reason stays public) and in unit tests. The coverage records are measured; this public interval route stays closed for 2.2 because its implementation and artifact handling are calibration-internal only."
