[[record]]
id = "2.2E.E7.tier_diagnostics"
workstream = "E7"
milestone = "E"
work_package = "E7"
status = "promoted"
consumer_question = "For an executed tiered average-effect result, which overlap and E-value diagnostics does its own design carry, and which are unavailable and why?"
theorem = "No new identification or estimation theorem (docs/guides/tier-diagnostics.md). The diagnostics are read off the executed result: the CoDetermined tier-closure adjustment set and the estimator's own overlap report, the tier cell's point E-value RR + sqrt(RR(RR-1)) with RR = exp(0.91 |effect| / sd(Y)) (VanderWeele and Ding's approximation; paper-inherited, not read here), or the Unknown cell's two declared orientation scenarios. Nothing is refit and no graph is built: the tier background asserts no within-tier edge, so no DAG with an assumed within-tier edge is constructed. An E-value reported by the E-value refuter is the smaller of a point and a converted interval-limit value and is therefore not a point E-value."
reference = "docs/guides/tier-diagnostics.md"
guarantee = "read_off_executed_result_point_only"
graph_class = "The tiered backgrounds the licensed cells accept (CoDetermined closure and the Unknown two-scenario envelope); the cell adds no graph and no identification claim."
population_semantics = "The executed result's own population: the all-observed (or declared) population of the tiered average-effect cell."
evidence_family = "A licensed StudyResult of a single-treatment tiered AverageEffect cell (its derivation steps, estimand adjustment sets, overlap report, E-value fields and diagnostics)."
provider = "None: no estimator is added. antecedent::tier_diagnostics reads the executed result."
estimand = "None new: a statement of which diagnostics the executed design carries."
inference_claim = "point_only"
inference_notes = "Point only. The point E-value is a sensitivity summary of the no-latent-path premise, not a test of it and not a tier-identification certificate. No E-value interval is reported: the converted effect-interval endpoint is an approximation whose own uncertainty is excluded and no coverage record measures it, so the interval is a typed unavailable field on every result (cell_not_licensed). No calibration is run."
owners = ["antecedent"]
identity_inputs = ["the executed result: derivation steps, estimand adjustment sets, scenario effects, overlap report, E-value fields and diagnostics"]
wire_changes = ["None: a read-only view over an executed result; no artifact or wire format changes."]
compatibility = "A read-only view over existing tiered results: no existing route, result type, artifact or default changes. New reason code diagnostic_not_available."
coverage_records = []
search = false
bounds = { cancellation = true, cancellation_check = "observed on entry, before each of the two tier reads and once per scenario; a cancelled read reports tier_diagnostics.cancelled and no diagnostics", work = "constant work over the fields of one executed result; no iteration, no refit and no search" }
surface_rust = ["crates/antecedent/src/analysis/tier_diagnostics.rs"]
surface_values = ["TierDiagnosticsError", "TierScenario", "TierDesign", "TierPointEvalue", "TierEvalue", "TierDiagnostics"]
refusals = [
  { code = "cell_not_licensed", detail = "tier_diagnostics.result_not_licensed", when = "The result's support status is not licensed." },
  { code = "invalid_argument", detail = "tier_diagnostics.not_a_tiered_average_result", when = "The result is not a single-treatment CoDetermined closure or Unknown two-scenario average-effect result (a non-tiered or joint-cell result)." },
  { code = "diagnostic_not_available", detail = "tier_diagnostics.overlap_not_carried", when = "A CoDetermined result whose estimator fitted no propensity score carries no overlap report; none is refit." },
  { code = "diagnostic_not_available", detail = "tier_diagnostics.unknown_scenarios_no_overlap", when = "The Unknown cell is a linear adjustment under two declared scenarios and fits no propensity score." },
  { code = "diagnostic_not_available", detail = "tier_diagnostics.unknown_scenarios_no_evalue", when = "The Unknown headline effect is NaN by design; one E-value across scenarios sharing data is not formed." },
  { code = "diagnostic_not_available", detail = "tier_diagnostics.evalue_embeds_interval_limit", when = "The E-value on the result came from the E-value refuter, which embeds a converted interval-limit value; it is not reported as a point E-value." },
  { code = "diagnostic_not_available", detail = "tier_diagnostics.evalue_not_computed", when = "The tier cell attached no point E-value (non-finite effect or an outcome with no usable spread)." },
  { code = "cancelled_no_claim", detail = "tier_diagnostics.cancelled", when = "The context was cancelled while the diagnostics were being read; none is reported and the stop is not a verdict on the result." },
  { code = "cell_not_licensed", detail = "tier_diagnostics.evalue_interval_withheld", when = "An E-value for the effect-interval limit is asked for: the converted endpoint is an uncalibrated approximation, so only the point E-value is reported." },
]
routes = [
  { name = "antecedent.tier_diagnostics", stage = "evaluate", status = "licensed", claim = "point_only" },
  { name = "antecedent.tier_diagnostics.unknown_scenarios", stage = "evaluate", status = "closed", permanent_in_release = true, reason_code = "diagnostic_not_available", refusal_test = "crates/antecedent/tests/tier_diagnostics.rs", refusal_assertion = "unknown_scenarios_state_the_declared_orientations_and_no_fabricated_diagnostic" },
  { name = "antecedent.tier_diagnostics.refuter_evalue", stage = "evaluate", status = "closed", permanent_in_release = true, reason_code = "diagnostic_not_available", refusal_test = "crates/antecedent/tests/tier_diagnostics.rs", refusal_assertion = "an_evalue_refuter_value_embeds_an_interval_endpoint_and_is_not_a_point_value" },
  { name = "antecedent.tier_diagnostics.evalue_interval", stage = "uncertainty", status = "closed", permanent_in_release = true, reason_code = "cell_not_licensed", refusal_test = "crates/antecedent/tests/tier_diagnostics.rs", refusal_assertion = "codetermined_diagnostics_consume_the_executed_design_overlap_and_point_evalue" },
  { name = "antecedent.tier_diagnostics.non_tiered_result", stage = "evaluate", status = "closed", permanent_in_release = true, reason_code = "invalid_argument", refusal_test = "crates/antecedent/tests/tier_diagnostics.rs", refusal_assertion = "a_result_that_is_not_a_tiered_average_effect_is_refused" },
]
fixtures = [
  { id = "e7.tier_codetermined.positive", role = "positive", intent = "A CoDetermined AIPW study reports the closure adjustment set [z, u], the estimator's own overlap report (identical to the result's) and a point E-value equal to an oracle written from the raw outcome SD and the reported effect; the interval is typed unavailable.", evidence_test = "crates/antecedent/tests/tier_diagnostics.rs", evidence_assertion = "codetermined_diagnostics_consume_the_executed_design_overlap_and_point_evalue" },
  { id = "e7.tier_refuter_evalue.negative", role = "negative", intent = "With the Cheap suite the mirrored refuter E-value embeds an interval endpoint and is reported unavailable (diagnostic_not_available), not as a point value.", evidence_test = "crates/antecedent/tests/tier_diagnostics.rs", evidence_assertion = "an_evalue_refuter_value_embeds_an_interval_endpoint_and_is_not_a_point_value" },
  { id = "e7.tier_unknown_scenarios.negative", role = "negative", intent = "An Unknown study reports its two scenarios with their adjustment sets and effects, and overlap and the E-value are typed unavailable; no within-tier DAG is built.", evidence_test = "crates/antecedent/tests/tier_diagnostics.rs", evidence_assertion = "unknown_scenarios_state_the_declared_orientations_and_no_fabricated_diagnostic" },
  { id = "e7.tier_not_tiered.negative", role = "negative", intent = "A plain backdoor AIPW result is refused invalid_argument (not a tiered average-effect result).", evidence_test = "crates/antecedent/tests/tier_diagnostics.rs", evidence_assertion = "a_result_that_is_not_a_tiered_average_effect_is_refused" },
  { id = "e7.tier_lifecycle.artifact", role = "artifact", intent = "The diagnostics read off the fresh run, the prepared click and the refreshed result agree, and the result's own artifact is consumed by the independent verifier.", evidence_test = "crates/antecedent/tests/tier_diagnostics.rs", evidence_assertion = "diagnostics_are_the_same_off_the_fresh_click_and_refreshed_results_and_the_artifact" },
  { id = "e7.cancel_every_poll.budget", role = "budget", intent = "A token tripped after k polls (every k until the read completes) stops the CoDetermined and the Unknown read with tier_diagnostics.cancelled and no diagnostics, and the exact budget completes.", evidence_test = "crates/antecedent/tests/cancellation_expansion_cells.rs", evidence_assertion = "tier_diagnostics_stop_typed_at_every_poll_without_a_partial_read" },
]

[[record]]
id = "2.2E.E5.factorized_joint_cells"
workstream = "E5"
milestone = "E"
work_package = "E5"
status = "promoted"
consumer_question = "For up to three jointly intervened binary treatment components, what is the mean outcome under each joint cell, which cells does the data support, how sensitive is the family to the declared factorization order, and does a derived-treatment construction leak its own constituents into the adjustment set?"
theorem = "Derived in-repo (docs/guides/joint-cells.md). For any ordering o of k components the chain rule gives P(T = c | Z) = prod_j P(T_oj = c_oj | earlier components, Z), an identity for every ordering; the ordering matters only through how each binary conditional is estimated. Each conditional is a ridge-logistic model in Z fit inside each observed prefix stratum on cross-fit training rows (penalty chosen on those rows only), so the cell propensity of a row is the product of out-of-fold conditionals and the enumerated cell propensities of a row sum to one up to rounding because each conditional is a probability and its complement. With per-cell OLS outcome models the cell score mu_c(Z) + 1{T = c} (Y - mu_c(Z)) / max(e_c, clip) has conditional mean mu_c(Z) when either e_c is correct or mu_c is correct and the clip is not active (the standard AIPW identity); the cell estimate is the mean score. A prefix stratum whose training rows are one class has a constant conditional (0 or 1), counted and reported. No variance or interval is derived: the nuisance remainder of a penalized propensity is not shown negligible (docs/guides/penalized-aipw.md), so the route publishes points and an aligned score table only. A declared antecedent-learn learner (random forest or gradient-boosted trees) replaces the ridge conditionals and the OLS outcome models under the same folds; each of its predictions is out of fold because a fold's model is fit on the training rows and predicts that fold's rows only (the fold plan partitions the rows), so the cell score keeps the same AIPW identity with learned mu_c and e_c. Its remainder (the product of nuisance errors) is not shown negligible, so the learner route is point-only too: an interval or covariance is refused with ml_nuisance_not_licensed. The factorization identity is verified independently by direct counting on hand-built 2- and 3-component laws (docs/guides/joint-cells.md)."
reference = "docs/guides/joint-cells.md"
guarantee = "cross_fitted_point_only_per_cell_refusal"
graph_class = "A caller-certified static adjustment set for a joint set-intervention on discrete binary components; the cell takes no graph of its own and does not certify the adjustment set. The derived-treatment declaration checks only role classification, measurement-time consistency, leakage by name and by exact copy, tracking, legal values and numerical rank."
population_semantics = "The complete-case rows as an empirical population; mu_c = E[Y^do(T=c)] for each cell c averaged over the empirical adjustment-set distribution. Positivity is reported per cell (in-cell weight ESS, propensity range, clipped share) and enforced only as a declared minimum ESS, never assumed."
evidence_family = "Rows of at most three binary 0/1 treatment components, a numeric outcome and a numeric adjustment set, plus an explicit derived-treatment declaration (source roles, transformation, legal values, intervention meaning, declared exclusions)."
provider = "antecedent_estimate::fit_factorized_joint_cells: chain-rule product of cross-fitted antecedent-learn RidgeLogisticLearner conditionals (reusing PropensityNuisance tuning and the cell-stratified unit fold plan) and per-cell OLS outcome models; antecedent::check_derived_treatment reads preflight_design for duplicates and rank. No second ML stack. With a declared learner the same function resolves the spec through antecedent_learn::resolve_for per task (LearnerSpec::for_task) and fits it on antecedent-learn DesignView row selections of the cross-fit folds."
estimand = "mu_c = E[Y^do(T = c)] for each supported joint cell c by cross-fitted AIPW; point contrasts cell-minus-control and, for two components with four supported cells, the 2x2 interaction mu_00 - mu_10 - mu_01 + mu_11."
inference_claim = "point_only"
inference_notes = "Point only. No interval or covariance: the conditional propensities are ridge-penalized and no coverage record measures them, so a requested interval is refused with penalized_interval_not_licensed. A declared learner nuisance (random_forest, gradient_boosted_trees) runs under its own cross-fitting contract (out-of-fold predictions only, per-fold failure refuses the cells that need it, no ridge fallback, identity and seeds on the score-table provenance) and is point-only: an interval or covariance over it is refused with ml_nuisance_not_licensed because a flexible nuisance needs its own remainder and coverage license. Lasso is closed with selection_inference_not_licensed and an undeclared machine-learning name with ml_nuisance_not_licensed. Ordering disagreement and cell positivity are receipts about this table, never verdicts. No calibration is run."
owners = ["antecedent-estimate", "antecedent", "python/antecedent/derived"]
identity_inputs = ["treatment components in cell-bit order", "declared ordering list (declared first)", "ridge tuning grid and inner folds", "declared learner spec (none for the ridge route)", "folds, seed, clip, minimum cell ESS, normalization and ordering tolerances", "adjustment set after declared exclusions", "outcome column"]
wire_changes = ["Additive: the factorized score table is an ordinary ScoreTable (ScoreTableWire) whose nuisance_provenance names joint_cell.factorized.crossfit and the ridge tag, or, for a declared learner, joint_cell.factorized.crossfit.learner_prefix with the nuisance=ml_joint_cell marker, the learner identity, fitted implementations and seeds (provenance_withholds_interval treats the marker like the ridge tag); no new artifact format and no change to existing artifacts."]
compatibility = "New standalone entry points: CellSaturatedAipw, the batch family and every existing artifact and reason code are untouched; three registered reason codes are added (joint_cell_unsupported, derived_treatment_invalid, ml_nuisance_not_licensed)."
coverage_records = []
search = false
surface = ["python/antecedent/derived.py"]
surface_rust = ["crates/antecedent-estimate/src/joint_cell_factorized.rs", "crates/antecedent/src/analysis/derived_treatment.rs"]
surface_pyo3 = ["python/src/derived_treatment_api.rs"]
surface_values = ["CellEstimate", "CellOrderingSpread", "CellRefusal", "CellStatus", "ConstituentRole", "DeclaredExclusion", "DerivedTreatmentDeclaration", "DerivedTreatmentPlan", "ExclusionRule", "FactorizedJointConfig", "FactorizedJointFit", "InterventionMeaning", "JointCellReport", "JointContrast", "NormalizationCheck", "OrderingSensitivity", "SourceColumn", "TemporalPosition", "Transformation", "ContrastValue", "DerivedTreatment", "JointCell", "JointCellsResult", "OrderingSpread"]
bounds = { cancellation = true, max_components = 3, max_orderings = 6, max_folds = 20 }
refusals = [
  { code = "invalid_argument", detail = "joint_cells.config", when = "Folds outside 2..=20, a clip outside (0, 0.5), a minimum cell ESS below 1, or a non-positive normalization tolerance or negative ordering tolerance." },
  { code = "invalid_argument", detail = "joint_cells.component_count", when = "Fewer than one or more than three binary treatment components." },
  { code = "invalid_argument", detail = "joint_cells.ordering", when = "An ordering that is not a permutation of the components, a repeated ordering, or more than six orderings." },
  { code = "invalid_argument", detail = "joint_cells.columns", when = "A repeated column among the treatments, outcome and adjustment set." },
  { code = "invalid_argument", detail = "joint_cells.no_rows", when = "No complete-case rows." },
  { code = "invalid_argument", detail = "joint_cells.not_binary", when = "A treatment component with a value other than exactly 0 or 1." },
  { code = "invalid_argument", detail = "joint_cells.nuisance_provider", when = "A joint-cell nuisance provider name that is not recognized." },
  { code = "ml_nuisance_not_licensed", detail = "joint_cells.ml_learner_not_declared", when = "A machine-learning provider name that is not a declared joint-cell learner (only random_forest and gradient_boosted_trees are declared)." },
  { code = "ml_nuisance_not_licensed", detail = "joint_cells.ml_interval_withheld", when = "An interval or joint covariance is requested over learner-supplied joint cells: a flexible nuisance needs its own remainder and coverage license that no record grants." },
  { code = "invalid_argument", detail = "joint_cells.learner", when = "An auto learner (it hides the learner actually fit) or a learner with invalid hyperparameters." },
  { code = "route_not_supported", detail = "joint_cells.learner_unavailable", when = "The declared learner cannot be resolved for the task in this build (for example no forest provider)." },
  { code = "penalized_interval_not_licensed", detail = "joint_cells.interval_withheld", when = "An interval or joint covariance is requested over the penalized factorized family." },
  { code = "cancelled_no_claim", detail = "joint_cells.cancelled", when = "The fit was cancelled; no estimate is reported and the stop is not a verdict on the data." },
  { code = "arm_not_populated", detail = "joint_cells.cell_empty", when = "A joint cell has no complete-case rows (refused for that cell alone)." },
  { code = "joint_cell_unsupported", detail = "joint_cells.conditional_unsupported", when = "A conditional factor a cell needs has no training rows with its prefix, or its fit failed, or its propensity is non-finite (refused for that cell alone)." },
  { code = "joint_cell_unsupported", detail = "joint_cells.outcome_model_unsupported", when = "A cell's outcome model has no residual degrees of freedom in a training fold or its fit failed (refused for that cell alone)." },
  { code = "joint_cell_unsupported", detail = "joint_cells.cell_ess_below_minimum", when = "A cell's in-cell weights have effective sample size below the declared minimum (refused for that cell alone)." },
  { code = "joint_cell_unsupported", detail = "joint_cells.no_supported_cell", when = "No cell of the family is supported; every cell's reason is listed." },
  { code = "joint_cell_unsupported", detail = "joint_cells.contrast_cell_unsupported", when = "A requested contrast needs a cell that is not supported, or an interaction is requested for other than two components." },
  { code = "route_not_supported", detail = "joint_cells.normalization_failed", when = "The enumerated cell propensities sum above one, or (all enumerable) deviate from one beyond the declared tolerance." },
  { code = "derived_treatment_invalid", detail = "joint_cells.derived_declaration_invalid", when = "A declaration with an empty or repeated name, a role that contradicts its measurement time, no or too many construction sources, invalid legal values, or an exclusion without a justification." },
  { code = "derived_treatment_invalid", detail = "joint_cells.derived_intervention_not_defined", when = "A product or sum declared with a joint-component intervention." },
  { code = "derived_treatment_invalid", detail = "joint_cells.derived_exclusion_rule_mismatch", when = "An exclusion naming an undeclared column, a repeated column, or a causal rule that does not match the column's role." },
  { code = "derived_treatment_invalid", detail = "joint_cells.derived_exclusion_not_in_adjustment", when = "A declared exclusion names a column that is not in the adjustment set." },
  { code = "derived_treatment_invalid", detail = "joint_cells.derived_constituent_in_adjustment", when = "A treatment-construction column is in the adjustment set without a declared exclusion." },
  { code = "derived_treatment_invalid", detail = "joint_cells.derived_descendant_in_adjustment", when = "A forbidden descendant is in the adjustment set without a declared exclusion." },
  { code = "derived_treatment_invalid", detail = "joint_cells.derived_outcome_in_adjustment", when = "The outcome is in the adjustment set or duplicated by another column." },
  { code = "derived_treatment_invalid", detail = "joint_cells.derived_duplicate_constituents", when = "Treatment-construction columns are exact copies of one another." },
  { code = "derived_treatment_invalid", detail = "joint_cells.derived_constituent_copy_in_adjustment", when = "An adjustment column is an undeclared exact copy of a treatment-construction column." },
  { code = "derived_treatment_invalid", detail = "joint_cells.derived_treatment_tracked_by_covariates", when = "A treatment-construction column is near-deterministically predicted by the adjustment columns (linear R^2 at least 0.999)." },
  { code = "derived_treatment_invalid", detail = "joint_cells.derived_illegal_value", when = "An observed derived value, or a joint-cell component that is not 0/1, lies outside the declared legal values." },
  { code = "design_rank_deficient", detail = "joint_cells.derived_rank_deficient", when = "The adjustment design is numerically rank deficient; the dependent columns are named and nothing is dropped." },
  { code = "derived_treatment_invalid", detail = "joint_cells.derived_not_a_joint_cell", when = "The factorized estimator is asked to run a transformation other than a joint cell." },
  { code = "invalid_argument", detail = "joint_cells.derived_unknown_column", when = "A declared or adjustment column is not in the table." },
]
routes = [
  { name = "antecedent_estimate.fit_factorized_joint_cells", stage = "evaluate", status = "licensed", claim = "point_only", covers = ["orderings_for"] },
  { name = "antecedent_estimate.declared_joint_nuisance", stage = "evaluate", status = "licensed", claim = "point_only" },
  { name = "antecedent_estimate.refuse_joint_inference", stage = "uncertainty", status = "closed", permanent_in_release = true, reason_code = "penalized_interval_not_licensed", refusal_test = "crates/antecedent-estimate/tests/joint_cell_factorized.rs", refusal_assertion = "undeclared_learners_lasso_and_intervals_are_closed" },
  { name = "antecedent_estimate.refuse_joint_learner_inference", stage = "uncertainty", status = "closed", permanent_in_release = true, reason_code = "ml_nuisance_not_licensed", refusal_test = "crates/antecedent-estimate/tests/joint_cell_factorized.rs", refusal_assertion = "undeclared_learners_lasso_and_intervals_are_closed" },
  { name = "antecedent.check_derived_treatment", stage = "prepare", status = "licensed", claim = "none" },
