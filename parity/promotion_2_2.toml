workstream = "X1"
milestone = "A"
work_package = "A1"
status = "in_progress"
consumer_question = "Can a catalog of limited experiments spread across several source populations identify the target effect when no single source can?"
theorem = "mz-transportability: TR^mz (Bareinboim, Lee, Honavar and Pearl, NeurIPS 2013; pseudocode is Fig. 3 of R-443). Checked against R-443 (Bareinboim and Pearl, NeurIPS 2014, Completeness Results): Theorem 4 says a TR^mz failure at line 12 yields C-forests F, F' spanning an mz*-shedge for some P_x'(y'); Theorem 5 says TR^mz is complete; Corollary 1 says P_x(y) is mz-transportable iff there is no mz*-shedge for any X' in X, Y' in Y (Theorem 3: an mz*-shedge precludes mz-transportability). The completeness claim is over the power-set information family of Def. 2 (per source P(v|do(z')) for every Z' in Z_i with all of V measured, a distinct Z_i per source, passive target) for all models inducing the selection diagrams, so it covers this bounded slice as a special case; the 2-4 source and size bounds are search bounds, not restrictions the theorem needs. Inherited: the obstruction is certified only at a line-12 failure reached with no active experiment (I empty) at which no source can exchange (line-10 test: S_i separated from Y given X in D_Xbar and Z_i meets X), a strict subset of the paper's FAILs, so it is sound under Theorems 3-5. NOT inherited: the search is incomplete as an obstruction decider, because failures reached after an exchange (I nonempty; e.g. R-443 Fig. 1(e,f) with Z2 in one source and Z1 in another, which the paper states is not transportable) are reported not_certified, as are catalog-bound formulas with an unsupplied regime and budget stops. Two departures from Fig. 3 leave the obstruction unaffected: Fig. 3 line 10 fires only when I is empty (one exchange per branch) whereas this search may exchange later-activated remaining controllables of the active source using the same source joint regime, and Fig. 3 line 11 returns a weighted combination of all certifying sources whereas this search returns the first in canonical source order. Target experiments (Z* nonempty) are supported by the paper and refused here."
