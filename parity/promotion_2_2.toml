  { name = "antecedent.matched.risk_scale_estimand", stage = "evaluate", status = "closed", permanent_in_release = true, reason_code = "effect_not_identified", refusal_test = "python/tests/test_matched_case_control.py", refusal_assertion = "test_risk_scale_estimands_are_refused_without_prevalence" },
  { name = "antecedent.matched.interval", stage = "uncertainty", status = "closed", permanent_in_release = true, reason_code = "cell_not_licensed", refusal_test = "python/tests/test_matched_case_control.py", refusal_assertion = "test_an_interval_is_withheld_with_a_typed_refusal" },
