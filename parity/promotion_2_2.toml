[[record]]
id = "2.2E.E4.clustered_dml_aipw"
workstream = "E4"
milestone = "E"
work_package = "E4"
status = "promoted"
consumer_question = "When rows come in independent clusters (sites, households, patients), what cross-fitted AIPW point estimate follows from whole-cluster folds, and with what cluster-sandwich standard error of the scores, without calling an IID cross-fit with a cluster standard error 'clustered DML'?"
theorem = "Derived in-repo (docs/guides/clustered-dml.md). Folds own whole clusters, so for fold k the held-out clusters are independent of nuisances eta_k fit on the other clusters when clusters are independent. theta_hat - theta0 = n^-1 sum_g S_g + R with S_g = sum_{i in g}(psi_i(eta0) - theta0) independent and mean zero across clusters, so Var(n^-1 sum_g S_g) = n^-2 sum_g v_g, estimated by (G/(G-1)) n^-2 sum_g S_hat_g^2 with S_hat_g the cluster sum of psi_i - theta_hat; the G/(G-1) factor is a stated convention (exactly unbiased only for exchangeable equal-size clusters). Two-way (dyadic) declaration: rows carry two endpoint labels in separate namespaces, folds own whole connected components of the endpoint graph (so no endpoint is shared across folds), and with cluster sums S_a (first endpoint), S_b (second endpoint) and S_ab (endpoint pair) of the centered scores the Cameron-Gelbach-Miller construction gives V = c_a sum S_a^2 + c_b sum S_b^2 - c_ab sum S_ab^2 over n^2 with c_G = G/(G-1) per term (the pair sum removes the double count of rows sharing both endpoints); a materially negative V is an error, never truncated to zero, and min(G_a,G_b)-1 is the reference degrees-of-freedom convention (the published candidate interval uses this reference; coverage is not yet measured). The remainder R is negligible only under a rate condition on nuisances fit on dependent clusters (effective sample size nearer G than n) and a no-dominant-cluster condition, neither certified by the data, and the one-way interval is licensed at its measured coordinate; the dyadic interval has no matching record."
reference = "docs/guides/clustered-dml.md"
guarantee = "cluster_sandwich_point_with_measured_one_way_t_interval"
graph_class = "Back-door adjustment DAG: the adjustment set of one identified AllObserved mean ATE with binary treatment; the route takes the identification the AIPW route already holds and adds no graph class."
population_semantics = "All observed complete-case rows; the untrimmed AllObserved population only, with the caller declaring the cluster label of every row. Trimmed fits, ATT/ATC, predicate and custom-weight populations, and non-mean functionals are refused. A dyadic declaration additionally needs a second endpoint label per row in a namespace disjoint from the first; an entity in both endpoint roles and one giant connected component are not described."
evidence_family = "Complete-case rows of a binary treatment, an outcome, the declared adjustment covariates and one caller-declared cluster label per row; the fold plan deals the distinct sorted cluster labels (or, for a dyadic declaration, the connected components of the endpoint graph named by their smallest first-endpoint label) to folds by a seeded shuffle keyed by the analysis seed."
provider = "The existing cross-fitted AIPW builder (logistic propensity and arm-wise OLS outcomes) over crossfit_fold_plan with the cluster label as the unit and a single stratum; the cluster sandwich reuses se::cluster_influence_se and the two-way variance reuses se::multiway_influence_se; dyadic components use one union-find (endpoint_components) shared with CandidateScreen.from_units. No second ML stack."
estimand = "theta = E[mu1(X) - mu0(X)], the average treatment effect over the observed population, estimated by the cross-fitted AIPW score mean under whole-cluster folds."
inference_claim = "calibrated"
inference_notes = "The point and standard error are available; the one-way 95% t interval is licensed at its measured cluster coordinate (300–800 rows), and other coordinates make no coverage claim. The cluster-sandwich standard error of the scores is published as se_analytic (se_kind cluster, or multiway for a dyadic unit) and as the named ClusterDmlReceipt value; the iid row-level covariance and influence values stay withheld; a retarget reports the cluster-summed covariance and its declared Student-t reference. A requested bootstrap or other SE kind is refused with cluster_interval_not_licensed. The standard error is a variance of the stored scores under the declared independence unit; a fixed-seed repeated-sampling known-truth test (crates/antecedent-estimate/tests/cluster_dml_known_truth.rs) checks the t_(G-1) Wald coverage against nominal and the iid standard error's undercoverage, and is a test, not a coverage record. The Wald interval estimate +- t_(G-1) se (t_(min(G_a,G_b)-1) two-way; EffectEstimate.se_reference_df, PublishedScalarUncertainty::interval) is published, and a retarget (single or batch) carries the cluster-summed covariance and the same reference. The one-way interval route is licensed for 2.2 at the measured coordinate; the dyadic interval has no matching coverage record. A row bootstrap would split clusters, so that alternative method remains closed. The two-way receipt carries n_clusters, n_clusters_second, n_components and reference_df = min(G_a,G_b)-1. The measured coverage construction is one-way cluster; the dyadic interval has a different multiway coordinate and cannot inherit that coverage record."
owners = ["antecedent-estimate", "antecedent", "python/antecedent/estimators", "python/antecedent/estimation"]
identity_inputs = ["the declared independence unit, minimum cluster count and (dyadic) minimum components per fold (ClusterDml::canonical_key) in the estimator-spec identity, with the cluster labels digested as cluster_ids and the second-endpoint labels digested inside the same key", "the score table's nuisance provenance (unit, cluster or component count and a fingerprint of the sorted distinct fold-unit labels) in the score-reuse identity", "fold seed and the whole-cluster fold plan", "complete-case row identities", "for a generated screen split: the seed and a blake3 digest of the sorted distinct unit ids in the screen id"]
wire_changes = ["Additive: a cluster-DML declaration appears in the Aipw estimator-spec identity (score) and in the score table's nuisance_provenance; the default configuration writes neither, so existing digests are unchanged. A generated screen split appends ;seed=..;units=.. to the caller's screen id."]
compatibility = "The default Aipw and Aipw(se='cluster', cluster_ids=...) (an IID cross-fit followed by a cluster standard error, which this record does not license as clustered DML) are bit-identical to before. DML, DRLearner and CausalForest take no cluster or dependence option: a cluster_ids, cluster_dml or multiway_ids key in their estimator_config refuses route_not_supported instead of being reported as an unknown key, and they keep no dependence-aware interval claim."
coverage_records = ["cov.average_effect.dag.frequentist.analytic_se.l95.cluster_dml_t_wald_interval"]
search = false
bounds = { cancellation = true, cancellation_check = "polled before every whole-cluster fold (one or two-way); a cancelled fit reports cluster_dml.cancelled and no table", min_clusters_floor = 10, default_min_clusters = 20, min_components_per_fold_floor = 2, default_min_components_per_fold = 4 }
refusals = [
  { code = "invalid_argument", detail = "cluster_dml.invalid_min_clusters", when = "A declared minimum cluster count below the floor of 10." },
  { code = "required_option_missing", detail = "cluster_dml.cluster_ids_missing", when = "A cluster-DML declaration without a cluster label for the complete-case rows." },
  { code = "too_few_clusters", detail = "cluster_dml.too_few_clusters", when = "The number of distinct clusters is below the declared minimum, at preparation or when a receipt is formed; nothing is fit." },
  { code = "route_not_supported", detail = "cluster_dml.scope", when = "A cluster-DML declaration with a non-mean functional, a target population other than AllObserved, or a trimming overlap policy." },
  { code = "route_not_supported", detail = "cluster_dml.penalized_propensity", when = "A cluster-DML declaration combined with a penalized propensity, which keeps points only." },
  { code = "cluster_interval_not_licensed", detail = "cluster_dml.interval_withheld", when = "A bootstrap count above zero or a non-default analytic SE kind is requested with a cluster-DML declaration; the point and score table are the result." },
  { code = "cancelled_no_claim", detail = "cluster_dml.cancelled", when = "The context was cancelled before every whole-cluster fold was fit; no estimate or score table is reported and the stop is not a verdict on the data." },
  { code = "invalid_argument", detail = "cluster_dml.invalid_min_components", when = "A declared minimum of connected components per fold below the floor of 2 on a dyadic declaration." },
  { code = "invalid_argument", detail = "cluster_dml.second_ids_unexpected", when = "A cluster unit declared with second-endpoint labels." },
  { code = "required_option_missing", detail = "cluster_dml.second_ids_missing", when = "A dyadic declaration without a second-endpoint label for the complete-case rows." },
  { code = "too_few_clusters", detail = "cluster_dml.too_few_components", when = "A dyadic declaration whose connected components leave the smallest fold fewer components than the declared minimum; nothing is fit." },
  { code = "dyadic_dependence_not_licensed", detail = "cluster_dml.dyadic_shared_namespace", when = "An endpoint label appears both as a first and as a second endpoint: an entity in both roles is dependent across the two dimensions, which the two-way construction does not model." },
  { code = "dyadic_dependence_not_licensed", detail = "cluster_dml.dyadic_giant_component", when = "One connected component of the endpoint graph holds more than one fold's share of the rows, so whole-component folds cannot be balanced." },
  { code = "route_not_supported", detail = "cluster_dml.flexible_learner_closed", when = "A cluster_ids, cluster_dml or multiway_ids option on dml, dr.learner or causal.forest, whose cross-fitting and inference are not justified under dependence." },
]
