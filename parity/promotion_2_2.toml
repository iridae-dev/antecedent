# 2.2 promotion records (ROADMAP.md 2.2 A/B; work package A0).
#
# One record per 2.2 cell freezes its scientific surface before implementation:
# consumer question, theorem, graph class, population semantics, evidence family,
# provider, estimand, inference claim, computation bound and refusal boundary.
# scripts/check_promotion_records.py (run by scripts/gate_promotion.sh) enforces:
#
#   - every frozen field is present and every refusal code is registered;
#   - a bounded search declares cancellation, operation, depth and memory limits;
#   - a record's routes stay closed until the record is `promoted`, and a
#     2.2 route cannot be licensed in parity/transport_stages.toml ahead of it;
#   - a `promoted` record cites executed positive, negative, artifact (and, for a
#     search, budget) fixtures, plus coverage records for any calibrated interval;
#   - no 2.2 record publishes a nominal-only interval (`estimator_grid_not_measured`
#     is not a 2.2 inference claim).
#
# Record status: frozen -> in_progress -> promoted, or carried_forward (the cell
# failed its gate; its refusal stays visible and the rest of 2.2 still ships).
# Routes here are closed until promotion; on promotion the licensed row moves to
# its owning stage registry and this record points at it.
#
# Inference-claim vocabulary (release notes must use the same words):
#   point_only            exact or plug-in point, no interval
#   calibrated            interval with a coverage record at its own coordinate
#   structural_envelope   range over supplied structural scenarios; not a CI
#   assumption_range      range over a declared sensitivity set; not a CI
#   none                  no numerical claim (identification/inspection only)
version = 1
release = "2.2"

[[record]]
id = "2.2A.X1.multi_source_limited_experiment"
workstream = "X1"
milestone = "A"
work_package = "A1"
status = "frozen"
consumer_question = "Can a catalog of limited experiments spread across several source populations identify the target effect when no single source can?"
theorem = "mz-transportability: transportability from multiple environments with limited experiments (TRmz)."
reference = "https://ftp.cs.ucla.edu/pub/stat_ser/r443.pdf"
guarantee = "sound_incomplete"
graph_class = "Finite discrete selection ADMG shared by target and sources; one selection diagram per source over the same named observed variables."
population_semantics = "One target population with observational evidence only; each source is a separate population with its own selection targets, controllable set, and supplied catalog. Theoretical experimental availability (controllable set) is kept distinct from the regimes actually supplied."
evidence_family = "Per-source joint-regime experimental laws do(Z_i=z) with their jointly measured margins; target observational joint. do(A,B) is never inferred from separate do(A) and do(B) entries."
provider = "Existing exact finite-law evaluator; empirical tables through the same checked formula (no separate estimator route)."
estimand = "Target interventional outcome distribution P*(y | do(x)) and its numeric means/contrasts."
inference_claim = "calibrated"
inference_notes = "Exact laws are point_only. An empirical interval ships only for independent studies or declared shared units, via joint outer bootstrap sharing replicate ids; unknown dependence withholds it (sampling_dependence_unknown). The interval ships only after its coverage records exist."
owners = ["antecedent-core", "antecedent-identify", "antecedent-expr", "antecedent-estimate", "antecedent-io", "antecedent", "python/antecedent/transport"]
identity_inputs = ["graph digest", "ordered-canonical source set (sorted by population id; permutation invariant)", "per-source selection targets", "per-source controllable set", "per-source supplied regime set with intervention values", "target query (outcomes, treatments, values)", "search limits", "evidence snapshot ids (data identity; refresh-replaceable)"]
wire_changes = ["Additive: multi-source z-transport artifact v1 (separate from the v2 single-source artifact); per-leaf source population on proof nodes; search receipt with explored/unevaluated regions; sampling-dependence declaration per source pair."]
compatibility = "The single- and two-source routes and their artifacts are unchanged; two-source queries keep their registered factorizations. The new route is a superset only through its own artifact version."
coverage_records = ["cov.classical_transport.admg.frequentist.percentile_bootstrap.l95.multi_source_mz_independent_studies", "cov.classical_transport.admg.frequentist.percentile_bootstrap.l95.multi_source_mz_shared_units"]
search = true
bounds = { max_observed = 12, max_sources = 4, max_controllable_per_source = 4, max_candidate_regimes = 64, max_search_states = 4096, max_depth = 24, cancellation = true, contract = "antecedent_core::SearchBudget", operation_limit = "SearchLimits.operations", depth_limit = "SearchLimits.depth", memory_limit = "ExecutionContext.memory.hard_limit_bytes" }
refusals = [
  { code = "transport_not_certified", detail = "mz_transport.search_incomplete", when = "Licensed rules exhausted within budget without a formula or theorem-backed obstruction." },
  { code = "transport_proven_non_transportable", detail = "mz_transport.checked_obstruction", when = "Every source reaches a checked line-11 terminal under a shared controllable set and selection targets, as the theorem licenses." },
  { code = "transport_missing_evidence", detail = "mz_transport.missing_joint_regime", when = "A certified factor cites a joint regime no source supplied." },
  { code = "transport_not_certified", detail = "mz_transport.fabricated_joint", when = "A factor would need one joint over several sources' interventions." },
  { code = "transport_budget_cancel", detail = "mz_transport.budget", when = "Steps, depth, memory or cancellation stopped the search; receipt records explored and unevaluated regions." },
  { code = "route_not_supported", detail = "mz_transport.bounds_exceeded", when = "More sources, observed variables, controllables or candidate regimes than the declared bounds." },
  { code = "sampling_dependence_unknown", detail = "mz_transport.interval_withheld", when = "Point retained; interval withheld because inter-source dependence is undeclared." },
]
routes = [
  { name = "antecedent_identify.decide_multi_source_z_transport", stage = "identify", status = "closed", reason_code = "cell_not_licensed" },
  { name = "antecedent.transport.advanced.MultiSourceZTransportStage.prepare_exact", stage = "prepare", status = "closed", reason_code = "cell_not_licensed" },
  { name = "antecedent.transport.advanced.PreparedMultiSourceZTransportStage.estimate_refresh", stage = "evaluate", status = "closed", reason_code = "cell_not_licensed" },
  { name = "antecedent.transport.multi_source_z_transport.uncertainty_joint_bootstrap", stage = "uncertainty", status = "closed", reason_code = "cell_not_licensed" },
  { name = "antecedent.transport.consume_multi_source_z_transport", stage = "consume", status = "closed", reason_code = "cell_not_licensed" },
]
fixtures = [
  { id = "x1.combined_catalog_only.positive", role = "positive", intent = "No single source identifies; the combined catalog does; exact SCM truth." },
  { id = "x1.missing_joint_regime.negative", role = "negative", intent = "Separate do(A), do(B) supplied; do(A,B) required; typed missing regime." },
  { id = "x1.fabricated_cross_source_joint.negative", role = "negative", intent = "Factor would mix sources inside one c-factor; refused by name." },
  { id = "x1.search_budget.budget", role = "budget", intent = "Budget exhaustion returns incomplete with receipt, never non-transportable." },
  { id = "x1.source_order.invariance", role = "invariance", intent = "Permuting sources leaves proof semantics, identity and point unchanged." },
  { id = "x1.exact_scm.truth", role = "truth", intent = "Exact numerical agreement with an enumerated latent SCM." },
  { id = "x1.roundtrip.artifact", role = "artifact", intent = "Consumer rechecks proof, source bindings and point without fetching." },
  { id = "x1.refresh.lifecycle", role = "lifecycle", intent = "Matching snapshot refresh keeps the proof; changed source/regime/catalog identity forces re-preparation." },
  { id = "x1.repeated_sampling.calibration", role = "calibration", intent = "Repeated-sampling coverage of the joint bootstrap under independent and shared designs." },
]

