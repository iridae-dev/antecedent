[[record]]
id = "2.2A.X2.finite_scenario_envelope"
workstream = "X2"
milestone = "A"
work_package = "A2"
status = "promoted"
consumer_question = "Which transport conclusions survive each of a finite, explicitly supplied set of graph/selection scenarios?"
theorem = "No new theorem: each scenario is decided independently by the already licensed classical catalog transport contract (sID with checked s-hedge obstructions). The envelope is a report over those results, not an identification claim about an equivalence class."
reference = "https://arxiv.org/abs/1312.7485v1"
guarantee = "per_scenario_contract_guarantee"
graph_class = "Finite list (1-64) of fixed selection diagrams (directed and bidirected edges over static observed variables, any number of outcomes and treatments) over at most 12 shared observed variables, each decided by the already licensed classical catalog sID row with that row's scope inherited unchanged: the only gate the scenario code adds is the 12-variable bound. Every scenario result is a checked derivation or an independently verified s-hedge, so the row's own limit (multi-outcome and larger general graphs are not enumerated against a latent-SCM oracle) narrows its conformance coverage, not what the path admits; no random ADMG in the scenario tests reached not_certified, which is a defensive status for this route. The new bounded ADMG transport class of 2.2B B1 is a later, separate row and enters only after B1 passes. No CPDAG/PAG-native transport ID."
population_semantics = "One declared coordinate schema (names, domains, cardinalities, units) shared by every scenario and validated against each graph, the catalog, laws, sample rows and the request; the same target question; edges and selection targets vary per scenario. A value must be a finite number inside its declared domain (a non-finite or non-numeric value belongs to no domain, unspecified included). Units are compared only between scenario schema declarations and catalog environments (and only when both declare one); an unspecified catalog or schema domain makes no claim and so cannot disagree; laws, samples and the request carry no units, so a value's unit is never checked."
evidence_family = "One supplied catalog; each scenario binds its own selection targets and its own derivation's evidence obligations, so evidence certified for one scenario never satisfies another. Shared-catalog environments may not declare selections (they belong to each scenario)."
provider = "Exact finite laws, or empirical tables fitted once and plugged into the same compiled per-scenario plan (points only)."
estimand = "Per-scenario target response; unweighted structural envelope (min/max over identified scenarios with the unidentified/unevaluated set named); optional declared-weight mixture report with residual mass preserved."
inference_claim = "structural_envelope"
inference_notes = "Point-only per scenario: the classical row's within-scenario bootstrap is not carried into the envelope in 2.2A (the empirical plug-in's bootstrap is fixed at zero replicates). Weighted ranges use the declared outcome domain limits and are withheld when unaccounted mass meets an unbounded domain. Cross-scenario aggregate inference with shared data is 2.3A and refuses (scenario_aggregate_not_licensed). Spread is never labelled a confidence interval or sharp bound."
owners = ["antecedent-core", "antecedent-identify", "antecedent-io", "antecedent", "python/antecedent/transport"]
