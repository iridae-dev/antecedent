  { id = "x3.python_tamper.negative", role = "negative", intent = "Python surface: a changed baseline snapshot fails the data identity with a reason code; a truncated artifact is a serialization error; the v2 consumer refuses a v3 artifact.", evidence_test = "python/tests/test_transport_joint_sensitivity.py", evidence_assertion = "test_tampered_joint_artifact_fails_with_typed_errors" },
