consumer_question = "Can a catalog of limited experiments spread across several source populations identify the target effect when no single source can?"
theorem = "mz-transportability: TR^mz (Bareinboim, Lee, Honavar and Pearl, NeurIPS 2013; pseudocode is Fig. 3 of R-443). Checked against R-443 (Bareinboim and Pearl, NeurIPS 2014, Completeness Results): Theorem 4 says a TR^mz failure at line 12 yields C-forests F, F' spanning an mz*-shedge for some P_x'(y'); Theorem 5 says TR^mz is complete; Corollary 1 says P_x(y) is mz-transportable iff there is no mz*-shedge for any X' in X, Y' in Y (Theorem 3: an mz*-shedge precludes mz-transportability). The completeness claim is over the power-set information family of Def. 2 (per source P(v|do(z')) for every Z' in Z_i with all of V measured, a distinct Z_i per source, passive target) for all models inducing the selection diagrams, so it covers this bounded slice as a special case; the 2-4 source and size bounds are search bounds, not restrictions the theorem needs. Inherited: the obstruction is certified only at a line-12 failure reached with no active experiment (I empty) at which no source can exchange (line-10 test: S_i separated from Y given X in D_Xbar and Z_i meets X), a strict subset of the paper's FAILs, so it is sound under Theorems 3-5. NOT inherited: the search is incomplete as an obstruction decider, because failures reached after an exchange (I nonempty; e.g. R-443 Fig. 1(e,f) with Z2 in one source and Z1 in another, which the paper states is not transportable) are reported not_certified, as are catalog-bound formulas with an unsupplied regime and budget stops. Departures from Fig. 3, each pinned by an executed test: (1) R-443 Fig. 1(e,f) split across two sources, which the paper states is not transportable, is deliberately not certified (not_certified, mz_transport.fabricated_joint, never an obstruction: fig_1ef_split_is_non_transportable_in_the_paper_but_deliberately_not_certified_here); (2) R-443 Fig. 2(a,b) exactly (X -> Y <- Z with X <-> Y and Z <-> Y; S_a into Z with an X-experiment in a, S_b into Y with a Z-experiment in b), which the paper states is not mz-transportable, is a forced line-11 terminal replayed as a checked obstruction in either source order, and the paper's own two models M1, M2 (its Eqs. 3-4, fair coins U1..U6) agree on every supplied law while giving P*(y | do(x)) = 1/2 and 1/4 (fig_2_with_an_x_experiment_and_a_z_experiment_is_a_replayed_obstruction, fig_2_obstruction_is_real_the_papers_two_models_agree_on_every_experiment); the three-node analogue Z -> X -> Y with X <-> Y (S_a into Y, S_b into X) is kept as a second obstruction with its own two-model witness (fig_2_analogue_with_an_x_experiment_and_a_z_experiment_is_a_replayed_obstruction, fig_2_analogue_obstruction_is_real_two_models_agree_on_every_experiment); (3) Fig. 3 line 10 fires only when I is empty (one exchange per branch) whereas this search may exchange the active source's remaining controllables again, but a differential test against a literal one-exchange reference of TR^mz over R-443 Fig. 1 variants and 6000 seeded two-source ADMGs finds the extension structurally unreachable: at a line-10 state V minus X is one c-component inside An(Y) in D_Xbar, an exchange removes only treatments, so lines 3 and 4 cannot add a controllable of the active source to X afterwards, the search never identifies where the literal reference fails and agrees with it on every fixture, and do(Z_cum) is always the single joint of one exchange (the_search_never_identifies_where_the_one_exchange_reference_fails, an_exchange_of_two_controllables_cites_the_one_cumulative_joint_regime); (4) a paper FAIL reached after an exchange with every candidate branch failing is not_certified with mz_transport.search_incomplete, never an obstruction (a_paper_fail_after_exchanges_is_search_incomplete_never_an_obstruction); (5) Fig. 3 line 11 returns a weighted combination of all certifying sources whereas this search returns the first in canonical source order without retaining the others, and both sources give the enumerated truth and the same number in either declaration order (two_sources_certifying_one_factor_yield_the_first_canonical_source_in_any_order, two_sources_certifying_one_factor_give_the_same_truth_either_way); (6) the line-10 separation is tested in the graph with edges into X removed and needs Z_i to meet X, with fixtures separated only after the mutilation, into a non-ancestor of Y, not separated, and separated without a treatment to exchange (the_line_10_separation_is_tested_in_the_graph_with_edges_into_x_removed); (7) target experiments (Z* nonempty) are supported by the paper and refused here by design as mz_transport.invalid_catalog before any search (target_experiments_are_refused_by_design_though_the_paper_supports_them)."
reference = "https://ftp.cs.ucla.edu/pub/stat_ser/r443.pdf"
