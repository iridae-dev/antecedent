  { id = "x8.artifact_bounds.negative", role = "negative", intent = "The 100000-row bound is enforced when the artifact is exported (typed Resource error) and, independently of valid digests, when it is consumed.", evidence_test = "crates/antecedent/tests/cross_world_edge_contrast.rs", evidence_assertion = "the_row_bound_is_enforced_at_export_and_at_consumption" },
  { id = "x8.wire_closed.negative", role = "negative", intent = "Every wire struct (artifact, query, world, witness, counterfactual node) rejects an unknown field.", evidence_test = "crates/antecedent-io/src/cross_world_artifact.rs", evidence_assertion = "every_wire_struct_rejects_unknown_fields" },
  { id = "x8.python_exact_scm.positive", role = "positive", intent = "Python surface matches the exact SCM truth for every edge set.", evidence_test = "python/tests/test_cross_world.py", evidence_assertion = "test_exact_scm_truth_for_every_edge_set" },
  { id = "x8.python_shared_abduction.truth", role = "truth", intent = "Python surface exposes the per-unit contrasts: under a noisy-outcome non-separable SCM they match each unit's own structural truth and differ from a rotated-mediator-disturbance pairing; under the noisy linear SCM every unit's contrast is the exact constant.", evidence_test = "python/tests/test_cross_world.py", evidence_assertion = "test_per_unit_effects_follow_each_units_own_mediator_and_outcome_noise" },
  { id = "x8.python_mean_truth.truth", role = "truth", intent = "Python surface: the mean answer matches the per-unit structural mean and not the conditional-mean plug-in (a mean-based check, not a per-unit one).", evidence_test = "python/tests/test_cross_world.py", evidence_assertion = "test_non_separable_mean_answers_per_unit_truth_not_the_conditional_mean_plug_in" },
  { id = "x8.python_abduction.positive", role = "positive", intent = "Python surface: abduction is exact inversion on both families, the witness names consistency as an assumption, and no consistency residual is published.", evidence_test = "python/tests/test_cross_world.py", evidence_assertion = "test_abduction_is_exact_inversion_and_no_consistency_claim_is_published" },
  { id = "x8.python_nonidentification.negative", role = "negative", intent = "Python surface refuses a recanting witness with cross_world_not_identified.", evidence_test = "python/tests/test_cross_world.py", evidence_assertion = "test_recanting_witness_refuses_with_cross_world_not_identified" },
  { id = "x8.python_boundary.negative", role = "negative", intent = "Python surface refuses structures outside the cell and interval requests with typed reason codes.", evidence_test = "python/tests/test_cross_world.py", evidence_assertion = "test_structures_and_inference_outside_the_cell_are_refused" },
  { id = "x8.python_unknown_names.negative", role = "negative", intent = "Python surface: unknown treatment, edge or graph variable names raise the documented cross_world.invalid_query detail under invalid_argument, not a schema error.", evidence_test = "python/tests/test_cross_world.py", evidence_assertion = "test_unknown_names_raise_the_invalid_query_detail" },
  { id = "x8.python_roundtrip.artifact", role = "artifact", intent = "Python surface exports and consumes (replays) the artifact and matches the Rust route.", evidence_test = "python/tests/test_cross_world.py", evidence_assertion = "test_artifact_round_trip_matches_the_direct_result_and_is_recomputed" },
  { id = "x8.python_data_binding.artifact", role = "artifact", intent = "Python surface reports the data digest and whether the closed-form cross-check verified the consumed point.", evidence_test = "python/tests/test_cross_world.py", evidence_assertion = "test_the_artifact_binds_its_data_and_reports_the_closed_form_cross_check" },
  { id = "x8.python_mutation.negative", role = "negative", intent = "Byte-level mutation of the Python artifact never returns a different answer.", evidence_test = "python/tests/test_cross_world.py", evidence_assertion = "test_a_mutated_artifact_fails_consumption_with_a_typed_error" },
