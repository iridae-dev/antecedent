  { id = "x9.ananke_gid.parity", role = "parity", intent = "Ananke 0.5.0 GID/AID surrogate-experiment specimens (executed oracle output recorded verbatim, parsed by the test: verdict equals oracle_result and the distributions the formula cites equal the ones the proof cites) agree; the observational-only case is recorded as consistent; nothing reshaped. The harness scripts were deleted per convention, so their hashes are provenance only.", evidence_test = "crates/antecedent-identify/tests/mixed_source_external_parity.rs", evidence_assertion = "ananke_gid_and_aid_cases_agree_and_every_disagreement_is_recorded" },
