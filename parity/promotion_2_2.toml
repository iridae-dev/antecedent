[[record]]
id = "2.2A.X4.learned_continuous_trial_transport"
workstream = "X4"
milestone = "A"
work_package = "A3"
status = "promoted"
consumer_question = "What is the mean effect of a randomized binary treatment on a continuous outcome in an overlap-supported target population, and which graph-specific estimators are eligible?"
theorem = "Trial-to-target transport of the conditional-mean functional under mean exchangeability over the certified standardizers and positivity of trial participation; augmented inverse-odds estimator is model doubly robust (outcome regression or participation model correct) with known randomization probabilities. No efficiency claim."
reference = "https://doi.org/10.1002/sim.8426"
guarantee = "model_double_robustness_of_point_and_pointwise_analytic_interval_under_iid_nuisance_rate_conditions"
graph_class = "Certified direct or baseline-standardization transport derivation (existing prepare_trial graph contract)."
population_semantics = "Target is the overlap-supported target population; nested-cohort (trial participants plus nonparticipants from one IID cohort, target = nonparticipants) and independent-samples (separate IID trial and representative target samples) are distinct declared designs."
evidence_family = "Binary randomized source treatment with known probabilities; complete baseline covariates equal to the certified standardizers; continuous source outcome; IID sampling only."
provider = "Existing TrialAipw via antecedent-learn LearnerSpec; all nuisances cross-fitted (each fold fitted on the other folds; the fit applies no preprocessing beyond an intercept column)."
estimand = "psi = E_target[ E(Y | X, A=1, S=1) - E(Y | X, A=0, S=1) ]."
inference_claim = "calibrated"
inference_notes = "The pointwise analytic influence Wald interval passed the six-point 95% coverage grid for IID nested cohort and independent fixed-size samples (2000 datasets per point). It treats nuisance estimation as second order under cross-fitting product-rate conditions and requires the declared support. No CATE-wide or simultaneous claim. PreparedLearnedContinuous.interval computes it when bootstrap=0; version 2 artifacts replay its standard error and limits from stored predictions. The old percentile bootstrap failed coverage and remains withheld. The existing prepare_trial nominal interval keeps its 2.1 status."
owners = ["antecedent-learn", "antecedent-estimate", "antecedent-io", "antecedent", "python/antecedent/transport"]
identity_inputs = ["graph, selections and query (premises digest)", "certificate record (rule, formula kind, standardizers, selection targets, premises)", "sampling design", "LearnerSpec for outcome and membership", "fold count and fold scheme (assignment is deterministic in the rows; master seed bound)", "bootstrap replicate request and coverage level", "overlap thresholds (membership and treatment) and frozen bounds", "variable names", "sample rows (data digest; refresh-replaceable)"]
wire_changes = ["Additive: learned continuous point artifact v1 (checked_learned_continuous_point_v1) records the certificate, provider versions, folds and overlap; interval artifact v2 (checked_learned_continuous_analytic_interval_v2) additionally records the analytic standard error and band.", "Additive: estimator-menu inspection payload (graph/query/provider-specific entries; selection always manual)."]
compatibility = "learned_trial wire v1 artifacts and prepare_trial stay unchanged and consumable; learned continuous point v1 remains consumable alongside interval v2."
coverage_records = ["cov.classical_transport.admg.frequentist.analytic_se.l95.learned_trial_aipw_nested_cohort_continuous_mean_contrast", "cov.classical_transport.admg.frequentist.analytic_se.l95.learned_trial_aipw_independent_samples_continuous_mean_contrast"]
search = false
