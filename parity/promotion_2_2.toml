  { id = "x9.rule3_counterexample.negative", role = "negative", intent = "Rule 3 with an action that is an ancestor of the observed set (W -> Z, W <-> Y) is refused for both insertion and deletion, the model shows the two quantities differ, and the search returns nothing for the query the unsound insertion would have answered wrongly.", evidence_test = "crates/antecedent-identify/src/sid/mixed_source.rs", evidence_assertion = "rule_three_refuses_the_ancestral_counterexample" },
