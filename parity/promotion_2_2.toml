  { id = "x4.misspecified_nuisance.positive", role = "positive", intent = "One nuisance family misspecified at a time, each with a real target shift (outcome learner wrong on a quadratic effect with the participation model right, truth 5.47; membership model wrong with the outcome right, truth 3.0): the augmented estimator lands within tolerance while the outcome plug-in and the trial-only contrast (an estimator that ignores membership) are more than 2.5 tolerances away. Both families wrong is outside the theorem and is not claimed.", evidence_test = "crates/antecedent/tests/learned_continuous_lifecycle.rs", evidence_assertion = "misspecified_nuisance_cases_match_only_the_claimed_robustness" },
