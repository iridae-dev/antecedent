surface_rust = ["crates/antecedent-estimate/src/estimator_menu.rs", "crates/antecedent-estimate/src/learned_continuous.rs", "crates/antecedent-io/src/learned_continuous_artifact.rs", "crates/antecedent/src/analysis/learned_continuous.rs"]
surface_pyo3 = ["python/src/learned_continuous_api.rs"]
surface_exports = ["python/antecedent/transport/advanced.py"]
owned_exports = ["EstimatorMenu", "EstimatorMenuEntry", "LearnedContinuousEstimate", "LearnedContinuousOptions", "PreparedLearnedContinuous", "consume_learned_continuous", "estimator_menu", "prepare_learned_continuous"]
surface_internal = [
  { name = "transport_estimator_menu_with", why = "Provider- and options-aware form of the menu builder used by the facade's PreparedLearnedContinuous::estimator_menu and by the lifecycle test; the routed public entry is transport_estimator_menu." },
  { name = "validate_learned_continuous", why = "Request validation shared by the facade builder, refresh and the independent consumer in antecedent-io; executes no fit and is reached publicly only through the routed StudyBuilder and consume routes." },
  { name = "check_membership_overlap", why = "Membership-overlap re-check shared with the antecedent-io consumer; reached publicly only through the routed consume route." },
