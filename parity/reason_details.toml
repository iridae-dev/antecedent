# Registry of refusal detail ids. A detail id is spelled once, here; the generated
# Rust and Python modules expose it as a constant, and tests and producers name the
# constant. Recoding a detail is a change to its `id` and nothing else.
# `codes` lists the reason codes the detail is refused under (one detail may carry
# several); `meaning` is the one-line condition. Regenerate with
# `python3 scripts/generate_reason_details.py`.

