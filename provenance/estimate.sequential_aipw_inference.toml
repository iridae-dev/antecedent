implementation_deviations = [
  "The implementing module is crates/antecedent-estimate/src/sequential_aipw_inference.rs. It states: Identification is assumed, not derived: sequential conditional exchangeability given the measured history, positivity at each decision over the observed histories, consistency, no interference, and no unmeasured confounder of a later decision that the first action affected and the history omits.",
  "It is a modular posterior: the cross-fit propensity and conditional-mean fits are held at their fitted values in each score, so the draws carry the subject-law uncertainty of the orthogonal score and not the sampling uncertainty of the nuisance fits.",
  "The prior is the vanishing- concentration Dirichlet-process prior on the subject law; it does not identify the target, the stated identification assumptions do.",
]

