papers = [
  { title = "Nonparametric methods for doubly robust estimation of continuous treatment effects", doi = "10.1111/rssb.12212", sections = ["Section 3.1: doubly robust pseudo-outcome mapping", "Section 3.2: local-linear kernel estimator of the effect curve", "Section 3.4: marginalization term in the influence-function variance"] },
]

# Derived from the Kennedy et al. construction, not the exact estimator analyzed
# there. Cross-fitting is present, but the nuisance classes and the bandwidth rule
# are narrower than the paper assumes, so its rate and inference results are not
# inherited wholesale. The sibling record
# estimate.response.kennedy_dr_simultaneous.toml carries the matching disclaimer
# for the band; this record previously carried none despite sharing the machinery.
#
# The doubly robust *property* implied by this feature_id is not empirically
# demonstrated: no test misspecifies exactly one nuisance. See
# parity/response.toml (estimate.response.kennedy_dr) for the evidence actually held.
implementation_deviations = [
 "nuisances restricted to additive cubic-B-spline GAMs (one 1-D smooth per column, no interaction/tensor terms), not the arbitrary consistent learners the paper's theory admits",
 "nuisance penalty lambda is a fixed caller-supplied constant (default 1.0); the GCV selection path in fit_gam is never invoked, so nuisance complexity does not grow with n",
 "conditional treatment density is a Gaussian plug-in from a GAM conditional mean plus a single pooled homoskedastic residual scale, not a nonparametric conditional density estimator",
 "least-squares additive GAMs and the influence sandwich require finite outcome moments; a tail ratio max|Y-median|/(1.4826 MAD) above 20 is reported as response.heavy_tailed_outcome rather than inherited from the Kennedy et al. rates",
 "the response curve uses an unbounded Gaussian local-quadratic fit rather than the paper's local-linear construction; the additive nuisance model makes the empirical covariate-marginalization influence term constant over the grid",
 "default curve bandwidth is Silverman's normal-reference KDE rule on the marginal treatment distribution, rather than the cross-validation criterion in Section 3.5; smoothing bias and bandwidth-selection uncertainty are not represented in the curve's intervals",
 "cross-fitting folds are deterministic index-modulo splits rather than randomized sample splitting",
]

upstream_implementations_observed = []

test_sources = [
  "crates/antecedent-estimate/tests/estimate_response_kennedy_dr_reference.rs (exact rational cross-fitted pseudo-outcome, level, influence composition and positive-definite penalized split)",
  "crates/antecedent-estimate/src/response/tests.rs",
  "crates/antecedent-stats/src/response.rs",
  "conformance/response/two_point_curve_average_effect (shared-linear-estimand calibration)",
]

[method_review]
status = "reviewed_with_limits"
scope = "The scalar mean-curve path of ContinuousResponseEstimator::mean_curve in crates/antecedent-estimate/src/response (curve.rs, nuisance.rs, crossfit.rs, sample.rs): the index-modulo cross-fitting folds, the penalized additive-GAM outcome nuisance on (treatment, adjusters) and treatment nuisance on the adjusters over each fold's training rows, the treatment residual scale with the effective-degrees-of-freedom divisor, the Gaussian conditional density with its dimensionless 1e-8 floor on sigma times the density, the training-row Gaussian-mixture marginal density (direct and the binned Hermite path above 512 training rows), the marginalization offset over all rows and the treatment smooth, the pseudo-outcome, the covariate term (c_i - mean c)/n, and the composition of the exported influence from the local-quadratic influence of the pseudo-outcome. Relies on the reviews of stats.gam (the penalized additive fit, its knots and centering) and stats.response.local_polynomial (the Gaussian-kernel local quadratic and its leverage-corrected influences); this review checks only the route arithmetic that sits on them. Not the Silverman default bandwidth, the Student critical values, the simultaneous band (estimate.response.kennedy_dr_simultaneous), the winsorization diagnostic or the Bayesian row-weighted draw path."
assumptions = ["Conditional exchangeability, consistency and positivity given the adjustment set are identification assumptions taken as given.", "The outcome mean is additive in the treatment and the adjusters and the treatment is Gaussian around an additive function of the adjusters with a constant scale; the estimator does not test either, and the covariate term of the influence is derived only for the additive outcome nuisance.", "The data are dyadic in the references so that the product reads exactly the numbers the references use; the product uses a direct solve when certified and otherwise backfits; agreement is held to the original backfit resolution, not to rounding."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the product source named in its scope, including the numerical helpers it calls, and compared results with definitions evaluated by executing references written for this review; no upstream implementation or test source was consulted or copied. The cited publications were not retrieved in this review: the correspondence is between the product code and the standard definitions those works state, verified numerically, not a page-level reading of the papers."
redistribution = "Primary work is cited, not redistributed. The reference script and its frozen output are repository-authored (MIT OR Apache-2.0); the script uses mpmath (BSD-3-Clause), imported at run time and not redistributed here. It is not run in a locked, isolated environment and is not wired into any gate; its output is frozen in the JSON file and compared by the test."
limitations = "Six frozen designs of 48 to 720 rows with one adjuster: an ordinary confounded design at 3 folds, an outcome offset of 1e6 with a treatment offset of 1e3 and an adjuster on scale 250 at 5 folds, a treatment value far enough from its conditional mean that the density floor binds, a strongly determined treatment (noise 1/8), a nearly determined treatment (noise 1/64), and a 720-row design whose training mixture exceeds 512 means. The exact references are solved at fixed lambda 0.5 to 1; nothing here checks that those are good nuisance choices. Agreement is held to 2e-5 of the outcome spread (the backfit now stops at 1e-10) plus 2e-9 of the largest outcome, because the backfit tolerance is relative to the largest fitted value including the intercept: an outcome offset of 1e6 admits about 1e-4 absolute in the centered smooths (the gam.rs stopping rule uses max|fitted| for its scale, which is stats.gam's code and is not changed by this review). The influence check composes the product's exported influence from the separately reviewed local-quadratic influence of the product's own pseudo-outcome plus the reference covariate term; the local influence itself is not re-derived here. The cited paper (Kennedy et al., nonparametric doubly robust estimation of continuous treatment effects) was not retrieved in this review: the reference is the pseudo-outcome mapping as the module states it, evaluated exactly, so section-level correspondence with the paper is not established, and the doubly robust property (one nuisance misspecified) is not demonstrated by anything here. The shared fit path tries a conditioned and residual-checked fixed-penalty direct solve before falling back to backfitting. The near-determined case was independently evaluated after that change: exact rational LDL pivots certify positive definiteness of the penalized outcome system in each fold (smallest pivot 0.0004819); this certifies a unique penalized solution, not strong data identification or stability under other penalties. The reference uses sigma times the marginal density divided by max(sigma times the conditional density, 1e-8); correcting the prior absolute-density reference did not change the six retained fixtures because their floor-binding observation underflows at either floor. No near-floor finite-density design is covered. The density-ratio helper now refuses negative or nonfinite densities, nonfinite standardized densities and nonfinite ratios; this guard is source-inspected and is not part of the frozen numerical comparison. The fold rule is index modulo, not random. The reference script is not run in a locked, isolated environment and is not wired into any gate."
sources = ["https://doi.org/10.1111/rssb.12212", "https://mpmath.org/"]
findings_resolved = ["Defect repaired: the additive-GAM nuisance backfit of the response estimators stopped at a relative tolerance of 1e-6 on either the change of the smooths or the change of the residual sum of squares, and the second is second order in the coefficient error. With an adjuster correlated with the treatment the fitted values were right but the treatment smooth, which the Kennedy marginalization reads as a function in its own right, was off by 0.2 percent (a pseudo-outcome off by up to 5e-3 on values of order 1). The nuisance and plug-in target fallback backfits run at 1e-10 with a 2000-sweep budget; the original comparison found the pseudo-outcome, level and exported influence equal to the exact pipeline at the stated tolerance. The current fit path may instead use a certified fixed-penalty direct solve.", "The nearly determined design exposed stopping-point sensitivity in the former backfit (one fold gave treatment smooths of -2.8, 1.47, 1.50 and 2.50 at tolerances 1e-6, 1e-8, 1e-10 and 1e-12). Exact rational positive-definiteness certifies a unique minimizer for the fixed-penalty design. An observed direct-solver run agrees with the independent near-determined pseudo-outcomes to 4.97e-11 and levels to 6.78e-12; its exported influence remains checked by the reference test.", "The cross-fit folds, the effective-degrees-of-freedom residual scale, the conditional and marginal densities including the floor and the binned mixture, the marginalization offset, the pseudo-outcome, the covariate term and the level equal the exact rational pipeline on the original designs."]
