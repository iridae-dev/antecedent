]

[non_algorithm_review]
status = "justified_non_algorithm"
kind = "contract"
rationale = "interference_design_identification declares the identification of an interference exposure contrast: an inspectable expectation functional, one declared assumption that the known assignment mechanism and exposure mapping identify it (the graph is schema only), and an Identified status."
no_independent_algorithm = "The function builds an expression node, a Custom assumption record and a derivation line; it computes no estimate. The mapped module also routes the interference and transport executions: its only numerical expression is sqrt of the variance the estimator returns (the standard error of a delivered contrast), and every estimate and variance comes from the covered records."
covered_by = ["stats.randomized_interference", "estimate.interference.bayesian_gaussian", "estimate.transport.trial_bayesian_bootstrap"]
