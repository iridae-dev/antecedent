# `papers = []` is deliberate (see provenance/README.md): the route stamps that a known assignment
# mechanism and an exposure mapping identify the exposure contrast (Aronow and Samii 2017,
# Annals of Applied Statistics 11(4), doi 10.1214/16-AOAS1005). The Horvitz-Thompson / Hajek point
# and the conservative variance are other records' code; the paper text was not retrieved.
papers = []

implementation_deviations = [
 "Identification is design-based: the known assignment mechanism identifies the exposure contrast. The graph is schema-only and is not searched.",
 "Observational interference (unknown assignment, network-confounded exposure) is outside scope.",
 "Does not implement the paper's joint-exposure-probability variance estimator; estimation is stats.randomized_interference (Horvitz–Thompson / Hájek).",
]

upstream_implementations_observed = []

