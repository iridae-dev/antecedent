 "crates/antecedent-estimate/tests/latent_class_reference.rs (independent 40-digit multi-start EM stationary point of the mixture of Gaussian regressions: two classes with a binary treatment, three classes with a continuous treatment and two covariates, unbalanced weights at an outcome offset of 1e4 and a covariate offset of 100, and no covariates)",
