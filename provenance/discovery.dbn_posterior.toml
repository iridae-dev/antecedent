implementation_deviations = [
 "The shared local-score cache retains the compensated mean-centered columns and reuses them for the Gram and corrected residual calculation. Centering reuse leaves the score formula unchanged.",
 "Scores a stationary contemporaneous-plus-lag template with continuous Gaussian BIC on the aligned windows. The cited paper studies discrete BIC and BDe with a separate initial network. The implementation scores only the pooled transition windows.",
 "Default exact enumeration is governed by a template-count declaration and a byte quote. The template count is the number of contemporaneous DAGs times two to the number of lag-edge bits. Larger default searches and explicitly forced sampling use finite template MCMC.",
 "An explicit exact-template declaration is checked before enumeration and returns a resource receipt if its count or bytes do not fit. The exact listing is limited by the enumerator’s byte-sized node set. A separate bit odometer exercises the wide lag representation and a declared 64-bit lag space exceeds the executable listing quote.",
]

upstream_implementations_observed = []

