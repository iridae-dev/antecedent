implementation_deviations = [
 "Supports only single-treatment, single-outcome AverageEffect queries with hard Set contrasts on static DAGs; emitted SumOut functionals require enumerable mediator and treatment domains.",
 "Mediator search defaults to sets of size at most 4 and 64 results, and does not enumerate mixed intermediate sets when more than 12 intermediates exist; NotIdentified can therefore mean bounded-search failure.",
 "Candidate mediators are any nodes other than the treatment and outcome, not only descendants of the treatment. When no directed path leads from the treatment to the outcome, any set satisfying the three conditions (including isolated nodes) is reported; the front-door functional is then valid and equals the marginal of the outcome, which is the true interventional law.",
]

papers = [
 { title = "Causality", citation_note = "Previously recorded title and bibliographic detail: Causality: Models, Reasoning, and Inference", doi = "10.1017/CBO9780511803161", sections = ["3.3.2"] },
]

upstream_implementations_observed = [
 { project = "dowhy", exposure = "black-box comparison only" },
]

test_sources = [
 "independently generated synthetic SCMs with unmeasured T-Y confounders",
 "exhaustive definition check: every labelled four-node DAG (543), every ordered treatment/outcome pair and every non-empty subset of the other nodes against Pearl's three front-door conditions restated with a moral-graph d-separation, plus a strided five-node sample, each accepted set also checked numerically against an exact binary SCM (crates/antecedent-identify/src/adjustment_enumeration_tests.rs)",
]

[method_review]
status = "reviewed_with_limits"
scope = "FrontDoorIdentifier::identify and is_frontdoor_set in crates/antecedent-identify/src/frontdoor.rs for a single-treatment, single-outcome AverageEffect query on a known DAG whose nodes are all treated as measured: the three-condition mediator-set test (directed paths intercepted; no back-door path from the treatment to the mediators; the treatment blocks every back-door path from the mediators to the outcome), the candidate families searched, and the validity of the emitted adjustment formula for each returned set. Not a review of estimators of the functional, of unmeasured-node handling beyond the all-measured convention, of conditional front-door criteria or of the search bounds beyond the configuration exercised below."
assumptions = ["Known DAG whose directed edges are complete; a variable that is an unmeasured confounder in the analyst's model must still be a node, and the identifier treats every node as measured, so it cannot tell that a candidate mediator is unmeasured.", "Front-door conditions as stated by Pearl (Causality, Definition 3.3.3): M intercepts every directed path from T to Y; there is no unblocked back-door path from T to M; every back-door path from M to Y is blocked by T.", "The formula sum over m of P(m|t) times the sum over t' of P(y|m,t')P(t') requires positive probability of every (t,m) and (m,t') cell the formula evaluates; positivity is not implied by the graph."]
historical_exposure = "Historical author exposure cannot be independently established. This review read the product source and wrote a separate reference of its own from the definition; no upstream implementation or test source was consulted or copied. dowhy (black-box comparison only)"
redistribution = "The references are repository-authored under MIT OR Apache-2.0 and run inside the crates' own tests; the primary sources are linked by DOI where one exists and are not redistributed."
limitations = "The primary sources were not re-read in this review (no downloads were made and no copy was read from this environment); the definitions used by the reference are the standard textbook statements, so a mistake in how a record or this reference states a theorem would not be detected here. The exhaustive comparison covers all four-node DAGs and a stride of one in 23 five-node DAGs; larger graphs use the same code path with the bounded search described in the deviations (mediator-set size at most 4, 64 results, no mixed intermediate sets above 12 intermediates), so NotIdentified on a larger graph can be a search bound, which the result flags. Numerical verification uses binary variables and two (four-node) or one (five-node) seeded parameterizations; it checks that the formula recovers the interventional law when the criterion holds, not that it fails when the criterion fails. No claim about estimator behavior, finite-sample inference or calibration. Calibration remains deferred."
sources = ["https://doi.org/10.1017/CBO9780511803161"]
findings_resolved = ["Verified from the code that condition (iii) is tested per mediator in the graph with the outgoing arrows of the whole set removed, conditioning on the treatment; d-separation of a set from the outcome is equivalent to d-separation of each member, so the per-member test equals the set-level condition.", "Added an exhaustive executing comparison: for every one of the 543 labelled four-node DAGs and every ordered treatment/outcome pair, the family of mediator sets returned (with the search ceiling raised to the node count) equals exactly the family of non-empty subsets accepted by an independent definition-based reference, and the status is identified exactly when that family is non-empty; a stride of the five-node DAGs reaches multi-member sets. Both verdicts occur many times, so agreement is not vacuous.", "Added a semantic check: for every accepted set, the front-door formula evaluated on the observational joint of a seeded binary SCM Markov to the DAG reproduces the exact truncated-factorisation P(y|do(t)) for both treatment levels to 1e-10.", "Recorded that candidates need not be descendants of the treatment (isolated nodes are accepted when no directed path leads to the outcome); the formula is correct in that case. No logic defect requiring a change to the identifier was found. Code edits: a new unit-test module only (crates/antecedent-identify/src/adjustment_enumeration_tests.rs, included from backdoor.rs); no change to identification code."]
