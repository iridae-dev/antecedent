implementation_deviations = [
  "This defines a modular Gaussian pseudo-posterior conditional on an armwise fitted logistic observation model, rather than a joint Bayesian missing-data model. It makes no repeated-sampling coverage claim.",
  "The mean of the score-adjusted R Y / pi pseudo-outcomes need not be a Hajek ratio for a general logistic model. A proper Normal-Inverse-Gamma prior shrinks each arm pseudo-mean.",
  "Only two-arm Bernoulli and complete randomization, the superpopulation estimand, constant known assignment probabilities and pointwise 95 percent posterior quantiles are supported. Multi-arm and factorial IPW refuse; their marginal quantile grids do not establish a joint posterior draw law.",
]
test_sources = ["crates/antecedent/tests/bayesian_randomized_routes.rs"]

[method_review]
status = "reviewed_with_limits"
scope = "The composition of responder_pseudo_outcomes with posterior_arm_contrasts_with_draws for two-arm Gaussian superpopulation IPW, its exact graphless support, retained source and prior binding, and estimator-aware detached numerical replay. The pseudo-outcome helper computes R Y / pi minus the fitted-logistic score correction h' I^-1 s, with all assigned units retained. The underlying conjugate and observation-fit numerics have the separate reviews estimate.randomized.bayesian and estimate.randomized_missing_outcomes; this review checks the composition rather than expanding their scope."
assumptions = [
  "Observation is missing at random given assignment and the declared complete baseline covariates. The armwise linear-logistic observation model with an intercept is correctly specified; positivity and an estimable fit are required.",
  "The Gaussian working likelihood is on data-dependent score-adjusted pseudo-outcomes with a declared proper Normal-Inverse-Gamma prior. Observation-model coefficients are fitted and conditioned upon, not assigned a posterior.",
  "The published interval is a pointwise 95 percent quantile interval of the discretized contrast law; its frequentist calibration is unmeasured.",
]
historical_exposure = "This review read the repository implementations and wrote definition-level assertions without consulting or copying any upstream implementation, test or publication. It does not claim a page-level review of a primary paper. Historical exposure of earlier authors is not independently established."
redistribution = "Repository-authored code and tests under MIT OR Apache-2.0. No external source, reference software or paper is redistributed."
limitations = "The independent new known-target check has 128 units, a saturated binary-baseline response model, nonuniform response by arm and stratum, structural effect 2 versus naive responder contrast 4.5, two prior strengths, and both supported designs. Its independently derived pseudo-outcomes and NIG moments agree with the numerical contrast law within 0.005 for the mean and 0.006 for the standard deviation. A separate 24-unit fixture checks intercept-only and binary-baseline moments. These are deterministic definition checks, not a calibration campaign, a reference for unsaturated logistic models, or evidence for joint multicontrast draws. Detached replay reuses the product numerical routines and establishes internal consistency of retained inputs, not external authenticity of observations."
sources = ["provenance/estimate.randomized.bayesian.toml", "provenance/estimate.randomized_missing_outcomes.toml", "crates/antecedent-estimate/src/randomized_missing.rs", "crates/antecedent-estimate/src/randomized_posterior.rs"]
findings_resolved = [
  "Replaced the blanket unsupported execution of the supported IPW construction with a narrow graphless support and retained numerical replay; unsupported IPW designs now refuse.",
  "Corrected the claim that every proper-prior posterior mean equals a Hajek responder mean, and identified the conditional working law explicitly.",
  "Tests reject changed posterior means, source outcomes and priors after valid container re-encoding, respect consumer capability restrictions and bounded replay, and exercise retained execution after the builder has been dropped.",
]
