implementation_deviations = [
  "This defines a modular Gaussian pseudo-posterior conditional on an armwise fitted logistic observation model, rather than a joint Bayesian missing-data model. It makes no repeated-sampling coverage claim.",
  "The mean of the score-adjusted R Y / pi pseudo-outcomes need not be a Hajek ratio for a general logistic model. A proper Normal-Inverse-Gamma prior shrinks each arm pseudo-mean.",
  "Only two-arm Bernoulli and complete randomization, the superpopulation estimand, constant known assignment probabilities and pointwise 95 percent posterior quantiles are supported. Multi-arm and factorial IPW refuse; their marginal quantile grids do not establish a joint posterior draw law.",
]
test_sources = ["crates/antecedent/tests/bayesian_randomized_routes.rs"]

[method_review]
status = "reviewed_with_limits"
scope = "The composition of responder_pseudo_outcomes with posterior_arm_contrasts_with_draws for two-arm Gaussian superpopulation IPW, its exact graphless support, retained source and prior binding, and estimator-aware detached numerical replay. The pseudo-outcome helper computes R Y / pi minus the fitted-logistic score correction h' I^-1 s, with all assigned units retained. The underlying conjugate and observation-fit numerics have the separate reviews estimate.randomized.bayesian and estimate.randomized_missing_outcomes; this review checks the composition rather than expanding their scope. The posterior-index test module remains outside the production functions. The later survival and longitudinal branches in detached result verification dispatch by their own typed query and retain the IID and observation-fit checks for the two-arm IPW estimator reviewed here."
assumptions = [
  "Observation is missing at random given assignment and the declared complete baseline covariates. The armwise linear-logistic observation model with an intercept is correctly specified; positivity and an estimable fit are required.",
  "The Gaussian working likelihood is on data-dependent score-adjusted pseudo-outcomes with a declared proper Normal-Inverse-Gamma prior. Observation-model coefficients are fitted and conditioned upon, not assigned a posterior.",
  "The published interval is a pointwise 95 percent quantile interval of the discretized contrast law; its frequentist calibration is not measured.",
]
historical_exposure = "This review read the repository implementations and wrote definition-level assertions without consulting or copying any upstream implementation, test or publication. It does not claim a page-level review of a primary paper. Historical exposure of earlier authors is not independently established."
redistribution = "Repository-authored code and tests under MIT OR Apache-2.0. No external source, reference software or paper is redistributed."
limitations = "The independent new known-target check has 128 units, a saturated binary-baseline response model, nonuniform response by arm and stratum, structural effect 2 versus naive responder contrast 4.5, two prior strengths, and both supported designs. Its independently derived pseudo-outcomes and NIG moments agree with the numerical contrast law within 0.005 for the mean and 0.006 for the standard deviation. A separate 24-unit fixture checks intercept-only and binary-baseline moments. These are deterministic definition checks, not a calibration campaign, a reference for unsaturated logistic models, or evidence for joint multicontrast draws. Detached replay reuses the product numerical routines and establishes internal consistency of retained inputs, not external authenticity of observations. Scoped 2026-11-07 source re-review compared the bound verifier module with 08a69d364: the only changes share the previously identical posterior and graph-posterior classifications and move response-grid replay into a helper; randomized inverse-probability checks are untouched and dependency order is preserved. Ninety-seven contract unit tests passed; no new independent reference was generated. Later re-review of the verifier: calibration_basis_matches_contract now also accepts a serial_hac dependence for a tabular snapshot when the contract's query is a trial-to-target transport; randomized inverse-probability checks are untouched and still require an iid tabular basis. The calibration replay additions select synthetic-control and sequential-contrast query types. The randomized IPW calculation and its contract still use the reviewed path."
sources = ["provenance/estimate.randomized.bayesian.toml", "provenance/estimate.randomized_missing_outcomes.toml", "crates/antecedent-estimate/src/randomized_missing.rs", "crates/antecedent-estimate/src/randomized_posterior.rs"]
findings_resolved = [
  "The shared reader now checks retained horizon-risk evidence and explicit scalar-versus-band design for delayed-entry incidence. The randomized missing-outcome fit binding, posterior arithmetic and acceptance branches are unchanged.",
  "The scoped verifier review compared the new checked-estimator helper with the previous committed/requested identity checks. The randomized IPOW acceptance and numerical replay branches are unchanged. Survival and longitudinal replay now use the same resolved estimator check even when a caller selected the automatic estimator.",
  "Replaced the blanket unsupported execution of the supported IPW construction with a narrow graphless support and retained numerical replay; unsupported IPW designs now refuse.",
  "Corrected the claim that every proper-prior posterior mean equals a Hajek responder mean, and identified the conditional working law explicitly.",
  "Tests reject changed posterior means, source outcomes and priors after valid container re-encoding, respect consumer capability restrictions and bounded replay, and exercise retained execution after the builder has been dropped.",
  "Re-reviewed the bound contract verifier after indexing graph-posterior mixture atoms by key: the index retains the first published atom for duplicate keys, leaves the original weight and refusal checks in order, and does not change the graphless randomized IPW checks. A duplicate-key regression and contract verifier tests pass.",
  "Re-reviewed bayesian_arms.rs and the route test after the finite-population estimand was published under additive unit effects and after support rows were added. Read the diff against this review: the finite-population wording and its weighted refusal text changed but the weighted route still refuses that estimand and the superpopulation IPW pseudo-outcome construction, prior binding and posterior call are unchanged; the new complete-design arm support row is stated only when no outcome is missing (observed is none), so it is not reached by the IPW composition reviewed here; the new complier row is a separate route outside this review's scope. The test change recomputes the unweighted finite-population expectation (Beta(4, 2) minus Beta(3, 5), mean 4/6 - 3/8, variance 8/252 + 15/576), which I rechecked by hand; the IPW assertions are unchanged. I did not run the tests.",
  "Re-reviewed the bound acceptance, admission and verifier changes. accept_claim_expecting accepts the IPW claim only as the claim the consumer retained: after the IPW replay promotes the claim, its replayed claim id is bound to the retained identity, a match is accepted as a bound claim with a lossless receipt, and any other retained identity is restricted to storage with claim_identity_mismatch; the unbound accept_claim is deprecated and unchanged in behaviour. The admission and wire-support checks now also refuse an estimated CUPED adjustment alongside the fixed one. The contract verifier now refuses identification, inference-binding and observation payloads whose set-valued lists are not in canonical form under that facet's identity reason. The pseudo-outcome construction, prior binding, posterior call and numerical replay are unchanged; the route test now accepts through the retained claim and checks that another retained claim is restricted. I did not run the tests.",
  "Re-reviewed the bound contract verifier after the off-axis calibration basis check was widened: an off-axis basis may now name the query family the contract's own target is (Discover, Attribute, Simulate, TemporalDesign, IvBounds, Association), the name the producer writes for a query with no support axis, instead of only Unknown or Discover. The graphless randomized IPW branch, its coordinate, inference, interval and snapshot checks are unchanged, and an off-axis basis still cannot name another query than the contract targets.",
  "Re-read detached verification after admitting one sealed historical unmeasured slot for scalar delayed-entry incidence. That exception requires the prior incidence functional and checked resampling and scope facts from the survival body, bypasses coverage lookup only for its exact unmeasured envelope, and leaves shared identity and snapshot verification in place. Its typed survival branch cannot select an IPW randomized-effect payload. I did not run the Rust tests.",
  "Re-read detached verification after matching each survival band against the measured design's declared endpoint, arm sizes, counts and analysis grid. Historical unmeasured survival slots bypass record resolution after the survival-specific checks and retain their source and output replay obligations. This extends the survival branch; the randomized IPW query cannot enter it. I did not run the Rust tests."
]
