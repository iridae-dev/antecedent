implementation_deviations = [
  "The implementing module is crates/antecedent-estimate/src/factorial_bernoulli.rs. Each cell mean is (1/n) sum over the rows realized in the cell of y/q, where q is the known probability of that cell for the row (qa * qb for two independent Bernoulli factors); the factor-A and factor-B main effects and the interaction are the fixed contrasts (-1/2,-1/2,1/2,1/2), (-1/2,1/2,-1/2,1/2) and (1,-1,-1,1) of the cell means.",
  "The variance of each contrast is bounded, not estimated: the diagonal Horvitz-Thompson variance estimate of each cell mean, (1/n^2) sum 1{cell} (1-q) (y/q)^2, is combined by Young's inequality Var(sum w_j X_j) <= 4 sum w_j^2 Var(X_j), which needs no covariance between cell means. The bound is conservative in assignment expectation; it is not an unbiased variance.",
  "A cell with no observed row is refused rather than estimated as zero, so the estimator is the unconditional Horvitz-Thompson contrast only over the full assignment law; given that every cell is observed it is not exactly unbiased.",
  "The compiled RandomizedEffect route reads a four-cell multi-arm design (selected by the randomized.factorial_bernoulli_ht estimator) and publishes three pointwise 95% normal intervals effect -/+ z sqrt(bound) once every cell holds 30 rows; their coverage is not measured.",
]

