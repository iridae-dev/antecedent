limitations = "Two-arm Bernoulli and completely randomized designs without CUPED, ANCOVA or receipt adjustment; logistic observation model on complete covariates; outcomes missing at random given arm and the declared covariates. No interval is published; the candidate normal intervals have #[ignore] calibration designs and no coverage record."
