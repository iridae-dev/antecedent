 { title = "Review of inverse probability weighting for dealing with missing data", doi = "10.1177/0962280210395740", sections = ["inverse probability weighting under missingness at random; estimated versus known weights"] },
 { title = "Difference-in-differences with multiple time periods", doi = "10.1016/j.jeconom.2020.12.001", sections = ["group-time average treatment effects on unbalanced panels"] },
