  "crates/antecedent-estimate/tests/temporal_design_excursion_bayesian_bootstrap_reference.rs (exact Dirichlet-weight distribution of the cluster ratio by quadrature: mean, standard deviation and quantile shares for two and three clusters, a decreasing ratio, a sign change, an 8 to 1 count imbalance and a heavy cluster)",
  "crates/antecedent-estimate/tests/temporal_design_excursion_reference.rs (exact-rational Horvitz-Thompson scores and cluster-robust ratio; shared with the frequentist record)",
