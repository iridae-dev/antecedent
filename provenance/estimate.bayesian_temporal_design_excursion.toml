implementation_deviations = [
  "Each draw takes Dirichlet weights over independent units (or interference clusters) and re-evaluates the same functional the frequentist row estimates: the Horvitz-Thompson ratio, the weighted quantile, or the weighted local quadratic. The recorded assignment law is held fixed, so the prior supplies no identifying premise.",
  "The local-quadratic posterior is the posterior of the bandwidth projection; its worst-case smoothing bias is reported beside it and never folded into the credible interval. The posterior is uncalibrated and the route is not licensed.",
]

