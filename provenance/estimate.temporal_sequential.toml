implementation_deviations = ["HMC composition is refused pending derived-contrast chain diagnostics; conjugate and Laplace mechanism composition are available.", "Independent implementation of the parametric g-formula on an identified finite unfolded DAG. Fit each non-intervened ancestor mechanism and propagate active-minus-control expectations in topological order, overwriting every treatment time.", "Linear additive mechanisms permit intercepts and innovation means to cancel in the contrast. AllObserved complete aligned rows; Multiplicative [factor] replaces f with factor*f. Truncated_shift [delta, lower, upper] defines f_policy=f+clamp(mu+delta,lower,upper)-mu, where mu=E[f] under preceding interventions. This population-mean-targeting shift preserves parent effects and innovations; realized outcomes need not satisfy the bounds. It is not stochastic clipping; discovery-estimation split is unsupported. DBN-posterior multi-step effects fit this engine per identified atom and retain unidentified mass.", "Frequentist uncertainty uses a shared circular moving-block bootstrap of aligned rows. Bayesian uncertainty composes independent per-mechanism posteriors (Gaussian likelihood; under the conjugate backend with an unknown residual variance each mechanism's coefficient marginal is Student-t), with the same coefficient draw reused across time copies. Each mechanism fits its unique complete observed rows once, conditioning on regressors. Independent product-of-sum moments pin the covariance from repeated mechanisms. None/cheap/full validation shares this sequential engine for placebo, nuisance-covariate, subset, block-bootstrap and unobserved-confounder perturbations. Bayesian PPC retains distinct child mechanisms; prior sensitivity refits the composed effect. Single-regression sensitivity formulas do not describe the composed effect. No generic longitudinal efficiency or interval-calibration guarantee is inherited.", "A Bayesian Sequence level is tempered like a Sustained contrast: each stationary mechanism carries the long-run tempering along the gradient of the propagated level, and the sample means of the exogenous root nodes the level reads enter as a first-order normal shift whose variance is the long-run variance of their gradient-weighted scores. The Frequentist Level influence carries the same root-mean term, so its block length and kernel-bias factor read the root means."]
test_sources = ["crates/antecedent/tests/dbn_sustained_validation.rs", "conformance/bayesian/response_surfaces", "python/tests/test_posterior_moments.py", "crates/antecedent/tests/temporal_soft_mean_mechanisms.rs", "crates/antecedent-estimate/tests/temporal_sequential_reference.rs (exact rational per-node OLS and g-formula enumeration on a three-period unfolded SCM: Sustained contrasts, hard, shift, multiplicative and bounded Sequence levels, effect modifiers, missing time points and sampling weights; bootstrap replicates regenerated from the library stream and refit exactly; Politis-White block length, fixed-b and kernel-bias factors, influence; composed Bayesian moments)"]

[method_review]
status = "reviewed_with_limits"
scope = "estimate_sustained_window, estimate_sustained_window_with_gaps, SequentialContrastDesign and estimate_sequence_mechanisms in crates/antecedent-estimate/src/temporal_sequential.rs on an identified unfolded design: the needed-node closure, one least-squares fit per non-intervened ancestor on the lag-aligned (or intact) windows, the propagated active-minus-control difference and the propagated interventional level under hard, additive-shift, multiplicative and bounded overlays (factual means of root nodes included), effect-modifier interaction columns, the exact-OLS refit of every mechanism on a row map, the contrast influence and the root-mean score, the circular-block bootstrap standard error (block length, fixed-b and kernel-bias scaling, replicate failure accounting), sampling-weighted windows and the composed Bayesian posterior of independent conjugate mechanisms (shared coefficient draw across time copies, row tempering by 1/kappa, root-mean shift of a level). Not the estimation of kappa itself (REML autoregression, observed-information spread, score HAC bound), the HMC and non-Gaussian refusals beyond a refusal check, temporal_sequential_tuples, the facade validation refits (placebo, nuisance covariate, subset, block-bootstrap and unobserved-confounder perturbations, posterior predictive and prior-sensitivity checks) or the mixture over DBN atoms."
assumptions = ["The identified unfolded design (identify_temporal / identify_temporal_schedule) supplies a valid DAG on which every node is a linear additive function of its parents plus independent innovation; the g-formula level is the propagated mean of that linear system.", "Stationary mechanisms: the mechanism of a variable is the same regression at every time copy, estimated per unfolded node in the Frequentist route and once on the pooled observed rows in the Bayesian route.", "A bounded shift targets the population mean, f_policy = f + clamp(mu + delta, lower, upper) - mu, so its expected value is clamp(mu + delta); a multiplier scales the propagated mean."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the product source named in its scope, including the numerical helpers it calls, and compared results with definitions evaluated by an executing reference written for this review; no upstream implementation or test source was consulted or copied. The cited publication was not retrieved in this review: the correspondence is between the product code and the standard definition it states (the parametric g-formula as a standardisation over a fitted outcome and covariate models), verified numerically on a finite linear SCM, not a page-level reading of the book."
redistribution = "Primary work is cited, not redistributed. The reference script, its frozen output and the frozen inputs file (replicate row maps and tempering factors read from the product) are repository-authored (MIT OR Apache-2.0); the script uses mpmath (BSD-3-Clause), imported at run time and not redistributed here. It declares its inline script metadata but is not run in a locked, isolated environment and is not wired into any gate; its output is frozen in the JSON file and compared by the test."
limitations = "One graph (confounder Z, treatment A, mediator M, outcome Y; a window A(-2), A(-1), A(0) against Y(0)) on three series (24 points, 64 points with AR(1) 0.85 confounder and outcome noise, 10 points), values on a 1/64 grid so every input is exact. Time-varying confounding affected by earlier treatment is not reachable: the temporal identifier refuses it as a lagged cycle (NotCertified), so the reference carries the treatment history through a mediator, and the signature use of the parametric g-formula (treatment-confounder feedback) is not exercised by this route. The engine is deterministic propagation of fitted means, not Monte Carlo trajectory simulation; the random parts are the bootstrap and the posterior draws. Bootstrap: replicate row maps are regenerated from the library RNG stream and equal the frozen copy, and every replicate is an exact rational refit; the published SE equals the replicate sd times the fixed-b polynomial times the kernel-bias factor to 1e-9. The Politis-White block length, the fixed-b cubic and its coefficients, the Kendall/BIC autoregression kernel-bias factor and the root-mean standard error are reproductions of the rules the implementation states, written from reading its code (not from a retrieved primary source), so they check arithmetic and wiring, not that the rules give calibrated intervals; no coverage is measured. Block length 4 is the rule on the 24-point series; only the persistent series (block 14) exercises the Politis-White branch, and the 10-point series (7 rows, singular resamples) exercises the replicate failure cap. Bayesian composition: kappa of each mechanism is read from the product's own six-decimal note (frozen and matched to the live note to 1e-5) and is not referenced, so the tempering estimator is unreviewed; given kappa the posterior moments of the composed contrast and level are exact Student-t mixture moments compared with 200000 library draws within 5 sd/sqrt(N) on the mean and 10/sqrt(N) relative on the sd, not bit-exactly (the sampler stream is not regenerated). The Bayesian root-mean shift uses the reference port of the standard-error rule on the exact root-mean scores. Bayesian effect modifiers, a Bayesian level on a gapped series, Frequentist level with gaps (no public entry), weighted bootstrap intervals and HMC are not referenced. The modifier main-effect column is skipped when the modifier is a parent of the node at any lag, not only at the node's own lag; this was read but not exercised. The perturbation and validation arithmetic of the facade (placebo, nuisance covariates, subsets, unobserved-confounder, predictive checks, prior sensitivity) is not referenced here; the refuter arithmetic belongs to the validate records and the facade orchestration has only facade tests. The unfolded parents are hand-derived and compared with the product unfolding; identification is a separate record. Tolerances: point values 1e-10 relative, replicates 1e-9, influence 1e-7 of its largest value. The cited publication was not retrieved."
sources = ["https://www.hsph.harvard.edu/miguel-hernan/causal-inference-book/", "https://mpmath.org/"]
findings_resolved = ["No defect found: the Sustained contrast (two active levels, two windows) and the Sequence level under hard, partial, joint mediator, additive-shift, multiplicative, two-soft and bounded overlays (upper, lower and slack clamp) equal the exact rational per-node OLS g-formula to 1e-10, root-node factual means included.", "Effect modifiers, a series with three missing cells (windows dropped whole, shifted none) and per-time sampling weights (a zero-weight window kept in sequence) equal the exact rational weighted or interaction fits; a level on weighted data and a Bayesian posterior on weighted data are refused.", "The block bootstrap standard error equals the replicate sd of exact refits on the regenerated row maps times the fixed-b factor and kernel-bias factor; the dependence-aware block length (4, 4, 4 and 14) equals the Politis-White rule recomputed from the exact influence and normal-equation scores; the influence equals the exact score; a resample with a singular design is a counted soft failure and more than half failing withholds the SE; the gapped bootstrap resamples the original window axis with no kernel-bias widening.", "The composed Bayesian contrast and level (with shared coefficient draws across time copies and the root-mean shift) and the gapped contrast match the exact moments of independent tempered Normal-Inverse-Gamma mechanisms; a bounded overlay records the mean-targeting restriction and an unbounded one does not.", "Record text corrected: Bayesian uncertainty is a composition of per-mechanism posteriors with a Gaussian likelihood (Student-t marginals under the conjugate backend), not independent Gaussian posteriors."]
