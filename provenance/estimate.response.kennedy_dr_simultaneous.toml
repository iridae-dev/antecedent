# The causal pseudo-outcome and kernel curve follow Kennedy et al. The
# independently written fixed-grid band forms, for each multiplier draw, the
# maximum over requested grid points of the absolute standardized sum of stored
# observation-level local-polynomial influence values. Its empirical quantile
# multiplies the robust standard errors. Rademacher signs are generated by a
# fixed SplitMix64 stream. The contract is conditional on the cross-fitted
# pseudo-outcome and a caller-supplied bandwidth; it does not reproduce the
# paper's bandwidth rule, refit nuisances, or claim the paper's coverage theorem.
papers = [
  { title = "Nonparametric methods for doubly robust estimation of continuous treatment effects", doi = "10.1111/rssb.12212", sections = ["Section 3.1: doubly robust pseudo-outcome mapping", "Section 3.2: kernel estimator and asymptotic inference"] },
  { title = "Simultaneous bootstrap confidence bands in nonparametric regression", doi = "10.1080/10485259808832748", sections = ["Section 2: local-polynomial wild-bootstrap band construction", "Section 3: coverage conditions; cited as motivation, not claimed for Antecedent's conditional fixed-grid multiplier implementation"] },
]

