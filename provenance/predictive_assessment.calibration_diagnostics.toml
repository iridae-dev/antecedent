implementation_deviations = [
  "The PIT histogram of a discrete or ensemble law is the non-randomized form (mass spread uniformly over [F(y-), F(y)]); the KS distance is computed on the mid-PIT, which is discrete for ensembles and has a floor of order 1/m, so it is descriptive.",
  "No test, p-value or significance level is attached to any diagnostic: independence of the cases is not assumed, and no coordinate has measured calibration.",
  "Central prediction intervals of a sample use the exchangeable-rank (type 6) quantile; intervals of a finite law use the quantile function with a 1e-12 tolerance on the cumulative probability.",
]
