 "Fits numeric modifier main effects and separate treatment-by-modifier interactions, plus adjustment-variable main effects. Joint modifiers are enabled by default; the legacy one-modifier setting refuses several modifiers. Nonlinear heterogeneity and modifier-by-modifier interactions are not fitted by this route.",
 "Reports the treatment contrast averaged at the retained sample means of the modifiers, for AllObserved; this is not a conditional-effect curve at user-specified modifier coordinates. Joint-modifier uncertainty carries an explicit uncalibrated assumption rather than borrowing one-modifier coverage.",
 "The analytic variance adds the sampling variance of the modifier-mean contrast to the homoskedastic OLS coefficient delta-method variance. The independent statsmodels fixture checks the coefficient part after removing that explicit modifier-mean term; it does not validate repeated-sampling coverage. Robust and clustered covariance are not established by this reference.",
]

