 "crates/antecedent-learn/tests/bayesian_basis.rs (basis_gcomp_matches_independent_quadratic_ate_and_cate_reference, basis_gcomp_refuses_unlicensed_population_and_non_binary_or_degenerate_treatment, posterior_prediction_preserves_joint_draw_row_and_fold_identity, basis_all_observed_credible_interval_has_scoped_repeated_sampling_coverage)",
 "crates/antecedent/tests/staged_bayesian_basis_gcomp.rs (staged ATE and CATE share draws, artifact round trip, retained-plan execution and refresh)",
 "crates/antecedent/src/analysis/execute/bayesian_basis_path.rs (staged scope refusals)",
 "conformance/bayesian/shared_functional_ate (known-truth ATE fixture shared with the Bayesian g-computation family)",
 "python/tests/test_bayesian_estimator_lifecycle.py",
