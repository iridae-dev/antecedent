# Strategy-table implementation id: estimate.bayesian_local_ratio
# (EstimatorId::BayesianLocalRatio, public name bayesian.local_ratio; plan ids
# bayesian.fuzzy_rd and bayesian.regression_kink).
#
# The cited papers supply the estimands: the fuzzy regression-discontinuity
# effect as the outcome jump over the treatment jump at the cutoff, and the
# regression-kink effect as the outcome slope change over the treatment slope
# change. The Bayesian layer is the repository's own construction, not a
# procedure from either paper: the fixed-bandwidth local-linear Gaussian model
# of estimate.bayesian_rd is fitted to the outcome and to the received
# treatment on the same design, independent zero-centered Normal coefficient
# priors and a plug-in 2x2 residual covariance, and the numerator and
# denominator coefficients are drawn jointly so the ratio draws carry the
# outcome-treatment residual correlation. Continuity at the cutoff, exclusion
# of the cutoff from the outcome except through treatment and, for the jump,
# monotone compliance stay declared; the prior supplies none of them.
papers = [
 { title = "Identification and Estimation of Treatment Effects with a Regression-Discontinuity Design", doi = "10.1111/1468-0262.00183", sections = ["fuzzy design: ratio of the outcome and treatment discontinuities"] },
 { title = "Inference on Causal Effects in a Generalized Regression Kink Design", doi = "10.3982/ECTA11224", sections = ["kink estimand as the ratio of outcome and treatment slope changes"] },
]

implementation_deviations = [
 "Unweighted rectangular window with a caller-declared symmetric bandwidth and local-linear fits on both sides; no kernel weighting, data-driven bandwidth, local quadratic or cubic fit, or robust bias correction of the frequentist local-polynomial row.",
 "A ratio of two Normal posteriors has no finite mean: the reported point is the posterior median and the posterior mean of the ratio is never reported.",
 "When the denominator posterior has mass within a declared floor of zero above the interval's tail mass, the credible interval is withheld and the mass is reported with a weak-first-stage diagnostic; the ratio is not divided through.",
 "Residual covariance is a plug-in 2x2 estimate and is not given a prior or integrated out; the correlation is clamped away from one so the joint draw stays positive definite.",
 "Manipulation, density, continuity-placebo and covariate-adjusted checks are not provided.",
 "The route is explicitly unlicensed and uncalibrated: no coverage record covers the credible interval.",
]

