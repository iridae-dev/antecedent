implementation_deviations = [
 "Searches only singleton, unconditional instruments for a single-treatment, single-outcome AverageEffect query; conditioned instruments and instrumental sets are not implemented.",
 "The emitted estimand is a Wald ratio with status IdentifiedUnderParametricRestrictions. The identifier records per-instrument exclusion and a non-zero first stage, plus iv.constant_linear_effect_or_monotonicity: a constant linear structural effect for an average effect, or monotonicity for a complier local effect under the corresponding IV premises. These are declared restrictions, not tests of instrument strength or effect homogeneity; monotonicity alone does not identify a general heterogeneous ATE.",
]

