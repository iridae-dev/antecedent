[method_review]
status = "reviewed_with_limits"
scope = "The Monte Carlo predictive checks, simulation-based calibration and prior-sensitivity grids of crates/antecedent-validate/src/bayesian_checks: PosteriorPredictiveCheck::{check, replicates, check_temporal} and PriorPredictiveCheck::check_with_prior for the Gaussian, logit, probit and Poisson families (replicate construction from the coefficient draws and the library noise streams, location and dispersion summaries, (1 + count) / (1 + draws) tails, two-sided p, residual-shape axes with the omnibus p, the lag-1 serial axis, the mean-only improper-scale rule); the summary helpers in calibration.rs; SimulationBasedCalibration::{check, to_report} with its generating-parameter draw, true-effect, rank, bin and chi-square statistics and thresholds; and PriorSensitivity::{evaluate, evaluate_resolved_prior, evaluate_external_alpha, evaluate_in_force, to_report} with their option handling. The conjugate normal fits that supply the posterior draws are exercised, not reviewed (estimate.bayesian_gcomp); the external-prior composition rule is exercised through its output (compose_external_priors_with_alphas), not reviewed; the MCMC diagnostics gate (mcmc.rs), the negative-binomial family, correlated coefficient priors, HMC rank selection, temporal tempering and mixtures of reports are not covered."
assumptions = ["The statistics are repository-defined (Monte Carlo tails with the (1 + count) / (1 + draws) form, an omnibus max-departure p-value, a ten-bin chi-square rank gate and a relative-range sensitivity verdict); the cited papers define posterior predictive assessment with realized discrepancies and prior checking but not these, so the review checks the code against the definitions stated in the reference script, not against those papers.", "The coefficient columns of a fitted posterior are its first design columns, as the product reads them; the estimator's draws are independent exact conjugate draws, which the rank and mean checks assume and test against the exact posterior.", "Floating-point replicate summaries equal to within 1e-12 of the largest summary are ties; the reference ties at 1e-40 in 60-digit arithmetic."]
historical_exposure = "Historical author exposure cannot be independently established. This review read predictive.rs, calibration.rs, sbc.rs and prior_sensitivity.rs and wrote its own reference from the stated definitions in 60-digit mpmath, plus closed-form conjugate laws (Student t and normal CDFs, the conjugate normal-inverse-gamma posterior); no upstream implementation was consulted."
redistribution = "The reference script, frozen output and Rust tests are repository-authored under MIT OR Apache-2.0; mpmath is not a product dependency. The cited papers are linked, not redistributed."
limitations = "None of the cited papers (Box 1980; Gelman, Meng and Stern 1996) was retrieved: nothing was downloaded and there is no local copy, so the review does not check the code against their text, and Talts et al. 2018, the source of the rank-uniformity statement, is not cited and was not retrieved either. Rank uniformity is verified by the exact Beta-integral identity for a ranks-from-uniform-posterior-CDF model at 99 draws, and the product's ranks by per-replicate binomial tails and a rank-sum Hoeffding bound against the exact conjugate posterior, not by a distributional uniformity test of the ranks. The comparison covers five posterior-predictive designs (a Gaussian fit with n_sims below the stored draw count so the stride is exercised, a six-row fit with n_sims above it so the cap is, a logit, a probit and a Poisson fit), five prior-predictive designs (known and inverse-gamma and improper residual variance, logit, Poisson), two simulation-based-calibration configurations of 60 replicates and 99 draws (inverse-gamma and known residual variance), and three sensitivity grids on one 30-row design, at 1e-10 relative on the continuous statistics and 1e-13 on the tails. Draw-dependent quantities are checked against exact laws with stated bounds: the prior-predictive mean tail at 20000 simulations within a Hoeffding bound of 0.023 (failure probability 1e-9), the residual-variance precision of 5000 conditional draws within a sub-gamma bound of about 2 percent (1e-9), the rank sum within a Hoeffding bound of about 9 percent (1e-9), and the sensitivity posterior means within a Cantelli plus sub-Gaussian bound of about five standard errors (1e-3 per point), so a shift below those widths is not detected; the posterior standard deviations are compared only within 35 percent. The posterior-predictive residual noise is exact only in the diffuse-prior limit (the residual-variance column is not retained), the improper-scale prior predictive uses the unscaled coefficient variance, and the Poisson normal-approximation branch above a mean of 1e4, the negative-binomial family, dense coefficient correlations, multiple chains and missing values are not exercised. The default thresholds (alpha, the 0.35 to 0.65 mean-rank band, the 0.5 relative range) are repository choices that are not calibrated here."
sources = ["https://doi.org/10.2307/2982063", "https://sites.stat.columbia.edu/gelman/research/published/A6n41.pdf", "https://mpmath.org/doc/1.3.0/"]
findings_resolved = ["Defect fixed: PriorPredictiveCheck drew a Gaussian outcome's coefficients from N(m, V0) although the estimator it checks fits the conjugate prior beta | sigma^2 ~ N(m, sigma^2 V0) (the documented convention of GaussianCoefficientPrior, and the one simulation-based calibration already used), so the prior predictive spread of the mean was too small by the factor sigma whenever V0 dominated; the lower tail of the replicate mean was 0.829 against the exact 0.728 (failing-first tests ppc_prior_sensitivity_prior_predictive_mean_follows_the_exact_law and ppc_prior_sensitivity_prior_predictive_equals_the_exact_reference); sigma is now drawn first and scales the coefficients.", "Defect fixed: the posterior-predictive Gaussian replicate drew sigma^2 = SSR / chi-square(n), which omits the p / 2 added to the inverse-gamma shape by the conjugate coefficient prior's sigma^-p factor, so the noise variance was inflated by (n + p - 2) / (n - 2) in the mean (the mean precision of 5000 draws was 2.917 against the exact conjugate 3.123, outside the bound 3.058 to 3.188; failing-first test ppc_prior_sensitivity_replicate_noise_variance_is_the_conjugate_conditional); the draw is now SSR / chi-square(n + p) in both check and replicates.", "Defect fixed: Monte Carlo tails compared replicate summaries with the observed value in floating point, so replicates tying the observed SD of a binary outcome (the SD depends only on the number of ones) lost the tie to last-bit rounding and fell out of one or both tails (a logit dispersion p of 0.732 against the tie-correct 0.829); ties within 1e-12 of the largest summary now count in both tails (failing-first test ppc_prior_sensitivity_posterior_predictive_equals_the_exact_reference).", "Every reported statistic of the posterior and prior predictive checks (location and dispersion tails, residual axes and omnibus p, serial axis, replicate sets), the generating draws, true effect, ranks, bin counts, chi-square statistic and verdict thresholds of simulation-based calibration, the exact posterior means of the isotropic, resolved-prior and external-alpha grids, their draw cap and option handling, and the relative-range report agree with the exact reference."]
