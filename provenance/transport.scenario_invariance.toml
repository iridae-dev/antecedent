# A report over the already verified classical catalog derivation, not a new
# identification algorithm. The selection-diagram vocabulary (selection nodes,
# S-admissibility, source factors against target factors) is the cited one; the
# extraction of the invariances from the derivation's own proof steps is original
# engineering. The sections are those already cited by provenance/identify.transport_sid.toml.
# papers = [] is an explicit judgment, read against crates/antecedent-identify/src/sid/scenario_invariance.rs
# and crates/antecedent-estimate/src/scenario_invariance_report.rs: the report partitions the distribution
# leaves of an already checked classical transport derivation by population, attributes each source leaf to the
# proof step that produced it and prints a canonical text; it contains no numerical routine. The selection-diagram
# vocabulary (selection nodes, S-admissibility) and the transport algorithm itself are cited by
# provenance/identify.transport_sid.toml. The publications were not retrieved in this review.
papers = []

implementation_deviations = [
  "Reviewed as a justified non-algorithm mapping by reading both modules; no independent source is owed and this is not an implementation review of the transport papers, which were not retrieved here. The extraction is tested only through the integration tests listed, with no separate executing reference of the attribution rule",
 "Derived from this construction, not the exact procedure of either paper: neither paper defines an invariance report. The report reads the distribution leaves under the root expression of the checked ClassicalTransportDerivation, partitions them by population, and attributes each source leaf to the reachable leaf-producing proof step (sid.line10, transport.direct or transport.pretreatment_standardize) whose output contains it. A source leaf that no step produced is refused as scenario_invariance.derivation_inconsistent.",
 "Nothing is re-decided: S-admissibility was established by the checker (run by two independent implementations) before the report is built, so a factor's mechanisms are reported as assumed shared between source and target, not re-proved. The only graph computation is descriptive (the selection targets inside a factor's bidirected district).",
 "The report states what an answer rests on and never that the assumptions hold. A scenario that is not identified reports its structural s-hedge or witness variables instead of an invariance list, and a scenario with missing evidence reports its undecided status and obligations.",
 "Scope is the classical catalog scenarios (static fully observed nodes with directed and bidirected edges and selection targets); a non-static node refuses as scenario_invariance.non_static_node, and no completeness claim beyond the existing route is made.",
 "The report is derived and has no artifact of its own; its inv.v1.<blake3> identity over a canonical text is a recomputation check, not a security seal.",
]

