implementation_deviations = [
 "Critical value c solves Φ(c + Δ̃ / max_g σ_g) − Φ(−c) = level with per-completion endpoints from shared resamples, not Imbens–Manski's original single-pair bound estimators.",
 "Δ̃ is the estimated set width, replaced by zero unless it exceeds κ · σ_Δ with κ = sqrt(ln n) (Andrews–Soares BIC-type). This is a repository-chosen threshold, not their GMS procedure.",
 "Frequentist SDs come from shared circular-block replicates with fixed-b scaling. The paper's i.i.d. sampling model is not assumed.",
 "The Bayesian product-posterior envelope uses independent completion draws and IM tail probabilities 1 − Φ(c). It is not a Frequentist IM interval and inherits no IM coverage theorem.",
 "When completion enumeration is capped, the interval covers retained completions only and is flagged truncated.",
]

