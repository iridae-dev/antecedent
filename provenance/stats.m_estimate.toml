implementation_deviations = [
 "Extends the cited location M-estimator to multivariable linear regression using an OLS warm start and iteratively reweighted least squares.",
 "Re-estimates scale on every iteration with 1.4826 times the residual MAD and defaults to c=1.345; that full regression algorithm is not established by the cited 1964 location-parameter paper alone.",
 "Returns coefficients and convergence diagnostics but no robust covariance or inferential result.",
 "The fixed point of the iteration (scale re-estimated each step from the current residuals) is the root of sum psi_c(r_i/s(beta)) x_i = 0 with a residual-dependent scale; this is a repository-defined scheme whose properties are not those of Huber's location M-estimator with a fixed or jointly estimated scale."
]

