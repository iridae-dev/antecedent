  "For schedule aa and treatment stage k the declared difference in the mean of that schedule's potential outcome between off-schedule and on-schedule subjects, given stage history and earlier adherence, is -(2a-1) times the stage departure. Final missing-minus-recorded conditional means use the analogous signed shift. These are additive mean restrictions, independent of marginal propensity-odds sensitivity models.",
  "With outcome support, the fitted box is admitted only if each corner implies feasible conditional means. Affinity then guarantees feasibility throughout the box. The original fit is checked, and the sampling law uses untruncated refits.",
  "A bootstrap replicate estimates treatment probabilities, the intermediate history distribution, response fractions and recorded-outcome means from the same resampled subjects. The supremum of the absolute affine error surface is attained at a corner. Project the common radius onto both extrema and compare the resulting interval to the prespecified threshold.",
  "The advertised simultaneous level is nominal. The independently simulated experiment scores both the joint extrema and the entire region in one design. Broader calibration is unmeasured.",
