[method_review]
status = "reviewed_with_limits"
scope = "Conditional total expectation for the 11 versus 00 schedule contrast, feasibility over a rectangular departure region, simultaneous bootstrap band, joint threshold comparison, and portable replay from retained source trajectories."
assumptions = [
  "The two histories and treatment decisions are binary and completely recorded. Only the final outcome may be missing. Subjects are independent, each required treatment and recorded-outcome cell has support, and consistency connects recorded outcomes to their realized schedule.",
  "The two additive treatment-selection departures are defined within observed history and earlier schedule adherence. The final additive pattern-mixture departure compares the missing and observed conditional means within the two realized schedule cells. A named release design adds a caller declaration about the sampling law.",
]
historical_exposure = "The review followed Blackwell equations 23–25 for the history-specific selection contrast and reviewed Zivich et al. Theorem 1 and equations 1–4 as a distinct observation model. The route and its reference fixtures use the repository’s own additive mean restrictions and an affine subject-bootstrap construction. Historical author exposure is unknown."
redistribution = "Repository-authored implementation and fixtures. Linked literature is not redistributed."
limitations = "The scientific target is the named two-decision mean contrast under a rectangular region of three common additive departures. The admissibility check constrains implied conditional means only within the bounded outcome model. The subject bootstrap requires every sampled fit to retain observed support. The repeated-study design separately scores the entire surface and both extrema, and includes refusals in the denominator. Its nominal simultaneous level does not establish coverage beyond a matching current receipt. The comparison addresses only the predeclared scalar threshold."
sources = ["https://www.mattblackwell.org/files/papers/sens.pdf", "https://pmc.ncbi.nlm.nih.gov/articles/PMC10524136/"]
findings_resolved = [
  "The conditional completion yields an affine contrast. An independent enumerated full-data reference checks all eight vertices, and setting either mechanism to zero recovers its corresponding single-mechanism minimum. Two distinct complete-data laws yield the same observed trajectory distribution but contrasts on opposite sides of the declared action threshold.",
  "A shared whole-subject bootstrap estimates every mechanism exactly once per resample. The maximum absolute error over the box is the maximum over its vertices, and one radius covers both extrema jointly.",
  "The standalone consumer, generic Python carrier and standard composition verifier replay from the same retained plan, seed and raw trajectories. Published sampling bounds and their current calibration reading are computed live.",
]
