redistribution = "Repository-authored implementation and fixtures. Linked literature is not redistributed."
limitations = "The scientific target is the named two-decision mean contrast under a rectangular region of three common additive departures. The admissibility check constrains implied conditional means only within the bounded outcome model. The subject bootstrap requires every sampled fit to retain observed support. Its nominal simultaneous level does not establish coverage beyond a matching current repeated-experiment receipt. The comparison addresses only the predeclared scalar threshold."
sources = ["https://www.mattblackwell.org/files/papers/sens.pdf", "https://pmc.ncbi.nlm.nih.gov/articles/PMC10524136/"]
findings_resolved = [
  "The conditional completion yields an affine contrast, so an independent enumerated full-data reference checks the extreme corners and two off-axis departures. Two distinct complete-data laws yield the same observed trajectory distribution but contrasts on opposite sides of the declared action threshold.",
