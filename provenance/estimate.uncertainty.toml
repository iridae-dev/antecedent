# papers = [] is an explicit judgment. The record owns the endpoint selector (which published
# scalar standard error, if any, an effect estimate carries and how its interval is labelled) and the
# interval estimate +- critical_value * SE. It adds no estimator and no variance formula; the
# weighted-sampling variance work of Binder that this record used to cite is carried by the
# estimators that compute those variances, not by the selector.
papers = []

implementation_deviations = [
  "This is an ownership and evidence record for the existing PublishedScalarUncertainty endpoint selector, not a new numerical method. Analytic-only intervals use the reported standard error and nominal normal quantile; declared finite-cluster references, bootstrap selection and explicit Gaussian population-score APIs remain distinct constructions.",
  "The scalar endpoint arithmetic supplies no coverage authority by itself. A calibrated facade claim requires an exact method/functional/dependence/size match to a currently attesting coverage record. Raw standard errors and declaration helpers confer no such authority.",
  "Each allocated record retains its original DGP, seed protocol, sample-size grid, scored counts, role and decision semantics. No unweighted record is borrowed by a weighted population and no normal record is borrowed by a Student or population-linear Gaussian construction.",
  "Point-route records retain ownership of input validation, declared target populations and their typed refusals. Cancellation is observed by those upstream executions; the endpoint selector itself is constant-work arithmetic on an existing estimate.",
]

upstream_implementations_observed = []

test_sources = [
  "crates/antecedent/tests/estimate_uncertainty_reference.rs (every combination of analytic SE, bootstrap SE and first-stage state against the stated rule, and the normal and Student-t critical values and interval against 50-digit quantiles)",
  "crates/antecedent/src/result.rs::published_scalar_uncertainty_tests (analytic/bootstrap selection and weak-IV withholding)",
  "crates/antecedent/tests/sampling_weight_routes.rs (public weighted trial result, independent Hajek variance and artifact round trip)",
  "crates/antecedent/tests/weighted_interval_calibration.rs (exact informative-sampling construction records)",
  "crates/antecedent/tests/missing_outcome_calibration.rs (exact randomized responder construction records)",
]

[non_algorithm_review]
status = "justified_non_algorithm"
kind = "derivation"
rationale = "Endpoint selector of the facade: from an effect estimate it publishes at most one scalar standard error (a positive finite bootstrap SE in preference to a positive finite analytic SE, never a bootstrap SE when first-stage diagnostics are present), publishes a valid Anderson-Rubin set as endpoints with no standard error, withholds an instrumental-variable uncertainty it cannot support, and forms estimate +- critical_value * SE. Structural result declarations moved to result/structural.rs; all named bound definitions and the other bound artifacts were compared unchanged apart from formatting. Interval binding and scalar uncertainty selection moved to result/uncertainty.rs; all named bound definitions and the other bound artifacts were compared unchanged apart from visibility and formatting."
no_independent_algorithm = "Selection among supplied numbers and one multiplication; the two quantile functions it reads (the normal quantile at 0.975 and the Student-t quantile at the declared reference degrees of freedom) are the special-function kernels, not code of this record. It estimates no standard error and forms no variance."
covered_by = ["stats.special_functions"]
derivation = "For a supplied estimate theta, a positive finite standard error s and nominal level 0.95 the interval is theta -+ q s, with q the 0.975 quantile of the standard normal, or of Student's t with the declared reference degrees of freedom nu > 0 when the SE is the analytic one; crates/antecedent/tests/estimate_uncertainty_reference.rs checks q (1.959963984540054; 12.7062, 4.3027, 3.1824, 2.5706, 2.2622, 2.0423 at nu = 1, 2, 3, 5, 9, 30) and the endpoints against 50-digit root-finding on the exact distribution functions, and the selector against a table of all 140 combinations of analytic SE, bootstrap SE and first-stage state decided from the stated rule."
inline_tests = true
