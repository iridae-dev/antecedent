kind = "derivation"
rationale = "Posterior means of one population's mechanism coefficients, intercept included, under independent normal priors on the parent slopes; not a posterior of the Wald statistic."
no_independent_algorithm = "mechanism_coefficient_posterior converts the retained X'X, X'y, y'y summary to a design summary (rss = y'y - beta'X'y) and calls full_coefficient_posterior_mean; the discrepancy statistic is the covered record. No interval."
covered_by = ["estimate.posterior_mean_kernel", "sensitivity.mechanism_discrepancy"]
derivation = "Normal likelihood with plug-in variance sigma2 = rss / (n - p) and independent N(0, tau^2) priors on the non-intercept coefficients (intercept unpenalized) give posterior mean (X'X + (sigma2 / tau^2) D)^-1 X'y; checked against the exact penalized normal equations in posterior_mean_reference.rs and in the route's own test."
