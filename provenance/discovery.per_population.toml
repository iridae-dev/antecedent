implementation_deviations = [
  "Not a pooled search, not a selection diagram and not an invariance test: agreement and difference are reported, never tested, and no error rate attaches to either. A difference between two discovered structures is a difference between two estimates, not a statement that a mechanism differs.",
  "Pooled-data confusion: two populations with content-identical searched columns, row counts, mask, weights and types are refused (selective_discovery.pooled_population_data); partial overlap is not visible from content identities, so the caller declares disjoint populations.",
  "Per-population error control is whatever the single-population route records; no whole-method calibration is stated for agreement between populations.",
