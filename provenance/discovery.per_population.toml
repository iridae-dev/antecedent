# One declared discovery contract run separately on each population's rows, with the
# per-population structures lined up edge by edge. There is no primary paper: the module is
# orchestration over the existing selective discovery adapter and pools nothing. The
# cross-population invariance literature is deliberately not cited because none of it is
# implemented (pooled and context-variable searches are refused).
