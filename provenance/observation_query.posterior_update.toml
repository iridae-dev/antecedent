implementation_deviations = [
  "Both updates are textbook identities evaluated exactly given a declared prior and likelihood; there is no estimation, sampling or approximation step.",
  "The finite update is computed in log space with the evidence by log-sum-exp, from the counts of each observation level. Observations are declared exchangeable and conditionally independent given the hypothesis, so the posterior does not depend on their order; sequential dependence is not represented.",
  "The conjugate model is Beta-Bernoulli only, reporting the posterior shapes and the predictive probability of the next success (the posterior mean). The posterior tail probability of the parameter needs a regularised incomplete beta that is not a public primitive of this library; it is not offered.",
  "A posterior or decision probability is exact given the declared model. When the prior or likelihood was fitted to a sample the caller labels it so, and the claim carries point_only_sample_fitted: no interval or calibration is made and both routes are closed with cell_not_licensed.",
]

