# Strategy-table implementation id: estimate.gcm.attribution.bayesian
# (EstimatorId::GcmAttributionBayesian, public name gcm.attribution.bayesian).
# This is the estimator identity assigned when a change-attribution query runs
# under Bayesian inference (attribution_path.rs finish_gcm).
#
# Bayesian attribution: the frequentist distribution-change attribution
# (attribution.distribution_change; Shapley attribution of a marginal change to
# per-node mechanism changes) is re-evaluated under a Bayesian bootstrap. Each
# draw samples one Dirichlet(1,...,1) row-weight vector per population, shared
# across every mechanism in that population, refits the baseline and comparison
# GCMs under those weights, and recomputes the total change and its Shapley
# components together. Budhathoki et al. supply the attribution being resampled
# and Rubin the row-weight law; the per-population shared-weight refit is the
# repository's own construction.
papers = [
 { title = "Why did the distribution change?", doi = "10.48550/arXiv.2102.13384", sections = ["Section 4 (Sections 4.1 Shapley Values, 4.2 Attributing Marginal Distribution Change)"] },
 { title = "The Bayesian Bootstrap", doi = "10.1214/aos/1176345338", sections = ["Dirichlet(1..1) observation weights"] },
]

implementation_deviations = [
 "Intervals are modular bootstrap pushforwards of the fitted-model change attribution, not a joint posterior over mechanisms and attribution; they quantify weighted-refit uncertainty and do not address misspecification or causal identification.",
 "Mechanism-family selection is made once on the original unweighted populations and is not revisited per draw; the posterior is conditional on that selection.",
 "Each population receives its own Dirichlet(1,...,1) weight vector per draw; total and Shapley components of a draw are computed from the same weighted refit so they stay coupled.",
 "Coefficient priors, transferred priors, and external prior composition are refused; Bayesian inference here accepts only the draw count.",
]

