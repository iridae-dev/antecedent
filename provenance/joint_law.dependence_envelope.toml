  { title = "Random variables with maximum sums", citation_note = "Previously recorded title and bibliographic detail: Random variables with maximum sums (Rueschendorf, Advances in Applied Probability 14(3):623-632, 1982)", doi = "10.2307/1426677", sections = ["sharp bounds of the distribution of a sum with fixed marginals"] },
