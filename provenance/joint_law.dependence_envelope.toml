implementation_deviations = [
  "Frechet (1951, Annales de l'Universite de Lyon, Sect. A, Ser. 3, 14:53-77), Hoeffding (1940, Schriften des Mathematischen Instituts der Universitaet Berlin 5:181-233), Lorentz (1953, Amer. Math. Monthly 60:176-179) and Tchen (1980, Ann. Probab. 8:814-827) are cited by name only: no DOI could be verified for them here, so they are not listed as papers.",
  "The extremes of E[g(X,Y)] for a supermodular or submodular g are attained at the comonotone and countermonotone couplings; here they are evaluated exactly on finite atoms (draws or weighted atoms), not for continuous marginals, and the sign structure is verified on the atom lattice before any bound is reported.",
  "Makarov and Rueschendorf bounds are evaluated exactly on finite atoms at each atom's value, left limit and right limit; the stated sharpness for general marginals is checked here against permutation enumeration for equal-mass marginals and against closed forms for Bernoulli and uniform marginals.",
  "A declared correlation range is applied to quantities linear in the correlation (endpoints exact) and the pooled estimate reuses the equicorrelated envelope of the evidence ledger; it is an assumption range.",
