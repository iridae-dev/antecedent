[method_review]
status = "reviewed_with_limits"
scope = "The finite-atom dependence envelopes of crates/antecedent-stats/src/joint_law.rs: Marginal construction (merged atoms, canonical order, masses), frechet_expectation_envelope / functional_envelope / product_moment_envelope / covariance_envelope / linear_variance_envelope (comonotone and countermonotone couplings with the lattice sign check) and sum_cdf_envelope / difference_cdf_envelope (the Makarov-Rueschendorf extremes at each atom, its left and right limits). Not the aligned-draw routines, the interval constructions, the exceedance decision, the correlation range, or the contract rule that licenses them."
assumptions = ["Both marginals are finite with masses that are multiples of one common denominator for the enumeration (k/N, N in 4..8, at most three atoms each); the coupling extremes of any functional linear in the coupling are attained at a vertex of the transportation polytope, whose vertices are integer tables when the margins are integers.", "Atom values are dyadic so that thresholds and ties compare exactly in binary64.", "The envelope bounds the functional over all joint laws with these marginals; it makes no statement about which coupling holds."]
historical_exposure = "Historical author exposure cannot be independently established. This review read the product source named in its scope and wrote its own reference, which does not use the comonotone, countermonotone or Makarov forms of the product: it enumerates every integer contingency table with the marginal counts (all vertices of the transportation polytope) in exact rational arithmetic and evaluates the remaining quantities from their definitions. No upstream implementation was consulted."
redistribution = "The reference script and its frozen output are repository-authored under MIT OR Apache-2.0; mpmath is used only to produce the frozen values and is not a product dependency. No cited paper is redistributed."
limitations = "Neither Makarov (1982) nor Rueschendorf (1982) was retrieved; the correspondence is between the product code and the standard statements of the bounds, verified by exhaustive enumeration on small lattices, not a page-level reading. The enumeration covers at most 3x3 atoms with total mass 4 to 8; it does not exercise large atom counts, near-equal masses that differ by rounding, thresholds that fall between binary64 neighbours, the 100000-atom or 4e6-cell budgets, or continuous marginals (the finite-atom restriction is a documented deviation). Calibration of any interval built on these bounds is unmeasured and not examined."
sources = ["https://mpmath.org/doc/1.3.0/"]
findings_resolved = ["No numerical defect was found: the coupling extremes of E[g] for the five closed value functionals, covariance, Var(aX+bY), P(X+Y<=t) and P(X-Y<=t) over thresholds at every atom sum and difference (and a quarter either side) agree with the exhaustive table enumeration on 19 marginal pairs (ties between the two marginals, single atoms, unequal atom counts and masses, Bernoulli-like), and the value functionals whose mixed difference changes sign on the lattice (ratio across a sign change of the denominator) are refused exactly where the independent all-pairs lattice check says so."]
