# Estimator side of fitted-mechanism abduction–action–prediction.
# Identification is identify.gcm_parametric; the AAP procedure is
# counterfactual.aap.
papers = [
 { title = "Causality", citation_note = "Previously recorded title and bibliographic detail: Causality: Models, Reasoning, and Inference", doi = "10.1017/CBO9780511803161", sections = ["Chapter 7 abduction-action-prediction"] },
]

implementation_deviations = [
 "Fits a selected GCM mechanism family per node (linear-Gaussian, interactions, splines; discrete analogues), then abducts and predicts. Mechanism selection is 5-fold row-mod cross-validated error, not a procedure in the cited chapter.",
 "Sampling uncertainty is unavailable on the frequentist path. The Bayesian path is a Dirichlet mechanism-refit bootstrap on the observed units, not a population posterior.",
 "Licensed staged query is one-treatment, one-outcome ITE (or the named attribution queries). Nested, temporal, and graph-posterior requests refuse.",
]

