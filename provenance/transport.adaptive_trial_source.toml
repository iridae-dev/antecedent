  { title = "Confidence intervals for policy evaluation in adaptive experiments", citation_note = "Previously recorded title and bibliographic detail: Confidence intervals for policy evaluation in adaptive experiments (Hadad, Hirshberg, Zhan, Wager, Athey, PNAS 118(15):e2014602118)", doi = "10.1073/pnas.2014602118", sections = ["the realized assignment probabilities of an adaptive design as weights; only the point weighting idea is used"] },
]
