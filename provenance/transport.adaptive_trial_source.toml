# Arm means of an adaptive trial standardized to a finite target stratum law with the realized
# assignment probabilities as weights (a Hajek-type self-normalized inverse-probability mean per
# stratum and arm). The selection-diagram premise is declared: the stratum law may be shifted,
# the outcome mechanism given stratum and arm must be invariant.
papers = [
