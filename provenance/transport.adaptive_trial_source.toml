# Arm means of an adaptive trial standardized to a finite target stratum law with the realized
# assignment probabilities as weights (a Hajek-type self-normalized inverse-probability mean per
# stratum and arm). The selection-diagram premise is declared: the stratum law may be shifted,
# the outcome mechanism given stratum and arm must be invariant.
papers = [
  { title = "External Validity: From Do-Calculus to Transportability Across Populations", citation_note = "Previously recorded title and bibliographic detail: External Validity: From Do-Calculus to Transportability Across Populations (Pearl and Bareinboim, 2014)", doi = "10.1214/14-STS486", sections = ["selection diagrams: a mechanism with no selection node into it is shared by the source and the target population"] },
  { title = "Confidence intervals for policy evaluation in adaptive experiments", citation_note = "Previously recorded title and bibliographic detail: Confidence intervals for policy evaluation in adaptive experiments (Hadad, Hirshberg, Zhan, Wager, Athey, PNAS 118(15):e2014602118)", doi = "10.1073/pnas.2014602118", sections = ["the realized assignment probabilities of an adaptive design as weights; only the point weighting idea is used"] },
]
implementation_deviations = [
  "Not the adaptively weighted AIPW estimator of the cited paper: no outcome model, no variance-stabilizing adaptive weights and no confidence interval. Only the self-normalized inverse-realized-probability stratum mean and its standardization are implemented.",
  "Point only; the estimator carries no sampling distribution. The contract's procedure cell must be supported for adaptively weighted scores; a fixed design has its own route.",
  "A trial without the retained assignment and monitoring contract is refused with the missing contract named; it is never analysed as if it were fixed. Every target stratum with positive mass and both arms must hold units with realized probability at or above the declared floor.",
]
upstream_implementations_observed = []
test_sources = [
  "crates/antecedent-design/tests/transported_evaluation.rs",
]

[method_review]
status = "reviewed_with_limits"
scope = "transport_adaptive_trial and verify_adaptive_transport in crates/antecedent-design/src/adaptive_trial_transport.rs: the per-stratum, per-arm self-normalized inverse-realized-probability mean, its standardization to a supplied finite target stratum law, and the contract/diagram/support refusals that guard it. A point route only. Not a review of the adaptive-design contract itself (crates/antecedent-contract/src/adaptive_design), of adaptively weighted inference (intervals), or of outcome models."
assumptions = ["The recorded assignment probabilities pi_u(a) are the true conditional probabilities with which each unit's arm was drawn given everything the adaptive policy used (stratum, earlier units, earlier outcomes), so assignment is ignorable given that history; the contract records but cannot test this.", "The outcome mechanism given stratum and arm is invariant between the trial's population and the target (a declared selection-diagram premise; a shifted outcome mechanism is refused). Only the stratum law may differ, and the target stratum law is supplied, not estimated.", "Positivity: every target stratum with positive mass has at least one analysed unit under each compared arm, each with realized probability at or above the declared (strictly positive) floor; nothing is clipped.", "Units with an outcome at the final look are the analysed units; unavailability and delay are required not to depend on the outcome, and are otherwise treated as ignorable (no weighting for missing outcomes).", "The estimate is a function of a point estimator with no sampling distribution; it supports no interval."]
historical_exposure = "The earlier record listed no observed implementations; historical author exposure cannot be independently established. This review read the product source and the integration test with its hand-computed values; no upstream implementation or test source was consulted or copied."
redistribution = "Repository-authored code and tests under MIT OR Apache-2.0; cited papers are linked by DOI, not redistributed."
limitations = "The primary papers were not re-read in this review (the copies reachable from this environment were scanned or paywalled); the section citations are inherited from the earlier record, and the implementation was checked against the rules as the reviewer understands them and against an independent enumeration instead. A mistake in how the record states a theorem would therefore not be detected here. No published algorithm is implemented: the selection-diagram citation supplies only the invariance premise, and the adaptive-experiments citation is the source of the idea of weighting by the realized assignment probabilities, not of this estimator, which is the plain Hajek ratio per stratum and arm. Consistency of a self-normalized inverse-probability mean under history-dependent assignment is an argument the reviewer did not reconstruct from the cited paper, and its finite-sample bias and non-normality under adaptivity are not addressed (a point estimate only). Outcomes missing at the final look are dropped rather than weighted. The independent evidence is one eight-unit hand-computed scenario and refusal cases; there is no simulation or enumeration against a known adaptive-trial truth. Calibration remains deferred."
sources = ["https://doi.org/10.1214/14-STS486", "https://doi.org/10.1073/pnas.2014602118"]
findings_resolved = ["Checked the code against the documented estimator: the unit outcome is the mean of its measurements, the weight is 1/pi_u(a) for the unit's assigned arm only, cell mean = sum(w*y)/sum(w), and theta(a) = sum over strata with positive mass of q(s) * cell mean; units assigned an arm other than the two compared arms are skipped, not pooled.", "Checked that a probability below the declared floor, a stratum with positive mass and no unit under a compared arm, a shifted outcome mechanism, a declared-invariant stratum law that differs from the trial's empirical law, a fixed design and a missing contract/diagram/law are each refused with a named reason, and that the declaration validation requires 0 < floor <= 1 so no weight is infinite.", "Re-derived by hand the integration test's cell means (stratum 0 treated: weights 1.25 and 5/3 give 4/7; stratum 1 control: weights 5 and 2.5 give 1/3) and the standardized values 29/56 and 1/2; the same data weighted with flat recorded probabilities give 1/2, so the assertions distinguish the recorded probabilities from arm counts.", "Recorded that missing outcomes are dropped, that no consistency argument under adaptivity is made here, and that the cited adaptive-experiments paper does not specify this estimator; no defect requiring a code change was found and no code was changed."]
