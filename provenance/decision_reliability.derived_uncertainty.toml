]

[method_review]
status = "reviewed_with_limits"
scope = "derive_uncertainty in crates/antecedent-design/src/decision_reliability/interval.rs: the Wald interval of utilities and of differences to the decided candidate, the Wilson interval at the reported effective sample size, the multiplicity adjustment (marginal or Bonferroni over every reported interval), the confidence set for the best candidate (paired comparisons with Bonferroni over the competitors up to 64 candidates, marginal two-sided Bonferroni beyond) and the selection-corrected simultaneous interval. It relies on the mc_error review of decision_reliability.sampled_decision for the standard errors and effective sizes and on the norm_inv kernel for critical values (compared with the standard library's NormalDist at 1e-8). Not the report assembly, the draw carrier, the coverage calibration or the publication licensing beyond the simultaneous-multiplicity refusal."
assumptions = ["Monte Carlo errors are normal at the reported effective sample size and standard errors are known; the reference reproduces the construction, so it shows the arithmetic is as documented, not that the intervals cover.", "The best-candidate set is Bonferroni, not Hsu's exact multivariate-t set; the product states this and the reference follows the product's stated construction."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the product source named in its scope and compared the product with definitions evaluated by an executing reference written for this review (standard library only; exact rational arithmetic for the Maritz-Jarrett weights); no upstream implementation or test source was consulted or copied. The cited publications were not retrieved in this review (nothing downloaded): the correspondence is between the product code and the standard definitions those works state, verified numerically, not a page-level reading of the papers."
redistribution = "Primary works are cited, not redistributed. The reference script and its frozen output are repository-authored (MIT OR Apache-2.0); the script uses only the Python standard library. Its output is frozen in the JSON file and compared by the test."
limitations = "Eight scenarios are compared at 1e-8 relative on intervals, critical values and half-widths: two expected-utility problems (independent and shared streams) (3 to 4 candidates, 100 to 150 quarter-grid draws, 0.8 to 0.99 levels, marginal and simultaneous multiplicity, ranking with baseline and top-k), a shared median problem, an independent upper-tail CVaR problem, a shared threshold problem with exact ties, a shared problem with lognormal(0, 1.2) importance weights (Kish effective size about 70), an autocorrelated 900-draw stream with batch means, and a 70-candidate problem that takes the marginal Bonferroni branch. Ranking probabilities are recomputed by direct enumeration over draws with tie sharing. Not exercised against a reference: candidate sets near the 64-candidate switch, searches with unretained candidates, the held-out and split-draw validation paths (the selection-corrected interval is compared for the no-validation path only), effective sizes between 30 and 100 at the refusal boundary other than through the 30 floor itself, and any coverage. Derived-unmeasured by design: publication refuses until a coverage record exists. The cited works were not retrieved."
sources = ["https://doi.org/10.1080/01621459.1927.10502953", "https://doi.org/10.1201/b15074", "https://doi.org/10.1287/mnsc.1050.0451"]
findings_resolved = ["No defect found: Wald and Wilson intervals, per-interval levels under simultaneous multiplicity, the paired and marginal best-candidate sets with their critical values, and the selection-corrected half-widths and critical value agree with the reference on all eight scenarios; a simultaneous request is refused at publication."]
