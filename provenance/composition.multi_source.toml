  "python/tests/test_multi_source_mutations.py",
]

[non_algorithm_review]
status = "justified_non_algorithm"
kind = "wrapper"
rationale = "The original acceptance example composes a native response, two external studies, a joint law and a design ranking. The same facade now delegates new typed source roles to the verified readers. For a sampling bridge terminal, it checks that exactly one embedded parent distribution is the supplied source, and binds its identity, the sampling meaning and the mapped terminal to the recomputation program."
no_independent_algorithm = "The facade declares the program and resampling meaning, checks the terminal and source relationships, quotes bounded workspace and delegates derivation to the scientific bridge and each scientific operation to its own compiled route. A predictive source must have a predictive semantic kind. An empirical outcome table does not substitute for it. The portable consumer checks the retained bundle, program and terminal rather than relying on the artifact to choose its own target."
