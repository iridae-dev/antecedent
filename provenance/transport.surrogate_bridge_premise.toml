# Ties the transportability premise of a trial-level surrogate-to-terminal bridge to a declared
# selection diagram: the premise holds only when no selection node points into the terminal
# outcome or into a declared modifier of the relation.
# papers = [] is an explicit judgment, read against crates/antecedent-design/src/transported_bridge.rs: the module
# states the transportability premise of a trial-level surrogate bridge and checks it against a declared
# selection diagram (no selection node into the terminal outcome or a declared modifier; a node into the
# surrogate is allowed). The linear trial-level mapping and the point value are derived by the bridge contract,
# which provenance/scientific_bridge.typed_bridges.toml covers. The surrogate-validation literature
# (Prentice 1989; Buyse et al. 2000) and the selection-diagram rule (Pearl and Bareinboim 2014) were not
# retrieved in this review.
