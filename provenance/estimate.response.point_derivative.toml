# The Kennedy pseudo-outcome is smoothed by a local quadratic weighted least-
# squares fit. Its fitted linear/quadratic coefficients give first/second
# derivatives at the requested point. Log-scale variants are algebraic
# transformations of that derivative; no extra causal identification theorem is
# claimed.
