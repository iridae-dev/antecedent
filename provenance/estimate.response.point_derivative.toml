# The conventional point uses a local quadratic fit of the Kennedy pseudo-outcome.
# Interval coordinates use higher-order fits and their joint robust covariance.
# Bias correction, transformed intervals and the Bayesian row-weight construction
# are separate from causal identification and do not inherit coverage wholesale.
papers = [
  { title = "Nonparametric methods for doubly robust estimation of continuous treatment effects", doi = "10.1111/rssb.12212", sections = ["Section 3.1: doubly robust pseudo-outcome mapping", "Section 3.2, equations (4)-(5): local-polynomial smoothing target"] },
  { title = "Local Polynomial Regression: Optimal Kernels and Asymptotic Minimax Efficiency", doi = "10.1023/A:1003162622169", sections = ["Section 2, equations defining the local polynomial coefficient estimator and derivative extraction"] },
  { title = "Coverage error optimal confidence intervals for local polynomial regression", doi = "10.3150/21-BEJ1445", url = "https://arxiv.org/html/1808.01398v4", sections = ["Section 2, equations (8)-(10): robust bias correction and fixed-n Studentization", "Supplement S.3.2-S.3.3: interior bias terms for odd and even p-nu (arXiv v4)"] },
  { title = "Some Problems in Interval Estimation", doi = "10.1111/j.2517-6161.1954.tb00159.x", sections = ["Fieller ratio confidence-set construction: invert the test for the numerator minus a candidate ratio times the denominator"] },
  { title = "The Bayesian Bootstrap", doi = "10.1214/aos/1176345338", sections = ["Dirichlet(1,...,1) observation weights; construction only for the Bayesian derivative route"] },
