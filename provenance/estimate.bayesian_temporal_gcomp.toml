# Same single-time-point Bayesian g-computation as estimate.bayesian_gcomp.toml,
# applied to the lag-aligned design from TemporalLinearAdjustment::prepare.
# Not Robins's iterated g-formula (that is estimate.temporal_sequential).
papers = [
 { title = "Bayesian Data Analysis", doi = "10.1201/b16018", sections = ["Bayesian g-computation / posterior predictive contrasts"] },
]

