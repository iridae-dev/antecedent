# A policy value carried across periods under one premise: the dynamic mechanisms are time-
# invariant over a fixed horizon and only the initial state has moved. Original engineering over
# the same sequential g-formula as transport.policy_evaluation; the premise is the
# selection-diagram rule with time as the population index.
