limitations = "The primary papers were not re-read in this review (the copies reachable from this environment were scanned or paywalled); the section citations are inherited from the earlier record, and the implementation was checked against the rules as the reviewer understands them and against an independent enumeration instead. A mistake in how the record states a theorem would therefore not be detected here. Original bounded engineering over the same enumeration as population transport with time as the index; no published algorithm is implemented and no period-drift model exists beyond the supplied initial law. A simultaneous population and period change is not representable. Point value; no uncertainty. The only independent value is the same hand-derived closed form (7.5 - 10p, 1.5 at p = 0.6), so a defect common to the shared enumeration would be caught only by that closed form. Calibration remains deferred."
