]

[non_algorithm_review]
status = "justified_non_algorithm"
kind = "wrapper"
rationale = "Each embedded node dispatches to an artifact-specific verifier, checking the identity and exposing typed facts. A longitudinal node requires a source-bearing admitted family before publishing interval endpoints and a schedule optimum. PAG replay distinguishes an identified functional, an obstruction and a deterministic stop. A propagation chain publishes diagnostics without substituting for an aligned law."
no_independent_algorithm = "The registry selects readers and checks expected upstream roles and identities. It delegates replay and affine scoring. A counterfactual mean decision uses the replayed source probability and scientific coordinate to reconstruct its contract evaluation, and compares the result fingerprint."
covered_by = ["composition.bundle", "decision.functional_inverse", "decision.contract", "counterfactual.transport_general", "counterfactual.transport_sampled"]
