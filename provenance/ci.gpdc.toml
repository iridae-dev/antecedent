 "crates/antecedent-stats/src/ci/advanced.rs (gpdc_runs and gpdc_permutation_pvalue_separates_dependence unit tests)",
 "conformance/discovery/ci_stats (gpdc_dep / gpdc_ind, black-box comparison against pinned Tigramite baseline)",
 "conformance/discovery/advanced_ci (gpdc_cases, black-box comparison against pinned Tigramite baseline)",
]

[method_review]
status = "reviewed_with_limits"
scope = "The permutation test in crates/antecedent-stats/src/ci/advanced/gpdc.rs: residualization of X and Y (centering when Z is empty), the biased V-statistic distance correlation of crates/antecedent-stats/src/dcor.rs, the exchangeable shuffle of the Y residual, the rule for counting a permuted distance correlation that equals the observed one (dcor_reaches_observed), and the add-one p-value. Reviewed with an empty conditioning set only. Not the kernel-ridge fit, the hyperparameters, the Nystrom predictor, block permutation, or the conditional case."
assumptions = ["Residual series are exchangeable under the null (the permutation argument); with Z empty the residual is the centered series.", "Distance correlation is the square root of dCov^2 / sqrt(dVar^2(X) dVar^2(Y)) with the V-statistic normalisation, evaluated by sorting and Fenwick identities in floating point."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the product source named in its scope, including the numerical helpers it calls, and compared results with definitions evaluated by executing references written for this review; no upstream implementation or test source was consulted or copied. The cited publications were not retrieved in this review: the correspondence is between the product code and the standard definitions those works state, verified numerically, not a page-level reading of the papers."
redistribution = "Primary work is cited, not redistributed. The reference script and its frozen output are repository-authored (MIT OR Apache-2.0); the script uses mpmath (BSD-3-Clause), itertools and collections from the Python standard library, imported at run time and not redistributed here. The script declares its inline script metadata but is not run in a locked, isolated environment and is not wired into any gate; its output is frozen in the JSON file and compared by the test."
limitations = "Five series of 8 to 9 rows on a decimal grid (four tie-rich and one exactly independent table), with every distinct arrangement of Y enumerated (at most 2520). The Monte Carlo p-value is compared with its exact expectation at 20000 replicates within five binomial standard errors, so a bias smaller than about 0.01 would not be detected. The statistic is asserted as its square to 1e-12 because the floating-point distance correlation of an exactly independent table is 1.8e-8 rather than 0 (cancellation in dCov^2); a reported value below about 1e-6 is therefore indistinguishable from zero. Conditioning sets, the kernel fit, larger samples and continuous (untied) data are not enumerated. The reference script is not run in a locked, isolated environment and is not wired into any gate."
sources = ["https://doi.org/10.1214/009053607000000505", "https://mpmath.org/"]
findings_resolved = ["Defect repaired: the permutation null counted a permuted distance correlation only when it was at least the observed one in floating point. A permutation that is a symmetry of the grid-valued series gives the same distance correlation as a real number, but dCov^2 is a difference of three nearly equal sums, so the two values differ in the last bits and the tied permutation counted for or against at random; on a reflection-symmetric 8-row series the p-value was 0.978 against an exact 1. The comparison is now made on the squared correlation with an absolute slack of 1e-12 (dcor_reaches_observed). An exactly independent 2x2 table, whose reported distance correlation is 1.8e-8, is covered by the same rule.", "The statistic equals the 60-digit distance correlation on every series and the p-value equals the exactly enumerated null on all of them."]
record_sha256 = "b7013356e2cccf782d8fd8e09a1b7d06634692715a6872aa8658071a6a9e9300"

