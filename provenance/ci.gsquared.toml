papers = [
 { title = "The Large-Sample Distribution of the Likelihood Ratio for Testing Composite Hypotheses", doi = "10.1214/aoms/1177732360", sections = ["asymptotic chi-square distribution of the likelihood-ratio (G-squared) statistic"] },
]

implementation_deviations = [
 "Conditional tests stratify on the conditioning set and sum the per-stratum statistic; each stratum's degrees of freedom are (observed X levels - 1)(observed Y levels - 1), so a stratum in which X or Y is constant contributes zero degrees of freedom. A conditional table in which no stratum has positive degrees of freedom is refused rather than reported as independence. This per-stratum rule is not the single Wilks likelihood-ratio reference for a fixed table; it is the pgmpy-style convention.",
 "An optional permutation null (Y codes permuted within strata, or block-permuted when the conditioning set is empty) replaces the chi-square reference; it is not part of the cited Wilks result.",
 "The Tigramite comparison covers unconditional two-way tables only. The stratified conditional statistic used by discovery is checked against an exact contingency computation written for this review, not against an external package.",
 "The test refuses sparse contingency tables (an expected cell count below 5) and tables with no positive degrees of freedom instead of reporting a chi-square p-value, and reports no confidence interval for the statistic.",
 "Strata are grouped by the exact vector of conditioning codes and ordered by its FNV-1a hash, which fixes the order of seeded permutation draws; the grouping does not rely on the hash being collision free.",
]

upstream_implementations_observed = [
 { project = "tigramite", exposure = "black-box comparison only" },
]

test_sources = [
 "crates/antecedent-stats/tests/symbolic_cmi_reference.rs (G-squared permutation p-value against the exactly enumerated hypergeometric null, with tied tables)",
 "crates/antecedent-stats/src/ci/gsquared.rs unit tests",
 "crates/antecedent-stats/tests/ci_exact_reference.rs (statistic, degrees of freedom and p-value against exact integer-count contingency arithmetic, including stratified tables, a constant-Y stratum and a p-value of 1e-266)",
 "conformance/discovery/ci_stats (gsquared_dep / gsquared_ind, black-box comparison against pinned Tigramite baseline)",
]

[method_review]
status = "reviewed_with_limits"
scope = "The G-squared conditional-independence test as used by discovery: category encoding, stratification by the conditioning set, per-stratum contingency construction and statistic, the expected-count guard, the degrees-of-freedom rule and the chi-square tail. Not a review of the permutation null (add-one p-value, Y-within-stratum and block permutation), the contingency accumulation kernel (exercised, not read), or the RegressionCi alias."
assumptions = ["Observations are independent within and across strata; the chi-square reference is asymptotic and is protected only by the expected-count guard (every positive-margin cell at least 5).", "The per-stratum degrees-of-freedom convention is repository-defined and is not a claim about the Wilks result for a fixed table.", "Category codes are integers, or finite labels coded by increasing value."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the product source named in its scope, including the numerical helpers it calls, and compared results with definitions evaluated by executing references written for this review; no upstream implementation or test source was consulted or copied. The cited publications were not retrieved in this review: the correspondence is between the product code and the standard definitions those works state, verified numerically, not a page-level reading of the papers. "
redistribution = "Primary work is cited, not redistributed. The reference scripts and their frozen outputs are repository-authored (MIT OR Apache-2.0); mpmath is used only to produce the frozen values and is not a product dependency."
limitations = "Eight table configurations from 2x2 to a 56-degree-of-freedom 8x9 table, up to five strata, counts up to about 5,000 per cell, plus the sparse and zero-degree-of-freedom refusals and a two-column conditioning set. Strata are tables of integer counts, so the reference does not test category encoding of non-integer labels. The reference script declares mpmath==1.3.0 in inline script metadata but is not run in a locked, isolated environment and is not wired into any gate; its output is frozen in the JSON file and compared by the test. Worst agreement: statistic 4.5e-15 relative, p-value 1.2e-13 relative (p = 1e-266). The Wilks asymptotic result itself, and the validity of the summed-stratum statistic as a conditional-independence test with few observations per stratum, are not established by this review."
sources = ["https://doi.org/10.1214/aoms/1177732360", "https://mpmath.org/doc/1.3.0/"]
findings_resolved = ["Statistic, degrees of freedom and chi-square p-value agree with exact arithmetic on every configuration, including the stratum with a constant Y (zero degrees of freedom, zero contribution) and the extreme tail, which depends on the incomplete-gamma correction made in the special-function review.", "Strata were keyed by a 64-bit FNV hash of the conditioning codes alone, so a hash collision would silently merge two strata. They are now keyed by the exact code vector and ordered by the hash, preserving the established order of seeded draws; an equivalence check addresses the same strata through one and two conditioning columns.", "The refusal paths behave as recorded: an expected cell count below 5 and a table with no positive degrees of freedom both return Unsupported rather than a p-value.", "Outside the reviewed statistic scope, found while building the permutation-null reference in ci.symbolic_cmi: the permutation null counted a permuted statistic only when it was at least the observed one in floating point, so permutations whose table ties the observed one (a relabeled or transposed count table, summed in a different order) fell below it at random and the p-value was too small (0.0226 against an exact 0.0391 on a 24-row table in which [[9,3],[3,9]] and its mirror [[3,9],[9,3]] tie). The comparison now allows a 1e-12 relative slack; the stratified G-squared permutation p-value matches the enumerated null in symbolic_cmi_reference.rs."]
record_sha256 = "8309dc7fab2d9df28fac4091f357d8decbdbd52235c6efc6bff54acaf32687ba"

