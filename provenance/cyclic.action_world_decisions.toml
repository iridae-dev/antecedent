# Compiled decisions between hard-clamp action worlds of a cyclic feedback model: a specified
# model on shared disturbance rows, a jointly fitted posterior, and a posterior standardized over a
# target baseline frame. papers = [] is an explicit judgment: the routes compose the solver and
# likelihood of cyclic.general_systems, the random-walk Metropolis sampler and its diagnostics, and
# the decision evaluator, and add no estimator of their own. The cyclic-model theory the solver
# rests on is cited in cyclic.general_systems; nothing here claims to implement a published
# decision procedure for cyclic models.
papers = []

implementation_deviations = [
 "The fitted routes sample the feedback coordinates by random-walk Metropolis with warmup-tuned proposals and publish only when R-hat, effective sample size and chain movement pass; no gradient sampler and no model-specification diagnostic is involved.",
 "Predictive disturbances are drawn from the fixed, supplied covariance through its Cholesky factor; the covariance is not fitted, so predictive uncertainty is conditional on it.",
 "A world's equilibrium is the certified solve of cyclic.general_systems under hard clamps; a draw whose solve is not certified is refused rather than dropped.",
 "The target-frame route standardizes the paired worlds over the declared baseline rows and refuses rows outside the training support; it is not a transport of the effect to another population.",
 "No coverage or frequentist reliability is claimed: every result labels its calibration not_measured, and the prospective selection grid test keeps ties, wrong choices and refusals as observations.",
]

upstream_implementations_observed = []

test_sources = [
 "crates/antecedent/src/analysis/cyclic_action_world_decision.rs (inline tests with hand-solved clamped equilibria)",
