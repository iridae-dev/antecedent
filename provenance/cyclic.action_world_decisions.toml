]

[non_algorithm_review]
status = "justified_non_algorithm"
kind = "wrapper"
rationale = "Decision wrapper over the cyclic equilibrium solver, the equilibrium likelihood, the random-walk Metropolis posterior and the decision evaluator. The modules bind output coordinates to worlds, derive the aligned joint law of the paired worlds, hand it to the decision compiler and seal an artifact an independent consumer replays. The reviewed source now routes inspection through the common compiled handle, which still views the same retained program at the compiled stage. The paired-world fixture keeps its per-draw equilibrium contrast and checks the posterior mean against a finite one-dimensional grid of the declared Gaussian likelihood, its equilibrium Jacobian and the normal prior. It does not equate the fitted mean with the generator coefficient. Separate identity assertions vary output order, source or target rows, seed, utility units and the relevant fit settings."
no_independent_algorithm = "The only numerics added are the Cholesky factor of the supplied disturbance covariance and standard-normal draws through the repository kernels, and a row-wise average over the declared target baseline rows; the equilibrium solve, the posterior and the utility evaluation are those of the covered records."
covered_by = ["cyclic.general_systems", "prob.mcmc_diagnostics", "decision.contract", "decision.functionals"]
