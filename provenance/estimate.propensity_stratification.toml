implementation_deviations = [
 "Uses a fixed main-effects logistic propensity model with clipping and optional trimming rather than a flexible or balance-selected score model.",
 "Constructs a fixed number of pooled empirical propensity-score quantile strata, five by default, and collapses unusable strata; it does not iteratively subclassify until balance criteria are met.",
 "The analytic variance treats estimated propensity scores and data-dependent stratum boundaries as fixed and combines within-stratum sample-mean variances only.",
 "Trimming changes the retained target population, while the reported estimand remains represented by the original ATE, ATT, or ATC result type.",
]

