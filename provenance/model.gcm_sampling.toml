 "The MCMC sampler is fixed random-walk Metropolis over a KDE pilot proxy, with fixed burn-in and thinning; it is not sampling the SCM joint distribution and reports acceptance rate but no multi-chain R-hat, ESS, or divergence diagnostics.",
