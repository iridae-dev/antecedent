implementation_deviations = [
 "Conformal sets: the counterfactual model is the simplex-constrained least-squares donor fit with no covariates or intercept. Each per-period test uses the pre-periods and that one period with the absolute residual as the statistic; the constant-effect test sums the absolute residuals of the post block over all cyclic shifts. The set is the hull of the accepted effects found on a grid scaled by the pre-fit error and refined by bisection; a set reaching the widest searched range is reported as absent.",
 "The p-value is a multiple of one over the permutation count n, so the size of the 5% test is floor(0.05 n) / n: exact at 5% only where n is a multiple of twenty and conservative elsewhere. Exactness needs residuals exchangeable over time; under serial dependence the test is approximate.",
 "Placebo variance: each adopting unit is fitted against the never-treated donors only, at its own adoption period, and the reported effect is the post-period-weighted average of the per-unit effects. Each placebo refit assigns the observed adoption periods to randomly drawn never-treated units and fits them on the remaining donors, so a placebo fit has fewer donors than the reported one. The interval is the normal interval of the population standard deviation of the placebo estimates. Synthetic difference in differences is refused: the unit-weight intercept and ridge penalty of the cited estimator are not implemented.",
 "Offline check of the placebo interval (numpy replica, 1,500 panels per size, three adoptions among exchangeable units): 0.946 at 15 and at 20 never-treated donors, with a placebo standard error about 5% above the estimator's spread and a normal quantile that ignores the error of that standard error.",
 "The convex-donor counterfactual, donors unaffected by the intervention and exchangeability of the untreated errors (over time for the conformal sets, across units for the placebo variance) are declared assumptions.",
]

