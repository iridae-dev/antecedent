[method_review]
status = "reviewed_with_limits"
scope = "decision_report in crates/antecedent-stats/src/adaptive_inference/procedure_uncertainty.rs (stop probability at each look, no-stop probability, expected enrolment, probability of deciding each arm, wrong-decision probability with ties in the truth, expected regret) with the posterior-expected-loss and futility rules it reports on (crates/antecedent-stats/src/adaptive_inference/procedure_law.rs, Rules::assess), and expected_loss_stopping with the posterior it thresholds in crates/antecedent-estimate/src/adaptive_inference.rs (the arm named best, the probability-best and expected-loss stop conditions). Relies on the Beta posterior kernel reviewed under adaptive_inference.bayesian_posterior and on the exact-law review of adaptive_inference.procedure_law; checks its own arithmetic here. Not the reliability of the rule (stated closed), other losses, or more than two arms in the exact comparison."
assumptions = ["The loss is the regret of choosing an arm in success probability (E[max theta] - E[theta_chosen]) under independent Beta posteriors of the observed counts.", "An outcome-dependent loss of outcomes is refused by the premise gate, so the observed counts alone are the likelihood."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the product source named in its scope, including the numerical helpers it calls, and compared results with definitions evaluated by executing references written for this review; no upstream implementation or test source was consulted or copied. The cited publications were not retrieved in this review (nothing was downloaded and no local copy exists): the correspondence is between the product code and the standard definitions those works state, verified numerically, not a page-level reading of the papers."
redistribution = "Primary work is cited, not redistributed. The reference scripts and their frozen outputs are repository-authored (MIT OR Apache-2.0) and use only the Python standard library. The scripts declare their inline script metadata but are not run in a locked, isolated environment and are not wired into any gate; their output is frozen in the JSON files and compared by the tests."
limitations = "Thompson's 1933 paper was not retrieved (nothing downloaded, no local copy); the check is of the code against the definitions of the posterior probability and the expected loss, not a reading of the paper. The reference evaluates P(Y > X) for integer Beta shapes from the binomial tail and E[(Y - X)+] = E[Y; Y > X] - E[X; Y > X] in exact rational arithmetic (cross-checked against the Miller sum). Posterior part: a 10 x 10 grid of count pairs of two arms (counts to 40/25, empty and one-sided arms) under the uniform prior, probability best and loss to 1e-9 and the stop decision at thresholds 1e-6 either side of every exact value, the best arm at exact ties. Decision part: six procedures (fixed and Thompson assignment, expected-loss and futility rules, with a lag of one, equal arms for the wrong-decision rule) against the exact path enumeration at 1e-12. Two-arm cases only for the exact comparison; priors other than the uniform one in the posterior grid are covered by the bayesian_posterior review; the reliability of the rule (probability of a wrong stop, regret over repeated use) is not derived or measured and stays closed, as the record states."
sources = ["https://docs.python.org/3/library/fractions.html", "https://docs.python.org/3/library/decimal.html", "https://doi.org/10.1093/biomet/25.3-4.285"]
findings_resolved = ["Defect repaired (shared by the law, the decision report and the participant procedure): the stopping rules compared numerically integrated posterior quantities with their thresholds with no band. At small counts those quantities are rational numbers that land exactly on round thresholds (the expected loss of choosing an arm after two units on one arm is exactly 1/20; the posterior probability that an arm is best is exactly 4/5 after three failures of the other), and the integral carries about 1e-15 of rounding, so the rule stopped or continued at those states by the sign of the rounding; the arm named at an exact tie followed it too (the estimate-crate rule named the last arm). The reference (exact Fractions) stops with probability 0.3125 at look 1 of a lagged expected-loss rule and the product reported 0.625, and the exact-futility tie case differed in mass (0.00463 against 0.00617). The rules now read a quantity within 1e-12 of its threshold as equal (at least holds at equality, below does not) and name the lowest arm among equal ones; every case of the frozen reference now agrees to 1e-12. The participant procedure (adaptive_inference.participant_family) uses the same reading with a band of 1e-9, because its logit quadrature is accurate to about 4e-11 (one completed participant with no success among two responses reads an expected loss of 0.04999999996915 where the exact value is 1/20); a history of that participant replayed as stopped at a threshold of exactly 0.05 and now continues.", "Defect repaired: expected_loss_stopping named the last of equally likely best arms (max_by returns the last maximum), so equal evidence named arm 1 where the procedure rules and the exact reading name arm 0; it now names the lowest arm within the same band."]
