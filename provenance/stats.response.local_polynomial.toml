# The implementation is an independently written Gaussian-kernel local quadratic
# weighted least-squares kernel. The fixed normal-reference bandwidth is a simple
# selector, not a translation of software or a claim to implement the data-driven
# selector in the cited paper.
papers = [
 { title = "Local Polynomial Regression: Optimal Kernels and Asymptotic Minimax Efficiency", doi = "10.1023/A:1003162622169", sections = ["Section 2: local polynomial weighted least-squares coefficient and derivative estimators"] },
 { title = "Density Estimation for Statistics and Data Analysis", doi = "10.1201/9781315140919", sections = ["Section 3.2, pages 45 and 47: Gaussian normal-reference bandwidth h = 1.06 sigma n^(-1/5); used here only as a deterministic default heuristic"] },
]

implementation_deviations = [
 "Uses a Gaussian-kernel local quadratic fit, not the cited paper's optimal-kernel or asymptotic-minimax construction.",
 "Uses Silverman's 1.06*sigma*n^(-1/5) density-estimation bandwidth with a range-based numerical floor; this is a deterministic default, not a local-polynomial bandwidth selector from the cited paper.",
 "Reports repository-defined pointwise plug-in and influence-sandwich standard errors; it does not implement simultaneous bands or the cited paper's inferential theory.",
 "The plug-in residual variance divides the weighted residual sum of squares by sum(w) - tr((X'WX)^-1 X'W^2 X), the exact expectation divisor for uncorrelated homoskedastic errors under kernel weights, rather than by sum(w) - 3 (which is correct only for 0/1 weights).",
]

upstream_implementations_observed = []

test_sources = [
 "crates/antecedent-stats/src/response.rs",
 "crates/antecedent-estimate/src/response/tests.rs",
 "crates/antecedent-stats/tests/local_quadratic_reference.rs (normal-equation solve, influence identities and exact plug-in variance unbiasedness)",
]

[method_review]
status = "reviewed_with_limits"
scope = "fit_local_quadratic and its public wrappers in stats/response.rs: the Gaussian-kernel weighted local quadratic level, slope and curvature, the plug-in standard errors, the linearised influences and robust covariance, and the Silverman normal-reference bandwidth. Not the bias-corrected variant, the Satterthwaite degrees-of-freedom helper, bandwidth optimality, or simultaneous bands."
assumptions = ["The regression function is smooth enough that a local quadratic with the chosen bandwidth has acceptable smoothing bias; the point estimate carries that bias and no correction.", "The plug-in standard error assumes uncorrelated homoskedastic errors; the robust standard errors from the influences relax homoskedasticity but treat the bandwidth as fixed and ignore smoothing bias.", "Kernel weights localise the fit and are not inverse-variance weights; the sandwich uses them as such. Observation weights (summing to n) enter multiplicatively with the kernel and the plug-in variance assumes no further structure in them.", "The 1.06 sigma n^(-1/5) bandwidth is a default rule for a density estimate, not a regression bandwidth selector."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the product source and its numerical helpers and checked them against closed-form algebra and high-precision or exhaustive-enumeration references written for this review; no upstream implementation or test source was consulted or copied. The cited publications were not retrieved in this review: the correspondence is between the product code and the standard definitions those works state, so it is a code-versus-rule review with executing references, not a page-level reading of the papers."
redistribution = "Primary works are cited, not redistributed. The reference test is repository-authored (MIT OR Apache-2.0) with dense linear algebra written in the file; no upstream code or tests are imported."
limitations = "Three sampling positions at three bandwidths on a 40 to 60 point grid for the point estimate and the variance identity. The unbiasedness check is an exact expectation identity over unit-vector responses, so it establishes the residual divisor for uncorrelated homoskedastic noise but not coverage of intervals, the effect of smoothing bias, heteroskedastic or dependent errors, or the weighted-observation path. The consumers in the estimate crate (dose-grid functional and response curves) could not be re-run after the change because the working tree does not currently build (an unrelated Eq derive error in the query wire code); their SEs for fractional-weight windows will be smaller than before. Neither Fan et al. nor Silverman was re-read for this review."
sources = ["https://doi.org/10.1023/A:1003162622169", "https://doi.org/10.1201/9781315140919"]
findings_resolved = ["Defect fixed: the plug-in residual variance divided the weighted residual sum of squares by sum(w) - 3. For homoskedastic uncorrelated noise E[r'Wr] = sigma^2 (sum(w) - tr((X'WX)^-1 X'W^2 X)), which equals sum(w) - 3 only when every kernel weight is 0 or 1. With fractional Gaussian weights the old divisor overstated the level variance by 20 percent in a 40-point example (0.127 against the exact sandwich 0.106). The divisor is now sum(w) - tr((X'WX)^-1 X'W^2 X) and the fit refuses when it is not positive.", "Verified that the level, slope and curvature equal the solution of the kernel-weighted normal equations built and solved independently, and that an exact quadratic is recovered exactly at any bandwidth; verified that the level influences sum to zero and that their sum of squares is the robust variance and the covariance diagonal.", "Verified the Silverman factor (4/((d+2)n))^(1/(d+4)), which at d = 1 is 1.0592 sigma n^(-1/5), against its closed form (existing tests); the record's 1.06 is the rounded constant."]
record_sha256 = "925c1f6c6294bf6c7dc79b4b08f5cc2f047d33efc87d0cde03c08137ea60aae0"

