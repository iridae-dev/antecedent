# Additive independently consumed receipt and frozen-score nodes bind the actual producing
# snapshot/fit identity. Historical counts are inspectable records, not executable state.

[non_algorithm_review]
status = "justified_non_algorithm"
kind = "wrapper"
rationale = "Portable composed-result container: a typed directed graph of embedded or referenced nodes whose edges carry the Merkle digest of the upstream node. Each node is decoded by the verifier registered for its artifact kind: a standard verifier, or for the host-replayed fit, predictive chain-decision and sequential reliability kinds, a verifier the composition facade registers with its execution context. from_bytes rebuilds a bundle from its container and refuses it unless the recomputed edges equal the stored edges and the recomputed identity equals both the stored identity and the independently retained one. Cancellation and execution or admission budget refusals are reported at their own stages."
no_independent_algorithm = "Graph construction, digest recomputation and cross-edge fact comparison only; no estimator, interval or density appears in the module."
covered_by = ["composition.verifiers", "composition.provenance", "composition.multi_source"]
record_sha256 = "d50135c8a885de2c16f37bf83f7071d6df68108883323f53239300b0cde276d6"

