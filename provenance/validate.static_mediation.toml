[method_review]
status = "reviewed_with_limits"
scope = "refute_static_mediation in crates/antecedent-validate/src/mediation.rs for a fully observed, all-observed-population static linear mediation problem with one mediator and an exogenous covariate (T to M, T to Y, M to Y, Z to M, Z to Y): the placebo-mediator replicates (the mediator replaced by library noise, contrast mediated, null 0), the random-common-cause replicates (an independent covariate added to every mechanism regression, the query's own contrast, null the published estimate), the Bernoulli 80% row-subset replicates of the full suite, the twenty replicates and stream bases 0x1300_2000 + 100 r, 0x1300_4000 + r and 0x1300_5000 + r, the replicate mean and the two-sided normal p-value with alpha 0.05, and the binary-mediator range-overlap diagnostic (closed per-arm ranges, touching ranges overlap). The refits are estimate_static_mediation, whose arithmetic was reviewed in estimate.mediation.linear; this review recomputes them for the one-mediator model rather than citing that review, and relies on it for graphs with several or serial mediators."
assumptions = ["The refuters are repository-defined descriptive diagnostics (the record states thresholds are not calibrated test guarantees); this review checks the code against the stated definitions, not against any mediation-validity criterion.", "With a unit treatment contrast the total effect is c + a b, the natural direct effect c and the natural indirect effect a b, where a is the treatment coefficient in the mediator regression and b, c the mediator and treatment coefficients in the outcome regression.", "Perturbations are the library streams, regenerated by the test and asserted equal to the frozen ones."]
historical_exposure = "Historical author exposure cannot be independently established. This review read mediation.rs and wrote its own reference from the product-of-coefficients definition in exact rational arithmetic with a 60-digit erfc; no upstream implementation was consulted. The cited Baron and Kenny paper was not retrieved."
redistribution = "The reference script, frozen output and Rust test are repository-authored under MIT OR Apache-2.0; mpmath is not a product dependency. The cited paper is named, not redistributed."
limitations = "The Baron and Kenny paper was not retrieved (nothing downloaded, no local copy; it has no DOI recorded) and is not used as an oracle; the refuters do not implement its stepwise tests. The comparison covers five synthetic designs (offsets of 5e4 and 1e6, 11 of 64 rows treated, arm ranges that touch at exactly 1 and that miss by 1e-6), three requested contrasts and published estimates shifted by 0 and 0.5 so both verdicts occur, at 1e-7 relative on means and 1e-5 absolute on p-values. It covers one mediator; several mediators, serial mediators, missing values, weights, non-binary treatments and the Bayesian entry points are not exercised here. The placebo check cannot fail for a linear model by construction (its null is the mean of noise refits), so only its arithmetic is checked, not its power."
sources = ["https://mpmath.org/doc/1.3.0/", "https://docs.python.org/3/library/fractions.html"]
findings_resolved = ["The placebo, random-common-cause and subset replicates, their means, p-values and verdicts, the cheap/full report sets and the range-overlap diagnostic (including exactly touching and just-disjoint ranges) agree with the exact reference on every design and contrast. No defect found in the reviewed path."]
