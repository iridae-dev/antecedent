implementation_deviations = ["Both mechanism regressions and all perturbation refits retain the union of graph-derived baseline parents, with their normalized temporal lags. Treatment-induced intermediate covariates require a larger path model and are refused.", "Independent diagnostic suite: twenty Gaussian placebo-mediator and Gaussian random-common-cause refits. Placebo tests indirect effect against zero; RCC tests the requested contrast; full adds twenty contiguous 80-percent windows.", "Binary treatment additionally checks intersection of empirical mediator ranges. This necessary range check does not prove conditional positivity; continuous treatment has no binary overlap report.", "Replicate comparisons are descriptive robustness diagnostics, not calibrated causal-validity tests. Bayesian validation includes actual mechanism PPCs and full prior-grid refits; frequentist refuters do not themselves resample the Bayesian posterior."]
test_sources = ["crates/antecedent-validate/tests/temporal_mediation_refuter_reference.rs (exact-rational lag-aligned refits over gapped windows on library-RNG perturbations, 60-digit p-values, window-restricted mediator support)", "conformance/bayesian/temporal_mediation", "python/tests/test_posterior_moments.py"]

[method_review]
status = "reviewed_with_limits"
scope = "refute_temporal_mediation_with_gaps in crates/antecedent-validate/src/mediation.rs for the linear temporal mediation estimator on a series with missing time points: the lag-aligned design windows (treatment read h steps back, mediators and outcome now, covariate at its own lags, a window kept only when every read value is observed, gaps and multi-step restarts included), the placebo-mediator replicates (every mediator replaced by library noise with its validity kept, contrast mediated, null 0), the random-common-cause replicates (the first noise vector appended to every regression, the query's contrast, null the published estimate), the contiguous 80-percent window replicates of the full suite (rows outside the window physically dropped, windows rebuilt inside it), the twenty replicates and streams 0xF014_0000 + r, 0xF014_8000 + 100 r + j and 0xF015_0000 + r, the replicate mean and two-sided normal p-value with alpha 0.05, a non-unit treatment contrast, two mediators at treatment lag two, and the binary-treatment mediator-support diagnostic computed on the intact windows. The refits are TemporalMediationEstimator, whose arithmetic is reviewed in estimate.temporal_mediation; this review recomputes them with the refuter's own perturbations rather than citing that review. The perturbation and p-value half is the one reviewed for the static suite in validate.static_mediation."
assumptions = ["The refuters are repository-defined descriptive diagnostics (the record states they are not calibrated test guarantees); this review checks the code against the stated definitions, not against any mediation-validity criterion.", "With treatment contrast delta, the total effect is delta c from the reduced form, the direct effect delta c' and the mediated effect delta sum_j a_j b_j, where a_j is the treatment coefficient in the mediator regression, b_j and c' the mediator and treatment coefficients of the outcome regression; the reference checks the OLS identity c = c' + sum_j a_j b_j on every fit.", "The random common cause shares the placebo's first noise vector (one draw drives both refuters of a replicate); this is the code's stated design and is reproduced, not endorsed as statistically independent.", "Perturbations are the library streams, regenerated by the test and asserted equal to the frozen ones; the window start is derived in the script from the first uniform of its stream as floor(u (n - len + 1))."]
historical_exposure = "Historical author exposure cannot be independently established. This review read mediation.rs and wrote its own reference from the product-of-coefficients definition in exact rational arithmetic with a 60-digit erfc; no upstream implementation was consulted."
redistribution = "The reference script, frozen output and Rust test are repository-authored under MIT OR Apache-2.0; mpmath is not a product dependency. No paper is cited or redistributed."
limitations = "The record cites no paper and none was retrieved (nothing downloaded, no local copy); the method is not validated against any published mediation or falsification-test procedure, and the replicate p-value is the repository's normal approximation to a typical single replicate, not a published test. The comparison covers six synthetic designs (single gaps and a three-step restart in the treatment, one mediator, both outcome and covariate; two mediators at lag two with covariate lags 1 and 2 and a contrast of 2; a gapless series with the gap flag off; closed per-arm mediator ranges that touch at exactly one value; ranges that overlap on the raw series but are disjoint on the intact windows; a three-level treatment with no support report), three requested contrasts and published estimates shifted by 0 and 0.5 so both verdicts occur, at 1e-7 relative on means and 1e-5 absolute on p-values. Junk values are stored at missing points so a reader that bypasses validity would be caught. It does not exercise a gapped series refuted with the gap flag off (the adjusted entry point), more than two mediators, weights, the facade wiring, the mixture across graph atoms, or the Bayesian entry points; a window with fewer than four intact rows is a refusal that is not exercised here. The placebo and random-common-cause checks cannot fail for a linear model by construction (their nulls are the means of noise refits or the published number), so arithmetic is checked, not power. The support diagnostic is a necessary range check, not conditional positivity; a mediator constant over the windows reports a zero shared fraction."
sources = ["https://mpmath.org/doc/1.3.0/", "https://docs.python.org/3/library/fractions.html"]
findings_resolved = ["Defect fixed (failing first): the binary-mediator support report passed only when the shared fraction of the mediator range was positive, so per-arm ranges that touch at exactly one value (a non-empty closed intersection, the rule the static suite uses) were reported as failing with the message that the ranges are disjoint. The report now passes iff every mediator's closed per-arm ranges intersect; the shared fraction in the comparison column is unchanged.", "Placebo, random-common-cause and contiguous-window replicates, their means, p-values and verdicts, the cheap/full report sets, and the window-restricted mediator-support fraction (windows dropped by a gap in another variable do not widen the ranges) agree with the exact reference on every design and contrast."]
