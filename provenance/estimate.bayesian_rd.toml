# Strategy-table implementation id: estimate.bayesian_rd_local_linear
# (EstimatorId::BayesianRdLocalLinear, public name rd.bayesian_local_linear).
#
# The cited papers supply the sharp-RD estimand and the local-linear
# specification `Y ~ 1 + T + (R-c) + T(R-c)` inside a window around the cutoff;
# the frequentist counterpart is estimate.rd. The Bayesian layer on top of that
# design — independent zero-centered Normal coefficient priors, a plug-in residual
# variance, and equal-tailed posterior quantiles of the jump coefficient — is the
# repository's own conjugate Gaussian construction, not a procedure from either
# paper.
papers = [
 { title = "Identification and Estimation of Treatment Effects with a Regression-Discontinuity Design", doi = "10.1111/1468-0262.00183", sections = ["sharp RD identification of the jump at the cutoff"] },
 { title = "Regression Discontinuity Designs: A Guide to Practice", doi = "10.1016/j.jeconom.2007.05.001", sections = ["local-linear estimation on either side of the cutoff"] },
]

implementation_deviations = [
 "Unweighted rectangular window with a caller-declared symmetric bandwidth; no kernel weighting, data-driven bandwidth selection, or robust bias correction. Bandwidth comparisons are exposed only as an explicit sensitivity analysis (bayesian_rd_bandwidth_sensitivity).",
 "Posterior is the conjugate Gaussian posterior of the four local-linear coefficients under independent N(0, v prior_sd^2) priors, where v is the plug-in residual variance (prior_sd is in residual standard deviations, so rescaling the outcome rescales the posterior); v is the residual sum of squares of the posterior-mean fit over n - 4, so a tight prior inflates it; the residual variance is not given a prior and is not integrated out.",
 "Sharp assignment T = 1{R >= cutoff} is verified row by row and any mismatch is refused with rd_assignment_not_sharp; fuzzy RD is not estimated.",
 "Requires at least 12 in-window rows with at least 4 on each side; covariate-adjusted RD and manipulation, density, or continuity diagnostics are not provided.",
 "The staged route accepts only an unmodified mean outcome with the built-in conjugate model; transferred and custom priors are refused.",
 "The 300-replicate declared-law interval check is scoped to that local-linear Gaussian law and bandwidth; curved conditional expectations and other bandwidths inherit no guarantee.",
]

upstream_implementations_observed = []

test_sources = [
 "crates/antecedent-estimate/src/bayesian_rd.rs (in-module tests: local_linear_jump_recovers_known_truth_and_reports_bandwidth_sensitivity, non_sharp_assignment_is_refused)",
 "crates/antecedent/tests/bayesian_iv_rd_staged.rs (bayesian_rd_executes_staged_and_checks_bandwidth_conditioning, rd_posterior_intervals_calibrate_under_declared_local_linear_law)",
 "crates/antecedent/src/analysis/execute/bayesian_specialist_path.rs (model-scope refusals)",
 "conformance/estimate/bayesian_rd (synthetic known-truth fixture: true jump 2.5 at cutoff 0 with fixed bandwidth 0.8)",
 "python/tests/test_bayesian_estimator_lifecycle.py",
 "crates/antecedent-estimate/tests/bayesian_rd_reference.rs (exact 40-digit local-linear posterior of the jump for a wide and a tight prior, a narrow window and a shifted cutoff, and the residual-unit prior scale convention)",
]

[method_review]
status = "reviewed_with_limits"
scope = "fit_bayesian_sharp_rd (and the bandwidth and prior sensitivity wrappers, which only refit it) of crates/antecedent-estimate/src/bayesian_rd.rs: the sharp-assignment check T = 1{R >= c}, the rectangular window |R - c| <= h, the design (1, T, R - c, T (R - c)), the ridge-form posterior (X'X + I / prior_sd^2)^-1 X'y of the four coefficients, the plug-in residual variance v = RSS / (n - 4) of that posterior-mean fit with floor 1e-12, the covariance v (X'X + I / prior_sd^2)^-1, the Normal marginal of the jump coefficient and its seeded draws and equal-tailed 95% interval. Not the choice of bandwidth, fuzzy designs, kernel weighting, bias correction or coverage of the interval."
assumptions = ["Within the window the conditional mean is linear on each side of the cutoff with homoskedastic errors; the variance is a plug-in, not integrated out.", "The coefficient prior is N(0, v prior_sd^2 I): prior_sd is in units of the plug-in residual sd, so the posterior is equivariant to rescaling the outcome. The posterior mean equals that of the Normal-Inverse-Gamma model with the same coefficient scale.", "Accuracy is stated against the exact 40-digit posterior of the jump."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the product source named in its scope, including the numerical helpers it calls, and compared results with a 40-digit exact local-linear ridge-posterior reference written for this review; no upstream implementation or test source was consulted or copied. The cited publications were not retrieved in this review: the correspondence is between the product code and the standard definitions those works state, verified numerically, not a page-level reading of the papers."
redistribution = "Primary works are cited, not redistributed. The reference script and its frozen output are repository-authored (MIT OR Apache-2.0); mpmath is used only to produce the frozen values and is not a product dependency. The script declares its inline script metadata but is not run in a locked, isolated environment and is not wired into any gate; its output is frozen in the JSON file and compared by the test."
limitations = "Four cases of 180 to 240 rows with a curved mean (so the local-linear model is misspecified): a wide prior (20), a tight prior (0.5), a narrow window and a shifted cutoff, 300,000 draws. The window count is asserted equal, the mean within five Monte Carlo standard errors and the interval ends within 3% of the posterior sd. The rescaling test uses the same seed so the draws are the same standard normals. Not exercised: windows at the 12-row minimum, near-collinear windows (singular designs are refused by the relative-pivot test in the module), heteroskedasticity, and coverage under the declared law beyond the staged 300-replicate check. The plug-in variance comes from the penalised fit, so a tight prior inflates it (0.065 against 0.038 for prior 0.5 against 20 on the reference data) and the interval widens with the prior; that is stated, not corrected."
sources = ["https://doi.org/10.1111/1468-0262.00183", "https://doi.org/10.1016/j.jeconom.2007.05.001", "https://mpmath.org/doc/1.3.0/"]
findings_resolved = ["The documentation described prior_sd as the absolute standard deviation of each coefficient, but the posterior covariance is v (X'X + I / prior_sd^2)^-1, which is the posterior of a prior with covariance v prior_sd^2 I: the scale is in residual standard deviations. The module, field and record deviation text now state the convention and that the plug-in variance is the residual variance of the posterior-mean fit; a test pins both.", "The ridge-form mean, the n - 4 divisor, the window membership at the bandwidth and the Normal interval agree with the exact reference."]
