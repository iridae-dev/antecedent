implementation_deviations = [
 "The recorded functional is a baseline-group average of an inverse-density kernel-smoothed intervention, not the potential outcome at an exact dose and not a generalized-propensity-score regression.",
 "Exchangeability, a correct supplied dose density, local positivity, and consistency with no interference are caller-declared. None is tested from the table.",
 "A fixed group-to-dose policy is identified only as that kernel-window contrast against its reference. The policy doses must have been fixed before these outcomes.",
 "The variance is the sum of squared linearization scores of the weighted-mean ratio, with group fractions held fixed, multiplied by m/(m-1) where m is the smallest group size. The factor is a finite-sample convention, not a derived correction; pointwise intervals are published only above fixed support floors.",
]

