# Strategy-table implementation id: estimate.transport.trial_bayesian_bootstrap
# (EstimatorId::TransportTrialBayesianBootstrap, public name
# transport.trial_bayesian_bootstrap).
#
# Trial-to-target Bayesian bootstrap. The frequentist cell
# (estimate.trial_to_target) evaluates Dahabreh et al.'s inverse-odds-weighted
# contrast for the nonparticipant target from caller-supplied selection and
# treatment probabilities. This route keeps that identified functional and the
# supplied probabilities fixed, and for each draw puts a shared Dirichlet(1,...,1)
# law on the observed trial rows, re-averaging the per-row inverse-odds scores
# under those weights. Dahabreh supplies the functional and Rubin the row-weight
# law; applying the Bayesian bootstrap to the trial rows only, conditional on the
# supplied probabilities, is the repository's own construction.
papers = [
 { title = "Extending inferences from a randomized trial to a new target population", doi = "10.1002/sim.8426", sections = ["Section 4.2: identification for a target population of nonparticipants", "Section 5.2, equation (2): inverse-odds weighting"] },
 { title = "The Bayesian Bootstrap", doi = "10.1214/aos/1176345338", sections = ["Dirichlet(1..1) observation weights"] },
]

implementation_deviations = [
 "Only the empirical trial outcome law is resampled: the trial and target sample sizes, target rows, supplied selection odds, and supplied treatment probabilities are held fixed, so uncertainty from fitting either probability model or from sampling the target is not propagated.",
 "The inverse-odds (IOW) estimator only; the paper's doubly robust DR1 estimator is not resampled on this route.",
 "Requires the Dahabreh-compatible identification certificate anew, at least two draws, and observed trial units in both treatment arms; binary treatment contrasts only.",
 "Draws are Horvitz-style, normalized by the fixed target count rather than by the weighted sum of target rows, matching the frequentist cell. In the block form the weights are normalised over the trial rows, so a Dirichlet law on blocks holds only when every block has the same number of trial rows; otherwise the draw is a ratio of block-weighted sums.",
 "The interval is a model-conditional pushforward; the two-row fixture checks exact moments and there is no coverage record under arbitrary target shift.",
]

upstream_implementations_observed = []

test_sources = [
 "crates/antecedent-estimate/src/transport.rs (in-module test: bayesian_trial_transport_matches_two_row_dirichlet_law)",
 "crates/antecedent/tests/bayesian_trial_transport.rs (bayesian_trial_transport_matches_two_source_row_dirichlet_moments)",
 "conformance/estimate/bayesian_trial_transport (closed-form fixture: with two equal-probability trial rows the normalized Dirichlet(1,1) mass is Uniform(0,1) and the draw is 8U-2, mean 2 and variance 16/3)",
 "conformance/response/trial_transport (independent paper-equation fixture for the underlying inverse-odds functional)",
 "crates/antecedent-estimate/tests/trial_bayesian_bootstrap_reference.rs (exact Dirichlet simplex-spline and exponential-ratio distribution functions for free, equal-block and unequal-block draws)",
]

[method_review]
status = "reviewed_with_limits"
scope = "trial_to_target_bayesian_bootstrap and trial_to_target_bayesian_bootstrap_blocks of crates/antecedent-estimate/src/transport.rs: the per-trial-row score sign (1 - s) / s * Y / arm with arm = e for treated and 1 - e for control rows, the shared Dirichlet(1, ..., 1) (normalised exponential) row weights, the draw (m / n_t) sum_i pi_i score_i with m trial rows and n_t target rows, and the block form in which every trial row of a contiguous block of table rows shares one weight. Not the selection and treatment probability models (supplied), the identification certificate check beyond its refusal, the frequentist inverse-odds contrast, the doubly robust estimator, or coverage."
assumptions = ["The selection and treatment probabilities are supplied and held fixed; only the empirical trial outcome law is resampled, with the trial and target sample sizes fixed.", "The draw is normalised by the fixed target count (Horvitz style), matching the frequentist cell, and is a model-conditional pushforward, not a posterior over the probability models.", "In the block form the normaliser is the sum of the block weights over the trial rows, so with unequal trial counts per block the draw is a ratio of block-weighted sums, not a Dirichlet over blocks."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the product source named in its scope and compared results with exact distribution functions written for this review (trial_bayesian_bootstrap_reference.py): the Hermite-Genocchi simplex-spline law of a Dirichlet linear form, and the partial-fraction law of a ratio of exponential-weighted sums, both cross-checked by simulation inside the script; no upstream implementation or test source was consulted or copied. The cited publications were not retrieved in this review: the correspondence is between the product code and the standard definitions those works state, verified numerically, not a page-level reading of the papers."
redistribution = "Primary works are cited, not redistributed. The reference script and its frozen output are repository-authored (MIT OR Apache-2.0); mpmath only produces the frozen values and is not a product dependency. The script declares its inline script metadata but is not run in a locked, isolated environment and is not wired into any gate; its output is frozen in the JSON file and compared by the test."
limitations = "Three cases, 200,000 draws each: eight trial rows with distinct scores (free weights), four equal-count blocks, and four unequal-count blocks (1, 2, 3 and 1 trial rows). Each draw sample's mean (where closed form) is within five Monte Carlo standard errors, its variance within 3%, and its empirical distribution function within five binomial standard errors at nine points of the exact law. Not exercised: more than eight trial rows, ties among scores (the divided-difference form needs distinct scores; ties are a measure-zero refinement), extreme selection odds, and any coverage under target shift. The cited publications were not retrieved."
sources = ["https://doi.org/10.1002/sim.8426", "https://doi.org/10.1214/aos/1176345338", "https://mpmath.org/doc/1.3.0/"]
findings_resolved = ["No numerical defect was found: the draw law matches the exact Dirichlet law of the weighted score sum for free weights and for equal-count blocks, and the exact exponential-ratio law for unequal-count blocks.", "The module and record describe the block form as a Dirichlet law on blocks; that is exact only for equal trial counts per block. The record deviation text now states the ratio form for unequal counts."]
