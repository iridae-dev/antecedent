# Strategy-table id: identify.randomized.design (IdentifierId::RandomizedDesign).
# The graph is schema only. Identification is the caller-declared assignment
# mechanism, recorded in checked_randomized::randomized_identification.
# `papers = []` is deliberate (see provenance/README.md): the route records the caller-declared
# assignment mechanism as the identifying statement (randomization-based design argument going
# back to Neyman 1923 / 1990 translation). It derives no functional from a graph and estimates
# nothing here; the paper text was not retrieved.
papers = []

implementation_deviations = [
 "No graph search. The identifier stamps consistency, positivity, and the design's known-assignment statement; it does not derive an identifying functional from a DAG.",
 "NoInterference is recorded for unit-randomized designs and omitted for cluster randomization and switchback, which record their own partial-interference or no-carryover statements instead.",
 "Wald complier and one-sided treatment-on-treated queries add exclusion, monotonicity, a nonzero first stage, and, for treatment on the treated, one-sided noncompliance. Those statements are declared, not tested.",
 "A requested Fisher exact test records the sharp null as an estimation assumption. It is not the identifying claim for the interval estimators.",
]

