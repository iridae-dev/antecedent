[method_review]
status = "reviewed_with_limits"
scope = "The four adjusted-p-value primitives in stats/fdr.rs, their conservative missing-test policy, and the explicit family/threshold behavior of threshold_scored_links and in_fdr_family. This is not a review of adaptive CI validity or complete discovery algorithms."
assumptions = ["Null p-values must be valid/super-uniform for the declared family. BH requires the joint assumptions of the cited independence theorem or the PRDS-on-true-nulls extension; positive pairwise correlation alone does not establish PRDS.", "BY uses the full harmonic factor for arbitrary dependence among valid p-values. Bonferroni and Holm rely on the union-bound/step-down argument and need no independence.", "A fixed declared family is assumed. Numeric agreement of adjusted values does not prove validity of data-dependent conditioning tests, selected families, causal identification or error-rate calibration of their callers."]
historical_exposure = "The original record listed no observed implementations; historical author exposure cannot be independently established. Current review inspected product source, primary-paper procedure/theorem passages and the retained public statsmodels API comparator; no upstream algorithm or test source was consulted or copied."
redistribution = "Primary papers are linked, not redistributed. The retained repository-authored comparator and deterministic p-value inputs remain MIT OR Apache-2.0; upstream dependencies remain isolated by the existing environment lock. Historical metadata and numeric outputs are unchanged."
limitations = "Five bounded p-value cases (ordinary, ties/boundaries, permutation, singleton and local empty contract), two declared lag-zero routing policies and existing invalid-input/unit checks. No general error control is established for adaptive discovery callers. When contemporaneous tests are left raw, correction of the lagged family does not establish FDR control for their union. The empty/invalid-input behavior is local policy, not an upstream numerical comparison. Calibration remains deferred."
sources = ["https://www.math.tau.ac.il/~ybenja/MyPapers/benjamini_hochberg1995.pdf", "https://www.math.tau.ac.il/~ybenja/MyPapers/benjamini_yekutieli_ANNSTAT2001.pdf", "https://www.ime.usp.br/~abe/lista/pdf4R8xPVzCnX.pdf", "https://www.jstor.org/stable/4615733", "https://www.statsmodels.org/v0.14.4/generated/statsmodels.stats.multitest.multipletests.html"]
findings_resolved = ["Repaired the missing Holm/Bonferroni primary trace to the original ordered-p scheme, theorem and union-bound discussion; retain the publisher stable identifier without inventing a DOI-registry verification.", "Verified the reverse cumulative minimum, harmonic factor, cumulative maximum and input-order restoration against the primary rejection rules and retained independent API values.", "Recorded invalid-test family preservation and the limited family corrected when contemporaneous tests are excluded; neither policy licenses adaptive/global discovery error control.", "Linked the actual executing external comparator and its original atol=1e-15/rtol=1e-13 assertions, rather than citing only generic unit tests."]
