implementation_deviations = [
 "The adjusted p-values invert the cited rejection rules: reverse cumulative minimum of m*p_(i)/i for BH (times H_m for BY), cumulative maximum of (m-i+1)*p_(i) for Holm, and m*p_i for Bonferroni; values are capped at one and restored to input order.",
 "Nonfinite or out-of-range p-values return NaN but remain in the family denominator as p=1 during adjustment. This fail-closed missing-test policy is repository-defined; it does not establish validity of the underlying p-values.",
 "The default temporal-discovery family excludes contemporaneous tests from adjustment; this is a pinned baseline compatibility policy, not part of the BH or BY procedures. Error control for the corrected lagged family does not establish control for its union with raw contemporaneous tests.",
]

