papers = [
 { title = "Causal Diagrams for Empirical Research", doi = "10.1093/biomet/82.4.669", sections = ["front-door criterion"] },
 { title = "The Moderator-Mediator Variable Distinction in Social Psychological Research: Conceptual, Strategic, and Statistical Considerations", doi = "10.1037/0022-3514.51.6.1173", sections = ["product-of-coefficients mediation"] },
]

implementation_deviations = [
 "Implements the front-door effect as a product of coefficients from linear mediator and outcome regressions rather than evaluating Pearl's nonparametric front-door functional.",
 "The causal interpretation therefore requires a linear, additive, no-interaction structural model in addition to the graphical front-door conditions; nonlinear mediator or outcome relations and treatment-mediator interactions are unsupported. Every result records this as the estimation-scope parametric restriction frontdoor.linear_path_product, and the estimator id is frontdoor.linear_two_stage; frontdoor.functional estimates the functional itself.",
 "HC1 and cluster small-sample factors are applied per stacked equation (n/(n-2) for each mediator regression, n/(n-2-k) for the outcome regression), not with the total stacked parameter count.",
 "Multiple mediators are handled as an additive sum of separate linear path products, not as a general joint-mediator front-door functional.",
 "The cited mediation paper does not specify this implementation's complete-case policy or stacked analytic uncertainty calculation.",
]

upstream_implementations_observed = [
 { project = "dowhy", exposure = "black-box comparison only" },
]

test_sources = [
 "independently generated synthetic SCM with U->T, U->Y unmeasured confounding and T->M->Y mediation (no direct T->Y edge), mirroring antecedent-identify's front-door criterion test fixture, with known structural effect through the mediator path",
 "conformance/estimate/frontdoor (known-truth recovery fixture with unequal path coefficients 0.4 and 5 and an uncentred treatment; SE checked against the closed-form delta-method SE; carries an unasserted recorded DoWhy run from the pinned baseline in parity/baselines/dowhy.toml)",
 "conformance/estimate/frontdoor_functional (exact binary table on which the product of coefficients converges to 0.3631 against an enumerated 0.315)",
  "crates/antecedent-estimate/tests/frontdoor_two_stage_reference.rs (80-digit stacked estimating equations for one to three mediators with HC0, HC1 and cluster meats)",
]

[method_review]
status = "reviewed_with_limits"
scope = "FrontDoorTwoStage::fit for continuous treatment and one or more continuous mediators without adjustment covariates: the per-mediator slope of the mediator on the treatment, the outcome regression on treatment and all mediators, the path-sum effect scaled by the treatment-level difference, and the analytic standard error from the stacked sandwich (block-diagonal bread, HC0, HC1 and cluster meats with the per-equation small-sample factors, delta-method gradient). Not the bootstrap, the identification of the front-door criterion, or the functional estimator."
assumptions = ["The front-door criterion and the linear, additive, no-interaction structure the product of coefficients needs (recorded on every result as frontdoor.linear_path_product) are taken as given.", "The per-equation small-sample convention (n/(n-p) for HC1 and G/(G-1) (n-1)/(n-p) for the cluster form, multiplying meat entry (r, s) by sqrt(f_r f_s)) is the product's documented convention; the reference applies it, it does not establish it."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the product source named in its scope, including the numerical helpers it calls, and compared results with definitions evaluated by executing references written for this review; no upstream implementation or test source was consulted or copied. The cited publications were not retrieved in this review: the correspondence is between the product code and the standard definitions those works state, verified numerically, not a page-level reading of the papers."
redistribution = "Primary work is cited, not redistributed. The reference script and its frozen output are repository-authored (MIT OR Apache-2.0); the script uses mpmath (BSD-3-Clause), imported at run time and not redistributed here. The script declares its inline script metadata but is not run in a locked, isolated environment and is not wired into any gate; its output is frozen in the JSON file and compared by the test."
limitations = "Four tables of 40 to 60 rows with one, two and three mediators, a treatment-level difference of one and two, and clusters of four and six rows, plus a table with offsets of 1e3 (treatment), 1e5 (mediators) and 1e6 (outcome). Effects and standard errors are asserted to 1e-9 relative, except the offsets table at 1e-7 and 1e-5: uncentred columns within 1e-5 of collinear with the intercept leave the least-squares residuals a conditioning-squared error of about 1e-6 relative that the standard error inherits. Homoskedastic, HC2, HC3 and multiway standard errors are refused by the product and are not examined; the bootstrap standard error is not examined. The reference script is not run in a locked, isolated environment and is not wired into any gate; its output is frozen in the JSON file and compared by the test."
sources = ["https://doi.org/10.1093/biomet/82.4.669", "https://mpmath.org/"]
findings_resolved = ["No defect found: the path-sum effect and the stacked HC0, HC1 and cluster standard errors equal the 80-digit reference for one, two and three mediators, with cross-mediator and cross-stage covariance and a treatment-level difference of two.", "Recorded limit: with the treatment, mediators and outcome carrying offsets of 1e3 to 1e6 against unit spread the standard error keeps about five digits (1.5e-6 relative error observed) because the design is not centred before the least-squares fit."]
record_sha256 = "478af3bcdfaa76a2b90b5348b3e25d65b91da7e0748212bd8ed120d54a4e541f"

