[non_algorithm_review]
status = "justified_non_algorithm"
kind = "derivation"
rationale = "Posterior mean of a cross-fitted score contrast under an independent normal prior at zero (Clustered namespace); the point is the mean of the cluster-DML score contrast and the frequentist interval is not reused."
no_independent_algorithm = "score_contrast_posterior forms the paired contrast, its mean and Bessel variance, and the normal-normal weight; the cross-fitted scores are produced by the covered estimator and consumed unchanged. posterior_mean.rs also holds the Dirichlet, ridge and Gaussian-kernel local-quadratic routes, which belong to other records."
covered_by = ["estimate.posterior_mean_kernel"]
derivation = "Normal likelihood for a mean with plug-in precision P = n / s2 and an independent N(0, tau^2) prior give posterior mean P / (P + 1 / tau^2) * mean = mean * n tau^2 / (n tau^2 + s2); checked against exact rationals in posterior_mean_reference.rs and in the route's own test."
