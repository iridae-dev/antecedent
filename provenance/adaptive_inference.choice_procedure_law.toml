# Exact law of a sequential categorical-choice procedure (stopping rule re-evaluated on the observed
# choice counts at every look) by dynamic programming over those counts, under a fixed truth or a
# Dirichlet prior predictive. Enumeration of a finite-state Markov process, the categorical sibling
# of adaptive_inference.procedure_law; no primary paper introduces this state recursion.
papers = []
implementation_deviations = [
 "Categorical choices only, at most 4 options, 24 looks and 65535 units; the state is the vector of choice counts, bounded by the same live-state and work limits as the Bernoulli procedure law, and a larger procedure is refused rather than approximated.",
 "The stopping rule is a posterior probability-best and expected-loss criterion on the Dirichlet posterior with a minimum enrolment; every element is declared and none is defaulted. The comparison band is the Bernoulli rules' threshold tolerance.",
 "The law is of the declared procedure under a hypothesized truth or the declared Dirichlet prior predictive only. It is not a bound over other truths, a coverage statement or a calibration claim; those stay closed until a coverage record attests the cell.",
]
