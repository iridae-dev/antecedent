assumptions = ["Choices are independent draws of one categorical law given the truth, or exchangeable draws of the Dirichlet prior predictive (a Polya urn).", "The stopping decision is a function of the observed counts and the look only.", "The law is exact for the declared procedure under the declared kernel and states nothing about other truths."]
