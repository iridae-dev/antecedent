[method_review]
status = "reviewed_with_limits"
scope = "categorical_treatment::fit_categorical_treatment and the vector_treatment least-squares and covariance engine it calls (fit_joint: normal equations, model-based, HC0, HC1, HC2 and HC3 covariances, contrast variances w'Vw, Wald omnibus), with the Holm adjustment over the level and pairwise family and the oriented minimum-step monotonicity statistic and its Bonferroni bound. Not the summary/replay routes beyond sharing the engine, the posterior form, the artifact encoding or any coverage or size of the tests."
assumptions = ["Linear conditional mean given the levels and the adjustment column and independent rows are taken as given; the p-values are asymptotic normal and chi-square and their finite-sample size is not claimed.", "Identification of the level effects as causal contrasts rests on the declared adjustment set and positivity, which are not tested."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the product source named in its scope, including the numerical helpers it calls, and compared results with definitions evaluated by executing references written for this review; no upstream implementation or test source was consulted or copied. The cited publications were not retrieved in this review: the correspondence is between the product code and the standard definitions those works state, verified numerically, not a page-level reading of the papers."
redistribution = "Primary work is cited, not redistributed. The reference script and its frozen output are repository-authored (MIT OR Apache-2.0); the script imports mpmath (BSD-3-Clause) at run time and does not redistribute it. The script declares its inline script metadata but is not run in a locked, isolated environment and is not wired into any gate; its output is frozen in the JSON file and compared by the test."
limitations = "Eight tables of 7 to 25 rows with four levels (three in the smallest, two rows per level there), one adjustment column, an outcome offset of 1e8 and an adjustment within 1e-4 of a level indicator; covariances model-based, HC0, HC1, HC2 and HC3; coefficients, the covariance block, contrast estimates and standard errors are asserted to 1e-10 relative (1e-6 for the near-collinear adjustment, 3e-6 for the 1e8 offset), p-values to 1e-6 relative to a 50-digit reference. The product forms (X'X)^-1 explicitly from the normal equations without centring the outcome, which costs about 4e-7 relative in the standard errors at a 1e8 offset with unit noise; that loss is not removed. The reference does not exercise a rank-deficient adjustment, weights or the replay summaries. Test size and power of the omnibus and monotonicity tests are unmeasured."
sources = ["https://mpmath.org/"]
findings_resolved = ["Documentation defect repaired: the record stated the monotonicity p-value as min(1, 2 Phi(.)), but the product (and its docs) use the Bonferroni factor m, the number of adjacent steps, which equals 2 only for three levels; the record now states min(1, m Phi(T)) and the reference verifies m Phi(T) with m = 3 for four levels.", "No numerical defect found: coefficients, full covariance blocks, contrasts, Holm adjustment across the declared family, the omnibus statistic and its chi-square p-value and the monotonicity statistic match the exact rational and 50-digit reference for all five covariance estimators, with an unbalanced design, a reference level inside the list, a 1e8 outcome offset and a near-collinear adjustment."]
