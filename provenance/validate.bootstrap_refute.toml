papers = [
 { title = "Bootstrap Methods: Another Look at the Jackknife", doi = "10.1214/aos/1176344552", sections = ["IID nonparametric bootstrap resampling construction"] },
]

implementation_deviations = [
 "Uses 200 seeded IID complete-case row resamples by default and refits the repository's linear-adjustment ATE with nested bootstrap disabled.",
 "Forms percentile endpoints by rounding (half away from zero) the positions (1-level)/2 and (1+level)/2 times (m-1) into the sorted replicate estimates rather than interpolating empirical quantiles, then reflects each endpoint about the replicate mean (mean - scale (mean - lo), mean + scale (hi - mean), scale 1 for an iid bootstrap and the circular fixed-b factor for block bootstraps).",
 "The verdict asks whether the full-sample refit of the same least-squares estimator (not the published estimate, which can be a shrunk Bayesian mean) lies inside the interval; this repository-defined stability gate is not itself a bootstrap coverage theorem or placebo refutation.",
 "One-series temporal designs resample circular blocks of lag-aligned rows with a dependence block length and a fixed-b widening, and a composed refitter needs lag-aligned evaluation or the check is not applicable; these paths go beyond the cited iid construction.",
]

upstream_implementations_observed = []

test_sources = [
 "crates/antecedent-validate/tests/bootstrap_refute_reference.rs (exact-rational replicate refits on library-RNG resamples, percentile positions, tie rounding, verdict)",
 "crates/antecedent-validate/src/bootstrap_refute.rs unit tests",
 "bootstrap_refute_contains_original_ate against conformance/validate/refuters (crates/antecedent-validate/src/tests.rs)",
]
[method_review]
status = "reviewed_with_limits"
scope = "BootstrapRefute::refute in crates/antecedent-validate/src/bootstrap_refute.rs for a static, all-observed, linear-adjustment problem (the prepared-design iid path) and its coverage_report: n row draws with replacement from the stream 0xA7E0_0009_0000 per replicate, the least-squares treatment coefficient of each replicate, the sorted-replicate percentile positions round((1-level)/2 (m-1)) and round((1+level)/2 (m-1)), the mean-centred interval, the full-sample-refit containment verdict, the reported mean, width and replicate count, and the refusal of a singular resample. Not the circular-block temporal paths, the gapped-series path, the composed refitter path, the ATT/ATC table-rebuild path, or the least-squares solver itself (the linear adjustment estimator's own record)."
assumptions = ["The checked quantity is the repository-defined statement that the full-sample refit lies inside a percentile interval of its own bootstrap replicates; this review checks the code against that statement, not the statement against any coverage theory.", "The treatment effect is the coefficient of the treatment in the least-squares regression of the outcome on an intercept, the treatment and the adjustment covariates, for a unit contrast.", "Resample indices are the library stream's draws (unbiased_index over the complete-case rows), regenerated by the test from the same stream and asserted equal to the frozen indices."]
historical_exposure = "Historical author exposure cannot be independently established. This review read bootstrap_refute.rs and wrote its own reference from the stated definition in exact rational arithmetic over the supplied resample indices; no upstream implementation was consulted. The cited paper was not retrieved."
redistribution = "The reference script, frozen output and Rust test are repository-authored under MIT OR Apache-2.0; the script uses only the Python standard library. The cited paper is linked, not redistributed."
limitations = "The Efron paper was not retrieved for this review (nothing downloaded, no local copy); the iid resampling construction is checked against the repository statement of it, not against the paper. The comparison covers five synthetic designs (two adjustment covariates, offsets of 1e5 and 1e6, covariates correlated to about 1e-3, a continuous treatment, and a seven-row sample whose resamples can be singular) at replicate counts 11 to 51 and levels 0.1 to 0.95, including percentile positions exactly half-way between order statistics, at 1e-8 relative. The verdict is not asserted when the full-sample refit lies within 1e-9 relative of an interval end point. It does not examine the coverage of the interval, the block-bootstrap paths a temporal problem takes, a Bayesian posterior-mean stand-in, the ATT and ATC paths, missing values or sampling weights (whether a weighted fit is resampled with its weights is not examined). A failed (singular) resample makes the whole iid refutation error; the test pins that behaviour rather than endorsing it."
sources = ["https://doi.org/10.1214/aos/1176344552", "https://docs.python.org/3/library/fractions.html"]
findings_resolved = ["The percentile positions (including half-way ties rounded away from zero), the mean-reflected interval, the reported mean and width, the replicate count and the containment verdict agree with the exact-rational reference on every design, replicate count and level; the resample indices equal the library stream. No defect found in the reviewed path."]
