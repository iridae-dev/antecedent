implementation_deviations = [
 "The local score is the Laplace-noise log likelihood at the least-absolute-deviations fit (iteratively reweighted least squares, 60 sweeps from unit weights) with the scale set to the mean absolute residual, penalised by (|Pa| + 2) / 2 times ln n; it is a pseudo-likelihood under a declared heavy-tailed noise family, not the non-Gaussian likelihood the cited paper analyses, and it is misspecified when the noise has another non-Gaussian shape.",
 "Order MCMC over this score is a pseudo-posterior over DAGs: it orients an edge only to the degree the noise is non-Gaussian and carries no calibration claim. Exact enumeration, structure MCMC and the exact marginals refuse the score.",
]

