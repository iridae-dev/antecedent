implementation_deviations = [
 "The clusters are the units of the Bayesian bootstrap: a Dirichlet(1..1) weight vector over all clusters restricted to an arm is that arm's posterior, and a draw is the contrast of the two arms' weighted means of the scaled cluster totals.",
 "Complete cluster randomization identifies the total-effect contrast between (0,0) and (1,1); partial interference and the exposure mapping are declared, not tested, and the prior identifies nothing.",
 "Unlicensed and uncalibrated: no coverage record covers the credible interval.",
