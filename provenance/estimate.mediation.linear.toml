[method_review]
status = "reviewed_with_limits"
scope = "estimate_static_mediation in crates/antecedent-estimate/src/static_mediation.rs for a fully observed table: row selection, one least-squares regression of every node on its graph parents (and any extra covariates), the total and mediator-blocked direct effect propagated in topological order, and the total, direct, indirect and mediated contrasts built from them, for any number of mediators in series and in parallel and any treatment contrast. The reference evaluates the structural equations across worlds. Not the Bayesian variant, the bootstrap standard error beyond its existing tests, the identification certificate, nonlinear or interacting mechanisms, or temporal mediation."
assumptions = ["Linear additive structural equations with independent disturbances on the supplied DAG, no treatment-mediator interaction, no hidden confounding among the observed nodes beyond what the graph encodes, and a DAG whose mediated paths all pass through declared mediators; under these the regression coefficients are consistent for the structural coefficients and the path propagation gives the natural effects.", "The indirect estimate is total minus direct, the total natural indirect effect; it equals the pure natural indirect effect the identifier certifies only without interaction, which the additive mechanisms impose and which is recorded as the mediation.no_interaction assumption.", "Exact recovery in the executing reference relies on disturbances that are orthogonal in sample to their regressors; for ordinary data the estimator carries ordinary regression sampling error."]
historical_exposure = "Historical author exposure cannot be independently established. This review read the product source and wrote its own reference: the structural equations are evaluated in two worlds (treatment at the active level with mediators at their control-world values, and both worlds natural) rather than by summing path products, on data built so that least squares returns the structural coefficients to rounding. No upstream mediation implementation was consulted."
redistribution = "The reference is repository-authored under MIT OR Apache-2.0 and runs inside the crate unit tests. The cited book is linked by title and not redistributed."
limitations = "The cited book chapters were not read for this review: no local copy was available and nothing was downloaded, so the correspondence of the natural-effect definitions to the text is not established; the definitions used are the standard cross-world ones stated in the test. The executing evidence is one graph (two mediators in series and parallel, one confounder, five nodes, deliberately non-topological ids) with one treatment contrast of two units, exact-fit data and no missing rows; it checks the algebra and the parent-coefficient alignment, not finite-sample accuracy (covered only by the older 20,000-row single-mediator test at tolerance 0.02), interaction, a mediated path through an undeclared descendant of a mediator (the estimator treats such a node as direct; the identifier must refuse it, which is outside this review), masked rows or the bootstrap interval."
sources = ["Pearl, Causality: Models, Reasoning, and Inference (title as listed in papers; no identifier is recorded and the text was not read)"]
findings_resolved = ["The only exact-value test used one mediator and a loose 0.02 tolerance at 20,000 rows, so a mis-aligned parent coefficient, a wrong treatment contrast or a mishandled second mediator could have passed. Added an exactly recoverable five-node graph with serial and parallel mediators, a confounder of the second mediator and outcome, node ids in non-topological order and a contrast of two: total 7.16 and direct 0.8 from cross-world evaluation are reproduced by every contrast (total, direct, natural direct, natural indirect, mediated) to 1e-9.", "Read the propagation: the treatment is seeded with the contrast, each node sums coefficient times parent effect in the same parent order the design matrix used, mediators are blocked on the direct track, the intercept column is excluded from the coefficients, and a rank-deficient or under-determined regression is refused. No defect was found; no estimator code was changed."]
