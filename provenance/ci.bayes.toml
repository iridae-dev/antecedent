test_sources = [
 "crates/antecedent-stats/src/ci/bayes.rs unit tests",
 "conformance/discovery/bayesian_ci (exercised via crates/antecedent-stats/tests/bayesian_ci_oracle.rs)",
]

[method_review]
status = "reviewed_with_limits"
scope = "BayesFactorCi and PosteriorDependenceCi (the Zellner g-prior Bayes factor on the partial regression coefficient, its logistic posterior of independence) and PosteriorPredictiveCi (conjugate Normal-Inverse-Gamma null refit, replicate draws and add-one Monte Carlo tail probability) in crates/antecedent-stats/src/ci/bayes.rs, for continuous columns and a linear-Gaussian conditioning set. Not a review of the residualisation helper beyond how it is called, of the discrete or kernel CI tests, or of how discovery algorithms use the posterior probability."
assumptions = ["Linear-Gaussian model: a partial correlation test only detects conditional dependence that survives linear residualisation, and a non-linear or non-Gaussian dependence can be missed or mis-priced.", "Bayes factor: flat priors on the intercept and Z coefficients, the scale prior 1/sigma^2, a unit-information Zellner prior (g = n) on the coefficient of x, and equal prior model odds. The posterior probability of independence therefore depends on this prior (Lindley's paradox: the implied boundary grows with ln n) and is not an error rate.", "The reported p_value of the Bayes-factor tests is the posterior probability of independence, not a frequentist p-value; it is not uniform under independence and must not be multiplicity-adjusted.", "Posterior predictive test: the null replicates come from the NIG posterior of the null model fitted to the same data, with weakly informative prior (shape and scale 1e-3, coefficient precision 0.01), so the tail probability is a posterior predictive p-value and is conservative in general; Monte Carlo error is of order sqrt(p(1-p)/(n_sims+1))."]
historical_exposure = "Historical author exposure cannot be independently established. The earlier record disclosed no upstream implementation observed. The retained fixture was produced by an external clean-room SciPy/NumPy harness whose script was not retained; this review wrote a separate numerical integration of the g-prior model of its own and consulted no upstream implementation or test source."
redistribution = "The quadrature check is repository-authored under MIT OR Apache-2.0 and runs inside the crate's unit tests. The frozen fixture and its recorded package pins are unchanged. Gelman et al. is linked by DOI, not redistributed."
limitations = "Bayesian Data Analysis (chapters 6 and 7) was not re-read in this review: the g-prior Bayes factor is a library-specific model choice that the book does not specify, so it was verified by deriving it independently rather than against the text, and the posterior-predictive checking idea is only loosely tied to chapter 6. The g-prior literature was not consulted. The posterior-predictive fixture comes from an external harness whose generator is not retained (the fixture records this), so that comparison reproduces only within the recorded Monte Carlo band and cannot be regenerated here. The quadrature covers three small configurations (n = 9, 14 and 16 with up to two conditioning columns); it checks the closed form, not the numerical residualisation at large n or near collinearity beyond the existing determined-by-Z tests. No claim about decision quality, false-positive rate of discovery that thresholds the posterior probability, or sensitivity to the prior scale. Calibration remains deferred."
sources = ["https://doi.org/10.1201/b16018"]
findings_resolved = ["Replaced reliance on a restated formula with an independent derivation check: the log Bayes factor of the implementation equals, to 1e-5, a brute-force quadrature over the intercept-and-Z-projected model, integrating beta (standardised against its g-prior scale) and ln sigma^2 on a grid in log space, for three designs with 0, 1 and 2 conditioning columns. The grid marginals use the stated priors directly (flat nuisance parameters, 1/sigma^2, beta | sigma^2 ~ N(0, g sigma^2 / x'x)), so a mistake in the algebra of the closed form, the residual dimension n-1-|Z| or the constant -1/2 ln(1+g) would fail it; the existing oracle test recomputes the same closed form from an independent OLS and so cannot detect such a mistake.", "Verified from the code that the posterior probability of independence is logistic(-log BF), that block-shuffle significance is refused, that a variable determined by the conditioning set is treated as exactly independent (r = 0) rather than failing or reporting spurious dependence, and that the statistic is symmetric in x and y.", "Verified the posterior-predictive path against the NIG conjugate update (posterior scale beta_n = beta_0 + (y'y - m'X'y)/2, replicate draw sigma^2 ~ InvGamma(alpha_n, beta_n) and beta ~ N(m_n, sigma^2 Lambda_n^-1) through the Cholesky back-substitution, re-standardised replicates, the add-one tail probability and the run-keyed random stream), and recorded that the existing frozen comparison to the external harness is statistical, not exact.", "Corrected nothing in the implementation: no logic defect was found. Code edit: a new unit test in bayes.rs. Recorded the prior-dependence of the posterior probability, the posterior-predictive conservativeness and the unretained external generator as limits."]
