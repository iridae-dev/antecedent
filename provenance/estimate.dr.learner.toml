[method_review]
status = "reviewed_with_limits"
scope = "DrLearner::fit and DrLearner::fit_pointwise_profiles in crates/antecedent-estimate/src/dr.rs for a linear outcome learner, an unpenalised logistic treatment learner, a linear final stage and a recorded fold assignment: the marginal effect and its influence standard error (relying on the cross-fitted AIPW score reviewed in estimate.dml: cached_aipw_nuisances and aipw_marginal_from_nuisance), and this route's own arithmetic, namely the ordinary-least-squares regression of the pseudo-outcome on the adjustment design over the trim-retained rows, the fitted CATE at every row, its HC0 sandwich standard error (linear_cate_pointwise_se), and the exact-support profile estimate and standard error (pointwise_profile_results). Not a penalised or nonlinear final stage, the cluster-DML publication, the population interval, or the weighted HC0 sandwich beyond the replication identity."
assumptions = ["Unconfoundedness given the adjustment set and positivity are identification assumptions taken as given.", "The estimand of the fitted CATE is the best linear projection of the pseudo-outcome on the adjustment variables; it is the CATE only when the effect is linear in them, and the HC0 standard error is conditional on the pseudo-outcome (first-stage error is treated as second order by Neyman orthogonality, not examined).", "Independent rows; trimming membership is held fixed."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the product source named in its scope, including the numerical helpers it calls, and compared results with definitions evaluated by executing references written for this review; no upstream implementation or test source was consulted or copied. The cited publications were not retrieved in this review: the correspondence is between the product code and the standard definitions those works state, verified numerically, not a page-level reading of the papers."
redistribution = "Primary work is cited, not redistributed. The reference script and its frozen output are repository-authored (MIT OR Apache-2.0); the script uses mpmath (BSD-3-Clause), imported at run time and not redistributed here. The script declares its inline script metadata but is not run in a locked, isolated environment and is not wired into any gate; its output is frozen in the JSON file and compared by the test."
limitations = "Ten finite tables of 24 to 90 rows with one to two covariates and 2, 3 or 5 folds with a shuffled assignment: a trim, a clip that binds, both together, an outcome offset of 1e7, a covariate offset of 1e3 at scale 250, two covariates correlated at 0.99999 and a three-valued covariate with exact support in both arms. The marginal effect is asserted to 1e-6 and standard errors to 1e-5 (1e-4 for the per-row HC0 values) relative, because the logistic IRLS stops near a score norm of 1e-8; the CATE to 1e-5 of its largest magnitude. Only the linear final stage has a reference: a ridge, forest or boosted final stage returns no standard error by design and its fit is not examined. A sampling-weighted fit is checked by the identity that an integer weight equals row replication for the effect and the CATE; the weighted HC0 sandwich, which differs from the replicated one by design, has no independent reference here. Cross-fit plans other than the recorded assignment are not examined, and the nuisance learners other than least squares and unpenalised logistic regression are outside this review. The reference script is not run in a locked, isolated environment and is not wired into any gate; its output is frozen in the JSON file and compared by the test."
sources = ["https://doi.org/10.48550/arXiv.2004.14497", "https://mpmath.org/"]
findings_resolved = ["The marginal effect and standard error, the final-stage CATE at every row (on the retained rows after a trim) and its HC0 standard error, and the exact-support profile estimate and standard error equal the 60-digit fixed-fold reference on every case, including a trim, a binding clip, a covariate offset of 1e3 and nearly collinear covariates.", "An integer sampling weight reproduces row replication for the marginal effect and every CATE, and the case is built so the weights change the answer, so the declaration is neither ignored nor mis-scaled."]
record_sha256 = "3b8e7445e1229db07d3db61bc36f9211bb96b958d9aea3a89258840a398a6f7d"

