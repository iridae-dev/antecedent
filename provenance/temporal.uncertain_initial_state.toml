rationale = "An exact finite mixture over a supplied target initial-state law: the response is the target-mass-weighted sum of the conditional responses of each initial state, with each state's response itself a finite sum over the intermediate history."
no_independent_algorithm = "temporal_initial_state.rs validates a law (distinct states, finite non-negative masses summing to one), forms R(s0) = sum_l P(l | s0, a1) E[y | s0, a1, l, a2] from the covered temporal fit and sums mass times response; no sqrt, ln, exp or solve."
covered_by = ["identify.id"]
derivation = "With initial-state law pi over S0 and conditional response R(s0), the target response is sum_s0 pi(s0) R(s0) (the law of total expectation over S0); the test evaluates it by hand to 0.421 and compares to 1e-12, with each contribution's mass and response checked separately."
