implementation_deviations = [
  "Just-identified single-instrument Wald ratio Cov(Y_t,Z_(t-lag))/Cov(T_t,Z_(t-lag)), with an intercept and homoskedastic standard error, after dropping the first lag rows. No exogenous adjustment covariates or multiple-instrument system is estimated.",
  "Lag-aligned rows are treated as independent; there is no HAC or serial-dependence correction. Relevance, exclusion, exogeneity and the structural-effect interpretation must hold at every period; the time ordering supplies none of those premises.",
  "The configured first-stage-F refusal is a numerical weak-instrument screen, not a weak-IV-robust confidence procedure. At least eight aligned finite rows are required. Exact zero residual variance can produce zero standard error and infinite first-stage F.",
]

test_sources = [
 "crates/antecedent-estimate/src/lagged_instrument.rs",
 "crates/antecedent/tests/temporal_lagged_instrument_route.rs",
 "python/tests/test_temporal_lagged_instrument.py",
 "crates/antecedent-estimate/tests/lagged_instrument_wald_reference.rs (40-digit lag-aligned Wald effect, first stage, standard error and F for three series, and the weak-instrument threshold boundary)",
]

[method_review]
status = "reviewed_with_limits"
scope = "fit_lagged_instrument of crates/antecedent-estimate/src/lagged_instrument.rs: the lag alignment (instrument at t - lag, treatment and outcome at t, rows t = lag .. n - 1), the just-identified Wald ratio Cov(Y, Z) / Cov(T, Z), the structural intercept, the first-stage slope and intercept, the reduced-form outcome slope, the homoskedastic standard error sqrt(RSS_s / (m - 2) Szz / Szt^2) and the first-stage F statistic, with the weak-instrument refusal rule (a finite F below the threshold refuses, a threshold of zero accepts). Not fit_lagged_instrument_posterior (the reduced-form ratio posterior of the same module, which is reviewed with the Bayesian lagged-instrument record), exclusion or exogeneity, serial dependence, or the facade route."
assumptions = ["Relevance, exclusion and exogeneity of the lagged instrument hold at every period and are declared by the caller; none can be tested from a just-identified fit.", "Aligned rows are treated as independent: the standard error is homoskedastic and has no HAC or serial-dependence correction.", "The first-stage F threshold is a numerical screen, not a weak-instrument-robust confidence procedure."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the product source named in its scope and compared results with a 40-digit multiprecision Wald, first-stage and standard-error reference written for this review (lagged_instrument_wald_reference.py); no upstream implementation or test source was consulted or copied. The cited publications were not retrieved in this review: the correspondence is between the product code and the standard definitions those works state, verified numerically, not a page-level reading of the papers."
redistribution = "Primary works are cited, not redistributed. The reference script and its frozen output are repository-authored (MIT OR Apache-2.0); mpmath, where used, only produces the frozen values and is not a product dependency. The script declares its inline script metadata but is not run in a locked, isolated environment and is not wired into any gate; its output is frozen in the JSON file and compared by the test."
limitations = "Three series (70, 90 and 40 rows; lags 1, 3 and 2; first-stage F 153, 18 and 0.84) with a confounded treatment: effect, intercept, first stage, reduced form, standard error and F agree to a relative 1e-9 to 1e-10, and the F threshold is shown to refuse just above the reference F and accept just below it. Not exercised: lags that leave fewer than eight rows (refusal only by existing tests), an instrument with an exactly zero covariance, perfect first stages beyond the existing hand-derived cases, and any coverage. The cited publication was not retrieved."
sources = ["https://doi.org/10.1515/9781400829828", "https://mpmath.org/doc/1.3.0/"]
findings_resolved = ["No numerical defect was found: alignment, Wald ratio, intercept, first stage, reduced form, homoskedastic standard error and first-stage F agree with the multiprecision reference, including a weak first stage and a three-step lag.", "The weak-instrument refusal compares a finite F strictly below the threshold, as documented; the boundary agrees with the reference F to 1e-9 on both sides."]
