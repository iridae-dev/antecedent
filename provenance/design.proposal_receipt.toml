  "python/tests/test_proposals.py",
]

[non_algorithm_review]
status = "justified_non_algorithm"
kind = "wrapper"
rationale = "Per-proposal receipt binding an identification repair and a design ranking by identities and digests, with re-identification on arrived data. The receipt's rank is the count of strictly better candidates under the order verified-sufficient studies first, then the ranking's own rank, so an insufficient study never outranks a sufficient one; verification recomputes it from the two artifacts. The fixture pins the rule with hand-derived values: the sufficient 20 USD study (net value 1/20) gets rank 0 although the insufficient 5 USD study has the larger net value 3/40 and the ranking itself places it first, which gets rank 1. Rank order inside a sufficiency group follows the ranking's rank and is not independently pinned, and no all-insufficient or tied-rank case is exercised."
no_independent_algorithm = "Digest binding and re-invocation of the repair and identifiers; no numerics of its own."
covered_by = ["design.identification_repair", "design.evsi"]
