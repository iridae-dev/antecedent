implementation_deviations = [
  "Derived in-repo from the conjugate Gaussian algebra; not the reproduction of a published procedure, so no guarantee is inherited from any paper.",
  "The posterior is exact and Gaussian with iid draws; it is NOT a non-conjugate sampler. There is no MCMC, so the effective sample size equals the draw count and no R-hat exists. Unknown noise variance, non-Gaussian likelihoods and MCMC are not provided by this row.",
  "The noise variance of every source is declared and treated as known, so a credible interval from this engine would not account for estimating sigma^2.",
  "The outcome mechanism is a polynomial basis of declared degree 1 to 6 in the certified covariates, with treatment-covariate interactions and an optional population-varying block that never interacts with treatment; a varying treatment effect is structurally impossible to declare. At degree one the model equals the joint Bayesian engine, which the tests use only as a labelled regression cross-check between two Antecedent paths, not as an external oracle.",
  "Overlap is a conservative axis-aligned covariate box check of the target against each source, not a density-ratio bound. Sources must be independent samples with disjoint units. Prior mass never changes structural identification, which is the supplied certificate.",
  "Historical source candidate artifacts retain unmeasured standing. Whole-method calibration completed at5c76724f for the frozen scoped construction; the separate normal measured envelope requires current scalar records and exact original source replay. Current main-source replay, reviewed nonnumerical equivalence and attestation pass; exact scoped normal-wheel producer and fresh consumer acceptance pass.",
