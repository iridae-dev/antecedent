# papers = [] is an explicit judgment, not an unfilled field. The engine
# (crates/antecedent-estimate/src/learned_joint_transport.rs) fits through the
# antecedent-learn hook (crates/antecedent-learn/src/bayesian_basis_regression.rs:
# PolynomialBasis and KnownVarianceBasisRegression), which is the textbook conjugate
# Normal linear model with a Gaussian prior and known noise variance over a polynomial
# basis: posterior precision P0 + Z'Z / sigma^2 and the matching mean, with exact iid
# Gaussian draws. That result is classical Bayesian linear regression (see
# provenance/transport.joint_bayesian.toml for the general references), but no
# theorem or section number of any reference was read and verified for this record, so
# nothing is cited here rather than implying theorem inheritance. The joint
# source-target construction (invariant effect block, population-varying blocks that
# never interact with treatment, posterior of the target-covariate-averaged effect) is
# original engineering on the existing transport certificate.
