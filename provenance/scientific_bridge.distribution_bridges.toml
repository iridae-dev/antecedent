[method_review]
status = "reviewed_with_limits"
scope = "Source review of the fixed and trial-pairs sampling branches in bridge_distribution.rs, exact scalar set and weighted joint outcome images, weighted joint affine posterior intervals, whole-refit trial percentile intervals and the numerical replay and threshold decision of these carriers. Earlier typed bridge arithmetic and predictive surrogate validation are documented in their existing method records."
assumptions = [
  "Each retained validation row is one independently sampled trial with exact stated surrogate and terminal treatment effects. In the independent design the source trials are separately sampled by declaration; the code cannot prove independence. The shared design independently rederives and checks each source centroid against the corresponding validation-pairs resample.",
  "The trial-level conditional mean is modeled as a line and the interval targets the terminal mean evaluated at the source population surrogate mean. Trial-pairs resampling refits this line and the source mean in each successful full procedure. Any out-of-range input or inadmissible required fit refuses the procedure.",
  "Identified-set input is a closed scalar interval of compatible effects in the retained coordinate. Joint outcome and posterior columns are aligned and represent the named measures under their source premises. The operations preserve pairing but do not independently certify the source study or posterior.",
]
historical_exposure = "This review read the listed Rust implementations and their executing fixture sources and derived the numerical comparisons from linear least squares, finite weighted laws and direct endpoint transformation. It did not copy upstream code. Historical author exposure is not established. The Hyndman–Fan publication page was consulted for the quantile reference."
redistribution = "The method fixtures and implementations are repository-authored. Linked literature is not redistributed."
limitations = "This was a source review. The central release runner owns numerical execution and any repeated-experiment receipt. The whole-trial oracle computes centered least squares independently but uses the same defined bootstrap index stream, as needed to compare row-for-row. The shared line at its own centroid equals the terminal centroid algebraically; the nonlinear reference squares the resulting per-refit mapped centroid as a separate compiled stage. The source-fixed calibration designs have bounded support, nominal level 0.95, exactly 399 refits and equal numbers of source and validation trials when independent. No general guarantee is claimed for different numerical designs, estimated trial-level effect noise, subject-level surrogate effects, or the threshold decision's sampling error."
sources = ["https://doi.org/10.1214/aos/1176344552", "https://robjhyndman.com/publications/quantiles/"]
findings_resolved = [
  "Reviewed the four exact-byte readers on StoredBridgeImage. Each binds the supplied bytes before running the existing reader. The portable replay fixture admits the exported bytes, rejects substituted bytes before decoding, and checks the program and numerical result identities independently.",
  "Checked decreasing and constant scalar maps, weighted multivariate row mapping with same-row covariance, exact posterior atom mass, and independent and shared source bootstrap formulas against the existing numerical references.",
  "Added cancellation checkpoints during the original generation or regeneration of the shared trial source. Scoped confidence publication to the explicit measured design, including the source declaration and observed support, instead of matching only a generic array shape.",
  "The trial coverage lookup requires an exact measured sample size for the matching source law and design. It reports the repeated study denominator of all attempts, including refusals. A stale boundary record cannot publish a below-nominal measurement.",
  "The numerical readout binds the independently reconstructed endpoints, mapped refits and threshold decision. When current coverage is unavailable, a historical carrier reports the verified numerical result with a nominal sampling reading. New publication and export still require a current receipt.",
  "Retained bytes are admitted before manifest, section and source parsing. The continued lease covers restored inputs and their compiler encoding, and the numerical result's readout has a separate quote. Standalone and bundle replay preserve resource and cancellation stops.",
]
