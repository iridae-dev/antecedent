implementation_deviations = [
  "Conditions on a complete supplied left history starting at a declared empty origin. Constant nonnegative baselines and exponential decay rates are fixed by the declaration except for the fitted baselines and branching masses.",
  "Simulation accepts any branching matrix with a checked positive subinvariance witness. Fixed-decay maximum likelihood searches the nonnegative domain with a strict source-column cap, a narrower convex subset.",
  "The recursive-refit forecast refits each simulated complete training window. It conditions each future draw on the actual history. A refit failure refuses the aggregate. This is neither a posterior draw nor evidence of real-world forecast accuracy.",
  "A conditional world response is driven by exogenous, paired arrivals through drift inputs. A separate half-step recorder preserves the established SDE execution lane and its item fingerprints. Grid maxima and indicators have discrete observation semantics.",
  "Future-study integration enumerates the binary signal on finite weighted simulated continuations. Actual updates use the conditional timestamp likelihood over a disjoint window and retain event excitation across the cutoff.",
  "Finite-horizon direct offspring is α(1 - exp(-β H)). Lifetime descendants are the column of (I - A)^{-1} - I, which removes the initiating event counted by the resolvent. Horizon descendants integrate the linear filter ODE and are not the resolvent of the horizon-discounted branching matrix.",
  "The marked kernel is finite-rank on declared prototype features. Its fit projects onto a uniform reproduction cap, a convex sufficient condition for spectral radius below one and generally stricter. Declared marked parameters are checked with the prototype branching matrix.",
  "The immigrant diagnostic agrees only when a declared alternative moves the horizon-specific direct mass by at most a caller-supplied tolerance and neither fit is weakly identified or on its stability cap. Agreement is a robustness check on two conditional intensities, not an identification result. Release-time offspring are a conditional scenario under an agreed diagnostic.",
  "An agreed horizon direct mass may cross the parameter-intervention bridge when the functional is direct_offspring and the map is identity or affine. The evidence is the provenance of an accepted discovery that orients the exposure into the outcome. A reverse, symmetric, confounded, or unoriented discovery edge refuses. A singular Gram, a lead, a symmetric kernel, or an active stability cap refuses before the bridge. Descendants are not carried as a mean. Release actions are one added event now, later, or under a different mark. A shock excluded from the outcome leaves as a lag-count query and does not return an excitation coefficient. The observation study sets release_information only for the catalog kernel the bridge kept.",
