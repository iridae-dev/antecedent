# One certified cyclic model admitted as a single node of a feed-forward composition. The module
# compares a supplied certificate with the one the model yields, binds the model by an integrity
# digest, and refuses cycles among components and self-citing evidence chains. It does not solve,
# invert, sample or certify. papers = [] is an explicit judgment: the two cyclic-model works that
# define the rho(|K|) < 1 family and the solvability theory are what the certificate cited here
# refers to, but neither is implemented in this module (the section notes of the earlier record
# said so) and neither was retrieved in this review.
papers = []

implementation_deviations = [
 "Composition among components stays feed-forward. A cycle among components is refused, and a provenance chain that cites itself is refused. The next attempt is to wrap the cyclic model as one CyclicComponent with an explicit solve contract and to keep its source evidence outside that chain.",
 "Admission requires an admitted ρ(|K|) < 1 family certificate that equals the certificate the supplied model yields, and at least one certifying-evidence id. The component stores the model order and a digest of its coefficients and intercept, and compilation refuses a model that does not match. This module does not form a free-block inverse and does not issue a new certificate.",
 "The component's own source id is not evidence that its solution holds. A source id that appears in the certifying evidence is refused.",
 "The module does not sample, and it does not inherit unique solvability, the simple-SCM certificate, or physical stability.",
]

