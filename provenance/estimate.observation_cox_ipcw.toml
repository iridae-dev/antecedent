# Cox supplies the proportional-hazards model and conditional likelihood.
# The tie and baseline-hazard arithmetic below is stated explicitly and checked
# against the pinned survival oracle; the citation does not certify that extension.
papers = [{ title = "Regression Models and Life-Tables", doi = "10.1111/j.2517-6161.1972.tb00899.x", sections = ["Section 2: proportional-hazards model and conditional likelihood"] }]
implementation_deviations = ["Correct log-linear proportional censoring hazards conditional on declared numeric covariates are required; independence is not inferred.", "Right censoring and sign-reversed left censoring only; no conditional delayed entry, interval censoring, truncation, or joint response intervals.", "Observed-row survival below the configured floor is refused, not clipped; singular and nonconvergent models have no marginal fallback.", "Tied censoring events use the Breslow approximation: each group contributes sum(eta_event) - d*log(sum_risk exp(eta)); its cumulative baseline-hazard jump is d/sum_risk exp(eta), and weights use exp(-H0(time-)*exp(eta)). These formulas are exercised by the survival oracle. Cox's cited likelihood section alone supplies no tied-event or IPCW theorem, and no uncertainty from estimating the censoring model is claimed here."]
upstream_implementations_observed = [{ project = "survival", exposure = "black-box comparison only" }]
test_sources = [
 "conformance/response/conditional_ipcw",
 "crates/antecedent-stats/src/cox_ipcw.rs",
 "crates/antecedent-stats/tests/cox_ipcw_reference.rs (40-digit Breslow partial-likelihood fit with 50 tied times, baseline limits, conditional censoring survival and inverse weights)",
]

[method_review]
status = "reviewed_with_limits"
scope = "cox_ipcw and cox_breslow of crates/antecedent-stats/src/cox_ipcw.rs: the Cox partial likelihood with Breslow handling of tied failures maximised by damped Newton steps on standardised covariates, the coefficients mapped back to the caller's units, the Breslow cumulative baseline hazard at the covariate means with its left and right limits, the conditional censoring survival exp(-Lambda0(t-) exp(eta)) just before each time, the inverse-survival weights for observed rows (zero for censored rows) and the floor refusal. Not the estimator composition and data adaptors, the sign-reversal convention for left censoring, joint uncertainty, or checking the proportional-hazards model."
assumptions = ["The censoring hazard is log-linear and proportional given the declared numeric covariates; independence of censoring and outcome time given them is declared, not inferred.", "Tied failures use the Breslow approximation: each tie group contributes sum(eta) - d log(sum over the risk set of exp(eta)) and a baseline jump d / sum exp(eta).", "Observed-row survival below the floor is refused, not clipped; singular or nonconvergent models have no marginal fallback."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the product source named in its scope and compared results with a 40-digit multiprecision Newton maximisation of the Breslow partial likelihood with brute-force risk sets (cox_ipcw_reference.py); no upstream implementation or test source was consulted or copied. The cited publications were not retrieved in this review: the correspondence is between the product code and the standard definitions those works state, verified numerically, not a page-level reading of the papers."
redistribution = "Primary works are cited, not redistributed. The reference script and its frozen output are repository-authored (MIT OR Apache-2.0); mpmath, where used, only produces the frozen values and is not a product dependency. The script declares its inline script metadata but is not run in a locked, isolated environment and is not wired into any gate; its output is frozen in the JSON file and compared by the test."
limitations = "One design of 64 rows with 50 rows tied in time (a quarter-unit grid), a continuous and a binary covariate: Breslow coefficients, centre, 36 baseline jumps and left and right baseline limits agree to a relative 1e-7; censoring coefficients, survival before each time and weights agree to 1e-6 (the stopping rule of cox_ipcw is an absolute score tolerance of 1e-9, so its coefficients are not converged to machine precision). Not exercised: negative times (sign reversal), more than two covariates, separation (refused) and any coverage. The cited publication was not retrieved."
sources = ["https://doi.org/10.1111/j.2517-6161.1972.tb00899.x", "https://mpmath.org/doc/1.3.0/"]
findings_resolved = ["No numerical defect was found: the Breslow partial likelihood, its standardised-covariate solution mapped back to raw units, the baseline at the covariate means and its one-sided limits, and the inverse conditional censoring weights agree with the multiprecision reference on a heavily tied design.", "The floor refusal fires for a floor just above the smallest observed-row survival and does not clip."]
