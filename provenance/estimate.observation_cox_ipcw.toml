implementation_deviations = ["Correct log-linear proportional censoring hazards conditional on declared numeric covariates are required; independence is not inferred.", "Right censoring and sign-reversed left censoring only; no conditional delayed entry, interval censoring, truncation, or joint response intervals.", "Observed-row survival below the configured floor is refused, not clipped; singular and nonconvergent models have no marginal fallback.", "Tied censoring events use the Breslow approximation: each group contributes sum(eta_event) - d*log(sum_risk exp(eta)); its cumulative baseline-hazard jump is d/sum_risk exp(eta), and weights use exp(-H0(time-)*exp(eta)). These formulas are exercised by the survival oracle. Cox's cited likelihood section alone supplies no tied-event or IPCW theorem, and no uncertainty from estimating the censoring model is claimed here."]
