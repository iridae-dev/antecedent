# This module is Monte Carlo calibration-gate infrastructure, not a novel
# estimator: it re-simulates the SCMs already used by the estimators under
# test and checks that each estimator's own analytic/bootstrap SE (already
# cited in estimate.se.toml, estimate.aipw.toml, estimate.linear_adjustment.toml,
# etc.) produces nominal 95% CI coverage. No single paper introduces "simulate
# and check binomial CI coverage of a confidence interval" as a method; it is
# standard statistical practice, so `papers` is left empty rather than citing
# a paper for a technique that isn't algorithmic.
papers = []

upstream_implementations_observed = []

test_sources = [
 "in-crate #[ignore] calibration tests (crates/antecedent-estimate/src/calibration_coverage.rs), run via scripts/measure_calibration.sh: linear_adjustment (analytic + HC1), ipw_hajek (bootstrap + analytic), aipw, matching, wald_iv (homoskedastic + HC1), rd_sharp analytic CI coverage",
]

[non_algorithm_review]
status = "justified_non_algorithm"
kind = "wrapper"
rationale = "The coverage measurement harness: simulation cells that run an estimator's interval on seeded data-generating processes and count how often the truth is covered, reported as a rate with its Monte Carlo band."
no_independent_algorithm = "calibration_coverage.rs generates seeded data, calls each covered estimator and tallies coverage, interval length, mean standard error and the Monte Carlo SD of the point estimates; it estimates nothing itself. The tests are #[ignore] (run by the calibration gate), so this mapping carries no routinely executing assertion and states no coverage result."
covered_by = ["estimate.linear_adjustment", "estimate.propensity_weighting", "estimate.aipw", "estimate.iv_2sls", "estimate.rd", "estimate.distance_matching"]
