[non_algorithm_review]
status = "justified_non_algorithm"
kind = "derivation"
rationale = "Posterior mean of the per-row AIPW score table the learned-continuous fit already computed, under an independent normal prior at zero. No interval."
no_independent_algorithm = "learned_continuous_score_posterior is score_contrast_posterior with a zero control column, so it forms the table mean, Bessel variance and normal-normal weight; the scores come from the covered learned-continuous fit."
covered_by = ["estimate.posterior_mean_kernel"]
derivation = "Normal likelihood for a mean with plug-in precision P = n / s2 and an independent N(0, tau^2) prior give posterior mean P / (P + 1 / tau^2) * mean = mean * n tau^2 / (n tau^2 + s2); checked against exact rationals in posterior_mean_reference.rs and in the route's own test."
