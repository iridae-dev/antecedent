[method_review]
status = "reviewed_with_limits"
scope = "latent_project in crates/antecedent-graph/src/projection.rs: projecting a DAG onto an observed subset as a directed-bidirected ADMG, judged by whether the projected graph's m-separation statements over the observed nodes equal the DAG's d-separation statements. Not a review of projection_preserves_msep_sample, of conditioning or selection projection, or of projection from ADMGs, MAGs or PAGs, which are not implemented."
assumptions = ["The input is a DAG; latent nodes are the nodes not listed as observed, and every observed node is listed once.", "Projection edges: a directed edge for each directed path whose interior nodes are all latent, a bidirected edge for each pair of observed nodes reached from a common latent by latent-only directed paths.", "Equivalence is judged on separation statements among observed nodes only, using an oracle that restates the path definition independently of the product."]
