limitations = "The primary sources were not re-read in this review (no downloads were made and no copy was read from this environment); the definitions used by the reference are the standard textbook statements, so a mistake in how a record or this reference states a theorem would not be detected here. Exhaustive over four-node DAGs (all observed subsets, observed nodes in reverse order so projected ids differ from original ids) and a stride of the five-node DAGs (79 of 1024 order-compatible graphs, all observed subsets); the existing seeded path-enumeration and random comparisons on larger DAGs are not re-run as part of this review. Separation preservation is necessary but is not alone a proof that the edge set is the minimal projection. The paper cited by the record carries no recorded section locator; the construction is checked against the standard latent-projection definition. No claim about downstream identification or calibration. Calibration remains deferred."
