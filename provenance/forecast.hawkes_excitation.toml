  "Finite-horizon direct offspring is α(1 - exp(-β H)). Lifetime descendants are the column of (I - A)^{-1} - I, which removes the initiating event counted by the resolvent. Horizon descendants integrate the linear filter ODE with a fixed-step fourth-order Runge-Kutta scheme of at most 200000 steps and are not the resolvent of the horizon-discounted branching matrix. The same functionals of a marked kernel use the prototype branching matrix.",
