  "crates/antecedent-contract/tests/interface_adapters.rs",
]

[non_algorithm_review]
status = "justified_non_algorithm"
kind = "wrapper"
rationale = "Carries a measurement model established in one population to another under a declared invariance premise, with a receipt, and refuses differential, replicated and external-posterior routes that have nothing to carry."
no_independent_algorithm = "The module selects a source model, checks that every parameter the route uses is declared invariant, builds a canonical receipt digest and calls the supplied correction closure on the re-bound model; the only arithmetic in the file is inside its own tests, which compare the correction output to hand-computed rates (0.32/0.7, 0.47/0.65)."
covered_by = ["measurement.binary_misclassification", "measurement.classical_continuous_error", "measurement.probabilistic_categorical", "measurement.model_contract"]
