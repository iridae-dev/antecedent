# Carrying a measurement model (sensitivity/specificity, confusion matrix, error variance)
# established in a source population to a target population under a declared invariance premise.
# Selection-diagram invariance of a mechanism (here the measurement mechanism) is the cited
# premise; the correction entry points are existing code. No paper introduces this binding
# layer, so the citation is the premise only.
# papers = [] is an explicit judgment, read against crates/antecedent-estimate/src/measurement_transport.rs:
# the module checks a declared invariance premise against the parameters the model's route uses, re-binds the
# model to the target population and delegates every correction to the measurement records. It has no estimator
# of its own. The selection-diagram invariance premise it declares (Pearl and Bareinboim, External Validity,
# Stat. Sci. 2014) is a declaration here, never tested, and the paper was not retrieved in this review.
papers = []
implementation_deviations = [
  "Reviewed as a justified non-algorithm mapping by reading the module; the corrected value is whatever the covered correction record computes and its uncertainty is that record's, conditional on the premise",
  "Not an implementation of a published estimator. The route re-binds an existing model to the target population only when every parameter the model's route uses is declared invariant; it then runs the existing correction and returns it with a receipt.",
  "The invariance premise is declared and never tested; its uncertainty is not propagated (ParameterUncertainty::NotPropagated). The standard error a correction reports is uncalibrated and conditional on the premise, and no interval is issued.",
  "Differential error is a distinct declared case that carries nothing: only a model established for the target itself is used, and a missing target model refuses rather than pooling another population's rates.",
  "Replicated-measurement routes re-estimate error from the target's own replicates and an external latent posterior is bound to its source snapshot, so both are refused as having nothing to carry.",
]
upstream_implementations_observed = []
