papers = [
 { title = "Large Sample Properties of Matching Estimators for Average Treatment Effects", doi = "10.1111/j.1468-0262.2006.00655.x", sections = ["Covariate-space matching with M matches", "matching with replacement and donor-reuse counts"] },
 { title = "On the Failure of the Bootstrap for Matching Estimators", doi = "10.3982/ECTA6474", sections = ["bootstrap invalidity for fixed-number-of-matches NN estimators"] },
]

implementation_deviations = [
 "Averages the M nearest donors of each unit on the z-scored adjustment covariates (Euclidean, with replacement, ties to the lowest donor position) and applies the linear within-arm bias correction of estimate.distance_matching to the mean of the M donors. This is a separate numerical construction from one-nearest-neighbour matching: the point estimate, its bias and its variance change with M, so no coverage measured for estimate.distance_matching applies to it and its interval is measured by its own calibration design.",
 "The standard error is the Abadie-Imbens donor-reuse form for M matches, sigma^2 (n + sum_j (K_j / M)^2) / n^2 for the ATT and ATC and sigma^2 sum_j (1 + K_j / M)^2 / n^2 for the ATE, with sigma^2 estimated from the matched differences as Var(tau_i) / (1 + 1/M), the constant-effect homoskedastic pooled estimator. It is not the conditional-residual variance estimator of the paper: a heterogeneous effect inflates Var(tau_i), so the interval is conservative there, and the estimation of the bias-correction regression is not propagated. At M = 1 it equals the standard error of estimate.distance_matching bit for bit.",
 "With a caliper a unit is matched only when its M-th nearest donor is within it, so every matched unit averages exactly M donors; a donor arm with fewer than M rows is refused. The nonparametric bootstrap is not offered (inconsistent for fixed-M matching), and clustered, multiway and HAC standard errors are refused for the reasons recorded for estimate.distance_matching.",
 "The k-d tree search is exact: the M smallest (distance, donor position) pairs of an exhaustive scan, so the match set does not depend on the thread count or on the tree layout.",
]

upstream_implementations_observed = [
 { project = "dowhy", exposure = "none" },
]

test_sources = [
 "crates/antecedent-estimate/src/propensity/knn.rs (independent exhaustive-search oracle for the three-neighbour estimate, bias correction, caliper rule and donor-reuse standard error; one neighbour equals estimate.distance_matching bit for bit)",
 "crates/antecedent-estimate/tests/knn_matching_calibration.rs (knn_matching_interval_ci_coverage, a 95 percent coverage design at 10,000, 25,000 and 100,000 rows with eight covariates)", "crates/antecedent-estimate/tests/knn_distance_matching_reference.rs (exhaustive 60-digit M-nearest search for M of 2 to 5 with a caliper, duplicated tied rows, covariate units of 1e14 and a small table; effect, donor-reuse standard error and matched count for the ATT, ATC and ATE)",
]

[method_review]
status = "reviewed_with_limits"
scope = "KnnDistanceMatching::fit (via DistanceMatching::fit_with_matches) of crates/antecedent-estimate/src/propensity/knn.rs with the shared matching helpers of propensity/matching.rs and the donor-arm linear bias term of propensity/distance.rs that it calls: z-scoring, the M nearest donors by Euclidean distance with ties broken to the lowest donor position, the caliper applied to the M-th nearest donor (a distance equal to the caliper matches), the within-arm least-squares bias correction applied to the mean of the M donors, the matched effects for ATT, ATC and ATE, and the Abadie-Imbens donor-reuse variance for M matches (use count over M, noise Var(effect) / (1 + 1/M)). Not the single-neighbour estimator's own review (estimate.distance_matching, which this agrees with at M = 1 per the in-module equality test), the bootstrap (refused), sampling weights, the population-variance option, or the 95 percent coverage designs of the calibration test."
assumptions = ["Unconfoundedness given the adjustment covariates and positivity are identification assumptions taken as given; rows are independent.", "Matching is with replacement on the z-scored covariates, so every covariate counts equally whatever its units; the within-arm linear bias term is fitted on the donor arm.", "The variance is the constant-effect homoskedastic donor-reuse form for M matches, not the conditional-residual estimator of the paper; the record states this deviation.", "Accuracy is stated against an exhaustive 60-digit search."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the product source named in its scope, including the numerical helpers it calls, and compared results with an exhaustive 60-digit M-nearest-neighbour search and the M-match donor-reuse variance written from their definitions written for this review; no upstream implementation or test source was consulted or copied. The cited publications were not retrieved in this review: the correspondence is between the product code and the standard definitions those works state, verified numerically, not a page-level reading of the papers."
redistribution = "Primary works are cited, not redistributed. The reference script and its frozen output are repository-authored (MIT OR Apache-2.0); mpmath is used only to produce the frozen values and is not a product dependency. The script declares its inline script metadata but is not run in a locked, isolated environment and is not wired into any gate; its output is frozen in the JSON file and compared by the test."
limitations = "Seven tables of 24 to 60 units (two to three covariates) with M of 2, 3, 4 and 5: a plain case, a caliper of 0.8 on the z-scale (matched counts 8, 16 and 16 for ATT, ATC and ATE), duplicated rows so many donors tie in distance for M = 3 and 4, a covariate in units of 1e14, a three-covariate M = 5 case and a 24-row M = 2 case. The ATT, ATC and ATE effects agree to 1e-8 relative, the standard errors to 1e-6 relative and the matched counts exactly. The coverage of the interval is measured by its own calibration designs and not reproduced here. Not exercised: sampling weights, the population-variance option, a donor arm with fewer than M rows (refused by the module), many covariates and near-collinear covariates (covered for M = 1 by the single-neighbour reference). The cited publications were not retrieved."
sources = ["https://doi.org/10.1111/j.1468-0262.2006.00655.x", "https://doi.org/10.3982/ECTA6474", "https://mpmath.org/doc/1.3.0/"]
findings_resolved = ["No defect was found: the M nearest donors with the lowest-position tie rule, the M-th-neighbour caliper, the bias correction on the donor mean and the M-match donor-reuse variance agree with the exhaustive reference for every target."]
