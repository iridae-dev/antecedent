# A named functional (level, derivative or contrast) of a randomized-dose response
# curve from the Gaussian-kernel local quadratic kernel of antecedent-stats (see
# provenance/stats.response.local_polynomial.toml), with per-dose Kish effective
# sample size labels and a heteroskedasticity-robust sandwich standard error from the
# linearized influences. DOIs and section or chapter numbers are omitted: they were
# not resolved for this record, and no theorem of the sources is inherited.
papers = [
  { title = "Local Polynomial Modelling and Its Applications (Fan and Gijbels, Chapman and Hall, 1996)", sections = ["local polynomial fitting by kernel-weighted least squares, with the fitted coefficients giving the regression function and its derivatives (construction only; chapter and section numbers not re-verified for this record)"] },
  { title = "A Heteroskedasticity-Consistent Covariance Matrix Estimator and a Direct Test for Heteroskedasticity (White, Econometrica 48(4), 1980)", sections = ["the heteroskedasticity-robust sandwich variance, applied here to the linearized influences of the local fit (construction only; no theorem inherited)"] },
  { title = "Simple and Honest Confidence Intervals in Nonparametric Regression", doi = "10.3982/QE1199", sections = ["worst-case bias of a linear smoother over a class with a bounded derivative; the folded-normal critical value of the bias-aware interval (used by estimate_dose_grid_bias_aware)"] },
  { title = "Survey Sampling (Kish, Wiley, 1965)", sections = ["effective sample size of unequal weights, 1/sum(w_i^2) for normalized weights, used as the per-dose support criterion (construction only; section number not re-verified for this record)"] },
]

implementation_deviations = [
  "The fitted object is the Gaussian-kernel local quadratic smoother at a caller-declared fixed bandwidth that must lie in a caller-declared range; it is never data-selected here, so the claim is about the smoother's m_h, and the smoothing bias m_h - m is neither estimated nor included in any interval. Fan and Gijbels' bias and variance asymptotics are not applied.",
  "The pointwise normal interval uses a sandwich standard error with calibration unmeasured: the nominal level 0.95 is not a coverage claim. Coverage is allocated (cov.dose_response.randomized_dose.frequentist.l95.pointwise_local_quadratic_level, _derivative, _contrast) and not collected. The simultaneous band is a different claim and is closed (dose_grid.simultaneous_band_closed).",
  "Randomization of the dose is a caller attestation; no graph is re-derived and an observational dose is refused. Rows are treated as independent; clustered, serial or linked rows are outside the row.",
  "Support is judged per requested dose: outside the observed dose range, or Kish effective sample size below a caller-declared minimum (at least 3), is labelled and refused, never extrapolated.",
  "A requested dose is labelled Supported by the Kish effective size of its Gaussian weights against the declared floor (at least 3), but the underlying local quadratic additionally refuses a window whose kernel weight sum is 3 or less (its residual scale is not estimable): a window can be labelled Supported and still be refused at the fit with dose_grid.insufficient_local_weight. The refusal is typed, never silent.",
  "Exactly one named functional is evaluated per call, each with its own claim flag; the measured numerical residual of the local solves is reported and is not a bound on estimation error.",
  "estimate_dose_grid_bias_aware is a separate entry on the same row: under a caller-declared bound on the absolute third derivative of m it adds the worst-case smoothing bias bound of the linear smoother (M/6 times the sum of |l_i| |D_i - d|^3, which treats the Taylor remainders at the rows as independent and so is conservative; for a contrast, the sum of the two doses' bounds) to each interval through the folded-normal critical value, and builds a simultaneous band whose half-width is a Gaussian multiplier sup-t critical value times the standard error plus that bias. The sealed artifact keeps the band closed; calibration stays unmeasured.",
]

