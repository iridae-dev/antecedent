# Robins (1986) is the origin of the g-computation substitution principle, but
# its actual content is iterated g-computation for survival analysis with
# time-varying confounders affected by earlier treatment (the healthy-worker
# survivor effect). `prediction.rs:42-113` does none of that: it fits one
# lag-1 OLS equation once and clamps the intervened column for a one-shot
# plug-in into a static fitted equation — no iteration, no confounders
# affected by prior treatment. `sections` below is scoped to disclaim the
# iterated/time-varying machinery this module does not implement. Pearl's
# *Causality* is added as the more literal match for the do-operator /
# truncated-factorization semantics that "clamp then evaluate" actually is.
papers = [
 { title = "A new approach to causal inference in mortality studies with a sustained exposure period—application to control of the healthy worker survivor effect", doi = "10.1016/0270-0255(86)90088-6", sections = ["g-computation substitution principle only — this module does not implement the paper's iterated g-formula for time-varying, treatment-affected confounders"] },
 { title = "Causality", citation_note = "Previously recorded title and bibliographic detail: Causality: Models, Reasoning, and Inference", doi = "10.1017/CBO9780511803161", sections = ["do-operator / truncated factorization (single-shot intervention-and-predict)"] },
]

implementation_deviations = [
 "This is a one-equation OLS prediction utility over caller-supplied lagged parents, not a fitted longitudinal g-formula, full structural equation model, or identified causal estimator.",
 "Intervening replaces every included lag of the selected parent by one common level in the fitted one-step equation; effects are not recursively propagated through future states or mediating variables.",
 "No explicit prediction horizon, sustained or dynamic treatment regime, treatment-confounder feedback, residual simulation, or multi-equation system is supported.",
 "No uncertainty is returned. The Robins citation is conceptual provenance for intervention prediction, not a derivation of this estimator.",
]

upstream_implementations_observed = [
 { project = "tigramite", exposure = "black-box comparison only" },
]

test_sources = [
 "crates/antecedent-estimate/src/prediction.rs unit test `intervene_and_predict_batch` (lag-1 linear SEM, batch predict under do())",
 "crates/antecedent/tests/context_effects.rs",
 "conformance/context/prediction_smoke",
 "crates/antecedent-estimate/tests/temporal_linear_predictor_reference.rs (40-digit lag-aligned least squares and held-level batch predictions for two lags of the held variable)",
]

[method_review]
status = "reviewed_with_limits"
scope = "TemporalLinearPredictor::fit and predict_conditional of crates/antecedent-estimate/src/prediction.rs: the lag alignment of a target and caller-listed lagged parents (rows t = max_lag .. n - 1), the ordinary least-squares coefficients [intercept, parent_0, ...], and the batch prediction in which every lag of one held variable is set to a level while every other column keeps its observed value, evaluated on the same aligned rows. Not identification, adjustment-set validity, the relation between the output and an interventional mean (the module states it is a conditional prediction, not do(.)), uncertainty (none is returned), or the facade's identified temporal paths."
assumptions = ["The output is the conditional expectation E[target_t | listed lags, held variable = level] under the linear fit; it equals an interventional mean only if the listed columns are a valid adjustment set, the relation is linear and no other listed column is a descendant of the held variable, none of which is checked.", "Holding a variable sets every one of its listed lag columns to the same level; effects are not propagated through future states.", "Rows are used as given; serial dependence does not enter the coefficients."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the product source named in its scope and compared results with a 40-digit multiprecision least-squares fit and held-level evaluation written for this review (temporal_linear_predictor_reference.py); no upstream implementation or test source was consulted or copied. The cited publications were not retrieved in this review: the correspondence is between the product code and the standard definitions those works state, verified numerically, not a page-level reading of the papers."
redistribution = "Primary works are cited, not redistributed. The reference script and its frozen output are repository-authored (MIT OR Apache-2.0); mpmath, where used, only produces the frozen values and is not a product dependency. The script declares its inline script metadata but is not run in a locked, isolated environment and is not wired into any gate; its output is frozen in the JSON file and compared by the test."
limitations = "One 64-step three-series design with the target regressed on x(t-1), x(t-2) and z(t-1) (two lags of the held variable and one other column): coefficients and the 62 aligned predictions at three levels agree to a relative 1e-9, and holding z instead leaves both x lags observed. Not exercised: missing values (the policy path), a single lag, irregular sampling, and any claim that the prediction is an interventional mean (the in-module confounded-series test shows it is not in general). The cited publications concern iterated g-computation and the do-operator and are not what this utility implements, as the record states; they were not retrieved."
sources = ["https://doi.org/10.1016/0270-0255(86)90088-6", "https://doi.org/10.1017/CBO9780511803161", "https://mpmath.org/doc/1.3.0/"]
findings_resolved = ["No numerical defect was found: the lag alignment, the least-squares coefficients and the held-level prediction (all lags of the held variable replaced, others observed) agree with the multiprecision reference.", "The record already states that this is a one-equation conditional prediction and not a g-formula; the review confirms the arithmetic matches that narrower description and nothing more."]
