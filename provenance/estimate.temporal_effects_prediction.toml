# Robins (1986) is the origin of the g-computation substitution principle, but
# its actual content is iterated g-computation for survival analysis with
# time-varying confounders affected by earlier treatment (the healthy-worker
# survivor effect). `prediction.rs:42-113` does none of that: it fits one
# lag-1 OLS equation once and clamps the intervened column for a one-shot
# plug-in into a static fitted equation — no iteration, no confounders
# affected by prior treatment. `sections` below is scoped to disclaim the
# iterated/time-varying machinery this module does not implement. Pearl's
# *Causality* is added as the more literal match for the do-operator /
# truncated-factorization semantics that "clamp then evaluate" actually is.
papers = [
 { title = "A new approach to causal inference in mortality studies with a sustained exposure period—application to control of the healthy worker survivor effect", doi = "10.1016/0270-0255(86)90088-6", sections = ["g-computation substitution principle only — this module does not implement the paper's iterated g-formula for time-varying, treatment-affected confounders"] },
 { title = "Causality: Models, Reasoning, and Inference", doi = "10.1017/CBO9780511803161", sections = ["do-operator / truncated factorization (single-shot intervention-and-predict)"] },
]

implementation_deviations = [
 "This is a one-equation OLS prediction utility over caller-supplied lagged parents, not a fitted longitudinal g-formula, full structural equation model, or identified causal estimator.",
 "Intervening replaces every included lag of the selected parent by one common level in the fitted one-step equation; effects are not recursively propagated through future states or mediating variables.",
 "No explicit prediction horizon, sustained or dynamic treatment regime, treatment-confounder feedback, residual simulation, or multi-equation system is supported.",
 "No uncertainty is returned. The Robins citation is conceptual provenance for intervention prediction, not a derivation of this estimator.",
]

