# DesignObjective::DistinguishModels / ranker.rs::model_distinguish_score: expected
# absolute log-likelihood gap between candidate models under a proposed design, scaled by
# an evidence-strength factor. This is the model-discrimination design criterion; Box & Hill
# (1967) is the classical reference for choosing designs that maximize expected divergence
# between rival (mechanistic) models' predictive distributions.
