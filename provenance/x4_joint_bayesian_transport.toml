# papers = [] is an explicit judgment, not an unfilled field. The engine
# (crates/antecedent-estimate/src/joint_bayesian_transport.rs) is the textbook
# conjugate Normal linear model with a Gaussian prior and known noise variance:
# posterior precision P0 + sum_s Z_s'Z_s / sigma_s^2 and mean
# Sigma (P0 m0 + sum_s Z_s'y_s / sigma_s^2), with exact iid Gaussian draws. That
# result is classical (Bayesian linear regression; e.g. Lindley and Smith 1972,
# "Bayes estimates for the linear model", JRSS B 34(1); Gelman et al., Bayesian
# Data Analysis, 3rd ed., chapter 14), but no single primary paper introduces
# the specific joint source-target construction here (an invariant effect block
# shared by every source and the target, population-varying blocks that never
# interact with treatment, posterior of the target-covariate-averaged effect),
# which is original engineering on top of the 2.2 transport certificate, and no
# theorem or section number of either reference was read and verified for this
# record. Nothing is cited here rather than implying theorem inheritance. The
# identification premise is carried by provenance/ records of the 2.2 learned
# continuous transport row (the certificate this model reads), not by this one.
