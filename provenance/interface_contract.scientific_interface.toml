# No primary paper: the check is predicate evaluation over declared records (equality of
# identities, containment of declared domains, set inclusion of operations). It is not a
# statistical method and implements no published estimator, so there is nothing to cite.
papers = [
]

implementation_deviations = [
  "The decision is relative to the declarations: a declared population, calibration record, measurement model or evidence source is a statement the producing artifact owns, and the contract does not verify it.",
  "Support containment is decided on declared domains only (real, non-negative, binary, closed interval, finite level set); no equivalence of two supports under a transformation is inferred.",
  "No unit conversion, bridge or transport is inferred: a difference in units, population or regime is a refusal, and the remedy names the declared route that would license it.",
  "No interval, posterior or calibration record is produced or measured; a connection carries the producer's label unchanged.",
]

