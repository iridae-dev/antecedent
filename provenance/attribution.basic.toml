papers = [
 # DOI resolves via DataCite to the arXiv preprint of this work: title there omits the hyphen
 # ("structure based" vs. published "structure-based") and lists authors as Janzing, Budhathoki,
 # Minorics, Bloebaum (preprint order) rather than the ICML 2022 published order (Budhathoki,
 # Minorics, Bloebaum, Janzing). Title/author order kept as the published version; DOI points at
 # the preprint of the same work.
 { title = "Causal structure-based root cause analysis of outliers", doi = "10.48550/arXiv.1912.02724", sections = ["Section 2 (information-theoretic outlier score definition)", "Section 5 (Shapley attribution of a target's outlier to ancestor noise terms)"] },
 # Section 6 ("Causal strength for linear structural equations") gives the formula
 # CS = -(1/2)*log(1 - beta^2*Var(parent)/Var(child)) for a child with one parent; arrow_strengths
 # reports the cut-edge Kullback-Leibler divergence (1/2)*log(1 + beta^2*Var(parent)/sigma^2),
 # which equals that formula for a single parent, and keeps beta^2*Var(parent) separately as the
 # variance contribution. Section 3
 # ("Problems of known definitions") is a critique of prior measures and defines nothing used
 # here.
 { title = "Quantifying causal influences", doi = "10.1214/13-AOS1145", sections = ["Section 6 (causal strength for linear structural equations)"] },
]

implementation_deviations = [
 "Anomaly attribution fits a Gaussian tail by median and MAD and replaces excluded ancestor noises by zero; the cited procedure evaluates counterfactual tail probabilities by randomizing excluded noises from their reference distributions.",
 "Arrow strength is the divergence of the joint from the joint with the edge cut, evaluated in closed form for a linear Gaussian child; the cited normalized expression -1/2 log(1 - beta^2 Var(parent)/Var(child)) is stated for a single parent and equals it only then, and the strength is refused when the child has no noise variance while the edge carries variance.",
]

