implementation_deviations = [
  "Independent implementation: Gibbs latent-outcome augmentation with exact normal/inverse-gamma coefficient conditional draws for time-homogeneous linear Gaussian SEM equations. Each equation uses unique series rows; coefficients are shared across unfolded time copies.",
  "Selected and right/left censored outcome trajectories have Gaussian Markov-blanket conditionals using the outcome equation and all child equations. The selection-indicator trajectory or censoring-bound trajectory is assumed independent of the latent outcome trajectory conditional on the declared fully observed conditioning trajectory; nuisance parameters are distinct with independent priors, so the observation-process likelihood integrates out. This is not a Bayesian IPCW or Cox pseudo-likelihood.",
  "Independent isotropic mechanism coefficient priors use the existing normal/inverse-gamma convention. Latent initial history uses independent N(0, prior_scale squared) priors; no stationarity/stability prior is imposed on autoregressive coefficients. Other root variables use empirical exogenous standardization; unfolding boundary copies use empirical means conditional on the imputed history. Root and boundary means are taken from the observed sample and carry no uncertainty, so the credible band is conditional on the observed covariate distribution.",
  "Four Gibbs chains use at least 1024 retained sweeps each after 512 warmup sweeps; every chain starts its latent outcomes from its own over-dispersed draw (mean and standard deviation of the exact outcomes, reflected into the censoring bound), so R-hat can detect non-mixing. R-hat, bulk and tail ESS gate both parameters and reported response cells. Exact conditional transitions have unit acceptance and no Hamiltonian integration; zero integration error is a diagnostic convention, not a measured HMC statistic.",
  "Credible intervals are pointwise posterior quantiles under this parametric observed-data model. Joint longitudinal empirical support is not assessed. External response-prior mappings do not define priors for every mechanism and are not silently repurposed.",
]
test_sources = ["conformance/bayesian/temporal_observed_response", "crates/antecedent-estimate/src/temporal_observed_bayes.rs", "crates/antecedent-estimate/src/temporal_observed_bayes/conditional_reference_tests.rs", "crates/antecedent-estimate/tests/temporal_observed_bayes_reference.rs", "crates/antecedent/tests/temporal_observed_bayesian.rs", "python/tests/test_temporal_observed_bayesian.py"]

[method_review]
status = "reviewed_with_limits"
scope = "estimate_observed_temporal_response of crates/antecedent-estimate/src/temporal_observed_bayes.rs on a lagged Gaussian outcome mechanism with right-censored, left-censored or unselected latent outcomes: the observation-state construction (event or selection indicator, censoring bound, ignored placeholder outcomes, refusals), the Gibbs sweep that draws each latent outcome from its Markov-blanket conditional (own equation times every child equation, truncated to the admissible side of its bound, with the N(0, prior_scale^2) law for latent outcomes before the equation's history), the normal/inverse-gamma coefficient and variance draw, the four-chain layout with 512 warmup sweeps and a per-chain count of at least 1024, and the response cells b0 and b0 + b1 evaluated from the draws. The conjugate fit routine is relied on through its own review; the identification routine only supplies the estimand and indexer. Not the multi-mechanism, mediator or sequence cases, mechanism overlays other than a pulse, the empirical standardization of exogenous roots, or coverage."
assumptions = ["The observation-process likelihood factors out of the outcome posterior: the selection indicator or censoring bound is independent of the latent outcome trajectory given the declared fully observed conditioning set, with distinct parameters and independent priors, as the record states; the review checks the consequence (unselected rows contribute 1, censored rows a survival or distribution function) and not the assumption.", "The prior is the product's convention: (beta) given s2 is N(0, s2 scale^2 I) and s2 is InverseGamma(1e-3, 1e-3), read from the conjugate routine; the reference uses the same prior.", "Exact outcomes in the first rows (before the outcome equation's history) are conditioned on and carry no likelihood term; the reference conditions on them in the same way."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the product source named in its scope and compared the sampler with a posterior computed by quadrature in a reference written for this review from the stated model, and its conditional updates with closed-form truncated-normal moments; no upstream implementation or test source was consulted or copied. The cited publications were not retrieved in this review: the correspondence is between the product code and the standard definitions those works state (data augmentation for censored normal regression, ignorability under distinct parameters, one-sided truncated normal sampling), verified numerically, not a page-level reading of the papers."
redistribution = "Primary works are cited, not redistributed. The reference script and its frozen output are repository-authored (MIT OR Apache-2.0); the script uses numpy (BSD-3-Clause) and scipy (BSD-3-Clause), imported at run time and not redistributed here. It declares its inline script metadata but was run with the locally available interpreter (uv run --offline python), is not run in a locked, isolated environment and is not wired into any gate; its output is frozen in the JSON file and compared by the tests."
limitations = "One outcome mechanism y_t = b0 + b1 x_{t-1} + e_t on eight usable rows (nine with one history row) with three latent outcomes, in three tables: right censored, left censored (the mirror image of the first in the outcome) and unselected, each at prior scales 10 and 0.5. The comparison is of Monte Carlo summaries with a three-dimensional quadrature: means and standard deviations of b0, b0 + b1 and b1 and P(b1 > 0.8), over four seeds at 40000 draws (minimum bulk ESS 6800 to 17000) and two seeds at the scale-0.5 table, within five standard errors computed from the diagnostics' minimum bulk ESS (about 0.012 for the means, a twentieth of the posterior sd), plus the quadrature's own coarse/fine difference (at most 6e-4). A bias smaller than that bound is not excluded; the distinct tables differ by several bounds, so confusing the three observation models is detected. The quadrature fixes the latent outcomes by exact summation, so it checks the latent updates only through their effect on the parameter posterior; the latent updates are separately checked against closed-form truncated-normal moments of the Markov-blanket conditional for five single-row cases (one-sided bounds on either side, none, one or two child equations, a latent row before the equation's history) within five standard errors of 200000 draws, and the coefficient draw against the exact normal/inverse-gamma moments. Multi-lag latent blankets, several simultaneous latent rows (a Gibbs chain with dependence between them), non-pulse interventions, several horizons, the empirical standardization of exogenous roots, mechanism overlays and the pointwise band are not compared with an independent value; the response cells here are linear in the draws so the cell evaluation is exercised only for a pulse at one horizon. Warmup and the chain count are fixed constants, not options; the options read are the draw count (rounded up to at least 1024 per chain), the seed and the prior scale. A short run (4096 draws) is refused by the R-hat gate for some seeds, which is the gate working. The cited publications were not retrieved. The reference script is not run in a locked, isolated environment and is not wired into any gate."
sources = ["https://doi.org/10.1093/biomet/63.3.581", "https://doi.org/10.1080/01621459.1990.10474947", "https://arxiv.org/abs/0907.4010", "https://numpy.org/doc/", "https://docs.scipy.org/doc/scipy/"]
findings_resolved = ["The Gibbs posterior of the response cells equals the three-dimensional quadrature posterior for right-censored, left-censored and unselected latent outcomes at two prior scales: every comparison of means, standard deviations and the tail probability is within the stated Monte Carlo bound for every seed, and so are the seed averages.", "Each latent update equals its Markov-blanket conditional from the definition: lower- and upper-truncated and untruncated draws with zero, one or two child equations, and a latent row before the equation's history using the N(0, prior_scale^2) initial law; and the coefficient and variance draw equals the exact normal/inverse-gamma conditional at two prior scales.", "The draw count (at least 1024 per chain, four chains, 512 warmup), the seed and the prior scale each change the output as declared; unusable prior scales, an event outcome beyond its censoring bound, a non-binary indicator and a non-finite bound are refused; placeholder outcomes of unselected rows are never read.", "No product defect was found in this record."]
