# Joint ordinary-least-squares coefficients of k >= 2 treatments that share one adjustment set
# and one row snapshot, with the full k x k coefficient covariance (model-based sigma^2 (X'X)^-1
# or the HC0-HC3 sandwiches), contrast variances w' V w, a joint Wald statistic and Holm-adjusted
# contrast p-values. DOIs are omitted because they were not resolved here.
papers = [
  { title = "A Heteroskedasticity-Consistent Covariance Matrix Estimator and a Direct Test for Heteroskedasticity (Econometrica 48(4), 1980)", sections = ["The heteroskedasticity-consistent sandwich covariance estimator, used here as HC0"] },
  { title = "Some Heteroskedasticity-Consistent Covariance Matrix Estimators with Improved Finite Sample Properties (Journal of Econometrics 29(3), 1985)", sections = ["The finite-sample variants of the sandwich estimator, used here as HC1, HC2 and HC3"] },
  { title = "Tests of Statistical Hypotheses Concerning Several Parameters When the Number of Observations Is Large (Transactions of the American Mathematical Society 54(3), 1943)", sections = ["The Wald statistic: a quadratic form of the coefficients in the inverse of their covariance, referred to a chi-square distribution"] },
  { title = "A Simple Sequentially Rejective Multiple Test Procedure (Scandinavian Journal of Statistics 6(2), 1979)", sections = ["The step-down procedure used for Holm-adjusted contrast p-values"] },
]

implementation_deviations = [
  "Claim policy: the supported claim is the POINT values (the coefficient vector and the declared contrast estimates). Every standard error, covariance entry, Wald statistic, raw and Holm p-value is a reported diagnostic with calibration coordinate 'not_measured' (Type I error, power and coverage are not collected); no interval is produced and no coverage record is allocated.",
  "The p-values are asymptotic (standard normal and chi-square) and are applied to finite samples without any small-sample correction beyond the HC1-HC3 weights themselves; the HC weights are used as in the cited estimators but their finite-sample behaviour is not measured here. A cluster-robust covariance is deliberately not offered. HC2 and HC3 refuse (vector_treatment.leverage_one) when an observation has leverage one.",
  "Design checks are stricter than a plain OLS routine: mismatched adjustment sets, row snapshots or row counts across treatments, a constant treatment, a collinear treatment and a rank-deficient adjustment block all refuse with a typed detail instead of dropping a column.",
  "Artifact replay limits: a model-based fit embeds only X'X, X'y and the residual sum of squares and the consumer recomputes coefficients and the full covariance from them bit for bit; a robust (HC) fit also embeds the meat of its sandwich (the sum of w_i e_i^2 x_i x_i' with the HC weight w_i, leverages included), so it too replays bit for bit from a summary and no row is embedded; the summary is bound to its rows by a data digest. Artifacts written before summaries existed embed the rows of an HC fit and are still read, up to 4096 rows. A model-based summary cannot replay a robust covariance (vector_treatment.summary_model_based_only).",
  "The regression-coefficient estimate is not an identification statement: the caller owns that the shared adjustment set is valid.",
]

upstream_implementations_observed = []

test_sources = [
 "crates/antecedent-estimate/tests/vector_treatment.rs",
 "crates/antecedent-io/tests/vector_treatment_artifact.rs",
 "python/tests/test_vector_treatment.py",
 "crates/antecedent-estimate/tests/vector_treatment_reference.rs (40-digit OLS, model-based/HC0/HC1/HC2/HC3 covariances, contrast standard errors, Holm and Wald references on a heteroskedastic 48-row design with adjustment columns)",
]

[method_review]
status = "reviewed_with_limits"
scope = "fit_vector_treatment and VectorTreatmentFit::wald_test of crates/antecedent-estimate/src/vector_treatment.rs for k >= 2 numeric treatments with a shared adjustment block: the ordinary least-squares coefficient vector, the model-based, HC0, HC1, HC2 and HC3 covariances of the treatment block, per-coefficient standard errors, z statistics and two-sided normal p-values, declared contrasts with the covariance-aware and the naive independent standard errors, the Holm adjustment across the declared contrasts, the joint Wald chi-square of the frozen null with its upper-tail probability and the Wald test of declared contrasts. Not the rank and collinearity refusal thresholds, the sealed artifact and its replay, the Python surface, the categorical route that reuses the same solve, or any calibration of the joint tests."
assumptions = ["Rows are independent and the adjustment set is valid (the caller owns identification); the estimand is the regression coefficient vector, not a causal effect by itself.", "The standard errors, p-values and Wald tests are asymptotic (standard normal and chi-square) and are applied to finite samples with no small-sample correction beyond the HC1 to HC3 weights.", "Holm adjusts the declared contrast family only, with the same two-sided normal p-values."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the product source named in its scope and compared results with a 40-digit multiprecision least-squares, sandwich, Holm and Wald reference written for this review (vector_treatment_reference.py); no upstream implementation or test source was consulted or copied. The cited publications were not retrieved in this review: the correspondence is between the product code and the standard definitions those works state, verified numerically, not a page-level reading of the papers."
redistribution = "Primary works are cited, not redistributed. The reference script and its frozen output are repository-authored (MIT OR Apache-2.0); mpmath, where used, only produces the frozen values and is not a product dependency. The script declares its inline script metadata but is not run in a locked, isolated environment and is not wired into any gate; its output is frozen in the JSON file and compared by the test."
limitations = "One heteroskedastic design of 48 rows with an intercept, two adjustment columns (one continuous, one binary) and three treatments (one correlated with an adjustment column), five covariance kinds, three contrasts and two Wald tests; coefficients, covariances, contrast standard errors and Wald statistics agree to a relative 1e-9 and the normal and chi-square tail probabilities to 1e-7. Not exercised: designs near the rank tolerance, a leverage near one for HC2 and HC3 (only its refusal exists, not its boundary value), more than three treatments, clustered or serially dependent rows, offsets of 1e8 in a column. No coverage or Type I error of any interval or test is measured; the fit's calibration stays Not measured. The cited publications were not retrieved."
sources = ["https://doi.org/10.2307/1912934", "https://doi.org/10.1016/0304-4076(85)90158-7", "https://doi.org/10.2307/1990256", "https://mpmath.org/doc/1.3.0/"]
findings_resolved = ["No numerical defect was found: the coefficient vector, the five covariances, the contrast variances w'Vw, the naive standard errors, the Holm adjustment, the joint Wald statistic of the identity restriction and the Wald statistic of two declared contrasts agree with the multiprecision reference.", "The HC1 scale n/(n-p) uses the full design width p including the intercept and the adjustment columns, and the HC2 and HC3 leverages are those of the full design; both agree with the reference."]
record_sha256 = "ab4814939f303fe5e25cd49173861c3a067c25046b5e14f695c19b37c2f19eef"

