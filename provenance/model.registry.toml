 "crates/antecedent-model/tests/registry_glm_reference.rs (baseline-category multinomial logit, weighted and unweighted, interaction and spline bases, and the empirical-Bayes ridge binary logit against 50-digit Newton maximum likelihood; refusal of a declared unit structure)",
 "crates/antecedent-model/tests/registry_linear_families_reference.rs (BVAR ridge, hierarchical-linear empirical-Bayes ridge with and without UnitId, interaction and spline bases, weighted refits, against 60-digit normal-equation solves)",
 "crates/antecedent-model/tests/registry_state_space_reference.rs (Kalman filter and smoother against exact Fraction recursions equal to joint-Gaussian conditioning, predictive density at three scales, 25-iteration EM fit against a joint-law EM in 60 digits)",
 "crates/antecedent-model/tests/registry_gaussian_process_reference.rs (feature gaussian-process: all 25 grid cells' exact marginal likelihoods, selected cell, dual weights, posterior mean and score)",
 "crates/antecedent-model/tests/registry_tree_ensemble_reference.rs (frozen tree maps evaluated exactly: thresholds, missing branch, sum and mean, links, noise density, one-vs-rest class probabilities and floor)",
 "crates/antecedent-model/tests/registry_tree_fit_wiring_reference.rs (features ml-gbdt and ml-forest: the stored ensemble equals a direct provider fit with the documented settings; out-of-fold noise scale and classifier indicators)",
 "crates/antecedent-model/tests/registry_family_selection_reference.rs (every candidate's held-out score from exact refits under the shuffled and time-ordered schemes for continuous and binary outcomes, ranking, provenance, required family, exact ties by listing order)",
]

[method_review]
status = "reviewed_with_limits"
scope = "The numerics of the mechanism registry in crates/antecedent-model: (1) the weighted and frequency-count refit of linear-Gaussian, interaction and spline mechanisms (exact weighted least squares, with the 2^-20..2^20 weights, zero counts, offsets, near-collinear and saturated designs of the earlier reference); (2) the baseline-category multinomial logit of Discrete and of the Discrete interaction and spline bases (unweighted and weighted, two to four categories, a parent in years), and the empirical-Bayes ridge binary logit of HierarchicalGlm with its recomputed strength (interior and clamped), against 50-digit Newton maximum likelihood; (3) the ridge fits of Bvar, HierarchicalLinear (without and with a UnitId within-unit regression) and the interaction and cubic truncated-power spline bases, against 60-digit normal-equation solves; (4) the scalar linear-Gaussian state space: Kalman filter, Rauch-Tung-Striebel smoother and lag-one covariance against exact Fraction recursions equal to joint-Gaussian conditioning, the unit-free predictive density, and the 25-iteration EM fit of the conditional state space against a joint-law EM; (5) the Gaussian process: the exact negative log marginal likelihood of all 25 hyperparameter-grid cells, the selected cell, the dual weights, the posterior mean and the point score; (6) the tree-ensemble families: the exact walk, aggregation and links of frozen tree maps, the additive-noise density, the one-vs-rest class probabilities with their renormalisation and floor, and the registry's own choices around the providers (documented settings, all rows, fixed seed, out-of-fold noise scale over the declared time-ordered folds, one 0/1 indicator per level); (7) family selection: every candidate's held-out log likelihood from exact refits on each training fold, the k ln n / 2n charge, the ranking and the recorded provenance for continuous and binary outcomes under the shuffled and the time-ordered scheme, a required-by-policy choice, the inadmissible constant, and exact ties broken by listing order. The trees themselves are grown by forust-ml and smartcore and are outside this review."
assumptions = [
 "Each reference solves the stated estimator exactly (closed-form normal equations in 60 digits, Newton on the concave logit likelihoods to a 1e-40 gradient, rational recursions) rather than re-implementing the library's iteration; the model whose maximiser or minimiser is compared is the one the code documents.",
 "The empirical-Bayes strengths, the BVAR tightness 0.2, the spline conditioning ridge 1e-6 n, the EM clamp and floors, the 25-cell grid multiples and the penalty k ln n / 2n are the repository's documented constants; the review checks that the code applies them, not that they are optimal.",
 "The shuffled five-fold partition is the library's seeded kernel; the test regenerates it, requires it equal to the frozen assignment and the reference scores are computed on that frozen assignment. The time-ordered partition (blocks of n/6 rows, purge) is recomputed independently.",
 "Held-out rows of a categorical outcome whose level is absent from a training fold are not scored; the designs used here never have that case, and it is not exercised.",
]
historical_exposure = "Historical author exposure cannot be independently established. This review read the registry modules and wrote its own references from the stated estimators in exact or 50 to 60 digit arithmetic (mpmath, Fractions); no upstream implementation was consulted for the references. DoWhy is disclosed above for a conditional-mean comparison that predates this review."
redistribution = "The reference scripts, frozen outputs and Rust tests are repository-authored under MIT OR Apache-2.0; mpmath is not a product dependency and the frozen outputs carry no third-party data. The cited works are named, not redistributed."
limitations = "None of the cited papers was retrieved (no downloads, no local copies); Dempster, Laird and Rubin and Shumway and Stoffer carry no DOI here because none could be verified, and none of the five is used as an oracle: the references are exact solutions of the estimators the code documents, not reproductions of published tables. Tree growth is not referenced: forust-ml 0.5 and smartcore 0.4 grow the trees (split search over bins, bootstrap and feature subsets, shrinkage and leaf regularisation are theirs), their settings are internal to those crates, an exact enumeration of their best splits would be a re-implementation of the providers, and Breiman's and Friedman's procedures are therefore neither cited nor claimed; what is covered is the provider-independent tree-map evaluation and the registry's own wiring, and the wiring test equates the stored ensemble with a direct fit by the same providers, so it detects a changed setting, row set or seed but not an error in a provider. The Gaussian-process inducing-point path above 1000 rows (256 farthest-point rows, deterministic training conditional) is not referenced (an exact 50-digit reference needs a 1000-row Gram accumulation per length scale) and rests on the library test gp_family_uses_inducing_points_above_the_exact_row_limit; the Gaussian-process comparison needs the gaussian-process feature, and the wiring test needs ml-gbdt and ml-forest. The comparison designs are small (24 to 320 rows, one to two parents); more than two parents is exercised only by the earlier weighted reference and basis designs are built for exactly two parents. The EM comparison reaches neither the coefficient clamp nor the variance floors in 25 iterations on any series, the n < 3 autoregressive fallback is not exercised, and the EM likelihood is multimodal in general, so only the fixed initialisation is checked. The Clustered scheme for the state-space candidate's parent residuals shares the code path fixed for the time-ordered scheme but has no exact-number reference; the Shuffled and TimeOrdered schemes do. The typing thresholds (declared type, level count, rows per level) are covered by library unit tests, not by these references. Poisson and other non-binomial GLM families are not mechanism families of this registry, so no Poisson fit is referenced. Tolerances are 1e-9 relative on closed-form fits, 1e-7 on logit fits and the conditional-state-space density, 1e-6 on spline coefficients (strongly correlated columns; the fitted surface is compared at 1e-7)."
sources = ["https://mpmath.org/doc/1.3.0/", "https://docs.python.org/3/library/fractions.html"]
findings_resolved = [
 "Defect fixed: the conditional state-space candidate's out-of-fold parent residuals were always cut by the seeded shuffled partition, silently ignoring a declared time-ordered or clustered scheme, so under serially dependent rows a held-out row's later neighbours trained the linear mean that predicts it; the residuals now follow the declared folds (the time-ordered leading block takes the first fold's fit and is not scored). Failing first: registry_family_selection_reference_scores_and_ranking_match_exact_refits reported the time-ordered state-space held-out log likelihood -1.0518 against the exact -1.0259.",
 "Defect fixed: HierarchicalGlm fit a ridge logit with no unit-level term and ignored a declared UnitId grouping; it now refuses with the declaration named, so the family is a recorded failure and another candidate is chosen. Failing first: registry_glm_reference_hierarchical_glm_refuses_a_declared_unit_structure fit successfully before the change.",
 "No numerical defect found in the other paths: weighted least squares, multinomial and binary logit, BVAR, hierarchical-linear (with and without units), interaction and spline bases (fresh and weighted), the filter, smoother, predictive density and EM fit, the Gaussian-process grid selection, the tree-map evaluation and class probabilities, the provider wiring and the candidate scores and ranking agree with the exact references at the stated tolerances.",
 "Recorded as behaviour, not changed: a Gaussian-process point is scored with the fitted noise standard deviation and no posterior variance; the complement 1 - q of a clipped tree-class score carries the rounding of q (relative 3e-8 near 1e-9); boosted and forest class scores are clipped at 1e-9 so the 2^-52 floor is reached only by a hand-built map.",
]
