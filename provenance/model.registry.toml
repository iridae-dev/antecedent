implementation_deviations = [
 "The MultinomialLogit family is baseline-category multinomial label regression with quantized outcome levels, not an alternative-specific conditional-logit choice model with choice sets and alternative attributes.",
 "The LGSSM family is scalar and uses a fixed 25-iteration EM procedure (E-step by the Kalman filter and Rauch-Tung-Striebel smoother of model.lgssm, M-step the stationary point of the expected complete-data log likelihood with the autoregressive coefficient clamped to +-0.999 and both variances floored at 1e-8); its parent mean is the full-data ordinary-least-squares fit, estimated before the state parameters rather than jointly with them. The Gaussian-process family uses an exact RBF kernel only up to 1000 rows and chooses its length scale and noise level from a 25-point grid on the data's own scale (signal variance and prior mean are the outcome's variance and sample mean) rather than general marginal-likelihood optimization; above 1000 rows it switches to a 256-point farthest-point inducing set with a deterministic-training-conditional marginal likelihood. A Gaussian-process point is scored as a Gaussian about the posterior mean with the fitted noise standard deviation; the posterior variance of the latent function is not carried.",
 "The tree-ensemble families are additive-noise models and one-vs-rest probability classifiers over fitted ensembles. The trees themselves (split search, bootstrap and feature subsets, boosting) are grown by the pinned providers forust-ml 0.5 and smartcore 0.4 through antecedent-learn and exported to a provider-independent tree map; this repository implements neither Breiman's random forest nor Friedman's gradient boosting machine, and forust-ml is an XGBoost-style second-order booster, not Friedman's procedure. What the registry itself does is fix the settings (boosted: 100 trees, depth 3, learning rate 0.1; forest: 100 trees, leaves of at least five rows for regression and the probability default for classification; one fixed seed), choose the rows, take the noise of the regression families as homoscedastic Gaussian with a scale from out-of-fold residuals cut like the selection (the training residuals of a tree ensemble are optimistic), and renormalise one-vs-rest scores for a categorical outcome with more than two levels, which is not a joint multiclass likelihood. Forest class scores are leaf means of 0/1 labels and boosted class scores are sigmoids, both clipped to [1e-9, 1 - 1e-9], not calibrated log-loss probabilities. Piecewise-constant surfaces are flat outside the training support.",
 "Dependence-aware validation is by declaration only: forward-chaining blocks with an optional purge for ordered rows, whole-unit folds for clustered rows. The scheme does not test for serial or cluster dependence. The state-space candidates keep their prequential score; their linear parent mean is cut by the declared scheme (under the time-ordered scheme the leading block, which is only ever trained on, takes the residual of the first fold's fit and is not scored), but the state parameters are fit once on the whole series.",
 "Hierarchical linear and GLM, Minnesota-style BVAR, automatic family assignment, and score-based family selection are not supported by the papers listed in this record. HierarchicalLinear is an empirical-Bayes ridge on the raw parents with a method-of-moments strength (lambda = sigma^2 / tau^2, tau^2 = mean of the squared ordinary-least-squares slopes less sigma^2 / n, clamped), not a random-effects model; with a UnitId column its slopes are the within-unit (fixed-effects) regression and the unit effects are removed, not shrunk. HierarchicalGlm is the same moment-based ridge applied to a binary logit (strength from the linear-probability fit, clamped to [1e-4, 1e3], intercept unpenalized) with no unit-level term, so it refuses a declared UnitId grouping rather than ignoring it. The BVAR is a conjugate ridge on scale-standardized parents (prior variance phi times the error variance, intercept unpenalized) without Minnesota lag decay, because parents carry no lag metadata. Family selection scores every family by mean held-out predictive log-likelihood on a shared seeded 5-fold partition (or the declared scheme) less a BIC-scaled parameter-count penalty; exact ties keep the candidate listing order, and the constant family is admissible only for a degenerate outcome.",
 "The weighted and frequency-count refit of the standard families rescales weights to mean one and keeps the selected family. The standardization, interaction centers and spline knots of a basis family are the unweighted moments of the table (the weights enter the least-squares and logit objectives only), a zero count drops the row from the fit but not from the residual degrees of freedom, and a support value no weighted row carries keeps probability zero.",
]

# Mechanism auto-assignment: hierarchical/linear-Gaussian fits, baseline-category
# multinomial logit MLE, scalar LGSSM via Kalman EM, and (feature `gaussian-process`)
# RBF Gaussian-process regression by exact Cholesky NLML.
#
# Citation judgment, from reading the code. The Kalman filter and the Rauch-Tung-Striebel
# smoother are the E-step of the LGSSM fit and are cited with model.lgssm, which carries their own
# review. The EM algorithm and its state-space form are what the fit loop is (the stationary point of
# the expected complete-data log likelihood), so both introductions are cited; neither was
# retrieved and no DOI is recorded for them rather than a guessed one. Gaussian-process regression
# is cited to the book. Breiman's random forest and Friedman's gradient boosting machine are NOT
# cited: the trees are grown by external crates this repository does not implement, and the
# registry's own contribution (settings, rows, out-of-fold noise scale, one-vs-rest
# renormalisation) is not either procedure. The logit, ridge and empirical-Bayes shrinkage fits are
# textbook estimators with no single primary source; their exact references are the oracles
# named under test_sources.
papers = [
 { title = "A New Approach to Linear Filtering and Prediction Problems", doi = "10.1115/1.3662552", sections = ["Kalman filter (used inside the EM fit for the LGSSM mechanism family)"] },
 { title = "Maximum Likelihood Estimates of Linear Dynamic Systems", doi = "10.2514/3.3166", sections = ["Fixed-interval smoother (used inside the EM fit for the LGSSM mechanism family)"] },
 { title = "Maximum Likelihood from Incomplete Data via the EM Algorithm", sections = ["EM iteration: E-step by conditional moments of the latent path, M-step by the stationary point of the expected complete-data log likelihood (the scalar LGSSM fit)"] },
 { title = "An Approach to Time Series Smoothing and Forecasting Using the EM Algorithm", sections = ["EM for the linear Gaussian state-space model (the scalar LGSSM fit)"] },
 { title = "Gaussian Processes for Machine Learning", doi = "10.7551/mitpress/3206.001.0001", sections = ["Ch. 2: GP regression, Cholesky-based predictive mean and log marginal likelihood (the exact path, scored over a fixed hyperparameter grid)"] },
]

upstream_implementations_observed = [
