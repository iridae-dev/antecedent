 "crates/antecedent-model/tests/mechanism_selection.rs (known-truth recovery of quadratic, threshold, interaction and sinusoidal mechanisms, noise-inversion round trips, constraints, split schemes, failure records)",
 "crates/antecedent-model/src/registry/selection.rs (fold geometry of the time-ordered and clustered schemes)",
 "python/tests/test_dowhy_comparison.py (conditional means of the selected mechanisms against gcm.auto.assign_causal_mechanisms; DoWhy values computed at test time by the pinned version, skipped when it is absent)",
 "conformance/gcm/discrete_hierarchical_glm",
