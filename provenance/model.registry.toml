implementation_deviations = [
 "The MultinomialLogit family is baseline-category multinomial label regression with quantized outcome levels, not an alternative-specific conditional-logit choice model with choice sets and alternative attributes.",
 "The LGSSM family is scalar and uses a fixed 25-iteration EM procedure; the Gaussian-process family uses an exact RBF kernel only up to 1000 rows and chooses its length scale and noise level from a 25-point grid on the data's own scale (signal variance and prior mean are the outcome's variance and sample mean) rather than general marginal-likelihood optimization.",
 "The tree-ensemble families are additive-noise models and one-vs-rest probability classifiers over fitted ensembles, not the cited procedures: the noise of the regression families is homoscedastic Gaussian with a scale from out-of-fold residuals cut like the selection (the training residuals of a tree ensemble are optimistic), and a categorical outcome with more than two levels is one-vs-rest renormalised, which is not a joint multiclass likelihood. Forest class scores are leaf means of 0/1 labels clipped away from 0 and 1, not log-loss probabilities. Piecewise-constant surfaces are flat outside the training support. The ensembles are fitted by antecedent-learn providers and stored as a provider-independent tree map.",
 "Dependence-aware validation is by declaration only: forward-chaining blocks with an optional purge for ordered rows, whole-unit folds for clustered rows. The scheme does not test for serial or cluster dependence, and the state-space candidates keep their prequential score.",
 "Hierarchical linear and GLM, Minnesota-style BVAR, automatic family assignment, and score-based family selection are not supported by the papers listed in this record. The BVAR is a conjugate ridge on scale-standardized parents (prior variance phi times the error variance, intercept unpenalized) without Minnesota lag decay, because parents carry no lag metadata. Family selection scores every family by mean held-out predictive log-likelihood on a shared seeded 5-fold partition less a BIC-scaled parameter-count penalty.",
]

# Mechanism auto-assignment: hierarchical/linear-Gaussian fits, baseline-category
# multinomial logit MLE, scalar LGSSM via Kalman EM, and (feature `gaussian-process`)
# RBF Gaussian-process regression by exact Cholesky NLML.
