# Leave-one-out adjustment-covariate sensitivity (drop each backdoor covariate in turn,
# refit on the rows complete for the full adjustment set, report worst relative ATE change).
# This is an ad hoc, descriptive diagnostic on the *chosen adjustment set* (a moving estimate
# is what a real confounder does, so reports are non-informative), not a check tied to a
# specific published methodology; no single primary paper introduces it as a named method.
# Honestly left uncited rather than retrofitting a plausible-sounding source — see report
# for detail.
papers = []

upstream_implementations_observed = []

test_sources = [
 "crates/antecedent-validate/src/graph_refute.rs unit tests",
 "conformance/validate/overlap_graph_refutation",
 "crates/antecedent-validate/tests/graph_refute_reference.rs (exact-rational leave-one-out refits, floor, fixed rows, verdict thresholds)",
]

[method_review]
status = "reviewed_with_limits"
scope = "GraphRefuter::refute in crates/antecedent-validate/src/graph_refute.rs for a static linear-adjustment problem: the leave-one-out refits on the rows complete for the full adjustment set, the relative change |ate_j - ate_0| / max(|ate_0|, 1e-3 SD(Y)/SD(T)) with sample SDs taken over those rows, the worst-drop selection, the pass rule worst < rel_delta_threshold, the reported replicate count, and the empty-adjustment-set short cut. Not the temporal path (the lag-aligned design is rebuilt by the refit and is not a schema drop-covariate target), not a composed or Bayesian refitter, and not the least-squares fit itself, which is the linear adjustment estimator's own record."
assumptions = ["The check is a repository-defined descriptive diagnostic with no primary source; this review checks the code against the stated definition, not the definition against any causal criterion.", "The treatment effect is the coefficient of the treatment in the least-squares regression of the outcome on an intercept, the treatment and the adjustment covariates, for a unit treatment contrast.", "Sample standard deviations divide by n - 1 over the complete-case rows of treatment, outcome and the full adjustment set."]
historical_exposure = "Historical author exposure cannot be independently established. This review read graph_refute.rs and wrote its own reference from the stated definition in exact rational arithmetic (the least-squares solves) with a 60-digit square root for the floor; no upstream implementation was consulted and no paper is cited because none introduces the check."
redistribution = "The reference script, frozen output and Rust test are repository-authored under MIT OR Apache-2.0. The data are generated by a repository linear congruential generator and rounded to four decimals (or to multiples of 1/64 for the exact-null case)."
limitations = "The comparison covers five synthetic designs: three covariates with mixed effects, a strongly confounded treatment, a full-fit effect that is exactly zero (so the floor 1e-3 SD(Y)/SD(T) alone sets the denominator), four rows missing in the last adjustment covariate (the refits must keep the full-set rows), and a single covariate, each at two or three thresholds so both verdicts occur, at 1e-7 relative. It does not exercise a temporal problem, a composed refitter, sampling weights or a non-default estimator, does not show that a small or large change says anything about the causal claim (the record already states it does not), and does not examine ties between two drops beyond the later-covariate rule, which cannot change the reported effect because tied drops give the same estimate. No paper was retrieved or consulted; none is cited."
sources = ["https://mpmath.org/doc/1.3.0/"]
findings_resolved = ["The leave-one-out refits, the denominator floor, the fixed estimation rows when a late covariate has missing values, the worst-drop selection, the verdict rule and the empty-set short cut agree with the exact-rational reference on every design and threshold; no defect found."]
