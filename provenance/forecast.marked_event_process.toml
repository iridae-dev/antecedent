implementation_deviations = [
  "The mark space is replaced by declared prototypes, each with nonnegative source features, target features and a reference mass. The kernel is finite-rank on those features with one fixed exponential decay per rank component. This parameterization is repository-defined; it is a quadrature or atom representation of a marked kernel, not the general marked Hawkes process of the cited papers.",
  "With the decays and features fixed, the ground intensity is linear in the baseline and excitation coefficients, so the conditional log likelihood is concave in them. The fit is projected gradient ascent onto a half-space: no declared prototype may have more than a reproduction cap of lifetime direct children. That is a convex sufficient condition for spectral radius below one and is generally stricter than it, the same role the source-column cap plays for the catalog model.",
  "Declared coefficients are checked with a positive subinvariance witness of the prototype branching matrix, not with the reproduction cap.",
  "Rank and target basis are capped by the dense catalog allowance and the prototype count by the cost of the spectral witness, each derived from the per-invocation operation budget.",
  "Draws condition on the observed arrivals strictly before the draw window and use Ogata thinning with the ground intensity as the bound after each accepted arrival. Paths are model-conditional draws, not a predictive law with parameter uncertainty.",
]
