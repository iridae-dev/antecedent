# Sharp bounds of the stratified average treatment effect under the marginal sensitivity model for
# a binary treatment, finite strata and exact population inputs, with a bisection tipping Lambda
# and an adapter into the sensitivity artifact. The model is Tan's; its inverse-propensity
# weighting analysis is Zhao, Small and Bhattacharya's; the sharp population bound by quantile
# balancing is Dorn and Guo's. The closed form used here (a fractional knapsack over the top and
# bottom 1/(Lambda+1) outcome mass with the exact constraint E[rho] = 1) is derived in the module
# documentation and verified against hand-derived anchors, not copied from any of them.
papers = [
  { title = "A distributional approach for causal inference using propensity scores", sections = ["The marginal sensitivity model: the odds of treatment given the covariates and a potential outcome differ from the odds given the covariates by a factor in [1/Lambda, Lambda]"] },
  { title = "Sensitivity analysis for inverse probability weighting estimators via the percentile bootstrap", sections = ["The marginal sensitivity model for inverse probability weighting estimators and its bounds on the weighted estimand (the percentile-bootstrap interval of the paper is NOT implemented)"] },
  { title = "Sharp sensitivity analysis for inverse propensity weighting via quantile balancing", sections = ["Sharp bounds of the population estimand under the marginal sensitivity model, attained by weights equal to their extreme values above and below a quantile of the outcome law"] },
]

implementation_deviations = [
  "Original query/adjustment ancestry does not validate supplemental-sample ignorability, consistency or MSM assumptions, and Lambda1 empirical contrasts need not equal the original fitted estimate (including original front-door analyses). The caller must justify the sensitivity model for the new sample; no original causal identification guarantee is transferred.",
 "The additive from_analysis / ResultAPI.msm_sensitivity workflow accepts an explicit supplemental sample, checks the unchanged original static ATE query/adjustment identity, and supplies empirical finite-stratum masses/propensities/outcome laws to the existing exact finite-law optimizer. It labels input_basis empirical_plugin and sample ATE; bounds are sharp for this empirical distribution and estimate population bounds with sampling uncertainty withheld. No exact population guarantee or sampling coverage above transfers to this workflow.",
 "The supplemental sample has its own digest, while original source_program_id is retained only as query ancestry. Original aggregate results do not retain strata and cannot certify that the supplemental sample equals their original snapshot. Empirical sensitivity artifact provenance remains empirical_msm_plugin with the supplemental sample id and SamplingWithheld. Bounds are1,000,000sample rows,4096finite strata and 256 distinct outcomes per arm/stratum; both treatment arms must occur in every stratum.",

  "Claim policy: the licensed claim is the exact population-level assumption range and the identified value at Lambda = 1; nothing is estimated, so no standard error, p-value, power or coverage is produced and calibration is unmeasured. The range is never a confidence interval.",
  "The sampling interval is WITHHELD. The percentile bootstrap of Zhao, Small and Bhattacharya is not implemented: inputs are exact strata masses, propensities and outcome laws, and any request to compose a sampling interval with the assumption range is refused (cell_not_licensed / msm_sensitivity.composition_not_licensed); every result and artifact carries the withheld descriptor (msm_sensitivity.interval_withheld).",
  "The normalization is the EXACT population constraint E[rho] = 1 per stratum and arm, which gives the sharp bound for the declared set; it is not the Hajek (ratio) renormalization of the sample program, which drops the constraint and gives weakly wider, non-sharp population bounds. A reader must not transfer the sample-version guarantees of the papers to these exact bounds.",
  "Scope is a binary treatment and a discrete adjustment set (finite strata) with at most 4096 strata, 256 outcome atoms per law, 1024 grid points and Lambda at most 1000. One Lambda is shared by every stratum and both arms, whose unobserved laws are separate free parameters, so the arm bounds combine independently. Propensities must lie strictly inside (0, 1).",
  "The tipping Lambda is found by bisection on a monotone predicate (the feasible sets nest in Lambda) and reports its tolerance, a certified bracket (not reached at the lower end, reached at the upper end) and a status (bracketed, reached at origin, not reached in the box); the bracket is certified against the floating-point evaluation of the closed form, not in exact arithmetic.",
  "The adapter writes the result into the SensitivityArtifact over the coordinate msm_lambda (scale odds_ratio_bound); the decision classification over the Lambda range (invariant action, assumption-dependent switch, no robust action) is the sensitivity decision composition's and is never a probability.",
]

