scope = "msm_ate_bounds_at and msm_ate_sensitivity in crates/antecedent-validate/src/msm_sensitivity.rs: the sharp ATE bounds sum_x P(x)(L_1 - U_0) and sum_x P(x)(U_1 - L_0) of the stratified marginal sensitivity model with the exact constraint E[rho] = 1 per stratum and arm, computed by the fractional-knapsack closed form m + (1 - e)(Lambda - 1/Lambda)(T_top - tau m), tau = 1/(Lambda + 1); the Lambda grid; the bisection tipping point with its certified bracket and status; and the contract refusals (sampling composition, Lambda below one, propensity outside (0, 1), masses and laws not summing to one, tolerance, grid and size bounds). The sampling interval is withheld by contract and nothing is estimated. Not the empirical plug-in adapter in antecedent-io and the Python result handoff (they build the strata from a supplied sample and are covered by their own tests), not msm_dirichlet_posterior (a Dirichlet posterior mean pushed through the lambda = 1 value, which relies on the posterior-mean kernel review), and not the percentile-bootstrap interval of the cited paper, which is not implemented."
assumptions = ["Strata masses, propensities and outcome laws are exact population quantities; the bounds are an assumption range, never a confidence interval.", "One Lambda is shared by every stratum and both arms, whose unobserved laws are separate free parameters, so the arm bounds combine independently.", "The marginal sensitivity set per stratum and arm is { rho : 1/Lambda <= rho <= Lambda, E_f[rho] = 1 }; consistency, ignorability for the declared sample and positivity are taken as given."]
