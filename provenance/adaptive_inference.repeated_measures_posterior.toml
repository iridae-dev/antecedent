implementation_deviations = [
  "The implementing module is crates/antecedent-stats/src/adaptive_inference/repeated_measures_posterior.rs. It states: The variance and the correlation are declared, not estimated: a posterior that marginalized over them needs a prior on them and is a separate model.",
  "If the assignment of unit i depends on the data of earlier units only (and on independent randomization), the probability of the realized assignment is a function of observed quantities and factors out of the likelihood of the arm means (the likelihood principle).",
  "The posterior above is therefore the posterior given the adaptively collected data with no correction for the adaptation, and it is the same under any such policy.",
]

