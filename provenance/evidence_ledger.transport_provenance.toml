[non_algorithm_review]
status = "justified_non_algorithm"
kind = "contract"
rationale = "Transport provenance of the evidence ledger: a source may carry a transport identity (source populations, target population, stated assumptions, selection-diagram digest); the ledger refuses a transport that names no assumption or names its own target as a source, refuses transport of raw observations, requires the transported claims of a CausalTransport operation to carry an identity and the native ones not to, refuses a source used as both, and carries the sorted identity digests onto every result that cites it."
no_independent_algorithm = "Set membership, sorting and digest equality over declared identities. The only floating-point comparison in the pooling check that sits beside it is the positive-definiteness interval (-1/(k-1), 1) for a declared dependence range, a bound on a declared number and not an estimate; no square root, logarithm, exponential, solve or sampling touches transport. The effect transport itself is not implemented here."
covered_by = ["evidence_ledger.statistical_pooling"]
