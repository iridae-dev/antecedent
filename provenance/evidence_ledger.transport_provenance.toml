# papers = [] is an explicit judgment. The module records which sources carry a transport identity
# (source populations, target population, stated assumptions, a digest of the selection diagram) and
# refuses to count a transported claim as native target data; it does not implement the transport
# calculus of Pearl and Bareinboim or any transported estimator, so that publication is not a source
# of anything computed here. The transported estimators are their own records.
