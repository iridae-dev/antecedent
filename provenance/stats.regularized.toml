]

[method_review]
status = "reviewed_with_limits"
scope = "fit_ridge_with (penalized normal equations with an optional unpenalized leading column), fit_lasso (coordinate descent for the lasso and elastic net, with centering, RMS standardization, back-transformation to the original scale and intercept recovery) and soft_threshold. Not a review of ridge_gram_inverse as a sandwich bread, the leading-ones wrapper beyond delegation, the callers' tuning, or any penalty selection."
assumptions = ["The objective is 0.5 RSS + lambda alpha ||b||_1 + 0.5 lambda (1 - alpha) ||b||_2^2 on the (optionally standardized) centered columns, with an unpenalized intercept; this lambda scale differs from formulations that divide the RSS by n, as the record states.", "The design has full column rank on the active set, so the minimizer is unique.", "The convergence tolerance is relative to the response norm and bounds how far one sweep moves the fitted values, not the distance to the minimizer."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the product source named in its scope, including the numerical helpers it calls, and compared results with definitions evaluated by executing references written for this review; no upstream implementation or test source was consulted or copied. The cited publications were not retrieved in this review: the correspondence is between the product code and the standard definitions those works state, verified numerically, not a page-level reading of the papers."
redistribution = "Primary work is cited, not redistributed. The reference script and its frozen output are repository-authored (MIT OR Apache-2.0); mpmath is used only to produce the frozen values and is not a product dependency."
limitations = "Five ridge cases (including columns correlated to 1 - 1e-6 with lambda 1e-6, and an unpenalized intercept column) of up to 20 rows and 4 columns; nine elastic-net configurations of up to 20 rows and 4 columns, solved by exhaustive active-set and sign enumeration; four strongly correlated 200-row, 3-column designs. Larger problems, an exact match to coordinate descent's iteration path and wide (p > n) designs are not covered. The exact reference needs at most 4 columns. At the default tolerance the fitted values are asserted within 20 times tol times the response norm of the exact minimizer; the coefficients can be farther away than that when predictors are strongly correlated, because the stopping rule limits sweep movement rather than distance to the minimizer. The two cited works were not retrieved. The reference script declares its inline script metadata but is not run in a locked, isolated environment and is not wired into any gate; its output is frozen in the JSON file and compared by the test."
sources = ["https://doi.org/10.1080/00401706.1970.10488634", "https://doi.org/10.1111/j.2517-6161.1996.tb02080.x", "https://mpmath.org/doc/1.3.0/", "https://docs.python.org/3/library/fractions.html"]
findings_resolved = ["Ridge matches the exact rational solution of the penalized normal equations in every case, including the nearly collinear one (coefficients near 340 in magnitude, agreement 1e-6 relative) and with a leading unpenalized intercept column.", "Coordinate descent run to a tight tolerance reproduces the exact minimizer from 80-digit active-set enumeration with Karush-Kuhn-Tucker verification, across intercept and no-intercept fits, raw and standardized columns with scales that differ by two orders of magnitude, l1 ratios 1 and 0.5, a lambda near zero and one at 95 percent of the smallest lambda that zeroes every coefficient; coordinates the exact solution zeroes are exactly zero.", "At the default tolerance on predictors correlated at 0.9 and 0.99 the fit converges and the fitted values stay within a small multiple of the tolerance of the minimizer; the coefficients are determined less tightly, which is recorded as a limit of the stopping rule rather than corrected.", "No product defect was found in this record."]
