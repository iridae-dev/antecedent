[method_review]
status = "reviewed_with_limits"
scope = "AssociationEstimator::prepare and ::estimate and select_analysis in crates/antecedent-estimate/src/association.rs for a real, 0/1 or count outcome of rows or of one series: the selection rule over the outcome scale, functional and predictor types and its refusals; complete-row filtering and the design (numeric columns, categorical indicators with the declared reference, equal-count coarsening of a numeric column of more than 64 values into strata); stratified means and probabilities with the linearised (rows) and fixed-b, centring-corrected Bartlett Newey-West (series) error of a weighted group mean; linear, logistic and Poisson regression with the leverage-adjusted influence error (rows) and Newey-West error (series) built from the weighted scores and Fisher weights; the Pearson correlation with its Kish-count delta error and the unbiased distance correlation with its leave-one-out jackknife error and normal spread; the row bootstrap and circular-block bootstrap summaries (standard error, fixed-b scale, percentile spread, fit-failure handling); the Bayesian bootstrap on Dirichlet row weights and on contiguous block weights; the conjugate Normal-Inverse-Gamma marginals with the stated prior; and the out-of-fold predictions with their plug-in predictive laws and training baselines. Relies on, and does not re-review, the HC1 and Newey-West sandwich arithmetic (stats.robust_covariance), the weighted GLM fits (stats.glm), the circular-block index law (data.resample), the exponential Dirichlet weight law (data.bayesian_bootstrap) and the Normal-Inverse-Gamma core (estimate.switchback.bayesian); this review checks the route arithmetic that feeds them: which rows enter, the scores and information weights, the lag, the weights and the prior it builds. Not the proper-score formulas that consume the held-out cases (predictive_assessment.proper_scores), the compiled-route wrapper in crates/antecedent/src/analysis/association.rs, the coverage of any interval (measured by the calibration records, not by this review), the choice of the block length by the Politis-White rule, or the fitted constants of the fixed-b scale. The count_prior option (with_count_prior, count_conjugate, count_conjugate_method, ConjugateCell) is read for its closed-form conjugate cells: with a Beta prior a 0/1 or exceedance-indicator outcome gives Beta(a + k, b + n - k) per stratum from the count of successes k in n rows, with a Gamma prior a count outcome gives Gamma(shape + sum y, rate + n) per stratum over unit exposure, each with its equal-tailed credible interval at SPREAD_LEVEL, marginal likelihood and one-unit predictive taken from the antecedent-prob posterior types, and the refusals (no sampling-weight column, no matching prior family, a continuous conditional mean, a prior without Bayesian settings). The posterior algebra of those types is not re-derived here. The later scratch refit gathers positive-weight rows in original draw order, including repeats, and reuses coefficients and least-squares buffers. The paired reference unit test compares coefficients and HC1 errors against a materialized duplicate-row fit. Draw weighting and the NaN fallback for failed studentization are unchanged."
assumptions = ["Every quantity is descriptive of the observed joint law of the columns; no causal reading, no identification and no coverage claim attaches to any standard error, spread or posterior interval.", "Rows are independent for a table and a stationary dependent series for a series, as the declared sampling design states; the sandwiches and resamples do not detect a violation.", "The resampling streams, the exponential draws and the shuffled fold assignment are taken from the library as frozen data after the test regenerates them; their statistical law is the subject of the data.resample and data.bayesian_bootstrap reviews, and a changed stream fails the test visibly.", "Weights are sampling weights: a row of zero weight is out of the sample, and a positive weight multiplies the row's score and Fisher information."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the product source named in its scope and the numerical helpers it calls, and compared results with definitions evaluated by executing references written for this review; no upstream implementation or test source was consulted or copied. None of the cited publications was retrieved in this review: the correspondence is between the product code and the standard definitions those works state (the HC1 and Bartlett Newey-West sandwiches, the Bayesian bootstrap weights, the circular block bootstrap, the unbiased distance correlation and its delete-one jackknife, the fixed-b stratum error and the conjugate Normal-Inverse-Gamma posterior), verified numerically, not a page-level reading of the papers."
redistribution = "Primary work is cited, not redistributed. The reference script and its frozen output are repository-authored (MIT OR Apache-2.0); the script uses mpmath (BSD-3-Clause), imported at run time and not redistributed here. The script declares its inline script metadata but is not run in a locked, isolated environment and is not wired into any gate; its output is frozen in the JSON file and compared by the test, which also regenerates the library streams the script consumes."
limitations = "29 direct cases and 24 resampling, posterior and prediction cases on tables of 3 to 200 rows (a series of 12 to 100 points): an outcome offset of 1e7 with a covariate offset of 1e3, two predictors correlated at 0.99999, weights from 1e-3 to 1e3 with a zero weight and a leverage point at 40 standard deviations, a model with one residual degree of freedom, weighted logistic and Poisson fits, a singleton stratum, ties, a numeric column coarsened into 64 bins, a categorical predictor, missing cells, and resamples that are singular or mostly undefined. Estimates are asserted to 1e-9 relative for the linear and group-mean routes, 1e-6 for the offset and near-collinear linear cases and for the maximum likelihood fits (their IRLS stops at a score norm of about 1e-8), and standard errors to 1e-9, 1e-5 for those. The reference checks the route arithmetic against definitions and relies on the cited sandwich, GLM, resample, weight-law and posterior kernels rather than re-deriving them. Not independently referenced: the Politis-White block length and the polynomial of the fixed-b scale (the reference restates the polynomial from the source, so the scale and the block length are consumed from the library, not derived; the polynomial is an empirical fit, not a theorem); the uniform-to-exponential and shuffle laws behind the frozen draws, which are compared to the library's regeneration but whose distribution is not examined here; the numerical conditioning of the distance-correlation kernel itself (the V-statistic kernel in antecedent-stats, now used only for the bootstrap draws and the small-sample fallback, centres its inputs itself, checked against exact rationals in its own unit test, and returns NaN for a constant series, which this route refuses as it refuses the Pearson route); the O(n) leave-one-out identities of the unbiased distance numerators, which the reference does not port (it recomputes every leave-one-out sample from the definition, so the identities are checked against it, on ten- and twenty-row cases only); the first-order centring factor of the stratum-series error and the fixed-b polynomial applied at the stratum's support (derived and simulated, not covered by a theorem for a bursty regime indicator); a logistic or Poisson bootstrap of a small table (a resample can be separated, a draw then does not fit, and the reference was run only for linear, group-mean and correlation resamples); Newey-West covariances of a series with zero-weight rows (the lags run over the compacted rows of positive weight, which the reference does not exercise); a table above the strata cap beyond its refusal; cancellation mid-run; and the compiled route. The held-out cases are checked as inputs to scoring; the proper scores are reviewed elsewhere. The cited papers were not retrieved by this review, nor by any contributor to it. The reference script is not run in a locked, isolated environment and is not wired into any gate. Scoped source comparison of the conjugate count cells against the textbook Beta-Binomial and Gamma-Poisson updates: the successes are the rounded sum of the validated 0/1 indicator in the stratum, the exceedance outcome is the indicator of a value above the threshold, the counts are the rounded validated counts, and the posterior hyperparameters are the prior hyperparameters plus the successes and failures or the total count and the number of rows; the closed-form values are asserted in the cited facade tests, and this adds no calibration evidence. An empty stratum would return its prior unchanged."
sources = ["https://doi.org/10.2307/1912934", "https://doi.org/10.2307/1913610", "https://doi.org/10.1214/aos/1176347265", "https://doi.org/10.1214/009053607000000505", "https://doi.org/10.1214/14-AOS1255", "https://doi.org/10.1017/S0266466605050565", "https://doi.org/10.1214/aos/1176345338", "https://doi.org/10.1198/016214506000001437", "https://mpmath.org/"]
findings_resolved = ["Defect repaired: the distance correlation was the V-statistic, biased upward in finite samples (about +0.023 at 100 rows and +0.0115 at 200 rows for a bivariate normal law of correlation 0.5), so an interval around it under-covered (a simulated jackknife normal interval 0.925 and 0.924 at 100 and 200 rows) and so did the percentile and bias-corrected bootstrap of it. The point is now the unbiased U-centred root with a delete-one jackknife normal spread (simulated 0.951 and 0.940), checked against a direct leave-one-out recomputation of the definition (failing first: distance_with_ties, estimate 0.5582 against 0.2961, and distance_offset_nonlinear, 0.7182 against 0.6642).", "Defect repaired: the error of the mean of one stratum of a series ignored that the influence series is zero off the stratum and is a residual at the estimated mean, which left its Newey-West interval under-covering (pilot 0.9125 at 400 and 0.935 at 2000 replicates for a persistent regime); it now reads the fixed-b ratio at the stratum's rows and divides the variance by one minus the bandwidth over those rows (simulated 0.9515 at 6000 replicates, against 0.946 with the fixed-b ratio alone).", "Defect repaired: the error of a weighted group mean divided by the number of rows in the group including rows of zero weight (n_k/(n_k-1) over all members) while the regression routes drop zero-weight rows, so a zero-weight row changed the error. It now counts the rows of positive weight, as the definition of the linearised error over the sampled units requires (failing first: strata_weighted_zero_weight_row, error 0.2894 against the definition's 0.2953).", "Defect repaired: a categorical predictor or conditioning column always omitted its lowest present level and ignored the reference level its own domain declares, so the coefficients of a column with a declared reference were relative to a level the caller had not chosen. The declared reference is now the omitted indicator when the rows hold it (failing first: categorical_declared_reference_regression).", "Defect repaired: the distance correlation of a series far from zero lost digits in the Fenwick-tree identities (about 1.5e-4 relative at an offset of 1e6 with unit spread), though the statistic is shift-invariant; the kernel now centres its inputs, so the estimator no longer does (failing first: distance_offset_nonlinear); a constant column on the distance route is refused as on the Pearson route, no longer reported as zero.", "HC1 for rows and Bartlett Newey-West for a series equal the exact definitions for linear, weighted logistic and weighted Poisson fits, including the offsets, near-collinear predictors, extreme weights, a zero weight, a leverage point and a single residual degree of freedom; the truncation lag floor(4 (n/100)^(2/9)) was checked at 12, 50, 60 and 100 points.", "The weighted group-mean errors (linearised and the fixed-b, centring-corrected Newey-West of a series), the Pearson delta error on the Kish count, the conjugate Student-t marginals with the stated prior (including an outcome offset of 1e7 and near-collinear predictors) and the out-of-fold predictions with their predictive and baseline laws equal their references; the circular-block, row and Bayesian bootstrap summaries equal exact recomputation from the frozen library draws, including singular and mostly undefined resamples (the analytic error is kept when fewer than half the replicates fit), and the selection rule equals its documented decision table over thirty-three cases.", "No defect found in the conjugate count cells: the per-stratum Beta(a + k, b + n - k) and Gamma(shape + sum y, rate + n) updates, the unit-weight requirement and the family refusals match the stated conjugate method."]
