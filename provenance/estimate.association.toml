papers = [
 { title = "A Heteroskedasticity-Consistent Covariance Matrix Estimator and a Direct Test for Heteroskedasticity", doi = "10.2307/1912934", sections = ["the heteroskedasticity-consistent sandwich covariance of a regression coefficient"] },
 { title = "A Simple, Positive Semi-Definite, Heteroskedasticity and Autocorrelation Consistent Covariance Matrix", doi = "10.2307/1913610", sections = ["the Bartlett-kernel long-run covariance of the estimating scores"] },
 { title = "The Jackknife and the Bootstrap for General Stationary Observations", doi = "10.1214/aos/1176347265", sections = ["the moving and circular block bootstrap of a stationary series"] },
 { title = "Measuring and testing dependence by correlation of distances", doi = "10.1214/009053607000000505", sections = ["distance covariance and distance correlation of two samples"] },
 { title = "The Bayesian Bootstrap", doi = "10.1214/aos/1176345338", sections = ["Dirichlet weights on the observed rows as a posterior over the sampling distribution"] },
 { title = "Strictly Proper Scoring Rules, Prediction, and Estimation", doi = "10.1198/016214506000001437", sections = ["the logarithmic, Brier and continuous ranked probability scores"] },
]

# Derived from the cited constructions applied to a descriptive association, NOT an exact
# estimator analysed in any one paper. Nothing here estimates a causal quantity; the guarantees
# of the cited procedures do not transfer to an intervention effect.
implementation_deviations = [
 "The declared selection rule (association_selection_rule) is this project's own: it reads the outcome scale and the functional and picks a stratified mean or probability, linear, logistic or Poisson regression, a Pearson or distance correlation, or a predictive model. It is a deterministic dispatch, not an estimator from any paper.",
 "Regression standard errors are the HC1 sandwich with Fisher-weight bread for rows and the Newey-West sandwich for a series; the truncation lag floor(4 (n / 100)^(2/9)) is the common rule of thumb, not an optimal bandwidth.",
 "The circular-block bootstrap takes its block length from the outcome's own persistence (the shared dependence rule), not from the persistence of every estimating score, and scales the replicate standard deviation by the circular fixed-b factor. Replicate standard errors and percentile spreads are uncalibrated: no coverage record measures them.",
 "The Gaussian Bayesian reading is the conjugate Normal-Inverse-Gamma marginals with an independent weakly informative prior scaled to the outcome and per-stratum models for conditional means; every other Bayesian reading, a weighted study and a dependent series use the Bayesian bootstrap (Dirichlet weights on rows, or on contiguous blocks of a series), which has no prior and no likelihood.",
 "Predictive models are scored on held-out folds with plug-in predictive laws (the fitted mean and the training residual standard deviation for a real outcome, the fitted probability for a 0/1 outcome, the fitted rate for a count) against the training-mean baseline. A series is split into consecutive blocks with no embargo. Scores are point values.",
 "The Pearson correlation standard error for rows is the normal-theory delta approximation on the Kish effective row count; the distance correlation reports no analytic standard error and has no weighted form.",
 "A group mean's linearised or Newey-West error divides by the number of rows of positive weight in the group (a zero-weight row is not part of the sample the mean describes, as in the regression routes), and the HC1 factor of a regression is n/(n-p) over the rows of positive weight, not over a Kish count.",
 "A categorical predictor enters a regression as indicators of every level present except the omitted one, which is the level the column's domain declares as its reference when the rows hold it and otherwise the lowest level present.",
]

upstream_implementations_observed = []

test_sources = [
 "crates/antecedent-estimate/src/association.rs (closed-form least-squares slope and HC1 variance of a simple regression, group means with the sample standard error, a two-by-two table's conditional probabilities and log-odds ratio, a symmetric quadratic's zero Pearson correlation)",
 "crates/antecedent/tests/association_route.rs (the same closed forms through the compiled route, selection determinism, circular-block resampling under the declared design, conjugate and bootstrap posteriors)",
 "python/tests/test_association_compiled.py (the same closed forms through analyze, portable export and load)",
 "crates/antecedent-estimate/tests/estimate_association_reference.rs (exact-rational and 80-digit references for the linear, logistic and Poisson fits with their HC1 and Newey-West errors, weighted group means and their errors, the Pearson error, the distance correlation, the conjugate Normal-Inverse-Gamma marginals, the row and circular-block bootstrap and the Bayesian bootstrap on the library's own frozen streams, the out-of-fold predictions, and the selection decision table)",
]

[method_review]
status = "reviewed_with_limits"
scope = "AssociationEstimator::prepare and ::estimate and select_analysis in crates/antecedent-estimate/src/association.rs for a real, 0/1 or count outcome of rows or of one series: the selection rule over the outcome scale, functional and predictor types and its refusals; complete-row filtering and the design (numeric columns, categorical indicators with the declared reference, equal-count coarsening of a numeric column of more than 64 values into strata); stratified means and probabilities with the linearised (rows) and Bartlett Newey-West (series) error of a weighted group mean; linear, logistic and Poisson regression with the HC1 (rows) and Newey-West (series) slope covariance built from the weighted scores and Fisher weights; the Pearson correlation with its Kish-count delta error and the distance correlation; the row bootstrap and circular-block bootstrap summaries (standard error, fixed-b scale, percentile spread, fit-failure handling); the Bayesian bootstrap on Dirichlet row weights and on contiguous block weights; the conjugate Normal-Inverse-Gamma marginals with the stated prior; and the out-of-fold predictions with their plug-in predictive laws and training baselines. Relies on, and does not re-review, the HC1 and Newey-West sandwich arithmetic (stats.robust_covariance), the weighted GLM fits (stats.glm), the circular-block index law (data.resample), the exponential Dirichlet weight law (data.bayesian_bootstrap) and the Normal-Inverse-Gamma core (estimate.switchback.bayesian); this review checks the route arithmetic that feeds them: which rows enter, the scores and information weights, the lag, the weights and the prior it builds. Not the proper-score formulas that consume the held-out cases (predictive_assessment.proper_scores), the compiled-route wrapper in crates/antecedent/src/analysis/association.rs, the coverage of any interval (all are unmeasured), the choice of the block length by the Politis-White rule, or the fitted constants of the fixed-b scale."
assumptions = ["Every quantity is descriptive of the observed joint law of the columns; no causal reading, no identification and no coverage claim attaches to any standard error, spread or posterior interval.", "Rows are independent for a table and a stationary dependent series for a series, as the declared sampling design states; the sandwiches and resamples do not detect a violation.", "The resampling streams, the exponential draws and the shuffled fold assignment are taken from the library as frozen data after the test regenerates them; their statistical law is the subject of the data.resample and data.bayesian_bootstrap reviews, and a changed stream fails the test visibly.", "Weights are sampling weights: a row of zero weight is out of the sample, and a positive weight multiplies the row's score and Fisher information."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the product source named in its scope and the numerical helpers it calls, and compared results with definitions evaluated by executing references written for this review; no upstream implementation or test source was consulted or copied. None of the cited publications was retrieved in this review: the correspondence is between the product code and the standard definitions those works state (the HC1 and Bartlett Newey-West sandwiches, the Bayesian bootstrap weights, the circular block bootstrap, the distance correlation V-statistic and the conjugate Normal-Inverse-Gamma posterior), verified numerically, not a page-level reading of the papers."
redistribution = "Primary work is cited, not redistributed. The reference script and its frozen output are repository-authored (MIT OR Apache-2.0); the script uses mpmath (BSD-3-Clause), imported at run time and not redistributed here. The script declares its inline script metadata but is not run in a locked, isolated environment and is not wired into any gate; its output is frozen in the JSON file and compared by the test, which also regenerates the library streams the script consumes."
limitations = "29 direct cases and 24 resampling, posterior and prediction cases on tables of 3 to 200 rows (a series of 12 to 100 points): an outcome offset of 1e7 with a covariate offset of 1e3, two predictors correlated at 0.99999, weights from 1e-3 to 1e3 with a zero weight and a leverage point at 40 standard deviations, a model with one residual degree of freedom, weighted logistic and Poisson fits, a singleton stratum, ties, a numeric column coarsened into 64 bins, a categorical predictor, missing cells, and resamples that are singular or mostly undefined. Estimates are asserted to 1e-9 relative for the linear and group-mean routes, 1e-6 for the offset and near-collinear linear cases and for the maximum likelihood fits (their IRLS stops at a score norm of about 1e-8), and standard errors to 1e-9, 1e-5 for those. The reference checks the route arithmetic against definitions and relies on the cited sandwich, GLM, resample, weight-law and posterior kernels rather than re-deriving them. Not independently referenced: the Politis-White block length and the polynomial of the fixed-b scale (the reference restates the polynomial from the source, so the scale and the block length are consumed from the library, not derived; the polynomial is an empirical fit, not a theorem); the uniform-to-exponential and shuffle laws behind the frozen draws, which are compared to the library's regeneration but whose distribution is not examined here; the numerical conditioning of the distance-correlation kernel itself (the kernel in antecedent-stats now centres its inputs itself, checked against exact rationals in its own unit test, and returns NaN for a constant series, which this route refuses as it refuses the Pearson route); a logistic or Poisson bootstrap of a small table (a resample can be separated, a draw then does not fit, and the reference was run only for linear, group-mean and correlation resamples); Newey-West covariances of a series with zero-weight rows (the lags run over the compacted rows of positive weight, which the reference does not exercise); a table above the strata cap beyond its refusal; cancellation mid-run; and the compiled route. The held-out cases are checked as inputs to scoring; the proper scores are reviewed elsewhere. The cited papers were not retrieved by this review, nor by any contributor to it. The reference script is not run in a locked, isolated environment and is not wired into any gate."
sources = ["https://doi.org/10.2307/1912934", "https://doi.org/10.2307/1913610", "https://doi.org/10.1214/aos/1176347265", "https://doi.org/10.1214/009053607000000505", "https://doi.org/10.1214/aos/1176345338", "https://doi.org/10.1198/016214506000001437", "https://mpmath.org/"]
findings_resolved = ["Defect repaired: the error of a weighted group mean divided by the number of rows in the group including rows of zero weight (n_k/(n_k-1) over all members) while the regression routes drop zero-weight rows, so a zero-weight row changed the error. It now counts the rows of positive weight, as the definition of the linearised error over the sampled units requires (failing first: strata_weighted_zero_weight_row, error 0.2894 against the definition's 0.2953).", "Defect repaired: a categorical predictor or conditioning column always omitted its lowest present level and ignored the reference level its own domain declares, so the coefficients of a column with a declared reference were relative to a level the caller had not chosen. The declared reference is now the omitted indicator when the rows hold it (failing first: categorical_declared_reference_regression).", "Defect repaired: the distance correlation of a series far from zero lost digits in the Fenwick-tree identities (about 1.5e-4 relative at an offset of 1e6 with unit spread), though the statistic is shift-invariant; the kernel now centres its inputs, so the estimator no longer does (failing first: distance_offset_nonlinear); a constant column on the distance route is refused as on the Pearson route, no longer reported as zero.", "HC1 for rows and Bartlett Newey-West for a series equal the exact definitions for linear, weighted logistic and weighted Poisson fits, including the offsets, near-collinear predictors, extreme weights, a zero weight, a leverage point and a single residual degree of freedom; the truncation lag floor(4 (n/100)^(2/9)) was checked at 12, 50, 60 and 100 points.", "The weighted group-mean errors (linearised and Newey-West), the Pearson delta error on the Kish count, the conjugate Student-t marginals with the stated prior (including an outcome offset of 1e7 and near-collinear predictors) and the out-of-fold predictions with their predictive and baseline laws equal their references; the circular-block, row and Bayesian bootstrap summaries equal exact recomputation from the frozen library draws, including singular and mostly undefined resamples (the analytic error is kept when fewer than half the replicates fit), and the selection rule equals its documented decision table over thirty-three cases."]
record_sha256 = "3e206af46d251b64fdd42820cf66d1a0c5f3e43bbede30c67ba3ea1dc147bb21"

