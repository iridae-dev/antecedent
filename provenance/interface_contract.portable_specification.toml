# Algorithm provenance for interface_contract.portable_specification (see docs/interface-contracts.md).

feature_id = "interface_contract.portable_specification"
implementation_crate = "antecedent-io-core"
source_translation = false
copied_code = false
copied_comments = false
copied_tests = false

# The specification fixes a container layout, a CBOR profile (RFC 8949), a length-framed canonical
# stream and BLAKE3 identities. BLAKE3 is specified by its authors' paper and reference
# implementation; the clean-room consumer implements the reference algorithm and checks it
# against the published test vectors.
papers = [
  { title = "Concise Binary Object Representation (CBOR)", doi = "10.17487/RFC8949", sections = ["Sections 3 and 4"] },
]

implementation_deviations = [
  "The clean-room consumer decodes only the CBOR subset the formats use (definite and indefinite lengths, integers, text, arrays, maps with text keys, booleans, null and floats); it is not a general CBOR implementation.",
  "The clean-room consumer checks the evidence ledger by its artifact identity and structure and recomputes the fixed-effect inverse-variance syntheses; it does not replay the ledger's chained operation identities and says so.",
]

upstream_implementations_observed = []

modules = [
  "crates/antecedent-core/src/identity.rs",
  "crates/antecedent-io-core/src/interface_contract_artifact.rs",
]

test_sources = [
  "crates/antecedent/tests/specification_conformance.rs (fixtures regenerate bit for bit; spec/consumer/validate.py accepts and rejects the committed fixtures and mutated copies; vocabulary tables equal the implementation)",
  "conformance fixtures generated by the Rust implementation from real contracts, ledgers and bundles",
  "BLAKE3 vectors from the reference implementation and the published test vectors",
  "mutated copies of every accepted fixture rejected by the independent consumer",
]

[method_review]
status = "reviewed_with_limits"
scope = "The canonical identity stream (CanonicalWriter in crates/antecedent-core/src/identity.rs: little-endian words, length-framed bytes and texts, reals as bit patterns, presence words, a domain tag first, BLAKE3 over the stream) and the interface-contract artifact identity and metadata layout (crates/antecedent-io-core/src/interface_contract_artifact.rs) as written in spec/canonicalization-and-identity.md, checked by spec/consumer/validate.py, a second consumer that imports nothing from the library and carries its own CBOR decoder, container reader, canonical writer and reference BLAKE3. Not line-by-line reviewed here: the container reader and writer (container.rs), the evidence-ledger artifact (evidence_ledger_artifact.rs) and the composition-bundle artifact (composition_bundle.rs); they are exercised only through the conformance fixtures the same consumer accepts and rejects."
assumptions = ["The product takes BLAKE3 from the published blake3 crate; the clean-room consumer re-implements the reference algorithm and is itself checked against vectors in spec/conformance/blake3_vectors.json before any identity is trusted, so agreement is between two implementations of one published function, not a proof of the function.", "The specification text, not the product, is the normative statement; the consumer was written from that text, but its author is the same project, so independence is of code and not of authorship."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the canonical writer and the artifact metadata code named in its scope and executed the repository's second consumer against the fixtures the Rust implementation generates; no upstream implementation or test source was consulted or copied. RFC 8949 and the BLAKE3 specification were not retrieved in this review: the CBOR subset and the BLAKE3 algorithm are checked by the consumer against the fixtures and the vectors recorded in the repository, not against the documents."
redistribution = "RFC 8949 is cited, not redistributed. The specification, the consumer, the fixtures and the BLAKE3 vector file are repository-authored (MIT OR Apache-2.0) and the consumer uses only the Python standard library; the vector file records inputs and outputs of the published algorithm."
limitations = "Agreement is demonstrated on the committed fixtures only: a handful of accepted contracts, one pooled evidence ledger and one composition bundle, plus mutated copies of every accepted fixture that the consumer must reject. The BLAKE3 vector file holds 22 inputs of 0 to 31,744 bytes (block, chunk and tree boundaries at 63 to 65, 127 to 129, 1,023 to 1,025 and 2,048 to 3,073 bytes); inputs beyond that, the keyed and derive-key modes and extendable output are not exercised, and the identities use the default mode only. No fuzzing of the container, no property test over random contracts, and no check of non-ASCII or very long texts beyond what the fixtures contain. The consumer does not replay the evidence ledger's chained operation identities (it says so), and does not implement Zstandard, so compressed sections are refused rather than read. The Rust side of the check is a test in the antecedent crate; this review does not claim the specification is complete for formats other than the three it names."
sources = ["https://doi.org/10.17487/RFC8949"]
findings_resolved = ["No defect found: the committed fixtures regenerate bit for bit from real contracts, ledgers and bundles, the consumer accepts every accepted fixture and rejects every mutated copy with the expected class, and its vocabulary tables equal the implementation's."]
record_sha256 = "7ce5909637b04fee0f1201302473800f21ae9b3a92063bb500685aa689c131dc"

