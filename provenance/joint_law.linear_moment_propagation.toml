[method_review]
status = "reviewed_with_limits"
scope = "linear_combination_moments (mean a'mu and variance a'Sigma a under a supplied covariance, including the positive-semidefinite check and the zero floor for rounding) and normal_interval_candidate (mean +- z sqrt(variance)) in crates/antecedent-stats/src/joint_law.rs. Not the nonlinear or aligned-draw propagation, the envelopes, or the contract rule."
assumptions = ["The covariance supplied is the covariance of the inputs including cross terms; a diagonal matrix is the caller's declaration of uncorrelatedness and is not tested.", "The normal interval is a construction at unmeasured coverage; its reference value is z = sqrt(2) erfinv(level) at 50 digits."]
historical_exposure = "Historical author exposure cannot be independently established. This review read the product source named in its scope and wrote its own reference, which does not use the comonotone, countermonotone or Makarov forms of the product: it enumerates every integer contingency table with the marginal counts (all vertices of the transportation polytope) in exact rational arithmetic and evaluates the remaining quantities from their definitions. No upstream implementation was consulted."
redistribution = "The reference script and its frozen output are repository-authored under MIT OR Apache-2.0; mpmath is used only to produce the frozen values and is not a product dependency. No cited paper is redistributed."
limitations = "The delta method is exact for a linear map, so this review checks arithmetic against exact rationals (four cases: a contrast, a weighted sum, three terms with a non-trivial covariance, and a rank-one covariance giving variance zero) and the normal quantile against mpmath to 1e-9 over five levels including 0.5, 0.999 and zero variance. It does not exercise covariances near the positive-semidefinite boundary, large condition numbers, or the 256-term limit, and says nothing about whether the Gaussian approximation or the supplied covariance is appropriate for the quantity."
sources = ["https://mpmath.org/doc/1.3.0/"]
findings_resolved = ["No numerical defect was found: means and variances of the four linear combinations agree with exact rational evaluation (the perfectly correlated contrast returns exactly zero), and the normal interval agrees with mpmath to 1e-9 relative to the standard deviation, including the zero-variance and 0.999-level cases."]
