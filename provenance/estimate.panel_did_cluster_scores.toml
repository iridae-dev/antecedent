implementation_deviations = [
 "Implements the unconditional mean-difference estimators only: no covariates, no outcome regression or propensity weighting. The augmented, covariate-adjusted and not-yet-treated rollout variants are other records.",
 "Balanced two-period panel: the effect is the difference of the treated and comparison group means of each subject's post-minus-pre change. The standard error is the cluster score sandwich sqrt(G/(G-1) * sum_c s_c^2) with s_c the sum over the cluster's subjects of the signed, group-centered change divided by the group size, clusters required to nest within treatment arms. It is the cluster-robust variance of the difference of two means with a G/(G-1) correction, not the Liang-Zeger small-sample (N-1)/(N-K) factor.",
 "Repeated cross-section: the effect is the difference of the two group-by-period mean differences over the four cells, with the same cluster score sandwich over the four centered cell scores; one row per subject is required.",
 "Staggered event study: balanced panel, adoption cohorts compared with never-treated units only, event-time contrasts relative to the cohort's period g-1, each with the cluster score sandwich of the difference of two means. These are the group-time ATT of Callaway and Sant'Anna with a never-treated comparison group and no covariates, reported per cohort and calendar period; the Sun-Abraham interaction-weighted aggregation across cohorts and the aggregation weights of Callaway and Sant'Anna are not computed.",
 "The pointwise 95% interval is estimate +/- the 0.975 normal quantile times the standard error, published only with at least 30 independent clusters per arm (per group-by-period cell for the repeated cross-section; 24 treated and 24 control clusters and 48 in all for each post-adoption event-time contrast). That cluster gate and the normal reference are repository support policy established by the coverage simulations, not a result of the cited papers.",
 "Parallel untreated trends and no anticipation are declared assumptions; two periods cannot test them, and the staggered pre-adoption contrasts are descriptive only.",
]

