  "The bounded candidate retains tabular source rows (50 to 10000, finite outcomes) with distinct row-aligned subject identities, a population and variable roles, a declared independent randomized-arm design, and a declared treated-arm missing-pattern shift whose magnitude is at most two pooled within-arm standard deviations of the observed outcomes. Arms may be unbalanced (at least 15 assigned and 2 observed outcomes each) and at most half of either arm may be missing. The control arm's shift is zero. Randomization, independence and the unobserved missingness mechanism are declared assumptions, not established by the rows.",
  "The native operation and its source, including the declared shift, are reconstructed and independently replayed; the measured adapter and calibration harness share one implementation. The interval is released only when an attesting coverage record matches the construction and covers the execution's row count and its declared-shift and largest-arm missingness bands, which are keyed in the functional; otherwise the route refuses through the shared calibration resolver. The calibration harness measures a grid over shift, missingness and row count with arbitrary treatment effects and Gaussian or skewed outcomes; no record is asserted here.",
  "The delta-method construction conditions on the declared shift as a known constant and does not carry the uncertainty of the pooled standard deviation used to bound it. No independent scientific review or attestation is asserted; a coverage record established by the grid measurement supplies the licence.",
]
