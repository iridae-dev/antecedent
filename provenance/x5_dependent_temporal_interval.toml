# A cluster (whole-unit) bootstrap: every complete history of a drawn unit moves together
# and the whole two-step estimator is re-run on each replicate. No single paper is cited
# because the record claims no consistency theorem for this bootstrap on this
# functional and no precise section of a bootstrap reference was checked against the
# code, so papers = [] is an explicit judgment, not an unfilled field. The generic
# cluster-bootstrap draw is recorded under data.resample.
