implementation_deviations = ["Not an implementation of a published estimator with an inherited guarantee: percentile or basic intervals over a seeded set of unit-resampled replicates (20 to 2000 replicates, units drawn with replacement from the observed units), each replicate re-running the whole history-conditioned estimator. These legacy constructions remain separate. The distinct equal-tailed bootstrap-t construction uses exact balanced complete-history unit contributions and finite positive original/per-resample unit-mean SE through a closed BalancedTemporalEstimator; The checked native adapter and independently replayed artifact enforce this balanced certificate. The public Rust trait hook can be overridden by advanced implementations; that hook remains unmeasured and does not independently certify arbitrary callbacks. B500 on original frozen unit50/100/200 and checked64/128/256 grids;20..4096 units for the studentized path. No bias correction or second-level bootstrap.", "No consistency or coverage theorem is derived or inherited for this functional. Historical percentile/basic response measurements at 623f16dd failed at 64 checked units and 200 balanced units (rechecks1873/2000,1867/2000,1861/2000,1857/2000;zero skips). Passing paired-effect methods are retained separately. The distinct studentized IDs remain unmeasured: the engine reports claim dependence_preserving_calibration_unmeasured and calibration unmeasured, and the public route stays closed (cell_not_licensed / temporal_interval.route_frozen) after validating its arguments. The corrected construction requires its own complete grid measurement; the original failures remain retained in parity/2_3_carryover_disposition.md.", "Failed replicates (an estimator unsupported on the resample) are counted and dropped up to a bounded fraction, then the interval refuses; fewer than the minimum number of repeated units (default 20, never below 2) refuses as too_few_clusters.", "The internal replay artifact embeds the full unit panel and every replicate (whole-unit replicate id, unit-selection digest, re-estimated point), so a consumer re-runs the whole resampling and rejects a changed unit, time id, value or snapshot even when resealed. Studentized replay also binds original unit-score variance, aligned replicate standard errors and pivots; legacy records omit that optional field. Digests are non-cryptographic fingerprints.", "The new calibration-internal retained-family adapter executes actual raw-source preparation and its original numerical engine. Actual successful solve/draw or source factor/program/whole-unit work is observed. Independent source replay binds complete raw evidence and graph/program; compatible summaries retain state without new fitting. These acceptance fixtures do not measure coverage or activate the public inference route."]
