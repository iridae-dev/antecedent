# Original engineering: a durable declaration of a study (kind, population, regimes,
# sample, recruitment, timing, unit and cluster rules, cost with units, expected
# evidence, optional provider) with a content-digest semantic id. No paper
# introduces it, so papers is explicitly empty; it supplies hypothetical evidence to
# the theorem checkers cited in provenance/design.identification_repair.toml.
papers = []

implementation_deviations = [
  "A candidate never claims evidence it cannot collect: observing separate regimes or separate marginals cannot claim a joint law, and missing unit, timing, recruitment, sample-size, cost or cost-unit semantics refuse as study_candidate.wrong_contract.",
  "The semantic id sc1:<digest> is a content fingerprint independent of ordering and of the human label; it is not a security token.",
  "Proposed regimes are marked Proposed and tied to the semantic id; they are hypotheses and never become available evidence.",
  "Cost units are labels; they are never assumed to equal outcome utility, and ranking compares only equal labels.",
  "The older planner-specific StudyCandidate of study_planner is unchanged. No causal, interval or calibration claim is made.",
]

