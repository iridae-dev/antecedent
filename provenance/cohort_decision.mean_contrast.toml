[non_algorithm_review]
status = "justified_non_algorithm"
kind = "derivation"
rationale = "A weighted mean of the conditional contrast predictions of a retained model over a declared cohort is the cohort expectation of an affine utility, issued point-only with a model-based standard error diagnostic."
no_independent_algorithm = "cohort_decision.rs predicts each cohort row (a compact-export basis evaluation or a portable learner's own prediction), takes the compensated weighted sum of the row contrasts, and recomputes sqrt(phibar' V phibar) from the retained covariance; the support check and the covariate-shift check compare declared contracts and reweight nothing."
covered_by = ["estimate.compact_runtime_export", "cohort_decision.interval"]
derivation = "E_cohort[tau(X)] = sum_i w_i tau(x_i) with sum w_i = 1, tau(x) = c'phi(x) for a linear compact model, so the mean contrast is c'phibar with phibar = sum w_i phi(x_i) and the standard error is sqrt(phibar' V phibar); crates/antecedent-estimate/tests/cohort_linear_effect.rs compares the point and the standard error to a 50-digit reference to 1e-9 and 1e-8 relative."
