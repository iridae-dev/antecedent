implementation_deviations = [
  "The implementing module is crates/antecedent-estimate/src/switchback_posterior.rs. It states: It identifies that effect only under no carryover and no between-sequence interference, and its interval is a design-based statement, not a posterior.",
  "A posterior needs a likelihood for the within-sequence dependence, so this module states one and refuses to run without it: The outcome of sequence s is y_s = X_s b + e_s, e_s ~ N(0, sigma2 R_s) with independent sequences.",
  "The correlation is *declared*, never estimated; a posterior that also marginalized over it needs a prior on it and is the next attempt (run the declared values on a grid for a sensitivity reading).",
]

