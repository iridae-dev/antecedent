papers = []

# `papers = []` is deliberate, not an oversight (see provenance/README.md).
#
# Capability `discovery.structure_posterior`: the uncertainty a structure search publishes. A
# frequentist search publishes its decision rule's structure and no interval; wrapped by
# bootstrap_stability it publishes selection frequencies over resamples; a Bayesian search
# publishes a posterior over DAGs, Markov equivalence classes, PAG classes or bounded-lag
# templates under a declared prior and the Gaussian BIC score, from which the smallest set of
# atoms holding a stated mass is read off the published atoms and weights.
#
# Why no paper is cited here: this record is a composition. Every numerical step is the work of
# an engine with its own reviewed record, and the facade functions of crates/antecedent/src/discovery.rs
# that this record maps only construct the engine from the declared parameters, run it, and label
# the posterior with the algorithm that produced it. The primary sources (Chickering, Spirtes,
# Zhang, Friedman and Koller, Kuipers and Moffa, Schwarz, Verma and Pearl, Efron, Politis and
# Romano, and the others each engine follows) are cited in those records and are not repeated
# here, where they would claim a source for code that this record does not contain.
#
# The credible set is not computed by a function of this crate: it is the smallest set of atoms of
# GraphPosterior (see discovery.class_posterior and discovery.dbn_posterior for the atoms) whose
# weights sum to at least the stated mass, read by the consumer from the published atoms and
# weights; the measurement of its coverage is in crates/antecedent/tests/fitted_model_calibration.rs
# and is not part of this record's review.

implementation_deviations = [
 "A frequentist search publishes its structure and no interval, posterior or recovery statement; bootstrap_stability tabulates a bootstrap distribution of the search with no nominal level, not a posterior and not stability selection with an error bound (see discovery.bootstrap_stability).",
 "A Bayesian structure posterior is a pseudo-posterior under the Gaussian BIC score and a declared graph prior; it is exact for the exact engines up to six variables (and for the bounded-lag template up to its enumeration budget), a Markov chain approximation above, and a routed fallback is labelled with the algorithm that produced it (order_mcmc_via_structure_mcmc, structure_mcmc, ci_screened_posterior, dbn_posterior).",
 "The credible-set statement holds only for the exact DAG posterior collapsed onto equivalence classes and the bounded-lag template posterior within their measured conditions; no recovery or error-rate statement is made about one discovered graph, and no statement is made for the other posterior searches (order and structure MCMC, the CI-screened posterior, the PAG posteriors, exact edge marginals).",
]

