]

[non_algorithm_review]
status = "justified_non_algorithm"
kind = "wrapper"
rationale = "The structure-uncertainty routes of the facade run a declared search or posterior engine over the data and publish what it returns: the frequentist searches (PC, FCI, RFCI, GES, LiNGAM, NOTEARS) return their structure with no interval; the exact DAG posterior, order MCMC, structure MCMC and the CI-screened posterior return a graph posterior over DAGs; the exact and sampled PAG posteriors return one over PAG classes; the bounded-lag DBN posterior returns one over templates. The equivalence-class collapse, the stability tabulation and the credible set are read from those results."
no_independent_algorithm = "Every function mapped constructs its engine from the declared parameters (constraints, FDR adjustment, CI test, prior, score family, chain schedule), runs it on a fresh workspace and labels the posterior with the producing algorithm; none contains a score, a sampler, a resample, a summation of posterior mass or a decision rule of its own. The scores and samplers, the class collapse, the stability tabulation and the template posterior are the engines of the records it is covered by, and the credible set is a reading of their published atoms and weights, with coverage measured outside this record."
