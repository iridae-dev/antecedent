implementation_deviations = [
  "Independent modular finite Bayesian importance update under a declared known-variance Gaussian experimental-mean likelihood; no new causal identification method or external implementation is reproduced.",
  "A converged shared panel posterior or an authenticated native design posterior supplies paired whole-function realizations. A complete licensed estimand bridge and finite affine mapping preserve population, window, duration, dose, exposure, recency, spend and declared source/mapping dependence.",
  "The FrozenJointImportance policy conditions a frozen fitted law; it does not jointly refit the observational and experimental data. Frequentist Gaussian sandwich realizations refuse as a Bayesian prior.",
  "Caller current evidence authority checks the selected source/result identities and revisions, trust, withdrawal and supersession. Experimental evidence already used in fitted-data/prior origins refuses duplicate updating.",
  "The existing weighted preposterior engine ranks additional samples of the same licensed mapped estimand using explicit future data, update, terminal actions, utility and net cost. Unsupported novel regimes do not inherit this mapping.",
  "The generic JointLawExperimentResult adapter derives the assembled contrast from the actual target and checked world-mean projection; it cannot change a structural/local/cohort target into population world means. Native Gaussian randomization and full-history Dirichlet mechanism laws enter without a nonlinear-panel refit.",
  "NativeJointExperimentResult consumes the actual history/structural/cohort/donor posterior directly, retaining NativeJointIdentification and a target-kind-bound linear projection. It does not relabel local/native effects as population world means. Conditional decision receipts preserve the native proof and every future-study utility reads the same aligned native coordinates.",
  "Native experiment artifacts rerun the complete original design/data/statistical recipe before experimental conditioning; the original likelihood/prior/seed/law identity binds mapping slots. Historical numerical-only generic artifacts retain their versioned decoder and never gain current authority.",
  "The acceptance matrix is generated from the complete X07 capability catalogue crossed with advertised mappings, translations and decision cases. Missing implementations remain explicit obligations, separate from the scientific refusal to use sampling draws as a Bayesian prior; matrix rows are not claimed test results.",
  "Independent likelihood-ratio arithmetic checks every retained posterior weight and expectation. Independent table counts check randomized Gaussian and longitudinal Dirichlet posterior expectations. Exhaustive terminal-action enumeration checks utilities, constraints and EVPI. Predictive Gaussian-mixture quadrature checks nested future-data value with explicit total-variation midpoint and Mills tail bounds, retaining production Monte Carlo error separately.",
  "Artifacts replay the stored conditional law and update through the same native probability engine. Historical replay grants no current authorization and does not attest stored fit origin. Calibration and decision-selection reliability are unmeasured.",
]
