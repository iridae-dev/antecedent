  "Refits are predictive inputs to independent conditional future paths. A future count exchangeable with the path counts has a uniform tie-randomized rank among them (the smoothed conformal rank). Each count enters with the share of its tied rank positions inside the central 0.05 to 0.95 band, counts wholly inside always and the boundary counts by one seeded uniform draw shared by both ends, so the discrete central 90 percent count interval covers with probability 0.90 instead of the at-least-0.90 of inclusive nearest-rank quantiles. An inclusive interval cannot be empty: when the draw keeps no count, possible only when no count lies wholly inside the band, the count with the largest share is reported, which only adds coverage.",
  "The prospective calibration test generates training and future count truth with an independently implemented branching-cluster model. A failed fit or refit counts against coverage.",
