implementation_deviations = [
  "An empirical sample is scored as the empirical law of its draws (the V-statistic energy form, proper for that law); the fair estimator (Ferro 2014) is available on request and is not proper for the empirical law.",
  "Sample CRPS is computed as the integral of the squared distribution-function difference (a sum of non-negative terms) rather than as the difference of two means, which can lose precision for long ensembles; the two forms are equal and tested equal.",
  "The energy score uses the Euclidean norm with beta = 1 only, on finite or equally weighted joint laws, with O(m^2) pair cost under a declared work bound.",
  "Provider-evaluated laws supply only a log density and cumulative values at the outcome; the log score is as trustworthy as the supplier, and no CRPS or Brier score is formed from them.",
]
