 "frozen clean-room ID status cases for back-door, front-door, and hedge graphs (conformance/identify/id_hedge)",
 "consumed DoWhy 0.14 identify() status/estimand-family oracles (conformance/identify/general_id_backdoor_chain, conformance/identify/general_id_frontdoor, conformance/identify/general_id_hedge)",
 "inline unit tests (crates/antecedent-identify/src/id.rs)",
 "hand-derived worked examples: napkin, nested napkin, front-door, confounded-mediator hedge, bow arc, joint-treatment hedge (conformance/identify/id_completeness)",
 "exact enumeration of latent binary SCMs: all 49544 single-treatment single-outcome queries on 2-4 node ADMGs and 1500 seeded 5-6 node joint queries, each identified-and-numerically-correct or refuted by a definition-checked hedge (crates/antecedent-identify/tests/id_completeness.rs)",
 "conformance/estimate/admg_frontdoor_functional (frozen binary front-door law on the general_id_frontdoor ADMG: pins the FunctionalEffect number returned after general ID, on fresh and prepared paths)",
 "definition check of ID's refusal decision against an independently enumerated hedge criterion on every three-node ADMG and the four-node queries listed for identify.hedge (crates/antecedent-identify/tests/hedge_definition_enumeration.rs)",
