implementation_deviations = [
 "Lines 6 and 7 applied to a line-7 C-factor that line 2 has since marginalized form each conditional P'(v_i | v_pi^(i-1)) from its definition as a ratio of marginals of P' (numerator summed over the later variables, denominator additionally over v_i) rather than the paper's product notation; when no marginalization intervened the frozen observational factor is reused unchanged. Completeness is evidenced by exhaustive enumeration on <=4-node ADMGs with single treatment and outcome plus a seeded sample of 5-6 node joint queries, not proved for the implementation.",
 "Queries with an outcome that is also intervened on, or with no outcome, are refused before the recursion; the paper leaves them undefined. The former 'V\\X empty' fallback, which is not a published line, is now an unreachable invariant error.",
 "The functional keeps line-3 variables that line 7 later fixes outside S' as free variables (the napkin's z); it is not closed over them.",
 "Supports unconditional Distribution and AverageEffect queries with hard Set interventions, plus only constant interventions reducible to Set; conditional queries are delegated to IDC.",
 "Emitted products and SumOut expressions rely on enumerable variable domains and do not provide continuous-domain integral functionals.",
]

