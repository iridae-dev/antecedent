]

implementation_deviations = [
 "The exact posterior enumerates the maximal ancestral graphs of at most four variables: each pair is non-adjacent, directed either way or bidirected, and a candidate is kept when it is ancestral and every non-adjacent pair is m-separated by some set. The sampler (two to eight variables) starts at the empty graph, changes the link of one uniformly chosen pair to one of the three other types, rejects a proposal that is not ancestral, not maximal or not scorable, and accepts the rest with probability min(1, exp(BIC difference)); the proposal is symmetric, so the chain targets exp(BIC) under the uniform prior over the graphs it can reach, and it only reaches graphs connected to the empty graph through single-pair moves. Class weights are pooled visit frequencies; a visited class is completed through single-pair moves within the class up to 4000 graphs before its PAG marks are read, and the diagnostics note counts the classes the cap cut short. Convergence is only the chains' class-frequency agreement to a total variation of 0.15.",
 "Each graph is fitted by alternating the exact generalised-least-squares update of the free coefficients given the residual covariance with one sweep of iterative conditional fitting of the residual covariance, to a relative log-likelihood change of 1e-10 or 500 sweeps; the first local optimum reached from the diagonal start is taken, and a graph whose fit is degenerate has no score and is excluded and counted.",
 "The weights are exp(BIC) with a uniform prior over the graphs, the BIC approximation to the marginal likelihood; the free parameters counted are the coefficients, the variances and the bidirected covariances, and the intercepts are common to every graph.",
 "Markov equivalence is read off the sets of m-separation statements, not from the characterisation by discriminating paths; the PAG of a class keeps an endpoint mark only where every graph of the class agrees and is a circle otherwise, the definition of the partial ancestral graph of a class. Selection variables are not modelled, so no undirected edges arise.",
]

upstream_implementations_observed = []

test_sources = [
 "crates/antecedent-discovery/src/exact_pag_posterior.rs unit tests (graph counts, ancestral and maximal invariants, the empty-graph likelihood in closed form, saturated two-node graphs tying, a chain and a collider of known classes)",
 "crates/antecedent-discovery/tests/exact_pag_posterior_reference.rs (graph and class counts, PAGs and class weights against a brute-force enumeration with a direct likelihood optimiser)",
 "crates/antecedent/tests/structure_uncertainty_routes.rs (compiled PAG posterior equals the engine; five variables refuse)",
 "python/tests/test_structure_uncertainty_routes.py",
]

[method_review]
status = "reviewed_with_limits"
scope = "exact_pag_posterior for three and four variables in crates/antecedent-discovery/src/exact_pag_posterior.rs: the enumeration of maximal ancestral graphs (ancestral and maximal by m-separation), the Gaussian maximum-likelihood fit of each graph by residual iterative conditional fitting and its BIC (coefficients, variances and bidirected covariances counted, intercepts common), the grouping of graphs into Markov equivalence classes by their sets of m-separation statements, the PAG of each class (a tail or arrowhead only where every member agrees, otherwise a circle) and the class weights exp(BIC) pooled under a uniform prior over graphs. Not reviewed: pag_posterior_mcmc (the sampler used above four variables, its class completion cap and its convergence flag), selection variables, and the packing of the result into a GraphPosterior beyond the atoms and marks compared here."
assumptions = ["Gaussian data, no selection variables, and a uniform prior over maximal ancestral graphs; the BIC weights are an approximation to the marginal likelihood, so the posterior inherits that approximation and the review does not test it.", "Markov-equivalent maximal ancestral graphs define the same Gaussian model with the same number of parameters, so their maximised likelihoods coincide; the reference checks this to 1e-5 on every well-conditioned data set (it holds to 1e-12 on all 56 graphs of three variables and all 2,492 graphs of four) and uses it only on the nearly singular data set, where its direct optimiser stalls on the ridge for some graphs.", "m-separation is read from the definition by enumerating simple paths; the product searches depth-first with a descendant set and caches signatures by a 128-bit hash, so agreement is between two independent implementations of the same definition."]
historical_exposure = "Historical author exposure cannot be independently established from retained artifacts. This review read the product source named in its scope and compared results with definitions evaluated by an executing reference written for this review; no upstream implementation or test source was consulted or copied. The cited publications were not retrieved in this review (no paper was downloaded or read here): the correspondence is between the product code and the standard definitions those works state, verified numerically, not a page-level reading of the papers."
redistribution = "The reference script and its frozen output are repository-authored (MIT OR Apache-2.0); the script uses only the Python standard library, numpy and scipy (BSD-3-Clause, imported at run time and not redistributed). It declares inline script metadata but is not run in a locked, isolated environment and is not wired into any gate; its output is frozen in the JSON file and compared by the test."
limitations = "Four data sets: three variables with an unobserved confounder of two of them (150 rows), three variables on eight rows, three variables with a pair correlated to within 1e-3 noise (100 rows), and four variables with a latent confounder and a collider (250 rows). The number of maximal ancestral graphs (56 and 2,492), the number of classes (11 and 248), the PAG of every class and every class weight agree: to 1e-5 on the three well-conditioned data sets and to 2e-4 on the nearly singular one, where the largest observed difference is 8e-5 because the product's fits stop at a relative likelihood change of 1e-10 and are looser on a ridge. The reference's own optimiser (BFGS with a Newton polish and several starts, the analytic gradient checked against finite differences, saturated models equal to the closed-form likelihood) is a numerical method, so a systematic error shared by both fits would not be seen; the closed-form saturated likelihood and the within-class equality are the cross-checks. Five or more variables go to the sampler, which is not reviewed; data with an exactly dependent pair (unscorable graphs are counted and excluded) are not exercised here. The cited papers (Richardson and Spirtes on ancestral graph Markov models, Drton and Richardson on iterative conditional fitting, Schwarz) were not retrieved in this review; the references execute the definitions and the Gaussian likelihood, not those texts."
sources = ["crates/antecedent-discovery/tests/exact_pag_posterior_reference.rs", "crates/antecedent-discovery/tests/oracle_data/exact_pag_posterior_reference.py", "https://doi.org/10.1214/aos/1176344136"]
findings_resolved = ["No defect found: graph counts, class counts, every class PAG and every class weight agree with the brute-force reference, including the eight-row and nearly collinear data.", "The first reference run disagreed with the product by 0.18 in class weight; the closed-form saturated likelihood (BIC difference -0.4956 against the chain) agreed with the product and showed the reference's first optimiser (L-BFGS that returned a constant when the covariance left the positive-definite region) was stalling, so the reference, not the product, was corrected and now returns the closed-form value on all 19 saturated graphs.", "Quantified the fit accuracy on a nearly singular pair: class weights are within 8e-5 of the reference, from the 1e-10 relative stopping rule."]
