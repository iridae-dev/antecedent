# Antecedent fits an identity-link additive cubic B-spline GAM and evaluates
# the plug-in gradient with the analytic degree-drop derivative of each
# treatment smooth. Outside the open knot interior [knots[3], knots[len-4])
# the clamped basis is constant, so that derivative is exactly zero
# (`response.clamped_basis_derivative`). No uncertainty theorem is claimed.
papers = [
  { title = "Generalized Additive Models", doi = "10.1214/ss/1177013604", sections = ["Section 2: Gaussian additive model", "Sections 4 and 7: additive-model backfitting"] },
]

implementation_deviations = [
  "The fitted GAM is a custom identity-link additive cubic B-spline model with a fixed basis size and fixed ridge-style penalty, rather than the paper's generic local-scoring framework or data-adaptive smoothness selection.",
  "The causal response and Jacobian are plug-in standardizations over observed adjustment rows; the GAM citation supplies a regression model, not identification or causal-validity results for this operation.",
  "Derivatives are the analytic cubic B-spline derivatives of the fitted treatment smooths, not finite differences. Outside the open knot interior the clamped evaluation is constant and the derivative is exactly zero.",
  "At most two treatment coordinates are supported; interactions and joint-support estimation are absent, and support is checked only through marginal ranges.",
  "Multi-outcome Jacobian and directional queries require a shared complete-case row set; differential missingness across outcomes is refused rather than concatenated as if comparable.",
  "The clamped spline basis forces derivatives to zero outside fitted ranges, and the identity-scale Jacobian carries only the fixed-basis coefficient-sandwich band (conditional on knots and the adjustment penalty, no sieve bias); transformed scales return no uncertainty estimate.",
]

upstream_implementations_observed = [
]

test_sources = [
  "crates/antecedent-estimate/tests/estimate_response_gam_derivative_reference.rs (exact additive-GAM Jacobian, directional derivative, level and scales)",
  "crates/antecedent-estimate/tests/gam_derivative_band_construction.rs (hand-built HC2 sandwich band of the identity-scale Jacobian)",
  "conformance/response/staged_derivatives",
  "crates/antecedent-estimate/src/response/tests.rs",
  "crates/antecedent-stats/src/gam.rs",
]

[method_review]
status = "reviewed_with_limits"
scope = "ContinuousResponseEstimator::jacobian and ::directional_derivative (derivative.rs) with plugin_gradient_run / plugin_gradient_at_fit and the target fit of nuisance.rs (fit_outcome_target, outcome_target_specs, fit_outcome_target_weighted) for the Frequentist route: the shared complete-case row set across outcomes, the additive cubic-spline outcome fit with unpenalized treatment smooths and adjuster smooths at the caller's lambda, the analytic derivative of each treatment smooth (exactly zero outside the half-open knot interior), the plug-in level as the covariate average of the fitted function, the identity, log-treatment, log-outcome and log-log scales (the last two refused at a non-positive level), the directional derivative as the gradient dotted with the direction, and, for the identity-scale Jacobian, the pointwise band it publishes (the HC2 coefficient-sandwich band g +/- z se of the derivative functional, rebuilt by hand in gam_derivative_band_construction.rs); transformed scales publish no interval. Relies on the stats.gam review for the penalized fit, its knots and the smooth_derivative implementation, whose value is also checked here against an independent degree-drop derivative. Not the directional-derivative band (the same sandwich with the direction applied, not separately checked), the calibration annotation of the band, the Bayesian route, more than two treatments, or the cross-fitted average derivative."
assumptions = ["The outcome surface is additive in the treatments and the adjusters; a treatment-covariate or treatment-treatment interaction is not learned, so the plug-in gradient is the gradient of the best additive approximation, not of the true surface.", "Identification (the adjustment set) is taken as given; the support check is marginal, not joint."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the product source named in its scope, including the numerical helpers it calls, and compared results with definitions evaluated by executing references written for this review; no upstream implementation or test source was consulted or copied. The cited publications were not retrieved in this review: the correspondence is between the product code and the standard definitions those works state, verified numerically, not a page-level reading of the papers."
redistribution = "Primary work is cited, not redistributed. The reference script and its frozen output are repository-authored (MIT OR Apache-2.0); the script uses only the Python standard library (shared module estimate_response_kennedy_dr_reference.py, which uses mpmath for its density work, not needed here). It is not run in a locked, isolated environment and is not wired into any gate; its output is frozen in the JSON file and compared by the test."
limitations = "Three frozen designs: one treatment and one adjuster at 70 rows, evaluated at two interior points, at the left knot edge, at the open right edge, and outside the range on both sides; two correlated treatments, one adjuster and two outcomes at 90 rows (Jacobian on all four scales and a directional derivative); a treatment offset of 1e3 with an outcome of 1e5 and an adjuster on scale 250 at 80 rows and basis 6. The exact fit is at lambda 1 or 1/2 and basis 5 or 6 only. Agreement is 1e-6 relative on the first two designs and 3e-5 plus 2e-4 absolute on the offset design, where the backfit stops relative to the largest fitted value (see estimate.response.kennedy_dr). Since the original comparison, the shared fit path tries a conditioned and residual-checked fixed-penalty direct solve before falling back to backfitting; the earlier numerical comparison predates this solver change, and the current central rerun matches the same frozen designs at their existing tolerances. A gradient-only helper for Bayesian draws was also added outside this frequentist scope. The identity-scale Jacobian band is checked on one small fixed design (24 rows, one treatment, one adjuster, four basis functions per smooth so that the basis is the cubic Bernstein basis, lambda 0.5) at three evaluation points: the point to 1e-6 relative and the half-width to 1e-5 relative against a hand-built penalized least-squares solution, HC2 leverage-corrected residuals and centred sandwich influence, with the tolerance shown to separate HC2 from uncorrected residuals. Larger bases with interior knots, several treatments, correlated adjusters, the directional band and the band's coverage are not exercised; the plug-in sandwich of plugin.rs is checked only through this design. Sieve bias, a non-additive surface and the difference between a derivative of the fit and the derivative of the true surface are not examined, and the support check (marginal ranges) is only exercised, not validated. The cited publication (Hastie and Tibshirani, generalized additive models) was not retrieved in this review: the reference is the penalized additive cubic-spline minimizer and its analytic derivative, as the module states them. The reference script is not run in a locked, isolated environment and is not wired into any gate."
sources = ["https://doi.org/10.1214/ss/1177013604", "https://docs.python.org/3/library/fractions.html"]
findings_resolved = ["Defect repaired (shared with estimate.response.kennedy_dr): the plug-in target backfit stopped at a relative 1e-6 on either the change of the smooths or the change of the residual sum of squares, the second being second order in the coefficient error. With an adjuster correlated with the treatment the fitted values were right but the treatment smooth, and therefore its derivative, was not: at the same data the derivative at 0.3 differed from the converged fit by 4e-5 (relative) on one design and 2e-4 on another, which the 1e-6 comparison with the exact fit would have rejected. The target and nuisance fallback backfits run at 1e-10 with a 2000-sweep budget; the current fit path may instead use a certified fixed-penalty direct solve.", "The Jacobian on every scale and the directional derivative equal the exact degree-drop derivatives and covariate-average level, including the derivative of exactly zero outside the open knot interior and at the right knot edge, a nonzero derivative at the left edge, two treatments with two outcomes, and the refusal of a log-outcome or log-log scale at a non-positive fitted level.", "Differential missingness across outcomes is refused with the shared complete-case row-set message instead of fitting outcomes on different rows, and the transformed scales withhold the interval, disclosed as response.no_derivative_interval_method with an uncertainty of None, while the identity-scale Jacobian publishes the pointwise band, which equals the hand-computed HC2 sandwich band (g +/- 1.959963984540054 se) on the fixed design and contains the pinned point."]
