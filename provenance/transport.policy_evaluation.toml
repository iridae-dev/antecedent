# Evaluation of a supplied fixed contingent policy by the sequential g-formula in a target
# population: the same policy and the source's invariant mechanisms, with the caller's target
# initial-state law. The g-formula for a fixed history-dependent policy over a finite model is
# exact enumeration here; the transport premise is the selection-diagram rule.
papers = [
  { title = "External Validity: From Do-Calculus to Transportability Across Populations", citation_note = "Previously recorded title and bibliographic detail: External Validity: From Do-Calculus to Transportability Across Populations (Pearl and Bareinboim, 2014)", doi = "10.1214/14-STS486", sections = ["selection diagrams: a mechanism with no selection node into it is shared by the source and the target population"] },
  { title = "A new approach to causal inference in mortality studies with a sustained exposure period—application to control of the healthy worker survivor effect", citation_note = "Previously recorded title and bibliographic detail: A new approach to causal inference in mortality studies with a sustained exposure period: application to control of the healthy worker survivor effect (Robins, Mathematical Modelling 7:1393-1512, 1986)", doi = "10.1016/0270-0255(86)90088-6", sections = ["the g-computation formula for a sustained treatment strategy (theorem and section numbers not independently verified; the registry title differs slightly: A new method for causal inference in mortality studies with a sustained exposure period, applied to controlling the healthy worker survivor effect)"] },
]
implementation_deviations = [
  "Only the initial-state law may be shifted, and the utility when the caller supplies the target's own utility with its provenance (a source label and content digest). The utility is a valuation, not a causal mechanism, so the source cannot supply it. A shifted transition or observation mechanism is refused with the mechanism named, a shifted utility with no target utility is refused, and an undeclared mechanism is refused: there is no default invariance.",
  "The target initial-state law is supplied, not learned; its support must lie inside the source's, so every reachable target history was reachable in the source.",
  "Point value only. No interval, posterior or coverage statement; the premises are the declared ones in TransportPremises.",
  "The value is verified by re-evaluation (verify_transported_policy) rather than trusted from a stored number.",
]
upstream_implementations_observed = []
test_sources = [
  "crates/antecedent-design/tests/transported_evaluation.rs",
  "python/tests/test_transported_constructors.py",
]

[method_review]
status = "reviewed_with_limits"
scope = "evaluate_transported_policy, verify_transported_policy, declared_shifts, check_target_initial and check_target_utility_declaration in crates/antecedent-design/src/transported_policy.rs, together with the exact history enumeration they call (evaluate_policy / Walker in sequential_evaluation/gformula.rs): the value of a fixed contingent policy in a target population of a finite sequential model when only the initial-state law (and optionally the utility, supplied by the target) differs. Point value only. Not a review of how the source model's mechanisms were learned, of belief updating helpers beyond their use in the value tests, or of policy optimization."
assumptions = ["Selection-diagram premise, declared per mechanism and never assumed: every transition and observation mechanism is invariant between source and target; only the initial-state law may be declared shifted, and the utility only when the target supplies its own with a source label and digest.", "Sequential identification premises of the underlying enumeration: exchangeability of the per-action interventional laws given the information set, consistency, and positivity of the policy's actions on every reachable history; none is testable from the model.", "Overlap: every state with target mass has source mass, so mechanisms are evidenced wherever the target goes.", "The target initial law is supplied by the caller (it cannot come from the source); a target law that differs from the source's while the initial state is declared invariant is refused."]
historical_exposure = "The earlier record listed no observed implementations; historical author exposure cannot be independently established. This review read the product source and the integration tests with their hand-derived values; no upstream implementation or test source was consulted or copied."
redistribution = "Repository-authored code and tests under MIT OR Apache-2.0; cited papers are linked by DOI, not redistributed."
limitations = "The primary papers were not re-read in this review (the copies reachable from this environment were scanned or paywalled); the section citations are inherited from the earlier record, and the implementation was checked against the rules as the reviewer understands them and against an independent enumeration instead. A mistake in how the record states a theorem would therefore not be detected here. The route is original bounded engineering over a standard exact g-formula enumeration, not a published algorithm; the Pearl-Bareinboim citation supplies the invariance premise only and the Robins citation the g-computation formula (its theorem and section numbers were never verified, as the existing record says). Point value; no uncertainty about the model, the target law or the invariance. The enumeration is exact over finite state, action and observation spaces up to the node limit; the evidence is one two-state inspection model with a hand-derived closed form (V = 7.5 - 10p), not an independent second implementation. Calibration remains deferred."
sources = ["https://doi.org/10.1214/14-STS486", "https://doi.org/10.1016/0270-0255(86)90088-6"]
findings_resolved = ["Checked that the declaration must cover exactly the model's mechanisms (initial state, each action's transition, each channel's observation, utility): unknown, duplicated and missing mechanisms are refused, and a transition or observation marked shifted is refused with the mechanism named.", "Checked check_target_initial: finite probabilities summing to one, no mass on a state the source never reached, and a target law that differs from the source while the initial state is declared invariant is refused; and that the target value replaces only the initial law in a clone of the model, so every other mechanism stays the source's.", "Re-derived the hand value V = 10 * 0.75 (1 - p) - 10 * 0.25 p = 7.5 - 10 p for the inspect-then-ship-on-quiet policy (alarm sensitivity and specificity 3/4; the alarm branch holds at zero) and confirmed the integration test asserts it at p = 0, 0.2, 0.5, 0.8 and 1, the source value 2.5, the visited-node count 2 x 3, and replay by verify_transported_policy.", "Read the enumeration: a unit-mass accounting identity (reach-weighted realized utilities equal the recursively computed value, residual checked to 1e-9) guards each evaluation. No defect requiring a change was found and no code was changed."]
record_sha256 = "7e32193bb14249c0e49f0714c0ac7e59b44c7427e25c27c9b7562206ac2edede"

