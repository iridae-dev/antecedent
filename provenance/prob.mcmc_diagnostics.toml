feature_id = "prob.mcmc_diagnostics"
implementation_crate = "antecedent-prob"
source_translation = false
copied_code = false
copied_comments = false
copied_tests = false

implementation_deviations = [
 "Autocovariances are evaluated directly and lazily until truncation, rather than using FFT; this changes computational cost and may change floating-point roundoff, not the stated estimator.",
 "Diagnostics are marginal scalar-parameter diagnostics only, with tail ESS fixed to the 5 percent and 95 percent indicator quantiles.",
 "Uses full initial positive/monotone pair sums, including every complete available pair, without the odd/even truncation averaging described after Vehtari equation (13). ArviZ ESS can therefore differ even when the underlying correlations agree; the independent high-precision fixture checks this explicit variant instead of treating all ArviZ ESS outputs as the same target.",
 "Odd-length chains discard their final draw before contiguous splitting; ArviZ's raw odd-length split uses the first and last halves. Constant tail indicators receive zero ESS as a fail-closed publication policy.",
]

papers = [
 { title = "Rank-Normalization, Folding, and Localization: An Improved Rˆ for Assessing Convergence of MCMC (with Discussion)", citation_note = "Previously recorded title and bibliographic detail: Rank-Normalization, Folding, and Localization: An Improved R-hat for Assessing Convergence of MCMC (with Discussion)", doi = "10.1214/20-BA1221", sections = ["Section 3.1, equations (1)-(4): split-chain variances and R-hat", "Section 3.2, discussion before equation (10): biased autocovariance divisor N and combined-chain correlation", "Section 3.2, equations (11)-(13): positive/monotone truncation", "Sections 4.1-4.3: rank transformation, folding and tail indicators"] },
 { title = "Practical Markov Chain Monte Carlo", doi = "10.1214/ss/1177011137", sections = ["Section 3.3: initial positive and monotone sequences, equation (3.3)", "Theorems 3.1-3.2: reversible-chain paired autocovariance properties and asymptotic qualifications"] },
]

upstream_implementations_observed = [
 { project = "arviz", exposure = "black-box comparison only" },
]

# Historical audit findings: the final-pair omission was already fixed before
# this audit (ess_includes_the_last_available_pair_for_even_segment_lengths).
