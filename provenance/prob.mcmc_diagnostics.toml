]

[method_review]
status = "reviewed_with_limits"
scope = "Rank/fold transformations, split variances, full-pair IPS/IMS bulk ESS and CDF-based tail ESS in mcmc_stats.rs, with the explicitly different finite-lag and odd-split conventions recorded above. Numerical score-kernel accuracy beyond the fixed fixtures is not certified by this review."
assumptions = ["Scalar finite equal-length chains; malformed or nonfinite layouts fail closed.", "Geyer paired-covariance theory assumes stationary, irreducible, reversible chains with the stated covariance conditions; diagnostics do not establish those assumptions.", "Fixed-chain reference agreement does not prove convergence, correct posterior targets, causal identification or calibrated interval coverage."]
historical_exposure = "Prior historical author exposure cannot be independently established from retained artifacts. Current review used primary papers, public ArviZ/SciPy APIs and product source; no upstream algorithm/test source was consulted or copied."
redistribution = "Repository-authored reference harness and new deterministic inputs remain MIT OR Apache-2.0. Primary papers are linked, not redistributed. Frozen historical chain inputs are preserved without inventing an authorship attestation. No upstream implementation or tests are imported into the product."
limitations = "Five bounded scalar chain scenarios plus existing analytic/domain tests. Full-pair truncation intentionally differs from ArviZ averaging; odd lengths retain the documented drop-last convention. Constant tail indicators fail closed. Sampling calibration remains deferred."
sources = ["https://arxiv.org/html/1903.08008v5", "https://doi.org/10.1214/20-BA1221", "https://www2.stat.duke.edu/homeweb/scs/Courses/Stat376/Papers/GeyerStatSci1992.pdf", "https://doi.org/10.1214/ss/1177011137", "https://python.arviz.org/en/v0.20.0/api/generated/arviz.rhat.html", "https://python.arviz.org/en/v0.20.0/api/generated/arviz.ess.html"]
findings_resolved = ["Positive-lag divisor N-1 failed the independent 19/48 calculation; repaired to N while retaining unbiased W.", "A tied upper-tail fixture exposed >=q95 rather than the CDF indicator <=q95; repaired, reducing the erroneous ESS from about 184 to the primary-reference value about 100.", "Final-pair omission note was stale: existing complete-pair regression already enforced 8/7. Preserved that behavior and documented the upstream convention difference.", "Replaced the mis-targeted shifted-chain 5% parity assertion with an explicit discrepancy and stronger absolute-1e-6 primary-reference checks; retained raw ArviZ outputs and compatible original comparisons."]
record_sha256 = "35e8ace7e6a28687de075157f8c6b417e3b3e9172d645574e19ced3cdd9bae41"

