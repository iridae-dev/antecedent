implementation_deviations = [
 "Uses an unweighted rectangular window with a user-supplied symmetric bandwidth and a fixed local-linear specification; it does not implement kernel choice, data-driven bandwidth selection, or robust bias correction.",
 "Estimates the average effect for units at the cutoff (TargetPopulation::LocalAtCutoff) and refuses a query that names any other target population, including the population-wide default; the number is never presented as a population or window-average effect.",
 "Reports the HC1 residual-sandwich SE of the jump coefficient by default (HC0/HC2/HC3 and an explicit homoskedastic opt-in are available), with an optional ordinary row bootstrap; there is no robust bias correction.",
 "Builds the design from the indicator that the running variable is at or above the cutoff, and verifies that the query's treatment column equals that indicator on every complete row; a non-0/1 column or any mismatch is refused with rd_assignment_not_sharp. Noncompliance is therefore detected and refused; fuzzy RD is not estimated.",
 "Supports neither covariate-adjusted RD nor manipulation, density, or continuity diagnostics.",
]

