]

implementation_deviations = [
 "The chain state is a single DAG plus compatible topological order, with edge flips and order transpositions corrected by the DAG's number of topological orders; it does not implement Friedman and Koller's order score that sums over all compatible parent sets.",
 "The target uses continuous Gaussian BIC rather than an exact modular Bayesian marginal likelihood.",
 "Sampling is finite and empirical, the four-word adjacency representation limits the method to at most 16 variables (240 directed-edge bits), and the per-step topological-order correction is a 2^n-state dynamic program, so the cost of a step doubles with each variable.",
]

upstream_implementations_observed = []

test_sources = [
 "crates/antecedent-discovery/src/order_mcmc.rs unit tests",
 "crates/antecedent-discovery/tests/graph_mcmc_oracle.rs (finite-chain edge marginals against a clean-room exhaustive Gaussian-BIC target on three-node cases)",
 "conformance/discovery/graph_mcmc_exact (small exhaustive Gaussian-BIC target; not an external full-method Order MCMC oracle)",
 "crates/antecedent-discovery/tests/graph_posterior_wide.rs (five-variable exhaustive DAG enumeration; twelve-variable enumeration of the 3^12 states of a twelve-pair candidate skeleton scored by a separate Gaussian-BIC implementation)",
 "crates/antecedent-discovery/src/order_mcmc.rs (prior-only proposal kernel with the topological-order correction against the closed-form rooted-forest law on ten nodes)",
]

[method_review]
status = "reviewed_with_limits"
scope = "The order-space MCMC sampler (OrderMcmc) in crates/antecedent-discovery/src/order_mcmc.rs, run on the Gaussian-BIC target with the uniform and Bernoulli edge priors, a parent cap, and forbidden and required edges, compared with the enumerated edge marginals. Not the diagnostics gate (disabled here), the temperature ladder design, tiers, lagged links, or graphs above five nodes."
assumptions = ["The sampler targets the same prior-times-BIC posterior over DAGs as the exact enumeration (including the correction for the number of linear extensions in order space, which is what the comparison tests).", "A cell agrees when it is within 0.03 plus five Monte Carlo standard errors of the enumerated marginal, with four chains, 1000 warmup and 8000 retained draws."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the product source named in its scope, including the numerical helpers it calls, and compared results with definitions evaluated by executing references written for this review; no upstream implementation or test source was consulted or copied. The cited publications were not retrieved in this review: the correspondence is between the product code and the standard definitions those works state, verified numerically, not a page-level reading of the papers."
redistribution = "Primary work is cited, not redistributed. The reference script and its frozen output are repository-authored (MIT OR Apache-2.0); the script uses mpmath (BSD-3-Clause), itertools and random from the Python standard library, imported at run time and not redistributed here. The script declares its inline script metadata but is not run in a locked, isolated environment and is not wired into any gate; its output is frozen in the JSON file and compared by the test."
limitations = "Four four-node data sets (uniform prior; Bernoulli(0.2) prior with a parent cap of two; forbidden and required edges; a near-collinear pair of nodes) enumerated over all 543 DAGs with 60-digit scores. The tolerance of 0.03 plus five standard errors would not detect a bias of a few hundredths in a marginal. Graphs above four nodes, long mixing times, tiers and lagged links are not covered by this reference; the wide-graph tests cover five to eighteen variables. The reference script is not run in a locked, isolated environment and is not wired into any gate."
sources = ["https://www.jmlr.org/papers/volume5/koivisto04a/koivisto04a.pdf", "https://mpmath.org/"]
findings_resolved = ["All 48 marginals (16 cells on each of the four data sets, minus the zero diagonal) agree with the multiprecision enumeration within the band for both samplers, under the Bernoulli prior, the parent cap, and the forbidden and required edges. No defect found."]
