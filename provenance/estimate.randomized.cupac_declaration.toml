# CUPAC here is a declaration, not an estimator. The caller supplies a prediction already aligned to
# the randomization unit. A locked coefficient selects the fixed CUPED kernel; an omitted coefficient
# on a Bernoulli design selects the same-sample CUPED kernel; an omitted coefficient on a cluster
# design selects the cluster-total slope. Those kernels keep their own records. This record only
# swaps the stated assumption to pre_assignment_prediction. The working paper that names CUPAC is
# not the source of any of those kernels, so it is not cited.
