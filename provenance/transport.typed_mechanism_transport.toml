# Admission of fitted nonlinear and non-Gaussian mechanisms from a source population into a
# target-population composed model, with target-specific refits. The admission rule is the
# selection-diagram rule per variable (a mechanism with no selection node into it is shared; one
# with a selection node into it differs and needs target evidence). The fits are Fisher scoring on
# the exponential-family likelihoods and a Levenberg-damped Gauss-Newton for expression means; the
# declared-invariance test is a Wald comparison of the source and target parameter vectors.
papers = [
  { title = "External Validity: From Do-Calculus to Transportability Across Populations", citation_note = "Previously recorded title and bibliographic detail: External Validity: From Do-Calculus to Transportability Across Populations (Pearl and Bareinboim, 2014)", doi = "10.1214/14-STS486", sections = ["selection diagrams: a mechanism with no selection node into it is shared by the source and the target population"] },
]
implementation_deviations = [
  "Bounded executed route, not a published algorithm: typed mechanisms are polynomial or expression conditional means under Gaussian, heteroscedastic Gaussian, log-normal, Bernoulli, Poisson or gamma response; finite tables are decided by the finite counterfactual transport derivation.",
  "A shifted mechanism (a selection node points into it) is used only from a target fit and is refused without one; a mechanism is never treated as invariant because target evidence is missing.",
  "A declared-invariant mechanism with a supplied target fit is tested by a Wald comparison of the full parameter vectors with the summed fit covariances (independent samples assumed); a rejection refuses the transport and a non-rejection is not evidence of invariance. Without target data the invariance is an untested premise recorded in the receipt.",
  "Interventional means are Monte Carlo over the structural model with paired per-node, per-unit random streams and an exact conditional mean for the outcome; the Monte Carlo standard error is numerical-approximation uncertainty reported apart from parameter uncertainty.",
  "Parameter uncertainty of a contrast is first order, g' Sigma g, with a score-function gradient over every involved mechanism's parameters; the covariance is the source fit's for a carried mechanism and the target fit's for a refit one, joined by an explicitly declared dependence. The selection-diagram assumption adds no variance and the result says so; no interval is issued.",
  "The log-dispersion covariance of the Gaussian, log-normal and gamma families uses the asymptotic 1/(2 dof) and the moment form respectively; they enter a contrast only through the families whose mean depends on the scale (log-normal).",
]
upstream_implementations_observed = []
test_sources = [
  "crates/antecedent-model/tests/typed_mechanism_transport.rs",
  "crates/antecedent/tests/typed_transported_mechanism_facade.rs",
  "python/tests/test_typed_mechanism_transport.py",
  "conformance/transport/typed_mechanism_shift/reference.py",
]

[method_review]
status = "reviewed_with_limits"
scope = "typed_mechanism_transport::{fit_mechanism, refit_in_target, invariance_check} for a Gaussian-identity mechanism with a degree-1 polynomial mean: standardization of parents with the source sample, least-squares coefficients, the residual-scale parameter (log s) and its covariance blocks, the target refit on the source design, and the Wald comparison d'(S_source + S_target)^-1 d with its chi-square upper-tail p-value and rejection rule. Not the Fisher-scoring fits of the Bernoulli, Poisson, gamma, log-normal and heteroscedastic families (compared with an external numpy/scipy fit by conformance/transport/typed_mechanism_shift, a fixture this review did not re-read), the expression-mean Gauss-Newton, the Monte Carlo interventional means or the first-order contrast variance."
assumptions = ["The source and target samples are independent, so the covariance of the parameter difference is the sum of the fit covariances.", "A non-rejection is not evidence of invariance."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the product source named in its scope and compared results with definitions evaluated by executing references written for this review; no upstream implementation or test source was consulted or copied. No cited publication was retrieved in this review: the correspondence is between the product code and the standard definitions, verified numerically, not a page-level reading of any paper."
redistribution = "Primary work is cited, not redistributed. The reference script and its frozen output are repository-authored (MIT OR Apache-2.0); the script uses only the Python standard library and mpmath (a pure-Python library, installed offline in the local environment). The script declares its inline script metadata but is not run in a locked, isolated environment and is not wired into any gate; its output is frozen in the JSON file and compared by the test."
limitations = "Five cases at 50 digits: a mild intercept shift (p about 0.31), the smallest admissible samples (5 rows each), two parents offset by 10000 with a large shift (p below 1e-200), a scale-only difference, and identical samples (statistic 0, p = 1). Parameters and covariances are asserted to 1e-9 relative, the statistic to 1e-8 and the p-value to 1e-6, the rejection decision at 0.05 and either side of the p-value, and the refusal of a target not on the source design. Only the Gaussian family with a linear mean and the Wald step are reviewed; the other families, the Monte Carlo contrast and its delta-method uncertainty remain covered only by the conformance fixture and unit tests named in the record, so this record is a bounded review of its Gaussian and Wald part and not of the whole route. Coverage and power of the invariance test are not measured."
sources = ["External Validity: From Do-Calculus to Transportability Across Populations (Pearl and Bareinboim, 2014), https://doi.org/10.1214/14-STS486, cited and not retrieved"]
findings_resolved = ["No defect found in the reviewed part: Gaussian fits, the Wald statistic and its chi-square tail match the 50-digit reference, including offset covariates and identical samples."]
