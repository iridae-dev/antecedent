# papers = [] is an explicit judgment, read against crates/antecedent-io-core/src/cohort_decision.rs:
# the module compares declared population identities, the declared invariant modifiers and the
# declared assumption label with the retained model and the cohort, then checks the rows against
# the model's own support box. It computes no density ratio, weight, propensity or transported
# estimate, so there is no procedure to cite. The covariate-shift identification of Pearl and
# Bareinboim (selection diagrams) and of Stuart et al. (generalizability) is the premise the
# declaration states, not something executed; the numerics of the cohort mean are carried by
# cohort_decision.mean_contrast.
papers = []

implementation_deviations = [
  "Original bounded route under a declared invariance premise; the premise is a declaration and is not tested. The cited literature is the statement of the covariate-shift identification, not an implemented algorithm.",
  "Only the support box is checked as a positivity necessary condition; no density ratio, overlap weight or transported variance is computed, and the result is labelled extrapolative and point-only.",
]
upstream_implementations_observed = []
test_sources = [
  "crates/antecedent-io-core/src/cohort_decision/tests.rs",
  "crates/antecedent-design/tests/cohort_decision_input.rs",
]

[non_algorithm_review]
status = "justified_non_algorithm"
kind = "contract"
rationale = "A declaration and refusal contract: a cohort from another population is accepted only with a covariate-shift declaration whose source population, target population, sorted invariant modifiers and assumption label equal the model's and the cohort's, and only when every cohort row lies in the model's support contract; the result is labelled extrapolative and point-only. Retained-model items were compared across both paths; only parent-visible privacy changed, leaving validation and model identity unchanged. Prediction, support and shift items were compared across both paths; only parent-visible privacy changed, leaving numerical operations and refusal behavior unchanged. Artifact serialization and replay items were also compared across both paths; only test-visible privacy changed, with wire fields and replay behavior unchanged. Scoped re-review of the cohort-binding move compared every named item across both paths; only parent-only visibility changed, with validation, weights and canonical digest unchanged."
no_independent_algorithm = "resolve_shift compares four declared strings and the sorted feature list and returns a bool; the support check is the model's own box or mask evaluated inclusively by the compact-export check; the prediction and weighted mean that follow are carried by cohort_decision.mean_contrast and nothing is reweighted, estimated or transported here. The tests assert the required, unneeded and mismatched declarations (a changed population, a changed modifier set, a changed assumption label), the inclusive support edge against the next representable value outside it, and the hand-computed mean 2.225 of the shifted cohort."
covered_by = ["cohort_decision.mean_contrast"]
record_sha256 = "447132ecc32e506e8c2ab8132055010dce687ec91261f9120bb2b4d47343876e"

