[method_review]
status = "reviewed_with_limits"
scope = "distribution_change in crates/antecedent-attribution/src/distribution_change.rs with the shared coalition payoff of change_common.rs for one outcome of a linear Gaussian system: the mechanism players (the outcome and its ancestors), the registry fit of each mechanism on the baseline and on the comparison rows, the hybrid outcome law of a coalition (the comparison mechanism for members, the baseline for the rest) estimated by ancestral sampling with common random numbers, the mean, variance and Gaussian KL(hybrid || all-baseline) measures, the total change and the exact Shapley allocation with its efficiency. Not a review of the permutation-sampling estimator, the bootstrap or weighted refits, or the structure-change and unit-change attribution."
assumptions = ["Each mechanism is a linear Gaussian regression fitted by least squares with residual variance RSS/(n - p); the hybrid outcome law is then exactly Gaussian and its mean and variance follow from moment propagation.", "The Shapley value of a mechanism is its marginal contribution averaged over all orders of the players, and the Gaussian KL measure takes the value 0 on the empty coalition, so the contributions sum to the KL of the full hybrid against the baseline.", "The sampling path is held only to the sampling error of its declared budget; its coalition values are not exact."]
historical_exposure = "Historical author exposure cannot be independently established. This review read the product source named in its scope and wrote a separate reference of its own from the stated definitions; no upstream implementation or test source was consulted or copied."
redistribution = "The reference script, its frozen output and the test are repository-authored under MIT OR Apache-2.0; mpmath is not a product dependency. The cited primary sources are linked, not redistributed."
limitations = "The primary source was not re-read in this review (no downloads, no local copy), so its statement of the hybrid-law Shapley decomposition and of the default Gaussian KL functional rests on the record and the code comments. The reference is one three-node linear Gaussian system with a chord (80 rows per population, every mechanism changed) and exact Shapley over all three players; larger player sets, the Monte Carlo permutation estimators, sequential and path allocations, non-linear or discrete mechanisms, the structure-change and unit-change variants, and weighted or bootstrap refits are outside it. The mechanism fit is the registry's selected family, which is checked here against least squares only for the linear Gaussian family. Calibration remains deferred."
sources = ["https://doi.org/10.48550/arXiv.2102.13384", "https://mpmath.org/doc/1.3.0/"]
findings_resolved = ["Over the mean, variance and Gaussian KL measures with exact Shapley and 200000 draws per coalition, the sampling path agrees with the 80-digit reference to within 0.7 percent of the largest term (tolerances 2 percent for the mean and KL and 3 percent for the variance) and its contributions sum to its total to rounding. The registry fits equal least squares with the unbiased residual variance to 1e-9. No defect was found and no product code changed."]
