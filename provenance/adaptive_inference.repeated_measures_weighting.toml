[method_review]
status = "reviewed_with_limits"
scope = "adaptively_weighted_estimate in crates/antecedent-estimate/src/adaptive_inference.rs with the subject-size multiplier, and the weighted_estimate it calls in crates/antecedent-stats/src/adaptive_inference/weighting.rs: the route that reduces each subject to the mean of its measurements, builds the predictable prior-shrunk outcome model and the augmented inverse-probability score on those subject means, weights each subject by its measurement count times the uniform or variance-stabilizing weight, and returns the self-normalized estimate, the plug-in variance, the effective units and the largest weight share. The score and weight kernel is reviewed under adaptive_inference.adaptive_weighting; this review checks the route's own arithmetic (the multiplier, the subject reduction, the wrapper's mapping of the result) against an independent evaluation from raw measurements. Not the random-effects model (none is fitted), cluster-level assignment with member outcomes (not licensed), the calibration of the variance or the subject-mean reduction as a theorem of the paper (a design choice, as the record states)."
assumptions = ["Each subject is an independent unit whose measurements are reduced to their mean before scoring, so the within-subject dependence is absorbed by the subject-level score.", "The subject's measurement count is a predictable weight (known at enrolment), so the weighted sum remains a martingale."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the product source named in its scope, including the numerical helpers it calls, and compared results with definitions evaluated by executing references written for this review; no upstream implementation or test source was consulted or copied. The cited publications were not retrieved in this review (nothing was downloaded and no local copy exists): the correspondence is between the product code and the standard definitions those works state, verified numerically, not a page-level reading of the papers."
redistribution = "Primary work is cited, not redistributed. The reference scripts and their frozen outputs are repository-authored (MIT OR Apache-2.0) and use only the Python standard library. The scripts declare their inline script metadata but are not run in a locked, isolated environment and are not wired into any gate; their output is frozen in the JSON files and compared by the tests."
limitations = "Hadad et al. (2021) was not retrieved (nothing downloaded, no local copy); the check is of the code against the definition of the estimator, not a reading of the paper, and the reduction of a subject to its mean is the implementer's design choice. The reference (60 digits, decimal) starts from raw measurements: five designs of 6 to 12 subjects with 1 to 400 measurements each, two and three arms, arm-mean and contrast estimands, uniform and variance-stabilizing weights, assignment probabilities down to 1/1024 and a prior mean of 1000 against data of order 1, one subject carrying 98.8% of the weight; estimate, plug-in variance, effective units and largest share agree to 1e-10 relative. A constant multiplier is shown to change nothing and a multiplier of ones to equal the unweighted route exactly. The positivity-floor, probability-row and overflow refusals belong to the weighting kernel review. No coverage is measured: the variance is reported uncalibrated and the interval claim is closed."
sources = ["https://docs.python.org/3/library/fractions.html", "https://docs.python.org/3/library/decimal.html", "https://doi.org/10.1073/pnas.2014602118"]
findings_resolved = ["No defect found: the subject-mean reduction with a measurement-count multiplier agrees with the definition evaluated from raw measurements, and the multiplier identities hold exactly."]
