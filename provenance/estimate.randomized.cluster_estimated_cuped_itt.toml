implementation_deviations = [
 "The prediction is supplied by the caller and is not fit here. Model error is the caller's premise and is not in the variance.",
 "Theta is the ordinary least-squares slope of cluster outcome totals on cluster prediction totals, with both totals centered. It is applied as Y minus theta times (X minus the mean of X).",
 "The variance is the Neyman bound of the adjusted cluster totals and treats theta as fixed. It does not propagate the estimation of theta.",
 "This is not the fixed-coefficient transform. A coefficient fixed outside the experiment leaves the per-row ITT unchanged; a slope estimated from these totals does not, and the known-truth enumeration shows the two means differ.",
 "This is not a switchback regression and it is not a row-level learned coefficient. A slope fit on rows stays refused.",
]

