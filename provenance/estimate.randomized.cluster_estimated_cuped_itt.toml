[method_review]
status = "reviewed_with_limits"
scope = "cluster_total_ols_slope, cluster_totals_adjusted_by_slope, and estimated_cluster_cuped_itt in crates/antecedent-estimate/src/randomized_neyman.rs. The slope is the centered covariance ratio. The adjusted totals are passed to complete_cluster_itt. The enumeration test compares that slope's assignment-mean with a fixed coefficient and checks the reported variance against complete_cluster_itt of the adjusted totals."
assumptions = ["The prediction totals were fixed before assignment.", "Clusters are the assignment units and the Neyman variance treats the slope as a constant.", "Coverage of the resulting interval is not measured."]
historical_exposure = "This review read the product functions named in its scope and the enumeration test. It did not consult an upstream implementation. The cited papers supply the covariance ratio and the Neyman variance; the composition, the cluster totals, and the decision not to propagate the slope are stated in implementation_deviations."
redistribution = "Primary work is cited, not redistributed."
limitations = "The known-truth fixture is one population of six clusters with three treated. It shows the estimated-slope mean is not the unadjusted per-row ITT and that the variance matches the Neyman bound of the adjusted totals. It does not measure coverage. The published interval still requires thirty clusters in each arm."
sources = ["https://doi.org/10.1145/2433396.2433413", "https://doi.org/10.1214/ss/1177012031"]
findings_resolved = ["No numerical defect was found. Over all 20 assignments of six clusters with three treated, a coefficient fixed outside the experiment has mean equal to the unadjusted per-row contrast, the slope fit on the observed totals does not, and the reported variance equals the Neyman bound of the adjusted totals."]
