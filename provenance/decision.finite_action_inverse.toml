[non_algorithm_review]
status = "justified_non_algorithm"
kind = "derivation"
rationale = "Exact enumeration of a caller-supplied action list against an already-published forward mean response."
no_independent_algorithm = "No estimator: each action is classified by the sign of m(a) - t (within tol) after budget and constraint filtering, which is the definition of the superlevel set restricted to the enumerated actions."
derivation = "For enumerated action a with forward mean m(a)=E[Y^do(a)] and threshold t, a is feasible for the at-least goal iff m(a) - t >= -tol (for at-most iff m(a) - t <= tol); constraints and budget exclude actions before the estimate is read. The set is relative to the enumerated actions, never interpolated."
