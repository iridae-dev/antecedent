implementation_deviations = [
 "The degrees of freedom are the Satterthwaite value for the HC2 quadratic form under homoskedastic errors, computed as (tr A)^2 / tr(A^2) with tr(A^2) expanded over the p-by-p moment matrix so no n-by-n matrix is formed. They are not recomputed from the fitted residuals, so the reference does not depend on the realized outcomes.",
 "The estimator is the coefficient on realized assignment in a regression on an intercept, the assignment and up to two pre-assignment covariates, with no treatment-covariate interactions. With no covariate it is the difference in means and the variance is the per-arm sample-variance sum of Neyman. The interval is conditional on the realized arm sizes, so for a Bernoulli trial it is the interval of a complete randomization with those sizes.",
 "The interval is published in place of the normal HC0 or Neyman interval only where that interval is unsupported: fewer than 30 observed or 40 expected rows in an arm for the ANCOVA, fewer than 30 observed rows in an arm for the complete randomization. It needs at least 2 rows in each arm, at least 100 rows in all, positive variance, and no row of leverage 1. Its coverage is the repository's calibration evidence at 20 treated rows of 150 to 600, not a theorem of the cited papers, which justify the Student reference by a Satterthwaite approximation under homoskedastic errors and by simulation.",
 "The construction is an uncalibrated candidate until a coverage record covers it: its calibration key carries the HC2 standard-error kind, which no normal interval shares.",
]

