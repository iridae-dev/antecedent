# Fixed-effect generalized least squares over native and transported summaries with one shared
# transport-error term per transport, hierarchical normal borrowing, and a transported prior for
# a native normal likelihood. The inverse-variance / GLS pooling and normal-normal hierarchical
# borrowing are textbook; the transport-error structure (one tau_t^2 shared by every summary
# carried through the same transport) is a modelling construction of this implementation.
