# Fixed-effect generalized least squares over native and transported summaries with one shared
# transport-error term per transport, hierarchical normal borrowing, and a transported prior for
# a native normal likelihood. The inverse-variance / GLS pooling and normal-normal hierarchical
# borrowing are textbook; the transport-error structure (one tau_t^2 shared by every summary
# carried through the same transport) is a modelling construction of this implementation.
papers = [
  { title = "Introduction to Meta‐Analysis", citation_note = "Previously recorded title and bibliographic detail: Introduction to Meta-Analysis (Borenstein, Hedges, Higgins, Rothstein, 2009)", doi = "10.1002/9780470743386", sections = ["chapter 11: fixed-effect model, inverse-variance weights", "chapter 13: random-effects model (hierarchical normal borrowing across exchangeable studies)"] },
  { title = "Estimation in Parallel Randomized Experiments", citation_note = "Previously recorded title and bibliographic detail: Estimation in Parallel Randomized Experiments (Rubin, 1981)", doi = "10.3102/10769986006004377", sections = ["normal hierarchical model for exchangeable study effects"] },
  { title = "External Validity: From Do-Calculus to Transportability Across Populations", citation_note = "Previously recorded title and bibliographic detail: External Validity: From Do-Calculus to Transportability Across Populations (Pearl and Bareinboim, 2014)", doi = "10.1214/14-STS486", sections = ["selection diagrams: a mechanism with no selection node into it is shared by the source and the target population"] },
]
implementation_deviations = [
  "The shared transport error is a declared variance, not an estimate: the premise that b_t has variance tau_t^2 and is common to all summaries of one transport is a modelling declaration. A transport with no declared uncertainty is refused rather than read as zero.",
  "Pooling is generalized least squares under a declared covariance; the dependence between source and native estimates is the caller's declaration, with the evidence ledger deciding only whether the data overlap.",
  "The result is a point and a model variance. No confidence interval, posterior coverage or calibration is claimed.",
  "Hierarchical borrowing uses a moment-style normal model on summaries, not a full hierarchical posterior; the transported prior route treats a transported claim as the prior of a native likelihood and is point-and-variance only.",
]
upstream_implementations_observed = []
test_sources = [
  "crates/antecedent-design/tests/transported_synthesis.rs",
  "crates/antecedent-stats/tests/synthesis_oracle.rs",
]

[method_review]
status = "reviewed_with_limits"
scope = "synthesis_transport::{transport_aware_covariance, pool_transported, borrow_transported, transported_prior_update} and the synthesis routines they call (fixed_effect_gls and hierarchical_normal_borrowing): the covariance assembled from the sampling covariance plus one shared transport variance on the diagonal and between summaries sharing a transport key, generalized least squares estimate, variance, weights and heterogeneity, the variance without transport, the effective-variance hierarchical borrowing with a discrete spread prior, and the precision-weighted transported prior update. Not random-effects (DerSimonian-Laird, REML) or the dependence envelope in synthesis.rs, which belong to the evidence-synthesis records."
assumptions = ["The transport variance of a transport is a declared constant, shared by every summary carried through it.", "Sampling covariance is the caller's declaration; borrowing treats summaries as independent normal draws around a common mean with a discrete spread prior."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the product source named in its scope and compared results with definitions evaluated by executing references written for this review; no upstream implementation or test source was consulted or copied. No cited publication was retrieved in this review: the correspondence is between the product code and the standard definitions, verified numerically, not a page-level reading of any paper."
redistribution = "Primary work is cited, not redistributed. The reference script and its frozen output are repository-authored (MIT OR Apache-2.0); the script uses only the Python standard library and mpmath (a pure-Python library, installed offline in the local environment). The script declares its inline script metadata but is not run in a locked, isolated environment and is not wired into any gate; its output is frozen in the JSON file and compared by the test."
limitations = "Exact Fraction GLS (including a supplied non-diagonal sampling covariance, shared and distinct transports, a 2^40 variance ratio, a near-collinear shared transport and a single summary), 50-digit mpmath hierarchical posteriors from the marginal-likelihood definition (flat and normal mean prior, a transported study, tau = 0 in the support, a single-point prior), and exact transported-prior updates including a 4096 transport variance. The transport variance declared on a summary that borrowing or the prior route cannot honor is refused, not ignored (shared key in borrowing, native prior, transported likelihood, inconsistent variance, diagonal mismatch, negative variance). A correlation of 1 - 4e-12 produced by a shared transport variance over a tiny sampling variance is refused by the routine's documented correlation-scale singularity test even though the exact answer exists; the test asserts that refusal and the review records it as a limit. The borrowing posterior is evaluated on the declared discrete tau grid only; continuous priors, unequal tau support spacing effects and the sensitivity to the grid are not studied. No interval, calibration or coverage is claimed; the cited books were not retrieved."
sources = ["Introduction to Meta-Analysis (Borenstein, Hedges, Higgins and Rothstein, 2009), https://doi.org/10.1002/9780470743386, cited and not retrieved", "External Validity: From Do-Calculus to Transportability Across Populations (Pearl and Bareinboim, 2014), https://doi.org/10.1214/14-STS486, cited and not retrieved"]
findings_resolved = ["No defect found: pooled estimate, variance, weights, heterogeneity, variance without transport, borrowed posterior and prior update match the exact and 50-digit references in every regime."]
record_sha256 = "299d941d864c7aa4d09dad34940131b13e2153151df90eeed50e7804338b1c05"

