[method_review]
status = "reviewed_with_limits"
scope = "evaluate_sequential_dr_value_with_subject_scores in antecedent-stats longitudinal_regime.rs: the backward recursion V_t = Q_t + 1[observed and following at t] (V_{t+1} - Q_t) / (pi_t c_t) with V_T the terminal outcome (zero when unobserved), the resulting per-subject augmentation scores, their mean, the maximum cumulative weight along each subject's followed prefix, the observed fraction, and the monotone-observation and terminal-agreement checks. Not the fitting or subject exclusion of the Q predictions, the interval support floors, or the marginal structural model."
assumptions = ["Sequential randomization (no unmeasured confounding of any period's treatment given the recorded history), positivity at the declared floor and exchangeable censoring are identification assumptions taken as given.", "Sequential treatment and censoring probabilities and, where used, the period predictions are supplied inputs; subjects are independent histories. The kernel does not fit or verify them."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the product source named in its scope, including the shared helpers in the same file, and compared results with definitions evaluated by executing references written for this review; no upstream implementation or test source was consulted or copied. The cited publications were not retrieved in this review: the correspondence is between the product code and the standard definitions those works state, verified numerically, not a page-level reading of the papers."
redistribution = "Primary work is cited, not redistributed. The reference script and its frozen output are repository-authored (MIT OR Apache-2.0); the script uses mpmath (BSD-3-Clause), imported at run time and not redistributed here. The script declares its inline script metadata but is not run in a locked, isolated environment and is not wired into any gate; its output is frozen in the JSON file and compared by the test."
limitations = "Five synthetic cohorts of 50 to 80 subjects and one to four decision periods: a static regime at two periods, a regime followed by about half the subjects with action and censoring probabilities at 0.02 and 0.05 (cumulative weights near 2.5e4), a history-dependent regime, an alternating regime and an outcome offset of 1e8. Values are asserted to 1e-10 to 1e-12 relative, the IPW standard error to 1e-9, and each sequential-DR subject score to 1e-9. The pointwise interval functions apply support floors and a sample-size gate to these quantities; their coverage is measured by the module's repeated-sample tests, not here. The reference script is not run in a locked, isolated environment and is not wired into any gate; its output is frozen in the JSON file and compared by the test."
sources = ["https://mpmath.org/"]
findings_resolved = ["No defect found: the value, the maximum weight, the observed fraction and each of the subject scores equal the telescoped form Q_0 + sum G_{t-1}(Q_t - Q_{t-1}) + G_{T-1}(Y - Q_{T-1}) evaluated in exact rationals, which is not the recursion the product runs."]
