implementation_deviations = [
 "Ordinary Newey-West HAC caps an oversized requested lag to n-1 and uses that effective lag in the Bartlett denominator. statsmodels uses the requested lag even beyond n-1; the retained oracle compares matched effective lags and separately asserts the raw requested-lag difference.",
 "Multiway clustering is limited to four dimensions, applies a G/(G-1) correction separately to each inclusion-exclusion subset, and rejects materially negative combined meat; these are explicit finite-sample and numerical policies.",
 "Panel HAC combines within-unit score products with explicit integer-time Bartlett lags and a global effective lag. This is a repository-defined cluster-plus-HAC construction, not the within-groups covariance estimator stated in the Arellano citation.",
 "The sandwich bread, leverages and meat are formed in coordinates orthogonalised by a Householder QR of the column-equilibrated design (reference estimators invert XtX); the estimators are algebraically the same, and the choice avoids squaring the condition number.",
 "HC1 is n/(n-p) times HC0; HC2 and HC3 divide the squared residual by (1-h) and (1-h)^2 and refuse a leverage within 1e-8 of 1; the one-way cluster factor is G/(G-1) (n-1)/(n-p); the Bartlett weight is 1 - l/(L+1) with no finite-sample factor on Newey-West. These are the declared conventions the review checked, not statements of the cited papers' sections, which were not retrieved."
]

