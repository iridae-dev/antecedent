[non_algorithm_review]
status = "justified_non_algorithm"
kind = "derivation"
rationale = "Shared-plan point execution of checked binary whole-history functionals: the response under a supplied target initial-state law is the source conditional mean given each initial state, mixed by the target law."
no_independent_algorithm = "recalc_temporal.rs (with its measured and studentized submodules) retains the identified source expression and fits; its arithmetic is source_conditional_means (a masses-weighted ratio over the source joint's atoms), the mixture sum of mass times response, the effect as a difference of two such means, and the shared decision arithmetic. No sqrt, ln, exp or solve."
covered_by = ["identify.id", "temporal.uncertain_initial_state"]
derivation = "With the source joint P(S0, Y | do(a)) from the checked identification, E[Y | S0 = s, do(a)] = sum over atoms with S0 = s of p y / sum of p, and the target response is sum_s pi_target(s) E[Y | S0 = s, do(a)]; the effect is the difference of two responses. tests/recalc_temporal.rs compares each response and the effect with the structural conditional probabilities integrated by hand, without invoking either engine, to 1e-10."
