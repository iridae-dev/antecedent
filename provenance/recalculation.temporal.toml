  "For a DAG with root S0 and selection only into S0, invariant remaining mechanisms make source P(S0,Y|do(A1,A2)) conditional on supported S0 invariant. Existing general ID checks the actual observational source intervention joint; a binder relabels only actual observational leaves to the real source regime while preserving all algebra. Dividing that checked joint by the positive source S0 marginal and mixing the supplied target S0 law identifies the target response. The exact native source expression/root and bound executable expression/root are exported and independently replayed from raw whole units. New intervention sequence/data invalidates required mechanism work; compatible initial law and utility changes reuse source factors/proof. Bound5-node source identification is fixed-input preflight/postcheck, not an incrementally charged generic search. Whole-unit bootstrap interval is a separate unmeasured internal candidate; public dependent inference remains closed.",
