[method_review]
status = "reviewed_with_limits"
scope = "mixture_moments (law of total variance: mean, within, between and total variance of a finite mixture with known weights), mixture_marginal (the mixture's atoms and masses from draw sets), marginal_interval_candidate (Hyndman-Fan type 1 equal-tail quantiles of the mixture) and mixture_exceedance (weighted exceedance fraction and its independent-component Monte Carlo standard error) in crates/antecedent-stats/src/joint_law.rs. Not the dependence envelopes, aligned-draw routines or the contract rule."
assumptions = ["Weights are known, non-negative and sum to one; each component's draws carry mass weight/n_i; a mixture selects one component so the components need no joint law.", "The exceedance standard error treats each component's draws as independent draws (sum w_i^2 p_i (1-p_i)/n_i); it is a Monte Carlo error, not a coverage statement.", "Weights and levels in the enumeration are dyadic so that quantile boundaries compare exactly."]
historical_exposure = "Historical author exposure cannot be independently established. This review read the product source named in its scope and wrote its own reference, which does not use the comonotone, countermonotone or Makarov forms of the product: it enumerates every integer contingency table with the marginal counts (all vertices of the transportation polytope) in exact rational arithmetic and evaluates the remaining quantities from their definitions. No upstream implementation was consulted."
redistribution = "The reference script and its frozen output are repository-authored under MIT OR Apache-2.0; mpmath is used only to produce the frozen values and is not a product dependency. No cited paper is redistributed."
limitations = "Bayesian Data Analysis, the cited source for the law of total variance on the related records, was not retrieved; the identity is verified against exact rational evaluation. Three mixtures with two or three components and at most eight draws per component are enumerated; large component counts, weights that sum to one only within the 1e-9 tolerance, and quantile levels that land within rounding of an atom boundary are not exercised. The interval is a construction with unmeasured coverage; the exceedance error treats draws as independent and ignores autocorrelation."
sources = ["https://mpmath.org/doc/1.3.0/"]
findings_resolved = ["No numerical defect was found: mean, within, between and total variance of three mixtures (including a degenerate-weight mixture) agree with exact rationals; the mixture atoms (merged repeated values, masses weight/n_i), the equal-tail quantile interval at three dyadic levels and the weighted exceedance probability and its standard error agree with exact enumeration."]
