rationale = "Posterior means of the per-row score tables of the smoothed-dose fit, one table per grid dose, under independent normal priors at zero. No interval."
no_independent_algorithm = "smoothed_dose_score_posterior applies score_contrast_posterior with a zero control column to each grid dose's table; the scores come from the covered smoothed-dose fit."
covered_by = ["estimate.posterior_mean_kernel", "estimate.smoothed_dose"]
derivation = "Normal likelihood for a mean with plug-in precision P = n / s2 and an independent N(0, tau^2) prior give posterior mean P / (P + 1 / tau^2) * mean = mean * n tau^2 / (n tau^2 + s2); checked against exact rationals in posterior_mean_reference.rs and in the route's own test."
