# Transport under graph uncertainty: the structural transport verdict of every member of a
# discovered Markov equivalence class, side by side. The class membership characterization is
# cited by transport.cpdag_completion; the per-member verdict is the existing structural
# transport identifier. The envelope itself (status, formulas_agree, unresolved pairs) is
# original reporting engineering.
# papers = [] is an explicit judgment, read against crates/antecedent-identify/src/class_transport.rs and
# crates/antecedent-identify/src/discovered_transport.rs: both modules aggregate the structural verdicts that the
# existing transport identifier gives on each member of a CPDAG or PAG class (member enumeration is the
# completion walk of transport.cpdag_completion / graph.completion; the invisible-edge test of Zhang 2008 is
# generalized::invisible_directed_edges, covered by identify.generalized_adjustment) and report status,
# formula agreement and unresolved pairs. The modules contain no numerical routine. The publications
# (Pearl and Bareinboim 2014; Richardson and Spirtes 2002; Zhang 2008; Verma and Pearl 1990) were not retrieved.
papers = []
implementation_deviations = [
  "Reviewed as a justified non-algorithm mapping for the structural envelope modules only. The estimation and bootstrap confidence-set parts described below live in other modules (crates/antecedent/src/analysis/discovered_transport_trial.rs and the estimate crate) and are not reviewed by this mapping; their coverage evidence is the separate collected record named below. The most-confounded reading of a PAG member rests on tests of hand-chosen cases, not on an independent executing oracle of visibility",
  "The additive bounded-outcome confidence-set endpoint uses externally declared potential-outcome support in both populations. Completed scientific nonidentification or a structural range yields the exact contrast support [a-b,b-a], labelled logical, while identified sampling intervals retain the old bootstrap endpoints. Support is not estimated from observed extrema. Original-input verification seals report, query, datasets, support, options and seed, checks proof and retained grids, then deterministically replays under caller limits. This is original engineering and a distinct method with its own collected complete-procedure record: cov.discovered_transport.pag.frequentist.percentile_bootstrap_or_logical_support.l95.discovered_pag_transport_contrast_complete_procedure_coverage.fci_cutoff_0_05_sparse_1023_trial_compatibility_fisher_exact_alpha_0_01_declared_selection_joint_pretreatment_standardization_bounded_outcome_confidence_set. At source 70f19b82ccb1d18cf94c1e288e0d802fc447e4c4, the original participant grids 2000/4000/8000 each used 2000 attempts; whole-procedure coverage cleared .93, identified reporting cleared .9 and median width over all confidence sets was at most 1.5 times the true effect magnitude. Operational errors count as misses. Current attestation and per-execution binding remain required; this does not license the raw conditional interval or arbitrary discovered graphs.",
  "The optional static binary completely randomized source-trial compatibility refinement records one predeclared two-sided Fisher exact independence test. It rejects only no-directed-treatment-to-outcome-path members when that common test rejects, keeps all other members, and still requires unanimous identification and estimability. Its proof includes exact rows, every original graph and every retention decision. This test does not certify graph recovery or complete-procedure interval coverage.",
  "Temporal calibration opts into correction over all predeclared allowed directed MCI links, including contemporaneous directions and p=1 for untested or removed links. This is the declared testing family; adaptive CI query selection and subsequent orientation are not assigned an unconditional FWER theorem.",
  "Available intervention factors must come from the actual declared experiment catalog. Structural derivations may be cached across bootstrap draws, but empirical laws are rebound on every draw.",
  "No new theorem. A structural envelope is a statement about which members the implemented rules certify; it is not a point, interval or bound on an effect and carries no probability: members are not weighted and the true graph is not asserted to be among them except under the listed ENVELOPE_ASSUMPTIONS.",
  "NotIdentifiedInEveryMember is the conservative not-certified reading, never a proof of non-transportability. Partial means the member bound stopped enumeration; the unexplored remainder is not certified empty.",
  "A PAG's members are maximal ancestral graphs whose directed edges state ancestry. Each completion is read as the most-confounded ADMG it is compatible with: a directed edge that is not visible (Zhang 2008) also gets a bidirected edge, because only a visible edge excludes a latent common cause (Zhang 2008, Lemma 9); a derivation on that supergraph holds in every causal model the completion represents (sound, not complete). The completion walk is budgeted and a stop is a partial envelope.",
  "A temporal class is unrolled over the window of a declared horizon; the process before the window is replaced by a bidirected edge between every pair of window nodes the template links to it by an arrowhead, a supergraph of the latent projection (original reporting engineering, no new theorem). A selection target applies at every slice.",
  "The estimate over a class evaluates the complete sID formula of each member against source experiment rows and target observational rows with the retained empirical-table transport grid, then summarises: a point when members agree, a labelled structural range (smallest and largest member estimate, no probability) when they differ, a refusal when a member is not identified. An optional percentile interval on a point contrast is conditional on the discovered class and not bound to a complete-procedure calibration record; a temporal candidate interval instead requires an explicitly declared moving-block bootstrap. The raw conditional interval is not itself a whole-procedure claim. Three- and six-variable temporal full-family constructions have distinct collected records requiring current attestation; the bounded-outcome static confidence set owns the separate collected record named above, with its exact declared support and procedure scope and current-attestation requirement.",
  "Selection targets are declared by the caller and never inferred from per-population discovery differences.",
  "Enumeration is bounded (DEFAULT_ENVELOPE_MEMBER_BOUND); an unfinished search, conflicting orientation evidence, a selection target outside the structure, or a class too large is a typed refusal naming every unresolved pair.",
]
