# Independently written horizon-specific linear g-computation. Temporal
# backdoor identification supplies the unfolded adjustment set; estimation
# fits lag-aligned OLS and evaluates the fitted mean on a dose grid.
papers = [
  { title = "Mostly Harmless Econometrics", doi = "10.1515/9781400829828", sections = ["Chapter 3: regression and causal effects"] },
  { title = "Causal Inference: What If", sections = ["Chapter 19: time-varying treatments and the g-formula"] },
]

implementation_deviations = [
  "uses one additive linear OLS projection per horizon on the unfolded backdoor design, not recursive sequential-regression g-computation over a multi-step treatment history",
  "fits the full aligned sample without cross-fitting and licenses only one treatment-time column; multi-step Sustained and Sequence route through estimate.temporal_sequential",
  "the pointwise band is published only when joint bootstrap replicates are requested: a joint circular-block bootstrap of the lag-aligned rows of every horizon (or Dirichlet block-weight draws when block_weight_posterior is set), with a fixed-b dispersion inflation and a per-cell kernel-bias factor; with zero replicates no band is published, because an analytic OLS band would treat lag-aligned rows as independent; the band reads as confidence (bootstrap) or credible (block weights), conditional on the unfolded linear regression and not on the identification step",
  "pinned pointwise 95% band oracle on conformance/response/temporal_dose_horizon (including strictly positive width at dose zero)",
  "adjustment-set correctness on conformance/response/temporal_confounded_pulse (unadjusted slope 4.5 vs structural 2)",
  "per-horizon empirical support on conformance/response/temporal_horizon_support (union of ranges would mislabel mixed cells)",
  "the joint replicates of the surface can be retained (JOINT_HORIZON_REPLICATES) so horizons compose from realizations coupled across them; with block_weight_posterior the replicates are Dirichlet block-weight draws (one Exp(1) weight per block of consecutive series times shared by every horizon, weighted least squares per horizon), the Bayesian bootstrap of Rubin applied to blocks of the lag windows; this is the repository's own construction and the band then reads as credible, conditional on the unfolded regression",
]

upstream_implementations_observed = []

test_sources = [
  "crates/antecedent-estimate/tests/temporal_response_gcomp_reference.rs (exact-rational per-horizon OLS g-computed levels: dose surface, hard level and additive shift; offsets, near-collinear confounder lags, tiny and long series)",
  "conformance/response/temporal_dose_horizon/expected.json",
  "conformance/response/temporal_confounded_pulse/expected.json",
  "conformance/response/temporal_horizon_support/expected.json",
  "crates/antecedent/tests/temporal_response_facade.rs",
  "crates/antecedent/tests/temporal_response_redundancy.rs",
  "crates/antecedent-estimate/src/temporal_response/tests.rs (joint_horizon_replicates_are_retained_on_request_and_couple_the_horizons)",
  "crates/antecedent/tests/horizon_composition.rs",
]
[method_review]
status = "reviewed_with_limits"
scope = "TemporalResponseEstimator::estimate for a MeanCurve over a dose grid and a single-coordinate InterventionResponse (hard level or additive shift) at one or more horizons, point values only: for each horizon the lag-aligned design (intercept, treatment at the horizon's lag, the adjustment nodes at their lags) built by TemporalLinearAdjustment::prepare over that horizon's own windows, the ordinary least squares fit, the design column means, and the g-computed level coef'cbar(a) with the treatment column replaced by the dose, or by the horizon's treatment mean plus the shift (fit_horizon, FittedHorizon::fit, level_at, FittedSurface::cells, estimate_mean_curve). Not the bands, the Bayesian surface, gapped series, observation corrections or Sequence overlays."
assumptions = ["Backdoor identification supplies an adjustment set that makes the additive linear regression a valid outcome model; no treatment-by-covariate interaction.", "Each horizon is fitted on its own complete lag windows with ordinary least squares; the standardized mean is the regression evaluated at the design column means, which for a model linear in the dose equals averaging the fitted outcome over the rows.", "The treatment column of every dose cell is the dose itself; a shift is read against each horizon's own treatment mean."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the product source named in its scope, including the numerical helpers it calls, and compared results with definitions evaluated by an executing reference written for this review; no upstream implementation or test source was consulted or copied. The cited publications were not retrieved in this review: the correspondence is between the product code and the standard definitions those works state (the linear g-computation level beta'cbar(a) for an additive outcome regression), verified numerically, not a page-level reading of the papers."
redistribution = "Primary work is cited, not redistributed. The reference script and its frozen output are repository-authored (MIT OR Apache-2.0) and use only the Python standard library; the script declares its inline script metadata but is not run in a locked, isolated environment and is not wired into any gate; its output is frozen in the JSON file and compared by the test."
limitations = "Five series (9, 70 and 400 rows) with one treatment, one confounder and horizons 1 and 2, adjustment lags {1,2} and {2} read off the unfolded graph by hand; an outcome offset of 1e6 with a treatment offset of 1e3 and confounder lags correlated at 0.9995. Levels are asserted to 1e-9 of the sum of absolute terms (1e-6 for the nearly collinear case). The review covers the point surface and levels only: the pointwise band is a joint circular-block bootstrap (or Dirichlet block-weight) construction with a fixed-b dispersion inflation and a kernel-bias factor and is not examined here, nor are the simultaneous band, the Bayesian surface, a series with missing time points, sampling weights or the support classification. The adjustment set is taken from the temporal backdoor identifier as hand-checked for this graph; the identifier is a separate record. The cited publications were not retrieved."
sources = ["https://doi.org/10.1515/9781400829828", "https://www.hsph.harvard.edu/miguel-hernan/causal-inference-book/"]
findings_resolved = ["The mean-curve surface equals the exact rational OLS level at every dose and horizon, with the dose-major, horizon-minor layout, under a 1e6 outcome offset, a 1e3 treatment offset, nearly collinear confounder lags, a nine-row series and 400 rows.", "A hard-level intervention response equals the mean-curve cell at that dose for every horizon, and an additive shift is evaluated at each horizon's own treatment mean plus the shift.", "Record text corrected: the pointwise band is not an analytic delta-method band (the product withholds it with zero replicates and builds it from the joint circular-block bootstrap otherwise); the deviation list now says so.", "The identification-to-design correspondence: with the temporal policy origin at the treatment, a horizon-1 pulse reads the treatment at lag 1 and the confounder at lags 1 and 2, and the horizon-2 pulse the treatment at lag 2 and the confounder at lag 2, as derived by hand for the test graph."]
record_sha256 = "f5790bdc98a0ab641c909123033f0c10b0713db0d6712e77a48e07074cc81ac4"

