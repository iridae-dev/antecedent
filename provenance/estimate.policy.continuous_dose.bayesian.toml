[method_review]
status = "reviewed_with_limits"
scope = "fixed_dose_policy_posterior of crates/antecedent-estimate/src/continuous_dose_posterior.rs with the conjugate regression it calls (fit_basis_regression of dose_basis_regression.rs, whose mean and covariance it consumes): the observed group fractions, the polynomial basis in the dose rescaled to [-1, 1] on the declared support, the per-group posterior with the coefficient prior N(0, v s_j^2) (so the posterior mean is (X'X + diag(1/s^2))^-1 X'y and, for a known variance v, the covariance is v (X'X + diag(1/s^2))^-1), the Epanechnikov window functional of every basis function by Gauss-Legendre quadrature, the exact mean and variance of the policy value, the reference value and their difference, the strict window membership count |D - t| < h behind the local-support gate, the paired draws and the equal-tailed 95% intervals, and the Student-t moments of the inverse-gamma residual prior. Not the antecedent-prob conjugate sampler beyond its agreement with those moments, the frequentist known-density cell, bandwidth or basis choice, or coverage."
assumptions = ["Within a group the outcome is a polynomial in the rescaled dose plus independent Gaussian errors; groups are independent a posteriori and the group fractions are held at their observed values.", "The prior scale vector is the smoothing prior: a different vector is a different prior, and the prior variance of a coefficient is v s_j^2, so the scale is in residual standard deviations.", "The value is the average response over the prespecified window, not do(D = d); conditional exchangeability within groups and local positivity are the caller's identification premises."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the product source named in its scope and compared results with a 40-digit multiprecision ridge posterior, adaptive-quadrature window integral and Student-t moment reference written for this review (dose_posterior_reference.py); no upstream implementation or test source was consulted or copied. The cited publications were not retrieved in this review: the correspondence is between the product code and the standard definitions those works state, verified numerically, not a page-level reading of the papers."
redistribution = "Primary works are cited, not redistributed. The reference script and its frozen output are repository-authored (MIT OR Apache-2.0); mpmath, where used, only produces the frozen values and is not a product dependency. The script declares its inline script metadata but is not run in a locked, isolated environment and is not wired into any gate; its output is frozen in the JSON file and compared by the test."
limitations = "One design of three unequal groups (7, 11 and 9 rows) with a degree-three polynomial, support (0, 5), bandwidth 0.9, and policy and reference rules in different group windows: the exact means and variances agree to a relative 1e-10 with the adaptive-quadrature reference; 100,000 draws match the means within five Monte Carlo standard errors, the variances within 3%, the equal-tailed intervals within 0.05 posterior standard deviations and the sign probability to the draw fraction. The inverse-gamma case (shape 6, scale 1.5) is checked on the draw variance within 5% only, since no exact moment is returned. Not exercised: a single-group policy, polynomial widths above four, windows touching the support boundary (refused), and coverage under a misspecified curve. The cited publications were not retrieved."
sources = ["https://mpmath.org/doc/1.3.0/"]
findings_resolved = ["No numerical defect was found: window functionals, per-group posteriors, group fractions and the combination into policy, reference and incremental moments agree with the multiprecision reference; the draws are paired and Gaussian with those moments.", "The prior scale convention (coefficient variance v s_j^2, scales in residual standard deviations) is the one the module states; the reference fixes it by a Student-t derivation that the inverse-gamma draws reproduce."]
