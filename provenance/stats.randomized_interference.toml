# The implementation's `conservative_variance` is a repository-defined,
# covariance-free diagnostic obtained by bounding every unknown cross-unit
# covariance with Young's inequality. It is not Aronow and Samii's Section 5
# joint-exposure-probability variance estimator and carries no coverage theorem.

