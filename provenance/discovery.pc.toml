implementation_deviations = [
 "Skeleton search is bounded by max_cond_size, which defaults to 3, so higher-order separating sets are not considered by default.",
 "The default applies Benjamini-Hochberg adjustment after the fixed-alpha skeleton search, whereas the cited PC procedure uses fixed-alpha conditional-independence decisions. The family is one hypothesis per tested adjacency (the largest p-value over every conditioning set it faced, removed adjacencies included), not one per test; an adjacency whose adjusted p exceeds alpha is dropped without a separating set.",
 "For each adjacency the candidate conditioning sets are the size-k subsets of the current neighbours of either endpoint, scanned in ascending order and merged without repeats. The original procedure takes the neighbours of x and of y as two ordered passes; the set of candidates is the same but the first separating set found, and thus the recorded one, can differ. Adjacency is updated in place, so the skeleton is order dependent (not PC-stable); the traversal is the fixed sorted-id order.",
 "Unshielded triples are oriented as colliders when the recorded separating set of the endpoints omits the centre. A triple whose endpoints are non-adjacent without a recorded separating set (adjacency removed by multiplicity correction, a parent limit or forbidden-edge knowledge) is marked ambiguous and neither oriented as a collider nor used as a non-collider premise by Meek R1 and R3, which is more conservative than the cited procedure and not part of it. The Meek rules are R1-R4; R4 is only reachable through background knowledge, which is applied before colliders.",
 "A conditioning query the CI test cannot answer (constant or collinear columns) is missing information: it does not separate, and joins no multiplicity family.",
]

