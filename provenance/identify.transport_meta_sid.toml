scope = "identify_meta_transport, verify_meta_transport and verify_meta_s_hedge in crates/antecedent-identify/src/sid/meta.rs for a hard-intervention query with several source populations each declaring its own selection targets on a shared ADMG: the verdict (identified with a meta derivation, proven non-transportable with a common s-hedge, or not certified), the complementary-source construction (sum_z P_a(z | do(x)) P_b(y | do(z))), and the numeric value of the returned formula on exact source experiments. Relies on the sID review (identify.transport_sid) for the single-source engine the meta search reuses; the multi-source rules are checked here against their own enumeration. Not a review of the finite-catalog binding (sound, incomplete), of the transport grid or certificate wrappers, or of non-classical experiment families."
assumptions = ["The reference is a finite latent-variable SCM with independent Bernoulli mechanisms (probability 0.07 + 0.03 * setting + 0.13 * parents + 0.11 * shared latent causes + interaction terms + 0.09 for a selected node), integrated over eight latent states by hand in the test, one change in mechanism per declared selection target in each source and the target; truth is the target interventional law over every outcome atom and the contrast.", "A positive verdict is checked by evaluating the proof on exact source experiments (and verify_meta_transport replays the local premises); a negative verdict is checked as a common s-hedge against every declared source, so a witness that drops an admissible source is rejected.", "Completeness is scoped by the module to the classical complete source-experiment family and is not asserted for finite catalogs."]
historical_exposure = "Historical author exposure cannot be independently established. This review read the product source and wrote a separate reference of its own from the definition; no upstream implementation or test source was consulted or copied."
redistribution = "The references are repository-authored under MIT OR Apache-2.0 and run inside the crates' own tests; the primary sources are named by title and are not redistributed."
limitations = "The primary paper (Bareinboim and Pearl 2013, meta-transportability) was not retrieved; the Figure 5 line mapping documented in docs/architecture/transport-meta-grid.md is taken as stated, and completeness rests on the paper plus common-s-hedge verification, not on numerics. Binary three-node ordered ADMGs over seven selection patterns with outcomes one and two nodes wide, and a four-node family, are enumerated; the mechanism probabilities stay between 0.07 and 0.83, so extreme-probability regimes (which the single-source review adds) are not exercised for the meta search, and larger graphs, more than two sources and non-binary domains are not enumerated. The unit tests inside meta.rs cover complementary sources and common-witness rejection by hand-built cases only. Calibration remains deferred."
