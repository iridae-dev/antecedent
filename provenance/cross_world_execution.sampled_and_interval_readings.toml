implementation_deviations = [
  "No sampling, interval or posterior route exists for the finite cross-world executor: a request for a sampled exogenous posterior is refused before any work (cell_not_licensed, cross_world_execution.sampled_abduction_not_licensed) and an interval or posterior reading is refused by the joint-law propagation rule (cell_not_licensed, interval_route_closed or posterior_route_closed). The only open reading is the exact point value.",
