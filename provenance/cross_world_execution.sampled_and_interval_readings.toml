rationale = "The closed readings of the finite cross-world executor: a sampled exogenous posterior and interval or posterior readings are refused (the spread and declared-set envelope readings are computed exactly) with registered codes before any abduction, prediction or sampling work."
no_independent_algorithm = "finite_executor.rs static_checks refuses PosteriorSampling and the joint-law propagation rule refuses Interval and Posterior readings; the module takes no draw (shared_draws stays zero) and computes no interval or posterior. The spread reading is the exact posterior variance over the enumerated exogenous noise and the envelope reading is the range of the point value over a declared parameter set, both checked against definition-level Fraction enumeration in cross_world_execution.finite_markovian_scm's sibling test finite_scm_readings_reference.rs; an envelope without a declared set is refused. The exact enumeration or elimination that produces the open point value is covered by cross_world_execution.finite_markovian_scm."
