implementation_deviations = [
 "The bandwidth is fixed by the caller and used for both the estimation and the bias-correction fit (the pilot bandwidth equals the estimation bandwidth); no data-driven bandwidth selection and no separate bias bandwidth. The kernel is triangular.",
 "Fuzzy jump: the estimation order is quadratic and the pilot cubic; the bias-corrected one-sided intercept is the quadratic intercept minus the projection of the omitted cubic term times the cubic coefficient, which equals the intercept of the cubic fit on that side. Regression kink: the one-sided slopes come from a local quartic fit, the slope change is divided by the bandwidth.",
 "The variance is the HC0 sandwich of the pilot fit, which carries the covariance of the estimated bias term, combined across the two sides, the outcome and the treatment equation; the ratio variance is the delta method with the HC0 outcome-treatment covariance. The finite-sample HC1-HC3 and nearest-neighbour variance choices of the cited work are not implemented.",
 "A weak first stage (the corrected treatment discontinuity or kink within 1.96 HC0 standard errors of zero) is refused; the normal interval is not a weak-instrument-robust set. The 0.975 normal interval and the retained support gate are repository support policy established by the coverage simulations, not a result of the cited papers.",
 "Continuity of conditional means (fuzzy jump) or of the derivative of the running-variable trend (kink) and monotone compliance are declared assumptions, not tested.",
]

