  "The implementing module is crates/antecedent/src/period_refresh.rs. It states: The earlier posterior is never the prior of a period whose mechanism was not declared the same, because that would assume the stationarity a temporal index does not give; a period that overlaps the summarized one, or reuses its snapshot, is refused: the same observations would enter twice.",
  "The gap is not filled and not assumed stationary: the rows that would span it are not formed, and the new period contributes its own rows only.",
