[method_review]
status = "reviewed_with_limits"
scope = "PeriodRefresh::start and ::refresh in crates/antecedent/src/period_refresh.rs for an autoregressive mechanism of order L: the lag-row construction (lagged_rows, with the absolute time index of each target as its row id), the carried tail of the last L values, the three outcomes of a later period (a contiguous extension that forms the rows reaching back into the tail, an extension over a gap that does not, and a restart on the new period alone when the mechanism was not declared invariant), the refusal of an overlapping or snapshot-reusing period, and that a refused period leaves the fit, the posterior and the event list unchanged. The least-squares summary and the conjugate posterior themselves are the shared state.ols_refresh and state.conjugate_refresh kernels, whose own reviews are relied on; this review checks only that this route hands them exactly the rows an independent replay forms. Not the window-factor survival rules of refresh_survival, the artifact wire format, summary-only retention, row eviction or reprior."
assumptions = ["The mechanism is v_t = c + sum_k phi_k v_(t-k) + e_t with independent innovations; the stationarity of a mechanism across periods is only what the caller declared.", "The conjugate normal-inverse-gamma posterior and ordinary least squares are determined by the retained rows and the stated prior, so a correct row set fixes every reported number.", "Series values are finite; the series is regularly spaced by the declared cadence."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the product source named in its scope, including the numerical helpers it calls, and compared results with definitions evaluated by executing references written for this review; no upstream implementation or test source was consulted or copied. The cited publications were not retrieved in this review: the correspondence is between the product code and the standard definitions those works state, verified numerically, not a page-level reading of the papers."
redistribution = "Primary work is cited, not redistributed. The reference script and its frozen output are repository-authored (MIT OR Apache-2.0); the script uses only the Python standard library. It is not run in a locked, isolated environment and is not wired into any gate; its output is frozen in the JSON file and compared by the test."
limitations = "Ten frozen cases of 14 to 95 values with lag orders 1 to 3: contiguous periods at offsets of 1e4 and 1e6 (two and three periods, and a restart with three lags), a gap, periods shorter than the lag order (contiguous and across a gap), a restart, nearly collinear ramps at offsets of 2000, 1e4 and 1e6 with a weak prior, and a strong prior against few rows; every series value is dyadic so the product reads the reference's numbers exactly. The posterior mean and rate are held to 1e-9 relative on every case (measured: at most 3e-10, at the offset of 1e6 and on the ramps), and the least-squares coefficients to 1e-8 on the autoregressive cases (measured 6e-10 at 1e6). The unregularised least squares of the near-collinear ramps is held to 1e-7 at offsets 2000 and 1e4 and to 1e-4 at 1e6 (measured 3e-9, 1e-8 and 6e-6): there the centred scatter of the rows, accumulated in double precision, is itself conditioned near 1e8 or worse and no prior bounds the solve. Lag order, prior shape and the survival of a window under a changed factor are not swept; refresh_survival is relied on, not reviewed here. The cited publications (Plackett 1950; Gelman et al.) were not retrieved in this review: the reference is the standard definition of the recursive least-squares update and the conjugate regression posterior. The reference script is not run in a locked, isolated environment and is not wired into any gate."
sources = ["https://docs.python.org/3/library/fractions.html"]
findings_resolved = ["The row identities are the absolute time indices of the targets, including the rows that reach back into the carried tail after a contiguous period and after a period too short to fill the lag window, and the tail is rebuilt from the new values alone after a gap.", "An extension over a gap forms no row that spans the gap, and an extension that leaves no row changes neither the fit nor the posterior.", "A restart fits the new period alone under the originally stated prior and drops the earlier rows; a restart whose new period leaves no row is refused with the earlier fit, posterior and event list unchanged.", "Every outcome equals the exact replay. The conjugate posterior is now resolved from the centred scatter of the pooled rows (shared state.conjugate_refresh), so an offset of 1e6 and a ramp whose raw Gram is conditioned near 1e16 no longer cost digits or a refusal; before, the same cases matched only to 1e-4 at 1e4, were refused or matched to 1e-3 at 1e6, and the ramp mean and rate to 1e-3 and 5e-2."]
