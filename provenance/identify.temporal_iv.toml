implementation_deviations = [
  "Applies the existing singleton static IV graphical checks to an adaptively grown finite unfolding of a stationary temporal DAG. A lag alone proves neither exclusion nor exogeneity; graph connection is not a numerical instrument-strength certificate.",
  "The repository-specific window algorithm grows until the treatment, outcome and candidate ancestry no longer reaches the truncated boundary. Unbounded ancestry or an exhausted growth cap remains uncertified, rather than being identified from a truncated graph.",
  "Only a pulse or one-step sustained query is supported. The Wald estimand inherits the static identifier's parametric/homogeneity or corresponding local-effect restrictions; the static citation does not prove the temporal unfolding construction.",
]

