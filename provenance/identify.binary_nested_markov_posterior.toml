implementation_deviations = [
  "Selected four-binary-variable Verma ADMG, one observational sixteen-cell positive integer IID multinomial table, each count at most1e9. Original checked general-ID/interior MLE artifact is a delivery prerequisite, not a mathematical requirement for existence of every proper posterior. The posterior uses raw counts and proper prior, never an MLE/Fisher approximation or ten-dimensional binary-latent DAG substitute.",
  "Proper product Beta kernels on the original eleven Mobius coordinates, restricted to the strictly positive feasible c-factor polytope, shapes1..1e6. Association coordinates are not independently normalized conditional-width priors. Three singleton coordinates use exact conjugacy; eight coupled coordinates use bounded full-feasible-bracket slice shrinkage. Numeric boundary, proposal budget, cancellation and nonconvergence refuse; failed chains/draws are never silently dropped.",
  "Four-eight dispersed seeded SplitMix64 chains, fixed modern rank/folded splitRhat<=1.01 and bulk/tailESS>=400 on all eleven parameters and three effect outputs. Only95% credible mass is implemented. Existing tailESS uses5/95 quantiles and does not certify precision of2.5/97.5 interval endpoints. Diagnostic gates do not prove convergence or correct causal/model assumptions.",
  "Independent deterministic quadrature integrates association coordinates with polynomial-exact conditional quadrature and four-dimensional margins at two integration orders, plus analytic singleton Beta moments. Tests compare all fourteen means, full196entry covariance, credible quantiles and actual raw-prior sensitivity. These checks are numerical evidence, not repeated-sampling calibration.",
