implementation_deviations = [
  "Independent construction of the explicitly declared finite-lag Gaussian panel family; no external implementation or claimed replication of a published complete procedure.",
  "An arbitrary finite channel axis and sparse named portable ValueExpr features reuse the existing NodeProgram compiler and executor. Feature inputs are explicitly carryover-adjusted and Michaelis-Menten saturated. No automatic powerset or new expression language.",
  "Gaussian random intercepts are analytically integrated into the stationary AR(1) likelihood using its precision and a rank-one update. Groups are independent; each retained group's serial outcomes are not treated as independent rows.",
  "Frequentist fitting uses the existing limited-memory inverse-curvature optimizer. Numerical derivatives and group scores produce a possibly rank-deficient rectangular group-cluster sandwich factor. Local Gaussian coefficient realizations plus conditional random-intercept uncertainty are an uncalibrated approximation, not posterior draws or a licensed interval.",
  "The distinct frequentist_bootstrap inference policy simulates complete hierarchical Gaussian/AR panels and repeats the original initialization and likelihood optimizer; temporal fitting repeats its original change/smoothing selection. Each retained mechanism is shared across all decomposition hybrids. Failed or unconverged static refits remain failed slots. This model-based bootstrap grants no release calibration license. Historical local-Gaussian inference remains separately decoded with its original identity.",
  "Bayesian inference uses the existing Metropolis engine with the declared proper priors, transformed-coordinate Jacobians, chain diagnostics and conditional random-intercept draws. Every whole-program response shares one parameter and group-effect realization across worlds. Failed slots remain failed.",
  "The static L=0 reduction fixes rho and lag weights; L=2 retains both carryover and serial dependence. Prespecified piecewise and smooth mean-parameter attempts reuse the same likelihood; change location, smoothing and model selection uncertainty remain explicit and do not identify a causal decomposition.",
  "Observational identification of a multi-period joint intervention through general ID is refused, not wired: the request carries only a graph family tag, not an accepted point graph over the unrolled per-period channel, context and outcome variables; the continuous Gaussian/AR panel is a fitted mechanism, so a finite fitted response is not the general-ID functional of the observed law; and the static source binding refuses temporal programs. It becomes available with an accepted unrolled graph whose general-ID proof has a functional that the executed program reproduces; whole-program randomization remains the only earned design.",
  "Production consumers are the existing prepared causal compiler. Same-target observational admission and whole-program randomized identification are separate attempts. Finite predictions never establish identification, transport permission, selected-decision reliability or calibration.",
  "Independent artifacts replay evaluation under a stored frozen fitted law; they do not attest that the stored fit or draws were generated from the encoded data. Current scientific consumption requires the caller's current full compiled request and frozen-law identity.",
  "Four-block reference decomposition evaluates every hybrid with the same compiled panel response semantics, paired mechanism/path realizations and explicit population/time weights. Exact Shapley averaging covers all 24 orders; order sensitivity is separate from statistical uncertainty. The checked facade inherits authentic exact-world identification for unchanged mechanism/population worlds, records missing transport obligations per hybrid, and executes an actual coarser contrast on finer refusal. Joint four-component covariances preserve the retained law dependence; neither this projection nor its moments supply unidentified mechanism/population transport or a calibration license.",
  "A separate authentic scientific-source adapter validates every binary component hybrid in the actual static/scheduled/structural intervention language. Design-native frequentist covariance propagates through exact linear Shapley/sequential maps; actual posterior law draws and any importance weights remain aligned.",
  "Population standardization uses an explicit selection diagram: selection confined to an exogenous baseline root with no bidirected neighbor implies source intervention/conditioning equivalence and invariant non-baseline response mechanisms. The retained functional mixes actual identified stratum responses with caller-supplied known target probabilities. Unsupported selection at the response or latent baseline confounding refuses rather than becoming a support flag.",
  "Version-one reference artifacts retain the original complete design, component and population recipes, actual selection graph, scope and numeric digest; independent historical replay returns no current-authorizing source, and current consumption checks the caller-retained data/proof and requested recipe/diagram/scope.",
]
