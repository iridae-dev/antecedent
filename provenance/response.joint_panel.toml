implementation_deviations = [
  "Independent construction of the explicitly declared finite-lag Gaussian panel family; no external implementation or claimed replication of a published complete procedure.",
  "An arbitrary finite channel axis and sparse named portable ValueExpr features reuse the existing NodeProgram compiler and executor. Feature inputs are explicitly carryover-adjusted and Michaelis-Menten saturated. No automatic powerset or new expression language.",
  "Gaussian random intercepts are analytically integrated into the stationary AR(1) likelihood using its precision and a rank-one update. Groups are independent; each retained group's serial outcomes are not treated as independent rows.",
  "Frequentist fitting uses the existing limited-memory inverse-curvature optimizer. Numerical derivatives and group scores produce a possibly rank-deficient rectangular group-cluster sandwich factor. Local Gaussian coefficient realizations plus conditional random-intercept uncertainty are an uncalibrated approximation, not posterior draws or a licensed interval.",
  "Bayesian inference uses the existing Metropolis engine with the declared proper priors, transformed-coordinate Jacobians, chain diagnostics and conditional random-intercept draws. Every whole-program response shares one parameter and group-effect realization across worlds. Failed slots remain failed.",
  "The static L=0 reduction fixes rho and lag weights; L=2 retains both carryover and serial dependence. Prespecified piecewise and smooth mean-parameter attempts reuse the same likelihood; change location, smoothing and model selection uncertainty remain explicit and do not identify a causal decomposition.",
  "Production consumers are the existing prepared causal compiler. Same-target observational admission and whole-program randomized identification are separate attempts. Finite predictions never establish identification, transport permission, selected-decision reliability or calibration.",
  "Independent artifacts replay evaluation under a stored frozen fitted law; they do not attest that the stored fit or draws were generated from the encoded data. Current scientific consumption requires the caller's current full compiled request and frozen-law identity.",
]
