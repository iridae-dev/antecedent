kind = "derivation"
rationale = "Numerical Monte Carlo interval of a utility estimate: Wald interval for a mean, Wilson (1927) score interval for a probability at the effective sample size, Bonferroni widening for simultaneous requests."
no_independent_algorithm = "Closed-form textbook arithmetic: estimate +/- z*se, the Wilson score interval for a binomial proportion at n_eff, and the Bonferroni critical value z_{1-alpha/(2m)}."
covered_by = ["decision_reliability.derived_uncertainty"]
derivation = "Wald: estimate +/- z_{1-alpha/2} se with n_eff >= 30. Wilson (1927): centre (p + z^2/(2n))/(1 + z^2/n), half-width z sqrt(p(1-p)/n + z^2/(4n^2))/(1 + z^2/n) at n = n_eff. Simultaneity over m intervals replaces alpha by alpha/m (Bonferroni)."
