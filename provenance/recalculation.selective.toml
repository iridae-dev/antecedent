kind = "contract"
rationale = "The stage model and planner that decide per stage whether an artifact is reused, recomputed or refused from BLAKE3 stage identities, plus one instrumented route (cross-fitted AIPW) that proves reuse by counts."
no_independent_algorithm = "recalc.rs and recalc/standing.rs compare identity sets and statuses (no floating-point computation); the route in recalc_receipt.rs calls the AIPW estimator and the retarget and keeps the integer fit counts. The only arithmetic besides delegated estimator calls is the shared decision net benefit benefit_per_unit * ate - cost (one fused multiply-add) in recalc_receipt.rs."
