# Selective recalculation on the cell-saturated AIPW route with counted fits, and portable resume
# from a frozen-score artifact: a session built only from serialized scores that can retarget them
# by row weights over the same row ids with zero fits and refuses everything needing data or a
# fit. The planner is provenance/c2_selective_recalculation.toml; the artifact container is
# provenance/c2_recalc_receipt_artifact.toml in style. papers = [] is an explicit judgment: this is
# instrumentation, caching discipline, serialization and identity binding (original engineering)
# over the cell-saturated AIPW estimator and the cross-fitted AIPW score table, whose own
# citations live in estimate.cell.aipw and estimate.aipw. No paper introduces counting fits or
# resuming from frozen scores.
papers = []

implementation_deviations = [
  "Claim policy: the licensed claim is the counted work (fits, identifications, score builds, reweights, decisions) and the point law and net benefit of the existing AIPW routes. The law standard error is a reported diagnostic with calibration 'unmeasured'; no interval and no coverage record are produced.",
  "The fit counter is the estimator's own additive thread-local instrument (antecedent_estimate::cell_aipw::count_cell_model_fits): it counts every multinomial propensity and per-cell outcome regression that actually completed, so a zero is measured rather than asserted by the wrapper. A first run on two binary treatments is 5 folds x (1 propensity + 4 cell regressions) = 25 fits. The instrument is thread-local and counts only fits run on the calling thread inside the measured closure.",
  "Resume is limited to ONE operation: retarget the frozen scores by row weights over the SAME row ids and recompute the law and decision with zero fits. A changed outcome, folds, graph, adjustment, row design, data snapshot or new rows are refused with the planner's Unavailable for the data (recalc.unavailable_data) before any work and leave the session unchanged. A requested data snapshot that differs from the frozen one makes the score artifact Unavailable rather than reused (a fix to the core planner).",
  "ResumeContext cannot express 'scores bound, data absent'. A fresh process holding portable scores is therefore planned under portable_scores = true and supplied_data = true, where supplied_data stands for the artifact-bound snapshot IDENTITY (the data content is never read); a request is executable only when the planner reuses the score artifact, and every other request is refused with the plan made under supplied_data = false. This is a workaround stated here, not a claim that the data was supplied.",
  "A resumed receipt is a verified in-process record, not a sealed artifact: the recalc_receipt_v1 format refuses a derived stage stored as reused under a fresh-process boundary, so a ResumeReceipt cannot be exported through it.",
  "Identification is recomputed in a fresh process (the planner never reuses a derived stage there): the declared-adjustment descendant screen runs over the requested graph and is counted once. The retarget licence, the declared adjustment set and the declared inputs are caller declarations, recorded and never verified here.",
  "The frozen_scores_v1 artifact carries scores, stage digests and identities and no data and no model; a consumer recomputes the fit identity from the stored stage digests, requires the stored snapshot digest to be the declared one and recomputes the artifact identity. A consumer holding no retained identity checks only internal consistency, so a consistently resealed artifact of another run passes under its own identity.",
]

