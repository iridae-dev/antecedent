# A two-sample Wald comparison of the linear conditional mechanism of one node given its parents
# between an independent source sample and an independent target sample: OLS fits from sufficient
# statistics (X'X, X'y, y'y), the quadratic form W = d' (V_s + V_t)^-1 d referred to chi-square,
# per-coefficient z statistics with a Holm step-down adjustment, and minimal detectable
# differences (z_{1-alpha/2} + z_{power}) se. The quadratic-form test is Wald's; the
# two-sample comparison of regression coefficients through the summed covariance of independent
# fits is textbook material with no single primary paper, so only the two procedures that are
# named precisely are cited. Everything around them (comparability contract, refusal of shared
# units, the artifact and its recomputing consumer) is original engineering.
papers = [
  { title = "Tests of statistical hypotheses concerning several parameters when the number of observations is large", sections = ["Wald statistic for a general hypothesis on several parameters: the quadratic form of the estimator deviation in the inverse covariance, with its chi-square limit"] },
  { title = "A simple sequentially rejective multiple test procedure", sections = ["Holm's step-down procedure: the adjusted p-values reported per compared coefficient"] },
]

implementation_deviations = [
  "Claim policy: the statistic, degrees of freedom, p-values, Holm-adjusted p-values, standard errors and minimal detectable differences are diagnostics labelled calibration 'unmeasured' (inference claim asymptotic_wald_calibration_unmeasured). Wald's chi-square limit is asymptotic and is not checked for size or power at finite samples here; no interval, coverage or invariance support is granted.",
  "Non-rejection never certifies invariance: non_rejection_certifies_invariance is false on every result, and the minimal detectable differences are attached so a non-rejection reads as 'differences smaller than these were not detectable'. The minimal detectable difference is the closed-form two-sided single-coefficient normal value at the observed standard error, with no multiplicity adjustment.",
  "The covariance of the coefficient difference is the SUM of the two OLS covariance matrices sigma^2 (X'X)^-1, which is valid only for independent samples; declared shared units or an unknown dependence refuse (mechanism_discrepancy.dependence_unknown) rather than being corrected.",
  "The mechanism is a linear conditional mean with homoscedastic Gaussian-theory standard errors: a shift in a nonlinear or higher-moment feature of the mechanism may go undetected, and heteroscedasticity-robust covariances are not offered. The test informs only a selection node on the node itself.",
  "Comparability is declared, never inferred: both samples must declare the same node, parent set, units and protocol id, and a blank unit or id refuses (mechanism_discrepancy.incomparable_measurements). Parent order is irrelevant to the test.",
  "Holm is applied over the compared coefficients only (the intercept is included only when its comparison is declared); a population that fits its mechanism exactly, a rank-deficient design or fewer than two residual degrees of freedom refuse.",
  "The mechanism_discrepancy_v1 artifact embeds the summary statistics X'X, X'y and y'y of each population and the consumer recomputes the result from them; the expected identity is retained out of band, so a consumer without a retained identity checks only internal consistency and replay.",
]

upstream_implementations_observed = []

test_sources = [
  "hand-derived one-parent (x = [0,1,2,3], y_s = [1,3,2,4]) and two-parent (vector-treatment frozen data) OLS fits with df 1 and df 2 closed-form statistics",
  "crates/antecedent-estimate/tests/mechanism_discrepancy.rs",
  "crates/antecedent-estimate/tests/mechanism_discrepancy_reference.rs (exact rational fits, 50-digit chi-square tail, Holm and detectable differences)",
  "crates/antecedent-io/tests/mechanism_discrepancy_artifact.rs",
  "python/tests/test_mechanism_discrepancy.py",
]

[method_review]
status = "reviewed_with_limits"
scope = "test_mechanism_discrepancy and test_mechanism_discrepancy_from_summaries in crates/antecedent-estimate/src/mechanism_discrepancy.rs, from raw populations through the sufficient statistics X'X, X'y, y'y: the Cholesky OLS fit of each population, its covariance sigma^2 (X'X)^-1 with sigma^2 = RSS / (n - p), the Wald statistic d' (V_s + V_t)^-1 d over the compared coefficients with its chi-square tail, the per-coefficient standard error, z, normal p-value and Holm adjustment, and the minimal detectable differences (z_{1-alpha/2} + z_power) se with the shared normal quantile. Not the comparability and dependence refusals, the artifact and its recomputing consumer (antecedent-io), the posterior-mean consumers of the summaries, or the finite-sample size and power of the Wald test (declared not measured)."
assumptions = ["Independent samples, a correctly specified homoscedastic linear conditional mean and Gaussian-theory standard errors; the review checks the arithmetic on data that satisfy none of these claims and does not examine them.", "Observations are on a binary grid so the sufficient statistics are exact in doubles; the reference then equals exact least squares on the same numbers.", "The Holm adjustment is the standard step-down with a running maximum and a cap at one, applied over the compared coefficients only."]
historical_exposure = "Historical author exposure cannot be independently established. This review read the product source named in its scope and wrote its own reference from the stated definitions; no upstream implementation was consulted. The cited Wald and Holm papers were not retrieved for this review (nothing downloaded, no local copy); the record's description of them rests on the code and the existing record."
redistribution = "The reference script and frozen output are repository-authored under MIT OR Apache-2.0; mpmath is not a product dependency."
limitations = "Thirty seeded designs of one to three parents (5 to 33 rows per population, intercept compared or not, alpha 0.2, 0.05 and 0.01, power 0.5, 0.8 and 0.9) compare the coefficients to 1e-11, the Wald statistic to 1e-10, its chi-square tail to 1e-8 relative, and the per-coefficient standard error, z, p, Holm-adjusted p and minimal detectable difference to 1e-8 to 1e-10 relative. Five response offsets (0 to 3e6 against a spread of 1.5, twelve rows per population) show the limit of the portable summary: up to 1e3 the statistic and slope standard error agree to 1e-8, at 1e5 to about 1e-6 relative, and at 1e6 and above the residual sum of squares falls below the 1e-12 exact-fit threshold relative to y'y and the diagnostic refuses as degenerate_covariance. That is a loss of information in X'X, X'y and y'y held in doubles (the sums of squares of the raw response), not an arithmetic slip in the fit, and a centred summary would be a change of the artifact format, which was not made. Heteroscedastic and non-Gaussian errors, the finite-sample size of the Wald test and the coverage of the detectable-difference statement are not examined. The reference script is not run in a locked environment: its output is frozen in the JSON file."
sources = ["https://mpmath.org/doc/1.3.0/"]
findings_resolved = ["The coefficients, residual variances, summed covariance, Wald statistic and chi-square tail, standard errors, z, unadjusted and Holm-adjusted p-values and minimal detectable differences equal the rational and 50-digit reference on all thirty designs, with and without the intercept in the compared set.", "Documented limit, not repaired: a response with a mean far above its spread (offset 1e5 and above for a spread near one) loses digits in the raw sums of squares and, from 1e6, is refused as an exact fit; the refusal is conservative (no wrong number is returned)."]
