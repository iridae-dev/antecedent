[non_algorithm_review]
status = "justified_non_algorithm"
kind = "derivation"
rationale = "Posterior mean of the joint treatment coefficients under independent normal priors with the OLS residual variance plugged in; no interval."
no_independent_algorithm = "full_coefficient_posterior_mean (vector_treatment.rs) forms (X'X + (sigma2/tau^2) D)^-1 X'y with D the identity on non-intercept columns and inverts it; this is the closed-form conjugate normal posterior mean, not a new procedure. Only that function and the refusal wrappers in posterior_mean.rs were mapped: vector_treatment.rs also holds the frequentist joint fit (square roots, Cholesky) and posterior_mean.rs the Gaussian-kernel local-quadratic route, which belong to other records."
covered_by = ["prob.conjugate_gaussian", "stats.regularized"]
derivation = "Normal likelihood with variance sigma2 (plug-in rss/(n-p)) and independent N(0, tau^2) priors on non-intercept coefficients (intercept unpenalized) give posterior mean (X'X + (sigma2/tau^2) D)^-1 X'y, the ridge normal equations; verified against full_coefficient_posterior_mean."
