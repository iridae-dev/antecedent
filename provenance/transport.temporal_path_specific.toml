  "The exact and sampled routes subtract two probabilities that the finite identifier derived for the active and baseline edge-intervention worlds on the same regime laws; the contrast is exact for the supplied finite laws and the identification result is that of counterfactual.transport_general, so no theorem is inherited from a path-specific identification paper for graphs beyond what the identifier proves.",
