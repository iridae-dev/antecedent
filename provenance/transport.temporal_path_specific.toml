# Time-ordered path-specific transport (crates/antecedent/src/analysis/temporal_path_transport.rs):
# a time check of an unrolled finite graph, two edge-intervention worlds, and, for the exact and
# sampled routes, the identification and evaluation of the finite counterfactual transport of
# provenance/counterfactual.transport_general.toml on each world; the continuous chain is a
# restricted linear sequential model with a paired bootstrap. The static transported
# path-specific route (counterfactual.transported_path_specific) is a closed gate and is not
# this route. papers = [] is an explicit judgment: path-specific effects and selection-diagram
# transportability (Pearl 2001; Avin, Shpitser and Pearl 2005; Bareinboim and Pearl 2014) motivate
# the question, the identification itself is the engine of counterfactual.transport_general, and
# no publication was retrieved in this review.
