implementation_deviations = [
 "Within-variance uncertainty is a distribution-free ratio-of-means linearization, not the normal-theory chi-square interval.",
 "Between-variance may be negative and is reported raw; ICC is NaN when between+within is not positive.",
 "No interval; coverage is unmeasured.",
]

