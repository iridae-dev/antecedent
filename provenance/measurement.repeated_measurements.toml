 { title = "Variance Components", citation_note = "Previously recorded title and bibliographic detail: Variance Components (Searle, Casella and McCulloch 1992)", doi = "10.1002/9780470316856", sections = ["Ch. 3 One-way classification, unbalanced data"] },
