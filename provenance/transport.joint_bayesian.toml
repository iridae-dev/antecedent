  "Derived in-repo from the conjugate Gaussian algebra; not the reproduction of a published procedure, so no guarantee is inherited from any paper.",
  "The noise variance of every source is declared and treated as known; the unknown-variance (Normal-inverse-gamma or Student-t) case is not modeled, so a credible interval from this engine would not account for estimating sigma^2.",
  "The posterior is exact and Gaussian with iid draws; there is no MCMC or other numerical approximation (the effective-sample-size field equals the draw count and exists for a future numerical path).",
  "The model is a linear outcome mechanism with treatment-covariate interactions and an optional population-varying block that never interacts with treatment; a varying treatment effect is structurally impossible to declare. Nonlinear or non-Gaussian outcomes are outside the cell.",
  "Overlap is checked against estimated nearest-neighbour source support, not a density-ratio bound.",
  "Sources must be independent samples with disjoint units; dependent or unknown sampling refuses. Prior mass never changes structural identification, which is the supplied certificate.",
