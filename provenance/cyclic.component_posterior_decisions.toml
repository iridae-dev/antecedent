rationale = "Component wrapper over the posterior action-world decision of cyclic.action_world_decisions: it checks declared ports and coefficients, lowers the connected components to one cyclic system, supplies the common training schedule and output coordinates, and for the bounded route transforms the fitted draws before the decision. The scoped review compared the shared compiled-plan accessor and the split bounded-component fixture. The forward check still matches each bounded draw to the logistic transform of the same joint fitted draw. A separate assertion reopens the artifact and exercises altered evidence. The fixture split and inspection delegation do not change fitting, solving or evaluation."
