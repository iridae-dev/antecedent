# Equal-probability-quantile discretization of a composed linear-Gaussian model into a finite
# structural model with a computed error bound for the mean of each variable and for a linear
# contrast of means. Quantile cells, cell conditional means (phi differences) and the recursion
# bounding |err_v| by e_v + sum |b_vp| |err_p| are elementary; no primary paper.
