[non_algorithm_review]
status = "justified_non_algorithm"
kind = "wrapper"
rationale = "Shared-plan retention over the checked DML-AIPW and DR-Learner estimators: frozen scores, same-row reweighting and point CATE prediction without refitting."
no_independent_algorithm = "recalc_dr.rs counts resolved fits, retains the estimator's scores and calls the existing retarget and prediction primitives; the only arithmetic of its own is a min/max range check of row ids and the shared decision arithmetic. The only arithmetic besides delegated estimator calls is the shared decision net benefit benefit_per_unit * ate - cost (one fused multiply-add) in recalc_receipt.rs."
