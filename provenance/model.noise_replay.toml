implementation_deviations = [
 "Replay evaluates a compiled structural model from a retained noise matrix; it is the evaluation step of the abduction-action-prediction construction, not a new estimator, so no estimation guarantee is claimed.",
 "Categorical noise abducted by a posterior draw carries the rank-preservation assumption of the counterfactual disclosures; replaying it does not identify a counterfactual for that node.",
 "Noise is drawn per node and row block from independent keyed streams, so a draw is reproducible per (seed, draw, node, block) but is not the stream the sequential forward sampler consumes.",
]

