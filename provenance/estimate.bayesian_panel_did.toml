# Strategy-table implementation id: estimate.bayesian_panel_did
# (EstimatorId::BayesianPanelDid, public name bayesian.panel_did).
#
# The cited papers supply the difference-in-differences estimands: the
# group-time (cohort-by-period) average effect on the treated against
# never-treated controls, and the covariate-conditional doubly robust form for
# the augmented design. The Bayesian layer on top of those estimands is the
# repository's own conjugate construction, not a procedure from either paper:
# a Gaussian outcome model `y | beta, sigma2 ~ N(X beta, sigma2 I)` with a
# Normal-Inverse-Gamma prior on the change-score (or per-arm) regression, whose
# marginal posterior of the group coefficient is a Student-t. The prior supplies
# no identifying premise; parallel untreated trends and no anticipation stay
# declared and are not tested.
papers = [
 { title = "Difference-in-differences with multiple time periods", doi = "10.1016/j.jeconom.2020.12.001", sections = ["group-time average treatment effects against never-treated controls", "post-adoption event-time aggregation"] },
 { title = "Doubly robust difference-in-differences estimators", doi = "10.1016/j.jeconom.2020.06.003", sections = ["covariate-conditional parallel trends and the augmented two-period estimand"] },
]

implementation_deviations = [
 "Posterior, not a design-based estimator: the point is the posterior mean (or median) of the same difference in outcome changes under a Gaussian Normal-Inverse-Gamma model, and the interval is an equal-tailed credible interval. It is neither the cluster-robust CR1 interval of the frequentist row nor the paper's inference.",
 "Units are modelled as independent. A cluster that holds more than one unit is refused rather than silently treated as independent; there is no hierarchical or cluster-level likelihood.",
 "The augmented form fits per-arm Gaussian regressions on the supplied covariates and forms the two-arm contrast; it is a model-based outcome-regression posterior, not the doubly robust estimator analysed in the paper, and no propensity model is used.",
 "Event-time contrasts are pointwise marginal posteriors that share the never-treated subjects; nothing is claimed simultaneously across the curve, and pre-adoption leads are descriptive posteriors, not a test of parallel trends.",
 "Prior scale and the Inverse-Gamma variance prior are caller-declared with a diffuse default; no prior sensitivity or calibration of the credible interval is claimed.",
 "The route is explicitly unlicensed and uncalibrated: no coverage record covers the credible interval.",
]

upstream_implementations_observed = []

test_sources = [
 "crates/antecedent-estimate/src/bayesian_panel_did/tests.rs (cross_section_posterior_matches_the_analytic_normal_inverse_gamma_posterior, panel_posterior_matches_the_analytic_change_score_posterior, augmented_posterior_matches_the_analytic_two_arm_regression_posterior, dependent_units_and_thin_designs_are_refused_with_the_next_attempt, invalid_priors_and_non_finite_outcomes_are_refused)",
 "crates/antecedent/tests/bayesian_design_routes.rs (panel_did_posterior_matches_the_closed_form_and_keeps_premises_declared, panel_did_refuses_shared_clusters_and_foreign_backends_with_next_attempts)",
 "python/tests/test_bayesian_design_routes.py (test_bayesian_panel_did_matches_the_closed_form_and_stays_unlicensed)",
 "closed-form Normal-Inverse-Gamma posterior computed by counting and sums of squares inside the tests, independent of the library",
 "crates/antecedent-estimate/tests/bayesian_panel_did_reference.rs (40-digit Student-t references for the cross-section, change-score and augmented forms under a diffuse and an informative prior; the augmented difference of two independent t variables by numerical convolution)",
]

[method_review]
status = "reviewed_with_limits"
scope = "fit_bayesian_cross_section_did, fit_bayesian_panel_did and fit_bayesian_augmented_panel_did of crates/antecedent-estimate/src/bayesian_panel_did.rs with the fit_nig wrapper over antecedent-prob's fit_conjugate_gaussian (the conjugate kernel itself is reviewed under prob.conjugate_gaussian, which this record relies on for the Student-t sampler): the design columns (1, G, Post, G*Post for the 2x2 cross-section, the interaction being the effect; 1, G on the change score post - pre for the panel; per-arm 1 and covariates on the change score for the augmented form), the cell-support and one-unit-per-cluster refusals, the Normal-Inverse-Gamma posterior of the effect, and for the augmented form the treated-arm regression at the treated covariate mean minus the comparison-arm regression at the same mean as a difference of independent draws. Route-specific content: which coefficient is the effect, that the augmented effect uses two independent arm fits with independent seeds, the draw summaries (mean, sd, equal-tailed 95% interval). Not the doubly robust propensity estimator of the augmented-ATT paper (estimate.augmented_panel_did), the staggered event-study contrasts (estimate.bayesian_staggered_event_study), parallel-trends plausibility or coverage of the credible intervals."
assumptions = ["Gaussian errors with one common variance within each fit, independent units, parallel untreated trends (conditional on the supplied covariates for the augmented form) and no anticipation are declared premises the prior does not supply.", "The prior is b | s2 ~ N(0, s2 c^2 I) with s2 ~ InvGamma(a0, b0) so every coefficient has an exact Student-t marginal with 2(a0 + n/2) degrees of freedom; the augmented effect is the difference of two independent Student-t variables.", "Accuracy is stated against exact 40-digit posterior summaries; the sampler is compared at Monte Carlo tolerances."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the product source named in its scope, including the numerical helpers it calls, and compared results with 40-digit exact Normal-Inverse-Gamma references (Student-t marginals; numerical convolution for the augmented contrast) written for this review; no upstream implementation or test source was consulted or copied. The cited publications were not retrieved in this review: the correspondence is between the product code and the standard definitions those works state, verified numerically, not a page-level reading of the papers."
redistribution = "Primary works are cited, not redistributed. The reference script and its frozen output are repository-authored (MIT OR Apache-2.0); mpmath is used only to produce the frozen values and is not a product dependency. The script declares its inline script metadata but is not run in a locked, isolated environment and is not wired into any gate; its output is frozen in the JSON file and compared by the test."
limitations = "Two priors (diffuse 100/1e-3/1e-3 and informative 0.8/3/2) on one 24-row cross-section, one 24-subject panel and the same panel with two covariates, 300,000 draws at one seed. The sampler mean is within five Monte Carlo standard errors, the sd within 2% and the interval ends within 3% of the exact sd of the reference. These are statistical agreements at one seed, not exact equality. The informative-prior case pins that the declared scale reaches the posterior (the diffuse and informative means differ by more than 0.05). Not exercised: unbalanced arms near the support limits, many covariates, heavy-tailed outcomes, or coverage of the credible interval (the route is unlicensed and uncalibrated). The convolution quantile of the augmented reference is accurate to about 1e-20.  The cited publications were not retrieved."
sources = ["https://doi.org/10.1016/j.jeconom.2020.12.001", "https://doi.org/10.1016/j.jeconom.2020.06.003", "https://mpmath.org/doc/1.3.0/"]
findings_resolved = ["No defect was found: the design columns, the interaction/arm-coefficient choice, the treated-covariate-mean evaluation and the independence of the two arm fits agree with the exact posterior under both priors.", "The record lacked an executing high-precision reference for the augmented difference of two arm posteriors; the exact mean, sd and convolution interval now bound the sampler."]
