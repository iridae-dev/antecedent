implementation_deviations = [
 "Uses fixed-length leapfrog trajectories with one scalar mass for every dimension; NUTS trajectory construction and mass-matrix adaptation are not implemented.",
 "Dual averaging differs from NUTS Algorithms 5 and 6: mu is log(initial_step_size) rather than log(10 * initial_step_size), and step size is hard-clamped to [1e-6, 0.5].",
 "The first retained transition is generated with the final unsmoothed warmup step size; the averaged step size is finalized only after that transition.",
 "Divergence detection uses a fixed absolute Hamiltonian-error threshold of 1000 and publication requires zero post-warmup divergences.",
]

