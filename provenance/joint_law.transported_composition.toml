[method_review]
status = "reviewed_with_limits"
scope = "paired_moments and correlation_range_envelope in crates/antecedent-stats/src/joint_law.rs: the population moments of two aligned draw columns (means, variances, covariance) that a transported composition reads when the rows are realizations of one joint law, and the ranges of E[XY], Cov(X, Y) and Var(aX + bY) over a declared correlation range, linear in the correlation so exact at the endpoints. These are the two numeric routes of the module that no other joint-law record names; the linear-moment, mixture, aligned-functional, envelope, spread, exceedance and interval routes are reviewed under joint_law.linear_moment_propagation, joint_law.known_weight_mixture, joint_law.aligned_nonlinear_functional, joint_law.dependence_envelope, joint_law.composed_spread_and_exceedance and joint_law.composed_interval. The dispatch of which composition needs which dependence information (crates/antecedent-contract/src/joint_law_rule.rs) is a contract with no numerics of its own and is not reviewed as a method."
assumptions = ["The caller has established that the aligned rows are realizations of one joint law (an alignment identity), and the declared correlation range is an assumption about the dependence, not something the data establish.", "Population (divide by n) moments, not sample moments."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the product source named in its scope, including the numerical helpers it calls, and compared results with definitions evaluated by executing references written for this review; no upstream implementation or test source was consulted or copied, and no primary paper is claimed for this record."
redistribution = "Primary work is cited, not redistributed. The reference scripts and their frozen outputs are repository-authored (MIT OR Apache-2.0) and use only the Python standard library. The scripts declare their inline script metadata but are not run in a locked, isolated environment and are not wired into any gate; their output is frozen in the JSON files and compared by the tests."
limitations = "No primary paper is claimed: the record's papers list is empty by judgment (delta method, law of total variance and moments under a joint law are textbook identities). Nine paired-column cases agree with exact Fractions on dyadic inputs at 1e-12 relative (1 to 64 rows; offsets of 2^30 and 2^25 where a one-pass variance would lose every digit; constant, identical and perfectly anti-correlated columns), and seven correlation ranges agree (positive, negative and zero weights; a zero standard deviation; ranges touching -1 and 1; means of 2^20; a range 1/1024 wide); the refusals of a single or reversed correlation, a range outside [-1, 1], a negative or non-finite moment, and of empty, unequal or non-finite columns are executed. The range is not intersected with the correlations the marginals can attain (the module states this), so a declared range wider than the attainable one is returned as declared. The nonlinear, mixture and envelope routes are not reviewed here. The composition-dispatch contract is checked by its own inline and facade tests, which this record lists, not by a frozen reference."
sources = ["https://docs.python.org/3/library/fractions.html", "https://docs.python.org/3/library/decimal.html"]
findings_resolved = ["No defect found: paired moments and the endpoint ranges agree with exact rational values, including at offsets where cancellation would destroy a one-pass formula."]
