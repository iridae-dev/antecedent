[method_review]
status = "reviewed_with_limits"
scope = "rank / rank_validated and the helpers rank_tables and top_share in crates/antecedent-design/src/decision_reliability/ranking.rs, with series_stats (iid sample variance, self-normalized weighted error with Kish effective size, non-overlapping batch means with its effective size) in mc_error.rs as used for each statement: tie-shared probability of being best, of being in the top k, of beating a baseline (ties one half), and each candidate's expected utility with its Monte Carlo error. Not carrier validation, the propagation rule's pairing licence, the interval or selection-aware layers, or calibration."
assumptions = ["The candidates' draws are one shared simulation (index-paired), finite, and ties are exact equality; tied candidates split their probability equally, equivalent to a uniformly random order among ties.", "The weights are positive importance weights shared by every candidate; autocorrelated streams are unweighted and use floor(n/b) draws per batch.", "A statement is a Monte Carlo diagnostic under the supplied law over the candidates as supplied, uncalibrated."]
historical_exposure = "Historical author exposure cannot be independently established. This review read the product source named in its scope and wrote its own reference, which defines tie sharing by averaging over every random ordering rather than by counting strictly greater and tied candidates, and computes the errors from their definitions in exact rationals. No upstream implementation was consulted."
redistribution = "The reference script and its frozen output are repository-authored under MIT OR Apache-2.0; mpmath is used only to produce the frozen values and is not a product dependency. No cited paper is redistributed."
limitations = "No paper is cited by the record and none was retrieved. Tie sharing is verified against an independent definition (average over all m! candidate orderings with a stable sort) on six cases: five candidates with heavy ties and three top-k sizes, weighted draws with ties, all-tied draws, two batch layouts for an autocorrelated stream (square-root and a fixed count with leftover draws), and signed zeros. Errors are checked against exact rational definitions to 1e-12 relative. Candidate counts above five, thousands of draws, huge weight ratios and cancellation in the weighted error are not exercised, and the coverage of the batch-means or self-normalized errors is not examined: they remain uncalibrated diagnostics."
sources = ["https://mpmath.org/doc/1.3.0/"]
findings_resolved = ["No numerical defect was found: P(best), P(top k), P(better than baseline), the expected utility and each statement's standard error and effective size agree with exact enumeration; best probabilities sum to one at every case, including when all candidates tie at a draw and when -0.0 ties 0.0."]
