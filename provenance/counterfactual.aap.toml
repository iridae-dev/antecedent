[method_review]
status = "reviewed_with_limits"
scope = "CounterfactualEngine::abduct, predict and individual_treatment_effect in crates/antecedent-counterfactual/src/engine.rs for invertible additive-noise (linear-Gaussian) mechanisms and hard Set interventions: abduction of per-unit noise from fully observed factual rows, the overlay that overwrites intervened nodes and recomputes descendants from their own mechanisms with the retained noise, unit-row selection, and the per-unit contrast. Not a review of the categorical posterior-noise path (a single rank-preserving draw, disclosed in the record), of LGSSM and discrete mechanisms, of ZeroFill prior imputation of absent columns, of nested counterfactuals beyond their existing unit tests, or of the temporal rollout."
assumptions = ["Structural equations are invertible in their noise, with the model's coefficients as the truth (the review fixes them; fitting is not in scope).", "Abduction-action-prediction: the unit's noise is held fixed, the intervened nodes are set by the action, and every other node is recomputed from its parents in topological order.", "A unit-row selection reports counterfactuals on the selected rows and NaN elsewhere, in factual row coordinates."]
historical_exposure = "Historical author exposure cannot be independently established. This review read the product source and wrote a separate reference of its own from the definition; no upstream implementation or test source was consulted or copied."
redistribution = "The references are repository-authored under MIT OR Apache-2.0 and run inside the crates' own tests; the primary sources are linked by DOI and are not redistributed."
limitations = "Chapter 7 of the cited book was not re-read in this review (no downloads were made and no copy was read from this environment); the three-step procedure is the standard statement and a mistake in how it is stated would not be detected here. Only linear-Gaussian mechanisms with known coefficients were used; nonlinear additive-noise families share the inversion code path but were not compared with closed forms, and every non-invertible family keeps the single-draw limitation the record states. The ZeroFill branch (absent columns filled with prior noise) was not exercised, so its documented deviation is unreviewed. Calibration remains deferred."
sources = ["https://doi.org/10.1017/CBO9780511803161"]
findings_resolved = ["On a five-world design (no intervention; do(x); do(m); do(x, m); do(w, x)) over 40 units and all four nodes, the engine equals the hand recursion to 1e-12, including that setting the mediator severs its cause and that an intervened root also moves its descendants.", "The empty world reproduces the observed rows; a row subset reports NaN off the subset in original row coordinates; and the per-unit treatment effect equals the closed-form total effect (direct plus indirect) for every unit under additive noise. No defect was found and no product code changed."]
