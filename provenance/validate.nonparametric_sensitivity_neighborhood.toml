implementation_deviations = [
 "Truncates the leave-one-out product-Gaussian Nadaraya-Watson sums of validate.confounding_sensitivity to the declared number of nearest other covariate points (default 256, at most 4096), found by exact k-d tree search, so the smoother is no longer the kernel regression estimator of the cited papers: it equals it only when the neighbours cover every row, and otherwise carries a bias toward a local neighbour average that the exact smoother does not have.",
 "Rows with identical covariates form one point carrying their count and sums, so discrete adjustment sets stay exact and ties never compete for neighbour slots by row order.",
 "The row cap of the exact path does not apply; the partial-R2 grid, orthogonalized simulated confounder (its own seeded stream), sign refusal and robustness value are those of validate.confounding_sensitivity, with the same repository-defined grid and pass threshold 0.1.",
]

