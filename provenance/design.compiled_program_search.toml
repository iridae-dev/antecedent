[method_review]
status = "reviewed_with_limits"
scope = "PreparedCertifiedSearch::compile, bounds and execute in crates/antecedent-design/src/program_search/certified.rs: outward-rounded interval enclosure of an expression (add, subtract, multiply, divide with a separated denominator, negate, min, max), best-bound subdivision of a bounded box with linear restrictions, the feasible incumbent, the retained global upper bound and the stop reason, taking the final bound as the minimum over the frontier, the monotone reductions, the separable bound and the concave dual bound when they apply. Checked as a black box through the global upper bound, the incumbent and the certificate stop. Not the panel compiler that derives the objective from a fitted response, the artifact reconstruction of certificates (certified/artifact.rs), the finite-set exhaustive search, the continuous coordinate poller, the max-t intervals, or the whole-procedure selection executor of the rest of this record."
assumptions = ["The objective is the compiled numerical expression; a certificate is a statement about that function on its box, not about a statistical or population optimum, and the product says so.", "Truth values come from dense scans with golden-section polish, which is accurate for objectives with one smooth or piecewise-smooth extremum per scan cell (true of every case); it is a numerical truth with a recorded error of at most 1e-9 for one control and 1e-5 for two, not an interval proof."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the certificate code named in its scope and compared its output with truth values computed without interval arithmetic by an executing reference written for this review (standard library only); no upstream implementation or test source was consulted or copied. The cited lecture slides on Lagrangian duality were not retrieved in this review (nothing downloaded): the dual bound is exercised only through the soundness of the final bound, not against the text."
redistribution = "The cited slides are linked, not redistributed. The reference script and its frozen output are repository-authored (MIT OR Apache-2.0); the script uses only the Python standard library. Its output is frozen in the JSON file and compared by the test."
limitations = "Twenty objectives (14 with one control, 6 with two) with budgets, signed boxes, a 1e8 offset under a 1e-2 variation, a box of width 1e-7, a fixed control, competing peaks under max and min, a kink at the optimum, ratios and bilinear and saddle forms are compared: the final global bound never falls below the true maximum, the incumbent is feasible, its enclosure contains the objective at the incumbent and is not above the true maximum, and every Certified stop leaves the true maximum within the requested gap. Only soundness and tightness at the stop are asserted: that the dual, separable or monotone bounds are actually engaged in a given case is not asserted, so their individual correctness is covered only where they would have to make the final bound unsound to be caught. No case has more than two controls, objectives deeper than a few operators, thousands of controls, a restriction with several rows; the SplitLimit stop is exercised by the module's own unit tests, not against a truth value here, and the ResolutionLimit stop has no test at all. Truth values for two controls carry 1e-5 error, so the tightness check there is within that. The whole-procedure statistical behaviour that the rest of the record describes is not reviewed and no coverage is claimed."
sources = ["https://stanford.edu/~boyd/cvxbook/bv_cvxslides.pdf"]
findings_resolved = ["No defect found in the bound: on all twenty objectives the final bound encloses the true maximum, the incumbent is feasible with a sound enclosure, and Certified stops are tight, including the competing-peak, kink, 1e8-offset, near-degenerate-box and binding-budget cases."]
