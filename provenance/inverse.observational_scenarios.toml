kind = "derivation"
rationale = "Observational scenarios compatible with an outcome: P(X in scenario | Y event) on a supplied joint law."
no_independent_algorithm = "Counting and weighting rows of a supplied law; no estimator."
derivation = "Bayes' rule on a finite law: P(X in S | Y in E) = P(X in S, Y in E) / P(Y in E), computed as a ratio of weighted row counts."
