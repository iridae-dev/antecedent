papers = [
 { title = "Measurement Error in Nonlinear Models", citation_note = "Previously recorded title and bibliographic detail: Measurement Error in Nonlinear Models: A Modern Perspective (2nd ed.)", doi = "10.1201/9781420010138", sections = ["Ch. 3 Linear regression and attenuation", "Ch. 4 Regression calibration"] },
]

implementation_deviations = [
 "Delta-method (sandwich) covariance over the stacked corrected score and the error-variance estimate; the book presents the sandwich as one of several variance routes and does not state this exact estimator.",
 "Linear outcome model with error-free covariates only; the book's nonlinear regression calibration and SIMEX are not implemented.",
 "No finite-sample correction (HC0 convention) and no interval; coverage is unmeasured.",
]

upstream_implementations_observed = []

test_sources = [
 "closed-form attenuation and misclassification algebra",
 "independently simulated seeded DGPs with known coefficients",
 "hand-computed one-way ANOVA and confusion-matrix inversion",
]

[method_review]
status = "reviewed_with_limits"
scope = "LinearMoments::accumulate and solve, LinearErrorData, ErrorVariance (declared, from the main sample's own replicates, from an independent replicate study, from a validation sample) and CorrectedLinear::linear_functional in crates/antecedent-stats/src/measurement_error.rs: the corrected normal equations (M - s2 kbar e_W e_W') beta = r for a regressor averaged over replicates, the implied reliability and its floor, the uncorrected fit, the HC0 covariance of the uncorrected fit, the sandwich covariance of the corrected fit given the error variance, and the covariance that adds the error-variance estimate's uncertainty (with the retained influence when the variance comes from the same replicates). Not a review of the estimator wrappers that route a table into these moments or of the binary and categorical corrections."
assumptions = ["Classical additive error with variance s2 independent of the latent regressor, the outcome and the covariates; a row that averages k replicates has error variance s2/k.", "The corrected coefficients are the solution of the moment equations with the error-variance shift, and the covariance is the delta-method sandwich over the stacked corrected score and the variance estimate, with no finite-sample correction.", "The reference derivative of the coefficients in the error variance is the numerical derivative of the solve, an independent route to the closed form A^-1 e_W beta_W kbar."]
historical_exposure = "Historical author exposure cannot be independently established. This review read the product source named in its scope and wrote a separate reference of its own from the stated definitions; no upstream implementation or test source was consulted or copied."
redistribution = "The reference script, its frozen output and the test are repository-authored under MIT OR Apache-2.0; mpmath is not a product dependency. The cited primary sources are linked, not redistributed."
limitations = "The book chapters were not re-read in this review (nothing downloaded, no local copy), so the regression-calibration and variance-component statements rest on the record and the code comments. The reference is one study of 150 rows with mixed replicate counts of one to three, one covariate and a coarse replicate study of 20 units with sizes one to five; the classical additive error model with a linear outcome, a single error-prone regressor and error-free covariates is the only case, and non-Gaussian errors, heteroscedastic errors and non-linear outcome models are not exercised. The estimate-variance part of the covariance is compared at 1e-7 because the reference differentiates the corrected solve numerically. Coverage of the resulting intervals is not measured here and no interval is claimed. Calibration remains deferred."
sources = ["https://doi.org/10.1201/9781420010138", "https://mpmath.org/doc/1.3.0/"]
findings_resolved = ["Coefficients, the uncorrected coefficients, the implied reliability, the covariance given the error variance, the full covariance with the estimate's uncertainty and the HC0 covariance of the uncorrected fit agree with the 60-digit reference to 1e-10 (1e-7 for the full covariance) for an error variance taken from the main sample's own replicates, from an independent replicate study, from a validation sample and declared; an error variance larger than the variance of the regressor given the covariates is refused. No defect was found and no product code changed."]
