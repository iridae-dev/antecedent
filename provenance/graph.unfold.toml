[non_algorithm_review]
status = "justified_non_algorithm"
kind = "derivation"
rationale = "Lazy bounded finite-window unfolding of a stationary lagged temporal DAG template into a static DAG, plus graph-review proposal artifacts."
no_independent_algorithm = "Edge replication over a window index; the module has no square root, logarithm, exponential, power or solve, and per-edge queries exist only as the test oracle of the replication."
derivation = "For a stationary template with lagged edges (u, lag l) -> v, the unfolded window [0, T) contains the edge (u, t-l) -> (v, t) for every t with t-l in the window; materialize replicates these edges and has_edge is the independent oracle."
