# Lazy/bounded finite-window unfolding of a stationary lagged TemporalDag template
# is original engineering (query-on-demand edge replication plus review-required
# proposal artifacts). It builds on the general stationary time-lagged causal
# graph representation used by PCMCI-style discovery (see
# discovery.pcmci.toml for the papers behind that representation), but the
# unfolding/materialisation algorithm itself is not drawn from a specific paper.
