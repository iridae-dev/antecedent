# No primary paper: A closed variant: no interval method is implemented, so there is nothing to cite.
papers = [
]
implementation_deviations = [
  "Intentionally implements no interval, posterior or coverage statement for a revalidated or composed claim, and no inheritance of a calibration record by a claim about another target. A calibration record that no longer holds at the claim's coordinate is carried as a calibration withdrawal on the claim (its interval is annotated, the point value stands); it is never refused and never silently kept.",
]
