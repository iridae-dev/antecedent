implementation_deviations = [
  "No numerical algorithm: the binding checks that a provider's declared coordinates, graph, meaning, evidence, assumptions and trust match an already identified contract, then carries the supplied values unchanged.",
  "Provider-declared uncertainty stays a declaration. The artifact grants no interval, calibration or native-estimation claim, and an exact-request verification covers only the contract it names.",
