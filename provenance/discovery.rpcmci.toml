implementation_crate = "antecedent-discovery"
source_translation = false
copied_code = false
copied_comments = false
copied_tests = false

papers = [
 { title = "Reconstructing regime-dependent causal relationships from observational time series", doi = "10.1063/5.0020538", sections = ["Sections III B–C and Algorithm 1"] },
]

implementation_deviations = [
 "New portable artifacts declare the continuous context-column schema used in ordinary numeric ingestion. Legacy framing preserves the original role-free schema and source identity when replayed.",
 "Known labels retain the reviewed per-regime PCMCI+ route. The optional learned route alternates masked PCMCI+ discovery and model-based hard assignment for one fully observed finite series.",
 "A versioned native unweighted partial-correlation route retains the complete source and canonical scalar execution law. Replay independently compiles and reproduces labels, temporal graph digests and stability. The acceptance consumer may explicitly select one verified regime.",
 "The learned route uses seeded contiguous and recurrent starts, a minimum duration, and a switch cost with hard-path dynamic programming. The published algorithm uses a persistence-constrained membership relaxation and PCMCI. The implemented count policy fixes a count or compares classification BIC for a common Gaussian residual variance by variable and fitted lagged coefficients by regime.",
 "Learned results report agreement across successful starts after optimal label permutation. This measures only sensitivity to initialization. It has no sampling or posterior coverage interpretation.",
 "Optional assignment refinement fits an intercept and all retained positive-lag parents for every variable under each regime, sums squared prediction errors standardized by each variable's variance, and chooses a hard label path by Viterbi with a caller-configured switch penalty. Intercept-only variables remain in the score; contemporaneous parents are excluded. This persistence penalty is implemented, but is not the paper's full regime-learning optimization or evidence of equivalence to it.",
 "Short regimes are skipped under a fixed minimum-length policy, and failed refinement retains the preceding labelled result.",
 "Per-regime discovery keeps a time point only when its whole lag window of 2 * max_lag + 1 consecutive rows carries that regime's label, so regime graphs are fit on masked effective windows of the full series rather than on spliced rows; labels refined from the same data add a post-selection diagnostic stating that the reported p-values are conditional on data-driven labels.",
]

upstream_implementations_observed = [
 { project = "tigramite", exposure = "black-box comparison only", notes = "RPCMCI import attempt failed on the earlier pin; fixed-label evidence compares independent per-regime PCMCI+ only" },
]

test_sources = [
 "crates/antecedent-discovery/src/rpcmci.rs unit tests",
 "crates/antecedent/tests/rpcmci_regime_learning.rs (simulation truth, graph recovery and compiled replay)",
 "python/tests/test_rpcmci_regime_learning.py (independent simulation, replay and short-count diagnostics)",
 "conformance/discovery/rpcmci_shared_portable.json (identical Rust and Python oracle series)",
 "crates/antecedent/src/analysis/rpcmci_portable.rs source schema tests and conformance/discovery/rpcmci_learned_v1.artifact (repository-produced v1 bytes, historical identity and versioned replay)",
 "crates/antecedent-discovery/src/rpcmci/learn.rs::duration_updates_match_independent_exhaustive_path_cost (brute-force cost reference under minimum duration)",
 "crates/antecedent-discovery/tests/rpcmci_fixed_regime_oracle.rs (fixed caller labels, alternating disabled, per-regime PCMCI+ skeleton equality)",
 "conformance/discovery/rpcmci_two_regime (library structure pin; external RPCMCI unavailable on the pinned version)",
 "conformance/discovery/rpcmci_fixed_regime_matrix (Tigramite PCMCI+ per fixed regime; not RPCMCI regime-inference parity)",
]

[method_review]
status = "reviewed_with_limits"
scope = "The fixed-label review covers masked per-regime PCMCI+ and its optional cost-based reassignment. The label-free review covers seeded starts, refitted linear lagged equations, hard minimum-duration path updates and stopping, the classification-BIC count rule, alignment of stability diagnostics, and verification of the selected graph and original lag windows after source replay."
assumptions = ["Within each regime the process is stationary, causally sufficient and (for the per-regime PCMCI+ tests) has CI-test assumptions of the chosen test; regime labels are either known to the caller or taken as the minimum-cost path under the refinement's fitted linear lagged models.", "Label refinement scores only linear lagged equations with each regime's retained positive-lag parents; nonlinear, contemporaneous or latent-driver regime differences do not enter the cost.", "A hard label path is chosen by minimum total cost; the switch penalty is a tuning constant in standardised-variance units, not an estimated persistence probability.", "Reported per-regime p-values are conditional on the labels; for refined labels they are not valid frequentist p-values (the code states this)."]
historical_exposure = "Historical author exposure cannot be independently established. The earlier record disclosed black-box tigramite comparison only, with the upstream RPCMCI unavailable on the pinned version; no upstream RPCMCI implementation or test source was consulted or copied in this review."
redistribution = "The exhaustive path-enumeration test is repository-authored under MIT OR Apache-2.0 and runs inside the crate's unit tests. The cited paper is linked by DOI, not redistributed. The version-1 compatibility bytes come from the repository producer and keep the historical layout and expected digest."
limitations = "Saggioro et al. use PCMCI with a persistence-constrained real-valued membership optimization. This implementation uses masked PCMCI+ and a hard duration-constrained assignment objective. The exhaustive references test path optimization on short problems; simulated series check selected cases of graph and label recovery, and external fixtures check only fixed-label PCMCI+. Neither the alternating updates nor the initialization agreement establishes global optimality, post-selection inference, or sampling coverage."
sources = ["https://doi.org/10.1063/5.0020538"]
findings_resolved = ["Isolated the label-path search into a pure function with the original tie rules (staying preferred on a tie, earliest regime at the last step, non-finite step costs scored as zero) and checked it against exhaustive enumeration of all k^T label paths for 300 random cost tables with two to four regimes, up to seven steps, four switch penalties and injected non-finite costs: the returned path costs exactly the minimum, and at least 30 optimal paths switch label so the comparison is not trivially a constant path.", "Added executing checks of the penalty semantics: equal costs never switch, and a one-step advantage is smoothed over when two switches cost more than the saving and taken when they cost less.", "Verified from the code that the mask keeps a time point only when its whole 2 * max_lag + 1 window lies in the regime (so the conditioning sets of the MCI step see no spliced rows), that regimes are scored only if every equation is identified on their current rows, that contemporaneous parents are excluded from the cost, that failed re-discovery after refinement keeps the previous assignment, and that refined labels add the post-selection diagnostic.", "Refactored without behaviour change: the Viterbi block of the reassignment sweep moved into min_cost_label_path; the existing reassignment tests and fixed-label oracle tests were not changed. No logic defect was found in the search; the structural difference from the cited method remains recorded as a deviation.", "The learned route keeps only strictly improving admissible proposals up to its iteration bound. The score for choosing a count uses per-variable residual variance plus a penalty for coefficients, variable variances, label count and switches. Simulated shared fixtures verify replay and original non-spliced lag-window scope.", "Version 2 binds the continuous context schema into the artifact and preserves the ordinary Python data snapshot digest. Version 1 reconstructs role-free columns and retains its canonical framing and identity. Both replay through the same source-fixed scalar search. The frozen artifact checks legacy encoding, and the same-platform replay tests verify the exact recomputed scores."]
record_sha256 = "4ee4171120e240a86a91750d8c8098e2e77bafbd79ac85200807bc6effcab326"

