[method_review]
status = "reviewed_with_limits"
scope = "Rpcmci::run in crates/antecedent-discovery/src/rpcmci.rs: the caller-labelled per-regime masked PCMCI+ discovery (window mask, minimum-length policy, frame depth) and the optional alternating label refinement (per-regime lagged least-squares equations, variance-standardised one-step cost, Viterbi minimum-cost label path with a switch penalty, stopping and rejection rules, post-selection diagnostic). Not a review of PCMCI+ itself, which each regime graph delegates to, and not of the regime-learning optimisation of the cited method, which this code does not implement."
assumptions = ["Within each regime the process is stationary, causally sufficient and (for the per-regime PCMCI+ tests) has CI-test assumptions of the chosen test; regime labels are either known to the caller or taken as the minimum-cost path under the refinement's fitted linear lagged models.", "Label refinement scores only linear lagged equations with each regime's retained positive-lag parents; nonlinear, contemporaneous or latent-driver regime differences do not enter the cost.", "A hard label path is chosen by minimum total cost; the switch penalty is a tuning constant in standardised-variance units, not an estimated persistence probability.", "Reported per-regime p-values are conditional on the labels; for refined labels they are not valid frequentist p-values (the code states this)."]
historical_exposure = "Historical author exposure cannot be independently established. The earlier record disclosed black-box tigramite comparison only, with the upstream RPCMCI unavailable on the pinned version; no upstream RPCMCI implementation or test source was consulted or copied in this review."
redistribution = "The exhaustive path-enumeration test is repository-authored under MIT OR Apache-2.0 and runs inside the crate's unit tests. The cited paper is linked by DOI, not redistributed. Existing fixtures are unchanged."
limitations = "The cited paper (Saggioro et al., Chaos 2020) was not re-read in this review (not reachable here); this is a code-versus-rule review of the label-path search and mask logic with an executing exhaustive reference, not a comparison with the published regime-learning algorithm, which jointly optimises regime assignments and per-regime parents and which this implementation does not reproduce. The Viterbi check covers the path search as a pure function of step costs for up to four regimes and seven steps; it does not test that the step costs (lagged-equation fits, standardisation) estimate what the regime model intends beyond the existing unit tests. The external fixtures compare only fixed-label per-regime PCMCI+, not regime inference. No claim about recovery of true regimes, convergence of the alternating scheme to a global optimum, or false-discovery control after refinement. Calibration remains deferred."
sources = ["https://doi.org/10.1063/5.0020538"]
findings_resolved = ["Isolated the label-path search into a pure function with the original tie rules (staying preferred on a tie, earliest regime at the last step, non-finite step costs scored as zero) and checked it against exhaustive enumeration of all k^T label paths for 300 random cost tables with two to four regimes, up to seven steps, four switch penalties and injected non-finite costs: the returned path costs exactly the minimum, and at least 30 optimal paths switch label so the comparison is not trivially a constant path.", "Added executing checks of the penalty semantics: equal costs never switch, and a one-step advantage is smoothed over when two switches cost more than the saving and taken when they cost less.", "Verified from the code that the mask keeps a time point only when its whole 2 * max_lag + 1 window lies in the regime (so the conditioning sets of the MCI step see no spliced rows), that regimes are scored only if every equation is identified on their current rows, that contemporaneous parents are excluded from the cost, that failed re-discovery after refinement keeps the previous assignment, and that refined labels add the post-selection diagnostic.", "Refactored without behaviour change: the Viterbi block of the reassignment sweep moved into min_cost_label_path; the existing reassignment tests and fixed-label oracle tests were not changed. No logic defect was found in the search; the structural difference from the cited method remains recorded as a deviation."]
