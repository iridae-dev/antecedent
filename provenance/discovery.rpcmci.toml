implementation_deviations = [
 "This is primarily a caller-labelled per-regime PCMCI+ wrapper, whereas Regime-PCMCI jointly learns persistent latent regime assignments and per-regime PCMCI graphs.",
 "Optional assignment refinement fits an intercept and all retained positive-lag parents for every variable under each regime, sums squared prediction errors standardized by each variable's variance, and chooses a hard label path by Viterbi with a caller-configured switch penalty. Intercept-only variables remain in the score; contemporaneous parents are excluded. This persistence penalty is implemented, but is not the paper's full regime-learning optimization or evidence of equivalence to it.",
 "Short regimes are skipped under a fixed minimum-length policy, and failed refinement retains the preceding labelled result.",
 "Per-regime discovery keeps a time point only when its whole lag window of 2 * max_lag + 1 consecutive rows carries that regime's label, so regime graphs are fit on masked effective windows of the full series rather than on spliced rows; labels refined from the same data add a post-selection diagnostic stating that the reported p-values are conditional on data-driven labels.",
]

