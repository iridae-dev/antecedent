implementation_deviations = [
 "Identification only: the identifier certifies one adjustment set S(h) shared by the mediator, outcome and reduced-form regressions at each horizon and emits one mediation functional shape for every contrast, separated by the method id; no path-coefficient product is computed here, and the decomposition into direct and mediated effects is carried out by the estimator.",
 "Certification is graphical on the unfolded window DAG: S(h) is the treatment-outcome back-door set I(h) plus every mediator or outcome parent that is not a descendant of the treatment or a mediator, and is checked by d-separation for treatment-mediator, joint (treatment, mediator)-outcome and treatment-outcome confounding. A template that fails any check, that has no treatment-to-mediator or mediator-to-outcome edge, or whose adjustment nodes include a treatment- or mediator-induced covariate is refused.",
 "The linear structural model with no treatment-mediator interaction is a declared parametric restriction that is not tested, and the identified set is only valid under it; cross-world independence is not established.",
 "Natural direct and indirect effects are aliased to the controlled direct and mediated effects under an explicit linearity flag rather than identified by the cited natural-effect result.",
 "A single call identifies one horizon; a query that lists several horizons is refused by identify and must be answered once per horizon by identify_with_horizon.",
]

papers = [
 { title = "The Method of Path Coefficients", doi = "10.1214/aoms/1177732676", sections = ["path-product effect decomposition used as the intended reference, not implemented coefficient arithmetic"] },
 { title = "Causality", citation_note = "Previously recorded title and bibliographic detail: Causality: Models, Reasoning, and Inference", doi = "10.1017/CBO9780511803161", sections = ["mediation formula and natural direct/indirect effects used as intended semantics, not an implemented identification proof"] },
]

