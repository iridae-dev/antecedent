# Covers evaluate_decision (Bayes action and its expected regret against perfect
# information, EVPI) and DesignObjective::ReduceDecisionRegret, scored by
# preposterior.rs::PreposteriorAnalysis as the expected value of sample information of
# each candidate's sample size: exact for finite-support signals and for the conjugate
# normal model with an affine utility, an unbiased Monte Carlo estimate (labelled
# ScoreEvaluation::MonteCarlo) for draws with a continuous signal. Chance constraints
# select the admissible actions under the current belief; that admissible set is the
# fixed terminal-act space of the cited analysis (constraints never enter the utility).
papers = [
 { title = "Applied Statistical Decision Theory", sections = ["Chapter 1 (preposterior analysis)", "Chapter 4 (opportunity loss, expected value of perfect and sample information)", "Chapter 5 (linear terminal analysis; normal linear-loss integral)"] },
 { title = "Expected value of sample information calculations in medical decision modeling", doi = "10.1177/0272989X04263162", sections = ["Monte Carlo EVSI by simulating data and updating the prior"] },
]

