# Covers evaluate_decision (Bayes action and its expected regret against perfect
# information, EVPI) and DesignObjective::ReduceDecisionRegret, scored by
# preposterior.rs::PreposteriorAnalysis as the expected value of sample information of
# each candidate's sample size: exact for finite-support signals and for the conjugate
# normal model with an affine utility, an unbiased Monte Carlo estimate (labelled
# ScoreEvaluation::MonteCarlo) for draws with a continuous signal. Chance constraints
# select the admissible actions under the current belief; that admissible set is the
# fixed terminal-act space of the cited analysis (constraints never enter the utility).
papers = [
 { title = "Applied Statistical Decision Theory", sections = ["Chapter 1 (preposterior analysis)", "Chapter 4 (opportunity loss, expected value of perfect and sample information)", "Chapter 5 (linear terminal analysis; normal linear-loss integral)"] },
 { title = "Expected value of sample information calculations in medical decision modeling", doi = "10.1177/0272989X04263162", sections = ["Monte Carlo EVSI by simulating data and updating the prior"] },
]

implementation_deviations = [
 "The typed Python DecisionRegret declaration exposes the existing native utility callback and preposterior model through rank_designs; costs are not converted/subtracted and callable utilities have no portable artifact. Original callback failures retain their original exception cause. Native model precision remains conditional and unmeasured.",
]

upstream_implementations_observed = []

modules = [
 "crates/antecedent-design/src/decision.rs",
 "crates/antecedent-design/src/preposterior.rs",
]

test_sources = [
 "crates/antecedent-design/tests/decision_exact_reference.rs (120 problems against exact-rational Bayes action, regret and binomial EVSI)",
 "python/tests/test_design_objectives.py (test_callable_regret_reaches_native_exact_preposterior_without_affine_restriction, test_callable_regret_preserves_native_callback_refusal)",

 "crates/antecedent-design/src/decision.rs unit tests",
 "crates/antecedent-design/src/ranker.rs unit tests (decision_regret_score_increases_with_design_sample_size, decision_regret_continuous_signal_is_labelled_monte_carlo, decision_regret_records_candidates_without_a_sample_size, decision_regret_refuses_unknown_and_inadmissible_problems)",
 "crates/antecedent-design/tests/value_of_information.rs",
 "crates/antecedent-design/tests/design_oracle.rs (decision_enumeration_matches_exact_feasibility_contract)",
 "conformance/design/decision_ranking",
]

[method_review]
status = "reviewed_with_limits"
scope = "evaluate_decision and DecisionTable in crates/antecedent-design/src/decision.rs (admissible set from chance constraints at a threshold, Bayes action with the lowest index on ties, expected regret against perfect information over the admissible actions) and the finite-draw routes of PreposteriorAnalysis in crates/antecedent-design/src/preposterior.rs for a binomial signal (new, new_weighted, exact_evsi, expected_value_of_perfect_information, bayes_action, prior_expected_utility): gaps to the Bayes action, the likelihood table over prior draws, and the weighted-belief variant. The conjugate-normal route is checked through the ranking-artifact replay (expected maximum of affine functions against quadrature) and by the existing closed-form tests, not re-derived here. Not the Monte Carlo EVSI sampler, the ReduceDecisionRegret ranker, or the Python callback declaration."
assumptions = ["Chance-constraint satisfaction is reported by the caller's callback as a fraction of the supplied draws; admissibility is satisfaction at least the threshold (within 1e-12), and inadmissible actions are excluded from both the choice and the perfect-information benchmark rather than penalised.", "Draws are equally weighted except on new_weighted, whose weights are normalized; the signal is Binomial(n, theta) with theta the state, so draws must lie in [0, 1]."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the product source named in its scope and compared its results with definitions evaluated by an executing exact-rational reference written for this review (fractions.Fraction); no upstream implementation or test source was consulted or copied. The cited textbook and article were not retrieved in this review: the correspondence is between the product code and the standard definitions of opportunity loss, EVPI and preposterior EVSI, verified numerically."
redistribution = "Primary works are cited, not redistributed. The reference script and its frozen output are repository-authored (MIT OR Apache-2.0); the script uses only the Python standard library. Its output is frozen in the JSON file and compared by the test."
limitations = "One hundred and twenty random problems of 1 to 7 dyadic draws and 2 to 4 affine actions (utility offsets up to 1e6, exact ties between actions, 40 with a draw-by-draw chance constraint including satisfaction exactly at the threshold, 8 with no admissible action, 40 weighted with weights from 1 to 2^-20) are compared at 1e-9 absolute plus 1e-12 relative on the Bayes action, its expected utility, the regret, EVPI and the binomial EVSI at 1, 2, 5, 12 and 60 trials. Chance constraints are not combined with weights (the product refuses that combination). The Monte Carlo EVSI for continuous signals, trial counts above 60, thousands of draws and non-affine utilities are not compared with a reference; the existing value_of_information tests cover a quadrature check of the Gaussian-signal sampler. The constraint tolerance of 1e-12 is the product's choice. The cited works were not retrieved."
sources = ["https://doi.org/10.1177/0272989X04263162"]
findings_resolved = ["No defect found in the routes exercised: the Bayes action (lowest index on ties), expected utility, regret, EVPI and binomial EVSI agree with the exact-rational reference on all 120 problems, the regret and EVSI are unchanged by a common utility offset up to 1e6, an empty admissible set is a typed refusal on both entry points, and constraint satisfaction exactly at the threshold admits the action."]
