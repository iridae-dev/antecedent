implementation_deviations = [
 "The latent exposure is imputed per unit from prior x measurement likelihood x outcome density; the exposure model (softmax in covariates or supplied probabilities) and outcome model (Gaussian, or logistic for a 0/1 outcome) are fitted by EM on a row bootstrap. This is a proper multiple imputation only when the imputation models contain the relations the analysis uses; that is an assumption of the route.",
 "Measurement parameters are redrawn per draw (Beta posteriors of validation rates, multivariate normal for detection parameters, bootstrap refits of the latent-class model); the Beta and normal posteriors are working approximations.",
 "Each completed table is analysed by the ordinary study and the per-draw estimates are pooled with Rubin's rules; the degrees-of-freedom and interval are Rubin's, with no coverage measured.",
 "Partially declared monotone detection is not offered, since an effect is not monotone in the detection function in general.",
 "Unidentified declarations are refused before any draw.",
]

