implementation_deviations = [
 "Automatic knots are placed at sample type-7 quantiles rather than equally spaced as in the cited P-spline construction. The penalty acts on coefficient differences, so with unevenly spaced knots its null space is the sequences linear in the knot index and the infinite-lambda limit is a curve in x, not a straight line; equally spaced unclamped knots can be supplied through SmoothSpec::with_knots.",
 "Automatic lambda is chosen on a fixed 25-point log-spaced grid from 1e-6 to 1e6 by generalized cross-validation of the centered smoother, n RSS / (n - (tr S - 1))^2 (the intercept's degree of freedom is not counted, unlike the Craven-Wahba score on the full model; the two choose the same grid point on every reference dataset). It is reselected against the current partial residuals at each backfitting sweep until a sweep leaves every lambda unchanged or twenty sweeps have passed.",
 "edf_approx is the intercept plus the sum of the per-smooth centered traces. It equals the hat-matrix trace for one smooth and exceeds the joint trace when smooths are correlated.",
 "Implements Gaussian-identity additive models only and returns no analytic smooth uncertainty.",
]

upstream_implementations_observed = [
  { project = "mgcv", exposure = "none" },
  { project = "pygam", exposure = "none" },
]

test_sources = [
  "crates/antecedent-stats/src/gam.rs unit tests (synthetic additive signal recovery and B-spline invariants)",
  "crates/antecedent-stats/tests/foundations_oracle.rs",
  "conformance/stats/gam",
 "crates/antecedent-stats/tests/gam_reference.rs (exact rational joint penalized solution, type-7 knots, hat-matrix trace, large-lambda limit, exact GCV grid minimiser)",
]

[method_review]
status = "reviewed_with_limits"
scope = "fit_gam / fit_gam_weighted / fit_gam_weighted_design in crates/antecedent-stats/src/gam.rs for the Gaussian-identity additive model: cubic B-spline basis evaluation, sample-quantile knot placement, the second-difference coefficient penalty, backfitting with an unpenalized intercept and weighted centering, GCV selection of lambda on the 25-point grid, edf_approx, and prediction with training centers. Not a review of smooth uncertainty (none is produced), of non-Gaussian families, or of any caller's use of the fit."
assumptions = ["The model is Y = b0 + sum_j f_j(X_j) + e fitted by penalized weighted least squares, sum_i w_i (y_i - b0 - sum_j B_j(x_ij) beta_j)^2 + sum_j lambda_j beta_j' D2'D2 beta_j, with weights normalised to sum n; backfitting is a Gauss-Seidel solver for this quadratic and must converge to its unique fitted function.", "The design shares one constant direction (every B-spline block sums to one and D2 annihilates constants), so only fitted values and predictions, not the split of constants between intercept and smooths, are identified; the implementation fixes the split by weighted centering of each smooth.", "The penalty is on coefficient differences. It penalizes curvature in x only for equally spaced knots; the default sample-quantile knots are not equally spaced.", "GCV is minimised on a fixed grid, so the selected lambda is the best grid point, not the continuous minimiser, and a boundary pick (1e-6 or 1e6) is reported in boundary_lambda_smooths."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the product source named in its scope and wrote its own reference from definitions; no upstream implementation or test source was consulted or copied."
redistribution = "The reference script, its frozen output and the Rust assertions are repository-authored (MIT OR Apache-2.0). The reference uses only the Python standard library (fractions); no third-party code is redistributed. The cited papers are linked, not redistributed."
limitations = "Fixed-lambda fits (one smooth; two correlated weighted smooths including a zero weight; a 1e7 penalty; x in units of 1e-9 with y near 1e9; a three-valued covariate with repeated knots) agree with the exact rational joint solution to 1e-8 of the fitted range (1e-6 for the ill-conditioned 1e7 case), predictions inside, at and outside the knot range included; quantile knots agree with the type-7 definition to 1e-12 of the range; GCV picks the exact grid minimiser on five datasets including pure noise (boundary 1e6), near-exact data and a weighted fit. This is a comparison of the optimiser and score with their definitions, not evidence that GCV chooses a statistically good lambda, that the fit has a calibrated uncertainty, or of behavior with many smooths, at concurvity beyond the two-smooth case, or on non-Gaussian responses. Backfitting is run to tolerance 1e-13 here; at the default 1e-6 tolerance fitted values are only that accurate, and the stopping rule scales that tolerance by the largest centred smooth fit, not by the fitted values with the intercept: an outcome offset of 1e6 gave a smooth 0.04 away from the offset-free fit under the default tolerance before, and now the fits agree to 1e-8 with the same iteration count (offset_million_outcome, also against the exact rational solution). The cited papers were not retrieved or re-read by this review (no downloads), so source correspondence is judged against the standard definitions and the executing references, not against the papers' text."
sources = ["https://doi.org/10.1214/ss/1177013604", "https://doi.org/10.1214/ss/1038425655", "https://docs.python.org/3/library/fractions.html"]
findings_resolved = ["Compared the backfitted fit with the exact minimiser of the joint penalized weighted problem, solved in rational arithmetic on a reparametrization that removes the shared constant direction. The previous executing check was a snapshot of this crate's own output (foundations_oracle.rs); the new check is independent of backfitting, the cached Cholesky factors and the spectral GCV path. No numerical defect: fitted values and predictions agree to 1e-8.", "Verified the claim that the centered single-smooth fit equals the full penalized fit with an unpenalized intercept: the intercept update returns the weighted mean of y, the partial residual is then centered, and (B'WB + lambda P) 1 = B'W 1 makes the coefficient shift absorb the constant, so the fitted function is unchanged.", "Corrected the record: it said smoothing parameters are not reselected after the first sweep. The code reselects against the current partial residuals every sweep until a sweep leaves all lambdas unchanged or twenty sweeps have passed.", "Documented, with an executing counterexample, that the coefficient-difference penalty has a null space of sequences linear in the knot index. With equally spaced unclamped knots the infinite-lambda limit is the weighted straight line (asserted); with the default quantile knots it is a curve in x (asserted to differ from the line by more than 1e-3 and to have edf 2).", "Documented that edf_approx is the intercept plus the sum of per-smooth centered traces. It equals the exact trace of the hat matrix for one smooth (asserted) and is larger than the joint trace for correlated smooths (asserted on a concurvity case), so it is an upper approximation, not the joint effective degrees of freedom.", "Checked the GCV degrees-of-freedom convention: the code scores n RSS / (n - (tr S1 - 1))^2 for the centered smoother, whereas the Craven-Wahba score on the full model uses tr S1 including the intercept. The reference evaluates both exactly; they select the same grid point on all five datasets (relative score margins 2e-2 to 5e-6), so no change was made, but the convention is stated in the record."]
