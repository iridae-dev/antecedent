feature_id = "estimate.gcomp"
implementation_crate = "antecedent-estimate"
source_translation = false
copied_code = false
copied_comments = false
copied_tests = false

# Same over-broad-claim risk as estimate.temporal_effects_prediction: Robins
# (1986) is the origin of "g-computation" but its content is the iterated
# formula for time-varying, treatment-affected confounders. `gcomp.rs` is a
# single-time-point finite-difference contrast (evaluate a fitted GLM at
# T=active vs T=control, holding Z fixed, for one row) — no iteration over
# time, no confounders affected by prior treatment. `sections` scoped to
# disclaim that.
papers = [
 { title = "A new approach to causal inference in mortality studies with a sustained exposure period—application to control of the healthy worker survivor effect", doi = "10.1016/0270-0255(86)90088-6", sections = ["single-time-point g-computation substitution rule only — this module does not implement the paper's iterated formula for time-varying, treatment-affected confounders"] },
]

implementation_deviations = [
 "Implements only a single-time-point substitution contrast through a fitted outcome model; it does not implement Robins's iterated g-formula for sustained treatment, treatment-affected confounders, or longitudinal histories.",
 "Evaluates active and control treatment values while holding one row's remaining design values fixed; population standardization, model fitting, and uncertainty are delegated to callers rather than implemented by this kernel.",
]

upstream_implementations_observed = []

