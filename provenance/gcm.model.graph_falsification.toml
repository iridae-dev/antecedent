# Graph permutation falsification: count the violated local Markov implications of a DAG
# (each node independent of its non-parent non-descendants given its parents) and compare the
# count with the counts of random node relabellings of the same graph on the same data, with the
# share of relabellings that are Markov equivalent to the graph (Verma and Pearl: equal
# skeleton and unshielded colliders) as the informativeness check. The design follows the
# permutation-test idea for evaluating a causal graph against data; the implication set,
# the add-one Monte Carlo p-value, the exhaustive enumeration for small graphs and the
# equivalence-share rule are derived here from those definitions.
# Published in AAAI 2025 (vol. 39); the DOI is that of the arXiv record (arXiv:2305.09565).
papers = [
 { title = "Toward Falsifying Causal Graphs Using a Permutation-Based Test", doi = "10.48550/arXiv.2305.09565", sections = ["Section 3 (violations of local Markov conditions compared with node permutations)", "Section 4 (informativeness through Markov equivalence)"] },
]

implementation_deviations = [
 "Implications are enumerated as pairwise statements (node vs each non-parent non-descendant given its parents) rather than as joint local Markov statements; each is one conditional-independence test and the count is not corrected for multiple testing.",
 "Conditional-independence tests are the library's tests chosen by name, including nonlinear tests; their p-values may come from permutation nulls whose draws depend on evaluation order under the execution seed.",
 "The comparison p-value is the add-one Monte Carlo share of relabellings with at most as many violations; for graphs whose factorial does not exceed the request every non-identity relabelling is used.",
 "The informativeness threshold defaults to the comparison significance level; no calibration of the rejection rate under a true graph is claimed.",
]

upstream_implementations_observed = [
 { project = "dowhy", exposure = "black-box comparison only" },
]

test_sources = [
 "crates/antecedent-model/src/falsify.rs unit tests",
 "python/tests/test_graph_falsification.py",
 "python/tests/test_dowhy_comparison.py (rejected and not-rejected outcomes on correct, relabelled and one-edge-short graphs against gcm.falsify.falsify_graph; DoWhy values computed at test time by the pinned version, skipped when it is absent)",
  "crates/antecedent-model/tests/graph_falsification_reference.rs (60-digit partial-correlation reference with exhaustive relabelling counts, equivalence share and verdicts)",
]

[method_review]
status = "reviewed_with_limits"
scope = "falsify::falsify_graph with the partial-correlation test: the local Markov implication set (each node against each non-parent non-descendant given its parents), violation counting at the declared level, the count for every non-identity relabelling when n! is within the request, the add-one p-value, the Markov-equivalent relabelling count and share (equal skeleton and unshielded colliders), and the verdicts Rejected, NotRejected and Uninformative. The partial-correlation statistic and its Student-t p-value are the shared CI test of antecedent-stats; this review checks them here only on the design cells reached. Not reviewed: sampled (non-exhaustive) relabellings, permutation-null tests (non-analytic CI tests), the search budget and cancellation stops, and calibration of the rejection rate."
assumptions = ["Data are fully observed and finite; each implication is tested at the declared level with no multiplicity correction.", "The reference excludes only the identity relabelling, as the product does when it enumerates."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the product source named in its scope, including the numerical helpers it calls, and compared results with definitions evaluated by executing references written for this review; no upstream implementation or test source was consulted or copied. The cited publications were not retrieved in this review: the correspondence is between the product code and the standard definitions those works state, verified numerically, not a page-level reading of the papers."
redistribution = "The reference script and its frozen output are repository-authored (MIT OR Apache-2.0); the script uses only the Python standard library together with mpmath 1.3.0 at 60 digits (not a product dependency). It declares its inline script metadata but is not run in a locked, isolated environment and is not wired into any gate; its output is frozen in the JSON file and compared by the test."
limitations = "Twelve designs on 3 to 5 nodes (80 rows or fewer; seven rows with three residual degrees of freedom; columns shifted by 1e8 and scaled by 1e-6; a column duplicated to within 1e-4; a p-value exactly equal to the significance level; a complete graph; chains with large equivalent shares; the same small graph at the default and at a declared equivalence threshold), every count compared exactly and every implication's statistic and p-value at relative 1e-6. With the default threshold (the significance level) no graph on four nodes can be informative, which the review exercises with a declared threshold; the verdict on four nodes therefore rests on the declared share. Exhaustive enumeration only (the sampled branch draws relabellings from a stream and is not compared). The paper's own procedure was not retrieved, so only the repository definition stated in the record is checked. The p-value is a permutation comparison against relabellings of the same graph, not a calibrated test, and the reference does not measure its error rates."
sources = ["https://doi.org/10.48550/arXiv.2305.09565"]
findings_resolved = ["No defect found: implication sets, violation counts for the graph and all relabellings, equivalence counts, p-values, statistics and verdicts matched the definition in every design."]
