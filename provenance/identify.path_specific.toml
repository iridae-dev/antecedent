implementation_deviations = [
 "When every directed treatment-outcome path is selected, the effect is the total effect and is identified by deleting unselected treatment out-edges and running ordinary total-effect ID. When a complementary path exists, it emits the edge g-formula (Shpitser 2013) over the outcome's ancestors: P(v | pa(v)) factors with the treatment at the active level on edges that start a selected path and the control level elsewhere, minus the all-control g-formula. The district-level formula for latent confounding is not implemented: a bidirected edge on an outcome ancestor with a complementary path is refused as unsupported.",
 "The recanting-witness criterion is decided exactly on the directed graph: a witness (a node reached from the treatment along a prefix with one continuation to the outcome selected and another not) exists iff some child of the treatment starts both a selected and an unselected directed path, which is what the check tests. The recanting-district extension for bidirected edges is not implemented (see the edge g-formula refusal above).",
 "Directed-path enumeration is bounded by query max_paths and max_len; truncation fails closed rather than deciding the paper's criterion.",
]

papers = [
 { title = "Identifiability of Path-Specific Effects", sections = ["recanting witness criterion"] },
 { title = "Counterfactual graphical models for longitudinal mediation analysis with unobserved confounding", sections = ["edge g-formula"] },
]

