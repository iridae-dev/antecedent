[method_review]
status = "reviewed_with_limits"
scope = "dependent_unit_interval of crates/antecedent-estimate/src/temporal_dependent_interval.rs for the bootstrap-t method on a balanced panel of complete binary two-step histories: the sequence responses it estimates from history tallies (observed-state, fixed-state and target-law, through SequenceTallies), the exact unit scores and the identity that the pooled estimate is their mean, the original unit-mean standard error with n - 1, each seeded with-replacement unit resample and its own unit-mean standard error, the resample estimate being the mean of the selected scores, the dropping of a resample of exactly zero variance and the refusal above the declared failed fraction, the pivots (theta* - theta) / se*, the type-7 quantiles of the sorted pivots at (1 - level) / 2, and the endpoints theta - q_high se and theta - q_low se; the reading of the declared replicates, seed, level, minimum unit count and failed fraction; and the refusal above 4096 units. Not the keyed replicate and selection identity words (checked by golden vectors in the module), the percentile, basic and bias-corrected paths of checked_paired_effect_interval, the checked facade estimators and the replay artifact, the measured-envelope authority, or any coverage of the interval. The record names no block length or serial-dependence parameter: the dependence handled here is only the grouping of histories into whole units, and the circular-block bootstrap of crates/antecedent-estimate/src/temporal_block.rs is a different method outside this record."
assumptions = ["Units are independent draws from a population of units, histories within a unit may depend arbitrarily, and every unit holds the same positive multiplicity of all binary histories of every state, action and covariate assignment; the estimator is then the mean of unit scores, which the product checks and the reference re-derives from the histories.", "The seeded unit draws, taken as given from the replicate ids, are uniform with replacement; the splitmix draw rule is reproduced in the reference and each regenerated resample must reproduce the product's replicate point.", "The bootstrap-t is an equal-tailed percentile-t construction on a smooth linear functional; no coverage theorem is inherited."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the product source named in its scope and compared results with the response definitions, the unit-draw rule and the studentisation written out from their definitions and evaluated by an executing reference written for this review at 50 digits and in exact fractions; no upstream implementation or test source was consulted or copied. The cited publication was not retrieved in this review and no section or theorem of it was read: the correspondence is between the product code and the stated definition of an equal-tailed bootstrap-t, verified numerically."
redistribution = "Primary work is cited, not redistributed. The reference script and its frozen output are repository-authored (MIT OR Apache-2.0); the script uses mpmath (BSD-3-Clause), imported at run time and not redistributed here. The script declares its inline script metadata but is not run in a locked, isolated environment and is not wired into any gate; its output is frozen in the JSON file and compared by the test. The replicate ids it takes as input were produced by the ignored dump test in the assertion file."
limitations = "No already-reviewed kernel is relied on: the type-7 quantile, the mean and n - 1 standard error, the splitmix draw and the response tallies are each reproduced by the reference, so this review checks its own route arithmetic end to end, but only for the shapes it builds. Two panels (24 units with unequal cell multiplicities from 1 to 3 and outcomes in eighths; 4 units of which two are identical, so that resamples drawn only from the twins have exactly zero variance, 8 of 200 here) and four configurations (observed-state, fixed-state and target-law estimators; levels 0.95, 0.9 and 0.8; 80 to 200 replicates). Only two-step binary histories with every cell present are covered; the three-step tallies are exercised by in-crate tests only, and unbalanced panels are refused rather than estimated. The replicate and selection identity words are frozen inputs checked by golden vectors, not re-derived here; the reference proves that the draw rule applied to those ids reproduces the product's replicate points, not that the ids are uniformly seeded. Zero variance is decided on the product by the corrected two-pass variance, which returned exactly zero on the tied resamples here; a resample whose scores differ only by rounding is not exercised. The percentile, basic and bias-corrected routes, the 4096-unit boundary beyond a refusal test on 4097 units, the facade and the replay artifact are not reviewed. Coverage and calibration are not part of this review; the retired percentile failures and the later whole-method measurements recorded above are separate evidence. The cited publication was not retrieved and no paper section was read; none of the reviewers retrieves papers, and the papers entry above stays a construction-level citation."
sources = ["https://doi.org/10.1214/aos/1176350933", "https://mpmath.org/doc/1.3.0/", "https://docs.python.org/3/library/fractions.html"]
findings_resolved = ["The reference derives each unit score from raw histories (exact fractions), regenerates all unit draws with its own splitmix64 from the product's replicate ids, and the product's replicate points, original unit scores, original standard error, every resample standard error, every pivot, the number of dropped resamples, and both endpoints equal the 50-digit values to 1e-9 relative on all four scenarios; the pooled estimate equals the mean of unit scores exactly and each resample estimate equals the mean of its selected scores exactly.", "The declared level, replicate count, minimum unit count (never below two) and failed-fraction bound are read: levels change the endpoints as the reference predicts, a bound equal to the observed dropped share accepts and one just below refuses with the exact count in the message.", "Defect repaired: a request for the studentized interval on a panel of more than 4096 units was silently answered by the retired percentile (bias-corrected accelerated) construction of an unmeasured and, for a callback, uncertified estimator, returning method Percentile and bypassing the retired-method refusals. It now refuses with route_not_supported and temporal_interval.studentized_bounds_exceeded before any resampling work; failing-first test a_studentized_request_beyond_the_certified_unit_range_is_refused_not_rerouted."]
