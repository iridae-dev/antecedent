implementation_deviations = [
  "Repository-specific Gaussian reduced-form posterior: T=alpha+pi Z+v and Y=c+gamma Z+u, followed by draws of gamma/pi. Independent zero-mean normal priors are on (alpha,pi,c,gamma), not directly on the treatment effect. This is distinct from the static fixed-loading structural IV posterior.",
  "The correlated reduced-form residual covariance is a plug-in estimate with a 1e-8 variance floor; covariance-estimation uncertainty is not propagated. The four-dimensional Gaussian coefficient posterior uses prior precision plus the stacked likelihood precision.",
  "Shares the lag-aligned independent-row likelihood, first-stage-F refusal and declared IV premises of the Wald fit. Non-finite ratio draws refuse the fit rather than being discarded. Finite posterior sample moments do not establish existence of population ratio-posterior moments; no weak-IV-robustness claim is made.",
]

test_sources = [
  "crates/antecedent-estimate/src/lagged_instrument.rs",
  "crates/antecedent/src/analysis/execute/temporal_iv_path.rs",
  "crates/antecedent/tests/temporal_lagged_instrument_route.rs",
  "python/tests/test_temporal_lagged_instrument.py",
  "crates/antecedent-estimate/tests/lagged_instrument_ratio_reference.rs (40-digit Wald contrast and exact quadrature distribution function of the reduced-form ratio posterior)",
]

[method_review]
status = "reviewed_with_limits"
scope = "crates/antecedent-estimate/src/lagged_instrument.rs: the lag alignment (instrument at t - lag with treatment and outcome at t), the Wald contrast (effect Szy / Szt, intercept, first-stage slope and F, homoskedastic standard error), and fit_lagged_instrument_posterior: the reduced forms t = a + pi z + u, y = c + gamma z + w fitted by OLS, their plug-in residual covariance (divisor n - 2, variance floor 1e-8), the posterior precision of (a, pi, c, gamma) under independent N(0, prior_sd^2) priors, and the distribution of the draws of gamma / pi. Not the identification of the lagged instrument (exclusion is the caller's premise), the facade's temporal IV path, or calibration; the existence of ratio moments is not examined."
assumptions = ["The lag is excluded from the outcome equation and the lagged instrument is relevant; both are premises of the caller, as the record says.", "The reduced-form errors are jointly Gaussian with the plug-in covariance treated as known, and the prior is N(0, prior_sd^2) on the absolute scale of all four coefficients.", "The reference builds the precision as kron(S^-1, X'X) + I / tau^2, a different arrangement from the module's row-by-row accumulation, and evaluates the exact distribution function of the ratio of two jointly Normal coefficients by quadrature, so it does not use draws."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the product source named in its scope, including the numerical helpers it calls, and compared results with a 40-digit reference with an exact quadrature distribution function of the Gaussian ratio written for this review; no upstream implementation or test source was consulted or copied. The cited publications were not retrieved in this review: the correspondence is between the product code and the standard definitions those works state, verified numerically, not a page-level reading of the papers."
redistribution = "Primary works are cited, not redistributed. The reference script and its frozen output are repository-authored (MIT OR Apache-2.0); mpmath is used only to produce the frozen values and is not a product dependency. The script declares its inline script metadata but is not run in a locked, isolated environment and is not wired into any gate; its output is frozen in the JSON file and compared by the test."
limitations = "Two series of 70 and 90 rows (lag 1 with a tight prior 1.5 and weak first stage F 5.6, lag 2 with prior 10 and F 263). The Wald statistics are compared to 1e-9 relative; the sorted ratio draws (400,000) are compared with the exact distribution function at five points per design within five binomial standard errors (the points span the lower tail to the upper tail, probabilities from 0.001 to 0.99999). The ratio posterior has no finite moments in general, so no mean or sd claim is made, and the draw count limits the extreme tails. Serial dependence of the series, the weak-instrument-robust alternatives and gapped series are not exercised."
sources = ["https://doi.org/10.1515/9781400829828", "https://doi.org/10.1201/b16018", "https://mpmath.org/doc/1.3.0/"]
findings_resolved = ["The Wald effect, intercept, first-stage slope, first-stage F and homoskedastic standard error equal the 40-digit reference to 1e-9 relative with a lag of one and of two.", "The distribution of the gamma / pi draws matches the exact Gaussian-ratio distribution function at every tested point on both designs, including the tight-prior design with a weak first stage (F 5.6, negative first-stage slope), where the reference ratio probabilities range from 0.15 to 0.87 over the tested points.", "A zero lag and a series with fewer than eight aligned rows are refused.", "No product defect was found in this record."]
