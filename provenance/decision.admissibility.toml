# Declared admissibility rules (action exclusions, per-input support floors, an uncertainty
# requirement kind) wrapped around a durable decision contract, with a canonical identity.
# This is original engineering over the existing decision contract: a rule removes an action
# from the admissible set and never adds a penalty. No paper introduces it, and the
# decision-theory background (expected utility, maximin and minimax regret as criteria) is
# textbook material whose exact theorem or section was not verified against the code, so
# papers = [] is an explicit judgment rather than an unfilled field. The related record
# f6_robustness_adapters carries the criteria that consume these rules.
papers = []

implementation_deviations = [
  "No cited procedure is reproduced: rules are declarations checked structurally (unknown action, unknown input, duplicate rule, blank reason) and applied by removal. Nothing here inherits a guarantee from the decision-theory literature.",
  "Support statuses are caller-supplied and ordered by a stated severity convention (Supported, WeakOverlap, Extrapolative, OutsideEmpiricalSupport, MissingEvidence); an input with no rule is unchecked, and the order is a convention of this implementation, not a cited theorem.",
  "An uncertainty requirement is met only by a supplied claim of exactly its own kind (none accepts any); the kind is a label supplied by the caller and is not verified against how the claim was produced.",
  "The contract identity is a canonical digest that ignores the order of rules and exclusions; a contract without rules keeps the earlier decision_contract_v1 bytes, so the wrapper adds no wire change for existing contracts.",
]

upstream_implementations_observed = []

