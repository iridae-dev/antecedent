implementation_deviations = [
 "Not Carlin and Chib's sampler and not reversible jump. Every candidate specification (no change, piecewise at each prespecified change point, smooth at each prespecified penalty) is expressed over one shared coordinate vector of the global parameters followed by every path coordinate, so the state is a discrete specification and a fixed-dimension vector with no pseudo-prior and no auxiliary dimension-matching variables. Coordinates a specification does not use are held by that specification's path prior alone.",
 "The specification move keeps the standardized state fixed: with z the whitened state, the coordinates are center_m + lower_m z for specification m, and a move from m to m' is a uniformly chosen other specification at the same z. The proposal is symmetric, so the Metropolis-Hastings ratio is the ratio of target densities, and the target on (m, z) is the specification's unnormalized posterior density at its coordinates times the whitening Jacobian det(lower_m). The Jacobian is what makes the marginal frequency of specification m equal the posterior mass of m; without it specifications with a tight posterior would be favored in proportion to the inverse of their whitening scale.",
 "Whitening is per specification: the posterior mode is found by the limited-memory optimizer from the selected point, the covariance is the inverse of the numerical information at that mode, and its lower Cholesky factor (the identity where the curvature or its factorization is unavailable) defines the map. The map only changes the coordinates the random walk runs in, so the sampled target is the declared posterior for any invertible lower-triangular factor; the mode and curvature affect mixing, not the target. A failed optimization falls back to the start point and the identity.",
 "The prior over specifications is uniform: the density carries no specification weight, so every declared candidate has equal prior mass. A smooth specification's path prior is a first-difference random walk from zero with penalty-scaled precision; its first-difference operator has unit determinant, so the normalizing term is half the coordinate count times the log penalty, and the omitted constants (the Gaussian log scale and 2 pi) are the same for every specification, so they cancel in the specification masses. This was verified by reading path_log_prior, not by a test.",
 "A step proposes a specification move with probability 0.25 (a fixed constant) and a random-walk step inside the current specification otherwise; chains start overdispersed in the whitened space of a specification chosen by chain index. The retained draw stores the global parameters and path coordinates and one extra coordinate holding a uniform inside the bin of the current specification, which is the encoding the retained slots decode; R-hat and effective sample size diagnostics run on all of these coordinates, the specification coordinate included.",
 "Each retained draw also carries a conditional random-intercept and AR realization drawn given its coordinates; its likelihood is the independent-group marginal of the covered panel likelihood, and the diagnostics gate (R-hat, bulk and tail effective sample size, every chain moving) is the existing one.",
 "No identified-change, causal-attribution or calibrated-coverage claim: the fit is labeled model_conditional_temporal_mechanism_only with calibration not_measured.",
]

