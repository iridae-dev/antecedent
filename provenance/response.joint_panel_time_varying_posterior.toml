[method_review]
status = "reviewed_with_limits"
scope = "The specification sampler of the Bayesian time-varying joint-panel fit in crates/antecedent-estimate/src/joint_panel/time_varying.rs: Whitening, whiten and whitening (per-specification mode and curvature map), sample_model_mixture (a gradient Hamiltonian transition, or a No-U-Turn transition in a second run, within the current specification in standardized coordinates, and a Metropolis move over the specification at an unchanged standardized state, with the whitening log-determinant in the target), the specification and uniform-bin encoding of the draws, the path priors, the candidate seeding fit_candidates gives a posterior (a Newton-finished pass when no plain candidate converges, then the best stalled candidate as the seed instead of a refusal), and the Bayesian branch of fit_temporal_inner that assembles them, including the second run that replaces a first run missing its diagnostics. Not the likelihood and marginal it evaluates (reviewed separately for the independent-group Gaussian marginal only), the optimizer, Newton polish and numerical information, the Hamiltonian and No-U-Turn kernels themselves (crates/antecedent-prob/src/gradient_hmc.rs, whose own tests recover a correlated Gaussian and a separated two-component mixture), the frequentist bootstrap branch, the conditional random-intercept realization, the R-hat and effective-sample-size diagnostics, the prior over global parameters, and the prespecified candidate lists (their choice is the caller's)."
assumptions = ["The caller's prespecified candidate set (no change, change points, smoothing penalties) contains the specifications that are to be weighed; the posterior masses are conditional on that set and give each candidate equal prior mass.", "The objective returns the exact log marginal likelihood of the panel under a specification's coordinates, and the global-parameter prior is proper; the sampler treats both as given. Its gradient is the exact temporal score plus central differences of the prior, path prior and smoothing penalty (central differences of the whole density under a spatial residual law).", "Within a specification the Hamiltonian transition with a jittered step is irreducible on the support, so the chains can in principle reach every region; the diagnostics gate, not the construction, detects a failure to do so, and a second run is accepted only when it meets the same gate."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the product source named in its scope and derived the acceptance rule from the change of variables by hand; no upstream implementation or test source was consulted or copied. The cited publications were not retrieved in this review: the correspondence is between the product construction and the standard facts those works state (a discrete model index sampled jointly with fixed-dimension parameters; a Jacobian in a between-model move through a deterministic map), not a page-level reading of the papers, and the DOIs and titles were checked against the Crossref registry."
redistribution = "Primary work is cited, not redistributed. No reference script or fixture is bound: the unit test builds its own Gaussian specifications from closed-form masses and is repository-authored (MIT OR Apache-2.0)."
limitations = "Evidence is the unit test on two-dimensional Gaussian specifications that are exactly whitened (the whitening is the true covariance), with three specifications and a frequency tolerance of 0.04, run with the Hamiltonian within-specification transition; it checks that the Jacobian term makes specification frequencies equal the posterior masses and would fail without it, but it does not exercise a whitening that differs from the true local covariance, non-Gaussian or skewed specifications, or specifications of unequal effective dimension. The whole procedure on the real panel density is measured by the joint-panel posterior-calibration records of time-varying and broader time-varying panels at 9, 12 and 24 groups under prior-drawn truths, which score a posterior that misses its diagnostics as a miss. Mixing across specifications at the real posterior depends on the overlap of the specifications' whitened posteriors at a shared standardized state, which is not guaranteed: a specification far from another in whitened coordinates is proposed and rejected nearly always, and lagged panels whose chains settle in different change-point specifications still miss the diagnostics after the second run (about 2.5% of prior-drawn lagged panels in development runs), so the diagnostics gate withholds those intervals. The second run changes nothing for a posterior whose first run meets the diagnostics. The specification move probability (0.25) and the standardized-state coordinate-sharing are fixed, not tuned. A fit seeded from a stalled candidate reports that candidate's point, marked not converged in its attempts."
sources = ["https://doi.org/10.1111/j.2517-6161.1995.tb02042.x", "https://doi.org/10.1093/biomet/82.4.711", "https://doi.org/10.1093/biomet/57.1.97", "change of variables for a density under an invertible affine map (textbook): the density of z under x = center + lower z is p(x) |det lower|"]
findings_resolved = ["Read for correctness of the acceptance ratio: the specification move is symmetric (a uniform other specification from either state, probability 0.25 times 1/(n-1) each way, at an unchanged z) and the target is density(m, center_m + lower_m z) + log det lower_m, which is the density of the standardized state; the log-determinant is the sum of the logs of the Cholesky diagonal, as the Jacobian of the lower-triangular map requires. No defect found.", "The unit test on three specifications of different location, scale and weight recovers masses 1/6, 2/6 and 3/6 within 0.04 over four chains of 6000 draws; the test target includes the Jacobian and would shift the frequencies by the scale ratios without it.", "Path priors verified by reading: the smooth first-difference prior has a unit-determinant difference operator, so its normalization differs from the independent Gaussian prior of the other specifications only by the half-count log penalty that the code includes; the dropped constants are common to all specifications.", "Re-read after the sampler change: the within-specification move is a Hamiltonian (first run) or No-U-Turn (second run) transition targeting the same standardized density, which leaves the joint target invariant; the specification move and its acceptance are unchanged, so the Jacobian argument above still holds.", "Defect repaired: a time-varying posterior refused the fit when no temporal candidate met the score tolerance, although its candidates only seed the sampler (8 of 400 prior-drawn lagged panels and 48 of 400 broader ones); its candidates are now finished with Newton steps when none converges, and the best stalled candidate seeds the sampler, as the time-invariant posterior's local fit does.", "Defect repaired: a posterior whose first run missed its diagnostics published nothing; it is now sampled once more (No-U-Turn transitions, twice the warmup, its own streams, each specification whitened at its Newton-finished center by the inverse curvature of its exact score) and the second run replaces the first only when it meets the diagnostics. Development runs recovered 3 of 4 first-run failures on broader time-varying panels, and the time-varying posterior-calibration records pass at every grid point."]
