[method_review]
status = "reviewed_with_limits"
scope = "The specification sampler of the Bayesian time-varying joint-panel fit in crates/antecedent-estimate/src/joint_panel/time_varying.rs: Whitening and whiten (per-specification mode and curvature map), sample_model_mixture (Metropolis over specification and standardized state with the whitening log-determinant in the target), the specification and uniform-bin encoding of the draws, the path priors and the Bayesian branch of fit_temporal_inner that assembles them. Not the likelihood and marginal it evaluates (reviewed separately for the independent-group Gaussian marginal only), the optimizer and numerical information, the frequentist bootstrap branch, the conditional random-intercept realization, the R-hat and effective-sample-size diagnostics, the prior over global parameters, and the prespecified candidate lists (their choice is the caller's)."
assumptions = ["The caller's prespecified candidate set (no change, change points, smoothing penalties) contains the specifications that are to be weighed; the posterior masses are conditional on that set and give each candidate equal prior mass.", "The objective returns the exact log marginal likelihood of the panel under a specification's coordinates, and the global-parameter prior is proper; the sampler treats both as given.", "Within a specification the whitened random walk is irreducible on the support, so the chains can in principle reach every region; the diagnostics gate, not the construction, detects a failure to do so."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the product source named in its scope and derived the acceptance rule from the change of variables by hand; no upstream implementation or test source was consulted or copied. The cited publications were not retrieved in this review: the correspondence is between the product construction and the standard facts those works state (a discrete model index sampled jointly with fixed-dimension parameters; a Jacobian in a between-model move through a deterministic map), not a page-level reading of the papers, and the DOIs and titles were checked against the Crossref registry."
redistribution = "Primary work is cited, not redistributed. No reference script or fixture is bound: the unit test builds its own Gaussian specifications from closed-form masses and is repository-authored (MIT OR Apache-2.0)."
limitations = "Evidence is one unit test on two-dimensional Gaussian specifications that are exactly whitened (the whitening is the true covariance), with three specifications and a frequency tolerance of 0.04; it checks that the Jacobian term makes specification frequencies equal the posterior masses and would fail without it, but it does not exercise a whitening that differs from the true local covariance, non-Gaussian or skewed specifications, specifications of unequal effective dimension, or the real panel density. Mixing across specifications at the real posterior depends on the overlap of the specifications' whitened posteriors at a shared standardized state, which is not guaranteed: a specification whose posterior sits far from another's in the whitened coordinates (for example a sharp change location) can be proposed and rejected nearly always, so the estimated masses are then noisy and the diagnostics gate, which runs on the specification coordinate, is what withholds them. The specification move probability (0.25) and the standardized-state coordinate-sharing are fixed, not tuned. The frequentist rate of recovering a planted change and the coverage of the posterior intervals under this sampler are measured by the ignored groups joint_panel_posterior_calibration_time_varying_l95, joint_panel_posterior_calibration_time_varying_broader_l95, joint_panel_experiment_update_weights_time_varying_bayesian_l95 and joint_panel_future_sample_value_standard_error_time_varying_bayesian_l95 in crates/antecedent/tests/joint_panel_calibration.rs; the calibration has not yet been measured for this sampler, so no coverage claim is made. The sampler's mode search is a local optimum and a multimodal specification posterior is represented by one whitening."
sources = ["https://doi.org/10.1111/j.2517-6161.1995.tb02042.x", "https://doi.org/10.1093/biomet/82.4.711", "https://doi.org/10.1093/biomet/57.1.97", "change of variables for a density under an invertible affine map (textbook): the density of z under x = center + lower z is p(x) |det lower|"]
findings_resolved = ["Read for correctness of the acceptance ratio: the specification move is symmetric (a uniform other specification from either state, probability 0.25 times 1/(n-1) each way, at an unchanged z) and the target is density(m, center_m + lower_m z) + log det lower_m, which is the density of the standardized state; the log-determinant is the sum of the logs of the Cholesky diagonal, as the Jacobian of the lower-triangular map requires. No defect found.", "The unit test on three specifications of different location, scale and weight recovers masses 1/6, 2/6 and 3/6 within 0.04 over four chains of 6000 draws; the test target includes the Jacobian and would shift the frequencies by the scale ratios without it.", "Path priors verified by reading: the smooth first-difference prior has a unit-determinant difference operator, so its normalization differs from the independent Gaussian prior of the other specifications only by the half-count log penalty that the code includes; the dropped constants are common to all specifications. No product code changed."]
