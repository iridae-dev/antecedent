rationale = "The contract, qualification and routing layers of choice inference: the choice-study declaration with completeness and consistency refusals, scope matching and row-level overlap of retained sources through the evidence ledger, the procedure-matrix authorization of each route, the conflict screen on the discounted prior, the sealed result artifact with consumer replay, and the EVSI ranking over the pooled posterior. Each numerical step is delegated to the covered_by records."
no_independent_algorithm = "Scope comparison, ledger overlap refusal, matrix lookup, threshold comparison, artifact sealing and replay, and enumeration of a closed-form predictive distribution for the study value; the posterior, hierarchical posterior and procedure law are separate method records."
