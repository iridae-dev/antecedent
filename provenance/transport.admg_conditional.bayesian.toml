rationale = "Dirichlet posterior mean of the supplied finite law (AdmgConditional namespace), then the existing conditional transport identifier over the updated laws."
no_independent_algorithm = "dirichlet_posterior_mean / dirichlet_supported_mean return (w_i + c)/(sum w + k c) and the downstream evaluation is the covered route's existing finite computation. posterior_mean.rs also holds the normal and ridge routes and the Gaussian-kernel local-quadratic route, which belong to other records."
covered_by = ["estimate.posterior_mean_kernel"]
