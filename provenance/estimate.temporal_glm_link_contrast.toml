upstream_implementations_observed = []

implementation_deviations = [
  "A decision-time empirical mean probability contrast under a Bernoulli logit or probit GLM. Intervention regime columns, including explicitly declared treatment-derived interactions, change together; lag columns remain observed. The link-scale treatment coefficient is not reported as the mean-scale causal contrast.",
  "Uses unpenalized maximum likelihood and Fisher delta-method uncertainty conditional on the empirical covariate distribution. Separated fits are refused instead of silently introducing a ridge penalty. Identity and other unsupported links, missing lag columns and a single dependent series are refused.",
  "The panel facade takes only the earliest full lag-window row from each independent subject, rather than treating pooled within-subject rows as independent. This sampling construction and temporal causal identification are additional repository contracts, not consequences of the static GLM reference. This record does not license a route or assert calibration.",
]

test_sources = [
 "crates/antecedent-estimate/src/temporal_link.rs",
 "crates/antecedent/src/analysis/execute/panel_link_path.rs",
 "crates/antecedent/tests/panel_link_contrast_route.rs",
 "python/tests/test_panel_link_contrast.py",
 "crates/antecedent-estimate/tests/temporal_link_reference.rs (40-digit logit and probit maximum-likelihood contrast, Fisher delta-method standard error, Laplace mode contrast and exact Gaussian posterior-mean contrast)",
]

[method_review]
status = "reviewed_with_limits"
scope = "FrequentistTemporalLink::fit and BayesianTemporalLink::fit of crates/antecedent-estimate/src/temporal_link.rs for a Bernoulli logit and probit decision-time GLM: the average mean-scale contrast (1/n) sum [mu(x_i(active)'b) - mu(x_i(control)'b)] with regime columns replaced and the lag held at its observed value, the maximum-likelihood coefficients, the Fisher (expected-information) delta-method standard error, the Laplace mode and observed-Hessian covariance under N(0, sd^2) priors on every coefficient, the contrast at the mode, and the published posterior-mean contrast over the draws. Not the underlying IRLS and Laplace solvers beyond their agreement with the references, the panel facade that selects one row per subject, dependent-series refusal, or coverage."
assumptions = ["Rows are independent subjects at one decision time each; a single dependent series is refused.", "The standard error conditions on the empirical covariate distribution and uses the expected Fisher weight at the observed design.", "The Bayesian object is the Laplace (Gaussian) approximation of the posterior, not the exact posterior; the published mean of the contrast is not the contrast at the mode."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the product source named in its scope and compared results with a 40-digit multiprecision Newton maximum-likelihood, Fisher delta-method, Laplace and Gaussian-quadrature reference written for this review (temporal_link_reference.py); no upstream implementation or test source was consulted or copied. The cited publications were not retrieved in this review: the correspondence is between the product code and the standard definitions those works state, verified numerically, not a page-level reading of the papers."
redistribution = "Primary works are cited, not redistributed. The reference script and its frozen output are repository-authored (MIT OR Apache-2.0); mpmath, where used, only produces the frozen values and is not a product dependency. The script declares its inline script metadata but is not run in a locked, isolated environment and is not wired into any gate; its output is frozen in the JSON file and compared by the test."
limitations = "One 140-row design with an intercept, a treatment, a continuous lag and a treatment-by-lag interaction (two regime columns, one held lag); logit with prior scales 2 and 0.3, and probit with scale 2. The frequentist estimate agrees to a relative 1e-9, the standard error and regime coefficients to 1e-8, the contrast at the Laplace mode to 1e-7, and the posterior-mean contrast over 60,000 draws within five Monte Carlo standard errors of the exact Gaussian expectation. Not exercised: separated fits (refused), a Poisson or other link (refused), more than one held lag, and the draw-level standard deviation of the contrast against an exact value. No coverage is measured. The cited publication was not retrieved."
sources = ["https://doi.org/10.1201/9780203753736", "https://mpmath.org/doc/1.3.0/"]
findings_resolved = ["No numerical defect was found: the maximum-likelihood coefficients, the regime-averaged contrast, the Fisher delta-method standard error (including the probit expected weight phi^2 / (Phi (1 - Phi))), the Laplace mode with the observed probit Hessian and the posterior-mean contrast agree with the multiprecision reference.", "For both links the posterior mean of the contrast differs from the contrast at the mode (by about 2e-4 at prior scale 2 and 3e-4 at scale 0.3 on the reference data), as the record states."]
record_sha256 = "cb956b945c47375c1d4c34c3cc1fde2d98954686331d7b01b008ac6d177902b7"

