implementation_deviations = [
  "A decision-time empirical mean probability contrast under a Bernoulli logit or probit GLM. Intervention regime columns, including explicitly declared treatment-derived interactions, change together; lag columns remain observed. The link-scale treatment coefficient is not reported as the mean-scale causal contrast.",
  "Uses unpenalized maximum likelihood and Fisher delta-method uncertainty conditional on the empirical covariate distribution. Separated fits are refused instead of silently introducing a ridge penalty. Identity and other unsupported links, missing lag columns and a single dependent series are refused.",
  "The panel facade takes only the earliest full lag-window row from each independent subject, rather than treating pooled within-subject rows as independent. This sampling construction and temporal causal identification are additional repository contracts, not consequences of the static GLM reference. This record does not license a route or assert calibration.",
]

