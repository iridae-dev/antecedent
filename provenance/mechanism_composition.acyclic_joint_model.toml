implementation_deviations = [
  "Composition is a bounded construction from these results, not an implementation of a published algorithm: one family per composition (additive-noise linear-Gaussian, or finite conditional tables), acyclic graphs only, no unobserved confounding other than declared unit-variance Gaussian latents with declared loadings.",
  "Mean and covariance are exact path-algebra sums of the declared parameters (Bollen path analysis) and the finite law is the exact Markov factorization with truncated factorization for do(); there is no estimation step in composition.",
  "Parameter uncertainty is propagated by the first-order delta method (Casella and Berger, Statistical Inference 2nd ed., section 5.5.4) for linear contrasts of interventional means only. The functional is multilinear in the parameters, so second-order terms are omitted; residual scales are held fixed. The result is a parameter-covariance variance, not an interval, and carries no coverage claim.",
  "Population and regime admission represents a declared selection diagram or an explicit invariance assumption; it does not decide transportability. A selection arrow into a variable refuses its mechanism; a mechanism with a shared latent is admitted only by an explicit invariance declaration because S-admissibility given only the parent set is not established in the presence of a latent.",
  "Separately fitted mechanisms are never assumed independent. Posterior dependence is a declaration (aligned joint law, explicit cross-mechanism covariance for every pair, or independence by design with a justification and distinct evidence identities); otherwise an uncertainty claim over more than one mechanism is refused.",
]

