implementation_deviations = [
  "The required Bayes factor is the exact odds ratio between the declared level and the prior. The required observation count is the minimum over integer counts of conditionally independent identical readings, found from the closed form and then verified, never rounded blindly; a level matched within 1e-12 in log-odds (probability, for the conjugate solve) counts as reached.",
  "The solve takes one kind of reading per direction: positive readings to raise, negative readings to lower. A mixed sequence of readings is a different question and is not solved.",
  "A level no admissible evidence reaches is a typed refusal that states the supremum (raising) or infimum (lowering) reachable: the prior when the signal does not move the probability that way, or the probability after the declared maximum observation count when only the budget is the obstacle.",
  "The evidence solve is a statement about a declared model. It makes no statement about how often a fitted model's posterior crosses a level, and no interval or calibration claim is made.",
]

