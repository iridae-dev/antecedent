  { title = "Bayesian Data Analysis", citation_note = "Previously recorded title and bibliographic detail: Bayesian Data Analysis (3rd ed.)", doi = "10.1201/b16018", sections = ["Chapter 2: the Beta-Binomial predictive probability after n successes"] },
