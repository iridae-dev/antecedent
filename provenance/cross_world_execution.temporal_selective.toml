papers = []

implementation_deviations = [
  "The staged executors (TemporalExecutor for the two-slice route, GeneralTemporalExecutor for any horizon) call the one-shot evaluators' own abduction and replay functions and differ only in retaining each factual set's abduction under a digest of the snapshot, graph, fit and factual histories; a changed action history reuses it, a changed snapshot, coefficient or factual value is a different key. The retention key and the stage receipts are engineering additions with no counterpart in the cited work.",
  "The staged result is required to be bit-identical to the one-shot result; the arithmetic itself (residual abduction, forward replay, sample means) is reviewed under counterfactual.temporal_fixed_population, which also covers the general-horizon route.",
]

