  "The joint update conditions the retained panel draws on one multivariate Gaussian likelihood whose covariance is the retained excursion's own joint arm-mean covariance mapped to treated-minus-control contrasts. Evidence with marginal variances only, or point estimates only, is refused rather than given an independence assumption.",
