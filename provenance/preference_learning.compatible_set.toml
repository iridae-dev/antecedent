implementation_deviations = [
 "This is not a nonparametric revealed-preference test. The value model is declared, value = F + sum_k theta_k T_k with expected parts from recorded beliefs, and each recorded choice of c over a rejected option j adds the linear relation sum_k theta_k (T_ck - T_jk) >= -tolerance - (F_c - F_j) on the preference parameters. The question answered is which parameters of that model are compatible with the records, not whether some utility function rationalises them; Afriat's and Varian's inequalities are the source of reading a choice as a linear inequality, not a procedure reproduced here.",
 "A choice is weakly optimal within a declared additive tolerance in utility units. This is not Afriat's or Varian's multiplicative efficiency index and not UTA's per-statement error variables; when the records conflict, the reported tolerance needed is the declared tolerance plus the least common slack s >= 0 that makes every relation of the conflicting records hold together with the declared set, from one linear program.",
 "Differences of expected parts smaller than 1e-12 times the larger operand are read as zero. A relation with no remaining coefficient is not added; if it is violated, the record alone contradicts the model and is reported as a single-record conflict.",
 "Learned ranges are the minimum and maximum of each parameter over the declared set cut by the choice relations, two linear programs per parameter; narrowing is judged against the declared range restricted by the declared relations. Binding choices are the choice relations tight at the optimal vertices found for those extremes, not every relation that could be tight at some optimum.",
 "A conflict is reported as a smallest set of conflicting records (exhaustive search over record subsets by increasing size, up to a configured size and a budget of 50 000 subsets, lexicographically first among the smallest), or, beyond that, as an irreducible set from Chinneck and Dravnieks' deletion filter applied to groups of relations (one group per record) with the declared ranges and relations always kept; an irreducible set need not be smallest.",
 "Linear programs use the bounded-variable working-set primal simplex described under preference_decision.exact (Bland's rule on rows, single-variable phase one, every outcome rechecked by NNLS dual fit, Farkas multipliers or an improving ray).",
 "A learned set is a range over the stated assumption that choices were optimal under the declared model and recorded expectations; it is not a probability statement.",
 "The exact-rational reference (preference_set_learning_reference.py: vertex enumeration in fractions, exhaustive conflict subsets, tolerance by enumeration in (theta, s)) was written by the same author in the same development effort as the implementation, not by an independent reviewer; no method review has been recorded.",
]
