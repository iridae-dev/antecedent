implementation_deviations = [
 "Binomial logit and probit fits use probability clamps and optionally replace a separated fit with a ridge-penalized refit using default lambda 1e-4.",
 "Negative-binomial dispersion is selected by a repository policy: fixed alpha, a Poisson-based method-of-moments estimate, or a safeguarded nested one-dimensional MLE.",
 "Convergence, separation, iteration limits, and numerical clamps are implementation policies rather than claims of reproducing one algorithm from the cited sources.",
 "The IRLS iteration is damped by step halving on the deviance, so it is Fisher scoring with a line search rather than the plain recursion of the cited sources; the ridge refit is undamped Fisher scoring on the penalised objective. Prior weights, the zero-weight handling, the always-on ridge (lambda/2 |beta|^2 with an unpenalised constant first column) and the reported weighted-fit deviance (unweighted except for Gaussian) are repository definitions."
]

