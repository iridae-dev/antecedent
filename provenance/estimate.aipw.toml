# Derived from the AIPW/Neyman-orthogonal score, NOT the exact estimator analyzed
# in Chernozhukov et al. (2018). Untrimmed AllObserved fits use five-fold cross-fitting
# with a seeded, arm-stratified, unit-level fold plan (the point estimate does not depend
# on the requested SE kind); ATT/ATC, trimmed, and predicate-target fits fit the GLM
# propensity and the OLS outcome regressions on the full sample, and there the DML
# convergence-rate and Donsker-free guarantees do not transfer (Funk et al. (2011) is the
# applicable citation). Their analytic SE adds the exact stacked-M terms for the logistic
# and per-arm OLS fits for ATE-type targets, and the efficient-influence-function form,
# valid only when both nuisances are consistent, for ATT/ATC.
implementation_deviations = [
 "no cross-fitting on the ATT/ATC, trimmed, and predicate-target paths: propensity and outcome nuisances are fit on the full sample, so Chernozhukov et al.'s sample-splitting premise is not met there and its rate conditions are not inherited",
 "nuisance families are fixed GLM (propensity) and OLS (outcome), not the arbitrary ML learners the DML analysis admits",
]

upstream_implementations_observed = [
 { project = "dowhy", exposure = "black-box comparison only", notes = "the recorded DoWhy run used backdoor.propensity_score_weighting; no DoWhy AIPW output is compared" },
]

test_sources = [
 "crates/antecedent-estimate/tests/aipw_reference.rs (60-digit trimmed ATE with the case-mass derivative over every row, ATT and ATC efficient influence function, and the cross-fitted ATE on recorded folds)",
 "independently generated synthetic confounded SCM with known ATE (shared with propensity estimators)",
 "conformance/estimate/aipw (synthetic known-truth fixture: the point estimate is checked against true_effect within tolerance; its recorded DoWhy block ran backdoor.propensity_score_weighting, not AIPW, so no external AIPW estimate or SE is compared)",
]

[method_review]
status = "reviewed_with_limits"
scope = "AipwAte::fit in crates/antecedent-estimate/src/aipw.rs and src/aipw/scores.rs for the three routes without a penalised propensity: the cross-fitted untrimmed ATE on a recorded fold assignment (per-fold arm least squares and unpenalised logistic propensity, clip), the full-sample trimmed ATE with its stacked-equation influence (logistic fitted on every row, arm regressions and average on the retained rows), and the full-sample ATT and ATC with the centred efficient influence function. Not the bootstrap, penalised propensities, cluster-DML, sampling weights, custom targets, or the cluster, multiway and HAC kinds."
assumptions = ["Unconfoundedness given the adjustment set and positivity are identification assumptions taken as given.", "Independent rows; the default standard error is the sample standard deviation of the influence values over the square root of the number of rows.", "The ATT and ATC standard errors are the efficient influence function and are valid only when both nuisance models are consistent, as the record states; they are reproduced here, not proved."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the product source named in its scope, including the numerical helpers it calls, and compared results with definitions evaluated by executing references written for this review; no upstream implementation or test source was consulted or copied. The cited publications were not retrieved in this review: the correspondence is between the product code and the standard definitions those works state, verified numerically, not a page-level reading of the papers."
redistribution = "Primary work is cited, not redistributed. The reference script and its frozen output are repository-authored (MIT OR Apache-2.0); the script uses mpmath (BSD-3-Clause), imported at run time and not redistributed here. The script declares its inline script metadata but is not run in a locked, isolated environment and is not wired into any gate; its output is frozen in the JSON file and compared by the test."
limitations = "The trimmed ATE is compared on four tables of 60 to 80 rows (a trim at 0.1 and 0.15, a trim with a clip at 0.2, an outcome offset of 1e7, strong selection), the ATT and ATC on three tables of 60 to 80 rows (a clip at 0.1 and an outcome offset of 1e7), and the cross-fitted ATE on the five untrimmed five-fold tables of the DML reference (recorded folds, clips, offsets, near-collinear covariates). Effects are asserted to 1e-8 (1e-6 for the cross-fitted route, whose logistic solver stops near 1e-8) and standard errors to 1e-6 (1e-5). The n/(n-1) divisor over all rows is the product's convention for the trimmed route and is reproduced. The ATT and ATC variance is compared with the stated efficient influence function, not with the exact case-mass derivative, which it is not under a misspecified model. Nothing here bears on coverage or on the other nuisance families. The reference script is not run in a locked, isolated environment and is not wired into any gate; its output is frozen in the JSON file and compared by the test."
sources = ["https://doi.org/10.1111/ectj.12097", "https://doi.org/10.1093/aje/kwq439", "https://mpmath.org/"]
findings_resolved = ["Defect repaired: for a trimmed ATE the logistic propensity is fitted on every row but its stacked-equation correction used only the retained rows (the score, the information and the influence vector), so the rows trimmed from the average were missing from the variance although they shape the propensity. The influence is now formed over every row of the problem with the propensity block from all rows and the outcome blocks from the retained rows, and equals the case-mass derivative of the whole refitted estimator; the standard error moved by 0.3 to 0.9 percent on the reference tables.", "The ATT and ATC effects and centred efficient-influence standard errors equal the multiprecision references, including a clip at 0.1 and an outcome offset of 1e7.", "The untrimmed ATE equals the cross-fitted reference on a recorded fold assignment, for effect and standard error, with clips, offsets and near-collinear covariates."]
