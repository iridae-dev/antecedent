# Derived from the AIPW/Neyman-orthogonal score, NOT the exact estimator analyzed
# in Chernozhukov et al. (2018). Untrimmed AllObserved fits use five-fold cross-fitting
# with a seeded, arm-stratified, unit-level fold plan (the point estimate does not depend
# on the requested SE kind); ATT/ATC, trimmed, and predicate-target fits fit the GLM
# propensity and the OLS outcome regressions on the full sample, and there the DML
# convergence-rate and Donsker-free guarantees do not transfer (Funk et al. (2011) is the
# applicable citation). Their analytic SE adds the exact stacked-M terms for the logistic
# and per-arm OLS fits for ATE-type targets, and the efficient-influence-function form,
# valid only when both nuisances are consistent, for ATT/ATC. Under the default iid SE those
# full-sample influence values are leverage-corrected (HC3-style) before the variance: each
# centred value is divided by 1 - h_i, h_i the larger of the row's mass share m_i / sum m (1/n
# unweighted) and its weighted least-squares leverage in the outcome arm the score uses for it.
implementation_deviations = [
 "no cross-fitting on the ATT/ATC, trimmed, and predicate-target paths: propensity and outcome nuisances are fit on the full sample, so Chernozhukov et al.'s sample-splitting premise is not met there and its rate conditions are not inherited",
 "nuisance families are fixed GLM (propensity) and OLS (outcome), not the arbitrary ML learners the DML analysis admits",
 "on the full-sample paths under the iid SE kind the influence values are leverage-corrected before the variance (HC3-style, MacKinnon and White 1985): each centred value is divided by 1 - h_i, h_i = max(m_i / sum m, weighted OLS leverage of the row in the outcome arm the score uses: both arms for the ATE, the control arm for the ATT, the treated arm for the ATC), capped at 0.99. The plug-in variance of heavy-tailed influence values (sampling weights under informative selection) is biased low at practitioner sizes; every h_i tends to zero, so the asymptotic variance is unchanged. The propensity fit's own leverage is not included. Cross-fitted routes and the cluster, multiway and HAC kinds read the influence uncorrected",
]

