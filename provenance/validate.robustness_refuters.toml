# Placebo-treatment, dummy-outcome, random-common-cause, and data-subset refuters are
# standard robustness diagnostics in applied causal-inference practice (replace the
# treatment/outcome with noise or an irrelevant covariate and check the estimate
# collapses/holds as expected). No single paper introduces this exact battery of checks
# as a formal methodology; it is folklore practice that predates and is independent of
# any particular software implementation. Honestly left with no primary citation rather
# than inventing one — see report for detail.
papers = []

upstream_implementations_observed = []

test_sources = [
 "crates/antecedent-validate/tests/robustness_refuters_reference.rs (exact-rational replicate refits on library-RNG perturbations, 60-digit erfc p-value, verdicts)",
 "crates/antecedent-validate/src/placebo.rs unit tests",
 "crates/antecedent-validate/src/dummy_outcome.rs unit tests",
 "crates/antecedent-validate/src/rcc.rs unit tests",
 "crates/antecedent-validate/src/data_subset.rs unit tests",
 "conformance/validate/refuters",
 "crates/antecedent-validate/tests/refuters.rs",
]

[method_review]
status = "reviewed_with_limits"
scope = "PlaceboTreatment (Gaussian replacement and permutation), DummyOutcome, RandomCommonCause and DataSubsetRefuter on a static linear-adjustment problem, with the replicate loop they share in crates/antecedent-validate/src/common.rs (noise_replace_refute, finish_p_report, replicate_p_value, with_row_subset): the per-replicate perturbation streams (base + r), the least-squares treatment coefficient of each refit (the extra noise covariate is added to the adjustment set for the random common cause), the replicate mean, the two-sided normal p-value of the null value under N(mean, sample SD) computed as erfc(|z|/sqrt 2), the zero-spread rule, the verdict p >= alpha, and the honouring of the replicate count, alpha and subset fraction. Not the contiguous-window subset used for one-series temporal designs, the panel-slice path, a composed or Bayesian refitter, or the least-squares solver itself (the linear adjustment estimator's own record)."
assumptions = ["The four checks are applied-practice diagnostics with no single primary source (the record states papers = []); this review checks the code against the stated definitions, not against any causal-validity criterion.", "The p-value is deliberately the typicality of one null value under the replicate distribution (z uses the replicate SD, not SD/sqrt R), as the field documentation states; the review confirms that, it does not endorse it.", "Perturbations are the library streams (standard-normal fills, shuffles, Bernoulli row masks), regenerated by the test and asserted equal to the frozen ones."]
historical_exposure = "Historical author exposure cannot be independently established. This review read placebo.rs, dummy_outcome.rs, rcc.rs, data_subset.rs and the shared loop in common.rs and wrote its own reference from the stated definitions in exact rational arithmetic with an 80-digit erfc; no upstream implementation (the DoWhy battery these checks resemble) was consulted. No paper was consulted; the DoWhy software paper named in the triage as a candidate was not retrieved and is not cited."
redistribution = "The reference script, frozen output and Rust test are repository-authored under MIT OR Apache-2.0; mpmath is not a product dependency."
limitations = "No primary source is cited because none was located; the checks are verified against their own stated definitions only. The comparison covers four designs (offsets of 1e5 and 1e6, an exactly noiseless outcome with zero replicate spread, and a treatment with 5 of 40 rows treated), replicate counts 20 and 7 and significance levels 0.05 and 0.5, two subset fractions (0.8 and 0.55), at 1e-8 relative on the replicate mean and 1e-6 absolute on the p-value, with verdicts compared exactly. Rows with missing values, sampling weights, ATT or ATC targets, temporal series and panels are not exercised, so a weights or missing-data handling defect in these refuters would not be found here. The refuters are informative = false by design: a pass says the OLS refit is stable under the perturbation, not that the causal claim holds."
sources = ["https://mpmath.org/doc/1.3.0/", "https://docs.python.org/3/library/fractions.html"]
findings_resolved = ["The placebo (both modes), dummy-outcome, random-common-cause and data-subset refuters agree with the exact reference on every design, replicate count, alpha and subset fraction: replicate means, p-values and verdicts, including the zero-spread rule, and the replicate count, alpha and subset fraction each change the report. No defect found in the reviewed paths."]
record_sha256 = "df902de56e79ea3fac8b4d3f8dcc27b3c286f94f1bc995ec5fc13d6b4d64db07"

