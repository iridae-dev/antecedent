# Covers crates/antecedent-validate/src/stability/*.rs: block-bootstrap orientation and
# link-frequency stability, regime stability, false-positive checks via permutation /
# phase-randomization surrogates, synthetic-null FPR calibration, environment holdout, and
# PCMCI parameter grids. The underlying resampling and surrogate primitives have primary
# sources (below); running discovery repeatedly under those perturbations and reporting
# retention frequencies / FPR calibration is a standard discovery-robustness pattern with
# no single introducing paper distinct from the primitives themselves. Honestly reported
# rather than inventing a wrapper-methodology citation — see report for detail.
papers = [
 { title = "The Stationary Bootstrap", doi = "10.1080/01621459.1994.10476870", sections = ["Dependent-series bootstrap motivation and contrast with the fixed-block implementation"] },
 { title = "Testing for Nonlinearity in Time Series: The Method of Surrogate Data", doi = "10.1016/0167-2789(92)90102-S", sections = ["Permutation and phase-randomized surrogate nulls"] },
]

implementation_deviations = [
 "Block-bootstrap checks use fixed-length moving blocks, not the cited stationary bootstrap's geometrically distributed block lengths. Blocks are joined with twice-the-maximum-lag missing rows at each junction so no lagged window mixes two blocks (and none straddles two regimes); the complete within-block windows PCMCI-family runs keep are the effective sample.",
 "Synthetic-null and false-positive checks count candidate lagged links as every ordered variable pair at each lag of min_lag..max_lag, and judge the empirical rate by a band whose standard error is the larger of the binomial value over all link trials and the run-to-run spread (no absolute floor); the surrogate false-positive check is one-sided.",
 "Orientation, regime, link-frequency, parameter-grid, synthetic-null, and environment-holdout wrappers and their replicate counts or verdict thresholds are repository-defined.",
 "The synthetic-null calibration runs discovery at its declared alpha, replacing the level carried by the supplied PCMCI configuration, so the empirical rate and the band refer to the same level. The environment holdout refuses a split whose discovery and holdout environments overlap.",
 "The surrogate citation supports the null-data primitives, but repeated PCMCI-family discovery and edge-frequency/FPR summaries are not procedures introduced by that paper.",
]

upstream_implementations_observed = [
 { project = "tigramite", exposure = "black-box comparison only" },
]

test_sources = [
 "crates/antecedent-validate/src/discovery_stability_reference_tests.rs (perturbations regenerated from the library streams and compared with a frozen record; wrapper reports compared with an exact-rational tabulation, verdicts and layout in crates/antecedent-validate/tests/oracle_data/discovery_stability_reference.py)",
 "crates/antecedent-validate/src/stability/orientation.rs unit tests",
 "crates/antecedent-validate/src/stability/regime.rs unit tests",
 "crates/antecedent-validate/src/stability/false_positive.rs unit tests",
 "crates/antecedent-validate/src/stability/null_calibration.rs unit tests",
 "crates/antecedent-validate/src/stability/env_holdout.rs unit tests",
 "crates/antecedent-validate/src/stability/pcmci_grid.rs unit tests",
]

[method_review]
status = "reviewed_with_limits"
scope = "The perturbation and tabulation numerics of the six wrappers in crates/antecedent-validate/src/stability: the gapped moving-block layout (a separator of twice the maximum lag in missing rows wherever the next drawn row does not follow its predecessor, values and validity of every position, no window of gap plus one valid rows straddling a junction), the link-retention frequencies and their order for block bootstrap, orientation (directed, undirected, conflict rate), labelled-regime and parameter-grid (alpha, lag window, CI test) runs, the lagged-link family size, the standard error of a null-hit rate (the larger of the binomial value and the run-to-run spread), the surrogate false-positive verdict, the synthetic-null band, and the environment-holdout shared fraction and Jaccard index with their undefined cases. The block, surrogate and noise draws are the library streams; the discovery runs on each perturbed series are the PCMCI, PCMCI+, RPCMCI and J-PCMCI+ engines, which are reviewed in their own records and are inputs here, not recomputed. Also the workspace handling of the engines these wrappers reuse across replicates (crates/antecedent-discovery/src/engine.rs, pcmci_plus.rs, jpcmci_plus.rs, lpcmci_phases.rs). Not a review of any engine's decisions, of the CI tests, of the panel or vector-variable variants, or of whether a retention frequency is a good measure of structural reliability."
assumptions = ["Each replicate's discovery result is what the reviewed engine returns on the perturbed series; the per-replicate link sets and graph classifications are frozen from the library and only their tabulation is independent.", "The labelled-regime search is defined as PCMCI+ on the lagged-frame windows lying wholly inside each regime, each on a fresh workspace, skipping a regime with fewer rows than the minimum or too few windows; the test derives it from that definition rather than calling the regime search.", "A wrapper that holds its own value for a quantity the discovery configuration also carries runs at the wrapper's declared value."]
historical_exposure = "Historical author exposure cannot be independently established from retained artifacts. This review read the six stability wrappers and the engine workspace code named in its scope and compared results with definitions evaluated by an executing reference written for this review; no upstream implementation or test source was consulted or copied. The cited publications (stationary bootstrap, surrogate data) were not retrieved in this review: the fixed-block resampling deliberately departs from the first and the correspondence recorded is to the wrappers' own stated definitions, not to a page-level reading of either paper."
redistribution = "The reference script, frozen record and Rust test are repository-authored (MIT OR Apache-2.0); the script uses only the Python standard library (fractions, decimal, json). Its inputs section is produced by the library (the ignored dump test in the Rust file rewrites it) and its expected section is rewritten from the definitions alone."
limitations = "One seeded design per wrapper over two or three variables and at most 240 rows: three gapped layouts (blocks of 7, 45 and 10), an eight-replicate PCMCI block bootstrap, an eight-replicate PCMCI+ orientation run on a strong collider and on a weak two-variable coupling (the latter with fractional undirected frequency), a five-replicate labelled-regime run in which one regime is skipped in one replicate, ten-replicate column-permute and phase-randomised false-positive checks at alpha 0.3 (one passing, one failing), a twelve-run synthetic-null band, six environment-holdout splits including empty discovery sets, and alpha, lag-window and CI-test grids. Frequencies and rates agree with the exact counts to 1e-14; the verdicts have a margin of at least 1e-9 from their boundaries. The discovery decisions on each perturbed series are not independently recomputed (the engines are reviewed elsewhere), so a defect that changes what an engine returns on a gapped series would pass here unless the labelled-regime window definition catches it; that no lag window mixes two blocks rests on the separator width of twice the maximum lag being the frame depth of the engines, which is read, not tested against a series built to straddle a junction. The Jaccard index of two empty link sets (undefined) is covered only by the module's own unit test, not by a wrapper run, since the design never produced two empty sets. The orientation conflict rate is zero in both designs, so the conflict branch is not exercised. The coverage of retention frequencies as a measure of structural reliability, the calibration of the false-positive bands for other designs, and panel or masked-data behaviour beyond the existing refusal tests are not measured. Since the original frozen comparison, the bound engines gained CI-resolution checks and changes to FDR families, collider orientation and LPCMCI evidence. Those engine changes can affect replicate results. The current central rerun of the stability tests, including the frozen tabulation reference, passes, but the tabulation reference does not independently validate the engines' decisions. The full-series moving-block refusal is checked by a module unit test, not by the frozen independent reference; no new reference campaign was run for this change. The cited papers were not retrieved. Scoped 2026-11-07 source re-review compared the bound PCMCI+ and LPCMCI files with 875f575bd and 73e7c5c6b respectively: frame admission remains before workspace mutation and the MCI adjacency and ordered result assembly preserve their prior behavior. PCMCI+/JPCMCI+ and LPCMCI focused unit tests passed. This check did not rerun the independent frozen stability reference or extend its engine-decision scope. Scoped 2026-11-07 source re-review compared J-PCMCI+ admission and dummy-CI preparation against the previously bound implementation: empty and overlapping variables, temporal options, memory/CI checks, logical dummy blocks and workspace preparation retain their ordering. Exact pre-pooling refusal and multivariate-dummy engineering tests passed; no independent reference or calibration artifact was regenerated. Scoped 2026-11-07 follow-up source re-review compared phase-score orientation against the preceding bound implementation: exogenous/system partition, system-only symmetrization, ordering and forced exogenous orientation are unchanged after thresholding. The exact rejected-context engineering test passed; no independent reference or calibration artifact was regenerated. Scoped 2026-11-07 follow-up source re-review compared ancestral conditioning-candidate extraction with the preceding bound module: shifted known parents, sorted deduplication, endpoint exclusions and removal of definite parents from the search pool retain their original order. The exact survivor-score engineering test passed; no independent reference or calibration artifact was regenerated."
sources = ["crates/antecedent-validate/src/discovery_stability_reference_tests.rs", "crates/antecedent-validate/tests/oracle_data/discovery_stability_reference.py"]
findings_resolved = ["A workspace reused from one replicate to the next replayed a validity mask cached for the previous replicate's lagged frame (same shape, different missing rows) in PCMCI+, J-PCMCI+ and LPCMCI frames; a replicate then lost links silently (a regime found none where a fresh workspace finds two), biasing every stability frequency built on PCMCI+-family replicates. The mask cache is now cleared where each frame is installed; failing-first test discovery_stability_reused_workspace_does_not_replay_validity_masks.", "SyntheticNullCalibration declared an alpha, reported it as the level used for discovery, and judged the empirical rate against it, while discovery ran at the level of the supplied PCMCI configuration. It now runs discovery at the declared alpha; failing-first test discovery_stability_synthetic_null_runs_discovery_at_the_declared_alpha.", "EnvironmentHoldout accepted a split whose estimation (holdout) environments included a discovery environment, so the holdout was not held out. It now refuses an overlapping split; failing-first test discovery_stability_environment_holdout_refuses_overlapping_environments.", "A full-series moving block has only one possible start and therefore reproduces the input on every replicate. Block-bootstrap, orientation and regime stability now refuse block_size equal to the series length; the module unit test checks all three refusals.", "In the original reference designs, layouts, link frequencies and order, the standard error, family sizes, verdicts and the holdout agreement match the exact reference."]
record_sha256 = "c9ec3e3bf09ac4d0caf94aa86e4bc70d53c02fea00baa8ba0da0ed418139bb8e"

