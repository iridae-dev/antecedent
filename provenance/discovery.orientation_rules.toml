]

[method_review]
status = "reviewed_with_limits"
scope = "The static FCI orientation phase (default_fci_rules in crates/antecedent-discovery/src/rule_scheduling.rs run to a fixed point on the skeleton and sepsets of Fci::run) under a perfect m-separation oracle with no selection variables: the adjacencies and endpoint marks of the returned PAG against the invariant marks of the Markov equivalence class of maximal ancestral graphs. Not a review of the LPCMCI rule list (which keeps the primed R9 and R10); RFCI shares the same R9 and R10 and is reviewed in its own record, of the discriminating-path and uncovered-path budgets beyond the exercised sizes, of finite-sample CI errors, or of selection variables (R5-R7), which are not implemented."
assumptions = ["The data-generating mixed graph is a maximal ancestral graph without selection edges (no directed or almost-directed cycle; every non-adjacent pair m-separated by some set); the CI oracle answers exactly its m-separation statements.", "Two MAGs are in one Markov class when every pair has the same m-separation verdict against every conditioning set; the PAG of a class carries an endpoint mark exactly where all members agree and a circle elsewhere.", "With the oracle and no selection variables the Zhang rules R1-R4 and R8-R10 are complete, so the PAG FCI returns equals the invariant PAG."]
historical_exposure = "Historical author exposure cannot be independently established. This review read the product source and wrote a separate reference of its own from the definition; no upstream implementation or test source was consulted or copied."
redistribution = "The references are repository-authored under MIT OR Apache-2.0 and run inside the crates' own tests; the primary sources are linked by DOI and are not redistributed."
limitations = "The primary sources were not re-read in this review (no downloads were made and no copy was read from this environment); the rule statements used for R9 and R10 are the standard ones from memory of the definitions and a mistake in how they are stated would not be detected here, though the class-invariant reference does not depend on them. The sweep is exhaustive on three and four nodes (11 and 248 classes) in the ordinary run and on five nodes in an ignored test that takes about three minutes unoptimized (19 seconds in release). Six or more nodes, finite-sample CI behaviour and the discriminating-path and uncovered-path budgets are not exercised. LPCMCI orientation keeps the primed rules and is not covered by this review. Calibration remains deferred."
sources = ["https://doi.org/10.1016/j.artint.2008.08.001", "https://doi.org/10.48550/arXiv.2007.01884"]
findings_resolved = ["Every maximal ancestral graph on three and four nodes (and, in the ignored run, five nodes) was grouped by m-separation signature from an independent simple-path oracle; for each class FCI under that oracle returns the class's adjacencies and exactly the class-invariant endpoint marks (no missed tail, no missed arrowhead, no unsound mark).", "Defect found and fixed: static FCI applied the stricter primed R9 and R10 of the time-series algorithm, which start the uncovered path at a neighbour of the edge's source and need a separating-set condition, instead of Zhang's R9 and R10. On a four-node graph (1 -> 0 <- 2 with 1 o-o 3 o-o 2) the primed R9 left the tails at 1 and 2 as circles that every member of the class shares. Static FCI now uses Zhang's R9 and R10 (new ZhangR9 and ZhangR10, scanning every node because a change anywhere along a path can complete it); the primed rules stay in LPCMCI, and RFCI now uses the same unprimed rules."]
