implementation_deviations = [
 "The static FCI rule set omits Zhang R5-R7, so it is not the complete orientation rule set when selection-bias tail-tail structures are possible.",
 "Static FCI applies Zhang's unprimed R9 and R10 (ZhangR9, ZhangR10); LPCMCI reuses the primed R9 and R10: R9 adds a weakly-minimal-sepset requirement and R10 requires globally node-disjoint uncovered paths, both stricter than Zhang's unprimed rules.",
 "R4 discriminating paths are capped at 64 paths and length 8; R9 and R10 uncovered-path searches are capped at 8 paths and length 8, with fail-closed budget errors.",
 "Contradictory orientations are represented by implementation-specific conflict endpoints rather than a paper-defined PAG mark.",
]

