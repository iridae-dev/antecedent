 { title = "Causality", citation_note = "Previously recorded title and bibliographic detail: Causality: Models, Reasoning, and Inference", doi = "10.1017/CBO9780511803161", sections = ["Structural causal models", "interventions (mutilated-model / do-operator semantics)"] },
]

