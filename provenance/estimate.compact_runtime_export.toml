copied_tests = false

# A durable, portable container for a fitted linear-in-coefficients effect model: a finite basis
# (intercept, linear, polynomial and one-hot terms), the coefficient vector, its covariance, the
# declared support of every input and a refusal mask, bound by one BLAKE3 identity. Evaluation is
# the point prediction b'phi(x) and the model-based standard error sqrt(phi' V phi), the textbook
# variance of a linear combination. papers = [] is an explicit judgment: this module is
# serialization, identity binding and bounded evaluation (original engineering) over standard
# linear algebra, and no paper introduces it. The coefficients and covariance it carries are
# produced by other records (for example b4_vector_treatment), which carry their own citations.
papers = []

implementation_deviations = [
  "Claim policy: the supported claim is the POINT prediction f(x) = b'phi(x) inside the declared support and outside the refusal mask. The model-based standard error sqrt(phi' V phi) is a reported diagnostic with calibration 'unmeasured'; it is not an interval, not a coverage claim, and carries no extrapolation or misspecification uncertainty. No coverage record is allocated.",
  "Evaluation refuses (never extrapolates or clamps) a query outside the declared support of any input, a missing or unknown quantity, a query matching a refusal-mask region even inside the support, a wrong query type, and a non-finite result or negative variance.",
  "A consumer verifies the identity over every semantic field (response quantity, inputs and supports, terms, coefficients, covariance, mask and scope statements) and the premises and data digests, so a change to any of them is refused even when the container is resealed with recomputed section checksums. A consumer holding no retained expected identity checks only internal consistency; a forgery passes only under the forger's own identity.",
  "Decode is bounded (byte size, term, input, mask-region and level counts) and refused before decoding when the declared size is oversized. Term and input order is canonicalised so permuted specifications share one identity.",
  "The export does not check that the supplied coefficients and covariance came from a valid estimator; covariance must be symmetric positive semidefinite and finite, nothing more.",
]

upstream_implementations_observed = []

test_sources = [
  "crates/antecedent-io/tests/compact_export.rs",
  "python/tests/test_compact_export.py",
]

[method_review]
status = "reviewed_with_limits"
scope = "The evaluation arithmetic of the compact runtime export in antecedent-io-core compact_export.rs: the basis row (intercept, linear, integer power and one-hot terms), the point prediction b'phi, the model-based standard error sqrt(phi'V phi) from the stored dense covariance, the negative-variance guard, and the build-time covariance admissibility checks (symmetry, non-negative diagonal, pairwise correlation bound and the full positive-semidefinite pivot test). Not a review of the container, identity, tamper and reseal machinery, of support and mask refusals (covered by hand-valued tests in the same file), or of how a producer obtains the coefficients and covariance."
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the product source named in its scope and compared results with definitions evaluated by an executing reference written for this review; no upstream implementation or test source was consulted or copied."
redistribution = "No work is redistributed; the linear predictor and the quadratic-form variance are textbook. The reference script and its frozen output are repository-authored (MIT OR Apache-2.0); mpmath is not a product dependency."
limitations = "Two exported models (a quartic power basis with five terms and a quadratic with two one-hot levels; dense covariances A'A for small dyadic A) are evaluated at six supported abscissae and three levels, 24 queries in all, and compared to 1e-12 relative for the point and 1e-10 relative for the standard error. The indefinite-covariance refusal is checked on one three-term matrix whose pairwise bounds all hold. High-degree bases near the degree limit, query values at 1e8 scale, and covariances that are positive semidefinite only to the 1e-9 tolerance are not exercised. The reference script declares inline script metadata but is not run in a locked environment and is not wired into a gate; its output is frozen in the JSON file."
assumptions = ["The stored coefficients and covariance are the fitted model's, taken as given; the export neither refits nor validates them against data.", "The standard error is model-based and carries no extrapolation or misspecification uncertainty; calibration is unmeasured, as the artifact states.", "Powers are small integer degrees (default limit 8) of inputs inside their declared support."]
sources = ["https://en.wikipedia.org/wiki/Variance#Linear_combinations", "https://mpmath.org/doc/1.3.0/"]
findings_resolved = ["The point prediction and the model-based standard error equal the exact rational point and the 50-digit root of the exact quadratic form on all 24 queries, including the closed support bounds, the one-hot levels and a dense covariance with off-diagonal terms (so the cross terms of phi'V phi are exercised, not only the diagonal).", "A covariance that satisfies every pairwise bound but has a negative determinant, an asymmetric covariance and a negative diagonal are refused at build, and the identity covariance is accepted.", "No product defect was found in this record."]
record_sha256 = "be46d5de29d1b4f91234a5e3be84e91095aec47b2e59b381c970957886569495"

