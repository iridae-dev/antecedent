 "crates/antecedent-io/tests/sample_split_parent_set_effect_reference.rs (acceptance over every marked four-node graph; the route for both versions and scales against exact least squares)",
 "crates/antecedent-io/src/measured_inference/split_parent_set_effect.rs unit tests (reported effect, conflict resolution)",
 "crates/antecedent/tests/sample_split_parent_set_effect_facade.rs",
 "crates/antecedent/tests/sample_split_parent_set_effect_calibration.rs",
 "python/tests/test_sample_split_parent_set_effect.py",
]

[method_review]
status = "reviewed_with_limits"
scope = "The parent-set route in crates/antecedent-io/src/measured_inference/split_parent_set_effect.rs: treatment_parent_set (accepted only when every edge incident to the treatment is directed; undirected edges elsewhere listed and never completed; ambiguity checked before an outcome oriented into the treatment), the regression it reuses (adjusted_effect, reviewed under discovery.sample_split_effect), reported_effect (the identity scale, or for a log-linear study the mean ratio exp(shift b), the ordered exponential image of the interval and the delta-method standard error ratio |shift| se), the log transform of every searched column before the split, and version 1 (half) and version 2 (three-quarter) discovery fractions through the split by definition. The conflict-resolution orientation (treatment_parent_set_under_conflicts, resolve_incident_orientation), the PC search and the calibration are not reviewed here."
assumptions = ["Linear Gaussian on the analysis scale, causal sufficiency, strong faithfulness, bounded degree and an oriented treatment neighbourhood are the measured family's premises, not checked by the review.", "The frozen ten-variable data are built so that the treatment is a collider of two independent parents, so the class orients every treatment edge and the true parents are the expected parent set; discovery is not reproduced in the reference.", "The intervention mean ratio is a monotone image of the log-scale coefficient, so the ordered image of the interval is the interval of the ratio under the same Student argument."]
historical_exposure = "Historical author exposure cannot be independently established from retained artifacts. This review read the product source named in its scope and compared results with definitions evaluated by an executing reference written for this review; no upstream implementation or test source was consulted or copied. The cited publications were not retrieved in this review (no paper was downloaded or read here): the correspondence is between the product code and the standard definitions those works state, verified numerically, not a page-level reading of the papers."
redistribution = "The reference script and its frozen output are repository-authored (MIT OR Apache-2.0); the script uses only the Python standard library and mpmath (BSD-3-Clause, imported at run time and not redistributed). It declares inline script metadata but is not run in a locked, isolated environment and is not wired into any gate; its output is frozen in the JSON file and compared by the test."
limitations = "Acceptance: every acyclic marked graph on four nodes with two treatment/outcome choices (7,212 cases) agrees with the definition. Route: one 1,000-row ten-variable dataset, one split seed, both protocol versions, the linear and the log-linear scale, and shifts of 0.5 and -0.75 (which reverses the interval before ordering), agreeing with exact least squares on the definition-level split rows to 1e-8 relative; a unit test also covers shifts 1.0 and 0.001. Not covered: conflicting-orientation resolution, a parent limit that binds, background knowledge, graphs above ten variables, the collider budget, heteroskedastic errors, and any coverage claim (the measured calibration is the evidence). The data have a version that was first drafted with a near-cancelling path and was discarded because PC then failed to orient the treatment, which is a property of the draft, not of the product. The Maathuis, Kalisch and Buhlmann identifiability argument that the treatment's parents are the same in every member of the class was not retrieved or re-derived in this review; the executed check is that the code accepts exactly the patterns with every treatment edge directed."
sources = ["crates/antecedent-io/tests/sample_split_parent_set_effect_reference.rs", "crates/antecedent-io/tests/oracle_data/sample_split_pipeline_reference.py", "crates/antecedent-io/tests/oracle_data/sample_split_parent_set_effect_reference.py", "https://mpmath.org/"]
findings_resolved = ["The regression this route shares with discovery.sample_split_effect refused designs with large offsets as singular; it is repaired there (centring and Householder QR) and this route inherits the repair; the facade suite of this route (35 tests) passes.", "No defect found in the acceptance rule, the reported effect (including a negative shift) or the split fractions: all agree with the definition-level references.", "Added a unit test of reported_effect for shifts 0.5, 1, -2 and 0.001 and the linear passthrough."]
