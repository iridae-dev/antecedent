# Discovery on one half of the rows, estimation on the disjoint other half, accepted on the
# treatment's parent set. The single-split idea is cited as the closest published statement. The
# parent-set acceptance rests on the fact that an edge incident to a node that is directed in a
# completed partially directed graph is directed in every member of the class, so the node's
# parents are the same in every member and their adjustment gives the total effect for the whole
# class (the identifiability condition of the IDA procedure); the whole-method coverage statement
# and the measured family are original bookkeeping. PC and partial correlation are the standard
# constraint-based algorithm and test, reimplemented in this repository; the delta-method standard
# error and the exponential image of the log-scale interval are textbook.
papers = [
  { title = "A note on data-splitting for the evaluation of significance levels (Cox, Biometrika 62, 1975)", doi = "10.1093/biomet/62.2.441", sections = ["selection on one part of the data and evaluation on the other"] },
  { title = "Causation, Prediction, and Search (Spirtes, Glymour, Scheines, 2nd ed., MIT Press, 2000)", doi = "10.7551/mitpress/1754.001.0001", sections = ["the PC algorithm and collider orientation"] },
  { title = "Estimating high-dimensional intervention effects from observational data (Maathuis, Kalisch, Buhlmann, Annals of Statistics 37, 2009)", doi = "10.1214/09-AOS685", sections = ["effects identified by the parents of the treatment when its edges are oriented in the CPDAG"] },
]
implementation_deviations = [
  "The interval's coverage is a measured property of the whole method over the declared family (linear Gaussian on the analysis scale, causally sufficient, strongly faithful, maximum degree four, ten to twenty variables, an oriented treatment neighbourhood). It is not a statement about the graph discovered on one dataset: faithfulness and causal sufficiency are not testable from that dataset.",
  "The class is accepted when every edge incident to the treatment is oriented. Undirected edges elsewhere are listed on the result and never completed. An undirected edge at the treatment, an exhausted search bound or a parent limit that removed adjacencies reports no interval; a declared completion is a different design with no record.",
  "Conflicting orientation evidence (colliders that disagree about an edge, so that the orientation applied first has propagated) refuses only when it can change the treatment's parents. The skeleton is oriented again under every choice among the implicated colliders (each kept, or declared a non-collider by adding its centre to the separating set; at most eight colliders, 256 orientations) and the parents are accepted when the treatment's edges are oriented the same way in every choice that leaves no conflict. The choice-dependent case, a conflict no choice removes and a budget crossing are refused with their own details. Colliders outside the implicated closure are kept in every choice, as in a conflict-free run, so the statement measured is for this rule applied to the whole procedure.",
  "PC runs with a conditioning-set size and a parent limit equal to the declared maximum graph degree. The parent limit removes adjacencies no test separated, so a run in which it bound is refused rather than reported.",
  "A log-linear study applies the natural logarithm to every searched column before the split and analyses that scale; the reported intervention mean ratio is the exponential of the log-scale coefficient times the prespecified shift and its interval is the exponential image of the log-scale Student interval, whose delta-method standard error is reported as well.",
  "The test, threshold, split share and level are fixed to the measured values and are not request fields.",
]
