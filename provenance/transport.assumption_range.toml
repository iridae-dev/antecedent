# Assumption range for a violated transport premise: the transported quantity may differ from
# the point value by a declared additive or proportional shift s in [0, bound]; the range at s
# is [v - s, v + s] or [v - s|v|, v + s|v|], evaluated at declared grid points and carried
# through the existing sensitivity artifact. A one-parameter bias model; no primary paper.
