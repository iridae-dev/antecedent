# Original retention, dependency binding and execution instrumentation over existing
# adjusted regression estimators. Numerical derivations remain owned by estimate.glm,
# estimate.adjustment and the vector/categorical treatment provenance records.
papers = []
implementation_deviations = [
  "Uses the shared RecalcPlan and RecalcReceipt, not a parallel stage planner. Causal role and graph changes recheck the existing identification crate's sufficient joint backdoor certificate before a retained regression may be used; its derivation is owned by identify.backdoor.",
  "Model-fit counts come from the executing regression component. They are distinct from nuisance-fold fits and frozen-score computations. Zero-model historical receipts retain their five-count wire and digest; nonzero model counts participate in receipt identity and semantic verification.",
  "Retained coefficients and joint covariance support only declared compatible contrasts and point predictions. New rows or outcomes, feature/coding/link/fit changes invalidate the fit; unsupported target laws and provider/prior operations remain typed refusals.",
  "Identity-link contrasts use coefficient differences and the full covariance directly, avoiding cancellation of large predicted levels; fixed target weights are validated before this algebraic reduction. The registered vector fixture checks a large-baseline fractional contrast against the existing public regression engine.",
  "Reuse preserves estimator inference status. Analytic covariance and p-values remain reported diagnostics with calibration not_measured; no confidence interval or coverage support is added.",
  "An independently consumed historical receipt recreates no fitted state. A fresh process needs supplied compatible data and recomputes, or receives an explicit unavailable-state refusal.",
]
upstream_implementations_observed = []
test_sources = [
  "crates/antecedent/tests/recalc_adjusted.rs",
  "crates/antecedent-identify/src/backdoor.rs",
  "crates/antecedent-estimate/src/adjustment_resume.rs",
  "crates/antecedent-io/tests/recalc_receipt_artifact.rs",
  "python/tests/test_recalc_adjusted.py",
  "crates/antecedent/tests/adjusted_recalc_precision.rs",
]

[method_review]
status = "reviewed_with_limits"
scope = "The numerical contrast of a retained adjusted model (AdjustedFit::contrast in adjustment_resume.rs): the identity-link effect delta'b with gradient delta on the treatment columns, and for the logit and Poisson-log links the target-law mean of the response-scale difference with its delta-method gradient and the standard error sqrt(g'Sg), over unweighted rows and over declared non-negative target weights, including the fit those numbers come from (OLS with model-based covariance, binomial-logit and Poisson-log Fisher covariance). Not a review of recalc_adjusted.rs (planning, identities, receipts and refusals, which carry no arithmetic of their own beyond the decision net benefit), of AdjustedFit::predict, the categorical regime, probit or negative-binomial links, or of how a changed role or graph invalidates the fit."
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the product source named in its scope and compared results with definitions evaluated by an executing reference written for this review; no upstream implementation or test source was consulted or copied."
redistribution = "No work is redistributed; the delta method and the generalized linear model score equations are textbook. The reference script and its frozen output are repository-authored (MIT OR Apache-2.0); mpmath is not a product dependency."
limitations = "Five seeded designs (OLS with two vector treatments and with a scalar treatment and two adjusters, logit with and without weights and with two treatments, Poisson-log with weights; 25 to 150 rows) are compared at 1e-6 relative for the effect and 1e-5 relative for the standard error. Probit, negative-binomial and the categorical regime are unreviewed; ill-conditioned or near-separated designs, large linear predictors where the logistic mean saturates, and very large row counts are not exercised. The reference script declares inline script metadata but is not run in a locked environment and is not wired into a gate; its output is frozen in the JSON file."
assumptions = ["The target law is the retained rows reweighted by the supplied weights; the row law is treated as fixed, so the standard error is conditional on it and excludes target-law estimation (the record states this).", "The delta-method standard error uses the retained coefficient covariance as supplied; no robust or bootstrap variance is reviewed.", "Fits are converged and full rank; the reference refits from the data to 40 digits so only the product's solve tolerance separates them."]
sources = ["https://en.wikipedia.org/wiki/Delta_method", "https://mpmath.org/doc/1.3.0/"]
findings_resolved = ["The effect and the delta-method standard error equal the 40-digit refit-and-contrast reference on all five designs: the identity link cancels the intercept and adjustment block exactly, and the logit and Poisson gradients include the adjustment columns through the row-wise mean derivatives with the normalized target weights.", "A wrong-length treatment setting, a wrong-length or negative weight vector, an all-zero weight vector and a setting outside the observed binary support are refused.", "No product defect was found in this record."]
