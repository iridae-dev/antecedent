[method_review]
status = "reviewed_with_limits"
scope = "fit_regime_survival_posterior, fit_joint and draw_coefficients of crates/antecedent-estimate/src/temporal_design/survival.rs for static always-treat and never-treat regimes: the person-period design of the four likelihood factors (hazard on uncensored rows, treatment on all rows with the lagged action, censoring on all rows, the Gaussian confounder transition from period one), the isotropic prior N(0, s^2) on every logistic coefficient and the conjugate normal-inverse-gamma law of the transition, the draw of every factor, the per-draw parametric g-formula with a Bayesian-bootstrap weighting of subjects' observed baselines and common random numbers across the regimes, the product of one minus the drawn hazards, the posterior mean, standard deviation and equal-tailed endpoints of the three coordinates, and the share of draws whose smallest treatment probability on the observed rows is below the positivity floor. The Laplace fits rest on stats.glm (fit_logit_laplace, the same penalised engine reviewed in the sibling record prob.laplace_glm) and the Dirichlet weights on data.bayesian_bootstrap; this review re-runs fit_logit_laplace on the reference's own design rows and otherwise relies on those records for the kernels. Not the frequentist weighting procedure (estimate.temporal_regime_survival), the facade that builds the trajectories, the conjugate Gaussian helper in isolation (it is checked only through the draws), the transport of the draws to the public result, or calibration."
assumptions = ["Sequential exchangeability of treatment and censoring given the measured history, positivity and consistency are declared, not checked; the posterior of the treatment and censoring models does not enter the survival draw and is used only for the positivity-shortfall share.", "Each pooled logistic factor is correctly specified and its posterior is the Laplace normal N(mode, (X'WX + I/s^2)^-1) at the penalised mode; the confounder is modelled as Gaussian linear in the previous confounder, the previous action and k/K with beta | sigma^2 ~ N(0, sigma^2 s^2 I) and sigma^2 ~ InvGamma(1, 1), even where the confounder is binary.", "A subject censored in a period contributes no hazard row for that period; the baseline confounder law is the Bayesian-bootstrap reweighting of the observed baselines, independent of the coefficient draws."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the product source named in its scope and compared its output with definitions evaluated by an executing reference written for this review: 50-digit Newton fits and a conjugate Gaussian law, a Gauss-Hermite and Student-t integral of the survival draw, and an independent numpy simulation of the whole draw; no upstream implementation or test source was consulted or copied. The cited publications were not retrieved in this review: the correspondence is between the product code and the standard definitions those works state, verified numerically, not a page-level reading of the papers."
redistribution = "Primary works are cited, not redistributed. The reference script and its frozen output are repository-authored (MIT OR Apache-2.0); the script uses mpmath (BSD-3-Clause) and numpy (BSD-3-Clause), imported at run time and not redistributed here. The script declares its inline script metadata but is not run in a locked, isolated environment and is not wired into any gate; its output (the three designs, the 50-digit pieces, the exact means and the Monte Carlo summaries) is frozen in the JSON file and compared by the test."
limitations = "Three designs of 16 to 20 subjects (26 to 42 person-periods) with one binary confounder: two periods with prior scale 2, two periods with prior scale 0.5 and 10 censored rows, and three periods with prior scale 1. Deterministic pieces: the Laplace mode (1e-9 relative) and covariance (1e-8) of the hazard, treatment and censoring models are checked by running the shared fit_logit_laplace on the reference's own design rows, not on the rows the product assembles internally, because the product's factor fits are private; the assembly of the four designs and the conjugate transition law are therefore verified only through their effect on the draws, to the statistical bands below, and a defect that moves a survival by less than about 0.003 to 0.004 (the five-standard-error band of 60000 draws) would not be seen. Statistical pieces: the product's 60000 draws are compared at five standard errors. The mean is compared with the exact integral for two periods (band 5 sd/sqrt(N) plus 1e-5; the independent 2e6-draw simulation agrees with the integral within its own band, which validates the quadrature) and with the simulation for three periods (band adds the simulation's standard error); the standard deviation uses se = s sqrt((kappa - 1)/(4N)) with the simulated kurtosis kappa, added in quadrature for the product and the reference; the equal-tailed endpoints are checked as the reference distribution function at the product's endpoint against 0.025 and 0.975 within 5 sqrt(a(1-a)(1/N + 1/N_ref)) plus 5e-4; the positivity-shortfall share at a floor equal to the simulated median of the smallest treatment probability (so near one half) within the binomial band. The draw sd, endpoints and shortfall are Monte Carlo accurate, not exact: the exact variance of the draws is not computed (it needs an eight-dimensional integral over the coefficient laws and two path noises). The three-period design has no exact mean. The test is deterministic given the seed, so the bands are acceptance criteria, not a repeated-sampling guarantee; a differently seeded correct product would fail a given statistic with probability about 6e-7. Not exercised: more than one confounder, a continuous confounder, horizons beyond three, truncation of longer follow-up, separated data, prior scales outside 0.5 to 2, and Laplace approximation error against the exact logistic posterior (the Laplace normal is the target here by definition). The posterior is uncalibrated and no coverage is measured. The cited publications were not retrieved. The reference script is not run in a locked, isolated environment and is not wired into any gate; its output is frozen in the JSON file."
sources = ["https://doi.org/10.1093/ije/dyp192", "https://doi.org/10.1214/aos/1176345338", "https://doi.org/10.1201/b16018", "https://mpmath.org/doc/1.3.0/"]
findings_resolved = ["No defect found: the Laplace mode and covariance of the hazard, treatment and censoring models equal the 50-digit values on all three designs, and the product's posterior mean of the always-treat and never-treat survivals and of their difference equals the exact four-dimensional integral for the two two-period designs within 2 standard errors or less (for example -0.1436 against -0.1441 at prior scale 2) and the simulated mean for the three-period design.", "The draw standard deviations (for example 0.197 against 0.197, 0.121 against 0.121, 0.169 against 0.169 for the contrast), the 2.5 and 97.5 percent endpoints and the positivity-shortfall share equal the independent simulation of the whole draw within the stated bands, so common random numbers across regimes, the per-draw Bayesian-bootstrap weighting, the inverse-gamma scale draw (shape, rate) and the coefficient covariance scaling sigma^2 V are confirmed by an implementation that shares no code with the product.", "The posterior is not a renamed mode estimate: the exact posterior mean differs from the hazard-mode plug-in (-0.1441 against -0.1703 for the contrast of the first design) by more than four times the acceptance band, so the hazard posterior spread is resolved by the check. The censoring posterior is drawn and not used by the survival draw, as declared."]
