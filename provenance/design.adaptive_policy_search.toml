implementation_deviations = [
  "Derivative-free elite-refit evolution strategy with a seeded uniform first generation, smoothed Gaussian refits, a coordinate pattern polish and a fixed evaluation budget. No derivative is estimated and no global-optimality certificate is claimed; an exhausted budget is reported as an incomplete result.",
  "Policies are bounded families (open-loop schedule, threshold, piecewise-constant, clipped linear feedback and small complete trees) over a closed parameter box. Each is lowered to a value program that the temporal rollout executes, and the lowered program and the direct rule agree exactly.",
  "Cumulative cost, cumulative exposure and realised per-step action constraints are checked on rollout paths as hard feasibility conditions with chance-constraint style reporting. The Wilson upper bound on the violation probability is an approximation; a finite sample never certifies a zero violation probability. No objective penalty stands in for feasibility.",
  "Every proposal is evaluated on the same shared draws (common random numbers across policies and parameter draws), so policy values and paired contrasts share draws. The optimisation and held-out splits use independent noise.",
  "The result is labelled a fitted-model optimisation unless an identified policy effect is requested and the response source states an identification basis; otherwise the request is refused. The selected policy's in-sample value is optimistic; a held-out value on independent draws or held-out units is reported, and a design with none is refused or flagged.",
  "Independent evidence: a stationary-state treatment threshold with a closed-form optimum and a linear-quadratic feedback problem with a Riccati optimum and a closed-form best open-loop schedule, each simulated by a separate generator and recomputed by a standalone script.",
]
