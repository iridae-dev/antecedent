[method_review]
status = "reviewed_with_limits"
scope = "PolicySearch execution in crates/antecedent-design/src/adaptive_policy_search.rs (the seeded uniform first generation, elite-refit Gaussian generations, coordinate pattern polish, the evaluation budget, hard and chance constraints with the Wilson upper bound on the violation rate, shared common-random-number draws, the held-out re-evaluation and selection-optimism report, the standing label) and the policy families of adaptive_policy.rs (open-loop schedule, threshold, clipped linear feedback) as exercised on two problems with closed-form optima: a treat-above-threshold rule on a stationary Gaussian state and a linear-quadratic feedback problem with its Riccati gain and best open-loop cost. Not piecewise-constant or tree families beyond their lowering, not the facade model-source binding, and not any claim of global optimality."
assumptions = ["The fitted response model is taken as the data-generating process of the search; the search optimizes inside it and the standing label says so.", "The closed-form optima are exact for the stated models: stage utility u (z - k) with z stationary N(0, s^2), and x' = a x + u + w with stage cost q x^2 + r u^2 and terminal weight equal to the steady-state Riccati solution, for which the finite-horizon gain is stationary."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the search and family code named in its scope and the retained closed-form generator conformance/design/adaptive_policy_search/reference.py (standard library only, imports no Antecedent code, with its own seeded Monte Carlo cross-check), and ran the executing assertions; no upstream implementation or test source was consulted or copied. The cited Cross-Entropy paper was not retrieved in this review: the correspondence is between the product code and the elite-refit idea it names, and the product records its departures (smoothed refits, a pattern-search polish, a seeded uniform first generation) as deviations."
redistribution = "The cited paper is linked, not redistributed. The generator, its lock file and expected.json are repository-authored (MIT OR Apache-2.0); the generator uses only the Python standard library and was run with python3 --check for this review."
limitations = "Two problems only, each with one fixed seed in the assertions: the threshold rule must reach the closed-form value within four held-out standard errors plus 0.08 and a threshold near k, and the feedback rule must reach the Riccati cost within five standard errors plus 0.05, with a fitted slope within 0.12 of the Riccati gain; the best open-loop schedule must land within five standard errors plus 0.3 of its closed form. These tolerances are statistical bands, not 1e-9 agreement, so a search that is slightly suboptimal inside the band would pass. The Wilson violation bound is checked for its ordering (rate at most the bound) and for the zero-tolerance case never being certified, not against a reference value. The hard-constraint and cost-cap cases are checked for feasibility and monotone relaxation, not against a constrained closed form. No reference exists for piecewise-constant or tree families, for multi-dimensional action boxes beyond the two problems, or for multimodal objectives, where an elite-refit search can stall in a local optimum; no global-optimality certificate is claimed and the product says so. Search convergence rates and the coverage of the held-out interval are unmeasured. The Cross-Entropy paper was not retrieved."
sources = ["https://doi.org/10.1023/A:1010091220143"]
findings_resolved = ["No defect found in the exercised routes: every PolicySearchOptions field is read by the search (seed, evaluation budget, population, elite fraction, generation limit, spread tolerance, polish, standing and held-out requirement), the search reaches the closed-form optima within the stated bands, the best fixed schedule is never, a hard exposure bound is never certified by a finite sample, and an identification-unsupported standing request is refused."]
record_sha256 = "6fce0a3d88174f9437e9dc41d2512eb88227a569b403eef49590c077e2e09f83"

