implementation_deviations = [
 "Evaluates a supplied finite-horizon policy on a declared finite model by exact enumeration of observed histories; it does not estimate nuisance models, learn or optimize a policy, or implement a planner.",
 "The sequential importance-weighting estimator applies the Horvitz-Thompson identity along the policy steps with the logged assignment probabilities; it is the ordinary and self-normalized estimator only, with no doubly robust or marginalized weights.",
 "Belief updates use the measurement model's declared parameters as exact; their estimation uncertainty is not propagated.",
 "A point value and an uncalibrated Wald interval are produced; the importance-weighting standard error, the interval and the rollout error carry no measured calibration.",
]

