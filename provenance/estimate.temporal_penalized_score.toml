[method_review]
status = "reviewed_with_limits"
scope = "FrequentistTemporalPropensity::fit and BayesianTemporalPropensity::fit of crates/antecedent-estimate/src/temporal_penalized_score.rs for a logistic propensity of treatment on an intercept and lag columns: the ridge mode that maximises the Bernoulli log likelihood minus (penalty / 2) times the squared slopes on the supplied column scale with the intercept unpenalised, the score sigmoid(b'x) at that mode, the Laplace posterior under independent Gaussian priors with separate intercept and slope scales (mode, observed-information covariance, draws), and the posterior-mean score over the draws. Not the standardised penalty inside cross-fitted AIPW, the underlying ridge and Laplace solvers beyond their agreement with the references, the dependent-series refusal, or coverage."
assumptions = ["Rows are independent subjects at one decision time each; the penalty acts on the columns as supplied, so it depends on their scale.", "A prior standard deviation is not a penalty: the Bayesian score is the posterior mean of the propensity over a Gaussian approximation, not the penalised mode.", "The Laplace posterior is a Gaussian approximation at the log-posterior mode with the observed information."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the product source named in its scope and compared results with a 40-digit multiprecision penalised-Newton and Laplace reference written for this review (temporal_propensity_reference.py); no upstream implementation or test source was consulted or copied. The cited publications were not retrieved in this review: the correspondence is between the product code and the standard definitions those works state, verified numerically, not a page-level reading of the papers."
redistribution = "Primary works are cited, not redistributed. The reference script and its frozen output are repository-authored (MIT OR Apache-2.0); mpmath, where used, only produces the frozen values and is not a product dependency. The script declares its inline script metadata but is not run in a locked, isolated environment and is not wired into any gate; its output is frozen in the JSON file and compared by the test."
limitations = "One 220-row design with an intercept and two lag columns on different scales (standard normal and about N(5, 3^2)); penalties 0.5, 8 and 400 and prior scale pairs (5, 2), (0.5, 0.5) and (1, 0.1). Ridge coefficients agree to a relative 1e-7 and scores to 1e-8; the Laplace mode agrees to 1e-6, the sample covariance of 60,000 draws within five Monte Carlo standard errors per entry, and the posterior-mean score within the Monte Carlo bound. Not exercised: separated data, more than two lag columns, very large penalties beyond 400, and any coverage. The cited publications were not retrieved."
sources = ["https://mpmath.org/doc/1.3.0/"]
findings_resolved = ["No numerical defect was found: the intercept is unpenalised and the slopes are penalised on the supplied scale, the Laplace covariance uses the prior precisions 1/sd^2 per coordinate, and the posterior-mean score agrees with the exact Gaussian expectation of the sigmoid.", "The ridge convention (penalty / 2 times the squared slopes, not scaled by the row count) is fixed by the reference and agrees with the module documentation."]
