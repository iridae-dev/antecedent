 { title = "On the Failure of the Bootstrap for Matching Estimators", doi = "10.3982/ECTA6474", sections = ["bootstrap invalidity for fixed-number-of-matches NN estimators"] },
]

implementation_deviations = [
 "Implements standardized-Euclidean one-nearest-neighbor matching with replacement, an optional caliper, and a linear donor-arm bias correction; it does not implement arbitrary matching metrics, multiple matches, or the paper's broader matching-estimator class.",
 "The function labelled Abadie-Imbens standard error is a simplified reuse-count formula using one half of the matched-effect sample variance; it is not the conditional-residual variance estimator derived in Abadie and Imbens and therefore does not inherit that variance theory.",
 "An ordinary row bootstrap is enabled by default even though the separately cited Abadie-Imbens paper proves ordinary bootstrap inconsistency for fixed-match nearest-neighbor estimators.",
 "Clustered, multiway and HAC standard errors are refused rather than derived: fixed-M nearest-neighbor matching has no per-observation influence function, and its martingale representation (Abadie and Imbens 2006, 2012) is proved for random samples only; a cluster sum of it would need per-unit residuals and conditional effects that the linear bias correction does not estimate consistently.",
]

upstream_implementations_observed = [
 { project = "dowhy", exposure = "black-box comparison only" },
]

test_sources = [
 "crates/antecedent-estimate/tests/distance_matching_reference.rs (exhaustive 60-digit Euclidean search with tied donors, caliper, unit changes of 1e-14 and 1e14, offsets and near-collinear covariates)",
 "independently generated synthetic confounded SCM with known ATT",
 "conformance/estimate/distance_matching (known-truth recovery fixture carrying an unasserted recorded DoWhy run from the pinned baseline in parity/baselines/dowhy.toml)",
]

[method_review]
status = "reviewed_with_limits"
scope = "DistanceMatching::fit in crates/antecedent-estimate/src/propensity/distance.rs and the shared matching helpers in crates/antecedent-estimate/src/propensity/matching.rs it calls (match_diffs_with, match_nearest_tied, matched_outcome_diffs, fit_linear_mean, abadie_imbens_se): z-scoring of the covariates, one-nearest-neighbour matching with replacement by Euclidean distance with all tied donors averaged, the caliper, the donor-arm linear bias term, the pooled effects and the homoskedastic matching variance. Not the diagnostic propensity fit beyond its use as a refusal, k-nearest matching, trimming, sampling weights or the population-variance option."
assumptions = ["Unconfoundedness given the adjustment set and positivity are identification assumptions taken as given.", "Independent rows; the variance is the simplified donor-reuse construction the record states.", "The distance is Euclidean on the z-scored covariates, so every covariate counts equally whatever its units; a constant covariate carries no distance."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the product source named in its scope, including the numerical helpers it calls, and compared results with definitions evaluated by executing references written for this review; no upstream implementation or test source was consulted or copied. The cited publications were not retrieved in this review: the correspondence is between the product code and the standard definitions those works state, verified numerically, not a page-level reading of the papers."
redistribution = "Primary work is cited, not redistributed. The reference script and its frozen output are repository-authored (MIT OR Apache-2.0); the script uses mpmath (BSD-3-Clause), imported at run time and not redistributed here. The script declares its inline script metadata but is not run in a locked, isolated environment and is not wired into any gate; its output is frozen in the JSON file and compared by the test."
limitations = "Ten finite tables of 16 to 60 rows with two or three covariates: a caliper, three covariates, seven duplicated covariate vectors that tie, an outcome offset of 1e7, a covariate offset of 1e6, covariates in units of 1e-14 and 1e14, covariates correlated at 0.9999999999995 and a sixteen-row table. Effects are asserted to 1e-8 and standard errors to 1e-6 relative, with the matched count. Equidistant donors that differ in exact arithmetic but round to equal doubles, and ties that the standardization breaks by rounding, are not exercised. Nothing here bears on coverage. The reference script is not run in a locked, isolated environment and is not wired into any gate; its output is frozen in the JSON file and compared by the test."
sources = ["https://doi.org/10.1111/j.1468-0262.2006.00655.x", "https://doi.org/10.3982/ECTA6474", "https://mpmath.org/"]
findings_resolved = ["Defect repaired: with two or more covariates a query with several equidistant donors (duplicated covariate rows, discrete covariates) matched only the donor listed first, so the effect and the variance depended on the order of the rows, although the scalar path and the stated contract average every tied donor. The multivariate single-neighbour pass now returns the whole tied set, shared by queries with the same set, and equals the exhaustive reference on a table with seven duplicated points.", "Defect repaired: covariates were scaled by max(sd, 1e-12), so a covariate measured in units of 1e-14 was shrunk by a factor of ten against its z-score and the matches changed with the units. A column is now constant only when its spread is below 1e-12 of its own magnitude, and the matched effect is identical for the covariate in units of 1e-14, 1 and 1e14.", "Defect repaired: the donor-arm bias line was solved from the normal equations, which squares the condition number: for covariates correlated at 0.9999999999995 the matched effect and its standard error were off by 3e-4 relative. It is solved by Householder QR now (a triangular pivot below 1e-13 of the largest still means rank deficient and no bias term is made), and the effect equals the reference to 1e-8."]
