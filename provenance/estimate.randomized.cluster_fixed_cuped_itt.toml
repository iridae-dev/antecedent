implementation_deviations = [
 "This composes two procedures and is not an estimator analyzed in either paper: the CUPED adjustment of the first, applied to cluster outcome totals, then the conservative Neyman bound of the second over those totals. The guarantee is derived here, not inherited: with a coefficient fixed outside the experiment, the adjusted outcome is another potential outcome whose per-row contrast equals the unadjusted one, so the cluster Neyman analysis of its totals targets the unadjusted per-row ITT.",
 "The coefficient is supplied by the caller and is not estimated from this experiment. A coefficient learned from the rows (ANCOVA or the same-sample theta of the paper) is refused on a cluster design, because the row-level residual variance would treat rows as independent units and change the unit of analysis.",
 "The covariate must be measured before assignment; the adjustment is applied to each row and totalled per assignment cluster, so the cluster, not the row, is the unit of analysis. The interval support floor is that of the unadjusted cluster interval: 30 independently assigned clusters in each arm and positive realized variance.",
 "The variance is the conservative Neyman bound; it is conservative by the between-cluster variation of the adjusted-outcome effect, which is zero effect heterogeneity for a coefficient that explains the baseline and non-negative otherwise.",
]

