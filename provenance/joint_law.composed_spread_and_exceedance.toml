# Spread, interval candidates and exceedance decisions read at the composed coordinate of a
# composition (draws or moments of the composition, not of its components). Closed-form
# linear-combination moments and law of total variance are textbook; the Frechet/Makarov
# envelopes are cited by joint_law.dependence_envelope. The coordinate-and-record matching of a
# composed interval (ComposedCoordinate, CoverageRecord) is original engineering.
papers = [
  { title = "Estimates for the Distribution Function of a Sum of Two Random Variables When the Marginal Distributions are Fixed", citation_note = "Previously recorded title and bibliographic detail: Estimates for the Distribution Function of a Sum of Two Random Variables When the Marginal Distributions are Fixed (Makarov, Theory of Probability and its Applications 26(4):803-806, 1982)", doi = "10.1137/1126086", sections = ["bounds of P(X + Y <= t) over all couplings of fixed marginals (used for the sum envelope)"] },
  { title = "Bayesian Data Analysis", citation_note = "Previously recorded title and bibliographic detail: Bayesian Data Analysis (3rd ed.)", doi = "10.1201/b16018", sections = ["law of total variance for a mixture; delta-method propagation"] },
]
implementation_deviations = [
  "Constructions (normal, draw-percentile, marginal candidates) are interval constructions, not coverage statements. Each carries calibration status unmeasured; the interval reading stays closed unless a measured record exists at the exact composed coordinate and construction, at the recorded nominal level.",
  "A component interval's record is never a composed coordinate's. Rows are paired only when they are realizations of one joint law (a shared alignment identity); pairing marginal draws by index silently assumes independence and is refused.",
  "The exceedance decision carries a Monte Carlo band; the band is numerical error, not statistical coverage.",
  "A transported claim's uncertainty is three pieces (source sampling, target sampling, transport functional); naming some and omitting others is refused with the missing pieces listed.",
]
upstream_implementations_observed = []
test_sources = [
 "crates/antecedent-stats/tests/joint_law_reference.rs (exhaustive transportation-table enumeration and rational definitions)",
  "crates/antecedent-stats/src/joint_law.rs (module unit tests with hand-computed moments)",
  "crates/antecedent-io-core/tests/joint_law_propagation_artifact.rs",
  "crates/antecedent-contract/tests/interface_adapters.rs",
]

[method_review]
status = "reviewed_with_limits"
scope = "draw_spread (mean, sample variance with divisor n-1, standard deviation, mean standard error with an effective size) and composed_exceedance_decision / exceedance_verdict (strict exceedance fraction, Agresti-Coull adjusted Monte Carlo standard error at the effective sample size, band z*se and the act / withhold / unresolved verdict) in crates/antecedent-stats/src/joint_law.rs, plus mixture_exceedance. Not the interval constructions' coverage or the contract rule's pairing refusals."
assumptions = ["Draws are realizations of the composed quantity's law; the producer declares what law that is, and the effective size, when given, is the number of independent rows.", "The band is Monte Carlo numerical error around the fraction; it is not a coverage statement about the law."]
historical_exposure = "Historical author exposure cannot be independently established. This review read the product source named in its scope and wrote its own reference, which does not use the comonotone, countermonotone or Makarov forms of the product: it enumerates every integer contingency table with the marginal counts (all vertices of the transportation polytope) in exact rational arithmetic and evaluates the remaining quantities from their definitions. No upstream implementation was consulted."
redistribution = "The reference script and its frozen output are repository-authored under MIT OR Apache-2.0; mpmath is used only to produce the frozen values and is not a product dependency. No cited paper is redistributed."
limitations = "Bayesian Data Analysis and Makarov (1982), listed on the record, were not retrieved; the spread and the Agresti-Coull band are checked against rational and 50-digit definitions (four spreads including a constant column and a fractional effective size; five exceedance cases including fractions 0 and 1, an effective size of 50 for 200 draws and 1000 draws at the 0.99 level) and the standard normal quantile to 1e-9. The verdict logic is checked at the sampled points only; the exceedance decision's behaviour for effective sizes near zero or at extreme levels, and the soundness of the Agresti-Coull band as an error band for autocorrelated or weighted draws, are not examined."
sources = ["https://mpmath.org/doc/1.3.0/"]
findings_resolved = ["No numerical defect was found: spread moments agree with exact rationals, the Agresti-Coull standard error and band agree with 50-digit values to 1e-9 including the all-miss and all-hit cases (which do not report zero error), and the act / withhold / unresolved verdicts match at all five cases."]
