implementation_deviations = [
  "Every coordinate is a ratio of Horvitz-Thompson pair scores summed within independent units (or declared interference clusters); the uncertainty is the cluster-robust linearized-ratio covariance, with a Gaussian multiplier sup-t band over several contrasts or a dose grid. The excursion target keeps carryover inside the target rather than assuming it away.",
  "The local-quadratic dose grid weights pairs by kernel over the recorded dose density; its pointwise interval is bias-aware under a declared third-derivative bound, and the band adds that bound to the sup-t half-width. The kernel-smoothed curve and contrast take the bandwidth as part of the estimand.",
  "The quantile excursion inverts Hajek-weighted distribution functions and reports a whole-procedure cluster-bootstrap percentile interval. No interval is calibrated and the route is not licensed.",
]

