implementation_deviations = [
  "Certified subset only: exactly one graph (the Verma ADMG X1 -> X2 -> X3 -> X4 with X2 <-> X4, districts {X1}, {X3}, {X2, X4}) over four binary variables and one observational regime. The papers treat general ADMGs; every other graph, regime or non-binary domain refuses (route_not_supported / nested_markov.outside_binary_pilot).",
  "Every identity (the 11 Mobius parameters, the likelihood P = Pa(x1) C(x3 | x2) Q(x2, x4 | x1, x3), the four equality constraints, the do(X2) formula and the profile-likelihood fit) is derived directly in crates/antecedent-estimate/src/nested_markov_binary.rs and checked against an enumerated latent-variable SCM; no theorem of either paper is inherited, so smoothness, identifiability or asymptotic claims of the supermodel paper are not claimed.",
  "The fit is a constrained maximum-likelihood fit (closed form when the empirical law satisfies the constraints, otherwise profiling g inside block coordinate ascent over q2 and q4, bounded sweeps) and a model-versus-plug-in point contrast. This MLE engine supplies no Bayesian posterior. Separately owned continuous raw-coordinate Beta-kernel posterior (provenance/identify.binary_nested_markov_posterior.toml) and expected-Fisher/delta (provenance/identify.binary_nested_markov_fisher.toml) source candidates retain unmeasured standing; separate normal measured endpoint producers use their own current method-specific records and full original-source replay.",
  "The pilot executes the existing general-ID checker for the selected binary contrast before fitting. Its identification status cannot come from a likelihood label. Public Rust/Python static response fixtures license this same graph/query independently. The existing ADMG conditional transport functional remains lineage: that route needs conditioned variables and this graph has none, so the pilot derives its own unconditional identifying formula, P(x4 | do(x2)) = sum_{x3} P(x3 | x2) sum_{x1, x2'} P(x1, x2') P(x4 | x1, x2', x3).",
  "Positivity is demanded of every regime cell count and fitted cells must stay at least 1e-9 from 0 and 1; boundary fits refuse rather than being reported.",
  "The original MLE/source candidate remains unmeasured. The separately owned Bayesian normal producer licenses only named mean0, mean1 and contrast95 endpoints under the exact measured uniform-Beta1/Beta2 full11D protocol; the Fisher producer has its own distinct evidence. Other priors, samplers, graph classes and simultaneous guarantees remain unsupported.",
  "Normal measured envelope is distinct from the original unmeasured source candidate. Original method execution is independently replayed, every named scalar uses its actual native basis and current attesting record, and exact method/prior/design guards refuse adjacent protocols. Whole-method candidate measurements completed at5c76724f; current main-source replay and attestation pass, and scoped installed normal-wheel producer/independent consumer acceptance passes. No general-model or simultaneous interval guarantee is inherited.",
