implementation_deviations = [
 "The necessary and possible relations are applied to the expected utilities (or expected losses) of actions whose attributes are causal quantities under a supplied law, with value v_a(theta) = c_a0 + sum_j theta_j c_aj affine in the preference parameters, not to rankings of alternatives on fixed criterion evaluations. The parameter set is a declared box cut by linear relations, not necessarily the UTA-GMS set of additive value functions compatible with a reference ranking.",
 "Necessarily best means best by more than a tie tolerance at every admissible point, checked by one linear program per rival; possibly best means best (ties allowed) against every rival at one common admissible point, a single feasibility program. Both are statements about the best action, which is stronger than the pairwise necessary and possible relations of the cited paper.",
 "Worst-case regret of an action is the largest shortfall from the best rival over the set, max over rivals of max over theta of (v_b - v_a), floored at zero, and the verdict names the action with the smallest; this is Boutilier et al.'s max regret over a utility polytope with expected utilities of causal quantities in place of known outcome utilities. Expected regret is answered through expected-utility margins, which rank actions identically at every point; its worst case refuses and is referred to the certified record.",
 "A share is reported only for a supplied measure: the normalised weight of a finite set of weighted parameter points (declared, or drawn from the noisy-choice estimate), with ties within the tolerance shared equally. It is a first-rank acceptability index of that discrete measure, not SMAA's Monte Carlo integral over a density on the weight space; no central weight vectors, lower-rank indices or confidence factors are computed. The draw share of the necessarily best action is checked at every vertex of the set, enumerated up to a cap, and is a point diagnostic of the supplied law.",
 "Composition across causal structures (structural policies, unidentified and unevaluated structure mass reported and never renormalised) is a repository construction outside the cited works.",
 "The linear programs are solved by a working-set primal simplex over rows g . x <= h (each scaled to unit maximum coefficient), not a tableau method; free variables enter as placeholder rows released first, Bland's smallest-index rule is applied to the rows to release and to the blocking rows, and phase one relaxes every violated row by one auxiliary variable t in [0, 1]. Every outcome is rechecked from first principles before it is returned: feasibility and a non-negative least-squares fit of the objective by the tight rows (Lawson and Hanson's NNLS on Householder least squares) for an optimum, Farkas multipliers for infeasibility, a feasible improving ray for unboundedness. Tolerances are repository choices (pivot 1e-12, singularity ratio 1e-12, dependent-column ratio 1e-10).",
 "Vertex enumeration solves every choice of n hyperplanes among the constraints and finite bounds and keeps the distinct feasible points, refused beyond a cap; it is brute force, not a pivoting enumeration.",
 "The exact-rational linear-program reference (linear_program_reference.py, brute-force basis enumeration in fractions) and the dense-grid cross-check in preference_decision_structural.rs were written by the same author in the same development effort as the implementation, not by an independent reviewer; no method review has been recorded.",
]
