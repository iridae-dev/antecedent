[method_review]
status = "reviewed_with_limits"
scope = "DirichletPosterior in crates/antecedent-stats/src/adaptive_inference/dirichlet_choice.rs: the conjugate Dirichlet(alpha + n) posterior of repeated categorical choices, the exact ordered-sequence log marginal likelihood, the probability that each option has the largest share (the integral of the gamma density of option k times the product of the other distribution functions), the posterior expected loss E[max theta] - E[theta_k] through E[max G] / sum alpha, and the quadrature window and panels. Not the lifecycle layer in antecedent-design (a separate non-algorithm record), hierarchical preference models, or any frequentist coverage."
assumptions = ["Choices are exchangeable draws of one categorical law whose parameter has the declared Dirichlet prior.", "Prior shapes are at least one so the densities are bounded; the quadrature relies on it.", "The posterior is exact under the declared prior and is not a frequentist statement; no coverage under adaptive sampling and stopping is claimed."]
historical_exposure = "Historical author exposure cannot be independently established. This review read the product source named in its scope and wrote its own reference from the definitions: mpmath's regularized incomplete gamma and adaptive quadrature at 20 digits (a different algorithm from the product's Gauss-Legendre panels), the log gamma function for the marginal likelihood; no upstream implementation was consulted. The cited paper was not retrieved."
redistribution = "The reference script and frozen output are repository-authored under MIT OR Apache-2.0; mpmath is not a product dependency. The cited paper is linked, not redistributed."
limitations = "Lukacs's paper was not retrieved (nothing downloaded, no local copy); the check is of the code against the definitions. The comparison covers nine best-option sets (two to eight options; flat, near-flat, skewed, non-integer shapes, concentrations to 260), their expected losses, and four marginal likelihoods (including sparse prior shapes of 0.5, accepted by the likelihood alone) at 1e-9 absolute for probabilities and losses and 1e-10 relative for log marginal likelihoods. It does not examine concentrations above 260 against an independent reference, the 64-option bound, or the total-count bound."
sources = ["https://doi.org/10.1214/aoms/1177728549", "https://mpmath.org/doc/1.3.0/"]
findings_resolved = ["Scope finding (not a defect): the first reference grid included prior shapes of 0.5 for the best-option and expected-loss functionals; the product refuses shapes below one because the quadrature needs bounded densities. The restriction is stated in the record and in the refusal text, and the grid was changed to shapes of at least one; the marginal likelihood, which does not use quadrature, keeps its sparse-shape cases."]
