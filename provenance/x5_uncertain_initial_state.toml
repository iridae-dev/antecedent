  "Not an implementation of a published estimator: an exact finite sum sum_{s0} P_target(s0) R(s0) over a supplied target law of at most 64 states with masses summing to one within 1e-9; R(s0) is read from the complete histories of the panel. A state with positive target mass and no history support refuses (initial_state.support_gap); zero-mass states need no support.",
