[method_review]
status = "reviewed_with_limits"
scope = "switchback::switchback_history_means: the joint-history Horvitz-Thompson means with inclusion probabilities summed over whole schedules (never multiplied from marginals), the observed support, the eligible-period count excluding the first L periods, and the cluster covariance S/(S-1) sum_s (T_sj - L_s m_j)(T_sk - L_s m_k) / N^2 centred by sequence length, plus the refusals for malformed, duplicate or unsupported inputs. Not the joint-design sharp-null randomization test, the Gaussian history-mean likelihood, the AR(1) form or any interval."
assumptions = ["Consistency, no anticipation, no interference between independent sequences and no carryover beyond the declared history are design premises taken as given.", "The known whole-schedule probabilities are the true assignment law for each independent sequence."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the product source named in its scope, including the numerical helpers it calls, and compared results with definitions evaluated by executing references written for this review; no upstream implementation or test source was consulted or copied. The cited publications were not retrieved in this review: the correspondence is between the product code and the standard definitions those works state, verified numerically, not a page-level reading of the papers."
redistribution = "Primary work is cited, not redistributed. The reference script and its frozen output are repository-authored (MIT OR Apache-2.0); the script uses only the Python standard library. The script declares its inline script metadata but is not run in a locked, isolated environment and is not wired into any gate; its output is frozen in the JSON file and compared by the test."
limitations = "Two designs of two to three independent sequences of three periods with 5 to 6 schedules each, unequal assignment laws and sequence-specific outcome offsets, for pair histories (four) and single-period histories (two); all 180 and 36 realizations enumerated, means and covariance entries asserted to 1e-12 relative to the largest entry and the supports and eligible counts exactly. The reference script asserts exact unbiasedness of every history mean for the potential-outcome average over the full realization set. Realizations with an unobserved history are not in the enumeration and are tested only by the existing refusal unit tests. The covariance has no calibrated interval and no expectation identity is asserted for it here."
sources = ["https://arxiv.org/abs/2009.00148"]
findings_resolved = ["No defect found: means, covariance, supports and the eligible-period count reproduce the exact rational value on every enumerated realization, including schedule sets that differ in size and law between sequences. The enumeration confirms that probabilities taken from whole schedules give exactly unbiased history means."]
