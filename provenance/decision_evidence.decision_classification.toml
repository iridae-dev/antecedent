implementation_deviations = [
 "Classification compares delta-method sampling intervals at vertices of a multilinear assumption box with the decision threshold and reports non-multilinear outer bounds as unresolved. Assumption-dependent means the endpoints favor different actions; intermediate values may remain unresolved. The classification is not a probability.",
 "Planning reuses the existing Normal-Normal FutureStudyProgram only when no assumption range remains; the belief is centered on the current contrast with the delta-method variance, a declared planning model and not a calibrated posterior. Assumption-narrowing candidates re-run the classification and are best cases, not expectations.",
 "Stage digests chain so that a decision-rule change reuses the derived quantity and an estimate-identity or premise change invalidates it.",
]

