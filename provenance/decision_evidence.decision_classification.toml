implementation_deviations = [
 "Classification compares the delta-method sampling interval at every vertex of the declared assumption box with the decision threshold, and the assumption range with the same threshold: robust when both sides agree everywhere, assumption-dependent when the preferred action changes inside the declared range, unresolved otherwise. It is a classification, not a probability.",
 "Planning reuses the existing Normal-Normal FutureStudyProgram; the belief is centered on the current contrast with the delta-method variance, a declared planning model and not a calibrated posterior. Assumption-narrowing candidates re-run the classification and are best cases, not expectations.",
 "Stage digests chain so that a decision-rule change reuses the derived quantity and an estimate-identity or premise change invalidates it.",
]

