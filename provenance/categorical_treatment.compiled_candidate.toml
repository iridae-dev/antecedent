implementation_deviations = [
  "The main compiler checks its actual lowered-program identity against a shared typed source contract; IO reconstructs that contract and the native posterior independently before the private measured authorization path, which supports an interval only when a current attesting coverage record covers the construction, level count and row count.",
  "The native candidate declares a Gaussian model over at least two declared treatment levels (the first is the reference), at least two rows of every level (sizes bounded only by resource limits, supported only where a coverage record's level count and row range cover them), a fixed normal-inverse-gamma prior and one row per declared independent subject. The source and typed subject declaration are retained in the compiled program; independence is a caller premise, not inferred from observed rows.",
  "The prior-predictive candidate measures coverage averaged over parameters drawn from that declared prior, over a grid of row counts, level counts and arm imbalance. It does not measure pointwise or uniform frequentist coverage and does not establish causal identification.",
  "A calibration record is keyed by the level count and covers the row range it measured; an execution outside that range or with an unmeasured level count refuses. No record, review or attestation is asserted here.",
]
