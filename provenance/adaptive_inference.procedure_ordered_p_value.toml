# Tail probabilities of the whole-procedure law at an observed terminal state under a stagewise
# ordering, and the confidence set obtained by inverting the ordered test over a grid of
# contrasts. The stagewise ordering and exact inversion of group-sequential tests are published
# (Tsiatis, Rosner and Mehta); the implementation applies the ordering to the exact law of a
# declared procedure, and the spending boundaries extend adaptive_inference.group_sequential.
papers = [
  { title = "Exact Confidence Intervals Following a Group Sequential Test", citation_note = "Previously recorded title and bibliographic detail: Exact confidence intervals following a group sequential test (Tsiatis, Rosner and Mehta, Biometrics 40:797-803, 1984)", doi = "10.2307/2530924", sections = ["stagewise ordering of the sample space of a group sequential test and the confidence set by inversion"] },
  { title = "Discrete sequential boundaries for clinical trials", citation_note = "Previously recorded title and bibliographic detail: Discrete sequential boundaries for clinical trials (Lan, DeMets, Biometrika 70:659-663)", doi = "10.1093/biomet/70.3.659", sections = ["alpha spending function"] },
]
implementation_deviations = [
  "The ordering ranks stops in favour of the plus arm highest (earlier higher), non-stop terminal states by the estimate, and stops in favour of the minus arm lowest (later higher); it is the implementer's statement of a stagewise ordering over a Bernoulli batched procedure, not a transcription of the paper's normal-theory construction.",
  "Terminal states with an undefined estimate are counted in both tails (conservative). Admitted only for fixed-randomization designs; adaptive assignment is refused for the group-sequential paradigm.",
  "Inversion is evaluated on a declared contrast grid with a nuisance baseline grid, at most MAX_INVERSION_LAWS laws; the set is reported at the grid and reports DERIVED_UNMEASURED.",
]
upstream_implementations_observed = []
test_sources = [
  "crates/antecedent-stats/tests/adaptive_procedure_uncertainty_oracle.rs",
  "crates/antecedent-stats/tests/adaptive_inference_oracle.rs",
  "crates/antecedent-stats/tests/adaptive_ordered_p_value_reference.rs (tail masses and inversion against exact rational enumeration)",
]

[method_review]
status = "reviewed_with_limits"
scope = "ordering_p_values and inversion_interval in crates/antecedent-stats/src/adaptive_inference/procedure_uncertainty.rs: the stagewise ordering of the terminal states of a fixed-randomization two-arm Wald-boundary procedure (plus-arm stops highest and earlier higher, minus-arm stops lowest and later higher, the rest by the estimate, undefined estimates in both tails), the upper and lower tail masses of an observed terminal state under the exact law, and the confidence set obtained by taking the supremum of each tail over a baseline grid and accepting a contrast when both are at least alpha / 2. Relies on the exact law of adaptive_inference.procedure_law and takes the Wald critical values as declared (their construction from alpha-spending is reviewed under adaptive_inference.group_sequential). Not the normal-theory ordering of the paper, coverage, or adaptive assignment (refused)."
assumptions = ["Assignment probabilities are fixed in advance (the premise gate refuses adaptive assignment for the group-sequential paradigm).", "Both tails use the same ordering; the confidence set is exact for the declared grid and procedure and untested between grid points."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the product source named in its scope, including the numerical helpers it calls, and compared results with definitions evaluated by executing references written for this review; no upstream implementation or test source was consulted or copied. The cited publications were not retrieved in this review (nothing was downloaded and no local copy exists): the correspondence is between the product code and the standard definitions those works state, verified numerically, not a page-level reading of the papers."
redistribution = "Primary work is cited, not redistributed. The reference scripts and their frozen outputs are repository-authored (MIT OR Apache-2.0) and use only the Python standard library. The scripts declare their inline script metadata but are not run in a locked, isolated environment and are not wired into any gate; their output is frozen in the JSON files and compared by the tests."
limitations = "Tsiatis, Rosner and Mehta (1984) and Lan and DeMets (1983) were not retrieved (nothing downloaded, no local copy); the ordering is the module's own statement of a stagewise ordering over a Bernoulli batched procedure (a deviation the record states), checked here against the same statement written from its definition, not against the paper's construction. The reference path-enumerates the law (procedure_exact.py) of three procedures (two-sided pairs, single-unit looks with undefined estimates, upper boundaries) under six truths and ranks every terminal state by the definition: 350 observed terminal states have upper and lower tails, and undefined mass, equal to the exact value at 1e-12. The inversion (thirteen contrasts, seven baselines on a dyadic grid, 61 laws per level, three levels and observed states) agrees exactly on the accepted set and on the number of laws; the smallest distance of a tail to alpha / 2 is 3.4e-3. Only six units per procedure; boundaries are fixed critical values; the contrast and baseline grid is declared and a contrast with no baseline keeping both arms in [0, 1] is not accepted (it has no evaluated law). Reports derived_unmeasured: no coverage of the set is measured."
sources = ["https://docs.python.org/3/library/fractions.html", "https://docs.python.org/3/library/decimal.html", "https://doi.org/10.2307/2530924", "https://doi.org/10.1093/biomet/70.3.659"]
findings_resolved = ["No defect found: the ordering, both tails, undefined mass and the inversion agree with the independent evaluation."]
