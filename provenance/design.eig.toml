# Scope: this record covers ONLY DesignObjective::ReduceGraphEntropy
# (crates/antecedent-design/src/objective.rs) and its scorer
# ranker.rs::eig_graph_entropy — the signed Shannon-entropy-reduction Monte Carlo estimator
# `H(prior) - H(p(G|y))` over the discrete graph-posterior observation channel. It does NOT
# cover the other three DesignRankConfig objectives implemented elsewhere in ranker.rs:
# - effect_width_reduction (Gram-matrix SE reduction) — see design.effect_width_reduction.toml
# - model_distinguish_score (expected log-lik gap between models) — see design.model_distinguish.toml
# - decision_regret_reduction (Bayesian decision-regret reduction) — covered by design.decision.toml
