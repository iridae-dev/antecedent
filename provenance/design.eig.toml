# Scope: this record covers ONLY DesignObjective::ReduceGraphEntropy
# (crates/antecedent-design/src/objective.rs) and its scorer
# ranker.rs::eig_graph_entropy — the signed Shannon-entropy-reduction Monte Carlo estimator
# `H(prior) - H(p(G|y))` over the discrete graph-posterior observation channel. It does NOT
# cover the other three DesignRankConfig objectives implemented elsewhere in ranker.rs:
# - effect_width_reduction (Gram-matrix SE reduction) — see design.effect_width_reduction.toml
# - model_distinguish_score (reliability-scaled log-lik gap between models) — see design.model_distinguish.toml
# - ReduceDecisionRegret (preposterior expected value of sample information, preposterior.rs) — covered by design.decision.toml
papers = [
 { title = "On a Measure of the Information Provided by an Experiment", doi = "10.1214/aoms/1177728069", sections = ["Expected reduction in Shannon entropy from an experiment"] },
]

implementation_deviations = [
 "The typed Python GraphEntropy declaration forwards the original native graph-channel model and retains heuristic_graph_channel_entropy / monte_carlo labels; it grants no likelihood-based EIG or calibrated error/rank guarantee.",

 "Uses a synthetic categorical graph-label channel whose candidate reliability is a hand-coded saturating heuristic rather than the experiment-specific likelihood p(y | G, design) required by Lindley expected information gain.",
 "The channel is p(y | G) = r * 1[y = feature(G)] + (1 - r) / k: reliability r = 0 is the uninformative point and a lower r is a garbling of a higher one, so the score is zero for a no-op design and non-decreasing in the design amount. (Before the off-category mass was (1 - r) / (k - 1), uninformative at r = 1/k, so small designs could outrank larger ones.)",
]

upstream_implementations_observed = [
 { project = "dit", exposure = "black-box comparison only" },
]

test_sources = [
 "python/tests/test_design_objectives.py (test_graph_entropy_uses_original_channel_and_retains_heuristic_label)",

 "crates/antecedent-design/src/ranker.rs::eig_graph_entropy unit tests",
 "crates/antecedent-design/src/ranker.rs (entropy_channel_gain_is_zero_at_noop_and_monotone_in_design_amount, entropy_channel_zero_reliability_is_uninformative)",
 "crates/antecedent-design/tests/design_oracle.rs (fixed_budget_scores_match_exact_expected_information_gain, exact_targets_are_monotone_in_design_amount, candidate_ranking_replays_and_calibrates_across_seed_grid)",
 "conformance/design/expected_information_gain",
 "conformance/design/candidate_ranking",
 "crates/antecedent-design/tests/graph_entropy_channel_reference.rs (60-digit joint-law mutual information over five priors and thirteen designs)",
]

[method_review]
status = "reviewed_with_limits"
scope = "DesignObjective::ReduceGraphEntropy and its scorer, the EntropyChannel of crates/antecedent-design/src/ranker.rs, as reached through DesignRanker::rank on an exact evaluation: the expected reduction in graph-posterior Shannon entropy for the symmetric categorical channel p(y | G) = r 1[y = c(G)] + (1 - r)/k, including feature labels taken from explicit features or from the graph keys, unnormalised posterior weights, repeated labels, one label only, and the declared reliability map per design kind and amount with its clamps. Not a likelihood-based expected information gain for any experiment (the channel is a declared heuristic), the Monte Carlo per-draw path, or the other ranking objectives."
assumptions = ["The channel and the reliability map are the repository's declared heuristic; this review checks that the score is the mutual information I(G; Y) of exactly that channel, not that the channel resembles a real experiment.", "Weights are non-negative and need not be normalised; the prior is the normalised weights and the feature label of a graph is its category.", "With fewer than two distinct labels no observation can discriminate and the score is zero."]
historical_exposure = "Historical author exposure cannot be independently established. This review read the product source named in its scope and wrote its own reference: it builds the joint law p(g, y) and evaluates sum p(g,y) ln(p(g,y)/(p(g)p(y))) at 60 digits, a different decomposition from the product's H(G) - H(G | Y), and computes the reliability of each design from the documented map independently. The retained dit-based fixture generator was not re-run and is a separate artifact."
redistribution = "The reference script and frozen output are repository-authored under MIT OR Apache-2.0; mpmath is not a product dependency. The cited 1956 paper is linked, not redistributed."
limitations = "The cited paper (Lindley 1956) was not retrieved for this review: nothing was downloaded and no local copy exists, so only the standard definition of expected information gain as mutual information is established here, not a section-level correspondence. Five priors (up to eight labels and eight graphs, a near-degenerate prior with weights 1, 1e-9 and 1e-12, a single label and a skewed two-label prior) and thirteen designs each are compared at absolute 1e-9 plus relative 1e-9; reliabilities off the listed amounts are not sampled. The Monte Carlo per-draw route is not part of this review. Because the reliability map is heuristic, the score is not the expected information gain of any physical design."
sources = ["https://doi.org/10.1214/aoms/1177728069", "https://mpmath.org/doc/1.3.0/"]
findings_resolved = ["No numerical defect was found: for all five priors, thirteen designs and both label sources (explicit features and graph keys) the ranker's exact score equals the joint-law mutual information to the asserted tolerance, including the zero scores for reliability zero (zero observed rows), a single label and the tiny-mass prior.", "The existing external-package fixture covers one three-graph posterior and six designs; the new comparison adds unnormalised and repeated-label priors, the clamps at 0.99 and 0.95 and graph-key labels, which that fixture does not reach."]
