  "The interval is the textbook Student-t interval of a linear combination of OLS coefficients, phibar' b_hat +/- t_(n-p) sqrt(phibar' V phibar), with the HC3 heteroskedasticity-consistent sandwich covariance (MacKinnon and White 1985). It is reported only as a measured scalar bound to a currently attesting coverage record of the whole route; outside the measured native-fit construction it refuses not_supported.",
  "Native-fit authority is replayed, not declared: the measured envelope retains the fit rows, and the consumer refits and requires the export (marker, n, p, coefficients, covariance) to reproduce bit for bit.",
