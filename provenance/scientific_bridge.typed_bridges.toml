implementation_deviations = [
 "A bridge is a declared derivation, not a theorem: every mapping is conditional on the assumptions the contract lists, and the library records them as unresolved obligations rather than verifying them.",
 "The trial-level surrogate mapping is ordinary least squares of the terminal effect on the surrogate effect with a declared minimum number of trials and coefficient of determination; it does not weight trials by precision, does not model the within-trial error of the effects, and does not report a prediction interval, so the meta-analytic prediction-error and individual-level surrogacy results are not inherited.",
 "The mapping is applied only inside the range of surrogate effects the validation trials covered; extrapolation is refused, which the published criteria do not require.",
 "The measurement correction is the closed-form Rogan and Gladen inversion for known rates (and its forward map); the rates' own sampling variance is not propagated, so no interval is carried.",
 "A predictive quantity is carried unchanged to a causal quantity only under a named identification (adjustment, exchangeability, positivity, consistency) that is declared, not checked, by the bridge; the identification layer owns checking it.",
 "A transported bridge states its transportability premise as a declaration with an identity; no selection-diagram derivation of invariance is performed by the bridge.",
 "Only a declared point mean is carried across a bridge. A nonlinear map of that mean is refused: the square is checked against E[X^2] = (E[X])^2 + Var(X), and the exponential against the normal moment-generating function exp(mu + sigma^2 / 2). Neither check is a general nonlinear bridge, and neither produces a posterior.",
 "An affine map may declare the variance of its intercept and slope and the dependence of the slope estimator on the source estimator. The propagated variance is Var(a) + mu^2 Var(b) + b^2 Var(mu) + 2 mu b Cov(b, mu), and the propagated mean adds Cov(b, mu) to a + b mu. Absent uncertainty is not independence.",
 "An experimental prior is imported only with an estimand bridge that names population, time window, dose, duration, and exposure regime on both sides, plus recency and spend differences. The prior's mapping uncertainty, source dependence, and assumptions are retained. No transport theorem is derived.",
 "An explicit ParameterInterventionResponse experimental estimand translation can name actual source/target population and horizon differences only with a transport premise for the exact target scope. Same-population horizon extrapolation also requires this premise. This extends declaration checking, not transport identification or a dose/duration scaling law.",
 "No posterior, predictive law, identified set, or joint outcome law is produced by the bridge.",
]

