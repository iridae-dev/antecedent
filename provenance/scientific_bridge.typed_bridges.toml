implementation_deviations = [
 "A bridge is a declared derivation, not a theorem: every mapping is conditional on the assumptions the contract lists, and the library records them as unresolved obligations rather than verifying them.",
 "The trial-level surrogate mapping is ordinary least squares of the terminal effect on the surrogate effect with a declared minimum number of trials and coefficient of determination; it does not weight trials by precision, does not model the within-trial error of the effects, and does not report a prediction interval, so the meta-analytic prediction-error and individual-level surrogacy results are not inherited.",
 "The mapping is applied only inside the range of surrogate effects the validation trials covered; extrapolation is refused, which the published criteria do not require.",
 "The measurement correction is the closed-form Rogan and Gladen inversion for known rates (and its forward map); the rates' own sampling variance is not propagated, so no interval is carried.",
 "A predictive quantity is carried unchanged to a causal quantity only under a named identification (adjustment, exchangeability, positivity, consistency) that is declared, not checked, by the bridge; the identification layer owns checking it.",
 "A transported bridge states its transportability premise as a declaration with an identity; no selection-diagram derivation of invariance is performed by the bridge.",
 "Only a declared point mean is carried across a bridge. A nonlinear map of that mean is refused: the square is checked against E[X^2] = (E[X])^2 + Var(X), and the exponential against the normal moment-generating function exp(mu + sigma^2 / 2). Neither check is a general nonlinear bridge, and neither produces a posterior.",
 "An affine map may declare the variance of its intercept and slope and the dependence of the slope estimator on the source estimator. The propagated variance is Var(a) + mu^2 Var(b) + b^2 Var(mu) + 2 mu b Cov(b, mu), and the propagated mean adds Cov(b, mu) to a + b mu. Absent uncertainty is not independence.",
 "An experimental prior is imported only with an estimand bridge that names population, time window, dose, duration, and exposure regime on both sides, plus recency and spend differences. The prior's mapping uncertainty, source dependence, and assumptions are retained. No transport theorem is derived.",
 "An explicit ParameterInterventionResponse experimental estimand translation can name actual source/target population and horizon differences only with a transport premise for the exact target scope. Same-population horizon extrapolation also requires this premise. This extends declaration checking, not transport identification or a dose/duration scaling law.",
 "No posterior, predictive law, identified set, or joint outcome law is produced by the bridge.",
]

upstream_implementations_observed = []

test_sources = [
 "hand-computed ordinary least squares on four validation trials (Sxx = 1.25, Sxy = 1.15, slope 0.92, intercept 0.06)",
 "closed-form misclassification algebra and the independent corrected-prevalence routine of antecedent-stats",
 "enumerated confounded structural model (association 0.54, interventional effect 0.30)",
 "semantic mutation of the stored contract, source claim and derived values by an independent artifact consumer",
 "crates/antecedent-contract/tests/typed_bridges_reference.rs (exact-rational trial-level line, mean-line, affine and Rogan-Gladen delta-method variances, surrogate offset 1e6, effects 1e-6 apart, tied effects, three to twelve trials, both ends of the validated range, both correction directions, square and exponential moments)",
]

[method_review]
status = "reviewed_with_limits"
scope = "The point mappings and propagated variances of the typed bridge in crates/antecedent-contract/src/bridge: BridgeMapping::apply (identity, declared affine, trial-level least-squares line with its range and fit checks, and the Rogan-Gladen inversion and forward map with their attainable ranges) in mapping.rs; the first-order variance and mean of a bridged point in point_propagation.rs (declared affine map, the trial-level mean line with its coefficient moments, the correction's rate variances, and the second-moment expectation of a square); and nonlinear_expectation for the square and exponential maps. Not the contract declaration, licensing, population and regime binding, transport premise, estimand bridge, support maps, claim derivation, provenance and identity digests, joint draws or refusal catalogue: those hold declarations and checks over supplied identities and numbers, and are covered by the existing hand-computed and mutation tests, not by this review."
assumptions = ["Every bridge is conditional on the assumptions its contract lists; the library records them as unresolved obligations and does not verify them (surrogate validity, linkage, transportability, exchangeability).", "The propagated variance is a first-order (delta-method) spread with a Gaussian fourth-moment closure for products, uncalibrated; the declared source-mapping dependence is taken as stated, and the trial-level intercept is assumed independent of the source estimate (only the slope estimator may covary with it).", "Validation effects are treated as exact points; trials are not weighted by precision."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the product source named in its scope, including the numerical helpers it calls, and compared results with definitions evaluated by executing references written for this review; no upstream implementation or test source was consulted or copied. The cited publications were not retrieved in this review: the correspondence is between the product code and the standard definitions those works state, verified numerically, not a page-level reading of the papers."
redistribution = "Primary work is cited, not redistributed. The reference script and its frozen output are repository-authored (MIT OR Apache-2.0); the script uses only the Python standard library (exact rational arithmetic). It is not run in a locked, isolated environment and is not wired into any gate; its output is frozen in the text file and compared by the test."
limitations = "Eight trial sets (four to twelve trials, three trials, tied surrogate effects, effects 1e-6 apart, a surrogate offset of 1e6, a negative slope), three declared affine maps with intercept and slope variances and covariances, and four Rogan-Gladen rate settings in both directions, all evaluated with exact rational arithmetic from the binary64 inputs; values are asserted to 1e-9 (1e-12 for the affine and correction values) and variances to 1e-7 (1e-9 for affine and correction) relative, with an absolute floor of 1e-15. The slope and intercept at a surrogate offset of 1e6 lose about 1e-11 relative to the offset (intercept and slope are formed about the mean but the value is intercept + slope * x), which is inside the asserted tolerance and is not corrected, because the value is bound into claim identities. The meta-analytic prediction error, trial weighting and individual-level surrogacy of the cited criteria are not implemented; the exponential map is a closed-form moment-generating-function check for a Normal law and is refused for a law known by two moments only. The reference script is not run in a locked, isolated environment and is not wired into any gate; its output is frozen in the text file and compared by the test."
sources = ["https://doi.org/10.1093/biostatistics/1.1.49", "https://doi.org/10.1093/oxfordjournals.aje.a112510"]
findings_resolved = ["Defect repaired: the mean-line variance of a trial-level bridge was assembled from the uncentered coefficient moments Var(a) = s^2 (1/k + xbar^2/Sxx), Cov(a, b) = -s^2 xbar/Sxx and x^2 Var(b), whose terms are of order xbar^2 and cancel to a result of order s^2; at a surrogate offset of 1e6 the published variance was 0.0022561530 against the exact 0.0022563809 (relative error 1e-4), and the error grows with the square of the offset. The line variance is now evaluated about the surrogate mean as s^2/k + (x - xbar)^2 Var(b), the same quantity in exact arithmetic; the declared-dependence terms are unchanged.", "Slope, intercept, coefficient of determination, bridged value, range ends, the affine, trial-level and correction variances, and the square moment equal the exact references on every other case."]
