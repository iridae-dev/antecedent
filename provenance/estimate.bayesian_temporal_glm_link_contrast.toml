implementation_deviations = [
  "Uses the same independent-subject, fixed-lag Bernoulli probability-scale contrast as the frequentist temporal link model, with an explicit isotropic Gaussian coefficient prior and one local multivariate-normal Laplace approximation at the MAP.",
  "Transforms every coefficient draw through both intervention regimes and averages rowwise probability differences, then summarizes those contrast draws. The posterior mean is not the maximum-likelihood contrast or a renamed ridge estimate. Empirical covariate-distribution uncertainty, multimodality and Laplace approximation error are not propagated.",
  "The facade selects one earliest complete lag window per independent panel subject; a serially dependent single-series likelihood, unsupported links, and incompatible transferred/custom priors are refused. The static Bayesian/GLM references support the fitting algebra, not temporal identification, route admission or a calibration guarantee.",
]

