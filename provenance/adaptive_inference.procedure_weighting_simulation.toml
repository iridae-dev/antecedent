# Sampling law of an adaptively weighted estimator under the stopping time and policy selection
# by whole-procedure simulation (streams keyed by seed and replicate index). The estimator is
# that of adaptive_inference.adaptive_weighting; this record covers only the simulation of its
# law under a declared procedure.
papers = [
  { title = "Confidence intervals for policy evaluation in adaptive experiments", citation_note = "Previously recorded title and bibliographic detail: Confidence intervals for policy evaluation in adaptive experiments (Hadad, Hirshberg, Zhan, Wager, Athey, PNAS 118(15):e2014602118)", doi = "10.1073/pnas.2014602118", sections = ["adaptively weighted estimators and their behaviour under adaptive data collection"] },
]
implementation_deviations = [
  "Monte Carlo law under a hypothesized truth with the caller reporting Monte Carlo error; it is not a coverage claim. Plug-in variance is a diagnostic.",
  "Estimator history is the terminal-look retained history (revealed and observed units, with the policy's realized probabilities at enrolment); no claim is made about the paper's asymptotic normality at the stopping time.",
  "Outcome-dependent loss makes the scores not martingale differences and is refused.",
]
upstream_implementations_observed = []
test_sources = [
  "crates/antecedent-stats/tests/adaptive_procedure_uncertainty_oracle.rs",
  "crates/antecedent-stats/tests/adaptive_weighting_simulation_reference.rs (simulation against the exact law of five procedures)",
]

[method_review]
status = "reviewed_with_limits"
scope = "simulate_procedure and SimulatedLaw::summarize in crates/antecedent-stats/src/adaptive_inference/procedure_simulation.rs: the seeded whole-procedure simulation of the retained, revealed history (policy rows at enrolment, delivery, attribution, delay, loss, the stopping rule, selection) and the adaptively weighted estimate and plug-in variance at the terminal look. Relies on the weighted estimator reviewed under adaptive_inference.adaptive_weighting and the rule logic of adaptive_inference.procedure_law; this review checks that the simulated law is the exact law of the declared procedure. Not the exact seeded stream (no reference reproduces the generator), coverage or the paper's asymptotic normality at the stopping time."
assumptions = ["The estimator history is the terminal-look retained history with the policy's realized probabilities at enrolment (the delivered mixture under delivered attribution).", "Loss of outcomes independent of their values; the premise gate refuses outcome-dependent loss for the weighting paradigm."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the product source named in its scope, including the numerical helpers it calls, and compared results with definitions evaluated by executing references written for this review; no upstream implementation or test source was consulted or copied. The cited publications were not retrieved in this review (nothing was downloaded and no local copy exists): the correspondence is between the product code and the standard definitions those works state, verified numerically, not a page-level reading of the papers."
redistribution = "Primary work is cited, not redistributed. The reference scripts and their frozen outputs are repository-authored (MIT OR Apache-2.0) and use only the Python standard library. The scripts declare their inline script metadata but are not run in a locked, isolated environment and are not wired into any gate; their output is frozen in the JSON files and compared by the tests."
limitations = "Hadad et al. (2021) was not retrieved (nothing downloaded, no local copy). A seeded simulation cannot be compared with an exact value digit by digit, so the check is statistical: for five procedures of 4 to 6 units (Thompson with a posterior stop and uniform weights, Thompson with variance-stabilizing weights, lagged epsilon-greedy with random loss, batches with exposure failure under delivered attribution, a resource cap with assigned attribution) the exact path enumeration at 60 digits gives the stop probability, the expected enrolment, the distribution of analysed units and of the decision, the probability that an estimate exists, and the exact mean and standard deviation of the estimate and of the plug-in variance; 60,000 seeded replicates agree within five Monte Carlo standard errors on every one, and the standard deviation within 5%. The exact law shows the stopped contrast estimate to be biased (0.431 for a truth of 1/3 with a stop) and the assigned-attribution contrast to estimate the intention-to-treat value (-0.267 for -1/3), which the simulation reproduces. The seed is fixed, so the test is deterministic; another seed replays differently and the same seed replays identically. Five-sigma agreement does not prove a discrepancy smaller than that cannot exist; a coverage property of the plug-in variance is not measured."
sources = ["https://docs.python.org/3/library/fractions.html", "https://docs.python.org/3/library/decimal.html", "https://doi.org/10.1073/pnas.2014602118"]
findings_resolved = ["No defect found: the simulated stop, enrolment, analysed-unit and decision frequencies and the first two moments of the estimate and of the plug-in variance agree with the exact law of each procedure."]
