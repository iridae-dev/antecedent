[non_algorithm_review]
status = "justified_non_algorithm"
kind = "contract"
rationale = "A marked-edge container for temporal CPDAGs with typed context nodes: it stores Tail-Arrow, Tail-Tail and Conflict-Conflict marks between lagged or context nodes and enforces local invariants (no duplicate edge, no contemporaneous or lagged self edge, no directed cycle, no future-to-past directed edge, orientation only of an existing undirected edge)."
no_independent_algorithm = "cpdag.rs and marked_storage.rs contain adjacency bookkeeping, directed reachability for the cycle check and conversion to a TemporalDag; they contain no square root, logarithm, exponential, solve or sampling and no orientation or completion rule. An independent edge-map model with depth-first reachability agrees with the container on the accept or reject decision and the stored edges after every operation of every short sequence over four, three and six nodes, and on the conversion to a TemporalDag at the end of each."
record_sha256 = "324c69b67ca224d2fc3d36dee378370eea91bf44b3565f1daedad80cfa0aba66"

