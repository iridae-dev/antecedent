# Explicit judgment, not an unfilled field: the context-node support is a node kind in the same marked-edge
# container; no J-PCMCI+ discovery, context-system identification or context-specific equivalence is implemented,
# so no paper introduces what it computes. graph.temporal_cpdag carries the container's mapping.
papers = []

implementation_deviations = [
 "The implementation augments a TemporalCpdag with typed context nodes and edges; it does not implement J-PCMCI+, context-system discovery, conditional-independence testing, or latent-context identification.",
 "Context insertion is representational and does not derive or certify a context-specific Markov equivalence class.",
 "The static same-skeleton and same-v-structure theorem does not by itself establish completeness for temporal or context-augmented orientations.",
 "A context node is treated as an exogenous regime indicator at the present: a directed edge from a lagged node into a context is refused with a typed error (ContextCaused), and a context may not cause a lagged node of the past (FutureToPast, the context counted as contemporaneous). The container does not model a lag structure for a context, and an undirected context-system edge may be stored until it is oriented away from the context.",
 "A fully directed graph with context nodes converts to a TemporalDag: an untagged context becomes the contemporaneous node of its variable, a root, with node order kept. A context that carries an environment tag, or whose variable already occupies the contemporaneous slot, cannot be represented and the conversion refuses with a typed error (ContextNotRepresentable); the environment tag is not carried into the TemporalDag.",
]

