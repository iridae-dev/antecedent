[method_review]
status = "reviewed_with_limits"
scope = "winners_curse_bound and its quadrature expected_maximum_independent in crates/antecedent-design/src/decision_reliability/selection.rs: the exact expected maximum of independent Gaussian noise with supplied standard errors (grouped by equal bits, unseen candidates padded at the largest supplied standard error, point-mass candidates), the dependence-free union bound s_max sqrt(2 ln N), the rule that selects between them (the exact maximum only for declared independent streams and only when it does not exceed the union bound), the adjusted value, and the refusals of malformed input. Not a review of the held-out re-evaluation, the sample splitting, the candidate-count bands or the coverage records, which this record also names."
assumptions = ["The Monte Carlo errors of the candidates are independent Gaussian with the supplied standard errors treated as known; then E[e_selected] <= E[max_j e_j], and the expectation of the maximum is the integral of its survival function on both sides of zero.", "A candidate the search considered but did not retain carries the largest supplied standard error; a candidate with zero standard error is a point mass at zero.", "A nonnegative sample covariance does not license the independent-noise comparison, so only an independent-streams declaration selects the exact maximum."]
historical_exposure = "Historical author exposure cannot be independently established. This review read the product source named in its scope and wrote a separate reference of its own from the stated definitions; no upstream implementation or test source was consulted or copied."
redistribution = "The reference script, its frozen output and the test are repository-authored under MIT OR Apache-2.0; mpmath is not a product dependency. The cited primary sources are linked, not redistributed."
limitations = "The primary sources were not re-read in this review (nothing downloaded, no local copy); the upward bias of the maximum of noisy estimates and the sample-splitting argument rest on the record and the code comments. The reference covers ten configurations: six supplied candidates with standard errors from 0.01 to 2.0 alone and padded to 5000 considered, twelve distinct standard errors alone and padded to 100000, zero-noise candidates, a single candidate alone and padded to ten million, and standard errors spanning six orders of magnitude (1e-3 to 1e3) alone and padded; the groups are limited to 4096 distinct standard errors by the product, and a larger set reports the union bound only. The bound is an expectation over repetitions of the whole selection under Gaussian noise with known standard errors, not an interval for the realized selection, and the held-out and splitting routes of the record are outside this review. Calibration of the bound is measured elsewhere and is not examined here. Calibration remains deferred."
sources = ["https://doi.org/10.1287/mnsc.1050.0451", "https://doi.org/10.1093/biomet/62.2.441", "https://mpmath.org/doc/1.3.0/"]
findings_resolved = ["Defect fixed: with a zero-noise candidate the quadrature evaluated the lower half-line term F(-x) at the end point x = 0 as the point mass 1 instead of its limit 0, adding a jump of that size to the Simpson end point and overstating the expected maximum by h/6 (3.7e-4 on E[max(0, 0, Z)] = 0.39894, a 0.1 percent error; larger relative error for fewer panels).", "Defect fixed: one Simpson mesh sized by the largest standard error could not resolve a candidate whose standard error was much smaller, overstating the expected maximum by 6e-3 (1.6e-5 relative) when the standard errors were 1e-3, 1 and 1e3; scales more than a factor of four below the largest now get graded segments (the mesh is unchanged, bit for bit, when every standard error is within a factor of four of the largest, so stored reports do not move), and the result agrees with 20-digit quadrature to 2e-8 relative on all ten configurations.", "The union bound equals s_max sqrt(2 ln N) to rounding including the padding; every dependence declaration other than independent streams reports the union bound; malformed input (no estimate, fewer considered than supplied, a negative standard error, a non-finite in-sample value) is refused."]
