implementation_deviations = [
  "The winner's-curse bound is E[e_selected] <= E[max_j e_j] for Gaussian Monte Carlo errors with the estimated standard errors treated as known; the Gaussian expected maximum is exact quadrature and is used only for independent streams or when all pairwise sample covariances are nonnegative (Sudakov-Fernique), otherwise the dependence-free union bound s_max sqrt(2 ln N) is reported. It is an expectation over repetitions of the selection, not an interval for the realized one.",
  "Candidates considered but not retained are assumed to carry the largest supplied standard error.",
  "Sample splitting here splits draws of a simulated or posterior stream; it is not the data-splitting inference of the cited note and carries no significance-level guarantee.",
]
