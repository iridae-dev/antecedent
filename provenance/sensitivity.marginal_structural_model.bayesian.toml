kind = "derivation"
rationale = "Dirichlet posterior mean of the finite stratum masses and outcome laws, pushed through the existing marginal structural model at Lambda 1; structural zeros stay zero. No interval."
no_independent_algorithm = "msm_dirichlet_posterior calls dirichlet_supported_mean on the masses and each outcome law and then msm_ate_sensitivity at Lambda = 1 + 1e-8 over two grid points; the sensitivity engine itself (the rest of msm_sensitivity.rs, which has its own bounds arithmetic) belongs to the covered record and was not mapped."
covered_by = ["estimate.posterior_mean_kernel", "sensitivity.marginal_structural_model"]
derivation = "Dirichlet(c,...,c) prior and weights w on k atoms give posterior mean (w_i + c) / (sum w + k c); structural zeros are held at zero and updated as a (k-1)-atom law; checked against exact rationals in posterior_mean_reference.rs and in the route's own test."
