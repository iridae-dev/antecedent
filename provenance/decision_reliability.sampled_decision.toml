implementation_deviations = [
  "Maritz-Jarrett is the exact bootstrap standard error of the r-th order statistic r = ceil(n p) (not the Harrell-Davis estimator); weights beyond twelve index standard deviations are dropped and the rest renormalized. It converges at the slow n^(-1/4) rate and is a standard error, not an interval.",
  "The CVaR standard error is the influence-function variance at the sample quantile (the Rockafellar-Uryasev functional's envelope-theorem influence function, derived here), not a result stated in the cited paper; it assumes a continuous utility law near the quantile.",
  "Batch means use floor(sqrt n) non-overlapping batches by default, drop the remainder, and cap the effective sample size at n; the guarantees of the cited paper (strong consistency under mixing conditions) are not checked for the supplied stream.",
  "Importance-weighted estimates use the self-normalized delta-method variance with Kish's effective sample size; weighted quantile and CVaR errors are refused, and weights on dependent streams are refused.",
  "All outputs are numerical standard errors under the supplied law; no interval, coverage or calibration is claimed.",
]
