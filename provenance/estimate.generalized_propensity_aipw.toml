# Derived from the multi-valued-treatment AIPW score and the cross-fitting construction,
# NOT the exact estimator analyzed in either paper. The full-population target standardizes
# every declared level over the whole complete-case population; the pairwise-subpopulation
# target is binary AIPW on the rows at two levels and speaks only for that subpopulation.
implementation_deviations = [
 "Nuisances are a multinomial-logit generalized propensity over the declared level set and a per-level OLS outcome regression, not the arbitrary ML learners the DML analysis admits.",
 "Cross-fitting uses a fixed five folds from a seeded, level-stratified, unit-level fold plan. A training fold missing a level, or with no more rows at a level than design columns, refuses rather than imputing; with no propensity clip, a generalized propensity of exactly zero refuses instead of being floored. The overlap trim is refused: trimming one level would redefine the common-support population of every contrast.",
 "Every complete-case row must be at a declared level: rows at an undeclared level refuse for the full-population target instead of being dropped, because dropping them would silently change the population.",
 "The reported standard error is the plug-in iid influence-function variance of the cross-fitted scores from the shared score table. It is not an efficiency-bound variance. The facade forms the 95% normal interval of the full-population contrast from it but publishes that interval only when a current coverage record measured the construction (target, number of levels, folds and row count); until then it is withheld as scope_not_assessed and the standard error is labelled unmeasured. The pairwise-subpopulation target has no measurement design and always withholds its interval.",
 "The pairwise-subpopulation target excludes rows at other levels by a declared policy and states the target population on the result; it is not an estimate for those rows.",
]

upstream_implementations_observed = []

test_sources = [
 "crates/antecedent-estimate/tests/treatment_levels.rs (three-level simulated truth: closed-form full-population effect and a numerically integrated pairwise-subpopulation effect, independent of the estimators)",
 "crates/antecedent/tests/multilevel_interval_calibration.rs (ignored repeated-sampling design for the full-population interval on the confounded three-level simulation; plain tests pin the construction key and the withheld status)",
 "crates/antecedent-estimate/tests/generalized_propensity_aipw_reference.rs (fixed-fold 60-digit multinomial-logit propensities, per-level least-squares outcome models, propensity floor, level means and every pairwise contrast with the iid influence standard error; refusal of an undeclared level and of a trim)",
]

[method_review]
status = "reviewed_with_limits"
scope = "MultiLevelAipw::fit with the full-population target in crates/antecedent-estimate/src/propensity/generalized.rs: the cross-fitted multinomial-logit generalized propensity on each training fold, the per-level ordinary-least-squares outcome regressions, the floor on the propensity, the per-level scores phi_k = m_k + 1{T=k}(Y - m_k)/max(e_k, floor), the standardized level means, and any pairwise contrast with its iid influence-function standard error from the score table. Relies on the level-stratified cross-fit plan (asserted equal to the recorded plan), the multinomial-logit fit of antecedent-stats and the score-table summary. Not the pairwise-subpopulation target (binary AIPW on the rows at two levels, estimate.aipw), the facade interval and its calibration record, or the learner choice."
assumptions = ["Weak unconfoundedness given the adjustment set and positivity of every declared level are identification assumptions taken as given.", "Independent complete-case rows, each at a declared level; the standard error is the plug-in iid score variance of cross-fitted scores, not an efficiency-bound variance."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the product source named in its scope, including the numerical helpers it calls, and compared results with definitions evaluated by executing references written for this review; no upstream implementation or test source was consulted or copied. The cited publications were not retrieved in this review: the correspondence is between the product code and the standard definitions those works state, verified numerically, not a page-level reading of the papers."
redistribution = "Primary work is cited, not redistributed. The reference script and its frozen output are repository-authored (MIT OR Apache-2.0); the script uses mpmath (BSD-3-Clause), imported at run time and not redistributed here. The script declares its inline script metadata but is not run in a locked, isolated environment and is not wired into any gate; its output is frozen in the JSON file and compared by the test."
limitations = "Eight compared tables of 80 to 120 rows with three or four levels, one or two covariates and three to five folds, whose level-stratified fold plan for the recorded seed is part of the case and asserted equal to the product's: a floor that binds on fitted propensities down to 0.01, an outcome offset of 1e7, a covariate offset of 1e3 at scale 250, two covariates 1e-2 apart, and two covariates 1e-4 apart (correlation 1 - 5e-9). Level means and contrasts are asserted to 1e-6 and standard errors to 1e-5 relative. Not examined: the choice of the plan itself (crossfit_plan), separation handling by the ridge fallback of the GLM, a training fold with a sparse level (refused, tested only by the module's own tests), the pairwise-subpopulation target, cluster or weighted rows, and the 95% interval, whose publication depends on a coverage record. The reference script is not run in a locked, isolated environment and is not wired into any gate; its output is frozen in the JSON file and compared by the test."
sources = ["https://doi.org/10.1093/biomet/87.3.706", "https://doi.org/10.1016/j.jeconom.2009.09.023", "https://doi.org/10.1111/ectj.12097", "https://mpmath.org/"]
findings_resolved = ["No numerical defect: level means, every pairwise contrast and its standard error equal the 60-digit fixed-fold reference on every compared case, including a binding floor and a covariate offset of 1e3.", "An undeclared treatment level is refused rather than dropped, and a declared trim is refused rather than ignored, so neither declaration is silently unused.", "Recorded limit: the multinomial-logit IRLS does not converge on two covariates differing by 1e-4 and refuses with a non-convergence error, where the binary logistic of the cross-fitted AIPW score converges on a comparable design."]
