# Newey and West (1987) Bartlett long-run variance with a Student-t reference (Kiefer and
# Vogelsang's fixed-b idea in the form of a t reference); cluster-robust variance with G - 1
# degrees of freedom. No external implementation is translated.
papers = [
  { title = "Newey and West (1987), A Simple, Positive Semi-Definite, Heteroskedasticity and Autocorrelation Consistent Covariance Matrix, Econometrica 55(3)", sections = ["Bartlett-kernel heteroskedasticity and autocorrelation consistent covariance estimator"] },
  { title = "Diebold and Mariano (1995), Comparing Predictive Accuracy, JBES 13(3)", sections = ["equal predictive accuracy from the mean of a loss-differential series with a long-run variance"] },
  { title = "Kiefer and Vogelsang (2005), A New Asymptotic Theory for Heteroskedasticity-Autocorrelation Robust Tests, Econometric Theory 21(6)", sections = ["fixed-bandwidth asymptotics of Bartlett-kernel HAC t-statistics"] },
]
implementation_deviations = [
  "Publishes the Student-t interval of one predictor's expected score (or expected difference) only for a held-out or unfitted predictor under a declared iid, serial or cluster dependence, and reports it with a calibration status that states whether a current attesting coverage record measured the construction (not measured when none did). An unscoped request refuses with quantity_semantics_mismatch.",
]
upstream_implementations_observed = []
test_sources = ["crates/antecedent-io/tests/predictive_assessment_artifact.rs", "crates/antecedent-validate/tests/predictive_assessment.rs", "crates/antecedent/tests/predictive_assessment_facade.rs", "crates/antecedent/tests/predictive_score_interval_facade.rs", "crates/antecedent/tests/predictive_score_interval_calibration.rs"]

[method_review]
status = "reviewed_with_limits"
scope = "construct_expected_score_interval in crates/antecedent-validate/src/predictive_assessment/interval.rs with variance_of_mean of compare.rs, for a mean case score and a paired score difference under iid, serial and cluster dependence: the canonical case order (a shuffled time index must put the case scores in time order and a cluster label must stay with its score), the iid variance s^2/n with n - 1 degrees of freedom, the Bartlett long-run variance with the declared lag (weights 1 - k/(L + 1), autocovariances divided by n) with n/(L + 1) - 1 degrees of freedom, the cluster-robust variance G/(G - 1) sum of squared centred cluster sums over n^2 with G - 1 degrees of freedom, and the Student-t interval. The construction no longer refuses a bandwidth share above a limit or fewer than ten clusters; it builds the interval for any such design and the attached calibration slot states whether a coverage record measured it. Not a review of the coverage-record resolution that annotates the interval's calibration (expected_score_interval), of the score computations (separately checked), or of the Student-t quantile routine beyond its use here."
assumptions = ["The case scores are a mean of per-case losses of a law fixed before the cases; under the declared dependence the Student-t interval of the mean uses the variance of the declared form, and the paired difference is the mean of the case differences.", "The long-run variance uses the sample mean for centring and no small-sample correction beyond the t reference with n/(L + 1) - 1 degrees of freedom (the fixed-b form).", "The calibration slot attached to the interval states whether a current attesting coverage record measured the construction; this review does not examine it."]
historical_exposure = "Historical author exposure cannot be independently established. This review read the product source named in its scope and wrote a separate reference of its own from the stated definitions; no upstream implementation or test source was consulted or copied."
redistribution = "The reference script, its frozen output and the test are repository-authored under MIT OR Apache-2.0; mpmath is not a product dependency. The cited primary sources are linked, not redistributed."
limitations = "The primary sources were not re-read in this review (nothing downloaded, no local copy), so the statements of the PIT, the non-randomized PIT of discrete laws and the HAC construction rest on the record and the code comments. The reference is one 60-case Gaussian study (an outlier included), a 60-case Bernoulli study, a 40-case finite law and a 40-case ensemble of seven coarse draws with ties, and boundaries at decimal edges are avoided on purpose (a PIT or forecast probability exactly on a bin edge is decided by floating-point rounding in either direction and is not a defect); Student-t critical values are computed by the reference from the incomplete beta function and compared with the library's student_t_ppf at 1e-7. No claim of calibration or coverage is made: every diagnostic is labelled unmeasured and the intervals are constructed without a coverage record and carry a calibration slot that states whether one measured them (that resolution is exercised by the facade tests)."
sources = ["https://mpmath.org/doc/1.3.0/"]
findings_resolved = ["For a mean CRPS and a CRPS difference of two Gaussian predictors over 60 cases, at levels 0.9 and 0.5, the mean, standard error, degrees of freedom and interval ends under iid dependence, serial dependence with lag 3 (a shuffled time index) and twelve clusters (labels assigned out of case order) agree with the reference to 1e-9 on the standard error and 1e-7 on the ends. No defect was found in the interval construction and no product code changed for this record."]
