[non_algorithm_review]
status = "justified_non_algorithm"
kind = "derivation"
rationale = "Robustness verdict of a decision across supplied structures: per-structure expected utilities, the leader of each structure and the range of each action."
no_independent_algorithm = "Enumeration and range arithmetic over supplied per-structure values; no estimator."
derivation = "Each structure s supplies a point value v_s(a) per action a. The action ranges are [min_s v_s(a), max_s v_s(a)]. An action is structurally robust when it is the argmax in every structure; otherwise the verdict is graph-dependent, listing each structure's leader and selecting no action."
