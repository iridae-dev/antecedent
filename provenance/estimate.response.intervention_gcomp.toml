# Independently written plug-in g-computation for hard, additive-shift, and
# stochastic policies. Stochastic policies are integrated by 256 fixed-seed,
# independent-coordinate inverse-CDF Monte Carlo draws generated with SplitMix64;
# soft and longitudinal interventions fail closed.
