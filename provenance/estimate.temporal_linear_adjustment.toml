[method_review]
status = "reviewed_with_limits"
scope = "TemporalLinearAdjustment::prepare, prepare_with_gaps and fit in crates/antecedent-estimate/src/temporal_adjustment.rs for a single pulse treatment time, one outcome horizon and a graph-identified lagged adjustment set: the unfolded-node to lag alignment of the treatment, the outcome and each adjustment column, the windows kept (every window of a complete series, only the intact windows of a series with missing time points), the active-level scaling of the treatment coefficient and the homoskedastic standard error returned through the shared linear-adjustment fit. Not the block bootstrap, the dependence-honest intervals, the panel stacking, the conditional marginal effect, sampling-weighted windows or the multi-step schedules (refused by the module)."
assumptions = ["The adjustment set is the one the temporal backdoor identifier returns for the declared graph; identification itself is taken as given.", "Complete or intact windows are independent rows for the analytic standard error, which is the iid homoskedastic OLS coefficient error (the module documents that it ignores serial dependence).", "Missing values are removed whole-window (listwise) and are assumed missing independent of the innovation given the retained regressors."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the product source named in its scope, including the numerical helpers it calls, and compared results with definitions evaluated by executing references written for this review; no upstream implementation or test source was consulted or copied. The cited publications were not retrieved in this review: the correspondence is between the product code and the standard definitions those works state, verified numerically, not a page-level reading of the papers."
redistribution = "Primary work is cited, not redistributed. The reference script and its frozen output are repository-authored (MIT OR Apache-2.0); the script uses only the Python standard library (fractions), imported at run time and not redistributed here. The script declares its inline script metadata but is not run in a locked, isolated environment and is not wired into any gate; its output is frozen in the JSON file and compared by the test."
limitations = "Six synthetic series of 8 to 40 time points with one treatment lag, a confounder at two lags, an active level of 1 or 2.5, an outcome offset of 1e6 with a treatment offset of 1e3, a confounder walking by 1e-3 per step so that its two lags are nearly collinear, four missing time points, and a tiny series of six windows. Effects are asserted to 1e-9 and standard errors to 1e-8 relative. The ordinary-least-squares solve itself is the estimate.linear_adjustment review; this review adds the alignment, the gap selection and the scaling, and compares the window labels, the row count and the coefficient with the definition. One horizon step and one outcome lag only: horizons above one, a sample anchor other than the first, panel stacking and the split-embargo rows are exercised by existing facade tests but have no exact reference here. The query's effect-modifier list is ignored by this ATE route (the conditional effect is a separate function) and the route does not refuse a query that declares modifiers; this was not changed. The reference script is not run in a locked, isolated environment and is not wired into any gate; its output is frozen in the JSON file and compared by the test."
sources = ["https://doi.org/10.1515/9781400829828"]
findings_resolved = ["No defect found: the product's effect, standard error, analysed-row count and the intact-window labels equal the exact rational reference, including a gapped series (a missing value removes exactly the windows that read it and moves no other row), a treatment contrast other than one, large offsets and nearly collinear confounder lags.", "The route relies on the estimate.linear_adjustment review for the least-squares solve and standard errors; its own arithmetic is the lag alignment, the window selection and the scaling, which this review checks against the definition."]
