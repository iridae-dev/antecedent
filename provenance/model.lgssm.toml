implementation_deviations = [
 "Implements scalar, time-invariant LGSSMs with unit latent observation loading; the conditional variant adds a linear parent mean and intercept. Vector states, missing-observation handling, and a general initial-state model are not implemented.",
 "Counterfactual abduction identifies the residual path r_t = y_t - mean(parents_t) exactly (one lossless f64 per row) rather than a posterior draw of the latent disturbances (eps, eta), which one series does not identify and no counterfactual of the outcome depends on; replay with unchanged parents reproduces the data to rounding error.",
 "Family selection scores the state-space mechanism by its Kalman one-step-ahead predictive log-likelihood (prequential in the state) applied to the out-of-fold linear parent residual; the state parameters are not refit per fold because the rows are a series.",
]

papers = [
 { title = "A New Approach to Linear Filtering and Prediction Problems", doi = "10.1115/1.3662552", sections = ["Recursive forward filter (Kalman filter)"] },
 { title = "Maximum Likelihood Estimates of Linear Dynamic Systems", doi = "10.2514/3.3166", sections = ["Fixed-interval smoother (Rauch-Tung-Striebel recursion)"] },
]

