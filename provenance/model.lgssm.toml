 "crates/antecedent-model/src/lgssm.rs unit tests (abduction_is_lossless_and_reports_invertible_noise, sampled_residual_paths_have_the_prior_variance_and_lag_covariance, likelihood_respects_changes_of_units)",
 "conformance/gcm/lgssm",
 "crates/antecedent-model/src/registry/mod.rs (conditional state-space fit, parent effects, unit scaling, and EM likelihood regressions)",
