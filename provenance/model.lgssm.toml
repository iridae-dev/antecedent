implementation_deviations = [
 "Implements scalar, time-invariant LGSSMs with unit latent observation loading; the conditional variant adds a linear parent mean and intercept. Vector states, missing-observation handling, and a general initial-state model are not implemented.",
 "Innovation packing converts values to f32 and therefore loses precision relative to the f64 Kalman and RTS recursions.",
]

# Joint paths use forward filtering and backward Gaussian conditioning. This
# shares the joint-smoothing target below, not the paper's disturbance sampler.
