implementation_deviations = [
 "Both adjacency and Possible-D-Sep subset testing are bounded by max_cond_size, which defaults to 3.",
 "Possible-D-Sep expansion is limited to 10000 nodes and fails closed when exhausted.",
 "The static orientation stack omits Zhang R5-R7 and substitutes stricter LPCMCI-primed R9/R10 bodies for the corresponding unprimed static rules.",
 "Discriminating and uncovered-path searches have fixed path-count and length budgets and fail closed when exceeded.",
 "Possible-D-Sep conditioning sets are drawn from the union of Possible-D-Sep(x, y) and Possible-D-Sep(y, x) rather than from each set separately; edges are processed in sorted order with the PAG updated between edges; the search runs over (node, predecessor) states and may revisit nodes. A CI query that cannot be evaluated never separates.",
 "A configured FDR adjustment is refused because the multi-phase CI family cannot be adjusted coherently.",
]

