 "crates/antecedent-discovery/src/fci_latent_oracle_tests.rs (FCI under an exact d-separation oracle on 260 random DAGs with hidden variables: adjacency, unshielded colliders and soundness of every mark)",
 "crates/antecedent-discovery/tests/static_discovery_oracle.rs",
 "conformance/discovery/static_oracle_matrix",
]

[method_review]
status = "reviewed_with_limits"
scope = "Static FCI phases 1-5 as orchestrated in fci.rs (skeleton call, collider orientation, Possible-D-Sep adjacency removal, reset to circles, orientation to a fixed point) and possible_d_sep.rs, under a population CI oracle. The skeleton search (static_skeleton.rs), the orientation rules (rule_scheduling.rs, orientation.rs, discriminating-path search) and the sample CI tests were not read line by line; their behaviour enters only through the oracle comparison."
assumptions = ["Independence queries are answered exactly (population limit); finite-sample error control, multiplicity and the choice of alpha are outside this review.", "No selection variables: the graph is a DAG with hidden variables, and a pair is adjacent in the MAG exactly when no subset of the other observed variables d-separates it.", "The depth limit max_cond_size was set to the number of observed variables, so the declared bound did not bind."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the product source named in its scope, including the numerical helpers it calls, and compared results with definitions evaluated by executing references written for this review; no upstream implementation or test source was consulted or copied. The cited publications were not retrieved in this review: the correspondence is between the product code and the standard definitions those works state, verified numerically, not a page-level reading of the papers. causal-learn is used by the existing black-box comparison only."
redistribution = "Primary work is cited, not redistributed. The reference scripts and their frozen outputs are repository-authored (MIT OR Apache-2.0); mpmath is used only to produce the frozen values and is not a product dependency."
limitations = "260 random DAGs on five to seven nodes with one or two hidden nodes (2,166 observed pairs, 679 unshielded colliders, 2,090 marks checked). Adjacency and unshielded-collider status are compared exactly; every circle-free mark is checked for soundness against true ancestry. Completeness of the orientation rules (that no mark Zhang's rules determine is left a circle) is not asserted, nor is correctness with selection variables, with a binding max_cond_size, or with the budgets exhausted. Graphs above seven nodes and more than two hidden nodes were not sampled. The oracle comparison is population-level; it does not test the CI tests or alpha."
sources = ["https://doi.org/10.48550/arXiv.1302.4983", "https://doi.org/10.1016/j.artint.2008.08.001"]
findings_resolved = ["Under the exact oracle the FCI adjacency equals the maximal-ancestral-graph skeleton, unshielded colliders are oriented exactly when the middle node is in no separating set, and no arrowhead or tail contradicts the true ancestry, on all 260 models. A control with max_cond_size = 0 fails the adjacency check at once, so the comparison is sensitive.", "The earlier unit tests used an oracle that ignored conditioning sets, so they could not exercise Possible-D-Sep; this is the first test in which Possible-D-Sep decisions depend on the conditioning set. How many of the 260 models needed a Possible-D-Sep removal was not counted.", "No defect was found in the phase orchestration or the Possible-D-Sep search. The deviations recorded above (union pool, sequential PAG updates, walk-based search) did not change the oracle result on the sampled models."]
