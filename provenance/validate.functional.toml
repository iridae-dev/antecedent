 "Window contrasts add three checks on the unrolled window table: refits on random contiguous stretches (80 percent, plus 50 percent under full validation), refits with the treatment columns rotated together by span + offset windows (offset uniform over the rotations that keep the rotated treatment off its own stretch) against a null of zero, and under full validation a split-half z test of the first n/2 windows against the rest using circular window-block bootstrap standard errors (forty replicates). A half covered by a single resampling block has no resampling spread and the test is reported unusable.",
