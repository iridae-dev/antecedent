# Review: validate.functional is a repository-defined battery over the repository's own identified
# functionals (FunctionalEffect, FunctionalDistribution); no primary source introduces it and none is
# cited (papers = []). The sources the file once implied could not be verified and none was invented.
[method_review]
status = "reviewed_with_limits"
scope = "refute_path, refute_distribution and refute_window_contrast in crates/antecedent-validate/src/functional.rs on discrete (binary/ternary) finite-SCM tables, with the helpers they call in common.rs (with_row_subset, with_contiguous_row_window, replicate_p_value, finish_p_report) and the private max_conditional_tv, rotate_columns, row_range and subset_stream: the Bernoulli row masks and per-slot streams, the exact back-door effect, back-door law (unconditional and conditioned on the adjustment variable) and path-specific mediation contrast of every perturbed table, the normalization check, the maximum conditional total variation including lost atoms and lost conditioning groups, the stretch window length and start, the rotation count, offset and circular shift, the p-value of the supplied original (or zero) under the replicate spread, the split-half z test with its zero-spread rules, the verdict, the report fields and the refusal of a refit whose identity reads an empty cell. Not the identification of the functional (identify crates), the plug-in estimators themselves beyond the exact evaluations compared here, the block-bootstrap standard errors (taken from the library's own estimator and asserted only through the z test they feed), or the temporal ADMG unrolling that produces a real window table."
assumptions = ["The checked statement is the repository-defined one: a stability gate of the frozen identified functional under row subsets, stretches, rotated treatment and halves; this review checks the code against that statement, not against any coverage or power theory.", "A window table is any table whose rows are windows; the review feeds the window refuter finite static tables with a declared span, so the stretch, rotation and split arithmetic is exercised on exact cell counts but the overlap between consecutive real windows is not.", "Perturbations (Bernoulli masks, stretch and rotation uniforms) and the two half standard errors are the library's own streams and estimator, regenerated by the test and asserted equal to the frozen ones."]
historical_exposure = "Historical author exposure cannot be independently established. This review read functional.rs and the shared helpers and wrote its own reference from the stated definitions in exact rational arithmetic (fractions.Fraction) over the contingency table of each perturbed row set; no upstream implementation was consulted and no paper was retrieved."
redistribution = "The reference script, frozen output and Rust test are repository-authored under MIT OR Apache-2.0; the script uses only the Python standard library (math.erfc for the normal tail)."
limitations = "No primary source is cited because none was located or retrieved (nothing was downloaded); the checks are verified against their stated definitions only. Eleven synthetic tables are compared: windows of 12 to 120 rows with spans 2 to 30 (stationary, drifting, a single admissible rotation, no admissible rotation, sparse), distributions of 90 to 600 rows (unconditional and conditioned on a ternary adjustment variable) and path-specific contrasts of 24 to 400 rows, each in cheap and full mode and, for windows and paths, with the supplied original shifted by 0.15 so the stability verdict fails; values at 1e-9 relative, p-values at 1e-9, verdicts exactly except within 1e-7 of the 0.05 or 0.1 threshold; scaled copies of the original table probe the normalization tolerance. The split-half bootstrap standard errors are the library's own, so only the z test and the half partition are independent. The first and second halves share span-1 series times in a real window table, so the split-half test is somewhat anticonservative there; that dependence is not examined. Missing values, sampling weights, a Bayesian estimator, continuous outcomes and tables with an analysis mask other than the Bernoulli one are not exercised. A stretch, subset or rotation that leaves an identity cell empty makes the whole refuter error rather than skip the replicate; the test pins that behaviour rather than endorsing it. The mean total variation threshold 0.1 is descriptive, not calibrated."
sources = ["https://docs.python.org/3/library/fractions.html", "https://docs.python.org/3/library/math.html#math.erfc"]
findings_resolved = ["Defect fixed: split_half took a zero bootstrap standard error as a valid estimate when a half of the windows is covered by a single resampling block (half shorter than the circular block length), and then rejected stationarity with p = 0 (or passed with p = 1) on no resampling evidence while reporting informative = true; it now reports the check unusable (informative = false, not passed). Failing-first: the reference expects an unusable report for the single-admissible-rotation and no-rotation tables and the test failed on informative before the change. Everything else (masks and per-slot streams, exact effects and laws, total variation, stretch/rotation arithmetic, p-values, z test, verdicts, error propagation) agrees with the exact reference."]
record_sha256 = "5f17b1472c5ce08dd0cfc73597ce779e3e16d0fb55cd396b3740ba1e8f337247"

