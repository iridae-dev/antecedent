  "The implementing module is crates/antecedent-estimate/src/propensity/penalized.rs. It states: This is a *declared nuisance choice*, distinct from GlmOptions::ridge_on_separation (a rescue the estimation paths refuse to keep).",
  "A ridge-logistic or lasso-logistic propensity is fit on each cross-fit fold's training rows only; its penalty is chosen from a fixed grid by inner cross-validated log loss on those same training rows (seeded and replayable), so the evaluation fold never informs the penalty (nor, for the lasso, the selected support).",
  "The fits reuse antecedent-learn's RidgeLogisticLearner / LassoLogisticLearner and cross-fit driver; there is no second ML stack.",
]

