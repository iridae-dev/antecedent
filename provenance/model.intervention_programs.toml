# Programmable interventions: a typed expression language over a node's generated value and
# other variables' current values, compiled to postfix column programs and run by one shared
# executor. A transform is the structural-equation form X := f(X_generated, other variables)
# applied after the mechanism (the effect of an additive shift generalised to any function); an
# assignment is a computed do-intervention X := f(other variables), which replaces the mechanism.
# Both are definitions of the intervened model; no estimator and no paper is implemented, so no
# estimation guarantee is claimed.
papers = [
 { title = "Causality", citation_note = "Previously recorded title and bibliographic detail: Causality: Models, Reasoning, and Inference", doi = "10.1017/CBO9780511803161", sections = ["Interventions and the do operator", "structural equations and policy-dependent interventions"] },
]

implementation_deviations = [
 "Reads of other variables are of their current-draw values after any intervention on them; the dependency order adds each program's reads to the graph's parent edges, and a read that closes a cycle is refused rather than iterated to a fixed point.",
 "Observational identification is licensed only when the program folds to a constant (a hard level); a transform or an assignment that reads other variables is simulation and counterfactual-execution only, since its interventional law is not a point mass at a level.",
 "Counterfactual execution replays the abduced noise through the transform; for categorical noise the rank-preservation disclosure of the counterfactual engine applies unchanged.",
 "Temporal execution is a rollout of the one-slice model: lagged reads load realised values of earlier steps from a history window laid out beside the current columns, so the shared executor is unchanged; the slice model has no lagged parents of its own, so history enters a rollout only through value programs.",
 "Division, clipping with inverted bounds and any non-finite result are refused at execution; both branches of a conditional are evaluated and only the selected value is used.",
 "A prepared policy compiles the program's overlay and resolves the licence of each route once against one model and runs the same policy-value executor on them, so a rerun equals the one-shot value bit for bit; rebinding to a refitted model resolves the overlay and licence against it and does not compile the program again. The practitioner handle (antecedent.prepare with a policy-program question) fits the model along the declared graph and reports the same support decision, a contract of the structural assumptions and this provenance record.",
 "The policy value reports the mean of an outcome under a program, the mean with no intervention on the same noise and their paired difference, with the Monte Carlo error of the draws only; the fitted model's own uncertainty is reported unquantified and no interval is claimed, so the value is a property of the fitted model and not of the population.",
 "The counterfactual rollout of a factual panel abduces each step's noise from that step's table independently and replays it through the temporal executor; a unit's earlier steps enter only through the programs' lagged reads of the replayed (counterfactual) steps, and the rank-preservation disclosure of the counterfactual engine applies at every step.",
 "A recoverable callback is encoded as its recovery record (source digest, entry point, declared inputs and output, pinned dependency versions) under a separate encoding version; programs without callbacks keep their version and identity. A consumer supplies the implementation and the record is verified against it before replay. The record identifies source text and pins, not behaviour: a function that reads a clock, randomness or hidden state is not detectable from its source.",
]

upstream_implementations_observed = [
 { project = "dowhy", exposure = "black-box comparison only" },
]

test_sources = [
 "crates/antecedent-model/tests/intervention_programs.rs (hand simulation on identical noise, scalar interpreter, Gaussian closed forms)",
 "crates/antecedent-counterfactual/src/engine.rs unit tests (forward sampling and counterfactual replay agree)",
 "crates/antecedent-io-core/src/query_wire.rs unit tests (wire round trip)",
 "crates/antecedent-counterfactual/tests/policy_routes.rs (sampling, counterfactual execution and temporal rollout agree bit for bit on shared noise; hand recursions with lagged reads)",
 "crates/antecedent-io-core/src/policy_program_artifact.rs and crates/antecedent-io-core/tests/policy_program_execution.rs (versioned encoding, identity, tamper and version refusals, replay)",
 "crates/antecedent/tests/policy_python_parity.rs and python/tests/test_policy_workflows.py (a prepared policy and the prepare handle equal the one-shot value bit for bit and compile the program once)",
 "python/tests/test_intervention_programs.py (Python programs run the same executor; identity pinned to the Rust digest)",
 "python/tests/test_dowhy_comparison.py (functional intervention and hard-set interventional means, and unit counterfactuals, against gcm.interventional_samples and gcm.counterfactual_samples; DoWhy values computed at test time by the pinned version, skipped when it is absent)",
  "crates/antecedent-model/tests/program_expression_reference.rs (independent interpreter over random typed expression trees and awkward inputs)",
]

[method_review]
status = "reviewed_with_limits"
scope = "The expression language of intervention programs as executed by NodeProgram::compile_columns and the shared postfix executor apply_node_program: constants, reads, negation, + - * /, minimum and maximum (NaN if either is NaN), clipping (NaN if a bound is NaN or inverted), the six comparisons, not/and/or, conditionals selected per row with both branches evaluated, indicators, and the refusal of a non-finite result. Compared with an independent interpreter of the documented definitions in binary64. The dependency ordering, route licensing, transform/assign wiring into a model, history windows and the Python and wire encodings are exercised by the existing intervention_programs tests, not by this reference; Pearl is cited only for what an intervention is, and the language semantics are repository-defined."
assumptions = ["The documented semantics are the specification: IEEE binary64 operations, a non-finite final value is a refusal, and an unselected conditional branch does not matter even when non-finite.", "Inputs are finite, as the executor requires."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the product source named in its scope, including the numerical helpers it calls, and compared results with definitions evaluated by executing references written for this review; no upstream implementation or test source was consulted or copied. The cited publications were not retrieved in this review: the correspondence is between the product code and the standard definitions those works state, verified numerically, not a page-level reading of the papers."
redistribution = "The reference script and its frozen output are repository-authored (MIT OR Apache-2.0); the script uses only the Python standard library. It declares its inline script metadata but is not run in a locked, isolated environment and is not wired into any gate; its output is frozen in the JSON file and compared by the test."
limitations = "220 random typed trees of depth up to four over two columns, each on 24 rows drawn from fifteen awkward values (signed zeros, subnormals, 1e154, plus and minus 1e308, ties): 5280 evaluations of which 859 are refusals, and every finite result must equal the reference exactly (numerical equality, so a signed zero is not distinguished). Overflow, division by zero, inverted clip bounds and equal-value comparisons are therefore all exercised. Callbacks, lagged reads and the generated-value read (transform route) are outside this reference. The reference is a second implementation of the same documented semantics by the same authors, so a shared misreading of the documentation would not be caught; the Pearl text was not retrieved."
sources = ["https://doi.org/10.1017/CBO9780511803161"]
findings_resolved = ["No defect found: every finite value and every refusal agreed with the independent interpreter."]
record_sha256 = "44ef702e4197727395272c9b6a60ab6cbf6631bccbeb1dc8fb7bb801e9443a77"

