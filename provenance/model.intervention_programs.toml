# Programmable interventions: a typed expression language over a node's generated value and
# other variables' current values, compiled to postfix column programs and run by one shared
# executor. A transform is the structural-equation form X := f(X_generated, other variables)
# applied after the mechanism (the effect of an additive shift generalised to any function); an
# assignment is a computed do-intervention X := f(other variables), which replaces the mechanism.
# Both are definitions of the intervened model; no estimator and no paper is implemented, so no
# estimation guarantee is claimed.
papers = [
 { title = "Causality", citation_note = "Previously recorded title and bibliographic detail: Causality: Models, Reasoning, and Inference", doi = "10.1017/CBO9780511803161", sections = ["Interventions and the do operator", "structural equations and policy-dependent interventions"] },
]

implementation_deviations = [
 "Reads of other variables are of their current-draw values after any intervention on them; the dependency order adds each program's reads to the graph's parent edges, and a read that closes a cycle is refused rather than iterated to a fixed point.",
 "Observational identification is licensed only when the program folds to a constant (a hard level); a transform or an assignment that reads other variables is simulation and counterfactual-execution only, since its interventional law is not a point mass at a level.",
 "Counterfactual execution replays the abduced noise through the transform; for categorical noise the rank-preservation disclosure of the counterfactual engine applies unchanged.",
 "Temporal execution is a rollout of the one-slice model: lagged reads load realised values of earlier steps from a history window laid out beside the current columns, so the shared executor is unchanged; the slice model has no lagged parents of its own, so history enters a rollout only through value programs.",
 "Division, clipping with inverted bounds and any non-finite result are refused at execution; both branches of a conditional are evaluated and only the selected value is used.",
 "A prepared policy compiles the program's overlay and resolves the licence of each route once against one model and runs the same policy-value executor on them, so a rerun equals the one-shot value bit for bit; rebinding to a refitted model resolves the overlay and licence against it and does not compile the program again. The practitioner handle (antecedent.prepare with a policy-program question) fits the model along the declared graph and reports the same support decision, a contract of the structural assumptions and this provenance record.",
 "The policy value reports the mean of an outcome under a program, the mean with no intervention on the same noise and their paired difference, with the Monte Carlo error of the draws only; the fitted model's own uncertainty is reported unquantified and no interval is claimed, so the value is a property of the fitted model and not of the population.",
 "The counterfactual rollout of a factual panel abduces each step's noise from that step's table independently and replays it through the temporal executor; a unit's earlier steps enter only through the programs' lagged reads of the replayed (counterfactual) steps, and the rank-preservation disclosure of the counterfactual engine applies at every step.",
 "A recoverable callback is encoded as its recovery record (source digest, entry point, declared inputs and output, pinned dependency versions) under a separate encoding version; programs without callbacks keep their version and identity. A consumer supplies the implementation and the record is verified against it before replay. The record identifies source text and pins, not behaviour: a function that reads a clock, randomness or hidden state is not detectable from its source.",
]

