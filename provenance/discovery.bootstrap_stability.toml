implementation_deviations = [
 "The frequencies are a bootstrap distribution of the search over resamples of the whole data, not stability selection over half-size subsamples with a selection threshold and an error-control bound; no threshold is applied and no finite-sample error bound is claimed.",
 "The resample follows the declared sampling design: rows with replacement for independent subjects, circular blocks (length the larger of the lag span and the cube root of the series length) for a dependent series, whole units with replacement for a panel; a clustered design on a single table, a dependent-series design on a table and an independent-subject design on one series are refused rather than resampled as rows.",
 "A circular-block resample of a lagged search joins blocks at seams, so a lag window that straddles a seam pairs values that were not observed together; the block length keeps that share of windows small and the share is not corrected.",
 "A resample on which the search fails is counted as failed mass and never redrawn; the table is published only when at least half the requested resamples and at least two returned a structure.",
 "The coverage of the frequencies as an estimate of the search's sampling law is not measured.",
]

