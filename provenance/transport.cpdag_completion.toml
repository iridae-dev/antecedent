# Enumeration of the DAG members of a Markov equivalence class given as a CPDAG.
# The equivalence criterion (same skeleton and same v-structures) and the CPDAG as
# the essential graph of a class are the cited characterizations; the search that
# lists the members (orient each undirected edge, prune cycles and new unshielded
# colliders, keep every directed CPDAG edge) is original engineering metered by the
# shared SearchBudget. The covered-edge results were checked in the author's
# primary paper: https://maxchickering.com/publications/uai95.pdf (pp. 2–3).
# DOIs and theorem numbers for the two older characterizations remain omitted.
papers = [
  { title = "A Transformational Characterization of Equivalent Bayesian Network Structures (Chickering, UAI 1995)", sections = ["Lemma 1: an edge reversal preserves DAG equivalence iff the edge is covered", "Theorem 2: equivalent DAGs are connected by covered-edge reversals; used to reject falsely fixed edges in a supplied CPDAG"] },
  { title = "Equivalence and Synthesis of Causal Models", sections = ["the criterion that two DAGs are Markov equivalent exactly when they have the same skeleton and the same v-structures"] },
  { title = "A characterization of Markov equivalence classes for acyclic digraphs", sections = ["the essential graph (completed pattern) of a Markov equivalence class and its directed and undirected edges"] },
]
implementation_deviations = [
  "Implements bounded enumeration of the class members, not a theorem of either paper: it assumes the supplied graph is a valid CPDAG (an input that is not one is refused as cpdag_scenarios.not_a_cpdag) and lists every DAG with the CPDAG's skeleton and v-structures that keeps each directed edge and is acyclic; the test oracle is an independent brute force over all skeleton orientations.",
  "Bounded to at most 6 fully observed static nodes and 64 completions; selection edges and latent (bidirected) pairs are refused, never projected away, and no PAG or MAG class is enumerated.",
  "Each completion is decided by the classical catalog transport route as one scenario of the existing finite scenario set and evaluated against supplied exact laws, so that route's scope is inherited unchanged. Evidence is bound per canonical completion identity (BLAKE3 over the sorted parent-child edges): evidence certified for one completion never satisfies another, and a completion with no evidence is missing_evidence.",
  "No graph probability, mixture identification, weighted report or interval across completions is produced; the structural envelope is an unweighted range over the identified completions with identified, unidentified, unevaluated and never-enumerated counts kept apart.",
  "One SearchBudget charges every orientation attempt, stored completion and completion decision; after a stop the unseen count is bounded by the number of orientation assignments without restarting enumeration; a limit stop exports and replays its identical prefix, a cancellation never exports.",
]
upstream_implementations_observed = []
test_sources = [
  "crates/antecedent-identify/tests/cpdag_completion.rs",
  "crates/antecedent-estimate/tests/cpdag_scenarios.rs",
  "crates/antecedent-io/tests/cpdag_completion_artifact.rs",
  "python/tests/test_cpdag_scenarios.py",
]

[method_review]
status = "reviewed_with_limits"
scope = "enumerate_cpdag_completions and its CPDAG admission test in crates/antecedent-identify/src/sid/cpdag_completion.rs, for every partially directed graph (each node pair absent, undirected or directed either way) on three and four nodes: a graph that is the essential graph of a Markov equivalence class yields exactly the class members, and every other graph is refused with the not-a-CPDAG detail. Not a review of the evidence binding and transport decision per completion, of the search budget and its receipts, of graphs above four nodes beyond the existing fixed cases, or of selection or latent edges (refused by this module)."
assumptions = ["Two DAGs are Markov equivalent exactly when they have the same skeleton and the same unshielded colliders; the essential graph of a class directs an edge exactly when every member orients it the same way (Chickering 1995; Verma and Pearl; Andersson, Madigan and Perlman).", "A supplied graph is a CPDAG exactly when it equals the essential graph of some class."]
historical_exposure = "Historical author exposure cannot be independently established. This review read the product source and wrote a separate reference of its own from the definition; no upstream implementation or test source was consulted or copied."
redistribution = "The references are repository-authored under MIT OR Apache-2.0 and run inside the crates' own tests; the primary sources are cited and not redistributed."
limitations = "The primary sources were not re-read in this review (no downloads were made and no copy was read from this environment); the definitions used by the reference are the standard statements, so a mistake in how a record or this reference states a method would not be detected here. All 64 three-node and all 4096 four-node partially directed graphs are submitted (the 11 and 185 classes are each accepted), but five- and six-node inputs rely on the existing fixed cases in cpdag_completion.rs and on a different record's strided five-node comparison (graph.cpdag_completion). Directed cycles are refused at graph construction and so are not reached by the admission test. The per-completion transport decision, evidence binding and budget behavior are not reviewed here. Calibration remains deferred."
sources = ["https://maxchickering.com/publications/uai95.pdf"]
findings_resolved = ["Grouped every labelled DAG on three and four nodes by skeleton and unshielded colliders, built each class's essential graph from the definition, and required the enumerator to return exactly the class for each of the 11 and 185 essential graphs and to refuse every other of the remaining mixed graphs (64 and 4096 in total) as not a CPDAG; the enumeration was exportable with no unenumerated remainder every time.", "No defect requiring a change to the completion enumeration or admission test was found. Code edits: a new integration test file (crates/antecedent-identify/tests/cpdag_class_exhaustive.rs) and its [[test]] entry only."]
