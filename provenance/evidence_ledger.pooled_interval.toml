# The new equal-study Gaussian construction is distinct from legacy Wald/HKSJ pooling.
papers = [
  { title = "t-Statistic Based Correlation and Heterogeneity Robust Inference (Ibragimov and Muller, 2010)", doi = "10.1198/jbes.2009.08046", sections = ["2.1: conservative Student t test for independent Gaussian estimates with common marginal mean and unequal unknown variances"] },
]
implementation_deviations = [
  "EqualStudyGaussian uses equal study weights and study-level Student t uncertainty, avoiding random estimated-variance precision weights. Independent Gaussian random effects enter the marginal study variances. A common marginal mean is required; arbitrary unequal fixed study means are not covered. This new method identity has no inherited Wald/HKSJ calibration and remains pending formal validation.",
  "Implements the Wald z interval of the fixed-effect pooled mean and the Hartung-Knapp-Sidik-Jonkman t interval of the random-effects mean in the facade; each is reported only through a currently attesting coverage record of the whole method, and refuses cell_not_licensed otherwise.",
]
