# Discovery on one half of the rows, estimation on the disjoint other half. The single-split
# idea is cited as the closest published statement; the whole-method coverage statement, the
# acceptance rule (a finished search with one fully directed graph) and the measured family
# are original bookkeeping. PC and partial correlation are the standard constraint-based
# algorithm and test, reimplemented in this repository; backdoor adjustment by the treatment's
# parents and the ordinary least-squares interval are textbook.
papers = [
  { title = "A note on data-splitting for the evaluation of significance levels", citation_note = "Previously recorded title and bibliographic detail: A note on data-splitting for the evaluation of significance levels (Cox, Biometrika 62, 1975)", doi = "10.1093/biomet/62.2.441", sections = ["selection on one part of the data and evaluation on the other"] },
  { title = "Causation, Prediction, and Search", citation_note = "Previously recorded title and bibliographic detail: Causation, Prediction, and Search (Spirtes, Glymour, Scheines, 2nd ed., MIT Press, 2000)", doi = "10.7551/mitpress/1754.001.0001", sections = ["the PC algorithm and collider orientation"] },
]
implementation_deviations = [
  "The interval's coverage is a measured property of the whole method over the declared family (linear-Gaussian, causally sufficient, faithful, fully orientable class, five to seven variables). It is not a statement about the graph discovered on one dataset: faithfulness and causal sufficiency are not testable from that dataset.",
  "A structure with any unresolved edge, an exhausted search bound or conflicting orientation evidence reports no interval. No completion of an equivalence class is part of the measured construction; a declared completion is a different design with no record.",
  "Discovery and estimation on the same rows are a different construction, measured only as a named boundary under its own key, and never attested.",
  "The test, threshold, split share and level are fixed to the measured values and are not request fields.",
]
upstream_implementations_observed = []
test_sources = [
 "crates/antecedent-io/tests/sample_split_effect_reference.rs (exact rational least squares with offsets and near-collinearity; the route against the split by definition)",
 "crates/antecedent-io/tests/sample_split_parent_set_effect_reference.rs (acceptance over every marked four-node graph)",
 "crates/antecedent/tests/sample_split_effect_facade.rs",
 "crates/antecedent/tests/sample_split_effect_calibration.rs",
 "python/tests/test_sample_split_effect.py",
]

[method_review]
status = "reviewed_with_limits"
scope = "adjusted_effect and effect_on_structure in crates/antecedent-io/src/measured_inference/split_effect.rs: the treatment's parents read from a fully directed completed graph as the adjustment set (refusal of any unresolved edge, of an outcome oriented into the treatment and of a non-static or non-CPDAG structure), the ordinary least-squares coefficient of the treatment, the homoskedastic standard error sqrt(rss/(n-k) [(X'X)^-1]_tt) and the Student interval on n-k degrees of freedom, and the route's row split (the seeded permutation reproduced from its definition) and composition on frozen five-variable data. The PC search that produces the structure is reviewed in discovery.pc and the Student quantile in the special-function kernels; neither is re-reviewed here, and whole-method coverage (the measured calibration) is not asserted by this review."
assumptions = ["Linear-Gaussian, causally sufficient and faithful data with a fully orientable class are the premises of the measured family; the review checks arithmetic and acceptance logic, not those premises.", "Discovery uses none of the analysis rows, so the interval is conditional on the selected graph; the frozen data are built so that the treatment is a collider of two independent parents, which makes the discovered class fully directed and the expected adjustment set the true parents.", "The rational reference takes the binary64 values given to the product as exact rationals, so differences are the product's rounding alone."]
historical_exposure = "Historical author exposure cannot be independently established from retained artifacts. This review read the product source named in its scope and compared results with definitions evaluated by an executing reference written for this review; no upstream implementation or test source was consulted or copied. The cited publications were not retrieved in this review (no paper was downloaded or read here): the correspondence is between the product code and the standard definitions those works state, verified numerically, not a page-level reading of the papers."
redistribution = "The reference script and its frozen output are repository-authored (MIT OR Apache-2.0); the script uses only the Python standard library and mpmath (BSD-3-Clause, imported at run time and not redistributed). It declares inline script metadata but is not run in a locked, isolated environment and is not wired into any gate; its output is frozen in the JSON file and compared by the test."
limitations = "Regression: nine designs (60 to 100 rows, up to five covariates) with columns offset by 1e5 to 1e9, a covariate within 1e-4 and 1e-6 of the treatment, the smallest admissible sample (n = k + 2), tiny-scale columns and an exact collinearity (refused); coefficient, standard error and interval at five levels agree with exact least squares to 1e-6 relative at worst (the check is at 1e-6, not tighter). Route: one 800-row five-variable dataset with one split seed, where the split rows equal the definition exactly and the interval equals exact least squares on those rows to 1e-9; discovery is not reproduced in the reference, so that the adjustment set is the true parents is asserted rather than derived. Not covered: heteroskedastic errors (the standard error is the classical one by construction, and the measured calibration is the only evidence about its adequacy), a confounder the search misses, designs with exact ties in a PC test, and any claim about the discovered graph. The primary sources (Cox 1975; Spirtes, Glymour and Scheines) were not retrieved in this review; the single-split idea and the PC algorithm are cited as context, and the reference executes the least-squares definitions, not those texts."
sources = ["crates/antecedent-io/tests/sample_split_effect_reference.rs", "crates/antecedent-io/tests/oracle_data/sample_split_effect_reference.py", "crates/antecedent-io/tests/oracle_data/sample_split_pipeline_reference.py", "https://mpmath.org/"]
findings_resolved = ["Defect repaired (failing first): adjusted_effect formed the uncentred normal equations X'X and refused a well-posed design as singular once the columns carried a large offset (a design with outcome near 1e6, treatment near 1e5 and a covariate near -1e6 was refused with split_effect.design_singular, where exact least squares has a unique solution), and lost digits well before that. It now centres the columns (the slopes and their covariance are unchanged by the intercept) and solves by Householder QR, refusing only a column that is constant or within 1e-9 of its own length from the span of the earlier columns. The facade suites for both routes (35 tests) still pass.", "Added an exhaustive check of the fixed-graph acceptance rule over all acyclic marked graphs on four nodes (7,212 patterns, two treatment/outcome choices each): the adjustment set equals the sources of directed edges into the treatment and every unresolved edge anywhere or an outcome parent is refused, with no disagreement.", "The seeded split used by the route equals its splitmix64 Fisher-Yates definition row for row on the frozen data, and the full route's coefficient, standard error and interval equal exact least squares on those rows."]
