[method_review]
status = "reviewed_with_limits"
scope = "switchback::switchback_itt (point and sequence sandwich variance; the interval gating conditions are read but only the point-only case is asserted here): the unit-period Horvitz-Thompson contrast (1/n) sum (A_i Y_i/p_i - (1-A_i) Y_i/(1-p_i)), the sequence-scored variance S/(S-1) sum_s (T_s - Tbar)^2 / n^2 for equal and unequal sequence lengths, and the refusal when one arm is never observed. Not the Student interval coverage, the calibration test, the posterior form or the history estimator."
assumptions = ["Independent Bernoulli assignment per unit-period with the known marginal probabilities, no carryover and no interference between sequences are design premises taken as given and cannot be tested from the observations.", "Sequences are the independent pieces and dependence inside a sequence is unrestricted."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the product source named in its scope, including the numerical helpers it calls, and compared results with definitions evaluated by executing references written for this review; no upstream implementation or test source was consulted or copied. The cited publications were not retrieved in this review: the correspondence is between the product code and the standard definitions those works state, verified numerically, not a page-level reading of the papers."
redistribution = "Primary work is cited, not redistributed. The reference script and its frozen output are repository-authored (MIT OR Apache-2.0); the script uses only the Python standard library. The script declares its inline script metadata but is not run in a locked, isolated environment and is not wired into any gate; its output is frozen in the JSON file and compared by the test."
limitations = "Three designs of three sequences with six unit-periods each (lengths 2,2,2 and 1,3,2, and equal lengths with an outcome offset of 1e8), all 64 assignments of each enumerated; effects and variances are asserted to 1e-9 relative (the offset costs the centred scores about 1e-8 absolute) and the one-arm schedules to be refused. The reference script asserts that the expected effect equals the potential-outcome average and that the expected variance equals the exact variance of the sequence totals plus the nonnegative term S/(S-1) sum_s (mu_s - mubar)^2 / n^2 of unequal sequence means, so the variance is conservative and is exact only when the sequence effect totals coincide; it also holds for unequal lengths. The 30-sequence interval gate and its coverage are not exercised (the existing calibration test measures coverage separately); three-sequence designs are asserted point-only."
sources = ["https://doi.org/10.1080/01621459.1952.10483446"]
findings_resolved = ["No defect found: the point estimate and the sequence variance reproduce the exact rational value on all 192 enumerated assignments, with equal and unequal sequence lengths and a 1e8 outcome offset, and the schedules that never observe an arm are refused. The exact enumeration shows what the variance estimates: the sequence variance of the totals plus a nonnegative between-sequence term, so it is conservative, never anti-conservative, under heterogeneous sequence effects."]
