# Strategy-table implementation id: estimate.bayesian_synthetic_control
# (EstimatorId::BayesianSyntheticControl, public name
# bayesian.synthetic_control).
#
# The cited paper supplies the synthetic-control estimand: the average
# post-intervention gap between the treated unit and the donor-weighted
# average of the donors' outcomes, with weights on the simplex. The Bayesian
# layer is the repository's own construction, not a procedure from the paper:
# a Dirichlet prior on the donor-weight simplex, a stationary Gaussian AR(1)
# error with a declared coefficient and an Inverse-Gamma innovation variance,
# sampled by pairwise-transfer Metropolis steps with a Gibbs update of the
# variance over four overdispersed chains gated by split R-hat and effective
# sample size. The convex-donor premise, donors unaffected by the intervention
# and a persisting pre-period relation stay declared; a good pre-fit does not
# establish them for the post period.
papers = [
 { title = "Synthetic Control Methods for Comparative Case Studies: Estimating the Effect of California's Tobacco Control Program", doi = "10.1198/jasa.2009.ap08746", sections = ["donor weights constrained to the simplex", "treated-unit counterfactual as the weighted donor outcome"] },
]

implementation_deviations = [
 "Posterior, not the constrained least-squares or predictor-matched weight selection of the paper: weights are a Dirichlet-prior posterior given pre-period outcomes only, with no predictor matrix or covariate balance step.",
 "The AR(1) coefficient is declared, not estimated, and the counterfactual continues the error process from the last pre-period residual; a misdeclared coefficient is not detected.",
 "The posterior has no closed form; it is sampled and is reported only when split R-hat and effective sample size pass their gates, otherwise the fit is refused rather than reported.",
 "Placebo-in-space and placebo-in-time permutation inference of the paper is not performed; the interval is an equal-tailed credible interval and carries no repeated-sampling guarantee.",
 "A treated path outside the donor hull is reported as a diagnostic, not repaired by extrapolation; the difference-in-differences synthetic variant is not given a posterior and is refused naming the frequentist route.",
 "The route is explicitly unlicensed and uncalibrated: no coverage record covers the credible interval.",
]

upstream_implementations_observed = []

test_sources = [
 "crates/antecedent-estimate/src/bayesian_synthetic_control/tests.rs (posterior_matches_the_simplex_quadrature_under_independent_errors, ar1_errors_carry_the_last_residual_into_the_post_period_counterfactual, a_concentrated_dirichlet_prior_pulls_the_weights_toward_equal, a_treated_path_outside_the_donor_hull_is_reported_not_repaired, malformed_panels_and_specs_are_refused)",
 "crates/antecedent/tests/bayesian_design_routes.rs (synthetic_control_posterior_recovers_the_effect_and_records_convergence)",
 "independent simplex quadrature of the weight posterior computed inside the test, not by the library sampler",
 "crates/antecedent-estimate/tests/bayesian_synthetic_control_reference.rs (simplex quadrature of the independent-error weight posterior and the realised average effect, uniform and concentrated Dirichlet prior)",
]

[method_review]
status = "reviewed_with_limits"
scope = "fit_bayesian_synthetic_control of crates/antecedent-estimate/src/bayesian_synthetic_control.rs with independent errors (ar1_rho = 0): the posterior of the donor weights on the simplex under a symmetric Dirichlet prior and an Inverse-Gamma innovation variance (the variance integrated out analytically gives the weight density prod_j w_j^(alpha - 1) (b + RSS(w)/2)^-(a + n/2)), the posterior mean and sd of each weight, the realised average post-period effect (the weight-driven gap plus the independent counterfactual errors, with variance Var(gap) + E[s2]/m) and the pre-fit RMSE at the posterior-mean weights, as sampled by the pairwise-transfer Metropolis chains that pass the R-hat and effective-sample-size gate. Not the AR(1) continuation of the last pre-period residual (the module's in-module test pins hard-coded values for it, but no executing reference is retained, so it is outside this review), the donor-range diagnostic, the per-period predictive draws, placebo inference, or any coverage."
assumptions = ["The treated unit's pre-period outcomes are a convex combination of three donors plus independent Gaussian errors with the Dirichlet weight prior and Inverse-Gamma variance prior; the convex-hull premise, donor stability and a persisting pre-period relation are the caller's and are not established by a good pre-fit.", "The counterfactual post-period error is an independent N(0, s2) draw per period, so the effect draw is the realised effect, not only the weight-driven gap.", "Quadrature integrates the exact weight posterior (a composite Gauss-Legendre rule checked for convergence in the node count), so the reference is not itself a sampler."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the product source named in its scope, including the numerical helpers it calls, and compared results with a composite Gauss-Legendre quadrature of the exact simplex posterior in 20-digit arithmetic written for this review; no upstream implementation or test source was consulted or copied. The cited publications were not retrieved in this review: the correspondence is between the product code and the standard definitions those works state, verified numerically, not a page-level reading of the papers."
redistribution = "Primary works are cited, not redistributed. The reference script and its frozen output are repository-authored (MIT OR Apache-2.0); mpmath is used only to produce the frozen values and is not a product dependency. The script declares its inline script metadata but is not run in a locked, isolated environment and is not wired into any gate; its output is frozen in the JSON file and compared by the test."
limitations = "One three-donor, eight-pre-period, three-post-period panel with a uniform Dirichlet prior and with a concentration of 20 (40,000 draws over four chains): weight means within six effective-sample-size standard errors, weight and effect sds within 8% and 5% relative error, pre-fit RMSE within 2%. The reference rule is converged to 1e-9 between 10 and 16 sub-intervals per axis and reproduces the values previously hard-coded in the module test (2.0155 against 2.01577; weights 0.5767, 0.3625, 0.0609). The sampler's agreement is statistical; its tolerance is set from the reported effective sample size, so a small bias well inside that tolerance is not excluded. More donors, a short pre-period, the AR(1) variant and a treated path outside the donor hull are not covered by the reference."
sources = ["https://doi.org/10.1198/jasa.2009.ap08746", "https://mpmath.org/doc/1.3.0/"]
findings_resolved = ["The posterior mean and sd of every donor weight, the effect mean and sd and the pre-fit RMSE equal the simplex quadrature for both the uniform and the concentrated Dirichlet prior, so the likelihood exponent, the variance integration and the counterfactual-error variance are right.", "The retained quadrature reproduces the previously pinned numbers, replacing them with a regenerable computation.", "No product defect was found in this record."]
