implementation_deviations = [
 "Exact ADMG m-separation is implemented only for directed and bidirected graphs; general ancestral graphs with undirected selection edges are not supported.",
 "The PAG query is a statement about every MAG the completion audit enumerates, with three outcomes (separated, connected, undetermined). Definite status follows Zhang (2008): collider, a tail at the node, or an unshielded circle-circle triple. A definite-status active path proves connection in every member; absence of any possibly-active path (marks judged node by node, colliders opened by possible descendants) proves separation; otherwise the member MAGs are enumerated. This is not Zhang's lemma for complete PAGs, which the code cannot assume of a hand-built PAG.",
 "PAG search is bounded by caller-supplied maximum path count and path length and fails on exhausted or truncated budgets; it is not an unbounded complete orientation or completion procedure.",
 "As with d-separation, the endpoint API is singleton-to-singleton and treats conditioning on an endpoint as connected rather than enforcing disjoint query sets.",
]

