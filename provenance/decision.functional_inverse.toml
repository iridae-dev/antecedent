  "crates/antecedent-design/tests/inverse_query.rs",
  "crates/antecedent-design/tests/inverse_query_artifact.rs",
  "python/tests/test_inverse_query.py",
]

[non_algorithm_review]
status = "justified_non_algorithm"
kind = "derivation"
rationale = "A finite inverse decision query: enumerate a declared ordered action grid, evaluate the forward functional at each action and compare to a target. Forward sources may be finite laws, means, or separately derived analytic Gaussian laws."
no_independent_algorithm = "Enumeration over at most 4096 grid points through the forward evaluator; finite_enumeration_baseline is the in-module cross-check. Gaussian functional evaluation is delegated to the composed forward-source implementation; there is no inverse search or optimization."
covered_by = ["decision.functionals", "inverse.composed_forward_source"]
derivation = "For each declared action a, evaluate the forward functional F(a) (mean, left-inverse quantile, threshold probability or utility) with the decision engine and report whether F(a) meets the target; feasibility is relative to the grid."
