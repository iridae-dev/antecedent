implementation_deviations = [
  "Untempered Gaussian-identity posterior on a contiguous single-series lag-window design, conditional on a caller-declared serially independent, homoskedastic Gaussian outcome innovation. Delegates to the existing Bayesian g-computation backend with SerialDependence::Iid, rather than the default long-run-variance-tempered temporal posterior.",
  "Only horizon one is admitted; multi-step unfolded residuals carry omitted intermediate innovations and require a different structural composition. A non-Gaussian likelihood, invalid whiteness gate or a residual-autocorrelation rejection refuses this path.",
  "The residual gate computes Q=n(n+2) sum_(k=1..m) r_k^2/(n-k), comparing with chi-square m degrees of freedom. It does not adjust degrees of freedom for fitted temporal parameters. Its p-value is an approximate refutation diagnostic; finite power and fitted-lag attenuation mean that passing neither proves independence nor establishes likelihood correctness.",
  "The posterior carries a declared white-innovation assumption and the test diagnostics. This provenance documents the algorithm and its limits; it does not supply missing calibration or attest the declared innovation model.",
]

