implementation_deviations = [
 "The posterior of an arm mean is the exact posterior under the beta-binomial likelihood of the completed participants success counts, evaluated by composite Gauss-Legendre quadrature in the logit of the arm mean (window and panel width from the logit moments of the design-effect Beta, used only as a locator and checked a posteriori against the density at the window edges); there is no conjugate form and none is imitated. The design-effect discount of Rao and Scott is used for that locator only.",
 "The intra-participant correlation is either declared, or given a Beta prior (shapes at least one) shared by the arms and integrated jointly with the arm means on an adaptive Gauss-Legendre grid over the correlation placed from its own posterior; the prior is frozen before recruitment.",
 "Historical borrowing is a power prior with a declared, fixed discount per source, frozen before recruitment; the discount is not estimated and no robust mixture prior is used.",
 "Thompson sampling is clamped from below at a declared exploration probability and renormalized (repeating the clamp until no probability is under the floor); the clamped rule is not the Thompson rule the cited paper analyzes.",
 "The confidence sequences are the normal-mixture Hoeffding sequences of participants' success proportions, split over the K - 1 comparisons against the control by a union bound; the simultaneous family covers the comparison of the data-selected best treatment. Finite-time theorem under its premise; not a measured coverage of the whole procedure (derived_unmeasured).",
 "Follow-up delay is a fixed number of looks and participants are not lost: a participant whose follow-up has not completed when the procedure ends is enrolled and not analysed.",
]
