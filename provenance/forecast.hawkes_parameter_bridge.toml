implementation_deviations = [
  "Repository-defined. An agreed horizon direct mass may cross the parameter-intervention bridge when both functionals are direct_offspring and the map is an identity or affine map, the fitted regime is observational and the response names a different regime. Under an identity map the lifetime total offspring (total_offspring: the resolvent column entry, direct mass plus feedback descendants) may cross instead; under an affine map a total offspring refuses and, when excitation runs both ways (a two-way kernel or a feedback member), the resolvent value is reported beside the carried direct mass as the cyclic reading. Mutual excitation is read, not refused. A singular excitation Gram or an active stability cap refuses before the bridge is asked.",
  "Class, posterior and cyclic reading. The structural reading is taken over every member of a declared structure, enumerated by the shared carrier antecedent::analysis::structure_members: one DAG, ADMG, temporal DAG or temporal ADMG; the completions of a CPDAG or PAG (from the class completion samplers, MAG completions read as ADMGs) or of a temporal CPDAG or PAG (the temporal class envelope's completions); an explicit candidate set with optional weights; the distinct atoms of a DAG or ADMG graph posterior with their mass; or a cyclic system whose directed edges are read as one-step lags, since an event process unfolds in time. A static member is identified by the complete ID algorithm (general identification) through the identification identify_structure runs, so a member where no directed path leaves the exposure identifies the effect as zero; a temporal member by the temporal identifier of its class for a one-step pulse. A member that orients the exposure into the outcome reads the bridged kernel value, a member where the edge is absent or reversed reads the bridged zero, and an unidentified member reads nothing. The reading reports the envelope over identified members, their weight (uniform enumeration weight for a form without weights, as class envelopes report it) and, for a weighted form, the mixture conditional on identified members. It refuses only when no member identifies the effect. A single accepted DAG keeps its earlier result and program identity; any other structure's identity adds the structure's canonical identity (form, canonical graph identities with node labels, names, weights, cyclic premises, provenance) and the reading mode. The bridge evidence is the provenance digest of the search the structure came from, or the declared structure's canonical identity.",
  "An intervened continuation adds one event of the accepted source type now, later, or of a different mark, and draws the continuation conditional on the observed history and that event with the accepted kernel by Ogata thinning. A marked history is read as a catalog with one name per prototype. When an identified member reads zero the law is one weighted mixture: members that orient the edge draw with the added event exciting and null members draw path i on the same random stream i without it, so member differences are structural; group weights are the identified members' weights. The paths are a conditional scenario under the kernel the bridge kept, not by themselves the utility of releasing.",
  "A release question compiles the immigrant challenge, the bridge and one release action as one program: a withheld reading returns the reading alone with no claim and no law.",
  "A shock that moves the exposure and is excluded from the outcome leaves the Hawkes model as a lag-count query naming the exposure, the outcome, the lag and the instrument; it returns no excitation coefficient.",
  "The release study is the existing future-study value of information composed on the accepted excitation's program, accepted only when every hypothesis of the belief is the catalog kernel the bridge kept and no identified member reads zero; a marked kernel is not priced that way. The member release study prices the release per member: an orienting member under the kept kernel, a null member under the kept kernel with the exposure's edge into the outcome removed, reported as the range of gross values over identified members, plus, for a weighted structure, the study whose belief weights the two kernels by the identified members' weights.",
]
