# The theorem is derived in-repo (module documentation of
# crates/antecedent-counterfactual/src/transported_path_specific.rs) by composing three
# cited ideas: the natural direct and indirect effects (Pearl 2001), their generalization
# to edge sets (Avin, Shpitser and Pearl 2005), and the covariate-selected transport
# formula P*(y | do(x)) = sum_z P(y | do(x), z) P*(z) for an S-admissible set Z
# (Bareinboim and Pearl 2014, section already cited by provenance/identify.transport_sid.toml).
# No theorem or section number beyond those already cited in this repository is claimed.
papers = [
 { title = "Direct and Indirect Effects (Proceedings of the Seventeenth Conference on Uncertainty in Artificial Intelligence, 2001)", sections = ["Definition of the natural direct and indirect effects and the mediation formula under the cross-world independence and sequential ignorability assumptions"] },
 { title = "Identifiability of Path-Specific Effects", sections = ["path-specific effects as edge-set interventions and the recanting witness criterion"] },
 { title = "External Validity: From Do-Calculus to Transportability Across Populations", doi = "10.1214/14-STS486", sections = ["Section 3, Definition 5: S-admissibility", "Section 3, Theorem 2 and equation (3.5): covariate-specific transportability and standardization"] },
]

implementation_deviations = [
 "Derived from this construction, not the exact procedure analysed in any cited paper: none of them gives a transported path-specific counterfactual. The result holds only in the declared affine additive-noise Markovian class and composes the fixed-population edge-intervention contrast with the covariate-selected transport formula because the contrast is a function of the covariates alone once the noise cancels.",
 "Linear-affine class only: mechanism coefficients are affine in the covariates and the noises are additive, mutually independent and independent of the covariates. Nonlinear additive-noise mechanisms, recanting witnesses and nonparametric identification from data are not covered and remain the carried_forward general record.",
 "Checked: no selection node on a mediator or the outcome, the target support inside the source support (overlap by exact-point matching on finite support, never extrapolating the affine form), and a well-formed acyclic model. Declared by the caller and never verified: additive noise, shared noise laws, the unit-level cross-world coupling, and that the supplied source fit equals the structural equations.",
 "A selection on a mediator or outcome mechanism refuses with an explicit two-model witness (same source model, two target models differing in one coefficient) when the contrast is sensitive to it; otherwise it refuses without a witness and no impossibility is claimed.",
 "Point-only: no interval and no sampling uncertainty in the supplied fit; calibration is unmeasured. A coherently resealed artifact replays unless the consumer retains an independent expected identity.",
]

