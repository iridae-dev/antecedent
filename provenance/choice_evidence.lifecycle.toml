implementation_deviations = [
 "Historical borrowing follows the power-prior idea (Ibrahim and Chen, Statistical Science 2000, doi 10.1214/ss/1009212673) and is applied to Dirichlet-multinomial counts: each retained source contributes discount times its counts to the prior shapes, with a fixed discount in [0, 1]; the paper treats regression models and an optionally random discount.",
 "A source of another population enters only with a declared transfer rationale and a discount; the discount is a declaration, not an estimated transfer, and no transport of a distribution is claimed.",
 "The per-source conflict diagnostic is a prior-predictive log Bayes factor against a vague prior versus the remaining discounted evidence, screened at ln 10; calibration of the screen is unmeasured.",
 "The sequential look is a Bayesian posterior criterion with a probability-matching allocation; it states no frequentist error rate. The study value is the exact expected value of sample information over the Dirichlet-multinomial predictive (Monte Carlo with a standard error beyond 250 000 outcomes) under a linear per-option value.",
]

