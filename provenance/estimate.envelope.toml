# No single paper describes this exact construction (see ADR 0013). Two
# distinct ideas are combined here and are cited separately rather than under
# one over-broad claim:
#  - Bayesian model averaging motivates the use of graph weights, but the
#    implementation averages aligned per-graph draw indices and is not a BMA
#    mixture distribution. That departure is recorded explicitly below.
#  - BUT plain BMA has no concept of "this model's parameter isn't
#    identified — retain that as a distinct residual mass rather than average
#    it in as if it were a normal draw," which is the actual load-bearing
#    design here (envelope.rs:81-140, `unidentified_mass` as a first-class
#    quantity retained by default). `renormalize_identified_only` refuses to
#    discard positive unidentified mass rather than providing a drop-mass mode.
#    That is the partial-identification literature's contribution, not BMA's.
#    Kline & Tamer (2016) is the closest verified primary for "retain honest
#    posterior mass on the non-point-identified region instead of collapsing
#    it into a point estimate" — but their setting is a single partially
#    identified parameter within one model, not a weighted ensemble of
#    graphs where some graphs identify the effect and others don't. This
#    module generalizes the retention principle to a graph ensemble; that
#    generalization itself has no known single-paper primary.
papers = [
 { title = "Bayesian Model Averaging: A Tutorial", doi = "10.1214/ss/1009212519", sections = ["model-weight semantics used as inspiration; this implementation is not a BMA mixture"] },
 { title = "Bayesian Inference in a Class of Partially Identified Models", doi = "10.3982/QE399", sections = ["retaining posterior mass on the non-identified region instead of collapsing to a point estimate"] },
]

implementation_deviations = [
 "Combines graph posteriors by taking a weighted average of aligned draw indices. This produces a barycentric posterior draw, not the Bayesian-model-averaging mixture distribution obtained by sampling a model and then sampling from that model's posterior; posterior variance and quantiles therefore differ from the cited BMA construction.",
 "Requires every identified graph to supply the same number of index-aligned draws and assumes those indices are meaningfully coupled through common random numbers, a requirement not present in ordinary Bayesian model averaging.",
 "Represents nonidentified graph weight as a separate scalar unidentified_mass while returning draws conditional on identified graphs; it does not construct posterior draws or identified sets for the nonidentified component as in the cited partial-identification setting.",
 "The graph-ensemble combination of identified and nonidentified model mass is an original scoped construction and does not inherit the guarantees of either cited paper.",
]

