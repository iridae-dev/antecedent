# No single paper describes this exact construction (see ADR 0013). Two
# distinct ideas are combined here and are cited separately rather than under
# one over-broad claim:
#  - Bayesian model averaging motivates categorical model mixing: each
#    mixture draw samples an identified graph by posterior weight, then a
#    draw from that graph's effect posterior. Mean and variance are the
#    exact identified-conditional mixture functionals
#    E[τ | identified] and Var(τ | identified), not Monte Carlo summaries
#    of a finite categorical allocation. Quantiles come from that
#    reproducible Monte Carlo representation of the empirical mixture.
#  - Plain BMA has no concept of "this model's parameter isn't identified —
#    retain that as a distinct residual mass rather than average it in as
#    if it were a normal draw," which is the actual load-bearing design
#    here (envelope.rs, `unidentified_mass` as a first-class quantity
#    retained by default). `renormalize_identified_only` refuses to discard
#    positive unidentified mass rather than providing a drop-mass mode.
#    That is the partial-identification literature's contribution, not BMA's.
#    Kline & Tamer (2016) is the closest verified primary for "retain honest
#    posterior mass on the non-point-identified region instead of collapsing
#    it into a point estimate" — but their setting is a single partially
#    identified parameter within one model, not a weighted ensemble of
#    graphs where some graphs identify the effect and others don't. This
#    module generalizes the retention principle to a graph ensemble; that
#    generalization itself has no known single-paper primary.
#
# StructuralAggregationPolicy (crates/antecedent/src/result.rs) is the
# 1.10.1 contract for *when* this mixer may publish a scalar:
#  - SameEstimandWeightedMean: identified atoms share one estimand; the
#    weighted mean E[τ | identified] is that functional.
#  - IdentifiedSetEnvelope: same partially identified estimand; publish
#    the set, not a fake scalar mixture.
#  - GraphDependentAtoms: estimands disagree, or unidentified / unevaluable
#    mass remains; withhold estimate.ate.
# Completion enumeration is a weight basis, not posterior probability.
# Sampling intervals on a scalar identified set are estimate.identified_set;
# frequentist multi-atom SEs are estimate.graph_posterior.joint_if.
papers = [
 { title = "Bayesian model averaging: a tutorial (with comments by M. Clyde, David Draper and E. I. George, and a rejoinder by the authors", citation_note = "Previously recorded title and bibliographic detail: Bayesian Model Averaging: A Tutorial", doi = "10.1214/ss/1009212519", sections = ["model-weight semantics: sample a model, then that model's posterior"] },
 { title = "Bayesian Inference in a Class of Partially Identified Models", doi = "10.3982/QE399", sections = ["retaining posterior mass on the non-identified region instead of collapsing to a point estimate"] },
]

implementation_deviations = [
 "Mixture draws use a fixed pseudo-random stream to sample identified graphs categorically and then sample their empirical posteriors uniformly. Mean and variance are exact for the supplied empirical component posteriors up to floating-point error; quantiles are finite Monte Carlo approximations. The fixed stream preserves reproducibility but is not configurable through this aggregation API.",
 "Requires every positive-weight identified graph to supply the same number of effect draws so the categorical representation has a common length; draw indices are never treated as coupled across models.",
 "Represents nonidentified graph weight as a separate scalar unidentified_mass while returning draws conditional on identified graphs; it does not construct posterior draws or identified sets for the nonidentified component as in the cited partial-identification setting.",
 "The graph-ensemble combination of identified and nonidentified model mass is an original scoped construction and does not inherit the guarantees of either cited paper.",
 "A scalar mixture is published only under StructuralAggregationPolicy::SameEstimandWeightedMean. IdentifiedSetEnvelope and GraphDependentAtoms withhold estimate.ate; they are not BMA.",
]

upstream_implementations_observed = []

test_sources = [
 "in-crate unit tests (crates/antecedent-estimate/src/envelope.rs): preserves unidentified mass by default, refuses renormalization that would discard positive unidentified mass, checks interactive-subsample mass accounting, retains between-graph variance, and is atom-order invariant",
 "conformance/bayesian/graph_effect_envelope (clean-room fixture: known unidentified fraction and exact identified-conditional mixture mean)",
 "conformance/bayesian/known_truth_mixtures (frozen analytic DAG-posterior ATE and DBN-posterior Pulse / single-step Sustained mixtures consumed from the staged path: identified atoms pin E[tau | identified], a structurally unidentified atom keeps its posterior weight as unidentified_mass, and the parameter prior does not upgrade it)",
 "crates/antecedent/tests/class_posterior_ate.rs (StructuralAggregationPolicy: scalar only when estimands agree)",
 "crates/antecedent-estimate/tests/envelope_reference.rs (exact rational mixture mean and sd, repeated keys, zero weights, retained unidentified mass, order invariance and the renormalization refusal)",
]

[method_review]
status = "reviewed_with_limits"
scope = "aggregate_effect_envelope of crates/antecedent-estimate/src/envelope.rs: pooling of atoms that share a graph key, dropping of zero-weight and unidentified atoms from the mixture, the exact identified-conditional mixture mean and standard deviation of the supplied empirical component laws (within-component population variance plus between-component disagreement), the retained unidentified mass fraction and the identification status that follows it, the refusal to renormalize over positive unidentified mass, and invariance to the atom order. Not aggregate_mixture_functional_envelope (its Gaussian-copula coupling), the Monte Carlo mixture quantiles (reproducible draws, not exact quantiles), the structural aggregation policy in the facade, or the choice of graph weights."
assumptions = ["Weights are the caller's graph posterior or a frozen enumeration; nothing here updates them.", "Component draws are treated as the empirical law of that graph's effect with equal draw counts; moments are exact for those laws and quantiles are Monte Carlo.", "Unidentified mass is a separate axis that is never redistributed into the effect mixture."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the product source named in its scope, including the numerical helpers it calls, and compared results with exact rational arithmetic on the binary draws written for this review; no upstream implementation or test source was consulted or copied. The record cites no publication for this construction, so there is no page-level correspondence to attest."
redistribution = "Primary works are cited, not redistributed. The reference script and its frozen output are repository-authored (MIT OR Apache-2.0); the script uses only the Python standard library. The script declares its inline script metadata but is not run in a locked, isolated environment and is not wired into any gate; its output is frozen in the JSON file and compared by the test."
limitations = "Two ensembles (three identified components of 64 draws with 12.5% unidentified mass; five atoms over three keys including repeated keys, a zero-weight atom and pooled weights, 40 draws each), moments to 1e-12 (mean) and 1e-9 relative (sd). The published draws are an affine moment-matched correction of the Monte Carlo sample, so their quantiles are a reproducible approximation and are not compared to exact quantiles. A draw count of one per component, extreme weight ratios and a very large offset (the centring that guards against cancellation) are not exercised here."
sources = ["https://docs.python.org/3/library/fractions.html"]
findings_resolved = ["The published mean and sd equal the exact rational mixture moments, including the between-graph variance and the pooling of repeated keys; zero-weight atoms contribute nothing and the unidentified mass fraction (0.125) and status follow the retained mass.", "Reversing the atom order leaves the draws and summaries identical, and renormalize_identified_only is refused when positive unidentified mass exists.", "No product defect was found in this record."]
