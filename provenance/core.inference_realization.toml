# Declaration records for how an inference is realized (ordinary likelihood, score, generalized Bayes
# triple, assumption branch) and which posterior samples each accepts or refuses. Nothing is computed
# from data: the module stores names, a validated learning rate and digests. papers = [] is an
# explicit judgment: Bissiri, Holmes and Walker (2016) is the reason the loss, prior and learning
# rate are recorded together, but no estimator or minimiser from it is implemented here and none
# of its theory is inherited. That paper was not retrieved in this review.
papers = []

implementation_deviations = [
 "Generalized Bayes records the loss, the prior, and a finite learning rate w strictly greater than zero, the weight in Bissiri, Holmes, and Walker (2016) display (8). It does not compute the minimizer of the expected loss.",
 "w = 0 is refused. A missing learning rate is not an ordinary Bayesian likelihood.",
 "The record does not inherit Sections 1, 1.1, 1.2, 2.1, 2.2, 2.3, 3.1 through 3.5, or 4 through 6. It does not inherit the calibration or coherence proof.",
 "Ordinary Bayesian likelihood, score frequentist, generalized Bayes, and a partial-identification envelope do not convert into one another. A posterior sample refuses an envelope.",
 "A prior's observational identification is refused. The next attempts are an identifying restriction, or an ordinary Bayesian likelihood under the declared likelihood. The assumption branch has its own digest. The posterior digest stays likelihood plus prior.",
 "No causal-identification claim follows from recording the generalized-Bayes triple.",
]

