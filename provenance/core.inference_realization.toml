rationale = "Typed declarations of an inference realization: an ordinary Bayesian likelihood plus prior, a score model, a generalized-Bayes loss/prior/learning-rate triple, an assumption branch, and the accept/refuse rules for posterior samples and observational identification."
no_independent_algorithm = "The module body contains no square root, logarithm, exponential, power or linear solve. The only numeric act is accepting a learning rate that is finite and strictly positive (zero, negative zero, negatives and NaN refuse); everything else is name validation, digest construction and enumeration of realization kinds. The loss minimiser and posterior update of generalized Bayes are not implemented."
