kind = "derivation"
rationale = "Posterior mean of each class's treatment coefficient under independent normal priors with the class residual variance plugged in; the class designs are the weighted normal equations the latent-class fit already forms."
no_independent_algorithm = "latent_class_effect_posterior calls full_coefficient_posterior_mean per class design and keeps the first slope; the class designs are produced by the covered latent-class estimator. No interval."
covered_by = ["estimate.posterior_mean_kernel", "estimate.latent_class_effects"]
derivation = "Normal likelihood with plug-in variance sigma2 = rss / (n - p) and independent N(0, tau^2) priors on the non-intercept coefficients (intercept unpenalized) give posterior mean (X'X + (sigma2 / tau^2) D)^-1 X'y; checked against the exact penalized normal equations in posterior_mean_reference.rs and in the route's own test."
