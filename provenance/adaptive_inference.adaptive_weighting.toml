[method_review]
status = "reviewed_with_limits"
scope = "adaptive_scores and weighted_estimate in crates/antecedent-stats/src/adaptive_inference/weighting.rs: the predictable prior-shrunk running-mean outcome model, the augmented inverse-probability score Gamma_i(a) = m_i(a) + 1[A_i = a](Y_i - m_i(a))/e_i(a), the uniform and variance-stabilizing (sum over the estimand's arms of 1/e)^(-1/2) weights with optional unit multipliers, the self-normalized estimate, the plug-in variance sum h^2 (v - estimate)^2/(sum h)^2, the effective-unit and largest-share diagnostics, and the positivity-floor, probability-row and overflow refusals. Not the Bayesian posterior, confidence sequences or group-sequential routes (separate records), cross-fitting (not implemented), or the calibration of the variance, which is reported uncalibrated."
assumptions = ["The assignment probability of unit i is a function of the history H_{i-1} and independent randomization only, and the outcome model m_i is a function of H_{i-1}; then Gamma_i(a) - mu_a is a martingale difference and any predictable weight keeps sum h_i (Gamma_i - mu) a martingale.", "The paper's central limit theorem is for arm values with weights sqrt(e); the contrast weight (1/e_a + 1/e_b)^(-1/2) is this implementation's choice and no limit theorem is claimed for it.", "Units are independent given the history; unit multipliers are declared positive sizes."]
historical_exposure = "Historical author exposure cannot be independently established. This review read the product source named in its scope and wrote its own reference from the estimator's definition at 50 digits (mpmath) and its martingale property by enumerating all paths of a five-unit adaptive trial; no upstream implementation was consulted. The cited paper was not retrieved."
redistribution = "The reference script and frozen output are repository-authored under MIT OR Apache-2.0; mpmath is not a product dependency. The cited paper is linked, not redistributed."
limitations = "The Hadad et al. paper was not retrieved (nothing downloaded, no local copy); the estimator is checked against the definition as restated in the product documentation and the record. The reference covers eight designs of 8 to 200 units and two to five arms, prior strengths from 1e-9 to 1e9, outcomes from 1e-6 to 1e3, a prior mean of 1e6 (large-offset scores), assignment probabilities as small as 1/1024, and twelve estimates each (arm means and a contrast, both weight schemes, with and without unit multipliers), at 1e-12 relative to the score scale. The exact enumeration covers 1024 paths of a posterior-mean policy clipped to [0.1, 0.9] at three pairs of true means, for arm means and the contrast under both schemes; it shows the weighted score sum has expectation zero (below 1e-13). It does not check the plug-in variance against the true variance, the coverage of an interval, or stabilization of the weights in large samples."
sources = ["https://doi.org/10.1073/pnas.2014602118", "https://mpmath.org/doc/1.3.0/"]
findings_resolved = ["No defect found: the scores, estimates, variances, weight sums, effective units and largest weight shares agree with the 50-digit definition on all 96 estimates, including probabilities of 1/1024 and a prior of strength 1e-9 and 1e9.", "The martingale property that the module's documentation rests on holds exactly over all enumerated paths for the uniform and variance-stabilizing weights, for arm means and for the contrast."]
