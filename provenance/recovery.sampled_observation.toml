implementation_deviations = [
  "The recovery formula is not re-derived here: it is the exact binary m-graph recovery of record recovery.binary_observation (evaluate_exact_recovery and evaluate_recovered_effect), restricted to its certified binary scope (at most 6 binary substantive variables). The sampled estimator only tabulates counted rows and resamples around it.",
  "The retired B500 procedure produced a percentile interval of a whole-ROW bootstrap that reruns recovery and effect evaluation per replicate. Efron's paper introduces the bootstrap; the composition with a ratio-of-margins recovery functional is not an estimator analyzed in the cited papers, so no consistency or coverage theorem is inherited. The percentile bootstrap is not exact in small samples and the functional is not smooth at zero cells. Original 623f16dd n2000 coverage was1874/2000=.937 with zero skips, failing the unchanged2MCSE precision floor. The distinct B2000 BCa construction uses exact multiplicity-weighted delete-one-row acceleration, midrank z0 and normal-CDF adjusted equal-tail probabilities with type7 quantiles. It refuses every failed bootstrap replicate, invalid jackknife support, degenerate acceleration or unresolved adjusted tail. No finite-sample or second-order coverage theorem is inherited for this composed recovery functional.",
  "An interval from per-margin variances alone is refused (sampled_recovery.component_variance_only): component-level coverage would not be coverage of the final effect.",
  "The empirical recovered law is a finite-sample table whose masses need not sum to one; it is never renormalized, its mass defect is reported and bounded by an explicit tolerance (default 0.1), and effect probabilities are normalized by the evaluated total.",
  "A zero complete-case cell, a zero denominator or too many failed replicates (default above 5 percent) refuse; failed replicates are retained in the receipt, never silently dropped.",
  "The digests of the receipt and artifact are FNV-based fingerprints, not cryptographic. BCa uses distinct version3 sampled_observation_recovery_bca_v3 bytes binding all B2000 draws, grouped delete-one-row patterns, acceleration, z0 and adjusted probabilities; an independent consumer reruns every step. The failed percentile estimator and version2 runtime are retired; original failure evidence remains at its immutable measurement commit, and version2 bytes are not accepted as BCa.",
  "Corrected BCa whole-method calibration completed at5c76724f; current main-source replay independently validates the nonnumerical scientific-identity projection and attestation. The normal producer licenses only the recovered_effect95 scalar under the exact unweighted independent-row B2000 protocol. Original source candidate intervals remain unmeasured; retired failed percentile evidence remains historical.",
  "Normal measured envelope is distinct from the original unmeasured source candidate. Original method execution is independently replayed, every named scalar uses its actual native basis and current attesting record, and exact method/prior/design guards refuse adjacent protocols. Whole-method candidate measurements completed at5c76724f; current main-source replay and attestation pass, and scoped installed normal-wheel producer/independent consumer acceptance passes. No general-model or simultaneous interval guarantee is inherited.",
]
