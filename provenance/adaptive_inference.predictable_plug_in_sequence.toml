 { title = "Exponential inequalities for martingales with applications", citation_note = "Previously recorded title and bibliographic detail: Exponential inequalities for martingales with applications (Fan, Grama, Liu, Electron J Probab 20:1-22)", doi = "10.1214/EJP.v20-3496", sections = ["Inequality exp(lambda xi + xi^2 (ln(1 - lambda) + lambda)) bounded by one in conditional expectation for xi >= -1, the supermartingale step behind psi_E"] },
 { title = "Time-uniform, nonparametric, nonasymptotic confidence sequences", citation_note = "Previously recorded title and bibliographic detail: Time-uniform, nonparametric, nonasymptotic confidence sequences (Howard, Ramdas, McAuliffe, Sekhon, Ann Statist 49:1055-1080)", doi = "10.1214/20-AOS1991", sections = ["Ville's inequality for a nonnegative supermartingale, applied to a two-sided confidence sequence"] },
]
implementation_deviations = [
 "The implemented interval is the paper's two-sided predictable plug-in empirical Bernstein interval, intersected over time with [0, 1]; the intersection preserves the time-uniform guarantee. The tilt truncation is c = 3/4; the theorem holds for any c below one, and the paper's choice of c is a default, not a requirement.",
 "Validity is proved for one arm's outcomes in the order that arm completes them, under the stack-of-rewards premise: the j-th completed participant of an arm is the j-th element of an independent sequence with a common mean, whatever allocation decided when it was drawn. The filtration of an arm's sequence is generated by that arm's own previous outcomes, so the tilts and the running mean and variance estimates are predictable, and a data-dependent (Thompson) allocation or stopping rule only selects the size at which the arm's sequence is read; the bound holds for every size at once. Delay from enrolment to completion is a fixed number of looks that does not depend on outcomes. This is a finite-time theorem under that premise, not a measured coverage of the whole procedure.",
 "The procedure splits its miscoverage evenly over the arms, each sequence at alpha / K, so all K arm means are covered at once with probability at least 1 - alpha; every difference of two arm means, including the data-selected best treatment against the control, is covered by the difference of the bounds with no further correction. The earlier mixture-Hoeffding sequence used alpha / (2 (K - 1)) per arm and is retained, by its recorded label, for contracts produced under it.",
 "Each participant's success proportion (responses summed and divided by the number of responses) is the bounded observation; the proportions are independent across participants whatever the correlation among one participant's responses.",
 "The sequence is not tuned to a sample size. The tuning size of the earlier sequence is carried in the declaration, validated, and ignored by this construction.",
]
upstream_implementations_observed = [
 { project = "confseq (Howard and Ramdas)", exposure = "previous familiarity" },
]
test_sources = [
 "crates/antecedent-stats/tests/confidence_sequence_reference.rs (80-digit streams, radii to fifty million observations, exact Bernoulli-path miss probability)",
 "crates/antecedent-stats/src/adaptive_inference/confidence_sequence.rs (unit tests: hand-computed constant-outcome interval, oracle values computed outside the crate from the paper's formulas, narrower than Hoeffding on low-variance data, monotone running intersection, known-truth coverage over a fixed seed set)",
 "crates/antecedent-stats/tests/adaptive_participant_family.rs",
 "crates/antecedent/tests/adaptive_participant_acceptance.rs",
 "crates/antecedent-io-core/tests/artifact_compat_golden.rs",
 "crates/antecedent-estimate/tests/adaptive_whole_procedure_calibration.rs",
 "python/tests/test_adaptive_binary_family.py",
]

[method_review]
status = "reviewed_with_limits"
scope = "The predictable plug-in empirical Bernstein kind of crates/antecedent-stats/src/adaptive_inference/confidence_sequence.rs: PlugIn::step (the running mean and variance estimates mu_hat and sigma_hat^2 with the 1/2 and 1/4 pseudo-observations, the tilt min(sqrt(2 ln(2/alpha)/(sigma_hat_{t-1}^2 t ln(1+t))), 3/4), the term v_t psi_E(lambda_t) and the interval centre and radius), SequenceState for the kind and plug_in_confidence_sequence. Not the mixture-Hoeffding kind, the per-arm alpha/K split, the participant-proportion bookkeeping, or the artifact replay path."
assumptions = ["Outcomes of one arm in the order that arm completes them are independent with a common mean, bounded in [0, 1]; tilts and the running estimates are predictable because they use earlier outcomes only.", "Any tilt cap c below one keeps the supermartingale; 3/4 is a default, not the paper's requirement.", "The reading is the running intersection of the per-size intervals with [0, 1]."]
historical_exposure = "Historical author exposure cannot be independently established. The record discloses previous familiarity with confseq. This review read the product source named in its scope and wrote its own reference from the paper's formulas at 80 digits; no upstream implementation was consulted for the reference and none was run. The cited papers were not retrieved."
redistribution = "The reference script and frozen output are repository-authored under MIT OR Apache-2.0; mpmath is not a product dependency. The cited papers are linked, not redistributed."
limitations = "The Waudby-Smith and Ramdas, Fan et al. and Howard et al. papers were not retrieved (nothing downloaded, no local copy); the formulas are those restated in the product documentation and the record, so a misstatement there would be shared by the reference. The comparison covers ten streams at three levels from 0.5 to 1e-6, read at up to eight sizes each, at 1e-12 relative; the cases include tilt-capped and uncapped regimes (constant half, near-zero variance, rare events) and streams whose variance estimate collapses (constant zero and one). The exact miss probability over all 2^13 Bernoulli paths (success probabilities 0.5, 0.3, 0.05; levels 0.5, 0.3) equals the reference to 1e-12 and stays below the level. It does not measure whole-procedure coverage, examine very long streams beyond the radius check of the mixture kind, or show that the sequence is optimal."
sources = ["https://doi.org/10.1093/jrsssb/qkad009", "https://doi.org/10.1214/EJP.v20-3496", "https://doi.org/10.1214/20-AOS1991", "https://mpmath.org/doc/1.3.0/"]
findings_resolved = ["No defect found: the pseudo-observation means and variances, the cap binding and not binding, the psi_E term and the running intersection agree with the reference at every checkpoint, including the jump stream where the intersection is empty and the sequence refuses.", "The time-uniform guarantee holds exactly on the enumerated paths: the miss probability over every Bernoulli path of length 13 is 0.104 at level 0.5 and mean 0.5 (0.049 at level 0.3), below the level in all six cases."]
