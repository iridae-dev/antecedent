# Per-candidate expected value of sample information (EVSI) and expected value of perfect
# information (EVPI) on a fixed terminal action set, with an optional cost-to-utility map
# for the net value. Exact routes: finite enumeration of the observation law and the
# prior draws, and the conjugate normal-prior / Gaussian-sample-mean closed form through
# the normal-linear-loss integral; externally computed decision values are combined as
# EVSI = sum_y P(y) max_a V_y(a) - max_a E[U(a)]. A Monte Carlo route over states and data
# exists and is reported as a labelled estimate. Publication names were checked by title
# and author; DOIs and chapter or section numbers are omitted because they were not
# resolved here.
papers = [
  { title = "Applied Statistical Decision Theory (Raiffa and Schlaifer, Harvard Business School, Division of Research, 1961)", sections = ["Preposterior analysis: the expected value of sample information as the preposterior expectation of the terminal value minus the terminal value under the prior, and the expected value of perfect information as its upper bound", "The unit normal linear-loss integral used for a normal prior with a normal sample mean of known variance"] },
  { title = "Statistical Decision Theory and Bayesian Analysis, 2nd edition (Berger, Springer, 1985)", sections = ["Bayesian expected-utility decision rule: the Bayes action under the current belief and under the posterior for each possible observation"] },
]

implementation_deviations = [
  "Implements the exact-integration EVSI as a point value only. For the finite enumeration and the Gaussian closed form there is no sampling error and no interval; the Gaussian closed form is evaluated with the same expected-maximum-of-affine-functions routine the artifact consumer reuses, so the two are not independent checks of one another (an independent oracle is the stated closed-form constant, EVSI 0.04165773529384315 and EVPI 0.19779655740130607 for prior N(1/2, 1), noise variance 12, n = 4, actions 0 and theta, to 1e-7).",
  "The Monte Carlo route is NOT a licensed guarantee. It reports a standard error, replicate count, effective sample size (equal to the replicate count, because replicates are independent), a convergence flag against a caller tolerance and a rank-uncertainty flag from an unpaired z comparison at 1.96, all as diagnostics. Their coverage, the rank guarantee and the convergence rule are unmeasured (calibration coordinate 'unmeasured'); no coverage record is allocated or collected, and an estimate outside 0 <= EVSI <= EVPI beyond its error refuses.",
  "The terminal action set is the same before and after information; a changed action set is a different decision problem and refuses. EVSI is not assumed non-negative or bounded by construction for a Monte Carlo estimate; the bound is checked against the reported error.",
  "Net value is EVSI minus the study cost in utility units and is produced only when a caller supplies a positive linear cost-to-utility map whose utility unit equals the decision's and whose cost unit equals every candidate's; a cost in another unit, or a missing map where net value is required, refuses. The map is declared, not estimated, and utility is not assumed monetary.",
  "Externally computed decision values and external posteriors are attested inputs: they are checked for coherence against the prior (branch values average back to the prior expected utility for every action) but are not verified or replayed. Source overlap is detected only through declared observation identities.",
]

upstream_implementations_observed = []

test_sources = [
  "crates/antecedent-design/tests/evsi.rs",
  "crates/antecedent-design/tests/design_ranking_artifact.rs",
  "python/tests/test_design_ranking.py",
 "crates/antecedent-design/tests/evsi_conjugate_reference.rs (60-digit quadrature of the conjugate normal EVSI over eleven designs)",
]

[method_review]
status = "reviewed_with_limits"
scope = "FutureStudyProgram in crates/antecedent-design/src/evsi.rs with the expected_max_affine routine of preposterior.rs it calls: for a scalar state with a normal belief, n independent normal observations of known variance, and any number of terminal actions with utility alpha_a + beta_a * theta, the conjugate update (posterior mean and variance after a sample mean), the Bayes action after the update, the gross EVSI E[max_a E[U_a | ybar]] - max_a E[U_a], the preposterior and prior expected utilities, and the net value with a declared cost. Not the finite-enumeration route, the externally supplied decision-value route, the Monte Carlo route, the cost-to-utility map, source-overlap diagnostics or the ranking artifact."
assumptions = ["The state prior is normal, the sample mean is normal given the state with variance noise_variance / n, and the terminal action set is the same before and after the study; utilities are exactly affine in the state.", "Gross EVSI is the preposterior expectation of the best posterior expected utility minus the best prior expected utility; it is non-negative for this model by Jensen's inequality.", "A declared study cost is already in utility units; an absent cost yields no net value."]
historical_exposure = "Historical author exposure cannot be independently established. This review read the product source named in its scope and wrote its own reference: it integrates the best posterior expected utility against the marginal normal density of the sample mean by adaptive quadrature at 60 digits, split at every pairwise break-even point, and does not use the preposterior-variance closed form or the linear-loss integral of the product. No upstream implementation was consulted."
redistribution = "The reference script and its frozen output are repository-authored under MIT OR Apache-2.0; mpmath is used only to produce the frozen values and is not a product dependency. The cited books are referenced, not redistributed."
limitations = "Neither cited book was retrieved for this review; the correspondence is between the product code and the standard definitions of EVSI and EVPI, verified numerically, not a page-level reading. The comparison covers eleven one-parameter cases (one to six actions, a dominated action, equal slopes with different intercepts, utility offsets of 1e9, information ratios n*tau^2/sigma^2 from 1e-12 to 1e12, a prior far from, at and tightly concentrated around the break-even state) at relative 1e-9 with an absolute floor of 1e-15 times the utility scale; it does not exercise vector states, non-affine utilities, correlated data or the other integration routes. The Monte Carlo route, its coverage and its rank guarantee are not examined here and stay unmeasured. The existing independent constant for the two-action case (EVSI 0.04165773529384315) is retained and is reproduced by the new reference."
sources = ["https://mpmath.org/doc/1.3.0/"]
findings_resolved = ["No numerical defect was found. The gross EVSI, prior and preposterior expected utilities and the posterior mean, variance and Bayes action agree with 60-digit quadrature across all eleven cases, including the small-information and large-offset regimes where a direct closed form subtracts nearly equal quantities (the product avoids that cancellation with gap lines and a preposterior-spread closed form, and the comparison confirms it).", "The deviation text said the Gaussian closed form had no independent check beyond one constant. It now has a general independent reference; the consumer-reuse caveat for the artifact path is unchanged.", "Net value equals gross EVSI minus the declared cost, and an absent cost gives no net value, asserted directly."]
