 { title = "Measuring and Testing Dependence by Correlation of Distances", doi = "10.1214/009053607000000505", sections = ["distance covariance / distance correlation, substituted here for the paper's kernel-based mutual-information statistic T_kernel (Eqs. 9-14) as the residual-independence measure"] },
