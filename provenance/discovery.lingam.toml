implementation_deviations = [
 "Exogeneity is scored with distance correlation rather than DirectLiNGAM's kernel mutual-information statistic T_kernel. A candidate's score is the sum, over the other remaining variables, of the distance correlation between the candidate and the residual of that variable regressed on it; it does not compare the two directions of each pair.",
 "The final adjacency is ordinary OLS on the predecessors in the order, followed by a fixed threshold on the absolute standardised coefficient and optional top-k parent truncation, rather than the reference method's adaptive-lasso pruning.",
]

