implementation_deviations = [
 "PC1, contemporaneous separation, and majority-collider subset searches are bounded by max_cond_size, which defaults to 3.",
 "The contemporaneous skeleton phase tests one conditioning set of each size, the first k contemporaneous neighbours in descending-statistic order, rather than every k-subset (matching the pinned baseline's max_combinations = 1); a link whose only separating sets are other subsets can survive although it is d-separable.",
 "MCI conditioning is limited to 30 conditions within a 32-column CI budget; oversized tests are refused rather than evaluated.",
 "The orientation phase adds contemporaneous Meek R4 beyond the pinned Tigramite PCMCI+ rule stack; the frozen oracle fixture explicitly notes that this may produce extra orientations.",
]

