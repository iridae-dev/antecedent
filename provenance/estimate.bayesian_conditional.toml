[method_review]
status = "reviewed_with_limits"
scope = "The posterior of the Bayesian conditional-effect contrast fitted by BayesianGComputationAte on the design y ~ 1 + t + w + t (w - wbar) (one modifier, interaction centred at the observed modifier mean): the treatment coefficient as the average contrast, the exact conjugate coefficient covariance, and add_modifier_mean_uncertainty, which replaces each effect draw by the Dirichlet(1, ..., 1)-weighted average of the row contrasts b + d (w_i - wbar). The conjugate Normal-Inverse-Gamma posterior algebra and draw generation are not re-reviewed here: they rest on the completed review of prob.conjugate_gaussian (crates/antecedent-prob/src/conjugate.rs), whose Bayes-rule and replication checks this record relies on; what this record adds is the route-specific arithmetic named in its scope, compared with its own exact reference. The design is built in the test exactly as prepare_conditional documents it, so prepare_conditional itself (admission, centring, naming, several modifiers, adjustment columns) is not executed here. Not the conditional-effect curve, nonlinear links, or any calibration."
assumptions = ["Gaussian identity link with independent homoskedastic errors and the conjugate Normal-Inverse-Gamma prior (coefficient scale c0, Inv-Gamma(1e-3, 1e-3)).", "The empirical modifier distribution is re-weighted with Dirichlet(1, ..., 1) weights independent of the coefficient draws, so E[effect] = E[b] and Var(effect) = Var(b) + (Var(d) + E[d]^2) Var(eps), Var(eps) = (population variance of the centred modifier) / (n + 1)."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the product source named in its scope, including the numerical helpers it calls, and compared results with an exact Normal-Inverse-Gamma covariance and a closed-form Dirichlet variance written for this review; no upstream implementation or test source was consulted or copied. The cited publications were not retrieved in this review: the correspondence is between the product code and the standard definitions those works state, verified numerically, not a page-level reading of the papers."
redistribution = "Primary works are cited, not redistributed. The reference script and its frozen output are repository-authored (MIT OR Apache-2.0); mpmath is used only to produce the frozen values and is not a product dependency. The script declares its inline script metadata but is not run in a locked, isolated environment and is not wired into any gate; its output is frozen in the JSON file and compared by the test."
limitations = "Two designs (80 rows with a strong interaction and a wide prior; 60 rows with no interaction and a tight prior, where the modifier term is about 3% of the variance), 300,000 draws; the mean is asserted within five Monte Carlo standard errors and the sd within 8/sqrt(draws) relative error, and the extra variance is shown to be real (the sd exceeds the coefficient-only sd). Only one modifier is exercised; the joint-modifier vector generalization, and the weights being shared across modifiers, are not compared with a reference. The Dirichlet variance formula is the closed form for equal concentrations; the sampler's weights are not separately tested here. Scoped 2026-11-07 source comparison verified the extracted summary preserves the small-Laplace draw threshold, effect-column selection, finite-value check, rank interval and other summaries; the synthetic engineering test adds no calibration evidence. Subsequent scoped comparison verifies the cache eligibility predicate preserves enabled/unbounded policy, admission, Gaussian likelihood, transform and backend conditions; its synthetic engineering test adds no scientific or calibration evidence. Further scoped source comparison confirms unchanged adaptive covariance refusal, redraw plan, coefficient block concatenation, fixed-draw evaluation and stopping status; this adds no scientific or calibration evidence."
sources = ["https://doi.org/10.1201/b16018", "https://mpmath.org/doc/1.3.0/"]
findings_resolved = ["The posterior mean of the reported effect equals the treatment coefficient's exact mean, and its sd equals the exact sqrt(Var(b) + (Var(d) + E[d]^2) Var(eps)) on both designs (0.1144 against a coefficient-only 0.0427 on the heterogeneous design), so the modifier-distribution term is neither missing nor double counted.", "No product defect was found in this record."]
record_sha256 = "d1b78e0582886ae1751da8accbc4044013315d81669c0ebf66b770b6115e2e4d"

