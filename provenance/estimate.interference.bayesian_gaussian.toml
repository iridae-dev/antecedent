status = "reviewed_with_limits"
scope = "estimate_interference_bayesian of crates/antecedent-estimate/src/interference.rs: the neighbour-count exposures of a weighted fixed network under the realised assignment, the design [1, own, treated neighbours], the known-variance (sigma^2 = 1) Normal posterior under independent N(0, prior_sd^2) priors, the exposure-level contrast c'b with c = (0, own' - own, k' - k), its posterior mean and variance and the seeded contrast draws; and that edge weights and the declared Bernoulli probability do not enter the posterior. Not the design-based cells of the same file (Horvitz-Thompson, cluster totals, saturation), the support and rank refusals beyond what the existing in-module tests pin, or any coverage claim."
assumptions = ["Additive Gaussian potential-outcome model Y_i(z, g) = a + b z + g k + e_i with residual variance fixed at one, so the posterior is conditional on that variance and its spread does not depend on the outcome scale.", "The posterior conditions on the realised assignment: the Bernoulli probability in the query is only a licence tag, and NeighborCount counts treated in-neighbours regardless of edge weight.", "Both requested exposure levels must occur in the realised assignment."]
historical_exposure = "Historical author exposure to upstream implementations cannot be independently established from retained artifacts. This review read the product source named in its scope, including the numerical helpers it calls, and compared results with an exact conjugate Normal posterior in 40-digit arithmetic written for this review; no upstream implementation or test source was consulted or copied. The cited publications were not retrieved in this review: the correspondence is between the product code and the standard definitions those works state, verified numerically, not a page-level reading of the papers."
redistribution = "Primary works are cited, not redistributed. The reference script and its frozen output are repository-authored (MIT OR Apache-2.0); mpmath is used only to produce the frozen values and is not a product dependency. The script declares its inline script metadata but is not run in a locked, isolated environment and is not wired into any gate; its output is frozen in the JSON file and compared by the test."
limitations = "Two 48-unit networks with 144 weighted edges each (prior sd 100 and 0.9; contrasts (0,1) to (1,2) and (0,0) to (1,2)), 400,000 draws: the mean is asserted within five Monte Carlo standard errors and the draw sd within 8/sqrt(draws) relative error. The noise in the outcome is deterministic and small, and the residual variance of one is a fixed model choice; with a different true variance the interval is not calibrated, as the record states. Cluster or complete randomization and a refit after refresh are not exercised; the refusals of a mis-sized probability vector and of the weighted and fractional mappings are asserted by an added test."
sources = ["https://doi.org/10.1214/16-AOAS1005", "https://mpmath.org/doc/1.3.0/"]
findings_resolved = ["The contrast posterior mean and sd equal the exact conjugate values on both networks; the prior sd 100 mean is within 2e-4 of the least-squares contrast 3 + 4, and the tight prior shrinks it to 10.50 exactly as the reference does.", "Scaling the outcome by ten leaves the draw spread identical and moves the mean, confirming the fixed unit variance.", "Edge weights and the declared Bernoulli probability do not move the posterior (identical draws): the declaration is a licence tag, not a model input, which the model-based record already states and the test now pins.", "No product defect was found in this record."]
