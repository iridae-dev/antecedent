# Strategy-table implementation id: estimate.interference.bayesian_gaussian
# (EstimatorId::InterferenceBayesianGaussian, public name
# interference.bayesian_gaussian).
#
# Gaussian interference model on a fixed finite network. Exposures are computed
# with the neighbor-count mapping shared with the design-based cell
# (stats.randomized_interference, antecedent_stats::exposures): own treatment and
# treated-neighbor count under Bernoulli assignment. Outcomes are modelled as
# Y_i(z,g) = alpha + beta*z + gamma*g + epsilon_i with residual variance fixed to
# one and independent N(0, prior_sd^2) priors on the three coefficients; the
# posterior of the exposure contrast is the closed-form Gaussian obtained from the
# prior-plus-Gram precision, and draws are sampled from that marginal. Aronow and
# Samii supply the exposure-mapping definitions the design reuses; the additive
# Gaussian potential-outcome model and its conjugate posterior are the
# repository's own construction and inherit none of that paper's design-based
# Horvitz-Thompson guarantees.
papers = [
 { title = "Estimating average causal effects under general interference, with application to a social network experiment", doi = "10.1214/16-AOAS1005", sections = ["Section 3, definitions 1-2: exposure mappings (neighbor-count exposure reused from the design-based cell)"] },
]

implementation_deviations = [
 "Model-based, not design-based: the estimand is the finite-network mean potential-outcome contrast under the declared additive Gaussian model, and the interval is model-conditional with no repeated-sampling coverage record.",
 "Residual variance is fixed to one and is neither estimated nor given a prior; the same unit disturbance is assumed shared across that unit's exposures.",
 "Licensed only for Bernoulli assignment with the NeighborCount exposure mapping on a caller-supplied fixed network; complete or cluster randomization and other mappings are refused.",
 "The posterior conditions on the realised assignment, so the declared Bernoulli probabilities are a licence tag and do not enter it; a probability vector that is neither scalar nor one per unit is refused (invalid_argument). NeighborCount counts treated in-neighbours whatever the edge weight, so weights do not enter it either; a weighted or fractional mapping is refused (route_not_supported) rather than approximated.",
 "Both requested exposure levels must appear in the realized assignment, and the observed [1, own, neighbors] design must be full rank; otherwise the fit is refused rather than extrapolated.",
 "Every posterior draw retains the network and realized assignment frozen at prepare; a refresh refits changed outcomes under that frozen design.",
]

