[method_review]
status = "reviewed_with_limits"
scope = "estimate_cluster_interference_total_with_inference in crates/antecedent-estimate/src/interference.rs: the unit-weighted (0,0)-to-(1,1) total contrast under complete cluster randomization, its Horvitz-Thompson/Hajek forms, the cluster-level Neyman variance and the Welch interval. Not the general exposure-mapping estimator, nor Bernoulli or observational designs."
assumptions = ["Complete cluster randomization of a declared number of treated clusters; assignment is constant within a cluster (checked) and the observed treated-cluster count equals the declared count (checked).", "Partial interference with a properly specified exposure mapping: every unit has a nonempty within-cluster neighborhood and no cross-cluster edge (checked), so NeighborFraction is exactly 1 in a treated cluster and 0 in a control cluster, and the unit's outcome is its Y(1,1) or Y(0,0).", "The target is the mean over all units, so cluster totals are scaled by K/n; with unequal cluster sizes this is a fixed finite-population constant, not a cluster-mean target.", "The Neyman variance is conservative only in expectation over the randomization; the t-based interval is an approximation justified by simulation, not a theorem."]
historical_exposure = "No upstream implementation was consulted or observed for this review. Historical author exposure cannot be independently established. The review read the arXiv v4 manuscript of Aronow and Samii (1305.6156) as a PDF retrieved on 27 October 2026 and the product source; it did not read the typeset Annals of Applied Statistics pagination."
redistribution = "Primary papers are linked, not redistributed. The unit tests added in this review are original repository-authored code under MIT OR Apache-2.0; no upstream code, comments or tests were copied."
limitations = "Establishes exact finite-population unbiasedness and the exact conservativeness gap on one six-cluster unequal-size population by full enumeration, plus the retained 2000-replicate coverage simulation. It does not prove the nominal coverage of the Welch interval at 8 clusters per arm, which is a repository support policy; it does not cover non-complete cluster designs, interference across clusters, or misspecified exposure mappings. Neyman's original Section 9 text was not accessible and was not read: the variance result was instead derived from first principles and checked by enumeration. The enumeration and coverage tests live in the bound implementation file and were not executed by the reviewer in this session (no build); the identity was independently checked in a separate Python enumeration that is not retained. Calibration remains deferred."
sources = ["https://arxiv.org/abs/1305.6156", "https://doi.org/10.1214/16-AOAS1005", "https://doi.org/10.1214/ss/1177012031"]
findings_resolved = ["Verified against code that scaling cluster totals by K/n makes the mean-of-clusters difference equal the unit-weighted mean contrast, including unequal sizes, and that the point estimate equals Y(1,1)-Y(0,0) means under the checked design assumptions.", "Verified the variance S_t^2/m + S_c^2/(K-m) over scaled totals is the Neyman estimator whose expectation exceeds the exact variance by S_tau^2/K (cluster-effect heterogeneity) and corrected the record's claim of a source section: the paper-side exposure-mapping reference is Section 3 / Condition 1, not definitions 1-2.", "Added an executing exact-enumeration assertion over all 20 complete allocations of 3 of 6 unequal clusters with heterogeneous effects: mean estimate equals tau, enumerated variance equals the closed form, and the variance-estimator bias equals S_tau^2/K to 1e-10.", "Recorded the Welch interval's 8-cluster-per-arm gate and df formula as a repository policy rather than a cited result."]
