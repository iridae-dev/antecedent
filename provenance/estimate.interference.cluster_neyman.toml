implementation_deviations = [
 "Licensed for complete cluster randomization on a fixed partial-interference network. The contrast is the (0,0) to (1,1) total effect of assigning a cluster, not a direct-versus-spillover decomposition.",
 "The interval is a pointwise Welch interval from between-cluster Neyman variation. It is not Aronow and Samii's joint-exposure-probability variance.",
 "Cluster totals are scaled by K/n so the contrast is the unit-weighted mean total effect; the Welch t interval with an eight-clusters-per-arm gate is a repository policy, not a result of either cited paper.",
 "Partial interference and the exposure mapping are declared. Bernoulli and observational designs do not inherit this estimator.",
]

