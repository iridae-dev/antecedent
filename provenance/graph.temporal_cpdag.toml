# Explicit judgment, not an unfilled field: TemporalCpdag is a marked-edge container with local
# invariants (legal marks, no duplicate or self edge, no directed cycle, no future-to-past directed edge). It
# derives no CPDAG or MPDAG, runs no orientation rule and tests no equivalence, so no paper introduces what it
# computes; the Markov-equivalence characterization it is the container for is cited by graph.cpdag_completion.
papers = []

implementation_deviations = [
 "TemporalCpdag is principally a marked-edge representation with lag metadata; it does not derive a CPDAG or MPDAG from a DAG, run the cited orientation rules, or certify Markov-equivalence-class completeness.",
 "Temporal precedence is enforced through local endpoint and lag invariants, not through a complete temporal-equivalence characterization.",
 "Contemporaneous partially directed structure is stored but not completed into all consistent time-series DAGs, and latent-confounded PAG semantics are outside this graph class.",
]

