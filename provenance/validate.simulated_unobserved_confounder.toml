feature_id = "validate.simulated_unobserved_confounder"
implementation_crate = "antecedent-validate"
source_translation = false
copied_code = false
copied_comments = false
copied_tests = false

papers = [
 { title = "Sensitivity to Exogeneity Assumptions in Program Evaluation", doi = "10.1257/000282803321946921", sections = ["Binary-confounder treatment/outcome sensitivity model and observed-covariate benchmarking"] },
]

implementation_deviations = [
 "Adds one standard-normal draw directly to both observed treatment and outcome in units of the residual SDs SD(T|Z) and SD(Y|Z), then refits without adding the simulated variable to the adjustment set.",
 "Uses 20 Monte Carlo perturbations and a repository-defined verdict: the mean absolute ATE shift as a multiple of the published effect's own magnitude, failing at 1.",
 "Refuses (not applicable) when the residual SD of the treatment or of the outcome given the adjustment set is at rounding level (at most 1e-9 of its marginal SD), since a confounder scaled by that SD would be rounding noise.",
 "It does not implement Imbens's binary-confounder treatment-assignment/outcome model, partial-R parameterization, observed-covariate benchmarking, or treatment-effect contour analysis.",
]

upstream_implementations_observed = []

test_sources = [
 "crates/antecedent-validate/tests/simulated_unobserved_confounder_reference.rs (60-digit refits on library-RNG confounder draws, residual-SD scaling, floor, verdict, degenerate-residual refusal)",
 "crates/antecedent-validate/src/unobserved_common_cause.rs unit tests",
 "conformance/validate/refuters",
]

[method_review]
status = "reviewed_with_limits"
scope = "UnobservedCommonCause::refute in crates/antecedent-validate/src/unobserved_common_cause.rs for a static linear-adjustment problem: the residual SDs SD(T | Z) and SD(Y | Z) (sample SD of least-squares residuals, divisor n - 1), the per-replicate perturbation T' = T + a SD(T|Z) u and Y' = Y + b SD(Y|Z) u with u a standard-normal draw from the stream 0xA7E0_0006_0000 + r, the refit with u left out of the adjustment set, the mean refit, the standardized mean absolute shift mean |ate' - centre| / max(|centre|, 1e-3 SD(Y|Z)/SD(T|Z)), the verdict std_delta < threshold, and the refusals (negative or non-finite strengths, rounding-level residual SDs). The residual-SD helper residual_sd_pair_on_adjustment of sensitivity.rs is exercised through the result, not reviewed on its own (validate.confounding_sensitivity). Not the temporal path or a composed refitter."
assumptions = ["The check is a repository-defined sensitivity diagnostic; the cited Imbens model (binary confounder, partial-R2 parameterization) is explicitly not implemented, as the record states, so this review checks the code against the repository definition, not against that paper.", "The treatment effect is the coefficient of the treatment in the least-squares regression of the outcome on an intercept, the treatment and the adjustment covariates, for a unit contrast.", "Confounder draws are the library stream's standard-normal fills, regenerated by the test and asserted equal to the frozen draws."]
historical_exposure = "Historical author exposure cannot be independently established. This review read unobserved_common_cause.rs and wrote its own reference from the stated definition at 60 digits (mpmath least squares, residual SDs and refits of the perturbed data); no upstream implementation was consulted. The cited paper was not retrieved."
redistribution = "The reference script, frozen output and Rust test are repository-authored under MIT OR Apache-2.0; mpmath is not a product dependency. The cited paper is linked, not redistributed."
limitations = "The Imbens paper was not retrieved (nothing downloaded, no local copy); because the record states the paper's model is not implemented, the paper is not used as an oracle. The comparison covers four designs (two covariates, offsets of 1e5 and 1e6, an exactly null full-fit effect that engages the denominator floor, and one covariate) under six strength, replicate-count and threshold settings, including zero strengths (no confounder), strength 2 and thresholds from 0.05 to 1, at 1e-7 relative on the mean refit and 1e-6 relative on the standardized shift, with verdicts compared exactly. Missing values, weights, ATT or ATC targets, temporal series and panels are not exercised. The default strengths and threshold of 1 are repository choices that are not calibrated here."
sources = ["https://doi.org/10.1257/000282803321946921", "https://mpmath.org/doc/1.3.0/"]
findings_resolved = ["Defect fixed: when the outcome (or treatment) was an exact function of the adjustment set, its residual SD was rounding noise of order 1e-16 and passed the positivity check, so the confounder was scaled to that noise and a standardized shift of 7.3 was reported as a failed check on ATEs of order 1e-17; the refuter now refuses when a residual SD is at most 1e-9 of its marginal SD (failing-first test an_outcome_determined_by_the_adjustment_set_is_refused).", "The residual SDs, perturbation, refit with the confounder left out, mean refit, standardized shift, floor and verdict agree with the 60-digit reference on every design and setting."]
record_sha256 = "3249d4a2d5607e02f869b55ba28b1f14dbefe863f9828d7e6d41a5b6fc666767"

