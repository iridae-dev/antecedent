[method_review]
status = "reviewed_with_limits"
scope = "The original exact rational comparison covers the supplied period-prediction mean and its probability floors. The two-decision fitted-Q implementation estimates baseline-stratified means among subjects following the schedule, then averages those means over held-out subjects. The whole-subject bootstrap repeats both operations within the declared fold partitions."
assumptions = ["Sequential randomization (no unmeasured confounding of any period's treatment given the recorded history), positivity at the declared floor and exchangeable censoring are identification assumptions taken as given.", "Sequential treatment and censoring probabilities and, where used, the period predictions are supplied inputs; subjects are independent histories. The supplied-prediction kernel reads these inputs as declared. The separate fitted-Q route owns the terminal conditional mean fit and requires supported held-out strata."]
historical_exposure = "The historical rational reference was written against mathematical definitions without copying an upstream implementation. The present scope review compared the fold-owned terminal fit and subject resampling with the source and the named route and coverage fixtures. Robins Section 4D motivates the conditional standardization; it does not specify this fold-bootstrap interval."
redistribution = "Primary work is cited, not redistributed. The reference script and its frozen output are repository-authored (MIT OR Apache-2.0); the script uses mpmath (BSD-3-Clause), imported at run time and not redistributed here. The script declares its inline script metadata but is not run in a locked, isolated environment and is not wired into any gate; its output is frozen in the JSON file and compared by the test."
limitations = "Five synthetic cohorts of 50 to 80 subjects and one to four decision periods: a static regime at two periods, a regime followed by about half the subjects with action and censoring probabilities at 0.02 and 0.05 (cumulative weights near 2.5e4), a history-dependent regime, an alternating regime and an outcome offset of 1e8. Values are asserted to 1e-10 to 1e-12 relative, the IPW standard error to 1e-9, and each sequential-DR subject score to 1e-9. The pointwise interval functions apply support floors and a sample-size gate to these quantities; their coverage is measured by the module's repeated-sample tests, not here. The reference script is not run in a locked, isolated environment and is not wired into any gate; its output is frozen in the JSON file and compared by the test."
sources = ["https://mpmath.org/", "https://doi.org/10.1016/0270-0255(86)90088-6"]
findings_resolved = ["No defect found: the g-formula value equals the exact rational mean of the supplied period predictions on every history, including the outcome offset of 1e8.", "The fixed-known-Q interval excludes uncertainty in the supplied predictions. The fitted-Q route draws subject multiplicities within every fold, recomputes the schedule-matched training mean by baseline and averages across the held-out distribution. The route test checks both same-study cross-fitting and independent training and evaluation, and the calibration study uses separate declared laws for those two arrangements. The coverage fixture feeds the one-argument Gaussian generator a distinct deterministic seed and keeps treatment and baseline on their own tagged uniform streams. This restores executable simulation without changing the outcome law, truth or estimator."]
