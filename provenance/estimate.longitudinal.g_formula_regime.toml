implementation_deviations = [
 "Conditional period rewards are caller-supplied. When the query says they are fixed and known, the interval excludes all fitted, selected, or cross-fitted Q uncertainty. The caller attests that claim.",
 "The fixed-known-Q pointwise interval is limited to the admitted short-horizon design under known sequential randomization. The two-decision fitted-Q percentile interval has a separate construction.",
 "The fitted two-decision construction integrates a binary pre-treatment baseline with no evolving covariates or censoring. It learns conditional cell means under the fixed schedule and resamples whole subjects within the declared fold partitions. Internal evaluation excludes the fitted subject fold; external training uses a declared independent partition and standardizes to the other partition.",
 "This is not the marginal structural model and not the sequential doubly robust score.",
]

