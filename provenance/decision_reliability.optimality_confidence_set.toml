[non_algorithm_review]
status = "justified_non_algorithm"
kind = "derivation"
rationale = "Confidence set for the best retained candidate: candidate j is excluded when its estimate is below the best by more than the critical value times the standard error of the difference (Hsu 1996, multiple comparisons with the best)."
no_independent_algorithm = "Bonferroni-critical-value comparison of each candidate's estimated utility with the best; no estimator of its own."
covered_by = ["decision_reliability.derived_uncertainty"]
derivation = "With K retained candidates, exclude j when max_k u_k - u_j > z_{1-alpha/(2(K-1))} se(u_best - u_j), with the standard error of the paired difference under common random numbers or the independent-stream sum of variances otherwise (Hsu 1996, multiple comparisons with the best, with Bonferroni constants)."
