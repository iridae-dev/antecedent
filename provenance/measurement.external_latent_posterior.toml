[method_review]
status = "reviewed_with_limits"
scope = "posterior_means, rubin_combine and combine_imputations_linear in crates/antecedent-stats/src/measurement_error.rs: the posterior mean of a latent regressor over draws, the per-draw ordinary least squares fit and its HC0 covariance, and Rubin's combination (mean coefficients, mean within covariance, between covariance with S - 1, total W + (1 + 1/S) B) over five draws, with the refusal of fewer than two imputations. Not a review of the posterior provider, of whether the draws are proper imputations conditional on the outcome (declared, not verifiable here), or of any non-linear outcome family."
assumptions = ["Draws are proper imputations of the latent regressor conditional on the outcome and the covariates, so Rubin's combining rules apply; a posterior of the latent value given only the error-prone data makes the draws Berkson-type and the regression of the outcome on them attenuated, which is why that case uses the posterior mean.", "The per-draw covariance is the HC0 sandwich of the draw's least squares fit and the total covariance is the standard combining rule with the (1 + 1/S) factor."]
historical_exposure = "Historical author exposure cannot be independently established. This review read the product source named in its scope and wrote a separate reference of its own from the stated definitions; no upstream implementation or test source was consulted or copied."
redistribution = "The reference script, its frozen output and the test are repository-authored under MIT OR Apache-2.0; mpmath is not a product dependency. The cited primary sources are linked, not redistributed."
limitations = "The book chapters were not re-read in this review (nothing downloaded, no local copy), so the regression-calibration and variance-component statements rest on the record and the code comments. The reference is one study of 150 rows with mixed replicate counts of one to three, one covariate and a coarse replicate study of 20 units with sizes one to five; the classical additive error model with a linear outcome, a single error-prone regressor and error-free covariates is the only case, and non-Gaussian errors, heteroscedastic errors and non-linear outcome models are not exercised. The estimate-variance part of the covariance is compared at 1e-7 because the reference differentiates the corrected solve numerically. Coverage of the resulting intervals is not measured here and no interval is claimed. Calibration remains deferred. The proper-imputation condition is declared by the model and cannot be checked from the draws; the reference draws are generated with independent noise around the true regressor, which is neither proper nor Berkson in the sense of the book, and only the arithmetic of the combination is verified."
sources = ["https://doi.org/10.1002/9780470316696", "https://doi.org/10.1201/9781420010138", "https://mpmath.org/doc/1.3.0/"]
findings_resolved = ["The pooled coefficients, the within and between covariances and the total covariance of five imputations, and the posterior means, agree with the 60-digit reference (1e-10 for the coefficients, 1e-8 for the covariances); a single imputation is refused. No defect was found and no product code changed."]
