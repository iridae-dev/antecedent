<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" role="img" aria-labelledby="title description">
<title id="title">A retained study creates separate immutable executions</title>
<desc id="description">A prepared study estimates result A. Refreshing observations creates result B. Result A stays fixed and its bytes can be consumed against an independently retained expectation.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#486581"/></marker></defs>
<g fill="none" stroke="#486581" stroke-width="2" marker-end="url(#arrow)"><path d="M230 82H340"/><path d="M230 102Q280 102 280 203H340"/><path d="M560 82H680"/><path d="M790 200V126" stroke-dasharray="5 5"/></g>
<g fill="#f0f4f8" stroke="#829ab1"><rect x="10" y="42" width="220" height="105" rx="8"/><rect x="340" y="42" width="220" height="85" rx="8"/><rect x="340" y="163" width="220" height="85" rx="8"/><rect x="680" y="42" width="230" height="85" rx="8"/><rect x="680" y="200" width="230" height="48" rx="8"/></g>
<g fill="#243b53" font-family="system-ui,sans-serif" font-size="16" text-anchor="middle"><text x="120" y="76" font-weight="700">Prepared study</text><text x="120" y="104">Graph, query, retained design</text><text x="120" y="130">Cached identification</text><text x="450" y="76" font-weight="700">Result A</text><text x="450" y="105">Original execution stays fixed</text><text x="450" y="198" font-weight="700">Result B</text><text x="450" y="226">Refreshed observations</text><text x="795" y="76" font-weight="700">Independent consumer</text><text x="795" y="105">Checks bytes and identity</text><text x="795" y="230">Retained expectation record</text><text x="284" y="65" font-size="14">estimate</text><text x="288" y="161" font-size="14">refresh</text><text x="618" y="65" font-size="14">export bytes</text></g>
</svg>