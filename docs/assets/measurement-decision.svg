<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 230" role="img" aria-labelledby="title description">
<title id="title">A corrected measurement and pooled evidence determine a point decision</title>
<desc id="description">Recorded prevalence 0.41 is corrected to 0.30 under declared sensitivity and specificity. Disjoint study effects pool to 0.15, later 0.08. The composed excess risk falls from 0.045 to 0.024, changing net act utility from 15 to minus 6.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#486581"/></marker></defs>
<g fill="none" stroke="#486581" stroke-width="2" marker-end="url(#arrow)"><path d="M280 60H370L450 105"/><path d="M280 175H370L450 130"/><path d="M650 117H710"/></g>
<g fill="#f0f4f8" stroke="#829ab1"><rect x="10" y="10" width="270" height="93" rx="8"/><rect x="10" y="131" width="270" height="89" rx="8"/><rect x="450" y="70" width="200" height="94" rx="8"/><rect x="710" y="70" width="200" height="94" rx="8"/></g>
<g fill="#243b53" font-family="system-ui,sans-serif" font-size="16" text-anchor="middle"><text x="145" y="39" font-weight="700">Measurement model</text><text x="145" y="65">Recorded 0.41 → corrected 0.30</text><text x="145" y="89" font-size="14">Declared sensitivity and specificity</text><text x="145" y="159" font-weight="700">Evidence ledger</text><text x="145" y="185">Pooled effect 0.15 → 0.08</text><text x="145" y="208" font-size="14">Disjoint studies; explicit revision</text><text x="550" y="101" font-weight="700">Finite composition</text><text x="550" y="129">Excess risk</text><text x="550" y="152">0.045 → 0.024</text><text x="810" y="101" font-weight="700">Point decision</text><text x="810" y="129">Act utility 15 → −6</text><text x="810" y="152">Act → hold</text></g>
</svg>