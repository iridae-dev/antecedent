[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "antecedent"
version = "0.9.0"
description = "Identification-first causal inference: discovery, identification, estimation, interventions, and counterfactuals under structural uncertainty"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT OR Apache-2.0" }
dependencies = [
  "numpy>=1.26",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "License :: OSI Approved :: MIT License",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/iridae-dev/antecedent"
Repository = "https://github.com/iridae-dev/antecedent"
Documentation = "https://antecedent.readthedocs.io/"
"Release notes" = "https://github.com/iridae-dev/antecedent/blob/main/CHANGELOG.md"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "."
module-name = "antecedent._native"
# PEP 517/660 builds (including the editable rebuild uv triggers whenever this
# file changes) default to Cargo's debug profile, which ships an unoptimized
# faer/pulp and makes analyze_ate ~50x slower with bit-identical output.
profile = "release"

[dependency-groups]
dev = [
    "maturin>=1.14.1",
    "mypy>=1.17.0",
    "numpy>=2.4.6",
    "pandas>=2.2.0",
    "pyarrow>=25.0.0",
    "pytest>=9.1.1",
    "pytest-cov>=6.0.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["antecedent"]
omit = ["antecedent/_native.pyi"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["antecedent", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # bugbear
  "SIM", # simplify
]
ignore = [
  "E501", # line length handled by formatter / existing style
]

[tool.ruff.lint.per-file-ignores]
"antecedent/**/*.pyi" = [
  "F401", # re-export stubs
  "F403", # star-import stubs
]
"../examples/python/**" = [
  "B",
  "SIM",
]

[tool.mypy]
python_version = "3.11"
mypy_path = "."
files = ["antecedent"]
explicit_package_bases = true
warn_unused_configs = true
warn_unused_ignores = true
no_implicit_optional = true
# Binding / orchestration layer: catch stub/API mismatches; full annotation
# of every private helper is follow-up work.
check_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_defs = false
warn_return_any = false
show_error_codes = true

# pandas is an optional runtime dependency, imported lazily inside
# ValidationView.to_pandas(); it ships no type stubs here.
[[tool.mypy.overrides]]
module = "pandas.*"
ignore_missing_imports = true
