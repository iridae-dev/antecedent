[package]
name = "antecedent-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Antecedent Python extension (PyO3)"
publish = false

[lib]
# Must match the last component of tool.maturin.module-name (antecedent._native).
# Naming this "antecedent" collides with the pure-Python package and omits _native.
name = "_native"
crate-type = ["cdylib"]

[lints]
workspace = true

[features]
# Development build (never default): `not_supported` routes run and results list `would_refuse`.
development = ["antecedent-core/development", "antecedent-contract/development", "antecedent-data/development", "antecedent/development", "antecedent-io/development", "antecedent-io-core/development", "antecedent-prob/development", "antecedent-expr/development", "antecedent-graph/development", "antecedent-identify/development", "antecedent-design/development", "antecedent-model/development", "antecedent-attribution/development", "antecedent-state/development", "antecedent-stats/development", "antecedent-validate/development", "antecedent-discovery/development", "antecedent-estimate/development", "antecedent-learn/development", "antecedent-learn-burn?/development"]
default = ["ml-full", "ml-neural"]
ml-gbdt = ["antecedent/ml-gbdt", "antecedent-estimate/ml-gbdt"]
ml-forest = ["antecedent/ml-forest", "antecedent-estimate/ml-forest"]
ml-full = ["ml-gbdt", "ml-forest"]
ml-neural = ["antecedent/ml-neural", "antecedent-estimate/ml-neural"]
# Opt-in accelerator distribution. Cargo unifies the features of one package across the
# graph, so naming `antecedent-learn-burn/wgpu` here links Burn's WGPU backend into the
# learner `ml-neural` already pulls in. The CPU wheel never enables it.
accelerator-wgpu = ["ml-neural", "dep:antecedent-learn-burn", "antecedent-learn-burn/wgpu"]

[dependencies]
blake3.workspace = true
antecedent-core = { workspace = true }
antecedent-contract = { workspace = true }
antecedent-data = { workspace = true, features = ["arrow", "parquet", "ipc"] }
antecedent = { workspace = true }
antecedent-io = { workspace = true }
antecedent-io-core = { workspace = true }
antecedent-prob = { workspace = true }
# Type conversion only (mediation estimand / graph construction for analyze*).
antecedent-expr = { workspace = true }
antecedent-graph = { workspace = true }
antecedent-identify = { workspace = true }
antecedent-design = { workspace = true }
antecedent-model = { workspace = true }
antecedent-attribution = { workspace = true }
antecedent-state = { workspace = true }
antecedent-stats = { workspace = true }
antecedent-validate = { workspace = true }
antecedent-discovery = { workspace = true }
# Concrete estimator structs for the `estimator_config=` parser; the
# `antecedent` facade re-exports `EstimatorSpec` but not the structs it wraps.
antecedent-estimate = { workspace = true }
antecedent-learn = { workspace = true }
antecedent-learn-burn = { workspace = true, optional = true }
# `extension-module` is also set on the workspace pyo3 dependency: this cdylib
# must not link libpython. `build.rs` links libpython only into the test harness.
# `multiple-pymethods` is the second impl on Dag, Cpdag, Pag, and Admg.
pyo3 = { workspace = true, features = ["extension-module", "multiple-pymethods"] }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
numpy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
# Same version as the pyo3 the extension links. Used only to discover libpython
# for the cargo-test harness; the cdylib stays an extension module.
pyo3-build-config = { workspace = true }
