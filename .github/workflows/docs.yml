# Build docs bundle (markdown + rustdoc + Python API via pdoc).
# Narrative site for Read the Docs: mkdocs.yml + .readthedocs.yaml.
# On tags, prefer publish-release.yml which attaches docs.tar.gz to the Release.
name: docs

on:
  push:
    branches: [main, "2.0"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  docs:
    name: Build docs bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@b0480e2d44a72e89a62650e223ba831cbca8d2be # 1.85
        with:
          toolchain: "1.85"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Build manylinux wheel for pdoc
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          working-directory: python
          command: build
          args: --release --out dist -i 3.12
          target: x86_64
          manylinux: auto
          sccache: "true"

      - name: Rustdoc
        run: cargo doc -p antecedent --no-deps

      - name: Conformance docs
        run: python3 scripts/generate_conformance_docs.py

      - name: Generated documentation is current
        run: |
          set -euo pipefail
          python3 scripts/generate_support_matrix_docs.py
          git diff --exit-code -- docs/conformance docs/support-matrix.md

      - name: Build narrative site strictly
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docs.txt
          mkdocs build --strict --site-dir site

      - name: Python API docs (pdoc)
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # numpy is a runtime dep of antecedent; install wheel away from
          # python/ so the source tree cannot shadow antecedent._native.
          pip install "python/dist/"*.whl pdoc
          python -c "import antecedent; print('antecedent', antecedent.__version__, antecedent.__file__)"
          OUT="${GITHUB_WORKSPACE}/site/python"
          mkdir -p "$OUT"
          cd "$(mktemp -d)"
          pdoc antecedent -o "$OUT"

      - name: Pack docs.tar.gz
        run: |
          set -euo pipefail
          mkdir -p dist-docs
          tar -czf dist-docs/markdown.tar.gz docs adr README.md CONTRIBUTING.md
          tar -czf dist-docs/rustdoc.tar.gz -C target doc
          tar -czf dist-docs/python-api.tar.gz -C site python
          tar -czf docs.tar.gz -C dist-docs markdown.tar.gz rustdoc.tar.gz python-api.tar.gz
          ls -la docs.tar.gz

      - name: Upload docs artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-bundle
          path: docs.tar.gz
          if-no-files-found: error
          retention-days: 30
