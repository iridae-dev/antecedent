# Build docs bundle (markdown + rustdoc + Python API via pdoc).
# Narrative site for Read the Docs: mkdocs.yml + .readthedocs.yaml.
# On tags, prefer publish-release.yml which attaches docs.tar.gz to the Release.
name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  docs:
    name: Build docs bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Generated coverage docs verify the original calibration Git objects.
          fetch-depth: 0

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # 1.85
        with:
          toolchain: "1.85"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Docs execute snippets and notebooks. The dev profile optimizes the hot
      # numerical crates through workspace overrides while avoiding thin LTO.
      - name: Build manylinux wheel for pdoc
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: python
          command: build
          args: --profile dev --out dist -i 3.12
          target: x86_64
          manylinux: auto
          sccache: "true"

      - name: Upload wheel for optional documentation integrations
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-python-wheel
          path: python/dist/*.whl
          if-no-files-found: error
          retention-days: 3

      - name: Rustdoc
        # maturin-action enables sccache for the wheel build, but its wrapper is
        # not available to later steps. Rustdoc must use the installed rustc.
        run: |
          unset RUSTC_WRAPPER
          cargo doc -p antecedent --no-deps

      - name: Conformance docs
        run: python3 scripts/generate_conformance_docs.py

      - name: Generated documentation is current
        run: |
          set -euo pipefail
          python3 scripts/generate_support_matrix_docs.py
          git diff --exit-code -- docs/conformance docs/support-matrix.md

      - name: Build narrative site strictly
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docs.txt
          pip install "python/dist/"*.whl
          python scripts/check_docs_experience.py
          python scripts/run_doc_examples.py
          python scripts/render_notebooks.py
          python scripts/test_docs_publication.py
          mkdocs build --strict --site-dir site

      - name: Python API docs (pdoc)
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # numpy is a runtime dep of antecedent; install wheel away from
          # python/ so the source tree cannot shadow antecedent._native.
          pip install "python/dist/"*.whl pdoc
          python -c "import antecedent; print('antecedent', antecedent.__version__, antecedent.__file__)"
          OUT="${GITHUB_WORKSPACE}/site/python"
          mkdir -p "$OUT"
          cd "$(mktemp -d)"
          python "${GITHUB_WORKSPACE}/scripts/build_python_api_docs.py" "$OUT"

      - name: Verify published HTML
        run: python scripts/check_docs_site.py site

      - name: Pack docs.tar.gz
        run: |
          set -euo pipefail
          mkdir -p dist-docs
          python3 scripts/package_docs.py dist-docs/markdown.tar.gz
          tar -czf dist-docs/rustdoc.tar.gz -C target doc
          tar -czf dist-docs/python-api.tar.gz -C site python
          tar -czf dist-docs/site.tar.gz -C site .
          tar -czf docs.tar.gz -C dist-docs markdown.tar.gz rustdoc.tar.gz python-api.tar.gz site.tar.gz
          ls -la docs.tar.gz

      - name: Upload docs artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-bundle
          path: docs.tar.gz
          if-no-files-found: error
          retention-days: 30

  optional-examples:
    name: Required ${{ matrix.dependency }} handoff
    needs: docs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dependency: [dowhy, econml]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-python-wheel
          path: wheel-in
      - name: Install required external dependency
        run: python -m pip install "wheel-in/"*.whl "${{ matrix.dependency }}" pandas
      - name: Exercise external half without skipping
        run: python scripts/run_optional_doc_example.py "${{ matrix.dependency }}"
