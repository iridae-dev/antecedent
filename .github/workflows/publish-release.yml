# Tag-driven release: reuse exact-main-CI wheels → GitHub Release + PyPI + crates.io.
# PyPI uses trusted publishing (OIDC). The publisher on pypi.org must match this
# workflow filename; the publishing job runs in the `release` environment, so
# register that environment name on pypi.org too and give it required reviewers
# and a tag-only deployment rule in the repository settings.
#
# The crates.io upload is a job of this workflow, not a second one: `crates-dry-run`
# proves every crate would publish before PyPI is touched, and `publish-crates` runs
# only after PyPI succeeded, so one verified commit and one reviewer approval ship
# both registries or neither publishes a half-checked release.
#
# Nothing publishes until `prepare` has verified (scripts/verify_release.sh) that
# the tag commit is on main, that the committed tree carries the tag's version,
# and that a main-push `ci` run is green on that exact commit. Both publishers
# verify the downloaded 16-wheel matrix before touching a registry or Release.
# Note: GitHub Packages has no supported Python registry; upload.pypi.pkg.github.com
# currently fails TLS (cert only valid for *.registry.github.com).
name: publish-release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semver without leading v (e.g. 0.1.0)"
        required: true
        type: string
      reuse_run_id:
        description: "Optional exact-tag-SHA main CI run id for a manual retry"
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  prepare:
    name: Prepare version
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      ci_run_id: ${{ steps.verify.outputs.ci_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The attestation diffs against each record's calibration_sha.
          fetch-depth: 0

      # Every later job needs this one: nothing is published while a committed
      # coverage record does not match the code it
      # would ship with (calibration labels would come from a stale registry).
      - name: Calibration attestation (coverage records match the code)
        run: bash scripts/gate_calibration_attestation.sh

      - name: Resolve version from tag or input
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="${INPUT_VERSION#v}"
          else
            REF="${GITHUB_REF_NAME}"
            if [[ ! "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "tag must be vX.Y.Z[...], got: $REF" >&2
              exit 1
            fi
            VERSION="${REF#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid semver: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version=$VERSION tag=v$VERSION"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # The tag decides what ships. Fail unless this exact commit has a green
      # main-push CI run, including its fully tested wheel matrix.
      - name: Verify tag commit, committed version and CI
        id: verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
        run: bash scripts/verify_release.sh tag "$VERSION" "$REUSE_RUN_ID"

  docs:
    name: Build docs bundle
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Committed version matches the tag
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: bash scripts/set_version.sh --check "$VERSION"

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # 1.85
        with:
          toolchain: "1.85"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download manylinux x86_64 py3.12 wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel-ubuntu-latest-py3.12-x86_64
          path: wheel-in
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.prepare.outputs.ci_run_id }}

      - name: Rustdoc
        run: cargo doc -p antecedent --no-deps

      - name: Conformance docs
        run: python3 scripts/generate_conformance_docs.py

      - name: Python API docs (pdoc)
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install "wheel-in/"*.whl pdoc
          python -c "import antecedent; print('antecedent', antecedent.__version__, antecedent.__file__)"
          OUT="${GITHUB_WORKSPACE}/site/python"
          mkdir -p "$OUT"
          cd "$(mktemp -d)"
          pdoc antecedent -o "$OUT"

      - name: Pack docs.tar.gz
        run: |
          set -euo pipefail
          mkdir -p dist-docs
          # Narrative markdown + generated conformance
          tar -czf dist-docs/markdown.tar.gz docs adr README.md CONTRIBUTING.md
          # rustdoc HTML
          tar -czf dist-docs/rustdoc.tar.gz -C target doc
          # pdoc HTML
          tar -czf dist-docs/python-api.tar.gz -C site python
          tar -czf docs.tar.gz -C dist-docs markdown.tar.gz rustdoc.tar.gz python-api.tar.gz
          ls -la docs.tar.gz

      - name: Upload docs artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-bundle
          path: docs.tar.gz
          if-no-files-found: error
          retention-days: 30

  # PyPI must not wait on GitHub Release asset uploads. A unicorn on
  # uploads.github.com used to skip trusted publishing entirely.
  publish-pypi:
    name: Publish wheels to PyPI
    needs: [prepare, crates-dry-run]
    if: >-
      always() && !cancelled() &&
      needs.prepare.result == 'success' &&
      needs.crates-dry-run.result == 'success'
    runs-on: ubuntu-latest
    # Required reviewer + tag-only deployment rule live on this environment.
    environment: release
    permissions:
      actions: read
      contents: read
      id-token: write  # PyPI trusted publishing
    steps:
      # Verification helpers and the tree they verify against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download all wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheel-*
          path: wheels
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.prepare.outputs.ci_run_id }}

      - name: List wheels
        run: |
          set -euo pipefail
          find wheels -name '*.whl' | sort

      # Reused wheels (workflow_dispatch) must be this release's: filenames carry
      # the version and the run built this commit.
      - name: Verify wheels belong to this release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REUSE_RUN_ID: ${{ needs.prepare.outputs.ci_run_id }}
        run: bash scripts/verify_release.sh wheels wheels "$VERSION" "$REUSE_RUN_ID"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Publish wheels to PyPI
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(wheels/*.whl)
          if [[ ${#wheels[@]} -eq 0 ]]; then
            echo "no wheels found" >&2
            exit 1
          fi
          # OIDC → short-lived PyPI token (no PYPI_TOKEN secret).
          uv publish --trusted-publishing always "${wheels[@]}"

  # Every crate must package and check before any registry is touched.
  crates-dry-run:
    name: crates.io dry-run
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # 1.85
        with:
          toolchain: "1.85"

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Dry-run publish of every crate
        run: bash scripts/publish_crates.sh --dry-run

  # Uploaded only after PyPI accepted the wheels; the `release` environment carries the
  # required reviewer and tag-only deployment rule, as for PyPI.
  publish-crates:
    name: Publish crates.io
    needs: [prepare, crates-dry-run, publish-pypi]
    if: >-
      always() && !cancelled() &&
      needs.prepare.result == 'success' &&
      needs.crates-dry-run.result == 'success' &&
      needs.publish-pypi.result == 'success'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # 1.85
        with:
          toolchain: "1.85"

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Publish (dry-run when no token is configured)
        env:
          CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "${CRATES_IO_TOKEN:-}" ]]; then
            export CARGO_REGISTRY_TOKEN="$CRATES_IO_TOKEN"
            bash scripts/publish_crates.sh --execute
          else
            echo "CRATES_IO_TOKEN unset; dry-run only"
            bash scripts/publish_crates.sh --dry-run
          fi

  github-release:
    name: Publish GitHub Release
    needs: [prepare, docs]
    if: >-
      always() && !cancelled() &&
      needs.prepare.result == 'success' &&
      needs.docs.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheel-*
          path: wheels
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.prepare.outputs.ci_run_id }}

      - name: Download docs bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-bundle
          path: .
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.run_id }}

      - name: Verify wheels belong to this release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REUSE_RUN_ID: ${{ needs.prepare.outputs.ci_run_id }}
        run: bash scripts/verify_release.sh wheels wheels "$VERSION" "$REUSE_RUN_ID"

      - name: List release assets
        run: |
          set -euo pipefail
          find wheels -name '*.whl' | sort
          ls -la docs.tar.gz

      # Release notes are maintainer-authored per version. `generate_release_notes` alone
      # yields a bare commit list, which is the wrong register for a release page: it
      # cannot say what a change means or who should care. A curated file at
      # `docs/release-notes/<tag>.md` becomes the Release body, and GitHub's generated
      # "Full Changelog" section is appended after it (the API appends generated notes to a
      # supplied body rather than replacing it), so the commit-level detail is not lost.
      #
      # Always resolve to a real file so the release step cannot fail on a missing path —
      # without curated notes we synthesize a short pointer to the CHANGELOG instead.
      - name: Resolve release notes
        id: notes
        run: |
          set -euo pipefail
          TAG='${{ needs.prepare.outputs.tag }}'
          VERSION='${{ needs.prepare.outputs.version }}'
          CURATED="docs/release-notes/${TAG}.md"
          if [[ -f "$CURATED" ]]; then
            echo "using curated release notes: $CURATED"
            cp "$CURATED" RELEASE_BODY.md
          else
            echo "::warning title=No curated release notes::\
          Expected ${CURATED}. Falling back to a CHANGELOG pointer plus generated notes. \
          Add the file and re-run to publish curated notes."
            {
              echo "Release ${TAG}."
              echo
              echo "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/CHANGELOG.md)"
              echo "for the \`${VERSION}\` entry."
            } > RELEASE_BODY.md
          fi
          echo "--- release body ---"
          cat RELEASE_BODY.md

      # Notes only. Asset uploads go through `gh` one file at a time so a
      # GitHub unicorn cannot abort the whole batch, and cannot skip PyPI.
      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          body_path: RELEASE_BODY.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release assets sequentially
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          TAG='${{ needs.prepare.outputs.tag }}'
          files=(wheels/*.whl)
          if [[ -f docs.tar.gz ]]; then
            files+=(docs.tar.gz)
          fi
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "no release assets found" >&2
            exit 1
          fi
          for f in "${files[@]}"; do
            ok=0
            for attempt in 1 2 3 4 5; do
              if gh release upload "$TAG" "$f" --clobber; then
                ok=1
                break
              fi
              echo "upload failed for $f (attempt ${attempt}); retrying" >&2
              sleep $((attempt * 5))
            done
            if [[ "$ok" -ne 1 ]]; then
              echo "failed to upload $f" >&2
              exit 1
            fi
          done
