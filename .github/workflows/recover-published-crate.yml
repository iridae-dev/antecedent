# Recovery of missing crates from an already published, immutable release.
name: recover-published-crate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to complete
        required: true
      source_sha:
        description: Commit the release tag points at
        required: true
      release_run:
        description: publish-release workflow run id of the original release
        required: true
      ci_run:
        description: CI run id of the tagged commit
        required: true

permissions:
  contents: read

concurrency:
  group: recover-published-crate
  cancel-in-progress: false

jobs:
  publish:
    name: Complete the published antecedent release on crates.io
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out recovery tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tooling

      - name: Check out the original release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          path: release-source

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # 1.85
        with:
          toolchain: "1.85"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: release-source -> target

      - name: Test recovery refusal boundaries
        run: python3 tooling/scripts/test_recover_published_crate.py

      - name: Verify original evidence, repair packaging and publish missing crates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: iridae-dev/antecedent
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
          RUSTFLAGS: -D warnings
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_RUN: ${{ inputs.release_run }}
          RELEASE_CI_RUN: ${{ inputs.ci_run }}
        run: >-
          python3 tooling/scripts/recover_published_crate.py release-source --execute
          --tag "$RELEASE_TAG" --source-sha "$RELEASE_SOURCE_SHA"
          --release-run "$RELEASE_RUN" --ci-run "$RELEASE_CI_RUN"
