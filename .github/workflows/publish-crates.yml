name: publish-crates

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Semver of the release tag this run is dispatched on, without leading v"
        required: true
        type: string

permissions:
  contents: read

# Publishing is verified before anything uploads: the tag commit is on main, the
# committed tree carries the tag's version, and `ci` is green on it
# (scripts/verify_release.sh). The `release` environment carries the required
# reviewer and tag-only deployment rule.
env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish crates.io
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      contents: read
    # Separate from Python PyPI / Release wheels.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The attestation diffs against each record's calibration_sha.
          fetch-depth: 0

      # Before any publish or dry-run: crates ship the coverage registry their
      # calibration labels are bound to, so a record that does not match the
      # code fails the job here.
      - name: Calibration attestation (coverage records match the code)
        run: bash scripts/gate_calibration_attestation.sh

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@b0480e2d44a72e89a62650e223ba831cbca8d2be # 1.85
        with:
          toolchain: "1.85"

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Verify tag commit, committed version and CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION:-${REF_NAME#v}}"
          bash scripts/verify_release.sh tag "${VERSION#v}"

      - name: Publish (dry-run on workflow_dispatch without token)
        env:
          CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "${CRATES_IO_TOKEN:-}" ]]; then
            export CARGO_REGISTRY_TOKEN="$CRATES_IO_TOKEN"
            bash scripts/publish_crates.sh --execute
          else
            echo "CRATES_IO_TOKEN unset; dry-run only"
            bash scripts/publish_crates.sh --dry-run
          fi
