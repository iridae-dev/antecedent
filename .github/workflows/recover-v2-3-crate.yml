# Recovery of the final crate from the already published, immutable 2.3.0 release.
name: recover-v2-3-crate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recover-v2-3-crate
  cancel-in-progress: false

jobs:
  publish:
    name: Complete antecedent 2.3.0 on crates.io
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out recovery tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tooling

      - name: Check out the original release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v2.3.0
          fetch-depth: 0
          path: release-source

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # 1.85
        with:
          toolchain: "1.85"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: release-source -> target

      - name: Test recovery refusal boundaries
        run: python3 tooling/scripts/test_recover_v2_3_crate.py

      - name: Verify original evidence, repair packaging and publish the final crate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: iridae-dev/antecedent
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
          RUSTFLAGS: -D warnings
        run: python3 tooling/scripts/recover_v2_3_crate.py release-source --execute
