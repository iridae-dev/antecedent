# CodeQL SAST. `.github/codeql/codeql-config.yml` and `scripts/gate_codeql.sh`
# already existed, but no workflow referenced them, so static analysis never ran
# automatically. `scripts/gate_codeql.sh` remains the local equivalent (it needs
# the codeql CLI on PATH); CI uses the hosted action with the same config and the
# same security-and-quality suites.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly Monday 04:00 UTC, so advisory-database updates surface without a push.
    - cron: "0 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, python, actions]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.85
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # 1.85
        with:
          toolchain: "1.85"

      - name: Cache cargo
        if: matrix.language == 'rust'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
