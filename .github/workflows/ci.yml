name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@b0480e2d44a72e89a62650e223ba831cbca8d2be # 1.85
        with:
          toolchain: "1.85"
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: DCO check
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --deepen=50 origin "${{ github.base_ref }}" || true
          # pull_request checkout is the ephemeral merge commit into the base;
          # that merge has no Signed-off-by. Check only non-merge commits on
          # the branch side of the two-dot range.
          RANGE="origin/${{ github.base_ref }}..HEAD"
          while IFS= read -r commit; do
            if ! git log -1 --format=%B "$commit" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "Missing DCO on $commit"
              git log -1 --format=%B "$commit"
              exit 1
            fi
          done < <(git rev-list --no-merges "$RANGE")

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: crates.io publish dry-run
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^crates/.+/Cargo\.toml$|^Cargo\.toml$|^scripts/publish_crates\.sh$'; then
            bash scripts/publish_crates.sh --dry-run
          else
            echo "No crate manifest changes; skipping publish dry-run"
          fi

  # Domain-correctness gates. `gate_release.sh` is the umbrella for the parity
  # schema check, the provenance schema check, and the ten feature gates
  # (estimate_ci, bayesian, gcm, pag, context, attribution, design_state,
  # upstream_names, response_calibration, causal_artifacts). Previously none of
  # these ran on a PR, so numerical parity and the public-repo name check were
  # unenforced between weekly runs.
  gates:
    name: Domain gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@b0480e2d44a72e89a62650e223ba831cbca8d2be # 1.85
        with:
          toolchain: "1.85"

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Release gate
        run: bash scripts/gate_release.sh

  # Python lint / type check. `scripts/gate_python_lint.sh` is the local
  # equivalent but requires python/.venv, so CI invokes the same three checks
  # directly through uv.
  python-lint:
    name: Python lint and types
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@b0480e2d44a72e89a62650e223ba831cbca8d2be # 1.85
        with:
          toolchain: "1.85"

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Sync dev environment
        working-directory: python
        run: uv sync --group dev

      - name: Build native extension
        working-directory: python
        run: uv run maturin develop

      - name: ruff check
        working-directory: python
        run: uv run ruff check antecedent tests ../examples/python

      - name: ruff format --check
        working-directory: python
        run: uv run ruff format --check antecedent tests ../examples/python

      - name: mypy
        working-directory: python
        run: uv run mypy

      - name: pytest with coverage floor
        working-directory: python
        run: uv run pytest -q --cov=antecedent --cov-report=term-missing --cov-fail-under=85

  # : CPython 3.11–3.14; Linux x86_64/aarch64 manylinux;
  # macOS arm64; Windows x86_64. Default faer path (no system BLAS).
  python-wheels:
    name: Wheel ${{ matrix.os }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
            target: x86_64
            manylinux: auto
          - os: ubuntu-latest
            python: "3.12"
            target: x86_64
            manylinux: auto
          - os: ubuntu-latest
            python: "3.13"
            target: x86_64
            manylinux: auto
          - os: ubuntu-latest
            python: "3.14"
            target: x86_64
            manylinux: auto
          - os: ubuntu-24.04-arm
            python: "3.11"
            target: aarch64
            manylinux: auto
          - os: ubuntu-24.04-arm
            python: "3.12"
            target: aarch64
            manylinux: auto
          - os: ubuntu-24.04-arm
            python: "3.13"
            target: aarch64
            manylinux: auto
          - os: ubuntu-24.04-arm
            python: "3.14"
            target: aarch64
            manylinux: auto
          - os: macos-14
            python: "3.11"
            target: aarch64
            manylinux: ""
          - os: macos-14
            python: "3.12"
            target: aarch64
            manylinux: ""
          - os: macos-14
            python: "3.13"
            target: aarch64
            manylinux: ""
          - os: macos-14
            python: "3.14"
            target: aarch64
            manylinux: ""
          - os: windows-latest
            python: "3.11"
            target: x64
            manylinux: ""
          - os: windows-latest
            python: "3.12"
            target: x64
            manylinux: ""
          - os: windows-latest
            python: "3.13"
            target: x64
            manylinux: ""
          - os: windows-latest
            python: "3.14"
            target: x64
            manylinux: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@b0480e2d44a72e89a62650e223ba831cbca8d2be # 1.85
        with:
          toolchain: "1.85"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          working-directory: python
          command: build
          # manylinux images have no bare `python` on PATH; pass the version
          # so maturin resolves /opt/python/cp3XY-*/bin/python inside the container.
          args: --release --out dist -i ${{ matrix.python }}
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          sccache: "true"

      - name: Install wheel and smoke tests
        shell: bash
        run: |
          set -euo pipefail
          # Install from repo root, then import/test outside python/ so the
          # source tree does not shadow the wheel on sys.path.
          pip install python/dist/*.whl numpy pandas pyarrow pytest
          cd "$(mktemp -d)"
          python -c "import antecedent; print(antecedent.__version__)"
          # Run the WHOLE suite against the installed wheel. Do not reintroduce a
          # hand-maintained file allowlist here: the previous 11-of-56 list silently
          # excluded every test added by the 0.4.0 refactor.
          ROOT="${{ github.workspace }}"
          pytest -q "$ROOT/python/tests"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python }}-${{ matrix.target }}
          path: python/dist/*.whl
          if-no-files-found: error
          retention-days: 14
