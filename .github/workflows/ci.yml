name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same PR supersedes the one in flight; pushes to main are
# never cancelled, so every main commit keeps the CI run a release verifies.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@b0480e2d44a72e89a62650e223ba831cbca8d2be # 1.85
        with:
          toolchain: "1.85"
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: DCO check
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # pull_request checkout is the ephemeral merge commit into the base;
          # that merge has no Signed-off-by. Check only non-merge commits on
          # the branch side of the two-dot range. Unshallow (not --deepen):
          # a fixed deepen along the base ref can leave the checked-out merge
          # commit grafted parentless, and a parentless graft is not a merge
          # to --no-merges, so the ephemeral merge itself got DCO-checked.
          git fetch --unshallow origin "$BASE_REF" 2>/dev/null \
            || git fetch origin "$BASE_REF"
          RANGE="origin/${BASE_REF}..HEAD"
          while IFS= read -r commit; do
            if ! git log -1 --format=%B "$commit" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "Missing DCO on $commit"
              git log -1 --format=%B "$commit"
              exit 1
            fi
          done < <(git rev-list --no-merges "$RANGE")

      - name: Format
        run: bash scripts/gate_rustfmt.sh

      - name: Lint allows carry reasons
        run: bash scripts/gate_lint_allows.sh

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Test optional learner and Gaussian-process features
        run: |
          cargo test -p antecedent-learn --features ml-full,ml-neural
          cargo test -p antecedent-model --features gaussian-process

      - name: crates.io publish dry-run
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if git diff --name-only "origin/${BASE_REF}...HEAD" | grep -qE '^crates/.+/Cargo\.toml$|^Cargo\.toml$|^scripts/publish_crates\.sh$'; then
            bash scripts/publish_crates.sh --dry-run
          else
            echo "No crate manifest changes; skipping publish dry-run"
          fi

  # `cargo test --workspace` unifies features through the `python` member
  # (default = ml-full), so the Rust job never compiles the graph a crates.io
  # user gets from `cargo add antecedent` (default features), nor any optional
  # feature on its own. Each line below compiles one such combination; an item
  # used unconditionally but defined under a feature breaks here, not for users.
  features:
    name: Feature combinations
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@b0480e2d44a72e89a62650e223ba831cbca8d2be # 1.85
        with:
          toolchain: "1.85"
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Default features (what `cargo add antecedent` builds)
        run: |
          set -euo pipefail
          cargo check -p antecedent
          cargo check -p antecedent-estimate
          cargo check -p antecedent-learn
          cargo check -p antecedent-data
          cargo check -p antecedent-model

      - name: Each optional feature alone
        run: |
          set -euo pipefail
          cargo check -p antecedent --features ml-gbdt
          cargo check -p antecedent --features ml-forest
          cargo check -p antecedent --features ml-full
          cargo check -p antecedent-data --no-default-features
          cargo check -p antecedent-learn --features ml-neural
          cargo check -p antecedent-estimate --features ml-neural
          cargo check -p antecedent-model --features gaussian-process

      - name: Lint the feature-gated code
        run: |
          set -euo pipefail
          cargo clippy -p antecedent-model --features gaussian-process --all-targets -- -D warnings
          cargo clippy -p antecedent-learn --features ml-neural --all-targets -- -D warnings
          cargo clippy -p antecedent-data --no-default-features --all-targets -- -D warnings

  # Relative performance regression, on pull requests labelled `perf`. Base and
  # head are benchmarked back to back on the same runner, so the absolute
  # Apple-M1 numbers in benches/baselines/ never enter: only the change of the mean
  # relative to the base, with its confidence interval (scripts/bench_regression.py).
  bench-regression:
    name: Bench regression
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'perf')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@b0480e2d44a72e89a62650e223ba831cbca8d2be # 1.85
        with:
          toolchain: "1.85"

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Benchmark the base, then the head
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          BENCHES=(
            "antecedent-kernels gather"
            "antecedent-kernels reductions"
            "antecedent-graph traversal"
            "antecedent-graph dseparation"
            "antecedent-identify adjustment"
            "antecedent-discovery pcmci"
          )
          run_benches() {
            local flag="$1"
            local entry
            for entry in "${BENCHES[@]}"; do
              read -r package bench <<<"$entry"
              cargo bench -p "$package" --bench "$bench" -- \
                "$flag" base --warm-up-time 1 --measurement-time 3
            done
          }
          git checkout --quiet "$BASE_SHA"
          run_benches --save-baseline
          git checkout --quiet "$HEAD_SHA"
          run_benches --baseline
          python3 scripts/bench_regression.py target/criterion

  # Dependency policy (licenses, advisories, sources) from deny.toml.
  deny:
    name: Dependency policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  # Domain-correctness gates. `gate_release.sh` is the umbrella for the parity
  # schema check, the provenance schema check, and the ten feature gates
  # (estimate_ci, bayesian, gcm, pag, context, attribution, design_state,
  # upstream_names, response_calibration, causal_artifacts). Previously none of
  # these ran on a PR, so numerical parity and the public-repo name check went
  # unenforced on PRs. Its first step fails the job when a committed coverage
  # record does not match the code (gate_calibration_attestation.sh): the
  # statistical measurement is made on a development machine before upload
  # (scripts/measure_calibration.sh) and never runs here.
  gates:
    name: Domain gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The calibration attestation diffs against each record's
          # calibration_sha, which a shallow clone does not contain.
          fetch-depth: 0

      # Seconds, and before any build: an upload whose coverage records owe a
      # re-measurement fails here with the drifted facets, their paths and the
      # local command that measures them.
      - name: Calibration attestation (coverage records match the code)
        run: bash scripts/gate_calibration_attestation.sh

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@b0480e2d44a72e89a62650e223ba831cbca8d2be # 1.85
        with:
          toolchain: "1.85"

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Sync Python for composition smoke
        working-directory: python
        run: uv sync --group dev

      - name: Build native extension
        working-directory: python
        run: uv run maturin develop

      - name: Release gate
        run: bash scripts/gate_release.sh

  # Python lint / type check. `uv sync` creates python/.venv, which is what
  # scripts/gate_python_lint.sh requires, so CI runs the very script the release
  # candidate does and the two cannot drift.
  python-lint:
    name: Python lint and types
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@b0480e2d44a72e89a62650e223ba831cbca8d2be # 1.85
        with:
          toolchain: "1.85"

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Sync dev environment
        working-directory: python
        run: uv sync --group dev

      - name: Build native extension
        working-directory: python
        run: uv run maturin develop

      - name: ruff, ruff format, mypy
        run: bash scripts/gate_python_lint.sh

      - name: pytest with coverage floor
        working-directory: python
        run: uv run pytest -q --cov=antecedent --cov-report=term-missing --cov-fail-under=85

  # : CPython 3.11–3.14; Linux x86_64/aarch64 manylinux;
  # macOS arm64; Windows x86_64. Default faer path (no system BLAS).
  python-wheels:
    name: Wheel ${{ matrix.os }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    env:
      # Windows locale encoding is cp1252. Repo pins use U+00D7; tests must
      # still pass encoding="utf-8" explicitly — this is the process default.
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
            target: x86_64
            manylinux: auto
          - os: ubuntu-latest
            python: "3.12"
            target: x86_64
            manylinux: auto
          - os: ubuntu-latest
            python: "3.13"
            target: x86_64
            manylinux: auto
          - os: ubuntu-latest
            python: "3.14"
            target: x86_64
            manylinux: auto
          - os: ubuntu-24.04-arm
            python: "3.11"
            target: aarch64
            manylinux: auto
          - os: ubuntu-24.04-arm
            python: "3.12"
            target: aarch64
            manylinux: auto
          - os: ubuntu-24.04-arm
            python: "3.13"
            target: aarch64
            manylinux: auto
          - os: ubuntu-24.04-arm
            python: "3.14"
            target: aarch64
            manylinux: auto
          - os: macos-14
            python: "3.11"
            target: aarch64
            manylinux: ""
          - os: macos-14
            python: "3.12"
            target: aarch64
            manylinux: ""
          - os: macos-14
            python: "3.13"
            target: aarch64
            manylinux: ""
          - os: macos-14
            python: "3.14"
            target: aarch64
            manylinux: ""
          - os: windows-latest
            python: "3.11"
            target: x64
            manylinux: ""
          - os: windows-latest
            python: "3.12"
            target: x64
            manylinux: ""
          - os: windows-latest
            python: "3.13"
            target: x64
            manylinux: ""
          - os: windows-latest
            python: "3.14"
            target: x64
            manylinux: ""
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@b0480e2d44a72e89a62650e223ba831cbca8d2be # 1.85
        with:
          toolchain: "1.85"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          working-directory: python
          command: build
          # manylinux images have no bare `python` on PATH; pass the version
          # so maturin resolves /opt/python/cp3XY-*/bin/python inside the container.
          args: --release --out dist -i ${{ matrix.python }}
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          sccache: "true"

      - name: Install wheel and smoke tests
        shell: bash
        run: |
          set -euo pipefail
          # Install from repo root, then import/test outside python/ so the
          # source tree does not shadow the wheel on sys.path.
          pip install python/dist/*.whl numpy pandas pyarrow pytest
          cd "$(mktemp -d)"
          python -c "import antecedent; print(antecedent.__version__)"
          # Run the WHOLE suite against the installed wheel. Do not reintroduce a
          # hand-maintained file allowlist here: the previous 11-of-56 list silently
          # excluded every test added by the 0.4.0 refactor.
          ROOT="${{ github.workspace }}"
          pytest -q "$ROOT/python/tests"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python }}-${{ matrix.target }}
          path: python/dist/*.whl
          if-no-files-found: error
          retention-days: 14
