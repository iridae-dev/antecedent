name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      rust_test_opt_level:
        description: "Rust test optimization level for a CI timing comparison"
        type: choice
        options: ["1", "2"]
        default: "2"

permissions:
  contents: read

# A newer push to a pull request replaces the run in flight. On main a run in
# flight always finishes, so the commit about to be tagged keeps its CI run; a
# newer push waits behind it (GitHub keeps only the newest pending run).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust ${{ matrix.display }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    # Opt-level 2 speeds the numeric loops. It is not in Cargo.toml: that file
    # is on the calibration surface, and local incremental builds stay at
    # opt-level 0. Debuginfo stays off in this job so the optimized test
    # binaries fit on the Ubuntu runner; the last run died in ld with
    # "No space left on device" after Clippy had already filled the disk.
    env:
      CARGO_PROFILE_TEST_OPT_LEVEL: ${{ inputs.rust_test_opt_level || '2' }}
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      RUST_CI_REST_FEATURES: antecedent-identify/test-util,antecedent-io/calibration-internal
      RUST_CI_FACADE_FEATURES: ml-gbdt,ml-forest,ml-neural,antecedent-data/arrow
    strategy:
      fail-fast: false
      # The facade owns most integration test targets. Both Ubuntu suites are
      # required; their package selections cover the workspace without overlap.
      # Main runs both macOS suites too, preserving its float-sensitive checks.
      matrix:
        include:
          - os: ubuntu-latest
            suite: rest
            display: ubuntu-latest
          - os: ubuntu-latest
            suite: facade
            display: ubuntu-latest facade
          - os: macos-latest
            suite: rest
            display: macos-latest
          - os: macos-latest
            suite: facade
            display: macos-latest facade
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free Ubuntu disk
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          needed_kib=$((75 * 1024 * 1024))
          available_kib() { df -Pk / | awk 'NR == 2 {print $4}'; }
          echo "Ubuntu disk before build:"
          df -h /
          for path in /usr/share/dotnet /opt/hostedtoolcache/CodeQL /usr/local/lib/android /opt/ghc /usr/local/share/boost; do
            if (( $(available_kib) >= needed_kib )); then
              break
            fi
            if [[ -e "$path" ]]; then
              echo "Freeing $path to reach 75 GiB available"
              sudo rm -rf "$path"
              df -h /
            fi
          done
          if (( $(available_kib) < needed_kib )); then
            echo "Need 75 GiB of available disk for Rust test binaries" >&2
            exit 1
          fi

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # 1.85
        with:
          toolchain: "1.85"
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Cache Rust compilation
        uses: mozilla-actions/sccache-action@fd02668681acd5f960e1372061bee5e3e987195c # v0.0.11

      - name: Enable compiler cache
        run: echo 'RUSTC_WRAPPER=sccache' >> "$GITHUB_ENV"

      - name: DCO check
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # pull_request checkout is the ephemeral merge commit into the base;
          # that merge has no Signed-off-by. Check only non-merge commits on
          # the branch side of the two-dot range. Unshallow (not --deepen):
          # a fixed deepen along the base ref can leave the checked-out merge
          # commit grafted parentless, and a parentless graft is not a merge
          # to --no-merges, so the ephemeral merge itself got DCO-checked.
          git fetch --unshallow origin "$BASE_REF" 2>/dev/null \
            || git fetch origin "$BASE_REF"
          RANGE="origin/${BASE_REF}..HEAD"
          while IFS= read -r commit; do
            if ! git log -1 --format=%B "$commit" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "Missing DCO on $commit"
              git log -1 --format=%B "$commit"
              exit 1
            fi
          done < <(git rev-list --no-merges "$RANGE")

      - name: Format
        run: bash scripts/gate_rustfmt.sh

      - name: Lint allows carry reasons
        run: bash scripts/gate_lint_allows.sh

      - name: Split Rust suites preserve workspace features
        if: matrix.os == 'ubuntu-latest' && matrix.suite == 'rest'
        run: python3 scripts/check_rust_ci_feature_parity.py "$RUST_CI_REST_FEATURES" "$RUST_CI_FACADE_FEATURES"

      # The macOS suite is sensitive to float bits and stack size, so it runs
      # on main. PRs keep its format/DCO check but do not wait for its tests.
      - name: Install cargo-nextest
        if: matrix.os != 'macos-latest' || github.event_name != 'pull_request'
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: nextest

      # Doctests stay on `cargo test`; nextest does not run them.
      - name: Test
        if: matrix.suite != 'facade' && (matrix.os != 'macos-latest' || github.event_name != 'pull_request')
        run: |
          trap 'df -h /' EXIT
          # The facade's dev-dependencies enabled these features in the former
          # full-workspace command. Keep that exact feature graph in this shard.
          cargo test --workspace --exclude antecedent --features "$RUST_CI_REST_FEATURES" --no-run --timings
          cargo nextest run --workspace --exclude antecedent --features "$RUST_CI_REST_FEATURES"
          cargo test --workspace --exclude antecedent --features "$RUST_CI_REST_FEATURES" --doc

      - name: Test facade
        if: matrix.suite == 'facade' && (matrix.os != 'macos-latest' || github.event_name != 'pull_request')
        run: |
          trap 'df -h /' EXIT
          # Python's default features activate these three leaf features and
          # data/arrow in the former full-workspace command.
          cargo test -p antecedent --features "$RUST_CI_FACADE_FEATURES" --no-run --timings
          cargo nextest run -p antecedent --features "$RUST_CI_FACADE_FEATURES"
          cargo test -p antecedent --features "$RUST_CI_FACADE_FEATURES" --doc

      - name: Upload Cargo timings
        if: always() && (matrix.os != 'macos-latest' || github.event_name != 'pull_request')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-timings-${{ matrix.os }}-${{ matrix.suite }}
          path: target/cargo-timings/*.html
          if-no-files-found: warn

      - name: Compiler cache statistics
        if: always()
        run: sccache --show-stats

      - name: Test optional learner and Gaussian-process features
        if: matrix.os == 'macos-latest' && matrix.suite == 'rest' && github.event_name != 'pull_request'
        run: |
          cargo nextest run -p antecedent-learn --features ml-full,ml-neural
          cargo test -p antecedent-learn --features ml-full,ml-neural --doc
          cargo nextest run -p antecedent-model --features gaussian-process
          cargo test -p antecedent-model --features gaussian-process --doc

      # The feature gates no longer re-run these suites; this lists the binaries
      # the steps above built and fails when a filter they relied on selects nothing.
      - name: Named tests still exist
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/gate_named_tests.sh --shard '${{ matrix.suite }}'

  # `cargo test --workspace` unifies features through the `python` member
  # (default = ml-full), so the Rust job never compiles the graph a crates.io
  # user gets from `cargo add antecedent` (default features), nor any optional
  # feature on its own. Each line below compiles one such combination; an item
  # used unconditionally but defined under a feature breaks here, not for users.
  features:
    name: Feature combinations
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_PROFILE_TEST_OPT_LEVEL: ${{ inputs.rust_test_opt_level || '2' }}
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # 1.85
        with:
          toolchain: "1.85"
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Cache Rust compilation
        uses: mozilla-actions/sccache-action@fd02668681acd5f960e1372061bee5e3e987195c # v0.0.11

      - name: Enable compiler cache
        run: echo 'RUSTC_WRAPPER=sccache' >> "$GITHUB_ENV"

      - name: Clippy workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Default features (what `cargo add antecedent` builds)
        run: |
          set -euo pipefail
          cargo check -p antecedent
          cargo check -p antecedent-estimate
          cargo check -p antecedent-learn
          cargo check -p antecedent-data
          cargo check -p antecedent-model

      - name: Each optional feature alone
        run: |
          set -euo pipefail
          cargo check -p antecedent --features ml-gbdt
          cargo check -p antecedent --features ml-forest
          cargo check -p antecedent --features ml-full
          cargo check -p antecedent-data --no-default-features
          cargo check -p antecedent-learn --features ml-neural
          cargo check -p antecedent-estimate --features ml-neural
          cargo check -p antecedent-model --features gaussian-process

      - name: Lint the feature-gated code
        run: |
          set -euo pipefail
          cargo clippy -p antecedent-model --features gaussian-process --all-targets -- -D warnings
          cargo clippy -p antecedent-learn --features ml-neural --all-targets -- -D warnings
          cargo clippy -p antecedent-data --no-default-features --all-targets -- -D warnings

      - name: Install cargo-nextest
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: nextest

      - name: Test optional learner and Gaussian-process features
        run: |
          set -euo pipefail
          cargo nextest run -p antecedent-learn --features ml-full,ml-neural
          cargo test -p antecedent-learn --features ml-full,ml-neural --doc
          cargo nextest run -p antecedent-model --features gaussian-process
          cargo test -p antecedent-model --features gaussian-process --doc

      - name: Compiler cache statistics
        if: always()
        run: sccache --show-stats

  # Relative performance regression, on pull requests labelled `perf`. Base and
  # head are benchmarked back to back on the same runner, so the absolute
  # Apple-M1 numbers in benches/baselines/ never enter: only the change of the mean
  # relative to the base, with its confidence interval (scripts/bench_regression.py).
  bench-regression:
    name: Bench regression
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'perf')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # 1.85
        with:
          toolchain: "1.85"

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Benchmark the base, then the head
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          BENCHES=(
            "antecedent-kernels gather"
            "antecedent-kernels reductions"
            "antecedent-graph traversal"
            "antecedent-graph dseparation"
            "antecedent-identify adjustment"
            "antecedent-discovery pcmci"
          )
          run_benches() {
            local flag="$1"
            local entry
            for entry in "${BENCHES[@]}"; do
              read -r package bench <<<"$entry"
              cargo bench -p "$package" --bench "$bench" -- \
                "$flag" base --warm-up-time 1 --measurement-time 3
            done
          }
          git checkout --quiet "$BASE_SHA"
          run_benches --save-baseline
          git checkout --quiet "$HEAD_SHA"
          run_benches --baseline
          python3 scripts/bench_regression.py target/criterion

  # Dependency policy (licenses, advisories, sources) from deny.toml.
  deny:
    name: Dependency policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

      - name: Install Rust 1.85 for crate packaging
        if: github.event_name == 'pull_request'
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # 1.85
        with:
          toolchain: "1.85"

      - name: Cache cargo for crate packaging
        if: github.event_name == 'pull_request'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: crates.io publish dry-run
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF"
          if git diff --name-only "origin/${BASE_REF}...HEAD" | grep -qE '^crates/.+/Cargo\.toml$|^Cargo\.toml$|^scripts/publish_crates\.sh$'; then
            bash scripts/publish_crates.sh --dry-run
          else
            echo "No crate manifest changes; skipping publish dry-run"
          fi

  # Domain-correctness gates. `gate_release.sh` is the umbrella for the parity
  # schema check, the provenance schema check, and the feature gates
  # (estimate_ci, bayesian, gcm, pag, context, attribution, design_state,
  # upstream_names, causal_artifacts, composition, transport). Previously none of
  # these ran on a PR, so numerical parity and the public-repo name check went
  # unenforced on PRs. Its first step fails the job when a committed coverage
  # record does not match the code (gate_calibration_attestation.sh): the
  # statistical measurement is made on a development machine before upload
  # (scripts/measure_calibration.sh) and never runs here.
  gate-sections:
    name: Domain ${{ matrix.section }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      # Debug-profile libtest threads otherwise overflow on cited CPDAG pins.
      RUST_MIN_STACK: "67108864"
    strategy:
      fail-fast: false
      matrix:
        section: [inventory, promotion-python, promotion-facade-0, promotion-facade-1, promotion-estimate, promotion-identify, promotion-other, graphless, matrix-0, matrix-1, matrix-2, matrix-3, matrix-4, matrix-5, matrix-6, matrix-7, transport-contracts, checked-0, checked-1, checked-2, checked-3, feature-core, feature-composition, feature-transport, feature-exits, benches]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The calibration attestation diffs against each record's
          # calibration_sha, which a shallow clone does not contain.
          fetch-depth: 0

      # Seconds, and before any build: an upload whose coverage records owe a
      # re-measurement fails here with the drifted facets, their paths and the
      # local command that measures them.
      - name: Calibration attestation (coverage records match the code)
        run: bash scripts/gate_calibration_attestation.sh

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # 1.85
        with:
          toolchain: "1.85"

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Cache Rust compilation
        uses: mozilla-actions/sccache-action@fd02668681acd5f960e1372061bee5e3e987195c # v0.0.11

      - name: Enable compiler cache
        run: echo 'RUSTC_WRAPPER=sccache' >> "$GITHUB_ENV"

      - name: Install cargo-nextest for cited evidence tests
        if: (startsWith(matrix.section, 'promotion-') && matrix.section != 'promotion-python') || startsWith(matrix.section, 'checked-')
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: nextest

      - name: Install uv
        if: matrix.section != 'benches' && matrix.section != 'graphless' && !startsWith(matrix.section, 'checked-') && !startsWith(matrix.section, 'promotion-facade-') && matrix.section != 'promotion-estimate' && matrix.section != 'promotion-identify' && matrix.section != 'promotion-other'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Sync Python dependencies
        if: matrix.section != 'benches' && matrix.section != 'graphless' && !startsWith(matrix.section, 'checked-') && !startsWith(matrix.section, 'promotion-facade-') && matrix.section != 'promotion-estimate' && matrix.section != 'promotion-identify' && matrix.section != 'promotion-other'
        working-directory: python
        run: uv sync --group dev --no-install-project

      - name: Build native extension
        if: matrix.section != 'benches' && matrix.section != 'graphless' && !startsWith(matrix.section, 'checked-') && !startsWith(matrix.section, 'promotion-facade-') && matrix.section != 'promotion-estimate' && matrix.section != 'promotion-identify' && matrix.section != 'promotion-other'
        working-directory: python
        # A cold compiler-cache backend made this dev-profile build take 8-9m;
        # use Cargo's incremental build here, then cache test compilations.
        env:
          RUSTC_WRAPPER: ""
          CARGO_INCREMENTAL: "1"
        run: uv run --no-sync maturin develop

      - name: Release gate section
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          UV_NO_SYNC: "1"
        run: bash scripts/gate_release.sh --section "${{ matrix.section }}"

      - name: Compiler cache statistics
        if: always()
        run: sccache --show-stats

  # Retain the required Domain gates check: every section must pass.
  gates:
    name: Domain gates
    needs: gate-sections
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every domain section
        env:
          RESULT: ${{ needs.gate-sections.result }}
        run: test "$RESULT" = success

  # Python lint / type check. `uv sync` creates python/.venv, which is what
  # scripts/gate_python_lint.sh requires, so CI runs the very script the release
  # candidate does and the two cannot drift.
  python-lint:
    name: Python lint and types
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # 1.85
        with:
          toolchain: "1.85"

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Cache Rust compilation
        uses: mozilla-actions/sccache-action@fd02668681acd5f960e1372061bee5e3e987195c # v0.0.11

      - name: Enable compiler cache
        run: echo 'RUSTC_WRAPPER=sccache' >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Sync dev environment
        working-directory: python
        run: uv sync --group dev --no-install-project

      - name: Build native extension
        working-directory: python
        env:
          RUSTC_WRAPPER: ""
          CARGO_INCREMENTAL: "1"
        run: uv run --no-sync maturin develop

      - name: ruff, ruff format, mypy
        env:
          UV_NO_SYNC: "1"
        run: bash scripts/gate_python_lint.sh

      - name: pytest with coverage floor
        working-directory: python
        run: uv run --no-sync pytest -q --cov=antecedent --cov-report=term-missing --cov-fail-under=85

      - name: Compiler cache statistics
        if: always()
        run: sccache --show-stats

  # : CPython 3.11–3.14; Linux x86_64/aarch64 manylinux;
  # macOS arm64; Windows x86_64. Default faer path (no system BLAS).
  python-wheels:
    name: Wheel ${{ matrix.os }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    env:
      # Windows locale encoding is cp1252. Repo pins use U+00D7; tests must
      # still pass encoding="utf-8" explicitly — this is the process default.
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    permissions:
      contents: read
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
            target: x86_64
            manylinux: auto
          - os: ubuntu-latest
            python: "3.12"
            target: x86_64
            manylinux: auto
          - os: ubuntu-latest
            python: "3.13"
            target: x86_64
            manylinux: auto
          - os: ubuntu-latest
            python: "3.14"
            target: x86_64
            manylinux: auto
          - os: ubuntu-24.04-arm
            python: "3.11"
            target: aarch64
            manylinux: auto
          - os: ubuntu-24.04-arm
            python: "3.12"
            target: aarch64
            manylinux: auto
          - os: ubuntu-24.04-arm
            python: "3.13"
            target: aarch64
            manylinux: auto
          - os: ubuntu-24.04-arm
            python: "3.14"
            target: aarch64
            manylinux: auto
          - os: macos-14
            python: "3.11"
            target: aarch64
            manylinux: ""
          - os: macos-14
            python: "3.12"
            target: aarch64
            manylinux: ""
          - os: macos-14
            python: "3.13"
            target: aarch64
            manylinux: ""
          - os: macos-14
            python: "3.14"
            target: aarch64
            manylinux: ""
          - os: windows-latest
            python: "3.11"
            target: x64
            manylinux: ""
          - os: windows-latest
            python: "3.12"
            target: x64
            manylinux: ""
          - os: windows-latest
            python: "3.13"
            target: x64
            manylinux: ""
          - os: windows-latest
            python: "3.14"
            target: x64
            manylinux: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # 1.85
        with:
          toolchain: "1.85"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: python
          command: build
          # manylinux images have no bare `python` on PATH; pass the version
          # so maturin resolves /opt/python/cp3XY-*/bin/python inside the container.
          args: --release --out dist -i ${{ matrix.python }}
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          sccache: "true"

      - name: Install wheel and smoke tests
        shell: bash
        run: |
          set -euo pipefail
          # Install from repo root, then import/test outside python/ so the
          # source tree does not shadow the wheel on sys.path.
          pip install python/dist/*.whl numpy pandas pyarrow pytest
          cd "$(mktemp -d)"
          python -c "import antecedent; print(antecedent.__version__)"
          # Run the WHOLE suite against the installed wheel. Do not reintroduce a
          # hand-maintained file allowlist here: the previous 11-of-56 list silently
          # excluded every test added by the 0.4.0 refactor.
          ROOT="${{ github.workspace }}"
          pytest -q "$ROOT/python/tests"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python }}-${{ matrix.target }}
          path: python/dist/*.whl
          if-no-files-found: error
          retention-days: 30

      # Main CI, where the wheel is built, records its provenance for release.
      - name: Attest wheel build provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: python/dist/*.whl
