# statistical calibration (scheduled; not every-PR unit CI).
name: calibration

on:
  schedule:
    # Weekly Monday 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  gate:
    # The full gate is several hours of release-mode coverage runs (plus
    # 2000-replicate rechecks of any low cell), so it is split across shards;
    # gate_calibration.sh assigns groups to shards by their index in script
    # order. Raise the shard count, not the timeout, when the gate grows.
    name: Statistical calibration gate (shard ${{ matrix.shard }} of 8)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@b0480e2d44a72e89a62650e223ba831cbca8d2be # 1.85
        with:
          toolchain: "1.85"

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Run calibration gate shard
        env:
          ANTECEDENT_CALIBRATION_SHARD: ${{ matrix.shard }}/8
        run: bash scripts/gate_calibration.sh
