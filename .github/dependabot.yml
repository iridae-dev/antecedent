# Every action in .github/workflows is pinned to a commit SHA, with the release
# tag in a trailing comment. That comment is the version Dependabot bumps, so it
# has to be the full tag (`v2.9.2`), not a floating major (`v2`).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    # The pin comment is the Rust toolchain this job installs, not an action
    # release. dtolnay/rust-toolchain has no current semver tag.
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns: ["*"]
    # MSRV is Rust 1.85. A major bump (Dependabot counts a 0.x minor as
    # major) is what pulled arrow 60 (rustc 1.88) and burn 0.21 (rustc 1.92)
    # into one red pull request. Patch and in-range minor updates still open.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: uv
    directory: /python
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python:
        patterns: ["*"]
