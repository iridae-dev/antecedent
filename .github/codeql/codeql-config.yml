# CodeQL advanced-setup config for antecedent.
# Query suites are selected by the workflow / gate (security-and-quality).
name: antecedent CodeQL

paths-ignore:
  - "**/target/**"
  - "**/fuzz/target/**"
  - "**/benches/reports/**"
  - "**/.venv/**"
  - "**/venv/**"
  - "**/__pycache__/**"
  - "**/.codeql-db/**"
  - "**/.codeql-results/**"
  - "**/conformance/**/data.csv"
  - "**/parity/fixtures/**"

# Excluded *quality* rules (no security rule is excluded, and the Rust analysis runs the
# full suite with zero findings). Each exclusion is a false positive on a deliberate Python
# idiom that cannot be satisfied without making the code worse. Rationale is recorded here
# rather than in scattered inline comments so the set stays auditable.
query-filters:
  # `...` is the standard body for a `Protocol` / stub method — CodeQL reads the Ellipsis
  # expression as a statement with no effect. Also fires on `with pytest.raises(...): obj[k]`,
  # where raising *is* the effect being tested.
  - exclude:
      id: py/ineffectual-statement

  # Compatibility aliases (e.g. `NativeAnalysisResult`, `_wrap_temporal` in `estimation.py`)
  # are consumed by `from .estimation import ...` in sibling modules. CodeQL's per-module
  # view cannot see the cross-module use and reports them as dead.
  - exclude:
      id: py/unused-global-variable

  # A test module legitimately needs both `import antecedent` (to exercise the root facade)
  # and `from antecedent import _coerce` (to reach a private module under test).
  - exclude:
      id: py/import-and-import-from

  # The hazard `py/unsafe-cyclic-import` describes is real but specific: module A imports B
  # at *module scope*, B imports A at module scope, and A refers to a name defined after B's
  # import — so some import order hits a half-initialised module. It requires a cycle among
  # module-scope imports.
  #
  # This package has none. Its reported cycles exist only once function-body imports (which
  # run at call time, after every module is initialised) and `if TYPE_CHECKING:` imports
  # (which never run) are counted alongside module-scope ones, which CodeQL does not
  # distinguish. The fluent surface — `config.accept(data).estimate(...)`,
  # `AcceptedGraph.rediscover()` — means value types must name the layers above them, and
  # deferring those imports is the correct mitigation, not a workaround.
  #
  # That claim is enforced, not asserted: `python/tests/test_import_graph.py` fails if the
  # module-scope graph ever gains a cycle, and separately imports every module first in a
  # fresh interpreter to prove no order-dependence. Promoting one deferred import to module
  # scope was verified to trip it (and to raise a genuine `ImportError: cannot import name
  # 'LPCMCI' from partially initialized module`). Revisit these exclusions only if that test
  # is weakened or removed.
  - exclude:
      id: py/cyclic-import
  - exclude:
      id: py/unsafe-cyclic-import
