[package]
name = "antecedent-attribution"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Anomaly, distribution-change, root-cause, and Shapley attribution for the Antecedent causal inference engine; start with the `antecedent` crate"
readme = "README.md"

[lints]
workspace = true

[features]
# Development build (never default): `not_supported` routes run and results list `would_refuse`.
development = ["antecedent-core/development", "antecedent-data/development", "antecedent-graph/development", "antecedent-kernels/development", "antecedent-model/development", "antecedent-counterfactual/development", "antecedent-prob/development", "antecedent-stats/development"]

[dependencies]
antecedent-core = { workspace = true }
antecedent-data = { workspace = true }
antecedent-graph = { workspace = true }
antecedent-kernels = { workspace = true }
antecedent-model = { workspace = true }
antecedent-counterfactual = { workspace = true }
antecedent-prob = { workspace = true }
antecedent-stats = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
antecedent-core = { workspace = true, features = ["test-support"] }
criterion = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[[bench]]
name = "shapley"
harness = false

[[bench]]
name = "parallel_shapley"
harness = false
