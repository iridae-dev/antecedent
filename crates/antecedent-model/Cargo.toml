[package]
name = "antecedent-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Structural causal models, mechanisms, and interventional sampling for the Antecedent engine; start with the `antecedent` crate"
readme = "README.md"

[lints]
workspace = true

[dependencies]
antecedent-core = { version = "2.1.0", path = "../antecedent-core" }
antecedent-data = { version = "2.1.0", path = "../antecedent-data" }
antecedent-graph = { version = "2.1.0", path = "../antecedent-graph" }
antecedent-kernels = { version = "2.1.0", path = "../antecedent-kernels" }
antecedent-prob = { version = "2.1.0", path = "../antecedent-prob" }
antecedent-stats = { version = "2.1.0", path = "../antecedent-stats" }
thiserror = { workspace = true }

[features]
default = []
# Gaussian-process mechanism family (registry auto-fit path only — a deserialized
# `MechanismSlot::GaussianProcess` always evaluates/samples regardless of this feature).
#
# Exact Cholesky NLML over a coarse fixed 5x5 grid, on the data's own scale: length scales
# are multiples of the parents' RMS spread, noise levels multiples of the outcome's SD, the
# signal variance is the outcome's variance and the prior mean its sample mean, so the fit
# is equivariant to a change of units. The kernel is a single isotropic RBF (no ARD or
# kernel selection) and the exact fit is O(n^3) per grid cell with no sparse/inducing-point
# path, hence the `GP_FAMILY_MAX_ROWS` refusal. Family selection scores it out of fold, like
# every other family. CI builds and tests this feature (`.github/workflows/ci.yml`).
gaussian-process = []

[dev-dependencies]
criterion = { workspace = true }
serde_json = { workspace = true }

[[bench]]
name = "sample_overlay"
harness = false
