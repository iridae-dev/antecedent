[package]
name = "antecedent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "A compiler and evidence-aware runtime for causal science: discovery, identification, estimation, interventions and counterfactuals under structural uncertainty"
readme = "README.md"
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
autotests = false

[package.metadata.scientific-test-features]
suite_01 = ["calibration-internal"]
suite_06 = ["calibration-internal"]

[lints]
workspace = true

[features]
# Development build (never default): `not_supported` routes run and results list `would_refuse`.
development = ["antecedent-core/development", "antecedent-contract/development", "antecedent-data/development", "antecedent-discovery/development", "antecedent-estimate/development", "antecedent-expr/development", "antecedent-graph/development", "antecedent-identify/development", "antecedent-io/development", "antecedent-io-core/development", "antecedent-prob/development", "antecedent-stats/development", "antecedent-validate/development", "antecedent-model/development", "antecedent-learn/development", "antecedent-counterfactual/development", "antecedent-attribution/development", "antecedent-design/development", "antecedent-state/development", "antecedent-kernels/development"]
default = ["file-source"]
# Parquet and Arrow IPC table files (`analysis::file_table`).
file-source = ["antecedent-data/parquet", "antecedent-data/ipc"]
calibration-internal = ["antecedent-estimate/calibration-internal", "antecedent-io/calibration-internal", "antecedent-validate/calibration-internal"]
ml-gbdt = ["antecedent-estimate/ml-gbdt", "antecedent-model/ml-gbdt"]
ml-forest = ["antecedent-estimate/ml-forest", "antecedent-model/ml-forest"]
ml-full = ["ml-gbdt", "ml-forest"]
ml-neural = ["antecedent-estimate/ml-neural"]
# Burn's WGPU backend for the neural learner (opt-in accelerator distribution).
ml-neural-wgpu = ["ml-neural", "antecedent-learn/ml-neural-wgpu"]

[dependencies]
antecedent-core = { workspace = true }
antecedent-contract = { workspace = true }
antecedent-data = { workspace = true }
antecedent-discovery = { workspace = true }
antecedent-estimate = { workspace = true }
antecedent-expr = { workspace = true }
antecedent-graph = { workspace = true }
antecedent-identify = { workspace = true }
antecedent-io = { workspace = true }
antecedent-io-core = { workspace = true }
antecedent-prob = { workspace = true }
antecedent-stats = { workspace = true }
antecedent-validate = { workspace = true }
antecedent-model = { workspace = true }
antecedent-learn = { workspace = true }
antecedent-counterfactual = { workspace = true }
antecedent-attribution = { workspace = true }
antecedent-design = { workspace = true }
antecedent-state = { workspace = true }
antecedent-kernels = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
blake3 = { workspace = true }
ciborium = { workspace = true }

[dev-dependencies]
antecedent-core = { workspace = true, features = ["test-support"] }
antecedent-test-support = { workspace = true }
criterion.workspace = true
antecedent-identify = { workspace = true, features = ["test-util"] }
# The calibration harness and lifecycle tests measure the closed X4 interval estimator.
antecedent-estimate = { workspace = true, features = ["calibration-internal"] }
antecedent-io = { workspace = true, features = ["calibration-internal", "test-util"] }
# The X3 joint-sensitivity calibration harness measures the closed endpoint bootstrap.
antecedent-validate = { workspace = true, features = ["calibration-internal"] }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }

