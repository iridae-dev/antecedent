[package]
name = "antecedent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Identification-first causal inference: identify → estimate → refute, with uncertainty about causal structure preserved"
readme = "README.md"
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
autotests = false

[lints]
workspace = true

[features]
default = ["file-source"]
# Parquet and Arrow IPC table files (`analysis::file_table`).
file-source = ["antecedent-data/parquet", "antecedent-data/ipc"]
calibration-internal = ["antecedent-estimate/calibration-internal", "antecedent-io/calibration-internal", "antecedent-validate/calibration-internal"]
ml-gbdt = ["antecedent-estimate/ml-gbdt", "antecedent-model/ml-gbdt"]
ml-forest = ["antecedent-estimate/ml-forest", "antecedent-model/ml-forest"]
ml-full = ["ml-gbdt", "ml-forest"]
ml-neural = ["antecedent-estimate/ml-neural"]

[dependencies]
antecedent-core = { workspace = true }
antecedent-contract = { workspace = true }
antecedent-data = { workspace = true }
antecedent-discovery = { workspace = true }
antecedent-estimate = { workspace = true }
antecedent-expr = { workspace = true }
antecedent-graph = { workspace = true }
antecedent-identify = { workspace = true }
antecedent-io = { workspace = true }
antecedent-io-core = { workspace = true }
antecedent-prob = { workspace = true }
antecedent-stats = { workspace = true }
antecedent-validate = { workspace = true }
antecedent-model = { workspace = true }
antecedent-learn = { workspace = true }
antecedent-counterfactual = { workspace = true }
antecedent-attribution = { workspace = true }
antecedent-design = { workspace = true }
antecedent-state = { workspace = true }
antecedent-kernels = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
blake3 = { workspace = true }

[dev-dependencies]
antecedent-core = { workspace = true, features = ["test-support"] }
antecedent-test-support = { workspace = true }
criterion.workspace = true
ciborium = { workspace = true }
antecedent-identify = { workspace = true, features = ["test-util"] }
# The calibration harness and lifecycle tests measure the closed X4 interval estimator.
antecedent-estimate = { workspace = true, features = ["calibration-internal"] }
antecedent-io = { workspace = true, features = ["calibration-internal", "test-util"] }
# The X3 joint-sensitivity calibration harness measures the closed endpoint bootstrap.
antecedent-validate = { workspace = true, features = ["calibration-internal"] }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }

[[test]]
name = "recalc_joint_bayesian"
required-features = ["calibration-internal"]

[[test]]
name = "temporal_recalc_calibration"
required-features = ["calibration-internal"]

[[test]]
name = "temporal_interval_activation"
required-features = ["calibration-internal"]

