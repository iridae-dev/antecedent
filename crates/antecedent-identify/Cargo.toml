[package]
name = "antecedent-identify"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Causal identification for the Antecedent engine: backdoor, front-door, IV, ID/IDC, and temporal strategies; start with the `antecedent` crate"
readme = "README.md"
autotests = false

[lints]
workspace = true

[features]
# Frozen-oracle DOT parser (`oracle_dot`) for tests and parity fixtures. It panics on
# malformed input by design, so it is not part of the default public API.
test-util = []

[dependencies]
antecedent-core = { workspace = true }
antecedent-data = { workspace = true }
antecedent-expr = { workspace = true }
antecedent-graph = { workspace = true }
antecedent-kernels = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
serde_json = { workspace = true }

[[bench]]
name = "adjustment"
harness = false

[[test]]
name = "causaleffect_transport_subset"
path = "tests/causaleffect_transport_subset.rs"

[[test]]
name = "counterfactual_transport_decisions"
path = "tests/counterfactual_transport_decisions.rs"

[[test]]
name = "finite_scm_oracle_selftest"
path = "tests/finite_scm_oracle_selftest.rs"

[[test]]
name = "study_planning_search"
path = "tests/study_planning_search.rs"

[[test]]
name = "transport_exact_scm"
path = "tests/transport_exact_scm.rs"

[[test]]
name = "suite_01"
path = "tests/suite_01.rs"

[[test]]
name = "idc_baked_levels"
path = "tests/idc_baked_levels.rs"

[[test]]
name = "temporal_iv"
path = "tests/temporal_iv.rs"
