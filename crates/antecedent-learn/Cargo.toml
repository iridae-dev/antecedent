[package]
name = "antecedent-learn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Prediction contract and nuisance learners for the Antecedent causal inference engine; start with the `antecedent` crate"
readme = "README.md"

[lints]
workspace = true

[features]
ml-gbdt = ["dep:forust-ml"]
ml-forest = ["dep:smartcore"]
ml-full = ["ml-gbdt", "ml-forest"]
# L: not in ml-full. A CPU-only Burn `NdArray<f32>` MLP: there is no GPU/WGPU backend.
ml-neural = ["dep:antecedent-learn-burn"]

[dependencies]
antecedent-core = { version = "2.1.0", path = "../antecedent-core" }
antecedent-kernels = { version = "2.1.0", path = "../antecedent-kernels" }
antecedent-stats = { version = "2.1.0", path = "../antecedent-stats" }
antecedent-prob = { version = "2.1.0", path = "../antecedent-prob" }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
forust-ml = { version = "0.5", optional = true }
smartcore = { version = "0.4", optional = true, default-features = false, features = ["serde"] }
antecedent-learn-burn = { version = "2.1.0", path = "../antecedent-learn-burn", optional = true }
