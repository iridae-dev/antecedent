[package]
name = "antecedent-learn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Prediction contract and nuisance learners for the Antecedent causal inference engine; start with the `antecedent` crate"
readme = "README.md"

[lints]
workspace = true

[features]
calibration-internal = []
ml-gbdt = ["dep:forust-ml"]
ml-forest = ["dep:smartcore"]
ml-full = ["ml-gbdt", "ml-forest"]
# L: not in ml-full. A CPU-only Burn `NdArray<f32>` MLP: there is no GPU/WGPU backend.
ml-neural = ["dep:antecedent-learn-burn"]

[dependencies]
antecedent-core = { workspace = true }
antecedent-kernels = { workspace = true }
antecedent-stats = { workspace = true }
antecedent-prob = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
forust-ml = { workspace = true, optional = true }
smartcore = { workspace = true, optional = true }
antecedent-learn-burn = { workspace = true, optional = true }

[[example]]
name = "neural_crossfit_benchmark"
required-features = ["ml-neural"]
