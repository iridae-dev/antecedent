[package]
name = "antecedent-validate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Effect refuters, sensitivity analysis, and validation diagnostics for the Antecedent engine; start with the `antecedent` crate"
readme = "README.md"

[lints]
workspace = true

[features]
default = []
# Exposes the closed joint-sensitivity endpoint bootstrap
# (`joint_sensitivity_bootstrap_interval_internal`) to the calibration harness. Enabled only
# by dev-dependencies (resolver 2 keeps it out of normal builds); no released build carries it.
calibration-internal = ["antecedent-estimate/calibration-internal"]

[dependencies]
antecedent-core = { workspace = true }
antecedent-data = { workspace = true }
antecedent-estimate = { workspace = true }
antecedent-expr = { workspace = true }
antecedent-identify = { workspace = true }
antecedent-io-core = { workspace = true }
antecedent-discovery = { workspace = true }
antecedent-graph = { workspace = true }
antecedent-prob = { workspace = true }
antecedent-stats = { workspace = true }
antecedent-kernels = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Self dev-dependency: the joint-sensitivity integration tests exercise the closed endpoint bootstrap,
# compiled only under `calibration-internal`.
antecedent-validate = { path = ".", features = ["calibration-internal"] }
serde_json = { workspace = true }

[[bench]]
name = "refuters"
harness = false
