[package]
name = "antecedent-validate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Effect refuters, sensitivity analysis, and validation diagnostics for the Antecedent engine; start with the `antecedent` crate"
readme = "README.md"
autotests = false

[lints]
workspace = true

[features]
default = []
# Exposes the closed joint-sensitivity endpoint bootstrap
# (`joint_sensitivity_bootstrap_interval_internal`) to the calibration harness.
# Pass `--features calibration-internal` to compile it. No released build carries it.
calibration-internal = ["antecedent-estimate/calibration-internal"]

[dependencies]
antecedent-core = { workspace = true }
antecedent-data = { workspace = true }
antecedent-estimate = { workspace = true }
antecedent-expr = { workspace = true }
antecedent-identify = { workspace = true }
antecedent-io-core = { workspace = true }
antecedent-discovery = { workspace = true }
antecedent-graph = { workspace = true }
antecedent-prob = { workspace = true }
antecedent-stats = { workspace = true }
antecedent-kernels = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
antecedent-core = { workspace = true, features = ["test-support"] }
serde_json = { workspace = true }

[[bench]]
name = "refuters"
harness = false

[[test]]
name = "suite_01"
path = "tests/suite_01.rs"

[[test]]
name = "staleness"
path = "tests/staleness.rs"

[[test]]
name = "target_native_numerics_reference"
path = "tests/target_native_numerics_reference.rs"

[[test]]
name = "target_native"
path = "tests/target_native.rs"

[[test]]
name = "sensitivity_bounds"
path = "tests/sensitivity_bounds.rs"

[[test]]
name = "distribution_drift_reference"
path = "tests/distribution_drift_reference.rs"

[[test]]
name = "conflict_policy_reference"
path = "tests/conflict_policy_reference.rs"

[[test]]
name = "linear_sensitivity_reference"
path = "tests/linear_sensitivity_reference.rs"

[[test]]
name = "proper_scores_reference"
path = "tests/proper_scores_reference.rs"

[[test]]
name = "diagnostic_propensity_reference"
path = "tests/diagnostic_propensity_reference.rs"

[[test]]
name = "predictive_assessment_reference"
path = "tests/predictive_assessment_reference.rs"

[[test]]
name = "bootstrap_refute_reference"
path = "tests/bootstrap_refute_reference.rs"

[[test]]
name = "robustness_refuters_reference"
path = "tests/robustness_refuters_reference.rs"

[[test]]
name = "graph_refute_reference"
path = "tests/graph_refute_reference.rs"

[[test]]
name = "msm_sensitivity_reference"
path = "tests/msm_sensitivity_reference.rs"

[[test]]
name = "simulated_unobserved_confounder_reference"
path = "tests/simulated_unobserved_confounder_reference.rs"

[[test]]
name = "static_mediation_reference"
path = "tests/static_mediation_reference.rs"

[[test]]
name = "temporal_mediation_refuter_reference"
path = "tests/temporal_mediation_refuter_reference.rs"

[[test]]
name = "joint_uncertainty_reference"
path = "tests/joint_uncertainty_reference.rs"
required-features = ["calibration-internal"]

[[test]]
name = "functional_reference"
path = "tests/functional_reference.rs"
