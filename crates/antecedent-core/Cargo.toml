[package]
name = "antecedent-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Identifiers, schemas, assumptions, provenance, and execution policy shared across the Antecedent causal inference engine; start with the `antecedent` crate"
readme = "README.md"
autotests = false

[lints]
workspace = true

[features]
# Test hooks (for example `CancellationToken::cancel_after_checks`) for dependants' tests.
test-support = []
# Development build: a `not_supported` route runs and the result lists what would have refused.
# Never default, never enabled by a published crate or the wheel.
development = []

[dependencies]
blake3 = { workspace = true }
thiserror = { workspace = true }

[[test]]
name = "suite_01"
path = "tests/suite_01.rs"
