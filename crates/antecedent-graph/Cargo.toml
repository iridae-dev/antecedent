[package]
name = "antecedent-graph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Causal graph types (DAG, ADMG, CPDAG, PAG, temporal), separation queries, and traversal workspaces for the Antecedent engine; start with the `antecedent` crate"
readme = "README.md"
autotests = false

[lints]
workspace = true

[dependencies]
antecedent-core = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
antecedent-core = { workspace = true, features = ["test-support"] }
criterion = { workspace = true }
serde_json = { workspace = true }

[[bench]]
name = "traversal"
harness = false

[[bench]]
name = "dseparation"
harness = false

[[bench]]
name = "mseparation"
harness = false

[[bench]]
name = "surgery"
harness = false

[[bench]]
name = "unfold"
harness = false

[[test]]
name = "suite_01"
path = "tests/suite_01.rs"

[[test]]
name = "admg_msep_exhaustive"
path = "tests/admg_msep_exhaustive.rs"

[[test]]
name = "cpdag_mec_exhaustive"
path = "tests/cpdag_mec_exhaustive.rs"

[[test]]
name = "sigma_separation_walk_reference"
path = "tests/sigma_separation_walk_reference.rs"

[[test]]
name = "pag_completion_exhaustive"
path = "tests/pag_completion_exhaustive.rs"

[[test]]
name = "temporal_cpdag_invariants_reference"
path = "tests/temporal_cpdag_invariants_reference.rs"
