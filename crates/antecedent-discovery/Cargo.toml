[package]
name = "antecedent-discovery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Causal discovery for the Antecedent engine: PC, GES, LiNGAM, NOTEARS, FCI, the PCMCI family, and Bayesian graph posteriors; start with the `antecedent` crate"
readme = "README.md"
autotests = false

[lints]
workspace = true

[dependencies]
antecedent-core = { workspace = true }
antecedent-data = { workspace = true }
antecedent-graph = { workspace = true }
antecedent-kernels = { workspace = true }
antecedent-prob = { workspace = true }
antecedent-state = { workspace = true }
antecedent-stats = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
antecedent-core = { workspace = true, features = ["test-support"] }
antecedent-test-support = { workspace = true }
criterion = { workspace = true }
serde_json = { workspace = true }

[[bench]]
name = "pcmci"
harness = false

[[bench]]
name = "orientation"
harness = false

[[bench]]
name = "pag_orientation"
harness = false

[[bench]]
name = "rpcmci"
harness = false

