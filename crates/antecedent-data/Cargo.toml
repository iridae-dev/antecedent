[package]
name = "antecedent-data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Causal data views and Arrow-backed adapters for the Antecedent causal inference engine; start with the `antecedent` crate"
readme = "README.md"
autotests = false

[lints]
workspace = true

[features]
default = ["arrow"]
arrow = [
    "dep:arrow-array",
    "dep:arrow-schema",
    "dep:arrow-buffer",
    "arrow-array/ffi",
    "arrow-schema/ffi",
]

[dependencies]
antecedent-core = { workspace = true }
antecedent-kernels = { workspace = true }
arrow-array = { workspace = true, optional = true }
arrow-schema = { workspace = true, optional = true }
arrow-buffer = { workspace = true, optional = true }
realfft = { workspace = true }
blake3 = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[[test]]
name = "suite_01"
path = "tests/suite_01.rs"
