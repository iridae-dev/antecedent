[package]
name = "antecedent-data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Causal data views and Arrow-backed adapters for the Antecedent causal inference engine; start with the `antecedent` crate"
readme = "README.md"
autotests = false

[lints]
workspace = true

[features]
default = ["arrow"]
arrow = [
    "dep:arrow-array",
    "dep:arrow-schema",
    "dep:arrow-buffer",
    "arrow-array/ffi",
    "arrow-schema/ffi",
]
# File-backed table sources (module `file_source`). Off by default in this
# crate; the `antecedent` facade and the Python extension turn them on. Polars
# was refused and its empty feature retired: the record is
# parity/polars_decision/decision.toml.
parquet = ["arrow", "dep:parquet"]
ipc = ["arrow", "dep:arrow-ipc"]

[dependencies]
antecedent-core = { workspace = true }
antecedent-kernels = { workspace = true }
arrow-array = { workspace = true, optional = true }
arrow-schema = { workspace = true, optional = true }
arrow-buffer = { workspace = true, optional = true }
arrow-ipc = { workspace = true, optional = true }
# Snappy and zstd cover the codecs pyarrow, pandas, Polars and Spark write by default.
parquet = { workspace = true, optional = true, features = ["arrow", "snap", "zstd"] }
realfft = { workspace = true }
blake3 = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[[test]]
name = "suite_01"
path = "tests/suite_01.rs"

[[test]]
name = "file_source"
path = "tests/file_source.rs"
required-features = ["parquet", "ipc"]

[[test]]
name = "ipc_admission"
path = "tests/ipc_admission.rs"
required-features = ["ipc"]
