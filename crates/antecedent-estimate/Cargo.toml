[package]
name = "antecedent-estimate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Frequentist and Bayesian estimators for identified causal effects in the Antecedent engine; start with the `antecedent` crate"
readme = "README.md"
autotests = false

[lints]
workspace = true

[features]
default = []
ml-gbdt = ["antecedent-learn/ml-gbdt"]
ml-forest = ["antecedent-learn/ml-forest"]
ml-full = ["ml-gbdt", "ml-forest"]
ml-neural = ["antecedent-learn/ml-neural"]
# Exposes the closed interval estimators (`learned_continuous_interval_internal`,
# `mz_transport_bootstrap_interval` and its draw machinery, the Frequentist plug-in
# gradient band `ContinuousResponseEstimator::plugin_gradient_interval_internal`) to the
# calibration harness. Pass `--features calibration-internal` to compile it.
# No released build carries it.
calibration-internal = []

[dependencies]
antecedent-graph = { workspace = true }
antecedent-core = { workspace = true }
antecedent-data = { workspace = true }
antecedent-expr = { workspace = true }
antecedent-identify = { workspace = true }
antecedent-io-core = { workspace = true }
antecedent-kernels = { workspace = true }
antecedent-learn = { workspace = true }
antecedent-prob = { workspace = true }
antecedent-stats = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
antecedent-contract = { workspace = true }
antecedent-test-support = { workspace = true }
criterion = { workspace = true }
serde_json = { workspace = true }

[[test]]
name = "mz_transport_execution"
required-features = ["calibration-internal"]

[[test]]
name = "quadratic_dose_calibration"
required-features = ["calibration-internal"]

[[bench]]
name = "propensity_bootstrap"
harness = false

[[bench]]
name = "posterior_functional"
harness = false

[[bench]]
name = "temporal_mediation"
harness = false

[[bench]]
name = "response_interference"
harness = false

[[bench]]
name = "temporal_response"
harness = false

[[test]]
name = "adaptive_inference_calibration"
path = "tests/adaptive_inference_calibration.rs"
required-features = ["calibration-internal"]

[[test]]
name = "adaptive_procedure_prior_predictive_calibration"
path = "tests/adaptive_procedure_prior_predictive_calibration.rs"
required-features = ["calibration-internal"]

[[test]]
name = "bootstrap_effect_precision"
path = "tests/bootstrap_effect_precision.rs"

[[test]]
name = "cohort_linear_effect_calibration"
path = "tests/cohort_linear_effect_calibration.rs"
required-features = ["calibration-internal"]

[[test]]
name = "count_fitted_posterior_calibration"
path = "tests/count_fitted_posterior_calibration.rs"
required-features = ["calibration-internal"]

[[test]]
name = "counterfactual_transport_execution"
path = "tests/counterfactual_transport_execution.rs"

[[test]]
name = "counterfactual_transport_sampled"
path = "tests/counterfactual_transport_sampled.rs"

[[test]]
name = "counterfactual_transport_sampled_replicate"
path = "tests/counterfactual_transport_sampled_replicate.rs"

[[test]]
name = "coverage_determinism"
path = "tests/coverage_determinism.rs"

[[test]]
name = "joint_bayesian_transport_calibration"
path = "tests/joint_bayesian_transport_calibration.rs"

[[test]]
name = "learned_joint_calibration"
path = "tests/learned_joint_calibration.rs"

[[test]]
name = "mechanism_discrepancy_calibration"
path = "tests/mechanism_discrepancy_calibration.rs"

[[test]]
name = "mixed_source_execution"
path = "tests/mixed_source_execution.rs"

[[test]]
name = "nested_markov_fisher_calibration"
path = "tests/nested_markov_fisher_calibration.rs"

[[test]]
name = "recovery_whole_method_calibration"
path = "tests/recovery_whole_method_calibration.rs"

[[test]]
name = "scenario_covariance_calibration"
path = "tests/scenario_covariance_calibration.rs"

[[test]]
name = "temporal_unit_calibration"
path = "tests/temporal_unit_calibration.rs"

[[test]]
name = "treatment_inference_calibration"
path = "tests/treatment_inference_calibration.rs"

[[test]]
name = "suite_01"
path = "tests/suite_01.rs"

[[test]]
