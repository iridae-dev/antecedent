[package]
name = "antecedent-estimate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Frequentist and Bayesian estimators for identified causal effects in the Antecedent engine; start with the `antecedent` crate"
readme = "README.md"

[lints]
workspace = true

[features]
default = []
ml-gbdt = ["antecedent-learn/ml-gbdt"]
ml-forest = ["antecedent-learn/ml-forest"]
ml-full = ["ml-gbdt", "ml-forest"]
ml-neural = ["antecedent-learn/ml-neural"]
# Exposes the closed interval estimators (X4 `learned_continuous_interval_internal`, X1
# `mz_transport_bootstrap_interval` and its draw machinery, the Frequentist plug-in
# gradient band `ContinuousResponseEstimator::plugin_gradient_interval_internal`) to the
# calibration harness. Enabled only by dev-dependencies (resolver 2 keeps it out of normal
# builds); no released build carries it.
calibration-internal = []

[dependencies]
antecedent-graph = { version = "2.3.0", path = "../antecedent-graph" }
antecedent-core = { version = "2.3.0", path = "../antecedent-core" }
antecedent-data = { version = "2.3.0", path = "../antecedent-data" }
antecedent-expr = { version = "2.3.0", path = "../antecedent-expr" }
antecedent-identify = { version = "2.3.0", path = "../antecedent-identify" }
antecedent-kernels = { version = "2.3.0", path = "../antecedent-kernels" }
antecedent-learn = { version = "2.3.0", path = "../antecedent-learn" }
antecedent-prob = { version = "2.3.0", path = "../antecedent-prob" }
antecedent-stats = { version = "2.3.0", path = "../antecedent-stats" }
thiserror = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
# Self dev-dependency: the integration tests and benches measure the closed X1 mz bootstrap
# estimator (and X4's interval), compiled only under `calibration-internal`. Dev-dependencies
# never reach a normal or Python build (resolver 2).
antecedent-estimate = { path = ".", features = ["calibration-internal"] }
criterion = { workspace = true }
serde_json = { workspace = true }

[[bench]]
name = "propensity_bootstrap"
harness = false

[[bench]]
name = "posterior_functional"
harness = false

[[bench]]
name = "temporal_mediation"
harness = false

[[bench]]
name = "response_interference"
harness = false

[[bench]]
name = "temporal_response"
harness = false
