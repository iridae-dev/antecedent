[package]
name = "antecedent-design"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Experimental-design ranking (heuristic graph-channel entropy, unlock-list identification mass, Gram SE reduction, preposterior value of sample information) and decision utilities for the Antecedent engine; start with the `antecedent` crate"
readme = "README.md"

[lints]
workspace = true

[dependencies]
antecedent-core = { version = "2.4.0", path = "../antecedent-core" }
antecedent-contract = { version = "2.4.0", path = "../antecedent-contract" }
antecedent-graph = { version = "2.4.0", path = "../antecedent-graph" }
antecedent-identify = { version = "2.4.0", path = "../antecedent-identify" }
# The artifact layer below the estimators: design never depends on antecedent-estimate,
# antecedent-validate or the estimator-bound `antecedent-io`. Cross-layer tests that need
# a fitted result live in the `antecedent` crate.
antecedent-io-core = { version = "2.4.0", path = "../antecedent-io-core" }
antecedent-kernels = { version = "2.4.0", path = "../antecedent-kernels" }
antecedent-prob = { version = "2.4.0", path = "../antecedent-prob" }
antecedent-stats = { version = "2.4.0", path = "../antecedent-stats" }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ciborium = { workspace = true }

[dev-dependencies]
blake3 = { workspace = true }
antecedent-test-support = { path = "../antecedent-test-support" }
criterion = { workspace = true }
serde_json = { workspace = true }

[[bench]]
name = "design_rank"
harness = false
