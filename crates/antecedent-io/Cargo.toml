[package]
name = "antecedent-io"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Versioned artifact containers and wire types (graphs, posteriors, model bundles) for the Antecedent engine; start with the `antecedent` crate"
readme = "README.md"

[lints]
workspace = true

[features]
default = []
# Interval-bearing mz-transport artifact construction and its bit-for-bit
# recompute, for the calibration harness and lifecycle tests only. Pass
# `--features calibration-internal` to compile it. No released build carries it,
# so no public route yields or accepts an interval.
calibration-internal = ["antecedent-estimate/calibration-internal", "antecedent-learn/calibration-internal"]

# Hidden seams that seal and open artifact containers from raw parts, for the
# tamper and resealed-edit tests. Not part of the supported API; the crate's
# own tests and the facade tests enable it as a dev-dependency.
test-util = ["antecedent-io-core/test-util"]

[dependencies]
antecedent-core = { workspace = true }
antecedent-contract = { workspace = true }
antecedent-data = { workspace = true }
antecedent-discovery = { workspace = true }
antecedent-io-core = { workspace = true }
antecedent-estimate = { workspace = true }
antecedent-expr = { workspace = true }
antecedent-graph = { workspace = true }
antecedent-identify = { workspace = true }
antecedent-learn = { workspace = true }
antecedent-model = { workspace = true }
antecedent-prob = { workspace = true }
antecedent-stats = { workspace = true }
antecedent-validate = { workspace = true }
ciborium = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
antecedent-io = { path = ".", features = ["test-util"] }
antecedent-kernels = { workspace = true }
antecedent-test-support = { workspace = true }
blake3 = { workspace = true }
# The io interval tests recompute the closed mz bootstrap, compiled only under this feature.
antecedent-estimate = { workspace = true, features = ["calibration-internal"] }
