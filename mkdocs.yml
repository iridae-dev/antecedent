# Narrative docs for Read the Docs / local `mkdocs serve`.
# Python API: pdoc HTML merged into the RTD site at /python/ (see .readthedocs.yaml).
# Rust API: docs.rs/antecedent.
site_name: Antecedent
site_description: Identification-first causal inference for Python and Rust — from causal structure through estimation, interventions, and counterfactuals under structural uncertainty
site_url: https://antecedent.readthedocs.io/
repo_url: https://github.com/iridae-dev/antecedent
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
  palette:
    - scheme: default
      primary: blue grey
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      primary: blue grey
      toggle:
        icon: material/brightness-4
        name: Light mode

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight

nav:
  - Home: index.md
  - Understand Antecedent:
      - System model: system-model.md
      - The causal contract: causal-contract.md
      - A result is a claim: result-is-a-claim.md
      - Refusal and partial knowledge: refusal-and-partial-knowledge.md
      - Guarantees and support: guarantees.md
  - Start here:
      - Python quickstart: python-workflow.md
      - Rust quickstart: rust-quickstart.md
      - Examples: examples.md
      - Supported analyses: supported-analyses.md
  - Guides:
      - Causal responses: causal-responses.md
      - Local, distributional, and joint effects: local-distributional-joint.md
      - Transport and interference: transport-interference.md
      - Transport failures: guides/transport-failure.md
      - Transport theorem scope: guides/transport-scope.md
      - Prior bank: priors.md
  - Concepts:
      - Capabilities: capabilities.md
      - Observation contract: observation-contract.md
      - Comparison: comparison.md
      - Architecture: architecture.md
  - Reference:
      - Python API: python-api.md
      - Python workflow options: python-options.md
      - Support matrix: support-matrix.md
      - Artifacts: artifacts.md
      - API naming: api_naming.md
  - Evidence and development:
      - Development: development.md
      - Conformance: conformance/README.md
      - 2.0 learner audit: audits/2.0-learner-audit.md
      - 2.0 milestone audit: audits/2.0-milestone-audit.md
      - 2.0 transport UX: migrations/2.0-transport-day1.md
      - Hot paths: hot_paths.md
      - Security review: security_review.md
  - Release preparation:
      - "2.0.0 draft": release-notes/v2.0.0.md

plugins:
  - search

docs_dir: docs
exclude_docs: |
  /README.md
