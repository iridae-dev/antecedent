# Narrative docs for Read the Docs / local `mkdocs serve`.
# Python API: pdoc HTML merged into the RTD site at /python/ (see .readthedocs.yaml).
# Rust API: docs.rs/antecedent.
site_name: Antecedent
site_description: Documentation for identification-first causal inference in Python and Rust
site_url: https://antecedent.readthedocs.io/
repo_url: https://github.com/iridae-dev/antecedent
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - navigation.footer
  palette:
    - scheme: default
      primary: blue grey
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      primary: blue grey
      toggle:
        icon: material/brightness-4
        name: Light mode

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight

nav:
  - Home: index.md
  - Understand Antecedent:
      - System model: system-model.md
      - The causal contract: causal-contract.md
      - A result is a claim: result-is-a-claim.md
      - Refusal and partial knowledge: refusal-and-partial-knowledge.md
      - Guarantees and support: guarantees.md
  - Start here:
      - Python quickstart: python-workflow.md
      - Rust quickstart: rust-quickstart.md
      - Examples: examples.md
      - Supported analyses: supported-analyses.md
  - Guides:
      - Causal responses: causal-responses.md
      - Local, distributional, and joint effects: local-distributional-joint.md
      - Transport and interference: transport-interference.md
      - Transport failures: guides/transport-failure.md
      - Transport theorem scope: guides/transport-scope.md
      - Finite-action inverse outcome: guides/inverse-outcome.md
      - Matched case-control odds ratio: guides/matched-case-control.md
      - Descriptive raw-versus-adjusted comparison: guides/descriptive-comparison.md
      - Tier-aware overlap and E-value diagnostics: guides/tier-diagnostics.md
      - Sparse ingest evaluation: guides/sparse-ingest-evaluation.md
      - Penalized propensity for AIPW: guides/penalized-aipw.md
      - Joint cells and derived treatments: guides/joint-cells.md
      - Clustered DML and entity-owned screens: guides/clustered-dml.md
      - Preflight diagnostics and cost: guides/preflight-diagnostics.md
      - Configured batches and batch retarget: guides/batch-retarget.md
      - Cross-fitted DML scores and retarget covariance: guides/dml-scores.md
      - Transport names moved in 2.0: migrations/2.0-transport-day1.md
      - Prior bank: priors.md
      - Graph uncertainty: graph_uncertainty.md
  - Design-family studies:
      - Survival outcomes: survival-outcomes.md
      - Staggered-adoption event study: quasi-event-study.md
      - Fuzzy RD and regression kink: quasi-rd-kink.md
      - Synthetic control: quasi-synthetic-control.md
      - Synthetic DiD and augmented panel DiD: quasi-synthetic-augmentation.md
      - Sequential g-formula: longitudinal-gformula.md
      - Sequential doubly robust regimes: longitudinal-doubly-robust.md
      - Continuous dose response: continuous-dose-response.md
      - Doubly robust policy evaluation: doubly-robust-policy-evaluation.md
      - DR-Learner pointwise CATE: dr-pointwise-cate.md
      - Observational network exposure: observational-network-exposure.md
      - Saturation interference: saturation-interference.md
  - 2.3 guide:
      - The 2.3 lifecycle: 2_3-lifecycle.md
      - Quantities: 2_3-quantities.md
      - External scientific objects: 2_3-external-science.md
      - Joint distributions: 2_3-joint-distributions.md
      - Decisions: 2_3-decisions.md
      - Decisions, design, repair and estimator breadth: 2_3-decisions-breadth.md
      - Design ranking: 2_3-design-ranking.md
      - Sensitivity and robustness: 2_3-sensitivity-and-robustness.md
      - Transport and counterfactuals: 2_3-transport-counterfactuals.md
      - Population, time and uncertainty: 2_3-population-time-uncertainty.md
      - Composition and bundles: 2_3-composition.md
      - Producer and consumer matrix: 2_3-producer-consumer-matrix.md
