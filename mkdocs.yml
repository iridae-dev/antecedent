# Narrative docs for Read the Docs / local `mkdocs serve`.
# Python API: pdoc HTML merged into the RTD site at /python/ (see .readthedocs.yaml).
# Rust API: docs.rs/antecedent.
site_name: Antecedent
site_description: Identification-first causal inference for Python and Rust — from causal structure through estimation, interventions, and counterfactuals under structural uncertainty
site_url: https://antecedent.readthedocs.io/
repo_url: https://github.com/iridae-dev/antecedent
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: blue grey
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      primary: blue grey
      toggle:
        icon: material/brightness-4
        name: Light mode

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences

nav:
  - Home: index.md
  - Capabilities: capabilities.md
  - Causal responses: causal-responses.md
  - Transport and interference: transport-interference.md
  - Comparison: comparison.md
  - Release notes:
      - "0.5.2": release-notes/v0.5.2.md
      - "0.5.1": release-notes/v0.5.1.md
      - "0.5.0": release-notes/v0.5.0.md
      - "0.4.0": release-notes/v0.4.0.md
  - Python API: python-api.md
  - Architecture: architecture.md
  - Development: development.md
  - API naming: api_naming.md
  - Artifacts: artifacts.md
  - Prior bank: priors.md
  - Hot paths: hot_paths.md
  - Security review: security_review.md
  - Conformance: conformance/README.md

plugins:
  - search

docs_dir: docs
