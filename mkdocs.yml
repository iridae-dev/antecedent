site_name: Antecedent
site_description: Antecedent, a compiler and runtime for causal science, in Python and Rust
site_url: https://antecedent.readthedocs.io/
repo_url: https://github.com/iridae-dev/antecedent
edit_uri: edit/main/docs/
theme:
  name: material
  custom_dir: docs-theme
  features:
  - content.code.copy
  - navigation.sections
  - navigation.top
  - navigation.footer
  - navigation.indexes
  - navigation.tabs
  - search.suggest
  - search.highlight
  palette:
  - scheme: default
    primary: blue grey
    toggle:
      icon: material/brightness-7
      name: Dark mode
  - scheme: slate
    primary: blue grey
    toggle:
      icon: material/brightness-4
      name: Light mode
markdown_extensions:
- admonition
- tables
- toc:
    permalink: true
- pymdownx.superfences
- pymdownx.highlight
