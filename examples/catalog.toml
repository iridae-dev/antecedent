runtime = "up to 1 min"
claim = "Model-conditional contrast of a whole program over its baseline, checked against the declared mechanism (terminal-week effect 4); uncertainty comes from draws every world shares. Per-period randomization does not by itself identify a held-out whole-program effect. Read result.inspect().calibration for interval calibration status."

[[example]]
id = "beyond_marketing_mix"
title = "Take a marketing mix analysis into evidence, decisions and the next study"
summary = "Fit a three-channel geographic panel, compare spending programs, incorporate experimental evidence and value another study for the resulting decision."
