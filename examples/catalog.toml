notebook = "examples/notebooks/synthetic_users_launch.ipynb"
topic = "Tutorials"
level = "advanced"
dependencies = []
runtime = "about 2 seconds locally; allow up to 1 min"
claim = "Synthetic checkout microtasks: 32 new humans plus a declared transferred prior support the same launch action as a 128-person human-only comparator; conflicting evidence instead selects an eight-person randomized authentication study. Application code supplies the finite probability model, Bayesian checkpoint updates and stopping policy. Antecedent composes priors, checks mechanism transport and identification repair, evaluates contracts and ranks externally attested study signals. Decision agreement does not imply equal precision or agent-human equivalence."

