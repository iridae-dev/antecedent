# One catalog for repository and published documentation. Runtime is a planning
# estimate after installation, not a performance claim. Datasets are simulated with
# declared mechanisms unless an entry says otherwise.

[[example]]
id = "feedback_three_questions"
title = "Compare an observation, a clamp and a shock"
summary = "Ask three different questions of one feedback loop, then keep an intervention with no unique solution as failed mass."
python = "examples/python/feedback_three_questions.py"
rust = "examples/rust/feedback_three_questions.rs"
unreleased = true
topic = "Tutorials"
level = "intermediate"
dependencies = []
runtime = "up to 1 min"
claim = "Exact Gaussian equilibrium answers of the stated model (observation 0.776, clamp 0.5, shock 0.625); no data are simulated, so these are fixture truths of the equations, not claims about a real system. The unsolvable intervention is reported as retained failed mass rather than an answer."

[[example]]
id = "joint_intervention_program"
title = "Compare a coordinated program with its baseline"
summary = "Set two channels for a 24-week horizon on a simulated panel, read the joint contrast and its shared uncertainty, and ask what the assignment design establishes."
python = "examples/python/joint_intervention_program.py"
unreleased = true
topic = "Tutorials"
level = "advanced"
dependencies = []
runtime = "up to 1 min"
claim = "Model-conditional contrast of a whole program over its baseline, checked against the declared mechanism (terminal-week effect 4); uncertainty comes from draws every world shares. Per-period randomization does not by itself identify a held-out whole-program effect. Read result.inspect().calibration for interval calibration status."

[[example]]
