# One catalog for repository and published documentation. Runtime is a planning
# estimate after installation, not a performance claim. Datasets are simulated with
# declared mechanisms unless an entry says otherwise.

[[example]]
id = "feedback_three_questions"
title = "Compare an observation, a clamp and a shock"
summary = "Ask three different questions of one feedback loop, then keep an intervention with no unique solution as failed mass."
python = "examples/python/feedback_three_questions.py"
notebook = "examples/notebooks/feedback_three_questions.ipynb"
rust = "examples/rust/feedback_three_questions.rs"
topic = "Tutorials"
level = "intermediate"
dependencies = []
runtime = "up to 1 min"
claim = "Exact Gaussian equilibrium answers of the stated model (observation 0.776, clamp 0.5, shock 0.625); no data are simulated, so these are fixture truths of the equations, not claims about a real system. The unsolvable intervention is reported as retained failed mass rather than an answer."

[[example]]
