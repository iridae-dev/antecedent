notebook = "examples/notebooks/beyond_marketing_mix.ipynb"
topic = "Tutorials"
level = "advanced"
dependencies = []
runtime = "about 20 seconds locally; allow up to 1 min"
claim = "Synthetic terminal-week revenue contrast over a 24-week program; one Bayesian fit with shared draws, finite candidate comparison, mapped Gaussian experimental summaries, expected contribution utility and information value. Geographic variation is in intercepts. The observational fit supplies no whole-program identification proof; current decision use refuses withdrawn experiment evidence while the original panel fit replays historically."

[[example]]
id = "synthetic_users_launch"
title = "Use synthetic users to design a small human launch test"
summary = "Combine historical humans, agent sessions and a sequential human pilot; compare the launch choice with a larger human-only study, and select a targeted experiment when transfer fails."
