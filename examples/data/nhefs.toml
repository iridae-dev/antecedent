# Manifest for the NHEFS smoking-cessation subset used in Hernán and Robins,
# "Causal Inference: What If". Antecedent does not redistribute this file: it
# downloads it on request and verifies it against the SHA-256 recorded here.

[dataset]
id = "nhefs"
title = "NHANES I Epidemiologic Follow-up Study (NHEFS) smoking-cessation subset"
description = """\
Cigarette smokers aged 25 to 74 who had a baseline examination in the first National Health \
and Nutrition Examination Survey (1971-75) and a follow-up interview in 1982. The subset \
records whether each person quit smoking between the two visits, their weight at both, and \
baseline characteristics. It is the teaching data set of the book cited below."""
origin = "https://miguelhernan.org/whatifbook"
curator = "Miguel A. Hernán and James M. Robins (book companion site); underlying survey by the National Center for Health Statistics and the National Institute on Aging"
survey = "https://wwwn.cdc.gov/nchs/nhanes/nhefs/"
citation = [
  "Hernán, M. A. and Robins, J. M. (2020). Causal Inference: What If. Boca Raton: Chapman & Hall/CRC.",
]
# The companion site offers the data for free download and states no licence.
licence = "not stated by the publisher"
licence_note = "The book's companion site offers the data for free download and states no licence. Antecedent fetches the file from that site on request and does not redistribute it."
version = "file as served by the publisher; the SHA-256 below identifies the exact bytes this example was written against"
retrieved = "2026-10-27"

[[file]]
name = "nhefs.csv"
role = "one row per person, comma separated, with a header row"
url = "https://miguelhernan.org/s/nhefs.csv"
rows = 1629
columns = 64
sha256 = "6726827bfcebf7324d786211a517d0515532c2405cc71c5a1fab68d7116ea16c"

[columns_used]
qsmk = "1 if the person quit smoking between the 1971 baseline and the 1982 follow-up (treatment)"
wt82_71 = "weight in 1982 minus weight in 1971, kilograms (outcome); empty when the 1982 weight is missing"
sex = "0 male, 1 female"
race = "0 white, 1 other"
age = "age in 1971, years"
education = "education in 1971, five ordered categories (1 to 5)"
smokeintensity = "cigarettes per day in 1971"
smokeyrs = "years of smoking by 1971"
exercise = "recreational exercise in 1971: 0 much, 1 moderate, 2 little or none"
active = "activity in daily life in 1971: 0 very active, 1 moderately active, 2 inactive"
wt71 = "weight in 1971, kilograms"

[preprocessing]
steps = [
  "Parse the CSV header and read the eleven columns above as numbers.",
  "Keep the 1,566 rows with a recorded 1982 weight (wt82_71 present); 63 rows are excluded.",
  "Add squared terms for age, smokeintensity, smokeyrs and wt71, and indicator columns for the levels of education, exercise and active, as the book's models do.",
  "No other rows are dropped, imputed or transformed.",
]

[standin]
description = "A synthetic table with the same columns and size, generated by examples/python/observational_study.py with a fixed seed. Its average effect of quitting is a stated fixture truth of that generator, not an empirical quantity."
