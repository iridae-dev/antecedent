# Manifest for the National Supported Work (NSW) job-training data in the
# Dehejia-Wahba subsample, with the PSID comparison group built by Lalonde.
# Antecedent does not redistribute these files: it downloads them on request
# and verifies each against the SHA-256 recorded here.

[dataset]
id = "nsw_psid"
title = "National Supported Work demonstration (Dehejia-Wahba subsample) with a PSID comparison group"
description = """\
Male participants in the National Supported Work (NSW) demonstration, a randomised \
job-training programme run in the United States in the mid-1970s. The treated and \
control files are the experimental sample; the PSID file is a non-experimental \
comparison group drawn from the Panel Study of Income Dynamics."""
origin = "https://users.nber.org/~rdehejia/data/.nswdata2.html"
curator = "Rajeev Dehejia (data page hosted at the National Bureau of Economic Research)"
citation = [
  "LaLonde, R. J. (1986). Evaluating the Econometric Evaluations of Training Programs with Experimental Data. American Economic Review 76(4), 604-620.",
  "Dehejia, R. H. and Wahba, S. (1999). Causal Effects in Nonexperimental Studies: Reevaluating the Evaluation of Training Programs. Journal of the American Statistical Association 94(448), 1053-1062.",
  "Dehejia, R. H. and Wahba, S. (2002). Propensity Score-Matching Methods for Nonexperimental Causal Studies. Review of Economics and Statistics 84(1), 151-161.",
]
# The origin page states no licence. It records that Robert Lalonde allowed the
# authors to use the data. Redistribution terms are therefore unstated, and no
# copy is shipped in this repository.
licence = "not stated by the publisher"
licence_note = "The origin page credits LaLonde's permission to use the data and states no licence. Antecedent fetches the files from the publisher on request and does not redistribute them."
version = "files as served by the publisher; the SHA-256 values below identify the exact bytes this example was written against"
retrieved = ""   # coordinator: record the retrieval date (YYYY-MM-DD) when filling the checksums

# Each file is plain text, whitespace separated, no header, one row per person.
# Columns, in order (the page lists the last column as the outcome and the rest as pre-programme).
columns = ["treat", "age", "educ", "black", "hisp", "married", "nodegree", "re74", "re75", "re78"]

[columns_description]
treat = "1 if assigned to the NSW programme (experimental files) or constructed as the treated group; 0 otherwise"
age = "age in years"
educ = "years of schooling"
black = "1 if Black"
hisp = "1 if Hispanic"
married = "1 if married"
nodegree = "1 if no high-school degree"
re74 = "real earnings in 1974, US dollars (pre-programme)"
re75 = "real earnings in 1975, US dollars (pre-programme)"
re78 = "real earnings in 1978, US dollars (outcome, after the programme)"

# sha256 = "" means the checksum has not been recorded yet: fetch.py then
# refuses to treat the file as verified and the example uses its stand-in.
[[file]]
name = "nswre74_treated.txt"
role = "experimental treated group"
url = "https://users.nber.org/~rdehejia/data/nswre74_treated.txt"
rows = 185
sha256 = ""

[[file]]
name = "nswre74_control.txt"
role = "experimental control group"
url = "https://users.nber.org/~rdehejia/data/nswre74_control.txt"
rows = 260
sha256 = ""

[[file]]
name = "psid_controls.txt"
role = "non-experimental comparison group (PSID-1)"
url = "https://users.nber.org/~rdehejia/data/psid_controls.txt"
rows = 2490
sha256 = ""

[preprocessing]
steps = [
  "Each file is parsed as whitespace-separated numbers with the ten columns above; a file with a different column count or row count is rejected.",
  "Experimental benchmark sample: nswre74_treated.txt stacked with nswre74_control.txt (445 rows).",
  "Observational sample: nswre74_treated.txt stacked with psid_controls.txt (2675 rows). The experimental control group is discarded, as in the classic comparison.",
  "No rows are dropped, imputed or transformed. Earnings stay in dollars.",
]

[standin]
description = "A synthetic table with the same ten columns and sizes, generated by examples/python/observational_study.py with a fixed seed. Its treatment effect is a stated fixture truth of that generator, not an empirical quantity."
