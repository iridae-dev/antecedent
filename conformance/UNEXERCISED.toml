# Recorded-but-unexercised conformance fixtures.
#
# Every fixture directory under conformance/ must be loaded by an executing
# test, or declared here. This file is the machine-readable form of "we froze
# an oracle for work that has not shipped yet" — a legitimate practice that
# went wrong when three pinned-baseline general-ID fixtures sat unexercised while
# provenance, parity pointers, and generated docs all described the comparison
# in the present tense.
#
# Enforced by scripts/gate_evidence_reachability.sh, in both directions:
#   - an orphaned fixture not listed here fails the gate;
#   - a fixture listed here that a test starts loading fails the gate until the
#     entry is removed (the list may only shrink toward zero).
#
# A fixture listed here must not be cited as active evidence anywhere:
# no `closed` oracle-closure row may point at it, and any provenance or parity
# citation must carry the word "unexercised" or "recorded".
#
# Fields: `dir` (fixture directory), `reason` (why no test loads it),
# `blocked_on` (what has to ship before a consumer can exist).

# Empty by design. New fixtures must gain an executing consumer in the same
# change; temporarily recorded oracles belong here only while their blocker is
# concrete and current.
