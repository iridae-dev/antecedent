    "zoo": {
      "Package": "zoo",
      "Version": "1.9-1",
      "Source": "Repository",
      "License": "GPL-2 | GPL-3",
      "Depends": [
        "R (>= 3.1.0)",
        "stats"
      ],
      "Imports": [
        "utils",
        "graphics",
        "grDevices",
        "lattice (>= 0.20-27)"
      ],
      "Repository": "CRAN"
