# Identity sites: every place a collection is canonicalized into an identity, with its
# classification and the checks on production code that cover it.
#
# Read and checked by scripts/identity_sites.py and bound by the assurance record
# `identity.static_graph_and_law_identities`. A site is `checked` when at least one check
# runs on the production function: `adversarial:<case id>` (parity/adversarial_campaign.toml),
# `kani:<harness>` (formal/kani) or `assurance:<record id>` (parity/assurance_records.toml).
# A `listed` site has no generated check yet; its `reason` says why.
#
# Collection classes: `ordered` (order is meaning, written as given), `set` (sorted and
# deduplicated, or duplicates refused before encoding), `multiset` (sorted, repeats kept).
# `concern` records where the class looks wrong for the meaning, or framing is not injective.

