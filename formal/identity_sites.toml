released = true
status = "checked"
checks = ["unit:crates/antecedent/src/planner/statistical.rs::site_statistical_models_and_their_inputs_are_ordered", "unit:crates/antecedent/src/planner/statistical.rs::site_statistical_realization_and_plans_are_tagged", "unit:crates/antecedent/src/planner/statistical.rs::site_statistical_operators_are_bound_by_content_in_order", "unit:crates/antecedent/src/planner/statistical.rs::site_statistical_lowered_layer_digest_keeps_the_released_layout", "adversarial:identity_sites.facade.planner.model_slot_order", "adversarial:identity_sites.facade.planner2.operator_content", "adversarial:identity_sites.facade.planner2.released_layer_layout"]
note = "Realizations are tagged texts (checked realizations by their own identity). Folds, resampling and posterior after presence words; the design writes its column count and width source, never rows. Versioned: identity() is antecedent.lowered_program.statistical.v3 and binds every operator's content; lowered_layer_digest() keeps the released v2 bytes (operator count only), which every lowered program identity binds, so no stored program identity changes and no reader needs to accept two encodings. The v2 bytes lose nothing at the lowered level: every route builds its statistical operators as a fixed list of its program cell (none, a literal list, linear_gaussian_program_operators, temporal_program_operators, or static_response program_operators(cell.intervenes)), and the lowered identity binds the cell. Independent recomputations of the v2 bytes exist in antecedent-core (mnar_fixed_shift program identity, categorical_candidate_contract::program_identity) and are re-checked against compiled programs, which is why the lowered composition keeps v2."
