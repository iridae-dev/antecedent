note = "covariates: repeats kept: a repeated declaration stays apart from the deduplicated one. The estimators that read this list refuse a repeat (Bayesian g-computation 'distinct modifiers', ADMG conditional 'unique', front-door unique mediators) or read it as given, so a multiset identity never aliases a refused declaration to an accepted one; a set identity would. The kernel center/scale lists align with the declared covariate order while covariates are written sorted; the declaration identity (the `identity` field, antecedent.weighted_target.v1) binds covariates in declared order with centers and scales, so no two produced targets collide."
