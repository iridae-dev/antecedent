class = "multiset"
canonical = "encode_variable_set"
concern = "Set meaning; validate checks only non-empty and the floor, so duplicates split identity. If kernel center_bits/scale_bits are positionally aligned to covariates (not verified), permuting covariates changes their meaning while the sorted covariate bytes stay equal."

