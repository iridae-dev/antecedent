# Standing sites: every place a claim's standing is set, transformed, composed, carried or
# restored, with the checks on production code that cover it.
#
# Read and checked by scripts/standing_sites.py (run by scripts/assurance.py check) and
# bound by the assurance record `claim_standing.never_raised`. Standing is the claim's kind,
# identification status, domain statuses, support status, provider trust, calibration
# standing, revalidation class and unresolved obligations (`facets`). `action` says what the
# site does to them: `set` (decides a facet from evidence), `transform` (maps one vocabulary
# onto another), `compose` (combines several claims or steps), `carry` (passes a facet on),
# `restore` (rebuilds it from bytes) or `check` (refuses a departure).
#
# A site is `checked` when at least one check runs on the production function:
# `aeneas:<theorem>` (a Lean theorem about its Charon/Aeneas translation, formal/rust),
# `kani:<harness>` (formal/kani), `adversarial:<case id>` (parity/adversarial_campaign.toml),
# `assurance:<record id>` (parity/assurance_records.toml) or `unit:<file>::<test fn>`. A
# `listed` site has no check and its `reason` says why. `released` is whether the function
# existed at v3.0.0. `concern` records where the site's standing looks weaker than its
# evidence, or one rule is restated differently elsewhere; `note` records a fix.
#
# Compiled routes state the claim kind their program demands (a ClaimDemand); those sites
# (`facade.demand.*`) are found by their construction and listed together: the published
# claim's kind is re-derived at seal, never read from the demand.

