  (package(=antecedent-model) and kind(lib) and test(/^(?:evaluate::tests::evaluation_runs_on_linear_scm|falsify::tests::a_graph_claiming_false_independencies_is_rejected|registry::tests::auto_assign_linear_chain)$/)) or
  (package(=antecedent-model) and binary(=mechanism_selection) and test(/^(?:with_providers::a_tree_ensemble_recovers_a_quadratic_mechanism|with_providers::a_tree_ensemble_recovers_an_interaction_mechanism|with_providers::time_ordered_splits_remove_the_inflation_that_serial_dependence_causes)$/)) or
  (package(=antecedent-model) and binary(=scm_oracle) and test(/^(?:discrete_and_hierarchical_glm_match_their_independent_oracles|do_samplers_calibrate_to_analytic_linear_gaussian_target)$/)) or
  (package(=antecedent-prob) and binary(=mcmc_arviz_oracle) and test(/^(?:full_pair_diagnostics_match_the_high_precision_primary_equations|rank_rhat_and_compatible_ess_cases_match_pinned_arviz_chains)$/)) or
  (package(=antecedent-prob) and binary(=prior_support_oracle) and test(=coefficient_effect_variance_and_inverse_gamma_support_matches_oracle)) or
