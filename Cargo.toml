[workspace]
resolver = "2"
members = [
    "crates/antecedent-core",
    "crates/antecedent-contract",
    "crates/antecedent-kernels",
    "crates/antecedent-data",
    "crates/antecedent-graph",
    "crates/antecedent-io-core",
    "crates/antecedent-io",
    "crates/antecedent-expr",
    "crates/antecedent-identify",
    "crates/antecedent-stats",
    "crates/antecedent-learn",
    "crates/antecedent-learn-burn",
    "crates/antecedent-prob",
    "crates/antecedent-estimate",
    "crates/antecedent-validate",
    "crates/antecedent-model",
    "crates/antecedent-counterfactual",
    "crates/antecedent-attribution",
    "crates/antecedent-design",
    "crates/antecedent-state",
    "crates/antecedent",
    "crates/antecedent-discovery",
    "crates/antecedent-test-support",
    "python",
]
default-members = [
    "crates/antecedent-core",
    "crates/antecedent-contract",
    "crates/antecedent-kernels",
    "crates/antecedent-data",
    "crates/antecedent-graph",
    "crates/antecedent-io-core",
    "crates/antecedent-io",
    "crates/antecedent-expr",
    "crates/antecedent-identify",
    "crates/antecedent-stats",
    "crates/antecedent-learn",
    "crates/antecedent-prob",
    "crates/antecedent-estimate",
    "crates/antecedent-validate",
    "crates/antecedent-model",
    "crates/antecedent-counterfactual",
    "crates/antecedent-attribution",
    "crates/antecedent-design",
    "crates/antecedent-state",
    "crates/antecedent",
    "crates/antecedent-discovery",
    "crates/antecedent-test-support",
]

[workspace.package]
version = "2.4.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/iridae-dev/antecedent"
homepage = "https://github.com/iridae-dev/antecedent"
documentation = "https://docs.rs/antecedent"
authors = ["Antecedent Contributors"]
keywords = ["causal", "inference", "statistics", "bayesian", "graphs"]
categories = ["science", "mathematics"]

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
ciborium = "0.2"
blake3 = "1"
zstd = "0.13"
memmap2 = "0.9"
faer = { version = "0.24", default-features = false, features = ["std", "linalg", "rayon"] }
arrow-array = { version = "54", default-features = false }
arrow-schema = { version = "54", default-features = false }
arrow-buffer = { version = "54", default-features = false }
pyo3 = { version = "0.29", features = ["extension-module", "multiple-pymethods"] }
pyo3-build-config = "0.29"
numpy = { version = "0.29", default-features = false }
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
realfft = "3.5"
forust-ml = "0.5"
smartcore = { version = "0.4", default-features = false, features = ["serde"] }
burn = { version = "0.16", default-features = false, features = ["std", "autodiff", "ndarray"] }

antecedent = { version = "2.4.0", path = "crates/antecedent" }
antecedent-attribution = { version = "2.4.0", path = "crates/antecedent-attribution" }
antecedent-contract = { version = "2.4.0", path = "crates/antecedent-contract" }
antecedent-core = { version = "2.4.0", path = "crates/antecedent-core" }
antecedent-counterfactual = { version = "2.4.0", path = "crates/antecedent-counterfactual" }
antecedent-data = { version = "2.4.0", path = "crates/antecedent-data" }
antecedent-design = { version = "2.4.0", path = "crates/antecedent-design" }
antecedent-discovery = { version = "2.4.0", path = "crates/antecedent-discovery" }
antecedent-estimate = { version = "2.4.0", path = "crates/antecedent-estimate" }
antecedent-expr = { version = "2.4.0", path = "crates/antecedent-expr" }
antecedent-graph = { version = "2.4.0", path = "crates/antecedent-graph" }
antecedent-identify = { version = "2.4.0", path = "crates/antecedent-identify" }
antecedent-io = { version = "2.4.0", path = "crates/antecedent-io" }
antecedent-io-core = { version = "2.4.0", path = "crates/antecedent-io-core" }
antecedent-kernels = { version = "2.4.0", path = "crates/antecedent-kernels" }
antecedent-learn = { version = "2.4.0", path = "crates/antecedent-learn" }
antecedent-learn-burn = { version = "2.4.0", path = "crates/antecedent-learn-burn" }
antecedent-model = { version = "2.4.0", path = "crates/antecedent-model" }
antecedent-prob = { version = "2.4.0", path = "crates/antecedent-prob" }
antecedent-state = { version = "2.4.0", path = "crates/antecedent-state" }
antecedent-stats = { version = "2.4.0", path = "crates/antecedent-stats" }
antecedent-test-support = { path = "crates/antecedent-test-support" }
antecedent-validate = { version = "2.4.0", path = "crates/antecedent-validate" }

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Pin suites use a tail `assert_boundary_at(...)` expression. Editing those
# files would owe a remesure.
semicolon_if_nothing_returned = "allow"
# Numerical code converts counts and indices to f64 and names matrix/vector
# quantities by short algebraic symbols (a, b, x, y, n, k); these three pedantic
# lints fire on that idiom, not on defects, so they are allowed once here rather
# than per file. The lints that can hide a real defect (`cast_possible_truncation`,
# `cast_sign_loss`, `float_cmp`) stay warned and are allowed only where a reason
# is written.
cast_precision_loss = "allow"
many_single_char_names = "allow"
similar_names = "allow"

# Numerical kernels stay optimized in `cargo test` debug builds. Library crates
# that change in the 1.x working loop stay at opt-level 0 so incremental
# compiles stay cheap. Line tables keep panic locations without full debuginfo.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

# Test binaries carry no debug info: panic locations come from `#[track_caller]`, not from
# the debug sections, and each binary links the crate under test.
[profile.test]
debug = false

[profile.dev.package.faer]
opt-level = 2

[profile.dev.package.antecedent-stats]
opt-level = 2

[profile.dev.package.antecedent-kernels]
opt-level = 2

[profile.dev.package.antecedent-estimate]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
lto = "thin"
codegen-units = 1

# Generated const-data and orchestration crates gain nothing from single-unit
# codegen (no numeric hot path); parallelize their codegen. Measured release
# builds: antecedent-io 2m01s -> 36s, antecedent 1m12s -> 17s. The numeric hot
# crates (faer, antecedent-stats/kernels/estimate) keep codegen-units = 1.
[profile.release.package.antecedent-io]
codegen-units = 256

[profile.release.package.antecedent]
codegen-units = 16

# PyO3 binding code delegates numerical work to the estimator/statistics crates.
# Parallel codegen keeps repeated native-bridge rebuilds practical without
# changing the single-unit compilation of those numerical kernels.
[profile.release.package.antecedent-py]
codegen-units = 16
