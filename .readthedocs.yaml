# Read the Docs — MkDocs narrative + pdoc Python API under /python/.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    post_create_environment:
      - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.85
    post_install:
      - PATH="$HOME/.cargo/bin:$PATH" python -m pip install ./python
    post_build:
      # RTD runs YAML `|` blocks with /bin/sh (no pipefail). Use bash explicitly.
      - bash scripts/rtd_build_python_api.sh

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: false

python:
  install:
    - requirements: requirements-docs.txt
